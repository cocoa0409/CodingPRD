# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1818: Investment Policy Statement & Portfolio Rebalancing
# Breadth walk of §1.1–§1.7 per references/claim-extraction-guide.md.
# §1.8-covered corners appear as excluded_because stubs.
# Logical clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: client_create_required_fields_defaults_and_initial_state
        claim_type: creation
        grounds: [entities.Client, state_machines.Client]
        distinguishing_aspect: "POST /advisory/clients with both required fields yields 201, status PROSPECT, version 1, server-minted UUID id; omitting full_name yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/clients", payload: { risk_tolerance_score: 50 }, as: Advisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/clients", payload: { full_name: "New Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c_id: $.data.id, c_status: $.data.status, c_version: $.data.version } }
          assert:
            - "first call: http 400 ERR_INVALID_REQUEST (missing required full_name)"
            - "second call: http 201; status == PROSPECT (initial state); version == 1; id is a hyphenated UUID with no type prefix; created_at/updated_at present"
      - name: client_create_system_field_injection_rejected
        claim_type: system_fields
        grounds:
           - "entities.Client"
           - "validations[priority=4]"
        distinguishing_aspect: "Client-supplied system fields (status, version, id, created_at) in a create payload are unknown fields and rejected with 400, not silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/clients", payload: { full_name: "Inject", risk_tolerance_score: 50, status: "ACTIVE" }, as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "http 400 ERR_INVALID_REQUEST; no client persisted (a following GET /advisory/clients returns total_count 0)"
      - name: benchmark_unique_name_and_default_description
        claim_type: type_constraints
        grounds: [entities.Benchmark.fields.name, entities.Benchmark.fields.description]
        distinguishing_aspect: "Duplicate benchmark name (exact match) is rejected 400; omitted description defaults to empty string."
        test_recipe:
          setup: ["benchmark 'Core Blend' exists"]
          setup_api_calls:
            - { call: "POST /advisory/benchmarks", payload: { name: "Core Blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /advisory/benchmarks", payload: { name: "Core Blend" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /advisory/benchmarks", payload: { status: ACTIVE }, as: ComplianceOfficer, captures: { desc: "$.data[0].description" } }
          assert:
            - "duplicate create: http 400 ERR_INVALID_REQUEST"
            - "Benchmark.${b}.description == '' (default applied)"
      - name: ips_default_cadence_and_risk_range
        claim_type: defaults
        grounds: [entities.InvestmentPolicyStatement.fields.review_cadence_months, entities.InvestmentPolicyStatement.fields.risk_tolerance_score]
        distinguishing_aspect: "Omitting review_cadence_months applies the default 12; risk_tolerance_score 0 or 101 is rejected 400 at create."
        test_recipe:
          setup: ["ACTIVE client; ACTIVE benchmark"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Def Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 0 }, as: Advisor, captures: { err0: $.data.error_id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 101 }, as: Advisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { cad: $.data.review_cadence_months } }
          assert:
            - "risk 0 and risk 101 both rejected http 400 ERR_INVALID_REQUEST"
            - "valid create: review_cadence_months == 12 (default), status == DRAFT, supersedes_ips_id == null, activated_at == null"
      - name: position_computed_fields_at_create_and_injection_rejected
        claim_type: computed_fields
        grounds: [entities.Position.fields.market_value_cents, entities.Position.fields.unrealized_gain_cents, calculations.portfolio_valuation]
        distinguishing_aspect: "market_value_cents (qty x price) and unrealized_gain_cents are computed at creation; a client-supplied market_value_cents is rejected as an unknown field."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS (single target US_EQUITY 100.00/50.00); ACTIVE TAXABLE portfolio; security EQA @ 1000"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Comp Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 10, opening_cost_basis_cents: 7000, market_value_cents: 1 }, as: Advisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 10, opening_cost_basis_cents: 7000 }, as: Advisor, captures: { mv: $.data.market_value_cents, ug: $.data.unrealized_gain_cents } }
          assert:
            - "injection attempt: http 400 ERR_INVALID_REQUEST (market_value_cents is computed, not accepted)"
            - "created position: market_value_cents == 10000 (10 x 1000), unrealized_gain_cents == 3000, cost_basis_cents == 7000"
      - name: cashflow_event_immutability_common_fields_false
        claim_type: immutability
        grounds:
          - "entities.CashFlowEvent"
        distinguishing_aspect: "CashFlowEvent (common_fields: false) carries id + created_at but no version/updated_at; §1.5 declares no create/update/delete route for it — events arise only as side effects and are read-only."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS (CASH 100/50); ACTIVE portfolio with one deposit of 100000"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Ev Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor, captures: { ev: $.data.id } }
          trigger:
            - { call: "GET /advisory/cash-flow-events/${ev}", as: Advisor, captures: { amt: $.data.amount_cents, bal: $.data.balance_after_cents, vb: $.data.valuation_before_cents } }
          assert:
            - "event fields: kind == MANUAL_DEPOSIT, amount_cents == 100000, balance_after_cents == 100000, valuation_before_cents == 0, source_type == MANUAL, source_id == null"
            - "event JSON contains id and created_at but NO version and NO updated_at key (common_fields: false)"
            - "no POST/PUT/PATCH/DELETE route for /advisory/cash-flow-events exists in §1.5 (append-only by construction)"
      - name: restricted_entry_status_derived_from_clock
        claim_type: computed_fields
        grounds: [entities.RestrictedListEntry.fields.status]
        distinguishing_aspect: "status is clock-derived: SCHEDULED before effective_from, ACTIVE in [from, to), EXPIRED at exactly effective_to (end exclusive)."
        test_recipe:
          setup: ["security EQR; entry window [2026-08-05T00:00:00Z, 2026-08-10T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /advisory/securities", payload: { ticker: "EQR", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_TRADE, effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, captures: { r: $.data.id } }
          trigger:
            - { call: "GET /advisory/restricted-list-entries/${r}", as: ComplianceOfficer, captures: { st1: $.data.status } }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /advisory/restricted-list-entries/${r}", as: ComplianceOfficer, captures: { st2: $.data.status } }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /advisory/restricted-list-entries/${r}", as: ComplianceOfficer, captures: { st3: $.data.status } }
          assert:
            - "at 2026-08-01 (default clock): status == SCHEDULED"
            - "at 2026-08-05T00:00:00Z (from inclusive): status == ACTIVE"
            - "at 2026-08-10T00:00:00Z (to exclusive): status == EXPIRED"
      - name: client_total_aum_aggregation
        claim_type: computed_fields
        grounds: [entities.Client.fields.total_aum_cents, calculations.portfolio_valuation]
        distinguishing_aspect: "total_aum_cents sums total_value_cents over non-CLOSED portfolios; two funded portfolios aggregate exactly."
        test_recipe:
          setup: ["ACTIVE client; portfolio P1 with deposit 100000; portfolio P2 with deposit 50000 (both OPEN — activation not required for cash movements is FALSE, cash movements require ACTIVE, so both are activated under an ACTIVE IPS)"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "AUM Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P1", tax_status: TAXABLE }, as: Advisor, captures: { p1: $.data.id } }
            - { call: "POST /advisory/portfolios/${p1}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p1}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P2", tax_status: TAX_DEFERRED }, as: Advisor, captures: { p2: $.data.id } }
            - { call: "POST /advisory/portfolios/${p2}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p2}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 50000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
          trigger:
            - { call: "GET /advisory/clients/${c}", as: Advisor, captures: { aum: $.data.total_aum_cents } }
          assert:
            - "Client.${c}.total_aum_cents == 150000 (100000 + 50000 across both non-CLOSED portfolios)"
      - name: get_nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds:
           - "errors[ERR_NOT_FOUND]"
           - "validations[priority=5]"
        distinguishing_aspect: "Reading a random UUID on any parameterized route yields 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advisory/portfolios/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Advisor, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "http 404, error_id == ERR_NOT_FOUND, data.message non-empty, response_type == 'error'"
      - name: security_ticker_must_be_uppercase
        claim_type: type_constraints
        grounds: [entities.Security.fields.ticker]
        distinguishing_aspect: "Lowercase ticker violates the uppercase constraint -> 400; valid ticker persists verbatim."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/securities", payload: { ticker: "eqa", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { tk: $.data.ticker, st: $.data.trading_status } }
          assert:
            - "lowercase ticker: http 400 ERR_INVALID_REQUEST"
            - "valid create: ticker == 'EQA', trading_status == LISTED, price_cents == 1000"
      - name: withdrawal_review_overdue_derived_flag
        claim_type: computed_fields
        grounds: [entities.InvestmentPolicyStatement.fields.review_overdue]
        excluded_because:
          difficulty_instance: review_overdue_strictly_after_due_instant
          rationale: "Boundary semantics (strict >) and derivation are asserted there."
      - name: withdrawal_dual_variant_coverage
        claim_type: computed_fields
        grounds: [entities.WithdrawalRequest.fields.modeled_plan]
        excluded_because:
          difficulty_instance: withdrawal_pro_rata_vs_tax_aware_divergence
          rationale: "modeled_* computed fields asserted for both variants."

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: client_lifecycle_terminal_lockdown_and_terminate_guard
        claim_type: terminal_state_lockdown
        grounds:
           - "state_machines.Client"
           - "errors[ERR_CLIENT_INVALID_STATE]"
        distinguishing_aspect: "TERMINATED is terminal: no transition out; terminate from PROSPECT or with a non-CLOSED portfolio is rejected."
        test_recipe:
          setup: ["client A ACTIVE with no portfolios; client B ACTIVE with one OPEN portfolio"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "A", risk_tolerance_score: 50 }, as: Advisor, captures: { ca: $.data.id } }
            - { call: "POST /advisory/clients", payload: { full_name: "B", risk_tolerance_score: 50 }, as: Advisor, captures: { cb: $.data.id } }
          trigger:
            - { call: "POST /advisory/clients/${ca}/terminate", as: Advisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/clients/${ca}/activate", as: Advisor }
            - { call: "POST /advisory/clients/${ca}/activate", as: Advisor, captures: { err2: $.data.error_id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${cb}", name: "PB", tax_status: TAXABLE }, as: Advisor, captures: { pb: $.data.id } }
            - { call: "POST /advisory/clients/${cb}/activate", as: Advisor }
            - { call: "POST /advisory/clients/${cb}/terminate", as: Advisor, captures: { err3: $.data.error_id } }
            - { call: "POST /advisory/clients/${ca}/terminate", as: Advisor }
            - { call: "POST /advisory/clients/${ca}/activate", as: Advisor, captures: { err4: $.data.error_id } }
          assert:
            - "terminate from PROSPECT: 409 ERR_CLIENT_INVALID_STATE"
            - "double activate: 409 ERR_CLIENT_INVALID_STATE"
            - "terminate with an OPEN portfolio: 409 ERR_CLIENT_INVALID_STATE"
            - "terminate of ACTIVE portfolio-less client succeeds (vacuous guard); subsequent activate: 409 (terminal lockdown)"
      - name: ips_happy_path_and_self_referential_supersede
        claim_type: side_effect_execution
        grounds: [state_machines.InvestmentPolicyStatement, entities.InvestmentPolicyStatement.fields.supersedes_ips_id]
        distinguishing_aspect: "Full pipeline DRAFT->PENDING_COMPLIANCE->PENDING_CLIENT->ACTIVE; signing a successor supersedes the prior ACTIVE IPS and records the self-reference; the reverse filter lists the successor."
        test_recipe:
          setup: ["ACTIVE client; benchmark; IPS1 ACTIVE; IPS2 ACTIVE signed later"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Sup Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "V1", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i1: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i1}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i1}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i1}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i1}/client-sign", as: Client, as_user_id: "${c}", captures: { act1: $.data.activated_at, due1: $.data.next_review_due } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "V2", risk_tolerance_score: 55, review_cadence_months: 6 }, as: Advisor, captures: { i2: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i2}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 55.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 45.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i2}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i2}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i2}/client-sign", as: Client, as_user_id: "${c}", captures: { sup: $.data.supersedes_ips_id } }
          trigger:
            - { call: "GET /advisory/ips-policies/${i1}", as: Advisor, captures: { st1: $.data.status } }
            - { call: "GET /advisory/ips-policies", payload: { supersedes_ips_id: "${i1}" }, as: Advisor, captures: { succ_rows: $.data } }
          assert:
            - "IPS1 activation set activated_at == 2026-08-01T00:00:00Z (default clock) and next_review_due == 2027-08-01T00:00:00Z"
            - "after IPS2 sign: IPS1.status == SUPERSEDED; IPS2.supersedes_ips_id == ${i1}"
            - "GET /advisory/ips-policies?supersedes_ips_id=${i1} returns an array of length 1 whose only element is ${i2} — reverse reachability of the self-FK"
            - "IPS2.status == ACTIVE with review_cadence_months == 6"
      - name: ips_compliance_reject_loop_back_to_draft
        claim_type: valid_transition
        grounds: [state_machines.InvestmentPolicyStatement.PENDING_COMPLIANCE_to_DRAFT]
        distinguishing_aspect: "compliance-reject returns the IPS to DRAFT (branching revert); targets remain editable in DRAFT and resubmission works."
        test_recipe:
          setup: ["ACTIVE client; benchmark; IPS submitted then compliance-rejected"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Loop1", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-reject", payload: { reason: "bands too wide" }, as: ComplianceOfficer, captures: { st: $.data.status } }
          trigger:
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 50.00, band_pct: 2.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 50.00, band_pct: 2.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor, captures: { st2: $.data.status } }
          assert:
