          One POPULATED cabinet is hit with three triggers that belong to later
          stages — retesting an installed module, QA-approving before burn-in,
          and mounting before QA — and each must be refused with the error of the
          entity whose state is wrong (module vs cabinet), all as 409s. Nothing
