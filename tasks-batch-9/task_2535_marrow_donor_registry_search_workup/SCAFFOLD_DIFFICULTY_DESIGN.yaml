            - "SearchRequest.${sr_id}.status is still PRIMARY_ENGAGED (the primary kept an unused second attempt, so no promotion and no STALLED)"
            - "SearchRequest.${sr_id}.last_sweep_at == \"2026-08-08T00:00:01Z\""

  - rule_id: cross_entity_state_dependency
    instances:
