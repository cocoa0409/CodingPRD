            - call: "POST /design-system/token-sets"
              payload: { name: "Core Foundations 2026", slug: "core-foundations", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/releases"
              payload: { semver_base: "1.0.0", channel: "STABLE" }
              as: SystemAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Icon Set", slug: "icon-set", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { c_prov: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Menu Button", slug: "menu-button", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { c_cons: $.data.id }
            - call: "POST /design-system/components/${c_cons}/dependencies"
              payload: { provider_component_id: "${c_prov}", pinned_provider_major: 1 }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { dep_id: $.data.id, dep_state_0: $.data.compatibility_state }
            - call: "POST /design-system/components/${c_cons}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/menu-button-web", package_version: "1.0.0", token_compliance_ratio: 0.98 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.98 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { status_after_first_ship: $.data.status }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Icon set renames every glyph token", author_team_id: "${team_id}", target_component_id: "${c_prov}", pinned_token_set_id: "${ts_id}", proposal_kind: "BREAKING_CHANGE", touches_public_api: true }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${prop_id}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "A11Y_MANUAL", "DOC_PAGE", "MIGRATION_GUIDE", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/icon-set" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "Glyph naming reviewed." }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "Migration guide is adequate." }
              as: EngineeringReviewer
              as_user_id: "eng-1"
            - call: "GET /design-system/components/${c_prov}"
              payload: {}
              as: DesignSystemLead
              captures: { c_prov_v: $.data.version }
            - call: "POST /design-system/contribution-proposals/${prop_id}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${c_prov_v}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "GET /design-system/platform-implementations/${impl_id}"
              payload: {}
