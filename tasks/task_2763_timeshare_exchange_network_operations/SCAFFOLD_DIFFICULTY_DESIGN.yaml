            - "immediately after the run, GET /exchange-network/deposits/${dep} — settlement_power == 58 (45 * 1.25 * 1.10 = 61.875 -> 62, +6 = 68, lead -700 -> factor 0.85, 57.8 -> 58)"
            - "immediately after the run, GET /exchange-network/members/${m1} — trading_power_balance == 0 (82 credited, 82 forfeited on listing)"
            - "GET /exchange-network/getaway-offers?deposit_id=${dep} — total_count == 1 and data[0].list_price_cents == 35627 (58 * 900 = 52200, demand premium 5 percent -> 54810.0, urgency 35 percent -> 35626.5, rounded once -> 35627)"
            - "GET /exchange-network/getaway-offers/${offer} — urgency_discount_pct == 35 and created_by_run_id == \"${run1}\""
            - "after the withdrawal, GET /exchange-network/getaway-offers/${offer} — status == \"WITHDRAWN\""
            - "after the withdrawal, GET /exchange-network/deposits/${dep} — rental_status == \"NOT_LISTED\" and deposit_status == \"BANKED\" (the second dimension moved back without the first ever changing)"
