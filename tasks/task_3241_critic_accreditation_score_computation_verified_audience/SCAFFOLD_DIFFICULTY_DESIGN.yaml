            - "after PATCH title to OPEN, Release.${r1}.status == OPEN"
      - name: review_publish_requires_release_open_not_just_embargo_lifted
        grounds:
          - state_machines.CriticReview.INGESTED_to_PUBLISHED
          - validations[priority=5]
        distinguishing_aspect: |
          CriticReview -> Release dependency (different entity pair than
          Release->Title): even with the embargo fully past, publishing a review
          on an UPCOMING (never opened) release fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 2026-09-10T00:00:00Z (past embargo); P1 ACCREDITED; CA ACCREDITED; Title OPEN; Release R1 left UPCOMING with embargo_until 2026-09-01T00:00:00Z; CA has an INGESTED review on R1."
          setup_api_calls:
            - &k_clock_late
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - *k_ra
          trigger:
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "publish fails 409 ERR_INVALID_STATE because Release.${r1}.status == UPCOMING, even though the embargo check would pass"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: accreditation_review_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - entities.AccreditationReview.fields.period_end
        distinguishing_aspect: |
          Half-open interval semantics on AccreditationReview periods: a second
          review whose period_start equals the first review's period_end is
          adjacent, NOT overlapping, and BEGIN_REVIEW succeeds; shifting
          period_start one second earlier collides and fails with
          ERR_ACC_REVIEW_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED."
            - "Review AR1 on CA over [2026-08-01, 2026-09-01) is IN_REVIEW (BEGIN_REVIEW done)."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ar
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
          trigger:
            - &k_ar_adj
              call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${ca}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { ar2: $.data.id }
            - call: "POST /accreditation-reviews/${ar2}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
            - &k_ar_ovl
              call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${ca}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-10-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { ar3: $.data.id }
            - call: "POST /accreditation-reviews/${ar3}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "adjacent review ${ar2} (start == prior end) reaches IN_REVIEW"
            - "overlapping-by-one-second review ${ar3} fails BEGIN_REVIEW with 409 ERR_ACC_REVIEW_PERIOD_OVERLAP"
      - name: ticket_showtime_closed_interval_endpoints_inclusive
        grounds:
          - validations[priority=11]
          - entities.TicketVerification.fields.showtime_at
        distinguishing_aspect: |
          Closed-interval semantics on TicketVerification showtimes (different
          interval semantics and different resource than the half-open review
          windows): a showtime exactly at theatrical_window_start verifies, and
          a showtime exactly at theatrical_window_end verifies, while one second
          past the end fails with ERR_VERIFICATION_WINDOW_MISS.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; Release R1 OPEN with theatrical window [2026-09-05T00:00:00Z, 2026-09-20T00:00:00Z] (closed)."
            - "Audience members M1..M3 registered."
          setup_api_calls:
            - *k_clock
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - &k_rel_win
              call: "POST /titles/${t1}/releases"
              payload: { cut_label: "THEATRICAL", theatrical_window_start: "2026-09-05T00:00:00Z", theatrical_window_end: "2026-09-20T00:00:00Z", embargo_until: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_m1
            - *k_m2
            - *k_m3
            - &k_tv1
              call: "POST /releases/${r1}/ticket-verifications"
              payload: { audience_member_id: "${m1}", showtime_at: "2026-09-05T00:00:00Z", exhibitor_code: "AMC" }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { tv1: $.data.id }
            - &k_tv2
              call: "POST /releases/${r1}/ticket-verifications"
              payload: { audience_member_id: "${m2}", showtime_at: "2026-09-20T00:00:00Z", exhibitor_code: "AMC" }
              as: AudienceMember
              as_user_id: "${m2}"
              captures: { tv2: $.data.id }
            - &k_tv3
              call: "POST /releases/${r1}/ticket-verifications"
              payload: { audience_member_id: "${m3}", showtime_at: "2026-09-20T00:00:01Z", exhibitor_code: "AMC" }
              as: AudienceMember
              as_user_id: "${m3}"
              captures: { tv3: $.data.id }
          trigger:
            - call: "POST /ticket-verifications/${tv1}/transition"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /ticket-verifications/${tv2}/transition"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /ticket-verifications/${tv3}/transition"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "TicketVerification.${tv1}.status == VERIFIED (showtime == window start is inside the closed interval)"
            - "TicketVerification.${tv2}.status == VERIFIED (showtime == window end is inside the closed interval)"
            - "TicketVerification.${tv3} VERIFY fails 409 ERR_VERIFICATION_WINDOW_MISS (one second past the end)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: review_withdraw_and_republish_conserves_non_withdrawn_review_count
        grounds:
          - state_machines.CriticReview.PUBLISHED_to_WITHDRAWN
          - calculations.tomatometer_score
        distinguishing_aspect: |
          Conserved quantity: for a release, count(reviews with status PUBLISHED
          or FLAGGED) + count(status WITHDRAWN) == total ingested reviews. A
          WITHDRAW followed by a new ingest (the only forward path out of the
          terminal WITHDRAWN state) keeps the sum equal to the running ingest
          total; no drift across the compensate pair.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA and CB ACCREDITED; R1 OPEN, embargo lifted; CA publishes RA (FRESH), CB publishes RB (FRESH): total ingested == 2, live == 2."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_cb
            - call: "POST /critics/${cb}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - *k_rb
            - call: "POST /reviews/${rb}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${cb}"
          trigger:
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "WITHDRAW" }
              as: Critic
              as_user_id: "${ca}"
            - &k_ra_new
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "Revised verdict.", self_designation: "ROTTEN" }
              as: Critic
              as_user_id: "${ca}"
              captures: { ra2: $.data.id }
            - call: "POST /reviews/${ra2}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - call: "GET /reviews"
              as: AccreditationBoard
              captures: { n_all: $.data }
            - call: "GET /releases/${r1}/score-snapshots"
              as: AccreditationBoard
          assert:
            - "after WITHDRAW: live (PUBLISHED+FLAGGED) count on R1 == 1 and WITHDRAWN count == 1, summing to 2 ingested"
            - "after re-ingest + PUBLISH: live == 2 and WITHDRAWN == 1, summing to 3 ingested (ERR_DUPLICATE_REVIEW did not fire because the prior review is WITHDRAWN)"
            - "the non-superseded PROVISIONAL tomatometer snapshot has total_count == 2 (live set only), pct == 50 (1 FRESH of 2)"
      - name: critic_revoke_then_reinstate_conserves_accredited_critic_count
        grounds:
          - state_machines.Critic.ACCREDITED_to_REVOKED
          - state_machines.Critic.PROBATION_to_ACCREDITED
          - entities.Publication.fields.accredited_critic_count
        distinguishing_aspect: |
          Conserved quantity of a different type (a denormalized counter, not a
          review multiset): Publication.accredited_critic_count must return to
          its exact pre-revocation value after a revoke followed by the
          reinstatement path — revocation decrements once per critic and
          reinstatement increments once per critic, never double-counting.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA and CB ACCREDITED under P1 (accredited_critic_count == 2)."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_cb
            - call: "POST /critics/${cb}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ar
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
          trigger:
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "RULE_REVOKE" }
              as: AccreditationBoard
            - call: "GET /publications/${pub1}"
              as: AccreditationBoard
              captures: { cnt_mid: $.data.accredited_critic_count }
            - call: "POST /critics/${ca}/transition"
              payload: { action: "REAPPLY" }
              as: Critic
              as_user_id: "${ca}"
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - call: "GET /publications/${pub1}"
              as: AccreditationBoard
          assert:
            - "after RULE_REVOKE on CA's review: Publication.${pub1}.accredited_critic_count == 1 (single decrement)"
            - "after CA REAPPLY + ACCREDIT: Publication.${pub1}.accredited_critic_count == 2 — exactly the pre-revocation value"
