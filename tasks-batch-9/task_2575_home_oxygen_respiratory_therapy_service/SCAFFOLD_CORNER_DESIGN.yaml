            - "The release of ${pl_1} succeeds with ${pl_1_status} == REMOVED, ${pl_1_reason} == RELEASED and ${pl_1_removed} == 2026-08-01T00:00:00Z"
            - "${u_back} == IN_STOCK: the unit returns to the branch pool, which is why the second assignment can pick it again and ${pl_2_unit} == ${u_stat}"
            - "${e_placed} == ERR_INVALID_STATE (409): the same verb on the same unit is refused once ${pl_2} is PLACED, because the action is declared only from RESERVED"
            - "${u_end} == DEPLOYED and ${allow_end} == 5590: the refused release changed nothing, and the allowable still counts the one PLACED unit"
            - "The contract still holds exactly one PRIMARY_STATIONARY placement in a non-terminal state, so the role-occupancy rule is satisfied throughout even though three assignment attempts touched the same role"

      - name: patch_endpoints_recompute_derived_fields_and_bump_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /home-oxygen/cmns/{cmn_id}]
          - endpoints[PATCH /home-oxygen/patients/{patient_id}]
          - endpoints[PATCH /home-oxygen/branches/{branch_id}]
          - calculations.cmn_documentation_score
        distinguishing_aspect: |
          The three partial updates behave nothing like each other. The certificate PATCH is a state
          transition in disguise: it is reachable only from RETURNED_FOR_CORRECTION, it re-derives
          documentation_score inside the same response, it clears submitted_by_user_id, and it bumps
          the Patient's version as well as its own. The patient and branch PATCHes are plain
          field-scoped updates that touch one row. All three refuse the fields an operator would most
          want to correct — mrn, branch_id, and the certificate's patient or study links appear in no
          PATCH input list. Because the successful edit lands the certificate in DRAFT, a correction
          that pushes the score below 85.00 leaves it editable only by a fresh submit-and-return round
          or a void, which is why this recipe asserts the follow-on ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "One branch, one HOMEBOUND patient, one GROUP_I study, and one certificate at 3.0 L/min, 24 hours per day, 3 narrative elements, length of need 99 months."
            - "The certificate is submitted and then returned for correction, which is the only state from which PATCH is available."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id, br_ver: $.data.version }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0760", full_name: "Caius Delamare", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id, cmn_ver_0: $.data.version, score_0: $.data.documentation_score }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
              captures: { subby_0: $.data.submitted_by_user_id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/return-for-correction"
              payload: { correction_notes: "Narrative overstates the trial of conservative therapy; reduce to the single documented element." }
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
              captures: { cmn_ver_ret: $.data.version, rr_ret: $.data.revision_round }
          trigger:
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { narrative_element_count: 4 }
              as: IntakeCoordinator
              captures: { e_range: $.data.error_id }
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { narrative_element_count: 1 }
              as: IntakeCoordinator
              captures: { cmn_ver_1: $.data.version, score_1: $.data.documentation_score, status_1: $.data.status, lpm_1: $.data.prescribed_lpm, hpd_1: $.data.hours_per_day, rr_1: $.data.revision_round, subby_1: $.data.submitted_by_user_id, notes_1: $.data.correction_notes }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { p_mirror: $.data.current_cmn_status, p_ver_mid: $.data.version }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
              captures: { cmn_state_2: $.data.status, cmn_ver_2: $.data.version, score_2: $.data.documentation_score }
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { length_of_need_months: 6 }
              as: IntakeCoordinator
              captures: { e_state: $.data.error_id }
            - call: "PATCH /home-oxygen/patients/${p_id}"
              payload: { mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 9000 }
              as: IntakeCoordinator
              captures: { p_ver_end: $.data.version, p_mrn: $.data.mrn, p_branch: $.data.branch_id, p_status: $.data.status, p_mob: $.data.mobility_profile, p_alt: $.data.altitude_feet }
            - call: "PATCH /home-oxygen/branches/${br_id}"
              payload: { refill_capacity_per_day: 1 }
              as: BranchManager
              captures: { br_ver_1: $.data.version, br_cap: $.data.refill_capacity_per_day, br_buffer: $.data.tank_exchange_buffer_minutes, br_liquid: $.data.liquid_oxygen_certified, br_bid: $.data.competitive_bid_area }
          assert:
            - "${score_0} == 100.00 at creation (30 + 20 + 15 + 20 + 10 + 5) with ${cmn_ver_0} == 1, and the return for correction leaves ${cmn_ver_ret} == 3 and ${rr_ret} == 1"
            - "${e_range} == ERR_INVALID_REQUEST (400): narrative_element_count 4 is outside the declared 0..3 range, the shape check at priority 17 fires before any state check, and the rejected PATCH leaves the version at 3"
            - "${score_1} == 86.67 after narrative_element_count drops to 1: the narrative component becomes 20 * 1/3 == 6.6666..., and the single final round_half_up lands on 86.67 rather than 86.66"
            - "${cmn_ver_1} == 4 and ${status_1} == DRAFT: the PATCH is the RETURNED_FOR_CORRECTION -> DRAFT transition, not an inert field write"
            - "${lpm_1} == 3.0, ${hpd_1} == 24, ${rr_1} == 1 and ${notes_1} is the auditor's unchanged note: omitted fields and the revision counter survive the partial update"
            - "${subby_0} == u-intake-1 but ${subby_1} == null: the correction discards the prior submission's identity, which is what lets the same operator resubmit without tripping segregation of duties later"
            - "${p_mirror} == DRAFT and ${p_ver_mid} is greater than ${p_ver}: the certificate PATCH bumps the Patient row too, through the current_cmn_status mirror"
            - "${cmn_state_2} == SUBMITTED with ${score_2} == 86.67 and ${cmn_ver_2} == 5: the two-field correction is exactly what carries the certificate over the 85.00 submit gate"
            - "${e_state} == ERR_INVALID_STATE (409): the same PATCH that just succeeded is refused once the certificate is SUBMITTED, because the endpoint exists only on the RETURNED_FOR_CORRECTION -> DRAFT edge"
            - "${p_ver_end} is exactly one greater than ${p_ver_mid}, with ${p_mob} == ACTIVE_AMBULATORY and ${p_alt} == 9000 applied while ${p_mrn}, ${p_branch} and ${p_status} are unchanged: neither the unique business key nor the branch assignment nor the lifecycle state is reachable through PATCH"
            - "${br_ver_1} == 2 with ${br_cap} == 1 applied and ${br_buffer} == 30, ${br_liquid} == false, ${br_bid} == true preserved: the branch PATCH is field-scoped too, and lowering refill_capacity_per_day does not retroactively invalidate routes already locked under the old capacity"

      - name: setup_completion_conditional_action_corner
        claim_type: conditional_action
        grounds:
          - endpoints[POST /home-oxygen/route-stops/{stop_id}/complete-setup]
        excluded_because:
          difficulty_instance: setup_safety_failure_four_hop_cascade
          rationale: |
            The conditional behaviour of this endpoint — the same call driving the contract to
            IN_SERVICE or to SETUP_FAILED depending on a single boolean in the body, with a different
            four-hop side-effect chain behind each branch — is the whole subject of the §1.8
            transitive_cascade instance.

      - name: billing_month_post_and_reverse_action_pair_corner
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /home-oxygen/rental-contracts/{contract_id}/billing-months]
          - endpoints[POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse]
        excluded_because:
          difficulty_instance: post_then_reverse_billing_month_restores_lifetime_paid_cents
          rationale: |
            The action pair and its conservation property across posted_months, posted_month_count,
            lifetime_paid_cents and last_posted_service_month is driven end to end by the §1.8
            compensating_invariant instance; the §1.9 validations section already covers the window
            and uniqueness rejections that guard the same endpoints.

  # ===========================================================================
  - section: errors
    instances:

      - name: missing_or_unknown_auth_header_returns_401
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNKNOWN_ROLE
        distinguishing_aspect: |
          These two are the only errors in the catalogue that no domain rule can reach: they sit above
          every other check, so they answer even for an endpoint the caller would never be allowed to
          use and even when the body is malformed. The pair also has to be distinguishable — an absent
          header is not the same as a header carrying a role the system does not know.
        test_recipe:
          setup:
            - "A pristine instance; no domain data is required, because these rules run before any lookup."
            - "Header convention for this recipe: `as: NONE` means the request carries no X-User-Role header at all, and `as: OxygenClerk` means it carries a role name that is not one of the seven declared roles."
          setup_api_calls: []
          trigger:
            - call: "GET /home-oxygen/branches"
              payload: {}
              as: NONE
              captures: { e_anon_read: $.data.error_id }
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL" }
              as: NONE
              captures: { e_anon_write: $.data.error_id, m_anon: $.data.message }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "not-a-timestamp" }
              as: NONE
              captures: { e_anon_malformed: $.data.error_id }
            - call: "GET /home-oxygen/branches"
              payload: {}
              as: OxygenClerk
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", cmn_id: "00000000-0000-0000-0000-0000000000ff", pricing_basis: "CASH" }
              as: OxygenClerk
              captures: { e_unknown_role_write: $.data.error_id }
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
          assert:
            - "${e_anon_read} == ERR_UNAUTHENTICATED (401) on a read that every declared role is allowed to perform"
            - "${e_anon_write} == ERR_UNAUTHENTICATED (401) even though the body is also missing four fields, and ${m_anon} is a non-empty human-readable message"
            - "${e_anon_malformed} == ERR_UNAUTHENTICATED (401), not ERR_INVALID_REQUEST: priority 1 runs before the shape check at priority 17"
            - "${e_unknown_role} == ERR_UNKNOWN_ROLE (401), distinct from ERR_UNAUTHENTICATED: the header was present but its value is not a declared role"
            - "${e_unknown_role_write} == ERR_UNKNOWN_ROLE (401), not ERR_UNAUTHORIZED (403) and not either NOT_FOUND: an unrecognised role is rejected before the authorisation matrix is consulted"
            - "The final call with a real role succeeds and returns ${br_id}, proving the five rejections were caused by the headers alone"

  # ===========================================================================
  - section: rbac
    instances:

      - name: auditor_who_submitted_or_signed_cannot_approve
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=4]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.CertificateOfMedicalNecessity[PHYSICIAN_SIGNED -> ACTIVE]
        distinguishing_aspect: |
          The bar is on the identity, not the role: the same ComplianceAuditor header that is
          authorised for the endpoint is refused when its opaque user id is the one recorded in
          submitted_by_user_id or signed_by_user_id. That makes the ordering observable — a caller who
          is both wrong about the role and identical to the submitter gets ERR_UNAUTHORIZED at
          priority 3, never ERR_SEGREGATION_OF_DUTIES at priority 4 — and it means the check has two
          independent legs, because the physician who signed is barred just as firmly as the
          coordinator who submitted.
        test_recipe:
          setup:
            - "One branch, one HOMEBOUND patient, one GROUP_I study and a certificate driven to PHYSICIAN_SIGNED."
            - "u-intake-1 submitted it and u-phys-1 signed it; u-audit-1 has touched nothing."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0770", full_name: "Domenica Falkenrath", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
              captures: { subby: $.data.submitted_by_user_id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
              captures: { signby: $.data.signed_by_user_id, st_signed: $.data.status }
          trigger:
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-intake-1"
              captures: { e_submitter: $.data.error_id, m_submitter: $.data.message }
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-phys-1"
              captures: { e_signer: $.data.error_id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
              captures: { e_role_first: $.data.error_id }
            - call: "GET /home-oxygen/cmns/${cmn_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
              captures: { st_mid: $.data.status, audited_mid: $.data.audited_by_user_id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
              captures: { st_final: $.data.status, audited_final: $.data.audited_by_user_id, initial_date: $.data.initial_date }
          assert:
            - "${subby} == u-intake-1, ${signby} == u-phys-1 and ${st_signed} == PHYSICIAN_SIGNED after setup"
            - "${e_submitter} == ERR_SEGREGATION_OF_DUTIES (403) with a non-empty ${m_submitter}: the role was correct and the state was correct, and only the identity was wrong"
            - "${e_signer} == ERR_SEGREGATION_OF_DUTIES (403): the signing leg of the check is independent of the submitting leg, so the physician's opaque id is barred even though it never appears in submitted_by_user_id"
            - "${e_role_first} == ERR_UNAUTHORIZED (403), not ERR_SEGREGATION_OF_DUTIES: the same offending identity presented under a role that cannot approve fails at priority 3, which fixes the ordering between the two 403s"
            - "${st_mid} == PHYSICIAN_SIGNED and ${audited_mid} == null: none of the three refusals advanced the certificate or recorded an auditor"
            - "${st_final} == ACTIVE with ${audited_final} == u-audit-1 and ${initial_date} == 2026-08-01: a third distinct identity under the same role approves the identical request"

      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.IntakeCoordinator
          - roles.Physician
          - roles.ComplianceAuditor
          - roles.RespiratoryTherapist
          - roles.DeliveryDriver
          - roles.BranchManager
          - roles.BillingSpecialist
          - validations[priority=3]
        distinguishing_aspect: |
          Seven roles own seven disjoint sets of write verbs, and the authorisation check sits at
          priority 3 — above every existence check. So the whole matrix can be probed against
          identifiers that do not exist: a forbidden role gets 403 while the owning role gets 404 for
          the identical path and body. That contrast is the only way to prove the 403 came from the
          matrix rather than from a missing row, and it also rules out the tempting shortcut of
          resolving the path first and reporting 404 to everyone.
        test_recipe:
          setup:
            - "No domain rows are required: every probe below targets the non-existent id 00000000-0000-0000-0000-0000000000ff, because the role check precedes existence."
          setup_api_calls: []
          trigger:
            - call: "POST /home-oxygen/cmns/00000000-0000-0000-0000-0000000000ff/sign"
              payload: {}
              as: IntakeCoordinator
              captures: { e_sign_intake: $.data.error_id }
            - call: "POST /home-oxygen/cmns/00000000-0000-0000-0000-0000000000ff/sign"
              payload: {}
              as: Physician
              captures: { e_sign_phys: $.data.error_id }
            - call: "POST /home-oxygen/cmns/00000000-0000-0000-0000-0000000000ff/approve"
              payload: {}
              as: Physician
              captures: { e_approve_phys: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/00000000-0000-0000-0000-0000000000ff/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: BillingSpecialist
              captures: { e_assign_bill: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/00000000-0000-0000-0000-0000000000ff/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { e_assign_rt: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/00000000-0000-0000-0000-0000000000ff/billing-months"
              payload: { service_month: "2026-08" }
              as: BranchManager
              captures: { e_bill_mgr: $.data.error_id }
            - call: "POST /home-oxygen/route-stops/00000000-0000-0000-0000-0000000000ff/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION"] }
              as: DeliveryDriver
              captures: { e_setup_drv: $.data.error_id }
            - call: "POST /home-oxygen/route-stops/00000000-0000-0000-0000-0000000000ff/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION"] }
              as: RespiratoryTherapist
              captures: { e_setup_rt: $.data.error_id }
            - call: "POST /home-oxygen/route-stops/00000000-0000-0000-0000-0000000000ff/complete"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_complete_rt: $.data.error_id }
            - call: "DELETE /home-oxygen/placements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_del_intake: $.data.error_id }
            - call: "DELETE /home-oxygen/placements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_del_rt: $.data.error_id }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: RespiratoryTherapist
              captures: { e_clock_rt: $.data.error_id }
            - call: "POST /home-oxygen/patients/00000000-0000-0000-0000-0000000000ff/risk-reassessments"
              payload: {}
              as: ComplianceAuditor
              captures: { e_reassess_audit: $.data.error_id }
            - call: "POST /home-oxygen/recall-notices"
              payload: { model_code: "CONC-5L", severity: "CLASS_II", remediation_deadline_utc: "2026-09-01T00:00:00Z" }
              as: BranchManager
              captures: { e_recall_mgr: $.data.error_id }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: BranchManager
              captures: { clk: $.data.current_utc }
          assert:
            - "${e_sign_intake} == ERR_UNAUTHORIZED (403) while ${e_sign_phys} == ERR_CMN_NOT_FOUND (404): identical path and body, and only the header differs"
            - "${e_approve_phys} == ERR_UNAUTHORIZED (403): signing and approving are owned by different roles, so the physician cannot self-approve what it signed"
            - "${e_assign_bill} == ERR_UNAUTHORIZED (403) while ${e_assign_rt} == ERR_CONTRACT_NOT_FOUND (404): equipment selection belongs to the clinician, not to revenue cycle"
            - "${e_bill_mgr} == ERR_UNAUTHORIZED (403): the branch manager who owns routes and the clock cannot post money"
            - "${e_setup_drv} == ERR_UNAUTHORIZED (403) while ${e_setup_rt} == ERR_ROUTE_STOP_NOT_FOUND (404), and symmetrically ${e_complete_rt} == ERR_UNAUTHORIZED (403): the setup verb and the plain completion verb are owned by different field roles even though both act on route stops"
            - "${e_del_intake} == ERR_UNAUTHORIZED (403) while ${e_del_rt} == ERR_PLACEMENT_NOT_FOUND (404)"
            - "${e_clock_rt} == ERR_UNAUTHORIZED (403) but the identical clock call as BranchManager succeeds with ${clk} == 2026-08-02T00:00:00Z: the logical clock is a single-role instrument"
            - "${e_reassess_audit} == ERR_UNAUTHORIZED (403) and ${e_recall_mgr} == ERR_UNAUTHORIZED (403): the auditor publishes recalls but cannot reassess a patient, and the manager remediates recalls but cannot publish them"

      - name: shared_read_access_is_not_uniform_across_roles
        claim_type: shared_operations
        grounds:
          - roles.Physician
          - roles.DeliveryDriver
          - roles.BillingSpecialist
          - roles.ComplianceAuditor
          - roles.IntakeCoordinator
          - endpoints[GET /home-oxygen/patients/{patient_id}/risk-assessment]
          - endpoints[GET /home-oxygen/rental-contracts/{contract_id}/cap-summary]
          - endpoints[GET /home-oxygen/delivery-routes/{route_id}/manifest]
        distinguishing_aspect: |
          "Shared" reads are shared by different sets of roles. Only BranchManager and
          RespiratoryTherapist may read everything; the three computed reads carve out a different
          exclusion per role, and Physician and DeliveryDriver are limited to explicit whitelists that
          exclude whole entities rather than just the computed endpoints. As in the previous instance
          the probes use a non-existent id, so a 403 proves the matrix and a 404 proves the caller was
          admitted — the successful 200 readings of all three computed endpoints live in the endpoints
          section instance that checks their values.
        test_recipe:
          setup:
