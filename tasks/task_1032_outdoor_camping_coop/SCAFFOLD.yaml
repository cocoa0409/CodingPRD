# =============================================================================
# task_1032 — Outdoor & Camping Co-op Store (REI style)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  1032. Outdoor & Camping Co-op Store (REI style): SKU & gear-rental linkage,
  co-op membership & dividend, used-gear trade-in/resale, class/trip & guiding,
  repair/warranty, permit/pass sales, loyalty, special order

domain_name: outdoor-camping-coop
api_prefix: /coop

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty: Expert
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are peer top-level collections under /coop, linked by FK fields
  # (no deep URL nesting). Reverse-reachability provided by filtered-list GETs.

  state_machine_shape: parallel
  # SalesOrder carries two independent axes (payment_status × fulfillment_status);
  # TradeIn carries a cyclic offer/counter loop. Others are branching-with-revert.

  relationship_patterns:
    - one_to_many
    - cross_aggregate      # RentalAgreement -> GearUnit -> GearSku across aggregates

  role_model: peer_roles
  # Member (entity_backed) owns member-initiated resources; StoreStaff (opaque)
  # runs the counter/operations; Public only registers members.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email (login handle)" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: membership_tier, type: enum, source: input, default: BASIC, description: "BASIC | PREMIER; PREMIER earns a 10% purchase discount", constraints: "enum {BASIC, PREMIER}" }
      - { name: membership_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | LAPSED; LAPSED members may not pick up rentals, book trips, or buy permits", constraints: "enum {ACTIVE, LAPSED}" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Wallet balance in cents; funded by trade-ins/refunds/staff adjustments, debited by purchases-with-credit/bookings/permits. Never negative." }
      - { name: loyalty_points_balance, type: integer, source: computed, default: 0, description: "Loyalty points; earned on paid orders and class check-ins, reversed on returns. Never negative." }
      - { name: lifetime_eligible_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative eligible spend used for loyalty; increases on order pay, decreases on order return." }

  - name: GearSku
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "TENT | BACKPACK | KAYAK | STOVE | APPAREL", constraints: "enum {TENT, BACKPACK, KAYAK, STOVE, APPAREL}" }
      - { name: retail_price_cents, type: integer, source: input, description: "Unit retail price in cents", constraints: ">= 0" }
      - { name: rentable, type: boolean, source: input, default: false, description: "Whether physical units of this SKU can be rented" }
      - { name: daily_rental_rate_cents, type: integer, source: input, default: 0, description: "Per-day rental rate in cents; used only when rentable is true", constraints: ">= 0" }

  - name: GearUnit
    parent: null
    common_fields: true
    fields:
      - { name: gear_sku_id, type: string, source: input, description: "FK -> GearSku.id; the SKU this physical unit belongs to" }
      - { name: serial_number, type: string, source: input, description: "Physical unit serial number" }
      - { name: condition_grade, type: enum, source: input, default: GOOD, description: "NEW | GOOD | FAIR", constraints: "enum {NEW, GOOD, FAIR}" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE (not currently picked up) | RENTED_OUT (physically out on a rental). Multiple future non-overlapping RentalAgreements may reference an AVAILABLE unit; status flips only at pickup/return.", constraints: "enum {AVAILABLE, RENTED_OUT}" }

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the renting member" }
      - { name: gear_unit_id, type: string, source: input, description: "FK -> GearUnit.id; the reserved physical unit" }
      - { name: start_at, type: datetime, source: input, description: "Reservation window start (ISO 8601 UTC)" }
      - { name: due_at, type: datetime, source: input, description: "Expected return time (ISO 8601 UTC)" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Actual return time; null until returned" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | PICKED_UP | RETURNED | CANCELLED", constraints: "enum {QUOTED, PICKED_UP, RETURNED, CANCELLED}" }
      - { name: daily_rate_cents, type: integer, source: system, description: "Snapshot of GearSku.daily_rental_rate_cents at quote time" }
      - { name: rental_days, type: integer, source: computed, description: "ceil((due_at - start_at) / 1 day), minimum 1" }
      - { name: damage_waiver, type: boolean, source: input, default: false, description: "If true, adds a damage-waiver fee to the charge" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Refundable security deposit held at quote, released on return/cancel", constraints: ">= 0" }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "Provisional rental charge computed at quote (no late fee) — see calculations.rental_charge" }
      - { name: final_charge_cents, type: integer, source: computed, default: null, description: "Final rental charge computed at return (estimated + late fee); null until returned" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member" }
      - { name: lines, type: array, source: input, description: "Array of {gear_sku_id, quantity}; unit price snapshotted from GearSku.retail_price_cents at create" }
      - { name: use_store_credit, type: boolean, source: input, default: false, description: "If true, order total is debited from Member.store_credit_cents at pay time" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "Payment axis: UNPAID | PAID | REFUNDED", constraints: "enum {UNPAID, PAID, REFUNDED}" }
      - { name: fulfillment_status, type: enum, source: system, default: UNFULFILLED, description: "Fulfillment axis: UNFULFILLED | FULFILLED | RETURNED", constraints: "enum {UNFULFILLED, FULFILLED, RETURNED}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_gross across lines — see calculations.order_total" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-line rounded member-tier discounts (round per line, then sum)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: loyalty_points_earned, type: integer, source: computed, default: 0, description: "floor(total_cents / 100), credited on pay, reversed on return" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member trading in gear" }
      - { name: gear_sku_id, type: string, source: input, description: "FK -> GearSku.id; the model being traded in" }
      - { name: described_condition, type: enum, source: input, description: "LIKE_NEW | GOOD | WORN", constraints: "enum {LIKE_NEW, GOOD, WORN}" }
      - { name: payout_method, type: enum, source: input, description: "INSTANT_CREDIT | CONSIGNMENT; chosen by the member at submit", constraints: "enum {INSTANT_CREDIT, CONSIGNMENT}" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | OFFERED | COUNTERED | ACCEPTED | LISTED | SOLD | REJECTED", constraints: "enum {SUBMITTED, OFFERED, COUNTERED, ACCEPTED, LISTED, SOLD, REJECTED}" }
      - { name: appraised_value_cents, type: integer, source: system, default: null, description: "Staff appraisal set on appraise; updated on each re-appraisal in the counter loop" }
      - { name: member_counter_cents, type: integer, source: system, default: null, description: "Member's most recent counter-offer value; null unless a counter was made" }
      - { name: instant_credit_cents, type: integer, source: computed, default: null, description: "INSTANT_CREDIT payout variant = round(appraised_value_cents * 0.40) — see calculations.trade_in_payout" }
      - { name: consignment_estimate_cents, type: integer, source: computed, default: null, description: "CONSIGNMENT informational estimate = round(appraised_value_cents * 0.65)" }
      - { name: resale_price_cents, type: integer, source: system, default: null, description: "Consignment resale price set at sell time" }
      - { name: payout_cents, type: integer, source: computed, default: null, description: "Actual credit posted to member: instant_credit_cents (INSTANT_CREDIT at accept) or round(resale_price_cents * 0.65) (CONSIGNMENT at sell)" }

  - name: ClassTrip
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class or guided-trip title" }
      - { name: category, type: enum, source: input, description: "CLASS | GUIDED_TRIP", constraints: "enum {CLASS, GUIDED_TRIP}" }
      - { name: start_at, type: datetime, source: input, description: "Scheduled start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Scheduled end (ISO 8601 UTC)" }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed seats", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Per-seat price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CANCELLED | COMPLETED", constraints: "enum {SCHEDULED, CANCELLED, COMPLETED}" }
      - { name: seats_reserved, type: integer, source: computed, default: 0, description: "Count of bookings in {BOOKED, CHECKED_IN}" }
      - { name: seats_available, type: integer, source: computed, default: 0, description: "capacity - seats_reserved; never negative" }
      - { name: waitlist_count, type: integer, source: computed, default: 0, description: "Count of bookings in WAITLISTED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booked member" }
      - { name: class_trip_id, type: string, source: input, description: "FK -> ClassTrip.id; the trip booked" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | WAITLISTED | CHECKED_IN | CANCELLED | NO_SHOW", constraints: "enum {BOOKED, WAITLISTED, CHECKED_IN, CANCELLED, NO_SHOW}" }
      - { name: price_paid_cents, type: integer, source: system, default: 0, description: "Store credit debited when this booking became BOOKED; 0 while WAITLISTED, refunded on cancel" }
      - { name: booked_from_waitlist, type: boolean, source: system, default: false, description: "True if this booking reached BOOKED via waitlist promotion" }

  - name: PermitAllocation
    parent: null
    common_fields: true
    fields:
      - { name: park_name, type: string, source: input, description: "Park / area the permit pool covers" }
      - { name: season_start, type: datetime, source: input, description: "First valid entry_date (inclusive, ISO 8601 UTC)" }
      - { name: season_end, type: datetime, source: input, description: "Last valid entry_date (inclusive, ISO 8601 UTC)" }
      - { name: total_quota, type: integer, source: input, description: "Total number of permits issuable from this pool", constraints: ">= 0" }
      - { name: price_cents, type: integer, source: input, description: "Per-permit price in cents", constraints: ">= 0" }
      - { name: issued_count, type: integer, source: computed, default: 0, description: "Count of PermitPass in {ISSUED} charged against this pool" }
      - { name: available_quota, type: integer, source: computed, default: 0, description: "total_quota - issued_count; never negative" }

  - name: PermitPass
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member" }
      - { name: permit_allocation_id, type: string, source: input, description: "FK -> PermitAllocation.id; the pool this pass draws from" }
      - { name: entry_date, type: datetime, source: input, description: "Requested entry date; must be within the allocation season (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | EXPIRED", constraints: "enum {ISSUED, EXPIRED}" }
      - { name: price_cents, type: integer, source: system, description: "Snapshot of PermitAllocation.price_cents at issue" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- GearUnit
  - entity: GearUnit
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "status tracks physical possession only; reservations are logical (the set of non-terminal RentalAgreements). A unit may hold several future non-overlapping QUOTED rentals while AVAILABLE."
    transitions:
      - from: AVAILABLE
        to: RENTED_OUT
        trigger: "POST /coop/rental-agreements/{id}/pickup"
        actor: StoreStaff
        preconditions:
          - "GearUnit.status == AVAILABLE (not already out on another rental)"
        side_effects:
          - "RentalAgreement QUOTED -> PICKED_UP"
      - from: RENTED_OUT
        to: AVAILABLE
        trigger: "POST /coop/rental-agreements/{id}/return"
        actor: StoreStaff
        preconditions:
          - "GearUnit.status == RENTED_OUT"
        side_effects:
          - "RentalAgreement PICKED_UP -> RETURNED"

  # ---------------------------------------------------------- RentalAgreement
  - entity: RentalAgreement
    field: status
    initial_state: QUOTED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: (create)
        to: QUOTED
        trigger: "POST /coop/rental-agreements"
        actor: "Member or StoreStaff"
        preconditions:
          - "Member.membership_status == ACTIVE (business_safety)"
          - "referenced GearUnit exists and parent GearSku.rentable == true (business_referential)"
          - "no non-terminal RentalAgreement (QUOTED/PICKED_UP) on this unit whose [start_at, due_at + SERVICE_BUFFER_HOURS) half-open interval overlaps the requested [start_at, due_at + SERVICE_BUFFER_HOURS) (business_temporal)"
        side_effects:
          - "no GearUnit.status change (reservation is logical)"
          - "daily_rate_cents snapshotted from GearSku.daily_rental_rate_cents"
          - "rental_days and estimated_charge_cents computed (calculations.rental_charge, estimated variant)"
      - from: QUOTED
        to: PICKED_UP
        trigger: "POST /coop/rental-agreements/{id}/pickup"
        actor: StoreStaff
        preconditions:
          - "RentalAgreement.status == QUOTED"
          - "GearUnit.status == AVAILABLE (cross-entity: unit not already RENTED_OUT by another rental); else ERR_UNIT_NOT_READY"
          - "Member.membership_status == ACTIVE"
        side_effects:
          - "GearUnit AVAILABLE -> RENTED_OUT"
      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /coop/rental-agreements/{id}/return"
        actor: StoreStaff
        preconditions:
          - "RentalAgreement.status == PICKED_UP"
        side_effects:
          - "returned_at stamped from logical clock"
          - "final_charge_cents computed (calculations.rental_charge, final variant incl. late fee)"
          - "GearUnit RENTED_OUT -> AVAILABLE"
          - "Member.loyalty_points_balance += floor(final_charge_cents / 100)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /coop/rental-agreements/{id}/cancel"
        actor: "Member or StoreStaff"
        preconditions:
          - "RentalAgreement.status == QUOTED"
        side_effects:
          - "reservation released (unit had no status change at quote, so none to revert)"
          - "deposit hold released (no wallet change since quote does not debit)"

  # ------------------------------------------------------------- SalesOrder
  # Parallel dimensions: payment_status axis and fulfillment_status axis evolve
  # independently; return joins both to their terminal values.
  - entity: SalesOrder
    field: "payment_status × fulfillment_status (parallel)"
    initial_state: "UNPAID / UNFULFILLED"
    terminal_states: ["REFUNDED / RETURNED"]
    transitions:
      - from: "payment_status == UNPAID"
        to: "payment_status == PAID"
        trigger: "POST /coop/sales-orders/{id}/pay"
        actor: "Member or StoreStaff"
        preconditions:
          - "payment_status == UNPAID"
          - "if use_store_credit: Member.store_credit_cents >= total_cents (business_fiscal)"
        side_effects:
          - "if use_store_credit: Member.store_credit_cents -= total_cents"
          - "Member.loyalty_points_balance += loyalty_points_earned"
          - "Member.lifetime_eligible_spend_cents += total_cents"
      - from: "fulfillment_status == UNFULFILLED"
        to: "fulfillment_status == FULFILLED"
        trigger: "POST /coop/sales-orders/{id}/fulfill"
        actor: StoreStaff
        preconditions:
          - "fulfillment_status == UNFULFILLED"
        side_effects:
          - "no ledger change (fulfillment axis is independent of payment axis)"
      - from: "payment_status == PAID AND fulfillment_status == FULFILLED"
        to: "payment_status == REFUNDED AND fulfillment_status == RETURNED"
        trigger: "POST /coop/sales-orders/{id}/return"
        actor: "Member or StoreStaff"
        preconditions:
          - "payment_status == PAID (ERR_ORDER_NOT_PAID otherwise)"
          - "fulfillment_status == FULFILLED"
        side_effects:
          - "payment_status -> REFUNDED; fulfillment_status -> RETURNED"
          - "Member.store_credit_cents += total_cents (refund posted to wallet)"
          - "Member.loyalty_points_balance -= loyalty_points_earned"
          - "Member.lifetime_eligible_spend_cents -= total_cents"

  # ---------------------------------------------------------------- TradeIn
  # Cyclic offer/counter loop: OFFERED <-> COUNTERED (re-appraisal rounds).
  - entity: TradeIn
    field: status
    initial_state: SUBMITTED
    terminal_states: [SOLD, REJECTED]
    transitions:
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /coop/trade-ins/{id}/appraise"
        actor: StoreStaff
        preconditions:
          - "TradeIn.status == SUBMITTED"
        side_effects:
          - "appraised_value_cents set; instant_credit_cents and consignment_estimate_cents computed (calculations.trade_in_payout)"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /coop/trade-ins/{id}/respond {action: COUNTER, counter_cents}"
        actor: Member
        preconditions:
          - "TradeIn.status == OFFERED"
        side_effects:
          - "member_counter_cents recorded"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /coop/trade-ins/{id}/appraise (re-appraisal round)"
        actor: StoreStaff
        preconditions:
          - "TradeIn.status == COUNTERED"
        side_effects:
          - "appraised_value_cents updated; instant_credit_cents and consignment_estimate_cents recomputed"
        note: "This COUNTERED -> OFFERED edge together with OFFERED -> COUNTERED forms the negotiation cycle."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /coop/trade-ins/{id}/respond {action: ACCEPT}"
        actor: Member
        preconditions:
          - "TradeIn.status == OFFERED"
        side_effects:
          - "if payout_method == INSTANT_CREDIT: payout_cents = instant_credit_cents; Member.store_credit_cents += payout_cents (immediate)"
          - "if payout_method == CONSIGNMENT: status advances immediately to LISTED (see next edge); no wallet change yet"
      - from: ACCEPTED
        to: LISTED
        trigger: "system (immediately after ACCEPT when payout_method == CONSIGNMENT)"
        actor: system
        preconditions:
          - "payout_method == CONSIGNMENT"
        side_effects:
          - "item listed for resale"
      - from: LISTED
        to: SOLD
        trigger: "POST /coop/trade-ins/{id}/sell {resale_price_cents}"
        actor: StoreStaff
        preconditions:
          - "TradeIn.status == LISTED"
          - "payout_method == CONSIGNMENT"
        side_effects:
          - "resale_price_cents set; payout_cents = round(resale_price_cents * CONSIGNMENT_MEMBER_PCT); Member.store_credit_cents += payout_cents"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /coop/trade-ins/{id}/respond {action: REJECT}"
        actor: Member
        preconditions:
          - "TradeIn.status == OFFERED"
        side_effects:
          - "trade-in closed with no payout"

  # -------------------------------------------------------------- ClassTrip
  - entity: ClassTrip
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /coop/class-trips/{id}/cancel"
        actor: StoreStaff
        preconditions:
          - "ClassTrip.status == SCHEDULED"
        side_effects:
          - "every Booking in {BOOKED, WAITLISTED, CHECKED_IN} -> CANCELLED (cascade)"
          - "each such Booking transition refunds price_paid_cents to its member and reverses loyalty earned at check-in"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /coop/class-trips/{id}/complete"
        actor: StoreStaff
        preconditions:
          - "ClassTrip.status == SCHEDULED"
        side_effects:
          - "every Booking still in BOOKED -> NO_SHOW (no refund); CHECKED_IN bookings remain"

  # ---------------------------------------------------------------- Booking
  - entity: Booking
    field: status
    initial_state: "BOOKED or WAITLISTED (computed at create by capacity)"
    terminal_states: [CANCELLED, NO_SHOW]
    transitions:
      - from: (create)
        to: BOOKED
        trigger: "POST /coop/bookings (when seats_available >= 1)"
        actor: "Member or StoreStaff"
        preconditions:
          - "expected_classtrip_version matches ClassTrip.version (OCC)"
          - "ClassTrip.status == SCHEDULED (cross-entity, state)"
          - "Member.membership_status == ACTIVE (business_safety)"
          - "no other non-terminal Booking for this member on a ClassTrip whose [start_at, end_at] closed-interval overlaps this trip (business_temporal)"
          - "Member.store_credit_cents >= ClassTrip.price_cents (business_fiscal)"
          - "seats_available >= 1"
        side_effects:
          - "increments ClassTrip.version by 1"
          - "seats_reserved += 1; price_paid_cents = ClassTrip.price_cents; Member.store_credit_cents -= price_paid_cents"
      - from: (create)
        to: WAITLISTED
        trigger: "POST /coop/bookings (when seats_available == 0)"
        actor: "Member or StoreStaff"
        preconditions:
          - "expected_classtrip_version matches ClassTrip.version (OCC)"
          - "ClassTrip.status == SCHEDULED"
          - "Member.membership_status == ACTIVE"
          - "no member schedule overlap"
          - "Member.store_credit_cents >= ClassTrip.price_cents (so promotion can charge)"
          - "seats_available == 0"
        side_effects:
          - "increments ClassTrip.version by 1"
          - "waitlist_count += 1; price_paid_cents = 0 (not charged until promoted)"
      - from: WAITLISTED
        to: BOOKED
        trigger: "system (promotion when a BOOKED booking on the same trip is cancelled)"
        actor: system
        preconditions:
          - "a seat was released on this trip"
          - "this Booking is the earliest WAITLISTED by created_at ASC"
        side_effects:
          - "booked_from_waitlist = true; seats_reserved += 1; waitlist_count -= 1"
          - "price_paid_cents = ClassTrip.price_cents; Member.store_credit_cents -= price_paid_cents"
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /coop/bookings/{id}/check-in"
        actor: StoreStaff
        preconditions:
          - "Booking.status == BOOKED"
          - "ClassTrip.status == SCHEDULED"
        side_effects:
          - "Member.loyalty_points_balance += CHECKIN_LOYALTY_POINTS"
      - from: [BOOKED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /coop/bookings/{id}/cancel"
        actor: "Member or StoreStaff"
        preconditions:
          - "Booking.status in {BOOKED, WAITLISTED}"
        side_effects:
          - "Member.store_credit_cents += price_paid_cents (refund; 0 for a waitlisted booking)"
          - "if was BOOKED: seats_reserved -= 1 and the earliest WAITLISTED booking on the trip is promoted to BOOKED (cascade), which debits that member's store_credit by price"
          - "if was WAITLISTED: waitlist_count -= 1"

  # --------------------------------------------------------------- PermitPass
  - entity: PermitPass
    field: status
    initial_state: ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: (create)
        to: ISSUED
        trigger: "POST /coop/permit-passes"
        actor: "Member or StoreStaff"
        preconditions:
          - "expected_allocation_version matches PermitAllocation.version (OCC)"
          - "Member.membership_status == ACTIVE (business_safety)"
          - "season_start <= entry_date <= season_end (business_temporal)"
          - "PermitAllocation.available_quota >= 1 (business_constraint)"
          - "Member.store_credit_cents >= PermitAllocation.price_cents (business_fiscal)"
        side_effects:
          - "increments PermitAllocation.version by 1"
          - "PermitAllocation.issued_count += 1; price_cents snapshotted; Member.store_credit_cents -= price_cents"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (logical clock advances past entry_date end-of-day)"
        actor: system
        preconditions:
          - "current clock > entry_date + 1 day"
        side_effects:
          - "pass no longer valid; PermitAllocation.issued_count unchanged (quota is consumed for the season)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned write-write mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-classtrip
    parent_entity: ClassTrip
    write_endpoint: "POST /coop/bookings"
    occ_field: "expected_classtrip_version"
    description: |
      Creating a Booking against a ClassTrip whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already created a booking that consumed a seat (legitimately
      changing whether this request would seat vs waitlist), so the current
      writer's view of the trip is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: permit-issue-stale-allocation
    parent_entity: PermitAllocation
    write_endpoint: "POST /coop/permit-passes"
    occ_field: "expected_allocation_version"
    description: |
      Issuing a PermitPass against a PermitAllocation whose version has advanced
      since the client last observed it is rejected. Another writer has already
      drawn a permit from the pool (changing available_quota), so this writer's
      view of the allocation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 2 (a): non-linear ≥3-input rental charge with tiered discount ----
  - name: rental_charge
    trigger: "estimated at POST /coop/rental-agreements (quote); final at POST /coop/rental-agreements/{id}/return"
    algorithm: tiered_pricing
    formula: |
      # Inputs: daily_rate_cents, rental_days, membership_tier, damage_waiver, returned_at, due_at
      daily_subtotal        = daily_rate_cents * rental_days
      multi_day_discount    = round(daily_subtotal * MULTI_DAY_DISCOUNT_PCT) if rental_days >= MULTI_DAY_THRESHOLD else 0
      discounted            = daily_subtotal - multi_day_discount
      member_discount       = round(discounted * MEMBER_DISCOUNT_PCT[membership_tier])
      waiver_fee            = round(daily_subtotal * DAMAGE_WAIVER_PCT) if damage_waiver else 0
      estimated_charge_cents = (discounted - member_discount) + waiver_fee     # provisional variant

      # final variant (at return) adds late fee; late only when returned strictly after due
      days_late             = ceil((returned_at - due_at) / 1 day) if returned_at > due_at else 0
      late_fee_cents        = round(days_late * daily_rate_cents * LATE_FEE_MULTIPLIER)
      final_charge_cents    = estimated_charge_cents + late_fee_cents
    input_set: "single RentalAgreement plus its GearSku daily rate and the renting Member's tier"
    constants:
      MULTI_DAY_THRESHOLD: 7          # days
      MULTI_DAY_DISCOUNT_PCT: 0.15
      MEMBER_DISCOUNT_PCT: { BASIC: 0.00, PREMIER: 0.10 }
      DAMAGE_WAIVER_PCT: 0.10
      LATE_FEE_MULTIPLIER: 1.5
      SERVICE_BUFFER_HOURS: 24
    precision: "integer cents; each round() is round_half_up to whole cents"
    variants:
      - name: estimated
        when: "at quote (POST /coop/rental-agreements)"
        difference: "excludes late fee; returned_at unknown so days_late treated as 0"
      - name: final
        when: "at return (POST /coop/rental-agreements/{id}/return)"
        difference: "adds late_fee_cents computed from actual returned_at vs due_at (strict > boundary)"

  # --- Rule 1 dual-variant #1 (RentalAgreement domain) is the same calc above:
  #     estimated vs final produce different charges for identical inputs. ------

  # --- Rule 2 (b): nested rounding order on order total --------------------
  - name: order_total
    trigger: "at POST /coop/sales-orders (create)"
    algorithm: aggregation
    formula: |
      # For each line: line_gross = GearSku.retail_price_cents * quantity
      # Member-tier discount is applied PER LINE, ROUNDED PER LINE, THEN SUMMED.
      # Pinned order: round-per-line THEN sum  (NOT sum-then-round).
      subtotal_cents  = sum(line_gross for each line)
      discount_cents  = sum( round(line_gross * MEMBER_DISCOUNT_PCT[membership_tier]) for each line )
      total_cents     = subtotal_cents - discount_cents
      loyalty_points_earned = floor(total_cents / LOYALTY_CENTS_PER_POINT)
    input_set: "the order's line array and the purchasing Member's tier at create time"
    constants:
      MEMBER_DISCOUNT_PCT: { BASIC: 0.00, PREMIER: 0.10 }
      LOYALTY_CENTS_PER_POINT: 100
    precision: "integer cents; round_half_up per line before summing; floor for loyalty points"
    variants: []

  # --- Rule 1 dual-variant #2 (TradeIn domain): instant vs consignment ------
  - name: trade_in_payout
    trigger: "instant_credit/consignment_estimate at appraise; payout_cents at accept (INSTANT) or sell (CONSIGNMENT)"
    algorithm: weighted_scoring
    formula: |
      instant_credit_cents      = round(appraised_value_cents * INSTANT_CREDIT_PCT)
      consignment_estimate_cents = round(appraised_value_cents * CONSIGNMENT_MEMBER_PCT)
      # actual posted payout:
      payout_cents = instant_credit_cents                                   if payout_method == INSTANT_CREDIT (posted at ACCEPT)
      payout_cents = round(resale_price_cents * CONSIGNMENT_MEMBER_PCT)      if payout_method == CONSIGNMENT   (posted at SELL)
    input_set: "single TradeIn; appraised_value_cents (staff) and, for consignment, resale_price_cents (staff at sell)"
    constants:
      INSTANT_CREDIT_PCT: 0.40
      CONSIGNMENT_MEMBER_PCT: 0.65
    precision: "integer cents, round_half_up"
    variants:
      - name: instant_credit
        when: "payout_method == INSTANT_CREDIT; posted immediately at ACCEPT"
        difference: "based on appraised_value_cents at 40%; paid up-front regardless of resale"
      - name: consignment
        when: "payout_method == CONSIGNMENT; posted at SELL"
        difference: "based on actual resale_price_cents at 65%; diverges from instant_credit for the same item"

  # --- Derived aggregates (reconciliation) --------------------------------
  - name: class_trip_seats
    trigger: "booking create / cancel / promotion / check-in / trip cancel / trip complete"
    algorithm: aggregation
    formula: |
      seats_reserved  = count(Booking where class_trip_id == trip.id and status in {BOOKED, CHECKED_IN})
      seats_available = max(0, capacity - seats_reserved)
      waitlist_count  = count(Booking where class_trip_id == trip.id and status == WAITLISTED)
    input_set: "all Bookings for the trip filtered by status"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: permit_allocation_quota
    trigger: "permit pass issue"
    algorithm: aggregation
    formula: |
      issued_count    = count(PermitPass where permit_allocation_id == pool.id and status == ISSUED, plus EXPIRED that were once issued)
      available_quota = max(0, total_quota - issued_count)
    input_set: "all PermitPass drawn from the pool; a pass keeps consuming quota for the season even after EXPIRED"
    constants: {}
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /coop/members and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7; entity_backed Member acts only on resources whose member_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist, validated left-to-right (member, gear_sku, gear_unit, rental, sales_order, trade_in, class_trip, booking, permit_allocation, permit_pass)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition (generic ERR_INVALID_STATE; specific: ERR_TRIP_NOT_SCHEDULED for bookings on non-SCHEDULED trips, ERR_UNIT_NOT_READY for pickup when the unit is RENTED_OUT, ERR_ORDER_NOT_PAID for return, ERR_INVALID_OFFER_RESPONSE for trade-in respond)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Member.membership_status == ACTIVE for rental pickup/quote, booking create, and permit issue"
    error_id: ERR_MEMBERSHIP_INACTIVE
    http_status: 403
    applies_to: "POST /coop/rental-agreements, .../pickup, POST /coop/bookings, POST /coop/permit-passes"

  - priority: 6
    category: business_temporal
    check: "Temporal-window checks: rental unit-overlap incl SERVICE_BUFFER_HOURS half-open; member booking closed-interval overlap; permit entry_date within [season_start, season_end]"
    error_id: "ERR_UNIT_UNAVAILABLE | ERR_MEMBER_SCHEDULE_CONFLICT | ERR_OUTSIDE_SEASON"
    http_status: "409 / 409 / 422"
    applies_to: "POST /coop/rental-agreements, POST /coop/bookings, POST /coop/permit-passes"

  - priority: 7
    category: business_referential
    check: "Rental unit's parent GearSku.rentable == true"
    error_id: ERR_UNIT_NOT_RENTABLE
    http_status: 422
    applies_to: "POST /coop/rental-agreements"

  - priority: 8
    category: business_constraint
    check: "Capacity/quota: PermitAllocation.available_quota >= 1 for issue (booking over-capacity is NOT an error — it waitlists)"
    error_id: ERR_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /coop/permit-passes"

  - priority: 9
    category: business_fiscal
    check: "Member.store_credit_cents sufficient: >= total_cents for pay-with-credit, >= price_cents for booking and permit"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /coop/sales-orders/{id}/pay, POST /coop/bookings, POST /coop/permit-passes"

  - priority: 10
    category: state
    check: "OCC precondition: expected_<parent>_version matches parent.version (checked after existence, before side effects commit)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coop/bookings, POST /coop/permit-passes"

