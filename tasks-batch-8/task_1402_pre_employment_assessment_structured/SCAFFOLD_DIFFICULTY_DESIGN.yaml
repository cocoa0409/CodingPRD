  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: instrument_validation_expiry_revalidation_cycle
        grounds:
          - state_machines.AssessmentInstrument.VALIDATED_to_EXPIRED
          - state_machines.AssessmentInstrument.EXPIRED_to_REVALIDATION
          - state_machines.AssessmentInstrument.REVALIDATION_to_VALIDATED
          - calculations.adverse_impact_ratio
        distinguishing_aspect: |
          Cyclic machine on AssessmentInstrument: VALIDATED ->(clock past validity)-> EXPIRED
          -> REVALIDATION -> VALIDATED. Cycle-create is gated while EXPIRED; validate during
          REVALIDATION fails on expired CONTENT evidence (ERR_EVIDENCE_EXPIRED) until fresh
          evidence is filed; validity_expires_at recomputed as min over current required evidence.
        test_recipe:
          setup:
            - "Vendor ACTIVE; instrument VALIDATED with CRITERION evidence until 2027-08-01 and CONTENT evidence until 2026-09-01 -> validity_expires_at == 2026-09-01T00:00:00Z (min rule)"
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-09-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin, captures: { val1: $.data.validation_status, vexp1: $.data.validity_expires_at } }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 1 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
          trigger:
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: TalentAssessmentAdmin, captures: { sweep: $.data.instruments_expired } }
            - { call: "GET /talent/instruments/${i}", as: TalentAssessmentAdmin, captures: { st_exp: $.data.validation_status } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Late Cycle", administration_window_start: "2026-09-10T00:00:00Z", administration_window_end: "2026-09-20T00:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { err_gate: $.data.error_id } }
            - { call: "POST /talent/instruments/${i}/begin-revalidation", as: TalentAssessmentAdmin, captures: { err_reval: $.data.error_id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Fresh criterion study", issuer: "IO Psych Lab", effective_from: "2026-09-01T00:00:00Z", effective_until: "2028-01-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/begin-revalidation", as: TalentAssessmentAdmin, captures: { st_rev: $.data.validation_status } }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin, captures: { err_val: $.data.error_id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Fresh content study", issuer: "IO Psych Lab", effective_from: "2026-09-01T00:00:00Z", effective_until: "2027-12-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin, captures: { st_val2: $.data.validation_status, vexp2: $.data.validity_expires_at } }
          assert:
            - "After first validate: validation_status == VALIDATED AND validity_expires_at == 2026-09-01T00:00:00Z (min over current CRITERION+CONTENT)"
            - "Clock set to 2026-09-02 -> instruments_expired == 1; GET shows validation_status == EXPIRED (clock 2026-09-01T00:00:00Z exactly would NOT expire: strict >)"
            - "Cycle create against EXPIRED instrument rejected: err_gate == ERR_INSTRUMENT_NOT_VALIDATED"
            - "begin-revalidation before fresh CRITERION evidence rejected: err_reval == ERR_EVIDENCE_TYPE_MISSING"
            - "After fresh CRITERION filed: status == REVALIDATION"
            - "validate during REVALIDATION with expired CONTENT rejected: err_val == ERR_EVIDENCE_EXPIRED"
            - "After fresh CONTENT filed: validation_status == VALIDATED AND validity_expires_at == 2027-08-01T00:00:00Z (min of 2027-08-01, 2028-01-01, 2027-12-01)"

