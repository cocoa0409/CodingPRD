              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_VERIFIED_TIMELOGS"
            - "HTTP status == 409 and Milestone.${m_id}.amount_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_milestone_fund_requires_contract_active
        grounds:
          - state_machines.Milestone.DRAFT_to_FUNDED
          - validations[priority=7]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Milestone->Contract: funding a milestone is rejected with ERR_CONTRACT_NOT_ACTIVE
          while the parent Contract is still DRAFT (not yet activated) — Milestone's transition depends on
          Contract.status.
        test_recipe:
          setup:
            - "A DRAFT contract (never activated) with a DRAFT milestone, and a funded wallet."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Nu", email: "nu@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev13", email: "dev13@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "CE1", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 20000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/milestones/00000000-0000-4000-8000-000000000001/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_ACTIVE (Contract is DRAFT)"
            - "HTTP status == 409"

      - name: cross_proposal_accept_requires_posting_open
        grounds:
          - state_machines.Proposal.SUBMITTED_to_ACCEPTED
          - state_machines.JobPosting.OPEN_to_CANCELLED
          - errors[ERR_INVALID_PROPOSAL_STATE]
        distinguishing_aspect: |
          Entity pair Proposal->JobPosting (different pair from Milestone->Contract): accepting a proposal
          whose parent JobPosting is CANCELLED is rejected because the cancel already cascaded the proposal to
          DECLINED, so the proposal is no longer in an acceptable state.
        test_recipe:
          setup:
            - "A posting with one SUBMITTED proposal, then the posting is CANCELLED (cascading proposal to DECLINED)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Xi", email: "xi@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev14", email: "dev14@x.com", skills: ["ui"], tax_id_on_file: false }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "CE2", billing_type: "FIXED", budget_cents: 30000, required_skills: ["ui"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 20000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /job-postings/${jp_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Proposal.${prop_id}.status == DECLINED after cancel cascade"
            - "response error_id == ERR_INVALID_PROPOSAL_STATE and HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_same_milestone_halfopen_interval
        grounds:
          - calculations.daily_hours_overlap
          - validations[priority=9]
          - errors[ERR_TIMELOG_OVERLAP]
        distinguishing_aspect: |
          Interval semantics A (pairwise half-open intersection on one milestone+date): a new [570,600)
          interval overlapping an existing [540,600) is rejected with ERR_TIMELOG_OVERLAP, while adjacency
          [600,660) is allowed — endpoint POST /contracts/{id}/timelogs, resource = a single Milestone.
        test_recipe:
          setup:
            - "ACTIVE HOURLY contract with one milestone holding a LOGGED timelog [540,600) on 2026-03-04."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Omi", email: "omi@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev15", email: "dev15@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Ov1", billing_type: "HOURLY", budget_cents: 8000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 4000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "ov work", hourly_cap_hours: 10 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M", amount_cents: 100, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/timelogs"
              payload: { milestone_id: "${m_id}", work_date: "2026-03-04", start_minute: 540, end_minute: 600, memo: "first" }
              as: Freelancer
              as_user_id: "${fl_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/timelogs"
              payload: { milestone_id: "${m_id}", work_date: "2026-03-04", start_minute: 570, end_minute: 630, memo: "overlap" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TIMELOG_OVERLAP (570 < 600 intersects [540,600))"
            - "HTTP status == 409"

      - name: overlap_cross_contract_daily_aggregate_cap
        grounds:
          - calculations.daily_hours_overlap
          - validations[priority=10]
          - errors[ERR_DAILY_HOURS_CAP_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics B (aggregate-capacity running total across DIFFERENT contracts, no pairwise
          intersection): freelancer already has 660 LOGGED minutes for 2026-03-05 across contract C1; a new
          90-minute log on contract C2 the same day pushes the daily total to 750 > GLOBAL_DAILY_MINUTE_CAP
          (720) and is rejected — different resource entity (cross-contract) and different geometry than A.
        test_recipe:
          setup:
            - "Freelancer with two ACTIVE HOURLY contracts C1 and C2; C1 milestone already has non-overlapping LOGGED intervals totaling 660 minutes on 2026-03-05."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Pi", email: "pi@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev16", email: "dev16@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "C1", billing_type: "HOURLY", budget_cents: 8000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp1: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp1}", freelancer_id: "${fl_id}", bid_amount_cents: 4000, cover_letter: "b1" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop1: $.data.id }
            - call: "POST /proposals/${prop1}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/activate"
              payload: { sow_text: "c1", hourly_cap_hours: 24 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${c1_id}/milestones"
              payload: { title: "M1", amount_cents: 100, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m1: $.data.id }
            - call: "POST /contracts/${c1_id}/timelogs"
              payload: { milestone_id: "${m1}", work_date: "2026-03-05", start_minute: 0, end_minute: 360, memo: "block1 360" }
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${c1_id}/timelogs"
              payload: { milestone_id: "${m1}", work_date: "2026-03-05", start_minute: 360, end_minute: 660, memo: "block2 300" }
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "C2", billing_type: "HOURLY", budget_cents: 8000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp2: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp2}", freelancer_id: "${fl_id}", bid_amount_cents: 4000, cover_letter: "b2" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop2: $.data.id }
            - call: "POST /proposals/${prop2}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /contracts/${c2_id}/activate"
              payload: { sow_text: "c2", hourly_cap_hours: 24 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${c2_id}/milestones"
              payload: { title: "M2", amount_cents: 100, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /contracts/${c2_id}/timelogs"
              payload: { milestone_id: "${m2}", work_date: "2026-03-05", start_minute: 700, end_minute: 790, memo: "90 more" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DAILY_HOURS_CAP_EXCEEDED (660 + 90 = 750 > 720)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_escrow_conservation_on_split_release
        grounds:
          - calculations.escrow_conservation
          - state_machines.Milestone.DISPUTED_to_RELEASED
          - entities.EscrowTransaction.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = escrow cents per milestone. On a SPLIT release of a 100000 funded milestone
          (award 60000), sum(all FUND)=100000 must equal released_gross(60000)+refunded(40000)+held(0); the
          forward RELEASE and its compensating REFUND leave the milestone escrow ledger balanced to zero held.
        test_recipe:
          setup:
            - "ACTIVE FIXED contract; one FUNDED(100000)->SUBMITTED->DISPUTED milestone under arbitration."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Rho", email: "rho@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev17", email: "dev17@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Inv1", billing_type: "FIXED", budget_cents: 120000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 100000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "inv work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M", amount_cents: 100000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/dispute"
              payload: { raised_by: "FREELANCER", reason: "partial", claimed_release_cents: 100000 }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/assign-arbitration"
              payload: {}
              as: Arbitrator
          trigger:
            - call: "POST /disputes/${d_id}/resolve"
              payload: { arbitrator_award_cents: 60000 }
              as: Arbitrator
            - call: "GET /contracts/${contract_id}/milestones/${m_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { rg: $.data.released_gross_cents }
          assert:
            - "Milestone.${m_id}.released_gross_cents == 60000 and refunded_cents == 40000 and funded_cents == 0"
            - "sum(FUND amounts) 100000 == released_gross 60000 + refunded 40000 + held 0 (escrow conserved)"

      - name: invariant_wallet_conservation_fund_then_terminate
        grounds:
          - calculations.escrow_conservation
          - state_machines.Milestone.DRAFT_to_FUNDED
          - state_machines.Milestone.DRAFT_to_CANCELLED
          - entities.Client.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Client wallet cents (a different quantity than per-milestone escrow). Funding a
          milestone (debit 30000) then terminating the contract (REFUND credit 30000) returns the wallet to its
          pre-fund balance exactly — the forward FUND and compensating REFUND leave the wallet unchanged.
        test_recipe:
          setup:
            - "Client wallet at 30000; ACTIVE FIXED contract with one milestone funded for 30000 (wallet -> 0)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Sig", email: "sig@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev18", email: "dev18@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 30000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Inv2", billing_type: "FIXED", budget_cents: 40000, required_skills: ["x"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 30000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "inv2 work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M", amount_cents: 30000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /clients/${client_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { wallet: $.data.wallet_balance_cents }
          assert:
            - "Client.${client_id}.wallet_balance_cents == 30000 (back to pre-fund balance; FUND debit + REFUND credit net zero)"
            - "Milestone.${m_id}.status == CANCELLED and funded_cents == 0"
