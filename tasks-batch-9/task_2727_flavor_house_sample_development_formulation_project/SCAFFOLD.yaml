  - method: POST
    path: "/formulas/{formula_id}/decision"
    description: "Approve a submitted formula or push it back for rework; the approver may not be the submitter"
    roles: [TechnicalDirector]
    code: 200
    input: ["decision", "decision_note?"]
    output: Formula
    side_effects:
      - "SUBMITTED -> APPROVED (sets approved_by_user_id) or SUBMITTED -> REWORK_REQUIRED (sets rework_reason DIRECTOR_REJECTION)"
      - "on approval: the brief's CommercializationForecast AT_RISK -> ACTIVE and calculations.forecast_value is re-run"
      - "increments Formula.version"

  - method: POST
    path: "/formulas/{formula_id}/revisions"
    description: "Create the next iteration of an approved or reworked formula and supersede it"
    roles: [Flavorist]
    code: 201
    input: ["name", "expected_formula_version", "carry_components?"]
    output: Formula
    side_effects:
      - "the predecessor goes APPROVED -> SUPERSEDED or REWORK_REQUIRED -> SUPERSEDED with superseded_by_formula_id set and version incremented"
      - "creates the successor in DRAFT with parent_formula_id set, optionally copying the predecessor's components in sequence_no order"
      - "cascade: the predecessor's ScaleUpBatch rows in REQUESTED or TOLERANCE_SET -> CANCELLED with cancellation_reason PARENT_SUPERSEDED"

