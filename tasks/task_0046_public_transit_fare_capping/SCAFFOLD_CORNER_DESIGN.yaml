    instances:
      - name: benefit_allocation_supersede_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[benefit-alloc-supersede-stale-rider]
          - validations[priority=13]
          - errors[ERR_STALE_RIDER_VERSION]
          - endpoints./benefit-allocations
        distinguishing_aspect: "After a first allocation create advances Rider.version, a second create for the same (rider, 2026-06) still carrying the pre-supersede expected_rider_version is rejected with ERR_STALE_RIDER_VERSION (412)."
        test_recipe:
          setup:
            - "Rider RZ version 1; no allocation for 2026-06 initially."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rz@x.com", full_name: "R Z", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rz: $.data.id, rzv: $.data.version }
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${rz}", employer_ref: "EMPZ1", period_month: "2026-06", allocated_cents: 500, expected_rider_version: "${rzv}" }
              as: EmployerAdmin
              captures: { az1: $.data.id }
          trigger:
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${rz}", employer_ref: "EMPZ2", period_month: "2026-06", allocated_cents: 800, expected_rider_version: "${rzv}" }
              as: EmployerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 412 and data.error_id == ERR_STALE_RIDER_VERSION (first create bumped Rider.version to 2; the stale ${rzv}==1 is rejected)"

      - name: benefit_allocation_supersede_with_current_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[benefit-alloc-supersede-stale-rider]
          - state_machines.BenefitAllocation.ACTIVE_to_SUPERSEDED
          - endpoints./benefit-allocations
        distinguishing_aspect: "Re-reading Rider.version after the first create and presenting the CURRENT version on a same-period create supersedes the prior allocation (prior -> SUPERSEDED, new ACTIVE with consumed_cents 0)."
        test_recipe:
          setup:
            - "Rider RY version 1; first ACTIVE allocation for 2026-06."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "ry@x.com", full_name: "R Y", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { ry: $.data.id, ryv: $.data.version }
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${ry}", employer_ref: "EMPY1", period_month: "2026-06", allocated_cents: 500, expected_rider_version: "${ryv}" }
              as: EmployerAdmin
              captures: { ay1: $.data.id }
            - call: "GET /riders/${ry}"
              payload: {}
              as: EmployerAdmin
              captures: { ryv2: $.data.version }
          trigger:
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${ry}", employer_ref: "EMPY2", period_month: "2026-06", allocated_cents: 800, expected_rider_version: "${ryv2}" }
              as: EmployerAdmin
              captures: { ay2: $.data.id }
          assert:
            - "status == 201 and data.status == ACTIVE and data.consumed_cents == 0"
            - "BenefitAllocation.${ay1}.status == SUPERSEDED"

      - name: fareweek_charged_total_reconciles_after_capture
        claim_type: derived_field_reconciliation
        grounds:
          - entities.FareWeek.fields.charged_total_cents
          - calculations.compute_tap_charge
        excluded_because:
          difficulty_instance: compensating_invariant / reverse_conserves_rider_out_of_pocket_equals_week_charged_total
          rationale: "charged_total_cents reconciliation after capture and after reverse is asserted by the named §1.8 invariant instance."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: settle_response_reflects_all_charge_fields_immediately
        claim_type: immediate
        grounds:
          - state_machines.Tap.PENDING_to_CAPTURED
          - entities.Tap.fields.charge_cents
          - entities.FundingSource.fields.prepaid_balance_cents
        distinguishing_aspect: "immediate consistency: the settle response body already carries the computed charge_cents and the debited balance is visible on an immediate GET of the funding source within the same logical request flow."
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z; FareProduct ZONE_X base 300 daily 500 weekly 2500; Rider RImm; FundingSource FImm loaded 1000; OPEN week WImm; PENDING tap TImm."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rimm@x.com", full_name: "R Imm", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rimm: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rimm}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rimm}"
              captures: { fimm: $.data.id }
            - call: "POST /funding-sources/${fimm}/load"
              payload: { amount_cents: 1000 }
              as: Rider
              as_user_id: "${rimm}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rimm}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${rimm}"
              captures: { wimm: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rimm}", fare_week_id: "${wimm}", funding_source_id: "${fimm}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rimm}"
              captures: { timm: $.data.id }
          trigger:
            - call: "POST /taps/${timm}/settle"
              payload: {}
              as: PaymentGateway
              captures: { ch: $.data.charge_cents }
            - call: "GET /funding-sources?rider_id=${rimm}"
              payload: { rider_id: "${rimm}" }
              as: Rider
              as_user_id: "${rimm}"
              captures: { bal: "$.data[0].prepaid_balance_cents" }
          assert:
            - "settle response data.charge_cents == 300 and data.status == CAPTURED"
            - "subsequent funding-source list read shows prepaid_balance_cents == 700 (debit immediately visible)"
