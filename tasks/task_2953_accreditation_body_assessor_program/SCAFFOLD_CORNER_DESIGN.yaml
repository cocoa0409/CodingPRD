      - name: qualification_lists_resolve_both_reverse_foreign_keys
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET /accreditation/qualifications
          - entities.AssessorQualification.fields.assessor_id
          - entities.AssessorQualification.fields.scheme_id
          - endpoints.POST /accreditation/assessors/{assessor_id}/qualifications
        distinguishing_aspect: |
          AssessorQualification carries two foreign keys, so the filtered list must resolve each
          independently: one assessor holding a LEAD_ASSESSOR qualification on scheme A and a
          TECHNICAL_EXPERT qualification on scheme B gives total_count 2 by assessor_id, 1 by each
          scheme_id, and 1 by role_type LEAD_ASSESSOR.
        test_recipe:
          setup:
            - "Clock 2026-08-10; two PUBLISHED schemes; one CONTRACT assessor with one qualification already registered on the first scheme."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", witness_min_count: 2, qualification_points_required: 60.0 }
              as: SchemeManager
              captures: { scheme_a: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_a}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_a}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17020-INSP", name: "Inspection bodies", standard_ref: "ISO_IEC_17020", witness_min_count: 1, qualification_points_required: 60.0 }
              as: SchemeManager
              captures: { scheme_b: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_b}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_b}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Bruno Katz", email: "bruno.katz@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { assessor_id: $.data.id }
            - call: "POST /accreditation/assessors/${assessor_id}/qualifications"
              payload: { scheme_id: "${scheme_a}", role_type: "LEAD_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { q_a: $.data.id }
          trigger:
            - call: "POST /accreditation/assessors/${assessor_id}/qualifications"
              payload: { scheme_id: "${scheme_b}", role_type: "TECHNICAL_EXPERT", years_experience: 12, declared_witness_days: 2, declared_training_modules: 2, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { q_b: $.data.id }
          assert:
            - "HTTP 201 and AssessorQualification.${q_b}.assessor_id == ${assessor_id} and scheme_id == ${scheme_b}"
            - "GET /accreditation/qualifications?assessor_id=${assessor_id} returns total_count == 2 holding ${q_a} and ${q_b}"
            - "GET /accreditation/qualifications?scheme_id=${scheme_a} returns total_count == 1 holding only ${q_a}"
            - "GET /accreditation/qualifications?scheme_id=${scheme_b} returns total_count == 1 holding only ${q_b}"
            - "GET /accreditation/qualifications?assessor_id=${assessor_id}&role_type=LEAD_ASSESSOR returns total_count == 1 holding only ${q_a}"
            - "both qualifications have status PENDING and Assessor.${assessor_id}.qualification_status == SCREENING"
            - "Assessor.${assessor_id}.granted_qualification_count == 0"

      - name: complaint_review_and_uphold_action_chain
