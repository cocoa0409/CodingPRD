# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or X-User-Role naming an undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "acting role not permitted on the endpoint, or X-User-ID not matching the entity backing the role" }
  - { id: ERR_LICENSE_NOT_OWNED, http: 403, condition: "a posting names a license whose id is not the acting ScoreConsumer's X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body, unknown field, wrong type, or a magnitude bound from priority 14 violated" }
  - { id: ERR_BUREAU_NOT_FOUND, http: 404, condition: "no Bureau carries the requested id" }
  - { id: ERR_SCORE_MODEL_NOT_FOUND, http: 404, condition: "no ScoreModel carries the requested id" }
  - { id: ERR_SCORE_VARIANT_NOT_FOUND, http: 404, condition: "no ScoreVariant carries the requested id" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "no Consumer carries the requested id" }
  - { id: ERR_ARCHIVE_SAMPLE_NOT_FOUND, http: 404, condition: "no ArchiveSample carries the requested id" }
  - { id: ERR_VALIDATION_STUDY_NOT_FOUND, http: 404, condition: "no ValidationStudy carries the requested id" }
  - { id: ERR_REFERENCE_SET_NOT_FOUND, http: 404, condition: "no ReferenceSet carries the requested id" }
  - { id: ERR_SCORE_RESULT_NOT_FOUND, http: 404, condition: "no ScoreResult carries the requested id" }
  - { id: ERR_REASON_CODE_NOT_FOUND, http: 404, condition: "no ReasonCode carries the requested id" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "no License carries the requested id" }
  - { id: ERR_MODEL_DOCUMENTATION_NOT_FOUND, http: 404, condition: "no ModelDocumentation carries the requested id" }
  - { id: ERR_MIGRATION_EVENT_NOT_FOUND, http: 404, condition: "no MigrationEvent carries the requested id" }
  - { id: ERR_DISCOVERY_REQUEST_NOT_FOUND, http: 404, condition: "no ScoreDiscoveryRequest carries the requested id" }
  - { id: ERR_FEE_LEDGER_ENTRY_NOT_FOUND, http: 404, condition: "no FeeLedgerEntry carries the requested id" }
  - { id: ERR_DISCOVERY_TAG_UNKNOWN, http: 404, condition: "a posting carries a discovery_tag with no ScoreDiscoveryRequest registered under that tag" }
  - { id: ERR_INVALID_STATE_MACHINE_EDGE, http: 409, condition: "the target is not in the transition's from: state, or the transition is not declared on the entity" }
  - { id: ERR_MODEL_SUPERSEDED, http: 409, condition: "licensing or posting against a SUPERSEDED model version, outside a consumed discovery slot" }
  - { id: ERR_MODEL_RETIRED, http: 409, condition: "licensing or posting against a RETIRED model version" }
  - { id: ERR_MODEL_DEPRECATED, http: 409, condition: "creating a license on a variant of a DEPRECATED model version" }
  - { id: ERR_LICENSE_SUSPENDED, http: 409, condition: "posting under a license that is not ACTIVE" }
  - { id: ERR_LICENSE_VARIANT_MISMATCH, http: 409, condition: "the named license's score_variant_id differs from the posting's score_variant_id" }
  - { id: ERR_LICENSE_WINDOW_CONFLICT, http: 409, condition: "a new license term overlaps an existing ACTIVE term for the same lender_code and variant under half-open month semantics" }
  - { id: ERR_SAMPLE_WINDOW_OVERLAP, http: 409, condition: "a new archive sample's window overlaps an existing sample on the same model under containment-tolerant month semantics, unless we assert the identical sample_ref and identical window to undo the duplicate" }
  - { id: ERR_SAMPLE_MODEL_MISMATCH, http: 409, condition: "the named sample_id does not belong to the study's score_model_id" }
  - { id: ERR_SAMPLE_TOO_SMALL, http: 409, condition: "the sample's record_count is below the model's min_input_count" }
  - { id: ERR_SAMPLE_KIND_MISMATCH, http: 409, condition: "a CROSS_BUREAU study names a DEVELOPMENT-kind sample" }
  - { id: ERR_REFERENCE_SET_CONSUMER_MISMATCH, http: 409, condition: "the named reference_set_id belongs to a different consumer than the posting's consumer_id" }
  - { id: ERR_REASON_CODE_VARIANT_MISMATCH, http: 409, condition: "an attached or authored reason code does not belong to the variant or model family it must map" }
  - { id: ERR_REASON_CODE_ARCHIVED, http: 409, condition: "an archived reason code is attached, restored under an archived parent, or relied on for a reversal" }
  - { id: ERR_REASON_CODE_ACTIVE, http: 409, condition: "a reference set is reconciled while its bound reason code is still ACTIVE" }
  - { id: ERR_REASON_CODE_REUSE_LIMIT, http: 409, condition: "archiving a reason code whose bind_count has already reached 2" }
  - { id: ERR_REASON_CODE_MISSING, http: 409, condition: "a PROTECTED_CLASS study runs against a model with no ACTIVE reason code on any of its variants" }
  - { id: ERR_REASON_CODE_VIOLATION, http: 409, condition: "a required composite reason code does not appear on any non-VOIDED posting at acknowledgement" }
  - { id: ERR_COMPOSITE_CODE_DUPLICATE, http: 409, condition: "minting or restoring a composite code that already exists on the variant, or an archive asserted under a composite_code that no ARCHIVED code on the variant carries" }
  - { id: ERR_DUPLICATE_BUREAU_CODE, http: 409, condition: "bureau_code already registered" }
  - { id: ERR_DUPLICATE_CONSUMER_REF, http: 409, condition: "consumer_ref already registered" }
  - { id: ERR_DUPLICATE_VERSION_LABEL, http: 409, condition: "(family_code, version_label) already exists" }
  - { id: ERR_DUPLICATE_VARIANT_INDUSTRY, http: 409, condition: "(score_model_id, industry) already exists" }
  - { id: ERR_DUPLICATE_CODE_LABEL, http: 409, condition: "(score_variant_id, code_label) already exists" }
  - { id: ERR_DUPLICATE_DISCOVERY_TAG, http: 409, condition: "a tag already names a ScoreDiscoveryRequest in status REGISTERED" }
  - { id: ERR_ENTITLEMENT_WITHIN_LIMIT, http: 409, condition: "an explicit suspension requested while cumulative_score_count is within entitled_count" }
  - { id: ERR_NO_RELEASED_VARIANT, http: 409, condition: "releasing a model version with no RELEASED variant" }
  - { id: ERR_MODEL_DOC_REQUIRED, http: 409, condition: "no FILED or SUPPLEMENTED MODEL_RISK_REPORT carries the version label being released or reopened" }
  - { id: ERR_LICENSE_DOC_MISSING, http: 409, condition: "no ModelDocumentation of type ADVERSE_ACTION_MAP carries the licensed version label at termination" }
  - { id: ERR_DEPRECATION_BLOCKED, http: 409, condition: "deprecating a version with an ACTIVE license on one of its variants" }
  - { id: ERR_RETIREMENT_BLOCKED, http: 409, condition: "retiring a version with a reference set outside RECONCILED" }
  - { id: ERR_STUDY_ALREADY_FINALIZED, http: 409, condition: "reverting a study that carries a finalized_by value" }
  - { id: ERR_STUDY_NOT_FINALIZED, http: 409, condition: "compensating a study that has not been acknowledged" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "acknowledgement attempted by the user recorded as performed_by" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }

# =============================================================================
# RBAC Role Permission Matrix (§1.7)
# =============================================================================
roles:
  - name: BureauAdministrator
    description: "Operates the bureau registry and the logical clock; owns reference reads for every surface."
    identity: opaque
    exclusive_operations:
      - "POST /bureaus"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/advance_to_month"
    shared_operations:
      - "GET /bureaus, GET /bureaus/{bureauId}"
      - "read-only GET on score-models, score-variants, consumers, archive-samples, validation-studies, reference-sets, score-results, reason-codes, licenses, fee-ledger-entries, model-documentation, migration-events, score-discovery-requests"

  - name: ModelDeveloper
    description: "Develops model versions, authors industry variants and archive draws, and records migration steps."
    identity: opaque
    exclusive_operations:
      - "POST /score-models"
      - "POST /score-models/{modelId}/variants"
      - "POST /score-models/{modelId}/release"
      - "POST /score-variants/{scoreVariantId}/release"
    shared_operations:
      - "POST /archive-samples"
      - "POST /consumers"
      - "POST /migration-events"
      - "read-only GET on the model, variant, sample and posting surfaces"

  - name: ValidationAnalyst
    description: "Draws validation samples, schedules and runs studies, and can revert an unfinalized study for re-running."
    identity: opaque
    exclusive_operations:
      - "POST /validation-studies"
      - "POST /validation-studies/{studyId}/run"
      - "POST /validation-studies/{studyId}/revert"
    shared_operations:
      - "POST /archive-samples"
      - "POST /consumers"
      - "POST /model-documentation"
      - "read-only GET on the study, sample, variant and discrepancy surfaces"

  - name: ComplianceOfficer
    description: "Owns version lifecycle after release, lender licensing, migration events and the version-retirement gates."
    identity: opaque
    exclusive_operations:
      - "POST /score-models/{modelId}/deprecate"
      - "POST /score-models/{modelId}/reopen"
      - "POST /score-models/{modelId}/retire"
      - "POST /licenses"
      - "POST /licenses/{licenseId}/activate"
      - "POST /licenses/{licenseId}/suspend"
      - "POST /licenses/{licenseId}/reactivate"
      - "POST /licenses/{licenseId}/terminate"
      - "POST /score-results/{scoreResultId}/void"
      - "POST /migration-events/{migrationEventId}/void"
    shared_operations:
      - "POST /migration-events"
      - "POST /model-documentation"
      - "POST /model-documentation/{documentationId}/file"
      - "POST /score-discovery-requests"
      - "read-only GET on every surface"

  - name: FairLendingOfficer
    description: "Runs disparate-impact and cross-bureau validation, binds reference sets to reason codes, and is the second pair of eyes on study acknowledgement."
    identity: opaque
    exclusive_operations:
      - "POST /reference-sets"
      - "POST /reference-sets/{referenceSetId}/attach-reason-code"
      - "POST /reference-sets/{referenceSetId}/detach-reason-code"
      - "POST /reference-sets/{referenceSetId}/reconcile"
      - "POST /validation-studies/{studyId}/acknowledge"
      - "POST /validation-studies/{studyId}/compensate"
    shared_operations:
      - "POST /consumers"
      - "POST /model-documentation/{documentationId}/file"
      - "read-only GET on every surface"

  - name: ReasonCodeAdministrator
    description: "Authors the adverse-action reason-code catalogue and archives or restores its nodes."
    identity: opaque
    exclusive_operations:
      - "POST /reason-codes"
      - "POST /reason-codes/{reasonCodeId}/archive"
      - "POST /reason-codes/{reasonCodeId}/restore"
    shared_operations:
      - "POST /consumers"
      - "read-only GET on the catalogue, variant, reference-set and posting surfaces"

  - name: ScoreConsumer
    description: "A licensed lender-operated service. X-User-ID is the id of the License that will cover the write, so ownership is checked against License.id rather than a separate principal entity."
    identity: entity_backed:License
    exclusive_operations:
      - "POST /score-results"
      - "POST /score-discovery-requests (registration)"
    shared_operations:
      - "GET /score-results and GET /score-results/{scoreResultId} for postings the license settled"
      - "GET /licenses, GET /licenses/{licenseId}, GET /fee-ledger-entries for licenses the caller holds"
