              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "trench" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /meet-requests"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", proposed_start_min: 100, proposed_end_min: 200 }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { meet1_id: $.data.id }
            - call: "POST /meet-requests"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", proposed_start_min: 150, proposed_end_min: 250 }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { meet2_id: $.data.id }
            - call: "POST /meet-requests/${meet1_id}/schedule"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /meet-requests/${meet2_id}/schedule"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_MEET_WINDOW_OVERLAP'"

      - name: dig_polygon_service_area_box_intersection_routing
        grounds:
          - state_machines.LocateTicket.INTAKE_to_SUBMITTED
          - entities.MemberUtility.fields.service_polygon
          - entities.LocateTicket.fields.dig_polygon
        distinguishing_aspect: |
          Spatial (2-D box) overlap with different interval semantics than the 1-D meet window:
          a member is routed iff dig_polygon and service_polygon intersect on BOTH axes (closed-box
          intersection). A box sharing only an edge (touching at max_x==min_x) does NOT intersect the
          interior and is not routed. Distinct resource entity (MemberUtility) and geometry.
        test_recipe:
          setup:
            - "Member M1 service box [0,0,15,15] overlaps dig [10,10,20,20]; member M2 box [20,0,30,15] only touches dig at x=20."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d16@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Overlap M1", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 15, max_y: 15 } }
              as: CallCenter
              captures: { m1: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Touch M2", facility_type: "WATER", service_polygon: { min_x: 20, min_y: 0, max_x: 30, max_y: 15 } }
              as: CallCenter
              captures: { m2: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { nmc: $.data.notified_member_count }
          assert:
            - "LocateTicket.${ticket_id}.notified_member_count == 1"
            - "GET /utility-notifications?ticket_id=${ticket_id} returns exactly one row whose member_utility_id == ${m1}"

