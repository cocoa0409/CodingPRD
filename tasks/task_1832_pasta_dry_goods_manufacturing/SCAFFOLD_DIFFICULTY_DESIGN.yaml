          Category pair (state, business_safety): advancing an ABORTED gluten-free run whose
          line is GLUTEN_EXPOSED violates both the state machine (no transition from ABORTED)
          and GF segregation; the state error ERR_INVALID_STATE (priority 6) must win over
          ERR_GF_SEGREGATION_VIOLATION (priority 8).
