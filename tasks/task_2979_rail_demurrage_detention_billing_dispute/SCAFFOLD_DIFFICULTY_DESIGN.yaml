              payload: {}
              as: BillingAdmin
              captures: { chg_id: "$.data[0].id" }
          trigger:
            - call: "POST /demurrage/disputes/${dsp_id}/decide"
              payload: { decision: "PARTIALLY_ALLOWED", allowance_pct: 0.65, decision_rationale: "Sixty-five percent allowed." }
              as: DemurrageAdjudicator
              as_user_id: "adj-r9i1-a"
