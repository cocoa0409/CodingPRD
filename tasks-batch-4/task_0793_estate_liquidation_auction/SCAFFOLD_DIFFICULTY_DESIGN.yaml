            - call: "POST /orders/${o1_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /pickup-windows"
              payload: { estate_id: "${e_id}", starts_at: "2026-03-25T09:00:00Z", ends_at: "2026-03-25T12:00:00Z", capacity: 5 }
