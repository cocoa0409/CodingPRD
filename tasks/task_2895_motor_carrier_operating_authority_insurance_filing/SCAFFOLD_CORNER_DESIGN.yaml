            - "${apply_as_officer_error} == 'ERR_UNAUTHORIZED' with HTTP 403 and GET /authority-applications?carrier_id=${c70_id} still returns total_count == 1"
            - "${enrol_as_carrier_error} == 'ERR_UNAUTHORIZED' with HTTP 403"
            - "${record_as_analyst_error} == 'ERR_UNAUTHORIZED' with HTTP 403 — the role check precedes the 404 the unknown audit id would otherwise produce"

      - name: missing_or_empty_authentication_headers_are_rejected
        claim_type: role_exclusivity
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Authentication is answered with 401 and separately from authorization: an absent X-User-Role, an absent X-User-ID and a present-but-empty-string X-User-ID all return ERR_UNAUTHENTICATED, never ERR_UNAUTHORIZED — and the empty string is a zero-length value, not whitespace."
        test_recipe:
          setup:
            - "one carrier that the caller would otherwise be entitled to read"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "San Marcos Drayage LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c71_id: $.data.id }
          trigger:
            - call: "GET /carriers/${c71_id}"
              payload: {}
              as: ""
              as_user_id: "staff-co-002"
              note: "X-User-Role header omitted entirely"
              captures: { no_role_error: $.data.error_id }
            - call: "GET /carriers/${c71_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: ""
              note: "X-User-ID header omitted entirely"
              captures: { no_user_error: $.data.error_id }
            - call: "GET /carriers/${c71_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: ""
              note: "X-User-ID present but set to the zero-length string \"\" — not a space, not whitespace"
              captures: { empty_user_error: $.data.error_id }
          assert:
            - "${no_role_error} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "${no_user_error} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "${empty_user_error} == 'ERR_UNAUTHENTICATED' with HTTP 401 — an empty-string header is treated as absent, not as an unknown principal"
            - "none of the three responses is a 403 — authentication is resolved before the role table is consulted"
            - "Carrier.${c71_id} is unchanged and readable afterwards with a well-formed ComplianceOfficer identity"

