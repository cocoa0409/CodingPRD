            - "MarketingKit.${k2_id}.production_cost_cents == 303000  # 150000 + round(180000*0.85)=153000"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: begin_install_gated_by_insurance_certificate_state
        grounds:
          - state_machines.TourStop.CONTRACTED_to_INSTALLING
          - validations[priority=6]
        distinguishing_aspect: |
          Pair (TourStop, InsuranceCertificate): BEGIN_INSTALL requires a
          certificate in {ISSUED, ACTIVE} covering the stop; with no
          certificate the transition is rejected with ERR_NO_INSURANCE_COVERAGE.
        test_recipe:
          setup:
            - "Stop CONTRACTED, inbound shipment RECEIVED and CLEARED with accepted reports, but NO certificate issued for the stop"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Coins", exhibit_code: "COIN-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
