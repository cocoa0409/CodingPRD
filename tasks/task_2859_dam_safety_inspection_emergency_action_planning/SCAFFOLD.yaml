# =============================================================================
# PRD Benchmark Seed Tables — task_2859_dam_safety_inspection_emergency_action_planning
# §1.0–§1.7 live in this file. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2859. Dam Safety Inspection & Emergency Action Planning (state dam safety program): dam inventory
  with hazard classification based on downstream consequence assessment, inspection frequency by
  classification with engineer-performed periodic inspections, deficiency identification, remediation
  orders and enforcement timelines against owners, emergency action plan requirements with inundation
  mapping, notification flowcharts and annual exercises, breach analysis and reclassification when
  downstream development changes consequence, permitting for construction, repair and removal of dams
  with engineering review, owner financial responsibility, abandonment and state intervention
  authority, high-water event monitoring and emergency drawdown coordination

domain_name: "dam-safety-program"

# Flat topology: every business collection is a top-level path segment, so there is no
# shared URL prefix. Concatenating this empty prefix with any endpoint path in §1.5
# yields the final route (e.g. "" + "/dams/{id}" -> "/dams/{id}").
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a peer addressed at a top-level collection; parent linkage is by
  # foreign key in the body, and discovery is by filtered list or a sub-resource read.
  # No entity is nested more than one segment deep under another.

  state_machine_shape: parallel
  # Dam carries two independent state dimensions (safety_status advanced only by accepted
  # inspections; regulatory_status advanced only by enforcement / intervention / permitting).
  # Four child machines are cyclic: Inspection (SUBMITTED->RETURNED->SUBMITTED),
  # EmergencyActionPlan (SUBMITTED->REVISION_REQUIRED->SUBMITTED),
  # Permit (UNDER_ENGINEERING_REVIEW->RETURNED_FOR_REVISION->SUBMITTED),
  # Deficiency (ORDERED->REMEDIATION_SUBMITTED->ORDERED),
  # RemediationOrder (ISSUED->RESPONSE_FILED->ISSUED).

  relationship_patterns:
    - one_to_many          # Dam -> Inspection / ConsequenceAssessment / Permit / EmergencyActionPlan
    - cross_aggregate      # DrawdownOrder spans Dam, RiverReach and HighWaterEvent
    - polymorphic          # Deficiency.source distinguishes inspection-born vs system-born rows

  role_model: segregation_of_duties
  # The Engineer who submits an inspection may not accept it, and the engineer of record on a
  # dam's latest ACCEPTED inspection may not be assigned as that dam's permit review engineer.

  consistency_model: immediate
  difficulty_level: expert_plus   # 15 entities / 62 endpoints / 13 calculations / 10 state-machine dimensions

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the dam owner of record.
        constraints: "1..160 chars, non-empty after trim"
      - name: owner_type
        type: enum
        source: input
        description: Statutory owner category driving state-intervention authority.
        constraints: "PRIVATE | MUNICIPAL | UTILITY | IRRIGATION_DISTRICT"
      - name: contact_email
        type: string
        source: input
        description: Notification address used for orders and enforcement correspondence.
        constraints: "must contain '@'"
      - name: financial_assurance_bond_cents
        type: integer
        source: input
        default: 0
        description: Posted financial-assurance bond backing the owner's removal obligations.
        constraints: ">= 0"
      - name: fee_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Signed sum of every FeeLedgerEntry.amount_cents for this owner; positive means owed to the state (calculations.owner_fee_balance_and_delinquency)."
      - name: delinquency_status
        type: enum
        source: computed
        default: CURRENT
        description: "DELINQUENT when fee_balance_cents >= DELINQUENCY_THRESHOLD_CENTS, else CURRENT."
        constraints: "CURRENT | DELINQUENT"
      - name: registered_dam_count
        type: integer
        source: computed
        default: 0
        description: Count of Dam rows whose owner_id equals this owner's id.

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Licensed professional engineer performing periodic inspections and reviews.
      - name: license_number
        type: string
        source: input
        description: State PE license number.
        constraints: "unique across Engineer rows; 1..40 chars"
      - name: license_expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the PE license lapses.
      - name: certified_hazard_classes
        type: array
        source: input
        description: Hazard classes this engineer is certified to inspect.
        constraints: "non-empty subset of [LOW, SIGNIFICANT, HIGH]"
      - name: license_status
        type: enum
        source: computed
        description: "ACTIVE when license_expires_at > current logical clock, else EXPIRED."
        constraints: "ACTIVE | EXPIRED"
      - name: open_inspection_count
        type: integer
        source: computed
        default: 0
        description: Count of Inspection rows for this engineer whose status is in {SCHEDULED, SUBMITTED, RETURNED}.

  - name: RiverReach
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Named downstream channel reach that receives coordinated releases.
      - name: channel_capacity_cfs
        type: integer
        source: input
        description: Maximum aggregate release the reach can carry without downstream flooding.
        constraints: "> 0"
      - name: downstream_community
        type: string
        source: input
        description: Principal community in the reach's inundation corridor.
      - name: committed_release_cfs
        type: integer
        source: computed
        default: 0
        description: "Sum of requested_release_cfs over DrawdownOrder rows on this reach whose status is in {COORDINATED, ACTIVE} (calculations.reach_capacity_availability)."
      - name: active_drawdown_count
        type: integer
        source: computed
        default: 0
        description: Count of DrawdownOrder rows on this reach whose status is in {COORDINATED, ACTIVE}.

  - name: Dam
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; owner financially responsible for this dam."
      - name: river_reach_id
        type: string
        source: input
        description: "FK -> RiverReach.id; downstream reach receiving any drawdown release."
      - name: name
        type: string
        source: input
        description: Common name of the dam.
      - name: nid_code
        type: string
        source: input
        description: State inventory code.
        constraints: "unique across Dam rows; 1..20 chars"
      - name: height_ft
        type: number
        source: input
        description: Structural height in feet.
        constraints: "> 0"
      - name: gross_storage_acre_ft
        type: number
        source: input
        description: Gross reservoir storage at normal pool, in acre-feet.
        constraints: "> 0"
      - name: crest_elevation_ft
        type: number
        source: input
        description: Dam crest elevation used as the overtopping datum for freeboard.
      - name: normal_pool_elevation_ft
        type: number
        source: input
        description: Normal operating pool elevation.
        constraints: "< crest_elevation_ft"
      - name: year_completed
        type: integer
        source: input
        description: Year the dam was completed.
        constraints: "1700..2100"
      - name: registered_at
        type: datetime
        source: input
        description: Instant the dam entered the state inventory; baseline for the first inspection due date.
      - name: hazard_class
        type: enum
        source: computed
        default: UNCLASSIFIED
        description: "Classification taken from the dam's single CERTIFIED ConsequenceAssessment (calculations.hazard_classification); UNCLASSIFIED while none exists."
        constraints: "UNCLASSIFIED | LOW | SIGNIFICANT | HIGH"
      - name: current_consequence_score
        type: number
        source: computed
        description: "certified_score of the dam's CERTIFIED ConsequenceAssessment; null while none exists."
      - name: safety_status
        type: enum
        source: computed
        default: UNRATED
        description: "condition_rating of the dam's latest ACCEPTED Inspection (by performed_at DESC, tie-break created_at ASC); UNRATED while none exists. Independent of regulatory_status."
        constraints: "UNRATED | SATISFACTORY | CONDITIONALLY_SATISFACTORY | POOR | UNSATISFACTORY"
      - name: regulatory_status
        type: enum
        source: system
        default: REGISTERED
        description: "Enforcement / permitting posture. Independent of safety_status."
        constraints: "REGISTERED | UNDER_ENFORCEMENT | REMOVAL_PERMITTED | STATE_INTERVENTION | BREACHED"
      - name: next_inspection_due_at
        type: datetime
        source: computed
        description: "Due instant for the next PERIODIC inspection (calculations.inspection_due_schedule); null while hazard_class == UNCLASSIFIED."
      - name: inspection_overdue
        type: boolean
        source: computed
        default: false
        description: "true when next_inspection_due_at is non-null and current logical clock > next_inspection_due_at (strict)."
      - name: open_deficiency_count
        type: integer
        source: computed
        default: 0
        description: Count of Deficiency rows on this dam whose status is in {OPEN, ORDERED, REMEDIATION_SUBMITTED, ESCALATED}.
      - name: latest_eap_status
        type: enum
        source: computed
        default: NONE
        description: "status of the dam's most recently created EmergencyActionPlan (by created_at DESC); NONE while none exists."
        constraints: "NONE | DRAFT | SUBMITTED | APPROVED | REVISION_REQUIRED | SUPERSEDED | EXPIRED"
      - name: eap_required
        type: boolean
        source: computed
        default: false
        description: "true when hazard_class is in {SIGNIFICANT, HIGH}."
      - name: committed_drawdown_acre_ft
        type: number
        source: computed
        default: 0
        description: "Sum of planned_release_acre_ft over DrawdownOrder rows on this dam whose status is in {COORDINATED, ACTIVE} (calculations.drawdown_volume_conservation)."
      - name: available_conservation_storage_acre_ft
        type: number
        source: computed
        description: "gross_storage_acre_ft - committed_drawdown_acre_ft; the conserved-storage half of the drawdown invariant."

  - name: ConsequenceAssessment
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam whose downstream consequence is assessed."
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Engineer who created the record; audit identity only, not a foreign-key constraint."
      - name: population_at_risk
        type: integer
        source: input
        description: Permanent population inside the breach inundation corridor.
        constraints: ">= 0"
      - name: habitable_structures
        type: integer
        source: input
        description: Habitable structures inside the breach inundation corridor.
        constraints: ">= 0"
      - name: critical_facilities
        type: integer
        source: input
        description: Hospitals, schools, lifeline utilities and evacuation routes in the corridor.
        constraints: ">= 0"
      - name: breach_peak_outflow_cfs
        type: number
        source: input
        description: Breach-analysis peak outflow.
        constraints: "> 0"
      - name: breach_travel_time_minutes
        type: integer
        source: input
        description: Breach-analysis flood-wave travel time to the first habitable structure; drives the travel-time multiplier tier.
        constraints: "> 0"
      - name: inundation_area_acres
        type: number
        source: input
        description: Mapped inundation area from the breach analysis.
        constraints: "> 0"
      - name: inundation_map_ref
        type: string
        source: input
        description: Document reference for the inundation map produced by this breach analysis.
      - name: screening_score
        type: number
        source: computed
        description: "Screening variant of calculations.breach_consequence_score, computed at creation."
      - name: recommended_hazard_class
        type: enum
        source: computed
        description: "calculations.hazard_classification applied to screening_score."
        constraints: "LOW | SIGNIFICANT | HIGH"
      - name: certified_score
        type: number
        source: computed
        description: "Certified variant of calculations.breach_consequence_score, computed at certification; null while status == DRAFT."
      - name: certified_hazard_class
        type: enum
        source: computed
        description: "calculations.hazard_classification applied to certified_score; null while status == DRAFT."
        constraints: "LOW | SIGNIFICANT | HIGH"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Assessment lifecycle state.
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant of certification; null while status == DRAFT.
      - name: superseded_at
        type: datetime
        source: computed
        description: Logical-clock instant at which a newer certification superseded this row; null otherwise.

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam being inspected."
      - name: engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id; engineer of record who must perform and submit the field visit."
      - name: inspection_type
        type: enum
        source: input
        description: "Only PERIODIC inspections reset next_inspection_due_at."
        constraints: "PERIODIC | FOLLOW_UP | HIGH_WATER"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the engineer's reserved field-visit window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the engineer's reserved field-visit window.
        constraints: "> window_start"
      - name: performed_at
        type: datetime
        source: input
        description: Instant the field visit occurred; supplied at submit, null while SCHEDULED.
      - name: condition_rating
        type: enum
        source: input
        description: Engineer's overall condition rating supplied at submit; null while SCHEDULED.
        constraints: "SATISFACTORY | CONDITIONALLY_SATISFACTORY | POOR | UNSATISFACTORY"
      - name: narrative
        type: string
        source: input
        description: Findings narrative supplied at submit; null while SCHEDULED.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Inspection lifecycle state.
        constraints: "SCHEDULED | SUBMITTED | ACCEPTED | RETURNED"
      - name: deficiency_count
        type: integer
        source: computed
        default: 0
        description: Count of Deficiency rows whose inspection_id equals this row's id.
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: Number of times this inspection has been returned to the engineer.
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID that accepted the inspection; null while not ACCEPTED. Used by the self-acceptance segregation-of-duties check.
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant of acceptance; null while not ACCEPTED.

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam carrying the deficiency."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; inspection that identified the deficiency; null when source != INSPECTION."
      - name: source
        type: enum
        source: system
        description: Origin of the row.
        constraints: "INSPECTION | SYSTEM_EAP | SYSTEM_EXERCISE"
      - name: category
        type: enum
        source: input
        description: Deficiency category; EAP_MISSING and EAP_EXERCISE are written only by system cascades.
        constraints: "SPILLWAY_CAPACITY | SEEPAGE | EROSION | STRUCTURAL | OPERATIONAL | EAP_MISSING | EAP_EXERCISE"
      - name: severity
        type: enum
        source: input
        description: Severity driving the remediation deadline and the daily penalty rate.
        constraints: "MINOR | MODERATE | SERIOUS | CRITICAL"
      - name: description
        type: string
        source: input
        description: Narrative description of the defect.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Deficiency lifecycle state.
        constraints: "OPEN | ORDERED | REMEDIATION_SUBMITTED | ESCALATED | CLOSED_VERIFIED"
      - name: remediation_due_at
        type: datetime
        source: computed
        description: "compliance_deadline_at of the most recently issued RemediationOrder on this deficiency; null while status == OPEN."
      - name: order_count
        type: integer
        source: computed
        default: 0
        description: Count of RemediationOrder rows whose deficiency_id equals this row's id.
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the deficiency reached CLOSED_VERIFIED; null otherwise.

  - name: RemediationOrder
    parent: null
    common_fields: true
    fields:
      - name: deficiency_id
        type: string
        source: input
        description: "FK -> Deficiency.id; deficiency the order compels the owner to correct."
      - name: dam_id
        type: string
        source: system
        description: "FK -> Dam.id; copied from the deficiency at issue time."
      - name: owner_id
        type: string
        source: system
        description: "FK -> Owner.id; owner served with the order, copied from the dam at issue time."
      - name: order_type
        type: enum
        source: input
        description: "Statutory instrument; EMERGENCY_ORDER caps the response period at EMERGENCY_ORDER_MAX_DAYS."
        constraints: "NOTICE_OF_DEFICIENCY | COMPLIANCE_ORDER | EMERGENCY_ORDER"
      - name: requested_response_days
        type: integer
        source: input
        description: Response period the program staff asked for, before the statutory clamp.
        constraints: ">= 1"
      - name: effective_response_days
        type: integer
        source: computed
        description: "Clamped response period actually granted (calculations.remediation_deadline)."
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the order was issued.
      - name: compliance_deadline_at
        type: datetime
        source: computed
        description: "issued_at + effective_response_days days (calculations.remediation_deadline)."
      - name: daily_penalty_rate_cents
        type: integer
        source: computed
        description: "Per-day civil penalty rate pinned at issue time from severity and the dam's hazard_class."
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Enforcement lifecycle state.
        constraints: "ISSUED | RESPONSE_FILED | SATISFIED | DEFAULTED | REFERRED_FOR_ENFORCEMENT"
      - name: response_filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the owner's first response; retained through rejection and used as the good-faith abatement flag. Null when never filed."
      - name: corrective_action_summary
        type: string
        source: input
        description: Owner's description of the corrective work; null before a response is filed.
      - name: completed_at
        type: datetime
        source: input
        description: Owner-asserted completion instant supplied with the response; null before a response is filed.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the Engineer who verified or rejected the response; null before verification.
      - name: defaulted_at
        type: datetime
        source: computed
        description: Sweep instant at which the order was defaulted; null unless it reached DEFAULTED.
      - name: assessed_penalty_cents
        type: integer
        source: computed
        default: 0
        description: "Final civil penalty written at default (calculations.civil_penalty_accrual, final_assessment variant); 0 while not defaulted."

  - name: EmergencyActionPlan
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam the plan covers."
      - name: version_label
        type: string
        source: input
        description: Owner-assigned plan version label.
      - name: inundation_map_ref
        type: string
        source: input
        description: "Inundation map reference; must equal the dam's CERTIFIED ConsequenceAssessment.inundation_map_ref when the dam is eap_required."
      - name: notification_flowchart_ref
        type: string
        source: input
        description: Document reference for the notification flowchart.
      - name: notification_contact_count
        type: integer
        source: input
        description: Number of downstream notification contacts wired into the flowchart.
        constraints: ">= 0"
      - name: drawdown_procedure_ref
        type: string
        source: input
        description: Document reference for the emergency drawdown procedure.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Plan lifecycle state.
        constraints: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUIRED | SUPERSEDED | EXPIRED"
      - name: review_findings
        type: string
        source: input
        description: Reviewing engineer's findings recorded with the review decision; null before review.
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant of approval; null while never approved.
      - name: expires_at
        type: datetime
        source: computed
        description: "approved_at + EAP_VALIDITY_MONTHS[hazard_class]; null when the plan is not APPROVED or hazard_class == LOW."
      - name: last_accepted_exercise_at
        type: datetime
        source: computed
        description: "Greatest conducted_at over this plan's EapExercise rows with outcome == ACCEPTED (tie-break created_at ASC); null when none."
      - name: accepted_exercise_count
        type: integer
        source: computed
        default: 0
        description: Count of this plan's EapExercise rows with outcome == ACCEPTED.
      - name: exercise_current
        type: boolean
        source: computed
        default: false
        description: "Annual-exercise currency over the rolling window (calculations.eap_exercise_currency)."

  - name: EapExercise
    parent: null
    common_fields: false
    fields:
      - name: eap_id
        type: string
        source: input
        description: "FK -> EmergencyActionPlan.id; plan exercised."
      - name: exercise_type
        type: enum
        source: input
        description: Exercise format conducted.
        constraints: "TABLETOP | FUNCTIONAL | FULL_SCALE"
      - name: conducted_at
        type: datetime
        source: input
        description: Instant the exercise was conducted; may not be after the current logical clock.
      - name: participant_count
        type: integer
        source: input
        description: Number of notification-chain participants who took part.
        constraints: ">= 0"
      - name: notification_test_passed
        type: boolean
        source: input
        description: Whether the notification flowchart test succeeded end to end.
      - name: outcome
        type: enum
        source: computed
        description: "Acceptance verdict computed at logging time (calculations.eap_exercise_evaluation)."
        constraints: "ACCEPTED | DEFICIENT"
      - name: deficiency_reason
        type: enum
        source: computed
        description: "First failing check in the fixed order NOTIFICATION_TEST_FAILED, INSUFFICIENT_PARTICIPANTS, EXERCISE_TYPE_NOT_PERMITTED; null when outcome == ACCEPTED."
        constraints: "NOTIFICATION_TEST_FAILED | INSUFFICIENT_PARTICIPANTS | EXERCISE_TYPE_NOT_PERMITTED"
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the DamOwner that logged the exercise.

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam the work applies to."
      - name: owner_id
        type: string
        source: system
        description: "FK -> Owner.id; applicant, copied from the dam at application time."
      - name: review_engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id; assigned engineering reviewer; null until assignment."
      - name: permit_type
        type: enum
        source: input
        description: Work class; drives the engineering-review fee percentage and the safety gate.
        constraints: "CONSTRUCTION | REPAIR | REMOVAL"
      - name: scope_description
        type: string
        source: input
        description: Narrative scope of the proposed work.
      - name: estimated_project_cost_cents
        type: integer
        source: input
        description: Applicant's estimated construction cost; drives the base fee tier.
        constraints: "> 0"
      - name: proposed_start_date
        type: datetime
        source: input
        description: Proposed construction start instant.
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Tiered base application fee (calculations.permit_fee_schedule step 1)."
      - name: engineering_review_fee_cents
        type: integer
        source: computed
        description: "Percentage review fee with hazard uplift and cap (calculations.permit_fee_schedule step 3)."
      - name: delinquency_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Surcharge applied when the owner was DELINQUENT at application time (step 5)."
      - name: volume_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Program credit granted when the pre-credit total reaches VOLUME_CREDIT_THRESHOLD_CENTS (step 7)."
      - name: total_fee_cents
        type: integer
        source: computed
        description: "pre_credit_total_cents - volume_credit_cents (step 8); posted to the owner's ledger at application time."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Application lifecycle state.
        constraints: "SUBMITTED | UNDER_ENGINEERING_REVIEW | ISSUED | DENIED | RETURNED_FOR_REVISION"
      - name: decision_findings
        type: string
        source: input
        description: Reviewing engineer's findings recorded with the decision; null before decision.
      - name: conditions
        type: string
        source: input
        description: Conditions attached to an issued permit; null when unconditioned or before decision.
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: Number of times the application has been returned for revision and resubmitted.
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant of issuance; null unless status == ISSUED.

  - name: HighWaterEvent
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam being monitored."
      - name: declared_at
        type: datetime
        source: input
        description: Instant the event was declared by the emergency coordinator.
      - name: trigger_description
        type: string
        source: input
        description: Hydrologic trigger that prompted the declaration.
      - name: declared_inflow_cfs
        type: number
        source: input
        description: Inflow estimate at declaration.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: MONITORING
        description: Event posture; EMERGENCY is reached only by the auto-escalation cascade from a reading.
        constraints: "MONITORING | EMERGENCY | STOOD_DOWN"
      - name: current_alert_level
        type: enum
        source: computed
        default: NORMAL
        description: "alert_level of the latest ElevationReading by reading_at DESC (tie-break created_at ASC); NORMAL while no reading exists."
        constraints: "NORMAL | WATCH | CRITICAL | OVERTOPPING"
      - name: peak_pool_elevation_ft
        type: number
        source: computed
        description: Greatest pool_elevation_ft over this event's ElevationReading rows; null while none exists.
      - name: reading_count
        type: integer
        source: computed
        default: 0
        description: Count of ElevationReading rows for this event.
      - name: escalated_at
        type: datetime
        source: computed
        description: Logical-clock instant of auto-escalation to EMERGENCY; null while never escalated.
      - name: stood_down_at
        type: datetime
        source: computed
        description: Logical-clock instant of stand-down; null unless status == STOOD_DOWN.
      - name: final_pool_elevation_ft
        type: number
        source: input
        description: Pool elevation recorded at stand-down; null unless status == STOOD_DOWN.

  - name: ElevationReading
    parent: null
    common_fields: false
    fields:
      - name: high_water_event_id
        type: string
        source: input
        description: "FK -> HighWaterEvent.id; event the reading belongs to."
      - name: reading_at
        type: datetime
        source: input
        description: Instant of the pool observation; must be at or before the current logical clock.
      - name: pool_elevation_ft
        type: number
        source: input
        description: Observed reservoir pool elevation.
      - name: observed_inflow_cfs
        type: number
        source: input
        description: Observed inflow at the reading instant.
        constraints: ">= 0"
      - name: freeboard_ft
        type: number
        source: computed
        description: "Dam.crest_elevation_ft - pool_elevation_ft, rounded half-up to 2 decimals (calculations.reading_freeboard_and_alert)."
      - name: alert_level
        type: enum
        source: computed
        description: Freeboard threshold band for this reading.
        constraints: "NORMAL | WATCH | CRITICAL | OVERTOPPING"
      - name: rising
        type: boolean
        source: computed
        description: "true when a prior reading on the same event exists (reading_at ASC, tie-break created_at ASC) and this pool_elevation_ft exceeds it."
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the EmergencyCoordinator that recorded the reading.

  - name: DrawdownOrder
    parent: null
    common_fields: true
    fields:
      - name: dam_id
        type: string
        source: input
        description: "FK -> Dam.id; dam ordered to release."
      - name: river_reach_id
        type: string
        source: system
        description: "FK -> RiverReach.id; copied from the dam at request time; the reach whose capacity the release consumes."
      - name: high_water_event_id
        type: string
        source: input
        description: "FK -> HighWaterEvent.id; event under which the release is coordinated."
      - name: requested_release_cfs
        type: integer
        source: input
        description: Sustained release rate requested for the window.
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the release window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the release window.
        constraints: "> window_start"
      - name: planned_release_acre_ft
        type: number
        source: computed
        description: "Volume the window would release (calculations.drawdown_volume_conservation)."
      - name: actual_release_acre_ft
        type: number
        source: input
        description: Volume actually released, supplied at completion; null before completion.
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Drawdown lifecycle state.
        constraints: "REQUESTED | COORDINATED | ACTIVE | COMPLETED | CANCELLED"
      - name: coordinated_at
        type: datetime
        source: computed
        description: Logical-clock instant at which reach capacity and dam storage were committed; null before coordination.
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant the gates were opened; null before activation.
      - name: completed_at
        type: datetime
        source: computed
        description: Logical-clock instant of completion; null unless status == COMPLETED.
      - name: cancelled_at
        type: datetime
        source: computed
        description: Logical-clock instant of cancellation; null unless status == CANCELLED.
      - name: cancel_reason
        type: string
        source: input
        description: Reason supplied at cancellation; null unless status == CANCELLED.

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; owner whose balance the entry moves."
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-owner posting sequence starting at 1; the only ordering key for running-balance replay."
      - name: entry_type
        type: enum
        source: input
        description: "Ledger reason; PERMIT_REVIEW_FEE is system-posted only."
        constraints: "PERMIT_REVIEW_FEE | ANNUAL_REGISTRATION_FEE | CIVIL_PENALTY | PENALTY_ABATEMENT | PAYMENT_RECEIVED | FEE_VOID"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount; positive increases the owed balance, negative reduces it."
        constraints: "!= 0; sign must match entry_type per validations priority 30"
      - name: source_ref
        type: string
        source: input
        description: Free-text reference to the originating permit or order; null when unrelated.
      - name: memo
        type: string
        source: input
        description: Operator memo; null when omitted.
      - name: balance_after_cents
        type: integer
        source: computed
        description: "Running owner balance after this entry, replayed over sequence_no ASC."
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the poster, or "SYSTEM" for cascade-posted entries.

# =============================================================================
# §1.2 State Machine Table
#   Dam carries TWO independent state dimensions (safety_status, regulatory_status);
#   each is listed as its own machine and identified by `state_field:`.
# =============================================================================
state_machines:
  - entity: Dam
    state_field: safety_status
    initial_state: UNRATED
    terminal_states: []
    note: |
      Advanced ONLY by inspection acceptance. The target state always equals the accepted
      Inspection.condition_rating, so every (from, to) pair over
      {UNRATED, SATISFACTORY, CONDITIONALLY_SATISFACTORY, POOR, UNSATISFACTORY} is legal
      under the same rule; the four rows below are the named representatives. No transition
      on this dimension ever writes regulatory_status, and nothing on the regulatory_status
      dimension ever writes safety_status.
    transitions:
      - from: UNRATED
        to: CONDITIONALLY_SATISFACTORY
        trigger: "POST /inspections/{id}/accept"
        actor: ProgramAdmin | Engineer
        preconditions:
          - "Inspection.status == SUBMITTED"
          - "Inspection.condition_rating == CONDITIONALLY_SATISFACTORY"
          - "acting X-User-ID != Inspection.engineer_id (segregation of duties)"
        side_effects:
          - "Dam.safety_status = Inspection.condition_rating"
          - "Inspection.status = ACCEPTED; accepted_at = clock; accepted_by_user_id = acting X-User-ID"
          - "when Inspection.inspection_type == PERIODIC: recompute Dam.next_inspection_due_at from performed_at per calculations.inspection_due_schedule, then recompute Dam.inspection_overdue"
          - "increments Dam.version by 1"
          - "Dam.regulatory_status is NOT touched"
      - from: UNRATED
        to: UNSATISFACTORY
        trigger: "POST /inspections/{id}/accept"
        actor: ProgramAdmin | Engineer
        preconditions:
          - "Inspection.status == SUBMITTED"
          - "Inspection.condition_rating == UNSATISFACTORY"
          - "acting X-User-ID != Inspection.engineer_id"
        side_effects:
          - "Dam.safety_status = UNSATISFACTORY, which blocks CONSTRUCTION permit issuance via validations priority 22"
          - "Inspection.status = ACCEPTED; accepted_at = clock; accepted_by_user_id = acting X-User-ID"
          - "when inspection_type == PERIODIC: recompute Dam.next_inspection_due_at and Dam.inspection_overdue"
          - "increments Dam.version by 1"
      - from: CONDITIONALLY_SATISFACTORY
        to: POOR
        trigger: "POST /inspections/{id}/accept"
        actor: ProgramAdmin | Engineer
        preconditions:
          - "Inspection.status == SUBMITTED"
          - "Inspection.condition_rating == POOR"
          - "acting X-User-ID != Inspection.engineer_id"
        side_effects:
          - "Dam.safety_status = POOR"
          - "Inspection.status = ACCEPTED; accepted_at = clock"
          - "increments Dam.version by 1"
      - from: POOR
        to: SATISFACTORY
        trigger: "POST /inspections/{id}/accept"
        actor: ProgramAdmin | Engineer
        preconditions:
          - "Inspection.status == SUBMITTED"
          - "Inspection.condition_rating == SATISFACTORY"
          - "acting X-User-ID != Inspection.engineer_id"
        side_effects:
          - "Dam.safety_status = SATISFACTORY"
          - "Inspection.status = ACCEPTED; accepted_at = clock"
          - "increments Dam.version by 1"

  - entity: Dam
    state_field: regulatory_status
    initial_state: REGISTERED
    terminal_states: [BREACHED]
    note: |
      Advanced ONLY by enforcement default, order satisfaction, removal permitting and state
      intervention. REGISTERED <-> UNDER_ENFORCEMENT is a genuine cycle. Nothing here reads or
      writes safety_status.
    transitions:
      - from: REGISTERED
        to: UNDER_ENFORCEMENT
        trigger: "POST /program/compliance-sweep (system, cascade link 4 of the enforcement chain)"
        actor: system
        preconditions:
          - "a RemediationOrder on this dam moved to DEFAULTED in this sweep"
          - "the CIVIL_PENALTY posted for that default pushed Owner.delinquency_status from CURRENT to DELINQUENT"
        side_effects:
          - "Dam.regulatory_status = UNDER_ENFORCEMENT"
          - "increments Dam.version by 1"
          - "Dam.safety_status is NOT touched"
      - from: UNDER_ENFORCEMENT
        to: REGISTERED
        trigger: "POST /remediation-orders/{id}/verify (outcome=SATISFIED)"
        actor: Engineer
        preconditions:
          - "RemediationOrder.status == RESPONSE_FILED"
          - "after this verification no Deficiency on this dam has status ESCALATED"
          - "Owner.delinquency_status == CURRENT at the moment of verification (the assessed penalty has been settled through the fee ledger)"
        side_effects:
          - "Dam.regulatory_status = REGISTERED (cycle back)"
          - "increments Dam.version by 1"
      - from: REGISTERED
        to: REMOVAL_PERMITTED
        trigger: "POST /permits/{id}/decision (decision=ISSUE)"
        actor: Engineer
        preconditions:
          - "Permit.status == UNDER_ENGINEERING_REVIEW"
          - "Permit.permit_type == REMOVAL"
        side_effects:
          - "Dam.regulatory_status = REMOVAL_PERMITTED"
          - "Permit.status = ISSUED; issued_at = clock"
          - "increments Dam.version by 1"
      - from: REGISTERED
        to: STATE_INTERVENTION
        trigger: "POST /dams/{id}/state-intervention (intervention_type in {ABANDONMENT_TAKEOVER, EMERGENCY_REPAIR})"
        actor: ProgramAdmin
        preconditions:
          - "Dam.regulatory_status in {REGISTERED, UNDER_ENFORCEMENT}"
        side_effects:
          - "Dam.regulatory_status = STATE_INTERVENTION"
          - "every DrawdownOrder on this dam whose status is in {REQUESTED, COORDINATED, ACTIVE} is CANCELLED with cancel_reason = 'STATE_INTERVENTION', releasing reach and storage commitments per calculations.drawdown_volume_conservation"
          - "increments Dam.version by 1"
      - from: UNDER_ENFORCEMENT
        to: STATE_INTERVENTION
        trigger: "POST /dams/{id}/state-intervention (intervention_type in {ABANDONMENT_TAKEOVER, EMERGENCY_REPAIR})"
        actor: ProgramAdmin
        preconditions:
          - "Dam.regulatory_status in {REGISTERED, UNDER_ENFORCEMENT}"
        side_effects:
          - "Dam.regulatory_status = STATE_INTERVENTION"
          - "increments Dam.version by 1"
      - from: STATE_INTERVENTION
        to: BREACHED
        trigger: "POST /dams/{id}/state-intervention (intervention_type=BREACH_ORDER)"
        actor: ProgramAdmin
        preconditions:
          - "Dam.regulatory_status in {REGISTERED, UNDER_ENFORCEMENT, STATE_INTERVENTION}"
        side_effects:
          - "Dam.regulatory_status = BREACHED (terminal; all further consequence certification, inspection scheduling, permitting and drawdown requests are rejected with ERR_DAM_NOT_OPERABLE)"
          - "every Deficiency on this dam whose status is in {OPEN, ORDERED, REMEDIATION_SUBMITTED, ESCALATED} is closed as CLOSED_VERIFIED with closed_at = clock, and Dam.open_deficiency_count becomes 0"
          - "increments Dam.version by 1"

  - entity: ConsequenceAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /consequence-assessments/{id}/certify"
        actor: Engineer
        preconditions:
          - "ConsequenceAssessment.status == DRAFT"
          - "Dam.regulatory_status != BREACHED"
          - "breach_travel_time_minutes > 0 AND inundation_area_acres > 0 AND breach_peak_outflow_cfs > 0 (else ERR_BREACH_ANALYSIS_INCOMPLETE)"
        side_effects:
          - "certified_score and certified_hazard_class written per calculations.breach_consequence_score (certified variant) and calculations.hazard_classification; certified_at = clock"
          - "CASCADE link 1 — because this row became the dam's certification of record, the dam's previously CERTIFIED ConsequenceAssessment (there is at most one) moves CERTIFIED -> SUPERSEDED with superseded_at = clock"
          - "CASCADE link 2 — because link 1 replaced the classification source, Dam.hazard_class = certified_hazard_class, Dam.current_consequence_score = certified_score, Dam.eap_required recomputed, Dam.next_inspection_due_at recomputed per calculations.inspection_due_schedule and Dam.inspection_overdue recomputed"
          - "CASCADE link 3 — because link 2 changed the classification, any EmergencyActionPlan on this dam with status == APPROVED whose inundation_map_ref != this assessment's inundation_map_ref moves APPROVED -> REVISION_REQUIRED, expires_at = null, and Dam.latest_eap_status is refreshed"
          - "CASCADE link 4 — because link 3 left an eap_required dam with no APPROVED plan, a Deficiency is created (source=SYSTEM_EAP, category=EAP_MISSING, severity=SERIOUS, status=OPEN, inspection_id=null) unless such a row already exists in {OPEN, ORDERED, REMEDIATION_SUBMITTED, ESCALATED}, and Dam.open_deficiency_count is incremented. This link fires ONLY as a consequence of link 3 actually moving a plan out of APPROVED: certifying an assessment on a dam that has never had an APPROVED plan creates no deficiency"
          - "increments Dam.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /consequence-assessments/{id}/certify on a newer assessment for the same dam (system)"
        actor: system
        preconditions:
          - "another ConsequenceAssessment for the same dam_id transitioned DRAFT -> CERTIFIED in this request"
        side_effects:
          - "status = SUPERSEDED; superseded_at = clock"
          - "this row stops contributing to Dam.hazard_class"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED]
    note: "Cyclic: SUBMITTED -> RETURNED -> SUBMITTED may repeat without bound; return_count records the loop count."
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit"
        actor: Engineer
        preconditions:
          - "Inspection.status in {SCHEDULED, RETURNED}"
          - "acting X-User-ID == Inspection.engineer_id (else ERR_NOT_ASSIGNED_ENGINEER)"
          - "Engineer.license_status == ACTIVE (validations priority 20)"
          - "Dam.hazard_class in Engineer.certified_hazard_classes (validations priority 21)"
          - "window_start <= performed_at < window_end (validations priority 26)"
          - "performed_at <= current logical clock (validations priority 27)"
        side_effects:
          - "performed_at, condition_rating and narrative are stored"
          - "one Deficiency row (source=INSPECTION, status=OPEN) is created per element of the submitted deficiencies array; Inspection.deficiency_count is set to that length"
          - "Dam.open_deficiency_count increases by the number of created rows; increments Dam.version by 1 when that count changes"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit (resubmission after return — cycle)"
        actor: Engineer
        preconditions:
          - "Inspection.status in {SCHEDULED, RETURNED}"
          - "acting X-User-ID == Inspection.engineer_id"
          - "Engineer.license_status == ACTIVE"
        side_effects:
          - "performed_at, condition_rating and narrative are overwritten with the resubmitted values"
          - "Deficiency rows created by the previous submission and still in status OPEN are deleted and replaced by the new deficiencies array; Dam.open_deficiency_count is recomputed"
          - "increments Dam.version by 1 when Dam.open_deficiency_count changes"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /inspections/{id}/return"
        actor: ProgramAdmin
        preconditions:
          - "Inspection.status == SUBMITTED"
        side_effects:
          - "return_count += 1; narrative retained; performed_at retained"
          - "Dam.safety_status is NOT changed by a return"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /inspections/{id}/accept"
        actor: ProgramAdmin | Engineer
        preconditions:
          - "Inspection.status == SUBMITTED"
          - "acting X-User-ID != Inspection.engineer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "see state_machines.Dam(safety_status): Dam.safety_status = condition_rating, PERIODIC acceptance recomputes Dam.next_inspection_due_at and Dam.inspection_overdue"
          - "accepted_at = clock; accepted_by_user_id = acting X-User-ID"
          - "increments Dam.version by 1"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [CLOSED_VERIFIED]
    note: "Cyclic: ORDERED -> REMEDIATION_SUBMITTED -> ORDERED on rejected remediation, and ESCALATED -> ORDERED on reissue."
    transitions:
      - from: OPEN
        to: ORDERED
        trigger: "POST /deficiencies/{id}/remediation-orders"
        actor: ProgramAdmin
        preconditions:
          - "Deficiency.status in {OPEN, ESCALATED}"
          - "Dam.regulatory_status != BREACHED"
        side_effects:
          - "a RemediationOrder is created with status ISSUED, issued_at = clock, effective_response_days / compliance_deadline_at / daily_penalty_rate_cents per calculations.remediation_deadline"
          - "Deficiency.remediation_due_at = the new order's compliance_deadline_at; order_count += 1"
      - from: ESCALATED
        to: ORDERED
        trigger: "POST /deficiencies/{id}/remediation-orders (reissue after default — cycle)"
        actor: ProgramAdmin
        preconditions:
          - "Deficiency.status in {OPEN, ESCALATED}"
        side_effects:
          - "a further RemediationOrder is created; Deficiency.remediation_due_at is replaced by the new order's compliance_deadline_at; order_count += 1"
      - from: ORDERED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /remediation-orders/{id}/response"
        actor: DamOwner
        preconditions:
          - "RemediationOrder.status == ISSUED"
          - "acting X-User-ID == RemediationOrder.owner_id"
        side_effects:
          - "RemediationOrder.status = RESPONSE_FILED; response_filed_at = clock when null (never overwritten on a later re-response, so the good-faith abatement flag survives rejection)"
      - from: REMEDIATION_SUBMITTED
        to: CLOSED_VERIFIED
        trigger: "POST /remediation-orders/{id}/verify (outcome=SATISFIED)"
        actor: Engineer
        preconditions:
          - "RemediationOrder.status == RESPONSE_FILED"
        side_effects:
          - "RemediationOrder.status = SATISFIED; verified_by_user_id = acting X-User-ID"
          - "Deficiency.status = CLOSED_VERIFIED; closed_at = clock; Dam.open_deficiency_count -= 1; increments Dam.version by 1"
          - "when no Deficiency on the dam is left in status ESCALATED and Owner.delinquency_status == CURRENT, Dam.regulatory_status returns UNDER_ENFORCEMENT -> REGISTERED"
      - from: REMEDIATION_SUBMITTED
        to: ORDERED
        trigger: "POST /remediation-orders/{id}/verify (outcome=REJECTED — cycle)"
        actor: Engineer
        preconditions:
          - "RemediationOrder.status == RESPONSE_FILED"
        side_effects:
          - "RemediationOrder.status returns to ISSUED with response_filed_at retained; verified_by_user_id = acting X-User-ID"
          - "Deficiency.status = ORDERED; remediation_due_at unchanged (the original deadline still runs)"
      - from: ORDERED
        to: ESCALATED
        trigger: "POST /program/compliance-sweep (system, cascade link 1 of the enforcement chain)"
        actor: system
        preconditions:
          - "the deficiency's most recent RemediationOrder has status in {ISSUED, RESPONSE_FILED} and clock > that order's compliance_deadline_at"
        side_effects:
          - "Deficiency.status = ESCALATED (the order moves to DEFAULTED in the same sweep step)"

  - entity: RemediationOrder
    initial_state: ISSUED
    terminal_states: [SATISFIED, REFERRED_FOR_ENFORCEMENT]
    note: "Cyclic: ISSUED -> RESPONSE_FILED -> ISSUED whenever verification rejects the owner's corrective work."
    transitions:
      - from: ISSUED
        to: RESPONSE_FILED
        trigger: "POST /remediation-orders/{id}/response"
        actor: DamOwner
        preconditions:
          - "RemediationOrder.status == ISSUED"
          - "acting X-User-ID == RemediationOrder.owner_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "corrective_action_summary and completed_at stored; response_filed_at = clock when currently null"
          - "Deficiency.status = REMEDIATION_SUBMITTED"
      - from: RESPONSE_FILED
        to: SATISFIED
        trigger: "POST /remediation-orders/{id}/verify (outcome=SATISFIED)"
        actor: Engineer
        preconditions:
          - "RemediationOrder.status == RESPONSE_FILED"
        side_effects:
          - "Deficiency.status = CLOSED_VERIFIED; Dam.open_deficiency_count -= 1"
          - "possible Dam.regulatory_status UNDER_ENFORCEMENT -> REGISTERED"
      - from: RESPONSE_FILED
        to: ISSUED
        trigger: "POST /remediation-orders/{id}/verify (outcome=REJECTED — cycle)"
        actor: Engineer
        preconditions:
          - "RemediationOrder.status == RESPONSE_FILED"
        side_effects:
          - "Deficiency.status = ORDERED; response_filed_at retained so calculations.civil_penalty_accrual still applies the good-faith abatement at default"
      - from: ISSUED
        to: DEFAULTED
        trigger: "POST /program/compliance-sweep (system)"
        actor: system
        preconditions:
          - "clock > compliance_deadline_at"
          - "status in {ISSUED, RESPONSE_FILED}"
        side_effects:
          - "CASCADE link 1 — status = DEFAULTED; defaulted_at = clock; assessed_penalty_cents written per calculations.civil_penalty_accrual (final_assessment variant); the Deficiency moves ORDERED -> ESCALATED"
          - "CASCADE link 2 — because link 1 assessed a penalty, a FeeLedgerEntry (entry_type=CIVIL_PENALTY, amount_cents=assessed_penalty_cents, posted_by_user_id='SYSTEM', source_ref=order id) is appended and Owner.fee_balance_cents / balance_after_cents recomputed"
          - "CASCADE link 3 — because link 2 moved the balance across DELINQUENCY_THRESHOLD_CENTS, Owner.delinquency_status becomes DELINQUENT"
          - "CASCADE link 4 — because link 3 made the owner DELINQUENT, Dam.regulatory_status moves REGISTERED -> UNDER_ENFORCEMENT and Dam.version increments"
      - from: RESPONSE_FILED
        to: DEFAULTED
        trigger: "POST /program/compliance-sweep (system)"
        actor: system
        preconditions:
          - "clock > compliance_deadline_at"
          - "status in {ISSUED, RESPONSE_FILED}"
        side_effects:
          - "identical four-link cascade as ISSUED -> DEFAULTED, except that response_filed_at is non-null so the final penalty carries the GOOD_FAITH_ABATEMENT_PCT reduction"
      - from: DEFAULTED
        to: REFERRED_FOR_ENFORCEMENT
        trigger: "POST /program/compliance-sweep (system)"
        actor: system
        preconditions:
          - "status == DEFAULTED"
          - "clock > defaulted_at + REFERRAL_DAYS days"
        side_effects:
          - "status = REFERRED_FOR_ENFORCEMENT (terminal); no further penalty is assessed on this order"

  - entity: EmergencyActionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    note: "Cyclic: SUBMITTED -> REVISION_REQUIRED -> SUBMITTED, and APPROVED -> REVISION_REQUIRED on reclassification."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /emergency-action-plans/{id}/submit"
        actor: DamOwner
        preconditions:
          - "EmergencyActionPlan.status in {DRAFT, REVISION_REQUIRED}"
          - "acting X-User-ID == Dam.owner_id"
          - "notification_contact_count >= MIN_NOTIFICATION_CONTACTS[Dam.hazard_class] per calculations.hazard_class_program_requirements (validations priority 31)"
          - "when Dam.eap_required: inundation_map_ref == the dam's CERTIFIED ConsequenceAssessment.inundation_map_ref (validations priority 32)"
        side_effects:
          - "optional inundation_map_ref / notification_contact_count / notification_flowchart_ref supplied on the submit call overwrite the stored values before the two checks above run"
          - "Dam.latest_eap_status = SUBMITTED; increments Dam.version by 1"
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /emergency-action-plans/{id}/submit (resubmission — cycle)"
        actor: DamOwner
        preconditions:
          - "EmergencyActionPlan.status in {DRAFT, REVISION_REQUIRED}"
          - "acting X-User-ID == Dam.owner_id"
        side_effects:
          - "review_findings retained; Dam.latest_eap_status = SUBMITTED; increments Dam.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /emergency-action-plans/{id}/review (decision=APPROVE)"
        actor: Engineer
        preconditions:
          - "EmergencyActionPlan.status == SUBMITTED"
          - "Engineer.license_status == ACTIVE"
        side_effects:
          - "approved_at = clock; expires_at = approved_at + EAP_VALIDITY_MONTHS[Dam.hazard_class] per calculations.hazard_class_program_requirements (null for LOW)"
          - "any other EmergencyActionPlan on the same dam with status == APPROVED moves APPROVED -> SUPERSEDED"
          - "Dam.latest_eap_status = APPROVED; increments Dam.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /emergency-action-plans/{id}/review (decision=REVISE)"
        actor: Engineer
        preconditions:
          - "EmergencyActionPlan.status == SUBMITTED"
        side_effects:
          - "review_findings stored; Dam.latest_eap_status = REVISION_REQUIRED; increments Dam.version by 1"
      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "POST /consequence-assessments/{id}/certify (system, cascade link 3 of the reclassification chain)"
        actor: system
        preconditions:
          - "the dam's hazard classification was replaced by a newly certified assessment"
          - "this plan's inundation_map_ref != the newly certified assessment's inundation_map_ref"
        side_effects:
          - "status = REVISION_REQUIRED; expires_at = null; Dam.latest_eap_status refreshed"
          - "triggers cascade link 4: the SYSTEM_EAP / EAP_MISSING Deficiency"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /emergency-action-plans/{id}/review (decision=APPROVE) on a newer plan for the same dam (system)"
        actor: system
        preconditions:
          - "another EmergencyActionPlan for the same dam_id moved SUBMITTED -> APPROVED in this request"
        side_effects:
          - "status = SUPERSEDED (terminal); expires_at retained for the audit record; exercises already logged remain attached to this row"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /program/compliance-sweep (system)"
        actor: system
        preconditions:
          - "expires_at is non-null and clock > expires_at"
        side_effects:
          - "status = EXPIRED (terminal); Dam.latest_eap_status = EXPIRED"
          - "when Dam.eap_required, a Deficiency (source=SYSTEM_EAP, category=EAP_MISSING, severity=SERIOUS, status=OPEN) is created unless an unclosed row of that category already exists; Dam.open_deficiency_count updated; increments Dam.version by 1"

  - entity: Permit
    initial_state: SUBMITTED
    terminal_states: [ISSUED, DENIED]
    note: "Cyclic: UNDER_ENGINEERING_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED, bounded only by revision_count."
    transitions:
      - from: SUBMITTED
        to: UNDER_ENGINEERING_REVIEW
        trigger: "POST /permits/{id}/assign-review"
        actor: ProgramAdmin
        preconditions:
          - "Permit.status == SUBMITTED"
          - "review_engineer_id resolves to an Engineer with license_status == ACTIVE"
          - "review_engineer_id != the engineer_id of the dam's latest ACCEPTED Inspection (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "review_engineer_id stored; status = UNDER_ENGINEERING_REVIEW"
      - from: UNDER_ENGINEERING_REVIEW
        to: ISSUED
        trigger: "POST /permits/{id}/decision (decision=ISSUE)"
        actor: Engineer
        preconditions:
          - "Permit.status == UNDER_ENGINEERING_REVIEW"
          - "acting X-User-ID == Permit.review_engineer_id"
          - "NOT (Dam.safety_status == UNSATISFACTORY AND permit_type == CONSTRUCTION) (validations priority 22)"
          - "when Dam.hazard_class == HIGH: Dam.latest_eap_status == APPROVED (validations priority 23)"
          - "Owner.delinquency_status == CURRENT (validations priority 35)"
          - "when Dam.hazard_class == HIGH: Owner.financial_assurance_bond_cents >= MIN_HIGH_HAZARD_BOND_CENTS per calculations.hazard_class_program_requirements (validations priority 36)"
        side_effects:
          - "status = ISSUED; issued_at = clock; conditions and decision_findings stored"
          - "when permit_type == REMOVAL: Dam.regulatory_status REGISTERED -> REMOVAL_PERMITTED and Dam.version increments"
      - from: UNDER_ENGINEERING_REVIEW
        to: DENIED
        trigger: "POST /permits/{id}/decision (decision=DENY)"
        actor: Engineer
        preconditions:
          - "Permit.status == UNDER_ENGINEERING_REVIEW"
          - "acting X-User-ID == Permit.review_engineer_id"
        side_effects:
          - "status = DENIED (terminal); decision_findings stored; the review fee already posted to the ledger is NOT refunded"
      - from: UNDER_ENGINEERING_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /permits/{id}/decision (decision=RETURN)"
        actor: Engineer
        preconditions:
          - "Permit.status == UNDER_ENGINEERING_REVIEW"
          - "acting X-User-ID == Permit.review_engineer_id"
        side_effects:
          - "status = RETURNED_FOR_REVISION; decision_findings stored; review_engineer_id retained"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /permits/{id}/resubmit (cycle)"
        actor: DamOwner
        preconditions:
          - "Permit.status == RETURNED_FOR_REVISION"
          - "acting X-User-ID == Permit.owner_id"
        side_effects:
          - "scope_description and estimated_project_cost_cents overwritten; revision_count += 1; review_engineer_id cleared to null"
          - "the fee schedule is re-evaluated per calculations.permit_fee_schedule and the DELTA between the new total_fee_cents and the previously posted total is appended as a FeeLedgerEntry (entry_type=PERMIT_REVIEW_FEE when positive, FEE_VOID when negative); a zero delta appends nothing"

  - entity: HighWaterEvent
    initial_state: MONITORING
    terminal_states: [STOOD_DOWN]
    transitions:
      - from: MONITORING
        to: EMERGENCY
        trigger: "POST /high-water-events/{id}/readings (system auto-escalation)"
        actor: system
        preconditions:
          - "HighWaterEvent.status == MONITORING"
          - "the new reading's alert_level is in {CRITICAL, OVERTOPPING} AND its rising flag is true"
        side_effects:
          - "status = EMERGENCY; escalated_at = clock"
          - "DrawdownOrder activation on this event becomes legal (validations priority 24)"
      - from: MONITORING
        to: STOOD_DOWN
        trigger: "POST /high-water-events/{id}/stand-down"
        actor: EmergencyCoordinator
        preconditions:
          - "HighWaterEvent.status in {MONITORING, EMERGENCY}"
        side_effects:
          - "status = STOOD_DOWN; stood_down_at = clock; final_pool_elevation_ft stored"
          - "every DrawdownOrder on this event whose status is in {REQUESTED, COORDINATED, ACTIVE} is CANCELLED with cancel_reason = 'EVENT_STOOD_DOWN'; each cancellation releases the reach and storage commitments exactly per calculations.drawdown_volume_conservation"
      - from: EMERGENCY
        to: STOOD_DOWN
        trigger: "POST /high-water-events/{id}/stand-down"
        actor: EmergencyCoordinator
        preconditions:
          - "HighWaterEvent.status in {MONITORING, EMERGENCY}"
        side_effects:
          - "status = STOOD_DOWN; stood_down_at = clock"
          - "the same cancellation cascade over this event's non-terminal DrawdownOrder rows"

  - entity: DrawdownOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: COORDINATED
        trigger: "POST /drawdown-orders/{id}/coordinate"
        actor: ProgramAdmin
        preconditions:
          - "DrawdownOrder.status == REQUESTED"
          - "HighWaterEvent.status in {MONITORING, EMERGENCY}"
          - "expected_reach_version == RiverReach.version (else ERR_STALE_REACH_VERSION, concurrency_rules.drawdown-coordinate-stale-reach)"
          - "windowed reach capacity has room per calculations.reach_capacity_availability (validations priority 28)"
          - "planned_release_acre_ft <= Dam.available_conservation_storage_acre_ft (validations priority 29)"
        side_effects:
          - "status = COORDINATED; coordinated_at = clock"
          - "RiverReach.committed_release_cfs += requested_release_cfs; RiverReach.active_drawdown_count += 1; increments RiverReach.version by 1"
          - "Dam.committed_drawdown_acre_ft += planned_release_acre_ft; Dam.available_conservation_storage_acre_ft recomputed; increments Dam.version by 1"
      - from: COORDINATED
        to: ACTIVE
        trigger: "POST /drawdown-orders/{id}/activate"
        actor: EmergencyCoordinator
        preconditions:
          - "DrawdownOrder.status == COORDINATED"
          - "HighWaterEvent.status == EMERGENCY (else ERR_EVENT_NOT_IN_EMERGENCY)"
        side_effects:
          - "status = ACTIVE; activated_at = clock"
          - "reach and storage commitments are unchanged (they were taken at coordination)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /drawdown-orders/{id}/complete"
        actor: EmergencyCoordinator
        preconditions:
          - "DrawdownOrder.status == ACTIVE"
        side_effects:
          - "status = COMPLETED; completed_at = clock; actual_release_acre_ft stored"
          - "RiverReach.committed_release_cfs -= requested_release_cfs; active_drawdown_count -= 1; increments RiverReach.version by 1"
          - "Dam.committed_drawdown_acre_ft -= planned_release_acre_ft; available_conservation_storage_acre_ft recomputed back to the pre-coordination value; increments Dam.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /drawdown-orders/{id}/cancel"
        actor: ProgramAdmin | EmergencyCoordinator
        preconditions:
          - "DrawdownOrder.status in {REQUESTED, COORDINATED, ACTIVE}"
        side_effects:
          - "status = CANCELLED; cancelled_at = clock; cancel_reason stored"
          - "no commitment is released because a REQUESTED order never took one"
      - from: COORDINATED
        to: CANCELLED
        trigger: "POST /drawdown-orders/{id}/cancel (compensating action)"
        actor: ProgramAdmin | EmergencyCoordinator
        preconditions:
          - "DrawdownOrder.status in {REQUESTED, COORDINATED, ACTIVE}"
        side_effects:
          - "status = CANCELLED; cancelled_at = clock; cancel_reason stored"
          - "RiverReach.committed_release_cfs -= requested_release_cfs; active_drawdown_count -= 1; increments RiverReach.version by 1"
          - "Dam.committed_drawdown_acre_ft -= planned_release_acre_ft; available_conservation_storage_acre_ft recomputed; increments Dam.version by 1 — the pair (coordinate, cancel) leaves both conserved quantities exactly as they were"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /drawdown-orders/{id}/cancel (compensating action)"
        actor: ProgramAdmin | EmergencyCoordinator
        preconditions:
          - "DrawdownOrder.status in {REQUESTED, COORDINATED, ACTIVE}"
        side_effects:
          - "status = CANCELLED; cancelled_at = clock; actual_release_acre_ft stays null"
          - "the same exact release of reach capacity and dam storage as the COORDINATED -> CANCELLED row"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: eap-create-stale-dam
    parent_entity: Dam
    write_endpoint: "POST /emergency-action-plans"
    occ_field: "expected_dam_version"
    description: |
      Creating an EmergencyActionPlan against a Dam whose version has advanced since the
      client last observed it is rejected. A new plan legitimately supersedes the dam's
      current plan of record once approved, and every plan write refreshes
      Dam.latest_eap_status, so a writer holding a stale view of the dam would file a
      superseding plan without having seen the plan or classification that moved the dam.
      The check compares the submitted expected_dam_version to Dam.version.
    error_id: ERR_STALE_DAM_VERSION
    http_status: 412

  - rule_id: drawdown-coordinate-stale-reach
    parent_entity: RiverReach
    write_endpoint: "POST /drawdown-orders/{id}/coordinate"
    occ_field: "expected_reach_version"
    description: |
      Coordinating a DrawdownOrder consumes shared RiverReach capacity, so the request
      carries the reach version the coordinator last observed. Coordination of a different
      order on the same reach advances RiverReach.version; a coordination request still
      quoting the earlier version is rejected because its view of the reach's committed
      capacity is stale. The order's own status precondition (REQUESTED) is still satisfied
      in that situation, which is why the version check is required rather than implied.
    error_id: ERR_STALE_REACH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: breach_consequence_score
    description: |
      Downstream-consequence score for a dam breach, on a 0.00-100.00 scale, assembled from four
      independently capped components. Used to classify hazard potential. The screening variant is
      the cheap intake number computed at assessment creation; the certified variant is the
      engineer-certified number computed at certification, and the two DIVERGE for the same input
      row because screening ignores flood-wave travel time and economic loss entirely.
    trigger: "POST /consequence-assessments (screening variant) and POST /consequence-assessments/{id}/certify (certified variant)"
    inputs:
      - "ConsequenceAssessment.population_at_risk"
      - "ConsequenceAssessment.habitable_structures"
      - "ConsequenceAssessment.critical_facilities"
      - "ConsequenceAssessment.breach_travel_time_minutes"
      - "ConsequenceAssessment.inundation_area_acres"
    algorithm: weighted_scoring
    formula: |
      # travel-time multiplier (certified variant only)
      if breach_travel_time_minutes < TRAVEL_FAST_MINUTES:        mult = TRAVEL_MULT_FAST      # 1.5
      elif breach_travel_time_minutes < TRAVEL_MODERATE_MINUTES:  mult = TRAVEL_MULT_MODERATE  # 1.0
      else:                                                       mult = TRAVEL_MULT_SLOW      # 0.6

      population_component = min(POP_CAP,    population_at_risk * POP_WEIGHT * mult)
      structure_component  = min(STRUCT_CAP, habitable_structures * STRUCT_WEIGHT)
      infra_component      = min(INFRA_CAP,  critical_facilities * INFRA_WEIGHT)
      econ_component       = min(ECON_CAP,   floor(inundation_area_acres / ECON_ACRES_PER_POINT))

      score = round_half_up(population_component + structure_component
                            + infra_component + econ_component, 2)
      # Each component is capped BEFORE summing; the sum is never re-capped, so a score
      # can legitimately reach 100.00 only when all four components are at their caps.
    constants:
      POP_WEIGHT: 2.0
      POP_CAP: 60
      STRUCT_WEIGHT: 1.5
      STRUCT_CAP: 20
      INFRA_WEIGHT: 5.0
      INFRA_CAP: 15
      ECON_ACRES_PER_POINT: 100
      ECON_CAP: 5
      TRAVEL_FAST_MINUTES: 30
      TRAVEL_MODERATE_MINUTES: 120
      TRAVEL_MULT_FAST: 1.5
      TRAVEL_MULT_MODERATE: 1.0
      TRAVEL_MULT_SLOW: 0.6
    precision: "2 decimal places, round_half_up"
    variants:
      - name: screening
        when: "computed at ConsequenceAssessment creation and stored in screening_score"
        difference: |
          The travel-time multiplier is forced to TRAVEL_MULT_MODERATE (1.0) regardless of
          breach_travel_time_minutes, and econ_component is forced to 0 because inundation area
          has not yet been engineer-verified. Every other term is identical.
      - name: certified
        when: "computed at POST /consequence-assessments/{id}/certify and stored in certified_score"
        difference: |
          The travel-time multiplier is applied to population_component and econ_component is
          included. For a fast-travel dam the certified score therefore EXCEEDS the screening
          score, and for a slow-travel dam it can fall BELOW it.

  - name: hazard_classification
    description: |
      Maps a certified consequence score plus raw population at risk onto the statutory hazard
      class. Population at risk can force HIGH on its own, so the score thresholds are not the
      only path into a class.
    trigger: "POST /consequence-assessments (recommended_hazard_class) and POST /consequence-assessments/{id}/certify (certified_hazard_class, copied to Dam.hazard_class)"
    inputs:
      - "the score produced by calculations.breach_consequence_score for the same variant"
      - "ConsequenceAssessment.population_at_risk"
    algorithm: threshold
    formula: |
      if population_at_risk >= PAR_HIGH_MIN:      return HIGH        # 25 or more lives at risk
      if score >= SCORE_HIGH_MIN:                 return HIGH        # 45.00 or above
      if score >= SCORE_SIGNIFICANT_MIN:          return SIGNIFICANT # 15.00 or above
      if population_at_risk >= PAR_SIGNIFICANT_MIN: return SIGNIFICANT  # any life at risk
      return LOW
      # Comparisons are inclusive at every threshold: a score of exactly 45.00 is HIGH and a
      # score of exactly 44.99 with population_at_risk 0 is SIGNIFICANT.
    constants:
      PAR_HIGH_MIN: 25
      PAR_SIGNIFICANT_MIN: 1
      SCORE_HIGH_MIN: 45.00
      SCORE_SIGNIFICANT_MIN: 15.00
    precision: "enum result; the score input is already rounded to 2 decimal places"

  - name: inspection_due_schedule
    description: |
      Periodic-inspection due date, driven entirely by hazard class. Recomputed whenever a
      PERIODIC inspection is accepted and whenever the dam's hazard class changes through
      certification, so a reclassification can make an already-inspected dam instantly overdue.
    trigger: "POST /inspections/{id}/accept (PERIODIC only), POST /consequence-assessments/{id}/certify, POST /program/compliance-sweep, GET /dams/{id}/compliance-summary"
    inputs:
      - "Dam.hazard_class"
      - "the dam's Inspection rows with status ACCEPTED and inspection_type PERIODIC"
      - "Dam.registered_at"
      - "the current logical clock"
    algorithm: forward_looking
    formula: |
      interval_months = INTERVAL_MONTHS_BY_CLASS[hazard_class]   # UNCLASSIFIED behaves as LOW
      baseline = performed_at of the ACCEPTED PERIODIC inspection with the greatest performed_at
                 (ties broken by created_at ASC, never by id)
      if no such inspection exists: baseline = Dam.registered_at
      next_inspection_due_at = baseline + interval_months calendar months
      inspection_overdue = (current logical clock > next_inspection_due_at)     # strict
      # Calendar-month addition preserves the day of month; 2019-04-15 + 24 months is
      # 2021-04-15. A clock exactly equal to next_inspection_due_at is NOT overdue.
    constants:
      INTERVAL_MONTHS_HIGH: 12
      INTERVAL_MONTHS_SIGNIFICANT: 24
      INTERVAL_MONTHS_LOW: 60
      INTERVAL_MONTHS_UNCLASSIFIED: 60
    precision: "whole calendar months; timestamps compared at full ISO-8601 instant precision"

  - name: remediation_deadline
    description: |
      Statutory response window granted by a remediation order. The base window comes from the
      deficiency severity and is then COMPRESSED by the dam's hazard class, floored and ceilinged,
      and finally intersected with whatever the issuing administrator requested — the state may
      grant less time than the schedule allows but never more.
    trigger: "POST /deficiencies/{id}/remediation-orders"
    inputs:
      - "Deficiency.severity"
      - "Dam.hazard_class"
      - "RemediationOrder.order_type"
      - "the requested response_days on the request body"
      - "the current logical clock (issued_at)"
    algorithm: threshold
    formula: |
      base   = BASE_RESPONSE_DAYS[severity]
      factor = HAZARD_FACTOR[hazard_class]
      allowed_days = max(MIN_RESPONSE_DAYS, min(MAX_RESPONSE_DAYS, floor(base * factor)))
      effective_response_days = min(requested_response_days, allowed_days)
      if order_type == EMERGENCY_ORDER:
          effective_response_days = min(effective_response_days, EMERGENCY_ORDER_MAX_DAYS)
      compliance_deadline_at  = issued_at + effective_response_days days
      daily_penalty_rate_cents = round_half_up(DAILY_BASE_CENTS[severity]
                                               * PENALTY_HAZARD_FACTOR[hazard_class])
      # floor() is applied to base*factor BEFORE the min/max clamp, so SERIOUS on a HIGH-hazard
      # dam is floor(45*0.5)=22 days, not 22.5 and not 23.
    constants:
      BASE_RESPONSE_DAYS_MINOR: 180
      BASE_RESPONSE_DAYS_MODERATE: 90
      BASE_RESPONSE_DAYS_SERIOUS: 45
      BASE_RESPONSE_DAYS_CRITICAL: 10
      HAZARD_FACTOR_HIGH: 0.5
      HAZARD_FACTOR_SIGNIFICANT: 0.75
      HAZARD_FACTOR_LOW: 1.0
      HAZARD_FACTOR_UNCLASSIFIED: 1.0
      MIN_RESPONSE_DAYS: 5
      MAX_RESPONSE_DAYS: 365
      EMERGENCY_ORDER_MAX_DAYS: 5
      REFERRAL_DAYS: 30
      DAILY_BASE_CENTS_MINOR: 2000
      DAILY_BASE_CENTS_MODERATE: 5000
      DAILY_BASE_CENTS_SERIOUS: 12500
      DAILY_BASE_CENTS_CRITICAL: 25000
      PENALTY_HAZARD_FACTOR_HIGH: 1.6
      PENALTY_HAZARD_FACTOR_SIGNIFICANT: 1.25
      PENALTY_HAZARD_FACTOR_LOW: 1.0
      PENALTY_HAZARD_FACTOR_UNCLASSIFIED: 1.0
    precision: "integer days; deadline is an ISO-8601 instant carrying issued_at's time of day"

  - name: civil_penalty_accrual
    description: |
      Daily civil penalty accrued between a missed compliance deadline and the sweep that detects
      the default. The daily rate steps up as the violation ages, and EACH DAY is rounded to whole
      cents before being added to the running total — summing unrounded day amounts and rounding
      once at the end produces a different number.
    trigger: "GET /remediation-orders/{id}/penalty-preview (provisional_preview variant) and POST /program/compliance-sweep (final_assessment variant)"
    inputs:
      - "RemediationOrder.daily_penalty_rate_cents"
      - "RemediationOrder.compliance_deadline_at"
      - "RemediationOrder.response_filed_at"
      - "the current logical clock"
    algorithm: chronological
    formula: |
      overdue_days = number of whole days by which the clock exceeds compliance_deadline_at
                     (floor of the elapsed interval; 0 when the clock is at or before the deadline)
      total = 0
      for d in 1 .. overdue_days:                       # strictly chronological, day 1 first
          if d <= TIER1_LAST_DAY:      day_factor = TIER1_FACTOR    # days 1-7    -> 1.0
          elif d <= TIER2_LAST_DAY:    day_factor = TIER2_FACTOR    # days 8-30   -> 1.15
          else:                        day_factor = TIER3_FACTOR    # day 31 on   -> 1.3225
          total += round_half_up(daily_penalty_rate_cents * day_factor)   # ROUND EACH DAY
      # provisional_preview stops here.
      # final_assessment continues:
      if total > MAX_PENALTY_CENTS: total = MAX_PENALTY_CENTS
      if response_filed_at is not null:
          total = total - round_half_up(total * GOOD_FAITH_ABATEMENT_PCT)
      assessed_penalty_cents = total
    constants:
      TIER1_LAST_DAY: 7
      TIER1_FACTOR: 1.0
      TIER2_LAST_DAY: 30
      TIER2_FACTOR: 1.15
      TIER3_FACTOR: 1.3225
      MAX_PENALTY_CENTS: 5000000
      GOOD_FAITH_ABATEMENT_PCT: 0.25
    precision: "whole cents; round_half_up applied per day, then again to the abatement amount"
    variants:
      - name: provisional_preview
        when: "GET /remediation-orders/{id}/penalty-preview, on an order that is still ISSUED or RESPONSE_FILED"
        difference: |
          Returns the raw tiered accrual with NO cap and NO good-faith abatement, so an order
          whose owner has filed a response previews a strictly larger number than the amount that
          will actually be assessed.
      - name: final_assessment
        when: "POST /program/compliance-sweep, at the moment the order moves to DEFAULTED"
        difference: |
          Applies MAX_PENALTY_CENTS first and the GOOD_FAITH_ABATEMENT_PCT reduction second (order
          matters: abating before capping would yield a different figure for a capped penalty), and
          writes the result to RemediationOrder.assessed_penalty_cents and a CIVIL_PENALTY ledger row.

  - name: permit_fee_schedule
    description: |
      Total permit fee. A flat tier by project cost, plus a percentage engineering-review fee that
      is itself capped, plus a delinquency surcharge, minus a volume credit. The credit is decided
      on the PRE-CREDIT total and is never re-evaluated afterwards, so a fee that drops below the
      credit threshold after the credit is applied still keeps the credit.
    trigger: "POST /permits, POST /permits/{id}/resubmit"
    inputs:
      - "Permit.estimated_project_cost_cents"
      - "Permit.permit_type"
      - "Dam.hazard_class"
      - "Owner.delinquency_status"
    algorithm: tiered_pricing
    formula: |
      # step 1 - flat base tier on project cost (upper bounds exclusive)
      if cost <  TIER1_MAX_CENTS:  base = TIER1_FEE_CENTS     # under      5,000,000 -> 25,000
      elif cost < TIER2_MAX_CENTS: base = TIER2_FEE_CENTS     # under     50,000,000 -> 100,000
      elif cost < TIER3_MAX_CENTS: base = TIER3_FEE_CENTS     # under    500,000,000 -> 350,000
      else:                        base = TIER4_FEE_CENTS     # 500,000,000 and over -> 900,000

      # step 2 - engineering review fee, percentage of cost, hazard-uplifted then capped
      pct    = REVIEW_PCT[permit_type]
      uplift = REVIEW_UPLIFT[hazard_class]
      review = min(REVIEW_FEE_CAP_CENTS, round_half_up(cost * pct * uplift))

      subtotal = base + review

      # step 3 - delinquency surcharge on the subtotal
      surcharge = round_half_up(subtotal * DELINQUENCY_SURCHARGE_PCT) if owner is DELINQUENT else 0
      pre_credit_total = subtotal + surcharge

      # step 4 - volume credit, decided ONCE on pre_credit_total
      credit = round_half_up(pre_credit_total * VOLUME_CREDIT_PCT) if pre_credit_total >= VOLUME_CREDIT_MIN_CENTS else 0

      total_fee_cents = pre_credit_total - credit
      # total_fee_cents may end up below VOLUME_CREDIT_MIN_CENTS; the credit is NOT withdrawn.
    constants:
      TIER1_MAX_CENTS: 5000000
      TIER1_FEE_CENTS: 25000
      TIER2_MAX_CENTS: 50000000
      TIER2_FEE_CENTS: 100000
      TIER3_MAX_CENTS: 500000000
      TIER3_FEE_CENTS: 350000
      TIER4_FEE_CENTS: 900000
      REVIEW_PCT_CONSTRUCTION: 0.0075
      REVIEW_PCT_REPAIR: 0.005
      REVIEW_PCT_REMOVAL: 0.0035
      REVIEW_UPLIFT_HIGH: 1.25
      REVIEW_UPLIFT_SIGNIFICANT: 1.10
      REVIEW_UPLIFT_LOW: 1.0
      REVIEW_UPLIFT_UNCLASSIFIED: 1.0
      REVIEW_FEE_CAP_CENTS: 750000
      DELINQUENCY_SURCHARGE_PCT: 0.15
      VOLUME_CREDIT_PCT: 0.10
      VOLUME_CREDIT_MIN_CENTS: 500000
    precision: "whole cents; round_half_up at the review fee, the surcharge and the credit independently"

  - name: eap_exercise_currency
    description: |
      Whether a dam's emergency action plan has a current annual exercise on record. Drives
      EmergencyActionPlan.exercise_current and gates HIGH-hazard permit issuance indirectly through the
      compliance summary.
    trigger: "POST /emergency-action-plans/{id}/exercises, POST /program/compliance-sweep, GET /dams/{id}/compliance-summary"
    inputs:
      - "the EapExercise rows of the dam's APPROVED EmergencyActionPlan"
      - "the current logical clock"
    algorithm: threshold
    formula: |
      window_start = clock - EXERCISE_WINDOW_DAYS days
      exercise_current = TRUE iff there exists an EapExercise on the dam's APPROVED plan with
          outcome == ACCEPTED
          AND conducted_at >  window_start        # STRICTLY greater: exactly 365 days old fails
          AND conducted_at <= clock
      # Exercises attached to SUPERSEDED or EXPIRED plans never count.
      last_accepted_exercise_at = the greatest conducted_at among the plan's ACCEPTED exercises
                                  (ties broken by created_at ASC), else null
      accepted_exercise_count   = the number of the plan's exercises with outcome == ACCEPTED
    constants:
      EXERCISE_WINDOW_DAYS: 365
    precision: "full ISO-8601 instant comparison; the lower bound is exclusive and the upper bound inclusive"

  - name: eap_exercise_evaluation
    description: |
      Grades a logged annual exercise. Participation minimums and permitted exercise types both
      scale with hazard class, and when several grading failures apply the FIRST one in the fixed
      order below is the recorded reason.
    trigger: "POST /emergency-action-plans/{id}/exercises"
    inputs:
      - "EapExercise.exercise_type"
      - "EapExercise.participant_count"
      - "EapExercise.notification_test_passed"
      - "Dam.hazard_class"
    algorithm: threshold
    formula: |
      reasons_in_order = []
      if notification_test_passed is false:               reasons_in_order += NOTIFICATION_TEST_FAILED
      if participant_count < MIN_PARTICIPANTS[hazard_class]: reasons_in_order += INSUFFICIENT_PARTICIPANTS
      if exercise_type not in PERMITTED_TYPES[hazard_class]: reasons_in_order += EXERCISE_TYPE_NOT_PERMITTED

      if reasons_in_order is empty:
          outcome = ACCEPTED;  deficiency_reason = null
      else:
          outcome = DEFICIENT; deficiency_reason = reasons_in_order[0]
          # and a Deficiency (source=SYSTEM_EXERCISE, category=EAP_EXERCISE,
          # severity=MODERATE, status=OPEN) is created, incrementing Dam.open_deficiency_count
      # PERMITTED_TYPES: HIGH -> {FUNCTIONAL, FULL_SCALE};
      #                  SIGNIFICANT -> {TABLETOP, FUNCTIONAL, FULL_SCALE};
      #                  LOW / UNCLASSIFIED -> {TABLETOP, FUNCTIONAL, FULL_SCALE}
    constants:
      MIN_PARTICIPANTS_HIGH: 6
      MIN_PARTICIPANTS_SIGNIFICANT: 4
      MIN_PARTICIPANTS_LOW: 2
      MIN_PARTICIPANTS_UNCLASSIFIED: 2
    precision: "integer comparison; the minimum is inclusive (participant_count equal to the minimum passes)"

  - name: reach_capacity_availability
    description: |
      Windowed channel-capacity check on a river reach. Drawdown releases that share any part of a
      time window compete for the reach's channel capacity, so coordination sums the release rates
      of all reach orders whose windows touch the new one.
    trigger: "POST /drawdown-orders/{id}/coordinate"
    inputs:
      - "RiverReach.channel_capacity_cfs"
      - "the DrawdownOrder rows on the same river_reach_id with status in {COORDINATED, ACTIVE}"
      - "the new order's window_start, window_end and requested_release_cfs"
    algorithm: interval_merge
    formula: |
      # windows are treated as CLOSED intervals, so touching endpoints DO overlap
      overlapping = [ o for o in reach orders with status in {COORDINATED, ACTIVE}
                        if o.window_start <= new.window_end
                       AND o.window_end   >= new.window_start ]
      committed_cfs = sum(o.requested_release_cfs for o in overlapping)
      if committed_cfs + new.requested_release_cfs > channel_capacity_cfs:
          reject with ERR_REACH_CAPACITY_EXCEEDED
      # Exact equality with channel_capacity_cfs is ALLOWED. REQUESTED, COMPLETED and CANCELLED
      # orders contribute nothing, which is what makes cancellation genuinely free capacity again.
    constants: {}
    precision: "integer cfs; interval endpoints compared at full ISO-8601 instant precision"

  - name: engineer_visit_conflict
    description: |
      Inspection-window conflict detection for one engineer across all dams, including a travel
      buffer between consecutive site visits. Windows are half-open, but the buffer is added to
      both sides, so two windows that merely abut still conflict.
    trigger: "POST /inspections"
    inputs:
      - "the Inspection rows for the same engineer_id with status in {SCHEDULED, SUBMITTED, RETURNED}"
      - "the new inspection's window_start and window_end"
    algorithm: interval_merge
    formula: |
      buffer = TRAVEL_BUFFER_MINUTES minutes
      conflict iff  new.window_start < existing.window_end   + buffer
               AND  existing.window_start < new.window_end   + buffer
      # ACCEPTED inspections are excluded from the conflict set: once a visit is accepted the
      # engineer's calendar is released.
      # A new window starting exactly buffer minutes after an existing window ends does NOT
      # conflict (strict <); one minute earlier does.
    constants:
      TRAVEL_BUFFER_MINUTES: 120
    precision: "minute-resolution arithmetic on full ISO-8601 instants"

  - name: reading_freeboard_and_alert
    description: |
      Freeboard and alert level for a pool-elevation reading during a high-water event, plus the
      rising/falling trend against the event's previous reading. A CRITICAL or OVERTOPPING reading
      that is ALSO rising auto-escalates the event to EMERGENCY; the same alert level on a falling
      pool does not.
    trigger: "POST /high-water-events/{id}/readings"
    inputs:
      - "Dam.crest_elevation_ft"
      - "the submitted pool_elevation_ft and reading_at"
      - "the event's previously recorded ElevationReading rows"
    algorithm: threshold
    formula: |
      freeboard_ft = round_half_up(Dam.crest_elevation_ft - pool_elevation_ft, 2)

      if freeboard_ft <= OVERTOPPING_MAX_FT:  alert_level = OVERTOPPING   # 0.0 or below
      elif freeboard_ft <= CRITICAL_MAX_FT:   alert_level = CRITICAL      # 1.0 or below
      elif freeboard_ft <= WATCH_MAX_FT:      alert_level = WATCH         # 3.0 or below
      else:                                   alert_level = NORMAL

      prior = the event's reading with the greatest reading_at strictly before this one
              (ties broken by created_at ASC, never by id)
      rising = (prior is not null) AND (pool_elevation_ft > prior.pool_elevation_ft)
      # the FIRST reading of an event is never rising

      if event.status == MONITORING AND alert_level in {CRITICAL, OVERTOPPING} AND rising:
          event.status = EMERGENCY; event.escalated_at = clock
      # Every threshold is inclusive at its upper bound: freeboard exactly 1.00 ft is CRITICAL,
      # exactly 3.00 ft is WATCH, exactly 0.00 ft is OVERTOPPING.
    constants:
      OVERTOPPING_MAX_FT: 0.0
      CRITICAL_MAX_FT: 1.0
      WATCH_MAX_FT: 3.0
    precision: "2 decimal places, round_half_up, on feet"

  - name: drawdown_volume_conservation
    description: |
      Converts a requested release rate and window into planned reservoir volume, and maintains the
      dam's committed / available storage split. The invariant is that committed plus available
      always equals gross storage, before and after every coordinate, complete, cancel and
      cascade-cancel.
    trigger: "POST /drawdown-orders, POST /drawdown-orders/{id}/coordinate, POST /drawdown-orders/{id}/complete, POST /drawdown-orders/{id}/cancel, POST /high-water-events/{id}/stand-down, POST /dams/{id}/state-intervention"
    inputs:
      - "DrawdownOrder.requested_release_cfs, window_start, window_end"
      - "Dam.gross_storage_acre_ft"
      - "the dam's DrawdownOrder rows with status in {COORDINATED, ACTIVE}"
    algorithm: aggregation
    formula: |
      window_hours = (window_end - window_start) expressed in hours (fractional hours allowed)
      planned_release_acre_ft = round_half_up(requested_release_cfs * window_hours
                                              * ACRE_FT_PER_CFS_HOUR, 3)

      committed_drawdown_acre_ft = sum(planned_release_acre_ft
                                       for orders with status in {COORDINATED, ACTIVE})
      available_conservation_storage_acre_ft = round_half_up(
                                       gross_storage_acre_ft - committed_drawdown_acre_ft, 3)

      # INVARIANT, checked after every one of the triggers above:
      #   committed_drawdown_acre_ft + available_conservation_storage_acre_ft
      #     == gross_storage_acre_ft
      # Coordination requires planned_release_acre_ft <= available_conservation_storage_acre_ft
      # (equality allowed); otherwise ERR_INSUFFICIENT_STORAGE.
    constants:
      ACRE_FT_PER_CFS_HOUR: 0.0826446
    precision: "3 decimal places, round_half_up, on acre-feet"

  - name: owner_fee_balance_and_delinquency
    description: |
      Owner's running fee ledger. Every entry carries a signed amount, the ledger is replayed in
      sequence_no order to produce balance_after_cents per row, and the owner's delinquency flag is
      a pure function of the final balance.
    trigger: "POST /owners/{id}/fee-adjustments, POST /permits, POST /permits/{id}/resubmit, POST /program/compliance-sweep, GET /owners/{id}/fee-ledger-entries"
    inputs:
      - "the Owner's FeeLedgerEntry rows"
    algorithm: aggregation
    formula: |
      # sign convention by entry_type
      #   PERMIT_REVIEW_FEE        -> positive (amount owed)
      #   ANNUAL_REGISTRATION_FEE  -> positive (amount owed)
      #   CIVIL_PENALTY            -> positive (amount owed)
      #   PAYMENT_RECEIVED         -> negative (reduces the balance)
      #   PENALTY_ABATEMENT        -> negative (statutory reduction of an assessed penalty)
      #   FEE_VOID                 -> negative (reverses a previously posted charge)
      # A request whose amount_cents sign disagrees with its entry_type is rejected with
      # ERR_LEDGER_SIGN_MISMATCH; amount_cents == 0 is always rejected.

      sequence_no of a new entry = (greatest existing sequence_no for the owner, else 0) + 1
      running = 0
      for e in owner's entries ordered by sequence_no ASC:
          running += e.amount_cents
          e.balance_after_cents = running
      Owner.fee_balance_cents = running

      delinquency_status = DELINQUENT if fee_balance_cents >= DELINQUENCY_THRESHOLD_CENTS
                           else CURRENT
      # The threshold is INCLUSIVE: a balance of exactly 25,000 cents is DELINQUENT.
      # The balance may go negative (a credit); that is CURRENT.
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 25000
    precision: "whole cents; no rounding is performed in this rule"

  - name: hazard_class_program_requirements
    description: |
      The three hazard-class lookups the program applies outside the scoring formulas: how many
      notification contacts an emergency action plan must list, how long an approved plan stays
      valid before it expires, and the financial-assurance floor a HIGH-hazard owner must hold
      before a permit may issue. Every requirement tightens monotonically with hazard class.
    trigger: "POST /emergency-action-plans/{id}/submit, POST /emergency-action-plans/{id}/review, POST /program/compliance-sweep, POST /permits/{id}/decision"
    inputs:
      - "Dam.hazard_class"
      - "EmergencyActionPlan.notification_contact_count"
      - "EmergencyActionPlan.approved_at"
      - "Owner.financial_assurance_bond_cents"
    algorithm: threshold
    formula: |
      # plan submission (validations priority 31)
      required_contacts = MIN_NOTIFICATION_CONTACTS[hazard_class]
      accept iff notification_contact_count >= required_contacts      # inclusive

      # plan approval
      validity_months = EAP_VALIDITY_MONTHS[hazard_class]
      expires_at = approved_at + validity_months calendar months, or null when validity_months is null
      # A LOW-hazard plan never expires, so the sweep can never move it to EXPIRED.

      # permit issuance (validations priority 36)
      if hazard_class == HIGH:
          require financial_assurance_bond_cents >= MIN_HIGH_HAZARD_BOND_CENTS   # inclusive
    constants:
      MIN_NOTIFICATION_CONTACTS_HIGH: 8
      MIN_NOTIFICATION_CONTACTS_SIGNIFICANT: 4
      MIN_NOTIFICATION_CONTACTS_LOW: 1
      MIN_NOTIFICATION_CONTACTS_UNCLASSIFIED: 1
      EAP_VALIDITY_MONTHS_HIGH: 36
      EAP_VALIDITY_MONTHS_SIGNIFICANT: 60
      EAP_VALIDITY_MONTHS_LOW: null
      MIN_HIGH_HAZARD_BOND_CENTS: 25000000
    precision: "integer comparisons, all inclusive at the minimum; validity in whole calendar months preserving the day of month"

# =============================================================================
# §1.4 Validation Rules Table — evaluated strictly in ascending priority order.
#   The FIRST violated rule determines the response; no later rule is evaluated.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Every endpoint except POST /_clock/set_current_utc requires both identity headers."
  - priority: 2
    category: auth
    check: "X-Role is one of the endpoint's authorized_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    description: "Role authorization is decided before the body is parsed, so a DamOwner posting a malformed inspection body still receives ERR_FORBIDDEN_ROLE."
  - priority: 3
    category: validation
    check: "request body and query parameters are well formed: required fields present, enums in range, numbers within stated bounds, ISO-8601 timestamps parseable, window_start < window_end, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Purely syntactic. Includes non-positive height_ft, negative population_at_risk, requested_release_cfs <= 0, amount_cents == 0 and unknown enum members."
  - priority: 4
    category: existence
    check: "every {id} in the path resolves to an existing row of the expected entity"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_ENGINEER_NOT_FOUND | ERR_REACH_NOT_FOUND | ERR_DAM_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_EAP_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_DRAWDOWN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence is checked before any body foreign key, so a request with both a bad path id and a bad body id reports the path error."
  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to an existing row"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_ENGINEER_NOT_FOUND | ERR_REACH_NOT_FOUND | ERR_DAM_NOT_FOUND | ERR_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /dams", "POST /consequence-assessments", "POST /inspections", "POST /emergency-action-plans", "POST /permits", "POST /high-water-events", "POST /drawdown-orders", "POST /permits/{id}/assign-review"]
    description: "Body foreign keys are resolved left to right in the field order declared for the endpoint."
  - priority: 6
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to a row of the backing entity"
    error_id: ERR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "all endpoints authorized for Engineer or DamOwner"
    description: "An X-Role of Engineer with an X-User-ID that is not an Engineer id fails here, after existence checks and before ownership checks."
  - priority: 7
    category: auth
    check: "for DamOwner-authorized operations, X-User-ID equals the owning Owner.id of the target dam, permit, order or plan"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /emergency-action-plans", "POST /emergency-action-plans/{id}/submit", "POST /remediation-orders/{id}/response", "POST /permits", "POST /permits/{id}/resubmit", "GET /owners/{id}/fee-ledger-entries"]
    description: "One owner may never act on another owner's dam."
  - priority: 8
    category: auth
    check: "for engineer-bound operations, X-User-ID equals the engineer assigned to the target row"
    error_id: ERR_NOT_ASSIGNED_ENGINEER
    http_status: 403
    applies_to: ["POST /inspections/{id}/submit", "POST /permits/{id}/decision"]
    description: "Inspection submission requires Inspection.engineer_id; permit decisions require Permit.review_engineer_id. For POST /permits/{id}/decision this check is SKIPPED while Permit.review_engineer_id is null (a permit that has not been assigned for review) — that case is reported by the permit state check at priority 14."
  - priority: 9
    category: state
    check: "ConsequenceAssessment.status permits the operation"
    error_id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /consequence-assessments/{id}/certify"]
    description: "Certification requires DRAFT; a second certify on the same row fails here."
  - priority: 10
    category: state
    check: "Inspection.status permits the operation"
    error_id: ERR_INSPECTION_INVALID_STATE
    http_status: 409
    applies_to: ["POST /inspections/{id}/submit", "POST /inspections/{id}/accept", "POST /inspections/{id}/return"]
    description: "submit requires SCHEDULED or RETURNED; accept and return require SUBMITTED. ACCEPTED is terminal."
  - priority: 11
    category: state
    check: "Deficiency.status permits the operation"
    error_id: ERR_DEFICIENCY_INVALID_STATE
    http_status: 409
    applies_to: ["POST /deficiencies/{id}/remediation-orders"]
    description: "Issuing an order requires OPEN or ESCALATED; a deficiency already ORDERED or CLOSED_VERIFIED fails here."
  - priority: 12
    category: state
    check: "RemediationOrder.status permits the operation"
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: ["POST /remediation-orders/{id}/response", "POST /remediation-orders/{id}/verify", "GET /remediation-orders/{id}/penalty-preview"]
    description: "response requires ISSUED; verify requires RESPONSE_FILED; penalty-preview requires ISSUED or RESPONSE_FILED."
  - priority: 13
    category: state
    check: "EmergencyActionPlan.status permits the operation"
    error_id: ERR_EAP_INVALID_STATE
    http_status: 409
    applies_to: ["POST /emergency-action-plans/{id}/submit", "POST /emergency-action-plans/{id}/review", "POST /emergency-action-plans/{id}/exercises"]
    description: "submit requires DRAFT or REVISION_REQUIRED; review requires SUBMITTED; logging an exercise requires APPROVED."
  - priority: 14
    category: state
    check: "Permit.status permits the operation"
    error_id: ERR_PERMIT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /permits/{id}/assign-review", "POST /permits/{id}/decision", "POST /permits/{id}/resubmit"]
    description: "assign-review requires SUBMITTED; decision requires UNDER_ENGINEERING_REVIEW; resubmit requires RETURNED_FOR_REVISION. This rule outranks every fiscal check, so a decision call on a still-SUBMITTED permit reports the state error even when the owner is delinquent."
  - priority: 15
    category: state
    check: "HighWaterEvent.status permits the operation"
    error_id: ERR_EVENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /high-water-events/{id}/readings", "POST /high-water-events/{id}/stand-down", "POST /drawdown-orders"]
    description: "readings and stand-down require MONITORING or EMERGENCY; requesting a drawdown against a STOOD_DOWN event fails here."
  - priority: 16
    category: state
    check: "DrawdownOrder.status permits the operation"
    error_id: ERR_DRAWDOWN_INVALID_STATE
    http_status: 409
    applies_to: ["POST /drawdown-orders/{id}/coordinate", "POST /drawdown-orders/{id}/activate", "POST /drawdown-orders/{id}/complete", "POST /drawdown-orders/{id}/cancel"]
    description: "coordinate requires REQUESTED; activate requires COORDINATED; complete requires ACTIVE; cancel requires a non-terminal status."
  - priority: 17
    category: state
    check: "Dam.regulatory_status is not BREACHED, and is not REMOVAL_PERMITTED for operations that presuppose a standing dam"
    error_id: ERR_DAM_NOT_OPERABLE
    http_status: 409
    applies_to: ["POST /consequence-assessments", "POST /consequence-assessments/{id}/certify", "POST /inspections", "POST /permits", "POST /high-water-events", "POST /drawdown-orders", "POST /emergency-action-plans"]
    description: "A breached dam is out of the program; a removal-permitted dam still accepts inspections and events but no new consequence assessments or construction permits."
  - priority: 18
    category: concurrency
    check: "expected_dam_version equals Dam.version"
    error_id: ERR_STALE_DAM_VERSION
    http_status: 412
    applies_to: ["POST /emergency-action-plans"]
    description: "See concurrency_rules.eap-create-stale-dam. Checked after every state precondition so that a stale version on a breached dam still reports ERR_DAM_NOT_OPERABLE."
  - priority: 19
    category: concurrency
    check: "expected_reach_version equals RiverReach.version"
    error_id: ERR_STALE_REACH_VERSION
    http_status: 412
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
    description: "See concurrency_rules.drawdown-coordinate-stale-reach. Outranks the capacity and storage checks, so a stale version is reported even when the reach is also over capacity."
  - priority: 20
    category: business_safety
    check: "the acting or referenced Engineer has license_status ACTIVE and license_expires_at strictly after the current logical clock"
    error_id: ERR_ENGINEER_LICENSE_EXPIRED
    http_status: 422
    applies_to: ["POST /inspections", "POST /inspections/{id}/submit", "POST /inspections/{id}/accept", "POST /consequence-assessments/{id}/certify", "POST /emergency-action-plans/{id}/review", "POST /permits/{id}/assign-review", "POST /permits/{id}/decision", "POST /remediation-orders/{id}/verify"]
    description: "No unlicensed engineering act is recorded. This rule outranks every temporal and constraint check below it."
  - priority: 21
    category: business_safety
    check: "Dam.hazard_class is a member of the engineer's certified_hazard_classes"
    error_id: ERR_ENGINEER_NOT_CERTIFIED
    http_status: 422
    applies_to: ["POST /inspections", "POST /inspections/{id}/submit", "POST /consequence-assessments/{id}/certify"]
    description: "A HIGH-hazard dam may only be inspected or certified by an engineer certified for HIGH. UNCLASSIFIED dams are checked against LOW."
  - priority: 22
    category: business_safety
    check: "NOT (Dam.safety_status == UNSATISFACTORY AND Permit.permit_type == CONSTRUCTION)"
    error_id: ERR_UNSAFE_DAM_PERMIT_BLOCKED
    http_status: 422
    applies_to: ["POST /permits/{id}/decision"]
    description: "New construction on an unsatisfactory dam is barred; REPAIR and REMOVAL permits remain issuable, which is the point of the carve-out."
  - priority: 23
    category: business_safety
    check: "when Dam.hazard_class == HIGH, Dam.latest_eap_status == APPROVED"
    error_id: ERR_EAP_NOT_APPROVED
    http_status: 422
    applies_to: ["POST /permits/{id}/decision", "POST /drawdown-orders"]
    description: "High-hazard dams may not obtain permits or request drawdowns without a current approved emergency action plan."
  - priority: 24
    category: business_safety
    check: "HighWaterEvent.status == EMERGENCY"
    error_id: ERR_EVENT_NOT_IN_EMERGENCY
    http_status: 422
    applies_to: ["POST /drawdown-orders/{id}/activate"]
    description: "A coordinated release may only begin once the event has auto-escalated to EMERGENCY on a rising critical reading."
  - priority: 25
    category: business_safety
    check: "Dam.hazard_class != UNCLASSIFIED"
    error_id: ERR_DAM_UNCLASSIFIED
    http_status: 422
    applies_to: ["POST /inspections", "POST /permits", "POST /emergency-action-plans/{id}/submit", "POST /drawdown-orders"]
    description: "Nothing may be scheduled, permitted or planned against a dam that has never had a certified consequence assessment. This rule outranks the engineer window-conflict and capacity checks below it."
  - priority: 26
    category: business_temporal
    check: "Inspection.window_start <= performed_at < Inspection.window_end"
    error_id: ERR_OUTSIDE_INSPECTION_WINDOW
    http_status: 422
    applies_to: ["POST /inspections/{id}/submit"]
    description: "Half-open window: performed_at exactly at window_start is inside, exactly at window_end is outside."
  - priority: 27
    category: business_temporal
    check: "performed_at <= the current logical clock"
    error_id: ERR_PERFORMED_AT_IN_FUTURE
    http_status: 422
    applies_to: ["POST /inspections/{id}/submit"]
    description: "An inspection cannot be reported before it happens. Equality with the clock is permitted."
  - priority: 28
    category: business_constraint
    check: "windowed committed release plus the new release does not exceed RiverReach.channel_capacity_cfs"
    error_id: ERR_REACH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
    description: "See calculations.reach_capacity_availability. Aggregate rule: each individual order is within capacity while their windowed sum is not."
  - priority: 29
    category: business_constraint
    check: "planned_release_acre_ft <= Dam.available_conservation_storage_acre_ft"
    error_id: ERR_INSUFFICIENT_STORAGE
    http_status: 409
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
    description: "See calculations.drawdown_volume_conservation. Equality is allowed; this rule is evaluated after the reach capacity rule, so an order that fails both reports ERR_REACH_CAPACITY_EXCEEDED."
  - priority: 30
    category: business_constraint
    check: "the engineer has no conflicting inspection window including the travel buffer"
    error_id: ERR_ENGINEER_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /inspections"]
    description: "See calculations.engineer_visit_conflict."
  - priority: 31
    category: business_constraint
    check: "EmergencyActionPlan.notification_contact_count >= MIN_NOTIFICATION_CONTACTS for the dam's hazard class"
    error_id: ERR_INSUFFICIENT_NOTIFICATION_CONTACTS
    http_status: 422
    applies_to: ["POST /emergency-action-plans/{id}/submit"]
    description: "MIN_NOTIFICATION_CONTACTS is 8 for HIGH, 4 for SIGNIFICANT and 1 for LOW. The minimum is inclusive."
  - priority: 32
    category: business_constraint
    check: "when Dam.eap_required, EmergencyActionPlan.inundation_map_ref equals the inundation_map_ref of the dam's CERTIFIED ConsequenceAssessment"
    error_id: ERR_INUNDATION_MAP_STALE
    http_status: 422
    applies_to: ["POST /emergency-action-plans/{id}/submit"]
    description: "A plan may not be submitted against a superseded inundation map. This is the check that makes the reclassification cascade's REVISION_REQUIRED outcome recoverable only by refreshing the map reference."
  - priority: 33
    category: business_constraint
    check: "breach_travel_time_minutes > 0 AND inundation_area_acres > 0 AND breach_peak_outflow_cfs > 0"
    error_id: ERR_BREACH_ANALYSIS_INCOMPLETE
    http_status: 422
    applies_to: ["POST /consequence-assessments/{id}/certify"]
    description: "Certification requires a completed breach analysis; a screening-only assessment with zero travel time cannot be certified."
  - priority: 34
    category: business_temporal
    check: "EapExercise.conducted_at <= the current logical clock"
    error_id: ERR_EXERCISE_DATE_IN_FUTURE
    http_status: 422
    applies_to: ["POST /emergency-action-plans/{id}/exercises"]
    description: "Annual exercises are logged after the fact. Equality with the clock is permitted."
  - priority: 35
    category: business_fiscal
    check: "Owner.delinquency_status == CURRENT"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 402
    applies_to: ["POST /permits/{id}/decision"]
    description: "A permit is not issued or denied on the merits while the owner carries an unpaid fee balance at or above the delinquency threshold. Outranked by the permit state check at priority 14."
  - priority: 36
    category: business_fiscal
    check: "when Dam.hazard_class == HIGH, Owner.financial_assurance_bond_cents >= MIN_HIGH_HAZARD_BOND_CENTS (25,000,000)"
    error_id: ERR_INSUFFICIENT_FINANCIAL_ASSURANCE
    http_status: 402
    applies_to: ["POST /permits/{id}/decision"]
    description: "High-hazard owners must post financial assurance before permits issue. Evaluated after the delinquency check, so an owner failing both reports ERR_OWNER_DELINQUENT."
  - priority: 37
    category: business_constraint
    check: "the acting user is not the same person who performed the step being reviewed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /inspections/{id}/accept", "POST /permits/{id}/assign-review"]
    description: "An inspection may not be accepted by its own submitting engineer, and a permit may not be assigned to the engineer of record of the dam's latest ACCEPTED inspection. Because this rule sits below the state checks, accepting an already-ACCEPTED inspection as its own author reports ERR_INSPECTION_INVALID_STATE instead."
  - priority: 38
    category: business_constraint
    check: "Dam.nid_code is unique across all dams"
    error_id: ERR_DUPLICATE_NID_CODE
    http_status: 409
    applies_to: ["POST /dams"]
    description: "National inventory codes are unique program-wide, independent of owner."
  - priority: 39
    category: business_constraint
    check: "Engineer.license_number is unique across all engineers"
    error_id: ERR_DUPLICATE_LICENSE_NUMBER
    http_status: 409
    applies_to: ["POST /engineers"]
    description: "One professional license, one engineer row."
  - priority: 40
    category: business_fiscal
    check: "the sign of amount_cents agrees with entry_type: PERMIT_REVIEW_FEE, ANNUAL_REGISTRATION_FEE and CIVIL_PENALTY are positive; PAYMENT_RECEIVED, PENALTY_ABATEMENT and FEE_VOID are negative"
    error_id: ERR_LEDGER_SIGN_MISMATCH
    http_status: 422
    applies_to: ["POST /owners/{id}/fee-adjustments"]
    description: "See calculations.owner_fee_balance_and_delinquency. A zero amount is rejected earlier, at priority 3."
  - priority: 41
    category: business_constraint
    check: "the referenced HighWaterEvent.dam_id equals the referenced dam_id"
    error_id: ERR_EVENT_DAM_MISMATCH
    http_status: 422
    applies_to: ["POST /drawdown-orders"]
    description: "A drawdown order must name the same dam as the event it responds to."
  - priority: 42
    category: business_temporal
    check: "the requested clock value is greater than or equal to the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: ["POST /_clock/set_current_utc"]
    description: "The logical clock never moves backwards within a scenario. Setting it to its current value is a no-op success."

# =============================================================================
# §1.5 API Endpoint Table
#   `input:` lists request-body fields for writes and query parameters for reads;
#   a trailing `?` marks an optional field. `output:` names the returned entity,
#   `<Entity>[]` a paginated list, or an inline schema for computed reads.
#   Every list endpoint returns its rows ordered by `created_at` ASC (never by `id`)
#   and carries the §1.0 pagination fields limit / offset / total_count / has_more.
# =============================================================================
endpoints:
  # --- Owners -----------------------------------------------------------------
  - method: POST
    path: /owners
    description: Register a dam owner in the state program.
    roles: [ProgramAdmin]
    success_code: 201
    input: [legal_name, owner_type, contact_email, financial_assurance_bond_cents]
    output: Owner
    side_effects:
      - "fee_balance_cents = 0, delinquency_status = CURRENT, registered_dam_count = 0"
  - method: GET
    path: /owners/{id}
    description: Retrieve an owner including the derived fee balance and delinquency flag.
    roles: [ProgramAdmin, DamOwner]
    success_code: 200
    input: []
    output: Owner
    side_effects: []
  - method: GET
    path: /owners
    description: List owners, optionally filtered by delinquency status.
    roles: [ProgramAdmin]
    success_code: 200
    input: ["delinquency_status?", "limit?", "offset?"]
    output: Owner[]
    side_effects: []
  - method: POST
    path: /owners/{id}/fee-adjustments
    description: Append a signed entry to the owner's fee ledger (payment, void, or manual charge).
    roles: [ProgramAdmin]
    success_code: 201
    input: [entry_type, amount_cents, "memo?", "source_ref?"]
    output: FeeLedgerEntry
    side_effects:
      - "sequence_no assigned as max(sequence_no)+1 for the owner; balance_after_cents computed"
      - "Owner.fee_balance_cents and Owner.delinquency_status recomputed per calculations.owner_fee_balance_and_delinquency"
  - method: GET
    path: /owners/{id}/fee-ledger-entries
    description: List the owner's ledger entries in sequence_no order with running balances.
    roles: [ProgramAdmin, DamOwner]
    success_code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  # --- Engineers --------------------------------------------------------------
  - method: POST
    path: /engineers
    description: Register a licensed professional engineer available for program work.
    roles: [ProgramAdmin]
    success_code: 201
    input: [full_name, license_number, license_expires_at, certified_hazard_classes]
    output: Engineer
    side_effects:
      - "license_status derived from license_expires_at against the current logical clock"
  - method: GET
    path: /engineers/{id}
    description: Retrieve an engineer including derived license status and workload.
    roles: [ProgramAdmin, Engineer]
    success_code: 200
    input: []
    output: Engineer
    side_effects: []
  - method: GET
    path: /engineers
    description: List engineers, optionally filtered by license status.
    roles: [ProgramAdmin]
    success_code: 200
    input: ["license_status?", "limit?", "offset?"]
    output: Engineer[]
    side_effects: []

  # --- River reaches ----------------------------------------------------------
  - method: POST
    path: /river-reaches
    description: Register a downstream river reach with its channel capacity.
    roles: [ProgramAdmin]
    success_code: 201
    input: [name, channel_capacity_cfs, downstream_community]
    output: RiverReach
    side_effects:
      - "committed_release_cfs = 0, active_drawdown_count = 0, version = 1"
  - method: GET
    path: /river-reaches/{id}
    description: Retrieve a river reach including its currently committed release rate.
    roles: [ProgramAdmin, EmergencyCoordinator]
    success_code: 200
    input: []
    output: RiverReach
    side_effects: []
  - method: GET
    path: /river-reaches
    description: List river reaches.
    roles: [ProgramAdmin, EmergencyCoordinator]
    success_code: 200
    input: ["limit?", "offset?"]
    output: RiverReach[]
    side_effects: []

  # --- Dams -------------------------------------------------------------------
  - method: POST
    path: /dams
    description: Add a dam to the state inventory. It starts UNCLASSIFIED and UNRATED.
    roles: [ProgramAdmin]
    success_code: 201
    input: [owner_id, river_reach_id, name, nid_code, height_ft, gross_storage_acre_ft, crest_elevation_ft, normal_pool_elevation_ft, year_completed, registered_at]
    output: Dam
    side_effects:
      - "hazard_class = UNCLASSIFIED, safety_status = UNRATED, regulatory_status = REGISTERED"
      - "next_inspection_due_at = registered_at + 60 months (UNCLASSIFIED interval); inspection_overdue recomputed"
      - "committed_drawdown_acre_ft = 0 and available_conservation_storage_acre_ft = gross_storage_acre_ft"
      - "Owner.registered_dam_count incremented"
  - method: GET
    path: /dams/{id}
    description: Retrieve a dam with all derived classification, schedule and storage fields.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: []
    output: Dam
    side_effects: []
  - method: GET
    path: /dams
    description: List dams with inventory filters.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["owner_id?", "river_reach_id?", "hazard_class?", "safety_status?", "regulatory_status?", "inspection_overdue?", "limit?", "offset?"]
    output: Dam[]
    side_effects: []
  - method: GET
    path: /dams/{id}/compliance-summary
    description: Computed regulatory snapshot for one dam, reconciling classification, inspection schedule, deficiencies, plan currency, penalties and storage.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: "{ dam_id: string, hazard_class: string, safety_status: string, regulatory_status: string, current_consequence_score: number, next_inspection_due_at: string, inspection_overdue: boolean, open_deficiency_count: integer, escalated_deficiency_count: integer, latest_eap_status: string, eap_expires_at: string, eap_exercise_current: boolean, outstanding_penalty_cents: integer, owner_delinquency_status: string, committed_drawdown_acre_ft: number, available_conservation_storage_acre_ft: number }"
    side_effects: []
  - method: POST
    path: /dams/{id}/state-intervention
    description: Exercise state intervention authority over an abandoned or dangerous dam.
    roles: [ProgramAdmin]
    success_code: 200
    input: [intervention_type, justification]
    output: Dam
    side_effects:
      - "regulatory_status moves to STATE_INTERVENTION or, for BREACH_ORDER, to the terminal BREACHED"
      - "non-terminal DrawdownOrder rows on the dam are CANCELLED, releasing reach capacity and dam storage"
      - "for BREACH_ORDER, unclosed Deficiency rows are closed and open_deficiency_count becomes 0"
      - "increments Dam.version by 1"

  # --- Consequence assessments -----------------------------------------------
  - method: POST
    path: /consequence-assessments
    description: File a downstream consequence assessment for a dam in DRAFT with a screening score.
    roles: [Engineer]
    success_code: 201
    input: [dam_id, population_at_risk, habitable_structures, critical_facilities, breach_peak_outflow_cfs, breach_travel_time_minutes, inundation_area_acres, inundation_map_ref]
    output: ConsequenceAssessment
    side_effects:
      - "screening_score and recommended_hazard_class computed (screening variant); status = DRAFT"
      - "prepared_by_user_id = acting X-User-ID; Dam.hazard_class is NOT changed yet"
  - method: GET
    path: /consequence-assessments/{id}
    description: Retrieve a consequence assessment with both screening and certified figures.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: ConsequenceAssessment
    side_effects: []
  - method: GET
    path: /consequence-assessments
    description: List consequence assessments for a dam or by status.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: ["dam_id?", "status?", "limit?", "offset?"]
    output: ConsequenceAssessment[]
    side_effects: []
  - method: POST
    path: /consequence-assessments/{id}/certify
    description: Certify the assessment, reclassifying the dam and triggering the four-link reclassification cascade.
    roles: [Engineer]
    success_code: 200
    input: []
    output: ConsequenceAssessment
    side_effects:
      - "certified_score and certified_hazard_class computed (certified variant); status = CERTIFIED; certified_at = clock"
      - "the dam's prior CERTIFIED assessment moves to SUPERSEDED"
      - "Dam.hazard_class, current_consequence_score, eap_required, next_inspection_due_at and inspection_overdue recomputed"
      - "an APPROVED EmergencyActionPlan whose inundation_map_ref no longer matches moves to REVISION_REQUIRED with expires_at cleared"
      - "a SYSTEM_EAP / EAP_MISSING Deficiency is opened when the reclassified dam is left with no APPROVED plan"
      - "increments Dam.version by 1"

  # --- Inspections ------------------------------------------------------------
  - method: POST
    path: /inspections
    description: Schedule an engineer-performed inspection inside a reserved field-visit window.
    roles: [ProgramAdmin]
    success_code: 201
    input: [dam_id, engineer_id, inspection_type, window_start, window_end]
    output: Inspection
    side_effects:
      - "status = SCHEDULED; Engineer.open_inspection_count incremented"
      - "rejected when the window conflicts with the engineer's other non-accepted windows including the travel buffer"
  - method: GET
    path: /inspections/{id}
    description: Retrieve one inspection.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: /inspections
    description: List inspections by dam, engineer, status or type.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: ["dam_id?", "engineer_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: /inspections/{id}/submit
    description: Submit field findings, a condition rating and any identified deficiencies.
    roles: [Engineer]
    success_code: 200
    input: [performed_at, condition_rating, narrative, "deficiencies?"]
    output: Inspection
    side_effects:
      - "status = SUBMITTED; performed_at, condition_rating and narrative stored"
      - "one Deficiency (source = INSPECTION, status = OPEN) created per element of deficiencies; deficiency_count set"
      - "Dam.open_deficiency_count recomputed; increments Dam.version by 1 when it changes"
      - "on resubmission after a return, previously created OPEN deficiencies are replaced"
  - method: POST
    path: /inspections/{id}/accept
    description: Accept a submitted inspection, applying its condition rating to the dam and resetting the periodic schedule.
    roles: [ProgramAdmin, Engineer]
    success_code: 200
    input: []
    output: Inspection
    side_effects:
      - "status = ACCEPTED (terminal); accepted_at = clock; accepted_by_user_id = acting X-User-ID"
      - "Dam.safety_status = condition_rating"
      - "for PERIODIC inspections, Dam.next_inspection_due_at and Dam.inspection_overdue recomputed from performed_at"
      - "Engineer.open_inspection_count decremented; increments Dam.version by 1"
  - method: POST
    path: /inspections/{id}/return
    description: Return a submitted inspection to the engineer for rework.
    roles: [ProgramAdmin]
    success_code: 200
    input: [reason]
    output: Inspection
    side_effects:
      - "status = RETURNED; return_count incremented; Dam.safety_status unchanged"

  # --- Deficiencies -----------------------------------------------------------
  - method: GET
    path: /deficiencies/{id}
    description: Retrieve one deficiency.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: Deficiency
    side_effects: []
  - method: GET
    path: /deficiencies
    description: List deficiencies by dam, inspection, status, severity or origin.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: ["dam_id?", "inspection_id?", "status?", "severity?", "source?", "category?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: POST
    path: /deficiencies/{id}/remediation-orders
    description: Issue a remediation order against the owner with a statutory response deadline.
    roles: [ProgramAdmin]
    success_code: 201
    input: [order_type, requested_response_days]
    output: RemediationOrder
    side_effects:
      - "effective_response_days, compliance_deadline_at and daily_penalty_rate_cents computed per calculations.remediation_deadline"
      - "dam_id and owner_id copied from the deficiency and the dam; issued_at = clock; status = ISSUED"
      - "Deficiency.status = ORDERED; remediation_due_at set; order_count incremented"

  # --- Remediation orders -----------------------------------------------------
  - method: GET
    path: /remediation-orders/{id}
    description: Retrieve one remediation order.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: RemediationOrder
    side_effects: []
  - method: GET
    path: /remediation-orders
    description: List remediation orders by deficiency, dam, owner or status.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: ["deficiency_id?", "dam_id?", "owner_id?", "status?", "order_type?", "limit?", "offset?"]
    output: RemediationOrder[]
    side_effects: []
  - method: GET
    path: /remediation-orders/{id}/penalty-preview
    description: Provisional civil-penalty accrual for an order that has not yet defaulted (uncapped, unabated).
    roles: [ProgramAdmin, DamOwner]
    success_code: 200
    input: []
    output: "{ order_id: string, overdue_days: integer, daily_penalty_rate_cents: integer, provisional_penalty_cents: integer, response_filed: boolean }"
    side_effects: []
  - method: POST
    path: /remediation-orders/{id}/response
    description: Owner files the corrective work performed under the order.
    roles: [DamOwner]
    success_code: 200
    input: [corrective_action_summary, completed_at]
    output: RemediationOrder
    side_effects:
      - "status = RESPONSE_FILED; response_filed_at = clock when currently null (never overwritten)"
      - "Deficiency.status = REMEDIATION_SUBMITTED"
  - method: POST
    path: /remediation-orders/{id}/verify
    description: Engineer verifies the owner's corrective work and either closes the deficiency or reopens the order.
    roles: [Engineer]
    success_code: 200
    input: [outcome, notes]
    output: RemediationOrder
    side_effects:
      - "SATISFIED: status = SATISFIED, Deficiency.status = CLOSED_VERIFIED, Dam.open_deficiency_count decremented"
      - "SATISFIED may return Dam.regulatory_status from UNDER_ENFORCEMENT to REGISTERED"
      - "REJECTED: status returns to ISSUED with response_filed_at retained, Deficiency.status = ORDERED"
      - "verified_by_user_id = acting X-User-ID; increments Dam.version by 1 when a dam field changes"

  # --- Emergency action plans -------------------------------------------------
  - method: POST
    path: /emergency-action-plans
    description: Draft an emergency action plan for a dam, quoting the dam version the owner last observed.
    roles: [DamOwner]
    success_code: 201
    input: [dam_id, version_label, inundation_map_ref, notification_flowchart_ref, notification_contact_count, drawdown_procedure_ref, expected_dam_version]
    output: EmergencyActionPlan
    side_effects:
      - "status = DRAFT; Dam.latest_eap_status = DRAFT; increments Dam.version by 1"
      - "rejected with ERR_STALE_DAM_VERSION when expected_dam_version does not equal Dam.version"
  - method: GET
    path: /emergency-action-plans/{id}
    description: Retrieve one emergency action plan with its exercise currency fields.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: []
    output: EmergencyActionPlan
    side_effects: []
  - method: GET
    path: /emergency-action-plans
    description: List emergency action plans by dam or status.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["dam_id?", "status?", "limit?", "offset?"]
    output: EmergencyActionPlan[]
    side_effects: []
  - method: POST
    path: /emergency-action-plans/{id}/submit
    description: Submit the plan for engineering review, optionally refreshing the inundation map reference and contact count first.
    roles: [DamOwner]
    success_code: 200
    input: ["inundation_map_ref?", "notification_flowchart_ref?", "notification_contact_count?", "drawdown_procedure_ref?"]
    output: EmergencyActionPlan
    side_effects:
      - "supplied optional fields overwrite the stored values before the contact-count and map-staleness checks run"
      - "status = SUBMITTED; Dam.latest_eap_status = SUBMITTED; increments Dam.version by 1"
  - method: POST
    path: /emergency-action-plans/{id}/review
    description: Engineer approves the plan or returns it for revision.
    roles: [Engineer]
    success_code: 200
    input: [decision, findings]
    output: EmergencyActionPlan
    side_effects:
      - "APPROVE: status = APPROVED, approved_at = clock, expires_at = approved_at + validity months for the hazard class (null for LOW)"
      - "APPROVE supersedes the dam's previously APPROVED plan"
      - "REVISE: status = REVISION_REQUIRED with review_findings stored"
      - "Dam.latest_eap_status refreshed; increments Dam.version by 1"
  - method: POST
    path: /emergency-action-plans/{id}/exercises
    description: Log an annual emergency exercise against an approved plan and grade it.
    roles: [DamOwner, EmergencyCoordinator]
    success_code: 201
    input: [exercise_type, conducted_at, participant_count, notification_test_passed]
    output: EapExercise
    side_effects:
      - "outcome and deficiency_reason computed per calculations.eap_exercise_evaluation"
      - "ACCEPTED exercises refresh EmergencyActionPlan.last_accepted_exercise_at, accepted_exercise_count and exercise_current"
      - "DEFICIENT exercises open a SYSTEM_EXERCISE / EAP_EXERCISE Deficiency and increment Dam.open_deficiency_count"
  - method: GET
    path: /emergency-action-plans/{id}/exercises
    description: List the exercises logged against a plan.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: EapExercise[]
    side_effects: []

  # --- Permits ----------------------------------------------------------------
  - method: POST
    path: /permits
    description: Apply for a construction, repair or removal permit; the full fee schedule is computed at intake.
    roles: [DamOwner]
    success_code: 201
    input: [dam_id, permit_type, scope_description, estimated_project_cost_cents, proposed_start_date]
    output: Permit
    side_effects:
      - "base_fee_cents, engineering_review_fee_cents, delinquency_surcharge_cents, volume_credit_cents and total_fee_cents computed per calculations.permit_fee_schedule"
      - "owner_id copied from the dam; status = SUBMITTED; revision_count = 0"
      - "a PERMIT_REVIEW_FEE FeeLedgerEntry for total_fee_cents is appended and the owner balance and delinquency status recomputed"
  - method: GET
    path: /permits/{id}
    description: Retrieve one permit with its full fee breakdown.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: /permits
    description: List permits by dam, owner, reviewing engineer, type or status.
    roles: [ProgramAdmin, Engineer, DamOwner]
    success_code: 200
    input: ["dam_id?", "owner_id?", "review_engineer_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: /permits/{id}/assign-review
    description: Assign an engineer to review the permit application, subject to segregation of duties.
    roles: [ProgramAdmin]
    success_code: 200
    input: [review_engineer_id]
    output: Permit
    side_effects:
      - "status = UNDER_ENGINEERING_REVIEW; review_engineer_id stored"
      - "rejected when the nominated engineer is the engineer of record of the dam's latest ACCEPTED inspection"
  - method: POST
    path: /permits/{id}/decision
    description: Reviewing engineer issues, denies or returns the permit.
    roles: [Engineer]
    success_code: 200
    input: [decision, findings, "conditions?"]
    output: Permit
    side_effects:
      - "ISSUE: status = ISSUED, issued_at = clock; a REMOVAL permit moves Dam.regulatory_status to REMOVAL_PERMITTED"
      - "DENY: status = DENIED (terminal); the review fee already posted is not refunded"
      - "RETURN: status = RETURNED_FOR_REVISION with decision_findings stored"
  - method: POST
    path: /permits/{id}/resubmit
    description: Owner revises a returned application; the fee schedule is re-evaluated and only the delta is posted.
    roles: [DamOwner]
    success_code: 200
    input: [scope_description, estimated_project_cost_cents]
    output: Permit
    side_effects:
      - "status = SUBMITTED; revision_count incremented; review_engineer_id cleared"
      - "the fee schedule is recomputed and the difference from the previously posted total is appended as a PERMIT_REVIEW_FEE (positive) or FEE_VOID (negative) ledger entry; a zero delta appends nothing"

  # --- High-water events ------------------------------------------------------
  - method: POST
    path: /high-water-events
    description: Declare a high-water monitoring event on a dam.
    roles: [ProgramAdmin, EmergencyCoordinator]
    success_code: 201
    input: [dam_id, declared_at, trigger_description, declared_inflow_cfs]
    output: HighWaterEvent
    side_effects:
      - "status = MONITORING; reading_count = 0; current_alert_level = NORMAL"
  - method: GET
    path: /high-water-events/{id}
    description: Retrieve one high-water event with its current alert level and peak pool.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: []
    output: HighWaterEvent
    side_effects: []
  - method: GET
    path: /high-water-events
    description: List high-water events by dam or status.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["dam_id?", "status?", "limit?", "offset?"]
    output: HighWaterEvent[]
    side_effects: []
  - method: POST
    path: /high-water-events/{id}/readings
    description: Record a pool-elevation reading; freeboard, alert level and trend are derived and may auto-escalate the event.
    roles: [ProgramAdmin, Engineer, EmergencyCoordinator]
    success_code: 201
    input: [reading_at, pool_elevation_ft, observed_inflow_cfs]
    output: ElevationReading
    side_effects:
      - "freeboard_ft, alert_level and rising computed per calculations.reading_freeboard_and_alert"
      - "HighWaterEvent.reading_count incremented; current_alert_level and peak_pool_elevation_ft refreshed"
      - "a rising CRITICAL or OVERTOPPING reading moves the event MONITORING -> EMERGENCY and sets escalated_at"
  - method: GET
    path: /high-water-events/{id}/readings
    description: List the readings logged against an event.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["alert_level?", "limit?", "offset?"]
    output: ElevationReading[]
    side_effects: []
  - method: POST
    path: /high-water-events/{id}/stand-down
    description: Stand the event down, cancelling every non-terminal drawdown order it authorised.
    roles: [EmergencyCoordinator]
    success_code: 200
    input: [final_pool_elevation_ft]
    output: HighWaterEvent
    side_effects:
      - "status = STOOD_DOWN (terminal); stood_down_at = clock"
      - "every REQUESTED, COORDINATED or ACTIVE DrawdownOrder on the event is CANCELLED with cancel_reason = EVENT_STOOD_DOWN"
      - "reach committed_release_cfs, active_drawdown_count and dam committed / available storage are restored exactly; RiverReach.version and Dam.version increment"

  # --- Drawdown orders --------------------------------------------------------
  - method: POST
    path: /drawdown-orders
    description: Request an emergency drawdown release for a dam under a high-water event.
    roles: [ProgramAdmin, EmergencyCoordinator]
    success_code: 201
    input: [dam_id, high_water_event_id, requested_release_cfs, window_start, window_end]
    output: DrawdownOrder
    side_effects:
      - "river_reach_id copied from the dam; planned_release_acre_ft computed per calculations.drawdown_volume_conservation"
      - "status = REQUESTED; no reach capacity or dam storage is committed yet"
  - method: GET
    path: /drawdown-orders/{id}
    description: Retrieve one drawdown order.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: []
    output: DrawdownOrder
    side_effects: []
  - method: GET
    path: /drawdown-orders
    description: List drawdown orders by dam, reach, event or status.
    roles: [ProgramAdmin, Engineer, DamOwner, EmergencyCoordinator]
    success_code: 200
    input: ["dam_id?", "river_reach_id?", "high_water_event_id?", "status?", "limit?", "offset?"]
    output: DrawdownOrder[]
    side_effects: []
  - method: POST
    path: /drawdown-orders/{id}/coordinate
    description: Commit reach capacity and reservoir storage to the release, quoting the reach version last observed.
    roles: [ProgramAdmin]
    success_code: 200
    input: [expected_reach_version]
    output: DrawdownOrder
    side_effects:
      - "rejected with ERR_STALE_REACH_VERSION when expected_reach_version does not equal RiverReach.version"
      - "rejected when the windowed committed release would exceed the reach's channel capacity, or the planned volume exceeds available conservation storage"
      - "status = COORDINATED; coordinated_at = clock"
      - "RiverReach.committed_release_cfs and active_drawdown_count increase; RiverReach.version increments"
      - "Dam.committed_drawdown_acre_ft increases and available_conservation_storage_acre_ft decreases; Dam.version increments"
  - method: POST
    path: /drawdown-orders/{id}/activate
    description: Begin the coordinated release; only permitted once the event has escalated to EMERGENCY.
    roles: [EmergencyCoordinator]
    success_code: 200
    input: []
    output: DrawdownOrder
    side_effects:
      - "status = ACTIVE; activated_at = clock; commitments unchanged"
  - method: POST
    path: /drawdown-orders/{id}/complete
    description: Close out a completed release and free the committed capacity and storage.
    roles: [EmergencyCoordinator]
    success_code: 200
    input: [actual_release_acre_ft]
    output: DrawdownOrder
    side_effects:
      - "status = COMPLETED (terminal); completed_at = clock; actual_release_acre_ft stored"
      - "reach and dam commitments released exactly; RiverReach.version and Dam.version increment"
  - method: POST
    path: /drawdown-orders/{id}/cancel
    description: Cancel a non-terminal drawdown order, compensating every commitment it took.
    roles: [ProgramAdmin, EmergencyCoordinator]
    success_code: 200
    input: [reason]
    output: DrawdownOrder
    side_effects:
      - "status = CANCELLED (terminal); cancelled_at = clock; cancel_reason stored"
      - "a REQUESTED order releases nothing; a COORDINATED or ACTIVE order releases the reach capacity and dam storage it took, leaving both conserved quantities at their pre-coordination values"

  # --- Program operations -----------------------------------------------------
  - method: POST
    path: /program/compliance-sweep
    description: "Run the enforcement sweep: default overdue orders, assess penalties, escalate deficiencies, refer aged defaults, expire plans and refresh overdue inspection flags."
    roles: [ProgramAdmin]
    success_code: 200
    input: []
    output: "{ swept_at: string, defaulted_order_count: integer, defaulted_order_ids: string, escalated_deficiency_count: integer, referred_order_count: integer, expired_eap_count: integer, penalty_cents_assessed: integer, newly_delinquent_owner_count: integer, dams_moved_under_enforcement: integer, overdue_inspection_count: integer }"
    side_effects:
      - "orders past compliance_deadline_at move to DEFAULTED with a final-variant penalty, driving the four-link enforcement cascade"
      - "orders DEFAULTED for longer than the referral period move to the terminal REFERRED_FOR_ENFORCEMENT"
      - "APPROVED plans past expires_at move to EXPIRED and may open a SYSTEM_EAP / EAP_MISSING Deficiency"
      - "Dam.inspection_overdue is recomputed for every dam against the current logical clock"
  - method: POST
    path: /_clock/set_current_utc
    description: Set the logical UTC clock used by every temporal rule. Monotonic and never moves backwards.
    roles: [ProgramAdmin]
    success_code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "the logical clock becomes to_iso8601; Engineer.license_status and Dam.inspection_overdue are re-derived on next read"
      - "default value at the start of every scenario is 2026-08-01T00:00:00Z"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-Role header missing or empty"
    applies_to: ["all except POST /_clock/set_current_utc"]
  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "X-Role is not among the endpoint's authorized roles"
    applies_to: ["all"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, unknown enum member, unparseable timestamp, out-of-range number, window_start >= window_end, amount_cents == 0, limit outside 1..100, negative offset"
    applies_to: ["all"]
  - id: ERR_OWNER_NOT_FOUND
    http_status: 404
    condition: "owner id in the path or body does not exist"
    applies_to: ["GET /owners/{id}", "POST /owners/{id}/fee-adjustments", "GET /owners/{id}/fee-ledger-entries", "POST /dams"]
  - id: ERR_ENGINEER_NOT_FOUND
    http_status: 404
    condition: "engineer id in the path or body does not exist"
    applies_to: ["GET /engineers/{id}", "POST /inspections", "POST /permits/{id}/assign-review"]
  - id: ERR_REACH_NOT_FOUND
    http_status: 404
    condition: "river reach id does not exist"
    applies_to: ["GET /river-reaches/{id}", "POST /dams"]
  - id: ERR_DAM_NOT_FOUND
    http_status: 404
    condition: "dam id in the path or body does not exist"
    applies_to: ["GET /dams/{id}", "GET /dams/{id}/compliance-summary", "POST /dams/{id}/state-intervention", "POST /consequence-assessments", "POST /inspections", "POST /emergency-action-plans", "POST /permits", "POST /high-water-events", "POST /drawdown-orders"]
  - id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    condition: "consequence assessment id does not exist"
    applies_to: ["GET /consequence-assessments/{id}", "POST /consequence-assessments/{id}/certify"]
  - id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    condition: "inspection id does not exist"
    applies_to: ["GET /inspections/{id}", "POST /inspections/{id}/submit", "POST /inspections/{id}/accept", "POST /inspections/{id}/return"]
  - id: ERR_DEFICIENCY_NOT_FOUND
    http_status: 404
    condition: "deficiency id does not exist"
    applies_to: ["GET /deficiencies/{id}", "POST /deficiencies/{id}/remediation-orders"]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: "remediation order id does not exist"
    applies_to: ["GET /remediation-orders/{id}", "GET /remediation-orders/{id}/penalty-preview", "POST /remediation-orders/{id}/response", "POST /remediation-orders/{id}/verify"]
  - id: ERR_EAP_NOT_FOUND
    http_status: 404
    condition: "emergency action plan id does not exist"
    applies_to: ["GET /emergency-action-plans/{id}", "POST /emergency-action-plans/{id}/submit", "POST /emergency-action-plans/{id}/review", "POST /emergency-action-plans/{id}/exercises", "GET /emergency-action-plans/{id}/exercises"]
  - id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    condition: "permit id does not exist"
    applies_to: ["GET /permits/{id}", "POST /permits/{id}/assign-review", "POST /permits/{id}/decision", "POST /permits/{id}/resubmit"]
  - id: ERR_EVENT_NOT_FOUND
    http_status: 404
    condition: "high-water event id in the path or body does not exist"
    applies_to: ["GET /high-water-events/{id}", "POST /high-water-events/{id}/readings", "GET /high-water-events/{id}/readings", "POST /high-water-events/{id}/stand-down", "POST /drawdown-orders"]
  - id: ERR_DRAWDOWN_NOT_FOUND
    http_status: 404
    condition: "drawdown order id does not exist"
    applies_to: ["GET /drawdown-orders/{id}", "POST /drawdown-orders/{id}/coordinate", "POST /drawdown-orders/{id}/activate", "POST /drawdown-orders/{id}/complete", "POST /drawdown-orders/{id}/cancel"]
  - id: ERR_IDENTITY_UNKNOWN
    http_status: 403
    condition: "X-Role is an entity-backed role but X-User-ID does not resolve to a row of the backing entity"
    applies_to: ["all endpoints authorized for Engineer or DamOwner"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "acting DamOwner is not the owner of the targeted dam, plan, order or permit"
    applies_to: ["POST /emergency-action-plans", "POST /emergency-action-plans/{id}/submit", "POST /remediation-orders/{id}/response", "POST /permits", "POST /permits/{id}/resubmit", "GET /owners/{id}/fee-ledger-entries"]
  - id: ERR_NOT_ASSIGNED_ENGINEER
    http_status: 403
    condition: "acting Engineer is not the engineer assigned to the inspection, or is not the permit's non-null review_engineer_id"
    applies_to: ["POST /inspections/{id}/submit", "POST /permits/{id}/decision"]
  - id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    condition: "assessment is not DRAFT when certification is attempted"
    applies_to: ["POST /consequence-assessments/{id}/certify"]
  - id: ERR_INSPECTION_INVALID_STATE
    http_status: 409
    condition: "inspection status does not permit the requested transition"
    applies_to: ["POST /inspections/{id}/submit", "POST /inspections/{id}/accept", "POST /inspections/{id}/return"]
  - id: ERR_DEFICIENCY_INVALID_STATE
    http_status: 409
    condition: "deficiency is not OPEN or ESCALATED when an order is issued"
    applies_to: ["POST /deficiencies/{id}/remediation-orders"]
  - id: ERR_ORDER_INVALID_STATE
    http_status: 409
    condition: "remediation order status does not permit the requested operation"
    applies_to: ["POST /remediation-orders/{id}/response", "POST /remediation-orders/{id}/verify", "GET /remediation-orders/{id}/penalty-preview"]
  - id: ERR_EAP_INVALID_STATE
    http_status: 409
    condition: "plan status does not permit submission, review or exercise logging"
    applies_to: ["POST /emergency-action-plans/{id}/submit", "POST /emergency-action-plans/{id}/review", "POST /emergency-action-plans/{id}/exercises"]
  - id: ERR_PERMIT_INVALID_STATE
    http_status: 409
    condition: "permit status does not permit assignment, decision or resubmission"
    applies_to: ["POST /permits/{id}/assign-review", "POST /permits/{id}/decision", "POST /permits/{id}/resubmit"]
  - id: ERR_EVENT_INVALID_STATE
    http_status: 409
    condition: "high-water event is already STOOD_DOWN"
    applies_to: ["POST /high-water-events/{id}/readings", "POST /high-water-events/{id}/stand-down", "POST /drawdown-orders"]
  - id: ERR_DRAWDOWN_INVALID_STATE
    http_status: 409
    condition: "drawdown order status does not permit coordination, activation, completion or cancellation"
    applies_to: ["POST /drawdown-orders/{id}/coordinate", "POST /drawdown-orders/{id}/activate", "POST /drawdown-orders/{id}/complete", "POST /drawdown-orders/{id}/cancel"]
  - id: ERR_DAM_NOT_OPERABLE
    http_status: 409
    condition: "dam regulatory_status is BREACHED, or REMOVAL_PERMITTED for an operation that presupposes a standing dam"
    applies_to: ["POST /consequence-assessments", "POST /consequence-assessments/{id}/certify", "POST /inspections", "POST /permits", "POST /high-water-events", "POST /drawdown-orders", "POST /emergency-action-plans"]
  - id: ERR_STALE_DAM_VERSION
    http_status: 412
    condition: "expected_dam_version does not equal Dam.version"
    applies_to: ["POST /emergency-action-plans"]
  - id: ERR_STALE_REACH_VERSION
    http_status: 412
    condition: "expected_reach_version does not equal RiverReach.version"
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
  - id: ERR_ENGINEER_LICENSE_EXPIRED
    http_status: 422
    condition: "the acting or referenced engineer's license has expired against the current logical clock"
    applies_to: ["POST /inspections", "POST /inspections/{id}/submit", "POST /inspections/{id}/accept", "POST /consequence-assessments/{id}/certify", "POST /emergency-action-plans/{id}/review", "POST /permits/{id}/assign-review", "POST /permits/{id}/decision", "POST /remediation-orders/{id}/verify"]
  - id: ERR_ENGINEER_NOT_CERTIFIED
    http_status: 422
    condition: "the dam's hazard class is not in the engineer's certified_hazard_classes"
    applies_to: ["POST /inspections", "POST /inspections/{id}/submit", "POST /consequence-assessments/{id}/certify"]
  - id: ERR_UNSAFE_DAM_PERMIT_BLOCKED
    http_status: 422
    condition: "a CONSTRUCTION permit is issued on a dam whose safety_status is UNSATISFACTORY"
    applies_to: ["POST /permits/{id}/decision"]
  - id: ERR_EAP_NOT_APPROVED
    http_status: 422
    condition: "a HIGH-hazard dam has no APPROVED emergency action plan"
    applies_to: ["POST /permits/{id}/decision", "POST /drawdown-orders"]
  - id: ERR_EVENT_NOT_IN_EMERGENCY
    http_status: 422
    condition: "a coordinated release is activated while the event is still MONITORING"
    applies_to: ["POST /drawdown-orders/{id}/activate"]
  - id: ERR_DAM_UNCLASSIFIED
    http_status: 422
    condition: "the dam has never had a certified consequence assessment"
    applies_to: ["POST /inspections", "POST /permits", "POST /emergency-action-plans/{id}/submit", "POST /drawdown-orders"]
  - id: ERR_OUTSIDE_INSPECTION_WINDOW
    http_status: 422
    condition: "performed_at falls outside the half-open reserved window"
    applies_to: ["POST /inspections/{id}/submit"]
  - id: ERR_PERFORMED_AT_IN_FUTURE
    http_status: 422
    condition: "performed_at is later than the current logical clock"
    applies_to: ["POST /inspections/{id}/submit"]
  - id: ERR_REACH_CAPACITY_EXCEEDED
    http_status: 409
    condition: "windowed committed release plus the new release exceeds the reach's channel capacity"
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
  - id: ERR_INSUFFICIENT_STORAGE
    http_status: 409
    condition: "planned_release_acre_ft exceeds the dam's available conservation storage"
    applies_to: ["POST /drawdown-orders/{id}/coordinate"]
  - id: ERR_ENGINEER_WINDOW_CONFLICT
    http_status: 409
    condition: "the requested window conflicts with one of the engineer's other non-accepted windows including the travel buffer"
    applies_to: ["POST /inspections"]
  - id: ERR_INSUFFICIENT_NOTIFICATION_CONTACTS
    http_status: 422
    condition: "notification_contact_count is below the hazard class minimum"
    applies_to: ["POST /emergency-action-plans/{id}/submit"]
  - id: ERR_INUNDATION_MAP_STALE
    http_status: 422
    condition: "the plan's inundation_map_ref does not match the dam's certified assessment"
    applies_to: ["POST /emergency-action-plans/{id}/submit"]
  - id: ERR_BREACH_ANALYSIS_INCOMPLETE
    http_status: 422
    condition: "certification attempted with a zero travel time, inundation area or peak outflow"
    applies_to: ["POST /consequence-assessments/{id}/certify"]
  - id: ERR_EXERCISE_DATE_IN_FUTURE
    http_status: 422
    condition: "conducted_at is later than the current logical clock"
    applies_to: ["POST /emergency-action-plans/{id}/exercises"]
  - id: ERR_OWNER_DELINQUENT
    http_status: 402
    condition: "the owner's fee balance is at or above the delinquency threshold when a permit decision is made"
    applies_to: ["POST /permits/{id}/decision"]
  - id: ERR_INSUFFICIENT_FINANCIAL_ASSURANCE
    http_status: 402
    condition: "a HIGH-hazard owner's financial assurance bond is below the statutory minimum"
    applies_to: ["POST /permits/{id}/decision"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the acting engineer accepts their own submitted inspection, or a permit review is assigned to the dam's engineer of record"
    applies_to: ["POST /inspections/{id}/accept", "POST /permits/{id}/assign-review"]
  - id: ERR_DUPLICATE_NID_CODE
    http_status: 409
    condition: "nid_code already exists on another dam"
    applies_to: ["POST /dams"]
  - id: ERR_DUPLICATE_LICENSE_NUMBER
    http_status: 409
    condition: "license_number already exists on another engineer"
    applies_to: ["POST /engineers"]
  - id: ERR_LEDGER_SIGN_MISMATCH
    http_status: 422
    condition: "amount_cents sign disagrees with entry_type"
    applies_to: ["POST /owners/{id}/fee-adjustments"]
  - id: ERR_EVENT_DAM_MISMATCH
    http_status: 422
    condition: "the referenced high-water event belongs to a different dam"
    applies_to: ["POST /drawdown-orders"]
  - id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    condition: "the requested clock value is earlier than the current logical clock"
    applies_to: ["POST /_clock/set_current_utc"]

# =============================================================================
# §1.7 RBAC Permission Matrix
#   `identity:` declares how X-User-ID is interpreted for the role.
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "State dam safety program staff. Owns the inventory, scheduling, enforcement and intervention authority."
    identity: opaque
    exclusive_operations:
      - "POST /owners"
      - "GET /owners"
      - "POST /owners/{id}/fee-adjustments"
      - "POST /engineers"
      - "GET /engineers"
      - "POST /river-reaches"
      - "POST /dams"
      - "POST /dams/{id}/state-intervention"
      - "POST /inspections"
      - "POST /inspections/{id}/return"
      - "POST /deficiencies/{id}/remediation-orders"
      - "POST /permits/{id}/assign-review"
      - "POST /drawdown-orders/{id}/coordinate"
      - "POST /program/compliance-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /owners/{id}"
      - "GET /owners/{id}/fee-ledger-entries"
      - "GET /river-reaches/{id}"
      - "GET /river-reaches"
      - "GET /dams/{id}"
      - "GET /dams"
      - "GET /dams/{id}/compliance-summary"
      - "GET /consequence-assessments/{id}"
      - "GET /consequence-assessments"
      - "GET /inspections/{id}"
      - "GET /inspections"
      - "POST /inspections/{id}/accept"
