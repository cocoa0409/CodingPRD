            - { call: "POST /v1/mentoring-engagements", payload: { program_id: "${pid}", sponsor_id: "${sp}", starts_at: "2026-09-29T00:00:00Z", ends_at: "2026-10-13T00:00:00Z" }, as: Employee, as_user_id: "emp_m2", captures: { e2: $.data.id, st: $.data.status } }
          assert:
            - "First E2 attempt (2026-09-28, inside buffer) fails with error_id == ERR_MENTORING_WINDOW_CONFLICT (HTTP 409)"
            - "Second attempt (2026-09-29, exactly ends_at + 14 days) succeeds with 201 and status PROPOSED"

  - rule_id: compensating_invariant
    instances:
      - name: budget_reserve_disburse_reconcile_conservation
        grounds:
          - calculations.budget_ledger
          - state_machines.FundingRequest.ENDORSED_to_APPROVED
          - state_machines.FundingRequest.APPROVED_to_DISBURSED
          - state_machines.FundingRequest.DISBURSED_to_RECONCILED
        distinguishing_aspect: |
          Conserved quantity: cents. The partition allocated == available + reserved +
          spent holds after every step (reserve 310000, disburse, reconcile refund 10000),
          and the program-level pool_total 500000 == unallocated + allocated holds after
          the refund returns 10000 to unallocated.
        test_recipe:
          setup:
            - "Program pool 500000 -> ALLOCATION_LOCKED; single ACTIVE group allocated 500000; leader term emp_f01"
            - "Request requested_cents=300000, external_matching_cents=50000, ENDORSED (provisional 305000 <= 1000000 -> HIGH 20%, match 10000)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 500000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp17", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Ledger Group", mission_statement: "Invariant", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l17", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l17" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/leadership-terms", payload: { group_id: "${g}", leader_employee_id: "emp_f01", ends_at: "2027-02-01T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/programs/${pid}/lock-allocation", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/funding-requests", payload: { group_id: "${g}", category: "TRAINING", purpose: "Ledger walk", requested_cents: 300000, external_matching_cents: 50000 }, as: GroupLeader, as_user_id: "emp_f01", captures: { fr: $.data.id } }
            - { call: "POST /v1/funding-requests/${fr}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
          trigger:
            - { call: "POST /v1/funding-requests/${fr}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin, captures: { appr: $.data.approved_cents } }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { alloc1: $.data.allocated_cents, res1: $.data.reserved_cents, spent1: $.data.spent_cents, avail1: $.data.available_cents } }
            - { call: "POST /v1/funding-requests/${fr}/disburse", payload: {}, as: DeiAdmin }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { alloc2: $.data.allocated_cents, res2: $.data.reserved_cents, spent2: $.data.spent_cents, avail2: $.data.available_cents } }
            - { call: "POST /v1/funding-requests/${fr}/reconcile", payload: { actual_spend_cents: 300000 }, as: GroupLeader, as_user_id: "emp_f01" }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { alloc3: $.data.allocated_cents, res3: $.data.reserved_cents, spent3: $.data.spent_cents, avail3: $.data.available_cents } }
            - { call: "GET /v1/programs/${pid}", payload: {}, as: DeiAdmin, captures: { unal3: $.data.unallocated_pool_cents } }
          assert:
            - "appr == 310000 (300000 + round_half_up(0.20 * 50000))"
            - "after approve: allocated 500000 == reserved 310000 + spent 0 + available 190000"
            - "after disburse: allocated 500000 == reserved 0 + spent 310000 + available 190000"
            - "after reconcile(300000): allocated 490000 == reserved 0 + spent 300000 + available 190000"
            - "program conservation: pool_total 500000 == unallocated_pool_cents 10000 + allocated 490000"
            - "FundingRequest.${fr}.status == RECONCILED"

      - name: membership_join_leave_rejoin_conservation
        grounds:
          - state_machines.GroupMembership.transitions
          - entities.ErgGroup.fields.active_member_count
        distinguishing_aspect: |
          Conserved quantity: integer headcount (different conserved type than cents).
          join (+1) paired with leave (-1) returns active_member_count to baseline, and
          rejoin reactivates the same row in place — the denormalized count always equals
          the number of ACTIVE membership rows.
        test_recipe:
          setup:
            - "Program OPEN; group 'Headcount' in CHARTER_DRAFT (no members yet)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Headcount", mission_statement: "Membership conservation", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l18", captures: { g: $.data.id } }
          trigger:
            - { call: "POST /v1/memberships", payload: { group_id: "${g}" }, as: Employee, as_user_id: "emp_x", captures: { m1: $.data.id } }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { c1: $.data.active_member_count } }
            - { call: "POST /v1/memberships/${m1}/leave", payload: {}, as: Employee, as_user_id: "emp_x" }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { c2: $.data.active_member_count } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}" }, as: Employee, as_user_id: "emp_x", captures: { m2: $.data.id } }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { c3: $.data.active_member_count } }
            - { call: "GET /v1/memberships/${m1}", payload: {}, as: DeiAdmin, captures: { mst: $.data.status, mleft: $.data.left_at } }
          assert:
            - "c1 == 1 (join +1)"
            - "c2 == 0 (leave -1: forward+compensating pair nets to baseline)"
            - "c3 == 1 (rejoin reactivates)"
            - "m2 == m1 (same membership row reactivated in place)"
            - "mst == ACTIVE and left_at == null"

      - name: rsvp_cancel_promotes_waitlist_head
        grounds:
          - calculations.waitlist_promotion
          - state_machines.EventRsvp.REGISTERED_to_CANCELLED
          - state_machines.EventRsvp.WAITLISTED_to_REGISTERED
        distinguishing_aspect: |
          Conserved quantity: occupied seats. Cancelling a REGISTERED rsvp with a
          non-empty waitlist leaves event.registered_count unchanged at capacity (1),
          because the lowest waitlist_position rsvp is promoted in the same operation.
        test_recipe:
          setup:
            - "Program OPEN; group 'Promoters' ACTIVE; event PUBLISHED capacity 1 on 2026-08-10T10:00:00Z-12:00:00Z"
            - "emp_a REGISTERED (seat), emp_b WAITLISTED position 1, emp_c WAITLISTED position 2"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp18", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Promoters", mission_statement: "Waitlist", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l19", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l19" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/venues", payload: { name: "Studio", capacity: 10 }, as: DeiAdmin, captures: { v: $.data.id } }
            - { call: "POST /v1/events", payload: { group_id: "${g}", venue_id: "${v}", title: "Tiny Event", category: "WORKSHOP", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", capacity: 1 }, as: DeiAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/events/${ev}/publish", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_a", captures: { ra: $.data.id, ra_st: $.data.status } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_b", captures: { rb: $.data.id, rb_st: $.data.status, rb_pos: $.data.waitlist_position } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_c", captures: { rc: $.data.id, rc_st: $.data.status, rc_pos: $.data.waitlist_position } }
          trigger:
            - { call: "POST /v1/rsvps/${ra}/cancel", payload: {}, as: Employee, as_user_id: "emp_a" }
            - { call: "GET /v1/rsvps/${rb}", payload: {}, as: DeiAdmin, captures: { rb_after: $.data.status } }
            - { call: "GET /v1/rsvps/${rc}", payload: {}, as: DeiAdmin, captures: { rc_after: $.data.status } }
            - { call: "GET /v1/events/${ev}", payload: {}, as: DeiAdmin, captures: { rcnt: $.data.registered_count } }
          assert:
            - "ra_st == REGISTERED (first RSVP takes the single seat)"
            - "rb_st == WAITLISTED with waitlist_position 1; rc_st == WAITLISTED with waitlist_position 2 (boundary: registered_count == capacity lands on waitlist)"
            - "after cancel: rb_after == REGISTERED (head promoted), rc_after == WAITLISTED"
            - "ErgEvent.${ev}.registered_count == 1 (seat conserved: -1 cancel, +1 promote)"
