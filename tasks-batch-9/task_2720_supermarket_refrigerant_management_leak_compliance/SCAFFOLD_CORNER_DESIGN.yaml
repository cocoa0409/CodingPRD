      - name: technician_filing_a_record_under_another_technicians_id_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TECHNICIAN_IDENTITY_MISMATCH
          - validations[priority=6]
        distinguishing_aspect: "Role alone is not enough on the technician write path: the caller is a genuine Technician calling a Technician-only endpoint, and the only defect is that X-User-ID names a different technician than the body's technician_id, so the 403 must be ERR_TECHNICIAN_IDENTITY_MISMATCH and not ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Canonical single-store fixture at clock 2026-08-01T00:00:00Z with two ACTIVE technicians, both certified beyond the clock, and one certified recovery machine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_TECHNICIAN_IDENTITY_MISMATCH and success == false"
            - "error_id is NOT ERR_FORBIDDEN_ROLE - Technician is a permitted role on POST /service-records"
            - "no ServiceRecord is persisted: GET /service-records?system_id=${sys1_id} returns total_count 0"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs is still 80.0 and version is still ${sys1_v}"
            - "the identical body sent as Technician with X-User-ID == ${tech1_id} returns 201, proving the header is the only defect"

