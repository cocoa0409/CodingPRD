              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Alder Ridge High", school_code: "AR-01", max_concurrent_seats: 40 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
