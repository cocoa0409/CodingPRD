      - name: universal_availability_notice_validity_rejects_posting_and_short_reach
        claim_type: correct_result
        grounds:
          - calculations.universal_availability_notice_validity
          - entities.UniversalAvailabilityNotice.fields.is_valid
          - calculations.eligibility_determination
        distinguishing_aspect: "A notice delivered only by INTRANET_POSTING is never valid, and a notice whose recipient_count is below the plan's reported_participant_count is never valid; a determination made against a plan year whose only notice is invalid reports notice_status INVALID rather than MISSING."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan for plan year 2026 with reported_participant_count 250, and a second ACTIVE PLAN_403B plan for plan year 2026 with the same count."
