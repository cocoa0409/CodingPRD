# =============================================================================
# 1.8 SCAFFOLD DIFFICULTY DESIGN (depth test-targeting index)
# Cross-references SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty
# Rules. Not an independent rule source: every instance grounds in elements
# already declared in SCAFFOLD.yaml. Every non-stub instance is a DEPTH probe
# (queue A): multi-step worked arithmetic, validation-precedence races,
# multi-hop cascades, OCC staleness, and pinned rounding/boundary edges.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: escalation_provisional_spot_vs_final_nonprovisional_mean_same_clause
        grounds:
          - calculations.material_escalation_amount
          - entities.EscalationClause.fields.base_index_month
          - entities.EscalationClause.fields.final_window_end_month
          - entities.CommodityIndexPoint.fields.is_provisional
          - entities.EscalationAdjustment.fields.index_months_used
          - validations[priority=69]
        distinguishing_aspect: |
          Both adjustments read the identical CommodityIndexPoint series on the identical clause,
          yet PROVISIONAL yields adjustment_amount_cents 880000 (single spot level, provisional
          print 2026-04 admitted) while FINAL yields 500000 (arithmetic mean of only the
          non-provisional months 2026-02 and 2026-03), so a single shared code path is impossible.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z so every index print below is usable (published_at <= clock)."
            - "One EngineeredOrder TX-ESC-0001, POWER_TRANSFORMER, contract_value_cents 60000000, engineering_status ENG_OPEN."
            - "One ACTIVE EscalationClause: copper 6000 bp, aluminum 4000 bp, core_steel 0 bp, escalatable_base_cents 10000000, base_index_month 2026-01, final_window_end_month 2026-04, cap_bp 1000 (cap 1000000 cents), collar_bp 100 (collar 100000 cents), de_escalation_enabled false."
            - "COPPER prints 2026-01=100.0000, 2026-02=104.0000, 2026-03=110.0000 (all final) and 2026-04=112.0000 flagged is_provisional true."
            - "ALUMINUM prints 2026-01=200.0000, 2026-02=202.0000, 2026-03=206.0000 (all final) and 2026-04=208.0000 flagged is_provisional true."
            - "CORE_STEEL prints 2026-01=300.0000 and 2026-04=300.0000 (weight 0 bp, so its component is 0 in both variants)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-ESC-0001", customer_name: "Northgrid Utility", product_family: "POWER_TRANSFORMER", rated_kv: 138, contract_value_cents: 60000000, sold_at: "2026-01-05T00:00:00Z", promised_ship_at: "2026-12-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /commodity-index-points"
              payload: { commodity: "COPPER", index_month: "2026-01", index_value: 100.0000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "COPPER", index_month: "2026-02", index_value: 104.0000, published_at: "2026-03-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "COPPER", index_month: "2026-03", index_value: 110.0000, published_at: "2026-04-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "COPPER", index_month: "2026-04", index_value: 112.0000, published_at: "2026-05-05T00:00:00Z", is_provisional: true }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "ALUMINUM", index_month: "2026-01", index_value: 200.0000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "ALUMINUM", index_month: "2026-02", index_value: 202.0000, published_at: "2026-03-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "ALUMINUM", index_month: "2026-03", index_value: 206.0000, published_at: "2026-04-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "ALUMINUM", index_month: "2026-04", index_value: 208.0000, published_at: "2026-05-05T00:00:00Z", is_provisional: true }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "CORE_STEEL", index_month: "2026-01", index_value: 300.0000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /commodity-index-points"
              payload: { commodity: "CORE_STEEL", index_month: "2026-04", index_value: 300.0000, published_at: "2026-05-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: "POST /engineered-orders/${ord_id}/escalation-clauses"
              payload: { copper_weight_bp: 6000, aluminum_weight_bp: 4000, core_steel_weight_bp: 0, escalatable_base_cents: 10000000, base_index_month: "2026-01", cap_bp: 1000, collar_bp: 100, de_escalation_enabled: false, final_window_end_month: "2026-04" }
              as: ContractAdmin
              captures: { clause_id: $.data.id }
          trigger:
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: PlantAdmin
              captures: { ord_vA: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/escalation-adjustments"
              payload: { escalation_clause_id: "${clause_id}", variant: "PROVISIONAL", prepared_by_user_id: "u_ca_1", expected_engineered_order_version: "${ord_vA}" }
              as: ContractAdmin
              captures: { adj_prov_id: $.data.id }
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: PlantAdmin
              captures: { ord_vB: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/escalation-adjustments"
              payload: { escalation_clause_id: "${clause_id}", variant: "FINAL", prepared_by_user_id: "u_ca_1", expected_engineered_order_version: "${ord_vB}" }
              as: ContractAdmin
              captures: { adj_final_id: $.data.id }
          assert:
            - "EscalationAdjustment.${adj_prov_id}.copper_component_cents == 720000"
            - "EscalationAdjustment.${adj_prov_id}.aluminum_component_cents == 160000"
            - "EscalationAdjustment.${adj_prov_id}.core_steel_component_cents == 0"
            - "EscalationAdjustment.${adj_prov_id}.raw_movement_cents == 880000"
            - "EscalationAdjustment.${adj_prov_id}.adjustment_amount_cents == 880000"
            - "EscalationAdjustment.${adj_prov_id}.cap_applied == false"
            - "EscalationAdjustment.${adj_prov_id}.collar_absorbed == false"
            - "EscalationAdjustment.${adj_prov_id}.index_months_used == ['2026-01', '2026-04']"
            - "EscalationAdjustment.${adj_final_id}.copper_component_cents == 420000"
            - "EscalationAdjustment.${adj_final_id}.aluminum_component_cents == 80000"
            - "EscalationAdjustment.${adj_final_id}.raw_movement_cents == 500000"
            - "EscalationAdjustment.${adj_final_id}.adjustment_amount_cents == 500000"
            - "EscalationAdjustment.${adj_final_id}.index_months_used == ['2026-01', '2026-02', '2026-03']"
            - "EscalationAdjustment.${adj_prov_id}.adjustment_amount_cents != EscalationAdjustment.${adj_final_id}.adjustment_amount_cents"
            - "EscalationAdjustment.${adj_prov_id}.status == CALCULATED and EscalationAdjustment.${adj_final_id}.status == CALCULATED"

      - name: supplier_quality_trailing_denominator_floor_vs_lifetime_suspension_gate
        grounds:
          - calculations.supplier_quality_index
          - entities.Supplier.fields.quality_index_trailing
          - entities.Supplier.fields.quality_index_lifetime
          - entities.Supplier.fields.receipt_event_count
          - state_machines.Supplier.APPROVED_to_PROBATION
          - state_machines.Supplier.PROBATION_to_SUSPENDED
        distinguishing_aspect: |
          With receipt_event_count 2 and three PUBLISHED reports of defect_weight 10 each, the
          TRAILING variant floors its denominator at 8 and lands on 62.50 (>= the 60.00 suspension
          threshold) while the LIFETIME variant floors at 1, uses denominator 2, and clamps to
          0.00 - so suspension is authorised only by LIFETIME, and an implementation that reuses
          one denominator cannot produce both numbers.
        test_recipe:
          setup:
            - "Full pipeline order SW-WAR-0002 (MV_SWITCHGEAR, rated_kv 15, contract_value_cents 4000000) driven to fulfillment_status CLOSED with one CommissioningJob in COMPLETE, so warranty claims are admissible."
            - "Supplier SUP-Q02 with receipt_event_count exactly 2 (below the TRAILING floor of 8, above the LIFETIME floor of 1)."
            - "Three WarrantyClaim rows on that order, each advanced to ANALYSIS_IN_PROGRESS, each carrying one FailureAnalysisReport with root_cause_code SUPPLIER_DEFECT, quarantine_recommended false and defect_weight 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "SW-WAR-0002", customer_name: "Harborline Power", product_family: "MV_SWITCHGEAR", rated_kv: 15, contract_value_cents: 4000000, sold_at: "2026-01-05T00:00:00Z", promised_ship_at: "2026-11-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/submittal-drawings"
              payload: { drawing_set_code: "DS-A", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_v0}" }
              as: DesignEngineer
              captures: { dwg1_id: $.data.id }
            - call: "POST /submittal-drawings/${dwg1_id}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg1_id}/begin-review"
              payload: {}
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /submittal-drawings/${dwg1_id}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-Q02", legal_name: "Aurora Magnetics", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/receipt-events"
              payload: { event_count: 2 }
              as: MaterialsPlanner
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "BSH-500", category: "HV_BUSHING", lead_time_days: 60, quantity_on_hand: 10, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id, comp_v0: $.data.version }
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 4, priority_class: 2, need_by_date: "2026-06-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /component-allocations/${alloc_id}/commit"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /engineered-orders/${ord_id}/start-production"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-Q02", max_kv: 145, changeover_buffer_hours: 4, supports_impulse: true }
