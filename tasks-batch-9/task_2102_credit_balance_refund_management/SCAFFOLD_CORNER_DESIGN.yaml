      - name: forbidden_role_check_precedes_existence_check_priority_ordering
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_CREDIT_BALANCE_NOT_FOUND]"]
        distinguishing_aspect: "A DisbursementOfficer calling POST /credit-balances/{id}/start-review on a non-existent credit balance id receives 403 ERR_FORBIDDEN_ROLE, not 404 ERR_CREDIT_BALANCE_NOT_FOUND, because authorization runs at priority 2 and existence at priority 3."
        test_recipe:
          setup: ["Empty database apart from one payer."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
