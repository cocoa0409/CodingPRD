# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3328_same_day_catalog_fulfillment_deep_inventory_breadth
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: distribution_center_create_returns_every_declared_field_and_starts_open
        claim_type: Creation
        grounds:
          - entities.DistributionCenter
          - endpoints.POST_/distribution-centers
          - entities.DistributionCenter.fields.operations_posture
        distinguishing_aspect: "A DC created with only the six client fields comes back 201 with operations_posture OPEN, cutoff_sequence_index 0, inbound_reserved_units 0, a system-generated id and version 1 — none of those four is client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "DistributionCenter.${dc_id}.operations_posture == OPEN"
            - "DistributionCenter.${dc_id}.cutoff_sequence_index == 0"
            - "DistributionCenter.${dc_id}.inbound_reserved_units == 0"
            - "DistributionCenter.${dc_id}.version == 1"
            - "DistributionCenter.${dc_id}.local_current_time == \"04:00:00\" and cutoff_passed == false"
            - "the response data carries a non-null created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: catalog_item_get_round_trips_the_dimension_payload
        claim_type: Retrieval
        grounds:
          - entities.CatalogItem
          - endpoints.GET_/items/{id}
          - entities.CatalogItem.fields.curated_dimension_json
        distinguishing_aspect: "The four-key curated_dimension_json object round-trips through GET /items/{id} unchanged, including the nested drawing_revision integer, and curation_review_state reads UNREVIEWED because no review has run."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One catalog item created with a four-key dimension payload."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /items"
              payload: { sku: "RT-1001", description: "Round-trip sleeve bearing", material_spec: "bronze", long_tail: false, unit_price_cents: 2500, unit_weight_kg: 0.15, curation_bundle_size: 6, curated_dimension_json: { nominal_length_mm: 55, nominal_width_mm: 22, nominal_height_mm: 22, drawing_revision: 7 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /items/${item_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "acct-roundtrip"
          assert:
            - "the response status is 200"
            - "CatalogItem.${item_id}.sku == \"RT-1001\" and material_spec == \"bronze\""
            - "CatalogItem.${item_id}.curated_dimension_json.nominal_length_mm == 55 and nominal_width_mm == 22"
            - "CatalogItem.${item_id}.curated_dimension_json.drawing_revision == 7"
            - "CatalogItem.${item_id}.curation_review_state == UNREVIEWED"
            - "CatalogItem.${item_id}.catalog_status == ACTIVE"

      - name: items_list_filters_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.CatalogItem.fields.long_tail
        distinguishing_aspect: "With three items on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, limit=2&offset=2 returns the remaining 1 row with has_more false, and the long_tail filter narrows total_count to 1 — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. Three catalog items curated by one curator: two non-long-tail, one long-tail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /items"
              payload: { sku: "LS-1001", description: "Listing item one", material_spec: "brass", long_tail: false, unit_price_cents: 1000, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
            - call: "POST /items"
              payload: { sku: "LS-1002", description: "Listing item two", material_spec: "brass", long_tail: false, unit_price_cents: 1100, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 11, nominal_width_mm: 11, nominal_height_mm: 11, drawing_revision: 1 } }
              as: CatalogCurator
            - call: "POST /items"
              payload: { sku: "LS-1003", description: "Listing item three", material_spec: "cast iron", long_tail: true, unit_price_cents: 1200, unit_weight_kg: 0.30, curation_bundle_size: 3, curated_dimension_json: { nominal_length_mm: 12, nominal_width_mm: 12, nominal_height_mm: 12, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { lt_item_id: $.data.id }
          trigger:
            - call: "GET /items"
              payload: { limit: 2, offset: 0 }
              as: CatalogCurator
            - call: "GET /items"
              payload: { limit: 2, offset: 2 }
              as: CatalogCurator
            - call: "GET /items"
              payload: { long_tail: true, limit: 100, offset: 0 }
              as: CatalogCurator
          assert:
            - "the limit=2&offset=0 page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "the limit=2&offset=2 page returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /items?long_tail=true returns exactly 1 row, CatalogItem.${lt_item_id}, with total_count == 1"
            - "GET /items with no query parameters returns 3 rows, with limit defaulting to 10 and offset to 0"
            - "every row carries unit_price_cents and is searchable by material_spec"

      - name: item_get_with_unknown_id_returns_item_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/items/{id}
          - errors.ERR_ITEM_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the item path produces the entity-specific 404 ERR_ITEM_NOT_FOUND and never the order-flavoured ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. No item has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CatalogCurator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ITEM_NOT_FOUND"
            - "error_id != ERR_ORDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: order_create_missing_lines_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/orders
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/orders
        distinguishing_aspect: "lines is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check — it is not the 409 ERR_CURATION_NOT_APPROVED that a present-but-uncurated line set produces."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_CURATION_NOT_APPROVED"
            - "GET /orders?account_id=${acct_id} returns 0 rows"

      - name: stock_create_defaults_the_derived_units_to_zero
        claim_type: Defaults
        grounds:
          - entities.InventoriedStock.fields.reserved_units
          - entities.InventoriedStock.fields.available_units
          - entities.InventoriedStock.fields.positioning_flag
          - endpoints.POST_/stock
        distinguishing_aspect: "reserved_units defaults to 0, so a stock row created with 9 on-hand units reports available_units 9 and leaves positioning_flag unset until the DC's cutoff is rolled — the three computed fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC, one account and one curated item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "DF-1001", description: "Default probe item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 9, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
              captures: { stock_id: $.data.id }
          assert:
            - "the response status is 201"
            - "InventoriedStock.${stock_id}.on_hand_units == 9"
            - "InventoriedStock.${stock_id}.reserved_units == 0"
            - "InventoriedStock.${stock_id}.available_units == 9"
            - "InventoriedStock.${stock_id}.daily_demand_units == 2 and inbound_daily_units == 2 as posted"

      - name: inventory_positioning_flag_is_computed_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.InventoriedStock.fields.positioning_flag
          - calculations.inventory_positioning_decision
          - endpoints.POST_/distribution-centers/{id}/roll_cutoff
        distinguishing_aspect: "positioning_flag is computed only by the DC cutoff roll: it is not part of the POST /stock input at all, so a client cannot force LONG_TAIL_DEFICIT on a DC that in fact holds enough SKUs, and rolling the cutoff writes the flag the census actually implies."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. DC BOS with three distinct in-stock SKUs, well past POSITIONING_SKU_THRESHOLD 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "CF-1001", description: "Computed flag item one", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "CF-1002", description: "Computed flag item two", material_spec: "steel", long_tail: false, unit_price_cents: 1600, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 11, nominal_width_mm: 11, nominal_height_mm: 11, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_b_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "CF-1003", description: "Computed flag item three", material_spec: "steel", long_tail: true, unit_price_cents: 1700, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 12, nominal_width_mm: 12, nominal_height_mm: 12, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_c_id: $.data.id }
            - call: "POST /stock"
              payload: { item_id: "${item_a_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_b_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_c_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
          trigger:
            - call: "GET /stock?dc_id=${dc_id}"
              payload: { limit: 100, offset: 0 }
              as: DCManager
            - call: "POST /distribution-centers/${dc_id}/roll_cutoff"
              payload: {}
              as: DCManager
            - call: "GET /stock?dc_id=${dc_id}"
              payload: { limit: 100, offset: 0 }
              as: DCManager
          assert:
            - "before the roll, all three rows report positioning_flag as unset (no OK, UNDERSTOCKED or LONG_TAIL_DEFICIT has been written)"
            - "after the roll, all three rows report positioning_flag == OK because the in-stock SKU census of 3 satisfies >= 2"
            - "DistributionCenter.${dc_id}.cutoff_sequence_index == 1 after the roll"
            - "a stock row created with a positioning_flag key in the payload is rejected with 400 ERR_INVALID_REQUEST, because positioning_flag is not in the POST /stock input schema"

      - name: item_attribute_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.ItemAttribute
          - entities.ItemCrossReference
          - endpoints.GET_/items/{id}/attributes
        distinguishing_aspect: "ItemAttribute and ItemCrossReference are declared common_fields false, so their responses carry only id and created_at — there is no version field, no updated_at, and no update or delete endpoint to mutate an attribute after creation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One item with one attribute row and one cross-reference row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /items"
              payload: { sku: "IM-1001", description: "Immutable attribute item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.25 mm", unit_of_measure: "mm" }
              as: CatalogCurator
              captures: { attr_id: $.data.id }
            - call: "POST /items/${item_id}/cross-references"
              payload: { referenced_manufacturer: "Acme Fasteners", referenced_part_number: "AC-2201", compatibility_note: "direct interchange" }
              as: CatalogCurator
              captures: { xref_id: $.data.id }
          trigger:
            - call: "GET /items/${item_id}/attributes"
              payload: { limit: 100, offset: 0 }
              as: CustomerAccount
              as_user_id: "acct-immutable"
            - call: "GET /items/${item_id}/cross-references"
              payload: { limit: 100, offset: 0 }
              as: CustomerAccount
              as_user_id: "acct-immutable"
          assert:
            - "the attribute row carries id and created_at"
            - "the attribute row has no version field and no updated_at field"
            - "the cross-reference row has no version field and no updated_at field"
            - "there is no PUT, PATCH or DELETE endpoint for /items/{id}/attributes in the API surface, so the row cannot be mutated after creation"
            - "the attribute list returns exactly 1 row with attribute_value == \"1.25 mm\" and the cross-reference list returns exactly 1 row with referenced_part_number == \"AC-2201\""

      - name: distribution_center_create_rejects_duplicate_code_and_zone
        claim_type: Type Constraints
        grounds:
          - entities.DistributionCenter.fields.code
          - entities.DistributionCenter.fields.local_zone
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "code and local_zone are each unique across DistributionCenter, so the second DC reusing either one is rejected with 400 ERR_INVALID_REQUEST while a third DC that changes both is accepted — uniqueness is enforced per field, not on the pair."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC BOS on America/New_York."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/Detroit", local_cutoff_time: "07:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 7200 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /distribution-centers"
              payload: { code: "NEA", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "07:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 7200 }
              as: PlatformAdmin
              captures: { error_id2: $.data.error_id }
            - call: "POST /distribution-centers"
              payload: { code: "NEA", region: "NORTHEAST", local_zone: "America/Detroit", local_cutoff_time: "07:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 7200 }
              as: PlatformAdmin
              captures: { new_dc_id: $.data.id }
          assert:
            - "the duplicate-code attempt returns 400 with error_id == ERR_INVALID_REQUEST"
            - "the duplicate-zone attempt returns 400 with error_id == ERR_INVALID_REQUEST"
            - "the third attempt, changing both code and local_zone, returns 201 and creates a second DC"
            - "GET /distribution-centers?region=NORTHEAST returns exactly 2 rows"

      - name: order_line_requires_an_existing_parent_order_and_item
        claim_type: Parent Relationships
        grounds:
          - entities.CatalogOrderLine
          - entities.CatalogOrderLine.fields.item_id
          - errors.ERR_ITEM_NOT_FOUND
          - endpoints.POST_/orders
        distinguishing_aspect: "Order lines are created only inside POST /orders and every line's item_id must resolve to an existing CatalogItem: a line naming an unknown item rejects the whole order with 404 ERR_ITEM_NOT_FOUND and creates no partial order."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account exists; no item exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "00000000-0000-4000-8000-000000000001", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ITEM_NOT_FOUND"
            - "GET /orders?account_id=${acct_id} returns 0 rows — the order was not created"
            - "there is no POST /order-lines endpoint in the API surface, so a line can only exist under an order created through POST /orders"

      - name: supplier_availability_report_persists_under_its_supplier
        claim_type: Creation
        grounds:
          - entities.SupplierAvailabilityReport
          - endpoints.POST_/suppliers/{id}/availability-reports
          - endpoints.GET_/suppliers/{id}/availability-reports
        distinguishing_aspect: "The availability report is created as a child of the reporting supplier: POST /suppliers/{id}/availability-reports returns 201 and the row is discoverable only through the supplier-anchored list GET, which returns exactly one row carrying the reported item and unit count."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC, one long-tail-authorized supplier with a 50-unit commitment, one long-tail item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_name: "Long Tail Fasteners", home_dc_id: "${dc_id}", primary_attribute_name: "Thread Pitch", primary_attribute_value: "1.25 mm", long_tail_authorized: true, min_stock_commitment_units: 50 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SR-1001", description: "Availability report item", material_spec: "alloy steel", long_tail: true, unit_price_cents: 5500, unit_weight_kg: 0.20, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 30, nominal_width_mm: 8, nominal_height_mm: 8, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /suppliers/${sup_id}/availability-reports"
              payload: { item_id: "${item_id}", reported_available_units: 60 }
              as: PlatformAdmin
              captures: { report_id: $.data.id }
          assert:
            - "the response status is 201 and the returned supplier is Supplier.${sup_id}"
            - "GET /suppliers/${sup_id}/availability-reports returns exactly 1 row with item_id == ${item_id} and reported_available_units == 60"
            - "Supplier.${sup_id}.commitment_breach_count == 0 and performance_rating_units == 100, because 60 reported units cover the 50-unit commitment"
            - "GET /items/${item_id}/availability-reports returns the same single row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: released_order_cannot_be_released_twice
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CatalogOrder.DRAFT_AWAITING_RELEASE_to_RELEASED_AWAITING_RELEASE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From RELEASED the release trigger is not in the transition list, so a second POST /orders/{id}/release answers 409 ERR_INVALID_STATE and leaves the order and its version untouched."
        test_recipe:
          setup:
