            - "data[0].purchase_amount_cents == 5000"
            - "data[0].match_confidence == 0.9"
            - "data[0].qualified == true"
            - "data[0] exposes no id field, no version field and no updated_at field"
            - "§1.5 declares no endpoint that updates or deletes a PurchaseMatch"

      - name: kit_line_with_unknown_parent_campaign_not_found
        claim_type: parent_relationships
        grounds:
          - entities.KitLine.parent
          - validations[priority 8]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
        distinguishing_aspect: "KitLine's parent is Campaign, so a body campaign_id that resolves to nothing is a priority-8 existence failure (404 ERR_CAMPAIGN_NOT_FOUND) rather than an orphaned line."
        test_recipe:
          setup:
