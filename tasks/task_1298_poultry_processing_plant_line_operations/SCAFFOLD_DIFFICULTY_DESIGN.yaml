            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/orders", payload: { customer_name: "CustX", product_code: "WINGS", pounds_ordered: 500.0, temperature_requirement: "FROZEN", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id } }
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 12, input_weight_lb: 1000.0 }, as: ShiftSupervisor, captures: { b1: $.data.id } }
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "IN_PROGRESS" }, as: LineOperator }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-200", grower_name: "GrowerB", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f2: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f2}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f2}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r2: $.data.id } }
            - { call: "POST /poultry/line-runs/${r2}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
