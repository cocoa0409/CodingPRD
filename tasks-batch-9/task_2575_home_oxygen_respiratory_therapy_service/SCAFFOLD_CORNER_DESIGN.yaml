            - "${e_interval} == ERR_INVALID_TRAVEL_INTERVAL (422): the comparison is strict, so a zero-length trip is not an empty itinerary but an error"
            - "${e_limit} == ERR_TRAVEL_SUPPLY_EXCEEDS_LIMIT (422) for the 31-hour trip: base 5580 L, reserve 1953 L, required 7533 L, cylinders_raw 12, surcharge 1, authorised 13 which exceeds MAX_TRAVEL_CYLINDERS 12"
            - "The 30-hour trip is accepted with ${ta_hours} == 30, ${ta_req} == 7290, ${ta_cyl} == 12 and ${ta_status} == REQUESTED: base 5400 L plus a 1890 L reserve gives cylinders_raw 11 and the surcharge brings it to exactly the limit"
            - "The contract-scoped listing returns total_count 1 holding only ${ta_id}: the three rejections created nothing, which is also why the accepted trip does not collide with the 2026-08-05 interval it was refused for"
            - "The surcharge is computed from cylinders_raw and never from the surcharged total: at 11 raw cylinders it adds one, and the resulting 12 does not re-enter the threshold test"

      - name: logical_clock_monotonicity_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=78]
          - validations[priority=17]
        distinguishing_aspect: |
          The clock comparison is strictly greater, so re-sending the value the clock already holds is
          an error rather than an idempotent no-op — and it stays an error after a successful advance,
          because the rule is evaluated against the clock's live value and not against the request
          history.
        test_recipe:
          setup:
            - "A pristine instance with the mandatory default logical clock at 2026-08-01T00:00:00Z and no other data."
          setup_api_calls: []
          trigger:
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
              captures: { e_equal: $.data.error_id }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: BranchManager
              captures: { e_back: $.data.error_id }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "not-a-timestamp" }
              as: BranchManager
              captures: { e_shape: $.data.error_id }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: BranchManager
              captures: { cur: $.data.current_utc, prev: $.data.previous_utc, exp_n: $.data.expired_cmn_count, susp_n: $.data.suspended_contract_count }
            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: BranchManager
              captures: { e_equal_again: $.data.error_id }
          assert:
            - "${e_equal} == ERR_CLOCK_NOT_MONOTONIC (422): setting the clock to the value it already holds is refused, so no caller can treat the endpoint as idempotent"
            - "${e_back} == ERR_CLOCK_NOT_MONOTONIC (422): one second of backward motion is as illegal as a month of it"
            - "${e_shape} == ERR_INVALID_REQUEST (400): the type check at priority 17 runs ahead of the monotonicity check at priority 78, so an unparseable instant never reaches the comparison"
            - "The one-second advance succeeds with ${prev} == 2026-08-01T00:00:00Z, ${cur} == 2026-08-01T00:00:01Z, ${exp_n} == 0 and ${susp_n} == 0: the sweep runs on every advance and reports zero counts on an empty instance"
            - "${e_equal_again} == ERR_CLOCK_NOT_MONOTONIC (422): the same literal that just succeeded now fails, because the rule reads the live clock"

      - name: role_shape_and_existence_priority_order
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - validations[priority=17]
          - validations[priority=21]
        distinguishing_aspect: |
          One request can violate authorisation, payload shape and referential existence at once, and
          the ordered rule list resolves it to exactly one error id. The pair 6 and 21 is the sharp
          part: the same ERR_PATIENT_NOT_FOUND is produced by two rules at different priorities — one
          for a path segment, one for a body field — and the body-field rule sits below the shape
          rule, so a malformed body on a non-existent patient reports ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One branch and one real patient, so the ladder can be walked down to a fully legal request."
            - "The non-existent identifier 00000000-0000-0000-0000-0000000000ff is used for every missing reference."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0710", full_name: "Xiomara Delacroix", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /home-oxygen/patients/00000000-0000-0000-0000-0000000000ff/risk-assessment"
              payload: {}
              as: DeliveryDriver
              captures: { e_role: $.data.error_id }
            - call: "GET /home-oxygen/patients/00000000-0000-0000-0000-0000000000ff/risk-assessment"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_path_missing: $.data.error_id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", test_type: "RESTING_ROOM_AIR", spo2_percent: 200, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: BillingSpecialist
              captures: { e_role_over_shape: $.data.error_id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", test_type: "RESTING_ROOM_AIR", spo2_percent: 200, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { e_shape_over_fk: $.data.error_id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { e_body_missing: $.data.error_id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id, qt_group: $.data.qualifying_group }
          assert:
            - "${e_role} == ERR_UNAUTHORIZED (403), not ERR_PATIENT_NOT_FOUND: priority 3 runs before priority 6, so an unauthorised caller cannot probe which patient ids exist"
            - "${e_path_missing} == ERR_PATIENT_NOT_FOUND (404) for the identical path once the role is allowed"
            - "${e_role_over_shape} == ERR_UNAUTHORIZED (403): the role check also outranks the shape check, so BillingSpecialist never learns that spo2_percent 200 is out of range"
            - "${e_shape_over_fk} == ERR_INVALID_REQUEST (400): spo2_percent 200 exceeds the 50..100 constraint, and priority 17 outranks the body-level existence rule at priority 21"
            - "${e_body_missing} == ERR_PATIENT_NOT_FOUND (404): with the shape repaired, the same body now resolves to the existence rule — the same error id as the path rule, reached from a different priority"
            - "The last call succeeds with ${qt_group} == GROUP_I: once role, shape and both existence rules are all satisfied the request creates ${qt_id}, which proves the four rejections above were produced by the intended rule each time and not by an unrelated defect"

