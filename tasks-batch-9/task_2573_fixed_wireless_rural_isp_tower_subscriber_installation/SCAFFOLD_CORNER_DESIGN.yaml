            - "GET /interference-coordinations?status=ACCEPTED returns total_count 0"

      - name: subscriber_read_exposes_five_roll_ups_computed_from_four_different_tables
        claim_type: computed_read
        grounds:
          - endpoints[GET /subscribers/{id}]
          - entities.Subscriber.fields.credit_balance_cents
          - entities.Subscriber.fields.equipment_monthly_charge_cents
          - calculations.usage_cycle_deprioritization
        distinguishing_aspect: |
          One read must aggregate UsageRecord, OutageCredit and EquipmentAssignment at once, and each
          roll-up has its own filter: cycle_usage_gb accumulates record-by-record inside the cycle
          window, credit_balance_cents counts only APPLIED credits, settlement_balance_cents counts only
          settled assignments (so a DEPLOYED radio contributes 0), and equipment_monthly_charge_cents is
          non-zero precisely because that same assignment is DEPLOYED. The second usage record is what
          tips cycle_usage_gb past the 600.0 soft cap, so usage_priority and effective_downstream_mbps
          must move together in the same read.
        test_recipe:
          setup:
            - "Installed STD50 RENTAL subscriber on the RB-TWR-001 sector; install completed at 2026-08-02T00:00:00Z so cycle_start_date is 2026-08-02 and the cycle window is [2026-08-02, 2026-09-01)."
            - "A closed 1269-minute POWER outage on the tower yields a 1706-cent credit that is APPLIED by a FinanceApprover other than the BillingAdmin who raised it."
            - "Two in-window usage records: 300.0 + 20.0 GB on 2026-08-03 and 280.0 + 15.0 GB on 2026-08-10, so cycle_usage_gb walks 320.0 -> 615.0 and crosses the soft cap on the second one."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
