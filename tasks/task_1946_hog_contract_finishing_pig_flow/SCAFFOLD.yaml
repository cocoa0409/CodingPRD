  - { method: POST, path: "/manure-plans/{id}/approve", description: "Approve plan; supersedes other APPROVED plans of site", roles: [IntegratorAdmin], code: 200, input: [], output: ManurePlan, side_effects: ["SUBMITTED -> APPROVED; other APPROVED plans of site -> SUPERSEDED"] }
  - { method: POST, path: "/manure-plans/{id}/reject", description: "Reject plan", roles: [IntegratorAdmin], code: 200, input: [], output: ManurePlan, side_effects: ["SUBMITTED -> REJECTED"] }
  - { method: POST, path: "/manure-plans/{id}/revise", description: "Return rejected plan to DRAFT (revision loop)", roles: [EnvironmentalManager], code: 200, input: [], output: ManurePlan, side_effects: ["REJECTED -> DRAFT"] }

  # --- Manure applications ---
  - { method: POST, path: "/manure-applications", description: "Record land application (budget-debiting)", roles: [EnvironmentalManager], code: 201, input: [plan_id, field_code, applied_at, gallons, n_lbs, p_lbs], output: ManureApplication, side_effects: ["application_status=RECORDED; plan n_applied/p_applied/lagoon_available debited"] }
  - { method: GET, path: "/manure-applications", description: "List applications (paginated)", roles: [IntegratorAdmin, EnvironmentalManager], code: 200, input: ["plan_id?", "application_status?", "limit?", "offset?"], output: "ManureApplication[]", side_effects: [] }
  - { method: GET, path: "/manure-applications/{id}", description: "Get application", roles: [IntegratorAdmin, EnvironmentalManager], code: 200, input: [], output: ManureApplication, side_effects: [] }
  - { method: POST, path: "/manure-applications/{id}/confirm", description: "Confirm application (terminal)", roles: [EnvironmentalManager], code: 200, input: [], output: ManureApplication, side_effects: ["RECORDED -> CONFIRMED"] }
  - { method: POST, path: "/manure-applications/{id}/void", description: "Void application; budgets credited back", roles: [EnvironmentalManager], code: 200, input: [], output: ManureApplication, side_effects: ["RECORDED/CONFIRMED -> VOIDED; plan budgets credited"] }

  # --- Maintenance tickets ---
  - { method: POST, path: "/maintenance-tickets", description: "Open maintenance ticket (grower-owned barn)", roles: [Grower], code: 201, input: [barn_id, category, description], output: MaintenanceTicket, side_effects: ["ticket_status=OPEN; contract_id/grower_id set from ACTIVE contract of barn's site"] }
  - { method: GET, path: "/maintenance-tickets", description: "List tickets (paginated)", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: ["barn_id?", "contract_id?", "grower_id?", "ticket_status?", "limit?", "offset?"], output: "MaintenanceTicket[]", side_effects: [] }
  - { method: GET, path: "/maintenance-tickets/{id}", description: "Get ticket", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: MaintenanceTicket, side_effects: [] }
  - { method: POST, path: "/maintenance-tickets/{id}/quote", description: "Quote cost and cause (EMERGENCY: allowed in IN_PROGRESS)", roles: [FieldTech], code: 200, input: [cost_cents, cause], output: MaintenanceTicket, side_effects: ["OPEN -> QUOTED (or stays IN_PROGRESS for EMERGENCY retro)"] }
  - { method: POST, path: "/maintenance-tickets/{id}/approve", description: "Approve quote (threshold role + SoD vs quoter)", roles: [FieldTech, IntegratorAdmin], code: 200, input: [], output: MaintenanceTicket, side_effects: ["-> APPROVED (or stays IN_PROGRESS for EMERGENCY retro); shares computed; approved_by/approved_flag set"] }
  - { method: POST, path: "/maintenance-tickets/{id}/start-work", description: "Start work (EMERGENCY may start from QUOTED)", roles: [FieldTech], code: 200, input: [], output: MaintenanceTicket, side_effects: ["APPROVED -> IN_PROGRESS (QUOTED -> IN_PROGRESS for EMERGENCY)"] }
  - { method: POST, path: "/maintenance-tickets/{id}/complete", description: "Complete work; negligence charges grower", roles: [FieldTech], code: 200, input: [], output: MaintenanceTicket, side_effects: ["IN_PROGRESS -> COMPLETED; completed_at set; negligence share posted to group pending_deductions (+settlement recompute) or grower balance_due"] }
  - { method: POST, path: "/maintenance-tickets/{id}/reject", description: "Reject quoted ticket", roles: [FieldTech], code: 200, input: [], output: MaintenanceTicket, side_effects: ["QUOTED -> REJECTED"] }
  - { method: POST, path: "/maintenance-tickets/{id}/cancel", description: "Grower cancels own open ticket", roles: [Grower], code: 200, input: [], output: MaintenanceTicket, side_effects: ["OPEN/QUOTED -> CANCELLED"] }

  # --- Settlements ---
  - { method: GET, path: "/settlements", description: "List settlements (paginated)", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: ["group_id?", "contract_id?", "settlement_status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/settlements/{id}", description: "Get settlement", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/settlements/{id}/dispute", description: "Grower disputes settlement", roles: [Grower], code: 200, input: [reason], output: Settlement, side_effects: ["FINALIZED -> DISPUTED"] }
  - { method: POST, path: "/settlements/{id}/refinalize", description: "Re-finalize with signed adjustment", roles: [FieldTech], code: 200, input: [adjustment_cents], output: Settlement, side_effects: ["DISPUTED -> FINALIZED; total_pay_cents recomputed"] }
  - { method: POST, path: "/settlements/{id}/approve", description: "Approve settlement", roles: [IntegratorAdmin], code: 200, input: [], output: Settlement, side_effects: ["FINALIZED -> APPROVED; approved_by set"] }
  - { method: POST, path: "/settlements/{id}/pay", description: "Pay settlement (SoD: payer != approver)", roles: [IntegratorAdmin], code: 200, input: [], output: Settlement, side_effects: ["APPROVED -> PAID; paid_by set; Grower.lifetime_paid_cents += total_pay_cents"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/empty X-User-ID or X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint roles; or FieldTech approving ticket with cost_cents >= 50000" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Grower acts on resource whose grower chain does not resolve to X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_MALFORMED_FIELD, http: 400, condition: "Missing required field, invalid enum, integer below minimum, max_weight_lbs < min_weight_lbs" }
  - { id: ERR_STALE_BARN_VERSION, http: 412, condition: "expected_barn_version != Barn.version on POST /pig-groups" }
  - { id: ERR_STALE_SLOT_VERSION, http: 412, condition: "expected_slot_version != PackerSlot.version on POST /market-loads" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition not defined from current state (generic)" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "PigGroup not in required status (feed order/mortality/load/advance-phase need PLACED or MARKETING)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract not ACTIVE where required" }
  - { id: ERR_SITE_NOT_ACTIVE, http: 409, condition: "Site not ACTIVE where required (contract activate, group create, plan approve)" }
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Grower not ACTIVE at contract activation" }
  - { id: ERR_BARN_NOT_PLACEABLE, http: 409, condition: "Barn OUT_OF_SERVICE at group creation, or not AVAILABLE at confirm-placement" }
  - { id: ERR_BARN_OCCUPIED, http: 409, condition: "mark-out-of-service attempted on OCCUPIED barn" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "ManureApplication against plan not in APPROVED" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Booking against CLOSED slot" }
  - { id: ERR_TICKET_UNAPPROVED, http: 409, condition: "Complete attempted before approval recorded" }
  - { id: ERR_CONTRACT_HAS_ACTIVE_GROUPS, http: 409, condition: "Terminate/expire contract with groups in SCHEDULED/PLACED/MARKETING" }
  - { id: ERR_SETTLEMENTS_PENDING, http: 409, condition: "Terminate/expire contract with settlements in FINALIZED/DISPUTED/APPROVED" }
  - { id: ERR_SLOT_HAS_ACTIVE_LOADS, http: 409, condition: "Close slot with loads in SCHEDULED/DISPATCHED" }
  - { id: ERR_TICKETS_OPEN, http: 409, condition: "Return-to-service with tickets in OPEN/QUOTED/APPROVED/IN_PROGRESS" }
  - { id: ERR_WASH_NOT_VERIFIED, http: 409, condition: "Dispatch references wash not in VERIFIED (business_safety)" }
  - { id: ERR_WASH_TYPE_INSUFFICIENT, http: 409, condition: "Packer load dispatch with WASH_ONLY wash (business_safety)" }
  - { id: ERR_BARN_DOWNTIME_ACTIVE, http: 409, condition: "Release before downtime_until (business_safety)" }
  - { id: ERR_WASH_STALE, http: 409, condition: "Dispatch when clock > washed_at + 48h (business_temporal)" }
  - { id: ERR_PLACEMENT_DATE_PAST, http: 409, condition: "placement_date < clock date at group creation" }
  - { id: ERR_TARGET_BEFORE_PLACEMENT, http: 409, condition: "target_market_date <= placement_date" }
  - { id: ERR_CONFIRM_TOO_EARLY, http: 409, condition: "Confirm placement before placement_date" }
  - { id: ERR_SLOT_DATE_PAST, http: 409, condition: "slot_date < clock date at booking, or dispatch after slot date" }
  - { id: ERR_DELIVERY_BEFORE_SLOT_DATE, http: 409, condition: "Deliver before slot_date" }
  - { id: ERR_REPORT_DATE_OUT_OF_RANGE, http: 409, condition: "report_date before placement_date or after clock date" }
  - { id: ERR_FEED_DATE_PAST, http: 409, condition: "requested/scheduled delivery date before clock date" }
