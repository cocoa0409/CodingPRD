          uv: $.data.version
      - call: POST /accreditation/phantom-tests
        payload:
          unit_id: ${unit_id}
          phantom_serial_code: PH-CT-9
          acquired_at: '2026-09-13T00:00:00Z'
          duration_minutes: 30
        as: FacilityAdmin
        captures:
          pt_low_id: $.data.id
      trigger:
      - call: POST /accreditation/phantom-tests/${pt_low_id}/score
        payload:
          spatial_resolution_score: 3
          contrast_score: 4
          artifact_score: 5
          scored_at: '2026-09-13T01:00:00Z'
        as: FacilityAdmin
      assert:
      - the 8/10 submission ${cis_c} reaches FAILED with review_outcome_score 0.0 (the first branch short-circuits on review_outcome_input)
      - the 10/10 submission ${cis_d} reaches ACCEPTED with review_outcome_score 10.0
      - PhantomTest.${pt_low_id}.phantom_total_score == 4.0 — round_half_up((3.0 + 4.0 + 5.0) / 3.0)
      - PhantomTest.${pt_low_id}.result_status == FAIL because 4.0 < 7.0
      - ModalityUnit.${unit_id}.last_phantom_score == 4.0 and phantom_failure_count == 1
  - name: registry_benchmark_classification_evaluation_order_over_max_comparison
    grounds:
    - calculations.registry_benchmark_classification
    - calculations.facility_dose_index_benchmark
