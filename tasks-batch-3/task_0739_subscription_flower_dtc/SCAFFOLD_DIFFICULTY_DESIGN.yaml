              as: PlatformAdmin
              captures: { sh0_id: "$.data[0].id", sh1_id: "$.data[1].id", sh2_id: "$.data[2].id" }
            - call: "POST /carrier-routes"
              payload: { zone: "Z1", service_date: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
            - call: "POST /shipments/${sh2_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh2_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
          trigger:
            - call: "POST /shipments/${sh0_id}/ship"
              payload: { route_id: "${route_id}", delivery_window_start: "2026-03-10T09:00:00Z", delivery_window_end: "2026-03-10T11:00:00Z" }
              as: FulfillmentOps
              captures: { s0: "$.data.status" }
            - call: "POST /shipments/${sh1_id}/ship"
              payload: { route_id: "${route_id}", delivery_window_start: "2026-03-10T10:00:00Z", delivery_window_end: "2026-03-10T12:00:00Z" }
              as: FulfillmentOps
              captures: { err: "$.data.error_id" }
            - call: "POST /shipments/${sh2_id}/ship"
              payload: { route_id: "${route_id}", delivery_window_start: "2026-03-10T11:00:00Z", delivery_window_end: "2026-03-10T12:00:00Z" }
              as: FulfillmentOps
              captures: { s2: "$.data.status" }
          assert:
            - "Shipment.${sh0_id}.status == SHIPPED ([09:00,11:00) booked)"
            - "shipping ${sh1_id} into [10:00,12:00) returns error_id == ERR_ROUTE_WINDOW_CONFLICT (overlap)"
            - "Shipment.${sh2_id}.status == SHIPPED ([11:00,12:00) adjacent; half-open allows adjacency)"

      - name: lot_hold_closed_interval_buffer_overlap
        grounds:
          - entities.StemAllocation.fields.hold_start
          - entities.StemAllocation.fields.hold_end
          - errors[ERR_LOT_HOLD_CONFLICT]
        distinguishing_aspect: |
          StemLot holds use closed intervals plus a CLEAN_BUFFER_MINUTES=30 gap: a [10:15,11:00] hold only
          15 min after a [08:00,10:00] hold is rejected, but a [10:30,11:00] hold (gap == 30 min) is accepted.
        test_recipe:
          setup:
            - "Lot L (total 100, fresh); shipment sh0 in SOURCING; first hold [08:00,10:00] on 2026-03-05 already reserved."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen" }
