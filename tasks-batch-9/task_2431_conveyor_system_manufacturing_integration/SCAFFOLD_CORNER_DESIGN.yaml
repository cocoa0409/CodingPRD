            - call: "POST /cutover-windows/${win_m1}/complete"
              payload: {}
              as: SiteManager
              as_user_id: "sm-100"
              captures: { winstatus_m1: $.data.status }
            - call: "GET /projects/${proj_m1}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-100"
              captures: { ds_m1: $.data.delivery_status, ar1_m1: $.data.acceptance_ready, cs_m1: $.data.cutover_share_bps }
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_m1}", step_pct: 50, measured_cph: 700, sustained_minutes: 30 }
              as: SiteManager
              as_user_id: "sm-100"
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_m1}", step_pct: 75, measured_cph: 1000, sustained_minutes: 60 }
              as: SiteManager
              as_user_id: "sm-100"
            - call: "GET /projects/${proj_m1}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-100"
              captures: { ar2_m1: $.data.acceptance_ready }
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_m1}", step_pct: 100, measured_cph: 1260, sustained_minutes: 120 }
              as: SiteManager
              as_user_id: "sm-100"
            - call: "GET /projects/${proj_m1}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-100"
              captures: { ar3_m1: $.data.acceptance_ready }
            - call: "POST /acceptance-certificates"
              payload: { project_id: "${proj_m1}" }
              as: ProjectDirector
              as_user_id: "pd-100"
              captures: { cert_m1: $.data.id }
          assert:
            - "${winstatus_m1} == COMPLETED and the first call is 200"
            - "${ds_m1} == COMMISSIONING, ${cs_m1} == 10000 and SiteZone.${zone_m1}.ops_status == CUTOVER_COMPLETE on the read straight after the completion (no second write in between)"
            - "FabricationLot.${lot_m1}.status == INSTALLED and Project.${proj_m1}.in_transition_share_bps == 0 and legacy_share_bps == 0 on that same read"
            - "${ar1_m1} == false and ${ar2_m1} == false (steps 50 and 75 alone do not satisfy the prerequisite)"
            - "${ar3_m1} == true on the read that directly follows the 100% ramp, and the final call is 201 with AcceptanceCertificate.${cert_m1}.accepted_throughput_cph == 1260"
