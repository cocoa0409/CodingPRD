# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims in §1.1-§1.7)
# Walks references/claim-extraction-guide.md row-by-row against this scaffold.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_county_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.County"
          - "endpoints.POST_counties"
        distinguishing_aspect: "POST /counties with all required fields -> 201, response carries name, state_code, max_interest_rate_bps, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { name: "Corner County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
          assert:
            - "response code == 201"
            - "County.${county_id}.state_code == AZ"
            - "County.${county_id}.version == 1"
            - "County.${county_id}.penalty_rate_bps == 0"
            - "County.${county_id}.day_count_basis == 365"

      - name: get_parcel_by_id_returns_stored
        claim_type: Retrieval
        grounds:
          - "entities.Parcel"
          - "endpoints.GET_parcel"
        distinguishing_aspect: "GET /counties/{id}/parcels/{id} returns the stored parcel with status DELINQUENT at creation."
        test_recipe:
          setup: ["County exists; one parcel registered."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "R-1", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 50000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "GET /counties/${county_id}/parcels/${parcel_id}"
              payload: {}
              as: Auditor
          assert:
            - "Parcel.${parcel_id}.status == DELINQUENT"
            - "Parcel.${parcel_id}.base_tax_due_cents == 50000"
            - "Parcel.${parcel_id}.active_certificate_id == null"

      - name: list_parcels_pagination_envelope
        claim_type: Listing
        grounds:
          - "endpoints.GET_parcels_list"
        distinguishing_aspect: "GET /counties/{id}/parcels returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["County with two parcels."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "L-1", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 50000 }
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "L-2", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 60000 }
              as: CountyTreasurer
          trigger:
            - call: "GET /counties/${county_id}/parcels"
              payload: { limit: 1, offset: 0 }
              as: Auditor
          assert:
            - "response_type == array"
            - "meta total_count == 2"
            - "meta has_more == true"

      - name: get_nonexistent_certificate_404
        claim_type: Not Found
        grounds:
          - "entities.Certificate"
          - "endpoints.GET_certificate"
        distinguishing_aspect: "GET certificate with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["County exists; no certificates."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
          trigger:
            - call: "GET /counties/${county_id}/certificates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_parcel_missing_base_tax_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Parcel.fields.base_tax_due_cents"
          - "validations[priority=5]"
        distinguishing_aspect: "POST parcel omitting base_tax_due_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["County exists."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
          trigger:
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "X-1", owner_name: "O", assessed_value_cents: 100000 }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: county_penalty_rate_default_applied
        claim_type: Defaults
        grounds:
          - "entities.County.fields.penalty_rate_bps"
          - "entities.County.fields.premium_bidding_enabled"
        distinguishing_aspect: "Omitting penalty_rate_bps and premium_bidding_enabled -> defaults 0 and false applied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { name: "Def County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
          assert:
            - "County.${county_id}.penalty_rate_bps == 0"
            - "County.${county_id}.premium_bidding_enabled == false"
            - "County.${county_id}.premium_earns_interest == false"

      - name: certificate_sub_tax_total_computed
        claim_type: Computed Fields
        grounds:
          - "entities.Certificate.fields.sub_tax_total_cents"
        distinguishing_aspect: "Certificate.sub_tax_total_cents is recomputed to the POSTED sub-tax principal sum (40000), ignoring any client input."
        test_recipe:
          setup: ["Certificate ACTIVE held by I1 (escrow 300000) with one POSTED sub-tax of 40000c (tax_year 2026)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "CF-1", owner_name: "O", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "I1", tax_id: "TIN-CF1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 300000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "S", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Investor
              as_user_id: "${i1_id}"
              captures: { cert_v: $.data.version }
            - call: "POST /counties/${county_id}/certificates/${cert_id}/sub-taxes"
              payload: { investor_id: "${i1_id}", tax_year: 2026, principal_cents: 40000, expected_certificate_version: "${cert_v}" }
              as: Investor
              as_user_id: "${i1_id}"
          trigger:
            - call: "GET /counties/${county_id}/certificates/${cert_id}"
              payload: {}
              as: Auditor
          assert:
            - "Certificate.${cert_id}.sub_tax_total_cents == 40000"

      - name: investor_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - "entities.Investor.fields.escrow_balance_cents"
          - "entities.Investor.fields.registered"
        distinguishing_aspect: "POST /investors ignores any client-supplied escrow_balance_cents; escrow starts 0 and registered false (input ignored)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { legal_name: "I-sys", tax_id: "TIN-SYS" }
              as: Investor
              captures: { inv_id: $.data.id }
          assert:
            - "Investor.${inv_id}.escrow_balance_cents == 0"
            - "Investor.${inv_id}.registered == false"
            - "Investor.${inv_id}.version == 1"

      - name: county_day_count_basis_invalid_enum
        claim_type: Type Constraints
        grounds:
          - "entities.County.fields.day_count_basis"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "day_count_basis outside {360,365} -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { name: "Bad County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, day_count_basis: 366 }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: parcel_requires_existing_county_parent
        claim_type: Parent Relationships
        grounds:
          - "entities.Parcel.parent"
          - "validations[priority=3]"
        distinguishing_aspect: "Registering a parcel under a non-existent county path -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No county created."]
          setup_api_calls: []
          trigger:
            - call: "POST /counties/00000000-0000-4000-8000-000000000000/parcels"
              payload: { apn: "NF-1", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 50000 }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: certificate_fk_county_filtered_list
        claim_type: Foreign key references validated
        grounds:
          - "entities.SaleListing.fields.parcel_id"
          - "validations[priority=4]"
        distinguishing_aspect: "Attaching a listing whose parcel belongs to a different county -> ERR_CROSS_COUNTY_REFERENCE (409)."
        test_recipe:
          setup: ["County A with parcel P_A; County B with sale S_B. Attaching P_A to S_B crosses scope."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "County A", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_a: $.data.id }
            - call: "POST /counties/${county_a}/parcels"
              payload: { apn: "PA-1", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 50000 }
              as: CountyTreasurer
              captures: { parcel_a: $.data.id }
            - call: "POST /counties"
              payload: { name: "County B", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_b: $.data.id }
            - call: "POST /counties/${county_b}/sales"
              payload: { sale_name: "S_B", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_b: $.data.id }
          trigger:
            - call: "POST /counties/${county_b}/sales/${sale_b}/listings"
              payload: { parcel_id: "${parcel_a}" }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_CROSS_COUNTY_REFERENCE"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: open_sale_before_scheduled_invalid
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.TaxSale.DRAFT_to_OPEN"
          - "validations[priority=9]"
          - "errors[ERR_SALE_NOT_DUE]"
        distinguishing_aspect: "Opening a sale whose scheduled_at is in the future relative to the clock -> ERR_SALE_NOT_DUE; sale stays DRAFT."
        test_recipe:
          setup: ["Sale scheduled_at 2026-06-01, one listing, clock at 2026-03-01 (before)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "ND-1", owner_name: "O", assessed_value_cents: 100000, base_tax_due_cents: 50000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "Future Sale", scheduled_at: "2026-06-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_SALE_NOT_DUE"
            - "TaxSale.${sale_id}.status == DRAFT"

      - name: close_already_closed_sale_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.TaxSale.OPEN_to_CLOSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling close on a sale already CLOSED -> ERR_INVALID_STATE (no re-award)."
        test_recipe:
          setup: ["Sale CLOSED after a successful award (one bid)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "CC-1", owner_name: "O", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "I1", tax_id: "TIN-CC1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 200000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "S", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"
            - "TaxSale.${sale_id}.status == CLOSED"

      - name: redeem_terminal_certificate_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Certificate.ACTIVE_to_REDEEMED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Redeeming a certificate already REDEEMED -> ERR_INVALID_STATE; no second Redemption row."
        test_recipe:
          setup: ["Certificate REDEEMED (redeemed once at 2026-09-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "RT-1", owner_name: "O", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "I1", tax_id: "TIN-RT1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 200000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "S", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/certificates/${cert_id}/redeem"
              payload: {}
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/redeem"
              payload: {}
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"
            - "Certificate.${cert_id}.status == REDEEMED"

      - name: sale_close_zero_bids_struck_off
        claim_type: Conditional cascade
        grounds:
          - "state_machines.SaleListing.LISTED_to_STRUCK_OFF"
          - "state_machines.TaxSale.OPEN_to_CLOSED"
          - "entities.Parcel.fields.status"
        distinguishing_aspect: "Closing a sale where a listing has zero PLACED bids: listing -> STRUCK_OFF, no certificate, and the parcel reverts ON_SALE -> DELINQUENT."
        test_recipe:
          setup: ["Sale OPEN with one listing and zero bids."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "C", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "SO-1", owner_name: "O", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "S", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
          assert:
            - "SaleListing.${listing_id}.status == STRUCK_OFF"
