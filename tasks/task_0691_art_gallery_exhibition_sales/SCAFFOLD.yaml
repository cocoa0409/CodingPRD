# =============================================================================
# PRD Benchmark Scaffold — Art Gallery & Exhibition Sales (Expert)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml. Neither design key appears here.
# =============================================================================

scenario: |
  Art Gallery & Exhibition Sales: artist/consignment & inventory, exhibition/show
  scheduling & wall map, pricing & consignment split, sale & sales-tax/shipping,
  payment plan/art-lease, opening-event & RSVP, loan/insurance & provenance,
  payout & reporting

domain_name: art-gallery-exhibition-sales
api_prefix: ""
# Flat topology: every entity is a top-level collection (/artworks, /sales, ...).
# gallery_id is carried in the request body on create and as a filter on list
# endpoints rather than nested in the URL path, so collection segments are
# uniformly inferable and FK reverse-reachability resolves via filtered lists.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite wall map + consignment inventory reserved/committed/released
  secondary_archetype: ledger_reconciliation # artist payout ledger: consigned vs sold-net vs paid-out, two split algorithms
  complexity_layers:
    - optimistic_concurrency      # OCC on Exhibition.version (wall-slot placement supersede) and Sale.version (installment posting supersede)
    - cascading_side_effects      # sale finalize → artwork SOLD → exhibition slot RELEASED → artist ledger debited → payout accrued
    - dual_variant_calculation    # consignment split: provisional (at reservation) vs final (at settlement, after returns/discounts)
    - rate_threshold_triggers     # sales-tax exemption threshold; payment-plan default after missed-installment count; insured-value coverage gap
    - scheduled_actions           # logical clock drives RSVP deadlines, installment due dates, loan return windows

  entity_topology: flat
  # Gallery is the single root; Artist, Artwork, Exhibition, Sale, PaymentPlan,
  # LeaseAgreement, OpeningEvent, Rsvp, Loan, Payout, WallSlot are peers under
  # the gallery, linked by foreign keys (no deep URL nesting beyond gallery).

  state_machine_shape: parallel
  # Sale carries two independent dimensions (settlement_status × shipping_status);
  # Artwork lifecycle is cyclic (CONSIGNED→RESERVED→CONSIGNED on release; ON_LOAN→
  # AVAILABLE return loop); Exhibition is branching (PLANNED→{OPEN, CANCELLED}).

  relationship_patterns:
    - one_to_many        # Gallery→{Artist,Artwork,Exhibition,Sale,...}; Artist→Artwork; Exhibition→WallSlot
    - many_to_many       # Artwork↔Exhibition via WallSlot placement
    - cross_aggregate    # Sale references Artwork + Exhibition + Buyer-less; Payout references Artist + sweeps Sales

  role_model: peer_roles
  # GalleryAdmin (operator, opaque), Registrar (entity-less operator for provenance/loans),
  # SalesAssociate (operator for sales/plans/leases), Artist (entity_backed, sees own ledger).

  consistency_model: immediate
  # All cascades resolve atomically within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Gallery
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Gallery name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state code where the gallery is located; drives sales-tax origin", constraints: "exactly 2 uppercase letters" }
      - { name: sales_tax_rate_bps, type: integer, source: input, description: "Default destination-agnostic sales-tax rate in basis points (e.g. 875 = 8.75%)", constraints: ">= 0 and <= 2000" }
      - { name: resale_exempt_threshold_cents, type: integer, source: input, default: 0, description: "Sale gross_amount_cents strictly above this is treated as a resale-certificate-eligible wholesale line and taxed at 0; 0 disables the exemption", constraints: ">= 0" }
      - { name: default_consignment_split_bps, type: integer, source: input, default: 5000, description: "Default artist share of net sale in basis points (5000 = artist keeps 50%)", constraints: ">= 0 and <= 10000" }
      - { name: clock_utc, type: datetime, source: system, description: "Logical clock; defaults to 2026-04-01T00:00:00Z until set via /_clock/set_current_utc" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id" }
      - { name: full_name, type: string, source: input, description: "Artist legal name" }
      - { name: split_override_bps, type: integer, source: input, required: false, description: "Per-artist override of artist share in basis points; when null the Gallery.default_consignment_split_bps applies", constraints: ">= 0 and <= 10000" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", constraints: "ACTIVE | SUSPENDED" }
      - { name: ledger_accrued_cents, type: integer, source: computed, description: "Cumulative artist share accrued from SETTLED sales of this artist's artworks (final split), never negative" }
      - { name: ledger_paid_cents, type: integer, source: computed, description: "Cumulative amount moved into COMPLETED payouts for this artist" }
      - { name: ledger_payable_cents, type: integer, source: computed, description: "ledger_accrued_cents - ledger_paid_cents; amount the gallery still owes the artist, never negative" }

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; the consigning artist" }
      - { name: title, type: string, source: input, description: "Artwork title" }
      - { name: list_price_cents, type: integer, source: input, description: "Consigned asking price", constraints: "> 0" }
      - { name: insured_value_cents, type: integer, source: input, description: "Declared insured replacement value used for loan coverage checks", constraints: "> 0" }
      - { name: provenance_count, type: integer, source: computed, description: "Number of provenance entries appended to provenance_log" }
      - { name: provenance_log, type: array, source: system, description: "Append-only array of {seq, event, at_utc} provenance records; seq starts at 1" }
      - { name: status, type: enum, source: system, description: "Inventory/consignment lifecycle", constraints: "CONSIGNED | RESERVED | SOLD | ON_LOAN | RETURNED" }

  - name: Exhibition
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id" }
      - { name: title, type: string, source: input, description: "Exhibition / show title" }
      - { name: wall_capacity, type: integer, source: input, description: "Total number of wall slots on the floor plan for this show", constraints: "> 0" }
      - { name: opens_utc, type: datetime, source: input, description: "Scheduled opening instant (inclusive lower bound of the run window)" }
      - { name: closes_utc, type: datetime, source: input, description: "Scheduled closing instant (exclusive upper bound of the run window); must be strictly after opens_utc" }
      - { name: status, type: enum, source: system, description: "Show lifecycle", constraints: "PLANNED | OPEN | CLOSED | CANCELLED" }
      - { name: slots_occupied, type: integer, source: computed, description: "Count of WallSlot rows with status PLACED for this exhibition" }
      - { name: slots_available, type: integer, source: computed, description: "wall_capacity - slots_occupied, never negative" }

  - name: WallSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: exhibition_id, type: string, source: input, description: "FK -> Exhibition.id; the show this placement belongs to" }
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the placed artwork" }
      - { name: wall_label, type: string, source: input, description: "Human label of the physical position, e.g. 'N-12'" }
      - { name: position_index, type: integer, source: input, description: "Ordinal position on the wall map; unique among PLACED slots of the same exhibition", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Placement lifecycle", constraints: "PLACED | RELEASED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: input, description: "FK -> Gallery.id" }
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the artwork being sold" }
      - { name: exhibition_id, type: string, source: input, required: false, description: "FK -> Exhibition.id; the show the artwork was placed in at reservation, if any" }
      - { name: buyer_name, type: string, source: input, description: "Buyer name" }
      - { name: buyer_state_code, type: string, source: input, description: "Two-letter buyer ship-to state code; drives tax exemption", constraints: "exactly 2 uppercase letters" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Negotiated sale price before discount, tax, shipping", constraints: "> 0" }
      - { name: discount_bps, type: integer, source: input, default: 0, description: "Discount applied to gross in basis points", constraints: ">= 0 and <= 10000" }
      - { name: shipping_cents, type: integer, source: input, default: 0, description: "Flat shipping fee added to the buyer total; not subject to sales tax", constraints: ">= 0" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents after discount; the consignment-split base" }
      - { name: tax_amount_cents, type: integer, source: computed, description: "Sales tax charged to the buyer (0 if exempt)" }
      - { name: buyer_total_cents, type: integer, source: computed, description: "net_amount_cents + tax_amount_cents + shipping_cents" }
      - { name: artist_share_cents, type: integer, source: computed, description: "Provisional at RESERVED, final at SETTLED; the artist's cut of net_amount_cents" }
      - { name: gallery_share_cents, type: integer, source: computed, description: "net_amount_cents - artist_share_cents" }
      - { name: amount_collected_cents, type: integer, source: computed, description: "Sum of POSTED installment amounts plus any single full payment" }
      - { name: settlement_status, type: enum, source: system, description: "Money dimension", constraints: "RESERVED | INVOICED | PARTIALLY_PAID | SETTLED | VOID" }
      - { name: shipping_status, type: enum, source: system, description: "Fulfilment dimension, independent of settlement_status", constraints: "PENDING | SHIPPED | DELIVERED" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; the sale being financed" }
      - { name: installment_count, type: integer, source: input, description: "Number of equal installments", constraints: ">= 2 and <= 24" }
      - { name: cadence_days, type: integer, source: input, description: "Days between installment due dates", constraints: ">= 1" }
      - { name: first_due_utc, type: datetime, source: input, description: "Due instant of installment #1" }
      - { name: installment_cents, type: integer, source: computed, description: "Per-installment amount; see calculation installment_schedule (remainder loaded on final installment)" }
      - { name: final_installment_cents, type: integer, source: computed, description: "Amount of the last installment carrying the rounding remainder" }
      - { name: posted_installment_count, type: integer, source: computed, description: "Number of installments POSTED so far" }
      - { name: missed_installment_count, type: integer, source: computed, description: "Number of due installments not yet posted as of the current clock" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", constraints: "ACTIVE | COMPLETED | DEFAULTED | CANCELLED" }

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the leased artwork" }
      - { name: lessee_name, type: string, source: input, description: "Lessee name" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Monthly lease (art-lease) rate", constraints: "> 0" }
      - { name: term_months, type: integer, source: input, description: "Lease term in months", constraints: ">= 1" }
      - { name: starts_utc, type: datetime, source: input, description: "Lease start instant" }
      - { name: purchase_credit_bps, type: integer, source: input, default: 0, description: "Fraction of paid lease rent credited toward a buyout, in basis points", constraints: ">= 0 and <= 10000" }
      - { name: months_accrued, type: integer, source: computed, description: "Whole months elapsed since starts_utc as of the clock, capped at term_months" }
      - { name: rent_accrued_cents, type: integer, source: computed, description: "months_accrued * monthly_rate_cents" }
      - { name: buyout_price_cents, type: integer, source: computed, description: "Artwork.list_price_cents minus credited rent; never below zero" }
      - { name: status, type: enum, source: system, description: "Lease lifecycle", constraints: "ACTIVE | CONVERTED | RETURNED | TERMINATED" }

  - name: OpeningEvent
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: exhibition_id, type: string, source: input, description: "FK -> Exhibition.id; the show this opening reception is for" }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed guests", constraints: "> 0" }
      - { name: starts_utc, type: datetime, source: input, description: "Reception start instant" }
      - { name: rsvp_deadline_utc, type: datetime, source: input, description: "Latest instant an RSVP may be CONFIRMED; must be at or before starts_utc" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of Rsvp rows in CONFIRMED status for this event" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of Rsvp rows in WAITLISTED status for this event" }
      - { name: status, type: enum, source: system, description: "Event lifecycle", constraints: "SCHEDULED | CLOSED | CANCELLED" }

  - name: Rsvp
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: opening_event_id, type: string, source: input, description: "FK -> OpeningEvent.id; the reception being RSVP'd" }
      - { name: guest_name, type: string, source: input, description: "Guest name" }
      - { name: party_size, type: integer, source: input, default: 1, description: "Number of seats this RSVP consumes against capacity", constraints: ">= 1 and <= 10" }
      - { name: status, type: enum, source: system, description: "RSVP lifecycle", constraints: "CONFIRMED | WAITLISTED | CANCELLED | PROMOTED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; the artwork loaned out" }
      - { name: borrower_name, type: string, source: input, description: "Borrowing institution name" }
      - { name: coverage_value_cents, type: integer, source: input, description: "Insurance coverage the borrower has secured for the loan period", constraints: "> 0" }
      - { name: out_utc, type: datetime, source: input, description: "Instant the work leaves the gallery (inclusive lower bound)" }
      - { name: due_utc, type: datetime, source: input, description: "Scheduled return instant (exclusive upper bound); must be strictly after out_utc" }
      - { name: returned_utc, type: datetime, source: system, required: false, description: "Actual return instant, null until returned" }
      - { name: status, type: enum, source: system, description: "Loan lifecycle", constraints: "OUTSTANDING | RETURNED | OVERDUE" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gallery_id, type: string, source: system, description: "FK -> Gallery.id; derived from the parent resource on create" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; the artist being paid" }
      - { name: requested_cents, type: integer, source: input, description: "Amount the operator asks to disburse", constraints: "> 0" }
      - { name: approved_cents, type: integer, source: computed, description: "min(requested_cents, artist.ledger_payable_cents at creation); the amount actually swept" }
      - { name: status, type: enum, source: system, description: "Payout lifecycle", constraints: "PENDING | COMPLETED | REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Artist
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /artists/{artist_id}/suspend"
        actor: GalleryAdmin
        preconditions:
          - "Artist.status == ACTIVE"
        side_effects:
          - "Artist becomes ineligible to consign new artworks (POST /artworks rejected with ERR_ARTIST_SUSPENDED) and ineligible to receive new payouts"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /artists/{artist_id}/reinstate"
        actor: GalleryAdmin
        preconditions:
          - "Artist.status == SUSPENDED"
        side_effects: []

  - entity: Artwork
    field: status
    initial_state: CONSIGNED
    terminal_states: [SOLD]
    note: "Cyclic: RESERVED can revert to CONSIGNED on sale void; ON_LOAN returns to AVAILABLE-equivalent CONSIGNED."
    transitions:
      - from: CONSIGNED
        to: RESERVED
        trigger: "POST /sales (sale created against this artwork)"
        actor: SalesAssociate
        preconditions:
          - "Artwork.status == CONSIGNED"
        side_effects:
          - "A Sale row is created in settlement_status RESERVED; Sale.artist_share_cents computed with the PROVISIONAL split variant"
          - "Provenance entry {event: 'RESERVED'} appended to Artwork.provenance_log; Artwork.provenance_count incremented"
      - from: RESERVED
        to: CONSIGNED
        trigger: "POST /sales/{sale_id}/void (sale voided)"
        actor: SalesAssociate
        preconditions:
          - "Artwork.status == RESERVED"
          - "The linked Sale.settlement_status != SETTLED"
        side_effects:
          - "Linked Sale.settlement_status -> VOID (compensating action)"
          - "If the artwork was placed in the sale's exhibition, its PLACED WallSlot is set RELEASED and Exhibition.slots_occupied/slots_available recomputed (cascade hop 2)"
          - "Provenance entry {event: 'SALE_VOIDED'} appended"
      - from: RESERVED
        to: SOLD
        trigger: "POST /sales/{sale_id}/settle (sale fully paid)"
        actor: SalesAssociate
        preconditions:
          - "Artwork.status == RESERVED"
          - "Sale.amount_collected_cents == Sale.buyer_total_cents"
        side_effects:
          - "Sale.settlement_status -> SETTLED; Sale.artist_share_cents recomputed with the FINAL split variant"
          - "Artist.ledger_accrued_cents += Sale.artist_share_cents; Artist.ledger_payable_cents recomputed (cascade hop 2: artwork SOLD drives artist ledger)"
          - "If the artwork held a PLACED WallSlot, that slot -> RELEASED and Exhibition.slots_occupied/slots_available recomputed (cascade hop 3)"
          - "Provenance entry {event: 'SOLD'} appended"
      - from: CONSIGNED
        to: ON_LOAN
        trigger: "POST /loans (loan created against this artwork)"
        actor: Registrar
        preconditions:
          - "Artwork.status == CONSIGNED"
        side_effects:
          - "Loan row created in status OUTSTANDING"
          - "Provenance entry {event: 'LOANED_OUT'} appended"
      - from: ON_LOAN
        to: CONSIGNED
        trigger: "POST /loans/{loan_id}/return"
        actor: Registrar
        preconditions:
          - "Artwork.status == ON_LOAN"
        side_effects:
          - "Loan.status -> RETURNED; Loan.returned_utc set to clock"
          - "Provenance entry {event: 'LOAN_RETURNED'} appended"
      - from: CONSIGNED
        to: RETURNED
        trigger: "POST /artworks/{artwork_id}/return-to-artist"
        actor: GalleryAdmin
        preconditions:
          - "Artwork.status == CONSIGNED"
        side_effects:
          - "Provenance entry {event: 'RETURNED_TO_ARTIST'} appended"

  - entity: Exhibition
    field: status
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching at PLANNED: either OPEN (run begins) or CANCELLED (abandoned), with divergent side-effect sets."
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /exhibitions/{exhibition_id}/open"
        actor: GalleryAdmin
        preconditions:
          - "Exhibition.status == PLANNED"
          - "Exhibition.slots_occupied >= 1"
          - "clock_utc >= opens_utc"
        side_effects:
          - "Show goes live; further WallSlot placements still allowed up to wall_capacity"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /exhibitions/{exhibition_id}/cancel"
        actor: GalleryAdmin
        preconditions:
          - "Exhibition.status == PLANNED"
        side_effects:
          - "Every PLACED WallSlot on this exhibition -> RELEASED; slots_occupied -> 0"
          - "Any OpeningEvent for this exhibition with status SCHEDULED -> CANCELLED (cascade hop 2)"
          - "Every CONFIRMED or WAITLISTED Rsvp on those events -> CANCELLED (cascade hop 3)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /exhibitions/{exhibition_id}/close"
        actor: GalleryAdmin
        preconditions:
          - "Exhibition.status == OPEN"
          - "clock_utc >= closes_utc"
        side_effects:
          - "Every still-PLACED WallSlot -> RELEASED; slots_occupied -> 0"

  - entity: Sale
    field: settlement_status
    initial_state: RESERVED
    terminal_states: [SETTLED, VOID]
    note: "Parallel dimension #1 of Sale (money). shipping_status evolves independently — see next machine."
    transitions:
      - from: RESERVED
        to: INVOICED
        trigger: "POST /sales/{sale_id}/invoice"
        actor: SalesAssociate
        preconditions:
          - "Sale.settlement_status == RESERVED"
        side_effects:
          - "Buyer total locked; sale is now collectible via single payment or a PaymentPlan"
      - from: [INVOICED, PARTIALLY_PAID]
        to: PARTIALLY_PAID
        trigger: "POST /sales/{sale_id}/payments"
        actor: SalesAssociate
        preconditions:
          - "Sale.settlement_status IN {INVOICED, PARTIALLY_PAID}"
          - "After posting, Sale.amount_collected_cents < Sale.buyer_total_cents"
        side_effects:
          - "Sale.amount_collected_cents += posted amount"
      - from: [INVOICED, PARTIALLY_PAID]
        to: SETTLED
        trigger: "POST /sales/{sale_id}/settle"
        actor: SalesAssociate
        preconditions:
          - "Sale.settlement_status IN {INVOICED, PARTIALLY_PAID}"
          - "Sale.amount_collected_cents == Sale.buyer_total_cents"
        side_effects:
          - "Sale.artist_share_cents recomputed with FINAL split variant; Artwork.status RESERVED -> SOLD; Artist ledger accrual cascade fires (see Artwork machine)"
      - from: [RESERVED, INVOICED, PARTIALLY_PAID]
        to: VOID
        trigger: "POST /sales/{sale_id}/void"
        actor: SalesAssociate
        preconditions:
          - "Sale.settlement_status IN {RESERVED, INVOICED, PARTIALLY_PAID}"
        side_effects:
          - "Artwork RESERVED -> CONSIGNED (compensating); any associated PaymentPlan ACTIVE -> CANCELLED; WallSlot release cascade fires (see Artwork machine)"

  - entity: Sale
    field: shipping_status
    initial_state: PENDING
    terminal_states: [DELIVERED]
    note: "Parallel dimension #2 of Sale (fulfilment). Independent of settlement_status; a sale may ship before or after being SETTLED."
    transitions:
      - from: PENDING
        to: SHIPPED
        trigger: "POST /sales/{sale_id}/ship"
        actor: SalesAssociate
        preconditions:
          - "Sale.shipping_status == PENDING"
          - "Sale.settlement_status != VOID"
        side_effects:
          - "Provenance entry {event: 'SHIPPED'} appended to the sale's Artwork"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /sales/{sale_id}/deliver"
        actor: SalesAssociate
        preconditions:
          - "Sale.shipping_status == SHIPPED"
        side_effects: []

  - entity: PaymentPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, on the payment that brings posted_installment_count == installment_count via POST /sales/{sale_id}/payments"
        actor: system
        preconditions:
          - "PaymentPlan.posted_installment_count == PaymentPlan.installment_count"
        side_effects:
          - "Plan closes; linked Sale is now eligible for settle"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /payment-plans/{plan_id}/sweep-overdue"
        actor: SalesAssociate
        preconditions:
          - "PaymentPlan.status == ACTIVE"
          - "PaymentPlan.missed_installment_count >= MAX_MISSED_INSTALLMENTS (see calculation plan_default_check)"
        side_effects:
          - "Plan -> DEFAULTED; linked Sale.settlement_status remains PARTIALLY_PAID/INVOICED (no settlement); no artist accrual"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system, when the linked Sale is voided"
        actor: system
        preconditions:
          - "Linked Sale.settlement_status transitioned to VOID"
        side_effects: []

  - entity: LeaseAgreement
    field: status
    initial_state: ACTIVE
    terminal_states: [CONVERTED, RETURNED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /leases/{lease_id}/convert"
        actor: SalesAssociate
        preconditions:
          - "LeaseAgreement.status == ACTIVE"
          - "Artwork.status == ON_LOAN (the leased work is out under this lease)"
        side_effects:
          - "A Sale is created against the artwork at gross_amount_cents == buyout_price_cents, settlement_status RESERVED; Artwork.status -> RESERVED"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /leases/{lease_id}/return"
        actor: SalesAssociate
        preconditions:
          - "LeaseAgreement.status == ACTIVE"
        side_effects:
          - "Artwork.status ON_LOAN -> CONSIGNED; provenance entry {event: 'LEASE_RETURNED'} appended"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /leases/{lease_id}/terminate"
        actor: GalleryAdmin
        preconditions:
          - "LeaseAgreement.status == ACTIVE"
        side_effects:
          - "Artwork.status ON_LOAN -> CONSIGNED"

  - entity: OpeningEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /opening-events/{event_id}/close"
        actor: GalleryAdmin
        preconditions:
          - "OpeningEvent.status == SCHEDULED"
        side_effects:
          - "No further RSVPs accepted; WAITLISTED RSVPs are NOT auto-promoted on close"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /opening-events/{event_id}/cancel or system (exhibition cancelled)"
        actor: "GalleryAdmin or system"
        preconditions:
          - "OpeningEvent.status == SCHEDULED"
        side_effects:
          - "Every CONFIRMED or WAITLISTED Rsvp on this event -> CANCELLED"

  - entity: Rsvp
    field: status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, PROMOTED]
    note: "Created directly into CONFIRMED when capacity allows, else into WAITLISTED; capacity is party_size-weighted. Both creation outcomes are pinned below."
    transitions:
      - from: CONFIRMED
        to: WAITLISTED
        trigger: "POST /rsvps (creation outcome when confirmed_seats + party_size > capacity)"
        actor: system
        preconditions:
          - "confirmed_seats (sum of party_size over CONFIRMED+PROMOTED) + this party_size > OpeningEvent.capacity"
          - "clock_utc <= OpeningEvent.rsvp_deadline_utc"
        note: "Pseudo-transition pinning the WAITLISTED creation outcome; a new Rsvp is persisted directly in WAITLISTED rather than passing through CONFIRMED. waitlist_count incremented."
        side_effects:
          - "OpeningEvent.waitlist_count incremented"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rsvps/{rsvp_id}/cancel"
        actor: GalleryAdmin
        preconditions:
          - "Rsvp.status == CONFIRMED"
          - "OpeningEvent.status == SCHEDULED"
        side_effects:
          - "Frees party_size seats; the earliest-created WAITLISTED Rsvp that now fits is set PROMOTED then counts as confirmed seating (cascade hop 2)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /rsvps/{rsvp_id}/cancel"
        actor: GalleryAdmin
        preconditions:
          - "Rsvp.status == WAITLISTED"
        side_effects: []
      - from: WAITLISTED
        to: PROMOTED
        trigger: "system, when a CONFIRMED/PROMOTED RSVP is cancelled and freed seats >= this RSVP's party_size, selecting by created_at ASC"
        actor: system
        preconditions:
          - "Freed seats (confirmed-equivalent capacity) >= Rsvp.party_size"
        side_effects:
          - "OpeningEvent.confirmed_count recomputed to include PROMOTED rows"

  - entity: Loan
    field: status
    initial_state: OUTSTANDING
    terminal_states: [RETURNED]
    transitions:
      - from: OUTSTANDING
        to: RETURNED
        trigger: "POST /loans/{loan_id}/return"
        actor: Registrar
        preconditions:
          - "Loan.status IN {OUTSTANDING, OVERDUE}"
        side_effects:
          - "Loan.returned_utc = clock; Artwork ON_LOAN -> CONSIGNED"
      - from: OUTSTANDING
        to: OVERDUE
        trigger: "POST /loans/{loan_id}/sweep-overdue"
        actor: Registrar
        preconditions:
          - "Loan.status == OUTSTANDING"
          - "clock_utc >= Loan.due_utc"
        side_effects:
          - "Loan flagged OVERDUE for reporting; artwork remains ON_LOAN"

  - entity: Payout
    field: status
    initial_state: PENDING
    terminal_states: [REVERSED]
    note: "PENDING is the initial state at creation; the create response already carries approved_cents."
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /payouts/{payout_id}/complete"
        actor: GalleryAdmin
        preconditions:
          - "Payout.status == PENDING"
        side_effects:
          - "Artist.ledger_paid_cents += Payout.approved_cents; Artist.ledger_payable_cents recomputed"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /payouts/{payout_id}/reverse"
        actor: GalleryAdmin
        preconditions:
          - "Payout.status == COMPLETED"
        side_effects:
          - "Artist.ledger_paid_cents -= Payout.approved_cents; Artist.ledger_payable_cents recomputed (compensating: ledger_paid returns to its pre-completion value)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# =============================================================================
concurrency_rules:
  - rule_id: wallslot-place-stale-exhibition
    parent_entity: Exhibition
    write_endpoint: "POST /exhibitions/{exhibition_id}/wall-slots"
    occ_field: "expected_exhibition_version"
    description: |
      Placing a WallSlot against an Exhibition whose version has advanced since
      the client last observed it is rejected with a stale-version error. The
      product allows a new placement to legitimately consume the last remaining
      wall slot, so a second create issued against a now-stale exhibition view
      (the prior placement already filled the floor and bumped the version) is a
      true supersede race resolved by OCC, not a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-post-stale-sale
    parent_entity: Sale
    write_endpoint: "POST /sales/{sale_id}/payments"
    occ_field: "expected_sale_version"
    description: |
      Posting an installment payment against a Sale whose version has advanced
      since the client last read it is rejected with a stale-version error. A
      payment legitimately supersedes the prior amount_collected snapshot, so a
      second post carrying a stale expected_sale_version is a true supersede race
      resolved by OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sale_money_breakdown
    trigger: "Sale create (POST /sales) and on each payment/discount mutation"
    algorithm: threshold
    formula: |
      net_amount_cents = round_half_up(gross_amount_cents * (10000 - discount_bps) / 10000)
      # Resale exemption: a sale is tax-exempt when EITHER the buyer ships out of
      # the gallery home state OR the gross qualifies as a wholesale/resale line.
      tax_exempt = (buyer_state_code != gallery.home_state_code)
                   OR (gallery.resale_exempt_threshold_cents > 0
                       AND gross_amount_cents > gallery.resale_exempt_threshold_cents)
      tax_amount_cents = 0 if tax_exempt
                         else round_half_up(net_amount_cents * gallery.sales_tax_rate_bps / 10000)
      buyer_total_cents = net_amount_cents + tax_amount_cents + shipping_cents
    input_set: "Single Sale plus its parent Gallery's tax fields; shipping never taxed."
    constants: {}
    precision: "integer cents, round_half_up; tax computed on net (post-discount), NOT on gross"

  - name: consignment_split
    trigger: "Provisional at Sale create (RESERVED); FINAL recompute at settle (RESERVED->SETTLED)"
    algorithm: forward_looking
    formula: |
      effective_split_bps = artist.split_override_bps if not null
                            else gallery.default_consignment_split_bps
      # PROVISIONAL (at reservation): split applied to the listed net, ignoring any
      # later-recorded discount, so the artist sees the headline cut at reservation.
      provisional_artist_share = round_half_up(
          round_half_up(gross_amount_cents * (10000 - 0) / 10000) * effective_split_bps / 10000)
      # FINAL (at settlement): split applied to the realized net AFTER discount.
      final_artist_share = round_half_up(net_amount_cents * effective_split_bps / 10000)
      gallery_share_cents = net_amount_cents - artist_share_cents
    input_set: "One Sale, its Artwork's Artist, and the Gallery default."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Sale.settlement_status == RESERVED (at create)"
        difference: "Split applied to undiscounted gross-derived net; discount_bps ignored. Stored in artist_share_cents but NOT accrued to the artist ledger."
      - name: final
        when: "RESERVED -> SETTLED transition"
        difference: "Split applied to net_amount_cents (post-discount). Difference vs provisional is accrued; only the final value lands in Artist.ledger_accrued_cents."

  - name: installment_schedule
    trigger: "PaymentPlan create (POST /payment-plans)"
    algorithm: waterfall_allocation
    formula: |
      base = buyer_total_cents (of linked Sale, which must be INVOICED)
      installment_cents = floor(base / installment_count)
      remainder = base - installment_cents * installment_count
      final_installment_cents = installment_cents + remainder
      # Installments #1..#(n-1) each equal installment_cents; installment #n equals
      # final_installment_cents. The remainder is loaded on the LAST installment,
      # never distributed across earlier ones.
    input_set: "One PaymentPlan and its linked Sale.buyer_total_cents."
    constants: {}
    precision: "integer cents; floor division for the base installment, remainder on final"

  - name: plan_default_check
    trigger: "POST /payment-plans/{plan_id}/sweep-overdue and on missed_installment_count read"
    algorithm: threshold
    formula: |
      # An installment #k is DUE when clock_utc >= first_due_utc + (k-1)*cadence_days.
      due_count = number of k in 1..installment_count with clock_utc >= first_due_utc + (k-1)*cadence_days*86400s
      missed_installment_count = max(0, due_count - posted_installment_count)
      defaulted = missed_installment_count >= MAX_MISSED_INSTALLMENTS
    input_set: "One PaymentPlan, the logical clock, and its posted installment count."
    constants:
      MAX_MISSED_INSTALLMENTS: 2
    precision: "integer counts; due boundary is inclusive (>=), strictly the k-th due instant counts as due"

  - name: lease_buyout
    trigger: "LeaseAgreement read and convert (ACTIVE->CONVERTED)"
    algorithm: decay_function
    formula: |
      months_accrued = min(term_months, floor((clock_utc - starts_utc) / 30 days))
      rent_accrued_cents = months_accrued * monthly_rate_cents
      credit_cents = round_half_up(rent_accrued_cents * purchase_credit_bps / 10000)
      buyout_price_cents = max(0, artwork.list_price_cents - credit_cents)
    input_set: "One LeaseAgreement, its Artwork.list_price_cents, and the clock."
    constants:
      DAYS_PER_MONTH: 30
    precision: "whole months via floor of 30-day blocks; credit round_half_up; buyout floored at 0"

  - name: loan_coverage_gap
    trigger: "Loan create (POST /loans)"
    algorithm: threshold
    formula: |
      # A loan is only allowed out if the borrower's secured coverage meets the
      # artwork's insured replacement value. Boundary is inclusive: equal coverage
      # is acceptable; strictly-less is rejected.
      adequate = coverage_value_cents >= artwork.insured_value_cents
      reject with ERR_INSUFFICIENT_COVERAGE if not adequate
    input_set: "One prospective Loan and its Artwork.insured_value_cents."
    constants: {}
    precision: "integer cents; threshold is >= (equal passes)"

  - name: rsvp_seat_allocation
    trigger: "Rsvp create (POST /rsvps) and on CONFIRMED/PROMOTED cancel"
    algorithm: aggregation
    formula: |
      confirmed_seats = sum(party_size for Rsvp in {CONFIRMED, PROMOTED} on this event)
      # New RSVP is CONFIRMED iff confirmed_seats + party_size <= capacity, else WAITLISTED.
      seats_free = capacity - confirmed_seats
      # On cancel of a CONFIRMED/PROMOTED row: recompute seats_free, then promote
      # WAITLISTED rows in created_at ASC order, each promotable iff its party_size
      # <= current seats_free; stop at the first row that does not fit (no skip-ahead).
    input_set: "All non-terminal Rsvp rows of one OpeningEvent, ordered by created_at ASC."
    constants: {}
    precision: "integer seats; capacity boundary inclusive (<=); promotion strictly in created_at ASC, no fill-the-gap skipping"

  - name: artist_ledger
    trigger: "Sale settle (accrue), Payout complete (pay), Payout reverse (un-pay)"
    algorithm: aggregation
    formula: |
      ledger_accrued_cents = sum(final_artist_share for SETTLED Sales of this artist's artworks)
      ledger_paid_cents    = sum(approved_cents for COMPLETED Payouts of this artist)
      ledger_payable_cents = max(0, ledger_accrued_cents - ledger_paid_cents)
      # Conservation invariant: at all times
      #   ledger_accrued_cents == ledger_paid_cents + ledger_payable_cents
      # (payable never below zero; a reversed payout returns paid to its prior value).
    input_set: "All SETTLED Sales whose Artwork.artist_id == this artist; all COMPLETED Payouts for this artist."
    constants: {}
    precision: "integer cents; payable floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists within the gallery scope, validated left-to-right (gallery, then artwork/exhibition/sale/...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values legal, numeric constraints honored (e.g. closes_utc > opens_utc, installment_count in 2..24)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (e.g. settle requires INVOICED/PARTIALLY_PAID; open requires PLANNED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version matches the parent's current version on supersede creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /exhibitions/{id}/wall-slots, POST /sales/{id}/payments"

  - priority: 7
    category: business_referential
    check: "Cross-entity gate: the consigning artist of an artwork is not SUSPENDED when consigning/selling; the leased artwork is ON_LOAN before convert"
    error_id: ERR_ARTIST_SUSPENDED
    http_status: 409
    applies_to: "POST /artworks, POST /sales, POST /payouts"

  - priority: 8
    category: business_safety
    check: "Loan coverage adequacy: borrower coverage_value_cents >= artwork.insured_value_cents (inclusive boundary)"
    error_id: ERR_INSUFFICIENT_COVERAGE
    http_status: 409
    applies_to: "POST /loans"

  - priority: 9
    category: business_temporal
    check: "Temporal-overlap conflicts. Loan booking ledger: a new Loan window [out_utc, due_utc) (half-open) must not overlap the window of ANY prior Loan recorded for the same artwork regardless of that loan's current status (OUTSTANDING, OVERDUE, or RETURNED) — the artwork's full loan history is a non-overlapping booking calendar, so a returned loan still reserves its calendar window. Exhibition run ledger: a wall-slot placement of an artwork is rejected when that artwork is already PLACED in another non-terminal exhibition (status IN {PLANNED, OPEN}) whose closed-overlap run window [opens_utc, closes_utc] intersects this exhibition's run window (adjacency at a shared boundary instant counts as a conflict for shows, unlike loans)."
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /loans, POST /exhibitions/{id}/wall-slots"

  - priority: 10
    category: business_constraint
    check: "Wall-map capacity & position uniqueness: WallSlot placement must not exceed exhibition.wall_capacity, and position_index must be unique among PLACED slots of the exhibition"
    error_id: ERR_WALL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exhibitions/{id}/wall-slots"

  - priority: 11
    category: business_temporal
    check: "RSVP deadline: a CONFIRMED/WAITLISTED RSVP may only be created while clock_utc <= opening_event.rsvp_deadline_utc"
    error_id: ERR_RSVP_CLOSED
    http_status: 409
    applies_to: "POST /rsvps"

  - priority: 12
    category: business_constraint
    check: "Event capacity: an RSVP is WAITLISTED rather than rejected when confirmed seats + party_size > capacity (not an error); but party_size must be <= capacity"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /rsvps"

  - priority: 13
    category: business_fiscal
    check: "Payment may not overpay: a posted installment that would push amount_collected_cents above buyer_total_cents is rejected"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /sales/{id}/payments"

  - priority: 14
    category: business_fiscal
    check: "Payout request positivity and funds: requested_cents > 0 and artist.ledger_payable_cents > 0 at creation (approved_cents = min(requested, payable))"
    error_id: ERR_NO_PAYABLE_BALANCE
    http_status: 409
    applies_to: "POST /payouts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [GalleryAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ clock_utc: datetime }"
    side_effects: ["Sets Gallery.clock_utc for all galleries to the supplied instant; recomputes clock-derived fields (loan/plan/lease/rsvp deadlines) on read"]

  # ---- Gallery ----
  - method: POST
    path: "/galleries"
    description: "Create a gallery"
    roles: [GalleryAdmin]
    code: 201
    input: [name, home_state_code, sales_tax_rate_bps, "resale_exempt_threshold_cents?", "default_consignment_split_bps?"]
    output: Gallery
    side_effects: ["clock_utc initialized to 2026-04-01T00:00:00Z if unset"]
  - method: GET
    path: "/galleries/{gallery_id}"
    description: "Get a gallery"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: []
    output: Gallery
    side_effects: []

  # ---- Artist ----
  - method: POST
    path: "/artists"
    description: "Register a consigning artist"
    roles: [GalleryAdmin]
    code: 201
    input: [gallery_id, full_name, "split_override_bps?"]
    output: Artist
    side_effects: ["status=ACTIVE; ledger counters=0"]
  - method: GET
    path: "/artists"
    description: "List artists (filterable); reverse-reachability for Artist.gallery_id"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: ["gallery_id?", "status?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []
  - method: GET
    path: "/artists/{artist_id}"
    description: "Get an artist with live ledger fields"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: POST
    path: "/artists/{artist_id}/suspend"
    description: "Suspend an artist"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Artist
    side_effects: ["status ACTIVE->SUSPENDED"]
  - method: POST
    path: "/artists/{artist_id}/reinstate"
    description: "Reinstate a suspended artist"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Artist
    side_effects: ["status SUSPENDED->ACTIVE"]

  # ---- Artwork ----
  - method: POST
    path: "/artworks"
    description: "Consign an artwork"
    roles: [GalleryAdmin, Registrar]
    code: 201
    input: [gallery_id, artist_id, title, list_price_cents, insured_value_cents]
    output: Artwork
    side_effects: ["status=CONSIGNED; provenance entry {event:'CONSIGNED'} appended; rejected ERR_ARTIST_SUSPENDED if artist SUSPENDED"]
  - method: GET
    path: "/artworks"
    description: "List artworks; filtered-list reverse-reachability for Artwork.gallery_id and Artwork.artist_id"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: ["gallery_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []
  - method: GET
    path: "/artworks/{artwork_id}"
    description: "Get an artwork incl. provenance_log"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: []
    output: Artwork
    side_effects: []
  - method: POST
    path: "/artworks/{artwork_id}/provenance"
    description: "Append a provenance/ownership-history entry"
    roles: [Registrar]
    code: 201
    input: [event]
    output: Artwork
    side_effects: ["Appends {seq, event, at_utc=clock} to provenance_log; provenance_count++"]
  - method: POST
    path: "/artworks/{artwork_id}/return-to-artist"
    description: "Return a consigned artwork to the artist"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Artwork
    side_effects: ["status CONSIGNED->RETURNED; provenance entry appended"]

  # ---- Exhibition + Wall map ----
  - method: POST
    path: "/exhibitions"
    description: "Schedule an exhibition/show"
    roles: [GalleryAdmin]
    code: 201
    input: [gallery_id, title, wall_capacity, opens_utc, closes_utc]
    output: Exhibition
    side_effects: ["status=PLANNED; slots_occupied=0"]
  - method: GET
    path: "/exhibitions"
    description: "List exhibitions; filtered-list reverse-reachability for Exhibition.gallery_id"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: ["gallery_id?", "status?", "limit?", "offset?"]
    output: Exhibition[]
    side_effects: []
  - method: GET
    path: "/exhibitions/{exhibition_id}"
    description: "Get an exhibition with live slot counts"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: []
    output: Exhibition
    side_effects: []
  - method: POST
    path: "/exhibitions/{exhibition_id}/wall-slots"
    description: "Place an artwork on the wall map (supersede-create; OCC-guarded by expected_exhibition_version)"
    roles: [GalleryAdmin, Registrar]
    code: 201
    input: [artwork_id, wall_label, position_index, expected_exhibition_version]
    output: WallSlot
    side_effects: ["status=PLACED; increments Exhibition.version by 1; Exhibition.slots_occupied/slots_available recomputed"]
  - method: GET
    path: "/exhibitions/{exhibition_id}/wall-slots"
    description: "List wall slots of an exhibition; sub-resource reverse-reachability for WallSlot.exhibition_id"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WallSlot[]
    side_effects: []
  - method: GET
    path: "/wall-slots"
    description: "List wall slots (filterable); filtered-list reverse-reachability for WallSlot.gallery_id and WallSlot.artwork_id"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: ["gallery_id?", "artwork_id?", "exhibition_id?", "status?", "limit?", "offset?"]
    output: WallSlot[]
    side_effects: []
  - method: GET
    path: "/wall-slots/{wall_slot_id}"
    description: "Get a single wall slot"
    roles: [GalleryAdmin, Registrar, SalesAssociate, Artist]
    code: 200
    input: []
    output: WallSlot
    side_effects: []
  - method: POST
    path: "/exhibitions/{exhibition_id}/open"
    description: "Open (go live with) an exhibition"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["status PLANNED->OPEN"]
  - method: POST
    path: "/exhibitions/{exhibition_id}/close"
    description: "Close an exhibition"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["status OPEN->CLOSED; all PLACED slots RELEASED"]
  - method: POST
    path: "/exhibitions/{exhibition_id}/cancel"
    description: "Cancel a planned exhibition (cascades to events and RSVPs)"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["status PLANNED->CANCELLED; slots RELEASED; SCHEDULED events CANCELLED; their RSVPs CANCELLED"]

  # ---- Sale + payments + shipping ----
  - method: POST
    path: "/sales"
    description: "Create a sale (reserve an artwork). Computes money breakdown + provisional split."
    roles: [SalesAssociate, GalleryAdmin]
    code: 201
    input: [gallery_id, artwork_id, buyer_name, buyer_state_code, gross_amount_cents, "exhibition_id?", "discount_bps?", "shipping_cents?"]
    output: Sale
    side_effects: ["settlement_status=RESERVED; shipping_status=PENDING; Artwork CONSIGNED->RESERVED; provisional artist_share computed; provenance entry appended"]
  - method: GET
    path: "/sales"
    description: "List sales; filtered-list reverse-reachability for Sale.gallery_id, Sale.artwork_id, Sale.exhibition_id"
    roles: [GalleryAdmin, SalesAssociate, Artist]
    code: 200
    input: ["gallery_id?", "artwork_id?", "exhibition_id?", "settlement_status?", "shipping_status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/sales/{sale_id}"
    description: "Get a sale with full money breakdown"
    roles: [GalleryAdmin, SalesAssociate, Artist]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/sales/{sale_id}/invoice"
    description: "Invoice a reserved sale (lock buyer total)"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: ["settlement_status RESERVED->INVOICED"]
  - method: POST
    path: "/sales/{sale_id}/payments"
    description: "Post a payment/installment (supersede-create; OCC-guarded by expected_sale_version)"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: [amount_cents, expected_sale_version]
    output: Sale
    side_effects: ["amount_collected_cents += amount; increments Sale.version by 1; settlement_status -> PARTIALLY_PAID; if a PaymentPlan exists posted_installment_count++; plan auto-COMPLETED when all posted; ERR_OVERPAYMENT if would exceed buyer_total"]
  - method: POST
    path: "/sales/{sale_id}/settle"
    description: "Settle a fully-paid sale (fires final split + ledger accrual cascade)"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: ["settlement_status->SETTLED; final artist_share; Artwork RESERVED->SOLD; WallSlot RELEASED; Artist ledger accrued"]
  - method: POST
    path: "/sales/{sale_id}/void"
    description: "Void a non-settled sale (compensating; reverts artwork, cancels plan, releases slot)"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: ["settlement_status->VOID; Artwork RESERVED->CONSIGNED; PaymentPlan ACTIVE->CANCELLED; WallSlot RELEASED"]
  - method: POST
    path: "/sales/{sale_id}/ship"
    description: "Mark a sale shipped"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: ["shipping_status PENDING->SHIPPED; provenance entry appended"]
  - method: POST
    path: "/sales/{sale_id}/deliver"
    description: "Mark a sale delivered"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: ["shipping_status SHIPPED->DELIVERED"]

  # ---- Payment plans ----
  - method: POST
    path: "/payment-plans"
    description: "Create an installment plan for an invoiced sale"
    roles: [SalesAssociate, GalleryAdmin]
    code: 201
    input: [sale_id, installment_count, cadence_days, first_due_utc]
    output: PaymentPlan
    side_effects: ["status=ACTIVE; installment_cents and final_installment_cents computed; sale must be INVOICED"]
  - method: GET
    path: "/payment-plans"
    description: "List payment plans; filtered-list reverse-reachability for PaymentPlan.gallery_id and PaymentPlan.sale_id"
    roles: [GalleryAdmin, SalesAssociate]
    code: 200
    input: ["gallery_id?", "sale_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []
  - method: GET
    path: "/payment-plans/{plan_id}"
    description: "Get a plan with live missed/posted counts"
    roles: [GalleryAdmin, SalesAssociate]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: POST
    path: "/payment-plans/{plan_id}/sweep-overdue"
    description: "Evaluate a plan against the clock and default it if missed >= 2"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status ACTIVE->DEFAULTED when missed_installment_count >= 2; else no-op"]

  # ---- Leases ----
  - method: POST
    path: "/leases"
    description: "Create an art-lease agreement (puts artwork ON_LOAN)"
    roles: [SalesAssociate, GalleryAdmin]
    code: 201
    input: [artwork_id, lessee_name, monthly_rate_cents, term_months, starts_utc, "purchase_credit_bps?"]
    output: LeaseAgreement
    side_effects: ["status=ACTIVE; Artwork CONSIGNED->ON_LOAN"]
  - method: GET
    path: "/leases"
    description: "List leases; filtered-list reverse-reachability for LeaseAgreement.gallery_id and LeaseAgreement.artwork_id"
    roles: [GalleryAdmin, SalesAssociate, Registrar]
    code: 200
    input: ["gallery_id?", "artwork_id?", "status?", "limit?", "offset?"]
    output: LeaseAgreement[]
    side_effects: []
  - method: GET
    path: "/leases/{lease_id}"
    description: "Get a lease with live accrual + buyout"
    roles: [GalleryAdmin, SalesAssociate, Registrar]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: []
  - method: POST
    path: "/leases/{lease_id}/convert"
    description: "Convert a lease into a purchase at the credited buyout price"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status ACTIVE->CONVERTED; Sale created at gross=buyout_price_cents; Artwork ON_LOAN->RESERVED"]
  - method: POST
    path: "/leases/{lease_id}/return"
    description: "Return a leased artwork"
    roles: [SalesAssociate, GalleryAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status ACTIVE->RETURNED; Artwork ON_LOAN->CONSIGNED"]
  - method: POST
    path: "/leases/{lease_id}/terminate"
    description: "Terminate a lease for cause"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status ACTIVE->TERMINATED; Artwork ON_LOAN->CONSIGNED"]

  # ---- Opening events + RSVP ----
  - method: POST
    path: "/opening-events"
    description: "Create an opening reception for an exhibition"
    roles: [GalleryAdmin]
    code: 201
    input: [exhibition_id, capacity, starts_utc, rsvp_deadline_utc]
    output: OpeningEvent
    side_effects: ["status=SCHEDULED; confirmed_count=0; waitlist_count=0"]
  - method: GET
    path: "/opening-events"
    description: "List opening events; filtered-list reverse-reachability for OpeningEvent.gallery_id and OpeningEvent.exhibition_id"
    roles: [GalleryAdmin, SalesAssociate, Registrar, Artist]
    code: 200
    input: ["gallery_id?", "exhibition_id?", "status?", "limit?", "offset?"]
    output: OpeningEvent[]
    side_effects: []
  - method: GET
    path: "/opening-events/{event_id}"
    description: "Get an opening event with live counts"
    roles: [GalleryAdmin, SalesAssociate, Registrar, Artist]
    code: 200
    input: []
    output: OpeningEvent
    side_effects: []
  - method: POST
    path: "/opening-events/{event_id}/close"
    description: "Close RSVPs for an event"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: OpeningEvent
    side_effects: ["status SCHEDULED->CLOSED"]
  - method: POST
    path: "/opening-events/{event_id}/cancel"
    description: "Cancel an event (cancels all its RSVPs)"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: OpeningEvent
    side_effects: ["status SCHEDULED->CANCELLED; CONFIRMED/WAITLISTED RSVPs -> CANCELLED"]
  - method: POST
    path: "/rsvps"
    description: "Create an RSVP (CONFIRMED if seats free, else WAITLISTED)"
    roles: [GalleryAdmin, SalesAssociate]
    code: 201
    input: [opening_event_id, guest_name, "party_size?"]
    output: Rsvp
    side_effects: ["status CONFIRMED or WAITLISTED per seat allocation; counts recomputed; ERR_RSVP_CLOSED if past deadline"]
  - method: GET
    path: "/rsvps"
    description: "List RSVPs; filtered-list reverse-reachability for Rsvp.gallery_id and Rsvp.opening_event_id"
    roles: [GalleryAdmin, SalesAssociate, Registrar]
    code: 200
    input: ["gallery_id?", "opening_event_id?", "status?", "limit?", "offset?"]
    output: Rsvp[]
    side_effects: []
  - method: GET
    path: "/rsvps/{rsvp_id}"
    description: "Get a single RSVP"
    roles: [GalleryAdmin, SalesAssociate, Registrar]
    code: 200
    input: []
    output: Rsvp
    side_effects: []
  - method: POST
    path: "/rsvps/{rsvp_id}/cancel"
    description: "Cancel an RSVP (promotes earliest-fitting waitlisted RSVP)"
    roles: [GalleryAdmin, SalesAssociate]
    code: 200
    input: []
    output: Rsvp
    side_effects: ["status->CANCELLED; if it was CONFIRMED/PROMOTED, earliest-created fitting WAITLISTED RSVP -> PROMOTED"]

  # ---- Loans + provenance/insurance ----
  - method: POST
    path: "/loans"
    description: "Loan an artwork out (coverage + schedule-overlap checked)"
    roles: [Registrar, GalleryAdmin]
    code: 201
    input: [artwork_id, borrower_name, coverage_value_cents, out_utc, due_utc]
    output: Loan
    side_effects: ["status=OUTSTANDING; Artwork CONSIGNED->ON_LOAN; ERR_INSUFFICIENT_COVERAGE / ERR_SCHEDULE_CONFLICT enforced"]
  - method: GET
    path: "/loans"
    description: "List loans; filtered-list reverse-reachability for Loan.gallery_id and Loan.artwork_id"
    roles: [GalleryAdmin, Registrar]
    code: 200
    input: ["gallery_id?", "artwork_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/loans/{loan_id}"
    description: "Get a loan"
    roles: [GalleryAdmin, Registrar]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/loans/{loan_id}/return"
    description: "Return a loaned artwork"
    roles: [Registrar, GalleryAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["status->RETURNED; returned_utc=clock; Artwork ON_LOAN->CONSIGNED"]
  - method: POST
    path: "/loans/{loan_id}/sweep-overdue"
    description: "Flag an outstanding loan overdue if past due date"
    roles: [Registrar, GalleryAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["status OUTSTANDING->OVERDUE when clock_utc >= due_utc"]

  # ---- Payouts + reporting ----
  - method: POST
    path: "/payouts"
    description: "Create a payout for an artist (approved = min(requested, payable))"
    roles: [GalleryAdmin]
    code: 201
    input: [artist_id, requested_cents]
    output: Payout
    side_effects: ["status=PENDING; approved_cents=min(requested, artist.ledger_payable_cents); ERR_NO_PAYABLE_BALANCE if payable==0; ERR_ARTIST_SUSPENDED if artist SUSPENDED"]
  - method: GET
    path: "/payouts"
    description: "List payouts; filtered-list reverse-reachability for Payout.gallery_id and Payout.artist_id"
    roles: [GalleryAdmin, Artist]
    code: 200
    input: ["gallery_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: GET
    path: "/payouts/{payout_id}"
    description: "Get a payout"
    roles: [GalleryAdmin, Artist]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: POST
    path: "/payouts/{payout_id}/complete"
    description: "Mark a payout completed (debits artist ledger)"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status PENDING->COMPLETED; Artist.ledger_paid_cents += approved_cents"]
  - method: POST
    path: "/payouts/{payout_id}/reverse"
    description: "Reverse a completed payout (compensating: credits ledger back)"
    roles: [GalleryAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status COMPLETED->REVERSED; Artist.ledger_paid_cents -= approved_cents"]
  - method: GET
    path: "/reports/sales-summary"
    description: "Computed report: gross/net/tax/shipping totals and artist-vs-gallery split over SETTLED sales in a window"
    roles: [GalleryAdmin]
    code: 200
    input: ["from_utc?", "to_utc?"]
    output: "{ settled_sale_count: integer, gross_total_cents: integer, net_total_cents: integer, tax_total_cents: integer, shipping_total_cents: integer, artist_share_total_cents: integer, gallery_share_total_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced gallery/artist/artwork/exhibition/sale/plan/lease/event/rsvp/loan/payout/wall-slot does not exist in scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, illegal enum, constraint violation (closes_utc<=opens_utc, installment_count out of 2..24, party_size>capacity, negative amounts)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on a supersede-create (wall-slot place, payment post)" }
  - { id: ERR_ARTIST_SUSPENDED, http: 409, condition: "Consigning, selling, or paying out an artist whose status is SUSPENDED" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 409, condition: "Loan coverage_value_cents < artwork.insured_value_cents (strictly less)" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "New loan half-open window [out_utc,due_utc) overlaps ANY prior recorded loan window for the artwork (any status, returned loans still reserve their calendar slot), or a wall-slot placement collides (closed-overlap, adjacency counts) with another non-terminal exhibition already placing the same artwork" }
  - { id: ERR_WALL_CAPACITY_EXCEEDED, http: 409, condition: "WallSlot placement exceeds exhibition.wall_capacity or duplicates a PLACED position_index" }
  - { id: ERR_RSVP_CLOSED, http: 409, condition: "RSVP create after opening_event.rsvp_deadline_utc, or on a CLOSED/CANCELLED event" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "A posted payment would push amount_collected_cents above buyer_total_cents" }
  - { id: ERR_NO_PAYABLE_BALANCE, http: 409, condition: "Payout requested when artist.ledger_payable_cents == 0" }
  - { id: ERR_PLAN_SALE_NOT_INVOICED, http: 409, condition: "Payment plan created against a sale not in INVOICED state" }
  - { id: ERR_LEASE_ARTWORK_NOT_OUT, http: 409, condition: "Lease convert attempted while the artwork is not ON_LOAN under the lease" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of bounds (limit 1..100, offset >= 0)" }
  - { id: ERR_DUPLICATE_PROVENANCE_EVENT, http: 409, condition: "Provenance append with an empty or whitespace-only event string" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GalleryAdmin
    description: "Gallery operator with the broadest surface: gallery/artist setup, exhibition lifecycle, lease termination, payout lifecycle, reporting, and the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /galleries — create gallery"
      - "POST /artists/{id}/suspend, /reinstate — artist lifecycle"
      - "POST /exhibitions/{id}/open, /close, /cancel — exhibition lifecycle"
      - "POST /artworks/{id}/return-to-artist"
      - "POST /leases/{id}/terminate"
      - "POST /opening-events, /opening-events/{id}/close, /cancel"
      - "POST /payouts, /payouts/{id}/complete, /reverse"
      - "GET /reports/sales-summary"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /artworks (with Registrar)"
      - "POST /exhibitions/{id}/wall-slots (with Registrar)"
      - "POST /sales and sale lifecycle (with SalesAssociate)"
      - "POST /payment-plans, /leases, /rsvps and their lifecycles (with SalesAssociate)"
      - "POST /loans and loan lifecycle (with Registrar)"
      - "all GET reads"

  - name: Registrar
    description: "Collections registrar owning provenance, consignment intake, wall-map placement, and loan/insurance operations."
    identity: opaque
    exclusive_operations:
      - "POST /artworks/{id}/provenance — append provenance"
    shared_operations:
      - "POST /artworks (with GalleryAdmin)"
      - "POST /exhibitions/{id}/wall-slots (with GalleryAdmin)"
      - "POST /loans and loan lifecycle: /return, /sweep-overdue (with GalleryAdmin)"
      - "GET reads on artworks, exhibitions, wall-slots, leases, loans, opening-events, rsvps"

  - name: SalesAssociate
    description: "Front-of-house sales role owning sales, payments, shipping, payment plans, leases, and RSVPs."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /sales and sale lifecycle: /invoice, /payments, /settle, /void, /ship, /deliver (with GalleryAdmin)"
      - "POST /payment-plans, /payment-plans/{id}/sweep-overdue (with GalleryAdmin)"
      - "POST /leases and lifecycle: /convert, /return (with GalleryAdmin)"
      - "POST /rsvps, /rsvps/{id}/cancel (with GalleryAdmin)"
      - "GET reads on sales, plans, leases, opening-events, rsvps, artworks, exhibitions"

  - name: Artist
    description: "A consigning artist; read-only visibility into own ledger, artworks, sales, and payouts. X-User-ID equals an Artist.id."
    identity: "entity_backed:Artist"
    exclusive_operations: []
    shared_operations:
      - "GET /artists/{id} — own ledger"
      - "GET /artworks (own, via artist_id filter)"
      - "GET /sales (own artworks)"
      - "GET /payouts (own)"
      - "GET /exhibitions, /opening-events, /galleries — read context"
