          rationale: "The multi-level cascade is designed in §1.8 end-to-end — finalize rewrites the tier, supersedes the TIER_PRICE row, mints its replacement from the logical clock, leaves the LOCAL_EXCEPTION alone and recomputes ContractItem.active_activation_count — so a second walk of the same chain here would add nothing."

