            - "Two creatives, both with disclaimer_text omitted, one declaring SUP_HEALTH and one declaring ALC_SPIRITS, each screened at confidence 0.50 and claimed by the reviewer."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUP_HEALTH", title: "Health supplements", category_class: "REGULATED", base_severity_weight: 3.00, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
