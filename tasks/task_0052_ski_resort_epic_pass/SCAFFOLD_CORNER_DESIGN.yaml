# ==========================================================================
# 1.9 SCAFFOLD CORNER DESIGN (Coverage Index for Non-Difficulty Tests) — breadth probe
# Task: task_0052_ski_resort_epic_pass
# Enumerates testable claims in SCAFFOLD.yaml §1.1–§1.7 not already covered by §1.8.
# section: values are the nine claim-extraction-guide sections.
# excluded_because: stubs cite §1.8 instance names that exist in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# ==========================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------------
  - section: entities
    instances:
      - name: pass_issue_mints_unique_magnetic_token
        claim_type: computed_field_correctness
        grounds:
          - entities.Pass.fields.magnetic_token
          - endpoints.POST_/passes
        distinguishing_aspect: "POST /passes mints a non-null, unique magnetic_token system field; two passes get distinct tokens."
        test_recipe:
          setup:
            - "One PassProduct exists."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Tok A" }
              as: ResortOps
              captures: { p1: $.data.id, tok1: $.data.magnetic_token }
          trigger:
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Tok B" }
              as: ResortOps
              captures: { p2: $.data.id, tok2: $.data.magnetic_token }
          assert:
            - "Pass.${p1}.magnetic_token is non-empty string"
            - "Pass.${p2}.magnetic_token != Pass.${p1}.magnetic_token"

      - name: pass_issue_defaults_status_issued_and_counters_zero
        claim_type: default_value
        grounds:
          - entities.Pass.fields.status
          - entities.Pass.fields.scan_count
          - entities.Pass.fields.buddy_tickets_remaining
          - entities.Pass.fields.activated_on
        distinguishing_aspect: "A freshly issued pass has status=ISSUED, scan_count=0, buddy_tickets_remaining=0, activated_on=null."
        test_recipe:
          setup:
            - "One PassProduct."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, buddy_ticket_allotment: 3, buddy_ticket_price_cents: 1000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Fresh" }
              as: ResortOps
              captures: { pass_id: $.data.id }
          assert:
            - "Pass.${pass_id}.status == ISSUED"
            - "Pass.${pass_id}.scan_count == 0"
            - "Pass.${pass_id}.buddy_tickets_remaining == 0"
            - "Pass.${pass_id}.activated_on == null"

      - name: resort_create_defaults_open_and_gate_count_one
        claim_type: default_value
        grounds:
          - entities.Resort.fields.status
          - entities.Resort.fields.home_network
          - entities.Resort.fields.gate_count
        distinguishing_aspect: "A resort created without home_network/gate_count defaults to home_network=EPIC, gate_count=1, status=OPEN."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /resorts"
              payload: { name: "Default Resort" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
          assert:
            - "Resort.${resort_id}.status == OPEN"
            - "Resort.${resort_id}.home_network == EPIC"
            - "Resort.${resort_id}.gate_count == 1"

      - name: pass_activate_sets_refund_basis_and_buddy_remaining
        claim_type: computed_field_correctness
        grounds:
          - entities.Pass.fields.refund_basis_cents
          - entities.Pass.fields.activated_on
          - entities.Pass.fields.buddy_tickets_remaining
          - state_machines.Pass.ISSUED_to_ACTIVE
        distinguishing_aspect: "ISSUED->ACTIVE sets refund_basis_cents to PassProduct.price_cents (6000) and buddy_tickets_remaining to allotment (2), and stamps activated_on."
        test_recipe:
          setup:
            - "PassProduct price_cents=6000, buddy_ticket_allotment=2. One ISSUED pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 6000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 1000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Activate Me" }
              as: ResortOps
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
              captures: { basis: $.data.refund_basis_cents, rem: $.data.buddy_tickets_remaining, act: $.data.activated_on }
          assert:
            - "Pass.${pass_id}.status == ACTIVE"
            - "Pass.${pass_id}.refund_basis_cents == 6000"
            - "Pass.${pass_id}.buddy_tickets_remaining == 2"
            - "Pass.${pass_id}.activated_on != null"

      - name: buddy_reserve_copies_price_charged_from_product
        claim_type: computed_field_correctness
        grounds:
          - entities.BuddyTicket.fields.price_charged_cents
          - entities.PassProduct.fields.buddy_ticket_price_cents
          - endpoints.POST_/buddy-tickets
        distinguishing_aspect: "Reserving a buddy ticket copies price_charged_cents from PassProduct.buddy_ticket_price_cents (2500) at reservation time."
        test_recipe:
          setup:
            - "Product buddy_ticket_price_cents=2500, allotment=2. ACTIVE pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-04T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2500, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Price Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Price Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-06" }
              as: ResortOps
              captures: { bt_id: $.data.id, charged: $.data.price_charged_cents }
          assert:
            - "BuddyTicket.${bt_id}.price_charged_cents == 2500"
            - "BuddyTicket.${bt_id}.status == RESERVED"

      - name: scan_count_advances_only_on_granted
        claim_type: computed_field_correctness
        grounds:
          - entities.Pass.fields.scan_count
          - calculations.scan_access_decision
          - endpoints.POST_/passes/{id}/scan
        distinguishing_aspect: "A DENIED scan (token mismatch) does NOT advance scan_count; a subsequent GRANTED scan advances it to 1."
        test_recipe:
          setup:
            - "FULL_EPIC ACTIVE pass at an EPIC resort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-07T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Count Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Count Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "WRONG_TOKEN" }
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { sc_after_denied: $.data.scan_count }
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { sc_after_granted: $.data.scan_count }
          assert:
            - "Pass.${pass_id}.scan_count (after denied scan) == 0"
            - "Pass.${pass_id}.scan_count (after granted scan) == 1"

  # ------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: activate_already_active_pass_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Pass.ISSUED_to_ACTIVE
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a pass already ACTIVE fails ERR_INVALID_STATE (no ACTIVE->ACTIVE transition); no side effects fire."
        test_recipe:
          setup:
            - "One ACTIVE pass."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Active Already" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: suspend_issued_pass_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Suspending an ISSUED (never-activated) pass fails ERR_INVALID_STATE; suspend requires ACTIVE."
        test_recipe:
          setup:
            - "One ISSUED pass (not activated)."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Issued Only" }
              as: ResortOps
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: redeem_cancelled_buddy_ticket_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BuddyTicket.RESERVED_to_REDEEMED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Redeeming a CANCELLED buddy ticket fails ERR_INVALID_STATE; redeem requires RESERVED."
        test_recipe:
          setup:
            - "ACTIVE pass with one RESERVED buddy ticket, then cancelled."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Cancel Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Cancel Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-02" }
              as: ResortOps
              captures: { bt_id: $.data.id }
            - call: "POST /buddy-tickets/${bt_id}/cancel"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets/${bt_id}/redeem"
              payload: {}
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "BuddyTicket.${bt_id}.status == CANCELLED"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reject_already_rejected_refund_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RefundRequest.PENDING_to_REJECTED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Rejecting a RefundRequest already in REJECTED fails ERR_INVALID_STATE; reject requires PENDING."
        test_recipe:
          setup:
            - "ACTIVE pass with a RefundRequest already REJECTED."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 6000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Reject Twice" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "POST /refund-requests/${rr_id}/reject"
              payload: {}
              as: RefundAdmin
          trigger:
            - call: "POST /refund-requests/${rr_id}/reject"
              payload: {}
              as: RefundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "RefundRequest.${rr_id}.status == REJECTED"
            - "data.error_id == ERR_INVALID_STATE"

      - name: suspend_pass_cancels_reserved_buddy_tickets_cascade
        claim_type: cascade_side_effect
        grounds:
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - calculations.buddy_tickets_remaining
        distinguishing_aspect: "Suspending an ACTIVE pass cascades its RESERVED buddy tickets to CANCELLED and recomputes buddy_tickets_remaining to the full allotment 2."
        test_recipe:
          setup:
            - "ACTIVE pass (allotment=2) with two RESERVED buddy tickets (remaining=0)."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Suspend Casc", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Casc Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-03" }
              as: ResortOps
              captures: { bt1_id: $.data.id }
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-02-04" }
              as: ResortOps
              captures: { bt2_id: $.data.id }
          trigger:
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
          assert:
            - "Pass.${pass_id}.status == SUSPENDED"
            - "BuddyTicket.${bt1_id}.status == CANCELLED"
            - "BuddyTicket.${bt2_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 2"

      - name: reactivate_suspended_does_not_restore_cancelled_buddy_tickets
        claim_type: cascade_side_effect
        grounds:
          - state_machines.Pass.SUSPENDED_to_ACTIVE
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - entities.Pass.fields.refund_basis_cents
        distinguishing_aspect: "SUSPENDED->ACTIVE leaves refund_basis_cents unchanged (5000) and does NOT restore previously cancelled buddy tickets."
        test_recipe:
          setup:
            - "ACTIVE pass (allotment=1, price=5000) with one RESERVED buddy ticket; suspend cancels it; then reactivate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, buddy_ticket_allotment: 1, buddy_ticket_price_cents: 1000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Reinstate Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Reinstate Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
              captures: { act_first: $.data.activated_on }
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-06" }
              as: ResortOps
              captures: { bt_id: $.data.id }
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
              captures: { basis: $.data.refund_basis_cents, rem: $.data.buddy_tickets_remaining }
          assert:
            - "Pass.${pass_id}.status == ACTIVE"
            - "Pass.${pass_id}.refund_basis_cents == 5000"
            - "BuddyTicket.${bt_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 1"

      - name: pass_cycle_active_suspended_active
        claim_type: invalid_transition
        grounds:
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - state_machines.Pass.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / pass_branching_active_to_suspended_refunded_expired
          rationale: "The ACTIVE->SUSPENDED->ACTIVE cycle is exercised by the named §1.8 non-linear-state-machine instance."

  # ------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: refund_used_ge_max_yields_zero_prorated
        claim_type: calculation_branch
        grounds:
          - calculations.end_of_season_refund
          - calculations.end_of_season_refund.variants.prorated_with_fee
          - entities.RefundRequest.fields.refund_amount_cents
        distinguishing_aspect: "For RELOCATION/DISSATISFIED, when scan_count_at_request >= MAX_SCANS_FOR_REFUND (used=10, MAX=10), the prorated refund is exactly 0 even though the pass is eligible to be approved."
        test_recipe:
          setup:
            - "FULL_EPIC pass price=10000, scanned exactly 10 times, PENDING RefundRequest reason=DISSATISFIED snapshot=10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 10000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Zero Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Zero Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:30:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:40:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T08:50:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T09:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T09:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "DISSATISFIED" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_ver: $.data.version }
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          assert:
            - "RefundRequest.${rr_id}.status == APPROVED"
            - "RefundRequest.${rr_id}.refund_amount_cents == 0"

      - name: refund_uses_snapshot_not_live_scan_count
        claim_type: input_set_filter
        grounds:
          - calculations.end_of_season_refund
          - entities.RefundRequest.fields.scan_count_at_request
          - entities.Pass.fields.scan_count
        distinguishing_aspect: "The refund uses scan_count_at_request snapshot (=2 at request creation), not live Pass.scan_count (later 3); INJURY flat 90% of basis ignores usage, so payout = round(8000*0.90) = 7200."
        test_recipe:
          setup:
            - "FULL_EPIC pass price=8000. Scanned twice, then a PENDING INJURY RefundRequest opened (snapshot=2), then scanned once more (live scan_count=3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-22T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Snap Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Snap Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-22T08:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_id: $.data.id, snap: $.data.scan_count_at_request }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-22T08:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { live_sc: $.data.scan_count, pass_ver: $.data.version }
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          assert:
            - "RefundRequest.${rr_id}.scan_count_at_request == 2"
            - "Pass.${pass_id}.scan_count == 3"
            - "RefundRequest.${rr_id}.refund_amount_cents == 7200"

      - name: buddy_remaining_excludes_cancelled
        claim_type: input_set_filter
        grounds:
          - calculations.buddy_tickets_remaining
          - entities.BuddyTicket.fields.status
        distinguishing_aspect: "buddy_tickets_remaining counts only RESERVED+REDEEMED; a CANCELLED ticket does not consume allotment. With allotment=3, one REDEEMED and one CANCELLED, remaining=2."
        test_recipe:
          setup:
            - "ACTIVE pass allotment=3. Reserve two tickets; redeem one; cancel the other."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 3, buddy_ticket_price_cents: 1000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Excl Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Excl Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-07" }
              as: ResortOps
              captures: { bt1_id: $.data.id }
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-02-08" }
              as: ResortOps
              captures: { bt2_id: $.data.id }
            - call: "POST /buddy-tickets/${bt1_id}/redeem"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets/${bt2_id}/cancel"
              payload: {}
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { rem: $.data.buddy_tickets_remaining }
          assert:
            - "BuddyTicket.${bt1_id}.status == REDEEMED"
            - "BuddyTicket.${bt2_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 2"

      - name: full_epic_ignores_blackout_dates
        claim_type: calculation_branch
        grounds:
          - calculations.scan_access_decision
          - entities.PassProduct.fields.blackout_dates
          - entities.PassProduct.fields.tier
        distinguishing_aspect: "A FULL_EPIC pass scans GRANTED on a date listed in its product's blackout_dates, while the blackout branch only applies to non-FULL_EPIC tiers."
        test_recipe:
          setup:
            - "Clock 2026-02-25 (a blackout date). FULL_EPIC product with blackout_dates=['2026-02-25']. ACTIVE pass at EPIC resort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-25T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 12000, blackout_dates: ["2026-02-25"], ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Blackout Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "FE Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
