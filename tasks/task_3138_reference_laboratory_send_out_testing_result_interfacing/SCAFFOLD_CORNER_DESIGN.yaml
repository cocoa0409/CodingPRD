              payload: { test_code: "LACTATE_SERUM", test_name: "Lactate, Serum", test_category: "ROUTINE", method: "PHOTOMETRY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 2, stability_hours_refrigerated: 24, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 1400, client_price_cents: 1200, floor_price_cents: 0, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 0.0, is_utilization_managed: false }
