              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /availability-sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "at creation: ReprocessJob.${j_id}.cost_estimate_usd == 5.99 and per_rung_cost_usd == [1.94, 4.05] and priority_rank == 40.60 and committed_usd == 0.00"
            - "after run: ReprocessJob.${j_id}.state == RUNNING and committed_usd == 5.99 and Title.${t_id}.encode_budget_remaining_usd == 4994.01"
            - "sweep: jobs_completed == 1 and jobs_failed == 0 and titles_taken_down == 1 and titles_published == 0"
            - "ReprocessJob.${j_id}.state == COMPLETED and abort_reason == NONE and committed_usd == 5.99"
            - "ReprocessJob.${j_id}.result_ladder_id is not null and names an EncodingLadder with state == LOCKED, codec_family == HEVC, rung_count == 2, peak_bitrate_kbps == 2500 and derived_from_ladder_id == ${l_src_id}"
            - "EncodingLadder.${l_src_id}.state == SUPERSEDED and superseded_by_ladder_id == ReprocessJob.${j_id}.result_ladder_id"
            - "DrmPackage.${p_id}.state == STALE and stale_reason == LADDER_SUPERSEDED"
            - "Title.${t_id}.packaging_state == STALE and locked_ladder_count == 1"
            - "Title.${t_id}.availability_state == TAKEN_DOWN and takedown_reason == PACKAGING_STALE"
            - "AvailabilityWindow.${w_id}.state == CLOSED"
            - "Title.${t_id}.readiness_score_certified == 70.00"
            - "Title.${t_id}.encode_budget_remaining_usd == 4994.01"

      - name: running_job_fails_when_source_ladder_superseded_mid_flight
        claim_type: compensation
        grounds:
          - state_machines.ReprocessJob.transitions
          - calculations.encode_budget_ledger
          - endpoints.POST_/availability-sweep
        distinguishing_aspect: "When the source ladder is superseded while the job is RUNNING, Phase 3 takes the FAILED arm instead of COMPLETED: abort_reason becomes ENCODE_FAILURE, committed_usd returns to 0.00 and encode_budget_remaining_usd returns to exactly 5000.00 with no result ladder minted."
        test_recipe:
          setup:
            - "One ACTIVE MOBILE_HIGH profile, one MOVIE Title with a QC_PASSED asset (duration_seconds 3600) and no DRM package."
            - "Source H264 ladder L1 LOCKED, a CODEC_DEPRECATION job targeting HEVC created and run (cost_estimate_usd 5.99, remaining 4994.01)."
            - "A second H264 ladder L2 is then validated and locked, which supersedes L1 while the job is still RUNNING."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-JOBFAIL-44", title_name: "Job Failure Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/jobfail-44.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l1_id: $.data.id }
            - call: "POST /encoding-ladders/${l1_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l1_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l1_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "HEVC", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
            - call: "POST /reprocess-jobs/${j_id}/run"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver3: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "540p", height_px: 540, bitrate_kbps: 1500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 4800 }], expected_title_version: "${t_ver3}" }
              as: EncodingEngineer
              captures: { l2_id: $.data.id }
            - call: "POST /encoding-ladders/${l2_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l2_id}/lock"
              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /availability-sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "before the sweep: EncodingLadder.${l1_id}.state == SUPERSEDED and superseded_by_ladder_id == ${l2_id}"
            - "before the sweep: Title.${t_id}.encode_budget_remaining_usd == 4994.01 and ReprocessJob.${j_id}.state == RUNNING"
            - "sweep: jobs_failed == 1 and jobs_completed == 0"
            - "ReprocessJob.${j_id}.state == FAILED and abort_reason == ENCODE_FAILURE and committed_usd == 0.00 and result_ladder_id == null"
            - "Title.${t_id}.encode_budget_remaining_usd == 5000.00"
            - "Title.${t_id}.locked_ladder_count == 1"
            - "GET /encoding-ladders with title_id == ${t_id} returns exactly 2 EncodingLadders (no result ladder was minted)"

      # ---- already covered by §1.8 -----------------------------------------
      - name: ladder_lock_cascade_reaches_all_five_hops
        claim_type: cascade_down
        grounds:
          - state_machines.EncodingLadder.transitions.VALIDATED_to_LOCKED
          - state_machines.Title.packaging_state.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / ladder_lock_supersede_chain
          rationale: "The depth-5 lock cascade (supersede -> package STALE -> packaging_state STALE -> availability TAKEN_DOWN -> window CLOSED) is the whole subject of the named §1.8 instance, hop by hop."

      - name: metric_ingest_resteers_policy_through_vendor_degradation
        claim_type: cross_entity_side_effect
        grounds:
          - state_machines.CdnVendor.transitions.ACTIVE_to_DEGRADED
          - state_machines.RoutingPolicy.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / metric_breach_resteer_chain
          rationale: "The depth-3 metric-ingest chain (window breach -> vendor DEGRADED -> policy resteer with cost recompute) is asserted hop by hop in the named §1.8 instance."

      - name: title_availability_and_packaging_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Title.availability_state
          - state_machines.Title.packaging_state
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / title_parallel_dimensions_evolve_independently
          rationale: "The named §1.8 instance walks both Title dimensions through disjoint transitions and asserts the combined state after each, which is exactly this claim."

      - name: qc_revision_cycle_terminates_at_three_attempts
        claim_type: cyclic
        grounds:
          - state_machines.MezzanineAsset.transitions
          - entities.MezzanineAsset.fields.qc_attempt_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / mezzanine_qc_revision_cycle_terminates
          rationale: "The bounded INGESTED -> QC_FAILED -> REMEDIATION_REQUESTED -> INGESTED loop and its attempt-3 termination are the named §1.8 instance's subject."

      - name: job_abort_restores_the_encode_budget
        claim_type: compensation
        grounds:
          - state_machines.ReprocessJob.transitions.RUNNING_to_ABORTED
          - calculations.encode_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / encode_budget_conserved_across_abort
          rationale: "The named §1.8 instance asserts the conserved money identity across run then abort, including committed_usd 0.00 and the restored remaining budget."

      - name: failover_conserves_global_reserved_bandwidth
        claim_type: compensation
        grounds:
          - state_machines.LiveEventReservation.transitions.ARMED_to_FAILED_OVER
          - calculations.vendor_reserved_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / bandwidth_conserved_across_failover
          rationale: "The named §1.8 instance asserts GLOBAL_HELD_GBPS before and after failover plus the per-vendor split, which is this claim."

      - name: arm_requires_packaged_drm_guard
        claim_type: guarded_transition
        grounds:
          - state_machines.LiveEventReservation.transitions.RESERVED_to_ARMED
          - validations[priority=11]
          - errors[ERR_PACKAGE_NOT_READY]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / live_arm_requires_packaged_drm
          rationale: "The named §1.8 instance drives arm with the package PENDING (409) and then with it PACKAGED (200), covering both arms of the guard."

      - name: lock_requires_passed_asset_guard
        claim_type: guarded_transition
        grounds:
          - state_machines.EncodingLadder.transitions.VALIDATED_to_LOCKED
          - validations[priority=11]
          - errors[ERR_NO_PASSED_ASSET]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ladder_lock_requires_passed_asset
          rationale: "The named §1.8 instance covers both arms of the MezzanineAsset guard on lock, including the ERR_NO_PASSED_ASSET failure path."

  # ===========================================================================
  # SECTION 3 — From Table 3 (Calculations)
  # One instance per applicable row of the guide's calculation tables
  # (correct_result / input_set_filtering / constants_applied / precision) and
  # per algorithm-type boundary row, walked across all twelve §1.3 rules.
  # Every literal below was recomputed from the §1.3 formula with
  # Decimal round_half_up before being written here.
  # ===========================================================================
  - section: calculations
    instances:

      - name: qc_severity_fail_threshold_is_inclusive_at_forty
        claim_type: threshold
        grounds:
          - calculations.mezzanine_qc_verdict
          - calculations.mezzanine_qc_verdict.constants.SEVERITY_FAIL_THRESHOLD
          - endpoints.POST_/mezzanine-assets/{id}/qc-runs
        distinguishing_aspect: "Two assets straddling the aggregate-severity gate: severity_index exactly 40.00 is a FAIL recorded as MULTI_DEFECT with no individual blocking condition tripped, while 39.94 on the same shape is a WARN with blocking_defect_code NONE — the threshold is inclusive on the FAIL side."
        test_recipe:
          setup:
            - "One Title with two MezzanineAssets whose artifact counts are identical (7, below ARTIFACT_FAIL_THRESHOLD 8) and whose loudness deviation differs by 0.01 dB, both with full caption coverage so caption_penalty is 0.00."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-SEV-40", title_name: "Severity Gate Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/sev-40.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -28.0, artifact_defect_count: 7, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_at: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/sev-3994.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -27.99, artifact_defect_count: 7, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_under: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets/${a_at}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_under}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "both qc-run calls: HTTP status == 201"
            - "QualityControlReport for ${a_at}: artifact_penalty == 28.00 and loudness_deviation_db == 4.00 and caption_coverage_pct == 100.00"
            - "QualityControlReport for ${a_at}: severity_index == 40.00 and verdict == FAIL and blocking_defect_code == MULTI_DEFECT"
            - "MezzanineAsset.${a_at}.qc_state == QC_FAILED and MezzanineAsset.${a_at}.latest_severity_index == 40.00"
            - "QualityControlReport for ${a_under}: loudness_deviation_db == 3.99 and severity_index == 39.94"
            - "QualityControlReport for ${a_under}: verdict == WARN and blocking_defect_code == NONE"
            - "MezzanineAsset.${a_under}.qc_state == QC_PASSED"

      - name: qc_loudness_tolerance_band_absorbs_two_decibels
        claim_type: constants_applied
        grounds:
          - calculations.mezzanine_qc_verdict.constants.LOUDNESS_TOLERANCE_DB
          - calculations.mezzanine_qc_verdict.constants.W_LOUDNESS
          - entities.QualityControlReport.fields.severity_index
        distinguishing_aspect: "LOUDNESS_TOLERANCE_DB is subtracted before the W_LOUDNESS multiplier and clamped at zero: a deviation of exactly 2.00 dB yields loudness_penalty 0.00 and a PASS with severity_index 0.00, while 2.01 dB yields 0.06 and a WARN — the penalty is on the excess, not on the whole deviation."
        test_recipe:
          setup:
            - "One Title with two defect-free, fully captioned MezzanineAssets whose peak_audio_lufs sit exactly at and one hundredth beyond the tolerance band around LOUDNESS_TARGET_LUFS -24.0."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-TOL", title_name: "Tolerance Band Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/tol-at.mxf", duration_seconds: 3600, frame_rate: 25.0, peak_audio_lufs: -26.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_at: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/tol-over.mxf", duration_seconds: 3600, frame_rate: 25.0, peak_audio_lufs: -26.01, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_over: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets/${a_at}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_over}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "QualityControlReport for ${a_at}: loudness_deviation_db == 2.00 and severity_index == 0.00 and artifact_penalty == 0.00"
            - "QualityControlReport for ${a_at}: verdict == PASS and blocking_defect_code == NONE and attempt_number == 1"
            - "MezzanineAsset.${a_at}.qc_state == QC_PASSED"
            - "QualityControlReport for ${a_over}: loudness_deviation_db == 2.01 and severity_index == 0.06"
            - "QualityControlReport for ${a_over}: verdict == WARN and blocking_defect_code == NONE"
            - "MezzanineAsset.${a_over}.qc_state == QC_PASSED"

      - name: qc_loudness_fail_boundary_is_exclusive_at_six_decibels
        claim_type: threshold
        grounds:
          - calculations.mezzanine_qc_verdict.constants.LOUDNESS_FAIL_DB
          - entities.MezzanineAsset.fields.blocking_defect_code
        distinguishing_aspect: "LOUDNESS_FAIL_DB is strictly exclusive: a 6.00 dB deviation is not a blocking condition (WARN, severity 24.00, code NONE) while 6.01 dB is (FAIL, severity 24.06, code LOUDNESS_OUT_OF_SPEC) — and neither crosses the 40.00 aggregate gate, so only the per-condition rule can explain the difference."
        test_recipe:
          setup:
            - "One Title with two defect-free, fully captioned MezzanineAssets at -30.0 and -30.01 LUFS."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-LOUD", title_name: "Loudness Gate Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/loud-at.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -30.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_at: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/loud-over.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -30.01, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_over: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets/${a_at}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_over}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "QualityControlReport for ${a_at}: loudness_deviation_db == 6.00 and severity_index == 24.00"
            - "QualityControlReport for ${a_at}: verdict == WARN and blocking_defect_code == NONE"
            - "MezzanineAsset.${a_at}.qc_state == QC_PASSED"
            - "QualityControlReport for ${a_over}: loudness_deviation_db == 6.01 and severity_index == 24.06"
            - "QualityControlReport for ${a_over}: verdict == FAIL and blocking_defect_code == LOUDNESS_OUT_OF_SPEC"
            - "MezzanineAsset.${a_over}.qc_state == QC_FAILED and MezzanineAsset.${a_over}.qc_attempt_count == 1"

      - name: qc_blocking_set_size_decides_single_code_versus_multi_defect
        claim_type: correct_result
        grounds:
          - calculations.mezzanine_qc_verdict
          - calculations.mezzanine_qc_verdict.constants.W_CAPTION
          - calculations.mezzanine_qc_verdict.constants.ARTIFACT_FAIL_THRESHOLD
        distinguishing_aspect: "The blocking set is reported by cardinality, not by severity: a caption-only failure reports CAPTION_MISSING at severity 30.00, an artifact-only failure reports ARTIFACT_BURST at 32.00, and the asset carrying both reports MULTI_DEFECT at 62.00 — a single blocking condition is never collapsed into MULTI_DEFECT even above the 40.00 gate."
        test_recipe:
          setup:
            - "One Title with three MezzanineAssets: caption-only defect (caption_languages omitted so the [] default applies), artifact-only defect at exactly ARTIFACT_FAIL_THRESHOLD, and both defects together."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-MULTI", title_name: "Blocking Set Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/cap-only.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, audio_language: "en" }
              as: ContentOps
              captures: { a_cap: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/art-only.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 8, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_art: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/both.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 8, audio_language: "en" }
              as: ContentOps
              captures: { a_both: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets/${a_cap}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_art}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_both}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "QualityControlReport for ${a_cap}: caption_coverage_pct == 0.00 and severity_index == 30.00 and verdict == FAIL and blocking_defect_code == CAPTION_MISSING"
            - "QualityControlReport for ${a_art}: artifact_penalty == 32.00 and caption_coverage_pct == 100.00 and severity_index == 32.00 and blocking_defect_code == ARTIFACT_BURST"
            - "QualityControlReport for ${a_both}: artifact_penalty == 32.00 and severity_index == 62.00 and blocking_defect_code == MULTI_DEFECT"
            - "all three reports: verdict == FAIL"
            - "MezzanineAsset.${a_cap}.qc_state == QC_FAILED and MezzanineAsset.${a_art}.qc_state == QC_FAILED and MezzanineAsset.${a_both}.qc_state == QC_FAILED"

      - name: qc_loudness_deviation_rounds_half_up_before_the_tolerance_subtraction
        claim_type: precision
        grounds:
          - calculations.mezzanine_qc_verdict.precision
          - entities.QualityControlReport.fields.loudness_deviation_db
        distinguishing_aspect: "A -21.235 LUFS master gives an exact deviation of 2.765 dB, which round_half_up to two decimals makes 2.77 and therefore severity_index 4.62; truncating or rounding half-down would report 2.76 and 4.56, and rounding only at the end would report 4.59."
        test_recipe:
          setup:
            - "One Title with a defect-free, fully captioned MezzanineAsset whose peak_audio_lufs carries a third decimal digit (legal: §1.1 constrains peak_audio_lufs to the range -60.0 .. 0.0 with no declared scale)."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-PREC", title_name: "Rounding Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/prec.mxf", duration_seconds: 3600, frame_rate: 29.97, peak_audio_lufs: -21.235, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "HTTP status == 201"
            - "QualityControlReport.loudness_deviation_db == 2.77"
            - "QualityControlReport.severity_index == 4.62"
            - "QualityControlReport.verdict == WARN and blocking_defect_code == NONE"
            - "MezzanineAsset.${a_id}.latest_severity_index == 4.62 and MezzanineAsset.${a_id}.qc_state == QC_PASSED"

      - name: playback_breach_threshold_is_strict_at_seventy
        claim_type: threshold
        grounds:
          - calculations.playback_quality_index
          - calculations.playback_quality_index.constants.BREACH_THRESHOLD
          - endpoints.POST_/playback-metrics
        distinguishing_aspect: "quality_index exactly 70.00 sets breach_flag false and 69.99 sets it true, and the only difference between the two ingested windows is a single millisecond of startup latency (2000 ms versus 2001 ms) — the comparison is strict, not >=."
        test_recipe:
