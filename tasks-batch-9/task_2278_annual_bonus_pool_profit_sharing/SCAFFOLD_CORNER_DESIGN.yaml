            - "GET /participant-awards?plan_id=${plan_b} returns total_count == 0"

      - name: certification_gates_are_checked_in_cascade_order
        claim_type: Priority Ordering
        grounds:
          - validations.priority_104
          - validations.priority_105
          - validations.priority_106
          - errors.ERR_METRIC_WEIGHTS_INVALID
          - errors.ERR_METRICS_NOT_ALL_ACTUALIZED
          - errors.ERR_SCORECARDS_NOT_ALL_CERTIFIED
          - "state_machines.BonusPlan: TARGETS_SET -> PENDING_CERTIFICATION"
        distinguishing_aspect: |
          One endpoint, four verdicts, in strictly increasing priority order as
          each defect is repaired: weights 60.00 alone -> 104; weights complete but
          no actuals -> 105; actuals filed but the scorecard is still DRAFT -> 106;
          scorecard certified -> 200. At the 105 step the plan violates 106 as well,
          so returning ERR_SCORECARDS_NOT_ALL_CERTIFIED there would be wrong; the
          cascade proves the checks are evaluated in ladder order and not
          short-circuited by the cheapest available failure.
        test_recipe:
          setup:
            - "One unit, one plan with a single L5 target row, one pool, one L5 participant, targets assigned (plan TARGETS_SET), and exactly one metric at weight 60.00 with no actual."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-H4", name: "Unit H4" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Certification Gates Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 60.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_rev: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E831", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p_ada: "$.data.id" }
            - call: "POST /bonus-plans/${plan_id}/target-assignments"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "EBITDA", weight_pct: 40.00, threshold_value: 90, target_value: 100, max_value: 130 }
              as: PlanAdmin
              captures: { m_ebit: "$.data.id" }
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
            - call: "POST /company-metrics/${m_rev}/actual"
              payload: { actual_value: 1000, source_note: "audited revenue" }
              as: PlanAdmin
            - call: "POST /company-metrics/${m_ebit}/actual"
              payload: { actual_value: 100, source_note: "audited ebitda" }
              as: PlanAdmin
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
            - call: "POST /bu-pools/${pool_id}/submit-scorecard"
