# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Vocational Rehabilitation (State VR) — Expert
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: case_creation_returns_referred
        claim_type: creation
        grounds:
          - "entities.Case.fields.status"
          - "endpoints./vr/cases"
        distinguishing_aspect: "POST /vr/cases with all required fields returns 201, status REFERRED, server-minted id, version 1, priority_category_id null."
        test_recipe:
          setup: ["A counselor exists."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
          trigger:
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.status == REFERRED"
            - "Case.${case_id}.version == 1"
            - "Case.${case_id}.priority_category_id == null"

      - name: case_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints./vr/cases/{case_id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but non-existent case id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vr/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: case_create_missing_required_field_validation
        claim_type: required_field
        grounds:
          - "entities.Case.fields.consumer_full_name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required consumer_full_name returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A counselor exists."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
          trigger:
            - call: "POST /vr/cases"
              payload: { consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: case_create_invalid_enum_disability_type_validation
        claim_type: type_constraint
        grounds:
          - "entities.Case.fields.disability_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "disability_type outside {PHYSICAL,COGNITIVE,PSYCHIATRIC,SENSORY} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A counselor exists."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
          trigger:
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "BOGUS", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: provider_status_defaults_active
        claim_type: defaults
        grounds:
          - "entities.Provider.fields.status"
          - "endpoints./vr/providers"
        distinguishing_aspect: "Omitting status on provider onboarding yields status ACTIVE and zeroed ledger fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
          assert:
            - "Provider.${provider_id}.status == ACTIVE"
            - "Provider.${provider_id}.pending_disbursement_cents == 0"
            - "Provider.${provider_id}.ledger_paid_cents == 0"

      - name: list_cases_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints./vr/cases"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /vr/cases returns response_type array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two referred cases owned by the same counselor."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Bo Ray", consumer_dob: "1991-01-01", disability_type: "SENSORY", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "GET /vr/cases"
              payload: { limit: 1, offset: 0 }
              as: VRAdmin
          assert:
            - "response_type == array"
            - "response total_count == 2 AND has_more == true AND len(data) == 1"

      - name: authorization_comparable_benefit_defaults_zero
        claim_type: defaults
        grounds:
          - "entities.ServiceAuthorization.fields.comparable_benefit_cents"
          - "calculations.service_cost_share"
        distinguishing_aspect: "Omitting comparable_benefit_cents defaults it to 0; with income tier 0, agency_share == authorized (100000), consumer_share == 0."
        test_recipe:
          setup: ["Case at PLAN_DEVELOPMENT (income 150000 tier 0), a DRAFT IPE and an ACTIVE provider exist."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
          trigger:
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 100000, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
          assert:
            - "ServiceAuthorization.${auth_id}.comparable_benefit_cents == 0"
            - "ServiceAuthorization.${auth_id}.agency_share_cents == 100000"
            - "ServiceAuthorization.${auth_id}.consumer_share_cents == 0"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ipe_submit_twice_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.IPE.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an already-SUBMITTED IPE returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["Case PLAN_DEVELOPMENT with a SUBMITTED IPE."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "IPE.${ipe_id}.status == SUBMITTED"

      - name: application_on_terminal_ineligible_invalid_state
        claim_type: terminal_state
        grounds:
          - "state_machines.Case.APPLICATION_to_INELIGIBLE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A case in terminal INELIGIBLE rejects further transitions (application) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case determined INELIGIBLE."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "INELIGIBLE", disability_significance: "NSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Case.${case_id}.status == INELIGIBLE"

      - name: ipe_return_submitted_to_draft
        claim_type: valid_transition
        grounds:
          - "state_machines.IPE.SUBMITTED_to_DRAFT"
        distinguishing_aspect: "A Supervisor returns a SUBMITTED IPE to DRAFT for revision."
        test_recipe:
          setup: ["Case PLAN_DEVELOPMENT with a SUBMITTED IPE; a supervisor exists."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/ipes/${ipe_id}/return"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
          assert:
            - "IPE.${ipe_id}.status == DRAFT"
            - "Case.${case_id}.status == PLAN_DEVELOPMENT"

      - name: provider_completes_own_authorization
        claim_type: valid_transition
        grounds:
          - "state_machines.ServiceAuthorization.APPROVED_to_COMPLETED"
        distinguishing_aspect: "The owning Provider reports delivery on its APPROVED authorization -> COMPLETED."
        test_recipe:
          setup: ["Case SERVICES_ACTIVE with an APPROVED authorization on provider P."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 100000, comparable_benefit_cents: 0, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
          trigger:
            - call: "POST /vr/authorizations/${auth_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          assert:
            - "ServiceAuthorization.${auth_id}.status == COMPLETED"

      - name: payment_void_issued_compensating_reversal
        claim_type: compensation
        grounds:
          - "state_machines.Payment.ISSUED_to_VOIDED"
          - "calculations.case_fund_ledger"
          - "entities.Provider.fields.ledger_paid_cents"
        distinguishing_aspect: "Voiding an ISSUED payment (100000) reverses the ledger: funds move paid->committed and Provider.ledger_paid returns to 0."
        test_recipe:
          setup: ["Case SERVICES_ACTIVE, authorization agency 100000 APPROVED, one payment 100000 ISSUED (paid 100000, committed 0)."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 100000, comparable_benefit_cents: 0, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/payments"
              payload: { authorization_id: "${auth_id}", amount_cents: 100000 }
              as: FiscalOfficer
              captures: { pay_id: $.data.id }
            - call: "POST /vr/payments/${pay_id}/issue"
              payload: {}
              as: FiscalOfficer
          trigger:
            - call: "POST /vr/payments/${pay_id}/void"
              payload: {}
              as: FiscalOfficer
          assert:
            - "Payment.${pay_id}.status == VOIDED"
            - "Case.${case_id}.funds_paid_cents == 0"
            - "Case.${case_id}.funds_committed_cents == 100000"
            - "Provider.${provider_id}.ledger_paid_cents == 0"

      - name: eligibility_closed_category_waitlists_case
        claim_type: valid_transition
        grounds:
          - "state_machines.Case.APPLICATION_to_WAITLISTED"
          - "entities.Case.fields.waitlisted_at"
        distinguishing_aspect: "Eligible case whose priority category is CLOSED goes to WAITLISTED with waitlisted_at set and no slot reserved."
        test_recipe:
          setup: ["MSD category created then CLOSED; a case at APPLICATION."]
          setup_api_calls:
            - call: "POST /vr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: VRAdmin
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5, status: "CLOSED" }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
          trigger:
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "Case.${case_id}.status == WAITLISTED"
            - "Case.${case_id}.priority_category_id == ${cat1_id}"
            - "Case.${case_id}.waitlisted_at == 2026-05-02T00:00:00.000Z"
            - "PriorityCategory.${cat1_id}.slots_used == 0"

      - name: promote_next_promotes_waitlisted_case
        claim_type: valid_transition
        grounds:
          - "state_machines.Case.WAITLISTED_to_PLAN_DEVELOPMENT"
          - "calculations.promote_next_selector"
        distinguishing_aspect: "After a slot frees, promote-next moves the sole WAITLISTED case in the category to PLAN_DEVELOPMENT and reserves the slot."
        test_recipe:
