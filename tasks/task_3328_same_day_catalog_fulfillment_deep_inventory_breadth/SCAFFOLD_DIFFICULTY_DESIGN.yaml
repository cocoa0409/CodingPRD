              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_non_lt_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_lt_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_lt_id}", dc_id: "${dal_dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /stock"
