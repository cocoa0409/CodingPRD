  - rule_id: boundary_precision_check
    instances:
      - name: credit_available_exact_boundary
        grounds:
          - validations[priority=16]
          - entities.CreditAccount.fields.available_cents
        distinguishing_aspect: |
          The credit gate uses >= : an ONLINE retailer whose available credit
          exactly equals the order subtotal (150000 == 150000) is ACCEPTED; one
          cent less of headroom (subtotal 150001) is rejected with
          ERR_CREDIT_LIMIT_EXCEEDED. Metric: available_cents; endpoint: POST
          /orders.
        test_recipe:
          setup:
            - "a VERIFIED ONLINE retailer with a fresh credit account (provisional limit 150000, available 150000)"
            - "an ACTIVE brand (case pack 1, min order 1000, lead time 0)"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Edge Retail", store_type: "ONLINE", address: "11 Limit Ln", lat: 50.0, lng: -115.0, storefront_proof_url: "https://proof/11", resale_certificate_no: "RC-11" }
              as: Anonymous
