          setup:
            - "Chain P: CA (T4) / TX (T2), ACTIVE RatePlan, applicant 'Northgate Retail Group' (primary CA), policy ACTIVE / OPEN for [2026-08-01, 2027-08-01) with aggregate_limit_cents 200000000 and per_claim_retention_cents 5000000."
