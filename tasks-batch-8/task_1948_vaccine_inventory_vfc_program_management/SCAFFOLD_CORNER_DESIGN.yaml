  # Section: calculations — input filtering, constants, precision
  # ===========================================================================
  - section: calculations
    instances:
      - name: eligibility_medicaid_under_19_is_vfc_eligible
        claim_type: correct_result
        grounds:
          - calculations.vfc_eligibility_determination
          - entities.EligibilityScreening.fields.outcome
        distinguishing_aspect: "Patient MEDICAID, DOB 2020-01-15, screening 2026-08-05 -> age 6 -> vfc_eligible=true, outcome=VFC_ELIGIBLE."
        test_recipe:
          setup: ["Site S; patient pat MEDICAID DOB 2020-01-15"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-C-001" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/patients"
              payload: { full_name: "Pat", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { vel: $.data.vfc_eligible, oc: $.data.outcome }
          assert:
            - "${vel} == true"
            - "${oc} == VFC_ELIGIBLE"

      - name: eligibility_commercial_insurance_is_private_only
        claim_type: correct_result
        grounds:
          - calculations.vfc_eligibility_determination
        distinguishing_aspect: "Patient COMMERCIAL insurance -> vfc_eligible=false, outcome=PRIVATE_ONLY (regardless of age)."
        test_recipe:
          setup: ["Site S; patient pat COMMERCIAL"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-C-002" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/patients"
              payload: { full_name: "Pat", date_of_birth: "2020-01-15", insurance_category: "COMMERCIAL" }
              as: VaccineManager
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "COMMERCIAL" }
              as: VaccineManager
              captures: { vel: $.data.vfc_eligible, oc: $.data.outcome }
          assert:
            - "${vel} == false"
            - "${oc} == PRIVATE_ONLY"

      - name: eligibility_age_19_boundary_is_private_only
        claim_type: correct_result
        grounds:
          - calculations.vfc_eligibility_determination
        distinguishing_aspect: "Patient DOB 2007-08-05, screening on 2026-08-05 (19th birthday) -> age = 19 -> NOT < 19 -> vfc_eligible=false. Tests the strict '<' boundary."
        test_recipe:
          setup: ["Site S; patient pat DOB 2007-08-05 MEDICAID"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-C-003" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/patients"
              payload: { full_name: "Pat19", date_of_birth: "2007-08-05", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { vel: $.data.vfc_eligible, oc: $.data.outcome }
          assert:
            - "${vel} == false"
            - "${oc} == PRIVATE_ONLY"

      - name: eligibility_underinsurer_category_included
        claim_type: constants_applied
        grounds:
          - calculations.vfc_eligibility_determination
        distinguishing_aspect: "UNDERINSURED and AMERICAN_INDIAN_ALASKA_NATIVE are both in the categorical-ok set; verify both yield VFC_ELIGIBLE."
        test_recipe:
          setup: ["Site S; two patients pat_u UNDERINSURED, pat_a AMERICAN_INDIAN_ALASKA_NATIVE"]
