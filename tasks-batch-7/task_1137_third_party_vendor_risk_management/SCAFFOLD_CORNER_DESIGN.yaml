scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: vendor_creation_success_returns_201_and_persisted_fields
        claim_type: creation
        grounds:
          - entities.Vendor
        distinguishing_aspect: "POST with all required fields returns 201 with the full Vendor payload, including system defaults: status=ONBOARDING, criticality_tier=TIER_3_STANDARD, tier_posture=CLEAN, composite_risk_score=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors"
              payload: { legal_name: "NewVendor", headquarters_region: "APAC", service_category: "LEGAL" }
              as: VendorRelationshipManager
              captures: { v_new: $.data.id }
          assert:
            - "Vendor.${v_new}.status == ONBOARDING"
            - "Vendor.${v_new}.criticality_tier == TIER_3_STANDARD"
            - "Vendor.${v_new}.tier_posture == CLEAN"
            - "Vendor.${v_new}.composite_risk_score == 0"
            - "Vendor.${v_new}.version == 1"

      - name: vendor_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Vendor
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "GET with a UUID that does not exist returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB; clock set."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tprm/vendors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RiskOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: vendor_listing_pagination_fields_present
        claim_type: listing
        grounds:
          - entities.Vendor
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /vendors returns an envelope whose data is an array AND meta carries the four pagination fields (limit, offset, total_count, has_more); default limit is 10."
        test_recipe:
          setup: ["Three vendors created."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "V1", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
            - call: "POST /tprm/vendors"
              payload: { legal_name: "V2", headquarters_region: "EMEA", service_category: "BPO" }
              as: VendorRelationshipManager
            - call: "POST /tprm/vendors"
              payload: { legal_name: "V3", headquarters_region: "APAC", service_category: "BPO" }
              as: VendorRelationshipManager
          trigger:
            - call: "GET /tprm/vendors"
              payload: {}
              as: RiskOfficer
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response contains limit == 10, offset == 0, total_count == 3, has_more == false"
            - "len(data) == 3"

      - name: vendor_required_field_missing_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Vendor.fields.legal_name
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /vendors missing legal_name returns ERR_INVALID_REQUEST with http 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors"
              payload: { headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: vendor_invalid_enum_headquarters_region
        claim_type: type_constraints
        grounds:
          - entities.Vendor.fields.headquarters_region
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "headquarters_region outside {NA, EMEA, APAC, LATAM} is rejected."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors"
              payload: { legal_name: "BadEnum", headquarters_region: "ANTARCTICA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: risk_tier_change_log_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.RiskTierChangeLog
        distinguishing_aspect: "RiskTierChangeLog is common_fields:false; rows returned by GET /vendors/{id}/tier-change-log have id and created_at but NO version or updated_at field (append-only audit log). Immutability is enforced by §1.5 declaring no PUT/PATCH/DELETE endpoint targeting RiskTierChangeLog."
        test_recipe:
          setup: ["Vendor exists; a tier-change has been executed so a RiskTierChangeLog row exists."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "ImmutV", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_immu: $.data.id }
            - call: "GET /tprm/vendors/${v_immu}"
              payload: {}
              as: RiskOfficer
              captures: { v_immu_v: $.data.version }
            - call: "POST /tprm/vendors/${v_immu}/tier-change"
              payload: { to_tier: "TIER_2_HIGH", reason: "bump", expected_vendor_version: "${v_immu_v}" }
              as: RiskOfficer
          trigger:
            - call: "GET /tprm/vendors/${v_immu}/tier-change-log"
              payload: {}
              as: RiskOfficer
          assert:
            - "len(data) == 1"
            - "data[0].from_tier == TIER_3_STANDARD"
            - "data[0].to_tier == TIER_2_HIGH"
            - "data[0] has 'id' and 'created_at' fields"
            - "data[0] does NOT have 'version' or 'updated_at' fields  # common_fields:false"

      - name: vendor_engagement_parent_relationship_required
        claim_type: parent_relationships
        grounds:
          - entities.VendorEngagement.fields.vendor_id
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "POST /vendors/{vendorId}/engagements with non-existent vendorId returns 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors/00000000-0000-0000-0000-000000000000/engagements"
              payload: { engagement_code: "ORPHAN", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: vendor_computed_fields_ignore_input
        claim_type: computed_fields
        grounds:
          - entities.Vendor.fields.composite_risk_score
          - entities.Vendor.fields.tier_posture
        distinguishing_aspect: "Client submitting composite_risk_score or tier_posture on POST /vendors has those fields ignored — server recomputes from scratch."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors"
              payload: { legal_name: "CompIgnore", headquarters_region: "NA", service_category: "BPO", composite_risk_score: 99, tier_posture: "BREACH" }
              as: VendorRelationshipManager
              captures: { v_cig: $.data.id }
          assert:
            - "Vendor.${v_cig}.composite_risk_score == 0"
            - "Vendor.${v_cig}.tier_posture == CLEAN"

      - name: vendor_system_fields_ignore_input
        claim_type: system_fields
        grounds:
          - entities.Vendor
        distinguishing_aspect: "Client submitting id, created_at, updated_at, or version on POST /vendors has those fields ignored — server mints its own."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tprm/vendors"
              payload: { legal_name: "SysIgnore", headquarters_region: "NA", service_category: "BPO", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: VendorRelationshipManager
              captures: { v_sig: $.data.id }
          assert:
            - "Vendor.${v_sig}.id != '11111111-1111-1111-1111-111111111111'"
            - "Vendor.${v_sig}.version == 1"

      - name: soft_deleted_vendor_excluded_from_list_by_default
        claim_type: defaults
        grounds:
          - entities.Vendor.fields.archived_at
        distinguishing_aspect: "Archived (EXITED) vendors are excluded from GET /vendors default listing; include_archived=true brings them back."
        test_recipe:
          setup: ["Vendor A exited; Vendor B still active."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "A-Exited", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_a: $.data.id }
            - call: "POST /tprm/vendors/${v_a}/engagements"
              payload: { engagement_code: "A-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_a: $.data.id }
            - call: "POST /tprm/engagements/${e_a}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fa", security_reviewer_id: "u_sa", compliance_reviewer_id: "u_ca" }
              as: VendorRelationshipManager
              captures: { p_a: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_a}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_a}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_a}"
              payload: {}
              as: RiskOfficer
              captures: { e_a_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_a}/approve"
              payload: { expected_engagement_version: "${e_a_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_a}/contracts"
              payload: { contract_reference: "A-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_a: $.data.id }
            - call: "GET /tprm/engagements/${e_a}"
              payload: {}
              as: RiskOfficer
              captures: { e_a_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_a}/execute"
              payload: { expected_engagement_version: "${e_a_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_a}/activate"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_a}/initiate-exit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/engagements/${e_a}/finalize-exit"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_a}/exit"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/vendors"
              payload: { legal_name: "B-Active", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_b: $.data.id }
          trigger:
            - call: "GET /tprm/vendors"
              payload: {}
              as: RiskOfficer
          assert:
            - "GET /vendors returns Vendor.${v_b} but not Vendor.${v_a}"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: vendor_activate_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Vendor.transitions
        distinguishing_aspect: "ONBOARDING -> ACTIVE via POST /vendors/{id}/activate succeeds when at least one engagement is ACTIVE and no SEV_1 open. Monitoring cycle 1 is scheduled with due_at = activation + 365 days (TIER_3 default)."
        test_recipe:
          setup: ["Vendor with one ACTIVE engagement."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "ActVendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_act: $.data.id }
            - call: "POST /tprm/vendors/${v_act}/engagements"
              payload: { engagement_code: "ACT-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_act: $.data.id }
            - call: "POST /tprm/engagements/${e_act}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fb", security_reviewer_id: "u_sb", compliance_reviewer_id: "u_cb" }
              as: VendorRelationshipManager
              captures: { p_act: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_act}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_act}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_act}"
              payload: {}
              as: RiskOfficer
              captures: { e_act_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_act}/approve"
              payload: { expected_engagement_version: "${e_act_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_act}/contracts"
              payload: { contract_reference: "ACT-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_act: $.data.id }
            - call: "GET /tprm/engagements/${e_act}"
              payload: {}
              as: RiskOfficer
              captures: { e_act_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_act}/execute"
              payload: { expected_engagement_version: "${e_act_v2}" }
              as: RiskOfficer
          trigger:
            - call: "POST /tprm/vendors/${v_act}/activate"
              payload: {}
              as: RiskOfficer
          assert:
            - "Vendor.${v_act}.status == ACTIVE"
            - "Vendor.${v_act}.next_monitoring_due_at == '2027-05-01T00:00:00Z'  # 2026-05-01 + 365 days (TIER_3 cadence)"

      - name: vendor_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Vendor.transitions
          - errors.ERR_VENDOR_NOT_ACTIVE
        distinguishing_aspect: "EXITED is terminal; no further transitions permitted. Attempt to suspend an EXITED vendor fails with ERR_VENDOR_NOT_ACTIVE."
        test_recipe:
          setup: ["Vendor in EXITED status."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "TermV", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_tv: $.data.id }
            - call: "POST /tprm/vendors/${v_tv}/engagements"
              payload: { engagement_code: "TV-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_tv: $.data.id }
            - call: "POST /tprm/engagements/${e_tv}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fc", security_reviewer_id: "u_sc", compliance_reviewer_id: "u_cc" }
              as: VendorRelationshipManager
              captures: { p_tv: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_tv}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_tv}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_tv}"
              payload: {}
              as: RiskOfficer
              captures: { e_tv_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_tv}/approve"
              payload: { expected_engagement_version: "${e_tv_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_tv}/contracts"
              payload: { contract_reference: "TV-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_tv: $.data.id }
            - call: "GET /tprm/engagements/${e_tv}"
              payload: {}
              as: RiskOfficer
              captures: { e_tv_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_tv}/execute"
              payload: { expected_engagement_version: "${e_tv_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_tv}/activate"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_tv}/initiate-exit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/engagements/${e_tv}/finalize-exit"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_tv}/exit"
              payload: {}
              as: RiskOfficer
          trigger:
            - call: "POST /tprm/vendors/${v_tv}/suspend"
              payload: {}
              as: RiskOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VENDOR_NOT_ACTIVE"

      - name: dd_approve_by_submitter_rejected_sod
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DueDiligencePackage.transitions
          - errors.ERR_SOD_DD_SELF_APPROVE
        distinguishing_aspect: "RiskOfficer whose X-User-ID equals package.submitted_by_user_id gets ERR_SOD_DD_SELF_APPROVE on approve. Package must be in UNDER_REVIEW so the state check passes and the SoD check fires."
        test_recipe:
          setup: ["Package UNDER_REVIEW; submitted_by = u_vrm_submitter_1."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "SoD1", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_sod1: $.data.id }
            - call: "POST /tprm/vendors/${v_sod1}/engagements"
              payload: { engagement_code: "SOD1-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_sod1: $.data.id }
            - call: "POST /tprm/engagements/${e_sod1}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fd", security_reviewer_id: "u_sd", compliance_reviewer_id: "u_cd" }
              as: VendorRelationshipManager
              captures: { p_sod1: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_sod1}/submit"
              payload: {}
              as: VendorRelationshipManager
              as_user_id: "u_vrm_submitter_1"
              captures: { submitter_id: $.data.submitted_by_user_id }
            - call: "POST /tprm/due-diligence-packages/${p_sod1}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_sod1}"
              payload: {}
              as: RiskOfficer
              captures: { e_sod1_v: $.data.version }
          trigger:
            - call: "POST /tprm/due-diligence-packages/${p_sod1}/approve"
              payload: { expected_engagement_version: "${e_sod1_v}" }
              as: RiskOfficer
              as_user_id: "${submitter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_DD_SELF_APPROVE"

      - name: plan_approve_by_plan_owner_rejected_sod
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RemediationPlan.transitions
          - errors.ERR_SOD_PLAN_SELF_APPROVE
        distinguishing_aspect: "Plan SUBMITTED; approver's X-User-ID equals plan.owner_user_id → ERR_SOD_PLAN_SELF_APPROVE."
        test_recipe:
          setup: ["Incident TRIAGED; plan created and submitted by u_risk_owner_sod2."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "SoD2", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_sod2: $.data.id }
            - call: "POST /tprm/vendors/${v_sod2}/engagements"
              payload: { engagement_code: "SOD2-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_sod2: $.data.id }
