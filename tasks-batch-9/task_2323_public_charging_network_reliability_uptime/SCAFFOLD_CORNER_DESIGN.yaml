  # ===========================================================================
  # SECTION 4 — Validations (§1.4), 28 prioritised rules
  # ===========================================================================
  - section: validations
    instances:

      - name: commissioning_gates_surface_one_at_a_time_in_their_declared_order
        claim_type: cascading_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_POWER_UPGRADE_NOT_ENERGIZED]
          - errors[ERR_PORT_COUNT_BELOW_DECLARED]
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
          - endpoints[POST /stations/{station_id}/commission]
        distinguishing_aspect: "The station violates three of the five commissioning gates at once, and each fix must reveal exactly the next one in declared order: power upgrade (gate 2) -> declared port count (gate 4) -> site capacity (gate 5) -> success. An implementation that checks the gates in any other order, or reports the first cheap check it happens to evaluate, produces a different error on the very first call."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1: agreement_status EXECUTED (gate 1 satisfied), power_upgrade_status REQUESTED (gate 2 violated), parking_enforcement_mode TOWING_ENFORCED (gate 3 satisfied), committed_service_capacity_kw 100.00."
            - "Station ST-1: DCFC_150, declared_port_count 2, one CERTIFIED fully interoperable port DS-1 at 150.00 kW so payment_interop_score is 100.00 and gate 4 and gate 5 are both violated."
            - "Station moved DRAFT -> COMMISSIONING."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 100.00, agreement_status: "EXECUTED", power_upgrade_status: "REQUESTED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 2 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
          trigger:
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err1: $.data.error_id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { power_upgrade_status: "ENERGIZED" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err2: $.data.error_id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p2_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err3: $.data.error_id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
          assert:
            - "call 1: HTTP status == 422 and data.error_id == \"ERR_POWER_UPGRADE_NOT_ENERGIZED\" (gate 2, even though gates 4 and 5 are also violated)"
            - "call 3: HTTP status == 422 and data.error_id == \"ERR_PORT_COUNT_BELOW_DECLARED\" (gate 4: commissioned_port_count 1 < declared_port_count 2)"
            - "call 6: HTTP status == 422 and data.error_id == \"ERR_SITE_CAPACITY_EXCEEDED\" (gate 5: installed_power_kw 300.00 > committed_service_capacity_kw 100.00)"
            - "call 8: HTTP status == 200 and Station.${st_id}.status == OPERATIONAL and commissioned_at == \"2026-08-01T00:00:00Z\""
            - "Station.${st_id}.status is COMMISSIONING before every rejection and after each of them — no partial commissioning"
            - "Station.${st_id}.payment_interop_score == 100.00 throughout, so ERR_INTEROP_SCORE_BELOW_THRESHOLD (priority 19) never masks a gate"

      - name: commissioning_requires_parking_enforcement_to_be_configured
        claim_type: conditional_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_PARKING_ENFORCEMENT_REQUIRED]
          - entities.HostSite.fields.parking_enforcement_mode
        distinguishing_aspect: "parking_enforcement_mode defaults to NONE, so a host site that was never configured for enforcement blocks commissioning with ERR_PARKING_ENFORCEMENT_REQUIRED while satisfying every other gate. Switching it to the weakest non-NONE value SIGNAGE_ONLY is enough — the gate tests inequality against NONE, not a minimum strength."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1: EXECUTED, ENERGIZED, capacity 400.00, parking_enforcement_mode left at its NONE default."
            - "Station ST-1: DCFC_150, declared_port_count 1, one CERTIFIED fully interoperable 150.00 kW port, moved to COMMISSIONING."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
          trigger:
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { parking_enforcement_mode: "SIGNAGE_ONLY" }
              as: HostSiteManager
              as_user_id: "${site_id}"
