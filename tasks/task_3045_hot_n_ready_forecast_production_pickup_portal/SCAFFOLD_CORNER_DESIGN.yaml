              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600, promo_price_cents: 500, customization_allowed: true }
              as: StoreManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-c5"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
                  - { product_id: "${p_id}", quantity: 1, customized: true }
              as: Customer
              as_user_id: "cust-c5"
              captures: { ord_id: $.data.id, ord_sub: $.data.subtotal_cents, ord_fee: $.data.portal_fee_cents, ord_total: $.data.total_cents }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1100 (500 promo + 600 list)"
            - "Order.${ord_id}.portal_fee_cents == 55 (round(500*.05)=25 + round(600*.05)=30)"
            - "Order.${ord_id}.total_cents == 1155"

      - name: waste_pct_zero_produced_is_zero_not_error
        claim_type: boundary
        grounds:
          - calculations.waste_pct
        distinguishing_aspect: "With produced_units == 0 both waste percentages are defined as 0.0 (division-by-zero guard), not an error and not null."
        test_recipe:
          setup:
