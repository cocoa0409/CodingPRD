# =============================================================================
# PRD Benchmark Seed Tables — Immigrant Welcome Center & Newcomer Services
# =============================================================================

scenario: |
  Immigrant Welcome Center & Newcomer Services (municipal welcoming center): intake & needs assessment across housing/employment/education, referral network & warm handoff tracking, document/ID assistance & appointment accompaniment, English class & workforce program enrollment, benefits screening & eligibility explanation, case notes & confidentiality/privacy protections, community orientation workshops, outcome tracking & funder reporting

domain_name: immigrant-welcome-center
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat        # peer entities joined by FK references; no URL nesting except plan creation under its OCC parent
  state_machine_shape: cyclic  # most machines carry revision/re-route loops; Case additionally carries two parallel dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many            # WorkshopEnrollment / ProgramEnrollment junctions
    - self_referential        # Client.household_head_id -> Client.id (household graph, cycles forbidden)
    - cross_aggregate         # Appointment.referral_id, Case.assigned_manager_id
  role_model: segregation_of_duties   # assessment creator cannot verify own assessment; admin submits, auditor reviews
  consistency_model: immediate        # every mutation + cascade visible in the same request's response

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology, FK-linked peers)
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full legal name" }
      - { name: preferred_language, type: string, source: input, description: "ISO 639-1 preferred language code" }
      - { name: household_size, type: integer, source: input, default: 1, description: "Persons in household including client", constraints: ">= 1" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD" }
      - { name: country_of_origin, type: string, source: input, description: "Free-text country of origin", default: null }
      - { name: arrival_date, type: string, source: input, description: "ISO 8601 date of arrival in the municipality", default: null }
      - { name: household_head_id, type: string, source: input, default: null, description: "FK -> Client.id; head of household, must not create a cycle" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | EXITED; REGISTERED at creation, auto->ACTIVE when first Case is created, EXITED via exit endpoint" }
      - { name: reportable, type: boolean, source: computed, description: "true iff the client holds a Consent with scope=DATA_REPORTING and status=GRANTED; drives identifiable vs aggregate-only funder reporting" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: role_level, type: enum, source: input, description: "ADMIN | CASE_MANAGER | INTAKE" }
      - { name: clearance_level, type: integer, source: input, description: "Confidentiality clearance 1..3; 3 required to read SEALED notes" , constraints: "1..3" }
      - { name: weekly_appointment_capacity, type: integer, source: input, description: "Maximum CONFIRMED appointments per ISO week (informational)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE; single-state record in v1 (no deactivation transition defined)" }

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner organization name" }
      - { name: service_categories, type: array, source: input, description: "Array of HOUSING | EMPLOYMENT | EDUCATION | LEGAL | HEALTH" }
      - { name: referral_capacity, type: integer, source: input, description: "Max referrals occupying a slot (status SENT or ACCEPTED)", constraints: ">= 0" }
      - { name: referral_slots_used, type: number, source: computed, description: "Count of this org's Referrals with status IN {SENT, ACCEPTED}; incremented on send/reroute/resume, decremented on withdraw/decline/expire/suspend/complete" , default: 0 }
      - { name: referral_slots_open, type: number, source: computed, description: "referral_capacity - referral_slots_used; invariant: used + open == capacity at all times" }
      - { name: contact_email, type: string, source: input, description: "Partner contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; ACTIVE at creation" }

  - name: Room
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Room name, unique" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity (informational; scheduling conflicts use time buffers)", constraints: ">= 1" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the newcomer served" }
      - { name: assigned_manager_id, type: string, source: input, description: "FK -> StaffMember.id; responsible case manager" }
      - { name: service_status, type: enum, source: system, description: "INTAKE | ASSESSED | PLANNING | ACTIVE | SUSPENDED | OUTCOME_REVIEW | CLOSED" }
      - { name: privacy_posture, type: enum, source: system, description: "STANDARD | RESTRICTED | SEALED; parallel dimension gating referrals/notes/appointments/screenings" }
      - { name: intake_summary, type: string, source: input, default: null, description: "Free-text intake summary" }
      - { name: acuity_rapid, type: number, source: computed, description: "Rapid-variant acuity index from the latest SUBMITTED or VERIFIED NeedsAssessment; null until first submit", default: null }
      - { name: acuity_verified, type: number, source: computed, description: "Comprehensive-variant acuity index from the latest VERIFIED NeedsAssessment; null until first verify", default: null }
      - { name: closed_reason, type: string, source: input, default: null, description: "Required when transitioning to CLOSED" }

  - name: NeedsAssessment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: housing_score, type: integer, source: input, description: "Housing need severity 0..4", constraints: "0..4" }
      - { name: employment_score, type: integer, source: input, description: "Employment need severity 0..4", constraints: "0..4" }
      - { name: education_score, type: integer, source: input, description: "Education need severity 0..4", constraints: "0..4" }
      - { name: language_score, type: integer, source: input, description: "Language need severity 0..4", constraints: "0..4" }
      - { name: health_score, type: integer, source: input, description: "Health need severity 0..4", constraints: "0..4" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | SUPERSEDED" }
      - { name: created_by_id, type: string, source: system, description: "X-User-ID of the creator (staff); segregation-of-duties anchor" }
      - { name: verified_by_id, type: string, source: system, description: "X-User-ID of the verifying case manager; null until verified", default: null }

  - name: CasePlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; taken from the creation path" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: budgeted_hours, type: integer, source: input, description: "Budgeted staff service hours for the plan", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | COMPLETED | SUPERSEDED" }
      - { name: plan_revision, type: integer, source: system, description: "Starts at 1; +1 every time ACTIVE -> DRAFT revise fires", default: 1 }
      - { name: basis_assessment_id, type: string, source: system, description: "FK -> NeedsAssessment.id; the VERIFIED assessment current at plan activation; auto-revise triggers when it is superseded", default: null }

  - name: CaseNote
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: author_id, type: string, source: system, description: "FK -> StaffMember.id; taken from X-User-ID at creation" }
      - { name: body, type: string, source: input, description: "Note text", constraints: "1..10000 characters" }
      - { name: sensitivity, type: enum, source: input, description: "STANDARD | CONFIDENTIAL | SEALED; read requires clearance_level >= 1|2|3 respectively, or authorship" }
      - { name: redaction_status, type: enum, source: system, description: "VISIBLE | REDACTED; REDACTED hides body from all reads" }

  - name: Consent
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the consenting client" }
      - { name: scope, type: enum, source: input, description: "REFERRAL_SHARE | ACCOMPANIMENT | DATA_REPORTING" }
      - { name: status, type: enum, source: system, description: "GRANTED | REVOKED | EXPIRED" }
      - { name: expires_at, type: datetime, source: input, default: null, description: "Optional expiry instant; sweep flips GRANTED -> EXPIRED when expires_at <= now" }
      - { name: revoked_reason, type: string, source: input, default: null, description: "Optional reason captured at revocation" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id; receiving partner" }
      - { name: service_category, type: enum, source: input, description: "HOUSING | EMPLOYMENT | EDUCATION | LEGAL | HEALTH; must be in the org's service_categories" }
      - { name: notes, type: string, source: input, default: null, description: "Handoff notes for the partner" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | DECLINED | EXPIRED | SUSPENDED | COMPLETED | WITHDRAWN" }
      - { name: sent_at, type: datetime, source: system, description: "Set on every transition into SENT (send/reroute/resume)", default: null }
      - { name: responded_at, type: datetime, source: system, description: "Set when the partner responds ACCEPTED or DECLINED", default: null }
      - { name: warm_handoff_offered, type: boolean, source: input, default: false, description: "Partner flags a warm handoff on ACCEPT" }
      - { name: handoff_confirmed_at, type: datetime, source: system, description: "Set by confirm-handoff; required before complete", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED; used by funder outcome counting window", default: null }
      - { name: ttl_days, type: integer, source: input, default: 14, description: "Days a referral may stay SENT before the sweep expires it", constraints: ">= 1" }
      - { name: suspension_reason, type: enum, source: system, description: "CASE_SEALED | CONSENT_REVOKED | null; CONSENT_REVOKED is also used when the suspension came from consent expiry", default: null }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: advocate_id, type: string, source: input, description: "FK -> StaffMember.id; the accompanying/assisting staff member" }
      - { name: referral_id, type: string, source: input, default: null, description: "FK -> Referral.id; set when the appointment accompanies a referral handoff" }
      - { name: kind, type: enum, source: input, description: "DOCUMENT_ID | ACCOMPANIMENT | ORIENTATION | BENEFITS" }
      - { name: starts_at, type: datetime, source: input, description: "Start instant; half-open interval [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "End instant (exclusive); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED", default: null }
      - { name: cancelled_by_system, type: boolean, source: system, description: "true when cancelled by a privacy/consent cascade rather than an explicit cancel", default: false }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: kind, type: enum, source: input, description: "ESOL | WORKFORCE" }
      - { name: capacity, type: integer, source: input, description: "Max ENROLLED ProgramEnrollments", constraints: ">= 1" }
      - { name: base_fee_cents, type: integer, source: input, description: "List fee in cents before subsidy", constraints: ">= 0" }
      - { name: cost_per_completion_cents, type: integer, source: input, description: "Funder-costed value of one COMPLETED enrollment", constraints: ">= 0" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of ProgramEnrollments with status ENROLLED", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED; OPEN at creation, auto->FULL when enrolled_count == capacity, auto->OPEN when a withdrawal drops it below" }

  - name: ProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case must be service_status ACTIVE to apply" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: status, type: enum, source: system, description: "APPLIED | ELIGIBLE | ENROLLED | COMPLETED | WITHDRAWN | DENIED" }
      - { name: subsidy_pct, type: number, source: computed, description: "Subsidy fraction from the case's VERIFIED BenefitScreening tier; null until ELIGIBLE", default: null }
      - { name: subsidized_fee_cents, type: integer, source: computed, description: "Final fee after base subsidy then burden cap (pinned order); null until ELIGIBLE", default: null }
      - { name: fee_status, type: enum, source: system, description: "PENDING | ARRANGED | WAIVED; WAIVED automatically when subsidized_fee_cents == 0, else PENDING until arrange-fee" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Optional reason when transitioning to DENIED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED; funder outcome window key", default: null }

  - name: WorkshopSession
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room conflicts use buffered closed intervals" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity", constraints: ">= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Session start instant" }
      - { name: ends_at, type: datetime, source: input, description: "Session end instant; must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED | RECONCILED; sweep moves SCHEDULED -> HELD once ends_at <= now" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of WorkshopEnrollments with status ENROLLED", default: 0 }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of WorkshopEnrollments with status WAITLISTED", default: 0 }
      - { name: open_seats, type: integer, source: computed, description: "capacity - enrolled_count; invariant: enrolled_count + open_seats == capacity at all times" }

  - name: WorkshopEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> WorkshopSession.id" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | CANCELLED | ATTENDED | NO_SHOW" }
      - { name: waitlist_position, type: integer, source: system, description: "Per-session monotonic sequence assigned at creation; promotion order key (ASC)", default: null }
      - { name: attended_marked_at, type: datetime, source: system, description: "Set by mark-attendance; funder outcome window key for ATTENDED", default: null }

  - name: BenefitScreening
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: household_size, type: integer, source: system, description: "Snapshot of Client.household_size at creation" }
      - { name: stated_annual_income_cents, type: integer, source: input, description: "Self-reported annual income in cents", constraints: ">= 0" }
      - { name: documented_annual_income_cents, type: integer, source: input, default: null, description: "Document-verified annual income in cents; set by verify", constraints: ">= 0" }
      - { name: variant_used, type: enum, source: system, description: "SELF_REPORTED | VERIFIED; which eligibility variant produced the current result" }
      - { name: income_ratio, type: number, source: computed, description: "income / FPL[household_size], 4 decimal places round_half_up", default: null }
      - { name: tier, type: enum, source: computed, description: "TIER_A | TIER_B | TIER_C | TIER_D; null until run", default: null }
      - { name: eligible_programs, type: array, source: computed, description: "Program codes from {SNAP, MEDICAID, CASH_ASSIST, ESL_SUBSIDY} per tier and variant; empty array allowed (NO_MATCH outcome)", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | SCREENED | EXPLAINED" }

  - name: FunderReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start instant" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive period end instant; must be > period_start" }
      - { name: funding_streams, type: array, source: input, description: "Array of {stream_name, share_pct}; share_pct values must sum to 100" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED" }
      - { name: lines, type: array, source: computed, description: "Computed outcome lines [{line_type, unit_cost_cents, quantity, line_total_cents}]; recomputed at creation and by regenerate" }
      - { name: stream_totals, type: array, source: computed, description: "Per-stream allocation totals after per-cell rounding (pinned round-then-sum order) and residual assignment" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Sum of line_total_cents across lines", default: 0 }
      - { name: reportable_client_count, type: integer, source: computed, description: "Distinct clients behind counted outcomes holding DATA_REPORTING consent (identifiable count)", default: 0 }
      - { name: aggregate_client_count, type: integer, source: computed, description: "Distinct clients behind counted outcomes regardless of consent (aggregate count)", default: 0 }
      - { name: submitted_by_id, type: string, source: system, description: "X-User-ID of the submitting CenterAdmin", default: null }
      - { name: reviewed_by_id, type: string, source: system, description: "X-User-ID of the reviewing FunderAuditor", default: null }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    field: status
    initial_state: REGISTERED
    terminal_states: [EXITED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (automatic when the client's first Case is created)"
        actor: system
        preconditions: []
        side_effects: ["Client.updated_at refreshed; Client.version +1"]
      - from: ACTIVE
        to: EXITED
        trigger: "POST /clients/{client_id}/exit"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Every Case of this client must have service_status == CLOSED (else ERR_INVALID_STATE)"
        side_effects: ["No new Cases may be created for an EXITED client (ERR_CLIENT_EXITED)"]

  - entity: Case
    field: service_status
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "At least one NeedsAssessment of this case has status == VERIFIED (else ERR_INVALID_STATE)"
        side_effects: ["increments Case.version by 1"]
      - from: ASSESSED
        to: PLANNING
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions: []
        side_effects: ["increments Case.version by 1"]
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "An ACTIVE CasePlan exists for this case (else ERR_INVALID_STATE)"
        side_effects: ["increments Case.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions: []
        side_effects: ["increments Case.version by 1; new referrals, program enrollments, workshop enrollments, appointments, and screenings are blocked while SUSPENDED (ERR_INVALID_STATE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "An ACTIVE CasePlan still exists for this case (else ERR_INVALID_STATE)"
        side_effects: ["increments Case.version by 1"]
      - from: ACTIVE
        to: OUTCOME_REVIEW
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "No Referral of this case is in {DRAFT, SENT, ACCEPTED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects: ["increments Case.version by 1"]
      - from: OUTCOME_REVIEW
        to: CLOSED
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "closed_reason provided in the request (else ERR_INVALID_REQUEST)"
          - "Every CasePlan of this case is in {COMPLETED, SUPERSEDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Case.version by 1"
          - "m1: Any CasePlan still ACTIVE or SUSPENDED is forced to COMPLETED"
      - from: SUSPENDED
        to: OUTCOME_REVIEW
        trigger: "POST /cases/{case_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "No Referral of this case is in {DRAFT, SENT, ACCEPTED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects: ["increments Case.version by 1"]

  - entity: Case
    field: privacy_posture
    initial_state: STANDARD
    terminal_states: []
    transitions:
      - from: STANDARD
        to: RESTRICTED
        trigger: "POST /cases/{case_id}/privacy"
        actor: CaseManager | CenterAdmin
        preconditions: []
        side_effects: ["increments Case.version by 1; referral send blocked while RESTRICTED (ERR_PRIVACY_SEALED)"]
      - from: RESTRICTED
        to: STANDARD
        trigger: "POST /cases/{case_id}/privacy"
        actor: CaseManager | CenterAdmin
        preconditions: []
        side_effects: ["increments Case.version by 1"]
      - from: STANDARD
        to: SEALED
        trigger: "POST /cases/{case_id}/privacy"
        actor: CenterAdmin
        preconditions:
          - "Actor role must be CenterAdmin (else ERR_FORBIDDEN)"
        side_effects:
          - "m1: Case.privacy_posture -> SEALED; increments Case.version by 1"
          - "m2: every Referral of this case in {DRAFT, SENT, ACCEPTED} -> SUSPENDED with suspension_reason=CASE_SEALED (caused by the case sealing)"
          - "m3a: for each referral that just became SUSPENDED from {SENT, ACCEPTED}, Organization.referral_slots_used -= 1 (caused by the referral suspension, releasing the partner slot)"
          - "m3b: for each referral that just became SUSPENDED, every Appointment with referral_id == that referral and status IN {REQUESTED, CONFIRMED} -> CANCELLED with cancelled_by_system=true (caused by the referral suspension)"
      - from: RESTRICTED
        to: SEALED
        trigger: "POST /cases/{case_id}/privacy"
        actor: CenterAdmin
        preconditions:
          - "Actor role must be CenterAdmin (else ERR_FORBIDDEN)"
        side_effects:
          - "Same m1/m2/m3a/m3b cascade chain as STANDARD -> SEALED"
      - from: SEALED
        to: RESTRICTED
        trigger: "POST /cases/{case_id}/privacy"
        actor: CenterAdmin
        preconditions:
          - "Actor role must be CenterAdmin (else ERR_FORBIDDEN)"
        side_effects:
          - "increments Case.version by 1; SUSPENDED referrals remain SUSPENDED (resume is explicit via POST /referrals/{id}/resume)"

  - entity: NeedsAssessment
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assessments/{assessment_id}/submit"
        actor: IntakeSpecialist | CaseManager
        preconditions:
          - "Assessment must be DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "Case.acuity_rapid recomputed (rapid variant) from this assessment"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /assessments/{assessment_id}/verify"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Assessment must be SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != assessment.created_by_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "m1: this assessment -> VERIFIED; verified_by_id := X-User-ID"
          - "m2: the previously VERIFIED NeedsAssessment of the same case (if any) -> SUPERSEDED (caused by this verification)"
          - "m3: every CasePlan of the case with status ACTIVE or SUSPENDED whose basis_assessment_id == the just-superseded assessment -> DRAFT with plan_revision +1 (caused by the supersession)"
          - "Case.acuity_rapid and Case.acuity_verified recomputed from this assessment (comprehensive variant for acuity_verified)"

  - entity: CasePlan
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /plans/{plan_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Plan must be DRAFT (else ERR_INVALID_STATE)"
          - "Parent case service_status IN {PLANNING, ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
          - "A VERIFIED NeedsAssessment exists for the case (else ERR_INVALID_STATE)"
        side_effects:
          - "basis_assessment_id := id of the case's VERIFIED assessment (the one with the latest updated_at; tie cannot occur because verification updates updated_at)"
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /plans/{plan_id}/transition (explicit revise) OR system (automatic when basis assessment is superseded)"
        actor: CaseManager | CenterAdmin | system
        preconditions:
          - "Plan must be ACTIVE (else ERR_INVALID_STATE) — system path has no precondition beyond supersession"
        side_effects: ["plan_revision +1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plans/{plan_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Plan must be ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plans/{plan_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Plan must be SUSPENDED (else ERR_INVALID_STATE)"
          - "Parent case service_status != CLOSED (else ERR_INVALID_STATE)"
        side_effects: ["basis_assessment_id refreshed to the case's current VERIFIED assessment (latest updated_at)"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /plans/{plan_id}/transition OR system (case closing forces completion)"
        actor: CaseManager | CenterAdmin | system
        preconditions:
          - "Plan must be ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: COMPLETED
        trigger: "POST /plans/{plan_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Plan must be ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when POST /cases/{case_id}/plans creates a successor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when POST /cases/{case_id}/plans creates a successor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: SUPERSEDED
        trigger: "system (automatic when POST /cases/{case_id}/plans creates a successor)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CaseNote
    field: redaction_status
    initial_state: VISIBLE
    terminal_states: [REDACTED]
    transitions:
      - from: VISIBLE
        to: REDACTED
        trigger: "POST /case-notes/{note_id}/redact"
        actor: CenterAdmin
        preconditions:
          - "Note must be VISIBLE (else ERR_INVALID_STATE)"
        side_effects: ["body is masked on all subsequent reads; author/sensitivity metadata retained"]

  - entity: Consent
    field: status
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consents/{consent_id}/revoke"
        actor: CaseManager | CenterAdmin | Client
        preconditions:
          - "Consent must be GRANTED (else ERR_INVALID_STATE)"
          - "Actor role Client may revoke only own consents (consent.client_id == X-User-ID, else ERR_FORBIDDEN)"
        side_effects:
          - "m1: Consent -> REVOKED; Client.reportable recomputed"
          - "m2 (only when scope == REFERRAL_SHARE): every Referral of the client's cases in {SENT, ACCEPTED} -> SUSPENDED with suspension_reason=CONSENT_REVOKED (caused by the revocation)"
          - "m3a: for each referral that just became SUSPENDED, Organization.referral_slots_used -= 1 (caused by the suspension)"
          - "m3b: for each referral that just became SUSPENDED, every Appointment with referral_id == that referral and status IN {REQUESTED, CONFIRMED} -> CANCELLED with cancelled_by_system=true (caused by the suspension)"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (POST /_sweeps/run flips GRANTED consents whose expires_at <= current logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Client.reportable recomputed; REFERRAL_SHARE expiry triggers the same m2/m3a/m3b cascade as revocation"

  - entity: Referral
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /referrals/{referral_id}/send"
        actor: CaseManager
        preconditions:
          - "Referral must be DRAFT (else ERR_INVALID_STATE)"
          - "Case privacy_posture == STANDARD (else ERR_PRIVACY_SEALED)"
          - "Client holds a Consent scope=REFERRAL_SHARE status=GRANTED (else ERR_CONSENT_MISSING)"
          - "Organization.status == ACTIVE (else ERR_ORG_SUSPENDED)"
          - "Organization.referral_slots_used < referral_capacity (else ERR_ORG_CAPACITY_FULL)"
          - "Case service_status not IN {SUSPENDED, CLOSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "sent_at := now; Organization.referral_slots_used += 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /referrals/{referral_id}/respond with decision=ACCEPTED"
        actor: PartnerOrg
        preconditions:
          - "Referral must be SENT (else ERR_INVALID_STATE)"
          - "Actor's organization must own the referral (referral.organization_id == X-User-ID, else ERR_FORBIDDEN)"
        side_effects: ["responded_at := now; warm_handoff_offered captured from payload"]
      - from: SENT
        to: DECLINED
        trigger: "POST /referrals/{referral_id}/respond with decision=DECLINED"
        actor: PartnerOrg
        preconditions:
          - "Referral must be SENT (else ERR_INVALID_STATE)"
          - "Actor's organization must own the referral (else ERR_FORBIDDEN)"
        side_effects: ["responded_at := now; Organization.referral_slots_used -= 1"]
      - from: DECLINED
        to: SENT
        trigger: "POST /referrals/{referral_id}/reroute"
        actor: CaseManager
        preconditions:
          - "Referral must be DECLINED or EXPIRED (else ERR_INVALID_STATE)"
          - "New organization differs from current (else ERR_INVALID_REQUEST) and its service_categories contain referral.service_category (else ERR_INVALID_REQUEST)"
          - "Same consent/posture/org-status/org-capacity/case-status gates as DRAFT -> SENT"
        side_effects: ["organization_id := new org; sent_at := now; Organization.referral_slots_used += 1 on the new org"]
      - from: EXPIRED
        to: SENT
        trigger: "POST /referrals/{referral_id}/reroute"
        actor: CaseManager
        preconditions: ["Same as DECLINED -> SENT"]
        side_effects: ["Same as DECLINED -> SENT"]
      - from: SENT
        to: EXPIRED
        trigger: "system (POST /_sweeps/run expires referrals with sent_at + ttl_days <= current logical clock)"
        actor: system
        preconditions: []
        side_effects: ["Organization.referral_slots_used -= 1"]
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /referrals/{referral_id}/complete"
        actor: CaseManager
        preconditions:
          - "Referral must be ACCEPTED (else ERR_INVALID_STATE)"
          - "handoff_confirmed_at is set (warm handoff confirmed, else ERR_HANDOFF_NOT_CONFIRMED)"
        side_effects: ["completed_at := now; Organization.referral_slots_used -= 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /referrals/{referral_id}/withdraw"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Referral must be in {DRAFT, SENT, ACCEPTED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects: ["If prior status was SENT or ACCEPTED: Organization.referral_slots_used -= 1"]
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /referrals/{referral_id}/withdraw"
        actor: CaseManager | CenterAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Organization.referral_slots_used -= 1"]
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /referrals/{referral_id}/withdraw"
        actor: CaseManager | CenterAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Organization.referral_slots_used -= 1"]
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /referrals/{referral_id}/withdraw"
        actor: CaseManager | CenterAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["No slot change (slot was already released at suspension)"]
      - from: SUSPENDED
        to: SENT
        trigger: "POST /referrals/{referral_id}/resume"
        actor: CaseManager
        preconditions:
          - "Referral must be SUSPENDED (else ERR_INVALID_STATE)"
          - "Case privacy_posture == STANDARD (else ERR_PRIVACY_SEALED)"
          - "Client holds a Consent scope=REFERRAL_SHARE status=GRANTED (else ERR_CONSENT_MISSING)"
          - "Organization.status == ACTIVE (else ERR_ORG_SUSPENDED)"
          - "Organization.referral_slots_used < referral_capacity (else ERR_ORG_CAPACITY_FULL)"
        side_effects: ["sent_at := now; suspension_reason := null; Organization.referral_slots_used += 1"]
      - from: SENT
        to: SUSPENDED
        trigger: "system (privacy-seal or REFERRAL_SHARE consent revocation/expiry cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_reason := CASE_SEALED | CONSENT_REVOKED"
          - "Organization.referral_slots_used -= 1"
          - "Appointments with referral_id == this referral and status IN {REQUESTED, CONFIRMED} -> CANCELLED with cancelled_by_system=true"
      - from: ACCEPTED
        to: SUSPENDED
        trigger: "system (same cascade)"
        actor: system
        preconditions: []
        side_effects: ["Same as SENT -> SUSPENDED"]
      - from: DRAFT
        to: SUSPENDED
        trigger: "system (privacy-seal cascade only)"
        actor: system
        preconditions: []
        side_effects: ["suspension_reason := CASE_SEALED; no slot change (DRAFT holds no slot)"]

  - entity: Appointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /appointments/{appointment_id}/confirm"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Appointment must be REQUESTED (else ERR_INVALID_STATE)"
          - "If kind == ACCOMPANIMENT: client holds Consent scope=ACCOMPANIMENT status=GRANTED (else ERR_CONSENT_MISSING)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{appointment_id}/complete"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Appointment must be CONFIRMED (else ERR_INVALID_STATE)"
        side_effects: ["completed_at := now"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appointments/{appointment_id}/cancel OR system (referral-suspension cascade)"
        actor: CaseManager | CenterAdmin | system
        preconditions:
          - "Appointment must be REQUESTED or CONFIRMED (else ERR_INVALID_STATE) — system path unconditional"
        side_effects: ["cancelled_by_system set by cascade path"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{appointment_id}/cancel OR system (cascade)"
        actor: CaseManager | CenterAdmin | system
        preconditions: ["Same as REQUESTED -> CANCELLED"]
        side_effects: ["cancelled_by_system set by cascade path"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (POST /_sweeps/run marks CONFIRMED appointments with ends_at <= current logical clock)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Program
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when enrolled_count reaches capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (automatic when a withdrawal drops enrolled_count below capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: CenterAdmin
        preconditions:
          - "Program must be OPEN or FULL (else ERR_INVALID_STATE)"
        side_effects:
          - "m2: every ProgramEnrollment of this program in {APPLIED, ELIGIBLE} -> DENIED with denial_reason=PROGRAM_CLOSED (caused by the close)"
          - "ENROLLED enrollments are unaffected (teach-out)"
      - from: FULL
        to: CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: CenterAdmin
        preconditions: ["Same as OPEN -> CLOSED"]
        side_effects: ["Same as OPEN -> CLOSED"]

  - entity: ProgramEnrollment
    field: status
    initial_state: APPLIED
    terminal_states: [COMPLETED, WITHDRAWN, DENIED]
    transitions:
      - from: APPLIED
        to: ELIGIBLE
        trigger: "POST /program-enrollments/{enrollment_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Enrollment must be APPLIED (else ERR_INVALID_STATE)"
          - "If program.base_fee_cents > 0: the case has a BenefitScreening with status IN {SCREENED, EXPLAINED} and variant_used == VERIFIED (else ERR_SUBSIDY_UNVERIFIED)"
        side_effects:
          - "subsidy_pct and subsidized_fee_cents computed per enrollment_fee_subsidy"
          - "fee_status := WAIVED if subsidized_fee_cents == 0 else PENDING"
      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /program-enrollments/{enrollment_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Enrollment must be ELIGIBLE (else ERR_INVALID_STATE)"
          - "Program.status != CLOSED (else ERR_PROGRAM_CLOSED)"
          - "fee_status IN {ARRANGED, WAIVED} (else ERR_FEE_NOT_ARRANGED)"
          - "program.enrolled_count < program.capacity (else ERR_PROGRAM_FULL)"
        side_effects:
          - "program.enrolled_count += 1; program auto-transitions OPEN -> FULL when enrolled_count == capacity"
      - from: APPLIED
        to: DENIED
        trigger: "POST /program-enrollments/{enrollment_id}/transition OR system (program close)"
        actor: CaseManager | CenterAdmin | system
        preconditions:
          - "Enrollment must be APPLIED or ELIGIBLE (else ERR_INVALID_STATE) — system path unconditional"
        side_effects: []
      - from: ELIGIBLE
        to: DENIED
        trigger: "POST /program-enrollments/{enrollment_id}/transition OR system (program close)"
        actor: CaseManager | CenterAdmin | system
        preconditions: ["Same as APPLIED -> DENIED"]
        side_effects: []
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /program-enrollments/{enrollment_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Enrollment must be ENROLLED (else ERR_INVALID_STATE)"
        side_effects:
          - "program.enrolled_count -= 1; program auto-transitions FULL -> OPEN when enrolled_count drops below capacity"
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /program-enrollments/{enrollment_id}/transition"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Enrollment must be ENROLLED (else ERR_INVALID_STATE)"
        side_effects: ["completed_at := now; program.enrolled_count -= 1; program auto FULL -> OPEN if it drops below capacity"]

  - entity: WorkshopSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, RECONCILED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "system (POST /_sweeps/run marks sessions with ends_at <= current logical clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /workshop-sessions/{session_id}/cancel"
        actor: CaseManager | CenterAdmin
        preconditions:
          - "Session must be SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "m2: every WorkshopEnrollment of this session in {ENROLLED, WAITLISTED} -> CANCELLED (caused by the session cancel); enrolled_count := 0, waitlist_count := 0, open_seats := capacity"
      - from: HELD
        to: RECONCILED
        trigger: "system (POST /_sweeps/run reconciles a HELD session once every ENROLLED WorkshopEnrollment has been marked ATTENDED or NO_SHOW)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkshopEnrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [CANCELLED, ATTENDED, NO_SHOW]
    transitions:
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /workshop-enrollments/{wk_enrollment_id}/cancel OR system (session cancel cascade)"
        actor: CaseManager | CenterAdmin | system
        preconditions:
          - "Enrollment must be ENROLLED or WAITLISTED (else ERR_INVALID_STATE) — system path unconditional"
        side_effects:
          - "session.enrolled_count -= 1, open_seats += 1"
          - "promotion: the WAITLISTED enrollment of this session with the lowest waitlist_position (if any) -> ENROLLED; session.waitlist_count -= 1, enrolled_count += 1, open_seats -= 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /workshop-enrollments/{wk_enrollment_id}/cancel OR system (session cancel cascade)"
        actor: CaseManager | CenterAdmin | system
        preconditions: ["Same as ENROLLED -> CANCELLED"]
        side_effects: ["session.waitlist_count -= 1; no promotion (no seat freed)"]
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (automatic promotion when a seat frees)"
        actor: system
        preconditions:
          - "Lowest waitlist_position among the session's WAITLISTED enrollments"
        side_effects: ["session counters updated as above"]
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /workshop-enrollments/{wk_enrollment_id}/mark-attendance with attended=true"
        actor: CaseManager
        preconditions:
          - "Session status == HELD (else ERR_INVALID_STATE)"
          - "Enrollment must be ENROLLED (else ERR_INVALID_STATE)"
        side_effects: ["attended_marked_at := now; session.enrolled_count -= 1 (seat released after the fact); open_seats += 1"]
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /workshop-enrollments/{wk_enrollment_id}/mark-attendance with attended=false"
        actor: CaseManager
        preconditions:
          - "Session status == HELD (else ERR_INVALID_STATE)"
          - "Enrollment must be ENROLLED (else ERR_INVALID_STATE)"
        side_effects: ["session.enrolled_count -= 1; open_seats += 1"]

  - entity: BenefitScreening
    field: status
    initial_state: DRAFT
    terminal_states: [EXPLAINED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /benefit-screenings/{screening_id}/run"
        actor: IntakeSpecialist | CaseManager
        preconditions:
          - "Screening must be DRAFT (else ERR_INVALID_STATE)"
        side_effects: ["variant_used := SELF_REPORTED; income_ratio, tier, eligible_programs computed per benefits_tiering (self-reported variant)"]
      - from: SCREENED
        to: DRAFT
        trigger: "POST /benefit-screenings/{screening_id}/reopen"
        actor: CaseManager
        preconditions:
          - "Screening must be SCREENED (else ERR_INVALID_STATE)"
        side_effects: ["tier/income_ratio/eligible_programs cleared to null/[]"]
      - from: SCREENED
        to: EXPLAINED
        trigger: "POST /benefit-screenings/{screening_id}/explain"
        actor: CaseManager
        preconditions:
          - "Screening must be SCREENED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: FunderReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /funder-reports/{report_id}/submit"
        actor: CenterAdmin
        preconditions:
          - "Report must be DRAFT or RETURNED (else ERR_INVALID_STATE)"
          - "Freshness: recomputing lines at submit time must equal stored lines (else ERR_REPORT_STALE — run regenerate first)"
        side_effects: ["submitted_by_id := X-User-ID"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /funder-reports/{report_id}/submit"
        actor: CenterAdmin
        preconditions: ["Same as DRAFT -> SUBMITTED"]
        side_effects: ["submitted_by_id := X-User-ID; reviewed_by_id := null"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /funder-reports/{report_id}/review with decision=ACCEPTED"
        actor: FunderAuditor
        preconditions:
          - "Report must be SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: ["reviewed_by_id := X-User-ID"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /funder-reports/{report_id}/review with decision=RETURNED"
        actor: FunderAuditor
        preconditions:
          - "Report must be SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: ["reviewed_by_id := X-User-ID"]

  - entity: Organization
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /organizations/{organization_id}/suspend"
        actor: CenterAdmin
        preconditions:
          - "Organization must be ACTIVE (else ERR_INVALID_STATE)"
        side_effects: ["Referrals already SENT/ACCEPTED are NOT auto-suspended; new sends are blocked (ERR_ORG_SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /organizations/{organization_id}/reactivate"
        actor: CenterAdmin
        preconditions:
          - "Organization must be SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC only; state-precondition conflicts live in §1.2/§1.4
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{case_id}/plans"
    occ_field: "expected_case_version"
    description: |
      Creating a CasePlan against a Case whose version has advanced since the
      client last observed it is rejected with ERR_STALE_CASE_VERSION. Plan
      creation legitimately supersedes the case's current DRAFT/ACTIVE/SUSPENDED
      plan, so a writer holding a stale view of the case must re-read before
      superseding a plan it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: acuity_index
    trigger: "NeedsAssessment submit (rapid variant, writes Case.acuity_rapid) and verify (both variants; comprehensive writes Case.acuity_verified)"
    algorithm: weighted_scoring
    formula: |
      Weights W = { housing: 0.30, employment: 0.25, education: 0.15, language: 0.20, health: 0.10 }.
      base = sum over domains d of W[d] * (score_d / 4)          # in [0, 1]
      rapid:      acuity = round_half_up(base * 100, 1 decimal)
      comprehensive (VERIFIED only):
        acuity = round_half_up(min(1.0, base * VERIFIED_MULTIPLIER) * 100, 1 decimal)
                 + (10 if client.household_size >= HOUSEHOLD_BONUS_MIN else 0)
                 + (5 if client.arrival_date is not null and now - arrival_date <= RECENT_ARRIVAL_DAYS else 0)
        then clamp final value to [0, 100] after bonuses.
    input_set: "The NeedsAssessment row just submitted/verified; client fields household_size and arrival_date from Case.client_id"
    constants:
      VERIFIED_MULTIPLIER: 1.25
      HOUSEHOLD_BONUS_MIN: 5
      RECENT_ARRIVAL_DAYS: 90
    precision: "1 decimal place, round_half_up (bonuses added after rounding, then clamped)"
    variants:
      - name: rapid
        when: "assessment SUBMITTED but not yet VERIFIED; drives Case.acuity_rapid"
        difference: "No verified multiplier and no vulnerability bonuses; purely self-reported weights"
      - name: comprehensive
        when: "assessment VERIFIED; drives Case.acuity_verified"
        difference: "Applies VERIFIED_MULTIPLIER to the base, then adds household/arrival bonuses, then clamps to 100"

  - name: benefits_tiering
    trigger: "BenefitScreening run (self-reported variant) and verify (verified variant recompute)"
    algorithm: threshold
    formula: |
      FPL_ANNUAL_CENTS = {1: 1506000, 2: 2044000, 3: 2582000, 4: 3120000, 5: 3658000, 6: 4196000, 7: 4734000, 8: 5272000};
      household_size > 8 uses the size-8 value.
      income_cents = stated_annual_income_cents (self_reported) or documented_annual_income_cents (verified).
      income_ratio = round_half_up(income_cents / FPL_ANNUAL_CENTS[household_size], 4 decimals).
      Tier boundaries are INCLUSIVE at the upper edge (compare in cents, not rounded ratio):
        TIER_A iff income_cents <= floor(FPL * 138 / 100)
        TIER_B iff floor(FPL*138/100)  < income_cents <= floor(FPL * 200 / 100)
        TIER_C iff floor(FPL*200/100)  < income_cents <= floor(FPL * 300 / 100)
        TIER_D otherwise.
      Tier program sets:
        TIER_A = {SNAP, MEDICAID, CASH_ASSIST, ESL_SUBSIDY}
        TIER_B = {SNAP, ESL_SUBSIDY}
        TIER_C = {ESL_SUBSIDY}
        TIER_D = {} (empty set is a valid NO_MATCH outcome)
      Variant filter: the self_reported variant REMOVES documentation-gated programs
      {CASH_ASSIST} from the tier set; the verified variant keeps the full tier set.
    input_set: "The BenefitScreening row; household_size snapshot taken at creation"
    constants:
      TIER_A_PCT: 138
      TIER_B_PCT: 200
      TIER_C_PCT: 300
      DOC_GATED: ["CASH_ASSIST"]
    precision: "ratio at 4 decimals round_half_up; tier comparison done in integer cents against floor(FPL*pct/100)"
    variants:
      - name: self_reported
        when: "after run, before verify"
        difference: "Uses stated income and strips CASH_ASSIST from the tier's program set"
      - name: verified
        when: "after verify supplies documented_annual_income_cents"
        difference: "Uses documented income and keeps the full tier program set (CASH_ASSIST included)"

  - name: enrollment_fee_subsidy
    trigger: "ProgramEnrollment transition APPLIED -> ELIGIBLE"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (the fee appears in its own cap — evaluate strictly in this order):
        1. tier := tier from the case's latest VERIFIED BenefitScreening
           (the screening with variant_used == VERIFIED and greatest updated_at).
        2. base_subsidy_pct := {TIER_A: 0.90, TIER_B: 0.60, TIER_C: 0.30, TIER_D: 0.00}[tier].
        3. provisional_fee := round_half_up(base_fee_cents * (1 - base_subsidy_pct)) to integer cents.
        4. monthly_income := floor(screening.documented_annual_income_cents / 12).
        5. burden_cap := floor(monthly_income * 0.05).
        6. final_fee := min(provisional_fee, burden_cap); final_fee := max(final_fee, 0).
      subsidy_pct := base_subsidy_pct (the tier percentage, recorded even when the burden cap binds).
      subsidized_fee_cents := final_fee.
      If base_fee_cents == 0, no screening is required and subsidized_fee_cents := 0.
    input_set: "Program.base_fee_cents; the case's latest VERIFIED BenefitScreening (tier, documented income)"
    constants:
      BURDEN_RATE: 0.05
      MONTHS_PER_YEAR: 12
    precision: "integer cents; all divisions floored except the provisional-fee multiply which is round_half_up"

  - name: funder_cost_allocation
    trigger: "FunderReport creation, regenerate, and the freshness recompute at submit"
    algorithm: aggregation
    formula: |
      Step 1 — outcome lines (window [period_start, period_end) on each row's completion instant):
        referral_line.quantity   = count of Referral   with status COMPLETED and completed_at IN window
        enrollment_line.quantity = count of ProgramEnrollment with status COMPLETED and completed_at IN window
        workshop_line.quantity   = count of WorkshopEnrollment with status ATTENDED and attended_marked_at IN window
        line_total_cents = quantity * unit cost from constants.
      Step 2 — per-cell rounding, then sum (PINNED rounding order):
        for each line L and each stream S (in funding_streams array order):
          cell[L][S] = round_half_up(L.line_total_cents * S.share_pct / 100) to integer cents
        stream_sum[S] = sum over lines of cell[L][S]
      Step 3 — residual reconciliation:
        residual = total_cost_cents - sum(stream_sum over S)
        stream_totals := stream_sum, then add residual (may be negative) to the stream with the
        greatest share_pct; tie-break: lowest funding_streams array index (never entity id).
      Step 4 — consent-split client counts:
        aggregate_client_count  = distinct case.client_id over all counted rows (any consent state)
        reportable_client_count = distinct case.client_id over counted rows whose client.reportable == true
    input_set: "Referral/ProgramEnrollment/WorkshopEnrollment terminal rows in the window; Client.reportable for the consent split"
    constants:
      REFERRAL_COMPLETION_CENTS: 7500
      ENROLLMENT_COMPLETION_CENTS: 12000
      WORKSHOP_ATTENDANCE_CENTS: 2500
    precision: "integer cents; per-cell round_half_up BEFORE summing; residual lands on the largest-share stream"

  - name: workshop_seat_allocation
    trigger: "WorkshopEnrollment creation and ENROLLED cancellation"
    algorithm: threshold
    formula: |
      On create: if session.enrolled_count >= session.capacity, the new enrollment is WAITLISTED
      and receives the next per-session waitlist_position (1, 2, 3, ... in creation order);
      otherwise it is ENROLLED and enrolled_count += 1.
      On cancel of an ENROLLED enrollment: enrolled_count -= 1, then promote exactly one
      waitlisted enrollment — eligibility: status == WAITLISTED for this session;
      ranking: waitlist_position ASC; empty waitlist: no promotion. Promotion sets
      the enrollment ENROLLED and enrolled_count += 1, waitlist_count -= 1.
      Boundary: the seat exists exactly when enrolled_count < capacity (>= capacity blocks).
    input_set: "WorkshopSession counters; the session's WorkshopEnrollments"
    constants: {}
    precision: "integer counters"

  - name: referral_slot_accounting
    trigger: "Referral send/reroute/resume (+1) and decline/expire/withdraw/suspend/complete (-1)"
    algorithm: aggregation
    formula: |
      referral_slots_used = count of this organization's Referrals with status IN {SENT, ACCEPTED}.
      referral_slots_open = referral_capacity - referral_slots_used.
      Invariant (compensating pairs must preserve it):
        referral_slots_used + referral_slots_open == referral_capacity.
      A DRAFT, DECLINED, EXPIRED, SUSPENDED, COMPLETED, or WITHDRAWN referral holds no slot.
    input_set: "Organization row; its Referrals"
    constants: {}
    precision: "integer counters"

  - name: advocate_schedule_conflict
    trigger: "Appointment creation"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics: an appointment occupies [starts_at, ends_at).
      Conflict exists iff there is another Appointment with the same advocate_id,
      status IN {REQUESTED, CONFIRMED}, and NOT (new.ends_at <= existing.starts_at OR new.starts_at >= existing.ends_at).
      Adjacency is allowed: new.starts_at == existing.ends_at (or vice versa) does NOT conflict.
    input_set: "Appointments of the same advocate_id in non-terminal states {REQUESTED, CONFIRMED}"
    constants: {}
    precision: "instant comparison, no rounding"

  - name: room_schedule_conflict
    trigger: "WorkshopSession creation"
    algorithm: interval_merge
    formula: |
      Buffered CLOSED interval semantics: a session occupies [starts_at - BUFFER_MIN, ends_at + BUFFER_MIN]
      inclusive of both endpoints (turnover buffer).
      Conflict exists iff another WorkshopSession with the same room_id, status IN {SCHEDULED, HELD},
      has buffered intervals that intersect: new_start_buf <= existing_end_buf AND existing_start_buf <= new_end_buf.
      Because endpoints are inclusive, a back-to-back session (new.starts_at == existing.ends_at)
      always conflicts (buffers overlap), and even a gap of exactly 2*BUFFER_MIN minutes conflicts
      (buffered endpoints touch). A gap strictly greater than 2*BUFFER_MIN is required.
    input_set: "WorkshopSessions of the same room_id in {SCHEDULED, HELD}"
    constants:
      BUFFER_MIN: 15
    precision: "instant comparison, no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted on the endpoint per §1.5 roles; entity-backed ownership rules (PartnerOrg may act only on its own organization's referrals; Client may read/revoke only its own resources; note reads require clearance_level >= sensitivity level or authorship)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, then body-referenced ids exist, validated left-to-right (client_id, assigned_manager_id, organization_id, room_id, case_id, program_id, session_id, advocate_id, referral_id, household_head_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition or action; terminal states reject all further transitions; SUSPENDED/CLOSED cases reject new child-service writes"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 5
    category: business_safety
    check: "Privacy and consent gates: case privacy_posture blocks (RESTRICTED blocks referral send; SEALED blocks referral send/resume, appointment creation, screening creation, and note creation by non-CenterAdmin); required consent scopes GRANTED (REFERRAL_SHARE for send/resume/reroute, ACCOMPANIMENT for confirming ACCOMPANIMENT appointments); note sensitivity may not exceed author's clearance_level"
    error_id: ERR_PRIVACY_SEALED
    http_status: 409
    applies_to: "referral send/resume/reroute, appointment create, screening create, note create (SEALED posture); ERR_CONSENT_MISSING for missing consent scope; ERR_CLEARANCE_INSUFFICIENT for sensitivity above clearance"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: assessment verifier must differ from creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /assessments/{assessment_id}/verify"
  - priority: 7
    category: business_constraint
    check: "Structural rules: request well-formed (required fields, enum membership, score ranges 0..4, body length 1..10000, ends_at > starts_at, period_end > period_start, funding share_pct sums to 100); household_head_id must not create a cycle in the Client household graph; at most one DRAFT NeedsAssessment per case; no duplicate WorkshopEnrollment with status IN {ENROLLED, WAITLISTED} per (session_id, case_id) and no duplicate ProgramEnrollment with status IN {APPLIED, ELIGIBLE, ENROLLED} per (program_id, case_id); FunderReport periods must not overlap an existing non-RETURNED report"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "creation endpoints (specific violations map to ERR_HOUSEHOLD_HEAD_CYCLE 409, ERR_DRAFT_ASSESSMENT_EXISTS 409, ERR_DUPLICATE_ENROLLMENT 409, ERR_REPORT_PERIOD_OVERLAP 409, ERR_NOTE_TOO_LONG 422)"
  - priority: 8
    category: business_temporal
    check: "Time rules: appointment/workshop starts_at must be >= current logical clock (ERR_TIME_IN_PAST); advocate half-open overlap (ERR_ADVOCATE_TIME_CONFLICT); room buffered-interval overlap (ERR_ROOM_TIME_CONFLICT)"
    error_id: ERR_TIME_IN_PAST
    http_status: 409
    applies_to: "POST /appointments, POST /workshop-sessions"
  - priority: 9
    category: business_referential
    check: "Cross-entity state: new Case requires client status != EXITED (ERR_CLIENT_EXITED); program enrollment apply requires case service_status == ACTIVE (ERR_CASE_NOT_ACTIVE) and program status != CLOSED (ERR_PROGRAM_CLOSED); ELIGIBLE->ENROLLED requires program not CLOSED (ERR_PROGRAM_CLOSED), fee arranged (ERR_FEE_NOT_ARRANGED), and verified screening when fee > 0 (ERR_SUBSIDY_UNVERIFIED at APPLIED->ELIGIBLE); referral complete requires handoff_confirmed_at set (ERR_HANDOFF_NOT_CONFIRMED)"
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "case creation, enrollment apply/transition, referral complete"
  - priority: 10
    category: business_fiscal
    check: "Capacity counters: Organization referral_slots_used < referral_capacity on send/resume/reroute (ERR_ORG_CAPACITY_FULL); program enrolled_count < capacity on ELIGIBLE->ENROLLED (ERR_PROGRAM_FULL); workshop over-capacity enrollments are WAITLISTED (not an error)"
    error_id: ERR_ORG_CAPACITY_FULL
    http_status: 409
    applies_to: "referral send/resume/reroute, program enrollment transition"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving (logical clock + sweep; default clock is pinned) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No entity mutations; subsequent sweeps and time validations use the new clock"]
  - method: POST
    path: "/_sweeps/run"
    description: "Ops-run checkpoint against the logical clock: expire SENT referrals past sent_at + ttl_days, expire GRANTED consents with expires_at <= now, mark CONFIRMED appointments with ends_at <= now as NO_SHOW, move SCHEDULED sessions with ends_at <= now to HELD, reconcile HELD sessions with no unmarked ENROLLED enrollments to RECONCILED."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: { referrals_expired: integer, consents_expired: integer, appointments_marked_no_show: integer, sessions_marked_held: integer, sessions_reconciled: integer }
    side_effects: ["Referral EXPIRED releases org slots", "Consent EXPIRED recomputes Client.reportable and fires the REFERRAL_SHARE cascade", "Session/appointment epoch transitions per §1.2"]

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Register a newcomer"
    roles: [IntakeSpecialist, CenterAdmin]
    code: 201
    input: [full_name, preferred_language, date_of_birth, "household_size?", "country_of_origin?", "arrival_date?", "household_head_id?"]
    output: Client
    side_effects: ["status=REGISTERED; reportable=false; household_head cycle check (ERR_HOUSEHOLD_HEAD_CYCLE)"]
  - method: GET
    path: "/clients/{client_id}"
    description: "Get a client; Client role may read only its own record"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients with pagination; Client role sees only its own record"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: ["status?", "household_head_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{client_id}/exit"
    description: "Exit a client from services; requires all cases CLOSED"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> EXITED"]
  - method: PATCH
    path: "/clients/{client_id}"
    description: "Update household linkage (set or change household_head_id); household-graph cycle check enforced"
    roles: [IntakeSpecialist, CaseManager, CenterAdmin]
    code: 200
    input: ["household_head_id?"]
    output: Client
    side_effects: ["ERR_HOUSEHOLD_HEAD_CYCLE on self-reference or cycle; increments Client.version by 1"]

  # --- StaffMember ---
  - method: POST
    path: "/staff"
    description: "Create a staff member"
    roles: [CenterAdmin]
    code: 201
    input: [full_name, role_level, clearance_level, weekly_appointment_capacity]
    output: StaffMember
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/staff/{staff_id}"
    description: "Get a staff member"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # --- Organization ---
  - method: POST
    path: "/organizations"
    description: "Register a referral partner organization"
    roles: [CenterAdmin]
    code: 201
    input: [name, service_categories, referral_capacity, contact_email]
    output: Organization
    side_effects: ["status=ACTIVE; referral_slots_used=0; referral_slots_open=referral_capacity"]
  - method: GET
    path: "/organizations/{organization_id}"
    description: "Get an organization"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, PartnerOrg]
    code: 200
    input: []
    output: Organization
    side_effects: []
  - method: POST
    path: "/organizations/{organization_id}/suspend"
    description: "Suspend a partner (blocks new sends; existing referrals untouched)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Organization
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/organizations/{organization_id}/reactivate"
    description: "Reactivate a suspended partner"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Organization
    side_effects: ["status -> ACTIVE"]

  # --- Room ---
  - method: POST
    path: "/rooms"
    description: "Create a bookable room"
    roles: [CenterAdmin]
    code: 201
    input: [name, capacity]
    output: Room
    side_effects: []

  # --- Case ---
  - method: POST
    path: "/cases"
    description: "Open a service case for a client"
    roles: [IntakeSpecialist, CaseManager, CenterAdmin]
    code: 201
    input: [client_id, assigned_manager_id, "intake_summary?"]
    output: Case
    side_effects: ["service_status=INTAKE, privacy_posture=STANDARD; client auto-transitions REGISTERED -> ACTIVE on first case"]
  - method: GET
    path: "/cases/{case_id}"
    description: "Get a case; Client role may read only its own cases"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases with filters; Client role sees only its own"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: ["client_id?", "assigned_manager_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{case_id}/transition"
    description: "Advance the service_status dimension"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: [to_status, "closed_reason?"]
    output: Case
    side_effects: ["Per §1.2 Case service_status machine; increments Case.version by 1"]
  - method: POST
    path: "/cases/{case_id}/privacy"
    description: "Move the privacy_posture dimension; SEALED triggers the referral/appointment cascade"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: [to_posture, reason]
    output: Case
    side_effects: ["Per §1.2 Case privacy_posture machine incl. m1->m2->m3a/m3b cascade; increments Case.version by 1"]

  # --- NeedsAssessment ---
  - method: POST
    path: "/assessments"
    description: "Create a DRAFT needs assessment (one DRAFT per case)"
    roles: [IntakeSpecialist, CaseManager]
    code: 201
    input: [case_id, housing_score, employment_score, education_score, language_score, health_score]
    output: NeedsAssessment
    side_effects: ["created_by_id := X-User-ID"]
  - method: GET
    path: "/assessments/{assessment_id}"
    description: "Get an assessment"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: []
  - method: GET
    path: "/assessments"
    description: "List assessments, filterable by case"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: NeedsAssessment[]
    side_effects: []
  - method: POST
    path: "/assessments/{assessment_id}/submit"
    description: "Submit a DRAFT assessment; recomputes Case.acuity_rapid"
    roles: [IntakeSpecialist, CaseManager]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: ["status -> SUBMITTED; acuity_rapid recomputed (rapid variant)"]
  - method: POST
    path: "/assessments/{assessment_id}/verify"
    description: "Verify a SUBMITTED assessment (verifier != creator); supersedes prior VERIFIED and auto-revises plans based on it"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: ["status -> VERIFIED; supersession + plan-revision cascade per §1.2; acuity_rapid/acuity_verified recomputed"]

  # --- CasePlan (OCC-guarded creation under the case) ---
  - method: POST
    path: "/cases/{case_id}/plans"
    description: "Create a CasePlan (DRAFT) under a case; supersedes any current DRAFT/ACTIVE/SUSPENDED plan; OCC on Case.version"
    roles: [CaseManager, CenterAdmin]
    code: 201
    input: [title, budgeted_hours, expected_case_version]
    output: CasePlan
    side_effects: ["Existing DRAFT/ACTIVE/SUSPENDED plan of the case -> SUPERSEDED; increments Case.version by 1"]
  - method: GET
    path: "/plans/{plan_id}"
    description: "Get a plan"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: CasePlan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans, filterable by case"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "status?", "basis_assessment_id?", "limit?", "offset?"]
    output: CasePlan[]
    side_effects: []
  - method: POST
    path: "/plans/{plan_id}/transition"
    description: "Plan lifecycle transitions (ACTIVE, SUSPENDED, COMPLETED, DRAFT-revise)"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: [to_status]
    output: CasePlan
    side_effects: ["Per §1.2 CasePlan machine; basis_assessment_id pinned at activation"]

  # --- CaseNote ---
  - method: POST
    path: "/case-notes"
    description: "Append a case note; sensitivity may not exceed author clearance; blocked on SEALED cases for non-admin"
    roles: [IntakeSpecialist, CaseManager, CenterAdmin]
    code: 201
    input: [case_id, body, sensitivity]
    output: CaseNote
    side_effects: ["author_id := X-User-ID; redaction_status=VISIBLE"]
  - method: GET
    path: "/case-notes/{note_id}"
    description: "Read a note; requires clearance_level >= sensitivity level or authorship; REDACTED masks body"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: CaseNote
    side_effects: []
  - method: GET
    path: "/case-notes"
    description: "List notes, filterable by case or author; same read-clearance rules apply per row"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "author_id?", "limit?", "offset?"]
    output: CaseNote[]
    side_effects: []
  - method: POST
    path: "/case-notes/{note_id}/redact"
    description: "Redact a note (CenterAdmin only)"
    roles: [CenterAdmin]
    code: 200
    input: [reason]
    output: CaseNote
    side_effects: ["redaction_status -> REDACTED"]

  # --- Consent ---
  - method: POST
    path: "/consents"
    description: "Grant a consent scope for a client"
    roles: [IntakeSpecialist, CaseManager, CenterAdmin]
    code: 201
    input: [client_id, scope, "expires_at?"]
    output: Consent
    side_effects: ["status=GRANTED; Client.reportable recomputed when scope=DATA_REPORTING"]
  - method: GET
    path: "/consents/{consent_id}"
    description: "Get a consent; Client role may read only its own"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: []
    output: Consent
    side_effects: []
  - method: GET
    path: "/consents"
    description: "List consents, filterable by client/scope/status; Client role sees only its own"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, Client]
    code: 200
    input: ["client_id?", "scope?", "status?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []
  - method: POST
    path: "/consents/{consent_id}/revoke"
    description: "Revoke a consent; REFERRAL_SHARE revocation cascades to referrals and linked appointments"
    roles: [CaseManager, CenterAdmin, Client]
    code: 200
    input: ["revoked_reason?"]
    output: Consent
    side_effects: ["status -> REVOKED; m2/m3a/m3b cascade per §1.2 when scope=REFERRAL_SHARE; Client.reportable recomputed"]

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Create a DRAFT referral to a partner organization"
    roles: [CaseManager, CenterAdmin]
    code: 201
    input: [case_id, organization_id, service_category, "notes?", "ttl_days?"]
    output: Referral
    side_effects: ["status=DRAFT; service_category must be in the org's service_categories (ERR_INVALID_REQUEST)"]
  - method: GET
    path: "/referrals/{referral_id}"
    description: "Get a referral; PartnerOrg may read only its own organization's referrals"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, PartnerOrg]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals with filters; PartnerOrg sees only its own organization's"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist, PartnerOrg]
    code: 200
    input: ["case_id?", "organization_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/referrals/{referral_id}/send"
    description: "Send a DRAFT referral (consent, posture, org status and slot gates)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> SENT; sent_at := now; org.referral_slots_used += 1"]
  - method: POST
    path: "/referrals/{referral_id}/respond"
    description: "Partner accepts or declines a SENT referral (ownership-checked)"
    roles: [PartnerOrg]
    code: 200
    input: [decision, "warm_handoff_offered?"]
    output: Referral
    side_effects: ["status -> ACCEPTED | DECLINED; responded_at := now; DECLINE releases the org slot"]
  - method: POST
    path: "/referrals/{referral_id}/confirm-handoff"
    description: "Case manager confirms the warm handoff occurred"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["handoff_confirmed_at := now (referral must be ACCEPTED)"]
  - method: POST
    path: "/referrals/{referral_id}/complete"
    description: "Complete an ACCEPTED referral after handoff confirmation"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> COMPLETED; completed_at := now; org.referral_slots_used -= 1"]
  - method: POST
    path: "/referrals/{referral_id}/withdraw"
    description: "Withdraw a referral in {DRAFT, SENT, ACCEPTED, SUSPENDED}"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> WITHDRAWN; releases org slot if held"]
  - method: POST
    path: "/referrals/{referral_id}/reroute"
    description: "Re-route a DECLINED or EXPIRED referral to a different organization (re-runs all send gates)"
    roles: [CaseManager]
    code: 200
    input: [organization_id]
    output: Referral
    side_effects: ["status -> SENT; organization_id replaced; sent_at := now; new org.referral_slots_used += 1"]
  - method: POST
    path: "/referrals/{referral_id}/resume"
    description: "Resume a SUSPENDED referral after the privacy/consent blocker clears"
    roles: [CaseManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> SENT; suspension_reason := null; sent_at := now; org.referral_slots_used += 1"]

  # --- Appointment ---
  - method: POST
    path: "/appointments"
    description: "Schedule a document/ID, accompaniment, orientation, or benefits appointment; advocate half-open overlap enforced"
    roles: [CaseManager, IntakeSpecialist, CenterAdmin]
    code: 201
    input: [case_id, advocate_id, kind, starts_at, ends_at, "referral_id?"]
    output: Appointment
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/appointments/{appointment_id}"
    description: "Get an appointment"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments with filters"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "advocate_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{appointment_id}/confirm"
    description: "Confirm a REQUESTED appointment (ACCOMPANIMENT kind requires ACCOMPANIMENT consent)"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/appointments/{appointment_id}/cancel"
    description: "Cancel a REQUESTED or CONFIRMED appointment"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED; cancelled_by_system=false on the explicit path"]
  - method: POST
    path: "/appointments/{appointment_id}/complete"
    description: "Complete a CONFIRMED appointment"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> COMPLETED; completed_at := now"]

  # --- Program ---
  - method: POST
    path: "/programs"
    description: "Create an ESOL or workforce program"
    roles: [CenterAdmin]
    code: 201
    input: [name, kind, capacity, base_fee_cents, cost_per_completion_cents]
    output: Program
    side_effects: ["status=OPEN; enrolled_count=0"]
  - method: GET
    path: "/programs/{program_id}"
    description: "Get a program"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{program_id}/close"
    description: "Close a program; APPLIED/ELIGIBLE enrollments are denied (teach-out for ENROLLED)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> CLOSED; cascade to enrollments per §1.2"]

  # --- ProgramEnrollment ---
  - method: POST
    path: "/program-enrollments"
    description: "Apply a case to a program (case must be ACTIVE)"
    roles: [CaseManager, IntakeSpecialist]
    code: 201
    input: [case_id, program_id]
    output: ProgramEnrollment
    side_effects: ["status=APPLIED; fee_status=PENDING; requires program.status != CLOSED (ERR_PROGRAM_CLOSED)"]
  - method: GET
    path: "/program-enrollments/{enrollment_id}"
    description: "Get a program enrollment"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: []
  - method: GET
    path: "/program-enrollments"
    description: "List program enrollments with filters"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "program_id?", "status?", "limit?", "offset?"]
    output: ProgramEnrollment[]
    side_effects: []
  - method: POST
    path: "/program-enrollments/{enrollment_id}/transition"
    description: "Move an enrollment through ELIGIBLE/ENROLLED/COMPLETED/WITHDRAWN/DENIED"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: [to_status, "denial_reason?"]
    output: ProgramEnrollment
    side_effects: ["Per §1.2 ProgramEnrollment machine; subsidy computed at ELIGIBLE; program counters and FULL/OPEN auto-transitions"]
  - method: POST
    path: "/program-enrollments/{enrollment_id}/arrange-fee"
    description: "Record a fee arrangement for a PENDING fee (ELIGIBLE enrollments)"
    roles: [CaseManager]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: ["fee_status PENDING -> ARRANGED"]

  # --- WorkshopSession ---
  - method: POST
    path: "/workshop-sessions"
    description: "Schedule an orientation workshop session in a room; buffered-interval room conflicts enforced"
    roles: [CaseManager, CenterAdmin]
    code: 201
    input: [room_id, title, capacity, starts_at, ends_at]
    output: WorkshopSession
    side_effects: ["status=SCHEDULED; counters zeroed"]
  - method: GET
    path: "/workshop-sessions/{session_id}"
    description: "Get a session"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: WorkshopSession
    side_effects: []
  - method: GET
    path: "/workshop-sessions"
    description: "List sessions with filters"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["room_id?", "status?", "limit?", "offset?"]
    output: WorkshopSession[]
    side_effects: []
  - method: POST
    path: "/workshop-sessions/{session_id}/cancel"
    description: "Cancel a SCHEDULED session; cascades to its enrollments"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: WorkshopSession
    side_effects: ["status -> CANCELLED; ENROLLED/WAITLISTED enrollments -> CANCELLED; counters zeroed"]

  # --- WorkshopEnrollment ---
  - method: POST
    path: "/workshop-enrollments"
    description: "Enroll a case in a workshop session; over-capacity enrollments are waitlisted with a monotonic position"
    roles: [CaseManager, IntakeSpecialist]
    code: 201
    input: [session_id, case_id]
    output: WorkshopEnrollment
    side_effects: ["status ENROLLED or WAITLISTED per workshop_seat_allocation; session counters updated"]
  - method: GET
    path: "/workshop-enrollments/{wk_enrollment_id}"
    description: "Get a workshop enrollment"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: []
  - method: GET
    path: "/workshop-enrollments"
    description: "List workshop enrollments with filters"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["session_id?", "case_id?", "status?", "limit?", "offset?"]
    output: WorkshopEnrollment[]
    side_effects: []
  - method: POST
    path: "/workshop-enrollments/{wk_enrollment_id}/cancel"
    description: "Cancel an enrollment; cancelling an ENROLLED row promotes the waitlist head"
    roles: [CaseManager, CenterAdmin]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: ["Per §1.2 WorkshopEnrollment machine incl. promotion"]
  - method: POST
    path: "/workshop-enrollments/{wk_enrollment_id}/mark-attendance"
    description: "Mark an ENROLLED enrollment ATTENDED or NO_SHOW once the session is HELD"
    roles: [CaseManager]
    code: 200
    input: [attended]
    output: WorkshopEnrollment
    side_effects: ["status -> ATTENDED | NO_SHOW; attended_marked_at := now for ATTENDED"]

  # --- BenefitScreening ---
  - method: POST
    path: "/benefit-screenings"
    description: "Create a DRAFT benefits screening (snapshots client household_size)"
    roles: [IntakeSpecialist, CaseManager]
    code: 201
    input: [case_id, stated_annual_income_cents]
    output: BenefitScreening
    side_effects: ["status=DRAFT; household_size snapshotted from the client"]
  - method: GET
    path: "/benefit-screenings/{screening_id}"
    description: "Get a screening"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: []
    output: BenefitScreening
    side_effects: []
  - method: GET
    path: "/benefit-screenings"
    description: "List screenings, filterable by case"
    roles: [CenterAdmin, CaseManager, IntakeSpecialist]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: BenefitScreening[]
    side_effects: []
  - method: POST
    path: "/benefit-screenings/{screening_id}/run"
    description: "Run the self-reported eligibility variant"
    roles: [IntakeSpecialist, CaseManager]
    code: 200
    input: []
    output: BenefitScreening
    side_effects: ["status -> SCREENED; variant_used=SELF_REPORTED; tier/ratio/eligible_programs computed"]
  - method: POST
    path: "/benefit-screenings/{screening_id}/verify"
    description: "Attach documented income and recompute with the verified variant (stays SCREENED)"
    roles: [CaseManager]
    code: 200
    input: [documented_annual_income_cents]
    output: BenefitScreening
    side_effects: ["variant_used=VERIFIED; tier/ratio/eligible_programs recomputed"]
  - method: POST
    path: "/benefit-screenings/{screening_id}/explain"
    description: "Record that eligibility results were explained to the client"
    roles: [CaseManager]
    code: 200
    input: []
    output: BenefitScreening
    side_effects: ["status -> EXPLAINED"]
  - method: POST
    path: "/benefit-screenings/{screening_id}/reopen"
    description: "Reopen a SCREENED screening back to DRAFT (re-screen cycle)"
    roles: [CaseManager]
    code: 200
    input: []
    output: BenefitScreening
    side_effects: ["status -> DRAFT; computed fields cleared"]

  # --- FunderReport ---
  - method: POST
    path: "/funder-reports"
    description: "Create a DRAFT funder report for a non-overlapping period; lines and stream totals computed at creation"
    roles: [CenterAdmin]
    code: 201
    input: [period_start, period_end, funding_streams]
    output: FunderReport
    side_effects: ["lines/stream_totals/total_cost_cents/client counts computed per funder_cost_allocation"]
  - method: GET
    path: "/funder-reports/{report_id}"
    description: "Get a funder report"
    roles: [CenterAdmin, FunderAuditor]
    code: 200
    input: []
    output: FunderReport
    side_effects: []
  - method: GET
    path: "/funder-reports"
    description: "List funder reports"
    roles: [CenterAdmin, FunderAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FunderReport[]
    side_effects: []
  - method: POST
    path: "/funder-reports/{report_id}/regenerate"
    description: "Recompute lines/stream totals for a DRAFT or RETURNED report"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: FunderReport
    side_effects: ["lines/stream_totals/counts recomputed from current data"]
  - method: POST
    path: "/funder-reports/{report_id}/submit"
    description: "Submit a report; fails with ERR_REPORT_STALE if a recompute would change the stored lines"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: FunderReport
    side_effects: ["status -> SUBMITTED; submitted_by_id := X-User-ID"]
  - method: POST
    path: "/funder-reports/{report_id}/review"
    description: "Auditor accepts or returns a SUBMITTED report"
    roles: [FunderAuditor]
    code: 200
    input: [decision]
    output: FunderReport
    side_effects: ["status -> ACCEPTED | RETURNED; reviewed_by_id := X-User-ID"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: missing required field, unknown enum value, score outside 0..4, ends_at <= starts_at, period_end <= period_start, funding share_pct not summing to 100, reroute to same org or unsupported category"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role / X-User-ID headers or unrecognized role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted on endpoint, or entity-backed ownership check failed (PartnerOrg on another org's referral, Client on another client's resource, CaseManager attempting SEALED posture, insufficient note read rights)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid from-state for the transition/action; terminal-state lockdown; case SUSPENDED/CLOSED blocking child-service writes; exit with non-CLOSED cases"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match the Case's current version on POST /cases/{case_id}/plans"
  - id: ERR_PRIVACY_SEALED
    http: 409
    condition: "Case privacy_posture blocks the operation (RESTRICTED: referral send; SEALED: referral send/resume/reroute, appointment create, screening create, note create by non-CenterAdmin)"
  - id: ERR_CONSENT_MISSING
    http: 409
    condition: "Required consent scope (REFERRAL_SHARE or ACCOMPANIMENT) has no GRANTED consent for the client"
  - id: ERR_CLEARANCE_INSUFFICIENT
    http: 403
    condition: "CaseNote sensitivity exceeds the author's clearance_level at creation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Assessment verifier's X-User-ID equals the assessment's created_by_id"
  - id: ERR_HOUSEHOLD_HEAD_CYCLE
    http: 409
    condition: "household_head_id would create a cycle in the Client household graph (self or descendant as head)"
  - id: ERR_DRAFT_ASSESSMENT_EXISTS
    http: 409
    condition: "The case already has a NeedsAssessment in DRAFT"
  - id: ERR_NOTE_TOO_LONG
    http: 422
    condition: "CaseNote body outside 1..10000 characters"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "A WorkshopEnrollment with status IN {ENROLLED, WAITLISTED} for (session_id, case_id) or a ProgramEnrollment with status IN {APPLIED, ELIGIBLE, ENROLLED} for (program_id, case_id) already exists"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "FunderReport period [period_start, period_end) overlaps an existing report with status != RETURNED"
  - id: ERR_TIME_IN_PAST
    http: 409
    condition: "Appointment/workshop starts_at is before the current logical clock"
  - id: ERR_ADVOCATE_TIME_CONFLICT
    http: 409
    condition: "Advocate already has a REQUESTED/CONFIRMED appointment whose half-open interval intersects the new one"
  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: "Room already hosts a SCHEDULED/HELD session whose buffered closed interval intersects the new one"
  - id: ERR_CLIENT_EXITED
    http: 409
    condition: "New Case or Consent references an EXITED client"
  - id: ERR_CASE_NOT_ACTIVE
    http: 409
    condition: "ProgramEnrollment creation requires the case's service_status == ACTIVE"
  - id: ERR_ORG_SUSPENDED
    http: 409
    condition: "Referral send/resume/reroute targets an Organization with status SUSPENDED"
  - id: ERR_ORG_CAPACITY_FULL
    http: 409
    condition: "Organization.referral_slots_used >= referral_capacity on send/resume/reroute"
  - id: ERR_PROGRAM_CLOSED
    http: 409
    condition: "Enrollment transition targets a Program with status CLOSED"
  - id: ERR_PROGRAM_FULL
    http: 409
    condition: "ELIGIBLE -> ENROLLED when program.enrolled_count >= program.capacity"
  - id: ERR_SUBSIDY_UNVERIFIED
    http: 409
    condition: "APPLIED -> ELIGIBLE on a fee-bearing program without a VERIFIED-variant BenefitScreening on the case"
  - id: ERR_FEE_NOT_ARRANGED
    http: 409
    condition: "ELIGIBLE -> ENROLLED while fee_status == PENDING"
  - id: ERR_HANDOFF_NOT_CONFIRMED
    http: 409
    condition: "Referral complete attempted before confirm-handoff set handoff_confirmed_at"
  - id: ERR_REPORT_STALE
    http: 409
    condition: "Submit-time recompute of report lines differs from stored lines; regenerate first"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CenterAdmin
    description: "Welcome center administrator; manages staff, partners, rooms, programs, reports; sole role for privacy SEALING, note redaction, clock and sweeps"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /staff, /organizations (+suspend/reactivate), /rooms, /programs (+close)"
      - "POST /cases/{id}/privacy with to_posture=SEALED"
      - "POST /case-notes/{id}/redact"
      - "POST /funder-reports (+submit/regenerate)"
      - "POST /_clock/set_current_utc, /_sweeps/run"
    shared_operations:
      - "All case/assessment/plan/note/consent/referral/appointment/enrollment/workshop/screening reads and most writes (verify, transitions, privacy STANDARD<->RESTRICTED)"
  - name: CaseManager
    description: "Assigned case manager; runs assessments, plans, referrals, appointments, enrollments, notes for cases"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /referrals/{id}/send, /reroute, /resume"
      - "POST /program-enrollments/{id}/arrange-fee"
      - "POST /workshop-enrollments/{id}/mark-attendance"
      - "POST /benefit-screenings/{id}/verify, /explain, /reopen"
    shared_operations:
      - "Client/case/assessment/plan/note/consent/referral/appointment/enrollment/workshop creation, transitions, reads; client exit"
  - name: IntakeSpecialist
    description: "Front-desk intake staff; registers clients, opens cases, drafts assessments and screenings, books appointments and enrollments"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /clients (shared only with CenterAdmin)"
    shared_operations:
      - "Case creation, assessment create/submit, screening create/run, note creation, consent grants, appointment and enrollment creation, reads"
  - name: PartnerOrg
    description: "Referral partner organization; reads and responds to referrals addressed to it (X-User-ID == Organization.id)"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /referrals/{id}/respond"
    shared_operations:
      - "GET /referrals/{id} and GET /referrals (own organization only); GET /organizations/{id}"
  - name: Client
    description: "The newcomer; reads own records and may revoke own consents (X-User-ID == Client.id)"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "GET /clients/{id}, /cases/{id}, /consents (+list) scoped to self; POST /consents/{id}/revoke (own)"
  - name: FunderAuditor
    description: "External funder auditor; read access to funder reports and reviews submissions (accept/return)"
    identity: "opaque"
    exclusive_operations:
      - "POST /funder-reports/{id}/review"
    shared_operations:
      - "GET /funder-reports (+{id})"

