          difficulty_instance: corridor_priority_score_screening_vs_programming_variant_divergence
          rationale: "GET /signal-ops/corridors/{id} is a computed read whose priority_score and priority_score_variant depend on which variant last ran. That §1.8 dual_variant_calc instance reads the corridor between the screening and programming evaluations and asserts both the value and the label."

  # =============================================================================================
  # SECTION 6 — errors
  # Table-6 asks that every §1.6 code be triggerable. The families already driven elsewhere are
  # not repeated here: ERR_UNAUTHENTICATED / ERR_UNKNOWN_ROLE / ERR_ROLE_NOT_PERMITTED /
  # ERR_INVALID_REQUEST / ERR_INVALID_PAGINATION (validations §1.9), ERR_SEGREGATION_OF_DUTIES and
  # ERR_NOT_RESOURCE_OWNER (rbac §1.9), ERR_STALE_* (cross_cutting §1.9), ERR_TUNING_ROUND_LIMIT
  # (state_machines §1.9), ERR_OVERSATURATED_APPROACH / ERR_CYCLE_EXCEEDS_LOCAL_MAX /
  # ERR_MIN_GREEN_VIOLATION / ERR_PED_CHECK_NOT_FAILING / ERR_PED_CLEARANCE_INSUFFICIENT /
  # ERR_APS_STANDARD_MISMATCH / ERR_SEQUENCE_INDEX_GAP / ERR_DUPLICATE_CORRIDOR_MEMBER /
  # ERR_CORRIDOR_NOT_SCREENED / ERR_CORRIDOR_NOT_SELECTED / ERR_CORRIDOR_PROJECT_ACTIVE /
  # ERR_BEFORE_STUDY_INCOMPLETE / ERR_STUDY_WINDOW_EXPIRED / ERR_CLOCK_NOT_MONOTONIC /
  # ERR_PLAN_COVERAGE_INCOMPLETE (calculations, validations and endpoints §1.9), and
  # ERR_TOD_WINDOW_OVERLAP / ERR_RUN_SPACING_VIOLATION / ERR_SCORE_BELOW_SELECT_THRESHOLD /
  # ERR_NO_ELIGIBLE_MEMBERS / ERR_POSTURE_BLOCKS_CERTIFICATION / ERR_COMPLAINT_PROJECT_MISMATCH /
  # ERR_PROJECT_TERMINAL / ERR_COMPLAINT_INVALID_STATE / ERR_PLAN_NOT_SUBMITTED (§1.8).
  # =============================================================================================
  - section: errors
    instances:
      - name: every_not_found_code_is_reachable_for_its_own_entity_type
        claim_type: error_triggerable
        grounds:
          - validations[priority 20 path-segment 404s]
          - validations[priority 25 request-body FK 404s]
          - errors.ERR_INTERSECTION_NOT_FOUND
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_REQUESTER_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_PHASE_SPLIT_NOT_FOUND
          - errors.ERR_PED_CHECK_NOT_FOUND
          - errors.ERR_PRIORITY_CONFIG_NOT_FOUND
          - errors.ERR_OBSERVATION_NOT_FOUND
          - errors.ERR_EVALUATION_NOT_FOUND
        distinguishing_aspect: "Each 404 code is entity-specific and is chosen from the segment or the FK field that failed to resolve, never from a generic NOT_FOUND: the SAME unknown UUID produces nine different codes depending on which endpoint it is offered to, and a request body carrying an unknown FK yields that FK's own code (priority 25) rather than the path's. A single shared code, or reporting the path entity's code for a body FK, fails here."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One intersection, one ARTERIAL corridor and one requester exist so that the FK-mixing calls have exactly one unresolvable field each. UNKNOWN denotes 11111111-1111-4111-8111-111111111111, which is not the id of any row."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
