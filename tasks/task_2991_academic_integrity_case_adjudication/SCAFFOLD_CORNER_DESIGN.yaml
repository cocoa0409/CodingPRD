              as: IntegrityOfficer
              captures: { case_v_decided: $.data.version }
            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_decided}", kind: "TRANSCRIPT_NOTATION_ONLY", ladder_rank: 4, effective_from: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sanction_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/sanctions/${sanction_id}/impose"
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notation/post"
              as: RegistrarOfficer
          trigger:
            - call: "POST /integrity/cases/${case_id}/notation/expungement-request"
              payload: { request_statement: "Please expunge - the sanction is not even served yet." }
              as: Student
              as_user_id: "${student_id}"
              captures: { err_request_while_imposed: $.data.error_id }
            - call: "POST /integrity/sanctions/${sanction_id}/complete"
              as: IntegrityOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-20T23:59:59Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notation/expungement-request"
              payload: { request_statement: "One second early." }
              as: Student
              as_user_id: "${student_id}"
              captures: { err_request_one_second_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-21T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notation/expungement-request"
              payload: { request_statement: "A full year has passed and my record is otherwise clean." }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/cases/${case_id}/notation/expungement-decision"
              payload: { decision: "DENY", decision_reason: "Statement lacks the required reflection." }
              as: RegistrarOfficer
            - call: "POST /integrity/cases/${case_id}/notation/expungement-request"
              payload: { request_statement: "Resubmitted with the reflection the registrar asked for." }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/cases/${case_id}/notation/expungement-decision"
              payload: { decision: "GRANT", decision_reason: "Requirements met." }
              as: RegistrarOfficer
            - call: "POST /integrity/cases/${case_id}/notation/post"
              as: RegistrarOfficer
              captures: { err_post_after_expunged: $.data.error_id }
            - call: "POST /integrity/cases/${case_id}/notation/expungement-decision"
              payload: { decision: "GRANT" }
              as: RegistrarOfficer
              captures: { err_decision_after_expunged: $.data.error_id }
          assert:
            - "after impose, Case.${case_id}.notation_status == PENDING_POSTING and expungement_eligible_at == null - rank 4 >= NOTATION_MIN_RANK but the sanction is only IMPOSED"
            - "after the registrar posts, Case.${case_id}.notation_status == POSTED, expungement_eligible_at is STILL null, and Student.${student_id}.transcript_notation == POSTED"
            - "the request made while the sanction is IMPOSED returns HTTP 409 with data.error_id == ERR_EXPUNGEMENT_TOO_EARLY"
            - "after complete, Sanction.${sanction_id}.status == COMPLETED with completed_at == 2026-08-21T00:00:00Z, Case.${case_id}.adjudication_status == CLOSED and notation_status is still POSTED"
            - "after complete, Case.${case_id}.expungement_eligible_at == 2027-08-21T00:00:00Z: MAX(2026-08-21T00:00:00Z + 365 d, 2026-08-20T10:00:00Z + 365 d)"
            - "the request at 2027-08-20T23:59:59Z returns HTTP 409 with data.error_id == ERR_EXPUNGEMENT_TOO_EARLY and notation_status stays POSTED"
            - "the request at exactly 2027-08-21T00:00:00Z returns HTTP 200 and Case.${case_id}.notation_status == EXPUNGEMENT_REQUESTED - the gate is >=, not >"
            - "the DENY moves notation_status to EXPUNGEMENT_DENIED while Student.${student_id}.transcript_notation is STILL POSTED"
            - "the second request from EXPUNGEMENT_DENIED returns HTTP 200 and notation_status == EXPUNGEMENT_REQUESTED - the deny/request cycle repeats"
            - "the GRANT moves notation_status to EXPUNGED and Student.${student_id}.transcript_notation == EXPUNGED - no other case of this student is POSTED"
            - "posting again returns HTTP 409 with data.error_id == ERR_NOTATION_STATE_INVALID (post requires PENDING_POSTING)"
            - "a second expungement-decision returns HTTP 409 with data.error_id == ERR_NOTATION_STATE_INVALID - EXPUNGED is terminal on the notation dimension"
            - "HearingSession.${session_id}.effective_vote_count == 3, panel_finding == RESPONSIBLE, panel_severity_recommendation == 4, quorum_required == 2"
            - "Case.${case_id}.recommended_ladder_rank == 4 - MAX(severity tier 3, panel recommendation 4) - and Sanction.${sanction_id}.ladder_rank == 4 sits inside the band [3, 5]"

      - name: hearing_lifecycle_preconditions_each_refuse_with_their_own_error_before_the_gate_opens
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.HearingSession
          - endpoints[POST /integrity/hearing-sessions/{id}/convene]
          - endpoints[POST /integrity/hearing-sessions/{id}/decide]
          - endpoints[POST /integrity/hearing-sessions/{id}/adjourn]
          - endpoints[POST /integrity/hearing-sessions/{id}/cancel]
          - errors.ERR_RESPONSE_WINDOW_OPEN
          - errors.ERR_SESSION_STATE_INVALID
          - errors.ERR_NOTATION_STATE_INVALID
        distinguishing_aspect: |
          The convene guard is the STUDENT'S response window, not the session's own state: with
          response_window_days 30 the deadline is 2026-08-31T00:00:00Z, so convening at the session's
          own start instant 2026-08-20T10:00:00Z returns ERR_RESPONSE_WINDOW_OPEN, and the identical
          call succeeds the moment the student acknowledges - nothing else changes. decide and adjourn
          on a SCHEDULED session, and cancel on a CONVENED one, each return ERR_SESSION_STATE_INVALID,
          while the notation endpoints on a case whose notation_status is NOT_APPLICABLE return
          ERR_NOTATION_STATE_INVALID rather than ERR_EXPUNGEMENT_TOO_EARLY.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; a FORMAL case notified with response_window_days 30 (deadline 2026-08-31T00:00:00Z) and NOT acknowledged"
            - "a hearing session scheduled for 2026-08-20T10:00:00Z..11:30:00Z; the clock is then moved to 2026-08-20T10:00:00Z"
