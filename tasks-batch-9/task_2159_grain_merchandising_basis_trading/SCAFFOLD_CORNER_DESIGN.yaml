              captures: { bid_a_id: $.data.id }
            - call: "POST /grain/bids/${bid_a_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-11-30", basis_cents: -28, max_bushels: 100000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_b_id: $.data.id }
          trigger:
            - call: "POST /grain/bids/${bid_b_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_BID"
