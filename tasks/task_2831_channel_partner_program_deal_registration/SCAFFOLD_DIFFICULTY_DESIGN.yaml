            - call: "POST /deal-registrations/${regc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${regc_id}/review"
              payload: { action: "REQUEST_CHANGES", reviewer_note: "add competitive landscape detail" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /deal-registrations/${regc_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pc_id}"
            - call: "POST /deal-registrations/${regc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${regc_id}/review"
