              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_bag_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { f_ver: $.data.version }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "PATCH /family-attributes/${a_bag_id}"
              payload: { override_price_cents: 3000 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /channel-publications/${pub_id}/resync"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
          assert:
            - "HTTP status is 200 with parity_state \"IN_PARITY\" and drift_reason == null"
            - "published_fee_fingerprint == \"ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3000\" and published_family_version == 6"
            - "last_resync_at == \"2026-08-01T00:00:00Z\" and ChannelPublication.version == 3"
            - "GET /distribution-channels/${ch_direct_id} reports content_parity_status \"COMPLIANT\" with parity_breach_count still 1 - the counter records history, the status records the present"
            - "GET /fare-families/${f_lite_id} still reports unbundled_value_cents 3000 and version 6: the resync moved the publication, not the family"

  # Error-catalog audit. Every one of the 60 ids in §1.6 is triggered somewhere:
  #   - the live instances below cover the ids no other section reaches;
  #   - ids already reached elsewhere in §1.9 are: ERR_MISSING_AUTH_HEADERS, ERR_ROLE_NOT_PERMITTED
  #     and ERR_SEGREGATION_OF_DUTIES (rbac), ERR_INVALID_REQUEST and ERR_SEAT_SEGMENT_NOT_FOUND and
  #     ERR_UPSELL_CYCLE_DETECTED (entities), ERR_FARE_FAMILY_NOT_FOUND and
  #     ERR_DISTRIBUTION_CHANNEL_NOT_FOUND (endpoints), ERR_FAMILY_STATE_INVALID and
  #     ERR_BOOKING_STATE_INVALID and ERR_FAMILY_HAS_NO_ATTRIBUTES (state_machines),
  #     ERR_CHANNEL_SCOPE_VIOLATION and ERR_DISCLOSURE_STATE_INVALID and
  #     ERR_DISCLOSURE_FINGERPRINT_MISMATCH and ERR_SEGMENT_EXCEEDS_CABIN and
  #     ERR_DELAY_THRESHOLD_NOT_MET and ERR_INVALID_ATTRIBUTE_QUANTITY and
  #     ERR_TOUCHPOINT_PHASE_MISMATCH (validations), ERR_STALE_FAMILY_VERSION and
  #     ERR_STALE_BOOKING_VERSION (cross_cutting_complexity_layers);
  #   - ids whose only trigger is a §1.8 depth probe are recorded as excluded_because stubs at the
  #     end of this section, so no id is left without a named owner.
  - section: errors
    instances:
      - name: unknown_catalog_and_inventory_path_ids_return_their_own_not_found_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ANCILLARY_PRODUCT_NOT_FOUND]
          - errors[ERR_FAMILY_ATTRIBUTE_NOT_FOUND]
          - errors[ERR_FLIGHT_NOT_FOUND]
          - errors[ERR_CHANNEL_PUBLICATION_NOT_FOUND]
          - validations[priority 4]
        distinguishing_aspect: "Priority 4 resolves each path id to its own error id rather than one generic 404: four syntactically valid but unknown UUIDs on four different collections answer four different error ids."
        test_recipe:
          setup:
            - "the store is empty of AncillaryProduct, FamilyAttribute, Flight and ChannelPublication rows"
          setup_api_calls: []
          trigger:
            - call: "GET /ancillary-products/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err_product: $.data.error_id }
            - call: "GET /family-attributes/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err_attribute: $.data.error_id }
            - call: "GET /flights/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err_flight: $.data.error_id }
            - call: "GET /channel-publications/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { err_publication: $.data.error_id }
          assert:
            - "every response is HTTP 404"
            - "err_product == \"ERR_ANCILLARY_PRODUCT_NOT_FOUND\" and err_attribute == \"ERR_FAMILY_ATTRIBUTE_NOT_FOUND\""
            - "err_flight == \"ERR_FLIGHT_NOT_FOUND\" and err_publication == \"ERR_CHANNEL_PUBLICATION_NOT_FOUND\""
            - "each body carries an error_id and a message and no data payload for the missing row"

      - name: unknown_booking_offer_assignment_and_waiver_ids_return_their_own_not_found_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_ANCILLARY_OFFER_NOT_FOUND]
          - errors[ERR_SEAT_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_IROPS_WAIVER_NOT_FOUND]
          - validations[priority 4]
        distinguishing_aspect: "The same priority-4 sweep covers the transactional half of the model, and the nested POST proves the path id is resolved left-to-right: an unknown booking_id in the path beats an unknown segment id in the body."
        test_recipe:
          setup:
            - "the store is empty of Booking, AncillaryOffer, SeatAssignment and IropsWaiver rows"
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-0000-0000-0000000000b1"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-001"
              captures: { err_booking: $.data.error_id }
            - call: "GET /ancillary-offers/00000000-0000-0000-0000-0000000000b2"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-001"
              captures: { err_offer: $.data.error_id }
            - call: "GET /seat-assignments/00000000-0000-0000-0000-0000000000b3"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-001"
              captures: { err_assignment: $.data.error_id }
            - call: "GET /irops-waivers/00000000-0000-0000-0000-0000000000b4"
              payload: {}
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err_waiver: $.data.error_id }
            - call: "POST /bookings/00000000-0000-0000-0000-0000000000b1/seat-assignments"
              payload: { seat_inventory_segment_id: "00000000-0000-0000-0000-0000000000b5", row: 12, seat_letter: "A" }
              as: ChannelPartner
              as_user_id: "cp-001"
              captures: { err_nested: $.data.error_id }
          assert:
            - "every response is HTTP 404"
            - "err_booking == \"ERR_BOOKING_NOT_FOUND\" and err_offer == \"ERR_ANCILLARY_OFFER_NOT_FOUND\""
            - "err_assignment == \"ERR_SEAT_ASSIGNMENT_NOT_FOUND\" and err_waiver == \"ERR_IROPS_WAIVER_NOT_FOUND\""
            - "err_nested == \"ERR_BOOKING_NOT_FOUND\", not ERR_SEAT_SEGMENT_NOT_FOUND: the path id is resolved before the body reference"

      - name: declining_an_already_declined_offer_returns_offer_state_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_STATE_INVALID]
          - validations[priority 11]
          - state_machines.AncillaryOffer.offer_status
        distinguishing_aspect: "Both write verbs on an offer demand offer_status PRESENTED, so a DECLINED offer refuses a second decline AND an accept with the same 409, leaving DECLINED as a terminal state."
        test_recipe:
          setup:
            - "HELD booking OFFST1 on DRAFT family ECO_BARE via DIRECT_WEB has one PRESENTED BAG_CHECKED_1 offer from a BOOKING session on PRESALE flight AC550 (booked_load_factor_pct 50)"
            - "the offer has already been declined once, so it sits in DECLINED"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC550", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 50, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "OFFST1", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer-sessions"
              payload: { touchpoint: "BOOKING", requested_product_ids: ["${p_bag_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "GET /ancillary-offers"
              payload: { booking_id: "${bk_id}", offer_status: "PRESENTED" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { off_id: "$.data[0].id" }
            - call: "POST /ancillary-offers/${off_id}/decline"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_ver: $.data.version }
          trigger:
            - call: "POST /ancillary-offers/${off_id}/decline"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err_decline: $.data.error_id }
            - call: "POST /ancillary-offers/${off_id}/accept"
              payload: { expected_booking_version: "${bk_ver}" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err_accept: $.data.error_id }
          assert:
            - "both responses are HTTP 409 with error_id \"ERR_OFFER_STATE_INVALID\""
            - "GET /ancillary-offers/${off_id} is still DECLINED with accepted_price_cents null"
            - "Booking.ancillary_gross_cents is still 0 and GET /bookings/${bk_id}/revenue-entries returns total_count == 0"
            - "the refused accept did not consume the booking version: GET /bookings/${bk_id} still reports version ${bk_ver}"

      - name: releasing_an_already_released_seat_returns_seat_assignment_state_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_ASSIGNMENT_STATE_INVALID]
          - validations[priority 12]
          - state_machines.SeatAssignment.assignment_state
        distinguishing_aspect: "The second release is refused at priority 12 and, decisively, does not double-credit inventory: the segment stays at available_seats 3, not 4."
        test_recipe:
          setup:
            - "flight AC551 (PRESALE, booked_load_factor_pct 50) has one OPEN MID SEAT_STANDARD segment rows 20..20 [A, B, C] base 2000 priced 2000"
            - "HELD booking SEATST on DRAFT family ECO_BARE via DIRECT_WEB held seat 20A and then released it with release_reason PASSENGER_RELEASE"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC551", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 20, row_end: 20, seat_letters: ["A", "B", "C"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_id: $.data.id }
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 50, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "SEATST", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_id}", row: 20, seat_letter: "A" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /seat-assignments/${sa_id}/release"
              payload: { release_reason: "PASSENGER_RELEASE" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
          trigger:
            - call: "POST /seat-assignments/${sa_id}/release"
              payload: { release_reason: "PASSENGER_RELEASE" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id \"ERR_SEAT_ASSIGNMENT_STATE_INVALID\""
            - "GET /seat-assignments/${sa_id} is still RELEASED with released_reason \"PASSENGER_RELEASE\" and price_charged_cents still 2000"
            - "GET /seat-segments/${seg_id} reports total_seats 3, held_seats 0, sold_seats 0 and available_seats 3 - the refused release credited nothing"
            - "SeatAssignment.version did not change on the refused call"

      - name: rescinding_an_already_rescinded_waiver_returns_waiver_state_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WAIVER_STATE_INVALID]
          - validations[priority 13]
          - state_machines.IropsWaiver.waiver_state
        distinguishing_aspect: "RESCINDED is terminal, and the refused second rescind must not re-run compensation: the flight stays RECOVERED with active_waiver_count 0 and rescind_reason keeps the first reason."
        test_recipe:
          setup:
            - "flight AC552 has one DELAY waiver (delay_minutes 240, waiver_scope [CHANGE]) that was declared and then rescinded with reason \"delay retracted\""
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "AC552", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/irops-waivers"
              payload: { event_type: "DELAY", delay_minutes: 240, waiver_scope: ["CHANGE"] }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { wv_id: $.data.id }
            - call: "POST /irops-waivers/${wv_id}/rescind"
              payload: { rescind_reason: "delay retracted" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "POST /irops-waivers/${wv_id}/rescind"
              payload: { rescind_reason: "second attempt" }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id \"ERR_WAIVER_STATE_INVALID\""
            - "GET /irops-waivers/${wv_id} is still RESCINDED with rescind_reason \"delay retracted\" - the refused call did not overwrite it"
            - "credited_bookings_count 0 and credited_amount_cents 0 (no booking was exposed to the waiver)"
            - "GET /flights/${fl_id} reports irops_state \"RECOVERED\" and active_waiver_count 0"

      - name: resyncing_an_in_parity_publication_returns_publication_state_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PUBLICATION_STATE_INVALID]
          - validations[priority 14]
          - state_machines.ChannelPublication.parity_state
        distinguishing_aspect: "Resync is only legal from OUT_OF_PARITY: an IN_PARITY publication is refused at priority 14 and its last_resync_at stays null, so nothing was silently re-pinned."
        test_recipe:
          setup:
            - "family ECO_PUB is PUBLISHED with one INCLUDED BAG_CHECKED_1 attribute and is published on DIRECT_WEB, so the publication is IN_PARITY and has never been resynced"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_PUB", name: "Economy Published", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_pub_id: $.data.id }
            - call: "POST /fare-families/${f_pub_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_pub_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_pub_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { f_ver: $.data.version }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_pub_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /channel-publications/${pub_id}/resync"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id \"ERR_PUBLICATION_STATE_INVALID\""
            - "GET /channel-publications/${pub_id} is still IN_PARITY with last_resync_at null and drift_reason null"
            - "published_fee_fingerprint is still \"ECO_PUB|1|BAG_CHECKED_1:INCLUDED:1:3500\" and ChannelPublication.version is unchanged at 2"
            - "GET /distribution-channels/${ch_direct_id} still reports content_parity_status \"COMPLIANT\" with parity_breach_count 0"

      - name: skipping_a_sales_phase_returns_phase_transition_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PHASE_TRANSITION_INVALID]
          - validations[priority 15]
          - state_machines.Flight.sales_phase
        distinguishing_aspect: "phase-advance accepts only the immediate successor: from PRESALE both the two-step jump to BOARDING and the no-op back to PRESALE are refused, and the flight is still in PRESALE afterwards."
        test_recipe:
          setup:
            - "flight AC553 was just created, so its sales_phase is PRESALE"
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "AC553", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
          trigger:
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "BOARDING" }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err_skip: $.data.error_id }
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "PRESALE" }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err_same: $.data.error_id }
          assert:
            - "both responses are HTTP 409 with error_id \"ERR_PHASE_TRANSITION_INVALID\""
            - "GET /flights/${fl_id} still reports sales_phase \"PRESALE\" and version 1"
            - "the next single-step advance to CHECKIN_OPEN then succeeds and leaves sales_phase \"CHECKIN_OPEN\""

      - name: writes_touching_a_departed_flight_return_flight_already_departed
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FLIGHT_ALREADY_DEPARTED]
          - validations[priority 16]
          - state_machines.Flight.sales_phase.terminal_states
        distinguishing_aspect: "DEPARTED is a hard write barrier for the whole flight aggregate: new inventory, a new booking, a new waiver and a fresh demand snapshot are all refused with the same 409 after the third phase-advance."
        test_recipe:
          setup:
            - "flight AC554 was advanced PRESALE -> CHECKIN_OPEN -> BOARDING -> DEPARTED with no bookings, segments or waivers on it"
            - "SEAT_STANDARD, family ECO_BARE (DRAFT) and channel DIRECT_WEB all exist"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
