  # ---------------------------------------------------------------------------
  - section: cross-cutting complexity layers
    instances:
      - name: occ_stale_member_version_on_membership_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[membership-supersede-stale-member]", "validations[priority=8]", entities.Member.fields.version]
        distinguishing_aspect: "After a first membership create bumps Member.version from 2 to 3, a second create still carrying expected_member_version=2 is rejected with ERR_STALE_MEMBER_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE member (version 2 after activate); one plan; first membership created (version -> 3)"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Occ", email: "occ@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms1: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 412"
            - "response error_id == ERR_STALE_MEMBER_VERSION"

      - name: occ_member_version_increments_on_activate
        claim_type: optimistic_concurrency
        grounds: [entities.Member.fields.version, state_machines.Member.PENDING_to_ACTIVE]
        distinguishing_aspect: "Member.version is 1 at create and increments to 2 after activate (the value clients pass as expected_member_version)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Vinc", email: "vinc@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
          assert:
            - "Member.${m_id}.version at create == 1"
            - "Member.${m_id}.version after activate == 2"

  # ---------------------------------------------------------------------------
  - section: consistency model
    instances:
      - name: membership_supersede_immediate_visibility
        claim_type: immediate
        grounds: [state_machines.Membership.ACTIVE_to_CANCELLED, entities.Membership.fields.status]
        distinguishing_aspect: "Creating a superseding membership sets the prior ACTIVE membership to CANCELLED, visible immediately in the same request cycle via GET."
        test_recipe:
          setup: ["ACTIVE member; first ACTIVE membership ms1; second membership created (supersede)"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Sup", email: "sup@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms1: "$.data.id" } }
            - { call: "GET /concierge/members/${m_id}", payload: {}, as: AccountManager, captures: { m_v2: "$.data.version" } }
          trigger:
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v2}" }, as: AccountManager, captures: { ms2: "$.data.id" } }
          assert:
            - "Membership.${ms1}.status == CANCELLED"
            - "Membership.${ms2}.status == ACTIVE"

