          model_code: PRI-RET-100
          car_class: GONDOLA
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: PRI_RET_LINE
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-20'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/PRI-L1/changeover
        payload:
          production_order_id: ${po_id}
          scheduled_start_date: '2026-09-02'
          scheduled_end_date: '2026-09-03'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-03'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_id}
        as: PlatformAdmin
        captures:
          car_id: $.data[0].id
      - call: POST /api/v1/lessees
        payload:
          legal_name: Priority Pair Rail Co
          credit_tier: B
          utilization_threshold_pct: 50
          credit_ceiling_cents: 60000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: NET
          per_diem_rate_cents: 1000
          liability_bearer: LESSEE
          term_start_date: '2026-09-01'
          term_end_date: '2027-09-01'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
      - call: POST /api/v1/car-assignments
        payload:
          lease_fleet_car_id: ${car_id}
          lease_contract_id: ${lc_id}
          lessee_id: ${lessee_id}
          start_date: '2026-09-05'
          end_date: '2026-10-05'
          mileage_allowance: 0
        as: LeaseAdministrator
        captures:
          asg_id: $.data.id
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: ${car_id}
          car_assignment_id: ${asg_id}
          return_date: '2026-10-05'
          mileage_since_last: 5000
          condition_grade: A
        as: LeaseAdministrator
        captures:
          ret1: $.data.id
      - call: POST /api/v1/car-returns/${ret1}/settle
        payload: {}
        as: PortfolioManager
      trigger:
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: ${car_id}
          car_assignment_id: ${asg_id}
          return_date: '2026-10-06'
          mileage_since_last: 100
          condition_grade: A
        as: LeaseAdministrator
        captures:
          err2: $.data.error_id
      - call: GET /api/v1/lessees/${lessee_id}/outstanding-balance
        as: PlatformAdmin
        captures:
          bal: $.data.outstanding_balance_cents
      - call: GET /api/v1/car-assignments/${asg_id}
        as: PlatformAdmin
        captures:
          asg_status: $.data.status
      assert:
      - 'Dual failure is live: the second POST /api/v1/car-returns violates priority 5 (category state,
        ERR_INVALID_STATE — assignment is COMPLETED) and priority 18 (category business_fiscal, ERR_CREDIT_LIMIT_EXCEEDED
        — 60000 balance plus a projected charge > 0 against a 60000 ceiling)'
      - 'Lower priority number wins: response error_id ${err2} == ERR_INVALID_STATE with http_status ==
        409, never ERR_CREDIT_LIMIT_EXCEEDED (402)'
      - 'First return ${ret1}: CarReturn.mileage_overage_cents == 60000 (blocks = ceil(30/30) = 1, included_miles
        = 1 * 0 = 0, overage = 5000 miles * 12 cents)'
      - 'Lessee ${lessee_id}: outstanding_balance_cents == ${bal} == 60000, unchanged by the rejected
        return — the business_fiscal charge never accrues because priority 5 short-circuits'
      - 'CarAssignment ${asg_id}: status == ${asg_status} == COMPLETED, unchanged by the rejected return'
  - name: business_safety_vs_business_referential_placement_conflict
    grounds:
