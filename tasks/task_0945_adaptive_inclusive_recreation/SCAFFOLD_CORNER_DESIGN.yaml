scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: participant_create_returns_intake_status_and_null_effective_tier
        claim_type: Creation
        grounds:
          - entities.Participant.fields.status
          - entities.Participant.fields.effective_support_tier
          - endpoints
        distinguishing_aspect: "POST /recreation/participants returns 201 with status INTAKE, version 1, effective_support_tier null and every submitted field echoed back."
        test_recipe:
          setup: ["Empty database; the logical clock is at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
          trigger:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
          assert:
            - "HTTP status 201"
            - "Participant.${p1}.status == INTAKE"
            - "Participant.${p1}.version == 1"
            - "Participant.${p1}.effective_support_tier is null"
            - "Participant.${p1}.household_id == 'HH-1' and Participant.${p1}.weight_kg == 40"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present and response.response_type == 'object'"

      - name: participant_age_years_is_computed_from_the_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.Participant.fields.age_years
          - calculations.consent_signer_authority
        distinguishing_aspect: "age_years is floor(years between date_of_birth and the logical clock date): a participant born 2008-06-01 reads 17 at the 2026-05-01 default and 18 once the clock moves to 2026-06-01."
        test_recipe:
          setup: ["One participant born 2008-06-01; the clock is at the 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Tess Aoki", date_of_birth: "2008-06-01", household_id: "HH-9", household_size: 2, income_band: "BAND_D", weight_kg: 60, mobility_profile: "AMBULATORY", guardianship_status: "SELF" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /recreation/participants/${p1}"
              payload: {}
              as: IntakeCoordinator
              captures: { age_before: "$.data.age_years" }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /recreation/participants/${p1}"
              payload: {}
              as: IntakeCoordinator
              captures: { age_after: "$.data.age_years" }
          assert:
            - "Participant.${p1}.age_years == 17 while the clock reads 2026-05-01T00:00:00Z"
            - "Participant.${p1}.age_years == 18 once the clock reads 2026-06-01T00:00:00Z"

      - name: participant_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /recreation/participants with limit 2 and offset 0 returns 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup: ["Three participants exist, created in a known order."]
          setup_api_calls:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ben Osei", date_of_birth: "2009-07-15", household_id: "HH-2", household_size: 3, income_band: "BAND_C", weight_kg: 45, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p2: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Cleo Vance", date_of_birth: "2008-11-02", household_id: "HH-3", household_size: 3, income_band: "BAND_C", weight_kg: 50, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p3: "$.data.id" }
          trigger:
            - call: "GET /recreation/participants"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /recreation/participants"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "First call: response_type == 'array', 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: 1 item, total_count == 3, has_more == false, offset == 2"

      - name: participant_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=11]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /recreation/participants/{participant_id} returns 404 ERR_PARTICIPANT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
          trigger:
            - call: "GET /recreation/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status 404 with data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "response.response_type == 'error'"

      - name: participant_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=22]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required weight_kg field on POST /recreation/participants returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
          trigger:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status 400 with data.error_id == ERR_VALIDATION"
            - "GET /recreation/participants returns total_count 0"

      - name: participant_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Participant.fields.status
          - entities.Participant.common_fields
        distinguishing_aspect: "Client-supplied values for the server-owned status and version fields are ignored: the row is still created with status INTAKE and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
          trigger:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED", status: "ACTIVE", version: 99 }
              as: IntakeCoordinator
              captures: { p1: "$.data.id" }
          assert:
            - "Participant.${p1}.status == INTAKE (the submitted ACTIVE is ignored)"
            - "Participant.${p1}.version == 1 (the submitted 99 is ignored)"

      - name: activity_program_optional_fields_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ActivityProgram.fields.required_consent_types
          - entities.ActivityProgram.fields.requires_medication_admin
          - entities.ActivityProgram.fields.required_equipment_model_code
          - entities.ActivityProgram.fields.session_count_created
        distinguishing_aspect: "Creating a program without required_consent_types, required_certification_types, requires_medication_admin or the equipment fields yields empty arrays, false, nulls and session_count_created 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /recreation/activity-programs"
              payload: { name: "Minimal Program", activity_type: "ARTS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1 }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
          assert:
            - "ActivityProgram.${prog}.required_consent_types == []"
            - "ActivityProgram.${prog}.required_certification_types == []"
            - "ActivityProgram.${prog}.requires_medication_admin == false"
            - "ActivityProgram.${prog}.required_equipment_model_code is null and required_equipment_size_code is null"
            - "ActivityProgram.${prog}.session_count_created == 0"

      - name: goal_rating_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.GoalRating.common_fields
          - entities.GoalRating.fields.rated_session_start_at
        distinguishing_aspect: "GoalRating is declared common_fields: false, so a created rating exposes id and created_at but no version and no update endpoint exists for it in §1.5."
        excluded_because:
          difficulty_instance: goal_enters_then_leaves_mastered_as_newer_ratings_arrive
          rationale: "The §1.8 mastery instance already creates ratings and reads them back; the immutability claim is asserted there through the absence of any mutation path and the pinned rated_session_start_at."

      - name: fee_band_missing_for_household_returns_fee_band_not_found
        claim_type: Parent Relationships
        grounds:
          - calculations.fee_scale_band_match
          - validations[priority=18]
          - errors[ERR_FEE_BAND_NOT_FOUND]
        distinguishing_aspect: "Enrolling a BAND_D participant when only a BAND_C row exists makes calculations.fee_scale_band_match return an empty candidate set, so POST /recreation/enrollments returns 404 ERR_FEE_BAND_NOT_FOUND and no Enrollment is created."
        test_recipe:
          setup:
            - "Only one FeeScaleBand exists, covering BAND_C."
            - "One ACTIVE BAND_D participant and one OPEN session."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Yoga", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Dara Kim", date_of_birth: "2010-03-04", household_id: "HH-4", household_size: 3, income_band: "BAND_D", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: "$.data.version" }
          trigger:
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status 404 with data.error_id == ERR_FEE_BAND_NOT_FOUND"
            - "GET /recreation/enrollments filtered by session_id ${sess} returns total_count 0"
            - "GET /recreation/enrollment-charges returns total_count 0"

      - name: enrollment_charge_is_discoverable_only_through_the_filtered_list
        claim_type: Retrieval
        grounds:
          - entities.EnrollmentCharge.fields.enrollment_id
          - endpoints
        distinguishing_aspect: "The EnrollmentCharge synthesised by POST /recreation/enrollments never appears in the enrollment response; GET /recreation/enrollment-charges?enrollment_id=... is its only discovery channel and returns exactly one row."
        test_recipe:
          setup: ["One ACTIVE participant with one REQUESTED enrollment on an OPEN session priced at 4000 cents."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Yoga", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
          trigger:
            - call: "GET /recreation/enrollment-charges"
              payload: { enrollment_id: "${e1}" }
              as: FundingOfficer
              captures: { ch: "$.data[0].id", ch_fee: "$.data[0].program_fee_cents" }
            - call: "GET /recreation/enrollment-charges/${ch}"
              payload: {}
              as: FundingOfficer
              captures: { ch_status: "$.data.status" }
          assert:
            - "The filtered list returns total_count 1"
            - "EnrollmentCharge.${ch}.program_fee_cents == 4000 and copay_cents == 4000"
            - "EnrollmentCharge.${ch}.status == QUOTED because the enrollment is still REQUESTED"
            - "EnrollmentCharge.${ch}.fee_scale_band_id == ${band_c} and EnrollmentCharge.${ch}.enrollment_id == ${e1}"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_an_already_cancelled_session_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProgramSession.OPEN_to_CANCELLED
          - validations[priority=27]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CANCELLED is terminal on the ProgramSession axis, so a second cancel returns 409 ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE, and nothing changes."
        test_recipe:
          setup: ["One program with a session that has been opened and cancelled while empty."]
          setup_api_calls:
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Yoga", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/program-sessions/${sess}/cancel"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /recreation/program-sessions/${sess}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status 409 with data.error_id == ERR_ALREADY_TERMINAL"
            - "ProgramSession.${sess}.status == CANCELLED"

      - name: unlock_staffing_on_an_open_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProgramSession.STAFFING_LOCKED_to_OPEN
          - validations[priority=26]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "OPEN is not a declared from-state for unlock-staffing and it is not terminal, so the call returns 409 ERR_INVALID_STATE and unlock_count stays 0 — the contrast partner of the ALREADY_TERMINAL corner."
        test_recipe:
          setup: ["One OPEN session with no enrollments and one staff member for the ActivityLead identity."]
          setup_api_calls:
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Yoga", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Dana Lead", role_title: "Recreation Therapist" }
              as: ProgramAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /recreation/program-sessions/${sess}/unlock-staffing"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status 409 with data.error_id == ERR_INVALID_STATE"
            - "ProgramSession.${sess}.status == OPEN and ProgramSession.${sess}.unlock_count == 0"

      - name: participant_cycles_active_inactive_active
        claim_type: Valid Transition
        grounds:
          - state_machines.Participant.ACTIVE_to_INACTIVE
          - state_machines.Participant.INACTIVE_to_ACTIVE
          - entities.Participant.fields.status
        distinguishing_aspect: "The Participant axis re-enters ACTIVE: a row moved ACTIVE -> INACTIVE -> ACTIVE ends at ACTIVE with version 5, proving the axis is cyclic and each transition bumps version."
        test_recipe:
          setup: ["One participant with an ACTIVE support assessment, currently in status ACTIVE."]
          setup_api_calls:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "INACTIVE" }
              as: IntakeCoordinator
              captures: { st_inactive: "$.data.status" }
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { st_active: "$.data.status", v_final: "$.data.version" }
          assert:
            - "Participant.${p1}.status == INACTIVE after the first trigger call"
            - "Participant.${p1}.status == ACTIVE after the second trigger call"
            - "Participant.${p1}.version == 6 at the end (1 at create, 2 after the assessment create, 3 after the activation, 4 after the first ACTIVE, 5 after INACTIVE, 6 after the second ACTIVE)"
            - "Participant.${p1}.effective_support_tier == INDEPENDENT throughout"

      - name: participant_exit_discontinues_goals_and_withdraws_future_enrollments
        claim_type: Cascade down
        grounds:
          - state_machines.Participant.ACTIVE_to_EXITED
          - state_machines.Goal.ACTIVE_to_DISCONTINUED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
