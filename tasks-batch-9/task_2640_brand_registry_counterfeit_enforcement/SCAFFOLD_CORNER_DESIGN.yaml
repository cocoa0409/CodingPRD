          setup:
            - "A RECORDED recordation for [2026-07-01, 2026-08-10] and an OPEN BORDER_SEIZURE investigation opened under it at 2026-08-05T08:00:00Z, whose response_due_at is 2026-08-14T08:00:00Z (7 business days)"
            - "The clock is then advanced to 2026-08-12T09:00:00Z: past expires_on, still inside the detention window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
