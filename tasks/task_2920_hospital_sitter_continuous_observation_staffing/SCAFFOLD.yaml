  # --------------------------------------------------------------- writes: Unit
  - method: POST
    path: "/observation/units"
    description: "Register a nursing unit with its observation-labor budget"
    roles: [NurseManager, SystemAdmin]
    code: 201
    input: [unit_code, name, observation_cost_budget_cents, "video_monitoring_enabled?"]
    output: Unit
    side_effects:
      - "status = OPEN, restriction_reason = null, observed_cost_to_date_cents = 0, open_order_count = 0"
      - "video_monitoring_enabled defaults to false when omitted"

  - method: POST
    path: "/observation/units/{id}/cost-close"
    description: "Close the unit's observation cost period through close_through_utc and compute the tiered coverage surcharge per calculations.unit_daily_observation_charge; optionally raise the budget, which is what lifts a RESTRICTED unit back to OPEN"
    roles: [StaffingCoordinator, SystemAdmin]
    code: 200
    input: [close_through_utc, "budget_increase_cents?"]
    output: { subtotal_cents: integer, coverage_surcharge_pct: number, coverage_surcharge_cents: integer, charge_total_cents: integer, unit_status: string, unit_version: integer }
    side_effects:
      - "subtotal_cents = sum(CostEntry.amount_cents WHERE unit_id == this unit AND status == POSTED AND posted_at < close_through_utc) — the bound is strict"
      - "coverage_surcharge_pct is selected from the subtotal ALONE per calculations.unit_daily_observation_charge; charge_total_cents = subtotal_cents + coverage_surcharge_cents"
      - "when budget_increase_cents is supplied it is added to Unit.observation_cost_budget_cents BEFORE the RESTRICTED -> OPEN precondition is evaluated"
      - "Unit transitions RESTRICTED -> OPEN (restriction_reason = null) when observed_cost_to_date_cents < observation_cost_budget_cents and no ObservationOrder on this unit is LAPSED"
      - "no CostEntry row is created, mutated or reversed by this endpoint"
      - "increments Unit.version by 1"

  # ------------------------------------------------------------ writes: Patient
  - method: POST
    path: "/observation/patients"
    description: "Admit a patient to a unit"
    roles: [NurseManager, SystemAdmin]
    code: 201
    input: [unit_id, mrn, full_name, age_years]
    output: Patient
    side_effects:
      - "status = ADMITTED, discharged_at = null"

  - method: POST
    path: "/observation/patients/{id}/discharge"
    description: "Discharge the patient; drives the four-hop order/assignment/ledger/unit cascade documented on ObservationOrder -> DISCONTINUED"
    roles: [NurseManager, SystemAdmin]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "Patient ADMITTED -> DISCHARGED with discharged_at = clock_now"
      - "every non-terminal ObservationOrder of this patient -> DISCONTINUED (created_at ASC)"
      - "their SitterAssignment rows: ON_WATCH|ON_BREAK -> COMPLETED with completion_reason = ORDER_DISCONTINUED and documentation_status PENDING -> WAIVED; SCHEDULED -> VOIDED"
      - "each COMPLETED assignment closes its open segment, posts a FINAL_SEGMENT CostEntry and reverses its PROVISIONAL CostEntry; each VOIDED assignment only reverses its PROVISIONAL CostEntry"
      - "Unit.observed_cost_to_date_cents recomputed; Unit OPEN -> RESTRICTED when the head reaches the budget"
      - "every ACTIVE VideoFeed on each discontinued order -> RELEASED with release_reason = ORDER_TERMINATED, cascading to station counters and observer availability"
      - "increments the version of every mutated entity by 1 each"

  # -------------------------------------------------------------- writes: Staff
  - method: POST
    path: "/observation/staff"
    description: "Register an observation staff member sourced from the internal float pool, an agency, or the trained-volunteer pool"
    roles: [StaffingCoordinator, SystemAdmin]
    code: 201
    input: [home_unit_id, full_name, source_pool, hourly_rate_cents, competency_level, deescalation_cert_expires_on]
    output: Staff
    side_effects:
      - "status = AVAILABLE, suspension_reason = null, last_shift_end_at = null, total_watch_minutes = 0"

  - method: POST
    path: "/observation/staff/{id}/certifications"
    description: "Record completed competency training and a renewed de-escalation certification; this is the only path out of SUSPENDED"
    roles: [StaffingCoordinator, SystemAdmin]
    code: 200
    input: [competency_level, deescalation_cert_expires_on]
    output: Staff
    side_effects:
      - "sets competency_level and deescalation_cert_expires_on from the request"
      - "Staff SUSPENDED -> AVAILABLE with suspension_reason = null, but only when deescalation_cert_expires_on > clock_now"
      - "a Staff in AVAILABLE or ON_ASSIGNMENT keeps its status; only the certification fields move"
      - "increments Staff.version by 1"

  # --------------------------------------------------- writes: ObservationOrder
  - method: POST
    path: "/observation/orders"
    description: "Write a continuous-observation order against the fall / elopement / self-harm criteria; the admission-baseline risk score and the reassessment interval are derived at creation"
    roles: [AttendingProvider, SystemAdmin]
    code: 201
    input: [patient_id, ordering_provider_user_id, risk_categories, required_modality, clinical_rationale]
    output: ObservationOrder
    side_effects:
      - "status = ACTIVE; elopement_risk_score computed by calculations.patient_elopement_risk_score variant `admission_baseline`; risk_score_variant = ADMISSION_BASELINE"
      - "reassessment_interval_hours computed from that score; last_reassessed_at = clock_now; next_reassessment_due_at = clock_now + reassessment_interval_hours"
      - "reassessment_count = 0; coverage_gap_flag = false"
      - "when required_modality == VIDEO_MONITORING the video gate (validations priority 14) is enforced at creation"
      - "Unit.open_order_count is recomputed for the patient's unit and Unit.version increments by 1"

  - method: POST
    path: "/observation/orders/{id}/reassessments"
    description: "Perform a risk reassessment at (or before) the interval; re-scores the order with the rolling event-weighted variant and rebases the interval clock"
    roles: [AttendingProvider, SystemAdmin]
    code: 201
    input: [risk_categories_after]
    output: Reassessment
    side_effects:
      - "creates an immutable Reassessment with performed_by_user_id = caller X-User-ID, score_before, score_after, interval_hours_after and reassessed_at = clock_now"
      - "ObservationOrder REASSESSMENT_DUE -> ACTIVE, or ACTIVE -> ACTIVE for an early reassessment"
      - "sets ObservationOrder.risk_categories = request.risk_categories_after; recomputes elopement_risk_score with variant `rolling_event_weighted` and sets risk_score_variant = ROLLING_EVENT_WEIGHTED"
      - "recomputes reassessment_interval_hours; sets last_reassessed_at = clock_now and next_reassessment_due_at = clock_now + reassessment_interval_hours"
      - "increments reassessment_count by 1 and ObservationOrder.version by 1"

  - method: POST
    path: "/observation/orders/{id}/discontinuation-review"
    description: "Open the discontinuation review for an order that has been reassessed at least once"
    roles: [AttendingProvider, SystemAdmin]
    code: 200
    input: [recommendation]
    output: ObservationOrder
    side_effects:
      - "ObservationOrder ACTIVE -> DISCONTINUATION_REVIEW"
      - "sets discontinuation_recommendation = request.recommendation and discontinuation_review_opened_by_user_id = caller X-User-ID"
      - "the order becomes immune to the clock reassessment sweep while in DISCONTINUATION_REVIEW"
      - "increments ObservationOrder.version by 1"

  - method: POST
    path: "/observation/orders/{id}/discontinuation-decision"
    description: "Approve or reject the discontinuation review; APPROVE terminates the order and cascades to assignments, ledger and feeds. Segregation of duties: the decider may not be the ordering provider"
    roles: [AttendingProvider, SystemAdmin]
    code: 200
    input: [decision, "rationale?"]
    output: ObservationOrder
    side_effects:
      - "decision == APPROVE: DISCONTINUATION_REVIEW -> DISCONTINUED with discontinued_at = clock_now, blocked when any SafetyEvent on the order occurred within the trailing 24h (inclusive)"
      - "decision == APPROVE cascade: SCHEDULED assignments -> VOIDED; ON_WATCH|ON_BREAK assignments -> COMPLETED with completion_reason = ORDER_DISCONTINUED; ACTIVE feeds -> RELEASED with release_reason = ORDER_TERMINATED"
      - "decision == REJECT: DISCONTINUATION_REVIEW -> ACTIVE, clears discontinuation_recommendation and discontinuation_review_opened_by_user_id, and rebases last_reassessed_at = clock_now"
      - "increments ObservationOrder.version by 1 (and the version of every entity mutated by the cascade)"

  # -------------------------------------------------- writes: SitterAssignment
  - method: POST
    path: "/observation/sitter-assignments"
    description: "Schedule a one-to-one sitter watch against an order. Requires the caller's last-observed order version (OCC). Posts the PROVISIONAL labor charge immediately"
    roles: [StaffingCoordinator, SystemAdmin]
    code: 201
    input: [order_id, staff_id, shift_start_at, shift_end_at, expected_order_version, "float_authorization_code?"]
    output: SitterAssignment
    side_effects:
      - "rejects with ERR_STALE_ORDER_VERSION (412) when expected_order_version != ObservationOrder.version"
      - "watch_status = SCHEDULED, documentation_status = PENDING; scheduled_minutes = whole minutes of [shift_start_at, shift_end_at)"
      - "provisional_cost_cents computed by calculations.assignment_labor_cost variant `provisional`; a PROVISIONAL CostEntry is posted with status POSTED, posted_at = clock_now, segment_index = null, segment_minutes = null"
      - "Unit.observed_cost_to_date_cents recomputed; Unit OPEN -> RESTRICTED when the head reaches the budget"
      - "Staff.last_shift_end_at recomputed; Staff.status is NOT changed at scheduling time"
      - "increments ObservationOrder.version by 1 (so a second request replaying the same expected_order_version fails), plus Unit.version and Staff.version by 1 each"

  - method: POST
    path: "/observation/sitter-assignments/{id}/start-watch"
    description: "The assigned sitter begins the watch; opens the first billable segment and takes the observer on duty"
    roles: [Sitter, SystemAdmin]
    code: 200
    input: []
    output: SitterAssignment
    side_effects:
      - "watch_status SCHEDULED -> ON_WATCH; current_segment_started_at = clock_now"
      - "Staff AVAILABLE -> ON_ASSIGNMENT"
      - "increments SitterAssignment.version and Staff.version by 1 each"

  - method: POST
    path: "/observation/sitter-assignments/{id}/break-start"
    description: "Start break relief; closes and bills the open watch segment at the final variant"
    roles: [Sitter, SystemAdmin]
    code: 200
    input: []
    output: SitterAssignment
    side_effects:
      - "watch_status ON_WATCH -> ON_BREAK; break_started_at = clock_now; current_segment_started_at = null"
      - "posts one FINAL_SEGMENT CostEntry per calculations.assignment_labor_cost variant `final` with segment_index = watch_segment_count + 1 and segment_minutes = whole minutes of the closed segment"
      - "watch_segment_count, watched_minutes, Staff.total_watch_minutes and Unit.observed_cost_to_date_cents are recomputed; Unit OPEN -> RESTRICTED when the head reaches the budget"
      - "increments SitterAssignment.version, Staff.version and Unit.version by 1 each"

  - method: POST
    path: "/observation/sitter-assignments/{id}/break-end"
    description: "Return from break relief; opens the next billable segment. Break minutes are never billed"
    roles: [Sitter, SystemAdmin]
    code: 200
    input: []
    output: SitterAssignment
    side_effects:
      - "watch_status ON_BREAK -> ON_WATCH; current_segment_started_at = clock_now; break_started_at = null"
      - "no CostEntry is written"
      - "increments SitterAssignment.version by 1"

  - method: POST
    path: "/observation/sitter-assignments/{id}/complete"
    description: "End the watch. HANDOFF_COMPLETE requires a signed handoff; SHIFT_END_NO_SUCCESSOR flags a coverage gap on the order. Reconciles the provisional charge against the summed per-segment finals"
    roles: [Sitter, SystemAdmin]
    code: 200
    input: [completion_reason]
    output: SitterAssignment
    side_effects:
      - "watch_status ON_WATCH -> COMPLETED; closes the open segment and posts its FINAL_SEGMENT CostEntry"
      - "sets the assignment's PROVISIONAL CostEntry to REVERSED with reversed_at = clock_now; amount_cents is never edited"
      - "final_cost_cents = sum of this assignment's POSTED FINAL_SEGMENT amounts"
      - "Unit.observed_cost_to_date_cents recomputed from the POSTED set; Staff ON_ASSIGNMENT -> AVAILABLE"
      - "completion_reason == HANDOFF_COMPLETE requires documentation_status == HANDOFF_SIGNED, else ERR_HANDOFF_NOT_SIGNED (422)"
      - "completion_reason == SHIFT_END_NO_SUCCESSOR sets documentation_status -> WAIVED and, while the order is non-terminal, ObservationOrder.coverage_gap_flag = true"
      - "increments SitterAssignment.version, Staff.version, Unit.version and (when flagged) ObservationOrder.version by 1 each"

  - method: POST
    path: "/observation/sitter-assignments/{id}/void"
    description: "Void a watch that has not started; compensates the provisional charge exactly"
    roles: [NurseManager, SystemAdmin]
    code: 200
    input: []
    output: SitterAssignment
    side_effects:
      - "watch_status SCHEDULED -> VOIDED with voided_at = clock_now; documentation_status PENDING -> WAIVED"
      - "sets the assignment's PROVISIONAL CostEntry to REVERSED with reversed_at = clock_now"
      - "Unit.observed_cost_to_date_cents recomputed; a reversal never changes Unit.status"
      - "increments SitterAssignment.version and Unit.version by 1 each"

  # ------------------------------------------------------- writes: HandoffRecord
  - method: POST
    path: "/observation/handoffs"
    description: "The outgoing sitter drafts the shift-handoff documentation naming the incoming watch on the same order"
    roles: [Sitter, SystemAdmin]
    code: 201
    input: [outgoing_assignment_id, incoming_assignment_id, behavior_summary, interventions_used]
    output: HandoffRecord
    side_effects:
      - "creates the HandoffRecord in documentation_state = DRAFTED with countersigned_by_staff_id = null"
      - "outgoing assignment documentation_status PENDING -> HANDOFF_DRAFTED; its watch_status is untouched"
      - "increments SitterAssignment.version by 1"

  - method: POST
    path: "/observation/handoffs/{id}/countersign"
    description: "The incoming sitter countersigns the handoff. Segregation of duties: the countersigner may not be the outgoing sitter"
    roles: [Sitter, SystemAdmin]
    code: 200
    input: []
    output: HandoffRecord
    side_effects:
      - "HandoffRecord DRAFTED -> SIGNED with countersigned_by_staff_id = caller X-User-ID and countersigned_at = clock_now"
      - "outgoing assignment documentation_status HANDOFF_DRAFTED -> HANDOFF_SIGNED; its watch_status is untouched"
      - "increments HandoffRecord.version and SitterAssignment.version by 1 each"

  # --------------------------------------------------- writes: MonitoringStation
  - method: POST
    path: "/observation/monitoring-stations"
    description: "Open a remote-observation console for a trained observer with its declared span-of-control ceiling"
    roles: [StaffingCoordinator, SystemAdmin]
    code: 201
    input: [observer_staff_id, station_label, declared_max_span]
    output: MonitoringStation
    side_effects:
      - "status = IDLE, active_feed_count = 0, active_acuity_weight = 0.0, effective_span_limit = declared_max_span"

  - method: POST
    path: "/observation/monitoring-stations/{id}/offline"
    description: "Take the console offline; permanently terminal. Rejected while any feed on it is still ACTIVE"
    roles: [RemoteObserver, SystemAdmin]
    code: 200
    input: []
    output: MonitoringStation
    side_effects:
      - "status IDLE -> OFFLINE with offlined_at = clock_now"
      - "an attempt from ACTIVE_MONITORING is rejected with ERR_STATION_HAS_ACTIVE_FEEDS (409)"
      - "increments MonitoringStation.version by 1"

  # ---------------------------------------------------------- writes: VideoFeed
  - method: POST
    path: "/observation/video-feeds"
    description: "Admit an order onto a remote console as the video-monitoring alternative to a one-to-one sitter. Admission is gated by the acuity-weighted span-of-control limit over the overlapping ACTIVE feeds"
    roles: [RemoteObserver, SystemAdmin]
    code: 201
    input: [station_id, order_id, monitor_start_at, monitor_end_at]
    output: VideoFeed
    side_effects:
      - "status = ACTIVE; acuity_weight frozen = sum(FEED_ACUITY_WEIGHTS[c] for c in the order's risk_categories)"
      - "admission per calculations.feed_admission_overlap_capacity: the span limit is read from the station BEFORE this feed is counted, and occupancy counts the candidate"
      - "station recomputes active_feed_count, active_acuity_weight and effective_span_limit; MonitoringStation IDLE -> ACTIVE_MONITORING and observer Staff AVAILABLE -> ON_ASSIGNMENT on the first admitted feed"
      - "increments MonitoringStation.version and (when it moved) Staff.version by 1 each"

  - method: POST
    path: "/observation/video-feeds/{id}/release"
    description: "The observer releases a feed from the console"
    roles: [RemoteObserver, SystemAdmin]
    code: 200
    input: []
    output: VideoFeed
    side_effects:
      - "status ACTIVE -> RELEASED with release_reason = OBSERVER_RELEASE and released_at = clock_now"
      - "station recomputes active_feed_count, active_acuity_weight and effective_span_limit; when active_feed_count reaches 0 the station transitions ACTIVE_MONITORING -> IDLE and the observer Staff ON_ASSIGNMENT -> AVAILABLE (a SUSPENDED observer stays SUSPENDED)"
      - "increments VideoFeed.version and MonitoringStation.version by 1 each"

  # --------------------------------------------------------- writes: SafetyEvent
  - method: POST
    path: "/observation/safety-events"
    description: "Report a safety event observed under continuous observation. reported_by_staff_id is taken from the caller's X-User-ID; when assignment_id is supplied the caller MUST be that assignment's sitter. ELOPEMENT_ATTEMPT and AGGRESSION escalate the order"
    roles: [Sitter, RemoteObserver]
    code: 201
    input: [order_id, event_kind, narrative, "assignment_id?"]
    output: SafetyEvent
    side_effects:
      - "status = REPORTED; occurred_at = clock_now; reported_by_staff_id = caller X-User-ID"
      - "event_kind IN {ELOPEMENT_ATTEMPT, AGGRESSION}: ObservationOrder ACTIVE|REASSESSMENT_DUE -> ESCALATED; required_modality is NOT changed"
      - "event_kind IN {FALL_WITH_INJURY, SELF_HARM_ATTEMPT}: the order's status is unchanged; the event waits for the incident-review branch"
      - "increments ObservationOrder.version by 1 when the order transitioned"

  - method: POST
    path: "/observation/safety-events/{id}/escalate-response"
    description: "Record the immediate escalation response for an attempted-elopement or aggression event (the non-modality branch)"
    roles: [SafetyOfficer, SystemAdmin]
    code: 200
    input: [response_actions]
    output: SafetyEvent
    side_effects:
      - "status REPORTED -> ESCALATED_RESPONSE; sets response_actions = request.response_actions"
      - "review_opened_by_user_id stays null, which makes the close-time segregation-of-duties check vacuous on this branch"
      - "no ObservationOrder, VideoFeed, MonitoringStation or Staff field is mutated"
      - "increments SafetyEvent.version by 1"

  - method: POST
    path: "/observation/safety-events/{id}/open-incident-review"
    description: "Open the incident review for a fall-with-injury or self-harm event. Forces the order back to one-to-one sitter observation, which cascades through feeds, consoles and observer availability, and suspends the sitter who was on watch"
    roles: [SafetyOfficer, SystemAdmin]
    code: 200
    input: []
    output: SafetyEvent
    side_effects:
      - "status REPORTED -> INCIDENT_REVIEW; review_opened_by_user_id = caller X-User-ID"
      - "CASCADE hop 1: ObservationOrder.required_modality = ONE_TO_ONE_SITTER"
      - "CASCADE hop 2: every ACTIVE VideoFeed on the order -> RELEASED with release_reason = MODALITY_FORCED_TO_SITTER (created_at ASC)"
      - "CASCADE hop 3: each affected MonitoringStation recomputes its counters; a station reaching active_feed_count 0 goes ACTIVE_MONITORING -> IDLE"
      - "CASCADE hop 4: the observer Staff of each idled station goes ON_ASSIGNMENT -> AVAILABLE"
      - "recomputes elopement_risk_score with variant `rolling_event_weighted`, reassessment_interval_hours and next_reassessment_due_at"
      - "AFTER the four hops: when assignment_id is non-null the watching Staff -> SUSPENDED with suspension_reason = INCIDENT_REVIEW_OPENED, so SUSPENDED wins over any AVAILABLE written by hop 4"
      - "increments the version of every mutated entity by 1 each"

  - method: POST
    path: "/observation/safety-events/{id}/close"
    description: "Close the event with a disposition. Segregation of duties: the closer may not be the officer who opened the incident review. review_findings is mandatory on the incident-review branch"
    roles: [SafetyOfficer, SystemAdmin]
    code: 200
    input: [resolution, "review_findings?"]
    output: SafetyEvent
    side_effects:
      - "status ESCALATED_RESPONSE|INCIDENT_REVIEW -> CLOSED; sets resolution, closed_by_user_id = caller X-User-ID and (incident-review branch) review_findings"
      - "when the owning ObservationOrder is ESCALATED and no other non-CLOSED SafetyEvent remains on it, the order transitions ESCALATED -> ACTIVE"
      - "recomputes elopement_risk_score with variant `rolling_event_weighted`, reassessment_interval_hours and next_reassessment_due_at (last_reassessed_at is NOT moved)"
      - "resolution == MODALITY_ESCALATED: required_modality = ONE_TO_ONE_SITTER and every ACTIVE VideoFeed on the order -> RELEASED with release_reason = MODALITY_FORCED_TO_SITTER"
      - "increments the version of every mutated entity by 1 each"

  # ------------------------------------------------- test-driving: logical clock
  - method: POST
    path: "/observation/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time before the first call. Every advance runs the reassessment sweep as a side effect"
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string, orders_marked_reassessment_due: integer, orders_lapsed: integer }
    side_effects:
      - "sets the logical clock to request.current_utc; the new value MUST be >= the current logical clock (a rewind is rejected with ERR_INVALID_REQUEST)"
      - "reassessment sweep: ACTIVE orders whose next_reassessment_due_at <= new clock -> REASSESSMENT_DUE; REASSESSMENT_DUE orders past next_reassessment_due_at + 6h -> LAPSED"
      - "sweep order is ascending next_reassessment_due_at, tie-break created_at ASC, at most one transition per order per call"
      - "each LAPSED order releases its ACTIVE feeds (release_reason = ORDER_TERMINATED) and sets its patient's Unit to RESTRICTED with restriction_reason = OBSERVATION_ORDER_LAPSED"
      - "increments the version of every mutated entity by 1 each"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / identity
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent or empty-string" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "X-User-Role is not among the endpoint's declared roles, or is not a declared role at all" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity_backed caller (Sitter, RemoteObserver) acts on a resource whose owning Staff.id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The discontinuation decider equals ObservationOrder.ordering_provider_user_id, the event closer equals SafetyEvent.review_opened_by_user_id, or the handoff countersigner equals the outgoing assignment's staff_id" }

  # ---- request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required input field, undeclared enum member, out-of-range integer, empty or duplicate-bearing array, unparseable ISO-8601 instant, or a logical-clock rewind" }

  # ---- existence
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "No Unit with the referenced id (path segment or body FK)" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "No Patient with the referenced id" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "No Staff with the referenced id, including an X-User-ID that names no Staff for an entity_backed role" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "No ObservationOrder with the referenced id" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No SitterAssignment with the referenced id" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "No MonitoringStation with the referenced id" }
  - { id: ERR_FEED_NOT_FOUND, http: 404, condition: "No VideoFeed with the referenced id" }
  - { id: ERR_HANDOFF_NOT_FOUND, http: 404, condition: "No HandoffRecord with the referenced id" }
  - { id: ERR_SAFETY_EVENT_NOT_FOUND, http: 404, condition: "No SafetyEvent with the referenced id" }
  - { id: ERR_REASSESSMENT_NOT_FOUND, http: 404, condition: "No Reassessment with the referenced id" }
  - { id: ERR_COST_ENTRY_NOT_FOUND, http: 404, condition: "No CostEntry with the referenced id" }

  # ---- optimistic concurrency
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "POST /observation/sitter-assignments carries expected_order_version != the current ObservationOrder.version" }

  # ---- state
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "The ObservationOrder's status does not permit the requested transition (includes terminal DISCONTINUED / LAPSED lockdown and scheduling a watch on a terminal order)" }
  - { id: ERR_INVALID_ASSIGNMENT_STATE, http: 409, condition: "The SitterAssignment's watch_status does not permit the requested transition (e.g. break-start from SCHEDULED, void from ON_WATCH, complete from ON_BREAK, or any second attempt at a terminal transition)" }
  - { id: ERR_INVALID_STATION_STATE, http: 409, condition: "The MonitoringStation is OFFLINE and can no longer accept feeds or be re-offlined" }
  - { id: ERR_INVALID_FEED_STATE, http: 409, condition: "The VideoFeed is already RELEASED" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "The SafetyEvent's status does not permit the branch requested: escalate-response on a FALL_WITH_INJURY / SELF_HARM_ATTEMPT event, open-incident-review on an ELOPEMENT_ATTEMPT / AGGRESSION event, a branch call from a non-REPORTED status, or a close from REPORTED or CLOSED" }
  - { id: ERR_INVALID_HANDOFF_STATE, http: 409, condition: "The HandoffRecord is already SIGNED, or the outgoing assignment's documentation_status is not PENDING when a handoff is drafted" }
  - { id: ERR_PATIENT_DISCHARGED, http: 409, condition: "The order's Patient is DISCHARGED, so no order write or reassessment is accepted for it" }
  - { id: ERR_STAFF_NOT_AVAILABLE, http: 409, condition: "start-watch is called while the assignment's Staff.status is ON_ASSIGNMENT (already on another watch or staffing a console) or SUSPENDED" }
  - { id: ERR_RECENT_SAFETY_EVENT_BLOCKS_DISCONTINUATION, http: 409, condition: "discontinuation-decision APPROVE while at least one SafetyEvent on the order has occurred_at >= clock_now - 24h (an event exactly 24h old still blocks)" }

  # ---- business: safety / competency
  - { id: ERR_DEESCALATION_CERT_EXPIRED, http: 422, condition: "The staff member's deescalation_cert_expires_on is <= clock_now at the moment a watch or a feed is created" }
  - { id: ERR_COMPETENCY_INSUFFICIENT, http: 422, condition: "Staff.competency_level is NOT_TRAINED, or is BASIC on an order whose risk_categories include SELF_HARM (ADVANCED required)" }
  - { id: ERR_STAFF_SUSPENDED, http: 422, condition: "The staff member's status is SUSPENDED when a watch or feed is created" }
  - { id: ERR_VOLUNTEER_NOT_ELIGIBLE, http: 422, condition: "A VOLUNTEER-pool staff member is assigned to an order whose risk_categories include SELF_HARM or ELOPEMENT" }
  - { id: ERR_VIDEO_MODALITY_NOT_PERMITTED, http: 422, condition: "Video monitoring is requested while the unit has video_monitoring_enabled false, the order includes SELF_HARM, or elopement_risk_score >= 6.0" }

  # ---- business: temporal
  - { id: ERR_STAFF_SHIFT_OVERLAP, http: 409, condition: "The candidate shift half-open window overlaps a non-VOIDED shift already held by the same staff member" }
  - { id: ERR_STAFF_REST_BUFFER_VIOLATION, http: 409, condition: "The candidate shift does not overlap but leaves fewer than 480 whole minutes of rest against an adjacent shift of the same staff member" }
  - { id: ERR_INVALID_SHIFT_WINDOW, http: 422, condition: "shift_end_at <= shift_start_at, or the window exceeds MAX_SHIFT_MINUTES (720)" }
  - { id: ERR_OUTSIDE_SHIFT_WINDOW, http: 422, condition: "start-watch is called before shift_start_at - 15 minutes or at/after shift_end_at" }
  - { id: ERR_BREAK_NOT_YET_ELIGIBLE, http: 422, condition: "break-start is called before 120 whole minutes have elapsed on the currently open watch segment" }
  - { id: ERR_BREAK_TOO_SHORT, http: 422, condition: "break-end is called before 15 whole minutes of break have elapsed" }

  # ---- business: capacity / uniqueness
  - { id: ERR_SPAN_OF_CONTROL_EXCEEDED, http: 409, condition: "Overlapping ACTIVE feeds on the station plus the candidate exceed the station's pre-candidate effective_span_limit" }
  - { id: ERR_STATION_HAS_ACTIVE_FEEDS, http: 409, condition: "offline is called on a station whose active_feed_count is greater than 0" }
  - { id: ERR_DUPLICATE_ACTIVE_FEED, http: 409, condition: "The order already has an ACTIVE VideoFeed" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "Unit.unit_code or Patient.mrn is already taken" }

  # ---- business: referential / documentation
  - { id: ERR_FLOAT_AUTHORIZATION_MISSING, http: 422, condition: "Staff.home_unit_id differs from the order patient's unit_id and float_authorization_code is absent or empty" }
  - { id: ERR_HANDOFF_ORDER_MISMATCH, http: 422, condition: "The incoming assignment belongs to a different order than the outgoing assignment, or the two assignment ids are equal" }
  - { id: ERR_HANDOFF_NOT_SIGNED, http: 422, condition: "complete is called with completion_reason HANDOFF_COMPLETE while documentation_status is not HANDOFF_SIGNED" }
  - { id: ERR_REVIEW_FINDINGS_REQUIRED, http: 422, condition: "close is called on an INCIDENT_REVIEW event without a non-empty review_findings" }
  - { id: ERR_REASSESSMENT_REQUIRED_BEFORE_REVIEW, http: 422, condition: "discontinuation-review is opened on an order whose reassessment_count is 0" }

  # ---- business: fiscal
  - { id: ERR_UNIT_BUDGET_EXCEEDED, http: 402, condition: "Unit.observed_cost_to_date_cents + the candidate provisional_cost_cents would strictly exceed Unit.observation_cost_budget_cents" }
  - { id: ERR_UNIT_RESTRICTED_AGENCY_BLOCKED, http: 402, condition: "An AGENCY-pool watch is scheduled on a unit whose status is RESTRICTED" }

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# Two roles are entity_backed:Staff — Sitter and RemoteObserver — so every
# ownership check compares X-User-ID against a Staff.id. The other five are
# opaque operator identities. Every GET endpoint is readable by all seven roles;
# the write surface is partitioned, and three write pairs additionally require
# two DIFFERENT user ids of the SAME role (segregation of duties).
# =============================================================================
roles:
  - name: AttendingProvider
    description: "Orders continuous observation, performs risk reassessments, opens the discontinuation review and renders the discontinuation decision"
    identity: "opaque"
    exclusive_operations:
      - "POST /observation/orders"
      - "POST /observation/orders/{id}/reassessments"
      - "POST /observation/orders/{id}/discontinuation-review"
      - "POST /observation/orders/{id}/discontinuation-decision"
    shared_operations:
      - "every GET under /observation"
    notes: "Segregation of duties: the X-User-ID that renders the discontinuation-decision MUST differ from ObservationOrder.ordering_provider_user_id, so two distinct AttendingProvider user ids are always required to terminate an order through review."

  - name: NurseManager
    description: "Registers units and admits/discharges patients, and voids scheduled watches"
    identity: "opaque"
    exclusive_operations:
      - "POST /observation/units"
      - "POST /observation/patients"
      - "POST /observation/patients/{id}/discharge"
      - "POST /observation/sitter-assignments/{id}/void"
    shared_operations:
      - "every GET under /observation"

  - name: StaffingCoordinator
    description: "Sources the observation pool (internal float, agency, trained volunteers), schedules watches, opens consoles, records competency training and closes the unit cost period"
    identity: "opaque"
    exclusive_operations:
      - "POST /observation/staff"
      - "POST /observation/staff/{id}/certifications"
      - "POST /observation/sitter-assignments"
      - "POST /observation/monitoring-stations"
      - "POST /observation/units/{id}/cost-close"
    shared_operations:
      - "every GET under /observation"

  - name: Sitter
    description: "The one-to-one patient safety attendant who keeps the watch, takes break relief, drafts and countersigns handoff documentation and reports safety events"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /observation/sitter-assignments/{id}/start-watch"
      - "POST /observation/sitter-assignments/{id}/break-start"
      - "POST /observation/sitter-assignments/{id}/break-end"
      - "POST /observation/sitter-assignments/{id}/complete"
      - "POST /observation/handoffs"
      - "POST /observation/handoffs/{id}/countersign"
    shared_operations:
      - "POST /observation/safety-events"
      - "every GET under /observation"
    notes: "X-User-ID is a Staff.id and MUST equal the assignment's staff_id for every watch operation. Segregation of duties: the countersigning Sitter MUST be the incoming assignment's staff_id and MUST differ from the outgoing assignment's staff_id, so a handoff always involves two distinct Sitter user ids."

  - name: RemoteObserver
    description: "The centralized video-monitoring observer who admits and releases feeds on a console, takes the console offline and reports events seen on camera"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /observation/video-feeds"
      - "POST /observation/video-feeds/{id}/release"
      - "POST /observation/monitoring-stations/{id}/offline"
    shared_operations:
      - "POST /observation/safety-events"
      - "every GET under /observation"
    notes: "X-User-ID is a Staff.id and MUST equal MonitoringStation.observer_staff_id for every console and feed operation."

  - name: SafetyOfficer
    description: "Runs the post-event workflow: records the escalation response, opens the incident review and closes the event with a disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /observation/safety-events/{id}/escalate-response"
      - "POST /observation/safety-events/{id}/open-incident-review"
      - "POST /observation/safety-events/{id}/close"
    shared_operations:
      - "every GET under /observation"
    notes: "Segregation of duties: the X-User-ID that closes an INCIDENT_REVIEW event MUST differ from SafetyEvent.review_opened_by_user_id, so two distinct SafetyOfficer user ids are always required to close an incident review. The check is vacuous on the ESCALATED_RESPONSE branch, where review_opened_by_user_id is null."

  - name: SystemAdmin
    description: "Operator identity that drives the logical clock and may exercise any non-Staff-owned write for test setup"
    identity: "opaque"
    exclusive_operations:
      - "POST /observation/_clock/set_current_utc"
    shared_operations:
      - "every POST under /observation except POST /observation/safety-events (whose reported_by_staff_id must be a real Staff.id, so only Sitter and RemoteObserver may report)"
      - "every GET under /observation"
    notes: "SystemAdmin is opaque, so no ownership check applies to it; it is nevertheless still subject to every state, temporal, capacity, referential and fiscal validation."
