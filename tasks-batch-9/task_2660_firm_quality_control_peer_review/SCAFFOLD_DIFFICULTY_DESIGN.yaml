  # =====================================================================
  # Rule 7 - cross_entity_state_dependency
  # Three distinct entity pairs, each with an explicit unblocking step so the
  # gate is shown to open only when the other entity reaches the right state.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: engagement_eqr_cleared_gated_on_concurred_quality_review
        grounds:
          - state_machines.Engagement.EQR_PENDING_to_EQR_CLEARED
          - state_machines.EngagementQualityReview.ASSIGNED_to_IN_PROGRESS
          - state_machines.EngagementQualityReview.IN_PROGRESS_to_CONCURRED
          - errors[ERR_EQR_NOT_CONCURRED]
          - entities.Engagement.fields.eqr_required
          - entities.Engagement.fields.eqr_concurred_at
        distinguishing_aspect: |
          Pair Engagement <-> EngagementQualityReview: an engagement with eqr_required true cannot leave
          EQR_PENDING while its review is merely ASSIGNED or IN_PROGRESS - both attempts must fail with
          ERR_EQR_NOT_CONCURRED - and the same call succeeds the moment the review reaches CONCURRED,
          at which point eqr_concurred_at becomes non-null. A guard that only checks for the existence
          of a review, or that checks state != WITHDRAWN, passes the first attempt.
        test_recipe:
          setup:
            - "Firm 'Thurlow Cane LLP' with engagement partner Eli Parch, QC director Quinn Cade and EQ reviewer Sable Ord (EQ_REVIEWER, cpe_hours_last_3y 200, no client history)."
            - "Engagement 'Cinder Utilities' is AUDIT and is_public_interest true, so eqr_required is true."
            - "An EngagementQualityReview is ASSIGNED to Sable Ord and the engagement has been moved to workflow_state EQR_PENDING."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Thurlow Cane LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Sable Ord", cpa_license_state: "CA", designations: ["EQ_REVIEWER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_rev_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Cinder Utilities", engagement_type: "AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}", is_public_interest: true }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${eng_v}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { eqr_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
          trigger:
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { gate_error_one: $.data.error_id }
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { gate_error_two: $.data.error_id }
            - call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCURRED" }
              as: EngagementQualityReviewer
              as_user_id: "${p_rev_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_EQR_NOT_CONCURRED"
            - "the third trigger call returns HTTP 409 with error_id ERR_EQR_NOT_CONCURRED"
            - "the fifth trigger call returns HTTP 200"
            - "Engagement.${e1_id}.eqr_required == true"
            - "Engagement.${e1_id}.workflow_state == EQR_CLEARED"
            - "Engagement.${e1_id}.eqr_concurred_at != null"
            - "EngagementQualityReview.${eqr_id}.state == CONCURRED"
            - "EngagementQualityReview.${eqr_id}.concern_round_count == 0"
            - "Partner.${p_rev_id}.open_eqr_count == 0"

      - name: peer_review_fieldwork_gated_on_concluded_internal_inspection
        grounds:
          - state_machines.PeerReview.SCOPE_SET_to_FIELDWORK
          - state_machines.InternalInspection.SELECTION_COMPLETE_to_CONCLUDED
          - errors[ERR_INSPECTION_NOT_CONCLUDED]
          - calculations.peer_review_hours_scope
          - entities.InternalInspection.fields.inspection_year
          - entities.PeerReview.fields.total_scope_hours
        distinguishing_aspect: |
          A different pair, PeerReview <-> InternalInspection: SCOPE_SET -> FIELDWORK is refused with
          ERR_INSPECTION_NOT_CONCLUDED while the firm's highest-year InternalInspection is only
          SELECTION_COMPLETE, and the identical call succeeds once that inspection reaches CONCLUDED.
          The dependency is on the highest inspection_year specifically, not on the existence of any
          concluded cycle.
        test_recipe:
          setup:
            - "Firm 'Underhill Sway LLP' (aa_hours_last_year 400) has a QC director but no Engagement rows, so the review's must_select_categories is [] and total_scope_hours is 16."
            - "PeerReview for year_end 2026-12-31 is assigned to PeerReviewer 'Kestrel Peer Review PC' and has been scoped, so it sits in state SCOPE_SET."
            - "InternalInspection 2024 has run its (empty) selector and sits in state SELECTION_COMPLETE, not CONCLUDED."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Underhill Sway LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
