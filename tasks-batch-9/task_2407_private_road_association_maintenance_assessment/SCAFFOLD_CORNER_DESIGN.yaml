              as_user_id: "sec-1"
          assert:
            - "the first PATCH on the SUBDIVIDED parcel B returns HTTP 409 with error_id ERR_CERTIFIED_ROLL_LOCKED, not ERR_PARCEL_NOT_ACTIVE"
            - "the PATCH on the ACTIVE parcel A returns HTTP 409 with error_id ERR_CERTIFIED_ROLL_LOCKED as well, so the lock is a roll-level freeze rather than a parcel-status effect"
            - "the recall returns HTTP 200 with status DRAFT and recall_count 1"
            - "the repeated PATCH on parcel B now returns HTTP 409 with error_id ERR_PARCEL_NOT_ACTIVE, the priority-15 rule the lock had been masking"
            - "the PATCH on parcel A now returns HTTP 200 with usage_class COMMERCIAL, trips_per_day 10, frontage_share_units 420.0 (240 * 1.75), trip_share_units 298.0 (10 * 25 + 240 * 0.20) and version 2"

