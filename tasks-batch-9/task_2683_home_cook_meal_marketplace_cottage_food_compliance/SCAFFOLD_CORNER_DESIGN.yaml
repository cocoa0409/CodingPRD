      - name: order_cancellations_release_hub_slots_and_restore_the_capacity_counter
        claim_type: side_effect_execution
        grounds:
          - state_machines.Order.ROUTED_to_CANCELLED
          - state_machines.Order.PLACED_to_CANCELLED
          - state_machines.PickupHub.OPEN_to_CLOSED
          - state_machines.PickupHub.CLOSED_to_OPEN
          - state_machines.ProductionWindow.CUTOFF_PASSED_to_IN_PRODUCTION
          - calculations.effective_production_capacity
        distinguishing_aspect: >
          One world exercising three different side-effect flavours on the same counters: the window's
          CUTOFF_PASSED -> IN_PRODUCTION sweep is a CONDITIONAL cascade that cancels only the still
          PLACED order and leaves the ROUTED one alone; the diner cancel of the ROUTED order releases
          a hub slot, which re-opens a hub that had auto-closed at slot_capacity_orders == 1; and
          committed_meals walks 0 -> 3 -> 5 -> 3 -> 0 so the spoilage reserve and effective capacity
          return exactly to their pre-placement values.
        test_recipe:
          setup:
            - "StatePolicy CA; logical clock 2026-08-01T00:00:00Z; cook Dara ACTIVE with one APPROVED MenuItem at 400 cents, no refrigeration."
            - "ProductionWindow W: cutoff 2026-08-05T00:00:00Z, handoff 2026-08-08T16:00:00Z..18:00:00Z, capacity_meals 20."
            - "DeliveryZone HUB-01 with service_mode HUB_PICKUP; PickupHub H1 with slot_capacity_orders 1 staffed 2026-08-08T15:00:00Z..19:00:00Z."
            - "Order A (qty 3, diner-a) and Order B (qty 2, diner-b) both placed on W."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-0001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_id: "$.data.id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cook_v1: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_id: "$.data.id" }
            - call: POST /onboarding-documents/${cert_id}/review
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /onboarding-documents/${insp_id}/review
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: rev-2
            - call: POST /cooks/${cook_id}/onboarding-decision
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Sourdough Loaf", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 400, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
