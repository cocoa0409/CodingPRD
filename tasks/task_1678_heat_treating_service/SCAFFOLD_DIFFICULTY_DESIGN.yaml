            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_b: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_a: $.data.id, load_a_v: $.data.version } }
            - { call: "POST /load-batches/${load_a}/assignments", payload: { work_order_id: "${wo_a}", expected_load_batch_version: "${load_a_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_a}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_a}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_a}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T17:00:00Z" }, as: ShopScheduler, captures: { load_b: $.data.id, load_b_v: $.data.version } }
            - { call: "POST /load-batches/${load_b}/assignments", payload: { work_order_id: "${wo_b}", expected_load_batch_version: "${load_b_v}" }, as: ShopScheduler, captures: { asgmt_b: $.data.id } }
            - { call: "POST /load-batches/${load_b}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_b}/start-run", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "POST /load-batches/${load_b}/abort", payload: {}, as: FurnaceOperator }
          assert:
            - "LoadBatch.${load_a}.status == COMPLETED; WorkOrder.${wo_a}.processing_status == PROCESSED with energy_surcharge_cents == 13300"
            - "LoadBatch.${load_b}.status == ABORTED and total_weight_lb == 0"
            - "LoadAssignment.${asgmt_b}.status == REMOVED"
            - "WorkOrder.${wo_b}.processing_status == RECEIVED (abort branch reverts, does not process)"

  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scrap_disposition_four_hop_cascade
        grounds:
          - state_machines.DispositionCase.OPEN_to_DECIDED
          - state_machines.WorkOrder.PROCESSED_to_SCRAPPED
          - state_machines.LiabilityClaim.PENDING_to_ACCEPTED
          - entities.CustomerAccount.fields.outstanding_liability_exposure_cents
        distinguishing_aspect: |
          Depth-4 chain from the decide trigger: DispositionCase DECIDED causes
          WorkOrder PROCESSED -> SCRAPPED, which itself causes LiabilityClaim
          creation (PENDING, payout 300000), which itself causes
          CustomerAccount.outstanding_liability_exposure_cents 0 -> 300000.
        test_recipe:
          setup:
            - "STANDARD customer; order (declared 1000000, charge 100000) processed, FAILed, awaiting disposition; customer exposure 0"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Cascade Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 1000000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
          trigger:
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "SCRAP" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "GET /liability-claims?work_order_id=${wo_id}", payload: {}, as: CustomerServiceRep, captures: { claim_id : "$.data[0].id", claim_payout : "$.data[0].payout_cents" } }
            - { call: "GET /customer-accounts/${cust_id}", payload: {}, as: CustomerServiceRep }
          assert:
            - "DispositionCase.${case_id}.status == DECIDED (hop 1)"
            - "WorkOrder.${wo_id}.processing_status == SCRAPPED (hop 2)"
            - "LiabilityClaim.${claim_id}.status == PENDING and payout_cents == 300000 (hop 3)"
            - "CustomerAccount.${cust_id}.outstanding_liability_exposure_cents == 300000 (hop 4)"

      - name: pyrometry_fail_hold_and_requalify_cascade
        grounds:
          - calculations.furnace_qualification_posture
          - state_machines.LoadBatch.BUILDING_to_HOLD
          - state_machines.LoadBatch.HOLD_to_BUILDING
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (PyrometryRecord creation):
          a FAIL TUS record recomputes Furnace.qualification_status to
          UNQUALIFIED, and that furnace mutation itself pushes the BUILDING
          load to HOLD; a later PASS record reverses the chain (QUALIFIED,
          load back to BUILDING).
        test_recipe:
          setup:
            - "QUALIFIED furnace (TUS + calibration PASS 2026-08-01); one BUILDING load with one assignment"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Hold Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
          trigger:
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-02T00:00:00Z", result: "FAIL" }, as: CalibrationTech }
            - { call: "GET /furnaces/${furn_id}", payload: {}, as: ShopScheduler, captures: { posture_fail: $.data.qualification_status } }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_hold: $.data.status } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-05T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "GET /furnaces/${furn_id}", payload: {}, as: ShopScheduler, captures: { posture_pass: $.data.qualification_status } }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_back: $.data.status } }
          assert:
            - "After FAIL record: Furnace.qualification_status == UNQUALIFIED (hop 1) and LoadBatch.status == HOLD (hop 2)"
            - "After the later PASS TUS (performed 2026-08-05, next_due 2026-11-03): Furnace.qualification_status == QUALIFIED"
            - "LoadBatch.${load_id}.status returns to BUILDING (compensating hop)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_error_beats_furnace_safety_error
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_LOAD_NOT_BUILDING]
          - errors[ERR_FURNACE_NOT_QUALIFIED]
        distinguishing_aspect: |
          Category pair {state, business_safety}: a release attempt on a
          RUNNING load while the furnace is UNQUALIFIED must return
          ERR_LOAD_NOT_BUILDING (priority 5), not ERR_FURNACE_NOT_QUALIFIED
          (priority 6).
        test_recipe:
          setup:
            - "Load released and started on a QUALIFIED furnace; a FAIL TUS record then flips the furnace to UNQUALIFIED while the load stays RUNNING"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Prio Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-02T00:00:00Z", result: "FAIL" }, as: CalibrationTech }
          trigger:
            - call: "POST /load-batches/${load_id}/release"
              payload: {}
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOAD_NOT_BUILDING with http 409 — the state precondition (priority 5) beats the furnace-qualification safety check (priority 6)"

      - name: existence_beats_temporal_on_work_order_create
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_RECIPE_NOT_FOUND]
          - errors[ERR_INVALID_GUARANTEE_WINDOW]
        distinguishing_aspect: |
          Category pair {existence, business_temporal} — disjoint from the
          first instance's {state, business_safety}: creating a RUSH work
          order with a nonexistent recipe_id AND a 2-hour guarantee must
          return ERR_RECIPE_NOT_FOUND (priority 4), not
          ERR_INVALID_GUARANTEE_WINDOW (priority 8).
        test_recipe:
          setup:
            - "One existing customer; no recipe with id 00000000-0000-0000-0000-000000000000"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Ghost Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", recipe_id: "00000000-0000-0000-0000-000000000000", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 2 }
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECIPE_NOT_FOUND with http 404 — existence (priority 4) beats the guarantee-window temporal rule (priority 8)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: load_weight_exactly_at_capacity_allowed
        grounds:
          - calculations.load_weight_utilization
          - errors[ERR_LOAD_WEIGHT_EXCEEDED]
        distinguishing_aspect: |
          Weight metric on the assignments endpoint: a running total exactly
          equal to Furnace.max_load_weight_lb (1000 = 600 + 400) is accepted;
          one more pound (1001) is rejected — the boundary is strictly-greater.
        test_recipe:
          setup:
            - "Customer, APPROVED recipe, QUALIFIED furnace max_load_weight_lb 1000; BUILDING load; orders of 600, 400, and 1 lb"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Cap Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 600, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_600: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 400, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_400: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 1, received_weight_lb: 1, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_1: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_600}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_400}", expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v3: $.data.version, total_w: $.data.total_weight_lb } }
          trigger:
            - call: "POST /load-batches/${load_id}/assignments"
              payload: { work_order_id: "${wo_1}", expected_load_batch_version: "${load_v3}" }
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "After 600 + 400: LoadBatch.total_weight_lb == 1000 and both assignments succeeded (== max is allowed)"
            - "Adding 1 lb: error_id == ERR_LOAD_WEIGHT_EXCEEDED with http 422 (1001 strictly > 1000)"

      - name: retreat_count_at_max_rejected
        grounds:
          - errors[ERR_RETREAT_LIMIT_REACHED]
          - entities.WorkOrder.fields.retreat_count
          - state_machines.DispositionCase.OPEN_to_DECIDED
        distinguishing_aspect: |
          Count metric on the decide endpoint: with recipe max_retreats == 1,
          the first RE_TREAT (retreat_count 0 < 1) succeeds and the second
          (retreat_count 1 == 1) is rejected — a different metric and endpoint
          than the weight boundary.
        test_recipe:
          setup:
            - "Order processed and FAILed twice with one full RE_TREAT cycle between (two loads); retreat_count == 1, second DispositionCase OPEN"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Retreat Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load1: $.data.id, load1_v: $.data.version } }
            - { call: "POST /load-batches/${load1}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load1_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load1}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load1}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load1}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case1 : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case1}/decide", payload: { decision: "RE_TREAT" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-03T08:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ShopScheduler, captures: { load2: $.data.id, load2_v: $.data.version } }
            - { call: "POST /load-batches/${load2}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load2_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load2}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load2}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load2}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}&status=OPEN", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case2 : "$.data[0].id" } }
          trigger:
            - call: "POST /disposition-cases/${case2}/decide"
              payload: { decision: "RE_TREAT" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { err: $.data.error_id }
          assert:
            - "First RE_TREAT succeeded with retreat_count 0 < 1; after it retreat_count == 1"
            - "Second RE_TREAT: error_id == ERR_RETREAT_LIMIT_REACHED with http 422 (retreat_count 1 == max_retreats 1)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_gated_on_furnace_posture
        grounds:
          - state_machines.LoadBatch.BUILDING_to_RELEASED
          - calculations.furnace_qualification_posture
          - errors[ERR_FURNACE_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair LoadBatch x Furnace: a fully built load on a furnace with
          no passing pyrometry records (qualification_status UNQUALIFIED)
          cannot transition BUILDING -> RELEASED.
        test_recipe:
          setup:
            - "Customer, APPROVED recipe, furnace with NO pyrometry records; BUILDING load with one assignment"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Gate Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
          trigger:
            - call: "POST /load-batches/${load_id}/release"
              payload: {}
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "Furnace.${furn_id}.qualification_status == UNQUALIFIED (no pyrometry records)"
            - "error_id == ERR_FURNACE_NOT_QUALIFIED with http 422; LoadBatch remains BUILDING"

      - name: assignment_gated_on_work_order_state
        grounds:
          - state_machines.WorkOrder.RECEIVED_to_SCHEDULED
          - errors[ERR_WORK_ORDER_NOT_ASSIGNABLE]
        distinguishing_aspect: |
          Entity pair LoadAssignment x WorkOrder (different pair than
          LoadBatch x Furnace): an order already SCHEDULED in load A cannot be
          assigned into load B — only RECEIVED or AWAITING_RETREAT orders are
          assignable.
        test_recipe:
          setup:
            - "One order assigned to BUILDING load A (now SCHEDULED); second BUILDING load B empty"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Double Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_a: $.data.id, load_a_v: $.data.version } }
            - { call: "POST /load-batches/${load_a}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_a_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-03T08:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ShopScheduler, captures: { load_b: $.data.id, load_b_v: $.data.version } }
          trigger:
            - call: "POST /load-batches/${load_b}/assignments"
              payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_b_v}" }
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "WorkOrder.${wo_id}.processing_status == SCHEDULED after assignment to load A"
            - "Assignment to load B: error_id == ERR_WORK_ORDER_NOT_ASSIGNABLE with http 409"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: furnace_schedule_buffered_purge_gap
        grounds:
          - errors[ERR_FURNACE_SCHEDULE_OVERLAP]
          - errors[ERR_QUENCH_PURGE_GAP_VIOLATION]
        distinguishing_aspect: |
          Buffered-adjacency interval semantics on the Furnace schedule
          resource: loads with different quench media adjacent by less than
          the 60-minute purge buffer are rejected, identical-media adjacency
          at gap 0 is allowed, and true overlap is a distinct error.
        test_recipe:
          setup:
            - "Furnace supporting OIL and WATER; APPROVED OIL recipe and APPROVED WATER recipe; released OIL load occupying [2026-08-02T08:00, 2026-08-02T12:00]"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Gap Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_oil: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_oil}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "304SS", spec_code: "AMS2759", soak_temp_f: 1900, soak_tolerance_f: 15, min_soak_minutes: 45, quench_media: "WATER", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.01, hardness_min_hrc: 20, hardness_max_hrc: 30 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_water: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_water}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL", "WATER"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_oil}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_oil}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load1: $.data.id, load1_v: $.data.version } }
            - { call: "POST /load-batches/${load1}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load1_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load1}/release", payload: {}, as: ShopScheduler }
          trigger:
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_water}", scheduled_start_at: "2026-08-02T12:30:00Z", scheduled_end_at: "2026-08-02T14:00:00Z" }
              as: ShopScheduler
              captures: { err_gap: $.data.error_id }
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_oil}", scheduled_start_at: "2026-08-02T12:00:00Z", scheduled_end_at: "2026-08-02T14:00:00Z" }
              as: ShopScheduler
              captures: { load2: $.data.id }
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_oil}", scheduled_start_at: "2026-08-02T11:00:00Z", scheduled_end_at: "2026-08-02T13:00:00Z" }
              as: ShopScheduler
              captures: { err_overlap: $.data.error_id }
          assert:
            - "WATER load at 12:30 (30 min after OIL load ends): error_id == ERR_QUENCH_PURGE_GAP_VIOLATION (gap 30 < 60 purge buffer, different media)"
            - "OIL load at 12:00 (gap 0, same media): created successfully (adjacency without buffer allowed)"
            - "OIL load at 11:00 overlapping [08:00, 12:00]: error_id == ERR_FURNACE_SCHEDULE_OVERLAP with http 409"

      - name: pyrometry_validity_containment_at_release
        grounds:
          - errors[ERR_PYROMETRY_WINDOW_VIOLATION]
          - calculations.pyrometry_next_due
        distinguishing_aspect: |
          Containment interval semantics on the PyrometryRecord validity
          resource (different resource and different geometry than the
          buffered-adjacency schedule rule): a load window must lie fully
          inside [performed_at, next_due_at); a window crossing next_due is
          rejected at release even though the furnace is QUALIFIED today.
        test_recipe:
          setup:
            - "QUALIFIED CLASS_3 furnace; TUS + calibration PASS performed 2026-08-01 (next_due 2026-10-30); two BUILDING loads with assignments: load X [2026-10-29T08:00, 2026-10-31T08:00] and load Y [2026-10-28T08:00, 2026-10-29T08:00]"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Window Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech, captures: { tus_due: $.data.next_due_at } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_x: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_y: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-10-29T08:00:00Z", scheduled_end_at: "2026-10-31T08:00:00Z" }, as: ShopScheduler, captures: { load_x: $.data.id, load_x_v: $.data.version } }
            - { call: "POST /load-batches/${load_x}/assignments", payload: { work_order_id: "${wo_x}", expected_load_batch_version: "${load_x_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-10-28T08:00:00Z", scheduled_end_at: "2026-10-29T08:00:00Z" }, as: ShopScheduler, captures: { load_y: $.data.id, load_y_v: $.data.version } }
            - { call: "POST /load-batches/${load_y}/assignments", payload: { work_order_id: "${wo_y}", expected_load_batch_version: "${load_y_v}" }, as: ShopScheduler }
          trigger:
            - call: "POST /load-batches/${load_x}/release"
              payload: {}
              as: ShopScheduler
              captures: { err: $.data.error_id }
            - { call: "POST /load-batches/${load_y}/release", payload: {}, as: ShopScheduler }
          assert:
            - "TUS next_due_at == 2026-10-30T00:00:00Z (CLASS_3: 90 days from 2026-08-01)"
            - "Load X [10-29, 10-31] crosses next_due: error_id == ERR_PYROMETRY_WINDOW_VIOLATION with http 422"
            - "Load Y [10-28, 10-29] fully contained: release succeeds, status RELEASED"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assign_unassign_restores_load_weight
        grounds:
          - calculations.load_weight_utilization
          - state_machines.LoadAssignment.ACTIVE_to_REMOVED
          - concurrency_rules[load-assign-stale-version]
        distinguishing_aspect: |
          Conserved quantity: LoadBatch.total_weight_lb. Assigning a 400 lb
          order then unassigning it returns total_weight_lb to exactly its
          pre-assign value (0), with the invariant total == sum of ACTIVE
          assignments' weights holding after each step.
        test_recipe:
          setup:
            - "Customer, APPROVED recipe, furnace; BUILDING load (total_weight_lb 0, version 1); one 400 lb RECEIVED order"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Inv Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 400, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v1: $.data.version } }
          trigger:
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v1}" }, as: ShopScheduler, captures: { asgmt_id: $.data.id } }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version, w_mid: $.data.total_weight_lb } }
            - { call: "POST /load-batches/${load_id}/assignments/${asgmt_id}/unassign", payload: { expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v3: $.data.version, w_end: $.data.total_weight_lb } }
          assert:
            - "After assign: total_weight_lb == 400, LoadBatch.version == 2, WorkOrder SCHEDULED"
            - "After unassign: total_weight_lb == 0 (== pre-assign value), version == 3, assignment REMOVED"
            - "WorkOrder.${wo_id}.processing_status == RECEIVED again (retreat_count 0 branch)"

      - name: claim_pay_restores_customer_exposure
        grounds:
          - state_machines.LiabilityClaim.PENDING_to_ACCEPTED
          - state_machines.LiabilityClaim.ACCEPTED_to_PAID
          - entities.CustomerAccount.fields.outstanding_liability_exposure_cents
        distinguishing_aspect: |
          Conserved quantity: CustomerAccount.outstanding_liability_exposure_cents
          (a money quantity, different from load weight). SCRAP creates a
          PENDING claim (+300000); accept holds it; pay compensates (-300000),
          returning exposure to exactly 0 — the invariant exposure == sum of
          payouts over {PENDING, ACCEPTED} claims holds at every step.
        test_recipe:
          setup:
            - "STANDARD customer; order (charge 100000, declared 1000000) scrapped via disposition; claim PENDING payout 300000; exposure 300000"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Expo Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 1000000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "SCRAP" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "GET /liability-claims?work_order_id=${wo_id}", payload: {}, as: CustomerServiceRep, captures: { claim_id : "$.data[0].id" } }
          trigger:
            - { call: "POST /liability-claims/${claim_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /liability-claims/${claim_id}/pay", payload: {}, as: CustomerServiceRep }
            - { call: "GET /customer-accounts/${cust_id}", payload: {}, as: CustomerServiceRep, captures: { exposure_end: $.data.outstanding_liability_exposure_cents } }
          assert:
            - "After SCRAP: exposure == 300000 (invariant: PENDING claim payout counted)"
            - "After accept: exposure still == 300000 (ACCEPTED still counted)"
            - "After pay: LiabilityClaim.${claim_id}.status == PAID and CustomerAccount.${cust_id}.outstanding_liability_exposure_cents == 0 (forward + compensating actions cancel)"
