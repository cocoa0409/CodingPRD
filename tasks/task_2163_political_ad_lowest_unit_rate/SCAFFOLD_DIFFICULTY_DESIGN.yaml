              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/elections"
              payload: { station_id: "${st}", office_sought: "Governor", election_type: "PRIMARY", election_date: "2026-09-15" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { el: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Okafor For Governor", requested_class: "CANDIDATE", election_id: "${el}", candidate_name: "Lena Okafor", office_sought: "Governor", qualification_evidence_ref: "FEC-F2-2026-0101" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_o: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_o}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_o}/decision"
              payload: { decision: "CLASSIFY_CANDIDATE", reason: "Ballot access confirmed" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Whitlock For Governor", requested_class: "CANDIDATE", election_id: "${el}", candidate_name: "Ray Whitlock", office_sought: "Governor", qualification_evidence_ref: "FEC-F2-2026-0102" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_w: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_w}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_w}/decision"
              payload: { decision: "CLASSIFY_CANDIDATE", reason: "Ballot access confirmed" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_o}", rate_class_id: "${rc}", payment_terms: "NET_30", sponsorship_disclosure_text: "PAID FOR BY Okafor For Governor; AUTHORIZED BY Okafor For Governor", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
              captures: { ord_t: $.data.id }
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-T1" }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
              captures: { sp_t1: $.data.id }
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 3600, duration_seconds: 30, program_code: "EN-T2" }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 7200, duration_seconds: 30, program_code: "EN-T3" }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 10800, duration_seconds: 30, program_code: "EN-T4" }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 14400, duration_seconds: 60, program_code: "EN-T5" }
