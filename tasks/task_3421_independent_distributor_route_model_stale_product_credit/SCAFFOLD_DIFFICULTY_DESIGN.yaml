# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3421_independent_distributor_route_model_stale_product_credit
#
# Depth probe: 2 instances per each of the nine §0.5 Difficulty Rules.
# Shared fixture chains are defined once as YAML anchors in the first instance
# that uses them and referenced elsewhere. All monetary literals were computed
# by executing the scaffold's formulas (constants: discount 0.20,
# STALE_CREDIT_RATE 0.75, STALE_CAP_PCT 0.10, catalog WHT-24=320/5d,
# BUN-12=240/4d, RYE-09=319/7d, BAG-06=157/3d).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stale_credit_provisional_uncapped_vs_final_capped
        grounds:
          - calculations.stale_credit_amount
          - calculations.stale_weekly_cap
          - entities.StaleReturnClaim.fields.provisional_credit_cents
          - entities.StaleReturnClaim.fields.issued_credit_cents
        distinguishing_aspect: "On StaleReturnClaim the provisional variant (uncapped, claimed-qty based) and the final variant (weekly-cap applied) produce different credits for identical claim items: 768 provisional vs 320 issued — a stale-credit-domain divergence, not a transfer-valuation one."
        test_recipe:
          setup:
            - "Active cash agreement (discount 0.20) on bakery B1; order of WHT-24 x5 + BUN-12 x10 delivered 2026-09-07 (charge 3200, ISO week 37 gross 3200, stale cap 320); clock at 2026-09-12, the exact first stale day for WHT-24 (shelf 5 from 09-07)."
          setup_api_calls:
            - &k_clock0901
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CompanyAdmin
            - &k_bakery
              call: "POST /bakeries"
              payload: { name: "Southwest Bakery", daily_capacity_units: 100, product_catalog: [{ sku: "WHT-24", display_name: "White 24oz", shelf_life_days: 5, list_price_cents: 320 }, { sku: "BUN-12", display_name: "Buns 12pk", shelf_life_days: 4, list_price_cents: 240 }, { sku: "RYE-09", display_name: "Rye 9-grain", shelf_life_days: 7, list_price_cents: 319 }, { sku: "BAG-06", display_name: "Bagels 6pk", shelf_life_days: 3, list_price_cents: 157 }] }
              as: CompanyAdmin
              captures: { bakery_id: $.data.id }
            - &k_terr1
              call: "POST /territories"
              payload: { area_code: "DAL-N", list_price_cents: 25000000 }
              as: CompanyAdmin
              captures: { terr_id: $.data.id }
            - &k_terr1_list
              call: "POST /territories/${terr_id}/list-for-sale"
              payload: {}
              as: CompanyAdmin
            - &k_dist
              call: "POST /distributors"
              payload: { legal_name: "RoutePro LLC", credit_limit_cents: 200000 }
              as: CompanyAdmin
              captures: { dist_id: $.data.id }
            - &k_agr
              call: "POST /agreements"
              payload: { territory_id: "${terr_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agr_id: $.data.id, agr_v0: $.data.version }
            - &k_activate
              call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: RouteOpsManager
            - &k_day0907
              call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-07" }
              as: CompanyAdmin
              captures: { day0907_id: $.data.id, day0907_v: $.data.version }
            - &k_ord2
              call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-07", lines: [{ sku: "WHT-24", qty: 5 }, { sku: "BUN-12", qty: 10 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord2_id: $.data.id }
            - &k_ord2_submit
              call: "POST /orders/${ord2_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - &k_ord2_confirm
              call: "POST /orders/${ord2_id}/confirm"
              payload: { expected_production_day_version: "${day0907_v}" }
              as: RouteOpsManager
            - &k_clock0907
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T08:00:00Z" }
              as: CompanyAdmin
            - &k_day0907_close
              call: "POST /production-days/${day0907_id}/close"
              payload: {}
              as: CompanyAdmin
            - &k_ord2_deliver
              call: "POST /orders/${ord2_id}/record-delivery"
              payload: { delivered_lines: [{ sku: "WHT-24", qty: 5 }, { sku: "BUN-12", qty: 10 }] }
              as: Distributor
              as_user_id: "${dist_id}"
            - &k_clock0912
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T09:00:00Z" }
              as: CompanyAdmin
          trigger:
            - call: "POST /distributors/${dist_id}/stale-claims"
              payload: { items: [{ sku: "WHT-24", delivery_date: "2026-09-07", pulled_qty: 4, pull_date: "2026-09-12" }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { claim_id: $.data.id, claim_prov: $.data.provisional_credit_cents }
            - call: "POST /stale-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: RouteOpsManager
            - call: "POST /stale-claims/${claim_id}/issue-credit"
              payload: {}
              as: CreditAnalyst
          assert:
            - "StaleReturnClaim.${claim_id}.provisional_credit_cents == 768 (uncapped: round_half_up(4 * 256 * 0.75))"
            - "StaleReturnClaim.${claim_id}.approved_credit_cents == 768"
            - "StaleReturnClaim.${claim_id}.issued_credit_cents == 320 (capped: week-37 gross 3200 * 0.10)"
            - "StaleReturnClaim.${claim_id}.cap_truncated_cents == 448"
            - "StaleReturnClaim.${claim_id}.issued_credit_cents != StaleReturnClaim.${claim_id}.provisional_credit_cents"
            - "Distributor.${dist_id}.trade_balance_cents == 2880 (3200 - 320)"

      - name: transfer_valuation_voluntary_vs_for_cause_variants
        grounds:
          - calculations.transfer_valuation
          - entities.TerritoryTransfer.fields.valuation_detail
          - state_machines.RouteAgreement.ACTIVE_to_EXITING
        distinguishing_aspect: "On TerritoryTransfer the VOLUNTARY and FOR_CAUSE variants produce different gross valuations for identical territory, dates, and compliant accounts: 1050000 (goodwill 50000, penalty 0) vs 850000 (goodwill 0, penalty 150000) — a route-valuation-domain divergence, not a stale-credit one."
        test_recipe:
          setup:
            - "Two identical cash agreements (purchase 1000000, activated 2026-09-01) for distributors A and B, each with one retail account carrying a single non-violation audit dated 2026-09-02; clock at 2026-09-08 for both exits."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - &k_acct
              call: "POST /distributors/${dist_id}/retail-accounts"
              payload: { store_name: "FreshMart Oak", delivery_weekdays: ["MON", "WED", "FRI"] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { acct_id: $.data.id }
            - &k_audit_ok
              call: "POST /retail-accounts/${acct_id}/audits"
              payload: { audit_date: "2026-09-02", shelf_stock_score: 80, rotation_score: 90, display_score: 90 }
              as: RouteOpsManager
            - call: "POST /territories"
              payload: { area_code: "DAL-S", list_price_cents: 25000000 }
              as: CompanyAdmin
              captures: { terr_b_id: $.data.id }
            - call: "POST /territories/${terr_b_id}/list-for-sale"
              payload: {}
              as: CompanyAdmin
            - call: "POST /distributors"
              payload: { legal_name: "MetroRoutes Inc", credit_limit_cents: 200000 }
              as: CompanyAdmin
              captures: { dist_b_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${terr_b_id}", distributor_id: "${dist_b_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agr_b_id: $.data.id }
            - call: "POST /agreements/${agr_b_id}/activate"
              payload: {}
              as: RouteOpsManager
            - call: "POST /distributors/${dist_b_id}/retail-accounts"
              payload: { store_name: "FreshMart South", delivery_weekdays: ["TUE", "THU"] }
              as: Distributor
              as_user_id: "${dist_b_id}"
              captures: { acct_b_id: $.data.id }
            - call: "POST /retail-accounts/${acct_b_id}/audits"
              payload: { audit_date: "2026-09-02", shelf_stock_score: 80, rotation_score: 90, display_score: 90 }
              as: RouteOpsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T10:00:00Z" }
              as: CompanyAdmin
          trigger:
            - call: "POST /agreements/${agr_id}/exit"
              payload: { mode: "VOLUNTARY" }
              as: RouteOpsManager
            - call: "POST /agreements/${agr_b_id}/exit"
              payload: { mode: "FOR_CAUSE" }
              as: RouteOpsManager
            - call: "GET /agreements/${agr_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { tr_a_val: "$.data[0].gross_valuation_cents", tr_a_goodwill: "$.data[0].valuation_detail" }
            - call: "GET /agreements/${agr_b_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { tr_b_val: "$.data[0].gross_valuation_cents" }
          assert:
            - "transfer of agreement ${agr_id}: gross_valuation_cents == 1050000 (1000000 - 0 depreciation + 50000 goodwill - 0 penalty)"
            - "transfer of agreement ${agr_id}: valuation_detail.goodwill_cents == 50000 and valuation_detail.penalty_cents == 0 and valuation_detail.depreciation_cents == 0"
            - "transfer of agreement ${agr_b_id}: gross_valuation_cents == 850000 (1000000 - 0 + 0 goodwill - 150000 penalty)"
            - "gross_valuation_cents of the VOLUNTARY transfer != gross_valuation_cents of the FOR_CAUSE transfer"
            - "RouteAgreement.${agr_id}.status == EXITING and RouteAgreement.${agr_b_id}.status == EXITING"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: delivery_charge_per_line_then_sum_rounding_order
        grounds:
          - calculations.order_charge
          - entities.DailyOrder.fields.total_charge_cents
        distinguishing_aspect: "Mode (b) nested rounding: with discount 0.20, RYE-09 x3 (765.60 raw) and BAG-06 x3 (376.80 raw), the pinned per-line-then-sum order yields 766 + 377 = 1143 while the forbidden sum-then-round order yields 1142 — the rounding order changes the charged cents."
        test_recipe:
          setup:
            - "Active cash agreement (discount 0.20); production day 2026-09-04; order of RYE-09 x3 + BAG-06 x3 confirmed and day closed."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - &k_day0904
              call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { day0904_id: $.data.id, day0904_v: $.data.version }
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "RYE-09", qty: 3 }, { sku: "BAG-06", qty: 3 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord3_id: $.data.id }
            - call: "POST /orders/${ord3_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord3_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: CompanyAdmin
            - call: "POST /production-days/${day0904_id}/close"
              payload: {}
              as: CompanyAdmin
          trigger:
            - call: "POST /orders/${ord3_id}/record-delivery"
              payload: { delivered_lines: [{ sku: "RYE-09", qty: 3 }, { sku: "BAG-06", qty: 3 }] }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "DailyOrder.${ord3_id}.total_charge_cents == 1143 (per-line round_half_up: round(3*319*0.8)=766 + round(3*157*0.8)=377)"
            - "DailyOrder.${ord3_id}.total_charge_cents != 1142 (the sum-then-round result round(765.60+376.80))"
            - "DailyOrder.${ord3_id}.units_total == 6"
            - "Distributor.${dist_id}.trade_balance_cents == 1143"

      - name: transfer_settle_pinned_evaluation_order
        grounds:
          - calculations.transfer_valuation
          - calculations.financing_payoff
          - state_machines.TerritoryTransfer.PENDING_to_SETTLED
        distinguishing_aspect: "Mode (c) circular-looking dependency: valuation depends on agreement dates, payoff depends on outstanding principal and days-since-disburse at settle time, payout = valuation - payoff; the pinned evaluation order (depreciation -> goodwill -> variant branch -> payoff -> payout) makes the settle well-defined at valuation 1000000, payoff 52100, payout 947900."
        test_recipe:
          setup:
            - "Financed agreement (purchase 1000000, financed 52000) with plan 52000 @ 0.10 over 10 weeks disbursed 2026-09-01 (weekly payment 5255), agreement ACTIVE, no payments made; clock at 2026-09-08."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - &k_agr_fin
              call: "POST /agreements"
              payload: { territory_id: "${terr_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 52000, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agrf_id: $.data.id, agrf_v0: $.data.version }
            - &k_plan
              call: "POST /agreements/${agrf_id}/financing-plans"
              payload: { financier_type: "COMPANY", principal_cents: 52000, annual_interest_rate: 0.10, term_weeks: 10, expected_agreement_version: "${agrf_v0}" }
              as: CreditAnalyst
              captures: { plan_id: $.data.id }
            - &k_disburse
              call: "POST /financing-plans/${plan_id}/disburse"
              payload: {}
              as: CreditAnalyst
            - &k_activate_fin
              call: "POST /agreements/${agrf_id}/activate"
              payload: {}
              as: RouteOpsManager
            - &k_clock0908
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T10:00:00Z" }
              as: CompanyAdmin
            - &k_exit_vol
              call: "POST /agreements/${agrf_id}/exit"
              payload: { mode: "VOLUNTARY" }
              as: RouteOpsManager
            - &k_get_transfers
              call: "GET /agreements/${agrf_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { transfer_id: "$.data[0].id" }
          trigger:
            - call: "POST /transfers/${transfer_id}/settle"
              payload: {}
              as: CreditAnalyst
          assert:
            - "TerritoryTransfer.${transfer_id}.gross_valuation_cents == 1000000 (0 full years activated 2026-09-01 -> exit 2026-09-08, 0 accounts)"
            - "TerritoryTransfer.${transfer_id}.financing_payoff_cents == 52100 (52000 + round_half_up(52000 * 0.10 * 7 / 365) = 52000 + 100)"
            - "TerritoryTransfer.${transfer_id}.distributor_payout_cents == 947900"
            - "TerritoryTransfer.${transfer_id}.status == SETTLED"
            - "FinancingPlan.${plan_id}.status == SETTLED_ON_EXIT and outstanding_principal_cents == 0"
            - "RouteAgreement.${agrf_id}.status == EXITED and Territory.${terr_id}.status == AVAILABLE and Distributor.${dist_id}.status == EXITED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspend_reinstate_cycle_with_classification
        grounds:
          - state_machines.RouteAgreement.ACTIVE_to_SUSPENDED_SERVICE
          - state_machines.RouteAgreement.SUSPENDED_SERVICE_to_ACTIVE
          - state_machines.RouteAgreement.ACTIVE_to_SUSPENDED_CLASSIFICATION
          - state_machines.RouteAgreement.SUSPENDED_CLASSIFICATION_to_ACTIVE
          - entities.Distributor.fields.classification_status
        distinguishing_aspect: "RouteAgreement supports a cyclic ACTIVE -> SUSPENDED_SERVICE -> ACTIVE -> SUSPENDED_CLASSIFICATION -> ACTIVE loop (two distinct suspension sub-states with role-dependent reinstate), not a linear pipeline — and the loop lives on the agreement, not on the financing plan."
        test_recipe:
          setup:
            - "Active cash agreement for distributor D1; clock 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
          trigger:
            - call: "POST /agreements/${agr_id}/suspend"
              payload: { reason: "SERVICE_DEFAULT" }
              as: RouteOpsManager
              captures: { agr_s1: $.data.status }
            - call: "POST /agreements/${agr_id}/reinstate"
              payload: {}
              as: RouteOpsManager
              captures: { agr_s2: $.data.status }
            - call: "POST /agreements/${agr_id}/suspend"
              payload: { reason: "CLASSIFICATION_DISPUTE" }
              as: RouteOpsManager
              captures: { agr_s3: $.data.status }
            - call: "POST /agreements/${agr_id}/reinstate"
              payload: { resolution: "CONFIRMED_IC" }
              as: CompanyAdmin
              captures: { agr_s4: $.data.status }
          assert:
            - "agr_s1 == SUSPENDED_SERVICE and RouteAgreement.${agr_id}.suspension_reason == SERVICE_DEFAULT"
            - "agr_s2 == ACTIVE and suspension_reason back to null"
            - "agr_s3 == SUSPENDED_CLASSIFICATION and Distributor.${dist_id}.classification_status == DISPUTED"
            - "agr_s4 == ACTIVE and Distributor.${dist_id}.classification_status == INDEPENDENT_CONTRACTOR"
            - "RouteAgreement.${agr_id}.version == 6 (create 1, activate 2, suspend 3, reinstate 4, suspend 5, reinstate 6)"

      - name: financing_delinquency_cure_cycle_via_close
        grounds:
          - state_machines.FinancingPlan.ACTIVE_to_DELINQUENT
          - state_machines.FinancingPlan.DELINQUENT_to_ACTIVE
          - calculations.delinquency_evaluation
          - calculations.financing_payment_application
        distinguishing_aspect: "FinancingPlan cycles ACTIVE -> DELINQUENT -> ACTIVE purely through production-day-close evaluations bracketing a catch-up payment — a cyclic machine on the financing plan, distinct from the agreement's suspension loop."
        test_recipe:
          setup:
            - "Financed agreement ACTIVE with plan 52000 @ 0.10 over 10 weeks disbursed 2026-09-01 (weekly payment 5255); no payments; clock advanced to 2026-09-16 (15 days => 2 weeks elapsed => scheduled 10510, grace 5255)."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr_fin
            - *k_plan
            - *k_disburse
            - *k_activate_fin
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-16" }
              as: CompanyAdmin
              captures: { day0916_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T08:00:00Z" }
              as: CompanyAdmin
          trigger:
            - call: "POST /production-days/${day0916_id}/close"
              payload: {}
              as: CompanyAdmin
            - call: "GET /agreements/${agrf_id}/financing-plans"
              payload: {}
              as: CreditAnalyst
              captures: { plan_st1: "$.data[0].status" }
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 10510 }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { plan_outstanding: $.data.outstanding_principal_cents }
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-17" }
              as: CompanyAdmin
              captures: { day0917_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T08:00:00Z" }
              as: CompanyAdmin
            - call: "POST /production-days/${day0917_id}/close"
              payload: {}
              as: CompanyAdmin
            - call: "GET /agreements/${agrf_id}/financing-plans"
              payload: {}
              as: CreditAnalyst
              captures: { plan_st2: "$.data[0].status" }
          assert:
            - "plan_st1 == DELINQUENT (total_paid 0 < scheduled 10510 - grace 5255)"
            - "after the 09-16 close, Distributor.${dist_id}.account_standing == WATCH"
            - "payment 10510 applies interest-first: interest 100 (round_half_up(52000 * 0.10/52)), principal 10410, so plan_outstanding == 41590 and FinancingPlan.${plan_id}.total_paid_cents == 10510"
            - "plan_st2 == ACTIVE (total_paid 10510 >= scheduled 10510 - grace 5255 at the 09-17 close)"
            - "after the 09-17 close, Distributor.${dist_id}.account_standing == GOOD"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_strike_auto_suspend_cascade_releases_capacity
        grounds:
          - calculations.audit_compliance
          - calculations.agreement_strike_count
          - state_machines.RouteAgreement.ACTIVE_to_SUSPENDED_SERVICE
          - state_machines.DailyOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Depth-4 chain triggered by an audit POST: audit -> RetailAccount.audit_log/strike recompute -> RouteAgreement strike_count hits 3 and auto-suspends -> future CONFIRMED order CANCELLED -> ProductionDay.allocated_units released (25 -> 0). Each hop is caused by the previous mutation, not by the audit directly."
        test_recipe:
          setup:
            - "Active cash agreement; retail account; production day 2026-09-05 with a CONFIRMED 25-unit order (allocated 25); two violation audits already posted (2026-09-01, 2026-09-02); clock at 2026-09-03."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - call: "POST /distributors/${dist_id}/retail-accounts"
              payload: { store_name: "QuickStop Elm", delivery_weekdays: ["MON", "THU"] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-05" }
              as: CompanyAdmin
              captures: { day0905_id: $.data.id, day0905_v: $.data.version }
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-05", lines: [{ sku: "WHT-24", qty: 25 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_c_id: $.data.id }
            - call: "POST /orders/${ord_c_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_c_id}/confirm"
              payload: { expected_production_day_version: "${day0905_v}" }
              as: RouteOpsManager
            - call: "POST /retail-accounts/${acct_id}/audits"
