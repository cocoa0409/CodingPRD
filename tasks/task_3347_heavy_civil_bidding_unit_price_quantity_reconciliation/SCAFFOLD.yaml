scenario: |
  Heavy Civil Bidding & Unit-Price Quantity Reconciliation (Granite Construction): bid preparation on
  public works projects with quantity takeoffs, unit price development and crew productivity
  assumptions, subcontractor and supplier quote collection near the bid deadline with bid shopping
  restrictions, bid bond, performance bond and surety capacity constraints limiting simultaneous work,
  unit price contract administration where payment follows measured quantities rather than lump sums,
  quantity overrun and underrun provisions triggering price renegotiation beyond variance thresholds,
  differing site condition claims with documentation and engineer determination, disadvantaged business
  enterprise participation goals with good faith effort documentation, project closeout with final
  quantity reconciliation and retention release

domain_name: "heavy-civil-bidding-unit-price-reconciliation"

api_prefix: "/construction"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: project_code
        type: string
        source: input
        description: "Owner-agency contract number (e.g. CALTRANS-04-1J5604)"
        constraints: "required; unique across non-CLOSED projects"
      - name: owner_agency_name
        type: string
        source: input
        description: "Public agency awarding the work"
        constraints: "required"
      - name: contract_type
        type: enum
        source: input
        description: "UNIT_PRICE pays by measured quantity; LUMP_SUM pays a fixed sum"
        default: "UNIT_PRICE"
        constraints: "enum {UNIT_PRICE, LUMP_SUM}"
      - name: bid_deadline_at
        type: datetime
        source: input
        description: "Instant the owner's bid window closes; sealing requires clock < this value"
        constraints: "required; ISO 8601 UTC"
      - name: retention_rate_pct
        type: number
        source: input
        description: "Percentage withheld from each progress payment"
        default: 5.0
        constraints: "0.0 <= value <= 10.0"
      - name: advertised_dbe_goal_pct
        type: number
        source: input
        description: "DBE participation percentage advertised by the owner"
        default: 0.0
        constraints: "0.0 <= value <= 100.0"
      - name: bid_window_open_at
        type: datetime
        source: system
        description: "Instant the project became sealable; set when project is created to the logical clock"
      - name: bid_status
        type: enum
        source: system
        description: "Sealed-bid dimension: DRAFT, SEALED, OPEN or RECALLED"
        default: "DRAFT"
        constraints: "enum {DRAFT, SEALED, OPEN, RECALLED}"
      - name: project_status
        type: enum
        source: system
        description: "Delivery dimension: PRE_BID, AWARDED, ACTIVE or COMPLETE"
        default: "PRE_BID"
        constraints: "enum {PRE_BID, AWARDED, ACTIVE, COMPLETE}"
      - name: bid_open_at
        type: datetime
        source: system
        description: "Instant the sealed bid was opened; unset while bid_status is DRAFT, SEALED or RECALLED"
      - name: total_bid_cents
        type: integer
        source: computed
        description: "Sum of extended bid amounts over included BidItems; derived by project_bid_extension"
        default: 0
      - name: contract_value_cents
        type: integer
        source: computed
        description: "Awarded contract value; equals total_bid_cents at award, then adjusted by reconciliation"
        default: 0
      - name: unbalanced_bid_score
        type: number
        source: computed
        description: "Materially-unbalanced score over priced BidItems; derived by unbalanced_bid_score"
        default: 0.0
      - name: dbe_participation_pct
        type: number
        source: computed
        description: "Credited DBE percentile participation; derived by dbe_participation_credit"
        default: 0.0
      - name: retention_balance_cents
        type: integer
        source: computed
        description: "Withheld but unreleased retention; equals held minus released on the open reconciliation"
        default: 0
      - name: claim_window_open
        type: boolean
        source: computed
        description: "True while project_status is ACTIVE; gates recordation of differing site conditions"
        default: false

  - name: BidItem
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the contract the pay item belongs to"
        constraints: "required"
      - name: item_code
        type: string
        source: input
        description: "Owner pay-item number (e.g. 2025-390102)"
        constraints: "required; unique within project_id"
      - name: item_description
        type: string
        source: input
        description: "Plain-language description of the measured work"
        constraints: "required"
      - name: unit_of_measure
        type: enum
        source: input
        description: "Measurement unit the owner pays in"
        constraints: "enum {LF, CY, TON, EA, SY}; required"
      - name: estimated_quantity
        type: number
        source: input
        description: "Engineer's estimated quantity from the takeoff"
        constraints: "required; > 0"
      - name: bid_unit_price_cents
        type: integer
        source: input
        description: "Bidder's unit price in cents per unit of measure"
        default: 0
        constraints: ">= 0"
      - name: balanced_unit_price_cents
        type: integer
        source: computed
        description: "Reference unit price used by unbalanced_bid_score; set from crew_productivity_unit_cost at pricing time"
        default: 0
      - name: crew_day_labor_cents
        type: integer
        source: input
        description: "Labor cost of one crew day from the productivity assumption sheet"
        constraints: "> 0"
      - name: crew_day_equipment_cents
        type: integer
        source: input
        description: "Equipment cost of one crew day from the productivity assumption sheet"
        constraints: ">= 0"
      - name: daily_productivity_units
        type: number
        source: input
        description: "Units of measure the crew installs in one day"
        constraints: "> 0"
      - name: overrun_threshold_pct
        type: number
        source: input
        description: "Measured-over- estimated percentage above which price renegotiation is triggered"
        default: 15.0
        constraints: "0.0 <= value <= 100.0"
      - name: underrun_threshold_pct
        type: number
        source: input
        description: "Measured-under-estimated percentage below which price renegotiation is triggered"
        default: 15.0
        constraints: "0.0 <= value <= 100.0"
      - name: measured_quantity
        type: number
        source: computed
        description: "Sum of measured_quantity over non-VOIDED ProgressMeasurements on this item"
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: "Signed quantity variance against estimated_quantity; derived by quantity_variance_adjustment"
        default: 0.0
      - name: item_status
        type: enum
        source: system
        description: "Pay-item lifecycle from takeoff to closeout"
        default: "DRAFT"
        constraints: "enum {DRAFT, PRICED, SUBMITTED, AWARDED, ACTIVE, CLOSED}"
      - name: renegotiation_required
        type: boolean
        source: computed
        description: "True when variance_pct crosses either configured threshold"
        default: false

  - name: Bond
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project the bond backs"
        constraints: "required"
      - name: surety_id
        type: string
        source: input
        description: "FK -> Surety.id; the surety firm whose capacity is consumed"
        constraints: "required"
      - name: bond_type
        type: enum
        source: input
        description: "BID (10% of bid), PERFORMANCE (100% of contract), PAYMENT (100%), MAINTENANCE (50%)"
        constraints: "enum {BID, PERFORMANCE, PAYMENT, MAINTENANCE}; required"
      - name: bond_amount_cents
        type: integer
        source: input
        description: "Face amount of the bond in cents"
        constraints: "required; > 0"
      - name: required_bond_cents
        type: integer
        source: computed
        description: "Statutory face amount required for this bond_type; derived by performance_bond_requirement"
        default: 0
      - name: bond_status
        type: enum
        source: system
        description: "Bond lifecycle; EXECUTED means the owner has called the bond"
        default: "PENDING"
        constraints: "enum {PENDING, ISSUED, EXECUTED, RELEASED}"
      - name: effective_from
        type: datetime
        source: input
        description: "Start of the bond's coverage interval (inclusive)"
        constraints: "required; ISO 8601 UTC"
      - name: effective_to
        type: datetime
        source: input
        description: "End of the bond's coverage interval (exclusive); may equal another bond's effective_from"
        constraints: "required; strictly after effective_from"
      - name: maintain_bond_horizon_days
        type: integer
        source: input
        description: "MAINTENANCE-bond horizon in days used when project.contract_type == LUMP_SUM"
        default: 30
        constraints: "1 <= value <= 365"
      - name: issued_at
        type: datetime
        source: system
        description: "Instant the bond moved PENDING to ISSUED"
      - name: released_at
        type: datetime
        source: system
        description: "Instant the bond moved to RELEASED; closes the coverage interval"
      - name: lien_claim_amount_cents
        type: integer
        source: computed
        description: "Outstanding payment-bond lien claim; derived from unpaid ProgressMeasurements"
        default: 0
      - name: capacity_consumed_cents
        type: integer
        source: computed
        description: "Cents of surety capacity this bond currently consumes; zero unless bond_status is ISSUED or EXECUTED"
        default: 0

  - name: Surety
    parent: null
    common_fields: true
    fields:
      - name: surety_name
        type: string
        source: input
        description: "Legal name of the surety firm"
        constraints: "required; unique"
      - name: aggregate_capacity_cents
        type: integer
        source: input
        description: "Total bonding capacity the surety will carry across all projects"
        constraints: "required; > 0"
      - name: single_job_limit_cents
        type: integer
        source: input
        description: "Largest face amount the surety will carry on one project's PERFORMANCE bond"
        constraints: "required; <= aggregate_capacity_cents"
      - name: capacity_consumed_cents
        type: integer
        source: computed
        description: "Sum of capacity_consumed_cents over Bonds bound to this surety; derived by surety_exposure_capacity"
        default: 0
      - name: available_capacity_cents
        type: integer
        source: computed
        description: "aggregate_capacity_cents minus capacity_consumed_cents, floored at zero"
        default: 0
      - name: unavailable_capacity_cents
        type: integer
        source: computed
        description: "Committed portion of aggregate capacity: capacity_consumed_cents once RESERVED commitments count; derived by surety_exposure_capacity"
        default: 0
      - name: surety_status
        type: enum
        source: system
        description: "ACTIVE sureties may issue bonds; SUSPENDED sureties may not"
        default: "ACTIVE"
        constraints: "enum {ACTIVE, SUSPENDED}"

  - name: SubcontractorQuote
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being bid"
        constraints: "required"
      - name: trade_code
        type: string
        source: input
        description: "Scope-of-work trade (e.g. SWPPP, SIGNAL, STRIPING)"
        constraints: "required; at most one CARRIED quote per (project_id, trade_code)"
      - name: contact_name
        type: string
        source: input
        description: "Named contact at the quoting firm"
        constraints: "required"
      - name: quoted_amount_cents
        type: integer
        source: input
        description: "Quoted price in cents for the trade scope"
        constraints: "required; > 0"
      - name: quote_window_start
        type: datetime
        source: input
        description: "Start of the interval in which this quote price is held (inclusive)"
        constraints: "required; ISO 8601 UTC"
      - name: quote_window_end
        type: datetime
        source: input
        description: "End of the interval in which this quote price is held (exclusive)"
        constraints: "required; strictly after quote_window_start"
      - name: quote_received_at
        type: datetime
        source: system
        description: "Instant the quote was recorded; set from the logical clock"
      - name: quote_status
        type: enum
        source: system
        description: "Quote lifecycle; CARRIED means the price is folded into the bid"
        default: "RECEIVED"
        constraints: "enum {RECEIVED, CARRIED, REJECTED, SELECTED}"
      - name: version_round
        type: integer
        source: system
        description: "Negotiation round; increments each time a CARRIED quote returns to RECEIVED"
        default: 1
      - name: unicap_registered
        type: boolean
        source: input
        description: "True when the quoting firm is a certified Unified Certification Program DBE"
        default: false
      - name: good_faith_effort_basis
        type: enum
        source: input
        description: "Documented basis for the participation attempt on this trade"
        default: "NONE"
        constraints: "enum {NONE, SOLICITED_DBE, DOCUMENTED_UNAVAILABLE, OUTREACH_EVENT}"
      - name: dbe_credit_cents
        type: integer
        source: computed
        description: "DBE dollars credited by this quote; derived by dbe_participation_credit"
        default: 0
      - name: carried_in_bid
        type: boolean
        source: computed
        description: "True while quote_status is CARRIED or SELECTED"
        default: false
      - name: shopping_flagged
        type: boolean
        source: computed
        description: "True when the quote was received or carried after the project's bid_open_at"
        default: false

  - name: ProgressMeasurement
    parent: BidItem
    common_fields: true
    fields:
      - name: bid_item_id
        type: string
        source: input
        description: "FK -> BidItem.id; the pay item being measured"
        constraints: "required"
      - name: measured_quantity
        type: number
        source: input
        description: "Quantity measured in the field for this period"
        constraints: "required; > 0"
      - name: measured_at
        type: datetime
        source: input
        description: "Field measurement date; sets chronological order of the running quantity ledger"
        constraints: "required; ISO 8601 UTC"
      - name: measurement_status
        type: enum
        source: system
        description: "Measurement lifecycle; only PAYABLE quantities are paid"
        default: "DRAFT"
        constraints: "enum {DRAFT, APPROVED, PAYABLE, VOIDED}"
      - name: applied_unit_price_cents
        type: integer
        source: computed
        description: "Unit price actually applied; equals the renegotiated rate when one is in force"
        default: 0
      - name: payable_amount_cents
        type: integer
        source: computed
        description: "measured_quantity times applied_unit_price_cents, rounded half-up to whole cents"
        default: 0

  - name: QuantityReconciliation
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; at most one non-CLOSED reconciliation per project"
        constraints: "required"
      - name: reconciliation_status
        type: enum
        source: system
        description: "Reconciliation lifecycle; retention may be released only from FINALIZED"
        default: "OPEN"
        constraints: "enum {OPEN, FINALIZED, CLOSED}"
      - name: overrun_item_count
        type: integer
        source: computed
        description: "Count of included BidItems whose variance_pct exceeds overrun_threshold_pct"
        default: 0
      - name: underrun_item_count
        type: integer
        source: computed
        description: "Count of included BidItems whose variance_pct falls below minus underrun_threshold_pct"
        default: 0
      - name: net_adjustment_cents
        type: integer
        source: computed
        description: "Signed renegotiated value change over threshold-crossing items; derived by quantity_variance_adjustment"
        default: 0
      - name: final_contract_value_cents
        type: integer
        source: computed
        description: "contract_value_cents plus net_adjustment_cents; derived by retention_settlement"
        default: 0
      - name: retention_held_cents
        type: integer
        source: computed
        description: "Retention accrued over payable measurements; derived by retention_settlement"
        default: 0
      - name: pace_basis_retention_cents
        type: integer
        source: computed
        description: "Retention under the owner's absolute pace grade; derived by absolute_retention_reconciliation"
        default: 0
      - name: retention_released_cents
        type: integer
        source: computed
        description: "Retention returned to the contractor; zero until release-retention succeeds"
        default: 0
      - name: closeout_status
        type: enum
        source: computed
        description: "NONE before finalization, PENDING_RETENTION while FINALIZED, CLOSED after release"
        default: "NONE"
        constraints: "enum {NONE, PENDING_RETENTION, CLOSED}"

  - name: DifferingSiteCondition
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project where the condition was encountered"
        constraints: "required"
      - name: condition_status
        type: enum
        source: system
        description: "Claim lifecycle; DENIED is terminal"
        default: "REPORTED"
        constraints: "enum {REPORTED, DOCUMENTED, UNDER_REVIEW, DETERMINED, DENIED}"
      - name: reported_at
        type: datetime
        source: input
        description: "Instant the condition was discovered; starts the 30-day notice period"
        constraints: "required; ISO 8601 UTC"
      - name: documentation_complete
        type: boolean
        source: computed
        description: "True once the document action records a complete claim package"
        default: false
      - name: notice_days_elapsed
        type: integer
        source: computed
        description: "Whole days from reported_at to the logical clock; derived by notice_period_elapsed"
        default: 0
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Contractor's claimed cost impact in cents"
        default: 0
        constraints: ">= 0"
      - name: claim_window_engaged
        type: boolean
        source: computed
        description: "True from the first FINAL QUANTITY_ADJUSTMENT determination on this project; only one such determination may be FINAL"
        default: false

  - name: EngineerDetermination
    parent: DifferingSiteCondition
    common_fields: true
    fields:
      - name: condition_id
        type: string
        source: input
        description: "FK -> DifferingSiteCondition.id; the claim being determined"
        constraints: "required"
      - name: determination_type
        type: enum
        source: input
        description: "Engineer's determination category"
        constraints: "enum {TIME_EXTENSION, COST_EQUITABLE_ADJUSTMENT, QUANTITY_ADJUSTMENT, REJECTED}; required"
      - name: target_bid_item_id
        type: string
        source: input
        description: "FK -> BidItem.id; the pay item whose rate is re-set when QUANTITY_ADJUSTMENT is determined; null for other determination types"
        constraints: "required when determination_type == QUANTITY_ADJUSTMENT"
      - name: determined_unit_rate_cents
        type: integer
        source: input
        description: "Unit rate the engineer sets when QUANTITY_ADJUSTMENT is determined"
        default: 0
        constraints: ">= 0"
      - name: days_granted
        type: integer
        source: input
        description: "Calendar days of time extension granted"
        default: 0
        constraints: ">= 0"
      - name: entitles_adjustment
        type: boolean
        source: computed
        description: "True when determination_type is COST_EQUITABLE_ADJUSTMENT or QUANTITY_ADJUSTMENT"
        default: false
      - name: determination_status
        type: enum
        source: system
        description: "Determination lifecycle; FINAL determinations are immutable"
        default: "PENDING"
        constraints: "enum {PENDING, ISSUED, FINAL}"
      - name: issued_at
        type: datetime
        source: system
        description: "Instant the engineer issued the determination"

  - name: SuretyCommitment
    parent: Surety
    common_fields: true
    fields:
      - name: surety_id
        type: string
        source: input
        description: "FK -> Surety.id; the surety whose capacity is reserved"
        constraints: "required"
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project the reservation covers"
        constraints: "required"
      - name: committed_amount_cents
        type: integer
        source: input
        description: "Face amount reserved against the surety's aggregate capacity"
        constraints: "required; > 0"
      - name: commitment_status
        type: enum
        source: system
        description: "Reservation lifecycle; RELEASED reservations stop consuming capacity"
        default: "RESERVED"
        constraints: "enum {RESERVED, ACTIVE, RELEASED}"
      - name: reserved_at
        type: datetime
        source: system
        description: "Instant the reservation opened (inclusive)"
      - name: released_at
        type: datetime
        source: system
        description: "Instant the reservation closed (exclusive); unset while not RELEASED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Project: PARALLEL dimensions (bid_status x project_status) + a cycle
  #      in the bid dimension (DRAFT -> SEALED -> RECALLED -> DRAFT) ----------
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /construction/projects/{id}/seal-bid"
        actor: Estimator
        preconditions:
          - "project.bid_status == DRAFT"
          - "logical clock < project.bid_deadline_at (ERR_BID_WINDOW_CLOSED)"
          - "project has at least one BidItem with item_status IN {PRICED, SUBMITTED}"
          - "no BidItem on this project has item_status == DRAFT"
          - "every BidItem on this project satisfies bid_unit_price_cents >= balanced_unit_price_cents"
          - "no SubcontractorQuote on this project has shopping_flagged == true"
        side_effects:
          - "project.bid_status := SEALED"
          - "recompute unbalanced_bid_score over included BidItems (calculation: unbalanced_bid_score)"
          - "recompute project.total_bid_cents (calculation: project_bid_extension)"
          - "increment project.version by 1"
      - from: SEALED
        to: OPEN
        trigger: "POST /construction/projects/{id}/open-bid"
        actor: ContractingOfficer
        preconditions:
          - "project.bid_status == SEALED"
          - "logical clock >= project.bid_deadline_at (ERR_BID_NOT_YET_CLOSED)"
        side_effects:
          - "project.bid_status := OPEN"
          - "project.bid_open_at := logical clock"
          - "project.project_status := AWARDED"
          - "project.contract_value_cents := project.total_bid_cents"
          - "cascade-begin (cascade C1): each BidItem on this project with item_status == SUBMITTED -> AWARDED"
          - "for each BidItem entering AWARDED, recompute quantity_variance_adjustment on the project's non-CLOSED QuantityReconciliation covering that item"
          - "for each QuantityReconciliation recomputed above, recompute retention_settlement (net_adjustment_cents, final_contract_value_cents, retention_held_cents)"
          - "for each QuantityReconciliation recomputed above, write project.contract_value_cents and project.retention_balance_cents"
          - "cascade-end (cascade C1 depth 4)"
          - "recompute dbe_participation_credit over all SubcontractorQuotes of this project"
          - "for each SubcontractorQuote with quote_received_at > project.bid_open_at, set shopping_flagged := true"
          - "increment project.version by 1"
      - from: SEALED
        to: RECALLED
        trigger: "POST /construction/projects/{id}/recall-bid"
        actor: ContractingOfficer
        preconditions:
          - "project.bid_status == SEALED"
          - "logical clock < project.bid_deadline_at"
          - "reason_code IN {ERROR_IN_BID, OWNER_ADDENDUM, PROTESTS_RECEIVED}"
        side_effects:
          - "project.bid_status := RECALLED"
          - "each BidItem on this project with item_status == SUBMITTED -> DRAFT"
          - "each SubcontractorQuote on this project with quote_status == CARRIED -> RECEIVED, and quote.version_round incremented by 1"
          - "project.total_bid_cents := 0"
          - "increment project.version by 1"
      # cycle closure: RECALLED -> DRAFT
      - from: RECALLED
        to: DRAFT
        trigger: "POST /construction/projects/{id}/reset-bid"
        actor: ContractingOfficer
        preconditions:
          - "project.bid_status == RECALLED"
        side_effects:
          - "project.bid_status := DRAFT"
          - "project.project_status := PRE_BID"
          - "increment project.version by 1"
      # project_status dimension
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /construction/projects/{id}/start-work"
        actor: ProjectManager
        preconditions:
          - "project.project_status == AWARDED"
          - "the project has a Bond with bond_type == PERFORMANCE and bond_status == ISSUED"
          - "that Bond's Surety has surety_status == ACTIVE"
          - "project.dbe_participation_pct >= project.advertised_dbe_goal_pct OR a SubcontractorQuote on this project carries good_faith_effort_basis IN {SOLICITED_DBE, DOCUMENTED_UNAVAILABLE, OUTREACH_EVENT} (ERR_DBE_GOOD_FAITH_MISSING)"
        side_effects:
          - "project.project_status := ACTIVE"
          - "project.claim_window_open := true"
          - "each BidItem on this project with item_status == AWARDED -> ACTIVE"
          - "cascade (cascade C4): each SuretyCommitment on this project with commitment_status == RESERVED -> ACTIVE"
          - "for each Surety touched by the cascade above, recompute surety_exposure_capacity (capacity_consumed_cents, available_capacity_cents)"
          - "increment project.version by 1"
      - from: ACTIVE
        to: COMPLETE
        trigger: "system event: all BidItems on the project reached CLOSED via POST /construction/projects/{project_id}/bid-items/{id}/close"
        actor: system
        preconditions:
          - "project.project_status == ACTIVE"
          - "every BidItem on this project has item_status == CLOSED"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status == CLOSED"
        side_effects:
          - "project.project_status := COMPLETE"
          - "project.claim_window_open := false"
          - "Bonds on this project become releasable (bond release precondition satisfied)"
          - "increment project.version by 1"

  # ---- BidItem: BRANCHING with a PRICED <-> SUBMITTED revision cycle --------
  - entity: BidItem
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /construction/projects/{project_id}/bid-items/{id}/price"
        actor: Estimator
        preconditions:
          - "bid_item.item_status == DRAFT"
          - "bid_unit_price_cents > 0 (ERR_UNIT_PRICE_REQUIRED)"
          - "bid_unit_price_cents >= balanced_unit_price_cents (ERR_RATE_BELOW_COST)"
        side_effects:
          - "bid_item.item_status := PRICED"
          - "bid_item.balanced_unit_price_cents := crew_rate_cents"
          - "recompute unbalanced_bid_score over the project's included BidItems"
          - "increment project.version by 1"
      - from: PRICED
        to: SUBMITTED
        trigger: "POST /construction/projects/{project_id}/bid-items/{id}/submit"
        actor: Estimator
        preconditions:
          - "bid_item.item_status == PRICED"
          - "project.bid_status IN {DRAFT, SEALED}"
        side_effects:
          - "bid_item.item_status := SUBMITTED"
          - "recompute project_bid_extension (project.total_bid_cents)"
          - "increment project.version by 1"
      # cycle back-edge
      - from: SUBMITTED
        to: PRICED
        trigger: "POST /construction/projects/{project_id}/bid-items/{id}/unsubmit"
        actor: Estimator
        preconditions:
          - "bid_item.item_status == SUBMITTED"
          - "project.bid_status != OPEN"
        side_effects:
          - "bid_item.item_status := PRICED"
          - "recompute project_bid_extension (project.total_bid_cents)"
          - "increment project.version by 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "system event: POST /construction/projects/{id}/open-bid cascade (cascade C1)"
        actor: system
        preconditions:
          - "bid_item.item_status == SUBMITTED"
          - "project.bid_status == OPEN"
        side_effects:
          - "bid_item.item_status := AWARDED"
          - "recompute quantity_variance_adjustment on every non-CLOSED QuantityReconciliation of the project"
          - "recompute retention_settlement on those QuantityReconciliations"
      - from: AWARDED
        to: ACTIVE
        trigger: "system event: POST /construction/projects/{id}/start-work cascade"
        actor: system
        preconditions:
          - "bid_item.item_status == AWARDED"
          - "project.project_status == ACTIVE"
        side_effects:
          - "bid_item.item_status := ACTIVE"
          - "bid_item.measured_quantity := 0"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /construction/projects/{project_id}/bid-items/{id}/close"
        actor: ProjectManager
        preconditions:
          - "bid_item.item_status == ACTIVE"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status == FINALIZED"
          - "every ProgressMeasurement on this item has measurement_status IN {APPROVED, PAYABLE, VOIDED}"
        side_effects:
          - "bid_item.item_status := CLOSED"
          - "bid_item.measured_quantity frozen at its reconciled value"
          - "recompute retention_settlement on the project's QuantityReconciliation"
          - "if every BidItem on the project has item_status == CLOSED, project.project_status := COMPLETE"
          - "increment project.version by 1"

  # ---- DifferingSiteCondition: cycle UNDER_REVIEW -> DOCUMENTED ------------
  - entity: DifferingSiteCondition
    initial_state: REPORTED
    terminal_states: [DENIED, DETERMINED]
    transitions:
      - from: REPORTED
        to: DOCUMENTED
        trigger: "POST /construction/differing-site-conditions/{id}/document"
        actor: ProjectManager
        preconditions:
          - "dsc.condition_status == REPORTED"
          - "project.claim_window_open == true (ERR_CLAIM_WINDOW_CLOSED)"
          - "documentation_package_urls is a non-empty array (ERR_DOCUMENTATION_INCOMPLETE)"
        side_effects:
          - "dsc.condition_status := DOCUMENTED"
          - "dsc.documentation_complete := true"
          - "recompute notice_period_elapsed (dsc.notice_days_elapsed)"
      - from: DOCUMENTED
        to: UNDER_REVIEW
        trigger: "POST /construction/differing-site-conditions/{id}/submit-claim"
        actor: ProjectManager
        preconditions:
          - "dsc.condition_status == DOCUMENTED"
          - "dsc.documentation_complete == true"
          - "project.project_status == ACTIVE"
          - "dsc.notice_days_elapsed <= 30 (ERR_NOTICE_PERIOD_EXPIRED)"
          - "dsc.claimed_amount_cents > 0 (ERR_CLAIM_AMOUNT_REQUIRED)"
        side_effects:
          - "dsc.condition_status := UNDER_REVIEW"
          - "recompute project's open QuantityReconciliation are frozen against finalization while this claim is open"
      # cycle back-edge
      - from: UNDER_REVIEW
        to: DOCUMENTED
        trigger: "POST /construction/differing-site-conditions/{id}/return-for-documentation"
        actor: Engineer
        preconditions:
          - "dsc.condition_status == UNDER_REVIEW"
        side_effects:
          - "dsc.condition_status := DOCUMENTED"
          - "dsc.documentation_complete := false"
          - "a new EngineerDetermination is NOT created on this path"
      - from: UNDER_REVIEW
        to: DETERMINED
        trigger: "POST /construction/differing-site-conditions/{id}/engineer-determination"
        actor: Engineer
        preconditions:
          - "dsc.condition_status == UNDER_REVIEW"
          - "determination_type IN {TIME_EXTENSION, COST_EQUITABLE_ADJUSTMENT, QUANTITY_ADJUSTMENT, REJECTED}"
        side_effects:
          - "dsc.condition_status := DETERMINED"
          - "the EngineerDetermination for this condition moves PENDING -> ISSUED"
          - "engineer_determination.entitles_adjustment := (determination_type IN {COST_EQUITABLE_ADJUSTMENT, QUANTITY_ADJUSTMENT})"
          - "when determination_type == QUANTITY_ADJUSTMENT, the BidItem referenced by target_bid_item_id records applied_unit_price_cents := determined_unit_rate_cents on every non-CLOSED ProgressMeasurement of that item"
          - "cascade-begin (cascade C2): recompute quantity_variance_adjustment on the project's non-CLOSED QuantityReconciliation"
          - "cascade-continue: recompute retention_settlement on that QuantityReconciliation"
          - "cascade-end: write project.contract_value_cents and project.retention_balance_cents (cascade C2 depth 3)"
          - "increment project.version by 1"
      - from: REPORTED
        to: DENIED
        trigger: "POST /construction/differing-site-conditions/{id}/deny"
        actor: Engineer
        preconditions:
          - "dsc.condition_status IN {REPORTED, DOCUMENTED, UNDER_REVIEW}"
        side_effects:
          - "dsc.condition_status := DENIED"
          - "no EngineerDetermination adjustment is applied"
      - from: DOCUMENTED
        to: DENIED
        trigger: "POST /construction/differing-site-conditions/{id}/deny"
        actor: Engineer
        preconditions:
          - "dsc.condition_status IN {REPORTED, DOCUMENTED, UNDER_REVIEW}"
        side_effects:
          - "dsc.condition_status := DENIED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /construction/differing-site-conditions/{id}/deny"
        actor: Engineer
        preconditions:
          - "dsc.condition_status IN {REPORTED, DOCUMENTED, UNDER_REVIEW}"
        side_effects:
          - "dsc.condition_status := DENIED"

  # ---- SubcontractorQuote: cycle RECEIVED <-> CARRIED (negotiation rounds) --
  - entity: SubcontractorQuote
    initial_state: RECEIVED
    terminal_states: [REJECTED, SELECTED]
    transitions:
      - from: RECEIVED
        to: CARRIED
        trigger: "POST /construction/subcontractor-quotes/{id}/carry"
        actor: Estimator
        preconditions:
          - "quote.quote_status == RECEIVED"
          - "logical clock < project.bid_deadline_at (ERR_QUOTE_AFTER_DEADLINE)"
          - "no other SubcontractorQuote on the same project_id with the same trade_code has quote_status IN {CARRIED, SELECTED} (ERR_BID_SHOPPING_RESTRICTED)"
        side_effects:
          - "quote.quote_status := CARRIED"
          - "quote.carried_in_bid := true"
          - "recompute dbe_participation_credit (quote.dbe_credit_cents, project.dbe_participation_pct)"
          - "recompute project_bid_extension (project.total_bid_cents)"
          - "increment project.version by 1"
      # cycle back-edge
      - from: CARRIED
        to: RECEIVED
        trigger: "POST /construction/subcontractor-quotes/{id}/withdraw"
        actor: Estimator
        preconditions:
          - "quote.quote_status == CARRIED"
          - "project.bid_status != OPEN"
        side_effects:
          - "quote.quote_status := RECEIVED"
          - "quote.carried_in_bid := false"
          - "quote.version_round := quote.version_round + 1"
          - "recompute project_bid_extension (project.total_bid_cents)"
          - "increment project.version by 1"
      - from: CARRIED
        to: SELECTED
        trigger: "POST /construction/subcontractor-quotes/{id}/select"
        actor: ContractingOfficer
        preconditions:
          - "quote.quote_status == CARRIED"
          - "project.bid_status == OPEN"
          - "logical clock >= project.bid_deadline_at"
        side_effects:
          - "quote.quote_status := SELECTED"
          - "recompute dbe_participation_credit (project.dbe_participation_pct)"
      - from: CARRIED
        to: REJECTED
        trigger: "POST /construction/subcontractor-quotes/{id}/reject"
        actor: ContractingOfficer
        preconditions:
          - "quote.quote_status IN {CARRIED, SELECTED}"
        side_effects:
          - "quote.quote_status := REJECTED"
          - "quote.carried_in_bid := false"
          - "recompute project_bid_extension (project.total_bid_cents)"
          - "increment project.version by 1"
      - from: SELECTED
        to: REJECTED
        trigger: "POST /construction/subcontractor-quotes/{id}/reject"
        actor: ContractingOfficer
        preconditions:
          - "quote.quote_status IN {CARRIED, SELECTED}"
        side_effects:
          - "quote.quote_status := REJECTED"
          - "quote.carried_in_bid := false"

  # ---- Bond: branching with an EXECUTED arm and early cancellation ----------
  - entity: Bond
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /construction/bonds/{id}/issue"
        actor: Surety
        preconditions:
          - "bond.bond_status == PENDING"
          - "bond.required_bond_cents <= bond.bond_amount_cents (ERR_BOND_AMOUNT_INSUFFICIENT)"
          - "surety.surety_status == ACTIVE (ERR_SURETY_SUSPENDED)"
          - "surety.available_capacity_cents >= bond.bond_amount_cents (ERR_AGGREGATE_CAPACITY_EXCEEDED)"
          - "when bond.bond_type == PERFORMANCE, bond.bond_amount_cents <= surety.single_job_limit_cents (ERR_AGGREGATE_CAPACITY_EXCEEDED)"
          - "no other Bond on the same project_id with the same bond_type has bond_status IN {ISSUED, EXECUTED} and an effective interval that intersects [bond.effective_from, bond.effective_to) (ERR_RESERVATION_OVERLAP)"
        side_effects:
          - "bond.bond_status := ISSUED"
          - "bond.issued_at := logical clock"
          - "bond.capacity_consumed_cents := bond.bond_amount_cents"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"
          - "when bond.bond_type == PERFORMANCE, recompute performance_bond_requirement (bond.required_bond_cents)"
      - from: PENDING
        to: RELEASED
        trigger: "POST /construction/bonds/{id}/release-bond"
        actor: ContractingOfficer
        preconditions:
          - "bond.bond_status == PENDING"
        side_effects:
          - "bond.bond_status := RELEASED"
          - "bond.released_at := logical clock"
          - "bond.capacity_consumed_cents := 0"
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /construction/bonds/{id}/execute"
        actor: PlatformAdmin
        preconditions:
          - "bond.bond_status == ISSUED"
          - "bond.bond_type == PERFORMANCE"
          - "the project's payment Bond has lien_claim_amount_cents > 0 (ERR_NO_LIEN_CLAIM)"
        side_effects:
          - "bond.bond_status := EXECUTED"
          - "bond.capacity_consumed_cents := bond.bond_amount_cents"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents)"
      - from: ISSUED
        to: RELEASED
        trigger: "POST /construction/bonds/{id}/release-bond"
        actor: ContractingOfficer
        preconditions:
          - "bond.bond_status == ISSUED"
          - "project.project_status == COMPLETE"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status == CLOSED"
        side_effects:
          - "bond.bond_status := RELEASED"
          - "bond.released_at := logical clock"
          - "bond.capacity_consumed_cents := 0"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"
      - from: EXECUTED
        to: RELEASED
        trigger: "POST /construction/bonds/{id}/release-bond"
        actor: ContractingOfficer
        preconditions:
          - "bond.bond_status == EXECUTED"
          - "project.project_status == COMPLETE"
        side_effects:
          - "bond.bond_status := RELEASED"
          - "bond.released_at := logical clock"
          - "bond.capacity_consumed_cents := 0"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents)"

  # ---- Surety: ACTIVE <-> SUSPENDED cycle ----------------------------------
  - entity: Surety
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /construction/sureties/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "surety.surety_status == ACTIVE"
        side_effects:
          - "surety.surety_status := SUSPENDED"
          - "recompute surety_exposure_capacity (available_capacity_cents unchanged, all cadence frozen)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /construction/sureties/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "surety.surety_status == SUSPENDED"
        side_effects:
          - "surety.surety_status := ACTIVE"
          - "recompute surety_exposure_capacity (available_capacity_cents)"

  # ---- SuretyCommitment: RESERVED -> ACTIVE -> RELEASED --------------------
  - entity: SuretyCommitment
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "system event: POST /construction/projects/{id}/start-work cascade (cascade C4)"
        actor: system
        preconditions:
          - "commitment.commitment_status == RESERVED"
          - "project.project_status == ACTIVE"
        side_effects:
          - "commitment.commitment_status := ACTIVE"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents)"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /construction/surety-commitments/{id}/release-commitment, or system event: the project-completion hop of cascade C3"
        actor: ContractingOfficer
        preconditions:
          - "commitment.commitment_status IN {RESERVED, ACTIVE}"
          - "project.project_status == COMPLETE"
        side_effects:
          - "commitment.commitment_status := RELEASED"
          - "commitment.released_at := logical clock"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /construction/surety-commitments/{id}/release-commitment, or system event: the project-completion hop of cascade C3"
        actor: ContractingOfficer
        preconditions:
          - "commitment.commitment_status IN {RESERVED, ACTIVE}"
          - "project.project_status == COMPLETE"
        side_effects:
          - "commitment.commitment_status := RELEASED"
          - "commitment.released_at := logical clock"
          - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"

  # ---- ProgressMeasurement: DRAFT -> APPROVED -> PAYABLE, VOIDED terminal --
  - entity: ProgressMeasurement
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /construction/measurements/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "measurement.measurement_status == DRAFT"
          - "measurement.measured_quantity > 0"
          - "bid_item.item_status == ACTIVE (ERR_ITEM_NOT_ACTIVE)"
        side_effects:
          - "measurement.measurement_status := APPROVED"
          - "recompute quantity_variance_adjustment (bid_item.measured_quantity, bid_item.variance_pct, bid_item.renegotiation_required)"
          - "recompute quantity_variance_adjustment (measurement.applied_unit_price_cents): renegotiated rate when a FINAL QUANTITY_ADJUSTMENT determination covers this item, otherwise bid_item.bid_unit_price_cents"
          - "measurement.payable_amount_cents := quantity_variance_adjustment payable amount"
          - "recompute retention_settlement and absolute_retention_reconciliation (project.retention_balance_cents, reconciliation.pace_basis_retention_cents)"
          - "increment project.version by 1"
      - from: APPROVED
        to: PAYABLE
        trigger: "POST /construction/measurements/{id}/pay"
        actor: ProjectManager
        preconditions:
          - "measurement.measurement_status == APPROVED"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status == OPEN"
        side_effects:
          - "measurement.measurement_status := PAYABLE"
          - "measurement.payable_amount_cents frozen at the APPROVED value"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /construction/measurements/{id}/void"
        actor: ProjectManager
        preconditions:
          - "measurement.measurement_status IN {APPROVED, PAYABLE}"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status != CLOSED"
        side_effects:
          - "measurement.measurement_status := VOIDED"
          - "measurement.payable_amount_cents := 0"
          - "recompute quantity_variance_adjustment (bid_item.measured_quantity, bid_item.variance_pct, bid_item.renegotiation_required)"
          - "recompute retention_settlement (project.retention_balance_cents, reconciliation.retention_held_cents)"
          - "increment project.version by 1"
      - from: PAYABLE
        to: VOIDED
        trigger: "POST /construction/measurements/{id}/void"
        actor: ProjectManager
        preconditions:
          - "measurement.measurement_status IN {APPROVED, PAYABLE}"
          - "the project's non-CLOSED QuantityReconciliation has reconciliation_status != CLOSED"
        side_effects:
          - "measurement.measurement_status := VOIDED"
          - "measurement.payable_amount_cents := 0"
          - "recompute quantity_variance_adjustment (bid_item.measured_quantity, bid_item.variance_pct, bid_item.renegotiation_required)"
          - "recompute retention_settlement (project.retention_balance_cents, reconciliation.retention_held_cents)"
          - "increment project.version by 1"

  # ---- QuantityReconciliation: OPEN -> FINALIZED -> CLOSED -----------------
  - entity: QuantityReconciliation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
        actor: ContractingOfficer
        preconditions:
          - "reconciliation.reconciliation_status == OPEN"
          - "no DifferingSiteCondition on this project has condition_status IN {REPORTED, DOCUMENTED, UNDER_REVIEW} (ERR_OPEN_CLAIM_BLOCKS_CLOSEOUT)"
          - "every ProgressMeasurement on every BidItem of this project has measurement_status IN {APPROVED, PAYABLE, VOIDED}"
        side_effects:
          - "reconciliation.reconciliation_status := FINALIZED"
          - "reconciliation.closeout_status := PENDING_RETENTION"
          - "recompute quantity_variance_adjustment over all BidItems of the project (overrun_item_count, underrun_item_count, net_adjustment_cents)"
          - "recompute retention_settlement (reconciliation.final_contract_value_cents, reconciliation.retention_held_cents)"
          - "write project.contract_value_cents, project.retention_balance_cents"
          - "increment project.version by 1"
      - from: FINALIZED
        to: CLOSED
        trigger: "POST /construction/projects/{project_id}/reconciliations/{id}/release-retention"
        actor: ContractingOfficer
        preconditions:
          - "reconciliation.reconciliation_status == FINALIZED"
        side_effects:
          - "reconciliation.reconciliation_status := CLOSED"
          - "reconciliation.retention_released_cents := reconciliation.retention_held_cents"
          - "reconciliation.closeout_status := CLOSED"
          - "project.retention_balance_cents := 0"
          - "cascade-begin (cascade C3): each BidItem of this project with item_status == ACTIVE -> CLOSED"
          - "cascade-continue: when every BidItem of the project is CLOSED, project.project_status := COMPLETE and project.claim_window_open := false"
          - "cascade-continue: every SuretyCommitment on this project with commitment_status IN {RESERVED, ACTIVE} -> RELEASED, and every Bond on this project with bond_status ISSUED -> RELEASED"
          - "cascade-end: recompute surety_exposure_capacity for every Surety bound to this project (cascade C3 depth 3)"
          - "increment project.version by 1"

  # ---- EngineerDetermination: PENDING -> ISSUED -> FINAL -------------------
  - entity: EngineerDetermination
    initial_state: PENDING
    terminal_states: [FINAL]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /construction/differing-site-conditions/{id}/engineer-determination"
        actor: Engineer
        preconditions:
          - "determination.determination_status == PENDING"
          - "the parent DifferingSiteCondition has condition_status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects:
          - "determination.determination_status := ISSUED"
          - "determination.issued_at := logical clock"
          - "determination.entitles_adjustment := (determination_type IN {COST_EQUITABLE_ADJUSTMENT, QUANTITY_ADJUSTMENT})"
          - "the parent DifferingSiteCondition moves UNDER_REVIEW -> DETERMINED"
          - "cascade C2 fires (see DifferingSiteCondition.UNDER_REVIEW_to_DETERMINED)"
      - from: ISSUED
        to: FINAL
        trigger: "POST /construction/engineer-determinations/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "determination.determination_status == ISSUED"
        side_effects:
          - "determination.determination_status := FINAL"
          - "the determination becomes immutable; later measurement approvals apply determined_unit_rate_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: measurement-create-stale-bid-item
    parent_entity: BidItem
    write_endpoint: "POST /construction/bid-items/{bid_item_id}/measurements"
    occ_field: "expected_bid_item_version"
    description: |
      Recording a new ProgressMeasurement against a BidItem whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just approved or voided a measurement on the
      same item (which legitimately moves bid_item.measured_quantity and
      bid_item.variance_pct under §1.3) and the current writer's view of the item
      is therefore stale.
    error_id: ERR_STALE_BID_ITEM_VERSION
    http_status: 412
  - rule_id: reconciliation-finalize-stale-project
    parent_entity: Project
    write_endpoint: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
    occ_field: "expected_project_version"
    description: |
      Finalizing a QuantityReconciliation against a Project whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just issued an engineer determination or
      approved a measurement on the same project (both of which legitimately
      bump project.version under the §1.2 side-effect chains) and the current
      writer's view of the project is therefore stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: project_bid_extension
    trigger: "on BidItem.submit, BidItem.unsubmit, BidItem.price, SubcontractorQuote.carry, SubcontractorQuote.withdraw, SubcontractorQuote.reject, Project.recall-bid, Project.seal-bid, Project.open-bid"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned: item extensions first, then the subcontract sum,
      # then the project total. Rounding happens ONLY at item level (round_half_up),
      # never again at the sum — the sum of integers is exact.
      SUM_EXCLUDED_STATUSES = {DRAFT}
      ITEMS = [i for i in project.bid_items if i.item_status NOT IN SUM_EXCLUDED_STATUSES]
      item_extended_cents(i) = round_half_up(i.bid_unit_price_cents * i.estimated_quantity)
      items_subtotal_cents    = sum(item_extended_cents(i) for i in ITEMS)
      subcontract_subtotal_cents = sum(q.quoted_amount_cents for q in project.quotes
                                       if q.quote_status IN {CARRIED, SELECTED})
      total_bid_cents = items_subtotal_cents + subcontract_subtotal_cents
    input_set: "BidItems whose item_status NOT IN {DRAFT}; SubcontractorQuotes whose quote_status IN {CARRIED, SELECTED}; both scoped to the project"
    constants:
      ROUNDING_ORDER: "per-item then sum"
      ROUNDING_MODE: "round_half_up"
    precision: "0 decimal places on cents (integer cents); round_half_up at item level only"
    variants:
      - name: with_carried_quotes
        when: "the project has at least one SubcontractorQuote with quote_status IN {CARRIED, SELECTED}"
        difference: "includes subcontract_subtotal_cents; the without-carried-quotes variant omits it entirely"
      - name: without_carried_quotes
        when: "no SubcontractorQuote has been carried; the open-bid or pre-quote state"
        difference: "total equals items_subtotal_cents, so the same takeoff yields a strictly smaller total"

  - name: quantity_variance_adjustment
    trigger: "on ProgressMeasurement.approve, ProgressMeasurement.void, BidItem.AWARDED (cascade C1), EngineerDetermination ISSUED with QUANTITY_ADJUSTMENT (cascade C2), QuantityReconciliation.finalize"
    algorithm: threshold
    formula: |
      # Population: non-VOIDED measurements only. Chronological order: measured_at ASC,
      # tie-break created_at ASC — never id.
      counted = sorted([m for m in bid_item.measurements if m.measurement_status != VOIDED],
                       key=lambda m: (m.measured_at, m.created_at))
      cumulative_qty = sum(m.measured_quantity for m in counted)
      # derived bid_item.measured_quantity := cumulative_qty
      variance_pct = (cumulative_qty - bid_item.estimated_quantity) / bid_item.estimated_quantity * 100
      # boundary precision: overrun fires strictly above; underrun fires strictly below
      renegotiation_required = (variance_pct > bid_item.overrun_threshold_pct) \
                               or (variance_pct < -1 * bid_item.underrun_threshold_pct)
      # ev = economic variance of an item whose rate the engineer re-set;
      #    0 for every other item. uplift = clamp(ev, 0, 300) * 2 * 100
      # net_adjustment_cents applies ONLY to items with renegotiation_required == true
      ev(item) = round_half_up(item.variance_pct)
      uplift(item) = min(floor(max(ev(item), 0)), 300) * 2 * 100
      net_adjustment_cents = sum(uplift(i) for i in project.bid_items
                                 if i.renegotiation_required == true)
    input_set: "ProgressMeasurements with measurement_status != VOIDED, scoped to one BidItem; BidItems scoped to one project for net_adjustment_cents"
    constants:
      OVERRUN_BOUNDARY: "strict > (variance exactly equal to overrun_threshold_pct does NOT trigger)"
      UNDERRUN_BOUNDARY: "strict < (variance exactly equal to minus underrun_threshold_pct does NOT trigger)"
      UPLIFT_PER_EV_POINT_CENTS: 200
      UPLIFT_CAP_EV: 300
      CHRONO_TIEBREAK: "measured_at ASC, then created_at ASC"
    precision: "2 decimal places on variance_pct (round_half_up); integer cents on net_adjustment_cents"
    variants:
      - name: draft_inclusive_estimate
        when: "the item's reconciliation_status is OPEN and measurement_status == PAYABLE rows are included in the running quantity"
        difference: "cumulative_qty includes PAYABLE measurements, so variance_pct is strictly larger than the approved-only variant whenever any measurement has been paid"
      - name: final_payable_only
        when: "the reconciliation has been FINALIZED; only APPROVED rows count"
        difference: "PAYABLE rows are dropped from the population, so variance_pct is strictly smaller and net_adjustment_cents can fall below the overrun band and stop triggering"

  - name: bid_unbalanced_unit_price_extension
    trigger: "on BidItem.price, Project.seal-bid"
    algorithm: tiered_pricing
    formula: |
      # Dual variant of the bid extension over the SAME takeoff.
      # Band assignment is marginal-free (whole-item), so a straddling item is
      # assigned wholly to the higher band — that is the pinned interpretation.
      for each included BidItem i:
        r_i = i.bid_unit_price_cents / i.balanced_unit_price_cents
        if r_i < 0.80:  multiplier_i = 1.00     # front-loaded band
        elif r_i < 1.20: multiplier_i = 1.00    # at-cost band
        elif r_i < 2.00: multiplier_i = 1.005   # moderately unbalanced band
        else:            multiplier_i = 1.015   # materially unbalanced band
      extended_cents(i) = round_half_up(i.estimated_quantity * i.balanced_unit_price_cents * multiplier_i)
      unbalanced_bid_score = sum(extended_cents(i)) over included BidItems
    input_set: "BidItems with item_status NOT IN {DRAFT} and balanced_unit_price_cents > 0"
    constants:
      BAND_1_RATIO_MAX_EXCLUSIVE: 0.80
      BAND_2_RATIO_MAX_EXCLUSIVE: 1.20
      BAND_3_RATIO_MAX_EXCLUSIVE: 2.00
      MULTIPLIER_BAND_1: 1.00
      MULTIPLIER_BAND_2: 1.00
      MULTIPLIER_BAND_3: 1.005
      MULTIPLIER_BAND_4: 1.015
    precision: "integer cents; round_half_up per item, then exact integer sum"
    variants:
      - name: actual_bid_extension
        when: "the bid total is reported"
        difference: "uses bid_unit_price_cents directly and equals project_bid_extension.items_subtotal_cents"

  - name: retention_settlement
    trigger: "on ProgressMeasurement.approve, ProgressMeasurement.void, QuantityReconciliation.finalize, QuantityReconciliation.release-retention"
    algorithm: waterfall_allocation
    formula: |
      payable_measurements = [m for item in project.bid_items for m in item.measurements
                              if m.measurement_status IN {APPROVED, PAYABLE}]
      gross_payable_cents  = sum(m.payable_amount_cents for m in payable_measurements)
      retention_held_cents = round_half_up(gross_payable_cents * project.retention_rate_pct / 100)
      final_contract_value_cents = project.contract_value_cents + reconciliation.net_adjustment_cents
      # waterfall release: retention_balance_cents is debited release-point by release-point
      retention_released_cents = 0 if reconciliation_status != CLOSED else retention_held_cents
      project.retention_balance_cents = retention_held_cents - retention_released_cents
    input_set: "ProgressMeasurements with measurement_status IN {APPROVED, PAYABLE} on the project; the project's non-CLOSED QuantityReconciliation"
    constants:
      RELEASE_POINTS: 2
    precision: "integer cents; round_half_up once, on the gross payable base"

  - name: absolute_retention_reconciliation
    trigger: "on QuantityReconciliation.finalize"
    algorithm: threshold
    formula: |
      # Dual variant of retention_settlement: an absolute grade threshold replaces the
      # percentage base. Materially different number from retention_settlement for
      # identical inputs, over a different entity domain (quantity, not dollars).
      gross_payable_cents  = retention_settlement.gross_payable_cents
      ANNUAL_PACE_CENTS    = 40_000_000_00                    # $40,000,000 per year
      monthly_pace_cents   = ANNUAL_PACE_CENTS / 12
      retention_held_cents = 0 if gross_payable_cents >= monthly_pace_cents \
                             else round_half_up(monthly_pace_cents * project.retention_rate_pct / 100)
    input_set: "the same APPROVED|PAYABLE ProgressMeasurement population as retention_settlement"
    constants:
      ANNUAL_PACE_CENTS: 4000000000
      MONTHLY_PACE_CENTS: 333333333
      PACE_BOUNDARY: "strict >= (gross exactly equal to the pace releases retention entirely)"
    precision: "integer cents; round_half_up once"
    variants:
      - name: pace_based
        when: "the owner's closeout template grades the retention by work-in-place pace"
        difference: "releases retention entirely at or above the monthly pace, so it diverges from the percentage basis for heavily-measured projects"

  - name: performance_bond_requirement
    trigger: "on Bond.issue, Project.open-bid"
    algorithm: tiered_pricing
    formula: |
      # Tiered statutory requirement whose tiers are selected by contract size, AND
      # whose required amount feeds the capacity precondition on the following hop.
      # Whole-tier selection (the tier whose upper bound the contract size falls
      # under) is the pinned interpretation — not marginal-rate allocation.
      size = project.contract_value_cents
      if size <= 100_000_00:      STATUTORY_PCT = 0.50
      elif size <= 500_000_00:    STATUTORY_PCT = 0.75
      elif size <= 1_000_000_00:  STATUTORY_PCT = 1.00
      else:                       STATUTORY_PCT = 1.25
      if bond.bond_type == PERFORMANCE: required_bond_cents = round_half_up(size * STATUTORY_PCT)
      elif bond.bond_type == PAYMENT:   required_bond_cents = round_half_up(size * 1.00)
      else:                              required_bond_cents = round_half_up(project.total_bid_cents * 0.10)
    input_set: "the project's current contract_value_cents (or total_bid_cents for BID bonds); the Bond's bond_type"
    constants:
      TIER_1_MAX_CENTS: 10000000
      TIER_2_MAX_CENTS: 50000000
      TIER_3_MAX_CENTS: 100000000
      TIER_1_PCT: 0.50
      TIER_2_PCT: 0.75
      TIER_3_PCT: 1.00
      TIER_4_PCT: 1.25

  - name: surety_exposure_capacity
    trigger: "on Bond.issue, Bond.release-bond, Bond.execute, Surety.suspend, Surety.reinstate, Project.start-work (cascade C4), QuantityReconciliation.release-retention (cascade C3)"
    algorithm: constraint_propagation
    formula: |
      # Conserved quantity: surety.aggregate_capacity_cents is immutable; only the
      # consumed/available split moves. Forward (issue) and compensating (release)
      # must restore the original available_capacity_cents exactly.
      consumed = sum(b.capacity_consumed_cents for b in surety.bonds) \
               + sum(c.committed_amount_cents for c in surety.commitments
                     if c.commitment_status IN {RESERVED, ACTIVE})
      available_capacity_cents = max(0, surety.aggregate_capacity_cents - consumed)
      # gate A: projected_available = aggregate_capacity_cents - consumed
      # gate B (commitments only): intersect_consumed = sum(c.committed_amount_cents for c in surety.commitments
      #         whose [reserved_at, released_at) interval intersects the new interval)
      #         the reservation is refused when intersect_consumed + requested > aggregate_capacity_cents
      #       newly requested amount may be issued only when
      #       projected_available - requested_amount >= 0
    input_set: "Bonds bound to the surety (capacity_consumed_cents is zero unless ISSUED or EXECUTED); SuretyCommitments with commitment_status IN {RESERVED, ACTIVE}"
    constants:
      FLOOR: 0

  - name: dbe_participation_credit
    trigger: "on SubcontractorQuote.carry, SubcontractorQuote.withdraw, SubcontractorQuote.select, SubcontractorQuote.reject, Project.open-bid, Project.start-work"
    algorithm: weighted_scoring
    formula: |
      # Denominator is pinned as the sum over SubcontractorQuotes with
      # quote_status IN {CARRIED, SELECTED} — never total_bid_cents.
      numerator_cents = sum(q.quoted_amount_cents for q in project.quotes
                            if q.quote_status IN {CARRIED, SELECTED} and q.unicap_registered == true)
      denominator_cents = sum(q.quoted_amount_cents for q in project.quotes
                              if q.quote_status IN {CARRIED, SELECTED})
      dbe_participation_pct = 0 if denominator_cents == 0 \
                              else round_half_up(numerator_cents / denominator_cents * 100, 2)
    input_set: "SubcontractorQuotes on the project with quote_status IN {CARRIED, SELECTED}; a project with zero such quotes scores 0, not undefined"
    constants:
      EMPTY_DENOMINATOR_RESULT: 0
    precision: "2 decimal places, round_half_up"

  - name: notice_period_elapsed
    trigger: "on DifferingSiteCondition.document, DifferingSiteCondition.submit-claim, and on every read of the condition"
    algorithm: chronological
    formula: |
      notice_days_elapsed = floor((logical_clock - dsc.reported_at) / 86400 seconds)
      notice_expired = notice_days_elapsed > 30          # strict >, so day 30 is still timely
    input_set: "the DifferingSiteCondition's reported_at against the logical clock"
    constants:
      NOTICE_LIMIT_DAYS: 30
      NOTICE_BOUNDARY: "strict > (exactly 30 days elapsed is still a timely notice)"

  - name: crew_productivity_unit_cost
    trigger: "on BidItem.price (sets balanced_unit_price_cents)"
    algorithm: aggregation
    formula: |
      crew_day_labor_cents = day_labor_crew_size * day_labor_rate_cents_per_hour * day_labor_hours
      crew_day_equipment_cents = sum(e.hourly_rate_cents * e.hours_per_day
                                     for e in day_equipment)
      crew_day_cents = crew_day_labor_cents + crew_day_equipment_cents
      balanced_unit_price_cents = round_half_up(crew_day_cents / daily_productivity_units)
    input_set: "the estimator-supplied crew assumptions on the pricing request"
    constants:
      HOURS_PER_DAY: 8
    precision: "integer cents; round_half_up once on the per-unit quotient"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /construction/sessions and POST /construction/_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the operation (see §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all except POST /construction/sessions and POST /construction/_clock/set_current_utc"
  - priority: 3
    category: auth
    check: "request body parses, carries every required field, and every enum-valued field holds a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that take a request body"
  - priority: 4
    category: existence
    check: "project_id (path) resolves to a Project"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {project_id} or {id} bound to a Project"
  - priority: 5
    category: existence
    check: "bid_item_id / {id} (path) resolves to a BidItem, evaluated after priority 3"
    error_id: ERR_BID_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/bid-items/{bid_item_id}/measurements, POST /construction/projects/{project_id}/bid-items/{id}/*"
  - priority: 6
    category: existence
    check: "surety_id (path or body) resolves to a Surety"
    error_id: ERR_SURETY_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/surety-commitments, POST /construction/bonds, POST /construction/sureties/{id}/*"
  - priority: 7
    category: existence
    check: "{id} resolves to a SubcontractorQuote"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/subcontractor-quotes/{id}/*"
  - priority: 8
    category: existence
    check: "{id} resolves to a Bond"
    error_id: ERR_BOND_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/bonds/{id}/*"
  - priority: 9
    category: existence
    check: "{id} resolves to a ProgressMeasurement"
    error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/measurements/{id}/*"
  - priority: 10
    category: existence
    check: "{id} resolves to a QuantityReconciliation and belongs to {project_id}"
    error_id: ERR_RECONCILIATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/*"
  - priority: 11
    category: existence
    check: "{id} resolves to a DifferingSiteCondition"
    error_id: ERR_CONDITION_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/differing-site-conditions/{id}/*"
  - priority: 12
    category: existence
    check: "{id} resolves to an EngineerDetermination"
    error_id: ERR_DETERMINATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/engineer-determinations/{id}/finalize"
  - priority: 13
    category: existence
    check: "{id} resolves to a SuretyCommitment"
    error_id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /construction/surety-commitments/{id}/release-commitment"
  - priority: 14
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version (OCC, §1.2.1)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
  - priority: 15
    category: state
    check: "expected_bid_item_version in the body equals the BidItem's current version (OCC, §1.2.1)"
    error_id: ERR_STALE_BID_ITEM_VERSION
    http_status: 412
    applies_to: "POST /construction/bid-items/{bid_item_id}/measurements"
  - priority: 16
    category: state
    check: "target resource is in the from-state the requested transition requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints named in §1.2"
  - priority: 17
    category: state
    check: "dependent-sibling state precondition holds (e.g. bid_item.item_status == ACTIVE for measurement approval)"
    error_id: ERR_ITEM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /construction/measurements/{id}/approve"
  - priority: 18
    category: business_safety
    check: "the Surety backing the bond has surety_status == ACTIVE"
    error_id: ERR_SURETY_SUSPENDED
    http_status: 422
    applies_to: "POST /construction/bonds/{id}/issue"
  - priority: 19
    category: business_safety
    check: "no quote on the same (project_id, trade_code) is already CARRIED or SELECTED; bid shopping is prohibited"
    error_id: ERR_BID_SHOPPING_RESTRICTED
    http_status: 422
    applies_to: "POST /construction/subcontractor-quotes/{id}/carry"
  - priority: 20
    category: business_constraint
    check: "at most one non-CLOSED QuantityReconciliation per project_id"
    error_id: ERR_RECONCILIATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /construction/projects/{project_id}/reconciliations"
  - priority: 21
    category: business_constraint
    check: "no two ISSUED/EXECUTED bonds of the same bond_type on a project have intersecting effective intervals"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /construction/bonds/{id}/issue"
  - priority: 22
    category: business_constraint
    check: "project_code unique across projects whose project_status != COMPLETE"
    error_id: ERR_DUPLICATE_PROJECT_CODE
    http_status: 409
    applies_to: "POST /construction/projects"
  - priority: 23
    category: business_constraint
    check: "item_code unique within project_id"
    error_id: ERR_DUPLICATE_ITEM_CODE
    http_status: 409
    applies_to: "POST /construction/projects/{project_id}/bid-items"
  - priority: 24
    category: business_temporal
    check: "logical clock is strictly before project.bid_deadline_at"
    error_id: ERR_BID_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /construction/projects/{id}/seal-bid, POST /construction/projects/{id}/recall-bid, POST /construction/subcontractor-quotes/{id}/carry"
  - priority: 25
    category: business_temporal
    check: "logical clock is at or after project.bid_deadline_at"
    error_id: ERR_BID_NOT_YET_CLOSED
    http_status: 422
    applies_to: "POST /construction/projects/{id}/open-bid, POST /construction/subcontractor-quotes/{id}/select"
  - priority: 26
    category: business_temporal
    check: "logical clock is strictly before project.bid_deadline_at when a subcontractor quote is recorded or carried"
    error_id: ERR_QUOTE_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /construction/subcontractor-quotes, POST /construction/subcontractor-quotes/{id}/carry"
  - priority: 27
    category: business_temporal
    check: "project.claim_window_open == true when a differing site condition is recorded or documented"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /construction/differing-site-conditions, POST /construction/differing-site-conditions/{id}/document"
  - priority: 28
    category: business_temporal
    check: "notice_days_elapsed <= 30 when the claim is submitted"
    error_id: ERR_NOTICE_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /construction/differing-site-conditions/{id}/submit-claim"
  - priority: 29
    category: business_referential
    check: "documentation_package_urls is a non-empty array"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /construction/differing-site-conditions/{id}/document"
  - priority: 30
    category: business_referential
    check: "claimed_amount_cents > 0 on the condition being submitted"
    error_id: ERR_CLAIM_AMOUNT_REQUIRED
    http_status: 422
    applies_to: "POST /construction/differing-site-conditions/{id}/submit-claim"
  - priority: 31
    category: business_referential
    check: "bid_unit_price_cents >= balanced_unit_price_cents (the crew-productivity cost floor)"
    error_id: ERR_RATE_BELOW_COST
    http_status: 422
    applies_to: "POST /construction/projects/{project_id}/bid-items/{id}/price, POST /construction/projects/{id}/seal-bid"
  - priority: 32
    category: business_referential
    check: "the bond's statutory required_bond_cents <= its bond_amount_cents"
    error_id: ERR_BOND_AMOUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /construction/bonds/{id}/issue"
  - priority: 33
    category: business_referential
    check: "the project's payment Bond has lien_claim_amount_cents > 0 before a PERFORMANCE bond may be called"
    error_id: ERR_NO_LIEN_CLAIM
    http_status: 422
    applies_to: "POST /construction/bonds/{id}/execute"
  - priority: 34
    category: business_fiscal
    check: "surety.available_capacity_cents >= bond.bond_amount_cents, and for PERFORMANCE bonds bond.bond_amount_cents <= surety.single_job_limit_cents"
    error_id: ERR_AGGREGATE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /construction/bonds/{id}/issue, POST /construction/surety-commitments"
  - priority: 35
    category: business_constraint
    check: "the sum of committed_amount_cents over every SuretyCommitment on the surety whose [reserved_at, released_at) interval intersects the new commitment's interval, plus the requested amount, does not exceed aggregate_capacity_cents"
    error_id: ERR_AGGREGATE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /construction/surety-commitments"
  - priority: 36
    category: business_fiscal
    check: "project.dbe_participation_pct >= advertised_dbe_goal_pct OR a documented good-faith-effort basis exists on the project"
    error_id: ERR_DBE_GOOD_FAITH_MISSING
    http_status: 422
    applies_to: "POST /construction/projects/{id}/start-work"
  - priority: 37
    category: business_fiscal
    check: "an item whose variance_pct crosses a configured threshold must have a FINAL renegotiated rate before its reconciliation can be finalized"
    error_id: ERR_QUANTITY_RENEGOTIATION_REQUIRED
    http_status: 422
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
  - priority: 38
    category: business_fiscal
    check: "no DifferingSiteCondition on the project sits in REPORTED, DOCUMENTED or UNDER_REVIEW"
    error_id: ERR_OPEN_CLAIM_BLOCKS_CLOSEOUT
    http_status: 422
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
  - priority: 39
    category: business_fiscal
    check: "every ProgressMeasurement on the project sits in APPROVED, PAYABLE or VOIDED"
    error_id: ERR_MEASUREMENTS_PENDING
    http_status: 422
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
  - priority: 40
    category: business_fiscal
    check: "the reconciliation sits in FINALIZED before retention may be released"
    error_id: ERR_RETENTION_NOT_RELEASABLE
    http_status: 422
    applies_to: "POST /construction/projects/{project_id}/reconciliations/{id}/release-retention"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock --------------------------------------------------------
  - method: POST
    path: "/construction/_clock/set_current_utc"
    description: "Advance the server's logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before the first call."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["recompute notice_period_elapsed on every DifferingSiteCondition"]

  - method: POST
    path: "/construction/sessions"
    description: "Exchange a declared role for a session token. Open endpoint."
    roles: [Anonymous]
    code: 201
    input: [role, "user_id?"]
    output: "{ session_token: string, role: string, user_id: string }"
    side_effects: []

  # ---- Surety ---------------------------------------------------------------
  - method: POST
    path: "/construction/sureties"
    description: "Register a surety firm with its aggregate and single-job capacity"
    roles: [PlatformAdmin]
    code: 201
    input: [surety_name, aggregate_capacity_cents, single_job_limit_cents]
    output: Surety
    side_effects: ["initialize capacity_consumed_cents to 0 and available_capacity_cents to aggregate_capacity_cents"]
  - method: GET
    path: "/construction/sureties"
    description: "List sureties, optionally filtered by status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["surety_status?", "limit?", "offset?"]
    output: Surety[]
    side_effects: []
  - method: GET
    path: "/construction/sureties/{id}"
    description: "Read one surety including its capacity split"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: Surety
    side_effects: []
  - method: POST
    path: "/construction/sureties/{id}/suspend"
    description: "Suspend a surety so no further bonds may be issued"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Surety
    side_effects: ["surety.surety_status := SUSPENDED", "increment Surety.version by 1"]
  - method: POST
    path: "/construction/sureties/{id}/reinstate"
    description: "Lift a suspension"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Surety
    side_effects: ["surety.surety_status := ACTIVE", "increment Surety.version by 1"]

  # ---- SuretyCommitment -----------------------------------------------------
  - method: POST
    path: "/construction/surety-commitments"
    description: "Reserve part of a surety's aggregate capacity against a project"
    roles: [ContractingOfficer, Estimator]
    code: 201
    input: [surety_id, project_id, committed_amount_cents]
    output: SuretyCommitment
    side_effects:
      - "reject the reservation when the sum of temporally intersecting commitments, plus the requested amount, would exceed aggregate_capacity_cents (ERR_AGGREGATE_CAPACITY_EXCEEDED)"
      - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"
      - "increment Surety.version by 1"
  - method: GET
    path: "/construction/surety-commitments"
    description: "List capacity reservations, filtered by surety, project or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["surety_id?", "project_id?", "commitment_status?", "limit?", "offset?"]
    output: SuretyCommitment[]
    side_effects: []
  - method: GET
    path: "/construction/surety-commitments/{id}"
    description: "Read one capacity reservation"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: SuretyCommitment
    side_effects: []
  - method: POST
    path: "/construction/surety-commitments/{id}/release-commitment"
    description: "Release a reservation back to the surety's available capacity"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: SuretyCommitment
    side_effects:
      - "commitment.commitment_status := RELEASED"
      - "commitment.released_at := logical clock"
      - "recompute surety_exposure_capacity (surety.capacity_consumed_cents, surety.available_capacity_cents)"
      - "increment Surety.version by 1"

  # ---- Project --------------------------------------------------------------
  - method: POST
    path: "/construction/projects"
    description: "Open a project record for a public works bid"
    roles: [Estimator, PlatformAdmin]
    code: 201
    input: [project_code, owner_agency_name, "contract_type?", bid_deadline_at, "retention_rate_pct?", "advertised_dbe_goal_pct?"]
    output: Project
    side_effects:
      - "project.bid_window_open_at := logical clock"
      - "project.bid_status := DRAFT; project.project_status := PRE_BID"
  - method: GET
    path: "/construction/projects"
    description: "List projects, filtered by bid or delivery status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["bid_status?", "project_status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/construction/projects/{id}"
    description: "Read one project"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/construction/projects/{id}/summary"
    description: "Computed read of the project's bid, bonding, DBE and closeout roll-ups"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: "{ total_bid_cents: integer, contract_value_cents: integer, unbalanced_bid_score: number, dbe_participation_pct: number, retention_balance_cents: integer, overrun_item_count: integer, underrun_item_count: integer, net_adjustment_cents: integer }"
    side_effects: ["recompute project_bid_extension, unbalanced_bid_score, dbe_participation_credit and retention_settlement before answering"]
  - method: POST
    path: "/construction/projects/{id}/seal-bid"
    description: "Seal the bid before the owner's deadline"
    roles: [Estimator]
    code: 200
    input: []
    output: Project
    side_effects:
      - "project.bid_status := SEALED"
      - "recompute unbalanced_bid_score and project_bid_extension"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{id}/open-bid"
    description: "Open the sealed bid after the deadline; cascades the award chain"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Project
    side_effects:
      - "project.bid_status := OPEN; project.project_status := AWARDED"
      - "project.bid_open_at := logical clock"
      - "project.contract_value_cents := project.total_bid_cents"
      - "cascade C1: each BidItem SUBMITTED -> AWARDED, then recompute quantity_variance_adjustment and retention_settlement on the project's non-CLOSED reconciliation, then write project.contract_value_cents and project.retention_balance_cents"
      - "recompute dbe_participation_credit; flag quotes whose quote_received_at is after bid_open_at with shopping_flagged := true"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{id}/recall-bid"
    description: "Recall a sealed bid before the deadline and reopen negotiation rounds"
    roles: [ContractingOfficer]
    code: 200
    input: [reason_code]
    output: Project
    side_effects:
      - "project.bid_status := RECALLED"
      - "BidItems SUBMITTED -> DRAFT; SubcontractorQuotes CARRIED -> RECEIVED with version_round incremented"
      - "project.total_bid_cents := 0; increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{id}/reset-bid"
    description: "Return a recalled bid to DRAFT for re-preparation"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["project.bid_status := DRAFT", "project.project_status := PRE_BID", "increment Project.version by 1"]
  - method: POST
    path: "/construction/projects/{id}/start-work"
    description: "Mobilize: gates on the performance bond, the surety and DBE good faith"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "project.project_status := ACTIVE; project.claim_window_open := true"
      - "BidItems AWARDED -> ACTIVE; cascade C4: SuretyCommitments RESERVED -> ACTIVE, then recompute surety_exposure_capacity"
      - "increment Project.version by 1"

  # ---- BidItem --------------------------------------------------------------
  - method: POST
    path: "/construction/projects/{project_id}/bid-items"
    description: "Add a pay item with its takeoff quantity and variance thresholds"
    roles: [Estimator]
    code: 201
    input: [item_code, item_description, unit_of_measure, estimated_quantity, "overrun_threshold_pct?", "underrun_threshold_pct?"]
    output: BidItem
    side_effects: ["bid_item.item_status := DRAFT"]
  - method: GET
    path: "/construction/bid-items"
    description: "List pay items, filtered by project or item status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["project_id?", "item_status?", "limit?", "offset?"]
    output: BidItem[]
    side_effects: []
  - method: GET
    path: "/construction/bid-items/{id}"
    description: "Read one pay item"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: BidItem
    side_effects: []
  - method: POST
    path: "/construction/projects/{project_id}/bid-items/{id}/price"
    description: "Set the unit price and crew-productivity assumptions for a pay item"
    roles: [Estimator]
    code: 200
    input: [bid_unit_price_cents, crew_day_labor_cents, crew_day_equipment_cents, daily_productivity_units]
    output: BidItem
    side_effects:
      - "bid_item.item_status := PRICED"
      - "recompute crew_productivity_unit_cost (bid_item.balanced_unit_price_cents)"
      - "recompute unbalanced_bid_score over the project's included BidItems"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{project_id}/bid-items/{id}/submit"
    description: "Move a priced item into the bid total"
    roles: [Estimator]
    code: 200
    input: []
    output: BidItem
    side_effects:
      - "bid_item.item_status := SUBMITTED"
      - "recompute project_bid_extension (project.total_bid_cents)"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{project_id}/bid-items/{id}/unsubmit"
    description: "Pull a submitted item back to PRICED during the open negotiation round"
    roles: [Estimator]
    code: 200
    input: []
    output: BidItem
    side_effects:
      - "bid_item.item_status := PRICED"
      - "recompute project_bid_extension (project.total_bid_cents)"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{project_id}/bid-items/{id}/close"
    description: "Close a pay item after final quantity reconciliation"
    roles: [ProjectManager]
    code: 200
    input: []
    output: BidItem
    side_effects:
      - "bid_item.item_status := CLOSED"
      - "recompute retention_settlement on the project's QuantityReconciliation"
      - "when every BidItem on the project is CLOSED, project.project_status := COMPLETE"
      - "increment Project.version by 1"

  # ---- SubcontractorQuote ---------------------------------------------------
  - method: POST
    path: "/construction/subcontractor-quotes"
    description: "Record a subcontractor or supplier quote with its hold-price window"
    roles: [Estimator]
    code: 201
    input: [project_id, trade_code, contact_name, quoted_amount_cents, quote_window_start, quote_window_end, "unicap_registered?", "good_faith_effort_basis?"]
    output: SubcontractorQuote
    side_effects:
      - "quote.quote_received_at := logical clock"
      - "when quote_received_at > project.bid_open_at, quote.shopping_flagged := true"
  - method: GET
    path: "/construction/subcontractor-quotes"
    description: "List quotes, filtered by project, trade or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["project_id?", "quote_status?", "trade_code?", "limit?", "offset?"]
    output: SubcontractorQuote[]
    side_effects: []
  - method: GET
    path: "/construction/subcontractor-quotes/{id}"
    description: "Read one quote including its negotiation round"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: SubcontractorQuote
    side_effects: []
  - method: POST
    path: "/construction/subcontractor-quotes/{id}/carry"
    description: "Carry a quote into the bid, subject to the bid shopping restriction"
    roles: [Estimator]
    code: 200
    input: []
    output: SubcontractorQuote
    side_effects:
      - "quote.quote_status := CARRIED; quote.carried_in_bid := true"
      - "recompute dbe_participation_credit and project_bid_extension"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/subcontractor-quotes/{id}/withdraw"
    description: "Withdraw a carried quote and open a new negotiation round"
    roles: [Estimator]
    code: 200
    input: []
    output: SubcontractorQuote
    side_effects:
      - "quote.quote_status := RECEIVED; quote.version_round := version_round + 1"
      - "recompute project_bid_extension and dbe_participation_credit"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/subcontractor-quotes/{id}/select"
    description: "Select a carried quote after bid opening"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: SubcontractorQuote
    side_effects: ["quote.quote_status := SELECTED", "recompute dbe_participation_credit", "increment Project.version by 1"]
  - method: POST
    path: "/construction/subcontractor-quotes/{id}/reject"
    description: "Reject a carried or selected quote"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: SubcontractorQuote
    side_effects: ["quote.quote_status := REJECTED; quote.carried_in_bid := false", "recompute project_bid_extension", "increment Project.version by 1"]

  # ---- Bond -----------------------------------------------------------------
  - method: POST
    path: "/construction/bonds"
    description: "Record a bid, performance, payment or maintenance bond against a surety"
    roles: [Surety, Estimator]
    code: 201
    input: [project_id, surety_id, bond_type, bond_amount_cents, effective_from, effective_to, "maintain_bond_horizon_days?"]
    output: Bond
    side_effects:
      - "bond.bond_status := PENDING"
      - "recompute performance_bond_requirement (bond.required_bond_cents)"
  - method: GET
    path: "/construction/bonds"
    description: "List bonds, filtered by project, surety, type or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["project_id?", "surety_id?", "bond_type?", "bond_status?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []
  - method: GET
    path: "/construction/bonds/{id}"
    description: "Read one bond"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: Bond
    side_effects: []
  - method: POST
    path: "/construction/bonds/{id}/issue"
    description: "Issue a bond, consuming surety capacity after all capacity and overlap checks pass"
    roles: [Surety]
    code: 200
    input: []
    output: Bond
    side_effects:
      - "bond.bond_status := ISSUED; bond.issued_at := logical clock"
      - "bond.capacity_consumed_cents := bond.bond_amount_cents"
      - "recompute performance_bond_requirement and surety_exposure_capacity"
      - "increment Surety.version by 1"
  - method: POST
    path: "/construction/bonds/{id}/execute"
    description: "Call a performance bond after a payment-bond lien claim exists"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: ["bond.bond_status := EXECUTED", "recompute surety_exposure_capacity", "increment Surety.version by 1"]
  - method: POST
    path: "/construction/bonds/{id}/release-bond"
    description: "Release a bond at closeout and return its capacity to the surety"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Bond
    side_effects:
      - "bond.bond_status := RELEASED; bond.released_at := logical clock; bond.capacity_consumed_cents := 0"
      - "recompute surety_exposure_capacity"
      - "increment Surety.version by 1"

  # ---- ProgressMeasurement --------------------------------------------------
  - method: POST
    path: "/construction/bid-items/{bid_item_id}/measurements"
    description: "Record a field measurement against a pay item; OCC-guarded on the BidItem"
    roles: [ProjectManager, Estimator]
    code: 201
    input: [measured_quantity, measured_at, expected_bid_item_version]
    output: ProgressMeasurement
    side_effects:
      - "measurement.measurement_status := DRAFT"
      - "increment BidItem.version by 1"
  - method: GET
    path: "/construction/measurements"
    description: "List measurements, filtered by pay item or measurement status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["bid_item_id?", "measurement_status?", "limit?", "offset?"]
    output: ProgressMeasurement[]
    side_effects: []
  - method: GET
    path: "/construction/measurements/{id}"
    description: "Read one measurement"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: ProgressMeasurement
    side_effects: []
  - method: POST
    path: "/construction/measurements/{id}/approve"
    description: "Approve a measurement, driving the running quantity ledger and the applied rate"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressMeasurement
    side_effects:
      - "measurement.measurement_status := APPROVED"
      - "recompute quantity_variance_adjustment (bid_item.measured_quantity, variance_pct, renegotiation_required)"
      - "set measurement.applied_unit_price_cents to the FINAL renegotiated rate when one covers this item, otherwise bid_item.bid_unit_price_cents"
      - "measurement.payable_amount_cents := quantity_variance_adjustment payable amount"
      - "recompute retention_settlement and absolute_retention_reconciliation (project.retention_balance_cents, reconciliation.pace_basis_retention_cents)"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/measurements/{id}/pay"
    description: "Mark an approved measurement payable"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressMeasurement
    side_effects: ["measurement.measurement_status := PAYABLE", "increment Project.version by 1"]
  - method: POST
    path: "/construction/measurements/{id}/void"
    description: "Void an approved or payable measurement and reverse its quantity and money effects"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressMeasurement
    side_effects:
      - "measurement.measurement_status := VOIDED; measurement.payable_amount_cents := 0"
      - "recompute quantity_variance_adjustment and retention_settlement"
      - "increment Project.version by 1"

  # ---- QuantityReconciliation -----------------------------------------------
  - method: POST
    path: "/construction/projects/{project_id}/reconciliations"
    description: "Open the final quantity reconciliation for a project"
    roles: [ContractingOfficer, Estimator]
    code: 201
    input: []
    output: QuantityReconciliation
    side_effects: ["reconciliation.reconciliation_status := OPEN", "recompute quantity_variance_adjustment and retention_settlement"]
  - method: GET
    path: "/construction/reconciliations"
    description: "List reconciliations, filtered by project or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["project_id?", "reconciliation_status?", "limit?", "offset?"]
    output: QuantityReconciliation[]
    side_effects: []
  - method: GET
    path: "/construction/reconciliations/{id}"
    description: "Read one reconciliation"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: QuantityReconciliation
    side_effects: []
  - method: POST
    path: "/construction/projects/{project_id}/reconciliations/{id}/finalize"
    description: "Freeze measured quantities and the renegotiated value; OCC-guarded on the Project"
    roles: [ContractingOfficer]
    code: 200
    input: [expected_project_version]
    output: QuantityReconciliation
    side_effects:
      - "reconciliation.reconciliation_status := FINALIZED; reconciliation.closeout_status := PENDING_RETENTION"
      - "recompute quantity_variance_adjustment (overrun_item_count, underrun_item_count, net_adjustment_cents)"
      - "recompute retention_settlement (final_contract_value_cents, retention_held_cents, pace_basis_retention_cents)"
      - "write project.contract_value_cents and project.retention_balance_cents"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/projects/{project_id}/reconciliations/{id}/release-retention"
    description: "Release retention and cascade closeout through the items, project and sureties"
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: QuantityReconciliation
    side_effects:
      - "reconciliation.reconciliation_status := CLOSED; reconciliation.retention_released_cents := retention_held_cents"
      - "write project.retention_balance_cents := 0"
      - "cascade C3: BidItems ACTIVE -> CLOSED, then project COMPLETE when all items closed, then recompute surety_exposure_capacity for the project's sureties"
      - "increment Project.version by 1"

  # ---- DifferingSiteCondition -----------------------------------------------
  - method: POST
    path: "/construction/differing-site-conditions"
    description: "Report a differing site condition while the claim window is open"
    roles: [ProjectManager]
    code: 201
    input: [project_id, reported_at, "claimed_amount_cents?"]
    output: DifferingSiteCondition
    side_effects: ["condition.condition_status := REPORTED", "recompute notice_period_elapsed"]
  - method: GET
    path: "/construction/differing-site-conditions"
    description: "List claims, filtered by project or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["project_id?", "condition_status?", "limit?", "offset?"]
    output: DifferingSiteCondition[]
    side_effects: []
  - method: GET
    path: "/construction/differing-site-conditions/{id}"
    description: "Read one claim including its notice clock"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: DifferingSiteCondition
    side_effects: []
  - method: POST
    path: "/construction/differing-site-conditions/{id}/document"
    description: "Attach the claim package, which stops the notice clock from mattering"
    roles: [ProjectManager]
    code: 200
    input: [documentation_package_urls]
    output: DifferingSiteCondition
    side_effects:
      - "condition.condition_status := DOCUMENTED; condition.documentation_complete := true"
      - "recompute notice_period_elapsed"
  - method: POST
    path: "/construction/differing-site-conditions/{id}/submit-claim"
    description: "Submit a documented claim to the engineer within the notice period"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DifferingSiteCondition
    side_effects: ["condition.condition_status := UNDER_REVIEW", "increment Project.version by 1"]
  - method: POST
    path: "/construction/differing-site-conditions/{id}/return-for-documentation"
    description: "Engineer returns a claim for a fuller package, reopening the documentation round"
    roles: [Engineer]
    code: 200
    input: []
    output: DifferingSiteCondition
    side_effects: ["condition.condition_status := DOCUMENTED", "condition.documentation_complete := false"]
  - method: POST
    path: "/construction/differing-site-conditions/{id}/engineer-determination"
    description: "Engineer issues a determination; a QUANTITY_ADJUSTMENT re-sets an item's applied rate"
    roles: [Engineer]
    code: 200
    input: [determination_type, "target_bid_item_id?", "determined_unit_rate_cents?", "days_granted?"]
    output: EngineerDetermination
    side_effects:
      - "condition.condition_status := DETERMINED"
      - "determination.determination_status := ISSUED; determination.entitles_adjustment set from determination_type"
      - "when determination_type == QUANTITY_ADJUSTMENT, every non-CLOSED ProgressMeasurement on target_bid_item_id gets applied_unit_price_cents := determined_unit_rate_cents"
      - "cascade C2: recompute quantity_variance_adjustment, then retention_settlement, then write project.contract_value_cents and project.retention_balance_cents"
      - "increment Project.version by 1"
  - method: POST
    path: "/construction/differing-site-conditions/{id}/deny"
    description: "Deny a claim from any non-terminal state"
    roles: [Engineer]
    code: 200
    input: []
    output: DifferingSiteCondition
    side_effects: ["condition.condition_status := DENIED"]

  # ---- EngineerDetermination ------------------------------------------------
  - method: GET
    path: "/construction/engineer-determinations"
    description: "List determinations, filtered by claim, target pay item or status"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: ["condition_id?", "target_bid_item_id?", "determination_status?", "limit?", "offset?"]
    output: EngineerDetermination[]
    side_effects: []
  - method: GET
    path: "/construction/engineer-determinations/{id}"
    description: "Read one determination"
    roles: [PlatformAdmin, Estimator, ContractingOfficer, ProjectManager, Engineer, Surety]
    code: 200
    input: []
    output: EngineerDetermination
    side_effects: []
  - method: POST
    path: "/construction/engineer-determinations/{id}/finalize"
    description: "Make a determination final and immutable, engaging the project's claim window flag"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EngineerDetermination
    side_effects:
      - "determination.determination_status := FINAL"
      - "when determination_type == QUANTITY_ADJUSTMENT, set the parent DifferingSiteCondition.claim_window_engaged := true; no other determination of this type on the project may then be finalized (duplicate is rejected)"
      - "increment Project.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted on this operation"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, unknown field present, or enum value not declared"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "path or body project id does not resolve"
  - id: ERR_BID_ITEM_NOT_FOUND
    http: 404
    condition: "path bid item id does not resolve, or belongs to a different project than the path declares"
  - id: ERR_SURETY_NOT_FOUND
    http: 404
    condition: "surety id does not resolve"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "subcontractor quote id does not resolve"
  - id: ERR_BOND_NOT_FOUND
    http: 404
    condition: "bond id does not resolve"
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "progress measurement id does not resolve"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "reconciliation id does not resolve or belongs to a different project"
  - id: ERR_CONDITION_NOT_FOUND
    http: 404
    condition: "differing site condition id does not resolve"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "engineer determination id does not resolve"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "surety commitment id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in the from-state the requested transition requires"
  - id: ERR_RECONCILIATION_ALREADY_OPEN
    http: 409
    condition: "the project already has a QuantityReconciliation whose reconciliation_status != CLOSED"
  - id: ERR_RESERVATION_OVERLAP
    http: 409
    condition: "two ISSUED or EXECUTED bonds of the same bond_type on one project have intersecting effective intervals"
  - id: ERR_DUPLICATE_PROJECT_CODE
    http: 409
    condition: "project_code already exists on a project whose project_status != COMPLETE"
  - id: ERR_DUPLICATE_ITEM_CODE
    http: 409
    condition: "item_code already exists within the same project_id"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the Project's current version"
  - id: ERR_STALE_BID_ITEM_VERSION
    http: 412
    condition: "expected_bid_item_version does not equal the BidItem's current version"
  - id: ERR_ITEM_NOT_ACTIVE
    http: 409
    condition: "the measurement's BidItem is not in item_status ACTIVE"
  - id: ERR_SURETY_SUSPENDED
    http: 422
    condition: "the bond's surety is SUSPENDED so no new capacity may be committed"
  - id: ERR_BID_SHOPPING_RESTRICTED
    http: 422
    condition: "another quote on the same project and trade_code is already CARRIED or SELECTED"
  - id: ERR_BID_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is at or after project.bid_deadline_at for a pre-deadline-only operation"
  - id: ERR_BID_NOT_YET_CLOSED
    http: 422
    condition: "the logical clock is before project.bid_deadline_at for a post-deadline-only operation"
  - id: ERR_QUOTE_AFTER_DEADLINE
    http: 422
    condition: "a quote is recorded or carried at or after the project's bid deadline"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "project.claim_window_open is false when a differing site condition is recorded or documented"
  - id: ERR_NOTICE_PERIOD_EXPIRED
    http: 422
    condition: "notice_days_elapsed exceeds the 30-day notice limit at claim submission"
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "documentation_package_urls is empty when the claim is documented"
  - id: ERR_CLAIM_AMOUNT_REQUIRED
    http: 422
    condition: "claimed_amount_cents is zero at claim submission"
  - id: ERR_CLAIM_NOT_UNDER_REVIEW
    http: 422
    condition: "a determination is issued while its parent condition is not UNDER_REVIEW"
  - id: ERR_RATE_BELOW_COST
    http: 422
    condition: "bid_unit_price_cents is below balanced_unit_price_cents"
  - id: ERR_UNIT_PRICE_REQUIRED
    http: 422
    condition: "a pay item is priced at a non-positive unit price"
  - id: ERR_BOND_AMOUNT_INSUFFICIENT
    http: 422
    condition: "the bond's face amount is below its statutory required_bond_cents"
  - id: ERR_NO_LIEN_CLAIM
    http: 422
    condition: "a performance bond is called while the project's payment bond shows no outstanding lien claim"
  - id: ERR_AGGREGATE_CAPACITY_EXCEEDED
    http: 422
    condition: "the requested amount exceeds the surety's available capacity, or a performance bond exceeds the surety's single-job limit"
  - id: ERR_DBE_GOOD_FAITH_MISSING
    http: 422
    condition: "credited DBE participation is below the advertised goal with no documented good-faith-effort basis"
  - id: ERR_QUANTITY_RENEGOTIATION_REQUIRED
    http: 422
    condition: "an item whose variance crosses a configured threshold has no FINAL renegotiated rate"
  - id: ERR_OPEN_CLAIM_BLOCKS_CLOSEOUT
    http: 422
    condition: "a differing site condition on the project is REPORTED, DOCUMENTED or UNDER_REVIEW"
  - id: ERR_MEASUREMENTS_PENDING
    http: 422
    condition: "a progress measurement on the project is still DRAFT"
  - id: ERR_RETENTION_NOT_RELEASABLE
    http: 422
    condition: "retention release is requested before the reconciliation reaches FINALIZED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator: registry, surety actions, determination finalization, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/sureties"
      - "POST /construction/sureties/{id}/suspend"
      - "POST /construction/sureties/{id}/reinstate"
      - "POST /construction/bonds/{id}/execute"
      - "POST /construction/engineer-determinations/{id}/finalize"
      - "POST /construction/_clock/set_current_utc"
    shared_operations:
      - "POST /construction/projects"
      - "GET /construction/projects"
      - "GET /construction/projects/{id}"
      - "GET /construction/projects/{id}/summary"
      - "GET /construction/sureties"
      - "GET /construction/bonds"
      - "GET /construction/reconciliations"
      - "GET /construction/bid-items"
      - "GET /construction/measurements"
  - name: Estimator
    description: "Bid preparer: takeoff, unit pricing, quote collection"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/projects/{project_id}/bid-items"
      - "POST /construction/projects/{project_id}/bid-items/{id}/price"
      - "POST /construction/projects/{project_id}/bid-items/{id}/submit"
      - "POST /construction/projects/{project_id}/bid-items/{id}/unsubmit"
      - "POST /construction/projects/{id}/seal-bid"
      - "POST /construction/subcontractor-quotes"
      - "POST /construction/subcontractor-quotes/{id}/carry"
      - "POST /construction/subcontractor-quotes/{id}/withdraw"
    shared_operations:
      - "POST /construction/projects"
      - "POST /construction/bonds"
      - "POST /construction/surety-commitments"
      - "POST /construction/projects/{project_id}/reconciliations"
      - "POST /construction/bid-items/{bid_item_id}/measurements"
      - "GET /construction/projects"
      - "GET /construction/projects/{id}"
      - "GET /construction/projects/{id}/summary"
      - "GET /construction/bid-items"
      - "GET /construction/bid-items/{id}"
      - "GET /construction/subcontractor-quotes"
      - "GET /construction/subcontractor-quotes/{id}"
  - name: ContractingOfficer
    description: "Owner-side authority: bid opening, award, commitment release, retention release"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/projects/{id}/open-bid"
      - "POST /construction/projects/{id}/recall-bid"
      - "POST /construction/projects/{id}/reset-bid"
      - "POST /construction/subcontractor-quotes/{id}/select"
      - "POST /construction/subcontractor-quotes/{id}/reject"
      - "POST /construction/surety-commitments/{id}/release-commitment"
      - "POST /construction/projects/{project_id}/reconciliations/{id}/finalize"
      - "POST /construction/projects/{project_id}/reconciliations/{id}/release-retention"
      - "POST /construction/bonds/{id}/release-bond"
    shared_operations:
      - "POST /construction/surety-commitments"
      - "POST /construction/projects/{project_id}/reconciliations"
      - "GET /construction/projects"
      - "GET /construction/projects/{id}"
      - "GET /construction/projects/{id}/summary"
      - "GET /construction/bonds"
      - "GET /construction/reconciliations"
  - name: ProjectManager
    description: "Field-side delivery: work start, measurement approval, claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/projects/{id}/start-work"
      - "POST /construction/measurements/{id}/approve"
      - "POST /construction/measurements/{id}/pay"
      - "POST /construction/measurements/{id}/void"
      - "POST /construction/projects/{project_id}/bid-items/{id}/close"
      - "POST /construction/differing-site-conditions"
      - "POST /construction/differing-site-conditions/{id}/document"
      - "POST /construction/differing-site-conditions/{id}/submit-claim"
    shared_operations:
      - "POST /construction/bid-items/{bid_item_id}/measurements"
      - "GET /construction/projects/{id}"
      - "GET /construction/projects/{id}/summary"
      - "GET /construction/measurements"
      - "GET /construction/measurements/{id}"
      - "GET /construction/differing-site-conditions"
      - "GET /construction/differing-site-conditions/{id}"
  - name: Engineer
    description: "Owner's engineer: differing site condition determination and denial"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/differing-site-conditions/{id}/engineer-determination"
      - "POST /construction/differing-site-conditions/{id}/return-for-documentation"
      - "POST /construction/differing-site-conditions/{id}/deny"
    shared_operations:
