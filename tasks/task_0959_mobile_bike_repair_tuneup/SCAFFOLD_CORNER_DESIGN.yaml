        claim_type: action_endpoint
        grounds: [endpoints.resequence, entities.RouteStop.fields.seq]
        distinguishing_aspect: "Resequence with both stop ids reverses seq values: stop2 becomes seq 1, stop1 becomes seq 2."
        test_recipe:
          setup: ["OPEN route day with two PLANNED stops (different customers, non-overlapping buffered windows)"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
