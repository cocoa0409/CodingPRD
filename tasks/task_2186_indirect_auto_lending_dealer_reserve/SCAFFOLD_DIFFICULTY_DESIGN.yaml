  - rule_id: resource_temporal_overlap
    instances:

      - name: rate_sheet_halfopen_overlap_adjacency_allowed
        grounds:
          - validations[priority=17]
          - errors[ERR_RATE_SHEET_WINDOW_OVERLAP]
          - state_machines.RateSheet.DRAFT_to_PUBLISHED
          - entities.RateSheet.fields.effective_from
          - entities.RateSheet.fields.effective_to
        distinguishing_aspect: |
          Interval semantics on the RateSheet resource are HALF-OPEN [from, to): a
          candidate window starting 2026-06-01 inside the incumbent [2026-01-01,
          2027-01-01) is rejected, while a window starting exactly at the incumbent's
          effective_to (2027-01-01) merely touches it and is ACCEPTED - adjacency is legal.
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01 with a PUBLISHED PS-STANDARD rate sheet covering [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs_ov: $.data.id }
            - call: "POST /lending/rate-sheets/${rs_ov}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 499, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs_ov}/publish"
              payload: {}
              as: PortfolioAdmin
              captures: { ov_err: $.data.error_id }
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs_adj: $.data.id }
            - call: "POST /lending/rate-sheets/${rs_adj}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 499, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs_adj}/publish"
              payload: {}
              as: PortfolioAdmin
              captures: { adj_status: $.data.status }
          assert:
            - "Publishing the 2026-06-01 sheet returns HTTP 409 with error_id == 'ERR_RATE_SHEET_WINDOW_OVERLAP'"
            - "RateSheet.${rs_ov}.status == 'DRAFT' after the rejection"
            - "Publishing the 2027-01-01 sheet returns HTTP 200 and RateSheet.${rs_adj}.status == 'PUBLISHED'"
            - "RateSheet.${rs1}.status == 'PUBLISHED' - it is not retired, because its effective_to 2027-01-01 is after the clock 2026-08-01"

      - name: agreement_closed_interval_notice_buffer_adjacency_rejected
        grounds:
          - validations[priority=18]
          - errors[ERR_AGREEMENT_WINDOW_CONFLICT]
          - entities.DealerAgreement.fields.effective_from
          - entities.DealerAgreement.fields.supersedes_agreement_id
          - concurrency_rules[agreement-create-stale-dealer]
        distinguishing_aspect: |
          Interval semantics on the DealerAgreement resource are CLOSED [from, to] PLUS a
          mandatory 30-day notice buffer, so the geometry is the opposite of the rate
          sheet's: a successor starting exactly at the incumbent's effective_to
          (2027-02-01) is REJECTED, and only a start at or after 2027-03-03 is accepted.
