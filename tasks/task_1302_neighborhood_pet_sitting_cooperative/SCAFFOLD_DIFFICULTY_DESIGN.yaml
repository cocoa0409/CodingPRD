          Entity: SittingRequest — three divergent terminal branches from OPEN with
          disjoint side-effect sets: owner-cancel (claims REJECTED, cancelled_reason
          set), clock-driven auto-expiry at expires_at (no claim side effects), and
          the happy path through CLAIMED/ASSIGNED/IN_PROGRESS to COMPLETED (checkout
