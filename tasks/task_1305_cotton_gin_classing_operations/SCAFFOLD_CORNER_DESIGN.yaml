        test_recipe:
          setup: ["grower with 11 modules (tickets T-01..T-11)"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C60", legal_name: "Page Farm" }
              as: CoopAdmin
