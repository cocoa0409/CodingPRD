            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/loaner-reservations/${res}/return", as: IntakeAgent, payload: { condition: "DAMAGED", damage_assessment_cents: 99999 }, captures: { dmg: $.data.damage_fee_cents } }
          assert:
            - "LoanerReservation.${res}.damage_fee_cents == 40000 (capped at deposit_value_cents)"
            - "LoanerReservation.${res}.status == CLOSED_DAMAGED"

      - name: forfeit_charges_deposit_plus_late_fees
        claim_type: correct_result
        grounds: [entities.LoanerReservation.fields.forfeit_charge_cents, calculations.loaner_late_fee]
        distinguishing_aspect: "Forfeit after 2 late days charges deposit (40000) + late fee (2*2500=5000) = 45000, retires the unit, and releases exposure."
        test_recipe:
          setup: ["LOANER RMA repaired and shipped 2026-08-01 (due 2026-08-11); loaner SHIPPED; clock advanced to 2026-08-13"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, loaner_grace_days: 10 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" } }
            - { call: "POST /depot/rmas/${rma}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "POST /depot/rmas/${rma}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" } }
            - { call: "POST /depot/rmas/${rma}/ship", as: DepotTechnician, as_user_id: "tech-2", payload: { carrier: "UPS", tracking_number: "1Z" } }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-13T00:00:00Z" } }
          trigger:
            - { call: "POST /depot/loaner-reservations/${res}/forfeit", as: DepotManager, payload: {} , captures: { charge: $.data.forfeit_charge_cents, fee: $.data.late_fee_cents } }
          assert:
            - "LoanerReservation.${res}.late_fee_cents == 5000 (2 days after due date)"
            - "LoanerReservation.${res}.forfeit_charge_cents == 45000 (40000 + 5000)"
            - "LoanerReservation.${res}.status == CLOSED_FORFEITED"
            - "LoanerUnit.${lu}.status == RETIRED"
            - "Customer.${cust}.deposit_exposure_cents == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: credit_limit_inclusive_boundary_then_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Boundary: exposure exactly equal to credit_limit_cents (50000) is allowed (<=); adding even 1 cent more is rejected with ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["Customer credit 50000; two AUTHORIZED LOANER RMAs; LU-1 deposit 50000, LU-2 deposit 1"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 50000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_1: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-2", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_2: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 50000 }, captures: { lu1: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-2", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 1 }, captures: { lu2: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_1}", reported_issue: "d1", service_option: "LOANER" }, captures: { rma_1: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_2}", reported_issue: "d2", service_option: "LOANER" }, captures: { rma_2: $.data.id } }
            - { call: "POST /depot/rmas/${rma_1}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_2}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma_1}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu1}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res1: $.data.id } }
            - { call: "POST /depot/rmas/${rma_2}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu2}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { err: $.data.error_id } }
          assert:
            - "Reservation 1 created (exposure 50000 == limit allowed): LoanerReservation.${res1}.status == RESERVED"
            - "Reservation 2 rejected with error_id == ERR_CREDIT_LIMIT_EXCEEDED (50000 + 1 > 50000)"
            - "Customer.${cust}.deposit_exposure_cents == 50000 (unchanged by rejection)"

      - name: parts_consumption_insufficient_stock_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Consuming 2 units of a part with stock 1 fails with ERR_INSUFFICIENT_STOCK; stock and RMA version are unchanged by the rejection."
        test_recipe:
          setup: ["IN_REPAIR RMA; part P1 stock 1"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 1 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] }, captures: { rma_v: $.data.version } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 2, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_STOCK"
            - "Part.${part}.stock_on_hand == 1 (unchanged)"
            - "ServiceRMA.${rma}.version == ${rma_v} (rejection does not bump OCC version)"

      - name: authorize_second_open_rma_per_unit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_UNIT_HAS_OPEN_RMA]"]
        distinguishing_aspect: "A second RMA for the same unit can be drafted but authorize fails with ERR_UNIT_HAS_OPEN_RMA while the first is non-terminal; cancelling the first unblocks the second (satisfaction path)."
        test_recipe:
          setup: ["RMA-1 AUTHORIZED for unit; RMA-2 drafted for same unit"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "first" }, captures: { rma1: $.data.id } }
            - { call: "POST /depot/rmas/${rma1}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "second" }, captures: { rma2: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma2}/authorize", as: IntakeAgent, payload: {} , captures: { err: $.data.error_id } }
            - { call: "POST /depot/rmas/${rma1}/cancel", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma2}/authorize", as: IntakeAgent, payload: {} }
          assert:
            - "First authorize rejected with error_id == ERR_UNIT_HAS_OPEN_RMA"
            - "After cancelling RMA-1, RMA-2 authorizes: ServiceRMA.${rma2}.status == AUTHORIZED"

      - name: receive_serial_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_SERIAL_MISMATCH]"]
        distinguishing_aspect: "Receiving with a serial that differs from the registered unit serial fails with ERR_SERIAL_MISMATCH; the RMA stays AUTHORIZED."
        test_recipe:
          setup: ["AUTHORIZED RMA for unit SN-1"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-WRONG" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERIAL_MISMATCH (409)"
            - "ServiceRMA.${rma}.status == AUTHORIZED (unchanged)"

      - name: schedule_bay_invalid_window_and_inactive_bay
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "validations[priority=15]", "errors[ERR_INVALID_BAY_WINDOW]", "errors[ERR_BAY_INACTIVE]"]
        distinguishing_aspect: "end_date before start_date yields ERR_INVALID_BAY_WINDOW (422); an OUT_OF_SERVICE bay yields ERR_BAY_INACTIVE (409) — window shape is checked before bay status per priority order."
        test_recipe:
          setup: ["TRIAGED RMA; BAY-1 exists and is OUT_OF_SERVICE"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/depot-bays", as: DepotManager, payload: { bay_code: "BAY-1" }, captures: { bay: $.data.id } }
            - { call: "POST /depot/depot-bays/${bay}/deactivate", as: DepotManager, payload: {} }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/schedule-bay", as: DepotTechnician, payload: { bay_id: "${bay}", start_date: "2026-08-12", end_date: "2026-08-10" }, captures: { err1: $.data.error_id } }
            - { call: "POST /depot/rmas/${rma}/schedule-bay", as: DepotTechnician, payload: { bay_id: "${bay}", start_date: "2026-08-10", end_date: "2026-08-12" }, captures: { err2: $.data.error_id } }
          assert:
            - "First call: error_id == ERR_INVALID_BAY_WINDOW (priority 14 temporal shape before priority 15 bay status)"
            - "Second call: error_id == ERR_BAY_INACTIVE"
            - "ServiceRMA.${rma}.bay_id is null (no booking pinned)"

      - name: loaner_reservation_on_standard_option_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_SERVICE_OPTION_INCOMPATIBLE]"]
        distinguishing_aspect: "A STANDARD service-option RMA cannot take a loaner reservation: ERR_SERVICE_OPTION_INCOMPATIBLE (422)."
        test_recipe:
          setup: ["AUTHORIZED STANDARD RMA; pool unit available"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 10000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERVICE_OPTION_INCOMPATIBLE"
            - "LoanerUnit.${lu}.status == AVAILABLE (unchanged)"

      - name: loaner_explicit_model_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_LOANER_MODEL_MISMATCH]"]
        distinguishing_aspect: "Explicitly picking a loaner whose model differs from the RMA unit's model fails with ERR_LOANER_MODEL_MISMATCH (422)."
        test_recipe:
          setup: ["AUTHORIZED LOANER RMA on model M1; pool unit LU-9 belongs to model M2"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M2", description: "m2", standard_warranty_days: 365, replacement_cost_cents: 50000, flat_rate_repair_cents: 9000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl2: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-9", model_id: "${mdl2}", condition_grade: "A", deposit_value_cents: 10000 }, captures: { lu9: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
