      - name: state_machine_cyclic_calculation_revision_loop_reenters_draft
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DesignCalculation.transitions[REJECTED->DRAFT]
        excluded_because:
          difficulty_instance: non_linear_design_calculation_reject_revise_resubmit_cycle
          rationale: "The declared cyclic shape is the DRAFT -> SUBMITTED -> REJECTED -> DRAFT sheet loop, and that §1.8 instance walks it twice on one row, asserting revision increments, reviewed_by_personnel_id and reject_reason clearing on revise, the job's DESIGN_REVIEW -> DRAFT bounce, and the recomputation of every thickness field on the second pass. A separate cyclic corner would be a strict subset."

      - name: state_machine_parallel_weld_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ProductionWeld.initial_state
          - entities.ProductionWeld.fields.nde_status
          - entities.ProductionWeld.fields.pwht_status
        excluded_because:
          difficulty_instance: non_linear_production_weld_parallel_nde_and_pwht_dimensions
          rationale: "ProductionWeld carries three orthogonal dimensions (fab_status, nde_status, pwht_status) and that §1.8 instance advances the NDE and PWHT dimensions in interleaved order on the same joint, asserting after each step that the untouched dimension is unchanged and that the combined state gates the pressure test correctly."

      - name: state_machine_compound_rollup_reaches_job_and_data_report
        claim_type: compound
        grounds:
          - state_machines.VesselJob.transitions[FABRICATION->NDE_HOLD].side_effects
          - state_machines.NDEExam.transitions
          - entities.DataReport.fields.missing_items
        excluded_because:
          difficulty_instance: transitive_nde_reject_propagates_exam_weld_ncr_job_and_data_report
          rationale: "The compound roll-up is exactly the five-hop propagation that instance asserts hop by hop: exam REJECT, weld nde_status REJECTED, a new OPEN Nonconformance, the job's FABRICATION -> NDE_HOLD move with nonconformance_open_count incremented, and the DataReport re-deriving missing_items to include OPEN_NONCONFORMANCE with a lower completeness_score."

      - name: state_machine_bubble_up_job_leaves_nde_hold_when_last_record_closes
        claim_type: Bubble up
        grounds:
          - state_machines.Nonconformance.transitions[REPAIR->CLOSED].side_effects
          - state_machines.VesselJob.transitions[NDE_HOLD->FABRICATION]
        excluded_because:
          difficulty_instance: compensating_invariant_open_nonconformance_count_conserved_through_repair_cycle
          rationale: "That §1.8 instance holds two nonconformances open at once and closes them one at a time, proving the job stays in NDE_HOLD while any record is open and bubbles back to FABRICATION only when the count reaches exactly 0 — the join condition a standalone Bubble up corner would test with a single record."

      - name: state_machine_ledger_sync_job_counter_tracks_nonconformance_writes
        claim_type: Ledger sync
        grounds:
          - entities.VesselJob.fields.nonconformance_open_count
          - state_machines.Nonconformance.transitions
        excluded_because:
          difficulty_instance: compensating_invariant_open_nonconformance_count_conserved_through_repair_cycle
          rationale: "The ancestor's derived counter is reconciled before and after every write in that instance, including the REPAIR -> OPEN re-open where the count must NOT move because the record never left the open set. That before/after ledger reconciliation is the whole Ledger sync claim."

      - name: state_machine_compensation_heat_mass_restored_without_drift
        claim_type: Compensation
        grounds:
          - state_machines.Part.transitions[ISSUED->SCRAPPED].side_effects
          - state_machines.MaterialHeat.transitions[DEPLETED->ACCEPTED]
          - calculations.material_balance
        excluded_because:
          difficulty_instance: compensating_invariant_heat_mass_conserved_across_issue_scrap_reissue
          rationale: "That instance runs the full issue -> scrap -> reissue sequence and asserts the conservation identity after every step, including the DEPLETED -> ACCEPTED flip and back, so no rounding drift can hide in the ledger. The corner here would only assert the single scrap reversal already covered by the cancel cascade instance above."

      - name: state_machine_conditional_cascade_only_signed_reports_freeze
        claim_type: Conditional cascade
        grounds:
          - state_machines.CertificateOfAuthorization.transitions[ACTIVE->SUSPENDED].side_effects
          - state_machines.DataReport.transitions
        excluded_because:
          difficulty_instance: transitive_audit_close_suspends_certificate_and_freezes_signed_data_report
          rationale: "The cascade on audit close is conditional on the report's own state — only AI_SIGNED reports move to STAMP_HOLD while ASSEMBLING and READY_FOR_AI reports are left alone — and that §1.8 instance holds reports in two different states across the same suspension to prove the condition is honoured in both directions."

      - name: state_machine_guarded_transition_renewal_requires_satisfactory_audit
        claim_type: guarded transitions
        grounds:
          - state_machines.CertificateOfAuthorization.transitions[SUSPENDED->ACTIVE].preconditions
          - endpoints[POST /certificates/{certificate_id}/renewals]
        excluded_because:
          difficulty_instance: cross_entity_certificate_renewal_gated_on_satisfactory_closed_audit
          rationale: "The renewal transition is guarded by the state of a different entity (a CLOSED, satisfactory ShopAudit belonging to the same certificate), and that instance tests the guard from the failing side (open audit, unsatisfactory audit, audit of another certificate) and then from the passing side on the same certificate row."

      - name: state_machine_cross_entity_guard_pressure_test_requires_complete_pwht
        claim_type: Cross-entity
        grounds:
          - state_machines.PWHTBatch.transitions
          - state_machines.VesselJob.transitions[FABRICATION->TESTING]
          - errors[ERR_PWHT_INCOMPLETE]
        excluded_because:
          difficulty_instance: cross_entity_pressure_test_creation_blocked_by_incomplete_pwht_batch
          rationale: "That instance drives the PWHTBatch through SCHEDULED and IN_PROGRESS while repeatedly attempting the job's FABRICATION -> TESTING move, then completes the batch and shows the same call succeed, which is precisely the cross-entity side of this transition pair."

