            - "ScreeningCycle.${cyc}.tier_deadline_at == 2026-08-07T00:00:00.000Z — tier_opened_at plus 3 whole days of 24 hours"
            - "SurplusAsset.${a1}.disposition_status == SCREENING at cycle creation"
            - "after the advance ScreeningCycle.${cyc}.current_tier == LOCAL_GOVERNMENT and tier_advance_count == 1"
            - "ScreeningCycle.${cyc}.tier_opened_at == 2026-08-06T09:15:30.000Z — re-stamped from the logical clock, not from opens_at"
            - "ScreeningCycle.${cyc}.tier_deadline_at == 2026-08-09T09:15:30.000Z — exactly 72 hours after the new tier_opened_at, so the second window is not truncated"
            - "ScreeningCycle.${cyc}.open_request_count == 0 — the advance was legal through the empty-set branch of the gate"

      - name: calc_de_minimis_threshold_is_strict_less_than
        claim_type: threshold_boundary
        grounds:
          - calculations.de_minimis_screening_exemption.formula
          - calculations.de_minimis_screening_exemption.constants.DE_MINIMIS_SCREENING_THRESHOLD_CENTS
          - validations[priority=36]
        distinguishing_aspect: "The threshold splits the two disposal channels in opposite directions at one cent of difference: an asset valued at exactly 25000 is not exempt, so direct listing is refused and screening is required, while an asset valued at 24999 is exempt, so listing succeeds and opening a screening cycle for it is itself refused. Both refusals carry the same code from priority 36."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an ACCEPTED turn-in for DOT-01 with two FURNITURE assets acquired 2026-01-10 (age_factor 1.00) assessed C1 / functional / repair 0: cost 25000 -> fair_market_value_cents 25000 and cost 24999 -> 24999"
            - "one ACTIVE venue AUS-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
