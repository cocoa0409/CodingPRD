  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_body_collision_on_crew
        grounds:
          - validations[priority=10]
          - state_machines.CleaningJob.QUOTED_to_BOOKED
          - entities.ScheduledSlot.fields.start_minute
          - entities.ScheduledSlot.fields.end_minute
        distinguishing_aspect: |
          Body-overlap interval semantics: crew Rig-OV (buffer 0) holds [600,720);
          a new [700,760) request collides with the slot BODY (700 < 720) and is
          rejected with ERR_SLOT_OVERLAP. Pure half-open-interval intersection,
          no buffer term.
        test_recipe:
          setup:
            - "Crew Rig-OV buffer 0 holds a RESERVED slot [600,720) from job ONE; job TWO is QUOTED and requests [700,760)"
          setup_api_calls:
