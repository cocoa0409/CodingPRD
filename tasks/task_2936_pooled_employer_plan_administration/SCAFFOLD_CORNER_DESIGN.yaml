              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan2_id: $.data.id }
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan2_id}", legal_name: "Otherplan Recordkeeping Inc", provider_type: "RECORDKEEPER", revenue_sharing_bps: 10, direct_fee_cents_per_participant: 30000 }
              as: PooledPlanProvider
