  # ------------------------------------------------ test-driving endpoints
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, voting window, quiet period, term date and timestamp is read from this clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ElectionCommissioner]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["moves the logical clock; no entity is mutated and no scheduled transition fires implicitly"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a row it does not own — Candidate whose X-User-ID differs from Candidacy.student_id, StudentVoter whose X-User-ID differs from PetitionSignature.signer_student_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the advisor resolving an appeal is the same X-User-ID that certified the election or adjudicated the cited compliance case"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "election_id in the path or body matches no Election"
  - id: ERR_OFFICE_NOT_FOUND
    http: 404
    condition: "office_id in the path or body matches no Office"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id or signer_student_id matches no Student"
  - id: ERR_CANDIDACY_NOT_FOUND
    http: 404
    condition: "candidacy_id or slate_leader_candidacy_id matches no Candidacy"
  - id: ERR_SIGNATURE_NOT_FOUND
    http: 404
    condition: "petition_signature_id matches no PetitionSignature"
  - id: ERR_EXPENSE_NOT_FOUND
    http: 404
    condition: "campaign_expense_id matches no CampaignExpense"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "compliance_case_id matches no ComplianceCase"
  - id: ERR_REFERENDUM_NOT_FOUND
    http: 404
    condition: "referendum_id matches no Referendum"
  - id: ERR_BALLOT_NOT_FOUND
    http: 404
    condition: "ballot_id matches no Ballot"
  - id: ERR_BALLOT_LINE_NOT_FOUND
    http: 404
    condition: "ballot_line_id matches no BallotLine"
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "vote_id matches no Vote"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id matches no Appeal"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, or a value violates its declared type, enum domain or numeric range"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer"
  - id: ERR_INVALID_BALLOT_LINE
    http: 400
    condition: "line_type does not match the supplied references, or the referenced candidacy is not ELIGIBLE or RUNOFF_QUALIFIED, or the referenced referendum is not APPROVED_FOR_BALLOT"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row, or the parent row a child create hangs from, is in a state the operation does not admit"
  - id: ERR_ELECTION_PHASE_INVALID
    http: 409
    condition: "the owning Election is not in the phase the operation requires"
  - id: ERR_STALE_ELECTION_VERSION
    http: 412
    condition: "expected_election_version does not equal Election.version on POST /ballots"
  - id: ERR_STALE_CANDIDACY_VERSION
    http: 412
    condition: "expected_candidacy_version does not equal Candidacy.version on POST /candidacies/{candidacy_id}/slate-membership"
  - id: ERR_VOTING_WINDOW_CLOSED
    http: 409
    condition: "the logical clock lies outside the half-open window [voting_opens_at, voting_closes_at) or the election is not VOTING_OPEN"
  - id: ERR_PETITION_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is at or after Election.petition_deadline for a submission, or strictly after it for an approval"
  - id: ERR_QUIET_PERIOD_ACTIVE
    http: 422
    condition: "CampaignExpense.incurred_at falls inside the pre-poll blackout that begins quiet_period_hours before voting_opens_at and ends at voting_closes_at"
  - id: ERR_VOTING_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open voting window intersects the window of another Election sharing the academic_year"
  - id: ERR_CANDIDATE_INELIGIBLE
    http: 422
    condition: "the student fails enrollment, disciplinary, class-year, gpa or credit eligibility for the office"
  - id: ERR_VOTER_INELIGIBLE
    http: 403
    condition: "the acting student is not ENROLLED, carries a disciplinary hold, or has a class_year no office on the ballot admits"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the student already holds a Vote with status CAST for this election and round"
  - id: ERR_DUPLICATE_CANDIDACY
    http: 409
    condition: "the student already holds a Candidacy in this election whose status is not WITHDRAWN or VACATED"
  - id: ERR_DUPLICATE_SIGNATURE
    http: 409
    condition: "the student already holds a non-VOIDED PetitionSignature on this candidacy"
  - id: ERR_SELF_SIGNATURE
    http: 422
    condition: "signer_student_id equals the candidacy's own student_id"
  - id: ERR_INSUFFICIENT_SIGNATURES
    http: 422
    condition: "petition_signature_valid_count is strictly below Office.required_signature_count at approval"
  - id: ERR_OFFICE_HAS_NO_CANDIDATE
    http: 409
    condition: "an office of the election carries zero ACTIVE candidate lines on the ballot being locked"
  - id: ERR_INVALID_SELECTION
    http: 422
    condition: "a mark names a line that is absent or VOIDED, repeats an office or referendum, or carries a choice outside {YES, NO, ABSTAIN}"
  - id: ERR_INVALID_SLATE
    http: 422
    condition: "the slate leader is in another election, is the candidacy itself, or already belongs to a slate"
  - id: ERR_APPEAL_SCOPE_INVALID
    http: 422
    condition: "the cited compliance case belongs to a different election or candidacy than the appeal"
  - id: ERR_TRAINING_INCOMPLETE
    http: 422
    condition: "training_modules_completed is below Office.required_training_modules at officer activation"
  - id: ERR_VENUE_DOUBLE_BOOKED
    http: 409
    condition: "an EVENT expense occupies a campus venue whose 30-minute-buffered closed interval collides with another non-REVERSED EVENT booking of the same venue in the same election"
  - id: ERR_POSTER_CAP_EXCEEDED
    http: 422
    condition: "the candidacy's poster_count would exceed Election.poster_cap"
  - id: ERR_SPENDING_CAP_EXCEEDED
    http: 422
    condition: "the candidacy's spending_committed_cents would exceed Election.spending_cap_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ElectionCommissioner
    description: "Student election commission staff: runs the calendar, adjudicates petitions, builds ballots and executes the tally"
    identity: "opaque"
    exclusive_operations:
      - "POST /elections"
      - "POST /elections/{election_id}/open-petitioning"
      - "POST /elections/{election_id}/open-voting"
      - "POST /elections/{election_id}/close-voting"
      - "POST /elections/{election_id}/tally"
      - "POST /elections/{election_id}/run-transition-checkpoint"
      - "POST /offices"
      - "POST /candidacies/{candidacy_id}/return"
      - "POST /candidacies/{candidacy_id}/approve"
      - "POST /petition-signatures/{petition_signature_id}/adjudicate"
      - "POST /petition-signatures/{petition_signature_id}/void"
      - "POST /campaign-expenses/{campaign_expense_id}/approve"
      - "POST /campaign-expenses/{campaign_expense_id}/reverse"
      - "POST /compliance-cases"
      - "POST /referenda/{referendum_id}/review"
      - "POST /ballots"
      - "POST /ballots/{ballot_id}/lines"
      - "POST /ballots/{ballot_id}/lock"
      - "POST /ballots/{ballot_id}/publish"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: FacultyAdvisor
    description: "The student council advisor: certifies results, adjudicates compliance cases, resolves appeals and seats officers"
    identity: "opaque"
    exclusive_operations:
      - "POST /elections/{election_id}/certify"
      - "POST /compliance-cases/{compliance_case_id}/uphold"
      - "POST /compliance-cases/{compliance_case_id}/dismiss"
      - "POST /appeals/{appeal_id}/sustain"
      - "POST /appeals/{appeal_id}/deny"
      - "POST /votes/{vote_id}/void"
      - "POST /candidacies/{candidacy_id}/activate-officer"
    shared_operations:
      - "every GET endpoint"

  - name: Registrar
    description: "Registrar's office: the only source of Student records and enrollment changes"
    identity: "opaque"
    exclusive_operations:
      - "POST /students"
      - "PATCH /students/{student_id}"
    shared_operations:
      - "every GET endpoint"

  - name: Candidate
    description: "A student running for office; acts only on candidacies whose student_id equals the acting X-User-ID"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /candidacies"
      - "POST /candidacies/{candidacy_id}/submit-petition"
      - "POST /candidacies/{candidacy_id}/withdraw"
      - "POST /candidacies/{candidacy_id}/slate-membership"
      - "POST /candidacies/{candidacy_id}/record-training"
      - "POST /campaign-expenses"
      - "POST /appeals"
    shared_operations:
      - "every GET endpoint"

  - name: StudentVoter
    description: "An enrolled student exercising the franchise: signs petitions, drafts amendment referenda and casts one ballot per round"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /petition-signatures"
      - "POST /referenda"
      - "POST /referenda/{referendum_id}/submit"
      - "POST /votes"
    shared_operations:
      - "every GET endpoint"
