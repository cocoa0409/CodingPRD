              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
              captures: { st_resp: $.data.validation_status }
            - call: "GET /tickets/${t1_id}"
              payload: {}
              as: DataSteward
              captures: { st_get: $.data.validation_status }
          assert:
            - "st_resp == VALIDATED  (visible in the mutation response)"
            - "st_get == VALIDATED  (visible on immediate re-read)"
