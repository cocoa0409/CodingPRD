# =============================================================================
# Task 1887 — Utility Customer Assistance & Payment Arrangement Program
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1887. Utility Customer Assistance & Payment Arrangement Program (utility customer care office): income eligibility verification & benefit tier, deferred payment agreement terms & default rules, arrearage forgiveness accrual & on-time credit, shutoff moratorium (weather/medical) enforcement, medical certificate renewal, reconnection fee & deposit waiver, funding source allocation & reporting, referral to energy assistance

domain_name: utility-customer-assistance
api_prefix: /assistance

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers: [cascading_side_effects, dual_variant_calculation, optimistic_concurrency, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: "harder-than-expert"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links in request bodies)
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: service_address, type: string, source: input, description: "Service address of the metered premise" }
      - { name: service_class, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL", default: RESIDENTIAL }
      - { name: heating_fuel_type, type: enum, source: input, description: "ELECTRIC | GAS | DUAL", default: ELECTRIC }
      - { name: deposit_held_cents, type: integer, source: input, description: "Security deposit currently held", default: 0, constraints: ">= 0" }
      - { name: arrearage_balance_cents, type: integer, source: system, description: "Past-due balance; mutated by charges, payments, forgiveness credits/reversals, disbursements", default: 0 }
      - { name: current_charges_balance_cents, type: integer, source: system, description: "Current-period unpaid charges (not yet arrearage)", default: 0 }
      - { name: credit_balance_cents, type: integer, source: system, description: "Overpayment credit sitting on the account", default: 0 }
      - { name: arrearage_since, type: datetime, source: system, description: "Date the arrearage balance last transitioned 0 -> positive; null when balance is 0" }
      - { name: reconnection_fee_due_cents, type: integer, source: system, description: "Outstanding reconnection charge (fee base + deposit top-up + after-hours surcharge once applied); must be 0 to reconnect", default: 0 }
      - { name: reconnection_fee_base_cents, type: integer, source: system, description: "Tier-discounted base reconnection fee snapshotted at shutoff execution", default: 0 }
      - { name: reconnection_fee_surcharge_cents, type: integer, source: system, description: "Tier-discounted after-hours surcharge precomputed at shutoff execution; added to fee due when reconnect requested with after_hours=true", default: 0 }
      - { name: reconnection_deposit_topup_cents, type: integer, source: system, description: "Deposit top-up owed, snapshotted at shutoff execution (0 when waived)", default: 0 }
      - { name: reconnection_surcharge_applied, type: boolean, source: system, description: "True once an after_hours reconnect attempt has folded the surcharge into reconnection_fee_due_cents", default: false }
      - { name: service_status, type: enum, source: system, description: "CONNECTED | DISCONNECT_PENDING | DISCONNECTED", default: CONNECTED }
      - { name: protection_status, type: enum, source: computed, description: "UNPROTECTED | WEATHER_MORATORIUM | MEDICAL_MORATORIUM; persisted, recomputed by protection_gate on sweep and on certificate create/revoke" }
      - { name: delinquency_tier, type: enum, source: computed, description: "CURRENT | DELINQUENT | SEVERELY_DELINQUENT; derived at read and at sweep from arrearage_balance_cents and logical-clock age of arrearage_since" }
      - { name: last_activity_at, type: datetime, source: system, description: "Logical-clock timestamp of the last account-touching write (application/DPA/payment/certificate/order/financial mutation)" }

  - name: AssistanceApplication
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account seeking assistance" }
      - { name: household_size, type: integer, source: input, description: "Persons in household", constraints: "1..12" }
      - { name: gross_annual_income_cents, type: integer, source: input, description: "Documented gross annual household income", constraints: ">= 0" }
      - { name: current_month_income_cents, type: integer, source: input, description: "Gross household income for the current month", constraints: ">= 0" }
      - { name: income_source, type: enum, source: input, description: "WAGES | SSI | PENSION | UNEMPLOYMENT | OTHER", default: OTHER }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | DOCS_PENDING | VERIFIED | DENIED | WITHDRAWN" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator; used by segregation-of-duties checks" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the EligibilitySpecialist holding the review; null until begin-review" }
      - { name: docs_requested, type: boolean, source: system, description: "True once the application has entered DOCS_PENDING at least once", default: false }
      - { name: documents_received, type: boolean, source: system, description: "True after submit-documents; verify requires it when docs_requested", default: false }
      - { name: provisional_benefit_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | INELIGIBLE; computed at creation from ANNUALIZED_CURRENT_MONTH income variant" }
      - { name: benefit_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | INELIGIBLE; computed at verify from ANNUAL_GROSS income variant; null until decided" }
      - { name: income_measure_used, type: enum, source: computed, description: "ANNUALIZED_CURRENT_MONTH at creation | ANNUAL_GROSS at verify" }
      - { name: denial_reason, type: enum, source: system, description: "INCOME_OVER_LIMIT | DOCS_INSUFFICIENT | OTHER; null until DENIED" }

  - name: AssistanceEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; copied from the verified application" }
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; the application that justified this enrollment" }
      - { name: tier, type: enum, source: system, description: "TIER_1 | TIER_2 | TIER_3; copied from application.benefit_tier" }
      - { name: discount_pct, type: integer, source: computed, description: "Bill discount percent: TIER_1=50, TIER_2=30, TIER_3=15" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | LAPSED | TERMINATED" }
      - { name: activated_on, type: datetime, source: system, description: "Logical-clock date of activation; null while PENDING" }
      - { name: recert_due_on, type: datetime, source: system, description: "activated_on + 365 days; sweep lapses ACTIVE enrollments whose recert_due_on <= clock date" }
      - { name: lapsed_on, type: datetime, source: system, description: "Date the enrollment lapsed; null unless LAPSED happened" }

  - name: DeferredPaymentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account under arrangement" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | COMPLETED | BROKEN | CANCELLED" }
      - { name: covered_arrearage_cents, type: integer, source: system, description: "Snapshot of account arrearage_balance_cents at creation; frozen for the life of the DPA" }
      - { name: down_payment_required_cents, type: integer, source: computed, description: "Tier-dependent down payment (see dpa_terms_computation); 0 for TIER_1" }
      - { name: down_payment_received_cents, type: integer, source: system, description: "Down payment posted so far via the payment waterfall", default: 0 }
      - { name: installment_count, type: integer, source: input, description: "Number of monthly installments", constraints: "2..12" }
      - { name: installment_amount_cents, type: integer, source: computed, description: "Equal installment for installments 1..n-1 (round_half_up of base/n)" }
      - { name: final_installment_amount_cents, type: integer, source: computed, description: "Installment n; absorbs rounding remainder = base - (n-1)*installment_amount_cents" }
      - { name: forgiveness_pool_cents, type: integer, source: computed, description: "Total forgivable arrearage: round_half_up(covered_arrearage_cents * FORGIVENESS_SHARE[tier])" }
      - { name: forgiven_posted_cents, type: integer, source: system, description: "Sum of ForgivenessCredit.amount_cents with status POSTED on this DPA", default: 0 }
      - { name: projected_forgiveness_cents, type: integer, source: computed, description: "Forward-looking variant: equals forgiveness_pool_cents, assuming every remaining installment settles on time" }
      - { name: paid_to_arrearage_cents, type: integer, source: system, description: "Down payment + whole installments + extra arrears payments routed through this DPA", default: 0 }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "covered_arrearage_cents - paid_to_arrearage_cents - forgiven_posted_cents" }
      - { name: installments_settled_count, type: integer, source: system, description: "How many scheduled installments are fully settled", default: 0 }
      - { name: on_time_payment_count, type: integer, source: system, description: "Installments settled on or before due date + grace", default: 0 }
      - { name: missed_payment_count, type: integer, source: system, description: "Number of times the sweep found a due+grace installment unsettled", default: 0 }
      - { name: activated_on, type: datetime, source: system, description: "Date the down payment completed (or creation date when down payment is 0)" }
      - { name: first_installment_due_on, type: datetime, source: system, description: "activated_on + 30 days; installment k due = first_installment_due_on + (k-1)*30 days" }
      - { name: defaulted_on, type: datetime, source: system, description: "Date the sweep detected default; null unless DEFAULTED" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account the payment posts to" }
      - { name: dpa_id, type: string, source: system, description: "FK -> DeferredPaymentAgreement.id; set when any portion routed through a DPA bucket, else null" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount", constraints: "> 0" }
      - { name: tender_type, type: enum, source: input, description: "CASH | CARD | CHECK | MONEY_ORDER" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp at posting" }
      - { name: applied_breakdown, type: object, source: computed, description: "Waterfall result: { reconnection_fee_cents, down_payment_cents, installment_cents, dpa_extra_cents, arrearage_cents, current_charges_cents, overpayment_cents }" }
      - { name: installments_settled_count, type: integer, source: computed, description: "Whole installments settled by this payment", default: 0 }
      - { name: on_time, type: boolean, source: computed, description: "True when every installment settled by this payment was on or before due+grace; null when no installment settled" }
      - { name: credit_accrued_cents, type: integer, source: computed, description: "Forgiveness credit posted by this payment (0 when late or none settled)", default: 0 }

  - name: ForgivenessCredit
    parent: null
    common_fields: true
    fields:
      - { name: dpa_id, type: string, source: system, description: "FK -> DeferredPaymentAgreement.id; DPA this credit accrues under" }
      - { name: installment_number, type: integer, source: system, description: "1-based installment whose on-time settlement accrued this credit" }
      - { name: amount_cents, type: integer, source: system, description: "Credit amount (see forgiveness_accrual)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp of posting" }
      - { name: reversed_at, type: datetime, source: system, description: "Logical-clock timestamp of reversal; null while POSTED" }

  - name: MedicalCertificate
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; protected account" }
      - { name: physician_name, type: string, source: input, description: "Certifying physician" }
      - { name: physician_license_number, type: string, source: input, description: "Physician license number" }
      - { name: condition_class, type: enum, source: input, description: "LIFE_THREATENING | SERIOUS; LIFE_THREATENING also waives reconnection fee and deposit" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage start date (00:00:00Z)" }
      - { name: effective_to, type: datetime, source: computed, description: "Coverage end, exclusive: effective_from + 30 days; each renewal adds 30 days. Half-open window [effective_from, effective_to)" }
      - { name: renewal_count, type: integer, source: system, description: "Renewals consumed; maximum 2 (90 days total coverage)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED" }

  - name: ShutoffOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account to disconnect" }
      - { name: reason, type: enum, source: input, description: "NONPAYMENT (only supported reason)", default: NONPAYMENT }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned disconnection date; manual creation requires >= clock date + 15 days notice" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | BLOCKED | EXECUTED | CANCELLED" }
      - { name: origin, type: enum, source: system, description: "MANUAL | AUTO (created by daily sweep)" }
      - { name: blocked_reason, type: enum, source: system, description: "WEATHER | MEDICAL; set while BLOCKED, null otherwise" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null until EXECUTED" }

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name, e.g. 'LIHEAP 2026'" }
      - { name: funder_type, type: enum, source: input, description: "LIHEAP | UTILITY_TRUST | STATE_GRANT" }
      - { name: fiscal_year, type: integer, source: input, description: "Appropriation fiscal year; allocations eligible only when equal to the logical-clock calendar year" }
      - { name: appropriated_cents, type: integer, source: input, description: "Total appropriation", constraints: "> 0" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall order; lower rank fills first" }
      - { name: eligible_tiers, type: array, source: input, description: "Non-empty subset of [TIER_1, TIER_2, TIER_3]; enrollment tier must be listed" }
      - { name: requires_completed_referral, type: boolean, source: input, description: "When true, the account needs a COMPLETED AssistanceReferral to be eligible", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED" }
      - { name: pledged_cents, type: integer, source: computed, description: "Sum of FundAllocation.amount_cents with status PLEDGED on this fund", default: 0 }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of FundAllocation.amount_cents with status DISBURSED", default: 0 }
      - { name: released_cents, type: integer, source: computed, description: "Sum of FundAllocation.amount_cents with status RELEASED", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "appropriated_cents - pledged_cents - disbursed_cents", default: 0 }

  - name: FundAllocation
    parent: null
    common_fields: true
    fields:
      - { name: funding_source_id, type: string, source: system, description: "FK -> FundingSource.id; fund chosen by the waterfall" }
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; assisted account (from request)" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> AssistanceEnrollment.id; the ACTIVE enrollment pinned at pledge time and re-validated at disburse" }
      - { name: amount_cents, type: integer, source: system, description: "Amount this fund contributes within the batch", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PLEDGED | DISBURSED | RELEASED" }
      - { name: batch_id, type: string, source: system, description: "Groups all FundAllocation rows created by one POST /assistance/fund-allocations call" }
      - { name: allocation_sequence, type: integer, source: system, description: "1-based fill order of this row within its batch, following the waterfall ranking" }

  - name: AssistanceReferral
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; referred account" }
      - { name: agency_code, type: string, source: input, description: "External energy-assistance agency code" }
      - { name: status, type: enum, source: system, description: "INITIATED | COMPLETED | EXPIRED" }
      - { name: initiated_on, type: datetime, source: system, description: "Logical-clock date of creation" }
      - { name: completed_on, type: datetime, source: system, description: "Logical-clock date of completion; null unless COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    field: service_status
    initial_state: CONNECTED
    terminal_states: []
    note: "Parallel dimension: protection_status (UNPROTECTED | WEATHER_MORATORIUM | MEDICAL_MORATORIUM) evolves independently via protection_gate recomputation; service_status changes only via shutoff/reconnect events."
    transitions:
      - from: CONNECTED
        to: DISCONNECT_PENDING
        trigger: "POST /assistance/shutoff-orders (manual) or system (daily sweep auto-creates ShutoffOrder)"
        actor: ProgramAdmin | system
        preconditions: ["ShutoffOrder created and SCHEDULED on this account"]
        side_effects: ["linked ShutoffOrder.status = SCHEDULED"]
      - from: DISCONNECT_PENDING
        to: CONNECTED
        trigger: "system (open ShutoffOrder auto-cancelled: protection arose, kept-current ACTIVE DPA appeared, or arrearage fell below SHUTOFF_MIN_ARREARAGE_CENTS) or POST /assistance/shutoff-orders/{order_id}/cancel"
        actor: system | CustomerServiceRep | ProgramAdmin
        preconditions: ["No open (SCHEDULED|BLOCKED) ShutoffOrder remains on the account"]
        side_effects: []
      - from: DISCONNECT_PENDING
        to: DISCONNECTED
        trigger: "POST /assistance/shutoff-orders/{order_id}/execute"
        actor: FieldCrew
        preconditions: ["ShutoffOrder.status == SCHEDULED", "protection_status == UNPROTECTED at execution time"]
        side_effects:
          - "reconnection fee schedule computed and stored (reconnection_fee_base_cents, reconnection_fee_surcharge_cents, reconnection_deposit_topup_cents; reconnection_fee_due_cents = base + topup)"
          - "increments CustomerAccount.version by 1"
      - from: DISCONNECTED
        to: CONNECTED
        trigger: "POST /assistance/accounts/{account_id}/reconnect"
        actor: FieldCrew
        preconditions: ["reconnection_fee_due_cents == 0 after any after-hours surcharge is folded in"]
        side_effects: ["reconnection_surcharge_applied reset is n/a; fee fields remain as audit"]

  - entity: CustomerAccount
    field: protection_status
    initial_state: UNPROTECTED
    terminal_states: []
    note: "Derived/persisted gate recomputed by protection_gate: on daily sweep, on certificate create/revoke. Any recompute that changes a value bumps version and immediately syncs an open ShutoffOrder (SCHEDULED<->BLOCKED)."
    transitions:
      - from: UNPROTECTED
        to: MEDICAL_MORATORIUM
        trigger: "system (MedicalCertificate created whose half-open window covers the clock date, or sweep finds one)"
        actor: system
        preconditions: ["EXISTS MedicalCertificate with status ACTIVE and effective_from <= clock date < effective_to"]
        side_effects: ["open ShutoffOrder SCHEDULED -> BLOCKED with blocked_reason=MEDICAL"]
      - from: UNPROTECTED
        to: WEATHER_MORATORIUM
        trigger: "system (daily sweep: winter season [Nov 1, Apr 1) UTC, or observed_low_f <= 32, or observed_heat_index_f >= 95)"
        actor: system
        preconditions: ["No ACTIVE covering MedicalCertificate", "weather/winter trigger present in this sweep"]
        side_effects: ["open ShutoffOrder SCHEDULED -> BLOCKED with blocked_reason=WEATHER"]
      - from: [MEDICAL_MORATORIUM, WEATHER_MORATORIUM]
        to: UNPROTECTED
        trigger: "system (daily sweep with no trigger, or MedicalCertificate revoked/expired leaving no covering certificate)"
        actor: system
        preconditions: ["No ACTIVE covering certificate", "no winter/weather trigger in effect"]
        side_effects: ["open ShutoffOrder BLOCKED -> SCHEDULED, blocked_reason=null"]
      - from: WEATHER_MORATORIUM
        to: MEDICAL_MORATORIUM
        trigger: "system (MedicalCertificate created covering clock date while weather moratorium active)"
        actor: system
        preconditions: ["Medical gate outranks weather gate"]
        side_effects: ["blocked_reason flips WEATHER -> MEDICAL on an open BLOCKED order"]

  - entity: AssistanceApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /assistance/applications/{application_id}/begin-review"
        actor: EligibilitySpecialist
        preconditions: ["acting X-User-ID != submitted_by_user_id (segregation of duties)"]
        side_effects: ["reviewed_by_user_id = acting X-User-ID"]
      - from: UNDER_REVIEW
        to: DOCS_PENDING
        trigger: "POST /assistance/applications/{application_id}/request-documents"
        actor: EligibilitySpecialist
        preconditions: []
        side_effects: ["docs_requested = true", "documents_received = false (each new request round requires fresh documents)"]
      - from: DOCS_PENDING
        to: UNDER_REVIEW
        trigger: "POST /assistance/applications/{application_id}/submit-documents"
        actor: CustomerServiceRep | Customer
        preconditions: []
        side_effects: ["documents_received = true"]
        note: "cycle: UNDER_REVIEW -> DOCS_PENDING -> UNDER_REVIEW may repeat"
      - from: [UNDER_REVIEW, DOCS_PENDING]
        to: VERIFIED
        trigger: "POST /assistance/applications/{application_id}/verify (income eligible)"
        actor: EligibilitySpecialist
        preconditions: ["docs_requested == false OR documents_received == true (fires ERR_DOCUMENTS_OUTSTANDING from DOCS_PENDING before documents are resubmitted)", "acting X-User-ID != submitted_by_user_id", "benefit_tier computed from ANNUAL_GROSS is not INELIGIBLE"]
        side_effects:
          - "benefit_tier set; income_measure_used = ANNUAL_GROSS; decided_at = clock"
          - "creates AssistanceEnrollment (status=PENDING, tier=benefit_tier, discount_pct per tier)"
      - from: [UNDER_REVIEW, DOCS_PENDING]
        to: DENIED
        trigger: "POST /assistance/applications/{application_id}/verify computing INELIGIBLE, or POST /assistance/applications/{application_id}/deny"
        actor: EligibilitySpecialist
        preconditions: ["deny: acting X-User-ID != submitted_by_user_id"]
        side_effects: ["denial_reason = INCOME_OVER_LIMIT (auto-deny) or request reason_code", "decided_at = clock"]
      - from: [SUBMITTED, UNDER_REVIEW, DOCS_PENDING]
        to: WITHDRAWN
        trigger: "POST /assistance/applications/{application_id}/withdraw, or system (superseded by a newer application on the same account)"
        actor: CustomerServiceRep | Customer | system
        preconditions: []
        side_effects: ["supersede path sets denial_reason null; no enrollment exists to clean up (enrollment only created at VERIFIED)"]

  - entity: AssistanceEnrollment
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /assistance/enrollments/{enrollment_id}/activate"
        actor: CustomerServiceRep | ProgramAdmin
        preconditions: ["no other enrollment with status ACTIVE on the same account"]
        side_effects: ["activated_on = clock date", "recert_due_on = clock date + 365 days"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system (daily sweep: clock date >= recert_due_on)"
        actor: system
        preconditions: []
        side_effects: ["lapsed_on = clock date"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /assistance/enrollments/{enrollment_id}/recertify"
        actor: EligibilitySpecialist
        preconditions: ["new_application_id references a VERIFIED application on the same account", "new_application_id != application_id"]
        side_effects: ["tier and discount_pct updated from the new application", "recert_due_on = clock date + 365 days", "lapsed_on = null"]
        note: "cycle: ACTIVE -> LAPSED -> ACTIVE"
      - from: [PENDING, ACTIVE, LAPSED]
        to: TERMINATED
        trigger: "POST /assistance/enrollments/{enrollment_id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["PLEDGED FundAllocation rows are NOT auto-released; they become undisburseable (ERR_ENROLLMENT_NO_LONGER_ACTIVE)"]

  - entity: DeferredPaymentAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, BROKEN, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (payment waterfall completes down_payment_required_cents) — immediate at creation when down payment is 0 (TIER_1)"
        actor: system
        preconditions: ["down_payment_received_cents >= down_payment_required_cents"]
        side_effects:
          - "activated_on = clock date; first_installment_due_on = clock date + 30 days"
          - "open ShutoffOrder on the account auto-cancels (kept-current ACTIVE DPA)"
          - "account service_status DISCONNECT_PENDING -> CONNECTED when no open order remains"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (daily sweep: earliest unsettled installment k has due_k + 5 days grace < clock date)"
        actor: system
        preconditions: []
        side_effects: ["defaulted_on = clock date", "missed_payment_count += 1"]
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /assistance/dpas/{dpa_id}/reinstate"
        actor: CustomerServiceRep
        preconditions: ["clock date <= defaulted_on + 15 days (cure window)", "installments_settled_count >= count of installments with due_k <= clock date (all due installments settled)"]
        side_effects: ["defaulted_on = null"]
        note: "cycle: ACTIVE -> DEFAULTED -> ACTIVE"
      - from: DEFAULTED
        to: BROKEN
        trigger: "system (daily sweep: clock date > defaulted_on + 15 days)"
        actor: system
        preconditions: []
        side_effects:
          - "every ForgivenessCredit POSTED -> REVERSED; account arrearage_balance_cents += sum(reversed amounts)"
          - "forgiven_posted_cents recomputed (drops to 0); remaining_balance_cents recomputed"
          - "account delinquency re-evaluation; next sweep may auto-create a ShutoffOrder"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (payment posting leaves remaining_balance_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["DPA ledger closes: covered == paid + forgiven + 0"]
      - from: [DRAFT, ACTIVE, DEFAULTED]
        to: CANCELLED
        trigger: "POST /assistance/dpas/{dpa_id}/cancel, or system (superseded DRAFT when a newer DPA is created on the account)"
        actor: CustomerServiceRep | ProgramAdmin | system
        preconditions: []
        side_effects: ["every ForgivenessCredit POSTED -> REVERSED; account arrearage_balance_cents += sum(reversed amounts)", "forgiven_posted_cents recomputed"]

  - entity: Payment
    field: null
    initial_state: POSTED
    terminal_states: [POSTED]
    note: "Immutable event (common_fields: false): created by POST /assistance/payments; never transitions, never updates, no version field."
    transitions: []

  - entity: ForgivenessCredit
    field: status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "system (DPA -> BROKEN or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["reversed_at = clock", "account arrearage_balance_cents += amount_cents", "DPA forgiven_posted_cents -= amount_cents"]

  - entity: MedicalCertificate
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /assistance/medical-certificates/{certificate_id}/renew"
        actor: CustomerServiceRep
        preconditions: ["renewal_count < 2"]
        side_effects: ["effective_to += 30 days", "renewal_count += 1", "protection_gate recompute (certificate remains ACTIVE with extended window)"]
        note: "self-loop renewal; maximum 2 renewals then ERR_RENEWAL_LIMIT_REACHED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily sweep: clock date >= effective_to)"
        actor: system
        preconditions: []
        side_effects: ["protection_gate recompute; open ShutoffOrder BLOCKED -> SCHEDULED if no other protection"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /assistance/medical-certificates/{certificate_id}/revoke"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["protection_gate recompute; open ShutoffOrder BLOCKED -> SCHEDULED if no other protection"]

  - entity: ShutoffOrder
    field: status
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system (protection_gate: account protection_status becomes WEATHER_MORATORIUM or MEDICAL_MORATORIUM)"
        actor: system
        preconditions: []
        side_effects: ["blocked_reason = WEATHER | MEDICAL"]
      - from: BLOCKED
        to: SCHEDULED
        trigger: "system (protection_gate: protection_status returns to UNPROTECTED)"
        actor: system
        preconditions: []
        side_effects: ["blocked_reason = null"]
        note: "cycle: SCHEDULED -> BLOCKED -> SCHEDULED"
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /assistance/shutoff-orders/{order_id}/execute"
        actor: FieldCrew
        preconditions: ["clock date >= scheduled_date", "account protection_status == UNPROTECTED at execution", "account service_status == DISCONNECT_PENDING"]
        side_effects:
          - "executed_at = clock; account service_status -> DISCONNECTED"
          - "reconnection fee schedule snapshotted on account (base discounted by enrollment tier waiver, after-hours surcharge precomputed, deposit top-up unless waived)"
      - from: [SCHEDULED, BLOCKED]
        to: CANCELLED
        trigger: "POST /assistance/shutoff-orders/{order_id}/cancel, or system (sweep/payment side effect: arrearage < SHUTOFF_MIN_ARREARAGE_CENTS, or kept-current ACTIVE DPA exists)"
        actor: CustomerServiceRep | ProgramAdmin | system
        preconditions: []
        side_effects: ["account service_status DISCONNECT_PENDING -> CONNECTED when no other open order remains"]

  - entity: FundingSource
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /assistance/funding-sources/{source_id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["fund leaves the waterfall eligibility set"]
      - from: [OPEN, SUSPENDED]
        to: CLOSED
        trigger: "POST /assistance/funding-sources/{source_id}/close"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["every FundAllocation PLEDGED on this fund -> RELEASED (available_cents restored)"]

  - entity: FundAllocation
    field: status
    initial_state: PLEDGED
    terminal_states: [DISBURSED, RELEASED]
    transitions:
      - from: PLEDGED
        to: DISBURSED
        trigger: "POST /assistance/fund-allocations/{allocation_id}/disburse"
        actor: ProgramAdmin
        preconditions: ["pinned enrollment still has status ACTIVE"]
        side_effects:
          - "account arrearage_balance_cents -= min(amount_cents, arrearage_balance_cents); any remainder -> credit_balance_cents"
          - "delinquency re-evaluation; open ShutoffOrder auto-cancel check"
      - from: PLEDGED
        to: RELEASED
        trigger: "POST /assistance/fund-allocations/{allocation_id}/release, or system (funding source CLOSED)"
        actor: ProgramAdmin | system
        preconditions: []
        side_effects: ["fund available_cents restored by amount_cents"]

  - entity: AssistanceReferral
    field: status
    initial_state: INITIATED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /assistance/referrals/{referral_id}/complete"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["completed_on = clock date", "unlocks requires_completed_referral funds in the waterfall"]
      - from: INITIATED
        to: EXPIRED
        trigger: "system (daily sweep: clock date > initiated_on + 60 days)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: dpa-create-stale-account
    parent_entity: CustomerAccount
    write_endpoint: "POST /assistance/dpas"
    occ_field: "expected_account_version"
    description: |
      Creating a DPA against a CustomerAccount whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a DPA (which legitimately supersedes a
      DRAFT DPA under the one-active-agreement policy) or posted any
      account-mutating activity, making the current writer's view stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
  - rule_id: application-create-stale-account
    parent_entity: CustomerAccount
    write_endpoint: "POST /assistance/applications"
    occ_field: "expected_account_version"
    description: |
      Creating an AssistanceApplication against a CustomerAccount whose version
      has advanced since the client last observed it is rejected. A newer
      application legitimately supersedes an open one (auto-WITHDRAWN), so a
      create issued from a stale account view must fail rather than silently
      withdraw an application the client never saw.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: income_tier_determination
    trigger: "application creation (provisional variant) and verify (final variant)"
    algorithm: threshold
    formula: |
      fpl = FPL_2026_CENTS[min(household_size, 8)] + max(0, household_size - 8) * FPL_ADDITIONAL_MEMBER_CENTS
      measure = variant income in cents (see variants)
      # integer cross-multiplication, no floats:
      if measure * 100 <= 150 * fpl: tier = TIER_1        # boundary: exactly 150% qualifies
      elif measure * 100 <= 200 * fpl: tier = TIER_2
      elif measure * 100 <= 250 * fpl: tier = TIER_3
      else: tier = INELIGIBLE
    input_set: "AssistanceApplication.household_size + variant-selected income figure"
    constants:
      FPL_2026_CENTS: { "1": 1565000, "2": 2115000, "3": 2665000, "4": 3215000, "5": 3765000, "6": 4315000, "7": 4865000, "8": 5415000 }
      FPL_ADDITIONAL_MEMBER_CENTS: 550000
    precision: "integer cents; ratio compared by cross-multiplication (no rounding)"
    variants:
      - name: ANNUALIZED_CURRENT_MONTH
        when: "at application creation -> provisional_benefit_tier"
        difference: "measure = current_month_income_cents * 12 (forward-looking annualization)"
      - name: ANNUAL_GROSS
        when: "at verify -> benefit_tier; sets income_measure_used"
        difference: "measure = gross_annual_income_cents (documented income); INELIGIBLE result auto-denies the application"

  - name: dpa_terms_computation
    trigger: "POST /assistance/dpas (at creation, snapshot semantics)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned top-to-bottom; each step uses only prior steps.
      covered = account.arrearage_balance_cents                      # 1. snapshot
      tier = ACTIVE enrollment tier on account, else NONE            # 2. tier lookup
      if tier == TIER_1: down = 0
      elif tier == TIER_2: down = max(round_half_up(covered * 0.05), 2500)
      else:                down = max(round_half_up(covered * 0.10), 5000)   # TIER_3 or NONE
      pool = round_half_up(covered * FORGIVENESS_SHARE[tier])        # 3. forgiveness pool
      base = covered - down - pool                                   # 4. installment base
      inst = round_half_up(base / n)                                 # 5. per-installment (installments 1..n-1)
      final = base - (n - 1) * inst                                  # 6. final installment absorbs remainder
    input_set: "CustomerAccount.arrearage_balance_cents at creation; ACTIVE AssistanceEnrollment tier if any; request installment_count n"
    constants:
      MIN_ARREARAGE_CENTS: 10000
      FORGIVENESS_SHARE: { TIER_1: 0.5, TIER_2: 0.3333333333333333, TIER_3: 0.25, NONE: 0 }
      DOWN_MIN_TIER_2_CENTS: 2500
      DOWN_MIN_OTHER_CENTS: 5000
      INSTALLMENT_MIN: 2
      INSTALLMENT_MAX: 12
    precision: "integer cents; round_half_up where shown; installment rounding remainder absorbed by final installment"

  - name: forgiveness_accrual
    trigger: "payment waterfall settles installment k on time"
    algorithm: chronological
    formula: |
      # credit for installment k of n, in settlement order (chronological):
      if k < n: credit_k = round_half_up(forgiveness_pool_cents / n)
      else:     credit_n = forgiveness_pool_cents - sum(credit_1 .. credit_(n-1))   # remainder absorbs rounding
      A late-settled installment (paid_at > due_k + GRACE_DAYS) accrues no credit; the
      pool remainder rule still keys off credits actually POSTED, so a forfeited
      interim credit leaves its share payable as dpa_extra.
    input_set: "ForgivenessCredit rows on the DPA with status POSTED; pool and n from the DPA"
    constants:
      GRACE_DAYS: 5
    precision: "integer cents; round_half_up"
    variants:
      - name: PROJECTED
        when: "DPA.projected_forgiveness_cents — forward-looking, assumes every remaining installment settles on time"
        difference: "always equals forgiveness_pool_cents regardless of payment history"
      - name: POSTED
        when: "DPA.forgiven_posted_cents — actual ledger"
        difference: "sum of ForgivenessCredit.amount_cents with status POSTED; forfeited (late) installments never contribute; reversal on BROKEN/CANCELLED drops it"

  - name: payment_application_waterfall
    trigger: "POST /assistance/payments"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      1. reconnection_fee:  pay = min(remaining, account.reconnection_fee_due_cents); fee due -= pay
      2. dpa down payment:  if account has DRAFT DPA: pay = min(remaining, down_required - down_received); down_received += pay
                            (completing the down payment activates the DPA)
      3. dpa installments:  while ACTIVE DPA has unsettled installments and remaining >= schedule[k]:
                            settle k (oldest first); remaining -= schedule[k]
                            on_time_k = (paid_at date <= due_k + GRACE_DAYS)
                            if on_time_k: post ForgivenessCredit per forgiveness_accrual
      4. dpa extra:         if DPA ACTIVE|DRAFT and remaining > 0: apply to DPA remaining (paid_to_arrearage)
      5. arrearage:         pay = min(remaining, arrearage_balance_cents); arrearage -= pay
      6. current charges:   pay = min(remaining, current_charges_balance_cents); current -= pay
      7. overpayment:       credit_balance_cents += remaining
      DPA-routed buckets (2,3,4) set Payment.dpa_id. Buckets 2-5 all reduce the DPA
      ledger / account arrearage consistently (see compensating invariants).
    input_set: "Account fee/balances + the account's single non-terminal DPA if any"
    precision: "integer cents; no rounding (amounts are integral)"
    note: "Payment posting then recomputes delinquency_tier and runs the open-order auto-cancel check (arrearage < SHUTOFF_MIN_ARREARAGE_CENTS or kept-current ACTIVE DPA -> cancel)."

  - name: delinquency_tier_computation
    trigger: "at every account read and inside the daily sweep (derived against logical clock)"
    algorithm: threshold
    formula: |
      age_days = (clock date - arrearage_since) in whole days, 0 when arrearage_since is null
      if arrearage_balance_cents >= 20000 and age_days >= 60: SEVERELY_DELINQUENT
      elif arrearage_balance_cents >= 5000 and age_days >= 30: DELINQUENT
      else: CURRENT
      # boundaries inclusive: exactly 5000 & 30 days -> DELINQUENT; exactly 20000 & 60 -> SEVERELY_DELINQUENT
    input_set: "CustomerAccount.arrearage_balance_cents, arrearage_since, logical clock"
    constants:
      DELINQUENT_MIN_CENTS: 5000
      DELINQUENT_MIN_AGE_DAYS: 30
      SEVERE_MIN_CENTS: 20000
      SEVERE_MIN_AGE_DAYS: 60
    precision: "integer cents and whole days; inclusive lower bounds"

  - name: protection_gate
    trigger: "daily sweep; MedicalCertificate create/renew/revoke"
    algorithm: constraint_propagation
    formula: |
      medical = EXISTS ACTIVE MedicalCertificate on account with effective_from <= clock date < effective_to
      weather = (clock date in [Nov 1, Apr 1) UTC) OR sweep observed_low_f <= 32 OR sweep observed_heat_index_f >= 95
      # precedence: medical outranks weather
      if medical: protection_status = MEDICAL_MORATORIUM
      elif weather: protection_status = WEATHER_MORATORIUM
      else: protection_status = UNPROTECTED
      # every change immediately syncs an open ShutoffOrder: SCHEDULED<->BLOCKED (+blocked_reason)
      # temperature boundaries inclusive: exactly 32F and exactly 95F trigger
    input_set: "account certificates (status ACTIVE only), clock date, current sweep's weather inputs"
    constants:
      WINTER_START_MONTH_DAY: "11-01"
      WINTER_END_MONTH_DAY: "04-01"
      COLD_THRESHOLD_F: 32
      HEAT_THRESHOLD_F: 95
    precision: "whole degrees Fahrenheit; inclusive thresholds"

  - name: reconnection_fee_computation
    trigger: "shutoff execution (snapshot) and reconnect with after_hours=true (surcharge fold-in)"
    algorithm: tiered_pricing
    formula: |
      # At execute (snapshot tier waiver w from ACTIVE enrollment: TIER_1=100, TIER_2=30, TIER_3=25, NONE=0;
      # LIFE_THREATENING ACTIVE certificate forces w=100):
      base_disc   = round_half_up(BASE_FEE_CENTS * (100 - w) / 100)                    # component 1
      sur_gross   = round_half_up(BASE_FEE_CENTS * AFTER_HOURS_RATE)                   # component 2, step A
      sur_disc    = round_half_up(sur_gross * (100 - w) / 100)                         # component 2, step B
      deposit_topup = 0 if (w == 100 or LIFE_THREATENING cert ACTIVE)                  # component 3
                      else max(0, DEPOSIT_REQUIRED_CENTS - deposit_held_cents)
      reconnection_fee_due_cents = base_disc + deposit_topup
      # At reconnect with after_hours=true and reconnection_surcharge_applied == false:
      reconnection_fee_due_cents += sur_disc; reconnection_surcharge_applied = true
      # PINNED rounding order: each component is rounded to cents BEFORE summation.
      # Alternative order (sum raw components, discount, then round) is REJECTED and
      # produces different cents (e.g. w=30: pinned 2328+1164=3492 vs unpinned 3491).
    input_set: "ACTIVE enrollment tier at execution, LIFE_THREATENING certificate presence, deposit_held_cents, reconnect after_hours flag"
    constants:
      BASE_FEE_CENTS: 3325
      AFTER_HOURS_RATE: 0.5
      FEE_WAIVER_PCT: { TIER_1: 100, TIER_2: 30, TIER_3: 25, NONE: 0 }
      DEPOSIT_REQUIRED_CENTS: 7500
    precision: "integer cents; round_half_up per component BEFORE summation (order pinned)"

  - name: fund_waterfall_allocation
    trigger: "POST /assistance/fund-allocations"
    algorithm: waterfall_allocation
    formula: |
      eligible = funds where status == OPEN
                 AND fiscal_year == calendar year of logical clock
                 AND account's ACTIVE enrollment tier in eligible_tiers
                 AND (requires_completed_referral == false
                      OR EXISTS AssistanceReferral on account with status COMPLETED)
      order eligible by priority_rank ASC, tie-break created_at ASC   # never by id
      if sum(f.available_cents for f in eligible) < amount_cents:
          reject ERR_INSUFFICIENT_ASSISTANCE_FUNDS (all-or-nothing; nothing pledged)
      greedy: for f in ordered eligible: take_k = min(f.available_cents, still_needed)
              create FundAllocation(status=PLEDGED, amount_cents=take_k,
                                    enrollment_id = account's ACTIVE enrollment id,
                                    batch_id = this request, allocation_sequence = k-th fill)
    input_set: "all FundingSource rows (any status inspected by the filter), account's ACTIVE enrollment, account's COMPLETED referrals"
    precision: "integer cents; splits allowed; each allocation >= 1 cent"

  - name: funding_report_aggregation
    trigger: "GET /assistance/funding-sources/{source_id}/report"
    algorithm: aggregation
    formula: |
      pledged_cents   = sum(amount_cents of allocations with status PLEDGED)
      disbursed_cents = sum(amount_cents of allocations with status DISBURSED)
      released_cents  = sum(amount_cents of allocations with status RELEASED)
      available_cents = appropriated_cents - pledged_cents - disbursed_cents
      allocation_count = count of all allocation rows on this fund
      # invariant: pledged + disbursed + released == total ever allocated
    input_set: "FundAllocation rows on this FundingSource, all statuses, all time"
    precision: "integer cents"

  - name: certificate_window_arithmetic
    trigger: "certificate create and renew"
    algorithm: interval_merge
    formula: |
      effective_to = effective_from + CERT_WINDOW_DAYS days        # half-open [from, to)
      renew: effective_to += CERT_WINDOW_DAYS days (renewal_count += 1, max MAX_RENEWALS)
      overlap check on create: reject when an existing ACTIVE certificate on the same
      account satisfies new.from < existing.effective_to AND existing.effective_from < new.to
      # adjacency is NOT overlap: new.from == existing.effective_to is accepted (half-open)
    input_set: "ACTIVE MedicalCertificate rows on the same account"
    constants:
      CERT_WINDOW_DAYS: 30
      MAX_RENEWALS: 2
    precision: "whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Customer role may only act on the account whose id == X-User-ID (path account_id or body account_id)", error_id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "all account-scoped endpoints when X-User-Role == Customer" }
  - { priority: 4, category: existence, check: "request body shape: required fields present, types match, enum members valid, integer ranges respected (household_size 1..12, installment_count 2..12, amount_cents > 0)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "every path id and body-supplied FK id exists (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: auth, check: "segregation of duties: acting X-User-ID != application.submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /assistance/applications/{application_id}/begin-review, POST /assistance/applications/{application_id}/verify, POST /assistance/applications/{application_id}/deny" }
  - { priority: 7, category: state, check: "OCC: expected_account_version == CustomerAccount.version", error_id: ERR_STALE_ACCOUNT_VERSION, http_status: 412, applies_to: "POST /assistance/applications, POST /assistance/dpas" }
  - { priority: 8, category: state, check: "account service_status != DISCONNECTED for manual shutoff creation (CONNECTED or DISCONNECT_PENDING accepted; the duplicate-order constraint catches the DISCONNECT_PENDING case)", error_id: ERR_ACCOUNT_NOT_CONNECTED, http_status: 409, applies_to: "POST /assistance/shutoff-orders" }
  - { priority: 9, category: state, check: "application in required from-state for the action (begin-review: SUBMITTED; request-documents/deny: UNDER_REVIEW; verify: UNDER_REVIEW|DOCS_PENDING; submit-documents: DOCS_PENDING)", error_id: ERR_APPLICATION_NOT_REVIEWABLE, http_status: 409, applies_to: "application action endpoints" }
  - { priority: 10, category: state, check: "generic state precondition for remaining transitions (enrollment activate from PENDING, terminate from non-terminal, certificate revoke from ACTIVE, order cancel from SCHEDULED|BLOCKED, fund suspend from OPEN, fund close from OPEN|SUSPENDED, referral complete from INITIATED, DPA cancel from DRAFT|ACTIVE|DEFAULTED, withdraw from non-terminal)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints not covered by a more specific state error" }
  - { priority: 11, category: state, check: "DPA status == DEFAULTED for reinstate", error_id: ERR_DPA_NOT_REINSTATABLE, http_status: 409, applies_to: "POST /assistance/dpas/{dpa_id}/reinstate" }
  - { priority: 12, category: state, check: "allocation status == PLEDGED", error_id: ERR_ALLOCATION_NOT_PLEDGED, http_status: 409, applies_to: "POST /assistance/fund-allocations/{allocation_id}/disburse, POST /assistance/fund-allocations/{allocation_id}/release" }
  - { priority: 13, category: state, check: "certificate status == ACTIVE for renew", error_id: ERR_CERTIFICATE_NOT_RENEWABLE, http_status: 409, applies_to: "POST /assistance/medical-certificates/{certificate_id}/renew" }
  - { priority: 14, category: state, check: "order status == SCHEDULED and clock date >= scheduled_date for execute", error_id: ERR_ORDER_NOT_EXECUTABLE, http_status: 409, applies_to: "POST /assistance/shutoff-orders/{order_id}/execute" }
  - { priority: 15, category: state, check: "account service_status == DISCONNECTED for reconnect", error_id: ERR_ACCOUNT_NOT_DISCONNECTED, http_status: 409, applies_to: "POST /assistance/accounts/{account_id}/reconnect" }
  - { priority: 16, category: business_safety, check: "no ACTIVE MedicalCertificate covers the clock date (manual create and execution re-check)", error_id: ERR_SHUTOFF_BLOCKED_BY_MEDICAL, http_status: 422, applies_to: "POST /assistance/shutoff-orders, POST /assistance/shutoff-orders/{order_id}/execute" }
  - { priority: 17, category: business_safety, check: "account protection_status != WEATHER_MORATORIUM", error_id: ERR_SHUTOFF_BLOCKED_BY_MORATORIUM, http_status: 422, applies_to: "POST /assistance/shutoff-orders, POST /assistance/shutoff-orders/{order_id}/execute" }
  - { priority: 18, category: business_referential, check: "no kept-current ACTIVE DPA on the account (ACTIVE with every due installment settled)", error_id: ERR_DPA_KEPT_CURRENT, http_status: 422, applies_to: "POST /assistance/shutoff-orders" }
  - { priority: 19, category: business_referential, check: "account has an ACTIVE AssistanceEnrollment", error_id: ERR_ENROLLMENT_REQUIRED, http_status: 422, applies_to: "POST /assistance/fund-allocations" }
  - { priority: 20, category: business_referential, check: "pinned enrollment still ACTIVE at disburse time", error_id: ERR_ENROLLMENT_NO_LONGER_ACTIVE, http_status: 422, applies_to: "POST /assistance/fund-allocations/{allocation_id}/disburse" }
  - { priority: 21, category: business_temporal, check: "scheduled_date >= clock date + NOTICE_DAYS (15)", error_id: ERR_NOTICE_PERIOD_TOO_SHORT, http_status: 422, applies_to: "POST /assistance/shutoff-orders" }
  - { priority: 22, category: business_temporal, check: "clock date <= defaulted_on + CURE_WINDOW_DAYS (15)", error_id: ERR_CURE_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /assistance/dpas/{dpa_id}/reinstate" }
  - { priority: 23, category: business_constraint, check: "docs_requested == false OR documents_received == true", error_id: ERR_DOCUMENTS_OUTSTANDING, http_status: 422, applies_to: "POST /assistance/applications/{application_id}/verify" }
  - { priority: 24, category: business_constraint, check: "no ACTIVE or DEFAULTED DPA on the account (one-active capacity; DRAFT is superseded, not an error)", error_id: ERR_OPEN_DPA_EXISTS, http_status: 422, applies_to: "POST /assistance/dpas" }
  - { priority: 25, category: business_constraint, check: "no open (SCHEDULED|BLOCKED) ShutoffOrder on the account", error_id: ERR_OPEN_SHUTOFF_ORDER_EXISTS, http_status: 422, applies_to: "POST /assistance/shutoff-orders" }
  - { priority: 26, category: business_constraint, check: "certificate window does not overlap an existing ACTIVE certificate window (half-open; adjacency allowed)", error_id: ERR_CERTIFICATE_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /assistance/medical-certificates" }
  - { priority: 27, category: business_constraint, check: "renewal_count < 2", error_id: ERR_RENEWAL_LIMIT_REACHED, http_status: 422, applies_to: "POST /assistance/medical-certificates/{certificate_id}/renew" }
  - { priority: 28, category: business_constraint, check: "no other INITIATED referral with same (account_id, agency_code)", error_id: ERR_DUPLICATE_REFERRAL, http_status: 422, applies_to: "POST /assistance/referrals" }
  - { priority: 29, category: business_constraint, check: "no other ACTIVE enrollment on the account", error_id: ERR_ACTIVE_ENROLLMENT_EXISTS, http_status: 422, applies_to: "POST /assistance/enrollments/{enrollment_id}/activate" }
  - { priority: 30, category: business_fiscal, check: "arrearage_balance_cents >= MIN_ARREARAGE_CENTS (10000)", error_id: ERR_ARREARAGE_BELOW_MINIMUM, http_status: 422, applies_to: "POST /assistance/dpas" }
  - { priority: 31, category: business_fiscal, check: "delinquency_tier in {DELINQUENT, SEVERELY_DELINQUENT} and arrearage_balance_cents >= SHUTOFF_MIN_ARREARAGE_CENTS (10000)", error_id: ERR_NOT_SHUTOFF_ELIGIBLE, http_status: 422, applies_to: "POST /assistance/shutoff-orders" }
  - { priority: 32, category: business_fiscal, check: "eligible-fund pool available total >= amount_cents (all-or-nothing)", error_id: ERR_INSUFFICIENT_ASSISTANCE_FUNDS, http_status: 422, applies_to: "POST /assistance/fund-allocations" }
  - { priority: 33, category: business_fiscal, check: "reconnection_fee_due_cents == 0 (after after-hours surcharge fold-in)", error_id: ERR_RECONNECTION_FEE_UNPAID, http_status: 422, applies_to: "POST /assistance/accounts/{account_id}/reconnect" }

# =============================================================================
# §1.5 API Endpoint Table (55 endpoints)
# =============================================================================
endpoints:
  # --- logical clock & ops ---
  - method: POST
    path: "/assistance/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock; every date rule in this scaffold evaluates against this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity mutation; subsequent reads/sweeps evaluate against the new clock"]
  - method: POST
    path: "/assistance/ops/daily-sweep"
    description: "Run the nightly ops pass over ALL accounts in pinned order: (1) expire certificates past effective_to; (2) lapse enrollments past recert_due_on; (3) default ACTIVE DPAs with due+grace installments unsettled; (4) break DEFAULTED DPAs past the cure window (reversing credits); (5) expire INITIATED referrals older than 60 days; (6) recompute protection_status per account (winter season from clock, weather from this call's inputs, active certificates); (7) shutoff sync per account (auto-create SCHEDULED order only when service_status == CONNECTED AND delinquency DELINQUENT|SEVERELY_DELINQUENT AND arrearage >= 10000 AND UNPROTECTED AND no kept-current ACTIVE DPA AND no open order — scheduled_date = clock + 15 days; BLOCK open orders when protected; unblock when cleared; cancel when arrearage < 10000 or kept-current DPA exists); (8) version bumps only where a field value actually changed."
    roles: [ProgramAdmin]
    code: 200
    input: ["observed_low_f?", "observed_heat_index_f?"]
    output: "{ certificates_expired: integer, enrollments_lapsed: integer, dpas_defaulted: integer, dpas_broken: integer, referrals_expired: integer, orders_created: integer, orders_blocked: integer, orders_unblocked: integer, orders_cancelled: integer }"
    side_effects: ["all transitions marked 'daily sweep' in §1.2; cascades per protection_gate and order sync"]

  # --- accounts ---
  - method: POST
    path: "/assistance/accounts"
    description: "Create a customer account"
    roles: [ProgramAdmin]
    code: 201
    input: [service_address, "service_class?", "heating_fuel_type?", "deposit_held_cents?"]
    output: CustomerAccount
    side_effects: ["service_status=CONNECTED, protection_status=UNPROTECTED, balances 0, version=1"]
  - method: GET
    path: "/assistance/accounts/{account_id}"
    description: "Get one account (Customer restricted to own id)"
    roles: [Customer, CustomerServiceRep, EligibilitySpecialist, ProgramAdmin, FieldCrew]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: GET
    path: "/assistance/accounts"
    description: "List accounts with filters and pagination"
    roles: [CustomerServiceRep, EligibilitySpecialist, ProgramAdmin, FieldCrew]
    code: 200
    input: ["service_status?", "protection_status?", "delinquency_tier?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: POST
    path: "/assistance/accounts/{account_id}/charges"
    description: "Post a billing charge (ARREARAGE adds to arrearage_balance_cents and sets arrearage_since when 0->positive; CURRENT adds to current_charges_balance_cents)"
    roles: [ProgramAdmin]
    code: 201
    input: [charge_type, amount_cents, "effective_on?"]
    output: CustomerAccount
    side_effects: ["balance mutation per charge_type; arrearage_since bookkeeping; last_activity_at = clock; increments CustomerAccount.version by 1"]
  - method: POST
    path: "/assistance/accounts/{account_id}/reconnect"
    description: "Reconnect a disconnected account; folds the precomputed after-hours surcharge into reconnection_fee_due_cents once when after_hours=true, then requires reconnection_fee_due_cents == 0"
    roles: [FieldCrew]
    code: 200
    input: ["after_hours?"]
    output: CustomerAccount
    side_effects: ["service_status DISCONNECTED -> CONNECTED", "surcharge fold-in (once)", "last_activity_at = clock", "increments CustomerAccount.version by 1"]

  # --- assistance applications ---
  - method: POST
    path: "/assistance/applications"
    description: "Submit an assistance application; computes provisional_benefit_tier (ANNUALIZED_CURRENT_MONTH); supersedes any open (SUBMITTED|UNDER_REVIEW|DOCS_PENDING) application on the account -> WITHDRAWN"
    roles: [Customer, CustomerServiceRep]
    code: 201
    input: [account_id, household_size, gross_annual_income_cents, current_month_income_cents, "income_source?", expected_account_version]
    output: AssistanceApplication
    side_effects: ["status=SUBMITTED, submitted_by_user_id = X-User-ID", "supersede open application", "account last_activity_at = clock; increments CustomerAccount.version by 1"]
  - method: GET
    path: "/assistance/applications/{application_id}"
    description: "Get one application"
    roles: [Customer, CustomerServiceRep, EligibilitySpecialist, ProgramAdmin]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: []
  - method: GET
    path: "/assistance/applications"
    description: "List applications (FK reverse-reachability for account_id)"
    roles: [CustomerServiceRep, EligibilitySpecialist, ProgramAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "AssistanceApplication[]"
    side_effects: []
  - method: POST
    path: "/assistance/applications/{application_id}/begin-review"
    description: "Specialist claims the review (SUBMITTED -> UNDER_REVIEW); segregation of duties vs submitted_by_user_id"
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["reviewed_by_user_id = X-User-ID"]
  - method: POST
    path: "/assistance/applications/{application_id}/request-documents"
    description: "Request supporting documents (UNDER_REVIEW -> DOCS_PENDING); each request round requires fresh documents"
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["docs_requested = true", "documents_received = false"]
  - method: POST
    path: "/assistance/applications/{application_id}/submit-documents"
    description: "Documents supplied (DOCS_PENDING -> UNDER_REVIEW)"
    roles: [Customer, CustomerServiceRep]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["documents_received = true"]
  - method: POST
    path: "/assistance/applications/{application_id}/verify"
    description: "Verify income and assign final benefit_tier (ANNUAL_GROSS); creates PENDING enrollment; INELIGIBLE result auto-denies with INCOME_OVER_LIMIT"
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["benefit_tier + income_measure_used set", "creates AssistanceEnrollment PENDING when eligible", "decided_at = clock"]
  - method: POST
    path: "/assistance/applications/{application_id}/deny"
    description: "Deny an application under review"
    roles: [EligibilitySpecialist]
    code: 200
    input: [reason_code]
    output: AssistanceApplication
    side_effects: ["denial_reason = reason_code", "decided_at = clock"]
  - method: POST
    path: "/assistance/applications/{application_id}/withdraw"
    description: "Withdraw a non-terminal application"
    roles: [Customer, CustomerServiceRep]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: []

  # --- enrollments ---
  - method: GET
    path: "/assistance/enrollments/{enrollment_id}"
    description: "Get one enrollment"
    roles: [Customer, CustomerServiceRep, EligibilitySpecialist, ProgramAdmin]
    code: 200
    input: []
    output: AssistanceEnrollment
    side_effects: []
  - method: GET
    path: "/assistance/enrollments"
    description: "List enrollments (FK reverse-reachability for account_id, application_id)"
    roles: [CustomerServiceRep, EligibilitySpecialist, ProgramAdmin]
    code: 200
    input: ["account_id?", "application_id?", "status?", "tier?", "limit?", "offset?"]
    output: "AssistanceEnrollment[]"
    side_effects: []
  - method: POST
    path: "/assistance/enrollments/{enrollment_id}/activate"
    description: "Activate a PENDING enrollment (one ACTIVE per account)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: AssistanceEnrollment
    side_effects: ["activated_on = clock date", "recert_due_on = clock date + 365 days"]
  - method: POST
    path: "/assistance/enrollments/{enrollment_id}/recertify"
    description: "Recertify a LAPSED enrollment against a newer VERIFIED application (LAPSED -> ACTIVE)"
    roles: [EligibilitySpecialist]
    code: 200
    input: [new_application_id]
    output: AssistanceEnrollment
    side_effects: ["tier/discount_pct updated", "recert_due_on = clock date + 365 days", "lapsed_on = null"]
  - method: POST
    path: "/assistance/enrollments/{enrollment_id}/terminate"
    description: "Terminate an enrollment (PENDING|ACTIVE|LAPSED -> TERMINATED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AssistanceEnrollment
    side_effects: []

  # --- deferred payment agreements ---
  - method: POST
    path: "/assistance/dpas"
    description: "Create a DPA (snapshot covered arrearage, compute tiered terms). Supersedes a DRAFT DPA on the account (-> CANCELLED); rejects when an ACTIVE|DEFAULTED DPA exists. Activates immediately when down payment is 0."
    roles: [Customer, CustomerServiceRep]
    code: 201
    input: [account_id, installment_count, expected_account_version]
    output: DeferredPaymentAgreement
    side_effects: ["dpa_terms_computation", "DRAFT supersede", "immediate activation when down_payment_required_cents == 0", "account last_activity_at = clock; increments CustomerAccount.version by 1"]
  - method: GET
    path: "/assistance/dpas/{dpa_id}"
    description: "Get one DPA"
    roles: [Customer, CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: DeferredPaymentAgreement
    side_effects: []
  - method: GET
    path: "/assistance/dpas"
    description: "List DPAs (FK reverse-reachability for account_id)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "DeferredPaymentAgreement[]"
    side_effects: []
  - method: POST
    path: "/assistance/dpas/{dpa_id}/cancel"
    description: "Cancel a non-terminal DPA; reverses POSTED forgiveness credits back onto arrearage"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: DeferredPaymentAgreement
    side_effects: ["ForgivenessCredit POSTED -> REVERSED cascade", "account arrearage_balance_cents += reversed sum; increments CustomerAccount.version by 1"]
  - method: POST
    path: "/assistance/dpas/{dpa_id}/reinstate"
    description: "Cure a DEFAULTED DPA within the 15-day cure window when all due installments are settled"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: DeferredPaymentAgreement
    side_effects: ["defaulted_on = null"]
  - method: GET
    path: "/assistance/dpas/{id}/forgiveness-credits"
    description: "List forgiveness credits of a DPA (FK reverse-reachability for ForgivenessCredit.dpa_id)"
    roles: [Customer, CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ForgivenessCredit[]"
    side_effects: []

  # --- payments ---
  - method: POST
    path: "/assistance/payments"
    description: "Post a payment; applies the payment_application_waterfall (fee -> DPA down -> whole installments oldest-first -> DPA extra -> arrearage -> current charges -> overpayment credit)"
    roles: [Customer, CustomerServiceRep]
    code: 201
    input: [account_id, amount_cents, tender_type]
    output: Payment
    side_effects: ["waterfall ledger mutations", "DPA activation/completion when thresholds met", "ForgivenessCredit creation on on-time installment settlements", "delinquency re-evaluation + open-order auto-cancel check", "account last_activity_at = clock; increments CustomerAccount.version by 1"]
  - method: GET
    path: "/assistance/payments/{payment_id}"
    description: "Get one payment"
    roles: [Customer, CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/assistance/payments"
    description: "List payments (FK reverse-reachability for account_id, dpa_id)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["account_id?", "dpa_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # --- medical certificates ---
  - method: POST
    path: "/assistance/medical-certificates"
    description: "Register a medical certificate (half-open 30-day window); rejects overlapping ACTIVE windows; recomputes protection_gate"
    roles: [CustomerServiceRep]
    code: 201
    input: [account_id, physician_name, physician_license_number, condition_class, effective_from]
    output: MedicalCertificate
    side_effects: ["status=ACTIVE, effective_to = effective_from + 30 days", "protection_gate recompute (may BLOCK an open order)"]
  - method: GET
    path: "/assistance/medical-certificates/{certificate_id}"
    description: "Get one certificate"
    roles: [Customer, CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: MedicalCertificate
    side_effects: []
  - method: GET
    path: "/assistance/medical-certificates"
    description: "List certificates (FK reverse-reachability for account_id)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "MedicalCertificate[]"
    side_effects: []
  - method: POST
    path: "/assistance/medical-certificates/{certificate_id}/renew"
    description: "Renew an ACTIVE certificate (+30 days, max 2 renewals)"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: MedicalCertificate
    side_effects: ["effective_to += 30 days", "renewal_count += 1"]
  - method: POST
    path: "/assistance/medical-certificates/{certificate_id}/revoke"
    description: "Revoke an ACTIVE certificate; protection_gate recompute"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MedicalCertificate
    side_effects: ["protection_gate recompute (may UNBLOCK an open order)"]

  # --- shutoff orders ---
  - method: POST
    path: "/assistance/shutoff-orders"
    description: "Manually create a shutoff order (origin=MANUAL). Full validation chain: not DISCONNECTED, no medical/weather protection, no kept-current DPA, 15-day notice, no open order, delinquency + arrearage eligibility."
    roles: [ProgramAdmin]
    code: 201
    input: [account_id, scheduled_date, "reason?"]
    output: ShutoffOrder
    side_effects: ["status=SCHEDULED, origin=MANUAL", "account service_status -> DISCONNECT_PENDING; increments CustomerAccount.version by 1"]
  - method: GET
    path: "/assistance/shutoff-orders/{order_id}"
    description: "Get one shutoff order"
    roles: [Customer, CustomerServiceRep, ProgramAdmin, FieldCrew]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: []
  - method: GET
    path: "/assistance/shutoff-orders"
    description: "List shutoff orders (FK reverse-reachability for account_id)"
    roles: [CustomerServiceRep, ProgramAdmin, FieldCrew]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "ShutoffOrder[]"
    side_effects: []
  - method: POST
    path: "/assistance/shutoff-orders/{order_id}/execute"
    description: "Execute a SCHEDULED order on/after scheduled_date; re-checks protection at execution; snapshots the reconnection fee schedule on the account"
    roles: [FieldCrew]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: ["account service_status -> DISCONNECTED", "reconnection fee schedule snapshot (base + surcharge + deposit top-up per reconnection_fee_computation)", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/assistance/shutoff-orders/{order_id}/cancel"
    description: "Cancel a SCHEDULED|BLOCKED order"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: ["account service_status DISCONNECT_PENDING -> CONNECTED when no open order remains; increments CustomerAccount.version by 1"]

  # --- funding sources & allocations ---
  - method: POST
    path: "/assistance/funding-sources"
    description: "Create a funding source appropriation"
    roles: [ProgramAdmin]
    code: 201
    input: [name, funder_type, fiscal_year, appropriated_cents, priority_rank, eligible_tiers, "requires_completed_referral?"]
    output: FundingSource
    side_effects: ["status=OPEN, counters 0"]
  - method: GET
    path: "/assistance/funding-sources/{source_id}"
    description: "Get one funding source"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: GET
    path: "/assistance/funding-sources"
    description: "List funding sources"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["status?", "fiscal_year?", "limit?", "offset?"]
    output: "FundingSource[]"
    side_effects: []
  - method: POST
    path: "/assistance/funding-sources/{source_id}/suspend"
    description: "Suspend an OPEN fund (leaves waterfall eligibility)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: POST
    path: "/assistance/funding-sources/{source_id}/close"
    description: "Close an OPEN|SUSPENDED fund; releases all PLEDGED allocations"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["FundAllocation PLEDGED -> RELEASED cascade"]
  - method: GET
    path: "/assistance/funding-sources/{source_id}/report"
    description: "Computed funding report (appropriated/pledged/disbursed/released/available + allocation count)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ funding_source_id: string, appropriated_cents: integer, pledged_cents: integer, disbursed_cents: integer, released_cents: integer, available_cents: integer, allocation_count: integer }"
    side_effects: []
  - method: POST
    path: "/assistance/fund-allocations"
    description: "Allocate assistance to an account via the fund waterfall (selector: OPEN + current fiscal year + tier eligible + referral constraint; rank priority_rank ASC then created_at ASC; greedy fill; all-or-nothing). Returns the batch rows."
    roles: [ProgramAdmin]
    code: 201
    input: [account_id, amount_cents]
    output: "FundAllocation[]"
    side_effects: ["creates 1..N PLEDGED FundAllocation rows sharing one batch_id", "fund pledged/available counters updated"]
  - method: GET
    path: "/assistance/fund-allocations/{allocation_id}"
    description: "Get one allocation"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: FundAllocation
    side_effects: []
  - method: GET
    path: "/assistance/fund-allocations"
    description: "List allocations (FK reverse-reachability for funding_source_id, account_id, enrollment_id)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["funding_source_id?", "account_id?", "enrollment_id?", "status?", "batch_id?", "limit?", "offset?"]
    output: "FundAllocation[]"
    side_effects: []
  - method: POST
    path: "/assistance/fund-allocations/{allocation_id}/disburse"
    description: "Disburse a PLEDGED allocation onto the account (re-validates pinned enrollment ACTIVE)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundAllocation
    side_effects: ["account arrearage reduced (remainder to credit_balance_cents)", "delinquency re-evaluation + open-order auto-cancel check", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/assistance/fund-allocations/{allocation_id}/release"
    description: "Release a PLEDGED allocation back to the fund"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundAllocation
    side_effects: ["fund available_cents restored"]

  # --- referrals ---
  - method: POST
    path: "/assistance/referrals"
    description: "Create an energy-assistance referral (one INITIATED per account+agency_code)"
    roles: [CustomerServiceRep]
    code: 201
    input: [account_id, agency_code]
    output: AssistanceReferral
    side_effects: ["status=INITIATED, initiated_on = clock date"]
  - method: GET
    path: "/assistance/referrals/{referral_id}"
    description: "Get one referral"
    roles: [Customer, CustomerServiceRep, ProgramAdmin]
    code: 200
    input: []
    output: AssistanceReferral
    side_effects: []
  - method: GET
    path: "/assistance/referrals"
    description: "List referrals (FK reverse-reachability for account_id)"
    roles: [CustomerServiceRep, ProgramAdmin]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "AssistanceReferral[]"
    side_effects: []
  - method: POST
    path: "/assistance/referrals/{referral_id}/complete"
    description: "Complete an INITIATED referral"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: AssistanceReferral
    side_effects: ["completed_on = clock date"]

# =============================================================================
# §1.6 Error Code Catalog (33 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http: 403, condition: "Customer role acting on an account id != X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, or range violation (household_size 1..12, installment_count 2..12, amount_cents > 0)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "begin-review/verify/deny attempted by the same X-User-ID that submitted the application" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version != current CustomerAccount.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure on transitions without a more specific error" }
  - { id: ERR_APPLICATION_NOT_REVIEWABLE, http: 409, condition: "Application not in the required from-state for begin-review/request-documents/submit-documents/verify/deny" }
  - { id: ERR_ACCOUNT_NOT_CONNECTED, http: 409, condition: "Manual shutoff creation on an account whose service_status is DISCONNECTED" }
  - { id: ERR_ACCOUNT_NOT_DISCONNECTED, http: 409, condition: "Reconnect requires service_status == DISCONNECTED" }
  - { id: ERR_ORDER_NOT_EXECUTABLE, http: 409, condition: "Execute requires status SCHEDULED and clock date >= scheduled_date" }
  - { id: ERR_DPA_NOT_REINSTATABLE, http: 409, condition: "Reinstate requires DPA status DEFAULTED" }
  - { id: ERR_ALLOCATION_NOT_PLEDGED, http: 409, condition: "Disburse/release require allocation status PLEDGED" }
  - { id: ERR_CERTIFICATE_NOT_RENEWABLE, http: 409, condition: "Renew requires certificate status ACTIVE" }
  - { id: ERR_SHUTOFF_BLOCKED_BY_MEDICAL, http: 422, condition: "An ACTIVE MedicalCertificate covers the clock date (create or execution-time re-check)" }
  - { id: ERR_SHUTOFF_BLOCKED_BY_MORATORIUM, http: 422, condition: "protection_status == WEATHER_MORATORIUM blocks shutoff creation/execution" }
  - { id: ERR_DPA_KEPT_CURRENT, http: 422, condition: "A kept-current ACTIVE DPA blocks manual shutoff creation" }
  - { id: ERR_ENROLLMENT_REQUIRED, http: 422, condition: "Fund allocation requires an ACTIVE enrollment on the account" }
  - { id: ERR_ENROLLMENT_NO_LONGER_ACTIVE, http: 422, condition: "Pinned enrollment is not ACTIVE at disburse time" }
  - { id: ERR_NOTICE_PERIOD_TOO_SHORT, http: 422, condition: "scheduled_date < clock date + 15 days" }
  - { id: ERR_CURE_WINDOW_EXPIRED, http: 422, condition: "Reinstate attempted after defaulted_on + 15 days" }
  - { id: ERR_DOCUMENTS_OUTSTANDING, http: 422, condition: "Verify while docs_requested and documents_received == false" }
  - { id: ERR_OPEN_DPA_EXISTS, http: 422, condition: "An ACTIVE or DEFAULTED DPA already occupies the account (one-active capacity)" }
  - { id: ERR_OPEN_SHUTOFF_ORDER_EXISTS, http: 422, condition: "An open (SCHEDULED|BLOCKED) shutoff order already exists on the account" }
  - { id: ERR_CERTIFICATE_WINDOW_OVERLAP, http: 422, condition: "New certificate window overlaps an existing ACTIVE certificate window (half-open; adjacency allowed)" }
  - { id: ERR_RENEWAL_LIMIT_REACHED, http: 422, condition: "renewal_count == 2" }
  - { id: ERR_DUPLICATE_REFERRAL, http: 422, condition: "Another INITIATED referral exists with same (account_id, agency_code)" }
  - { id: ERR_ACTIVE_ENROLLMENT_EXISTS, http: 422, condition: "Another enrollment is already ACTIVE on the account" }
  - { id: ERR_ARREARAGE_BELOW_MINIMUM, http: 422, condition: "DPA creation requires arrearage_balance_cents >= 10000" }
  - { id: ERR_NOT_SHUTOFF_ELIGIBLE, http: 422, condition: "Manual shutoff requires delinquency DELINQUENT|SEVERELY_DELINQUENT and arrearage >= 10000" }
  - { id: ERR_INSUFFICIENT_ASSISTANCE_FUNDS, http: 422, condition: "Eligible-fund pool available total < requested amount (all-or-nothing)" }
  - { id: ERR_RECONNECTION_FEE_UNPAID, http: 422, condition: "reconnection_fee_due_cents > 0 at reconnect (after surcharge fold-in)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The utility customer; may view and act on their own account only"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /assistance/accounts/{account_id} (own id only)"
      - "POST /assistance/applications (own account)"
      - "POST /assistance/applications/{id}/submit-documents, POST .../withdraw (own account)"
      - "POST /assistance/dpas (own account)"
      - "POST /assistance/payments (own account)"
      - "GET on own applications/enrollments/dpas/payments/forgiveness-credits/medical-certificates/shutoff-orders/referrals"
  - name: CustomerServiceRep
    description: "Care-office intake staff: applications intake, payments, DPAs, certificates, referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /assistance/medical-certificates, POST .../renew"
      - "POST /assistance/referrals, POST .../complete"
      - "POST /assistance/dpas/{id}/reinstate"
    shared_operations:
      - "POST /assistance/applications + withdraw + submit-documents"
      - "POST /assistance/dpas + cancel"
      - "POST /assistance/payments"
      - "POST /assistance/enrollments/{id}/activate"
      - "POST /assistance/shutoff-orders/{id}/cancel"
      - "GET endpoints for accounts and all child entities"
  - name: EligibilitySpecialist
    description: "Verification officer: reviews and decides applications, recertifies enrollments"
    identity: "opaque"
    exclusive_operations:
      - "POST /assistance/applications/{id}/begin-review, .../request-documents, .../verify, .../deny"
      - "POST /assistance/enrollments/{id}/recertify"
    shared_operations:
      - "GET endpoints for accounts/applications/enrollments"
  - name: ProgramAdmin
    description: "Program administrator: accounts, charges, funds, allocations, sweeps, clock, shutoff creation, revocations"
    identity: "opaque"
    exclusive_operations:
      - "POST /assistance/accounts, POST .../charges"
      - "POST /assistance/_clock/set_current_utc, POST /assistance/ops/daily-sweep"
      - "POST /assistance/funding-sources + suspend + close, GET .../report"
      - "POST /assistance/fund-allocations + disburse + release"
      - "POST /assistance/shutoff-orders"
      - "POST /assistance/medical-certificates/{id}/revoke"
      - "POST /assistance/enrollments/{id}/terminate"
    shared_operations:
      - "POST /assistance/dpas/{id}/cancel, POST /assistance/shutoff-orders/{id}/cancel"
      - "POST /assistance/enrollments/{id}/activate"
      - "GET endpoints"
  - name: FieldCrew
    description: "Field operations: executes shutoffs and reconnects service"
    identity: "opaque"
    exclusive_operations:
      - "POST /assistance/shutoff-orders/{id}/execute"
      - "POST /assistance/accounts/{id}/reconnect"
    shared_operations:
      - "GET /assistance/accounts*, GET /assistance/shutoff-orders*"
