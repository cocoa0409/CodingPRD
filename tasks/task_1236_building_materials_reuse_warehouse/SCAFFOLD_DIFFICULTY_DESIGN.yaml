          trigger:
            - call: "POST /reuse/pickup-appointments"
              payload: { subject_type: "DONATION_OFFER", subject_id: "${o1}", vehicle_id: "${veh_id}", window_start: "2026-06-16T09:00:00Z", window_end: "2026-06-16T10:00:00Z" }
              as: IntakeStaff
              captures: { appt1: $.data.id, fee1: $.data.fee_cents }
            - call: "POST /reuse/pickup-appointments"
              payload: { subject_type: "DONATION_OFFER", subject_id: "${o2}", vehicle_id: "${veh_id}", window_start: "2026-06-16T10:00:00Z", window_end: "2026-06-16T11:00:00Z" }
              as: IntakeStaff
              captures: { err: $.data.error_id }
            - call: "POST /reuse/pickup-appointments"
              payload: { subject_type: "DONATION_OFFER", subject_id: "${o3}", vehicle_id: "${veh_id}", window_start: "2026-06-16T11:00:00Z", window_end: "2026-06-16T12:00:00Z" }
              as: IntakeStaff
              captures: { appt3: $.data.id }
          assert:
            - "Appointment 09:00-10:00 BOOKED (fee 5000, tier NONE)"
            - "Appointment 10:00-11:00 REJECTED with 409 ERR_VEHICLE_TIME_OVERLAP — gap 0 < 60-minute buffer (touching is NOT legal here, unlike the crew rule)"
            - "Appointment 11:00-12:00 ACCEPTED — gap exactly == 60 minutes satisfies s >= e + buffer"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (3 instances, 3 different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: zone_occupancy_finalize_void_invariant
        grounds:
          - calculations.zone_occupancy
          - state_machines.Sale.OPEN_to_FINALIZED
          - state_machines.Sale.FINALIZED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = StoreZone.current_count (integer occupancy): the forward
          action (finalize, item SOLD, count -1) paired with its compensation (void, item
          re-on-floor, count +1) leaves the count exactly at its pre-sale value.
        test_recipe:
          setup:
            - "Zone ZV capacity 10 threshold 0; item priced 5000 placed (count 1); walk-in sale reserves it"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "VANITIES", display_name: "Vanities", pricing_model: "PER_UNIT", base_rate_cents: 5000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "ZV", display_name: "Zone V", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "vanity", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 60 }
              as: IntakeStaff
              captures: { item_id: $.data.id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 5000 }
              as: StoreManager
            - call: "POST /reuse/items/${item_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "WALK_IN" }
              as: Cashier
              captures: { sale_id: $.data.id }
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${item_id}" }
              as: Cashier
          trigger:
            - call: "POST /reuse/sales/${sale_id}/finalize"
              payload: { payment_amount_cents: 5350 }
              as: Cashier
              captures: { s_total: $.data.total_cents }
            - call: "GET /reuse/store-zones/${zone_id}"
              as: StoreManager
              captures: { z_after_sale: $.data.current_count, z_restock_sale: $.data.restock_recommended }
            - call: "POST /reuse/sales/${sale_id}/void"
              payload: { void_reason: "return" }
              as: StoreManager
            - call: "GET /reuse/store-zones/${zone_id}"
              as: StoreManager
              captures: { z_after_void: $.data.current_count, z_restock_void: $.data.restock_recommended }
            - call: "GET /reuse/items/${item_id}"
              as: StoreManager
              captures: { i_ss: $.data.sales_status, i_zone: $.data.zone_id }
          assert:
            - "After finalize: zone.current_count == 0 and restock_recommended == true (0 <= 0)"
            - "After void: zone.current_count == 1 — exactly the pre-sale value (finalize+void conserves occupancy)"
            - "Item restored: sales_status == ON_FLOOR with zone_id == ${zone_id}; restock_recommended == false"

      - name: account_balance_finalize_void_invariant
        grounds:
          - calculations.trailing_volume_cents
          - state_machines.Sale.FINALIZED_to_VOIDED
          - entities.ContractorAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = ContractorAccount.outstanding_balance_cents (money):
          finalize (+53500) followed by void (-53500) returns outstanding AND trailing
          volume to exactly zero — no drift from the compensation chain.
        test_recipe:
          setup:
            - "Account I ACTIVE, credit_limit 100000000; item priced 50000 placed; contractor sale with one line"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "PIPES", display_name: "Pipes", pricing_model: "PER_UNIT", base_rate_cents: 50000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor I", contact_email: "i@x.com", credit_limit_cents: 100000000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
            - call: "POST /reuse/store-zones"
              payload: { code: "ZI", display_name: "Zone I", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "pipe bundle", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 40 }
              as: IntakeStaff
              captures: { item_id: $.data.id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 50000 }
              as: StoreManager
            - call: "POST /reuse/items/${item_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { sale_id: $.data.id }
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${item_id}" }
              as: Cashier
          trigger:
            - call: "POST /reuse/sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s_total: $.data.total_cents }
            - call: "GET /reuse/contractor-accounts/${acct_id}"
              as: WarehouseAdmin
              captures: { a_out_after: $.data.outstanding_balance_cents, a_trail_after: $.data.trailing_volume_cents }
            - call: "POST /reuse/sales/${sale_id}/void"
              payload: { void_reason: "order error" }
              as: WarehouseAdmin
            - call: "GET /reuse/contractor-accounts/${acct_id}"
              as: WarehouseAdmin
              captures: { a_out_final: $.data.outstanding_balance_cents, a_trail_final: $.data.trailing_volume_cents, a_tier: $.data.discount_tier }
          assert:
            - "Sale.${sale_id}.total_cents == 53500 (= 50000 + round(50000*0.07))"
            - "After finalize: outstanding_balance_cents == 53500, trailing_volume_cents == 53500"
            - "After void: outstanding_balance_cents == 0 and trailing_volume_cents == 0 (exact conservation), discount_tier back to STANDARD"

      - name: certified_tonnage_quarantine_cycle_invariant
        grounds:
          - state_machines.SalvageBatch.WEIGHED_to_QUARANTINED
          - state_machines.SalvageBatch.QUARANTINED_to_WEIGHED
          - calculations.job_tonnage_estimates
        distinguishing_aspect: |
          Conserved quantity = job.certified_diverted_weight_lbs (weight): weigh credits
          +450, quarantine debits -450, resolve-REMEDIATED re-credits +450 — the cycle
          leaves the certified total exactly at its post-weigh value.
        test_recipe:
          setup:
            - "Job J9 cleared, scheduled, started; batch B9 manifested (estimate 500) in divertible category"
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Nine", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead Nine", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-11", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job I", site_address_text: "6 Poplar", quoted_fee_cents: 70000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-18T08:00:00Z", scheduled_end: "2026-06-18T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-18T08:00:00Z", end_at: "2026-06-18T12:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/start"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/categories"
              payload: { code: "BEAMS", display_name: "Beams", pricing_model: "PER_LINEAR_FT", base_rate_cents: 400, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/salvage-batches"
              payload: { job_id: "${job_id}", category_id: "${cat_id}", estimated_weight_lbs: 500 }
              as: CrewCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /reuse/salvage-batches/${batch_id}/weigh"
              payload: { scale_weight_lbs: 480, contamination_weight_lbs: 30 }
              as: CrewCoordinator
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { cert_after_weigh: $.data.certified_diverted_weight_lbs }
            - call: "POST /reuse/salvage-batches/${batch_id}/quarantine"
              payload: { notes: "suspect mastic" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { cert_after_quar: $.data.certified_diverted_weight_lbs }
            - call: "POST /reuse/salvage-batches/${batch_id}/resolve-quarantine"
              payload: { outcome: "REMEDIATED" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { cert_after_resolve: $.data.certified_diverted_weight_lbs }
            - call: "GET /reuse/salvage-batches/${batch_id}"
              as: CrewCoordinator
              captures: { b_status: $.data.status, b_div: $.data.diverted_weight_lbs }
          assert:
            - "After weigh: certified == 450"
            - "After quarantine: certified == 0 (compensation debit)"
            - "After REMEDIATED resolve: certified == 450 — exactly the post-weigh value (cycle conserves tonnage)"
            - "Batch.${batch_id} back to WEIGHED with diverted_weight_lbs == 450"
