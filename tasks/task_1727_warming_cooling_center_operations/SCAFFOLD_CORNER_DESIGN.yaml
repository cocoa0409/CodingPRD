  - section: endpoints
    instances:
      - name: list_pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination envelope interacts with limit/offset: 3 staff with limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["Three staff members exist"]
          setup_api_calls:
            - { call: "POST /api/staff-members", payload: { full_name: "A One", skills: ["SITE_LEAD"] }, as: EOCManager }
            - { call: "POST /api/staff-members", payload: { full_name: "B Two", skills: ["INTAKE"] }, as: EOCManager }
            - { call: "POST /api/staff-members", payload: { full_name: "C Three", skills: ["MEDICAL"] }, as: EOCManager }
          trigger:
            - call: "GET /api/staff-members?limit=2"
              as: EOCManager
            - call: "GET /api/staff-members?limit=2&offset=2"
              as: EOCManager
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: 1 item, total_count == 3, has_more == false"
      - name: response_envelope_shape_on_success_and_error
        claim_type: envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type and data; error responses carry response_type == 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["One episode exists"]
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
          trigger:
            - call: "GET /api/episodes/${ep}"
              as: EOCManager
            - call: "GET /api/episodes/00000000-0000-0000-0000-000000000000"
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "Success: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data holds the Episode"
            - "Error: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"
  - section: errors
    instances:
      - name: body_fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence covers body-referenced FKs, not just path ids: site-activation creation with a non-existent site_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["One episode in STANDBY"]
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
