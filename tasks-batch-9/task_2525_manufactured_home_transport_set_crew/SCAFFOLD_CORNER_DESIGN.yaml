  # ===========================================================================
  - section: endpoints
    instances:
      - name: section_crud_round_trip_create_read_amend_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /installations/sections]
          - endpoints[GET /installations/sections/{id}]
          - endpoints[PATCH /installations/sections/{id}]
          - endpoints[GET /installations/sections]
        distinguishing_aspect: |
          The section resource exposes create, read, partial update and list but no
          delete: PATCH with only declared_width_in supplied leaves
          declared_height_in and declared_length_in byte-identical, bumps
          HomeSection.version from 1 to 2, and the list filtered by order_id shows
          the amended row exactly once with total_count 1 and has_more false.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant and a single-section AZ order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "GET /installations/sections/${sec_id}"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "PATCH /installations/sections/${sec_id}"
              payload: { declared_width_in: 176 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "GET /installations/sections?order_id=${order_id}"
              payload: {}
              as: NetworkAdmin
          assert:
            - "trigger step 1 returns HTTP 201 with data.transit_status == AT_PLANT and data.version == 1"
            - "trigger step 2 returns HTTP 200 with data.declared_width_in == 168 and data.measured_width_in == null"
            - "trigger step 3 returns HTTP 200 with data.declared_width_in == 176"
            - "after trigger step 3: HomeSection.${sec_id}.declared_height_in == 150 and declared_length_in == 720 and declared_weight_lb == 22000"
            - "after trigger step 3: HomeSection.${sec_id}.version == 2"
            - "after trigger step 3: HomeSection.${sec_id}.transit_status == AT_PLANT"
            - "trigger step 4 returns total_count == 1, has_more == false and data[0].declared_width_in == 176"
            - "no DELETE /installations/sections/{id} endpoint is declared in §1.5"

      - name: site_readiness_inspection_recomputes_status_and_round
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /installations/sites/{id}/readiness-inspection]
          - calculations.site_readiness_evaluation
          - entities.Site.fields.inspection_round
          - entities.Site.fields.last_inspector_user_id
        distinguishing_aspect: |
          A two-section order needs MIN_PIERS_PER_SECTION x 2 = 12 piers, but the pad
          was poured with 11, so the pier arm is a stored-fact defect the inspector
          cannot sign away: a first inspection failing all three verdicts yields
          blocking_defect_count 3, and a second inspection passing all three still
          yields 1 because 11 < 12. Each call increments inspection_round (1 then 2)
          and overwrites last_inspector_user_id, and readiness_status stays
          READINESS_FAILED throughout.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant and a two-section AZ order"
            - "a Site for that order with pier_count 11 and all three utility stub-outs present"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 3260", section_count: 2, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sites"
              payload: { order_id: "${order_id}", pad_type: "PIER_AND_BEAM", pier_plan_ref: "PP-3260-A", pier_count: 11, utility_water: true, utility_sewer: true, utility_electric: true }
              as: NetworkAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /installations/sites/${site_id}/readiness-inspection"
              payload: { pad_pass: false, pier_plan_pass: false, utility_pass: false }
              as: InstallationInspector
              as_user_id: "insp-site-1"
            - call: "POST /installations/sites/${site_id}/readiness-inspection"
              payload: { pad_pass: true, pier_plan_pass: true, utility_pass: true }
              as: InstallationInspector
              as_user_id: "insp-site-2"
          assert:
            - "before trigger: Site.${site_id}.readiness_status == READINESS_PENDING"
            - "before trigger: Site.${site_id}.inspection_round == 0"
            - "before trigger: Site.${site_id}.blocking_defect_count == null"
            - "after trigger step 1: Site.${site_id}.blocking_defect_count == 3"
            - "after trigger step 1: Site.${site_id}.readiness_status == READINESS_FAILED"
            - "after trigger step 1: Site.${site_id}.inspection_round == 1"
            - "after trigger step 1: Site.${site_id}.last_inspector_user_id == insp-site-1"
            - "after trigger step 2: Site.${site_id}.blocking_defect_count == 1"
            - "after trigger step 2: Site.${site_id}.readiness_status == READINESS_FAILED"
            - "after trigger step 2: Site.${site_id}.inspection_round == 2"
