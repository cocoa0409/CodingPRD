            - "The application still reads work_sample_count == 2 and status \"DRAFT\" after the refusals"
            - "The owner's submit returns 200 with status \"SUBMITTED\" and sealed_alias \"LIT-2027-0001\""

      - name: the_approving_board_member_may_not_release_the_payment
        claim_type: segregation_of_duties
