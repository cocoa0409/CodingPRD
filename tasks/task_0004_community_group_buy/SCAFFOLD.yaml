# =============================================================================
# Community Group-Buying Platform — Benchmark Seed Tables (v1)
# =============================================================================

scenario: |
  Community group-buying platform: multi-tier group leader hierarchy with cross-community team-up campaigns;
  tiered limited-stock flash purchase with anti-oversell inventory locking and fairness-weighted allocation;
  group-buy order aggregation with progressive discount thresholds, auto-refund on group failure, and cross-group item bundling;
  supplier multi-warehouse split shipment with cold-chain routing and ETA prediction;
  pickup point sorting with multi-package consolidation, mis-pick reconciliation, and capacity-based load balancing;
  multi-stage after-sales workflow (refund-only / return-and-refund / partial compensation) with evidence review and dispute arbitration;
  multi-level commission settlement with tiered rebates, clawback on refunds, tax withholding, and T+N payout scheduling;
  event-driven synchronization with payment, logistics, IM, and supplier ERP systems;
  risk control engine for bot-order detection, fake group-buy prevention, and leader-supplier collusion auditing.

domain_name: community-group-buy
api_prefix: /communities

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
    - bulk_operations
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential        # GroupLeader.parent_leader_id
    - cross_aggregate         # Shipment cross-references Warehouse from a different supplier subtree

  role_model: peer_roles
  consistency_model: saga

  difficulty_target: expert
  entity_count: 12
  endpoint_count: 31
  error_count: 26
  state_machine_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: name, type: string, source: input, description: "Community name (unique)" }
      - { name: region_code, type: string, source: input, description: "Geographic region code (e.g. CN-SH-01)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN", default: ACTIVE, constraints: "enum {ACTIVE, FROZEN}" }
      - { name: timezone_offset_minutes, type: integer, source: input, description: "Minutes from UTC; informational" }

  - name: GroupLeader
    parent: Community
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: community_id, type: string, source: system, description: "Owning Community.id" }
      - { name: parent_leader_id, type: string, source: input, description: "Self-reference: id of an upstream leader, or null for tier-1", default: null }
      - { name: tier, type: integer, source: computed, description: "1 = top-tier (no parent); each child is parent.tier + 1; max tier = 3" }
      - { name: display_name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACTIVE | SUSPENDED | DEACTIVATED", default: PENDING_REVIEW, constraints: "enum {PENDING_REVIEW, ACTIVE, SUSPENDED, DEACTIVATED}" }
      - { name: chronic_risk_score, type: number, source: computed, description: "30-period rolling chronic risk; range [0,100]" }
      - { name: acute_risk_score, type: number, source: computed, description: "5-period acute risk; range [0,100]" }
      - { name: collusion_audit_count, type: integer, source: computed, description: "Number of CONFIRMED leader_supplier_collusion alerts to date" }
      - { name: lifetime_settled_orders, type: integer, source: computed, description: "Count of Orders with payment_status SETTLED+ that were not later refunded" }
      - { name: created_period_index, type: integer, source: system, description: "system_period_index when leader was created" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: community_id, type: string, source: input, description: "Home Community.id" }
      - { name: display_name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RISK_HOLD | BLOCKED", default: ACTIVE, constraints: "enum {ACTIVE, RISK_HOLD, BLOCKED}" }
      - { name: lifetime_completed_orders, type: integer, source: computed, description: "Number of Orders with fulfillment_status = COMPLETED, never refunded" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: name, type: string, source: input, description: "Supplier name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: Warehouse
    parent: Supplier
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: supplier_id, type: string, source: system, description: "Owning Supplier.id" }
      - { name: name, type: string, source: input, description: "Warehouse name" }
      - { name: region_code, type: string, source: input, description: "Geographic region; matched against Community.region_code for distance" }
      - { name: cold_chain_capable, type: boolean, source: input, description: "True if warehouse supports cold-chain SKUs", default: false }
      - { name: handling_periods, type: integer, source: input, description: "Periods between dispatch and delivery for non-cold SKUs", default: 1, constraints: "integer >= 1" }
      - { name: cold_handling_periods, type: integer, source: input, description: "Periods between dispatch and delivery for cold-chain SKUs (must be <= handling_periods to satisfy spoilage cap)", default: 1, constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED", default: ACTIVE, constraints: "enum {ACTIVE, DISABLED}" }

  - name: FlashCampaign
    parent: Supplier
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: supplier_id, type: string, source: system, description: "Owning Supplier.id" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit identifier" }
      - { name: cold_chain_required, type: boolean, source: input, description: "True if SKU must travel via cold_chain_capable warehouses only", default: false }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit listing price (integer cents)", constraints: "integer > 0" }
      - { name: tier_caps, type: array, source: input, description: "Ordered list of integer per-customer caps per tier window, e.g. [{tier:1, max_units:1}, {tier:2, max_units:3}, {tier:3, max_units:10}]; tier index >= participant_seq // CUSTOMERS_PER_TIER (constants) determines tier" }
      - { name: total_stock, type: integer, source: input, description: "Total inventory units available for this campaign", constraints: "integer > 0" }
      - { name: locked_units, type: integer, source: computed, description: "Units currently held in PENDING flash-purchase reservations" }
      - { name: allocated_units, type: integer, source: computed, description: "Units finalized (paid) from this campaign" }
      - { name: remaining_units, type: integer, source: computed, description: "total_stock - locked_units - allocated_units" }
      - { name: opens_at_period, type: integer, source: input, description: "system_period_index when campaign opens" }
      - { name: closes_at_period, type: integer, source: input, description: "system_period_index when campaign closes (exclusive)" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | OPEN | CLOSED | EXHAUSTED", constraints: "enum {SCHEDULED, OPEN, CLOSED, EXHAUSTED}" }

  - name: GroupBuyCampaign
    parent: GroupLeader
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: leader_id, type: string, source: system, description: "Owning GroupLeader.id" }
      - { name: community_id, type: string, source: system, description: "Snapshot of leader.community_id at creation" }
      - { name: cross_community_partner_leader_ids, type: array, source: input, description: "Other leader ids from different communities (max 4) participating in cross-community team-up; each must be ACTIVE and tier <= 2", default: [] }
      - { name: supplier_id, type: string, source: input, description: "Supplier providing the campaign SKU; required at creation for warehouse-selection on plan-shipments" }
      - { name: sku, type: string, source: input, description: "SKU offered" }
      - { name: cold_chain_required, type: boolean, source: input, description: "If true, all shipments for orders in this campaign must use cold_chain_capable warehouses (validated at plan-shipments)" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit (integer cents)", constraints: "integer > 0" }
      - { name: discount_tiers, type: array, source: input, description: "Ordered ascending by min_participants: list of {min_participants:int, discount_basis_points:int}; the highest-min tier whose min_participants <= participant_count is selected" }
      - { name: opens_at_period, type: integer, source: input, description: "system_period_index when campaign opens" }
      - { name: deadline_period, type: integer, source: input, description: "system_period_index at which campaign auto-closes (exclusive)" }
      - { name: participant_count, type: integer, source: computed, description: "Number of Orders in payment_status PAID for this campaign at the time of evaluation" }
      - { name: settled_tier_index, type: integer, source: computed, description: "Tier index selected at close (0-based); null until close" }
      - { name: settled_discount_basis_points, type: integer, source: computed, description: "Discount applied to all member orders at close; null until close" }
      - { name: status, type: enum, source: system, description: "FORMING | EXTENDED | SUCCEEDED | FAILED | CLOSED", default: FORMING, constraints: "enum {FORMING, EXTENDED, SUCCEEDED, FAILED, CLOSED}" }
      - { name: extension_count, type: integer, source: computed, description: "Number of times this campaign has used FORMING -> EXTENDED -> FORMING; max 1" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: campaign_kind, type: enum, source: system, description: "GROUP_BUY | FLASH — discriminator for the polymorphic campaign reference", constraints: "enum {GROUP_BUY, FLASH}" }
      - { name: campaign_id, type: string, source: system, description: "Polymorphic: GroupBuyCampaign.id when campaign_kind=GROUP_BUY; FlashCampaign.id when campaign_kind=FLASH" }
      - { name: flash_granted_units, type: integer, source: system, description: "Granted units when campaign_kind=FLASH; null otherwise. Used by inventory conservation (rule_id=compensating_invariant.flash_inventory_conservation).", default: null }
      - { name: customer_id, type: string, source: input, description: "Buyer Customer.id" }
      - { name: line_items, type: array, source: input, description: "Array of {sku:string, unit_price_cents:int, quantity:int}; primary line is the campaign sku, additional lines may include cross-group bundling SKUs from other SUCCEEDED campaigns owned by the same leader subtree", constraints: "non-empty; at most 5 lines" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line.unit_price_cents * line.quantity across all lines (computed at order creation, never re-derived)" }
      - { name: provisional_discount_basis_points, type: integer, source: computed, description: "Discount tier hit by participant_count at the moment this order was placed (forward-looking)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional final amount under provisional_discount_basis_points (see calculations.order_total)" }
      - { name: settled_total_cents, type: integer, source: computed, description: "Final amount after campaign close: subtotal_cents - settled_discount_amount_cents (or 0 if FAILED -> auto-refund)" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Sum of refunds and partial compensations actually disbursed", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "PENDING_PAY | PAID | SETTLED | REFUND_PENDING | REFUNDED | PARTIALLY_REFUNDED", default: PENDING_PAY, constraints: "enum {PENDING_PAY, PAID, SETTLED, REFUND_PENDING, REFUNDED, PARTIALLY_REFUNDED}" }
      - { name: fulfillment_status, type: enum, source: system, description: "NOT_PLANNED | PLANNED | DISPATCHED | AT_PICKUP | PICKED_UP | COMPLETED | CANCELLED", default: NOT_PLANNED, constraints: "enum {NOT_PLANNED, PLANNED, DISPATCHED, AT_PICKUP, PICKED_UP, COMPLETED, CANCELLED}" }
      - { name: created_period_index, type: integer, source: system, description: "system_period_index at order creation" }
      - { name: paid_period_index, type: integer, source: system, description: "system_period_index at PAID transition" }
      - { name: created_seq, type: integer, source: system, description: "Global monotonic sequence; used for fairness ordering inside a campaign" }

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: order_id, type: string, source: system, description: "Parent Order.id" }
      - { name: warehouse_id, type: string, source: system, description: "Selected Warehouse.id (server-chosen via selector policy)" }
      - { name: pickup_point_id, type: string, source: input, description: "Destination PickupPoint.id" }
      - { name: line_units, type: array, source: input, description: "Subset of order line items shipped here: list of {sku, quantity}" }
      - { name: cold_chain_segment, type: boolean, source: computed, description: "True if any line in this shipment is a cold_chain_required SKU" }
      - { name: dispatched_period_index, type: integer, source: system, description: "system_period_index at DISPATCHED" }
      - { name: predicted_eta_period_index, type: integer, source: computed, description: "See calculations.shipment_eta" }
      - { name: actual_delivered_period_index, type: integer, source: system, description: "system_period_index at DELIVERED" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | AT_PICKUP | MIS_PICK | RECONCILED | DELIVERED | CANCELLED", default: PLANNED, constraints: "enum {PLANNED, DISPATCHED, AT_PICKUP, MIS_PICK, RECONCILED, DELIVERED, CANCELLED}" }

  - name: PickupPoint
    parent: Community
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: community_id, type: string, source: system, description: "Owning Community.id" }
      - { name: name, type: string, source: input, description: "Pickup point name" }
      - { name: capacity_packages, type: integer, source: input, description: "Maximum simultaneous packages held at this point (sum of Shipments in {AT_PICKUP, MIS_PICK, RECONCILED}); strictly enforced inclusive (a request that would push held_count to capacity_packages + 1 is rejected, capacity_packages itself is allowed)", constraints: "integer >= 1" }
      - { name: cold_storage_capable, type: boolean, source: input, description: "Required true to accept cold_chain_segment shipments", default: false }
      - { name: held_package_count, type: integer, source: computed, description: "Count of shipments currently AT_PICKUP / MIS_PICK / RECONCILED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED", default: ACTIVE, constraints: "enum {ACTIVE, DISABLED}" }

  - name: ConsolidationBatch
    parent: PickupPoint
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: pickup_point_id, type: string, source: system, description: "Owning PickupPoint.id" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; same format as common_fields.created_at" }
      - { name: window_start_period, type: integer, source: input, description: "Inclusive start period of the batch consolidation window", constraints: "integer >= 0" }
      - { name: window_end_period, type: integer, source: input, description: "Inclusive end period of the batch consolidation window", constraints: "integer >= window_start_period" }
      - { name: shipment_ids, type: array, source: input, description: "Shipments consolidated in this batch (must all be currently AT_PICKUP at this PickupPoint)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN, constraints: "enum {OPEN, CLOSED}" }

  - name: AfterSalesCase
    parent: Order
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: order_id, type: string, source: system, description: "Parent Order.id" }
      - { name: case_type, type: enum, source: input, description: "REFUND_ONLY | RETURN_AND_REFUND | PARTIAL_COMPENSATION", constraints: "enum {REFUND_ONLY, RETURN_AND_REFUND, PARTIAL_COMPENSATION}" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Customer-requested compensation amount", constraints: "integer > 0; <= order.settled_total_cents - order.refunded_amount_cents" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | EVIDENCE_REQUESTED | ARBITRATION | RESOLVED_REFUND_ONLY | RESOLVED_RETURN_REFUND | RESOLVED_PARTIAL_COMPENSATION | REJECTED", default: FILED, constraints: "enum {FILED, UNDER_REVIEW, EVIDENCE_REQUESTED, ARBITRATION, RESOLVED_REFUND_ONLY, RESOLVED_RETURN_REFUND, RESOLVED_PARTIAL_COMPENSATION, REJECTED}" }
      - { name: evidence_round, type: integer, source: computed, description: "Number of times case has cycled UNDER_REVIEW -> EVIDENCE_REQUESTED -> UNDER_REVIEW; capped at 2", default: 0 }
      - { name: resolved_amount_cents, type: integer, source: computed, description: "Compensation actually disbursed on resolution; 0 if REJECTED" }
      - { name: filed_period_index, type: integer, source: system, description: "system_period_index when case was filed" }

  - name: CommissionEntry
    parent: GroupLeader
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: leader_id, type: string, source: system, description: "Beneficiary GroupLeader.id" }
      - { name: order_id, type: string, source: system, description: "Source Order.id" }
      - { name: leader_role, type: enum, source: system, description: "PRIMARY (campaign owner's leader) | SECONDARY (cross-community team-up partner) | UPSTREAM (parent_leader_id chain)", constraints: "enum {PRIMARY, SECONDARY, UPSTREAM}" }
      - { name: gross_rebate_cents, type: integer, source: computed, description: "Tiered rebate before tax withholding (calculations.tiered_rebate)" }
      - { name: tax_withholding_cents, type: integer, source: computed, description: "Tax withheld per-line then summed (calculations.tax_withholding)" }
      - { name: net_rebate_cents, type: integer, source: computed, description: "gross_rebate_cents - tax_withholding_cents" }
      - { name: payout_target_period_index, type: integer, source: computed, description: "Order.paid_period_index + payout_lag_periods (calculations.payout_t_plus_n)" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | PENDING_CLAWBACK | CLAWED_BACK", default: PENDING, constraints: "enum {PENDING, SETTLED, PENDING_CLAWBACK, CLAWED_BACK}" }
      - { name: payout_id, type: string, source: system, description: "Set when this entry is bundled into a Payout; null otherwise", default: null }

  - name: Payout
    parent: GroupLeader
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: leader_id, type: string, source: system, description: "Beneficiary GroupLeader.id" }
      - { name: target_period_index, type: integer, source: input, description: "system_period_index for which this payout is being assembled" }
      - { name: bundled_entry_ids, type: array, source: computed, description: "CommissionEntry ids included; populated at status SCHEDULED" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of net_rebate_cents over bundled entries" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | MATURED | RELEASED | CANCELLED", default: SCHEDULED, constraints: "enum {SCHEDULED, MATURED, RELEASED, CANCELLED}" }

  - name: RiskAlert
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: created_period_index, type: integer, source: system, description: "system_period_index at creation; used by risk-window aggregations" }
      - { name: alert_type, type: enum, source: input, description: "BOT_ORDER | FAKE_GROUP_BUY | LEADER_SUPPLIER_COLLUSION", constraints: "enum {BOT_ORDER, FAKE_GROUP_BUY, LEADER_SUPPLIER_COLLUSION}" }
      - { name: target_kind, type: enum, source: input, description: "CUSTOMER | GROUP_LEADER | SUPPLIER | ORDER", constraints: "enum {CUSTOMER, GROUP_LEADER, SUPPLIER, ORDER}; (alert_type, target_kind) must match: BOT_ORDER->CUSTOMER or ORDER, FAKE_GROUP_BUY->GROUP_LEADER, LEADER_SUPPLIER_COLLUSION->GROUP_LEADER (with supporting supplier_id)" }
      - { name: target_id, type: string, source: input, description: "id of the targeted entity (Customer, GroupLeader, Supplier, or Order)" }
      - { name: supporting_supplier_id, type: string, source: input, description: "Required when alert_type = LEADER_SUPPLIER_COLLUSION; references Supplier.id", default: null }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH", constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED", default: OPEN, constraints: "enum {OPEN, CONFIRMED, DISMISSED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: GroupLeader
    field: status
    initial_state: PENDING_REVIEW
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /group-leaders/{leaderId}/approve"
        actor: PlatformAdmin
        preconditions: ["Community.status = ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /group-leaders/{leaderId}/suspend OR system (RiskAlert confirmed with severity=HIGH targeting this leader)"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects:
          - "All FORMING and EXTENDED GroupBuyCampaigns owned by this leader (campaign.leader_id == leader.id) auto-close as FAILED (cascade rule_id=transitive_cascade.group_failure_to_shipment_cancel_chain)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /group-leaders/{leaderId}/reinstate"
        actor: PlatformAdmin
        preconditions: ["No OPEN RiskAlerts of severity HIGH targeting this leader"]
        side_effects: []
      - from: [PENDING_REVIEW, ACTIVE, SUSPENDED]
        to: DEACTIVATED
        trigger: "POST /group-leaders/{leaderId}/deactivate"
        actor: PlatformAdmin
        preconditions: ["No FORMING or EXTENDED GroupBuyCampaigns owned by this leader"]
        side_effects: []

  - entity: GroupBuyCampaign
    field: status
    initial_state: FORMING
    terminal_states: [CLOSED]
    note: "Non-linear (cyclic + branching): FORMING -> EXTENDED -> FORMING is a cycle (extension); FORMING/EXTENDED branches into SUCCEEDED or FAILED at close, both later -> CLOSED."
    transitions:
      - from: FORMING
        to: EXTENDED
        trigger: "POST /group-buy-campaigns/{campaignId}/extend"
        actor: GroupLeader
        preconditions:
          - "GroupBuyCampaign.extension_count = 0"
          - "system_period_index < deadline_period"
          - "participant_count >= ceil(0.6 * highest tier min_participants in discount_tiers)"
        side_effects:
          - "deadline_period += EXTENSION_PERIODS (constants.EXTENSION_PERIODS = 2)"
          - "extension_count += 1"
      - from: EXTENDED
        to: FORMING
        trigger: "system (idempotent, on the same period the extension is processed); recorded as a single transition for state-machine auditing"
        actor: system
        preconditions: []
        side_effects: []
      - from: [FORMING, EXTENDED]
        to: SUCCEEDED
        trigger: "POST /group-buy-campaigns/{campaignId}/close OR system (system_period_index >= deadline_period AND participant_count meets the lowest tier min_participants)"
        actor: "GroupLeader or system"
        preconditions:
          - "participant_count >= discount_tiers[0].min_participants"
        side_effects:
          - "settled_tier_index, settled_discount_basis_points pinned per calculations.discount_tier_selection"
          - "Each child Order with payment_status=PAID has Order.payment_status -> SETTLED; Order.settled_total_cents pinned per calculations.order_total (final variant)"
          - "CommissionEntry rows generated for PRIMARY/SECONDARY/UPSTREAM beneficiaries per calculations.tiered_rebate and calculations.tax_withholding"
      - from: [FORMING, EXTENDED]
        to: FAILED
        trigger: "POST /group-buy-campaigns/{campaignId}/close OR system (system_period_index >= deadline_period AND participant_count below the lowest tier min_participants)"
        actor: "GroupLeader or system"
        preconditions:
          - "participant_count < discount_tiers[0].min_participants"
        side_effects:
          - "Each child Order: payment_status (PAID -> REFUND_PENDING -> REFUNDED) auto-cascade; refunded_amount_cents += subtotal_cents (full refund of subtotal); fulfillment_status remains NOT_PLANNED -> CANCELLED"
          - "Any Shipments in PLANNED for these orders -> CANCELLED"
          - "CommissionEntry generation suppressed (no rebates on FAILED)"
      - from: [SUCCEEDED, FAILED]
        to: CLOSED
        trigger: "POST /group-buy-campaigns/{campaignId}/finalize"
        actor: "GroupLeader or system"
        preconditions: ["All child Orders are in a terminal payment_status AND fulfillment_status pair"]
        side_effects: []

  - entity: Order
    field: payment_status
    initial_state: PENDING_PAY
    terminal_states: [REFUNDED]
    note: "Order has TWO PARALLEL state dimensions on the same row: payment_status (this machine) and fulfillment_status (next machine). They evolve independently. (rule_id=non_linear_state_machine.order_parallel_payment_fulfillment.)"
    transitions:
      - from: PENDING_PAY
        to: PAID
        trigger: "POST /orders/{orderId}/pay"
        actor: Customer
        preconditions:
          - "GroupBuyCampaign.status IN {FORMING, EXTENDED}"
          - "system_period_index < GroupBuyCampaign.deadline_period"
          - "Customer.status = ACTIVE"
        side_effects:
          - "Order.paid_period_index = system_period_index"
          - "GroupBuyCampaign.participant_count recomputed"
          - "Order.provisional_discount_basis_points and Order.provisional_total_cents pinned per calculations.order_total (provisional variant)"
      - from: PAID
        to: SETTLED
        trigger: "system (parent GroupBuyCampaign -> SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Order.settled_total_cents pinned per calculations.order_total (final variant)"
      - from: [PENDING_PAY, PAID, SETTLED]
        to: REFUND_PENDING
        trigger: "system (campaign -> FAILED) OR system (AfterSalesCase resolves with refund and case_type IN {REFUND_ONLY, RETURN_AND_REFUND}) OR POST /orders/{orderId}/cancel (FLASH orders only)"
        actor: "system or Customer"
        preconditions: []
        side_effects: []
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "system (refund disbursement complete)"
        actor: system
        preconditions: []
        side_effects:
          - "Order.refunded_amount_cents updated"
          - "Each CommissionEntry derived from this order: PENDING -> PENDING_CLAWBACK (cascade)"
      - from: SETTLED
        to: PARTIALLY_REFUNDED
        trigger: "system (AfterSalesCase resolves with case_type=PARTIAL_COMPENSATION)"
        actor: system
        preconditions: []
        side_effects:
          - "Order.refunded_amount_cents += AfterSalesCase.resolved_amount_cents"
          - "CommissionEntry rows for this order: gross_rebate proportionally reduced; status remains PENDING/SETTLED but recomputed (no clawback unless full refund)"

  - entity: Order
    field: fulfillment_status
    initial_state: NOT_PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Parallel dimension to payment_status."
    transitions:
      - from: NOT_PLANNED
        to: PLANNED
        trigger: "POST /orders/{orderId}/plan-shipments"
        actor: Supplier
        preconditions:
          - "Order.payment_status IN {SETTLED}"
          - "GroupBuyCampaign.status = SUCCEEDED  (rule_id=cross_entity_state_dependency.order_fulfillment_requires_campaign_succeeded)"
        side_effects:
          - "One or more Shipment rows created (status=PLANNED)"
      - from: PLANNED
        to: DISPATCHED
        trigger: "system (all child Shipments -> DISPATCHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: AT_PICKUP
        trigger: "system (all child Shipments -> AT_PICKUP)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_PICKUP
        to: PICKED_UP
        trigger: "POST /orders/{orderId}/pickup-confirm"
        actor: Customer
        preconditions: ["All child Shipments status IN {AT_PICKUP, RECONCILED}"]
        side_effects: ["All child Shipments -> DELIVERED"]
      - from: PICKED_UP
        to: COMPLETED
        trigger: "system (no AfterSalesCase opened within AFTER_SALES_WINDOW_PERIODS = 7 of PICKED_UP)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.lifetime_completed_orders += 1"
          - "Each PENDING CommissionEntry for this order remains eligible for SETTLED transition at payout assembly"
      - from: [NOT_PLANNED, PLANNED, DISPATCHED]
        to: CANCELLED
        trigger: "system (parent GroupBuyCampaign -> FAILED) OR system (Order.payment_status -> REFUNDED via after-sales) OR POST /orders/{orderId}/cancel (FLASH orders only; rejected for GROUP_BUY orders)"
        actor: "system or Customer"
        preconditions: []
        side_effects:
          - "Any non-terminal Shipments -> CANCELLED"

  - entity: Shipment
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Non-linear with mis-pick reconciliation loop: AT_PICKUP -> MIS_PICK -> RECONCILED -> AT_PICKUP-equivalent."
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /shipments/{shipmentId}/dispatch"
        actor: Supplier
        preconditions: []
        side_effects:
          - "Shipment.dispatched_period_index = system_period_index"
          - "Shipment.predicted_eta_period_index pinned per calculations.shipment_eta"
      - from: DISPATCHED
        to: AT_PICKUP
        trigger: "POST /shipments/{shipmentId}/arrive-at-pickup"
        actor: Supplier
        preconditions:
          - "PickupPoint.held_package_count + 1 <= PickupPoint.capacity_packages  (rule_id=boundary_precision_check.pickup_point_capacity_inclusive_full_rejects)"
          - "Shipment.cold_chain_segment = false OR PickupPoint.cold_storage_capable = true"
        side_effects: ["PickupPoint.held_package_count += 1"]
      - from: AT_PICKUP
        to: MIS_PICK
        trigger: "POST /shipments/{shipmentId}/report-mispick"
        actor: PickupOperator
        preconditions: []
        side_effects: []
      - from: MIS_PICK
        to: RECONCILED
        trigger: "POST /shipments/{shipmentId}/reconcile"
        actor: PickupOperator
        preconditions: []
        side_effects: []
      - from: RECONCILED
        to: AT_PICKUP
        trigger: "system (idempotent)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_PICKUP
        to: DELIVERED
        trigger: "system (parent Order.fulfillment_status -> PICKED_UP)"
        actor: system
        preconditions: []
        side_effects: ["PickupPoint.held_package_count -= 1"]
      - from: [PLANNED, DISPATCHED]
        to: CANCELLED
        trigger: "system (parent Order.fulfillment_status -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AfterSalesCase
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_REFUND_ONLY, RESOLVED_RETURN_REFUND, RESOLVED_PARTIAL_COMPENSATION, REJECTED]
    note: "Non-linear cyclic: UNDER_REVIEW <-> EVIDENCE_REQUESTED loop, capped at 2 cycles."
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /after-sales/{caseId}/start-review"
        actor: CustomerService
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /after-sales/{caseId}/request-evidence"
        actor: CustomerService
        preconditions: ["evidence_round < 2"]
        side_effects: []
      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /after-sales/{caseId}/submit-evidence"
        actor: Customer
        preconditions: []
        side_effects: ["evidence_round += 1"]
      - from: UNDER_REVIEW
        to: ARBITRATION
        trigger: "POST /after-sales/{caseId}/escalate"
        actor: CustomerService
        preconditions: ["evidence_round >= 1"]
        side_effects: []
      - from: [UNDER_REVIEW, ARBITRATION]
        to: RESOLVED_REFUND_ONLY
        trigger: "POST /after-sales/{caseId}/resolve with outcome=REFUND_ONLY"
        actor: "CustomerService (UNDER_REVIEW); PlatformAdmin (ARBITRATION)"
        preconditions:
          - "AfterSalesCase.case_type = REFUND_ONLY"
        side_effects:
          - "resolved_amount_cents = AfterSalesCase.requested_amount_cents"
          - "Order.payment_status -> REFUND_PENDING (synchronous; the further REFUND_PENDING -> REFUNDED transition is driven by POST /_sweep/run-payouts)"
          - "Each PENDING CommissionEntry derived from this order: PENDING -> PENDING_CLAWBACK"
          - "Each Payout that bundled any of those entries has total_amount_cents recomputed (clawback-flagged entries excluded from total); bundled_entry_ids retained for audit"
      - from: [UNDER_REVIEW, ARBITRATION]
        to: RESOLVED_RETURN_REFUND
        trigger: "POST /after-sales/{caseId}/resolve with outcome=RETURN_REFUND"
        actor: "CustomerService (UNDER_REVIEW); PlatformAdmin (ARBITRATION)"
        preconditions:
          - "AfterSalesCase.case_type = RETURN_AND_REFUND"
          - "Order.fulfillment_status IN {PICKED_UP, COMPLETED}"
        side_effects:
          - "resolved_amount_cents = AfterSalesCase.requested_amount_cents"
          - "Order.payment_status -> REFUND_PENDING (further transition to REFUNDED driven by POST /_sweep/run-payouts)"
          - "Each PENDING CommissionEntry derived from this order: PENDING -> PENDING_CLAWBACK"
      - from: [UNDER_REVIEW, ARBITRATION]
        to: RESOLVED_PARTIAL_COMPENSATION
        trigger: "POST /after-sales/{caseId}/resolve with outcome=PARTIAL_COMPENSATION"
        actor: "CustomerService (UNDER_REVIEW); PlatformAdmin (ARBITRATION)"
        preconditions:
          - "AfterSalesCase.case_type = PARTIAL_COMPENSATION"
        side_effects:
          - "resolved_amount_cents = AfterSalesCase.requested_amount_cents"
          - "Order.payment_status -> PARTIALLY_REFUNDED"
          - "Order.refunded_amount_cents += resolved_amount_cents"
      - from: [UNDER_REVIEW, ARBITRATION]
        to: REJECTED
        trigger: "POST /after-sales/{caseId}/resolve with outcome=REJECT"
        actor: "CustomerService or PlatformAdmin"
        preconditions: []
        side_effects: ["resolved_amount_cents = 0"]

  - entity: CommissionEntry
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, CLAWED_BACK]
    note: "Branching with revert: PENDING -> PENDING_CLAWBACK can revert to PENDING if AfterSalesCase outcome reverses (rare)."
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system (Payout.status -> RELEASED bundles this entry)"
        actor: system
        preconditions: ["Payout containing this entry transitions to RELEASED"]
        side_effects: []
      - from: PENDING
        to: PENDING_CLAWBACK
        trigger: "system (Order.payment_status -> REFUND_PENDING for the source order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_CLAWBACK
        to: CLAWED_BACK
        trigger: "system (Order.payment_status -> REFUNDED finalized)"
        actor: system
        preconditions: []
        side_effects:
          - "Any Payout still in SCHEDULED that bundled this entry has total_amount_cents recomputed (entry's net_rebate excluded)"
          - "If the Payout has already been RELEASED, leader's outstanding clawback ledger is incremented (recovered_clawback_cents += entry.net_rebate_cents)"
      - from: PENDING_CLAWBACK
        to: PENDING
        trigger: "system (AfterSalesCase resolved without refund — i.e., REJECTED — and Order returns from REFUND_PENDING back to its prior state in a single resolve action)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Payout
    field: status
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MATURED
        trigger: "system (system_period_index >= Payout.target_period_index AND no PENDING_CLAWBACK CommissionEntry bundled in this payout) — produced by POST /_sweep/run-payouts"
        actor: system
        preconditions: ["No bundled CommissionEntry has status PENDING_CLAWBACK (rule_id=cross_entity_state_dependency.payout_release_requires_no_pending_clawbacks)"]
        side_effects: []
      - from: MATURED
        to: RELEASED
        trigger: "POST /payouts/{payoutId}/release"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Each bundled CommissionEntry: PENDING -> SETTLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /payouts/{payoutId}/cancel"
        actor: PlatformAdmin
        preconditions: ["status = SCHEDULED"]
        side_effects: ["bundled CommissionEntry rows return to unbundled (payout_id = null), eligible for the next payout cycle"]

  - entity: RiskAlert
    field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /risk-alerts/{alertId}/confirm"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "If alert_type = LEADER_SUPPLIER_COLLUSION OR severity = HIGH and target_kind = GROUP_LEADER: GroupLeader.status -> SUSPENDED"
          - "If alert_type = BOT_ORDER and target_kind = CUSTOMER: Customer.status -> RISK_HOLD"
          - "GroupLeader.collusion_audit_count += 1 (only when alert_type = LEADER_SUPPLIER_COLLUSION and target_kind = GROUP_LEADER)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /risk-alerts/{alertId}/dismiss"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two customers race to pay for orders in a flash-sale-backed campaign whose remaining stock is 1"
    guarantee: "At most one PAID transition succeeds; loser sees inventory exhaustion"
    error_id: ERR_FLASH_STOCK_DEPLETED
    http_status: 409
    serialization: "First-writer-wins on FlashCampaign.locked_units increment; loser cannot decrement remaining_units below 0"
  - scenario: "Customer pays while leader closes the same FORMING campaign"
    guarantee: "If close wins, the pay loses; if pay wins, the close still succeeds (campaign already advanced past the join window). Pay loser is rejected with state error."
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on GroupBuyCampaign.status (FORMING -> SUCCEEDED/FAILED)"
  - scenario: "Two suppliers attempt to dispatch the same Shipment simultaneously"
    guarantee: "Exactly one dispatch succeeds; the other observes status already DISPATCHED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Shipment.status"
  - scenario: "Two operators open ConsolidationBatches whose [window_start_period, window_end_period] intervals (plus a CONSOLIDATION_BUFFER_PERIODS = 1 buffer) overlap on the same PickupPoint"
    guarantee: "First-writer-wins on the pickup-point-scoped batch index; the second is rejected with overlap error"
    error_id: ERR_CONSOLIDATION_WINDOW_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (pickup_point_id, [window_start_period - 1, window_end_period + 1]) range registration"
  - scenario: "Two GroupBuyCampaigns attempt to open with overlapping [opens_at_period, deadline_period) intervals on the same (community_id, sku) pair"
    guarantee: "First-writer-wins; second campaign is rejected with overlap error"
    error_id: ERR_COMMUNITY_CAMPAIGN_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (community_id, sku) campaign-window registration; half-open interval semantics — adjacent windows (a.deadline_period == b.opens_at_period) are NOT considered overlapping"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: discount_tier_selection
    trigger: "Order pay (provisional pin); GroupBuyCampaign close (final pin)"
    algorithm: threshold
    formula: |
      Inputs:
        participant_count : integer
        discount_tiers    : list of {min_participants:int, discount_basis_points:int} ordered ascending by min_participants
      Output:
        (settled_tier_index, settled_discount_basis_points)
      Selection:
        candidates = [t for t in discount_tiers if t.min_participants <= participant_count]
        if candidates is empty:
          settled_tier_index = null
          settled_discount_basis_points = 0
        else:
          chosen = candidates[-1]                      # largest min_participants among the qualifying tiers
          settled_tier_index = index_of(chosen) in discount_tiers
          settled_discount_basis_points = chosen.discount_basis_points
      Boundary: tier qualification uses `min_participants <= participant_count` (inclusive).
    constants: {}
    precision: "Integer arithmetic"

  - name: order_total
    trigger: "Order pay (provisional variant); GroupBuyCampaign -> SUCCEEDED (final variant)"
    algorithm: dual_variant_pricing
    formula: |
      base = subtotal_cents
      discount_bp = (variant pin)
      discount_amount_cents = floor(base * discount_bp / 10000)
      total_cents = base - discount_amount_cents
      total_cents floor at 0
    variants:
      - name: provisional
        when: "Order.payment_status transitions PENDING_PAY -> PAID"
        difference: "discount_bp = discount_tier_selection(participant_count_at_pay_time, campaign.discount_tiers).settled_discount_basis_points"
      - name: final
        when: "GroupBuyCampaign closes SUCCEEDED"
        difference: "discount_bp = campaign.settled_discount_basis_points (pinned at close from final participant_count)"
    precision: "Integer cents; floor truncation on the discount_amount step"

  - name: tiered_rebate
    trigger: "GroupBuyCampaign -> SUCCEEDED (CommissionEntry generation per beneficiary)"
    algorithm: tiered_pricing
    formula: |
      Inputs:
        order_settled_total_cents
        leader_role        : enum {PRIMARY, SECONDARY, UPSTREAM}
        primary_tier       : leader.tier in {1,2,3}
        secondary_tier     : 0 if not cross-community, else leader.tier of the partner whose role is SECONDARY (1 or 2)
        upstream_depth     : 0 if PRIMARY, else N where N is the number of parent_leader_id hops from PRIMARY to this UPSTREAM leader (1 or 2; capped at 2)
      Constants:
        PRIMARY_RATE_BP_BY_TIER       = {1: 800, 2: 500, 3: 300}    # 8%, 5%, 3%
        SECONDARY_BONUS_RATE_BP_BY_TIER = {1: 200, 2: 100}            # 2%, 1% (only if cross_community_partner participates)
        UPSTREAM_RATE_BP_BY_DEPTH     = {1: 150, 2: 50}              # 1.5%, 0.5%
        REBATE_CAP_RATIO_BP           = 1500                          # rebate per beneficiary capped at 15% of order_settled_total_cents
      Procedure (3-input non-linear; rule_id=combinatorial_formula.tiered_rebate_3input_nonlinear):
        if leader_role == PRIMARY:
          base_rate_bp = PRIMARY_RATE_BP_BY_TIER[primary_tier]
          bonus_rate_bp = SECONDARY_BONUS_RATE_BP_BY_TIER.get(secondary_tier, 0)
          gross_rate_bp = base_rate_bp + bonus_rate_bp
        elif leader_role == SECONDARY:
          gross_rate_bp = SECONDARY_BONUS_RATE_BP_BY_TIER[secondary_tier]
        elif leader_role == UPSTREAM:
          gross_rate_bp = UPSTREAM_RATE_BP_BY_DEPTH[upstream_depth]
        capped_rate_bp = min(gross_rate_bp, REBATE_CAP_RATIO_BP)
        gross_rebate_cents = floor(order_settled_total_cents * capped_rate_bp / 10000)
    precision: "Integer cents; floor truncation"

  - name: tax_withholding
    trigger: "CommissionEntry generation (after tiered_rebate)"
    algorithm: per_line_round_then_sum
    formula: |
      Inputs:
        order_settled_total_cents
        line_items[]          : the originating Order's line_items (each {sku, unit_price_cents, quantity})
        gross_rebate_cents    : total gross rebate for this beneficiary
        line_item_count       : len(line_items)
      Constants:
        TAX_RATE_BP_PER_LINE  = 700  # 7% (round_half_up)
      Procedure (rule_id=combinatorial_formula.tax_withholding_round_per_line_then_sum; pin order: per-line round, then sum):
        # Distribute gross_rebate_cents across lines proportionally to (unit_price_cents * quantity), with floor allocation and remainder going to the LAST line.
        weights = [line.unit_price_cents * line.quantity for line in line_items]
        total_weight = sum(weights) (= order_subtotal_cents)
        per_line_gross = []
        running = 0
        for i in 0 .. line_item_count - 1:
          if i < line_item_count - 1:
            share = floor(gross_rebate_cents * weights[i] / total_weight)
            per_line_gross.append(share); running += share
          else:
            per_line_gross.append(gross_rebate_cents - running)
        # Per-line withholding: round_half_up
        per_line_withholding = [round_half_up(per_line_gross[i] * TAX_RATE_BP_PER_LINE / 10000) for i in 0 .. n-1]
        tax_withholding_cents = sum(per_line_withholding)              # SUM AFTER ROUND
        net_rebate_cents = gross_rebate_cents - tax_withholding_cents
      Note: the alternative (sum first, then round once) produces a different cents value when (gross_rebate_cents * 700 / 10000) leaves a fractional residue per line.
    precision: "Integer cents; round_half_up on each per-line withholding before summation"

  - name: payout_t_plus_n
    trigger: "CommissionEntry creation (sets payout_target_period_index)"
    algorithm: scheduled
    formula: |
      Inputs:
        order_paid_period_index : Order.paid_period_index
        primary_leader_tier     : leader.tier of the PRIMARY beneficiary on this commission's order
      Constants:
        PAYOUT_LAG_BY_TIER = {1: 3, 2: 5, 3: 7}    # T+3, T+5, T+7
      Procedure:
        N = PAYOUT_LAG_BY_TIER[primary_leader_tier]
        payout_target_period_index = order_paid_period_index + N
    precision: "Integer periods"

  - name: shipment_eta
    trigger: "Shipment dispatch"
    algorithm: forward_looking
    formula: |
      Inputs:
        dispatched_period_index
        warehouse.handling_periods, warehouse.cold_handling_periods
        cold_chain_segment   : boolean
      Procedure:
        if cold_chain_segment:
          predicted_eta_period_index = dispatched_period_index + warehouse.cold_handling_periods
        else:
          predicted_eta_period_index = dispatched_period_index + warehouse.handling_periods
    precision: "Integer periods"

  - name: warehouse_selector
    trigger: "Order plan-shipments (server picks one Warehouse per shipment line group)"
    algorithm: selector_policy
    formula: |
      Inputs (per shipment line group):
        order.community.region_code
        cold_chain_segment   : boolean
        candidate set        : Warehouse rows where warehouse.supplier_id is the supplier owning the SKU AND warehouse.status = ACTIVE
      Eligibility filter:
        if cold_chain_segment: candidates = candidates filtered by warehouse.cold_chain_capable = true
      Ranking expression (lower is better):
        rank_key = (region_match_rank, warehouse.created_period_index)
        where region_match_rank = 0 if warehouse.region_code == order.community.region_code else 1
      Tie-break: warehouse.created_period_index ascending; if still tied, warehouse.id lexicographic ascending.
      Empty-pool fallback: if candidates is empty, abort planning with ERR_NO_WAREHOUSE_AVAILABLE; if cold_chain_segment AND candidates was non-empty before the cold filter, the error is instead ERR_COLD_CHAIN_REQUIRED (because the network has warehouses but none cold-capable).
    precision: "Deterministic tie-break"

  - name: leader_chronic_risk_score
    trigger: "POST /_sweep/recompute-risk OR system (on RiskAlert confirm targeting this leader OR system_period_index advance)"
    algorithm: weighted_aggregation
    formula: |
      Inputs (window: last 30 system_period_index periods, inclusive of current — i.e. RiskAlert.created_period_index in [current - 29, current]):
        bot_order_count_30   : count of CONFIRMED RiskAlerts of type=BOT_ORDER with target_kind=ORDER, where the targeted Order's parent campaign.leader_id == this leader.id, with RiskAlert.created_period_index in the window
        fake_group_count_30  : count of GroupBuyCampaign rows owned by this leader that ended in FAILED with participant_count == 0, where the campaign's close period (system_period_index at the FAILED transition) is in the window
        confirmed_collusion_count_30 : count of CONFIRMED RiskAlerts of type LEADER_SUPPLIER_COLLUSION targeting this leader, with RiskAlert.created_period_index in the window
      Constants:
        CHRONIC_BOT_WEIGHT       = 0.30
        CHRONIC_FAKE_WEIGHT      = 0.40
        CHRONIC_COLLUSION_WEIGHT = 0.30
        CHRONIC_SCORE_CAP        = 100
      Procedure:
        bot_density   = bot_order_count_30 / 30
        fake_density  = fake_group_count_30 / 30
        collusion_density = confirmed_collusion_count_30 / 30
        raw = (CHRONIC_BOT_WEIGHT * bot_density
             + CHRONIC_FAKE_WEIGHT * fake_density
             + CHRONIC_COLLUSION_WEIGHT * collusion_density) * 100
        chronic_risk_score = round_half_up(min(raw, CHRONIC_SCORE_CAP), 2)
    precision: "Two decimal places, round_half_up"

  - name: leader_acute_risk_score
    trigger: "Same triggers as leader_chronic_risk_score (computed in the same sweep pass)"
    algorithm: weighted_aggregation
    formula: |
      Inputs (window: last 5 system_period_index periods, inclusive of current — i.e. created_period_index in [current - 4, current]):
        bot_order_count_5            : same definition as bot_order_count_30 but window narrowed to 5
        fake_group_count_5           : same definition as fake_group_count_30 but window narrowed to 5
        confirmed_collusion_count_5  : same definition as confirmed_collusion_count_30 but window narrowed to 5
      Constants:
        ACUTE_BOT_WEIGHT       = 0.50
        ACUTE_FAKE_WEIGHT      = 0.30
        ACUTE_COLLUSION_WEIGHT = 0.20
        ACUTE_MULTIPLIER       = 1.5
        ACUTE_SCORE_CAP        = 100
      Procedure:
        bot_density   = bot_order_count_5 / 5
        fake_density  = fake_group_count_5 / 5
        collusion_density = confirmed_collusion_count_5 / 5
        raw = (ACUTE_BOT_WEIGHT * bot_density
             + ACUTE_FAKE_WEIGHT * fake_density
             + ACUTE_COLLUSION_WEIGHT * collusion_density) * 100 * ACUTE_MULTIPLIER
        acute_risk_score = round_half_up(min(raw, ACUTE_SCORE_CAP), 2)
    precision: "Two decimal places, round_half_up"

  - name: fairness_weighted_flash_allocation
    trigger: "POST /flash-campaigns/{flashCampaignId}/purchase (concurrent join arbitration on FlashCampaign.locked_units)"
    algorithm: waterfall_allocation
    formula: |
      For each incoming purchase request {customer_id, requested_units}:
        per_customer_cap = tier_caps[tier].max_units where tier = floor((current_request_seq) / CUSTOMERS_PER_TIER) capped at len(tier_caps)-1
                            (current_request_seq is a per-FlashCampaign monotonic counter starting at 0)
        eligibility:
          customer_status = ACTIVE (RISK_HOLD rejects)
          requested_units in (0, per_customer_cap]
        granted_units = min(requested_units, FlashCampaign.remaining_units, per_customer_cap)
        if granted_units == 0: ERR_FLASH_STOCK_DEPLETED
      Fairness ordering when multiple requests arrive in the same period: serialize by Customer.lifetime_completed_orders DESC, tie-break by customer.created_at ASC, final tie-break by customer.id lexicographic ASC.
    constants:
      CUSTOMERS_PER_TIER: 100
    precision: "Integer units"

  - name: pickup_point_load_factor
    trigger: "Read-time GET /pickup-points/{pickupPointId}/summary"
    algorithm: aggregation
    formula: |
      load_factor = held_package_count / capacity_packages
      load_state =
        "HEALTHY" if load_factor < 0.75
        "ELEVATED" if 0.75 <= load_factor < 1.00
        "FULL" if load_factor >= 1.00
    precision: "Two decimal places on load_factor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be one of {Customer, GroupLeader, Supplier, PickupOperator, CustomerService, PlatformAdmin}; for entity_backed roles, X-User-ID must resolve to an existing entity instance of the matching kind"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "All path-parameter resource ids exist (validated left-to-right: outer -> inner)"
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_GROUP_LEADER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_FLASH_CAMPAIGN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_PICKUP_POINT_NOT_FOUND | ERR_AFTER_SALES_CASE_NOT_FOUND | ERR_PAYOUT_NOT_FOUND | ERR_RISK_ALERT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 5
    category: existence
    check: "Body-referenced ids exist (e.g., customer_id, leader_id, supplier_id, sku catalog references)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_GROUP_LEADER_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_PICKUP_POINT_NOT_FOUND"
    http_status: 404
    applies_to: endpoints with body references

  - priority: 6
    category: state
    check: "For ownership-bearing roles (Customer, GroupLeader, Supplier), X-User-ID must equal the resource's owner foreign key (Order.customer_id for Customer; campaign.leader_id ∈ leader subtree of X-User-ID for GroupLeader; resource.supplier_id for Supplier)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all mutation endpoints on entity-bound resources"

  - priority: 7
    category: state
    check: "Target resource is in a state that allows this operation (per §1.2 transitions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"
    note: "Examples: closing an already-CLOSED campaign; dispatching a non-PLANNED shipment; resolving an after-sales case in REJECTED state"

  - priority: 8
    category: state
    check: "Group-buy: parent GroupBuyCampaign.status IN {FORMING, EXTENDED} and system_period_index < deadline_period — fires before any business_constraint check on the same endpoint."
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /group-buy-campaigns/{campaignId}/orders, POST /orders/{orderId}/pay"

  - priority: 8.5
    category: state
    check: "Flash purchase: parent FlashCampaign.status = OPEN — fires BEFORE the anti-oversell stock check at priority 17 (PRIORITY-PAIR with ERR_FLASH_STOCK_DEPLETED; rule_id=priority_pair_validation_conflict.campaign_state_vs_flash_stock_priority). When status is EXHAUSTED (current_period < closes_at AND remaining_units = 0) or CLOSED (current_period >= closes_at), this state check fires first regardless of stock."
    error_id: ERR_FLASH_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /flash-campaigns/{flashCampaignId}/purchase"

  - priority: 9
    category: business_safety
    check: "Cold-chain SKU shipment safety: if any line in the requested plan is a cold_chain_required SKU, the supplier owning that SKU must have at least one Warehouse with cold_chain_capable = true (regardless of warehouse status). PRIORITY-PAIR with ERR_NO_WAREHOUSE_AVAILABLE — safety check fires first (rule_id=priority_pair_validation_conflict.cold_chain_safety_vs_warehouse_referential)."
    error_id: ERR_COLD_CHAIN_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{orderId}/plan-shipments"

  - priority: 10
    category: business_referential
    check: "After cold-chain safety check (priority 9) passes, the candidate warehouse pool for a shipment line group (Warehouse rows with supplier_id of the SKU and status=ACTIVE, intersected with the cold-chain filter) must be non-empty"
    error_id: ERR_NO_WAREHOUSE_AVAILABLE
    http_status: 422
    applies_to: "POST /orders/{orderId}/plan-shipments"

  - priority: 11
    category: business_constraint
    check: "PickupPoint.held_package_count + 1 <= PickupPoint.capacity_packages on Shipment arrive-at-pickup (boundary inclusive of capacity)"
    error_id: ERR_PICKUP_POINT_AT_CAPACITY
    http_status: 409
    applies_to: "POST /shipments/{shipmentId}/arrive-at-pickup"

  - priority: 12
    category: business_constraint
    check: "Cold-segment shipments require destination PickupPoint.cold_storage_capable = true"
    error_id: ERR_PICKUP_POINT_COLD_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /shipments/{shipmentId}/arrive-at-pickup"

  - priority: 13
    category: business_constraint
    check: "ConsolidationBatch [window_start_period - CONSOLIDATION_BUFFER_PERIODS, window_end_period + CONSOLIDATION_BUFFER_PERIODS] does not overlap any existing batch on the same PickupPoint (closed interval, buffer = 1 period)"
    error_id: ERR_CONSOLIDATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pickup-points/{pickupPointId}/consolidation-batches"

  - priority: 14
    category: business_constraint
    check: "GroupBuyCampaign [opens_at_period, deadline_period) does not overlap any existing FORMING/EXTENDED/SUCCEEDED campaign on the same (community_id, sku) (half-open interval; adjacent windows allowed)"
    error_id: ERR_COMMUNITY_CAMPAIGN_OVERLAP
    http_status: 409
    applies_to: "POST /group-leaders/{leaderId}/group-buy-campaigns"

  - priority: 15
    category: business_constraint
    check: "Customer.status != BLOCKED, RISK_HOLD on order create / pay; flash purchase rejects RISK_HOLD via ERR_CUSTOMER_RISK_HOLD"
    error_id: "ERR_CUSTOMER_BLOCKED (BLOCKED), ERR_CUSTOMER_RISK_HOLD (RISK_HOLD)"
    http_status: 403
    applies_to: "POST /group-buy-campaigns/{campaignId}/orders, POST /flash-campaigns/{flashCampaignId}/purchase"

  - priority: 16
    category: business_constraint
    check: "Duplicate participation: a Customer may have at most one Order in payment_status IN {PENDING_PAY, PAID, SETTLED, PARTIALLY_REFUNDED} per GroupBuyCampaign"
    error_id: ERR_DUPLICATE_PARTICIPATION
    http_status: 409
    applies_to: "POST /group-buy-campaigns/{campaignId}/orders"

  - priority: 17
    category: business_constraint
    check: "FlashCampaign.remaining_units >= requested_units (anti-oversell)"
    error_id: ERR_FLASH_STOCK_DEPLETED
    http_status: 409
    applies_to: "POST /flash-campaigns/{flashCampaignId}/purchase"

  - priority: 18
    category: business_temporal
    check: "AfterSalesCase may be filed only within AFTER_SALES_WINDOW_PERIODS (= 7) periods of Order.fulfillment_status -> PICKED_UP, and only one OPEN (non-terminal) case per Order at a time"
    error_id: "ERR_AFTER_SALES_WINDOW_EXPIRED (window) | ERR_AFTER_SALES_ALREADY_OPEN (one-at-a-time)"
    http_status: 409
    applies_to: "POST /orders/{orderId}/after-sales-cases"

  - priority: 19
    category: business_constraint
    check: "AfterSalesCase.requested_amount_cents <= Order.settled_total_cents - Order.refunded_amount_cents"
    error_id: ERR_AFTER_SALES_AMOUNT_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /orders/{orderId}/after-sales-cases"

  - priority: 20
    category: business_constraint
    check: "Payout MATURE prerequisite (in /_sweep/run-payouts): NO bundled CommissionEntry has status IN {PENDING_CLAWBACK, CLAWED_BACK} (rule_id=cross_entity_state_dependency.payout_mature_requires_no_pending_clawbacks)"
    error_id: ERR_PAYOUT_HAS_PENDING_CLAWBACK
    http_status: 409
    applies_to: "POST /payouts/{payoutId}/release (the same rule blocks /_sweep/run-payouts pass 2 from advancing the payout, observable as Payout.status remaining SCHEDULED after the sweep)"

  - priority: 21
    category: business_constraint
    check: "Payout release prerequisite: status = MATURED (not SCHEDULED)"
    error_id: ERR_PAYOUT_NOT_MATURED
    http_status: 409
    applies_to: "POST /payouts/{payoutId}/release"

  - priority: 22
    category: business_constraint
    check: "Optimistic concurrency: if request body includes `version`, current.version must equal it"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 23
    category: business_constraint
    check: "Generic field validation (types, integer ranges, enum membership, required fields) and quantity > 0"
    error_id: "ERR_VALIDATION_FAILED | ERR_INVALID_QUANTITY"
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Test-driving infrastructure (REQUIRED for testability completeness) ---
  - method: POST
    path: /_clock/advance
    description: "Advance the deterministic global system_period_index"
    roles: [PlatformAdmin]
    code: 200
    input: [by_periods]
    output: ClockState
    side_effects:
      - "system_period_index += by_periods (min 1, max 365)"
      - "Triggers any time-gated automatic transitions noted on state machines whose preconditions are now satisfied"
  - method: POST
    path: /_sweep/run-payouts
    description: "Run the financial-finalization sweep. Two passes in deterministic order: (1) for every Order with payment_status = REFUND_PENDING: Order -> REFUNDED, Order.refunded_amount_cents += latest in-flight refund amount, fulfillment_status -> CANCELLED if currently NOT_PLANNED/PLANNED/DISPATCHED (skipped if PICKED_UP/COMPLETED), and every CommissionEntry with status=PENDING_CLAWBACK whose source order is now REFUNDED -> CLAWED_BACK (recovered_clawback_cents on the leader incremented if the bundled Payout is already RELEASED). (2) Then for every Payout with status=SCHEDULED, target_period_index <= system_period_index, AND no bundled CommissionEntry in {PENDING_CLAWBACK, CLAWED_BACK}: SCHEDULED -> MATURED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SweepReport
    side_effects:
      - "Pass 1: REFUND_PENDING orders -> REFUNDED; PENDING_CLAWBACK entries (whose order is now REFUNDED) -> CLAWED_BACK"
      - "Pass 2: SCHEDULED -> MATURED on payouts whose bundled set contains no PENDING_CLAWBACK or CLAWED_BACK entries"
  - method: POST
    path: /_sweep/auto-close-campaigns
    description: "Run the campaign auto-close sweep — every FORMING/EXTENDED GroupBuyCampaign whose deadline_period <= system_period_index closes to SUCCEEDED or FAILED per its participant_count"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SweepReport
    side_effects: ["Campaign close cascade as defined in §1.2"]
  - method: POST
    path: /_sweep/recompute-risk
    description: "Recompute leader_chronic_risk_score and leader_acute_risk_score for all ACTIVE leaders"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SweepReport
    side_effects: []

  # --- Communities ---
  - method: POST
    path: /communities
    description: "Create a community"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, "timezone_offset_minutes?"]
    output: Community
    side_effects: []
  - method: GET
    path: /communities
    description: "List communities"
    roles: [PlatformAdmin, GroupLeader, Customer, Supplier, PickupOperator, CustomerService]
    code: 200
    input: []
    output: "Community[]"
    side_effects: []

  # --- Group Leaders ---
  - method: POST
    path: /communities/{communityId}/group-leaders
    description: "Create a group leader (status defaults to PENDING_REVIEW)"
    roles: [PlatformAdmin]
    code: 201
    input: ["parent_leader_id?", display_name]
    output: GroupLeader
    side_effects: ["GroupLeader.tier computed: parent_leader_id null -> tier=1; else parent.tier + 1, capped at 3"]
  - method: GET
    path: /group-leaders/{leaderId}
    description: "Get a group leader"
    roles: [PlatformAdmin, GroupLeader, CustomerService]
    code: 200
    input: []
    output: GroupLeader
    side_effects: []
  - method: POST
    path: /group-leaders/{leaderId}/approve
    description: "Approve a leader"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GroupLeader
    side_effects: ["status PENDING_REVIEW -> ACTIVE"]
  - method: POST
    path: /group-leaders/{leaderId}/suspend
    description: "Suspend a leader"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GroupLeader
    side_effects: ["status ACTIVE -> SUSPENDED; cascade as per §1.2"]
  - method: POST
    path: /group-leaders/{leaderId}/reinstate
    description: "Reinstate a suspended leader"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GroupLeader
    side_effects: ["status SUSPENDED -> ACTIVE"]
  - method: POST
    path: /group-leaders/{leaderId}/deactivate
    description: "Deactivate a leader"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GroupLeader
    side_effects: ["status -> DEACTIVATED"]

  # --- Customers ---
  - method: POST
    path: /customers
    description: "Create a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [community_id, display_name]
    output: Customer
    side_effects: []
  - method: GET
    path: /customers/{customerId}
    description: "Get a customer"
    roles: [PlatformAdmin, Customer, CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Suppliers and Warehouses ---
  - method: POST
    path: /suppliers
    description: "Create a supplier"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Supplier
    side_effects: []
  - method: POST
    path: /suppliers/{supplierId}/warehouses
    description: "Create a warehouse"
    roles: [PlatformAdmin, Supplier]
    code: 201
    input: [name, region_code, "cold_chain_capable?", "handling_periods?", "cold_handling_periods?", "initial_status?"]
    output: Warehouse
    side_effects: ["Warehouse.status = initial_status if provided (must be ACTIVE or DISABLED), else ACTIVE"]
  - method: GET
    path: /suppliers/{supplierId}/warehouses
    description: "List warehouses"
    roles: [PlatformAdmin, Supplier]
    code: 200
    input: []
    output: "Warehouse[]"
    side_effects: []

  # --- Flash Campaigns ---
  - method: POST
    path: /suppliers/{supplierId}/flash-campaigns
    description: "Create a flash campaign"
    roles: [Supplier, PlatformAdmin]
    code: 201
    input: [sku, "cold_chain_required?", unit_price_cents, tier_caps, total_stock, opens_at_period, closes_at_period]
    output: FlashCampaign
    side_effects: []
  - method: GET
    path: /flash-campaigns/{flashCampaignId}
    description: "Get a flash campaign (returns total_stock, locked_units, allocated_units, remaining_units, status, etc.)"
    roles: [PlatformAdmin, Supplier, Customer]
    code: 200
    input: []
    output: FlashCampaign
    side_effects: []
  - method: POST
    path: /flash-campaigns/{flashCampaignId}/purchase
    description: "Purchase units from a flash campaign (anti-oversell, fairness-weighted serialization)"
    roles: [Customer]
    code: 201
    input: [requested_units]
    output: Order
    side_effects:
      - "FlashCampaign.allocated_units += granted_units; FlashCampaign.remaining_units -= granted_units (atomic; locked_units stays 0 because flash purchases auto-settle)"
      - "An Order is created with campaign_kind=FLASH, campaign_id=FlashCampaign.id, flash_granted_units=granted_units, line_items=[{sku=FlashCampaign.sku, unit_price_cents=FlashCampaign.unit_price_cents, quantity=granted_units}], subtotal_cents = unit_price_cents * granted_units, settled_total_cents = subtotal_cents (no discount on flash), payment_status = SETTLED, fulfillment_status = NOT_PLANNED"
      - "If FlashCampaign.remaining_units falls to 0: status -> EXHAUSTED"
      - "No CommissionEntry is generated for FLASH orders (commission settlement applies only to GROUP_BUY)"

  # --- Group-Buy Campaigns ---
  - method: POST
    path: /group-leaders/{leaderId}/group-buy-campaigns
    description: "Create a group-buy campaign (validates community/SKU temporal-overlap)"
    roles: [GroupLeader]
    code: 201
    input: ["cross_community_partner_leader_ids?", supplier_id, sku, "cold_chain_required?", unit_price_cents, discount_tiers, opens_at_period, deadline_period]
    output: GroupBuyCampaign
    side_effects: ["status = FORMING"]
  - method: POST
    path: /group-buy-campaigns/{campaignId}/orders
    description: "Create an order within a group-buy campaign (joining the group)"
    roles: [Customer]
    code: 201
    input: [customer_id, line_items]
    output: Order
    side_effects:
      - "Order created with campaign_kind=GROUP_BUY, campaign_id=campaignId, flash_granted_units=null, payment_status = PENDING_PAY, fulfillment_status = NOT_PLANNED"
      - "Order.subtotal_cents pinned"
  - method: POST
    path: /orders/{orderId}/cancel
    description: "Cancel a non-shipped order. Permitted only for FLASH orders before AT_PICKUP; group-buy orders must use the after-sales workflow instead."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.payment_status -> REFUNDED, Order.fulfillment_status -> CANCELLED"
      - "Any non-terminal child Shipments -> CANCELLED"
      - "If Order.campaign_kind = FLASH: FlashCampaign.allocated_units -= Order.flash_granted_units; FlashCampaign.remaining_units += Order.flash_granted_units; if status was EXHAUSTED and now remaining_units > 0 and current_period < closes_at_period, status -> OPEN"
  - method: POST
    path: /orders/{orderId}/pay
    description: "Pay an order (PENDING_PAY -> PAID); pins provisional totals"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.payment_status: PENDING_PAY -> PAID"
      - "GroupBuyCampaign.participant_count incremented"
      - "Provisional totals pinned per calculations.order_total"
  - method: POST
    path: /group-buy-campaigns/{campaignId}/extend
    description: "Extend a FORMING campaign deadline by EXTENSION_PERIODS"
    roles: [GroupLeader]
    code: 200
    input: []
    output: GroupBuyCampaign
    side_effects: ["status FORMING -> EXTENDED -> FORMING with deadline shifted"]
  - method: POST
    path: /group-buy-campaigns/{campaignId}/close
    description: "Manually close a FORMING/EXTENDED campaign (settle to SUCCEEDED or FAILED)"
    roles: [GroupLeader, PlatformAdmin]
    code: 200
    input: []
    output: GroupBuyCampaign
    side_effects: ["See §1.2 close transitions and cascades"]
  - method: POST
    path: /group-buy-campaigns/{campaignId}/finalize
    description: "Finalize a SUCCEEDED/FAILED campaign (status -> CLOSED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GroupBuyCampaign
    side_effects: []
  - method: GET
    path: /group-buy-campaigns/{campaignId}
    description: "Get a group-buy campaign"
    roles: [PlatformAdmin, GroupLeader, Customer]
    code: 200
    input: []
    output: GroupBuyCampaign
    side_effects: []

  # --- Orders / Shipments / Pickup ---
  - method: GET
    path: /orders/{orderId}
    description: "Get order"
    roles: [PlatformAdmin, Customer, GroupLeader, Supplier, CustomerService]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: /orders/{orderId}/plan-shipments
    description: "Plan one or more Shipments for an Order (server selects warehouses)"
    roles: [Supplier, PlatformAdmin]
    code: 201
    input: [shipment_plan]
    output: "Shipment[]"
    side_effects:
      - "shipment_plan = list of {pickup_point_id, line_units}; warehouse_id auto-selected per calculations.warehouse_selector"
      - "Order.fulfillment_status NOT_PLANNED -> PLANNED"
  - method: GET
    path: /shipments/{shipmentId}
    description: "Get a shipment"
    roles: [PlatformAdmin, Supplier, Customer, PickupOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: /shipments/{shipmentId}/dispatch
    description: "Dispatch a planned shipment"
    roles: [Supplier]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status PLANNED -> DISPATCHED; predicted_eta pinned"]
  - method: POST
    path: /shipments/{shipmentId}/arrive-at-pickup
    description: "Mark shipment AT_PICKUP at destination"
    roles: [Supplier]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status DISPATCHED -> AT_PICKUP"]
  - method: POST
    path: /shipments/{shipmentId}/report-mispick
    description: "Report a mis-pick at pickup"
    roles: [PickupOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status AT_PICKUP -> MIS_PICK"]
  - method: POST
    path: /shipments/{shipmentId}/reconcile
    description: "Reconcile a mis-pick"
    roles: [PickupOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status MIS_PICK -> RECONCILED -> AT_PICKUP-equivalent"]
  - method: POST
    path: /orders/{orderId}/pickup-confirm
    description: "Customer confirms pickup of all the order's shipments"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.fulfillment_status AT_PICKUP -> PICKED_UP; child Shipments -> DELIVERED"]

  # --- Pickup Points ---
  - method: POST
    path: /communities/{communityId}/pickup-points
    description: "Create a pickup point"
    roles: [PlatformAdmin]
    code: 201
    input: [name, capacity_packages, "cold_storage_capable?"]
    output: PickupPoint
    side_effects: []
  - method: GET
    path: /pickup-points/{pickupPointId}/summary
    description: "Read pickup point load summary (held_package_count, capacity, load_factor, load_state)"
    roles: [PlatformAdmin, PickupOperator]
    code: 200
    input: []
    output: PickupPointSummary
    side_effects: []
  - method: POST
    path: /pickup-points/{pickupPointId}/consolidation-batches
    description: "Open a consolidation batch covering [window_start_period, window_end_period] inclusive; rejects on overlap with buffer"
    roles: [PickupOperator]
    code: 201
    input: [window_start_period, window_end_period, shipment_ids]
    output: ConsolidationBatch
    side_effects: []

  # --- After-Sales ---
  - method: GET
    path: /after-sales/{caseId}
    description: "Get an after-sales case"
    roles: [PlatformAdmin, Customer, CustomerService]
    code: 200
    input: []
    output: AfterSalesCase
    side_effects: []
  - method: POST
    path: /orders/{orderId}/after-sales-cases
    description: "File an after-sales case"
    roles: [Customer]
    code: 201
    input: [case_type, requested_amount_cents]
    output: AfterSalesCase
    side_effects: ["status = FILED"]
  - method: POST
    path: /after-sales/{caseId}/start-review
    description: "Begin review"
    roles: [CustomerService]
    code: 200
    input: []
    output: AfterSalesCase
    side_effects: ["status FILED -> UNDER_REVIEW"]
  - method: POST
    path: /after-sales/{caseId}/request-evidence
    description: "Request additional evidence"
    roles: [CustomerService]
    code: 200
    input: []
    output: AfterSalesCase
    side_effects: ["status UNDER_REVIEW -> EVIDENCE_REQUESTED"]
  - method: POST
    path: /after-sales/{caseId}/submit-evidence
    description: "Customer submits evidence"
    roles: [Customer]
    code: 200
    input: []
    output: AfterSalesCase
    side_effects: ["status EVIDENCE_REQUESTED -> UNDER_REVIEW; evidence_round += 1"]
  - method: POST
    path: /after-sales/{caseId}/escalate
    description: "Escalate to arbitration"
    roles: [CustomerService]
    code: 200
    input: []
    output: AfterSalesCase
    side_effects: ["status UNDER_REVIEW -> ARBITRATION"]
  - method: POST
    path: /after-sales/{caseId}/resolve
    description: "Resolve a case (UNDER_REVIEW or ARBITRATION) with one of REFUND_ONLY / RETURN_REFUND / PARTIAL_COMPENSATION / REJECT"
    roles: [CustomerService, PlatformAdmin]
    code: 200
    input: [outcome]
    output: AfterSalesCase
    side_effects: ["See §1.2 AfterSalesCase resolution branches"]

  # --- Payouts ---
  - method: GET
    path: /group-leaders/{leaderId}/commission-entries
    description: "List commission entries for a leader"
    roles: [PlatformAdmin, GroupLeader]
    code: 200
    input: ["status?"]
    output: "CommissionEntry[]"
    side_effects: []
  - method: POST
    path: /group-leaders/{leaderId}/payouts
    description: "Assemble a payout for a target_period_index, bundling all PENDING/PENDING_CLAWBACK CommissionEntry rows whose payout_target_period_index <= target_period_index"
    roles: [PlatformAdmin]
    code: 201
    input: [target_period_index]
    output: Payout
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: /payouts/{payoutId}
    description: "Get a payout"
    roles: [PlatformAdmin, GroupLeader]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: POST
    path: /payouts/{payoutId}/release
    description: "Release a MATURED payout"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status MATURED -> RELEASED; bundled CommissionEntry: PENDING -> SETTLED"]
  - method: POST
    path: /payouts/{payoutId}/cancel
    description: "Cancel a SCHEDULED payout (releases its bundled entries)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # --- Risk Alerts ---
  - method: POST
    path: /risk-alerts
    description: "Open a risk alert (e.g., from a detection job emitted into the API)"
    roles: [PlatformAdmin]
    code: 201
    input: [alert_type, target_kind, target_id, "supporting_supplier_id?", severity]
    output: RiskAlert
    side_effects: ["status = OPEN"]
  - method: POST
    path: /risk-alerts/{alertId}/confirm
    description: "Confirm a risk alert"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RiskAlert
    side_effects: ["status -> CONFIRMED; cascades per §1.2 RiskAlert"]
  - method: POST
    path: /risk-alerts/{alertId}/dismiss
    description: "Dismiss a risk alert"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RiskAlert
    side_effects: ["status -> DISMISSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Required X-User-ID or X-User-Role header missing/empty/unrecognized role string" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or X-User-ID does not resolve to an entity of the entity_backed role's kind" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Acting role's X-User-ID does not match the resource's owner foreign key" }
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "Community.id in path does not exist" }
  - { id: ERR_GROUP_LEADER_NOT_FOUND, http: 404, condition: "GroupLeader.id in path does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "GroupBuyCampaign.id in path does not exist" }
  - { id: ERR_FLASH_CAMPAIGN_NOT_FOUND, http: 404, condition: "FlashCampaign.id in path does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order.id in path does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment.id in path does not exist" }
  - { id: ERR_PICKUP_POINT_NOT_FOUND, http: 404, condition: "PickupPoint.id in path does not exist" }
  - { id: ERR_AFTER_SALES_CASE_NOT_FOUND, http: 404, condition: "AfterSalesCase.id in path does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout.id in path does not exist" }
  - { id: ERR_RISK_ALERT_NOT_FOUND, http: 404, condition: "RiskAlert.id in path does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer referenced in body does not exist" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier in path does not exist" }
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "Warehouse referenced does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that admits this transition" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "GroupBuyCampaign.status not in {FORMING, EXTENDED} or system_period_index >= deadline_period at the time of join/pay" }
  - { id: ERR_FLASH_STOCK_DEPLETED, http: 409, condition: "FlashCampaign.remaining_units < requested_units (or = 0)" }
  - { id: ERR_FLASH_CAMPAIGN_NOT_OPEN, http: 409, condition: "FlashCampaign.status not in {OPEN} (i.e., SCHEDULED, EXHAUSTED, or CLOSED)" }
  - { id: ERR_DUPLICATE_PARTICIPATION, http: 409, condition: "Customer already has a non-refunded Order in this campaign" }
  - { id: ERR_COMMUNITY_CAMPAIGN_OVERLAP, http: 409, condition: "Two GroupBuyCampaigns on same (community_id, sku) have overlapping half-open intervals" }
  - { id: ERR_COLD_CHAIN_REQUIRED, http: 422, condition: "Cold-chain SKU and no cold_chain_capable warehouse in candidate set" }
  - { id: ERR_NO_WAREHOUSE_AVAILABLE, http: 422, condition: "No eligible warehouse in candidate set after non-cold filtering" }
  - { id: ERR_PICKUP_POINT_AT_CAPACITY, http: 409, condition: "PickupPoint.held_package_count would exceed capacity_packages" }
  - { id: ERR_PICKUP_POINT_COLD_INCOMPATIBLE, http: 422, condition: "Cold-segment shipment routed to a non-cold-capable PickupPoint" }
  - { id: ERR_CONSOLIDATION_WINDOW_OVERLAP, http: 409, condition: "ConsolidationBatch window overlaps an existing batch on the same PickupPoint within buffer" }
  - { id: ERR_AFTER_SALES_WINDOW_EXPIRED, http: 409, condition: "system_period_index - PICKED_UP_period > AFTER_SALES_WINDOW_PERIODS" }
  - { id: ERR_AFTER_SALES_ALREADY_OPEN, http: 409, condition: "Order already has an OPEN AfterSalesCase" }
  - { id: ERR_AFTER_SALES_AMOUNT_EXCEEDS_REMAINING, http: 422, condition: "requested_amount_cents > Order.settled_total_cents - Order.refunded_amount_cents" }
  - { id: ERR_PAYOUT_HAS_PENDING_CLAWBACK, http: 409, condition: "Payout cannot release while bundled CommissionEntry rows are PENDING_CLAWBACK" }
  - { id: ERR_PAYOUT_NOT_MATURED, http: 409, condition: "Payout.status != MATURED on release" }
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "OCC: provided version != current version" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Generic field validation failure (type, required, range, enum)" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "Quantity field <= 0 where positive integer required" }
  - { id: ERR_CUSTOMER_BLOCKED, http: 403, condition: "Customer.status = BLOCKED at order create / pay / flash purchase" }
  - { id: ERR_CUSTOMER_RISK_HOLD, http: 403, condition: "Customer.status = RISK_HOLD at order create / pay / flash purchase" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operational administrator with platform-wide authority for risk, payouts, arbitration, infrastructure"
    identity: opaque
    exclusive_operations:
      - "POST /communities, POST /customers, POST /suppliers"
      - "POST /communities/{communityId}/pickup-points"
      - "POST /group-leaders/{leaderId}/approve | /suspend | /reinstate | /deactivate"
      - "POST /group-leaders/{leaderId}/payouts, POST /payouts/{payoutId}/release | /cancel"
      - "POST /risk-alerts, POST /risk-alerts/{alertId}/confirm | /dismiss"
      - "POST /_clock/advance, POST /_sweep/run-payouts, POST /_sweep/auto-close-campaigns, POST /_sweep/recompute-risk"
    shared_operations:
      - "POST /suppliers/{supplierId}/warehouses (with Supplier)"
      - "POST /suppliers/{supplierId}/flash-campaigns (with Supplier)"
      - "POST /orders/{orderId}/plan-shipments (with Supplier)"
      - "POST /group-buy-campaigns/{campaignId}/close | /finalize (with GroupLeader)"
      - "POST /after-sales/{caseId}/resolve (with CustomerService)"
      - "GETs as listed per endpoint"

  - name: GroupLeader
    description: "Community group leader; runs group-buy campaigns; multi-tier hierarchy"
    identity: "entity_backed:GroupLeader"
    exclusive_operations:
      - "POST /group-leaders/{leaderId}/group-buy-campaigns (acting leader = X-User-ID)"
      - "POST /group-buy-campaigns/{campaignId}/extend (campaign.leader_id == X-User-ID)"
    shared_operations:
      - "POST /group-buy-campaigns/{campaignId}/close (with PlatformAdmin)"
      - "GET /group-leaders/{leaderId} (own subtree), GET /group-leaders/{leaderId}/commission-entries (own)"
      - "GET /group-buy-campaigns/{campaignId}, GET /orders/{orderId}"

  - name: Customer
    description: "End customer who places group-buy orders and flash purchases"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /flash-campaigns/{flashCampaignId}/purchase (purchaser = X-User-ID)"
      - "POST /group-buy-campaigns/{campaignId}/orders (customer_id = X-User-ID)"
      - "POST /orders/{orderId}/pay, /pickup-confirm, /cancel, /after-sales-cases (Order.customer_id = X-User-ID; /cancel limited to FLASH orders before AT_PICKUP)"
      - "POST /after-sales/{caseId}/submit-evidence (case.order.customer_id = X-User-ID)"
    shared_operations:
      - "GET /orders/{orderId}, GET /group-buy-campaigns/{campaignId}, GET /customers/{customerId} (own)"

  - name: Supplier
    description: "Supplier of SKUs; runs flash campaigns; manages warehouses; dispatches shipments"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /shipments/{shipmentId}/dispatch | /arrive-at-pickup (shipment via warehouse with warehouse.supplier_id = X-User-ID)"
    shared_operations:
      - "POST /suppliers/{supplierId}/warehouses (with PlatformAdmin)"
      - "POST /suppliers/{supplierId}/flash-campaigns (with PlatformAdmin)"
      - "POST /orders/{orderId}/plan-shipments (with PlatformAdmin) — must be the supplier of all shipped SKUs"
      - "GET /suppliers/{supplierId}/warehouses"

  - name: PickupOperator
    description: "Operator at a pickup point performing sorting, mis-pick reporting, reconciliation, and consolidation"
    identity: opaque
    exclusive_operations:
      - "POST /shipments/{shipmentId}/report-mispick | /reconcile"
      - "POST /pickup-points/{pickupPointId}/consolidation-batches"
    shared_operations:
      - "GET /pickup-points/{pickupPointId}/summary (with PlatformAdmin)"

  - name: CustomerService
    description: "After-sales agent reviewing cases up to arbitration"
    identity: opaque
    exclusive_operations:
      - "POST /after-sales/{caseId}/start-review | /request-evidence | /escalate"
    shared_operations:
      - "POST /after-sales/{caseId}/resolve (with PlatformAdmin; CustomerService only when status = UNDER_REVIEW)"
      - "GET /customers/{customerId}, GET /orders/{orderId}, GET /group-leaders/{leaderId}"
