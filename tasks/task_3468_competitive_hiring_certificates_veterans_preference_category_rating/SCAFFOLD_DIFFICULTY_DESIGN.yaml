  - rule_id: compensating_invariant
    instances:
      - name: vacancy_slot_conservation_select_decline_reselect
        grounds:
          - calculations.remaining_vacancies_recompute
          - state_machines.CertificateEntry.SELECTED_to_NOT_SELECTED
        distinguishing_aspect: |
          Conserved quantity: JobAnnouncement.remaining_vacancies (vacancy slots). Forward action (select,
          -1) paired with its compensating action (offer declined, +1) leaves the quantity unchanged;
          pinned formula remaining == vacancies_count - count(SELECTED entries with live offers).
          Sibling invariant conserves a different quantity (rated-pool headcount).
