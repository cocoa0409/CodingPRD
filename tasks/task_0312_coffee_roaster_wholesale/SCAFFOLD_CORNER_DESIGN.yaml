        excluded_because:
          difficulty_instance: resource_temporal_overlap / green_reservation_aggregate_capacity_overlap
          rationale: "The green-lot OCC create chain (version re-read between two batch creates) is exercised by the named §1.8 overlap instance's setup, which reuses fresh versions; the stale-version rejection path mirrors that lot-version progression."

