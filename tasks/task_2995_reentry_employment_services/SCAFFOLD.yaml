    roles: [EmployerLiaison]
    input: [employer_name, industry, max_concurrent_placements, "wotc_certified?", "excluded_record_categories?"]
    output: EmployerPartnership
    side_effects:
      - "status initialised to PROSPECT; active_placement_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION]

  - method: GET
    path: /employer-partnerships/{id}
    description: "Reads one employer partnership."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: EmployerPartnership
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PARTNERSHIP_NOT_FOUND]

  - method: GET
    path: /employer-partnerships
    description: "Lists employer partnerships."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "status?", "wotc_certified?", "fidelity_bond_enabled?"]
    output: EmployerPartnership[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /employer-partnerships/{id}/status
    description: "Advances the partnership development lifecycle."
    roles: [EmployerLiaison]
    input: [to_status]
    output: EmployerPartnership
    side_effects:
      - "on TERMINATED, every OPEN or FILLED JobOpening of the partnership closes and every OFFERED Placement on those openings is DECLINED, returning opening slots"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTNERSHIP_NOT_FOUND, ERR_PARTNERSHIP_INVALID_STATE, ERR_PARTNERSHIP_HAS_ACTIVE_PLACEMENTS]

  - method: POST
    path: /employer-partnerships/{id}/bonding-agreement
    description: "Records the federal fidelity bonding agreement that lets the employer accept record-relevant placements."
    roles: [EmployerLiaison]
    input: [bond_coverage_cents, bond_effective_date]
    output: EmployerPartnership
    side_effects:
      - "fidelity_bond_enabled set true; bond_coverage_cents and bond_effective_date recorded"
      - "no status change — bonding is orthogonal to the partnership development lifecycle"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTNERSHIP_NOT_FOUND, ERR_PARTNERSHIP_INVALID_STATE, ERR_BOND_ALREADY_RECORDED]

  - method: GET
    path: /employer-partnerships/{id}/job-openings
    description: "Sub-resource list of the partnership's job openings."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "status?"]
    output: JobOpening[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION, ERR_PARTNERSHIP_NOT_FOUND]

  # ---- JobOpening ----------------------------------------------------------
  - method: POST
    path: /job-openings
    description: "Posts a job opening with its record-relevant restrictions."
    roles: [EmployerLiaison]
    input: [partnership_id, title, occupation_code, hourly_wage_cents, weekly_hours, openings_count, "barred_record_categories?", "requires_license?", "license_occupation_code?", "requires_fidelity_bond?", "transit_accessible?"]
    output: JobOpening
    side_effects:
      - "status initialised to OPEN; offered_count and filled_count 0; remaining_openings equals openings_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTNERSHIP_NOT_FOUND]

  - method: GET
    path: /job-openings/{id}
    description: "Reads one job opening with its live capacity counters."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: JobOpening
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_JOB_OPENING_NOT_FOUND]

  - method: GET
    path: /job-openings
    description: "Lists job openings; filter by partnership_id to reach an employer's postings."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "partnership_id?", "status?", "requires_license?", "transit_accessible?"]
    output: JobOpening[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: GET
    path: /job-openings/{id}/match-preview
    description: |
      Computed read: scores a participant against this opening without creating a
      placement, and reports the first blocking eligibility gate if there is one.
    roles: [CaseManager, EmployerLiaison, ProgramDirector]
    input: [participant_id]
    output: "{ job_opening_id: string, participant_id: string, match_score: integer, match_breakdown: object, eligible: boolean, blocking_error_id: string }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_JOB_OPENING_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND]
    note: "blocking_error_id is null when eligible is true; otherwise it names the §1.4 error POST /placements would return, chosen by the same priority ladder."

  # ---- FunderGrant ---------------------------------------------------------
  - method: POST
    path: /grants
    description: "Records a funder grant and its programme constraints."
    roles: [FunderAnalyst]
    input: [funder_name, program_year, authorized_cents, allowed_categories, per_participant_cap_cents, retention_benchmark_pct]
    output: FunderGrant
    side_effects:
      - "committed_cents and disbursed_cents 0; available_cents equals authorized_cents; funding_posture computed as OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION]

  - method: GET
    path: /grants/{id}
    description: "Reads one grant with its live ledger columns."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: FunderGrant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_GRANT_NOT_FOUND]

  - method: GET
    path: /grants
    description: "Lists funder grants."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "funding_posture?", "program_year?"]
    output: FunderGrant[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: GET
    path: /grants/{id}/ledger
    description: "Computed read of the grant's money columns and the restricted floor."
    roles: [ProgramDirector, FunderAnalyst]
    input: []
    output: "{ grant_id: string, authorized_cents: integer, committed_cents: integer, disbursed_cents: integer, available_cents: integer, restricted_floor_cents: integer, funding_posture: string, open_request_count: integer, deferred_request_count: integer }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GRANT_NOT_FOUND]

  - method: GET
    path: /grants/{id}/outcome-report
    description: "Retention and recidivism outcome report for funders, in two denominator variants."
    roles: [ProgramDirector, FunderAnalyst]
    input: ["variant?"]
    output: "{ grant_id: string, variant: string, participants_served: integer, denominator_placements: integer, retained_placements: integer, retention_rate_pct: number, recidivism_rate_pct: number, benchmark_met: boolean, subsidy_disbursed_cents: integer, support_disbursed_cents: integer }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_GRANT_NOT_FOUND]
    note: "variant defaults to COHORT; EXIT_BASED narrows the denominator to placements whose participant has exited."

  # ---- Placement -----------------------------------------------------------
  - method: POST
    path: /placements
    description: |
      Matches a participant to a job opening and funds the placement from a grant.
      OCC-guarded on the job opening. Runs the full eligibility ladder: suspension,
      partnership state, record bars, licence relief, bonding availability,
      duplicate placement, then opening capacity.
    roles: [CaseManager]
    input: [participant_id, job_opening_id, grant_id, subsidy_track, expected_job_opening_version, start_date]
    output: Placement
    side_effects:
      - "employment_status OFFERED, bonding_status NONE, schedule_compliance COMPLIANT (no shifts yet, so no CONFLICTED shift exists)"
      - "match_score and match_breakdown computed by calculations.job_match_score"
      - "JobOpening.offered_count incremented, remaining_openings decremented, status may flip OPEN → FILLED"
      - "projected_subsidy_cents and actual_subsidy_cents initialised to 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_JOB_OPENING_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_STALE_JOB_OPENING_VERSION, ERR_PARTICIPANT_SUSPENDED, ERR_PARTNERSHIP_NOT_ACTIVE, ERR_RECORD_CATEGORY_BARRED, ERR_LICENSE_RELIEF_REQUIRED, ERR_FIDELITY_BOND_UNAVAILABLE, ERR_DUPLICATE_PLACEMENT, ERR_JOB_OPENING_NOT_OPEN]

  - method: GET
    path: /placements/{id}
    description: "Reads one placement with its subsidy and retention columns."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: Placement
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PLACEMENT_NOT_FOUND]

  - method: GET
    path: /placements
    description: "Lists placements; filter by participant_id, job_opening_id or grant_id."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "participant_id?", "job_opening_id?", "grant_id?", "employment_status?", "bonding_status?", "schedule_compliance?"]
    output: Placement[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /placements/{id}/offer-response
    description: "The participant accepts or declines the offer. Ownership-checked."
    roles: [Participant]
    input: [response]
    output: Placement
    side_effects:
      - "on ACCEPTED: employment_status → ACTIVE, JobOpening.offered_count → filled_count, EmployerPartnership.active_placement_count incremented, Participant.stage POST_RELEASE → PLACED"
      - "on DECLINED: employment_status → DECLINED, JobOpening.offered_count decremented and remaining_openings raised, status may flip FILLED → OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND, ERR_NOT_PLACEMENT_PARTICIPANT, ERR_PLACEMENT_INVALID_STATE, ERR_PARTICIPANT_SUSPENDED, ERR_PARTNERSHIP_NOT_ACTIVE, ERR_PARTNERSHIP_CAPACITY_REACHED]

  - method: POST
    path: /placements/{id}/separate
    description: "Ends the employment relationship and settles the wage subsidy."
    roles: [EmployerLiaison]
    input: [separation_reason, separation_date]
    output: Placement
    side_effects:
      - "employment_status → SEPARATED; future SCHEDULED and CONFLICTED shifts CANCELLED"
      - "projected_subsidy_cents → 0; disbursed_subsidy_cents set to actual_subsidy_cents"
      - "calculations.grant_ledger re-runs: committed falls, disbursed rises, funding_posture may flip and one DEFERRED support request may be promoted"
      - "JobOpening.filled_count decremented, remaining_openings raised, status may flip FILLED → OPEN"
      - "EmployerPartnership.active_placement_count decremented"
      - "Participant.stage PLACED or RETENTION → POST_RELEASE when this was the last ACTIVE placement; engagement_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND, ERR_PLACEMENT_INVALID_STATE]

  - method: POST
    path: /placements/{id}/bonding
    description: "Drives the fidelity-bonding dimension independently of employment status."
    roles: [EmployerLiaison]
    input: [to_status]
    output: Placement
    side_effects:
      - "bonding_status set; no money moves — the bond is carried by the employer partnership, not the grant"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND, ERR_BONDING_INVALID_STATE, ERR_FIDELITY_BOND_UNAVAILABLE, ERR_BONDING_CLAIM_NOT_ELIGIBLE]

  - method: POST
    path: /placements/{id}/retention-check
    description: "Records a 30 / 60 / 90-day retention milestone and any recidivism event."
    roles: [CaseManager]
    input: [milestone_days, outcome, "recidivism_event?"]
    output: Placement
    side_effects:
      - "retention_30_outcome, retention_60_outcome or retention_90_outcome written from milestone_days; last_retention_check_at stamped from the logical clock"
      - "recidivism_event stored when supplied; it feeds calculations.grant_outcome_report"
      - "on milestone_days == 30 with outcome RETAINED, Participant.stage PLACED → RETENTION"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND, ERR_PLACEMENT_INVALID_STATE, ERR_MILESTONE_NOT_REACHED, ERR_MILESTONE_ALREADY_RECORDED]

  - method: POST
    path: /placements/{id}/work-shifts
    description: |
      Schedules a subsidised work shift. Enforces the supervision work window, the
      participant's readiness-session commitments with a commute buffer, shift
      overlap, the per-placement subsidy cap and grant availability.
    roles: [CaseManager]
    input: [starts_at, ends_at]
    output: WorkShift
    side_effects:
      - "scheduled_hours computed from the interval; status SCHEDULED; Placement.projected_subsidy_cents recomputed by the PROJECTED variant of calculations.wage_subsidy_total"
      - "Placement.schedule_compliance recomputed (stays COMPLIANT while no shift is CONFLICTED)"
      - "calculations.grant_ledger re-runs, raising FunderGrant.committed_cents by the increase in projected_subsidy_cents"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND, ERR_PLACEMENT_INVALID_STATE, ERR_WORK_NOT_AUTHORIZED, ERR_SHIFT_OUTSIDE_WINDOW, ERR_SHIFT_IN_PAST, ERR_SHIFT_OVERLAP, ERR_SHIFT_CONFLICTS_SESSION, ERR_SUBSIDY_CAP_EXCEEDED, ERR_GRANT_FUNDS_INSUFFICIENT]

  - method: GET
    path: /placements/{id}/work-shifts
    description: "Sub-resource list of the placement's shifts, ordered starts_at ASC."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "status?"]
    output: WorkShift[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION, ERR_PLACEMENT_NOT_FOUND]

  # ---- WorkShift -----------------------------------------------------------
  - method: GET
    path: /work-shifts/{id}
    description: "Reads one work shift."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: WorkShift
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_WORK_SHIFT_NOT_FOUND]

  - method: GET
    path: /work-shifts
    description: "Lists work shifts; filter by placement_id."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "placement_id?", "status?", "conflict_reason?"]
    output: WorkShift[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /work-shifts/{id}/status
    description: "Marks a shift worked or cancels it."
    roles: [CaseManager]
    input: [to_status]
    output: WorkShift
    side_effects:
      - "on WORKED, Placement.actual_subsidy_cents recomputed by the ACTUAL variant; projected_subsidy_cents is unchanged"
      - "on CANCELLED, Placement.projected_subsidy_cents falls, schedule_compliance recomputes and calculations.grant_ledger re-runs, possibly promoting a DEFERRED support request"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_WORK_SHIFT_NOT_FOUND, ERR_WORK_SHIFT_INVALID_STATE, ERR_PLACEMENT_INVALID_STATE]

  # ---- SupportRequest ------------------------------------------------------
  - method: POST
    path: /support-requests
    description: |
      Requests supportive-services funding (tools, uniforms, transit passes,
      licence fees). OCC-guarded on the grant. Prices the request through
      calculations.support_request_award then calculations.support_request_settlement
      before applying the per-participant cap.
    roles: [CaseManager]
    input: [participant_id, grant_id, category, expected_grant_version, line_items, justification]
    output: SupportRequest
    side_effects:
      - "status SUBMITTED; submitted_by_user_id set from X-User-ID; info_rounds_used 0"
      - "requested_cents, per-line line_award_cents, admin_fee_cents and total_charge_cents computed"
      - "FunderGrant.open_request_count incremented and the grant's version advanced; no money is committed yet"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_STALE_GRANT_VERSION, ERR_PARTICIPANT_SUSPENDED, ERR_GRANT_EXHAUSTED, ERR_CATEGORY_NOT_FUNDABLE, ERR_PARTICIPANT_CAP_EXCEEDED]

  - method: GET
    path: /support-requests/{id}
    description: "Reads one support request with its priced line items."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: SupportRequest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_SUPPORT_REQUEST_NOT_FOUND]

  - method: GET
    path: /support-requests
    description: "Lists support requests; filter by participant_id or grant_id."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "participant_id?", "grant_id?", "status?"]
    output: SupportRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]
    note: "Default ordering created_at ASC; DEFERRED rows are additionally ordered by deferred_at ASC when status=DEFERRED is supplied."

  - method: POST
    path: /support-requests/{id}/review
    description: |
      Director decision. An APPROVED decision lands in APPROVED when the grant can
      cover the charge and in DEFERRED when the grant is RESTRICTED and short.
      Segregation of duties: the submitter may not review.
    roles: [ProgramDirector]
    input: [decision, "review_note?"]
    output: SupportRequest
    side_effects:
      - "reviewed_by_user_id set from X-User-ID"
      - "on APPROVED, FunderGrant.committed_cents rises by total_charge_cents and calculations.grant_ledger re-runs, possibly flipping funding_posture"
      - "on the DEFERRED landing, deferred_at is stamped and no money moves"
      - "on INFO_REQUESTED or DENIED, no money moves"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SUPPORT_REQUEST_NOT_FOUND, ERR_SUPPORT_REQUEST_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_INFO_ROUNDS_EXHAUSTED]

  - method: POST
    path: /support-requests/{id}/resubmit
    description: "Case manager answers an information request, optionally repricing the line items."
    roles: [CaseManager]
    input: ["line_items?", "justification?"]
    output: SupportRequest
    side_effects:
      - "status INFO_REQUESTED → SUBMITTED and info_rounds_used incremented"
      - "when line_items is supplied, requested_cents, admin_fee_cents and total_charge_cents are recomputed and the per-participant cap is re-applied excluding this request's own prior total"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SUPPORT_REQUEST_NOT_FOUND, ERR_SUPPORT_REQUEST_INVALID_STATE, ERR_INFO_ROUNDS_EXHAUSTED, ERR_CATEGORY_NOT_FUNDABLE, ERR_PARTICIPANT_CAP_EXCEEDED]

  - method: POST
    path: /support-requests/{id}/settle
    description: |
      Disburses or voids an approved request. Segregation of duties: the reviewer
      may not settle. A void releases the commitment and re-runs the deferral
      waterfall.
    roles: [ProgramDirector]
    input: [to_status, "settlement_note?"]
    output: SupportRequest
    side_effects:
      - "settled_by_user_id set from X-User-ID"
      - "on DISBURSED, committed_cents falls and disbursed_cents rises by total_charge_cents; available_cents is unchanged"
      - "on VOIDED from APPROVED, committed_cents falls, available_cents rises, funding_posture may flip and calculations.deferred_request_promotion may promote the head of the DEFERRED queue"
      - "on VOIDED from DEFERRED, no money moves"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SUPPORT_REQUEST_NOT_FOUND, ERR_SUPPORT_REQUEST_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # ---- ReadinessSession ----------------------------------------------------
  - method: POST
    path: /readiness-sessions
    description: |
      Schedules an employment-readiness session (disclosure coaching, interview
      practice, resume workshop). Refuses to double-book a coach on overlapping
      half-open intervals; back-to-back sessions are allowed.
    roles: [CaseManager]
    input: [session_type, coach_user_id, starts_at, ends_at, seat_capacity]
    output: ReadinessSession
    side_effects:
      - "status SCHEDULED; enrolled_count 0; remaining_seats equals seat_capacity"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_COACH_DOUBLE_BOOKED]

  - method: GET
    path: /readiness-sessions/{id}
    description: "Reads one readiness session with its seat counters."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: ReadinessSession
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_SESSION_NOT_FOUND]

  - method: GET
    path: /readiness-sessions
    description: "Lists readiness sessions."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "status?", "session_type?", "coach_user_id?"]
    output: ReadinessSession[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /readiness-sessions/{id}/status
    description: "Holds or cancels a session."
    roles: [CaseManager]
    input: [to_status]
    output: ReadinessSession
    side_effects:
      - "on HELD, every still-ENROLLED enrollment becomes NO_SHOW and the seat counters do not move"
      - "on CANCELLED, every ENROLLED enrollment becomes WITHDRAWN, enrolled_count falls to 0 and remaining_seats returns to seat_capacity"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SESSION_NOT_FOUND, ERR_SESSION_INVALID_STATE]

  - method: POST
    path: /readiness-sessions/{id}/enrollments
    description: "Enrols a participant in a readiness session, consuming a seat."
    roles: [CaseManager]
    input: [participant_id, "disclosure_script_reviewed?"]
    output: SessionEnrollment
    side_effects:
      - "status ENROLLED; ReadinessSession.enrolled_count incremented and remaining_seats decremented"
      - "the enrollment enters the commute-buffer conflict set used by POST /placements/{id}/work-shifts"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_SESSION_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_SESSION_INVALID_STATE, ERR_PARTICIPANT_SUSPENDED, ERR_SESSION_ALREADY_STARTED, ERR_SESSION_FULL, ERR_DUPLICATE_ENROLLMENT]

  - method: GET
    path: /readiness-sessions/{id}/enrollments
    description: "Sub-resource list of the session's enrollments."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "status?"]
    output: SessionEnrollment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION, ERR_SESSION_NOT_FOUND]

  # ---- SessionEnrollment ---------------------------------------------------
  - method: GET
    path: /enrollments/{id}
    description: "Reads one session enrollment."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: SessionEnrollment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ENROLLMENT_NOT_FOUND]

  - method: GET
    path: /enrollments
    description: "Lists enrollments; filter by participant_id or session_id."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "session_id?", "participant_id?", "status?"]
    output: SessionEnrollment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]

  - method: POST
    path: /enrollments/{id}/status
    description: "Records attendance or withdraws the participant."
    roles: [CaseManager]
    input: [to_status]
    output: SessionEnrollment
    side_effects:
      - "on ATTENDED, the enrollment starts contributing to calculations.job_match_score.readiness_component"
      - "on WITHDRAWN, ReadinessSession.enrolled_count is decremented and remaining_seats incremented"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_ENROLLMENT_NOT_FOUND, ERR_ENROLLMENT_INVALID_STATE, ERR_SESSION_INVALID_STATE]

# =============================================================================
# §1.6 Error Catalogue — every code is reachable from at least one endpoint
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, message: "Authentication required", raised_by: "every endpoint except POST /_clock/set_current_utc" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, message: "Role not permitted for this operation", raised_by: "every endpoint with a roles list" }
  - { error_id: ERR_VALIDATION, http_status: 422, message: "Request body or query parameters are invalid", raised_by: "every endpoint with a body or query parameters" }

  - { error_id: ERR_PARTICIPANT_NOT_FOUND, http_status: 404, message: "Participant not found", raised_by: "participant paths and participant_id body references" }
  - { error_id: ERR_SUPERVISION_CASE_NOT_FOUND, http_status: 404, message: "Supervision case not found", raised_by: "supervision-case paths" }
  - { error_id: ERR_PARTNERSHIP_NOT_FOUND, http_status: 404, message: "Employer partnership not found", raised_by: "partnership paths and partnership_id body references" }
  - { error_id: ERR_JOB_OPENING_NOT_FOUND, http_status: 404, message: "Job opening not found", raised_by: "job-opening paths and job_opening_id body references" }
  - { error_id: ERR_PLACEMENT_NOT_FOUND, http_status: 404, message: "Placement not found", raised_by: "placement paths" }
  - { error_id: ERR_WORK_SHIFT_NOT_FOUND, http_status: 404, message: "Work shift not found", raised_by: "work-shift paths" }
  - { error_id: ERR_GRANT_NOT_FOUND, http_status: 404, message: "Funder grant not found", raised_by: "grant paths and grant_id body references" }
  - { error_id: ERR_SUPPORT_REQUEST_NOT_FOUND, http_status: 404, message: "Support request not found", raised_by: "support-request paths" }
  - { error_id: ERR_SESSION_NOT_FOUND, http_status: 404, message: "Readiness session not found", raised_by: "readiness-session paths" }
  - { error_id: ERR_ENROLLMENT_NOT_FOUND, http_status: 404, message: "Session enrollment not found", raised_by: "enrollment paths" }

  - { error_id: ERR_NOT_CASE_OFFICER, http_status: 403, message: "Caller is not the supervising officer of this case", raised_by: "POST /supervision-cases/{id}/status, POST /supervision-cases/{id}/work-authorization" }
  - { error_id: ERR_NOT_PLACEMENT_PARTICIPANT, http_status: 403, message: "Caller is not the participant on this placement", raised_by: "POST /placements/{id}/offer-response" }

  - { error_id: ERR_STALE_PARTICIPANT_VERSION, http_status: 412, message: "expected_participant_version does not match the current participant version", raised_by: "PUT /participants/{id}/release-plan" }
  - { error_id: ERR_STALE_GRANT_VERSION, http_status: 412, message: "expected_grant_version does not match the current grant version", raised_by: "POST /support-requests" }
  - { error_id: ERR_STALE_JOB_OPENING_VERSION, http_status: 412, message: "expected_job_opening_version does not match the current job opening version", raised_by: "POST /placements" }

  - { error_id: ERR_PARTICIPANT_INVALID_STATE, http_status: 409, message: "Participant is not in a state that allows this operation", raised_by: "participant writes and stage / license-relief transitions" }
  - { error_id: ERR_SUPERVISION_CASE_INVALID_STATE, http_status: 409, message: "Supervision case is not in a state that allows this operation", raised_by: "POST /supervision-cases/{id}/status, POST /supervision-cases/{id}/work-authorization" }
  - { error_id: ERR_PARTNERSHIP_INVALID_STATE, http_status: 409, message: "Employer partnership is not in a state that allows this transition", raised_by: "POST /employer-partnerships/{id}/status, POST /employer-partnerships/{id}/bonding-agreement" }
  - { error_id: ERR_PLACEMENT_INVALID_STATE, http_status: 409, message: "Placement is not in a state that allows this operation", raised_by: "placement action endpoints and POST /placements/{id}/work-shifts" }
  - { error_id: ERR_BONDING_INVALID_STATE, http_status: 409, message: "Bonding status does not allow this transition", raised_by: "POST /placements/{id}/bonding" }
  - { error_id: ERR_WORK_SHIFT_INVALID_STATE, http_status: 409, message: "Work shift is not in a state that allows this transition", raised_by: "POST /work-shifts/{id}/status" }
  - { error_id: ERR_SUPPORT_REQUEST_INVALID_STATE, http_status: 409, message: "Support request is not in a state that allows this operation", raised_by: "support-request review, resubmit and settle" }
  - { error_id: ERR_SESSION_INVALID_STATE, http_status: 409, message: "Readiness session is not in a state that allows this operation", raised_by: "POST /readiness-sessions/{id}/status, enrollment writes" }
  - { error_id: ERR_ENROLLMENT_INVALID_STATE, http_status: 409, message: "Enrollment is not in a state that allows this transition", raised_by: "POST /enrollments/{id}/status" }

  - { error_id: ERR_PARTICIPANT_SUSPENDED, http_status: 409, message: "Participant is suspended from programme activity", raised_by: "POST /placements, POST /placements/{id}/offer-response, POST /support-requests, POST /readiness-sessions/{id}/enrollments" }
  - { error_id: ERR_PARTNERSHIP_NOT_ACTIVE, http_status: 409, message: "Employer partnership is not ACTIVE", raised_by: "POST /placements, POST /placements/{id}/offer-response" }
  - { error_id: ERR_WORK_NOT_AUTHORIZED, http_status: 409, message: "Participant has no active supervision case with approved work authorization", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_GRANT_EXHAUSTED, http_status: 409, message: "Funder grant has no available funds", raised_by: "POST /support-requests" }

  - { error_id: ERR_RECORD_CATEGORY_BARRED, http_status: 409, message: "A record category of this participant is barred by the opening or the employer", raised_by: "POST /placements" }
  - { error_id: ERR_LICENSE_RELIEF_REQUIRED, http_status: 409, message: "Opening requires an occupational licence for which relief has not been granted", raised_by: "POST /placements" }
  - { error_id: ERR_FIDELITY_BOND_UNAVAILABLE, http_status: 409, message: "Employer partnership does not carry fidelity bonding", raised_by: "POST /placements, POST /placements/{id}/bonding" }
  - { error_id: ERR_BONDING_CLAIM_NOT_ELIGIBLE, http_status: 409, message: "A bond may only be claimed after a for-cause separation", raised_by: "POST /placements/{id}/bonding" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, message: "The same user may not perform both steps of this control", raised_by: "POST /support-requests/{id}/review, POST /support-requests/{id}/settle" }

  - { error_id: ERR_SHIFT_OUTSIDE_WINDOW, http_status: 409, message: "Shift falls outside the approved supervision work window", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_SHIFT_IN_PAST, http_status: 409, message: "Shift must start after the current time", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_SHIFT_OVERLAP, http_status: 409, message: "Shift overlaps another shift of this participant", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_SHIFT_CONFLICTS_SESSION, http_status: 409, message: "Shift conflicts with an enrolled readiness session once the commute buffer is applied", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_COACH_DOUBLE_BOOKED, http_status: 409, message: "Coach already has a scheduled session overlapping this interval", raised_by: "POST /readiness-sessions" }
  - { error_id: ERR_SESSION_ALREADY_STARTED, http_status: 409, message: "Session has already started", raised_by: "POST /readiness-sessions/{id}/enrollments" }
  - { error_id: ERR_MILESTONE_NOT_REACHED, http_status: 409, message: "Retention milestone has not yet elapsed", raised_by: "POST /placements/{id}/retention-check" }
  - { error_id: ERR_MILESTONE_ALREADY_RECORDED, http_status: 409, message: "Retention outcome for this milestone is already recorded", raised_by: "POST /placements/{id}/retention-check" }

  - { error_id: ERR_JOB_OPENING_NOT_OPEN, http_status: 409, message: "Job opening has no remaining openings", raised_by: "POST /placements" }
  - { error_id: ERR_PARTNERSHIP_CAPACITY_REACHED, http_status: 409, message: "Employer partnership is at its concurrent placement limit", raised_by: "POST /placements/{id}/offer-response" }
  - { error_id: ERR_SESSION_FULL, http_status: 409, message: "Readiness session has no remaining seats", raised_by: "POST /readiness-sessions/{id}/enrollments" }
  - { error_id: ERR_DUPLICATE_ENROLLMENT, http_status: 409, message: "Participant is already enrolled in this session", raised_by: "POST /readiness-sessions/{id}/enrollments" }
  - { error_id: ERR_DUPLICATE_PLACEMENT, http_status: 409, message: "Participant already holds a live placement on this opening", raised_by: "POST /placements" }
  - { error_id: ERR_INFO_ROUNDS_EXHAUSTED, http_status: 409, message: "No information-request rounds remain on this support request", raised_by: "POST /support-requests/{id}/review, POST /support-requests/{id}/resubmit" }
  - { error_id: ERR_PETITION_ROUNDS_EXHAUSTED, http_status: 409, message: "No petition rounds remain for this licence-relief petition", raised_by: "POST /participants/{id}/license-relief" }
  - { error_id: ERR_DOCUMENT_NOT_REQUIRED, http_status: 409, message: "Document type is not required for this participant or is already verified", raised_by: "POST /participants/{id}/document-verifications" }
  - { error_id: ERR_PARTNERSHIP_HAS_ACTIVE_PLACEMENTS, http_status: 409, message: "Partnership still has active placements", raised_by: "POST /employer-partnerships/{id}/status" }
  - { error_id: ERR_BOND_ALREADY_RECORDED, http_status: 409, message: "This partnership already carries a recorded fidelity bonding agreement", raised_by: "POST /employer-partnerships/{id}/bonding-agreement" }
  - { error_id: ERR_PARTICIPANT_HAS_ACTIVE_PLACEMENT, http_status: 409, message: "Participant still has an active placement", raised_by: "POST /participants/{id}/exit" }

  - { error_id: ERR_CATEGORY_NOT_FUNDABLE, http_status: 409, message: "A line item category is not fundable under this grant", raised_by: "POST /support-requests, POST /support-requests/{id}/resubmit" }
  - { error_id: ERR_PARTICIPANT_CAP_EXCEEDED, http_status: 409, message: "Request would exceed the grant's per-participant cap", raised_by: "POST /support-requests, POST /support-requests/{id}/resubmit" }
  - { error_id: ERR_SUBSIDY_CAP_EXCEEDED, http_status: 409, message: "Shift would push the placement past its wage-subsidy cap", raised_by: "POST /placements/{id}/work-shifts" }
  - { error_id: ERR_GRANT_FUNDS_INSUFFICIENT, http_status: 409, message: "Grant has insufficient available funds for this commitment", raised_by: "POST /placements/{id}/work-shifts" }

# =============================================================================
# §1.7 RBAC Table — role_model: segregation_of_duties
# Identity arrives in the X-User-ID header. Roles are opaque except Participant,
# whose user id IS a Participant.id.
# =============================================================================
roles:
  - name: CaseManager
    identity: opaque
    description: "Reentry case manager. Owns intake, assessment, document gathering, release planning, matching, shift scheduling, readiness sessions and support-request submission."
    exclusive_operations:
      - "POST /participants"
      - "PUT /participants/{id}"
      - "POST /participants/{id}/assessment"
      - "POST /participants/{id}/document-verifications"
      - "PUT /participants/{id}/release-plan"
      - "POST /participants/{id}/release"
      - "POST /placements"
      - "POST /placements/{id}/retention-check"
      - "POST /placements/{id}/work-shifts"
      - "POST /work-shifts/{id}/status"
      - "POST /support-requests"
      - "POST /support-requests/{id}/resubmit"
      - "POST /readiness-sessions"
      - "POST /readiness-sessions/{id}/status"
      - "POST /readiness-sessions/{id}/enrollments"
      - "POST /enrollments/{id}/status"
    shared_operations:
      - "POST /participants/{id}/license-relief (shared with ProgramDirector)"
      - "every GET except GET /grants/{id}/ledger and GET /grants/{id}/outcome-report"
      - "GET /job-openings/{id}/match-preview (shared with EmployerLiaison and ProgramDirector)"
      - "POST /_clock/set_current_utc"

  - name: EmployerLiaison
    identity: opaque
    description: "Employer partnership developer. Owns partnerships, job postings, separations and fidelity bonding."
    exclusive_operations:
      - "POST /employer-partnerships"
      - "POST /employer-partnerships/{id}/status"
      - "POST /job-openings"
      - "POST /placements/{id}/separate"
      - "POST /placements/{id}/bonding"
    shared_operations:
      - "every GET except GET /grants/{id}/ledger and GET /grants/{id}/outcome-report"
      - "GET /job-openings/{id}/match-preview (shared with CaseManager and ProgramDirector)"
      - "POST /_clock/set_current_utc"

  - name: ProgramDirector
    identity: opaque
    description: "Programme director. Approves release plans, suspends and exits participants, and is the reviewer and settler of supportive-services money."
    exclusive_operations:
      - "POST /participants/{id}/release-plan/approve"
      - "POST /participants/{id}/suspension"
      - "POST /participants/{id}/exit"
      - "POST /support-requests/{id}/review"
      - "POST /support-requests/{id}/settle"
    shared_operations:
      - "POST /participants/{id}/license-relief (shared with CaseManager)"
      - "GET /grants/{id}/ledger and GET /grants/{id}/outcome-report (shared with FunderAnalyst)"
      - "GET /job-openings/{id}/match-preview (shared with CaseManager and EmployerLiaison)"
      - "every other GET"
      - "POST /_clock/set_current_utc"
    segregation_of_duties:
      - "The director whose X-User-ID equals SupportRequest.submitted_by_user_id may not review it (ERR_SEGREGATION_OF_DUTIES)."
      - "The director whose X-User-ID equals SupportRequest.reviewed_by_user_id may not settle it (ERR_SEGREGATION_OF_DUTIES)."

  - name: SupervisionOfficer
    identity: opaque
    description: "Probation or parole officer. Owns the supervision case and the work-authorization window, and may act only on cases whose officer_user_id is their own user id."
    exclusive_operations:
      - "POST /supervision-cases"
      - "POST /supervision-cases/{id}/status"
      - "POST /supervision-cases/{id}/work-authorization"
    shared_operations:
      - "every GET except GET /grants/{id}/ledger, GET /grants/{id}/outcome-report and GET /job-openings/{id}/match-preview"
      - "POST /_clock/set_current_utc"
    ownership_rule: "X-User-ID must equal SupervisionCase.officer_user_id on both case action endpoints, else ERR_NOT_CASE_OFFICER (403)."

  - name: Participant
    identity: "entity_backed:Participant"
    description: "The participant acting for themselves. May only respond to their own placement offers."
    exclusive_operations:
      - "POST /placements/{id}/offer-response"
    shared_operations:
      - "every GET except GET /grants/{id}/ledger, GET /grants/{id}/outcome-report and GET /job-openings/{id}/match-preview"
      - "POST /_clock/set_current_utc"
    ownership_rule: "X-User-ID must equal Placement.participant_id, else ERR_NOT_PLACEMENT_PARTICIPANT (403)."

  - name: FunderAnalyst
    identity: opaque
    description: "Funder-side analyst. Records grants and reads outcome reporting; touches no participant, employment or money workflow."
    exclusive_operations:
      - "POST /grants"
    shared_operations:
      - "GET /grants/{id}/ledger and GET /grants/{id}/outcome-report (shared with ProgramDirector)"
      - "every other GET except GET /job-openings/{id}/match-preview"
      - "POST /_clock/set_current_utc"
