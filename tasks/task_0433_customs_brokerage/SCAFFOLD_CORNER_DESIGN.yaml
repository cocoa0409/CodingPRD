          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_settle_blocked_until_all_entries_liquidated
          rationale: "ERR_INVALID_STATE blocking settle while an entry is still RELEASED is asserted by the named §1.8 cross-entity instance."

      - name: exam_slot_half_open_overlap_stub
        claim_type: Temporal validation
        grounds:
          - validations[priority=18]
          - errors[ERR_EXAM_SLOT_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exam_slot_half_open_overlap_same_station_rejected
          rationale: "ERR_EXAM_SLOT_OVERLAP for overlapping half-open windows on one station is asserted by the named §1.8 overlap instance."

      - name: statement_period_overlap_stub
        claim_type: Temporal validation
        grounds:
          - validations[priority=19]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / statement_calendar_month_overlap_rejected
          rationale: "ERR_STATEMENT_PERIOD_OVERLAP for a duplicate calendar-month OPEN statement is asserted by the named §1.8 overlap instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_entry_version_psc_conflict_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[psc-create-stale-entry]
          - errors[ERR_STALE_ENTRY_VERSION]
        excluded_because:
          difficulty_instance: dual_variant_calc / psc_grant_adjustment_vs_zero_when_preference_verified
          rationale: "The OCC happy path is covered above (occ_correct_version_psc_submission_succeeds); the stale-version reject path's value (412 on a mismatched expected_entry_version) is exercised through the version-pinned PSC chains the §1.8 instances build, and the dedicated negative assertion belongs to the unit-test layer's OCC test for concurrency_rules[psc-create-stale-entry]."

      - name: bond_liability_conserved_on_liquidation_reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Bond.fields.outstanding_liability_cents
          - entities.CustomsEntry.fields.total_duties_owed_cents
        excluded_because:
