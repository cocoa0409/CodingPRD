            - call: "GET /districts/${d_id}/schools/${s_id}/students/${q_id}/plans/${p_id}"
              payload: {}
              as: TeamLead
              captures: { final_fidelity: $.data.fidelity_pct }
          assert:
            # Week 1: 4/5 → floor(4*100/5) = 80
            # Week 2: 3/3 → floor(3*100/3) = 100
            # Plan fidelity: floor((80+100)/2) = 90
            - "StudentPlan.fidelity_pct == 90 (per-week floor then average floor)"
            - "Naive sum-then-divide 7*100/8 = 87.5 → 87 is INCORRECT under the pinned order; the divergence is the testable claim"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities, both non-linear
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: student_plan_pause_resume_cycle
        grounds:
          - state_machines.StudentPlan.ACTIVE_to_PAUSED
          - state_machines.StudentPlan.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          StudentPlan exhibits a CYCLE: ACTIVE→PAUSED→ACTIVE→PAUSED is legal repeatedly
          (capacity is decremented on pause and re-incremented on resume). A purely linear
          machine would forbid the second pause.
        test_recipe:
          setup:
            - "Plan P ACTIVE on student R (TIER_2 ratified via screening path)"
            - "Interventionist I capacity 600, currently committed 90 (plan P weekly_minute_cost)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "R", grade_level: 3 }
              as: SchoolRegistrar
              captures: { r_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${r_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${r_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${r_id}"
              payload: {}
              as: TeamLead
              captures: { r_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${r_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "X", subject: "READING", tier_target: "TIER_2", grade_min: 3, grade_max: 5, session_minutes: 30, sessions_per_week: 3, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 600, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${r_id}"
              payload: {}
              as: TeamLead
              captures: { r_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${r_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${r_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id, p_v0: $.data.version }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${r_id}/plans/${p_id}/pause"
              payload: { expected_plan_version: "${p_v0}" }
