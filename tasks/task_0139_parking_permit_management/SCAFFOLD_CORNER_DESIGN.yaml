  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_zone_version_activate_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-activate-stale-zone-capacity]", state_machines.Permit.REQUESTED_to_ACTIVE]
        distinguishing_aspect: "Activation carrying the current expected_zone_version succeeds and bumps Zone.version by 1."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5 (version 1); a REQUESTED permit P."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "occ@x.com", default_plate: "OCC111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "OCC111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
              captures: { st: $.data.status }
          assert:
            - "Permit.${p_id}.status == ACTIVE"
            - "Zone.${z_id}.version == 2"
            - "Zone.${z_id}.permits_active_count == 1"

      - name: occ_stale_zone_version_activate_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-activate-stale-zone-capacity]", "errors[ERR_STALE_ZONE_VERSION]"]
        distinguishing_aspect: "An activation carrying a stale expected_zone_version (the pre-activation value after another activation bumped it) → 412 ERR_STALE_ZONE_VERSION."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5; two REQUESTED permits P1 and P2. P1 is activated first (bumps zone version), leaving the originally-observed version stale for P2."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v_stale: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M1", email: "st1@x.com", default_plate: "STA111" }
              as: FacilityAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M2", email: "st2@x.com", default_plate: "STA222" }
              as: FacilityAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m1_id}", plate: "STA111" }
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m2_id}", plate: "STA222" }
              as: Motorist
              as_user_id: "${m2_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /parking/permits/${p1_id}/activate"
              payload: { expected_zone_version: "${z_v_stale}" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/permits/${p2_id}/activate"
              payload: { expected_zone_version: "${z_v_stale}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_ZONE_VERSION"
            - "Permit.${p2_id}.status == REQUESTED"

      - name: citation_pay_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: [state_machines.Citation.ISSUED_to_PAID, "errors[ERR_STALE_ZONE_VERSION]"]
        distinguishing_aspect: "Paying a citation with a stale expected_citation_version (one behind the value bumped by an intervening appeal-uphold/dismiss) → 412 ERR_STALE_ZONE_VERSION."
        test_recipe:
          setup:
            - "Garage G; Motorist M (plate STC111); an ISSUED citation C captured at version v0; an appeal is dismissed which flips C to UPHELD and bumps its version, leaving v0 stale."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "stc@x.com", default_plate: "STC111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "STC111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "STC111", plate_read_id: "${r_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /parking/appeals"
              payload: { citation_id: "${c_id}", motorist_id: "${m_id}", reason: "x" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /parking/appeals/${a_id}/decide"
              payload: { decision: "DISMISSED" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /parking/citations/${c_id}/pay"
              payload: { expected_citation_version: "${c_v0}" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_ZONE_VERSION"
            - "Citation.${c_id}.status == UPHELD"

      - name: manual_promote_waitlist_creates_requested_permit
        claim_type: cascading_side_effects
        grounds: [endpoints, state_machines.PermitWaitlistEntry.WAITING_to_PROMOTED, entities.PermitWaitlistEntry.fields.promoted_permit_id]
        distinguishing_aspect: "POST /parking/zones/{id}/promote-waitlist with free capacity promotes the lowest-sequence WAITING entry to PROMOTED and sets promoted_permit_id to a new REQUESTED permit."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 1 with zero ACTIVE permits (free slot); one WAITING entry W1."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 1, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M1", email: "pw1@x.com", default_plate: "PWL111" }
              as: FacilityAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /parking/zones/${z_id}/waitlist"
              payload: { motorist_id: "${m1_id}", plate: "PWL111" }
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /parking/zones/${z_id}/promote-waitlist"
              payload: {}
              as: FacilityAdmin
              captures: { st: $.data.status, pid: $.data.promoted_permit_id }
          assert:
            - "PermitWaitlistEntry.${w1_id}.status == PROMOTED"
            - "PermitWaitlistEntry.${w1_id}.promoted_permit_id is a non-null Permit id"

      - name: event_multiplier_threshold_inside_vs_outside_window
        claim_type: rate_threshold_triggers
        grounds: [calculations.transient_charge, entities.EventPricing.fields.window_end_utc]
        distinguishing_aspect: "A session whose entry is at the exclusive window_end_utc (18:00) is NOT surcharged (half-open [start,end)), so gross is the plain metered amount, unlike one entering at 17:59."
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, grace 15). PUBLISHED window [09:00, 18:00) multiplier 2.0 flat 1000."
            - "A session enters exactly at 18:00 (window end, exclusive) and exits 19:00 (60 min)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/event-pricing"
              payload: { garage_id: "${g_id}", name: "E", window_start_utc: "2026-06-01T09:00:00Z", window_end_utc: "2026-06-01T18:00:00Z", flat_surcharge_cents: 1000, multiplier: 2.0 }
              as: FacilityAdmin
              captures: { ep_id: $.data.id }
            - call: "POST /parking/event-pricing/${ep_id}/publish"
              payload: {}
              as: FacilityAdmin
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T18:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "WIN111", entry_at_utc: "2026-06-01T18:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T19:00:00Z" }
              as: FacilityAdmin
              captures: { gross: $.data.gross_charge_cents }
          assert:
            - "AccessSession.${sess_id}.gross_charge_cents == 500"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_balance_visible_immediately_after_citation
        claim_type: immediate
        grounds: [entities.Motorist.fields.outstanding_balance_cents, state_machines.Citation.ISSUED_to_PAID]
        distinguishing_aspect: "Issuing a citation immediately reflects amount_due_cents in Motorist.outstanding_balance_cents in the same request cycle (GET right after shows the updated balance)."
        test_recipe:
          setup:
            - "Garage G; Motorist M (plate IMB111); one citation issued (amount 5000)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "imb@x.com", default_plate: "IMB111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "IMB111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { garage_id: "${g_id}", plate: "IMB111", plate_read_id: "${r_id}", violation_code: "NO_PERMIT", base_fine_cents: 5000 }
              as: EnforcementOfficer
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /parking/motorists/${m_id}"
              payload: {}
              as: FacilityAdmin
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Motorist.${m_id}.outstanding_balance_cents == 5000"
