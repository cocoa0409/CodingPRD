              captures: { s1: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Billing", business_unit: "Finance", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
