              as: Client
              as_user_id: "${client_id}"
              captures: { sess_c: $.data.id, sess_c_status: $.data.status }
          assert:
            - "the overlapping booking response error_id == ERR_CLIENT_SLOT_CONFLICT"
            - "CoachingSession.${sess_c}.status == SCHEDULED"

  # ==========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: session_cancel_money_conservation
        grounds:
          - state_machines.CoachingSession.SCHEDULED_to_CANCELLED
          - entities.Order.fields.net_collected_cents
          - entities.Order.fields.amount_refunded_cents
        distinguishing_aspect: |
          Money invariant: booking a billable session charges 12000 and cancelling it refunds
          12000, conserving net_collected_cents = amount_charged_cents - amount_refunded_cents
          back to the pre-session 20000. Conserved quantity = money.
        test_recipe:
          setup:
            - "Plan zero included sessions, base 20000; confirmed order (net 20000); one billable COACHING session (fee 12000) booked (net 32000)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ravi Client", email: "ravi@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Rae Coach", email: "rae@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_id: $.data.id, sess_billable: $.data.billable, sess_fee: $.data.fee_cents }
          trigger:
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "CoachingSession.${sess_id}.status == CANCELLED"
            - "Order.${order_id}.amount_charged_cents == 32000"
            - "Order.${order_id}.amount_refunded_cents == 12000"
            - "Order.${order_id}.net_collected_cents == 20000"
            - "an AddOn on Order.${order_id} with source_ref == ${sess_id} has status == CANCELLED"

      - name: revision_withdraw_credit_conservation
        grounds:
          - state_machines.RevisionRequest.OPEN_to_WITHDRAWN
          - state_machines.Deliverable.IN_REVISION_to_DRAFTED
          - entities.Order.fields.revision_credits_remaining
          - entities.Order.fields.revision_credits_used
        distinguishing_aspect: |
          Credit invariant: opening a free revision consumes one credit (remaining 1 -> 0) and
          withdrawing it restores it (remaining 0 -> 1), conserving
          revision_credits_remaining = included + purchased - used. Conserved quantity = revision credits
          (a count, distinct from money).
        test_recipe:
          setup:
            - "Plan included_revision_rounds 1; confirmed order (revision_credits_remaining 1); one drafted RESUME deliverable."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Sam Client", email: "sam@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Sue Coach", email: "sue@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "free round" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /revisions/${rev1_id}/withdraw"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "before withdraw, Order.${order_id}.revision_credits_used == 1 and revision_credits_remaining == 0"
            - "after withdraw, Order.${order_id}.revision_credits_used == 0"
            - "after withdraw, Order.${order_id}.revision_credits_remaining == 1"
            - "RevisionRequest.${rev1_id}.status == WITHDRAWN"
            - "Deliverable.${deliv_id}.status == DRAFTED"
