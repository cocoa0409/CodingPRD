              captures: { p_st1: $.data.status, p_pdb: $.data.price_delta_bps, p_pu: $.data.projected_units, p_pfc: $.data.projected_food_cost_bps, p_ecap: $.data.effective_cap_price_cents, p_pcd: $.data.projected_contribution_delta_cents }
