        distinguishing_aspect: "A CHECK payout of 1100c settles but leaves ytd_cash_paid_cents==0 and form_1099_issued==false (only CASH enters the cumulative ledger)."
        test_recipe:
          setup: ["A RELEASED ticket valued 1100c with a PENDING CHECK payout."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
