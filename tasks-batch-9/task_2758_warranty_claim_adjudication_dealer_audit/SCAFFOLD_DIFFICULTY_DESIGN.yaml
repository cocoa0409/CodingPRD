      - name: labor_rate_ceiling_nested_min_max_three_way_binding
        grounds:
          - calculations.labor_rate_statutory_ceiling
          - entities.StateLawProfile.fields.labor_rate_method
          - entities.StateLawProfile.fields.max_labor_rate_cents
          - entities.LaborRateRequest.fields.statutory_ceiling_cents
          - entities.LaborRateRequest.fields.sample_median_rate_cents
        distinguishing_aspect: |
          Three inputs meet inside a nested min(cap, max(median, step_up)) whose branch is itself
          selected by labor_rate_method, so with the sample median held at 17600 the ceiling is
          governed by a different one of the three terms at each of three dealer rates: 13750 lets
          the median bind (17600, above the 17188 step-up), 15000 lets the step-up bind (18750),
          and 16000 pushes the step-up to 20000 so the statutory cap binds (19500). A
          TIME_AND_PRICE profile ignores the median entirely and applies a 10% step instead
          (10000 -> 11000), so a flattened single-expression formula cannot reproduce all four.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z."
            - "CA profile: RETAIL_SAMPLE, markup_cap_pct 0.30, min_sample_repair_orders 5, max_labor_rate_cents 19500."
            - "TX profile: TIME_AND_PRICE, markup_cap_pct 0.25, min_sample_repair_orders 0, max_labor_rate_cents 16000."
            - "Three CA dealers at approved_labor_rate_cents 13750, 15000 and 16000, plus one TX dealer at 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "TX", markup_cap_pct: 0.25, labor_rate_method: "TIME_AND_PRICE", min_sample_repair_orders: 0, max_labor_rate_cents: 16000, deemed_approved_days: 15, appeal_window_days: 20 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_tx_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-CEIL1", name: "Ceiling Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 50, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dc1_id: $.data.id, dc1_version: $.data.version }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-CEIL2", name: "Ceiling Dealer Two", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 50, initial_labor_rate_cents: 15000, initial_parts_markup_pct: 0.30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dc2_id: $.data.id, dc2_version: $.data.version }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-CEIL3", name: "Ceiling Dealer Three", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 50, initial_labor_rate_cents: 16000, initial_parts_markup_pct: 0.30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dc3_id: $.data.id, dc3_version: $.data.version }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-TX", name: "Texas Dealer", state_law_profile_id: "${slp_tx_id}", vehicles_in_operation: 50, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dtx_id: $.data.id, dtx_version: $.data.version }
          trigger:
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${dc1_id}", requested_labor_rate_cents: 17600, requested_parts_markup_pct: 0.30, sample_repair_order_count: 5, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${dc1_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${dc1_id}"
              captures: { lrr1_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${dc2_id}", requested_labor_rate_cents: 18750, requested_parts_markup_pct: 0.30, sample_repair_order_count: 5, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${dc2_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${dc2_id}"
              captures: { lrr2_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${dc3_id}", requested_labor_rate_cents: 19500, requested_parts_markup_pct: 0.30, sample_repair_order_count: 5, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${dc3_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${dc3_id}"
              captures: { lrr3_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${dtx_id}", requested_labor_rate_cents: 11000, requested_parts_markup_pct: 0.25, effective_date: "2026-06-01", expected_dealer_version: "${dtx_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${dtx_id}"
              captures: { lrr4_id: $.data.id }
          assert:
            - "LaborRateRequest.${lrr1_id}.statutory_ceiling_cents == 17600 (median 17600 beats step-up round_half_up(13750 * 1.25) == 17188, cap 19500 not binding)"
            - "LaborRateRequest.${lrr2_id}.statutory_ceiling_cents == 18750 (step-up beats the median)"
            - "LaborRateRequest.${lrr3_id}.statutory_ceiling_cents == 19500 (step-up 20000 clipped by max_labor_rate_cents)"
            - "LaborRateRequest.${lrr4_id}.statutory_ceiling_cents == 11000 (TIME_AND_PRICE branch: round_half_up(10000 * 1.10), median never consulted)"
            - "all four requests are created with status == SUBMITTED and deemed_approved == false"

  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_suspend_resubmit_cycle_with_independent_payment_dimension
        grounds:
          - state_machines.WarrantyClaim.status
          - state_machines.WarrantyClaim.payment_status
          - state_machines.PartsReturnRequest.status
          - calculations.claim_edit_engine
          - calculations.parts_non_return_debit
          - entities.ClaimEdit.fields.edit_code
        distinguishing_aspect: |
          The claim status machine is cyclic (SUBMITTED -> SUSPENDED -> SUBMITTED via resubmit)
          AND runs a second, independent payment_status dimension over the same row: the claim
          re-enters SUBMITTED with a different provisional total than it first carried, then
          reaches APPROVED while payment_status is still UNPAID, then moves UNPAID -> PAID ->
          DEBITED without its status ever leaving APPROVED. An implementation that models one
          linear status column, or that treats the debit as a status change, cannot produce the
          (APPROVED, DEBITED) combination this instance asserts.
        test_recipe:
          setup:
            - "World A fixture: clock 2026-05-01T00:00:00Z, CA profile (markup cap 0.30), dealer D1 at rate 13750 / markup 0.40, vehicle VEH1, labor op A1234-56 (standard 1.5 h, max 2.5 h), part BRK-PAD-9931 at 24799 with return_required true and retention_days 30."
            - "Claim CL_NL submitted at 2.2 claimed hours, which is above standard_time_hours and below max_time_hours, so the edit engine raises EXCESSIVE_TIME (SUSPEND) and the claim opens SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh1_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-NL-1", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 2.2, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl_nl_id: $.data.id }
            - call: "GET /warranty/claims/${cl_nl_id}/edits"
              payload: { edit_code: "EXCESSIVE_TIME" }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
              captures: { edit_id: "$.data[0].id" }
            - call: "GET /warranty/parts-returns"
              payload: { claim_id: "${cl_nl_id}" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_nl_id: "$.data[0].id" }
          trigger:
            - call: "POST /warranty/claims/${cl_nl_id}/resubmit"
              payload: { claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads, corrected the claimed time." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
            - call: "POST /warranty/claims/${cl_nl_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 1.5, approved_parts_qty: 3 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${cl_nl_id}/pay"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/parts-returns/${pr_nl_id}/receive"
              payload: { received_date: "2026-05-05" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/parts-returns/${pr_nl_id}/analysis"
              payload: { analysis_result: "NO_DEFECT_FOUND", analysis_note: "Bench test found the pads within specification." }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "at submission: WarrantyClaim.${cl_nl_id}.status == SUSPENDED with provisional_total_cents == 134407 (30250 labor + 104157 parts) and one EXCESSIVE_TIME edit of severity SUSPEND"
            - "after resubmit: status back to SUBMITTED (the cycle), provisional_total_cents == 124782, the EXCESSIVE_TIME edit carries a non-null resolved_at, and version has advanced twice"
            - "after adjudicate: status == APPROVED, approved_total_cents == 117342, payment_status STILL UNPAID"
            - "after pay: payment_status == PAID with status unchanged at APPROVED"
            - "after receive: PartsReturnRequest.${pr_nl_id}.status == RECEIVED and Dealer.${d1_id}.open_parts_return_count == 0"
            - "after analysis: PartsReturnRequest.${pr_nl_id}.status == ANALYZED, debit_amount_cents == 96717 (parts only, not the 117342 total)"
            - "WarrantyClaim.${cl_nl_id}.payment_status == DEBITED while status is STILL APPROVED"
            - "Dealer.${d1_id}.chargeback_balance_cents == 96717 and status == PROBATION (96717 >= 90000, below 200000)"

      - name: audit_findings_issued_appealed_findings_issued_loop_reentry
        grounds:
          - state_machines.DealerAudit.status
          - state_machines.AuditAppeal.status
          - state_machines.AuditFinding.status
          - calculations.audit_extrapolated_chargeback
          - entities.DealerAudit.fields.appeal_deadline
          - entities.ChargebackLedgerEntry.fields.source_type
        distinguishing_aspect: |
          DealerAudit is cyclic through a state it has already occupied: a PARTIAL appeal decision
          returns the audit FINDINGS_ISSUED -> APPEALED -> FINDINGS_ISSUED with a FRESH
          appeal_deadline and a RECOMPUTED total, so the second visit to FINDINGS_ISSUED is not
          the first one replayed. The re-entry also splits the findings of one appeal into two
          terminal states at once (one OVERTURNED, one UPHELD) and appends two separately
          attributable negative ledger rows, so a machine that treats an appeal decision as a
          single forward step to a terminal audit state fails on both the state and the money.
        test_recipe:
          setup:
            - "The audit_extrapolation_pinned_six_step_evaluation_order fixture, carried through issue-findings: audit A_B on dealer D_AUD is FINDINGS_ISSUED with sample_paid 100000, population_paid 50000, findings F1 30000 and F2 10000 both CHARGED_BACK, total_chargeback_cents 60000, balance 60000 and appeal_deadline 2026-05-31."
