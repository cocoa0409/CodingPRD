scenario: |
  Tenant Configuration, Weekly Release Adoption & Business Process Framework (Workday):
  multi-tenant architecture where all customers run the same code version with
  configuration rather than customization, weekly service updates and twice-yearly
  feature releases with customer opt-in windows and required testing, business
  process framework where approval chains, conditions and notifications are
  configured per transaction type, security groups tied to organizational
  structures with role-based and user-based assignment, tenant refresh from
  production to sandbox with configuration migration tooling, integration
  development using connectors with scheduled and event-driven execution,
  feature adoption tracking and mandatory retirement of deprecated functionality,
  implementation partner deployment methodology and tenant handoff.

domain_name: tenant-config-release-adoption
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - conditional_feature_flags
    - cascading_side_effects
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: tenant_name, type: string, source: input, description: "Customer tenant display name; unique across the platform" }
      - { name: tenant_kind, type: enum, source: input, description: "PRODUCTION | SANDBOX | IMPLEMENTATION; SANDBOX tenants are refresh targets, IMPLEMENTATION tenants are partner-built source tenants" }
      - { name: service_level_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREMIUM; PREMIUM tenants get a 14-day opt-in window extension on feature releases" }
      - { name: code_version, type: string, source: system, description: "Single shared code version label; identical on every tenant, advanced only by weekly service update application" }
      - { name: weekly_update_auto_apply, type: boolean, source: input, default: true, description: "When true, weekly service updates apply automatically at the tenant's maintenance slot; when false they queue as PENDING until acknowledged" }
      - { name: maintenance_slot_utc, type: integer, source: input, description: "Hour of day 0-23 UTC when weekly updates and refreshes may be applied" }
      - { name: refresh_source_tenant_id, type: string, source: input, description: "FK -> Tenant.id; only valid when tenant_kind == SANDBOX; identifies the PRODUCTION tenant this sandbox is refreshed from" }
      - { name: bootstrap_admin_worker_id, type: string, source: system, description: "FK -> Worker.id; system-minted bootstrap administrator Worker created at tenant creation (worker_ref BOOTSTRAP-ADMIN, org_unit_id null) so entity-backed TenantAdministrator calls have an identity before any org structure exists" }
      - { name: handoff_state, type: enum, source: system, description: "IN_BUILD → HANDOFF_READY → ACCEPTED; tracks implementation-partner deployment methodology handoff", default: "IN_BUILD" }
      - { name: adopted_feature_count, type: integer, source: computed, description: "Count of TenantFeatureAdoption rows in status ADOPTED for this tenant; incremented on adopt, decremented on forced rollback" }
      - { name: active_membership_count, type: integer, source: computed, description: "Count of SecurityGroupMembership rows in status ACTIVE across all security groups of this tenant; maintained by every membership add/remove" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED" }

  - name: OrganizationUnit
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: parent_unit_id, type: string, source: input, description: "FK -> OrganizationUnit.id; null only for the root unit; self-referential hierarchy (cycles forbidden)" }
      - { name: unit_name, type: string, source: input, description: "Org unit name; unique per tenant among non-INACTIVE units" }
      - { name: unit_type, type: enum, source: input, description: "COMPANY | COST_CENTER | DIVISION | TEAM" }
      - { name: effective_date, type: datetime, source: input, description: "Date the unit becomes ACTIVE; until then PROPOSED" }
      - { name: headcount, type: integer, source: computed, description: "Number of Worker rows with status ACTIVE whose org_unit_id resolves to this unit (direct only, not descendant units)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ACTIVE → INACTIVE" }

  - name: Worker
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: worker_ref, type: string, source: input, description: "Human-readable employee reference; unique per tenant" }
      - { name: full_name, type: string, source: input, description: "Worker full name" }
      - { name: org_unit_id, type: string, source: input, description: "FK -> OrganizationUnit.id; unit the worker belongs to; must be status ACTIVE at assignment time" }
      - { name: manager_worker_id, type: string, source: input, description: "FK -> Worker.id; manager within the same tenant; may be null for top of house; management chains must be acyclic" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: SecurityGroup
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: group_name, type: string, source: input, description: "Group name; unique per tenant among non-DISABLED groups" }
      - { name: assignment_mode, type: enum, source: input, description: "ROLE_BASED | USER_BASED; ROLE_BASED membership derives from org structure, USER_BASED membership is assigned worker-by-worker" }
      - { name: org_unit_id, type: string, source: input, description: "FK -> OrganizationUnit.id; required iff assignment_mode == ROLE_BASED; group membership derives from that unit and all descendant units" }
      - { name: min_approvers, type: integer, source: input, default: 1, description: "Minimum ACTIVE memberships required before this group may be referenced as an approver step target in a BusinessProcessStep" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED" }

  - name: SecurityGroupMembership
    parent: SecurityGroup
    common_fields: true
    fields:
      - { name: security_group_id, type: string, source: system, description: "FK -> SecurityGroup.id; owning group" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; member worker; must be status ACTIVE" }
      - { name: membership_source, type: enum, source: system, description: "ROLE_DERIVED | USER_ASSIGNED; ROLE_DERIVED rows are created and invalidated by system org-resolution, USER_ASSIGNED rows are created via the memberships endpoint" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INVALIDATED; INVALIDATED rows are retained for audit but excluded from active_membership_count and approver resolution" }

  - name: BusinessProcessDefinition
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: transaction_type, type: enum, source: input, description: "HIRE | TERMINATION | EXPENSE | ORG_CHANGE; one ACTIVE definition per (tenant, transaction_type) pair" }
      - { name: definition_name, type: string, source: input, description: "Human-readable name" }
      - { name: notify_on_initiate, type: boolean, source: input, default: true, description: "Whether a Notification is emitted to the initiator when a TransactionInstance is created" }
      - { name: escalation_after_hours, type: integer, source: input, default: 72, description: "Hours a step may sit in PENDING before the instance escalates; must be >= 24" }
      - { name: version_pin_policy, type: enum, source: input, default: "PIN_ON_INITIATE", description: "PIN_ON_INITIATE: instances capture the definition version at initiation; LATEST: in-flight instances follow definition edits" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → RETIRED" }

  - name: BusinessProcessStep
    parent: BusinessProcessDefinition
    common_fields: true
    fields:
      - { name: definition_id, type: string, source: system, description: "FK -> BusinessProcessDefinition.id; owning definition" }
      - { name: step_order, type: integer, source: input, description: "1-based ordering within the definition; must be a contiguous sequence 1..N within a definition" }
      - { name: step_kind, type: enum, source: input, description: "APPROVAL | REVIEW | NOTIFICATION" }
      - { name: approver_security_group_id, type: string, source: input, description: "FK -> SecurityGroup.id; group whose ACTIVE members may act on this step; required for APPROVAL and REVIEW steps" }
      - { name: inclusion_condition, type: enum, source: input, default: "ALWAYS", description: "ALWAYS | IF_HEADCOUNT_GE_50 | IF_CROSS_UNIT | IF_AMOUNT_GT_1000; conditional steps are skipped when the condition does not hold for the transaction's payload" }
      - { name: return_target_step_order, type: integer, source: input, description: "Step order the instance returns to when this step is returned-for-revision; must be < step_order; only valid on APPROVAL steps" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; steps are never hard-deleted once the definition has been ACTIVE" }

  - name: TransactionInstance
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: definition_id, type: string, source: system, description: "FK -> BusinessProcessDefinition.id; the definition governing this instance" }
      - { name: definition_version_pinned, type: integer, source: system, description: "BusinessProcessDefinition.version captured at initiation when the definition's version_pin_policy == PIN_ON_INITIATE; null otherwise" }
      - { name: initiator_worker_id, type: string, source: system, description: "FK -> Worker.id; worker who initiated; segregated from approvers on every APPROVAL step" }
      - { name: source_org_unit_id, type: string, source: system, description: "FK -> OrganizationUnit.id; initiator's unit at initiation; drives IF_CROSS_UNIT inclusion condition" }
      - { name: target_org_unit_id, type: string, source: input, description: "FK -> OrganizationUnit.id; org unit the transaction targets (e.g. hire-into unit); drives IF_HEADCOUNT_GE_50 and IF_CROSS_UNIT" }
      - { name: amount, type: number, source: input, default: 0, description: "Monetary amount for EXPENSE transactions; drives IF_AMOUNT_GT_1000" }
      - { name: current_step_order, type: integer, source: computed, description: "Step order of the currently PENDING step; 0 when no step is pending (terminal or not yet advanced)" }
      - { name: escalation_count, type: integer, source: computed, default: 0, description: "Number of times this instance has escalated; increments on each escalation event" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS → COMPLETED | CANCELLED; IN_PROGRESS subdivides via current_step_order and per-step PENDING/RETURNED state on TransactionStepEvent" }

  - name: TransactionStepEvent
    parent: TransactionInstance
    common_fields: false
    fields:
      - { name: instance_id, type: string, source: system, description: "FK -> TransactionInstance.id; owning instance" }
      - { name: step_order, type: integer, source: system, description: "BusinessProcessStep.step_order this event acts on" }
      - { name: action, type: enum, source: system, description: "ADVANCE | APPROVE | RETURN | SKIP | ESCALATE | NOTIFY" }
      - { name: actor_worker_id, type: string, source: system, description: "FK -> Worker.id; worker who performed the action; null for system actions (SKIP, ESCALATE, NOTIFY)" }
      - { name: comment, type: string, source: input, description: "Optional actor comment; required for RETURN" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the event" }

  - name: ReleaseTrain
    parent: null
    common_fields: true
    fields:
      - { name: release_label, type: string, source: input, description: "e.g. 'W27' for weekly service update 27 or 'F2026-R1' for feature release; unique" }
      - { name: release_kind, type: enum, source: input, description: "WEEKLY_SERVICE | FEATURE_RELEASE; FEATURE_RELEASE trains carry opt-in features, WEEKLY_SERVICE trains are mandatory" }
      - { name: opt_in_window_start, type: datetime, source: input, description: "Start of the customer opt-in window; FEATURE_RELEASE only, must be < opt_in_window_end" }
      - { name: opt_in_window_end, type: datetime, source: input, description: "End of the opt-in window (inclusive boundary: enrollments accepted at exactly this instant); after mandatory_date all features force-enable" }
      - { name: mandatory_date, type: datetime, source: input, description: "Date from which every feature on this train is force-enabled on all tenants and deprecated predecessors are retired" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED → OPT_IN_OPEN → OPT_IN_CLOSED → MANDATORY_LIVE → RETIRED" }

  - name: TenantFeatureAdoption
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; adopting tenant" }
      - { name: release_train_id, type: string, source: system, description: "FK -> ReleaseTrain.id; train carrying the feature" }
      - { name: feature_key, type: string, source: input, description: "Feature identifier within the train; unique per (tenant, release_train_id, feature_key)" }
      - { name: deprecates_feature_key, type: string, source: input, description: "Feature key this feature replaces; the deprecated predecessor must be retired on this tenant by the train's mandatory_date" }
      - { name: sandbox_test_evidence_id, type: string, source: input, description: "IntegrationRun.id or free-form evidence reference proving sandbox testing; required before ADOPTED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical timestamp when the tenant opted in" }
      - { name: status, type: enum, source: system, description: "ENROLLED → TESTING_PASSED → ADOPTED | DEFERRED | FORCE_ENABLED | ROLLED_BACK" }

  - name: IntegrationConnector
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: connector_name, type: string, source: input, description: "Connector name; unique per tenant among non-RETIRED connectors" }
      - { name: trigger_mode, type: enum, source: input, description: "SCHEDULED | EVENT_DRIVEN; SCHEDULED runs fire on cron expression, EVENT_DRIVEN runs fire on business events such as transaction completion" }
      - { name: schedule_cron, type: string, source: input, description: "Cron expression; required iff trigger_mode == SCHEDULED" }
      - { name: subscribed_event, type: enum, source: input, description: "TRANSACTION_COMPLETED | MEMBERSHIP_CHANGED | REFRESH_COMPLETED; required iff trigger_mode == EVENT_DRIVEN" }
      - { name: blackout_window_start_utc, type: integer, source: input, description: "Hour 0-23 UTC start of daily blackout window during which SCHEDULED runs are suppressed; half-open [start, end)" }
      - { name: blackout_window_end_utc, type: integer, source: input, description: "Hour 0-23 UTC end of blackout window; half-open end exclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → SUSPENDED → RETIRED" }

  - name: IntegrationRun
    parent: IntegrationConnector
    common_fields: true
    fields:
      - { name: connector_id, type: string, source: system, description: "FK -> IntegrationConnector.id; owning connector" }
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; denormalized from connector for filtering" }
      - { name: trigger_source, type: enum, source: system, description: "SCHEDULE | EVENT | MANUAL" }
      - { name: attempt_count, type: integer, source: computed, default: 1, description: "Number of execution attempts; increments on each retry; max 3" }
      - { name: records_processed, type: integer, source: computed, default: 0, description: "Records processed in this run across all attempts (cumulative)" }
      - { name: status, type: enum, source: system, description: "QUEUED → RUNNING → SUCCEEDED | FAILED | DEAD_LETTERED" }

  - name: TenantRefreshJob
    parent: Tenant
    common_fields: true
    fields:
      - { name: source_tenant_id, type: string, source: input, description: "FK -> Tenant.id; PRODUCTION tenant to copy configuration from" }
      - { name: target_tenant_id, type: string, source: system, description: "FK -> Tenant.id; SANDBOX tenant being refreshed (the parent in the URL)" }
      - { name: include_workers, type: boolean, source: input, default: false, description: "Whether worker records are copied; when true, all source ACTIVE workers are cloned into the sandbox" }
      - { name: migration_mode, type: enum, source: input, default: "FULL_COPY", description: "FULL_COPY: replace all target configuration; DELTA_ONLY: copy only definitions whose version advanced since the target's last completed refresh" }
      - { name: config_drift_score, type: integer, source: computed, description: "Number of configuration objects that differ between source and target at plan time (provisional variant) or that were actually migrated at completion time (final variant)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Logical timestamp the refresh executes at; must fall inside the target tenant's maintenance hour and must not collide with a weekly-update application on either tenant" }
      - { name: status, type: enum, source: system, description: "PLANNED → RUNNING → COMPLETED | FAILED | CANCELLED" }

  - name: Notification
    parent: Tenant
    common_fields: false
    fields:
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; owning tenant" }
      - { name: recipient_worker_id, type: string, source: system, description: "FK -> Worker.id; worker notified" }
      - { name: notification_kind, type: enum, source: system, description: "INITIATED | STEP_ASSIGNED | RETURNED | ESCALATED | RETIREMENT_WARNING | FORCE_ENABLED | REFRESH_COMPLETED" }
      - { name: reference_entity, type: string, source: system, description: "Entity type this notification references (TransactionInstance, TenantFeatureAdoption, TenantRefreshJob)" }
      - { name: reference_id, type: string, source: system, description: "Id of the referenced entity" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Tenant
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tenants/{id}/suspend"
        actor: PlatformOperator
        preconditions:
          - "No TenantRefreshJob for this tenant (as source or target) in PLANNED or RUNNING (ERR_REFRESH_IN_FLIGHT)"
        side_effects:
          - "All IntegrationConnector rows of this tenant in ACTIVE → SUSPENDED"
          - "increments Tenant.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tenants/{id}/resume"
        actor: PlatformOperator
        preconditions: []
        side_effects:
          - "increments Tenant.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tenants/{id}/retire"
        actor: PlatformOperator
        preconditions:
          - "tenant_kind == SANDBOX or IMPLEMENTATION (PRODUCTION tenants can never be retired) (ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN)"
          - "No TransactionInstance in IN_PROGRESS (ERR_OPEN_TRANSACTIONS_EXIST)"
        side_effects:
          - "All IntegrationConnector rows in any non-terminal state → RETIRED"
          - "All SecurityGroup rows → DISABLED"
          - "All SecurityGroupMembership rows in ACTIVE → INVALIDATED, decrementing active_membership_count to 0"
          - "increments Tenant.version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /tenants/{id}/retire"
        actor: PlatformOperator
        preconditions:
          - "tenant_kind == SANDBOX or IMPLEMENTATION"
          - "No TransactionInstance in IN_PROGRESS"
        side_effects:
          - "Same as ACTIVE → RETIRED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /tenants/{id}/handoff/advance (handoff_state IN_BUILD → HANDOFF_READY)"
        actor: ImplementationPartner
        preconditions:
          - "tenant_kind == IMPLEMENTATION (ERR_NOT_IMPLEMENTATION_TENANT)"
          - "At least one BusinessProcessDefinition in ACTIVE on this tenant (ERR_NO_ACTIVE_BP_DEFINITION)"
        side_effects:
          - "handoff_state → HANDOFF_READY"
          - "increments Tenant.version by 1"
        note: "Self-transition on Tenant.status; only handoff_state changes"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /tenants/{id}/handoff/advance (handoff_state HANDOFF_READY → ACCEPTED)"
        actor: TenantAdministrator
        preconditions:
          - "handoff_state == HANDOFF_READY (ERR_INVALID_STATE)"
          - "The acting TenantAdministrator's worker record must belong to a different tenant-scoped security group than the partner who advanced to HANDOFF_READY (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "handoff_state → ACCEPTED; tenant is now customer-owned"
          - "increments Tenant.version by 1"

  - entity: OrganizationUnit
    initial_state: PROPOSED
    terminal_states: [INACTIVE]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system (automatic when logical clock reaches effective_date)"
        actor: system
        preconditions:
          - "logical clock >= effective_date"
          - "parent_unit_id is null or parent unit is ACTIVE"
        side_effects:
          - "If a ROLE_BASED SecurityGroup references this unit, ROLE_DERIVED memberships are synthesized for each ACTIVE worker whose org_unit_id is this unit or a descendant ACTIVE unit"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /tenants/{tid}/organization-units/{id}/deactivate"
        actor: TenantAdministrator
        preconditions:
          - "No ACTIVE descendant units (ERR_HAS_ACTIVE_CHILDREN)"
          - "headcount == 0 (ERR_UNIT_NOT_EMPTY)"
        side_effects:
          - "CASCADE hop 1: every ROLE_BASED SecurityGroup whose org_unit_id == this unit gets all its ROLE_DERIVED SecurityGroupMembership rows in ACTIVE → INVALIDATED (each decrementing Tenant.active_membership_count)"
          - "CASCADE hop 2: for each group so affected, if remaining ACTIVE memberships < min_approvers the group transitions ACTIVE → DISABLED"
          - "CASCADE hop 3: for each group disabled in hop 2, every BusinessProcessStep with approver_security_group_id == that group and status ACTIVE → REMOVED on DRAFT definitions; on ACTIVE definitions the definition is flagged and every IN_PROGRESS TransactionInstance pinned to a version containing that step escalates (TransactionStepEvent action ESCALATE, escalation_count += 1, NOTIFY to initiator)"

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tenants/{tid}/workers/{id}/terminate"
        actor: TenantAdministrator
        preconditions:
          - "Worker has no direct reports with status ACTIVE (ERR_HAS_ACTIVE_REPORTS)"
        side_effects:
          - "All SecurityGroupMembership rows for this worker in ACTIVE → INVALIDATED, decrementing Tenant.active_membership_count per row"
          - "For each USER_BASED group affected: if ACTIVE memberships < min_approvers, group → DISABLED with the same cascade as OrganizationUnit deactivation hop 2 and hop 3"
          - "The worker may no longer act as approver on any PENDING step; PENDING steps whose only remaining eligible approver was this worker escalate"

  - entity: SecurityGroup
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "system (when ACTIVE memberships fall below min_approvers via invalidation cascades)"
        actor: system
        preconditions:
          - "count of ACTIVE SecurityGroupMembership rows < min_approvers"
        side_effects:
          - "BusinessProcessStep rows referencing this group handled per OrganizationUnit hop 3"
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /tenants/{tid}/security-groups/{id}/disable"
        actor: TenantAdministrator
        preconditions:
          - "No ACTIVE BusinessProcessDefinition has an ACTIVE BusinessProcessStep whose approver_security_group_id == this group (ERR_GROUP_IN_USE)"
        side_effects:
          - "All SecurityGroupMembership rows in ACTIVE → INVALIDATED, decrementing Tenant.active_membership_count"

  - entity: SecurityGroupMembership
    initial_state: ACTIVE
    terminal_states: [INVALIDATED]
    transitions:
      - from: ACTIVE
        to: INVALIDATED
        trigger: "DELETE /tenants/{tid}/security-groups/{gid}/memberships/{id} (USER_ASSIGNED rows only) or system cascades (ROLE_DERIVED rows)"
        actor: TenantAdministrator
        preconditions:
          - "membership_source == USER_ASSIGNED when triggered via the DELETE endpoint (ERR_ROLE_DERIVED_MEMBERSHIP_IMMUTABLE)"
          - "Worker and group both exist and membership is ACTIVE"
        side_effects:
          - "Tenant.active_membership_count -= 1"
          - "If group ACTIVE memberships drop below min_approvers → group DISABLED with downstream cascade"

  - entity: BusinessProcessDefinition
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tenants/{tid}/business-process-definitions/{id}/activate"
        actor: TenantAdministrator
        preconditions:
          - "Definition has >= 1 ACTIVE APPROVAL step (ERR_NO_APPROVAL_STEP)"
          - "No other ACTIVE definition for the same (tenant_id, transaction_type) (ERR_DUPLICATE_ACTIVE_DEFINITION)"
          - "Every APPROVAL and REVIEW step's approver_security_group_id references a SecurityGroup in ACTIVE with ACTIVE memberships >= min_approvers (ERR_GROUP_INELIGIBLE)"
        side_effects:
          - "increments BusinessProcessDefinition.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tenants/{tid}/business-process-definitions/{id}/retire"
        actor: TenantAdministrator
        preconditions:
          - "No TransactionInstance with definition_id == this in IN_PROGRESS (ERR_OPEN_TRANSACTIONS_EXIST)"
        side_effects:
          - "Replacement definition for the same transaction_type may then be activated"

  - entity: TransactionInstance
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /tenants/{tid}/transaction-instances/{id}/steps/{step_order}/approve"
        actor: Approver
        preconditions:
          - "step_order == current_step_order (ERR_STEP_NOT_PENDING)"
          - "The step at step_order is APPROVAL or REVIEW kind"
          - "Acting worker holds an ACTIVE membership in the step's approver_security_group_id (ERR_NOT_STEP_APPROVER)"
          - "Acting worker != initiator_worker_id (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
          - "The pinned/effective definition version still contains step_order as ACTIVE, or version_pin_policy == PIN_ON_INITIATE and the step was ACTIVE in definition_version_pinned (ERR_STALE_DEFINITION)"
        side_effects:
          - "TransactionStepEvent APPROVE appended"
          - "Advance to next step: evaluate steps in ascending step_order; SKIP each step whose inclusion_condition does not hold for this instance (appending SKIP events); NOTIFICATION-kind steps emit a Notification and are auto-passed; if a further APPROVAL/REVIEW step exists, it becomes current_step_order and a STEP_ASSIGNED notification goes to its group's ACTIVE members; otherwise the instance transitions to COMPLETED"
          - "If next-step evaluation reaches no pending step, TransactionInstance.status → COMPLETED; any EVENT_DRIVEN IntegrationConnector with subscribed_event == TRANSACTION_COMPLETED in ACTIVE enqueues an IntegrationRun (trigger_source EVENT)"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /tenants/{tid}/transaction-instances/{id}/steps/{step_order}/return"
        actor: Approver
        preconditions:
          - "step_order == current_step_order and the step is an APPROVAL step with return_target_step_order set (ERR_STEP_NOT_RETURNABLE)"
          - "Same approver-membership and segregation preconditions as approve"
        side_effects:
          - "TransactionStepEvent RETURN appended with required comment"
          - "current_step_order ← return_target_step_order; intermediate step events are not erased (cycle preserves history)"
          - "RETURNED notification to initiator"
        note: "Cycle: instance loops back to an earlier step and must re-traverse forward"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "system (escalation sweep: step PENDED longer than definition.escalation_after_hours)"
        actor: system
        preconditions:
          - "logical clock - occurred_at of the ADVANCE event that made the step pending > escalation_after_hours"
        side_effects:
          - "TransactionStepEvent ESCALATE appended; escalation_count += 1; ESCALATED notification to the approver group's ACTIVE members"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /tenants/{tid}/transaction-instances/{id}/cancel"
        actor: TenantAdministrator
        preconditions:
          - "Acting TenantAdministrator's worker != initiator_worker_id OR the tenant has >= 2 TenantAdministrator workers (segregation: a sole administrator who is also the initiator cannot cancel own transaction) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "No further step events accepted"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (final step approved; see approve transition)"
        actor: system
        preconditions: []
        side_effects:
          - "EVENT_DRIVEN connectors with subscribed_event == TRANSACTION_COMPLETED enqueue IntegrationRun rows"

  - entity: ReleaseTrain
    initial_state: ANNOUNCED
    terminal_states: [RETIRED]
    transitions:
      - from: ANNOUNCED
        to: OPT_IN_OPEN
        trigger: "system (logical clock reaches opt_in_window_start)"
        actor: system
        preconditions:
          - "release_kind == FEATURE_RELEASE"
        side_effects: []
      - from: ANNOUNCED
        to: MANDATORY_LIVE
        trigger: "system (WEEKLY_SERVICE trains skip opt-in; applied at each tenant's maintenance slot)"
        actor: system
        preconditions:
          - "release_kind == WEEKLY_SERVICE"
        side_effects:
          - "Tenant.code_version advanced for every tenant where weekly_update_auto_apply == true; tenants with weekly_update_auto_apply == false retain prior code_version until acknowledged via POST /tenants/{id}/acknowledge-weekly-update"
      - from: OPT_IN_OPEN
        to: OPT_IN_CLOSED
        trigger: "system (logical clock passes opt_in_window_end, inclusive: enrollments accepted at exactly opt_in_window_end, rejected after)"
        actor: system
        preconditions: []
        side_effects:
          - "All TenantFeatureAdoption rows for this train in ENROLLED with no test evidence recorded → DEFERRED"
      - from: OPT_IN_CLOSED
        to: MANDATORY_LIVE
        trigger: "system (logical clock reaches mandatory_date)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every TenantFeatureAdoption for this train in ENROLLED or TESTING_PASSED → FORCE_ENABLED (Tenant.adopted_feature_count += 1 per row)"
          - "CASCADE hop 2: for each row flipped in hop 1 whose deprecates_feature_key is set, any TenantFeatureAdoption on the same tenant whose feature_key == deprecates_feature_key and status == ADOPTED or FORCE_ENABLED → ROLLED_BACK (Tenant.adopted_feature_count -= 1 per row) and a FORCE_ENABLED notification is emitted"
          - "CASCADE hop 3: DEFERRED rows on this train → FORCE_ENABLED with a RETIREMENT_WARNING notification (the deprecated predecessor is still retired on the tenant; deferral does not survive mandatory_date)"
      - from: MANDATORY_LIVE
        to: RETIRED
        trigger: "POST /release-trains/{id}/retire"
        actor: PlatformOperator
        preconditions:
          - "A later FEATURE_RELEASE train exists in MANDATORY_LIVE (ERR_NO_SUCCESSOR_TRAIN)"
        side_effects: []

  - entity: TenantFeatureAdoption
    initial_state: ENROLLED
    terminal_states: [ADOPTED, FORCE_ENABLED, DEFERRED]
    transitions:
      - from: ENROLLED
        to: TESTING_PASSED
        trigger: "POST /tenants/{tid}/feature-adoptions/{id}/record-testing"
        actor: TenantAdministrator
        preconditions:
          - "ReleaseTrain.status == OPT_IN_OPEN (ERR_OPT_IN_WINDOW_CLOSED)"
          - "sandbox_test_evidence_id is set and references a completed artifact (IntegrationRun in SUCCEEDED on a SANDBOX tenant of this customer, or a non-empty evidence string) (ERR_TEST_EVIDENCE_MISSING)"
        side_effects: []
      - from: TESTING_PASSED
        to: ADOPTED
        trigger: "POST /tenants/{tid}/feature-adoptions/{id}/adopt"
        actor: TenantAdministrator
        preconditions:
          - "ReleaseTrain.status == OPT_IN_OPEN (ERR_OPT_IN_WINDOW_CLOSED)"
        side_effects:
          - "Tenant.adopted_feature_count += 1"
      - from: ENROLLED
        to: DEFERRED
        trigger: "POST /tenants/{tid}/feature-adoptions/{id}/defer or system at OPT_IN_CLOSED without testing evidence"
        actor: TenantAdministrator
        preconditions:
          - "ReleaseTrain.status == OPT_IN_OPEN (ERR_OPT_IN_WINDOW_CLOSED)"
        side_effects: []
      - from: ENROLLED
        to: FORCE_ENABLED
        trigger: "system (train reaches MANDATORY_LIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Tenant.adopted_feature_count += 1; predecessor retirement per ReleaseTrain cascade"
      - from: TESTING_PASSED
        to: FORCE_ENABLED
        trigger: "system (train reaches MANDATORY_LIVE before adopt)"
        actor: system
        preconditions: []
        side_effects:
          - "Tenant.adopted_feature_count += 1"
      - from: DEFERRED
        to: FORCE_ENABLED
        trigger: "system (train reaches MANDATORY_LIVE; deferral does not survive mandatory_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Tenant.adopted_feature_count += 1; RETIREMENT_WARNING notification"
      - from: ADOPTED
        to: ROLLED_BACK
        trigger: "system (a successor feature on a later train FORCE_ENABLED on the same tenant names this feature in deprecates_feature_key)"
        actor: system
        preconditions: []
        side_effects:
          - "Tenant.adopted_feature_count -= 1"

  - entity: IntegrationConnector
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tenants/{tid}/integration-connectors/{id}/activate"
        actor: IntegrationDeveloper
        preconditions:
          - "trigger_mode == SCHEDULED requires schedule_cron set; trigger_mode == EVENT_DRIVEN requires subscribed_event set (ERR_INVALID_TRIGGER_CONFIG)"
          - "blackout_window_start_utc != blackout_window_end_utc (empty blackout window forbidden) (ERR_INVALID_BLACKOUT_WINDOW)"
          - "Tenant.status == ACTIVE (ERR_TENANT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tenants/{tid}/integration-connectors/{id}/suspend or system on Tenant suspend"
        actor: IntegrationDeveloper
        preconditions: []
        side_effects:
          - "QUEUED runs for this connector → DEAD_LETTERED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tenants/{tid}/integration-connectors/{id}/resume"
        actor: IntegrationDeveloper
        preconditions:
          - "Tenant.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tenants/{tid}/integration-connectors/{id}/retire"
        actor: IntegrationDeveloper
        preconditions:
          - "No IntegrationRun for this connector in QUEUED or RUNNING (ERR_RUNS_IN_FLIGHT)"
        side_effects: []
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /tenants/{tid}/integration-connectors/{id}/retire"
        actor: IntegrationDeveloper
        preconditions: []
        side_effects: []

  - entity: IntegrationRun
    initial_state: QUEUED
    terminal_states: [SUCCEEDED, DEAD_LETTERED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "system (dispatcher picks the run; SCHEDULED runs only fire outside the connector's blackout window, half-open [blackout_start, blackout_end))"
        actor: system
        preconditions:
          - "Connector.status == ACTIVE"
          - "If trigger_source == SCHEDULE: current UTC hour not in blackout window"
        side_effects: []
      - from: RUNNING
        to: SUCCEEDED
        trigger: "POST /tenants/{tid}/integration-connectors/{cid}/runs/{id}/complete"
        actor: IntegrationDeveloper
        preconditions:
          - "records_processed >= 0 supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "If this run's connector is EVENT_DRIVEN with subscribed_event == MEMBERSHIP_CHANGED, no further cascade; if the run was evidence for a TenantFeatureAdoption, that adoption's sandbox_test_evidence_id becomes resolvable for record-testing"
      - from: RUNNING
        to: FAILED
        trigger: "POST /tenants/{tid}/integration-connectors/{cid}/runs/{id}/fail"
        actor: IntegrationDeveloper
        preconditions: []
        side_effects: []
      - from: FAILED
        to: RUNNING
        trigger: "POST /tenants/{tid}/integration-connectors/{cid}/runs/{id}/retry"
        actor: IntegrationDeveloper
        preconditions:
          - "attempt_count < 3 (ERR_RETRY_LIMIT_EXCEEDED)"
        side_effects:
          - "attempt_count += 1"
        note: "Retry cycle FAILED → RUNNING up to 3 attempts total"
      - from: FAILED
        to: DEAD_LETTERED
        trigger: "system (attempt_count == 3 reached) or POST .../dead-letter"
        actor: IntegrationDeveloper
        preconditions: []
        side_effects: []

  - entity: TenantRefreshJob
    initial_state: PLANNED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "system (logical clock reaches scheduled_at)"
        actor: system
        preconditions:
          - "Neither source nor target tenant has a weekly update applying at that maintenance slot (temporal exclusion)"
          - "Source tenant status == ACTIVE and target tenant status == ACTIVE"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /tenants/{tid}/refresh-jobs/{id}/complete"
        actor: TenantAdministrator
        preconditions:
          - "scheduled_at hour of day == target tenant maintenance_slot_utc (refreshes only execute in the maintenance hour)"
        side_effects:
          - "Target tenant configuration replaced per migration_mode: FULL_COPY replaces all BusinessProcessDefinition + SecurityGroup + OrganizationUnit configuration from source; DELTA_ONLY migrates only objects whose source version advanced since the target's last COMPLETED refresh"
          - "Target tenant's TenantFeatureAdoption rows in ENROLLED or TESTING_PASSED are re-based: their opt-in deadlines recompute against the target tenant's service_level_tier window extension"
          - "config_drift_score finalized (final variant = number of objects actually migrated)"
          - "EVENT_DRIVEN connectors on the TARGET tenant with subscribed_event == REFRESH_COMPLETED enqueue IntegrationRun rows (trigger_source EVENT)"
          - "REFRESH_COMPLETED notification to the target tenant's TenantAdministrators"
      - from: RUNNING
        to: FAILED
        trigger: "POST /tenants/{tid}/refresh-jobs/{id}/fail"
        actor: TenantAdministrator
        preconditions: []
        side_effects:
          - "Target tenant configuration unchanged (atomic: refresh applies all-or-nothing)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /tenants/{tid}/refresh-jobs/{id}/cancel"
        actor: TenantAdministrator
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version only — true races, serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: definition-activate-stale-tenant
    parent_entity: BusinessProcessDefinition
    write_endpoint: "POST /tenants/{tid}/business-process-definitions/{id}/activate"
    occ_field: "expected_definition_version"
    description: |
      Activating a BusinessProcessDefinition whose version has advanced since
      the client last observed it is rejected: another writer has edited the
      step list (e.g. added or removed an APPROVAL step), so the current
      writer's view of what is being activated is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tenant-config-update-stale-tenant
    parent_entity: Tenant
    write_endpoint: "PUT /tenants/{id}"
    occ_field: "expected_tenant_version"
    description: |
      Updating a Tenant's configuration (maintenance slot, auto-apply flag,
      refresh source) whose version has advanced since the client last
      observed it is rejected: a cascaded side effect (suspend, retirement,
      membership invalidation changing derived counts) or another writer's
      update has legitimately advanced the tenant version, so the current
      writer's base is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_step_chain_resolution
    trigger: "On TransactionInstance initiation and on every approve/return (next-step evaluation)"
    algorithm: topological
    formula: |
      effective_steps(definition, instance, variant):
        steps = ACTIVE steps of the definition, ordered by step_order ASC
        for each step in steps:
          include =
            if step.inclusion_condition == ALWAYS: true
            elif step.inclusion_condition == IF_HEADCOUNT_GE_50:
              target_unit.headcount >= 50        # inclusive boundary
            elif step.inclusion_condition == IF_CROSS_UNIT:
              source_org_unit_id != target_org_unit_id
            elif step.inclusion_condition == IF_AMOUNT_GT_1000:
              instance.amount > 1000             # strict boundary
        # variant: OPTIMISTIC (provisional, shown on initiation preview)
        #   headcount read = target unit's CURRENT direct headcount
        # variant: CONSERVATIVE (effective, used at execution time)
        #   headcount read = current direct headcount PLUS ACTIVE workers of
        #   descendant ACTIVE units (subtree aggregate)
      return included steps in ascending order
    input_set: "BusinessProcessStep rows with status ACTIVE on the governing definition (pinned version when version_pin_policy == PIN_ON_INITIATE, latest otherwise); Worker rows status ACTIVE"
    constants:
      HEADCOUNT_TIER_THRESHOLD: 50
      AMOUNT_THRESHOLD: 1000
    precision: "integer step orders; no rounding"
    variants:
      - name: OPTIMISTIC
        when: "initiation preview (GET .../preview-chain) and any reporting"
        difference: "headcount read is the target unit's direct headcount only"
      - name: CONSERVATIVE
        when: "execution time (actual step advancement)"
        difference: "headcount read is direct headcount plus subtree headcount of descendant ACTIVE units; can differ from OPTIMISTIC for identical instance data when descendant units hold workers"

  - name: config_drift_score_calculation
    trigger: "On TenantRefreshJob creation (provisional) and on completion (final)"
    algorithm: aggregation
    formula: |
      provisional_drift(source, target):
        drift = 0
        for each BusinessProcessDefinition in source with status ACTIVE:
          if target has no ACTIVE definition with same transaction_type: drift += 2
          elif source.definition.version > target counterpart.version: drift += 1
        for each SecurityGroup in source with status ACTIVE:
          if no non-DISABLED group with same group_name in target: drift += 1
        return drift
      final_drift(source, target, migration_mode):
        FULL_COPY: count of configuration objects actually written =
          (# ACTIVE definitions in source) + (# ACTIVE steps on those definitions)
          + (# ACTIVE security groups in source) + (1 if include_workers else 0)
        DELTA_ONLY: same set restricted to objects whose source version >
          version recorded at the target's last COMPLETED refresh (or all
          objects if no prior COMPLETED refresh exists)
    input_set: "BusinessProcessDefinition status ACTIVE, SecurityGroup status ACTIVE on both tenants; Worker status ACTIVE when include_workers"
    constants:
      NEW_DEFINITION_WEIGHT: 2
      STALE_DEFINITION_WEIGHT: 1
      NEW_GROUP_WEIGHT: 1
    precision: "integer"
    variants:
      - name: provisional
        when: "job creation (PLANNED); quoted to the requester"
        difference: "compares version numbers only; does not account for migration_mode filtering"
      - name: final
        when: "job completion"
        difference: "counts objects actually migrated; depends on migration_mode and prior refresh history, so for identical source/target data FULL_COPY and DELTA_ONLY yield different scores and both differ from provisional when any versions tie"

  - name: escalation_due_computation
    trigger: "Escalation sweep evaluation for a PENDING step"
    algorithm: threshold
    formula: |
      due = occurred_at(ADVANCE event that made the step pending)
            + definition.escalation_after_hours
      escalate iff logical_clock > due            # strict: exactly at due is NOT yet escalated
      # nested rounding: each step's pending window is computed from ITS OWN
      # advance timestamp (per-step rounding to whole hours, round-half-up on
      # minute remainder), then escalations are counted; an alternative
      # "instance-age / escalation_after_hours, then floor" yields different
      # counts when a RETURN resets a step's clock — the scaffold pins
      # per-step rounding-then-compare, never instance-level divide-then-floor.
    input_set: "TransactionStepEvent rows action == ADVANCE for the current pending step; definition.escalation_after_hours"
    constants:
      MIN_ESCALATION_HOURS: 24
    precision: "whole hours, round_half_up on minute remainder, applied per-step before comparison"

  - name: adoption_health_score
    trigger: "Computed read: GET /tenants/{id}/adoption-health"
    algorithm: weighted_scoring
    formula: |
      # evaluation order pinned to avoid circularity:
      #   1) raw counts -> 2) tier multiplier -> 3) deadline penalty keyed on
      #      the tier-adjusted window length -> 4) clamp.
      base = 100
      for each TenantFeatureAdoption on the tenant:
        if status in {ENROLLED, TESTING_PASSED}: base -= 5
        if status == DEFERRED: base -= 15
      window_days = (train.opt_in_window_end - train.opt_in_window_start) in days
      effective_window = window_days + (14 if tenant.service_level_tier == PREMIUM else 0)
      if any feature on a train in OPT_IN_OPEN remains ENROLLED and
         logical clock > opt_in_window_start + effective_window * 0.75:
        base -= 10 per such feature          # late-enrollment penalty
      score = clamp(base, 0, 100)
      # circular-looking dependency resolved: the penalty uses
      # effective_window which depends on tier, and the tier extension only
      # applies to trains whose opt-in window is still open at read time;
      # retired/mandatory trains contribute only their status penalties.
    input_set: "TenantFeatureAdoption rows for the tenant joined to ReleaseTrain in status OPT_IN_OPEN or MANDATORY_LIVE; tenant.service_level_tier"
    constants:
      ENROLLED_PENALTY: 5
      DEFERRED_PENALTY: 15
      LATE_PENALTY: 10
      PREMIUM_EXTENSION_DAYS: 14
      LATE_FRACTION: 0.75
    precision: "integer score; window arithmetic in whole days, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted to invoke the endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (tenant, then child, then grandchild)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all nested endpoints" }
  - { priority: 4, category: existence, check: "Foreign-key bodies reference existing resources in the same tenant scope (no cross-tenant references)", error_id: ERR_CROSS_TENANT_REFERENCE, http_status: 422, applies_to: "all create/update endpoints with FK bodies" }
  - { priority: 5, category: state, check: "Tenant.status == ACTIVE for any configuration mutation on that tenant", error_id: ERR_TENANT_NOT_ACTIVE, http_status: 409, applies_to: "all tenant-scoped mutation endpoints" }
  - { priority: 6, category: state, check: "Target entity in a state that permits the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: actor is not the transaction initiator on approval/return/cancel; handoff acceptor is not the partner who advanced the handoff", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "step approve/return, transaction cancel, handoff advance" }
  - { priority: 8, category: business_safety, check: "PRODUCTION tenants cannot be retired; refreshes may only target SANDBOX tenants and source from PRODUCTION tenants", error_id: ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN, http_status: 422, applies_to: "tenant retire, refresh job create" }
  - { priority: 9, category: business_constraint, check: "Step approver membership: acting worker holds ACTIVE membership in the step's approver group", error_id: ERR_NOT_STEP_APPROVER, http_status: 403, applies_to: "step approve/return" }
  - { priority: 10, category: business_constraint, check: "Org hierarchy acyclic; worker manager chains acyclic; step_order contiguous 1..N within a definition; return_target_step_order < step_order", error_id: ERR_HIERARCHY_VIOLATION, http_status: 422, applies_to: "org unit create/update, worker create/update, step create" }
  - { priority: 11, category: business_constraint, check: "ROLE_BASED group requires org_unit_id referencing an ACTIVE unit; USER_ASSIGNED membership endpoint rejects ROLE_DERIVED rows", error_id: ERR_ROLE_DERIVED_MEMBERSHIP_IMMUTABLE, http_status: 422, applies_to: "security group create, membership delete" }
  - { priority: 12, category: business_temporal, check: "Opt-in enrollment, record-testing, adopt, defer allowed only while train OPT_IN_OPEN (inclusive of opt_in_window_end)", error_id: ERR_OPT_IN_WINDOW_CLOSED, http_status: 422, applies_to: "feature adoption enrollment and transition endpoints" }
  - { priority: 13, category: business_temporal, check: "Refresh scheduled_at hour == target maintenance_slot_utc (else ERR_SCHEDULE_CONFLICT) and does not collide with a weekly-update application on source or target (weekly updates occupy [slot, slot+1h), refresh occupies [slot, slot+2h) — mutually exclusive within the same week, else ERR_BLACKOUT_CONFLICT)", error_id: ERR_SCHEDULE_CONFLICT, http_status: 422, applies_to: "refresh job create" }
  - { priority: 14, category: business_temporal, check: "effective_date of a child org unit must be >= parent's effective_date; release train opt_in_window_start < opt_in_window_end < mandatory_date", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "org unit create, release train create" }
  - { priority: 15, category: business_referential, check: "Definition activation requires >= 1 ACTIVE APPROVAL step and all referenced approver groups eligible (ACTIVE, memberships >= min_approvers)", error_id: ERR_GROUP_INELIGIBLE, http_status: 422, applies_to: "definition activate" }
  - { priority: 16, category: business_referential, check: "No duplicate ACTIVE definition per (tenant, transaction_type); group/connector/unit names unique per tenant among non-terminal rows", error_id: ERR_DUPLICATE_ACTIVE_DEFINITION, http_status: 409, applies_to: "definition activate, group create, connector create, org unit create" }
  - { priority: 17, category: business_fiscal, check: "amount on EXPENSE transaction initiation must be >= 0; escalation_after_hours >= 24; min_approvers >= 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "transaction initiate, definition create/update, group create" }
  - { priority: 18, category: state, check: "OCC: expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /tenants/{id}, POST .../business-process-definitions/{id}/activate" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the platform logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never wall-clock)."
    roles: [PlatformOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Fire due system transitions: org unit activation, release train window transitions, escalation sweep"]

  # --- tenants ---
  - method: POST
    path: "/tenants"
    description: "Create a tenant (PRODUCTION, SANDBOX, or IMPLEMENTATION)"
    roles: [PlatformOperator]
    code: 201
    input: [tenant_name, tenant_kind, "service_level_tier?", "weekly_update_auto_apply?", maintenance_slot_utc, "refresh_source_tenant_id?"]
    output: Tenant
