        distinguishing_aspect: "CategoryManager invoking the RetailerAdmin-exclusive suspend fails ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Account with ACTIVE contract"
          setup_api_calls:
