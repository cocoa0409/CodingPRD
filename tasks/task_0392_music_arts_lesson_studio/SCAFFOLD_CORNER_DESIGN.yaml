# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Music & Arts Lesson Studio
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Studio, endpoints]
        distinguishing_aspect: "POST /studios with only name -> 201; status=OPEN, current_utc defaults to 2026-01-01T00:00:00.000Z, makeup_credit_cap_per_enrollment=3, cancellation_notice_hours=24."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "MyStudio" }
              as: StudioAdmin
              captures: { sid: $.data.id, st: $.data.status, cap: $.data.makeup_credit_cap_per_enrollment, notice: $.data.cancellation_notice_hours }
          assert:
            - "response status == 201"
            - "Studio.${sid}.status == OPEN"
            - "Studio.${sid}.makeup_credit_cap_per_enrollment == 3"
            - "Studio.${sid}.cancellation_notice_hours == 24"

      - name: create_enrollment_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Enrollment.fields.duration_min, "validations[priority=4]"]
        distinguishing_aspect: "POST enrollments without duration_min -> ERR_INVALID_REQUEST (422); duration_min has source input and no default."
        test_recipe:
          setup: ["Studio, family, student, instructor, room exist"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Aa" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: enrollment_monthly_tuition_computed_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.monthly_tuition_cents, calculations.tuition_finalized]
        distinguishing_aspect: "monthly_tuition_cents is computed at creation = round_half_up(6000*60/60*4)=24000 regardless of client input."
        test_recipe:
          setup: ["Studio, family, student, PIANO instructor hourly 6000, PIANO room"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Bb" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, mt: $.data.monthly_tuition_cents, lc: $.data.lifecycle_status, bs: $.data.billing_status }
          assert:
            - "Enrollment.${enr}.monthly_tuition_cents == 24000"
            - "Enrollment.${enr}.lifecycle_status == PENDING_MATCH"
            - "Enrollment.${enr}.billing_status == UNBILLED"

      - name: create_enrollment_invalid_instrument_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.Enrollment.fields.instrument, "validations[priority=4]"]
        distinguishing_aspect: "instrument outside {PIANO,VIOLIN,GUITAR,DRUMS,VOICE,CELLO} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Studio, family, student, instructor, room exist"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Cc" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "KAZOO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_enrollment_nonexistent_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_ENROLLMENT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET enrollments/{random-uuid} -> ERR_ENROLLMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Studio exists, no enrollments"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /studios/${sid}/enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_ENROLLMENT_NOT_FOUND"

      - name: list_families_paginated_envelope
        claim_type: Listing
        grounds: [entities.Family, endpoints]
        distinguishing_aspect: "GET families returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Studio with one family"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Solo" }
              as: StudioAdmin
              captures: { fid: $.data.id }
          trigger:
            - call: "GET /studios/${sid}/families"
              payload: { limit: 10, offset: 0 }
              as: StudioAdmin
          assert:
            - "response status == 200"
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_enrollment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.PENDING_MATCH_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an ACTIVE enrollment a second time -> ERR_INVALID_STATE (409); no version bump beyond the first activate."
        test_recipe:
          setup: ["Enrollment activated once (ACTIVE)"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Dd" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${v2}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_enrollment_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Enrollment.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED enrollment -> ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Enrollment cancelled once"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Ee" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id }
            - call: "POST /studios/${sid}/enrollments/${enr}/cancel"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/enrollments/${enr}/cancel"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_occurrence_before_start_returns_lesson_not_started
        claim_type: Precondition Enforcement
        grounds: [state_machines.LessonOccurrence.SCHEDULED_to_COMPLETED, "errors[ERR_LESSON_NOT_STARTED]"]
        distinguishing_aspect: "Completing a SCHEDULED occurrence while current_utc < scheduled_start_utc -> ERR_LESSON_NOT_STARTED (409)."
        test_recipe:
          setup: ["ACTIVE enrollment with a future SCHEDULED occurrence; clock before its start"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Ff" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { occ: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/lesson-occurrences/${occ}/complete"
              payload: {}
              as: Instructor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_LESSON_NOT_STARTED"

      - name: occurrence_initial_state_scheduled_with_computed_end
        claim_type: Initial State
        grounds: [state_machines.LessonOccurrence, entities.LessonOccurrence.fields.scheduled_end_utc]
        distinguishing_aspect: "New occurrence starts SCHEDULED with scheduled_end_utc = start + duration_min (60 min -> 11:00) and is_makeup=false."
        test_recipe:
          setup: ["ACTIVE enrollment, 60-min lesson"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Gg" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-05T10:00:00.000Z" }
              as: StudioAdmin
              captures: { occ: $.data.id, st: $.data.status, end: $.data.scheduled_end_utc, mk: $.data.is_makeup }
          assert:
            - "LessonOccurrence.${occ}.status == SCHEDULED"
            - "LessonOccurrence.${occ}.scheduled_end_utc == 2026-01-05T11:00:00.000Z"
            - "LessonOccurrence.${occ}.is_makeup == false"

      - name: late_cancel_under_notice_no_credit
        claim_type: Side Effect Execution
        grounds: [state_machines.LessonOccurrence.SCHEDULED_to_CANCELLED_LATE, entities.LessonOccurrence.fields.status]
        distinguishing_aspect: "Cancelling within cancellation_notice_hours (12h before) -> CANCELLED_LATE and mints NO makeup credit (count stays 0)."
        test_recipe:
          setup: ["ACTIVE enrollment, occurrence start 2026-01-20T15:00:00Z, clock at 2026-01-20T03:00:00Z (12h before)"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Hh" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }, { weekday: 1, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 1, start_min: 900, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-20T15:00:00.000Z" }
              as: StudioAdmin
              captures: { occ: $.data.id }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T03:00:00.000Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/lesson-occurrences/${occ}/cancel"
              payload: {}
              as: ParentGuardian
              as_user_id: "${fid}"
              captures: { st: $.data.status }
            - call: "GET /studios/${sid}/makeup-credits"
              payload: { enrollment_id: "${enr}" }
              as: StudioAdmin
          assert:
            - "LessonOccurrence.${occ}.status == CANCELLED_LATE"
            - "GET makeup-credits total_count == 0"

      - name: recital_cancel_withdraws_all_registrations
        claim_type: Side Effect Execution
        grounds: [state_machines.RecitalEvent.REG_OPEN_to_CANCELLED, state_machines.RecitalRegistration.CONFIRMED_to_WITHDRAWN]
        distinguishing_aspect: "Cancelling a REG_OPEN event with two CONFIRMED registrations cascades both to WITHDRAWN and event status -> CANCELLED."
        test_recipe:
          setup: ["RecitalEvent capacity 5, two CONFIRMED registrations, clock before deadline"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Ii" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "I1" }
              as: StudioAdmin
              captures: { s1: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "I2" }
              as: StudioAdmin
              captures: { s2: $.data.id }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/recital-events"
              payload: { title: "E", venue_capacity: 5, event_start_utc: "2026-04-01T18:00:00.000Z", registration_deadline_utc: "2026-03-30T00:00:00.000Z" }
              as: StudioAdmin
              captures: { ev: $.data.id }
            - call: "POST /studios/${sid}/recital-registrations"
              payload: { recital_event_id: "${ev}", student_id: "${s1}" }
              as: StudioAdmin
              captures: { reg1: $.data.id }
            - call: "POST /studios/${sid}/recital-registrations"
              payload: { recital_event_id: "${ev}", student_id: "${s2}" }
              as: StudioAdmin
              captures: { reg2: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/recital-events/${ev}/cancel"
              payload: {}
              as: StudioAdmin
              captures: { evst: $.data.status }
            - call: "GET /studios/${sid}/recital-registrations/${reg1}"
              payload: {}
              as: StudioAdmin
              captures: { r1st: $.data.status }
          assert:
            - "RecitalEvent.${ev}.status == CANCELLED"
            - "RecitalRegistration.${reg1}.status == WITHDRAWN"

      - name: occurrence_cyclic_roundtrip_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.LessonOccurrence.MAKEUP_PENDING_to_SCHEDULED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / occurrence_cyclic_makeup_pending_roundtrip
          rationale: "The MAKEUP_PENDING->SCHEDULED cyclic transition is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: family_wallet_credit_accumulates
        claim_type: Correct Result
        grounds: [calculations.family_wallet_balance, entities.Family.fields.wallet_balance_cents]
        distinguishing_aspect: "Two wallet credits 3000 + 2000 -> wallet_balance_cents == 5000."
        test_recipe:
          setup: ["One family"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Jj" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/families/${fid}/wallet/credits"
              payload: { amount_cents: 3000 }
              as: BillingClerk
          trigger:
            - call: "POST /studios/${sid}/families/${fid}/wallet/credits"
              payload: { amount_cents: 2000 }
              as: BillingClerk
              captures: { wb: $.data.wallet_balance_cents }
          assert:
            - "Family.${fid}.wallet_balance_cents == 5000"

      - name: provisional_proration_partial_month
        claim_type: Input Set Filtering
