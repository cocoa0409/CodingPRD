# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Premium Seating & Suite License Management
# Taxonomy per references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: venue_create_applies_cutoff_default
        claim_type: defaults
        grounds: [entities.Venue.fields.default_catering_cutoff_hours]
        distinguishing_aspect: "Omitting default_catering_cutoff_hours yields exactly 72 on the created venue."
        test_recipe:
          setup: ["Empty DB; clock at default"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id, cutoff: $.data.default_catering_cutoff_hours } }
          trigger: []
          assert:
            - "Venue.${v}.default_catering_cutoff_hours == 72 (default applied; input omission honored)"
            - "Venue.${v}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: suite_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Suite.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/suites without required field tier is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Venue exists"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and no Suite row is created"

      - name: suite_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Suite.fields.tier]
        distinguishing_aspect: "tier outside {FOUNDERS, PLATINUM, GOLD, SILVER} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Venue exists"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "D-100", tier: "DIAMOND", capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: suite_code_unique_per_venue
        claim_type: type_constraints
        grounds: [entities.Suite.fields.suite_code]
        distinguishing_aspect: "Second suite with the same suite_code in the same venue is rejected; the same code in a DIFFERENT venue is accepted."
        test_recipe:
          setup: ["Two venues V1, V2; suite G-101 exists in V1"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/venues", payload: { name: "North Dome", address: "9 Field Rd" }, as: StadiumAdmin, captures: { v2: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v1}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/suites", payload: { venue_id: "${v1}", suite_code: "G-101", tier: GOLD, capacity_seats: 18, base_annual_fee_cents: 11000000, f_b_minimum_cents: 3800000 }, as: StadiumAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v2}", suite_code: "G-101", tier: GOLD, capacity_seats: 18, base_annual_fee_cents: 11000000, f_b_minimum_cents: 3800000 }, as: StadiumAdmin, captures: { ok: $.data.id } }
          assert:
            - "Duplicate in same venue: error_id == ERR_INVALID_REQUEST"
            - "Same code in different venue: succeeds (201)"

      - name: account_tax_id_globally_unique
        claim_type: type_constraints
        grounds: [entities.Account.fields.tax_id]
        distinguishing_aspect: "tax_id uniqueness is global (not venue-scoped); second account with T-100 fails."
        test_recipe:
          setup: ["Account with tax_id T-100 exists"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep }
          trigger:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Clone", account_type: INDIVIDUAL, tax_id: "T-100", billing_email: "other@acme.example" }, as: PremiumSalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: account_created_with_zeroed_computed_ledger
        claim_type: computed_fields
        grounds: [entities.Account.fields.balance_due_cents, entities.Account.fields.credit_standing, entities.Account.fields.status]
        distinguishing_aspect: "A fresh account reports status PROSPECT, credit_standing GOOD, balance_due_cents 0, lifetime_spend_cents 0 — inputs for those fields are ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id, st: $.data.status, cs: $.data.credit_standing, bal: $.data.balance_due_cents, spend: $.data.lifetime_spend_cents } }
          trigger: []
          assert:
            - "status == PROSPECT (initial state), credit_standing == GOOD, balance_due_cents == 0, lifetime_spend_cents == 0"

      - name: agreement_draft_has_no_schedule_until_execute
        claim_type: computed_fields
        grounds: [entities.LicenseAgreement.fields.fee_schedule_cents, entities.LicenseAgreement.fields.executed_on]
        distinguishing_aspect: "Before execution the computed fee_schedule_cents is empty/null and executed_on is null; both materialize only at execute."
        test_recipe:
          setup: ["Venue, GOLD suite, S1 PUBLISHED, account ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
          trigger:
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id, st: $.data.status, ex: $.data.executed_on } }
          assert:
            - "LicenseAgreement.${ag}.status == DRAFT (initial state)"
            - "executed_on is null and fee_schedule_cents is null/empty before execute"

      - name: suite_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent suite id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/suites/00000000-0000-4000-8000-000000000000", payload: {}, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: season_publish_rejects_inverted_dates
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "Publish precondition ends_on > starts_on: an inverted season cannot be published."
        test_recipe:
          setup: ["Venue; season with ends_on before starts_on (create does not validate date order)"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "Bad Season", starts_on: "2027-02-15T00:00:00Z", ends_on: "2026-09-01T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and season remains DRAFT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_double_execute_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LicenseAgreement.PENDING_EXECUTION_to_ACTIVE, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Executing an already-ACTIVE agreement is a same-trigger repeat and must fail with ERR_INVALID_STATE_TRANSITION (non-idempotent action endpoints)."
        test_recipe:
          setup: ["Venue, GOLD suite, S1 PUBLISHED, account ACTIVE, agreement executed once"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
          trigger:
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}", captures: { err: $.data.error_id } }
          assert:
            - "Second execute: error_id == ERR_INVALID_STATE_TRANSITION; exactly one LICENSE_FEE invoice exists for the agreement"

      - name: agreement_execute_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LicenseAgreement.PENDING_EXECUTION_to_ACTIVE]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / execute_draft_with_credit_hold_returns_state_error"
          rationale: "That §1.8 instance triggers exactly the DRAFT->execute rejection (and additionally proves its priority over the fiscal error)."

      - name: invoice_void_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice.DRAFT_to_VOID, state_machines.Invoice.ISSUED_to_VOID]
        distinguishing_aspect: "VOID is terminal: voiding a VOID invoice fails; issuing a VOID invoice fails."
        test_recipe:
          setup: ["Account ACTIVE; manual invoice voided"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/void", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/invoices/${inv}/void", payload: {}, as: FinanceController, captures: { err1: $.data.error_id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE_TRANSITION (second void)"
            - "err2 == ERR_INVALID_STATE_TRANSITION (issue from VOID)"

      - name: payment_failed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Payment.INITIATED_to_FAILED]
        distinguishing_aspect: "FAILED is terminal: a FAILED payment cannot transition to CLEARED or REFUNDED."
        test_recipe:
          setup: ["Account ACTIVE; invoice ISSUED 5000; payment FAILED"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 5000, method: CARD, allocations: [ { invoice_id: "${inv}", amount_cents: 5000 } ] }, as: FinanceController, captures: { p: $.data.id } }
            - { call: "POST /api/payments/${p}/set_status", payload: { target_status: "FAILED" }, as: FinanceController }
          trigger:
            - { call: "POST /api/payments/${p}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; invoice remains ISSUED with amount_paid_cents == 0 (a failed payment applied nothing)"

      - name: season_settle_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Season.PUBLISHED_to_SETTLED]
        distinguishing_aspect: "SETTLED is not a valid from-state for settle; the ops-run checkpoint is non-reentrant."
        test_recipe:
          setup: ["Venue; S1 PUBLISHED with its single event COMPLETED; clock past ends_on; settled once"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Only Game", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-16T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/events/${e1}/set_status", payload: { target_status: "COMPLETED" }, as: StadiumAdmin }
            - { call: "POST /api/seasons/${s1}/settle", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/seasons/${s1}/settle", payload: {}, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and no duplicate side effects (no new invoices) on the second call"

      - name: event_complete_before_end_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Event.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "Complete requires clock >= starts_at + duration_hours; one hour early is rejected."
        test_recipe:
          setup: ["Venue; S1 PUBLISHED; E1 2026-09-10T17:00Z dur 4 (ends 21:00Z); clock 2026-09-10T20:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T20:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/events/${e1}/set_status", payload: { target_status: "COMPLETED" }, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; event remains SCHEDULED"

      - name: catering_fulfill_before_event_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CateringOrder.CONFIRMED_to_FULFILLED]
        distinguishing_aspect: "Fulfill requires clock >= event.starts_at; a CONFIRMED order cannot be fulfilled the day before."
        test_recipe:
          setup: ["Active agreement; CONFIRMED order on E1; clock 2026-09-10T16:00Z (one hour before start)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: STANDARD, guest_count: 8, lines: [ { item_code: "APP", description: "Sliders", quantity: 1, unit_price_cents: 1000 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { co: $.data.id } }
            - { call: "POST /api/catering-orders/${co}/set_status", payload: { target_status: "CONFIRMED" }, as: EventServicesManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T16:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/catering-orders/${co}/set_status", payload: { target_status: "FULFILLED" }, as: EventServicesManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; order remains CONFIRMED"

      - name: credential_revoke_after_activate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AccessCredential.ISSUED_to_REVOKED, state_machines.AccessCredential.ISSUED_to_ACTIVATED]
        distinguishing_aspect: "REVOKED is only reachable from ISSUED; revoking an ACTIVATED credential fails (a scanned-in guest cannot be revoked)."
        test_recipe:
          setup: ["Active agreement; credential ISSUED on E1; clock inside activation window [13:00, 21:00]; credential ACTIVATED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
