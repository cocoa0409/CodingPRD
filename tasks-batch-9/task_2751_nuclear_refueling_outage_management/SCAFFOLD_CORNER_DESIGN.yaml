            - "${e_self_satisfy} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the release reference was supplied, so the hold-point rung had already passed"
            - "${st1_status} == SATISFIED with satisfied_by_user_id == \"ra-2\""
            - "${st2_status} == SATISFIED even though ra-1 created and satisfied it — the rule binds only REGULATORY hold points"
            - "Outage.${o_id}.status == ONLINE"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_outage_version_is_rejected_on_pattern_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.core-load-pattern-create-stale-outage", "errors[ERR_OUTAGE_VERSION_STALE]", "validations[priority=8]"]
        distinguishing_aspect: "The declared write endpoint bumps the parent version itself, so replaying the same expected_outage_version that succeeded a moment earlier is exactly the stale case: the second call is a 412 and mints nothing, while the same body with the refreshed version is admitted."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 at version 1 with no core load patterns."
            - "Each successful create supersedes the live DRAFT pattern and increments Outage.version by 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
          trigger:
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp1_id: "$.data.id" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: ReactorEngineer
              captures: { o_v2: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 84, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 84, discharge_assembly_count: 80, expected_outage_version: "${o_v2}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp2_id: "$.data.id" }
          assert:
            - "${o_v2} == ${o_v1} + 1 — the first create bumped the parent"
            - "${e_stale} == ERR_OUTAGE_VERSION_STALE with HTTP 412"
            - "After the refusal GET /outages/${o_id}/core-load-patterns still returns exactly 1 row and CoreLoadPattern.${clp1_id}.status is still DRAFT — no supersession happened on the stale attempt"
            - "The retry with ${o_v2} returns 201; CoreLoadPattern.${clp2_id}.reactivity_margin_pcm == 1538.00 and CoreLoadPattern.${clp1_id}.status == SUPERSEDED"
            - "Outage.${o_id}.version == ${o_v2} + 1 after the successful retry"

      - name: stale_expected_pool_version_is_rejected_on_reservation_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.pool-reservation-create-stale-pool", "errors[ERR_POOL_VERSION_STALE]", "validations[priority=8]"]
        distinguishing_aspect: "The second concurrency rule guards a different parent through a body field rather than a path parent. The first reservation moves the pool version, so replaying that version reserves no cells at all — the pool's cells_reserved is the witness that the write was refused before the ledger was touched."
        test_recipe:
          setup:
            - "Pool UNIT_1 with cells_total 1200, cells_baseline_occupied 900, full_core_offload_reserve_cells 193 — a NOMINAL headroom of 300."
            - "Outage UNIT_1 / 1R24 in PLANNING. Both reservations are CONTINGENCY for 100 cells, so neither needs an approved reload design and neither can exhaust the headroom."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 100, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res1_id: "$.data.id" }
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v2: "$.data.version", reserved_after_1: "$.data.cells_reserved" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 100, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 100, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v2}" }
              as: ReactorEngineer
              captures: { res2_id: "$.data.id" }
          assert:
            - "${reserved_after_1} == 100 and ${pool_v2} == ${pool_v1} + 1"
            - "${e_stale} == ERR_POOL_VERSION_STALE with HTTP 412"
            - "Immediately after the refusal cells_reserved is still 100 and GET /pool-cell-reservations returns 1 row — the stale write reserved nothing"
            - "The retry with ${pool_v2} returns 201; PoolCellReservation.${res2_id}.availability_variant == NOMINAL, cells_reserved == 200, cells_available == 100, protected_cells_available == -93"
            - "PoolCellReservation.${res1_id}.status and ${res2_id}.status are both RESERVED"

      - name: version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds: ["response_envelope", "entities.Outage.fields.version", "entities.SpentFuelPool.fields.version", "entities.SupplementalWorker.fields.version"]
        distinguishing_aspect: "The version counters that both concurrency rules compare against must move on every mutating request and stay still across reads — including the writes that touch a parent only through a side effect, like a badge issue bumping the outage."
        test_recipe:
          setup:
            - "Pool UNIT_1 (1200 / 900 / 193) and outage UNIT_1 / 1R24, both freshly created at version 1."
            - "One worker on that outage is driven to BADGE_READY and then badged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/supplemental-workers"
              payload: { full_name: "R. Kowalski", craft: "PIPEFITTER", sponsoring_contractor: "Northline Mechanical" }
              as: ContractorCoordinator
              captures: { w_id: "$.data.id", w_v1: "$.data.version" }
          trigger:
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { o_v_after_read: "$.data.version" }
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v_after_read: "$.data.version" }
            - call: "POST /supplemental-workers/${w_id}/background-result"
              payload: { outcome: "CLEAR" }
              as: AccessAuthority
              captures: { w_v2: "$.data.version" }
            - call: "POST /supplemental-workers/${w_id}/training-completion"
              payload: { modules_completed: 4 }
              as: AccessAuthority
              captures: { w_v3: "$.data.version" }
            - call: "POST /supplemental-workers/${w_id}/badge"
              payload: { badge_number: "B-1000" }
              as: AccessAuthority
              captures: { w_v4: "$.data.version" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { o_v_after_badge: "$.data.version", badged: "$.data.badged_worker_count" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 100, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res_id: "$.data.id" }
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v_after_write: "$.data.version" }
          assert:
            - "${o_v_after_read} == ${o_v1} and ${pool_v_after_read} == ${pool_v1} — reads never bump a version"
            - "${w_v2} > ${w_v1}, ${w_v3} > ${w_v2} and ${w_v4} > ${w_v3} — each worker write moves the worker's own counter"
            - "${badged} == 1 and ${o_v_after_badge} == ${o_v1} + 1 — the badge issue bumped the outage through its ledger-sync side effect, not through a direct write to the outage"
            - "${pool_v_after_write} == ${pool_v1} + 1 and PoolCellReservation.${res_id}.status == RESERVED"
            - "Every version in the assertions is an integer that only ever rises"

      - name: a_refused_lock_scope_writes_none_of_its_cascade_hops
        claim_type: cascading_side_effects
        grounds: ["state_machines.Outage.transitions[PLANNING->SCOPE_LOCKED]", "errors[ERR_CORE_LOAD_PATTERN_NOT_APPROVED]", "validations[priority=7]"]
        distinguishing_aspect: "Partial-failure handling for the scope-lock cascade: the request passes the first precondition, fails the second, and must leave all three cascade targets untouched — the SCOPED order is not auto-deferred, its NOT_STARTED activity is not cancelled, and its DRAFT permit is not voided. Supplying an approved pattern then runs the whole cascade in one request."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING with an APPROVED work order (so the first precondition passes) and a second work order left at SCOPED."
            - "The SCOPED order owns one NOT_STARTED activity and one DRAFT permit on rad area CTMT-EL471."
            - "The only core load pattern is DRAFT, so the second precondition fails on the first attempt."
