            - call: "POST /engagement/survey-invites/${iv_inv}/submit"
              payload: { answers: [ { cycle_item_id: "${iv_i1}", score: 3 }, { cycle_item_id: "${iv_i2}", score: 3 }, { cycle_item_id: "${iv_i3}", score: 3 } ] }
