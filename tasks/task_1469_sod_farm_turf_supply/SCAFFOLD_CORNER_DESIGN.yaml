# =============================================================================
# §1.9 Scaffold Corner Design — Sod Farm & Turf Supply
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: quote_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Quote.fields.customer_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /quotes without customer_id -> 400 ERR_INVALID_REQUEST; every source:input field without a default is required."
        test_recipe:
          setup: ["Variety exists"]
          setup_api_calls:
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload:
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 0
                z2_pallets: 10
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "response status == 400"

      - name: price_config_defaults_applied_on_omission
        claim_type: defaults
        grounds: [entities.PriceConfig]
        distinguishing_aspect: "POST /price-configs with only `name` applies every documented default (slab_sqft 5, rate_premium 0.855, zone_truck_capacity 4) and becomes the single is_current config."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
              captures: { pc_id: $.data.id, pc_slab: $.data.slab_sqft, pc_rate: $.data.rate_premium, pc_cap: $.data.zone_truck_capacity, pc_cur: $.data.is_current }
          assert:
            - "PriceConfig.${pc_id}.slab_sqft == 5"
            - "PriceConfig.${pc_id}.roll_sqft == 10"
            - "PriceConfig.${pc_id}.rate_premium == 0.855"
            - "PriceConfig.${pc_id}.zone_truck_capacity == 4"
            - "PriceConfig.${pc_id}.freshness_limit_hours == 24"
            - "PriceConfig.${pc_id}.is_current == true"

      - name: field_create_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Field]
        distinguishing_aspect: "Client-supplied id/version/created_at in POST /fields are ignored: the server mints a UUID id and version starts at 1."
        test_recipe:
          setup: ["variety exists"]
          setup_api_calls:
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fields"
              payload: { id: "00000000-0000-0000-0000-000000000000", version: 99, name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
          assert:
            - "Field.${f_id}.id != 00000000-0000-0000-0000-000000000000  # server-minted UUID"
            - "Field.${f_id}.version == 1  # client version 99 ignored"
            - "Field.${f_id}.remaining_sqft == 40000  # system init"

      - name: harvest_batch_invalid_enum_grade_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.HarvestBatch.fields.grade, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "grade 'DELUXE' is not a declared enum member -> 400 ERR_INVALID_ENUM (enum check fires before the OCC version check at priority 5 < 8)."
        test_recipe:
          setup: ["READY quality-passing field exists"]
          setup_api_calls:
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "DELUXE", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_ENUM"
            - "response status == 400"

      - name: get_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{random uuid} -> 404 ERR_NOT_FOUND; existence is priority 3, before any business rule."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "response status == 404"

      - name: customer_email_uniqueness_enforced
        claim_type: type_constraints
        grounds: [entities.Customer.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Second POST /customers with the same email -> 400 ERR_INVALID_REQUEST (tenant-wide uniqueness)."
        test_recipe:
          setup: ["one customer with email aria@example.com exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Aria Clone", email: "aria@example.com", phone: "555-9999", freight_zone: 1, address: "1 Dup St" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: field_inventory_filtered_listing
        claim_type: listing
        grounds: [entities.Field, "endpoints.GET /fields"]
        distinguishing_aspect: "GET /fields?maturity_state=READY&variety_id=X returns only matching rows (inventory by variety & maturity); unfiltered list returns all non-archived fields."
        test_recipe:
          setup:
            - "variety V1 with field F1 (planted 2026-05-01 -> READY age 92); variety V2 with field F2 (planted 2026-07-15 -> GROWING age 17)"
          setup_api_calls:
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v1_id: $.data.id }
            - call: "POST /variety-configs"
              payload: { name: "Celebration Bermuda" }
              as: FarmManager
              captures: { v2_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "F1", variety_id: "${v1_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f1_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "F2", variety_id: "${v2_id}", field_sqft: 20000, last_planted_at: "2026-07-15T00:00:00Z", mow_count: 1, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f2_id: $.data.id }
          trigger:
            - call: "GET /fields"
              payload: {}
              as: FarmManager
              captures: { all0: "$.data[0].id", all1: "$.data[1].id" }
            - call: "GET /fields?maturity_state=READY"
              payload: {}
              as: SalesRep
              captures: { ready0: "$.data[0].id" }
            - call: "GET /fields?variety_id=${v2_id}"
              payload: {}
              as: HarvestSupervisor
              captures: { v20: "$.data[0].id" }
          assert:
            - "unfiltered list has exactly 2 rows, created_at ASC: [${all0}, ${all1}] == [${f1_id}, ${f2_id}]"
            - "READY filter returns exactly 1 row and it is ${f1_id} (${ready0})"
            - "variety filter returns exactly 1 row and it is ${f2_id} (${v20})"

      - name: payment_entity_is_append_only
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment carries common_fields=false: its read representation exposes id and created_at but no version/updated_at; the API surface declares no update or delete endpoint for payments."
        test_recipe:
          setup: ["a PLACED order (line PREMIUM x2, total 175.47) exists"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/payments"
              payload: { amount: 175.47, method: "CARD" }
              as: SalesRep
              captures: { p_id: $.data.id }
            - call: "GET /orders/${o_id}/payments"
              payload: {}
              as: SalesRep
              captures: { p0: "$.data[0].id" }
          assert:
            - "Payment.${p_id} created (201) with amount 175.47"
            - "payment read exposes id + created_at only (no version, no updated_at)"
            - "${p0} == ${p_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_confirm_valid_transition_side_effects
        claim_type: valid_transition
        grounds: [state_machines.Order.PLACED_to_CONFIRMED]
        distinguishing_aspect: "Confirm flips PLACED -> CONFIRMED, stamps the window (start 08:00, end = start + 2h = 10:00), and links the selected batch (batch.order_id == order id, allocated_sqft 300)."
        test_recipe:
          setup: ["READY field with PENDING batch (3 PREMIUM pallets, sellable 300); PLACED order for 2 PREMIUM pallets (needs 200)"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 3, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { b_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: FarmManager
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/confirm"
              payload: { delivery_window_start: "2026-08-03T08:00:00Z" }
              as: SalesRep
              captures: { o_status: $.data.status, o_we: $.data.delivery_window_end }
            - call: "GET /harvest-batches/${b_id}"
              payload: {}
              as: FarmManager
              captures: { b_order: $.data.order_id }
          assert:
            - "Order.${o_id}.status == CONFIRMED"
            - "Order.${o_id}.delivery_window_end == 2026-08-03T10:00:00Z"
            - "Order.${o_id}.allocated_sqft == 300"
            - "HarvestBatch.${b_id}.order_id == ${o_id}  # allocation side effect"

      - name: cancel_terminal_order_returns_already_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.Order, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel -> 409 ERR_ALREADY_TERMINAL (distinct from mid-lifecycle invalid transitions)."
        test_recipe:
          setup: ["order created and cancelled while PLACED"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"

      - name: quote_double_accept_returns_already_terminal
        claim_type: invalid_transition
        grounds: [state_machines.Quote.DRAFT_to_ACCEPTED]
        distinguishing_aspect: "ACCEPTED is terminal for quotes: a second accept -> 409 ERR_ALREADY_TERMINAL and no second Order is created."
        test_recipe:
          setup: ["quote accepted once (order created)"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
            - call: "GET /quotes/${q_id}/orders"
              payload: {}
              as: SalesRep
              captures: { o0: "$.data[0].id" }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"
            - "exactly one order exists for quote ${q_id} and it is ${o_id} (${o0})"

      - name: new_draft_quote_supersedes_existing_draft
        claim_type: side_effect_execution
        grounds: [state_machines.Quote.DRAFT_to_SUPERSEDED]
        distinguishing_aspect: "Creating a second DRAFT quote for the same customer flips the first to SUPERSEDED with superseded_by_id set; accepting the superseded quote then fails ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["customer with one DRAFT quote q1"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-04"
                settlement_method: "CASH_CHECK"
                z1_pallets: 2
                z2_pallets: 0
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "ECONOMY", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q2_id: $.data.id }
            - call: "GET /quotes/${q1_id}"
              payload: {}
              as: SalesRep
              captures: { q1_status: $.data.status, q1_sup: $.data.superseded_by_id }
            - call: "POST /quotes/${q1_id}/accept"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "Quote.${q1_id}.status == SUPERSEDED"
            - "Quote.${q1_id}.superseded_by_id == ${q2_id}"
            - "${err} == ERR_ALREADY_TERMINAL"
            - "Quote.${q2_id}.status == DRAFT"

      - name: quote_accept_after_delivery_date_returns_quote_expired
        claim_type: precondition_enforcement
        grounds: [state_machines.Quote.DRAFT_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "Accept on/after the delivery date lazily transitions the quote DRAFT -> EXPIRED and returns 409 ERR_QUOTE_EXPIRED."
        test_recipe:
          setup: ["DRAFT quote for delivery 2026-08-02; clock advanced to 2026-08-03T00:30 (past the delivery date)"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-02"
                settlement_method: "CARD"
                z1_pallets: 1
                z2_pallets: 1
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 2, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:30:00Z" }
              as: FarmManager
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: SalesRep
              captures: { q_status: $.data.status }
          assert:
            - "${err} == ERR_QUOTE_EXPIRED"
            - "Quote.${q_id}.status == EXPIRED"

      - name: harvest_complete_window_boundary
        claim_type: precondition_enforcement
        grounds: [state_machines.HarvestBatch.PENDING_to_COMPLETE, "errors[ERR_HARVEST_WINDOW]"]
        distinguishing_aspect: "Harvest window is [06:00, 18:00] time-of-day, start inclusive: actual_start 05:30 -> 422 ERR_HARVEST_WINDOW and the batch stays PENDING; retry with 06:00 succeeds (boundary value accepted)."
        test_recipe:
          setup: ["READY quality-passing field with a PENDING batch scheduled 2026-08-02"]
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 5, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
