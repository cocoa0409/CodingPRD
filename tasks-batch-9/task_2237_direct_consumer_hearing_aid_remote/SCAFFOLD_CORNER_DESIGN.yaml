            - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat_cb}", session_type: "INITIAL_FIT", scheduled_start_utc: "2026-08-10T10:00:00Z", scheduled_end_utc: "2026-08-10T10:30:00Z", provider_id: "${prov_f}", device_order_id: "${ord_cb}" }, as: Patient, as_user_id: "${pat_cb}", captures: { sess_cb: "$.data.id" } }
            - { call: "POST /patients/${pat_cb}/screening-sessions", payload: { supersedes_session_id: "${scr_cb1}" }, as: Patient, as_user_id: "${pat_cb}", captures: { scr_cb2: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_cb2}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["SUDDEN_LOSS"] }, as: Patient, as_user_id: "${pat_cb}" }
