              captures: { cust_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "BUY_FX_FROM_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 3 }] }
              as: BranchTeller
              as_user_id: teller-01
              captures: { txn_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn_id}/authorize"
