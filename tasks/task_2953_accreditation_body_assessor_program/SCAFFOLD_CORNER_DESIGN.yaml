              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_a}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17020-INSP", name: "Inspection bodies", standard_ref: "ISO_IEC_17020", witness_min_count: 2, qualification_points_required: 60.0 }
              as: SchemeManager
              captures: { scheme_b: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_b}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_b}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_a}", cycle_type: "INITIAL", requested_scope_lines: ["mass calibration 1 mg - 20 kg"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_1: $.data.id }
          trigger:
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_a}", cycle_type: "INITIAL", requested_scope_lines: ["temperature calibration -40 C - 250 C"], notice_days: 30 }
              as: AssessmentManager
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_ACTIVE_APPLICATION\""
            - "GET /accreditation/applications?organization_id=${org_id}&scheme_id=${scheme_a} returns total_count == 1 holding only ${app_1}"
            - "the same POST with scheme_id ${scheme_b} returns HTTP 201"

