# =============================================================================
# §1.9 Scaffold Corner Design — task_2242
# Peer-to-Peer Recreational Vehicle Rental Marketplace
#
# Breadth probe. One `section:` block per claim-extraction-guide section, one
# instance per applicable claim_type row of that section's table, walked against
# SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by §1.8 are emitted as
# `excluded_because:` stubs naming the covering difficulty instance.
#
# YAML anchors (&k_*) are declared on first use and aliased (*k_*) afterwards;
# they replay the same canonical marketplace chain as §1.8 so every instance
# starts from byte-identical state. (Anchors are file-scoped, hence redeclared
# here with a k_ prefix; the payloads are identical to §1.8's c_* chain.)
#
# CANONICAL PINNED ARITHMETIC (logical clock 2026-08-01T00:00:00Z, listing
# base_nightly_rate_cents 21533, booking 2026-08-29 .. 2026-09-02, PICKUP):
#   nights 4; per-night 29070 + 29070 + 29070 + 23686 -> base_subtotal 110896
#   premium 24951; pre_discount 135847 -> LOYALTY_TIER_1; discount 5434
#   discounted_subtotal 130413; service_fee 15650; quoted_total = hold = 146063
#   final_overage 5813; final_total 151876; balance_due 5813
#   settle ledger -151876 / +111275 / +15650 / +24951 (sum 0)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: listing_create_returns_draft_with_computed_onboarding_counters
        claim_type: creation
        grounds:
          - entities.Listing.fields.listing_status
          - entities.Listing.fields.insurance_status
          - entities.Listing.fields.requires_towing
          - entities.Listing.fields.inspection_photo_zone_count
          - endpoints[POST /rv-marketplace/listings]
        distinguishing_aspect: >-
          A freshly created Listing must carry every computed onboarding counter
          at its zero value and requires_towing derived from vehicle_class in the
          same response — TRAVEL_TRAILER yields true, listing_status DRAFT,
          insurance_status PENDING, inspection_photo_zone_count 0, version 1.
        test_recipe:
          setup: >-
            Empty DB, logical clock pinned at its 2026-08-01 default, one ACTIVE
            Owner. Nothing else exists.
          setup_api_calls:
            - &k_clock
              call: "POST /rv-marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_owner
              call: "POST /rv-marketplace/owners"
              payload: { display_name: "Ada Rigby", email: "ada@rvshare.test", payout_state_code: "OR" }
              as: PlatformAdmin
              captures: { owner_id: "$.data.id", owner_v: "$.data.version" }
          trigger:
            - &k_listing
              call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Ponderosa 30BH"
                vehicle_class: "TRAVEL_TRAILER"
                gvwr_lbs: 8500
                length_ft: 30
                base_nightly_rate_cents: 21533
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 65
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 425
                min_renter_age: 25
                delivery_offered: true
                delivery_base_fee_cents: 12000
                delivery_per_mile_cents: 350
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: "$.data.id", listing_v: "$.data.version" }
          assert:
            - "response 201"
            - "data.owner_id == ${owner_id}"
            - "data.listing_status == 'DRAFT'"
            - "data.insurance_status == 'PENDING'"
            - "data.requires_towing == true"
            - "data.inspection_photo_zone_count == 0"
            - "data.completed_night_count == 0"
            - "data.last_reconciled_at == null"
            - "data.version == 1"

      - name: get_listing_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /rv-marketplace/listings/{listingId}]
          - entities.Listing
        distinguishing_aspect: >-
          The read-back of a DRAFT Listing returns exactly the input values it
          was created with (base_nightly_rate_cents 21533, gvwr_lbs 8500,
          delivery_offered true) and has not bumped version past 1 — a GET is
          not a write.
        test_recipe:
          setup: "Owner plus the canonical DRAFT listing, created and never touched again."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_listing
          trigger:
            - call: "GET /rv-marketplace/listings/${listing_id}"
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "response 200"
            - "data.id == ${listing_id}"
            - "data.base_nightly_rate_cents == 21533"
            - "data.gvwr_lbs == 8500"
            - "data.length_ft == 30"
            - "data.delivery_offered == true"
            - "data.delivery_base_fee_cents == 12000"
            - "data.listing_status == 'DRAFT'"
            - "data.version == 1"

      - name: pricing_season_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /rv-marketplace/pricing-seasons]
          - response_envelope.pagination_fields
        distinguishing_aspect: >-
          With exactly three PricingSeason rows, limit=2 offset=0 returns 2 rows
          with total_count 3 and has_more true, while limit=2 offset=2 returns
          the single remaining row with has_more false; total_count is the
          unpaginated count, not the page size.
        test_recipe:
          setup: "The three canonical pricing seasons, created PEAK then SHOULDER then OFF."
          setup_api_calls:
            - *k_clock
            - &k_season_peak
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "PEAK", start_month_day: "06-01", end_month_day: "08-31", multiplier_bp: 13500 }
              as: PlatformAdmin
            - &k_season_shoulder
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "SHOULDER", start_month_day: "09-01", end_month_day: "10-31", multiplier_bp: 11000 }
              as: PlatformAdmin
            - &k_season_off
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "OFF", start_month_day: "01-01", end_month_day: "05-31", multiplier_bp: 8500 }
              as: PlatformAdmin
          trigger:
            - call: "GET /rv-marketplace/pricing-seasons"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /rv-marketplace/pricing-seasons"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "trigger step 1: response 200, meta/envelope total_count == 3, has_more == true, len(data) == 2"
            - "trigger step 1: data[0].season_code == 'PEAK' and data[1].season_code == 'SHOULDER' (created_at ASC)"
            - "trigger step 2: response 200, total_count == 3, has_more == false, len(data) == 1"
            - "trigger step 2: data[0].season_code == 'OFF' and data[0].multiplier_bp == 8500"

      - name: get_listing_with_unknown_uuid_not_found_returns_listing_code
        claim_type: not_found
        grounds:
          - errors[ERR_LISTING_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: >-
          A syntactically valid UUID that resolves to no Listing returns 404
          ERR_LISTING_NOT_FOUND — the entity-specific code from §1.6, not a
          generic ERR_INVALID_REQUEST.
        test_recipe:
          setup: "Empty DB apart from the clock; no Listing has ever been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /rv-marketplace/listings/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response 404"
            - "data.error_id == 'ERR_LISTING_NOT_FOUND'"

      - name: listing_create_missing_required_base_nightly_rate_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Listing.fields.base_nightly_rate_cents
        distinguishing_aspect: >-
          base_nightly_rate_cents has source input and no default, so omitting it
          is a 400 ERR_INVALID_REQUEST at priority 4 — before any existence or
          state check, and no Listing row is created.
        test_recipe:
          setup: "Owner exists; no listing yet."
          setup_api_calls:
            - *k_clock
            - *k_owner
          trigger:
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "No Rate Rig"
                vehicle_class: "CLASS_C"
                gvwr_lbs: 12000
                length_ft: 28
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 65
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 425
                min_renter_age: 25
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /rv-marketplace/listings with owner_id == ${owner_id} still returns total_count == 0"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Listing.fields.delivery_offered
          - entities.Listing.fields.delivery_base_fee_cents
          - entities.Campground.fields.status
          - entities.RenterQualification.fields.violation_points
        distinguishing_aspect: >-
          Three different entities' optional inputs each fall back to their §1.1
          default in the create response: Listing.delivery_offered false with
          both delivery money fields 0, Campground.status ACCEPTING, and
          RenterQualification.violation_points 0 — defaults are applied at
          write time, not left null.
        test_recipe:
          setup: "Clock, Owner and Renter exist; no listing, campground or qualification yet."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - &k_renter
              call: "POST /rv-marketplace/renters"
              payload: { display_name: "Ben Traveler", email: "ben@rvshare.test", date_of_birth: "1994-05-10", license_state_code: "OR" }
              as: PlatformAdmin
              captures: { renter_id: "$.data.id" }
          trigger:
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Pickup Only Van"
                vehicle_class: "CAMPER_VAN"
                gvwr_lbs: 9000
                length_ft: 21
                base_nightly_rate_cents: 18000
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 60
                included_generator_hours_per_night: 2.0
                generator_overage_rate_cents_per_hour: 400
                min_renter_age: 25
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_def_id: "$.data.id" }
            - &k_camp
              call: "POST /rv-marketplace/campgrounds"
              payload:
                name: "Cascade Bend RV Park"
                state_code: "OR"
                max_rig_length_ft: 40
                daily_dropoff_capacity: 1
                dropoff_buffer_minutes: 30
              as: PlatformAdmin
              captures: { camp_id: "$.data.id" }
            - call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter_id}"
                check_type: "TOWING_EXPERIENCE"
                result: "UNVERIFIED"
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
              captures: { qual_def_id: "$.data.id" }
          assert:
            - "trigger step 1: response 201, data.delivery_offered == false, data.delivery_base_fee_cents == 0, data.delivery_per_mile_cents == 0"
            - "trigger step 1: data.requires_towing == false (CAMPER_VAN is not a towed class)"
            - "trigger step 2: response 201, data.status == 'ACCEPTING', data.scheduled_assignment_count == 0"
            - "trigger step 3: response 201, data.violation_points == 0"

      - name: booking_computed_fields_are_derived_not_echoed
        claim_type: computed_fields
        grounds:
          - entities.Booking.fields.nights
          - entities.Booking.fields.renter_age_years_at_start
          - entities.Booking.fields.renter_record_points_snapshot
          - calculations.booking_nightly_subtotal
          - calculations.booking_quote_total
        distinguishing_aspect: >-
          Every money and derivation field on the booking-create response is
          computed server-side from the listing, plan and clock — nights 4 from
          the half-open date range, renter_age_years_at_start 32 from
          date_of_birth 1994-05-10 against start_date 2026-08-29,
          base_subtotal_cents 110896, premium_cents 24951, quoted_total_cents
          146063 — while hold_amount_cents is still 0 because nothing has been
          confirmed.
        test_recipe:
          setup: >-
            Full canonical marketplace: clock at 2026-08-01, Owner, Renter with
            one CLEAR 2-point DRIVING_RECORD check and a VERIFIED_BASIC
            TOWING_EXPERIENCE check, three pricing seasons, the STANDARD
            protection plan, the MODERATE cancellation policy, the canonical
            TRAVEL_TRAILER listing driven to LISTED, and a funded wallet.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - &k_plan_std
              call: "POST /rv-marketplace/protection-plans"
              payload:
                tier: "STANDARD"
                daily_premium_cents: 4900
                premium_pct_of_base_bp: 1800
                deductible_cents: 150000
                coverage_ceiling_cents: 3000000
                excluded_causes: ["AWNING_WIND"]
                eligible_vehicle_classes: ["CLASS_A", "CLASS_C", "CAMPER_VAN", "TRAVEL_TRAILER", "FIFTH_WHEEL"]
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - &k_policy_mod
              call: "POST /rv-marketplace/cancellation-policies"
              payload:
                tier: "MODERATE"
                full_refund_hours_before: 72
                partial_refund_pct_bp: 5000
                renter_cancel_penalty_points: 2
                owner_cancel_penalty_points: 6
                owner_cancel_fee_bp: 1000
              as: PlatformAdmin
              captures: { policy_id: "$.data.id" }
            - &k_qual_dr
              call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter_id}"
                check_type: "DRIVING_RECORD"
                result: "CLEAR"
                violation_points: 2
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - &k_qual_tow
              call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter_id}"
                check_type: "TOWING_EXPERIENCE"
                result: "VERIFIED_BASIC"
                violation_points: 0
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - *k_listing
            - &k_doc_title
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "TITLE"
                expires_on: "2028-01-01"
                image_ref: "s3://docs/title-1.pdf"
                expected_listing_version: "${listing_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_title_id: "$.data.id" }
            - &k_doc_reg
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "REGISTRATION"
                expires_on: "2027-06-30"
                image_ref: "s3://docs/reg-1.pdf"
                expected_listing_version: "${listing_v} + 1"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_reg_id: "$.data.id" }
            - &k_doc_ins
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSURANCE_POLICY"
                expires_on: "2027-03-31"
                image_ref: "s3://docs/ins-1.pdf"
                expected_listing_version: "${listing_v} + 2"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_ins_id: "$.data.id" }
            - &k_insp_front
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "EXTERIOR_FRONT"
                image_ref: "s3://insp/front.jpg"
                expected_listing_version: "${listing_v} + 3"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_insp_rear
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "EXTERIOR_REAR"
                image_ref: "s3://insp/rear.jpg"
                expected_listing_version: "${listing_v} + 4"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_insp_interior
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "INTERIOR"
                image_ref: "s3://insp/interior.jpg"
                expected_listing_version: "${listing_v} + 5"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_insp_roof
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "ROOF"
                image_ref: "s3://insp/roof.jpg"
                expected_listing_version: "${listing_v} + 6"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_insp_under
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "UNDERCARRIAGE"
                image_ref: "s3://insp/under.jpg"
                expected_listing_version: "${listing_v} + 7"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_verify_title
              call: "POST /rv-marketplace/vehicle-documents/${doc_title_id}/verify"
              as: PlatformAdmin
            - &k_verify_reg
              call: "POST /rv-marketplace/vehicle-documents/${doc_reg_id}/verify"
              as: PlatformAdmin
            - &k_verify_ins
              call: "POST /rv-marketplace/vehicle-documents/${doc_ins_id}/verify"
              as: PlatformAdmin
            - &k_submit
              call: "POST /rv-marketplace/listings/${listing_id}/submit-for-review"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_list_approve
              call: "POST /rv-marketplace/listings/${listing_id}/decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - &k_fund
              call: "POST /rv-marketplace/renters/${renter_id}/wallet-adjustments"
              payload: { amount_cents_delta: 800000, reason: "initial wallet top-up" }
              as: PlatformAdmin
          trigger:
            - &k_booking
              call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: "$.data.id", booking_v: "$.data.version" }
          assert:
            - "response 201"
            - "data.nights == 4"
            - "data.renter_age_years_at_start == 32"
            - "data.renter_record_points_snapshot == 2"
            - "data.towing_verified_tier == 'BASIC'"
            - "data.base_subtotal_cents == 110896"
            - "data.premium_cents == 24951"
            - "data.delivery_fee_cents == 0"
            - "data.loyalty_tier == 'LOYALTY_TIER_1'"
            - "data.loyalty_discount_cents == 5434"
            - "data.service_fee_cents == 15650"
            - "data.estimated_overage_cents == 0"
            - "data.quoted_total_cents == 146063"
            - "data.hold_amount_cents == 0"
            - "data.trip_status == 'REQUESTED'"
            - "data.settlement_status == 'NONE'"
            - "data.version == 1"

      - name: owner_create_stamps_system_fields_and_version_one
        claim_type: system_fields
        grounds:
          - entities.Owner
          - endpoints[POST /rv-marketplace/owners]
          - endpoints[POST /rv-marketplace/_clock/set_current_utc]
        distinguishing_aspect: >-
          id, created_at, updated_at and version are all server-generated: with
          the logical clock pinned to 2026-08-01T00:00:00Z the created row
          carries created_at == updated_at == that instant and version == 1,
          and none of them appear in the endpoint's declared input.
        test_recipe:
          setup: "Empty DB, logical clock explicitly set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - *k_owner
          assert:
            - "response 201"
            - "data.id is a server-generated UUID string"
            - "data.created_at == '2026-08-01T00:00:00Z'"
            - "data.updated_at == '2026-08-01T00:00:00Z'"
            - "data.version == 1"
            - "data.status == 'ACTIVE'"
            - "data.owner_penalty_points == 0"
            - "data.payout_balance_cents == 0"
            - "data.listed_listing_count == 0"

      - name: listing_create_with_invalid_enum_and_out_of_range_number_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Listing.fields.vehicle_class
          - entities.Listing.fields.min_renter_age
        distinguishing_aspect: >-
          Two distinct type-constraint violations both land on 400
          ERR_INVALID_REQUEST at priority 4: an enum member outside
          {CLASS_A, CLASS_C, CAMPER_VAN, TRAVEL_TRAILER, FIFTH_WHEEL}, and a
          min_renter_age of 31 outside the declared 21..30 range — every
          required field is present in both bodies, so nothing but the value
          itself can be what is rejected.
        test_recipe:
          setup: "Owner exists."
          setup_api_calls:
            - *k_clock
            - *k_owner
          trigger:
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Bad Class Rig"
                vehicle_class: "MOTORHOME"
                gvwr_lbs: 12000
                length_ft: 28
                base_nightly_rate_cents: 20000
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 65
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 425
                min_renter_age: 25
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Bad Age Rig"
                vehicle_class: "CLASS_C"
                gvwr_lbs: 12000
                length_ft: 28
                base_nightly_rate_cents: 20000
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 65
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 425
                min_renter_age: 31
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "trigger step 1: response 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "trigger step 2: response 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /rv-marketplace/listings with owner_id == ${owner_id} still returns total_count == 0"

      - name: renter_qualification_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.RenterQualification
          - endpoints[GET /rv-marketplace/renter-qualifications]
        distinguishing_aspect: >-
          RenterQualification declares common_fields false, so its rows expose
          no version and no updated_at and §1.5 declares no PUT, PATCH or DELETE
          for the resource — corrections are made by appending a newer check,
          which is exactly why the §1.3 selectors sort by checked_at DESC.
        test_recipe:
          setup: "Renter with a single CLEAR 2-point DRIVING_RECORD check."
          setup_api_calls:
            - *k_clock
            - *k_renter
            - *k_qual_dr
          trigger:
            - call: "GET /rv-marketplace/renter-qualifications"
              payload: { renter_id: "${renter_id}", check_type: "DRIVING_RECORD" }
              as: PlatformAdmin
          assert:
            - "response 200"
            - "total_count == 1 and len(data) == 1"
            - "data[0].violation_points == 2 and data[0].result == 'CLEAR'"
            - "data[0] has an 'id' and a 'created_at' but no 'version' and no 'updated_at' key"
            - "§1.5 declares no PUT/PATCH/DELETE endpoint whose path resolves to /rv-marketplace/renter-qualifications/{qualificationId}"

      - name: vehicle_document_with_unknown_listing_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 6]
          - errors[ERR_LISTING_NOT_FOUND]
          - entities.VehicleDocument.fields.listing_id
        distinguishing_aspect: >-
          A VehicleDocument body naming a listing_id that resolves to nothing is
          rejected 404 ERR_LISTING_NOT_FOUND at priority 6 — before the priority
          8 OCC check, so the well-formed expected_listing_version of a real
          listing cannot rescue it and no document row is created.
        test_recipe:
