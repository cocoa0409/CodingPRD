# =============================================================================
# PRD Benchmark Seed Tables — Copyright Registration & Licensing (US Copyright Office)
# Difficulty: Expert
# =============================================================================

scenario: |
  Copyright Registration & Licensing (US Copyright Office): work type & application (eCO),
  deposit copy & fee, examination & correspondence, registration certificate & effective date,
  recordation of transfer, renewal/termination, DMCA takedown & counter-notice,
  royalty/licensing record

domain_name: copyright-registration
api_prefix: /copyright

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency          # OCC on Work.version guarding recordation (chain-of-title supersede)
    - cascading_side_effects          # recordation & registration & termination propagate 2–3 hops
    - dual_variant_calculation        # royalty accrual GROSS/NET; effective-date receipt/decision
    - scheduled_actions               # logical clock gates termination window, DMCA restore window, renewal window

  entity_topology: flat               # every entity is a top-level collection under /copyright with FK references
  state_machine_shape: cyclic         # Application examination<->correspondence loop; DMCA branching; Work compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles              # RightsHolder / Examiner / Complainant own distinct operation sets; Admin operational
  consistency_model: immediate

  # Structural scale (Expert band): 10 entities, ~46 endpoints, 30 errors, 6 calculations,
  # 8 state machines (Application cyclic, DMCA branching, Work compound-derived). The scenario
  # names eight regulated workflows, so the endpoint surface sits above the 20–32 guideline;
  # difficulty is carried by tight cross-entity coupling, not CRUD volume.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Work
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: title, type: string, source: input, description: "Title of the creative work" }
      - { name: work_type, type: enum, source: input, description: "LITERARY | MUSICAL | SOUND_RECORDING | VISUAL_ARTS | DRAMATIC | ARCHITECTURAL | MOTION_PICTURE" }
      - { name: year_of_creation, type: integer, source: input, description: "Year the work was created" }
      - { name: author_name, type: string, source: input, description: "Name of the original author/claimant" }
      - { name: is_published, type: boolean, source: input, default: false, description: "Whether the work has been published" }
      - { name: publication_date, type: datetime, source: input, required: false, description: "Publication date (required only when is_published is true)" }
      - { name: owner_shares, type: array, source: input, description: "List of {name, share_bps}; share_bps are integers summing to exactly 10000. Drives royalty distribution." }
      - { name: owner_user_id, type: string, source: system, description: "Opaque X-User-ID of the RightsHolder who created the work" }
      - { name: registration_status, type: enum, source: computed, description: "UNREGISTERED | PENDING | REGISTERED — compound, derived from Application lifecycle (see state machine)" }
      - { name: current_owner_name, type: string, source: computed, description: "transferee_name of the latest RECORDED (non-SUPERSEDED) Recordation for this work; falls back to author_name when none" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the work this eCO application registers" }
      - { name: applicant_user_id, type: string, source: system, description: "Opaque X-User-ID of the RightsHolder who filed the application (ownership anchor)" }
      - { name: filing_basis, type: enum, source: input, description: "SINGLE_AUTHOR_SINGLE_WORK | STANDARD" }
      - { name: claimant_count, type: integer, source: input, default: 1, description: "Number of claimants named on the application (>=1)" }
      - { name: is_expedited, type: boolean, source: input, default: false, description: "Special-handling (expedited examination) requested" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_EXAMINATION | CORRESPONDENCE | REGISTERED | REFUSED | WITHDRAWN" }
      - { name: fee_due_cents, type: integer, source: computed, description: "Filing fee owed; computed by application_fee at submit" }
      - { name: fee_paid_cents, type: integer, source: computed, default: 0, description: "Total fee paid (PAYMENT amount)" }
      - { name: fee_refunded_cents, type: integer, source: computed, default: 0, description: "Total fee refunded on refuse/withdraw" }
      - { name: net_fee_cents, type: integer, source: computed, default: 0, description: "fee_paid_cents - fee_refunded_cents (conserved quantity)" }
      - { name: correspondence_open, type: boolean, source: computed, default: false, description: "True while an examiner correspondence awaits applicant response" }
      - { name: correspondence_deadline, type: datetime, source: computed, required: false, description: "Deadline for the current correspondence response (set on issue-correspondence)" }
      - { name: correspondence_rounds, type: integer, source: computed, default: 0, description: "Count of correspondence cycles issued" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical-clock time the application was submitted" }
      - { name: fee_paid_at, type: datetime, source: system, required: false, description: "Logical-clock time the full fee was received" }
      - { name: registered_at, type: datetime, source: system, required: false, description: "Logical-clock time of the registration decision" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this deposit copy supports" }
      - { name: deposit_type, type: enum, source: input, description: "ELECTRONIC | PHYSICAL" }
      - { name: copy_count, type: integer, source: input, description: "Number of deposit copies submitted" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | DEFICIENT" }
      - { name: accepted_at, type: datetime, source: system, required: false, description: "Logical-clock time the deposit was accepted" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; 1:1 with the registered application (system-created on register)" }
      - { name: registration_number, type: string, source: system, description: "Office-minted registration number" }
      - { name: effective_date, type: datetime, source: computed, description: "Registration effective date — receipt-completion variant (see effective_date calculation)" }
      - { name: decision_date, type: datetime, source: system, description: "Logical-clock time of the registration decision (registered_at)" }
      - { name: status, type: enum, source: system, description: "ISSUED | RENEWED" }
      - { name: renewal_window_start, type: datetime, source: computed, description: "effective_date + RENEWAL_TERM_YEARS - RENEWAL_WINDOW_SPAN_YEARS" }
      - { name: renewal_deadline, type: datetime, source: computed, description: "effective_date + RENEWAL_TERM_YEARS" }
      - { name: renewed_at, type: datetime, source: system, required: false, description: "Logical-clock time the certificate was renewed" }

  - name: Recordation
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the work whose transfer of ownership is recorded" }
      - { name: transferor_name, type: string, source: input, description: "Party transferring rights" }
      - { name: transferee_name, type: string, source: input, description: "Party receiving rights (becomes Work.current_owner_name)" }
      - { name: execution_date, type: datetime, source: input, description: "Date the transfer document was executed" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock time the transfer was recorded" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the registered work being licensed" }
      - { name: licensor_user_id, type: string, source: system, description: "Opaque X-User-ID of the RightsHolder who granted the license" }
      - { name: licensee_name, type: string, source: input, description: "Party receiving the license" }
      - { name: license_type, type: enum, source: input, description: "EXCLUSIVE | NON_EXCLUSIVE" }
      - { name: right_type, type: enum, source: input, description: "REPRODUCTION | DISTRIBUTION | PERFORMANCE | DERIVATIVE | PUBLIC_DISPLAY" }
      - { name: territory, type: enum, source: input, description: "US | EU | WORLD" }
      - { name: start_date, type: datetime, source: input, description: "License term start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "License term end (exclusive) — half-open interval [start_date, end_date)" }
      - { name: grant_date, type: datetime, source: input, description: "Date the grant/transfer was executed (drives termination window)" }
      - { name: royalty_rate_bps, type: integer, source: input, description: "Royalty rate in basis points (100 bps = 1%)" }
      - { name: royalty_basis, type: enum, source: input, description: "GROSS | NET — selects the royalty_accrual variant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | TERMINATED" }
      - { name: escrow_balance_cents, type: integer, source: computed, default: 0, description: "Sum of accrued_cents over POSTED RoyaltyStatements of this license (conserved quantity)" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license this royalty period reports" }
      - { name: period_start, type: datetime, source: input, description: "Accounting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Accounting period end (inclusive) — closed interval [period_start, period_end]" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Gross revenue for the period" }
      - { name: deduction_cents, type: integer, source: input, default: 0, description: "Allowable deductions (used only under NET basis)" }
      - { name: accrued_cents, type: integer, source: computed, default: 0, description: "Royalty accrued for the period (royalty_accrual)" }
      - { name: distributed_cents, type: integer, source: computed, default: 0, description: "Total distributed to owners on distribute" }
      - { name: distribution, type: array, source: computed, description: "List of {name, amount_cents} per Work.owner_shares (royalty_distribution)" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | DISTRIBUTED | REVERSED | VOIDED" }

  - name: DmcaTakedown
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the work whose infringing use is alleged" }
      - { name: complainant_user_id, type: string, source: system, description: "Opaque X-User-ID of the Complainant who filed the notice" }
      - { name: complainant_name, type: string, source: input, description: "Name of the complaining party" }
      - { name: infringing_url, type: string, source: input, description: "URL of the allegedly infringing material" }
      - { name: status, type: enum, source: system, description: "FILED | EFFECTIVE | COUNTERED | RESTORED | WITHDRAWN" }
      - { name: effective_at, type: datetime, source: system, required: false, description: "Logical-clock time the takedown became effective (material removed)" }
      - { name: countered_at, type: datetime, source: system, required: false, description: "Logical-clock time a counter-notice was forwarded" }
      - { name: restoration_earliest_date, type: datetime, source: computed, required: false, description: "countered_at + RESTORE_MIN_DAYS" }
      - { name: restoration_latest_date, type: datetime, source: computed, required: false, description: "countered_at + RESTORE_MAX_DAYS" }

  - name: CounterNotice
    parent: null
    common_fields: true
    fields:
      - { name: takedown_id, type: string, source: input, description: "FK -> DmcaTakedown.id; the takedown being contested" }
      - { name: subscriber_user_id, type: string, source: system, description: "Opaque X-User-ID of the RightsHolder/subscriber filing the counter-notice" }
      - { name: subscriber_name, type: string, source: input, description: "Name of the counter-notifying party" }
      - { name: statement, type: string, source: input, description: "Good-faith statement contesting the takedown" }
      - { name: status, type: enum, source: system, description: "FORWARDED | COMPLETE" }
      - { name: forwarded_at, type: datetime, source: system, description: "Logical-clock time the counter-notice was forwarded to the complainant" }

  - name: Termination
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license grant being terminated" }
      - { name: terminating_party_name, type: string, source: input, description: "Party (author/heir) serving termination" }
      - { name: notice_served_date, type: datetime, source: input, description: "Date the termination notice was served" }
      - { name: effective_date, type: datetime, source: input, description: "Requested termination effective date (must fall within statutory window)" }
      - { name: window_earliest_date, type: datetime, source: computed, description: "license.grant_date + TERMINATION_WINDOW_START_YEARS" }
      - { name: window_latest_date, type: datetime, source: computed, description: "window_earliest_date + TERMINATION_WINDOW_SPAN_YEARS" }
      - { name: status, type: enum, source: system, description: "NOTICE_SERVED | EFFECTIVE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Work.registration_status (compound / derived from Application lifecycle) ----
  - entity: Work
    field: registration_status
    initial_state: UNREGISTERED
    terminal_states: []
    note: |
      Compound field derived from the state of Applications referencing this work. Recomputed on
      every Application transition listed below. Only one Application may be non-terminal per work
      at a time (enforced by ERR_DUPLICATE_ACTIVE_APPLICATION).
    transitions:
      - from: UNREGISTERED
        to: PENDING
        trigger: "POST /copyright/applications/{id}/submit (Application DRAFT->SUBMITTED)"
        actor: RightsHolder
        preconditions: ["Application.status == DRAFT"]
        side_effects: ["Work.registration_status := PENDING", "increments Work.version by 1"]
      - from: PENDING
        to: REGISTERED
        trigger: "POST /copyright/applications/{id}/register (Application UNDER_EXAMINATION->REGISTERED)"
        actor: Examiner
        preconditions: ["Application.status == UNDER_EXAMINATION"]
        side_effects: ["Work.registration_status := REGISTERED", "increments Work.version by 1"]
      - from: PENDING
        to: UNREGISTERED
        trigger: "POST /copyright/applications/{id}/refuse or /withdraw"
        actor: Examiner
        preconditions: ["Application is refused or withdrawn"]
        side_effects: ["Work.registration_status := UNREGISTERED", "increments Work.version by 1"]

  # ---- Application (cyclic: UNDER_EXAMINATION <-> CORRESPONDENCE) ----
  - entity: Application
    initial_state: DRAFT
    terminal_states: [REGISTERED, REFUSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /copyright/applications/{id}/submit"
        actor: RightsHolder
        preconditions:
          - "Application.status == DRAFT"
          - "acting user id == Application.applicant_user_id (ERR_NOT_RESOURCE_OWNER)"
          - "if Work.is_published then publication_date present"
          - "filing_basis SINGLE_AUTHOR_SINGLE_WORK requires claimant_count == 1 AND Work.is_published == false (ERR_FILING_BASIS_INVALID)"
        side_effects:
          - "compute fee_due_cents via application_fee"
          - "set submitted_at := clock"
          - "Work.registration_status := PENDING (Work.version += 1)"
      - from: SUBMITTED
        to: UNDER_EXAMINATION
        trigger: "POST /copyright/applications/{id}/begin-examination"
        actor: Examiner
        preconditions:
          - "Application.status == SUBMITTED"
          - "an ACCEPTED Deposit exists for this application (ERR_DEPOSIT_NOT_ACCEPTED)"
          - "fee_paid_cents >= fee_due_cents (ERR_FEE_NOT_PAID)"
        side_effects: ["set exam entry state"]
        note: "Cross-entity dependency Application->Deposit and Application->fee state."
      - from: UNDER_EXAMINATION
        to: CORRESPONDENCE
        trigger: "POST /copyright/applications/{id}/issue-correspondence"
        actor: Examiner
        preconditions: ["Application.status == UNDER_EXAMINATION"]
        side_effects:
          - "correspondence_open := true"
          - "correspondence_deadline := clock + CORRESPONDENCE_DAYS days"
          - "correspondence_rounds += 1"
      - from: CORRESPONDENCE
        to: UNDER_EXAMINATION
        trigger: "POST /copyright/applications/{id}/respond-correspondence"
        actor: RightsHolder
        preconditions:
          - "Application.status == CORRESPONDENCE"
          - "acting user id == Application.applicant_user_id (ERR_NOT_RESOURCE_OWNER)"
          - "clock <= correspondence_deadline (ERR_CORRESPONDENCE_EXPIRED)"
        side_effects: ["correspondence_open := false"]
        note: "Cycle: examiner may re-issue correspondence, incrementing correspondence_rounds each loop."
      - from: UNDER_EXAMINATION
        to: REGISTERED
        trigger: "POST /copyright/applications/{id}/register"
        actor: Examiner
        preconditions:
          - "Application.status == UNDER_EXAMINATION (register is invalid while status is CORRESPONDENCE, i.e. a correspondence round is open)"
        side_effects:
          - "create Certificate (registration_number minted; decision_date := clock; effective_date via effective_date calc; renewal_window_start & renewal_deadline computed; status := ISSUED)"
          - "set registered_at := clock"
          - "Work.registration_status := REGISTERED (Work.version += 1)"
        note: "Transitive cascade (depth 2): register -> Certificate created -> Work REGISTERED."
      - from: UNDER_EXAMINATION
        to: REFUSED
        trigger: "POST /copyright/applications/{id}/refuse"
        actor: Examiner
        preconditions: ["Application.status == UNDER_EXAMINATION"]
        side_effects:
          - "fee_refunded_cents += fee_paid_cents; net_fee_cents := fee_paid_cents - fee_refunded_cents (-> 0)"
          - "Work.registration_status := UNREGISTERED (Work.version += 1)"
        note: "Compensating invariant: refund returns net_fee_cents to 0."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /copyright/applications/{id}/withdraw"
        actor: RightsHolder
        preconditions:
          - "Application.status in {DRAFT, SUBMITTED}"
          - "acting user id == Application.applicant_user_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "fee_refunded_cents += fee_paid_cents; net_fee_cents -> 0"
          - "Work.registration_status := UNREGISTERED (Work.version += 1)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /copyright/applications/{id}/withdraw"
        actor: RightsHolder
        preconditions:
          - "Application.status in {DRAFT, SUBMITTED}"
          - "acting user id == Application.applicant_user_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "fee_refunded_cents += fee_paid_cents; net_fee_cents -> 0"
          - "Work.registration_status := UNREGISTERED (Work.version += 1)"

  # ---- Deposit (linear) ----
  - entity: Deposit
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DEFICIENT]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /copyright/deposits/{id}/accept"
        actor: Examiner
        preconditions:
          - "Deposit.status == SUBMITTED"
          - "copy_count >= DEPOSIT_MIN_COPIES_ELECTRONIC when deposit_type==ELECTRONIC, else >= DEPOSIT_MIN_COPIES_PHYSICAL (ERR_DEPOSIT_INSUFFICIENT_COPIES)"
        side_effects: ["set accepted_at := clock"]
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /copyright/deposits/{id}/reject"
        actor: Examiner
        preconditions: ["Deposit.status == SUBMITTED"]
        side_effects: []

  # ---- Certificate (renewal) ----
  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [RENEWED]
    transitions:
      - from: ISSUED
        to: RENEWED
        trigger: "POST /copyright/certificates/{id}/renew"
        actor: RightsHolder
        preconditions:
          - "Certificate.status == ISSUED"
          - "clock >= renewal_window_start AND clock <= renewal_deadline (ERR_RENEWAL_WINDOW)"
        side_effects: ["set renewed_at := clock"]

  # ---- Recordation (immediate record on create; supersedes prior for same work) ----
  - entity: Recordation
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    note: |
      POST /copyright/recordations creates the Recordation already in RECORDED (Office records the
      executed transfer document). OCC-guarded on Work.version (see concurrency_rules).
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system: a newer Recordation for the same work is RECORDED"
        actor: system
        preconditions: ["a later Recordation for Recordation.work_id is created"]
        side_effects: []
    creation_cascade:
      trigger: "POST /copyright/recordations (creates Recordation in RECORDED)"
      side_effects:
        - "prior RECORDED Recordation(s) for same work -> SUPERSEDED"
        - "Work.current_owner_name := transferee_name; Work.version += 1 (link A: recordation -> Work)"
        - "each ACTIVE License on the work -> UNDER_REVIEW (link B: caused by Work owner change)"
        - "each DRAFT RoyaltyStatement under those licenses -> VOIDED (link C: caused by License UNDER_REVIEW)"
      note: "Transitive cascade depth 3, one hop per link (A causes B causes C)."

  # ---- License ----
  - entity: License
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "system: a Recordation changing Work ownership is RECORDED"
        actor: system
        preconditions: ["License.status == ACTIVE", "a Recordation for License.work_id is RECORDED"]
        side_effects: ["each DRAFT RoyaltyStatement under this license -> VOIDED"]
        note: "Middle link of the recordation cascade (caused by Work owner change)."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: a Termination for this license becomes EFFECTIVE"
        actor: system
        preconditions: ["Termination.status transitions to EFFECTIVE"]
        side_effects: ["each POSTED RoyaltyStatement under this license -> REVERSED; escrow_balance_cents -> 0"]
      - from: UNDER_REVIEW
        to: TERMINATED
        trigger: "system: a Termination for this license becomes EFFECTIVE"
        actor: system
        preconditions: ["Termination.status transitions to EFFECTIVE"]
        side_effects: ["each POSTED RoyaltyStatement under this license -> REVERSED; escrow_balance_cents -> 0"]

  # ---- RoyaltyStatement ----
  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [DISTRIBUTED, REVERSED, VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /copyright/royalty-statements/{id}/post"
        actor: RightsHolder
        preconditions:
          - "RoyaltyStatement.status == DRAFT"
          - "parent License.status == ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
        side_effects:
          - "compute accrued_cents via royalty_accrual (GROSS/NET per License.royalty_basis)"
          - "License.escrow_balance_cents += accrued_cents"
      - from: POSTED
        to: DISTRIBUTED
        trigger: "POST /copyright/royalty-statements/{id}/distribute"
        actor: RightsHolder
        preconditions: ["RoyaltyStatement.status == POSTED"]
        side_effects:
          - "compute distribution via royalty_distribution over Work.owner_shares"
          - "distributed_cents := accrued_cents"
          - "License.escrow_balance_cents -= accrued_cents"
      - from: POSTED
        to: REVERSED
        trigger: "POST /copyright/royalty-statements/{id}/reverse"
        actor: RightsHolder
        preconditions: ["RoyaltyStatement.status == POSTED"]
        side_effects: ["License.escrow_balance_cents -= accrued_cents"]
        note: "Compensating invariant: post then reverse leaves escrow_balance_cents unchanged."
      - from: DRAFT
        to: VOIDED
        trigger: "system: parent License enters UNDER_REVIEW (recordation cascade)"
        actor: system
        preconditions: ["parent License transitions ACTIVE -> UNDER_REVIEW"]
        side_effects: []

  # ---- DmcaTakedown (branching: EFFECTIVE -> {COUNTERED, WITHDRAWN}; COUNTERED -> RESTORED) ----
  - entity: DmcaTakedown
    initial_state: FILED
    terminal_states: [RESTORED, WITHDRAWN]
    transitions:
      - from: FILED
        to: EFFECTIVE
        trigger: "POST /copyright/dmca-takedowns/{id}/process"
        actor: Examiner
        preconditions: ["DmcaTakedown.status == FILED"]
        side_effects: ["set effective_at := clock"]
      - from: EFFECTIVE
        to: COUNTERED
        trigger: "POST /copyright/counter-notices (system side-effect)"
        actor: system
        preconditions: ["DmcaTakedown.status == EFFECTIVE"]
        side_effects:
          - "create CounterNotice (status FORWARDED; forwarded_at := clock)"
          - "set countered_at := clock"
          - "restoration_earliest_date := clock + RESTORE_MIN_DAYS days"
          - "restoration_latest_date := clock + RESTORE_MAX_DAYS days"
      - from: COUNTERED
        to: RESTORED
        trigger: "POST /copyright/dmca-takedowns/{id}/restore"
        actor: Examiner
        preconditions:
          - "DmcaTakedown.status == COUNTERED"
          - "clock >= restoration_earliest_date (ERR_RESTORE_TOO_EARLY)"
          - "clock <= restoration_latest_date (ERR_RESTORE_WINDOW_EXPIRED)"
        side_effects: ["the CounterNotice for this takedown -> COMPLETE"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /copyright/dmca-takedowns/{id}/withdraw"
        actor: Complainant
        preconditions: ["DmcaTakedown.status in {FILED, EFFECTIVE}"]
        side_effects: []
      - from: EFFECTIVE
        to: WITHDRAWN
        trigger: "POST /copyright/dmca-takedowns/{id}/withdraw"
        actor: Complainant
        preconditions: ["DmcaTakedown.status in {FILED, EFFECTIVE}"]
        side_effects: []

  # ---- CounterNotice ----
  - entity: CounterNotice
    initial_state: FORWARDED
    terminal_states: [COMPLETE]
    transitions:
      - from: FORWARDED
        to: COMPLETE
        trigger: "system: parent DmcaTakedown is RESTORED"
        actor: system
        preconditions: ["parent DmcaTakedown transitions COUNTERED -> RESTORED"]
        side_effects: []

  # ---- Termination ----
  - entity: Termination
    initial_state: NOTICE_SERVED
    terminal_states: [EFFECTIVE]
    transitions:
      - from: NOTICE_SERVED
        to: EFFECTIVE
        trigger: "POST /copyright/terminations/{id}/effectuate"
        actor: Examiner
        preconditions:
          - "Termination.status == NOTICE_SERVED"
          - "effective_date >= window_earliest_date AND effective_date <= window_latest_date (ERR_TERMINATION_WINDOW)"
        side_effects:
          - "parent License -> TERMINATED (link A)"
          - "each POSTED RoyaltyStatement under the license -> REVERSED (link B, caused by License TERMINATED)"
          - "License.escrow_balance_cents -> 0 (link C, caused by statements reversed)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: recordation-create-stale-work
    parent_entity: Work
    write_endpoint: "POST /copyright/recordations"
    occ_field: "expected_work_version"
    description: |
      Recording a transfer against a Work whose version has advanced since the client last
      observed it is rejected. This captures chain-of-title supersede: another writer has already
      recorded a transfer (which legitimately supersedes the prior owner and bumped Work.version),
      so the current writer's view of the work is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: application_fee
    trigger: "on POST /copyright/applications/{id}/submit (Application DRAFT->SUBMITTED); output field Application.fee_due_cents"
    algorithm: threshold
    formula: |
      if filing_basis == "SINGLE_AUTHOR_SINGLE_WORK" and claimant_count == 1 and is_published == false:
          base = SINGLE_BASE                       # requires the SINGLE basis eligibility (else ERR_FILING_BASIS_INVALID)
      else:
          base = STANDARD_BASE
          base += max(0, claimant_count - 1) * ADDL_CLAIMANT   # additional-claimant surcharge, STANDARD only
      if is_expedited:
          base += EXPEDITE_SURCHARGE
      fee_due_cents = base
    input_set: "single Application row (filing_basis, claimant_count, is_expedited) plus Work.is_published"
    constants: { SINGLE_BASE: 4500, STANDARD_BASE: 6500, ADDL_CLAIMANT: 1500, EXPEDITE_SURCHARGE: 80000 }
    precision: "integer cents; no rounding needed"

  - name: effective_date
    trigger: "on POST /copyright/applications/{id}/register; output field Certificate.effective_date"
    algorithm: aggregation
    formula: |
      # receipt-completion: the date the Office had all three required elements in acceptable form
      effective_date = max(
          date(Application.submitted_at),
          date(Deposit.accepted_at for the ACCEPTED deposit),
          date(Application.fee_paid_at)
      )
    input_set: "the Application, its ACCEPTED Deposit, and its full fee payment"
    constants: {}
    precision: "calendar-day granularity (dates compared at day resolution)"
    variants:
      - name: receipt_completion
        when: "PINNED default per 17 USC 410(d) — the latest of the three receipt timestamps"
        difference: "uses max of submitted/deposit-accepted/fee-paid dates"
      - name: decision_date
        when: "rejected alternative interpretation"
        difference: "would use registered_at (the decision date) instead — produces a later date; stored separately as Certificate.decision_date for comparison"

  - name: royalty_accrual
    trigger: "on POST /copyright/royalty-statements/{id}/post; output field RoyaltyStatement.accrued_cents"
    algorithm: tiered_pricing
    formula: |
      if License.royalty_basis == "GROSS":
          accrued_cents = round_half_up(gross_revenue_cents * royalty_rate_bps / 10000)
      else:  # NET
          accrued_cents = round_half_up((gross_revenue_cents - deduction_cents) * royalty_rate_bps / 10000)
    input_set: "single RoyaltyStatement plus parent License.royalty_basis and royalty_rate_bps"
    constants: { BPS_DENOMINATOR: 10000 }
    precision: "integer cents, round_half_up"
    variants:
      - name: gross
        when: "License.royalty_basis == GROSS"
        difference: "rate applied to gross_revenue_cents; deduction_cents ignored"
      - name: net
        when: "License.royalty_basis == NET"
        difference: "rate applied to (gross_revenue_cents - deduction_cents)"

  - name: royalty_distribution
    trigger: "on POST /copyright/royalty-statements/{id}/distribute; output field RoyaltyStatement.distribution and distributed_cents"
    algorithm: waterfall_allocation
    formula: |
      # PINNED order: floor each owner share, then allocate the leftover cents one-by-one.
      for owner in Work.owner_shares:
          base[owner] = floor(accrued_cents * owner.share_bps / 10000)
      remainder = accrued_cents - sum(base[*])                # remainder is >= 0 and < number_of_owners
      # allocate remainder one cent at a time to owners ordered by share_bps DESC,
      # tie-break by owner index ASC (position in Work.owner_shares; never by id)
      for owner in sort(Work.owner_shares, key=(-share_bps, index_asc))[0:remainder]:
          base[owner] += 1
      distribution = [{name, amount_cents: base[owner]} for owner in Work.owner_shares]
      distributed_cents = sum(base[*])                        # == accrued_cents by construction
    input_set: "the POSTED RoyaltyStatement (accrued_cents) and the Work.owner_shares of the license's work"
    constants: { BPS_DENOMINATOR: 10000 }
    precision: "integer cents; floor per owner then deterministic remainder waterfall (order matters vs round-then-sum)"

  - name: license_escrow_balance
    trigger: "recomputed on RoyaltyStatement post/distribute/reverse/void and on License termination; field License.escrow_balance_cents"
    algorithm: aggregation
    formula: |
      escrow_balance_cents = sum(rs.accrued_cents for rs in RoyaltyStatements of this license where rs.status == "POSTED")
    input_set: "all RoyaltyStatements of the license filtered to status == POSTED"
    constants: {}
    precision: "integer cents"

  - name: termination_window
    trigger: "on POST /copyright/terminations (create); fields Termination.window_earliest_date, window_latest_date"
    algorithm: threshold
    formula: |
      window_earliest_date = License.grant_date + TERMINATION_WINDOW_START_YEARS years
      window_latest_date   = window_earliest_date + TERMINATION_WINDOW_SPAN_YEARS years
      # effectuate requires: window_earliest_date <= effective_date <= window_latest_date
    input_set: "single License.grant_date"
    constants: { TERMINATION_WINDOW_START_YEARS: 35, TERMINATION_WINDOW_SPAN_YEARS: 5 }
    precision: "calendar-year arithmetic; boundaries inclusive (>=, <=)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative, owner_shares sum to 10000, publication_date present when is_published"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 3
    category: business_constraint
    check: "Pagination params in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 3
    category: business_constraint
    check: "set_current_utc body is a valid ISO8601 datetime"
    error_id: ERR_CLOCK_INVALID
    http_status: 422
    applies_to: "POST /copyright/_clock/set_current_utc"
  - priority: 4
    category: existence
    check: "Path resource and every referenced FK entity exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_safety
    check: "For owner-scoped Application actions (submit, pay-fee, respond-correspondence, withdraw), acting X-User-ID == Application.applicant_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /copyright/applications/{id}/submit, /pay-fee, /respond-correspondence, /withdraw"
  - priority: 6
    category: state
    check: "OCC: expected_work_version == Work.version on recordation create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /copyright/recordations"
  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition (includes cross-entity state such as takedown must be EFFECTIVE for counter-notice, license must be ACTIVE for statement post)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Filing basis SINGLE_AUTHOR_SINGLE_WORK requires claimant_count == 1 and Work.is_published == false"
    error_id: ERR_FILING_BASIS_INVALID
    http_status: 409
    applies_to: "POST /copyright/applications/{id}/submit"
  - priority: 7
    category: state
    check: "Counter-notice may only be filed while the takedown is EFFECTIVE"
    error_id: ERR_TAKEDOWN_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /copyright/counter-notices"
  - priority: 7
    category: state
    check: "RoyaltyStatement may only be posted while parent License is ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /copyright/royalty-statements/{id}/post"
  - priority: 8
    category: business_referential
    check: "License may only be created for a Work whose registration_status == REGISTERED"
    error_id: ERR_WORK_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /copyright/licenses"
  - priority: 8
    category: business_referential
    check: "begin-examination requires an ACCEPTED deposit and full fee paid"
    error_id: ERR_DEPOSIT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /copyright/applications/{id}/begin-examination"
  - priority: 8
    category: business_referential
    check: "Only one non-terminal Application may exist per Work"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /copyright/applications"
  - priority: 9
    category: business_temporal
    check: "License start_date < end_date; RoyaltyStatement period_start < period_end"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /copyright/licenses, POST /copyright/royalty-statements"
  - priority: 9
    category: business_temporal
    check: "Termination effective_date within [window_earliest_date, window_latest_date]"
    error_id: ERR_TERMINATION_WINDOW
    http_status: 409
    applies_to: "POST /copyright/terminations/{id}/effectuate"
  - priority: 9
    category: business_temporal
    check: "DMCA restore not before restoration_earliest_date"
    error_id: ERR_RESTORE_TOO_EARLY
    http_status: 409
    applies_to: "POST /copyright/dmca-takedowns/{id}/restore"
  - priority: 9
    category: business_temporal
    check: "DMCA restore not after restoration_latest_date"
    error_id: ERR_RESTORE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /copyright/dmca-takedowns/{id}/restore"
  - priority: 9
    category: business_temporal
    check: "Certificate renewal only within [renewal_window_start, renewal_deadline]"
    error_id: ERR_RENEWAL_WINDOW
    http_status: 409
    applies_to: "POST /copyright/certificates/{id}/renew"
  - priority: 9
    category: business_temporal
    check: "Correspondence response before correspondence_deadline"
    error_id: ERR_CORRESPONDENCE_EXPIRED
    http_status: 409
    applies_to: "POST /copyright/applications/{id}/respond-correspondence"
  - priority: 10
    category: business_constraint
    check: "New EXCLUSIVE license must not overlap an existing ACTIVE/UNDER_REVIEW EXCLUSIVE license for the same work+right_type+territory over a half-open [start_date, end_date) interval"
    error_id: ERR_EXCLUSIVE_CONFLICT
    http_status: 409
    applies_to: "POST /copyright/licenses"
  - priority: 10
    category: business_constraint
    check: "New RoyaltyStatement period must not overlap an existing non-REVERSED/non-VOIDED statement of the same license over a closed [period_start, period_end] interval"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /copyright/royalty-statements"
  - priority: 10
    category: business_constraint
    check: "At most one CounterNotice per DmcaTakedown"
    error_id: ERR_COUNTER_NOTICE_EXISTS
    http_status: 409
    applies_to: "POST /copyright/counter-notices"
  - priority: 10
    category: business_constraint
    check: "Deposit copy_count below the minimum for its type cannot be accepted"
    error_id: ERR_DEPOSIT_INSUFFICIENT_COPIES
    http_status: 409
    applies_to: "POST /copyright/deposits/{id}/accept"
  - priority: 11
    category: business_fiscal
    check: "Fee payment amount_cents must equal Application.fee_due_cents exactly"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /copyright/applications/{id}/pay-fee"
  - priority: 11
    category: business_fiscal
    check: "begin-examination requires fee_paid_cents >= fee_due_cents"
    error_id: ERR_FEE_NOT_PAID
    http_status: 409
    applies_to: "POST /copyright/applications/{id}/begin-examination"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving) ----
  - method: POST
    path: "/copyright/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock := to_iso8601"]

  # ---- Work ----
  - method: POST
    path: "/copyright/works"
    description: "Register a Work record (creative work metadata)"
    roles: [RightsHolder]
    code: 201
    input: [title, work_type, year_of_creation, author_name, owner_shares, "is_published?", "publication_date?"]
    output: Work
    side_effects: ["registration_status := UNREGISTERED", "owner_user_id := X-User-ID", "current_owner_name := author_name"]
  - method: GET
    path: "/copyright/works/{id}"
    description: "Get a Work"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Work
    side_effects: []
  - method: GET
    path: "/copyright/works"
    description: "List Works"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["work_type?", "registration_status?", "limit?", "offset?"]
    output: Work[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/copyright/applications"
    description: "File an eCO application for a work"
    roles: [RightsHolder]
    code: 201
    input: [work_id, filing_basis, "claimant_count?", "is_expedited?"]
    output: Application
    side_effects: ["status := DRAFT", "applicant_user_id := X-User-ID"]
  - method: GET
    path: "/copyright/applications/{id}"
    description: "Get an Application"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/copyright/applications"
    description: "List/filter Applications (reverse-reachability for Application.work_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["work_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/copyright/applications/{id}/submit"
    description: "Submit a DRAFT application (computes fee_due_cents)"
    roles: [RightsHolder]
    code: 200
    input: []
    output: Application
    side_effects: ["status := SUBMITTED", "fee_due_cents computed (application_fee)", "submitted_at := clock", "Work.registration_status := PENDING"]
  - method: POST
    path: "/copyright/applications/{id}/pay-fee"
    description: "Pay the filing fee (exact amount)"
    roles: [RightsHolder]
    code: 200
    input: [amount_cents]
    output: Application
    side_effects: ["fee_paid_cents := amount_cents", "net_fee_cents := fee_paid_cents - fee_refunded_cents", "fee_paid_at := clock"]
  - method: POST
    path: "/copyright/applications/{id}/begin-examination"
    description: "Move a SUBMITTED application into examination"
    roles: [Examiner]
    code: 200
    input: []
    output: Application
    side_effects: ["status := UNDER_EXAMINATION"]
  - method: POST
    path: "/copyright/applications/{id}/issue-correspondence"
    description: "Examiner opens a correspondence request (examination -> correspondence)"
    roles: [Examiner]
    code: 200
    input: [issue_code, message]
    output: Application
    side_effects: ["status := CORRESPONDENCE", "correspondence_open := true", "correspondence_deadline := clock + CORRESPONDENCE_DAYS", "correspondence_rounds += 1"]
  - method: POST
    path: "/copyright/applications/{id}/respond-correspondence"
    description: "Applicant responds to correspondence (correspondence -> examination)"
    roles: [RightsHolder]
    code: 200
    input: [message]
    output: Application
    side_effects: ["status := UNDER_EXAMINATION", "correspondence_open := false"]
  - method: POST
    path: "/copyright/applications/{id}/register"
    description: "Grant registration; mint Certificate; set Work REGISTERED"
    roles: [Examiner]
    code: 200
    input: []
    output: Application
    side_effects: ["status := REGISTERED", "create Certificate (effective_date, decision_date, renewal window)", "registered_at := clock", "Work.registration_status := REGISTERED"]
  - method: POST
    path: "/copyright/applications/{id}/refuse"
    description: "Refuse registration; refund fee"
    roles: [Examiner]
    code: 200
    input: ["reason?"]
    output: Application
    side_effects: ["status := REFUSED", "fee_refunded_cents += fee_paid_cents", "net_fee_cents -> 0", "Work.registration_status := UNREGISTERED"]
  - method: POST
    path: "/copyright/applications/{id}/withdraw"
    description: "Applicant withdraws a DRAFT/SUBMITTED application; refund fee"
    roles: [RightsHolder]
    code: 200
    input: []
    output: Application
    side_effects: ["status := WITHDRAWN", "fee_refunded_cents += fee_paid_cents", "net_fee_cents -> 0", "Work.registration_status := UNREGISTERED"]

  # ---- Deposit ----
  - method: POST
    path: "/copyright/deposits"
    description: "Submit a deposit copy for an application"
    roles: [RightsHolder]
    code: 201
    input: [application_id, deposit_type, copy_count]
    output: Deposit
    side_effects: ["status := SUBMITTED"]
  - method: GET
    path: "/copyright/deposits/{id}"
    description: "Get a Deposit"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: GET
    path: "/copyright/deposits"
    description: "List/filter Deposits (reverse-reachability for Deposit.application_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: POST
    path: "/copyright/deposits/{id}/accept"
    description: "Examiner accepts a deposit"
    roles: [Examiner]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status := ACCEPTED", "accepted_at := clock"]
  - method: POST
    path: "/copyright/deposits/{id}/reject"
    description: "Examiner marks a deposit deficient"
    roles: [Examiner]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status := DEFICIENT"]

  # ---- Certificate ----
  - method: GET
    path: "/copyright/certificates/{id}"
    description: "Get a Certificate"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/copyright/certificates"
    description: "List/filter Certificates (reverse-reachability for Certificate.application_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/copyright/certificates/{id}/renew"
    description: "Renew a certificate within the statutory renewal window"
    roles: [RightsHolder]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status := RENEWED", "renewed_at := clock"]

  # ---- Recordation ----
  - method: POST
    path: "/copyright/recordations"
    description: "Record a transfer of ownership (OCC-guarded on Work.version); supersedes prior recordation and cascades to licenses/statements"
    roles: [Examiner]
    code: 201
    input: [work_id, transferor_name, transferee_name, execution_date, expected_work_version]
    output: Recordation
    side_effects:
      - "status := RECORDED"
      - "prior RECORDED recordation(s) for work -> SUPERSEDED"
      - "Work.current_owner_name := transferee_name"
      - "increments Work.version by 1"
      - "each ACTIVE License on the work -> UNDER_REVIEW"
      - "each DRAFT RoyaltyStatement under those licenses -> VOIDED"
  - method: GET
    path: "/copyright/recordations/{id}"
    description: "Get a Recordation"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Recordation
    side_effects: []
  - method: GET
    path: "/copyright/recordations"
    description: "List/filter Recordations (reverse-reachability for Recordation.work_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["work_id?", "status?", "limit?", "offset?"]
    output: Recordation[]
    side_effects: []

  # ---- License ----
  - method: POST
    path: "/copyright/licenses"
    description: "Create a licensing record for a REGISTERED work (exclusive-overlap checked)"
    roles: [RightsHolder]
    code: 201
    input: [work_id, licensee_name, license_type, right_type, territory, start_date, end_date, grant_date, royalty_rate_bps, royalty_basis]
    output: License
    side_effects: ["status := ACTIVE", "licensor_user_id := X-User-ID", "escrow_balance_cents := 0"]
  - method: GET
    path: "/copyright/licenses/{id}"
    description: "Get a License"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: GET
    path: "/copyright/licenses"
    description: "List/filter Licenses (reverse-reachability for License.work_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["work_id?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  # ---- RoyaltyStatement ----
  - method: POST
    path: "/copyright/royalty-statements"
    description: "Create a royalty statement (DRAFT) for a license period (period-overlap checked)"
    roles: [RightsHolder]
    code: 201
    input: [license_id, period_start, period_end, gross_revenue_cents, "deduction_cents?"]
    output: RoyaltyStatement
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/copyright/royalty-statements/{id}"
    description: "Get a RoyaltyStatement"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/copyright/royalty-statements"
    description: "List/filter RoyaltyStatements (reverse-reachability for RoyaltyStatement.license_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/copyright/royalty-statements/{id}/post"
    description: "Post a DRAFT statement (accrues into escrow)"
    roles: [RightsHolder]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status := POSTED", "accrued_cents computed (royalty_accrual)", "License.escrow_balance_cents += accrued_cents"]
  - method: POST
    path: "/copyright/royalty-statements/{id}/distribute"
    description: "Distribute a POSTED statement to owners"
    roles: [RightsHolder]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status := DISTRIBUTED", "distribution computed (royalty_distribution)", "distributed_cents := accrued_cents", "License.escrow_balance_cents -= accrued_cents"]
  - method: POST
    path: "/copyright/royalty-statements/{id}/reverse"
    description: "Reverse a POSTED statement (compensating action)"
    roles: [RightsHolder]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status := REVERSED", "License.escrow_balance_cents -= accrued_cents"]

  # ---- DmcaTakedown ----
  - method: POST
    path: "/copyright/dmca-takedowns"
    description: "File a DMCA takedown notice"
    roles: [Complainant]
    code: 201
    input: [work_id, complainant_name, infringing_url]
    output: DmcaTakedown
    side_effects: ["status := FILED", "complainant_user_id := X-User-ID"]
  - method: GET
    path: "/copyright/dmca-takedowns/{id}"
    description: "Get a DmcaTakedown"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: DmcaTakedown
    side_effects: []
  - method: GET
    path: "/copyright/dmca-takedowns"
    description: "List/filter DmcaTakedowns (reverse-reachability for DmcaTakedown.work_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["work_id?", "status?", "limit?", "offset?"]
    output: DmcaTakedown[]
    side_effects: []
  - method: POST
    path: "/copyright/dmca-takedowns/{id}/process"
    description: "Office processes takedown; material removed (FILED -> EFFECTIVE)"
    roles: [Examiner]
    code: 200
    input: []
    output: DmcaTakedown
    side_effects: ["status := EFFECTIVE", "effective_at := clock"]
  - method: POST
    path: "/copyright/dmca-takedowns/{id}/restore"
    description: "Restore material after the counter-notice window (COUNTERED -> RESTORED)"
    roles: [Examiner]
    code: 200
    input: []
    output: DmcaTakedown
    side_effects: ["status := RESTORED", "CounterNotice for takedown -> COMPLETE"]
  - method: POST
    path: "/copyright/dmca-takedowns/{id}/withdraw"
    description: "Complainant withdraws the takedown"
    roles: [Complainant]
    code: 200
    input: []
    output: DmcaTakedown
    side_effects: ["status := WITHDRAWN"]

  # ---- CounterNotice ----
  - method: POST
    path: "/copyright/counter-notices"
    description: "File a counter-notice against an EFFECTIVE takedown (forwards & counters)"
    roles: [RightsHolder]
    code: 201
    input: [takedown_id, subscriber_name, statement]
    output: CounterNotice
    side_effects: ["status := FORWARDED", "subscriber_user_id := X-User-ID", "forwarded_at := clock", "DmcaTakedown EFFECTIVE -> COUNTERED (sets countered_at, restoration window)"]
  - method: GET
    path: "/copyright/counter-notices/{id}"
    description: "Get a CounterNotice"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: CounterNotice
    side_effects: []
  - method: GET
    path: "/copyright/counter-notices"
    description: "List/filter CounterNotices (reverse-reachability for CounterNotice.takedown_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["takedown_id?", "status?", "limit?", "offset?"]
    output: CounterNotice[]
    side_effects: []

  # ---- Termination ----
  - method: POST
    path: "/copyright/terminations"
    description: "Serve a termination of transfer against a license grant"
    roles: [RightsHolder]
    code: 201
    input: [license_id, terminating_party_name, notice_served_date, effective_date]
    output: Termination
    side_effects: ["status := NOTICE_SERVED", "window_earliest_date & window_latest_date computed (termination_window)"]
  - method: GET
    path: "/copyright/terminations/{id}"
    description: "Get a Termination"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: []
    output: Termination
    side_effects: []
  - method: GET
    path: "/copyright/terminations"
    description: "List/filter Terminations (reverse-reachability for Termination.license_id)"
    roles: [RightsHolder, Examiner, Complainant, Admin]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: Termination[]
    side_effects: []
  - method: POST
    path: "/copyright/terminations/{id}/effectuate"
    description: "Effectuate a termination within the statutory window; terminate the license and cascade"
    roles: [Examiner]
    code: 200
    input: []
    output: Termination
    side_effects: ["status := EFFECTIVE", "License -> TERMINATED", "POSTED RoyaltyStatements -> REVERSED", "License.escrow_balance_cents -> 0"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting RightsHolder is not the applicant that owns this application" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, negative integer, owner_shares not summing to 10000, missing publication_date when published" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK entity does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_version does not match current Work.version on recordation create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_FILING_BASIS_INVALID, http: 409, condition: "SINGLE_AUTHOR_SINGLE_WORK basis used with claimant_count != 1 or a published work" }
  - { id: ERR_TAKEDOWN_NOT_EFFECTIVE, http: 409, condition: "Counter-notice filed while takedown is not EFFECTIVE" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "RoyaltyStatement posted while parent License is not ACTIVE" }
  - { id: ERR_WORK_NOT_REGISTERED, http: 409, condition: "License created for a work whose registration_status != REGISTERED" }
  - { id: ERR_DEPOSIT_NOT_ACCEPTED, http: 409, condition: "begin-examination without an ACCEPTED deposit for the application" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "A non-terminal application already exists for this work" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "start_date >= end_date (license) or period_start >= period_end (statement)" }
  - { id: ERR_TERMINATION_WINDOW, http: 409, condition: "Termination effective_date outside [window_earliest_date, window_latest_date]" }
  - { id: ERR_RESTORE_TOO_EARLY, http: 409, condition: "DMCA restore before restoration_earliest_date" }
  - { id: ERR_RESTORE_WINDOW_EXPIRED, http: 409, condition: "DMCA restore after restoration_latest_date" }
  - { id: ERR_RENEWAL_WINDOW, http: 409, condition: "Certificate renewal outside [renewal_window_start, renewal_deadline]" }
  - { id: ERR_CORRESPONDENCE_EXPIRED, http: 409, condition: "Correspondence response after correspondence_deadline" }
  - { id: ERR_EXCLUSIVE_CONFLICT, http: 409, condition: "New exclusive license overlaps an existing exclusive license (same work+right_type+territory, half-open interval)" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New royalty period overlaps an existing non-reversed/non-voided statement (closed interval) for the license" }
  - { id: ERR_COUNTER_NOTICE_EXISTS, http: 409, condition: "A counter-notice already exists for this takedown" }
  - { id: ERR_DEPOSIT_INSUFFICIENT_COPIES, http: 409, condition: "Deposit copy_count below the minimum for its type" }
  - { id: ERR_FEE_AMOUNT_MISMATCH, http: 409, condition: "Fee payment amount_cents != Application.fee_due_cents" }
  - { id: ERR_FEE_NOT_PAID, http: 409, condition: "begin-examination while fee_paid_cents < fee_due_cents" }
  - { id: ERR_INVALID_PAGINATION, http: 422, condition: "limit or offset out of allowed range" }
  - { id: ERR_CLOCK_INVALID, http: 422, condition: "set_current_utc given a non-ISO8601 time value" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightsHolder
    description: "Author/claimant/rights owner: files works, applications, deposits, pays fees, responds to correspondence, manages licenses, royalty statements, counter-notices, terminations, renewals"
    identity: "opaque"
    exclusive_operations:
      - "POST /copyright/works"
      - "POST /copyright/applications"
      - "POST /copyright/applications/{id}/submit"
      - "POST /copyright/applications/{id}/pay-fee"
      - "POST /copyright/applications/{id}/respond-correspondence"
      - "POST /copyright/applications/{id}/withdraw"
      - "POST /copyright/deposits"
      - "POST /copyright/certificates/{id}/renew"
      - "POST /copyright/licenses"
      - "POST /copyright/royalty-statements"
      - "POST /copyright/royalty-statements/{id}/post"
      - "POST /copyright/royalty-statements/{id}/distribute"
      - "POST /copyright/royalty-statements/{id}/reverse"
      - "POST /copyright/counter-notices"
      - "POST /copyright/terminations"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Examiner
    description: "US Copyright Office examiner/registration specialist: examines applications, corresponds, registers/refuses, decides deposits, records transfers, processes DMCA, effectuates terminations"
    identity: "opaque"
    exclusive_operations:
      - "POST /copyright/applications/{id}/begin-examination"
      - "POST /copyright/applications/{id}/issue-correspondence"
      - "POST /copyright/applications/{id}/register"
      - "POST /copyright/applications/{id}/refuse"
      - "POST /copyright/deposits/{id}/accept"
      - "POST /copyright/deposits/{id}/reject"
      - "POST /copyright/recordations"
      - "POST /copyright/dmca-takedowns/{id}/process"
      - "POST /copyright/dmca-takedowns/{id}/restore"
      - "POST /copyright/terminations/{id}/effectuate"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Complainant
    description: "DMCA complaining party: files and withdraws takedown notices"
    identity: "opaque"
    exclusive_operations:
      - "POST /copyright/dmca-takedowns"
      - "POST /copyright/dmca-takedowns/{id}/withdraw"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Admin
    description: "Operational role: controls the logical clock; read access to all resources"
    identity: "opaque"
    exclusive_operations:
      - "POST /copyright/_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
