      - name: file_fee_quoted_vs_assessed_cutoff_rollover
        grounds:
          - calculations.file_fee
          - entities.AchFile.fields.quoted_fee_cents
          - entities.AchFile.fields.assessed_fee_cents
          - state_machines.AchFile.WAREHOUSED_to_RELEASED
        distinguishing_aspect: |
          Pricing domain on AchFile: identical file contents price two ways —
          quoted_fee_cents == 1322 on the requested SAME_DAY_1 rate card, but the
          cutoff is missed (13:00 > 12:00 close) so release rolls the file to
          NEXT_DAY and assessed_fee_cents == 471. Same entries, two valid fee
          algorithms, different cents.
        test_recipe:
          setup:
            - "CutoffWindows: SAME_DAY_1 09:00-12:00 (per_entry 150, file 500, large surcharge 400); NEXT_DAY 00:00-23:00 (60/200/100)"
            - "Originator ACTIVE, limit 1000000000, fee_discount_bps 333"
            - "File requested SAME_DAY_1 effective 2026-08-03 with entries [DEBIT 1000000, DEBIT 20000000, DEBIT 500000] appended at 10:00 (SAME_DAY_1 still open); quoted computed then"
            - "Clock advanced to 2026-08-03T13:00:00Z — SAME_DAY_1 closed, no other same-day window defined"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "SAME_DAY_1", opens_at_utc: "09:00", closes_at_utc: "12:00", per_entry_fee_cents: 150, file_fee_cents: 500, large_entry_surcharge_cents: 400 }
              as: OdfiOperations
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Beta Corp", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 1000000000, fee_discount_bps: 333 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "SAME_DAY_1", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 1000000, receiver_account: "r-1", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 20000000, receiver_account: "r-2", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 500000, receiver_account: "r-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T13:00:00Z" }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
          assert:
            - "AchFile.${f_id}.quoted_fee_cents == 1322    # 500 + rhu(150*.9667)=145 + rhu(550*.9667)=532 + 145"
            - "AchFile.${f_id}.assessed_fee_cents == 471   # 200 + 58 + rhu(160*.9667)=155 + 58 on NEXT_DAY card"
            - "AchFile.${f_id}.assigned_window_kind == NEXT_DAY"
            - "AchFile.${f_id}.settlement_date == \"2026-08-04\""
            - "AchFile.${f_id}.status == RELEASED"

      - name: exposure_gross_vs_debit_only
        grounds:
          - calculations.outstanding_exposure
          - entities.Originator.fields.outstanding_exposure_gross_cents
          - entities.Originator.fields.outstanding_exposure_debit_cents
        distinguishing_aspect: |
          Fiscal domain on Originator: with identical entry data the gross
          variant reports 15000000 cents while the debit-only variant (the one
          the limit enforces) reports 10000000 — CREDIT entries move gross but
          never move the enforced variant.
        test_recipe:
          setup:
            - "CutoffWindow NEXT_DAY 00:00-23:00 (60/200/100)"
            - "Originator ACTIVE, limit 10000000, discount 0"
            - "File req NEXT_DAY effective 2026-08-03; appends: DEBIT 6000000, then CREDIT 5000000, then DEBIT 4000000 (debit total hits the limit exactly — admitted)"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Gamma LLC", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v1: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v1}"
                entries:
                  - { direction: "DEBIT", amount_cents: 6000000, receiver_account: "g-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v2: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v2}"
                entries:
                  - { direction: "CREDIT", amount_cents: 5000000, receiver_account: "g-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v3: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v3}"
                entries:
                  - { direction: "DEBIT", amount_cents: 4000000, receiver_account: "g-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /ach/originators/${org_id}"
              payload: {}
              as: OdfiOperations
          assert:
            - "Originator.${org_id}.outstanding_exposure_gross_cents == 15000000"
            - "Originator.${org_id}.outstanding_exposure_debit_cents == 10000000"
            - "Third append admitted: debit total equals the limit exactly (strictly-greater rejects)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (2 instances, modes (b) and (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: file_fee_per_entry_rounding_order
        grounds:
          - calculations.file_fee
          - entities.Originator.fields.fee_discount_bps
          - entities.CutoffWindow.fields.per_entry_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-entry-then-sum.
          With per_entry 61 and discount 5000 bps, per-entry rounding gives
          100 + 3*rhu(30.5)=31 = 193; the alternative sum-then-round reading
          gives 100 + rhu(91.5) = 192. Exactly one cent of divergence on a
          3-entry file.
        test_recipe:
          setup:
            - "CutoffWindow SAME_DAY_2 13:00-16:00 (per_entry 61, file 100, surcharge 0)"
            - "Originator ACTIVE, limit 100000000, fee_discount_bps 5000"
            - "File req SAME_DAY_2 effective 2026-08-03"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "SAME_DAY_2", opens_at_utc: "13:00", closes_at_utc: "16:00", per_entry_fee_cents: 61, file_fee_cents: 100, large_entry_surcharge_cents: 0 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Delta Inc", sec_codes_allowed: ["WEB"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 5000 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "WEB", requested_window_kind: "SAME_DAY_2", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "d-1", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 2000, receiver_account: "d-2", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 3000, receiver_account: "d-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
          assert:
            - "AchFile.${f_id}.quoted_fee_cents == 193  # 100 + 31 + 31 + 31; NOT 192 (sum-then-round)"
            - "AchFile.${f_id}.entry_count == 3"
            - "AchFile.${f_id}.total_amount_cents == 6000"

      - name: batch_net_pinned_evaluation_order
        grounds:
          - calculations.batch_settlement_net
          - entities.SettlementBatch.fields.expected_net_cents
          - entities.SettlementBatch.fields.posted_net_cents
          - state_machines.SettlementBatch.OPEN_to_DISPATCHED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: fee tiering keys on per-file
          data frozen at release while the net keys on fees — the pinned order
          (principal_net = 4000000, then fee_total = 316 + 258 = 574, then
          expected = 3999426) is the only reading that yields 3999426; an
          implementation that recomputes fees from batch-level aggregates at
          dispatch diverges.
        test_recipe:
          setup:
            - "CutoffWindow NEXT_DAY 00:00-23:00 (60/200/100); originator ACTIVE, limit 100000000, discount 333"
            - "File A (DEBIT 3000000 + DEBIT 2000000) and file B (CREDIT 1000000), both req NEXT_DAY effective 2026-08-03, both released at 13:00 into the same auto-created batch (NEXT_DAY, 2026-08-04)"
            - "No re-flow items exist, so the dispatch-time sweep snapshot is empty"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Epsilon Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 333 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T13:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fa_id: "$.data.id", fa_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fa_id}/entries"
              payload:
                expected_file_version: "${fa_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 3000000, receiver_account: "e-1", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 2000000, receiver_account: "e-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${fa_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fb_id: "$.data.id", fb_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fb_id}/entries"
              payload:
                expected_file_version: "${fb_v}"
                entries:
                  - { direction: "CREDIT", amount_cents: 1000000, receiver_account: "e-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${fb_id}/release"
              payload: {}
              as: OdfiOperations
          trigger:
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b_id}/reconcile"
              payload: {}
              as: OdfiFinance
              as_user_id: "fin-1"
          assert:
            - "AchFile.${fa_id}.assessed_fee_cents == 316   # 200 + 58 + 58"
            - "AchFile.${fb_id}.assessed_fee_cents == 258   # 200 + 58"
            - "SettlementBatch.${b_id}.expected_net_cents == 3999426  # 4000000 - 574"
            - "SettlementBatch.${b_id}.posted_net_cents == 3999426"
            - "SettlementBatch.${b_id}.recon_variance_cents == 0"
            - "SettlementBatch.${b_id}.status == RECONCILED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, 3 different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ach_entry_representment_cycle_exhaustion
        grounds:
          - state_machines.AchEntry.SETTLED_to_RETURNED
          - state_machines.AchEntry.RETURNED_to_TRANSMITTED
          - entities.AchEntry.fields.representment_count
          - errors[ERR_REPRESENTMENT_EXHAUSTED]
        distinguishing_aspect: |
          Cyclic machine on AchEntry: SETTLED -> RETURNED -> TRANSMITTED ->
          SETTLED -> RETURNED loops twice (representment_count 0->1->2); the
          third re-presentment attempt at count == 2 fails with
          ERR_REPRESENTMENT_EXHAUSTED and the entry exits via close to CLOSED.
        test_recipe:
          setup:
            - "CutoffWindow NEXT_DAY 00:00-23:00 (60/200/100); originator ACTIVE, limit 100000000, discount 0"
            - "Entry X (DEBIT 2000000) in file F1 effective 2026-08-03, settled via batch B1; helper files F2 (DEBIT 700000) and F3 (DEBIT 500000) provide the later batch settles that re-settle X"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Zeta LLC", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
