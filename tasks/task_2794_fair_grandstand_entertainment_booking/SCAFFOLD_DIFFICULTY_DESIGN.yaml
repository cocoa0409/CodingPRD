              as: FairOperationsDirector
            - call: "POST /grandstand/ticket-scales/${sc1}/sales-batches"
              payload: { batch_kind: "SALE", quantity: 1800, channel: "ONLINE" }
              as: BoxOfficeManager
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "GUARANTEE_PLUS_BACKEND", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-25", load_in_start_utc: "2026-08-25T14:00:00.000Z", load_out_end_utc: "2026-08-25T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of2: "$.data.id" }
            - call: "POST /grandstand/offers/${of2}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of2}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of2}" }
              as: TalentBuyer
              captures: { bk2: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk2}" }
              as: ProductionManager
              captures: { adv2: "$.data[0].id" }
            - call: "GET /grandstand/production-advances/${adv2}/rider-items"
              payload: {}
              as: ProductionManager
              captures: { seed2: "$.data[0].id" }
            - call: "POST /grandstand/production-advances/${adv2}/rider-items"
              payload: { category: "LIGHTING", description: "House lighting package", requested_cost_cents: 0, is_critical: false, artist_recoupable: false }
              as: ProductionManager
              captures: { lit2: "$.data.id" }
            - call: "POST /grandstand/rider-items/${lit2}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/rider-items/${seed2}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/production-advances/${adv2}/complete"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/show-bookings/${bk2}"
              payload: {}
              as: BoxOfficeManager
              captures: { bk2_v: "$.data.version" }
            - call: "POST /grandstand/show-bookings/${bk2}/ticket-scales"
              payload: { expected_show_booking_version: "${bk2_v}", seating_type: "RESERVED", tier_name: "GOLD", face_price_cents: 6295, allotment_seats: 2000, bundled_with_gate_admission: false, facility_fee_cents: 400 }
              as: BoxOfficeManager
              captures: { sc2: "$.data.id" }
            - call: "POST /grandstand/show-bookings/${bk2}/announce"
              payload: { doors_time_utc: "2026-08-25T18:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/ticket-scales/${sc2}/sales-batches"
              payload: { batch_kind: "SALE", quantity: 1800, channel: "ONLINE" }
              as: BoxOfficeManager
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T23:30:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/show-bookings/${bk1}/mark-performed"
              payload: {}
              as: FairOperationsDirector
            - call: "POST /grandstand/show-bookings/${bk2}/mark-performed"
              payload: {}
              as: FairOperationsDirector
            - call: "POST /grandstand/show-bookings/${bk1}/settlements"
              payload: { basis: "FINAL", merch_gross_cents: 900000, merch_seller: "ARTIST" }
              as: TalentBuyer
              captures: { se1: "$.data.id" }
            - call: "POST /grandstand/show-bookings/${bk2}/settlements"
              payload: { basis: "FINAL", merch_gross_cents: 900000, merch_seller: "ARTIST" }
              as: TalentBuyer
              captures: { se2: "$.data.id" }
          trigger:
            - call: "POST /grandstand/settlements/${se1}/submit"
