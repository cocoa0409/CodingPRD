      - name: entry_fee_rounds_each_line_before_summation
        claim_type: precision
        grounds:
          - calculations.entry_fee_assessment.precision
          - calculations.entry_fee_assessment.variants
        excluded_because:
          difficulty_instance: combinatorial_formula / entry_fee_per_line_rounding_before_summation
          rationale: "That §1.8 instance compares the pinned per-line result against the sum-then-round figure for the same entry, which is exactly this precision claim at the divergent point."

      - name: sale_split_variants_diverge_on_identical_price
        claim_type: variant_divergence
        grounds:
          - calculations.sale_settlement_split.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / sale_split_tax_inclusive_versus_purchase_award_tax_additional
          rationale: "That §1.8 instance prices the identical 250000 both ways and asserts the 75575-cent artist delta, covering divergence and the selection context together."

      - name: round_mean_switches_from_provisional_to_certified
        claim_type: variant_selection
        grounds:
          - calculations.artwork_round_mean.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / artwork_round_mean_provisional_versus_quorum_certified
          rationale: "That §1.8 instance reads the provisional mean mid-round and the certified mean after completion on the same artwork, which is the variant-selection-in-context claim."

      - name: retention_reconciled_after_a_sale_is_voided
        claim_type: reconciliation
        grounds:
          - calculations.settlement_retention
          - state_machines.Sale.PAID_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / sale_void_restores_exhibition_money_aggregates
          rationale: "That §1.8 instance asserts the post-void recompute of every money aggregate including council_retention_cents, so the reconciliation delta is already pinned."

  # =========================================================================
  # SECTION: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_x_user_role_header_returns_unauthenticated_before_role_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Both the authentication rule (p1) and the role rule (p2) are violated by the same request — no X-User-Role header AND an operation reserved for CallManager — and the response must be the p1 error 401 ERR_UNAUTHENTICATED, never the p2 403."
        test_recipe:
          setup: ["No fixtures required; the request itself is malformed at the header layer."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
