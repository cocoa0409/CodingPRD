              payload: { tour_id: "${t_id}", city: "Redding", venue_name: "CI2 Hall", show_date: "2026-08-10T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CI2-TEE", name: "CI2 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "WAREHOUSE", destination_show_id: "${s_id}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 100 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /merch/shipments/${sh_id}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shipments/${sh_id}/cancel"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "after dispatch: warehouse_stock_by_size.OS == 900 (100 decremented)"
            - "after cancel of the DISPATCHED shipment: warehouse_stock_by_size.OS == 1000 (full compensating restore)"
            - "Shipment.${sh_id}.status == CANCELLED"
            - "no Allocation rows were created for Show.${s_id} by the cancelled shipment"
