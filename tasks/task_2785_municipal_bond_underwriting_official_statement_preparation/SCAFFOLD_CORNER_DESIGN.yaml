          - errors[ERR_DEAL_INVALID_STATE]
        distinguishing_aspect: |
          The guard lives on a DIFFERENT entity: the period is SCHEDULED and the clock is
          inside its window, yet open must fail with ERR_DEAL_INVALID_STATE (not
          ERR_ORDER_PERIOD_INVALID_STATE and not ERR_ORDER_PERIOD_WINDOW_CLOSED) because the
          deal is still STRUCTURING. Designating a sale method then makes the identical call
          succeed, which isolates the deal-state guard as the sole cause.
        test_recipe:
          setup:
            - "A STRUCTURING deal of 5,000,000 carries one tranche and one SCHEDULED institutional order period for 13:00-17:00."
            - "The logical clock stands at 2026-08-05T14:00:00.000Z, inside that window."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
