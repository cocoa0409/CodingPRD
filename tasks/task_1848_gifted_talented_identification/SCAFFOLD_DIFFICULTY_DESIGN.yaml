            - { call: "POST /gifted/cases", payload: { student_id: "${w05}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W06", legal_name: "W 06", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w06" }, as: GiftedCoordinator, captures: { w06: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w06}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W07", legal_name: "W 07", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w07" }, as: GiftedCoordinator, captures: { w07: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w07}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W08", legal_name: "W 08", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w08" }, as: GiftedCoordinator, captures: { w08: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w08}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W09", legal_name: "W 09", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w09" }, as: GiftedCoordinator, captures: { w09: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w09}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W10", legal_name: "W 10", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w10" }, as: GiftedCoordinator, captures: { w10: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w10}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "B01", legal_name: "B 01", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b01" }, as: GiftedCoordinator, captures: { b01: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${b01}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "B02", legal_name: "B 02", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b02" }, as: GiftedCoordinator, captures: { b02: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${b02}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "B03", legal_name: "B 03", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b03" }, as: GiftedCoordinator, captures: { b03: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${b03}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "B04", legal_name: "B 04", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b04" }, as: GiftedCoordinator, captures: { b04: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${b04}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "B05", legal_name: "B 05", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b05" }, as: GiftedCoordinator, captures: { b05: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${b05}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_b5: $.data.id } }
            - { call: "POST /gifted/cases/${case_b5}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b5}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b5}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
