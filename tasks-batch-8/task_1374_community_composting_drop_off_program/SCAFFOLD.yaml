    side_effects: ["status=OPEN; sla_due_at = reported_at + 72h; site posture recompute"]
  - method: GET
    path: "/programs/{id}/sites/{siteId}/complaints"
    description: "List complaints at a site"
    roles: [ProgramAdmin, SiteHost, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "kind?"]
    output: ComplaintTicket[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/sites/{siteId}/complaints/{complaintId}/acknowledge"
    description: "Acknowledge a complaint"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ComplaintTicket
    side_effects: ["status → ACKNOWLEDGED; acknowledged_at set"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/complaints/{complaintId}/resolve"
    description: "Resolve a complaint"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ComplaintTicket
    side_effects: ["status → RESOLVED; resolved_at set; posture recompute"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/complaints/{complaintId}/reopen"
