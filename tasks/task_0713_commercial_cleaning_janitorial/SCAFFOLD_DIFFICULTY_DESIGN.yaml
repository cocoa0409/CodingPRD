  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_conservation_approve_then_cancel
        grounds:
          - state_machines.SupplyRequisition.REQUESTED_to_APPROVED
          - state_machines.SupplyRequisition.APPROVED_to_CANCELLED
          - entities.SupplyBudget.fields.committed_cents
          - entities.SupplyBudget.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents): invariant committed_cents + remaining_cents == total_cents
          holds before, after approve (committed 20000 / remaining 30000), and after compensating
          cancel (committed 0 / remaining 50000) — zero drift.
        test_recipe:
          setup:
            - "A SupplyBudget total 50000 with one APPROVED requisition for 20000 (committed 20000, remaining 30000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Inv Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "I RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 4000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Lobby", sqft: 4000, soil_level: "LIGHT", frequency_per_week: 1 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/send"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/contracts"
              payload: { proposal_id: "${prop}", term_months: 12 }
              as: SalesRep
              captures: { ctr: "$.data.id" }
            - call: "POST /accounts/${acct}/contracts/${ctr}/supply-budget"
              payload: { total_cents: 50000 }
              as: OperationsManager
              captures: { budg: "$.data.id" }
            - call: "GET /accounts/${acct}/supply-budgets/${budg}"
              payload: {}
              as: OperationsManager
              captures: { budg_v0: "$.data.version" }
            - call: "POST /accounts/${acct}/supply-budgets/${budg}/requisitions"
              payload: { item_label: "Mops", amount_cents: 20000 }
              as: OperationsManager
              captures: { req: "$.data.id" }
            - call: "POST /accounts/${acct}/supply-requisitions/${req}/approve"
              payload: { expected_supply_budget_version: "${budg_v0}" }
              as: OperationsManager
          trigger:
            - call: "POST /accounts/${acct}/supply-requisitions/${req}/cancel"
              payload: {}
              as: OperationsManager
          assert:
            - "SupplyBudget.${budg}.committed_cents == 0"
            - "SupplyBudget.${budg}.remaining_cents == 50000"
            - "SupplyBudget.${budg}.committed_cents + SupplyBudget.${budg}.remaining_cents == 50000"

