        distinguishing_aspect: |
          REJECTED accepts no transition at all: review, request-evidence, evidence, approve and
          dispute must every one fail. The reject call itself stores rejection_reason and
          reviewed_by_user_id and leaves the Work at rights_state UNMATCHED with
          approved_master_share_bps 0 — a rejected claim registers nothing.
        test_recipe:
          setup:
