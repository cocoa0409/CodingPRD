scenario: "1000. Fitness & Wellness Reimbursement Benefit: eligible-member & benefit allowance, gym/studio network & eligibility, claim/reimbursement or direct-pay, visit verification & fraud, employer/health-plan funding, tier & family, statement, reporting"
domain_name: fitness-wellness-reimbursement
api_prefix: "/api"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer legal name" }
      - { name: funding_model, type: enum, source: input, description: "How the benefit is funded", constraints: "PREFUNDED | PAY_AS_YOU_GO" }
      - { name: status, type: enum, source: system, description: "Employer lifecycle status", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; sponsoring employer" }
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: benefit_year, type: integer, source: input, description: "Calendar benefit year, e.g. 2026" }
      - { name: period_start, type: datetime, source: input, description: "Plan coverage start, closed interval lower bound" }
      - { name: period_end, type: datetime, source: input, description: "Plan coverage end, closed interval upper bound; must be > period_start" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: DRAFT, constraints: "DRAFT | ACTIVE | RETIRED" }

  - name: PlanTier
    parent: BenefitPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; owning plan" }
      - { name: tier_code, type: enum, source: input, description: "Tier key, unique per plan", constraints: "INDIVIDUAL | COUPLE | FAMILY" }
      - { name: annual_allowance_cents, type: integer, source: input, description: "Base annual allowance for this tier" }
      - { name: quarterly_cap_cents, type: integer, source: input, description: "Max reimbursable per calendar quarter" }
      - { name: per_claim_cap_cents, type: integer, source: input, description: "Max approved amount per single claim" }
      - { name: visit_frequency_cap, type: integer, source: input, description: "Max visits in any rolling 30-day window" }
      - { name: dependent_cap_pct, type: number, source: input, description: "Fraction of base allowance added per ACTIVE dependent (FAMILY tier only)" }
      - { name: in_network_pct, type: number, source: input, description: "Coverage fraction for IN_NETWORK providers" }
      - { name: preferred_pct, type: number, source: input, description: "Coverage fraction for PREFERRED providers" }
      - { name: out_of_network_pct, type: number, source: input, description: "Coverage fraction for OUT_OF_NETWORK providers" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; employer of the member" }
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; plan the member is attached to" }
      - { name: external_ref, type: string, source: input, description: "Employer-side employee reference" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier_code, type: enum, source: input, description: "Tier the member is enrolled under", constraints: "INDIVIDUAL | COUPLE | FAMILY" }
      - { name: hire_date, type: datetime, source: input, description: "Employment start; drives eligibility wait" }
      - { name: eligibility_date, type: datetime, source: computed, description: "hire_date + ELIGIBILITY_WAIT_DAYS (30 days)" }
      - { name: eligibility_status, type: enum, source: system, description: "Member eligibility lifecycle", default: PENDING, constraints: "PENDING | ELIGIBLE | SUSPENDED | TERMINATED" }

  - name: Dependent
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; sponsoring member" }
      - { name: full_name, type: string, source: input, description: "Dependent full name" }
      - { name: relationship, type: enum, source: input, description: "Relationship to member", constraints: "SPOUSE | CHILD | DOMESTIC_PARTNER" }
      - { name: birth_date, type: datetime, source: input, description: "Dependent birth date; CHILD must be < 26 at plan period_start" }
      - { name: status, type: enum, source: system, description: "Dependent lifecycle", default: ACTIVE, constraints: "ACTIVE | INACTIVE" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Gym/studio name" }
      - { name: modality, type: enum, source: input, description: "Venue modality", constraints: "GYM | STUDIO | APP | POOL" }
      - { name: network_tier, type: enum, source: input, description: "Network placement", constraints: "IN_NETWORK | PREFERRED | OUT_OF_NETWORK" }
      - { name: contract_start, type: datetime, source: input, description: "Network contract window start, closed bound" }
      - { name: contract_end, type: datetime, source: input, description: "Network contract window end, closed bound; must be > contract_start" }
      - { name: visit_rate_cents, type: integer, source: input, description: "Per-visit direct-pay contracted rate" }
      - { name: status, type: enum, source: system, description: "Provider network lifecycle", default: PENDING_ONBOARD, constraints: "PENDING_ONBOARD | ACTIVE | SUSPENDED | TERMINATED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; plan enrolled into" }
      - { name: tier_code, type: enum, source: computed, description: "Snapshot of member tier at enrollment" }
      - { name: annual_allowance_cents, type: integer, source: computed, description: "Effective annual allowance incl. FAMILY dependent uplift; recomputed on dependent add/deactivate" }
      - { name: quarterly_cap_cents, type: integer, source: computed, description: "Snapshot of tier quarterly cap" }
      - { name: used_cents, type: integer, source: computed, description: "Sum of paid claim amounts minus clawbacks", default: 0 }
      - { name: reserved_cents, type: integer, source: computed, description: "Outstanding reservations from open claims", default: 0 }
      - { name: quarter_key, type: string, source: computed, description: "Current calendar quarter, e.g. 2026-Q2, driven by logical clock" }
      - { name: quarter_used_cents, type: integer, source: computed, description: "Paid amounts whose paid_at falls in [quarter_start, quarter_end); reset on quarter rollover", default: 0 }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle", default: ACTIVE, constraints: "ACTIVE | EXHAUSTED | CLOSED" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment the visit bills against" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; visiting member" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; recording provider, taken from caller identity" }
      - { name: check_in_at, type: datetime, source: input, description: "Visit interval start (half-open lower bound)" }
      - { name: check_out_at, type: datetime, source: input, description: "Visit interval end (half-open upper bound); must be > check_in_at" }
      - { name: verification_method, type: enum, source: input, description: "How presence was evidenced", constraints: "GEO_FENCE | POS_SWIPE | MANUAL_REVIEW" }
      - { name: duration_minutes, type: integer, source: computed, description: "check_out_at - check_in_at in minutes" }
      - { name: fraud_score, type: integer, source: computed, description: "Provisional at RECORDED, final at VERIFIED; 0-100" }
      - { name: status, type: enum, source: system, description: "Visit verification lifecycle", default: RECORDED, constraints: "RECORDED | VERIFIED | REJECTED | VOIDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; allowance pool debited" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; claimant (from caller identity for Member role, body for ProviderOperator)" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; service provider (caller identity for DIRECT_PAY, derived from first visit or body for REIMBURSEMENT)" }
      - { name: claim_type, type: enum, source: input, description: "Payment routing", constraints: "REIMBURSEMENT | DIRECT_PAY" }
      - { name: service_date, type: datetime, source: input, description: "Date service was rendered" }
      - { name: receipt_ref, type: string, source: input, description: "External receipt identifier; unique per member" }
      - { name: line_items, type: array, source: input, description: "Array of {description, unit_amount_cents, quantity, tax_pct}" }
      - { name: visit_ids, type: array, source: input, description: "Optional VERIFIED visit ids evidencing the claim", default: "[]" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "Sum of per-line rounded line totals (calc_line_rounding)" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Approved payable amount, null until APPROVED", default: null }
      - { name: review_status, type: enum, source: system, description: "Review dimension (parallel state axis 1)", default: SUBMITTED, constraints: "SUBMITTED | UNDER_REVIEW | NEEDS_INFO | APPROVED | REJECTED" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (parallel state axis 2)", default: UNPAID, constraints: "UNPAID | PAID | REVERSED | CLAWED_BACK" }
      - { name: resubmission_count, type: integer, source: system, description: "Times resubmitted from NEEDS_INFO", default: 0 }
      - { name: fraud_hold, type: boolean, source: computed, description: "True when any referenced visit has an OPEN/CONFIRMED FraudFlag", default: false }
      - { name: quarter_key, type: string, source: computed, description: "Calendar quarter of service_date" }

  - name: FundingAccount
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; funding owner" }
      - { name: benefit_year, type: integer, source: input, description: "Year this account funds; unique per (employer_id, benefit_year)" }
      - { name: funded_cents, type: integer, source: computed, description: "Total deposits", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "funded + clawback credits - debits - reserved holds", default: 0 }
      - { name: reserved_cents, type: integer, source: computed, description: "Holds from APPROVED & UNPAID claims", default: 0 }
      - { name: disbursed_cents, type: integer, source: computed, description: "Paid out minus clawbacks", default: 0 }
      - { name: status, type: enum, source: system, description: "Funding posture", default: FUNDED, constraints: "FUNDED | DEPLETED | SUSPENDED" }

  - name: FundingEntry
    parent: FundingAccount
    common_fields: false
    fields:
      - { name: funding_account_id, type: string, source: system, description: "FK -> FundingAccount.id; owning account" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; null for deposits" }
      - { name: entry_type, type: enum, source: system, description: "Ledger entry kind", constraints: "DEPOSIT | HOLD | RELEASE | DEBIT | CLAWBACK_CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed-at-application amount (always stored positive)" }
      - { name: running_available_cents, type: integer, source: computed, description: "available_cents immediately after applying this entry (chronological replay)" }

  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; flagged visit (null when claim-level)" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; flagged claim (null when visit-level)" }
      - { name: signal, type: enum, source: system, description: "Dominant signal that crossed FLAG threshold", constraints: "VELOCITY | OVERLAP_PATTERN | DUPLICATE_RECEIPT | GEOFENCE_MISMATCH | PROVIDER_PATTERN" }
      - { name: severity, type: integer, source: system, description: "1-10 derived from final fraud_score decile" }
      - { name: status, type: enum, source: system, description: "Flag triage lifecycle", default: OPEN, constraints: "OPEN | CONFIRMED | CLEARED" }

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; statement owner" }
      - { name: period_yyyymm, type: string, source: input, description: "Statement month, e.g. 2026-05" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: OPEN, constraints: "OPEN | FINALIZED | DELIVERED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking total incl. open claims (calc_statement_totals provisional variant)" }
      - { name: finalized_total_cents, type: integer, source: computed, description: "Final total: PAID minus clawbacks only; null until FINALIZED", default: null }
      - { name: claim_count, type: integer, source: computed, description: "Claims with service_date in the statement month" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /api/_clock/set_current_utc crossing member.eligibility_date (system), or computed ELIGIBLE at creation when clock already past eligibility_date"
        actor: system
        preconditions: ["logical clock >= member.eligibility_date"]
        side_effects: ["eligibility_status flips to ELIGIBLE", "version increments"]
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /api/members/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: ["member.eligibility_status == ELIGIBLE"]
        side_effects: ["version increments"]
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /api/members/{id}/reinstate"
        actor: BenefitsAdmin
        preconditions: ["member.eligibility_status == SUSPENDED"]
        side_effects: ["version increments"]
      - from: ELIGIBLE
        to: TERMINATED
        trigger: "POST /api/members/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: ["member.eligibility_status IN {ELIGIBLE, SUSPENDED}"]
        side_effects:
          - "cascade: all Dependent rows with member_id == member.id and status == ACTIVE flip to INACTIVE"
          - "cascade: each Enrollment with member_id == member.id and status IN {ACTIVE, EXHAUSTED} flips to CLOSED (regardless of open claims)"
          - "cascade: each enrollment closing rejects its claims with review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"
          - "cascade: each auto-rejected claim releases its enrollment reservation (reserved_cents -= claimed_amount_cents for pre-approval claims; -= approved_amount_cents for APPROVED&UNPAID claims) and releases any funding HOLD"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/members/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: ["member.eligibility_status == SUSPENDED"]
        side_effects: ["same cascade chain as ELIGIBLE -> TERMINATED"]

  - entity: Dependent
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/dependents/{id}/deactivate or member termination cascade"
        actor: BenefitsAdmin
        preconditions: ["dependent.status == ACTIVE"]
        side_effects: ["recompute annual_allowance_cents on every ACTIVE/EXHAUSTED Enrollment of the parent member (calc_effective_allowance)"]

  - entity: BenefitPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/benefit-plans/{id}/activate"
        actor: BenefitsAdmin
        preconditions: ["plan.status == DRAFT", "plan has >= 1 PlanTier"]
        side_effects: ["version increments"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/benefit-plans/{id}/retire"
        actor: BenefitsAdmin
        preconditions: ["plan.status == ACTIVE"]
        side_effects: ["no new enrollments accepted; existing enrollments unaffected"]

  - entity: Provider
    initial_state: PENDING_ONBOARD
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ONBOARD
        to: ACTIVE
        trigger: "POST /api/providers/{id}/activate"
        actor: BenefitsAdmin
        preconditions: ["provider.status == PENDING_ONBOARD"]
        side_effects: ["version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/providers/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: ["provider.status == ACTIVE"]
        side_effects: ["version increments"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/providers/{id}/reinstate"
        actor: BenefitsAdmin
        preconditions: ["provider.status == SUSPENDED"]
        side_effects: ["version increments"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/providers/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: ["provider.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "cascade: all Visit rows with provider_id == provider.id and status == RECORDED flip to REJECTED"
          - "cascade: each such visit rejection forces any Claim with review_status IN {SUBMITTED, NEEDS_INFO} whose provider_id == provider.id to REJECTED"
          - "cascade: each auto-rejected claim releases its enrollment reservation"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/providers/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: ["provider.status == SUSPENDED"]
        side_effects: ["same cascade chain as ACTIVE -> TERMINATED"]

  - entity: Visit
    initial_state: RECORDED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/visits/{id}/verify"
        actor: ClaimsReviewer
        preconditions:
          - "visit.status == RECORDED"
          - "provider.status == ACTIVE (cross-entity dependency Visit -> Provider)"
          - "visit fraud score below FRAUD_BLOCK_THRESHOLD (80)"
        side_effects:
          - "recompute final fraud_score (calc_fraud_score final variant: VERIFIED-only velocity set, CONFIRMED flags double)"
          - "if final fraud_score >= FRAUD_FLAG_THRESHOLD (50): create FraudFlag OPEN for this visit"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /api/visits/{id}/reject or provider termination cascade"
        actor: ClaimsReviewer
        preconditions: ["visit.status == RECORDED"]
        side_effects: ["claim referencing this visit in SUBMITTED/NEEDS_INFO auto-rejects (cascade)"]
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /api/visits/{id}/void or FraudFlag confirm"
        actor: ClaimsReviewer
        preconditions:
          - "visit.status == VERIFIED"
          - "no Claim with review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED} references this visit (ERR_VISIT_IN_USE otherwise)"
        side_effects: ["version increments"]

  - entity: Claim
    initial_state: SUBMITTED (review) / UNPAID (payment)
    terminal_states: [REJECTED (review); REVERSED, CLAWED_BACK (payment)]
    note: "Two parallel state dimensions on one row: review_status and payment_status evolve independently; payment transitions only legal when review_status == APPROVED."
    transitions:
      - from: "review SUBMITTED"
        to: "review UNDER_REVIEW"
        trigger: "POST /api/claims/{id}/start-review"
        actor: ClaimsReviewer
        preconditions: ["claim.review_status == SUBMITTED"]
        side_effects: ["version increments"]
      - from: "review UNDER_REVIEW"
        to: "review APPROVED"
        trigger: "POST /api/claims/{id}/approve"
        actor: ClaimsReviewer
        preconditions:
          - "claim.review_status == UNDER_REVIEW"
          - "claim.fraud_hold == false (ERR_FRAUD_HOLD otherwise)"
          - "enrollment.status == ACTIVE (cross-entity dependency Claim -> Enrollment)"
          - "funding account for (employer, benefit_year) has status != SUSPENDED (cross-entity dependency Claim -> FundingAccount)"
          - "computed approved_amount_cents > 0 under calc_claim_payable (quarterly window checked before annual window)"
          - "funding account available_cents >= approved_amount_cents (ERR_FUNDING_INSUFFICIENT otherwise)"
        side_effects:
          - "approved_amount_cents = calc_claim_payable result"
          - "enrollment.reserved_cents adjusted: -= claimed_amount_cents, += approved_amount_cents"
          - "funding HOLD entry created; funding.reserved_cents += approved_amount_cents; available_cents -= approved_amount_cents"
      - from: "review UNDER_REVIEW"
        to: "review REJECTED"
        trigger: "POST /api/claims/{id}/reject"
        actor: ClaimsReviewer
        preconditions: ["claim.review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: ["release enrollment reservation for this claim", "version increments"]
      - from: "review SUBMITTED"
        to: "review REJECTED"
        trigger: "POST /api/claims/{id}/reject"
        actor: ClaimsReviewer
        preconditions: ["claim.review_status == SUBMITTED"]
        side_effects: ["release enrollment reservation for this claim"]
      - from: "review UNDER_REVIEW"
        to: "review NEEDS_INFO"
        trigger: "POST /api/claims/{id}/request-info"
        actor: ClaimsReviewer
        preconditions: ["claim.review_status == UNDER_REVIEW"]
        side_effects: ["version increments"]
      - from: "review NEEDS_INFO"
        to: "review UNDER_REVIEW"
        trigger: "POST /api/claims/{id}/resubmit"
        actor: Member
        preconditions:
          - "claim.review_status == NEEDS_INFO"
          - "claim.resubmission_count < MAX_RESUBMISSIONS (3)"
          - "acting member owns the claim"
        side_effects: ["resubmission_count += 1", "version increments"]
      - from: "payment UNPAID"
        to: "payment PAID"
        trigger: "POST /api/claims/{id}/pay"
        actor: BenefitsAdmin
        preconditions:
          - "claim.review_status == APPROVED"
          - "claim.payment_status == UNPAID"
          - "funding account status == FUNDED"
        side_effects:
          - "funding: HOLD converted to DEBIT entry; reserved_cents -= approved; disbursed_cents += approved"
          - "enrollment: reserved_cents -= approved; used_cents += approved; quarter_used_cents += approved (quarter of paid_at, half-open [quarter_start, quarter_end))"
          - "cascade: if enrollment.used_cents >= enrollment.annual_allowance_cents, enrollment flips ACTIVE -> EXHAUSTED"
          - "cascade: enrollment EXHAUSTED auto-rejects every other claim on it with review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"
          - "cascade: each such auto-rejection releases that claim's enrollment reservation and any funding HOLD"
      - from: "payment UNPAID"
        to: "payment REVERSED"
        trigger: "POST /api/claims/{id}/reverse"
        actor: BenefitsAdmin
        preconditions: ["claim.review_status == APPROVED", "claim.payment_status == UNPAID"]
        side_effects:
          - "funding HOLD released (RELEASE entry); reserved_cents -= approved; available_cents += approved"
          - "enrollment.reserved_cents -= approved_amount_cents"
      - from: "payment PAID"
        to: "payment CLAWED_BACK"
        trigger: "POST /api/claims/{id}/reverse"
        actor: BenefitsAdmin
        preconditions: ["claim.payment_status == PAID"]
        side_effects:
          - "funding CLAWBACK_CREDIT entry; disbursed_cents -= approved; available_cents += approved"
          - "enrollment.used_cents -= approved; quarter_used_cents -= approved if paid_at quarter is current quarter"
          - "cascade: if enrollment.status == EXHAUSTED and used_cents < annual_allowance_cents after decrement, enrollment flips back to ACTIVE"

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: claim payment pushes used_cents >= annual_allowance_cents"
        actor: system
        preconditions: ["used_cents >= annual_allowance_cents"]
        side_effects: ["auto-reject open claims (see Claim pay cascade)"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: clawback drops used_cents below annual_allowance_cents"
        actor: system
        preconditions: ["used_cents < annual_allowance_cents"]
        side_effects: ["version increments"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/enrollments/{id}/close or member termination cascade"
        actor: BenefitsAdmin
        preconditions: ["enrollment.status IN {ACTIVE, EXHAUSTED}", "no claims with review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} (ERR_OPEN_CLAIMS_EXIST; bypassed only by member-termination cascade)"]
        side_effects: ["release any remaining reserved_cents (must be 0 for manual close)"]
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /api/enrollments/{id}/close"
        actor: BenefitsAdmin
        preconditions: ["no open claims"]
        side_effects: ["version increments"]

  - entity: FundingAccount
    initial_state: FUNDED
    terminal_states: []
    transitions:
      - from: FUNDED
        to: DEPLETED
        trigger: "system: available_cents reaches exactly 0 after a HOLD or DEBIT"
        actor: system
        preconditions: ["available_cents == 0"]
        side_effects: ["version increments"]
      - from: DEPLETED
        to: FUNDED
        trigger: "POST /api/funding-accounts/{id}/deposits with amount_cents > 0"
        actor: BenefitsAdmin
        preconditions: ["account.status == DEPLETED"]
        side_effects: ["DEPOSIT entry; funded_cents += amount; available_cents += amount"]
      - from: FUNDED
        to: SUSPENDED
        trigger: "POST /api/funding-accounts/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: ["account.status IN {FUNDED, DEPLETED}"]
        side_effects: ["version increments"]
      - from: DEPLETED
        to: SUSPENDED
        trigger: "POST /api/funding-accounts/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: ["account.status == DEPLETED"]
        side_effects: ["version increments"]
      - from: SUSPENDED
        to: FUNDED
        trigger: "POST /api/funding-accounts/{id}/reactivate"
        actor: BenefitsAdmin
        preconditions: ["account.status == SUSPENDED"]
        side_effects: ["target state is FUNDED if available_cents > 0 else DEPLETED (derived, not caller-chosen)"]

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /api/fraud-flags/{id}/confirm"
        actor: ClaimsReviewer
        preconditions: ["flag.status == OPEN"]
        side_effects: ["if visit-level: visit VERIFIED -> VOIDED (bypasses ERR_VISIT_IN_USE) and any referencing claim in SUBMITTED/UNDER_REVIEW/NEEDS_INFO auto-rejects with reservation release"]
      - from: OPEN
        to: CLEARED
        trigger: "POST /api/fraud-flags/{id}/clear"
        actor: ClaimsReviewer
        preconditions: ["flag.status == OPEN"]
        side_effects: ["referencing claims recompute fraud_hold (may drop to false)"]

  - entity: Statement
    initial_state: OPEN
    terminal_states: [DELIVERED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /api/statements/{id}/finalize"
        actor: BenefitsAdmin
        preconditions: ["statement.status == OPEN"]
        side_effects: ["compute finalized_total_cents (calc_statement_totals final variant)", "version increments"]
      - from: FINALIZED
        to: OPEN
        trigger: "POST /api/statements/{id}/reopen"
        actor: BenefitsAdmin
        preconditions: ["statement.status == FINALIZED"]
        side_effects: ["finalized_total_cents reset to null", "provisional_total_cents recomputed", "version increments"]
      - from: FINALIZED
        to: DELIVERED
        trigger: "POST /api/statements/{id}/deliver"
        actor: BenefitsAdmin
        preconditions: ["statement.status == FINALIZED"]
        side_effects: ["version increments"]

  - entity: Employer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/employers/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: ["employer.status == ACTIVE"]
        side_effects: ["version increments"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/employers/{id}/reactivate"
        actor: BenefitsAdmin
        preconditions: ["employer.status == SUSPENDED"]
        side_effects: ["version increments"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: plan-tier-amendment-stale-plan
    parent_entity: BenefitPlan
    write_endpoint: "PUT /api/benefit-plans/{id}/tiers"
    occ_field: "expected_plan_version"
    description: |
      Replacing a plan's tier set with an expected_plan_version older than the
      plan's current version is rejected. A prior accepted amendment has already
      advanced plan.version, so the caller's view of the tier configuration is
      stale and the new amendment would silently supersede configuration the
      caller never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: provider-contract-amendment-stale-provider
    parent_entity: Provider
    write_endpoint: "PUT /api/providers/{id}/contract"
    occ_field: "expected_provider_version"
    description: |
      Re-papering a provider contract with an expected_provider_version older
      than the provider's current version is rejected. A prior accepted contract
      amendment has already advanced provider.version, so the caller's window
      and rate assumptions are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_line_rounding
    trigger: "on Claim creation (POST /api/claims)"
    algorithm: aggregation
    formula: |
      claimed_amount_cents = SUM over line_items of round_half_up(unit_amount_cents * quantity * (1 + tax_pct))
      Rounding is applied PER LINE ITEM first, then summed. The alternative
      (sum raw line totals, round once) is FORBIDDEN and yields a different
      total (e.g. 3x {333, qty 1, tax 0.05}: per-line 350+350+350 = 1050 vs
      sum-then-round round_half_up(1048.95) = 1049).
    input_set: "the claim's line_items array as submitted"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied per line item before summation"

  - name: calc_claim_payable
    trigger: "on Claim approve (POST /api/claims/{id}/approve)"
    algorithm: threshold
    formula: |
      k = coverage pct from enrollment tier by provider.network_tier
          (IN_NETWORK -> in_network_pct, PREFERRED -> preferred_pct, OUT_OF_NETWORK -> out_of_network_pct)
      covered = round_half_up(claimed_amount_cents * k)
      A = annual_allowance_cents - used_cents - (reserved_cents - this claim's own reserved amount)
      Q = quarterly_cap_cents - quarter_used_cents - (reserved in current quarter from OTHER claims)
      approved_amount_cents = min(covered, per_claim_cap_cents, A, Q)
      Error selection when not approvable, evaluated IN THIS ORDER:
        if Q <= 0 -> ERR_QUARTERLY_CAP_EXCEEDED
        elif A <= 0 -> ERR_ALLOWANCE_EXCEEDED
        elif funding.available_cents < approved -> ERR_FUNDING_INSUFFICIENT
    input_set: "claim, its enrollment + tier snapshot, provider network_tier, funding account for (employer, benefit_year)"
    precision: "integer cents, round_half_up"
    constants:
      QUARTER_CHECK_BEFORE_ANNUAL: true

  - name: calc_fraud_score
    trigger: "provisional variant on Visit creation; final variant on Visit verify"
    algorithm: weighted_scoring
    formula: |
      Signals and weights: GEOFENCE_MISMATCH (+30, when verification_method == MANUAL_REVIEW),
      VELOCITY (+10 per visit beyond 5 in the trailing 7-day window ending at check_in_at),
      PROVIDER_PATTERN (+20, provider was SUSPENDED at any point in the 30 days before check_in_at),
      DUPLICATE_RECEIPT (+40, another claim of the same member carries the same receipt_ref).
      Decay: signal age <= 3 days -> full weight; 3 < age <= 7 days -> half weight; age > 7 days -> zero.
      score = min(100, sum(weight * decay * multiplier))
    input_set: "provisional: member visits with status IN {RECORDED, VERIFIED}; final: status == VERIFIED only; final multiplies a signal by 2.0 when a CONFIRMED FraudFlag exists for it"
    constants:
      FRAUD_FLAG_THRESHOLD: 50
      FRAUD_BLOCK_THRESHOLD: 80
      VELOCITY_WINDOW_DAYS: 7
      VELOCITY_FREE_COUNT: 5
    precision: "integer 0-100, clamped"
    variants:
      - name: provisional
        when: "at RECORDED (visit creation)"
        difference: "velocity set counts RECORDED + VERIFIED visits; no confirmed-flag multiplier"
      - name: final
        when: "at VERIFY transition"
        difference: "velocity set counts VERIFIED visits only; signals backed by a CONFIRMED FraudFlag count double; result >= 50 auto-creates an OPEN FraudFlag"

  - name: calc_statement_totals
    trigger: "provisional on Statement creation and reopen; final on finalize"
    algorithm: forward_looking
    formula: |
      period claims = claims of member whose service_date falls inside period_yyyymm month [month_start, next_month_start)
      provisional_total_cents =
          SUM(claimed_amount_cents over review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO})
        + SUM(approved_amount_cents over review_status == APPROVED AND payment_status == UNPAID)
        + SUM(approved_amount_cents over payment_status == PAID)
        - SUM(approved_amount_cents over payment_status == CLAWED_BACK with paid_at in period)
      finalized_total_cents =
          SUM(approved_amount_cents over payment_status == PAID with paid_at in period)
        - SUM(approved_amount_cents over payment_status == CLAWED_BACK with paid_at in period)
    input_set: "claims of the statement's member filtered by service_date in statement month"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "statement.status == OPEN"
        difference: "includes not-yet-approved claims at claimed value and approved-unpaid claims at approved value"
      - name: final
        when: "statement transitions OPEN -> FINALIZED"
        difference: "counts PAID claims only, net of clawbacks; identical data yields a lower or equal total than provisional"

  - name: calc_allowance_ledger
    trigger: "on every claim create / approve / reject / pay / reverse touching the enrollment"
    algorithm: chronological
    formula: |
      used_cents = replay claim payment events in claim.created_at ASC order (tie-break: claim.created_at, never id):
                   PAY +approved_amount_cents; CLAWBACK -approved_amount_cents
      reserved_cents = SUM(claimed_amount_cents over review_status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO})
                     + SUM(approved_amount_cents over review_status == APPROVED AND payment_status == UNPAID)
      remaining_cents = annual_allowance_cents - used_cents - reserved_cents
      Invariant (compensating): used_cents + reserved_cents + remaining_cents == annual_allowance_cents
      after every forward action (create/approve/pay) and its compensating action (reject/reverse/clawback).
    input_set: "all claims of the enrollment regardless of review/payment status"
    precision: "integer cents"

  - name: calc_quarter_usage
    trigger: "on claim pay (accumulate) and on POST /api/_clock/set_current_utc crossing a calendar quarter boundary (reset)"
    algorithm: threshold
    formula: |
      quarter_of(t) = calendar quarter of UTC instant t, e.g. 2026-Q2
      quarter_used_cents accumulates approved amounts whose paid_at falls in
      [quarter_start, quarter_end) — half-open: a payment exactly at quarter_end
      belongs to the NEXT quarter.
      On clock-set crossing into a new quarter: quarter_key updated, quarter_used_cents reset to 0.
      Cap check uses >=: approved <= Q_remaining is allowed, so landing exactly on the cap succeeds.
    input_set: "payments of the enrollment in the current quarter"
    precision: "integer cents"

  - name: calc_effective_allowance
    trigger: "on Enrollment creation, and on Dependent activate/deactivate for the parent member"
    algorithm: aggregation
    formula: |
      base = PlanTier.annual_allowance_cents for the enrollment's tier_code
      if tier_code == FAMILY:
          n = min(count of member's Dependent rows with status == ACTIVE, DEPENDENT_CAP_MAX)
          annual_allowance_cents = round_half_up(base * (1 + n * dependent_cap_pct))
      else:
          annual_allowance_cents = base
    input_set: "enrollment tier snapshot + member's ACTIVE dependents at evaluation time"
    constants:
      DEPENDENT_CAP_MAX: 3
    precision: "integer cents, round_half_up"

  - name: calc_visit_frequency
    trigger: "on Visit creation"
    algorithm: threshold
    formula: |
      window = (new_check_in_at - 30 days, new_check_in_at]  — a visit exactly 30 days old is EXCLUDED (strict lower bound)
      count = member visits with check_in_at in window and status IN {RECORDED, VERIFIED}
      creation allowed iff count < tier.visit_frequency_cap
      (cap 8: the 8th visit in the window is allowed, the 9th rejected with ERR_FREQUENCY_CAP_EXCEEDED)
    input_set: "member's visits in the rolling 30-day window"
    precision: "integer count"

  - name: calc_funding_reconciliation
    trigger: "on any FundingEntry append and on claim approve (funding availability check)"
    algorithm: chronological
    formula: |
      Evaluation order is PINNED (the dependency is circular-looking and MUST be resolved in this order):
      (1) replay FundingEntry rows for the account in created_at ASC order
          (same-timestamp tie-break by entry_type rank DEPOSIT < RELEASE < CLAWBACK_CREDIT < HOLD < DEBIT):
          funded = SUM(DEPOSIT); credits = SUM(CLAWBACK_CREDIT) + SUM(RELEASE); debits = SUM(DEBIT); holds = SUM(HOLD)
          ledger_available = funded + SUM(CLAWBACK_CREDIT) - debits - (holds - SUM(RELEASE against those holds))
      (2) open_approvals = SUM(approved_amount_cents over claims review_status == APPROVED AND payment_status == UNPAID
          whose enrollment.plan.employer_id == account.employer_id and plan.benefit_year == account.benefit_year)
      (3) reserved_cents = open_approvals (derived from claims, NOT re-summed from entries)
          available_cents = ledger_available; consistency check: available_cents >= 0
      Invariant (compensating): funded_cents + clawback_credits == available_cents + reserved_cents + disbursed_cents
      after every pay (forward) and its reverse/clawback (compensating).
    input_set: "FundingEntry rows of the account; APPROVED&UNPAID claims of the employer+year"
    precision: "integer cents"

  - name: calc_utilization_report
    trigger: "on GET /api/reports/utilization"
    algorithm: aggregation
    formula: |
      over enrollments whose plan.employer_id == :employer_id and status IN {ACTIVE, EXHAUSTED, CLOSED}:
      total_allowance = SUM(annual_allowance_cents); total_used = SUM(used_cents)
      utilization_pct = round_half_up(100 * total_used / total_allowance, 2); 0 when total_allowance == 0
      paid_claim_count = claims with payment_status == PAID and paid_at in period month
      open_fraud_flags = FraudFlag rows with status == OPEN for visits/claims of the employer's members
    input_set: "enrollments of the employer (all statuses), claims paid in :period_yyyymm, OPEN fraud flags"
    precision: "utilization_pct 2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized; for entity_backed roles the id must resolve to an existing entity", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is listed in the endpoint's roles; ownership: Member role may only touch resources whose member_id == X-User-ID; ProviderOperator only visits/claims of provider_id == X-User-ID", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "ownership violation (role correct, resource owned by someone else)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "member-scoped and provider-scoped endpoints" }
  - { priority: 3, category: existence, check: "path ids resolve, validated left-to-right; body FK fields (enrollment_id, plan_id, employer_id, visit_ids[]) resolve", error_id: ERR_MEMBER_NOT_FOUND, http_status: 404, applies_to: "all (per-entity variants: ERR_EMPLOYER_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_DEPENDENT_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_FUNDING_ACCOUNT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND, ERR_FRAUD_FLAG_NOT_FOUND)" }
  - { priority: 3, category: existence, check: "required request fields present and well-typed", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PUT" }
  - { priority: 3, category: existence, check: "enum fields carry a declared member", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all POST/PUT" }
  - { priority: 3, category: existence, check: "money/quantity fields positive (amount_cents > 0, quantity >= 1, visit_rate_cents >= 0)", error_id: ERR_INVALID_AMOUNT, http_status: 400, applies_to: "all POST/PUT" }
  - { priority: 3, category: existence, check: "datetime ranges coherent: check_out_at > check_in_at; period_end > period_start; contract_end > contract_start", error_id: ERR_INVALID_DATE_RANGE, http_status: 400, applies_to: "POST /api/visits, POST /api/benefit-plans, POST /api/providers, PUT /api/providers/{id}/contract" }
  - { priority: 4, category: state, check: "target entity in the required state for the transition (per state_machines)", error_id: ERR_CLAIM_NOT_REVIEWABLE, http_status: 409, applies_to: "claim action endpoints (variants: ERR_PLAN_NOT_ACTIVE, ERR_PLAN_NOT_DRAFT, ERR_MEMBER_NOT_ELIGIBLE, ERR_MEMBER_TERMINATED, ERR_PROVIDER_NOT_ACTIVE, ERR_PROVIDER_TERMINATED, ERR_ENROLLMENT_NOT_ACTIVE, ERR_CLAIM_TERMINAL, ERR_PAYMENT_NOT_REVERSIBLE, ERR_STATEMENT_NOT_OPEN, ERR_STATEMENT_NOT_FINALIZED, ERR_STATEMENT_LOCKED, ERR_FUNDING_NOT_ACTIVE, ERR_FLAG_NOT_OPEN, ERR_DEPENDENT_INACTIVE)" }
  - { priority: 4, category: state, check: "OCC: expected_<parent>_version matches current version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /api/benefit-plans/{id}/tiers, PUT /api/providers/{id}/contract" }
  - { priority: 5, category: business_safety, check: "fraud gate: visit provisional score >= 80 blocks verify; claim.fraud_hold blocks approve", error_id: ERR_FRAUD_HOLD, http_status: 422, applies_to: "POST /api/visits/{id}/verify, POST /api/claims/{id}/approve" }
  - { priority: 6, category: business_temporal, check: "claim service_date within 90 days before current clock (inclusive: exactly 90 days old is allowed, 91 rejected)", error_id: ERR_CLAIM_FILING_DEADLINE, http_status: 422, applies_to: "POST /api/claims" }
  - { priority: 6, category: business_temporal, check: "visit check_in_at inside provider contract window [contract_start, contract_end] (closed: both endpoints inclusive)", error_id: ERR_SERVICE_OUTSIDE_CONTRACT, http_status: 422, applies_to: "POST /api/visits" }
  - { priority: 6, category: business_temporal, check: "claim service_date inside enrollment plan period [period_start, period_end] (closed)", error_id: ERR_SERVICE_OUTSIDE_PLAN_PERIOD, http_status: 422, applies_to: "POST /api/claims" }
  - { priority: 7, category: business_constraint, check: "no overlapping visit for the member: half-open [check_in_at, check_out_at); adjacent (check_out == next check_in) is allowed", error_id: ERR_VISIT_TIME_OVERLAP, http_status: 409, applies_to: "POST /api/visits" }
  - { priority: 7, category: business_constraint, check: "receipt_ref unique per member across all non-REJECTED claims", error_id: ERR_DUPLICATE_RECEIPT, http_status: 409, applies_to: "POST /api/claims" }
  - { priority: 7, category: business_constraint, check: "rolling 30-day visit count < tier.visit_frequency_cap (calc_visit_frequency)", error_id: ERR_FREQUENCY_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/visits" }
  - { priority: 7, category: business_constraint, check: "member's enrollments have pairwise disjoint plan periods under CLOSED interval semantics (sharing a single date is an overlap)", error_id: ERR_ENROLLMENT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /api/enrollments" }
  - { priority: 7, category: business_constraint, check: "CHILD dependent age < 26 at plan period_start (exactly 26 is ineligible)", error_id: ERR_DEPENDENT_AGE_INELIGIBLE, http_status: 422, applies_to: "POST /api/members/{id}/dependents" }
  - { priority: 7, category: business_constraint, check: "claim resubmission_count < 3", error_id: ERR_MAX_RESUBMISSIONS, http_status: 422, applies_to: "POST /api/claims/{id}/resubmit" }
  - { priority: 7, category: business_constraint, check: "member.tier_code defined among the plan's PlanTiers; duplicate tier_code in a PUT tiers payload rejected", error_id: ERR_TIER_NOT_DEFINED, http_status: 422, applies_to: "POST /api/members, POST /api/enrollments (duplicate tier: ERR_DUPLICATE_TIER_CODE on PUT /api/benefit-plans/{id}/tiers)" }
  - { priority: 7, category: business_constraint, check: "every id in visit_ids references a VERIFIED visit owned by the claimant", error_id: ERR_VISIT_NOT_VERIFIED, http_status: 422, applies_to: "POST /api/claims" }
  - { priority: 8, category: business_referential, check: "visit not referenced by any open claim before void", error_id: ERR_VISIT_IN_USE, http_status: 409, applies_to: "POST /api/visits/{id}/void" }
  - { priority: 8, category: business_referential, check: "no open claims before manual enrollment close", error_id: ERR_OPEN_CLAIMS_EXIST, http_status: 409, applies_to: "POST /api/enrollments/{id}/close" }
  - { priority: 9, category: business_fiscal, check: "calc_claim_payable windows: quarterly first, then annual, then funding availability", error_id: ERR_ALLOWANCE_EXCEEDED, http_status: 422, applies_to: "POST /api/claims/{id}/approve (variants: ERR_QUARTERLY_CAP_EXCEEDED, ERR_FUNDING_INSUFFICIENT)" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Employers ---
  - { method: POST, path: "/api/employers", description: "Create employer", roles: [BenefitsAdmin], code: 201, input: [name, funding_model], output: Employer, side_effects: [] }
  - { method: GET, path: "/api/employers/{id}", description: "Read employer", roles: [BenefitsAdmin, Auditor], code: 200, input: [], output: Employer, side_effects: [] }
  - { method: GET, path: "/api/employers", description: "List employers", roles: [BenefitsAdmin, Auditor], code: 200, input: ["status?"], output: "Employer[]", side_effects: [] }
  - { method: POST, path: "/api/employers/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [BenefitsAdmin], code: 200, input: [], output: Employer, side_effects: ["employer.status -> SUSPENDED"] }
  - { method: POST, path: "/api/employers/{id}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [BenefitsAdmin], code: 200, input: [], output: Employer, side_effects: ["employer.status -> ACTIVE"] }

  # --- Benefit plans & tiers ---
  - { method: POST, path: "/api/benefit-plans", description: "Create plan (DRAFT)", roles: [BenefitsAdmin], code: 201, input: [employer_id, name, benefit_year, period_start, period_end], output: BenefitPlan, side_effects: [] }
  - { method: GET, path: "/api/benefit-plans/{id}", description: "Read plan", roles: [BenefitsAdmin, Auditor], code: 200, input: [], output: BenefitPlan, side_effects: [] }
  - { method: GET, path: "/api/benefit-plans", description: "List plans", roles: [BenefitsAdmin, Auditor], code: 200, input: ["employer_id?", "status?"], output: "BenefitPlan[]", side_effects: [] }
  - { method: POST, path: "/api/benefit-plans/{id}/activate", description: "DRAFT -> ACTIVE; requires >= 1 tier", roles: [BenefitsAdmin], code: 200, input: [], output: BenefitPlan, side_effects: ["plan.status -> ACTIVE"] }
  - { method: POST, path: "/api/benefit-plans/{id}/retire", description: "ACTIVE -> RETIRED", roles: [BenefitsAdmin], code: 200, input: [], output: BenefitPlan, side_effects: ["plan.status -> RETIRED"] }
  - { method: PUT, path: "/api/benefit-plans/{id}/tiers", description: "Replace the plan's tier set (superseding amendment); OCC-guarded; allowed in DRAFT or ACTIVE", roles: [BenefitsAdmin], code: 200, input: [tiers, expected_plan_version], output: BenefitPlan, side_effects: ["delete existing PlanTier rows of the plan, insert one per tiers[] item", "increments BenefitPlan.version by 1"] }
  - { method: GET, path: "/api/benefit-plans/{id}/tiers", description: "List plan tiers", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: "PlanTier[]", side_effects: [] }

  # --- Members & dependents ---
  - { method: POST, path: "/api/members", description: "Create member; eligibility_status PENDING unless logical clock already past eligibility_date", roles: [BenefitsAdmin], code: 201, input: [employer_id, plan_id, external_ref, full_name, tier_code, hire_date], output: Member, side_effects: ["computes eligibility_date", "initial eligibility_status computed"] }
  - { method: GET, path: "/api/members/{id}", description: "Read member (Member role: self only)", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/api/members", description: "List members", roles: [BenefitsAdmin, Auditor], code: 200, input: ["employer_id?", "plan_id?", "eligibility_status?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/api/members/{id}/suspend", description: "ELIGIBLE -> SUSPENDED", roles: [BenefitsAdmin], code: 200, input: [], output: Member, side_effects: ["member.eligibility_status -> SUSPENDED"] }
  - { method: POST, path: "/api/members/{id}/reinstate", description: "SUSPENDED -> ELIGIBLE", roles: [BenefitsAdmin], code: 200, input: [], output: Member, side_effects: ["member.eligibility_status -> ELIGIBLE"] }
  - { method: POST, path: "/api/members/{id}/terminate", description: "ELIGIBLE/SUSPENDED -> TERMINATED with full cascade", roles: [BenefitsAdmin], code: 200, input: [], output: Member, side_effects: ["dependents -> INACTIVE", "enrollments -> CLOSED", "open claims -> REJECTED with reservation release"] }
  - { method: POST, path: "/api/members/{id}/dependents", description: "Add dependent (Member: self only)", roles: [BenefitsAdmin, Member], code: 201, input: [full_name, relationship, birth_date], output: Dependent, side_effects: ["recompute annual_allowance_cents on the member's ACTIVE/EXHAUSTED enrollments"] }
  - { method: GET, path: "/api/members/{id}/dependents", description: "List dependents of member", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: "Dependent[]", side_effects: [] }
  - { method: POST, path: "/api/dependents/{id}/deactivate", description: "ACTIVE -> INACTIVE", roles: [BenefitsAdmin, Member], code: 200, input: [], output: Dependent, side_effects: ["recompute annual_allowance_cents on the member's ACTIVE/EXHAUSTED enrollments"] }

  # --- Providers ---
  - { method: POST, path: "/api/providers", description: "Onboard provider (PENDING_ONBOARD)", roles: [BenefitsAdmin], code: 201, input: [name, modality, network_tier, contract_start, contract_end, visit_rate_cents], output: Provider, side_effects: [] }
  - { method: GET, path: "/api/providers/{id}", description: "Read provider", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: GET, path: "/api/providers", description: "List providers", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: ["network_tier?", "status?"], output: "Provider[]", side_effects: [] }
  - { method: POST, path: "/api/providers/{id}/activate", description: "PENDING_ONBOARD -> ACTIVE", roles: [BenefitsAdmin], code: 200, input: [], output: Provider, side_effects: ["provider.status -> ACTIVE"] }
  - { method: POST, path: "/api/providers/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [BenefitsAdmin], code: 200, input: [], output: Provider, side_effects: ["provider.status -> SUSPENDED"] }
  - { method: POST, path: "/api/providers/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [BenefitsAdmin], code: 200, input: [], output: Provider, side_effects: ["provider.status -> ACTIVE"] }
  - { method: POST, path: "/api/providers/{id}/terminate", description: "ACTIVE/SUSPENDED -> TERMINATED with cascade", roles: [BenefitsAdmin], code: 200, input: [], output: Provider, side_effects: ["RECORDED visits -> REJECTED", "SUBMITTED/NEEDS_INFO claims at provider -> REJECTED with reservation release"] }
  - { method: PUT, path: "/api/providers/{id}/contract", description: "Re-paper contract window/rate (superseding amendment); OCC-guarded; forbidden when TERMINATED", roles: [BenefitsAdmin], code: 200, input: [contract_start, contract_end, visit_rate_cents, expected_provider_version], output: Provider, side_effects: ["increments Provider.version by 1"] }

  # --- Enrollments ---
  - { method: POST, path: "/api/enrollments", description: "Enroll member into plan; snapshots tier values; closed-interval disjointness per member", roles: [BenefitsAdmin, Member], code: 201, input: [member_id, plan_id], output: Enrollment, side_effects: ["snapshot tier_code/allowance/caps via calc_effective_allowance"] }
  - { method: GET, path: "/api/enrollments/{id}", description: "Read enrollment (Member: own only)", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: GET, path: "/api/enrollments", description: "List enrollments", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: ["member_id?", "plan_id?", "status?"], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/api/enrollments/{id}/close", description: "ACTIVE/EXHAUSTED -> CLOSED; blocked by open claims", roles: [BenefitsAdmin], code: 200, input: [], output: Enrollment, side_effects: ["enrollment.status -> CLOSED"] }
  - { method: GET, path: "/api/enrollments/{id}/allowance", description: "Computed allowance read", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: { enrollment_id: string, annual_allowance_cents: integer, used_cents: integer, reserved_cents: integer, remaining_cents: integer, quarter_key: string, quarter_used_cents: integer, quarterly_remaining_cents: integer }, side_effects: [] }

  # --- Visits ---
  - { method: POST, path: "/api/visits", description: "Record a visit for a member; provider taken from caller identity; computes provisional fraud_score", roles: [ProviderOperator], code: 201, input: [enrollment_id, member_id, check_in_at, check_out_at, verification_method], output: Visit, side_effects: ["compute provisional fraud_score (calc_fraud_score provisional variant)"] }
  - { method: GET, path: "/api/visits/{id}", description: "Read visit", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: [], output: Visit, side_effects: [] }
  - { method: GET, path: "/api/visits", description: "List visits", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: ["member_id?", "provider_id?", "enrollment_id?", "status?"], output: "Visit[]", side_effects: [] }
  - { method: POST, path: "/api/visits/{id}/verify", description: "RECORDED -> VERIFIED; final fraud score; may auto-create FraudFlag", roles: [ClaimsReviewer], code: 200, input: [], output: Visit, side_effects: ["compute final fraud_score", "create FraudFlag OPEN when score >= 50"] }
  - { method: POST, path: "/api/visits/{id}/reject", description: "RECORDED -> REJECTED", roles: [ClaimsReviewer], code: 200, input: [], output: Visit, side_effects: ["visit.status -> REJECTED"] }
  - { method: POST, path: "/api/visits/{id}/void", description: "VERIFIED -> VOIDED; blocked while referenced by open claim", roles: [ClaimsReviewer], code: 200, input: [], output: Visit, side_effects: ["visit.status -> VOIDED"] }

  # --- Claims ---
  - { method: POST, path: "/api/claims", description: "Submit reimbursement (Member) or direct-pay (ProviderOperator) claim; computes claimed_amount_cents; reserves allowance", roles: [Member, ProviderOperator], code: 201, input: [enrollment_id, claim_type, service_date, receipt_ref, line_items, "member_id?", "visit_ids?"], output: Claim, side_effects: ["calc_line_rounding -> claimed_amount_cents", "enrollment.reserved_cents += claimed_amount_cents"] }
  - { method: GET, path: "/api/claims/{id}", description: "Read claim", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/api/claims", description: "List claims", roles: [BenefitsAdmin, Auditor, ClaimsReviewer, Member, ProviderOperator], code: 200, input: ["member_id?", "enrollment_id?", "provider_id?", "review_status?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/api/claims/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [ClaimsReviewer], code: 200, input: [], output: Claim, side_effects: ["review_status -> UNDER_REVIEW"] }
  - { method: POST, path: "/api/claims/{id}/approve", description: "UNDER_REVIEW -> APPROVED; computes approved_amount_cents; places funding HOLD", roles: [ClaimsReviewer], code: 200, input: [], output: Claim, side_effects: ["calc_claim_payable -> approved_amount_cents", "enrollment reservation adjusted to approved", "FundingEntry HOLD"] }
  - { method: POST, path: "/api/claims/{id}/reject", description: "SUBMITTED/UNDER_REVIEW/NEEDS_INFO -> REJECTED; releases reservation", roles: [ClaimsReviewer], code: 200, input: ["reason?"], output: Claim, side_effects: ["release enrollment reservation"] }
  - { method: POST, path: "/api/claims/{id}/request-info", description: "UNDER_REVIEW -> NEEDS_INFO", roles: [ClaimsReviewer], code: 200, input: ["note?"], output: Claim, side_effects: ["review_status -> NEEDS_INFO"] }
  - { method: POST, path: "/api/claims/{id}/resubmit", description: "NEEDS_INFO -> UNDER_REVIEW; increments resubmission_count (max 3)", roles: [Member], code: 200, input: ["note?"], output: Claim, side_effects: ["resubmission_count += 1"] }
  - { method: POST, path: "/api/claims/{id}/pay", description: "APPROVED & UNPAID -> PAID; funding debit; exhaustion cascade", roles: [BenefitsAdmin], code: 200, input: [], output: Claim, side_effects: ["FundingEntry DEBIT", "enrollment used_cents += approved, reserved_cents -= approved", "EXHAUSTED cascade per state machine"] }
  - { method: POST, path: "/api/claims/{id}/reverse", description: "UNPAID -> REVERSED or PAID -> CLAWED_BACK (compensating actions)", roles: [BenefitsAdmin], code: 200, input: ["reason?"], output: Claim, side_effects: ["RELEASE or CLAWBACK_CREDIT entry", "enrollment ledger reversal", "EXHAUSTED -> ACTIVE when applicable"] }

  # --- Funding ---
  - { method: POST, path: "/api/funding-accounts", description: "Create account for (employer, benefit_year) with opening deposit", roles: [BenefitsAdmin], code: 201, input: [employer_id, benefit_year, initial_deposit_cents], output: FundingAccount, side_effects: ["DEPOSIT FundingEntry"] }
  - { method: GET, path: "/api/funding-accounts/{id}", description: "Read funding account", roles: [BenefitsAdmin, Auditor], code: 200, input: [], output: FundingAccount, side_effects: [] }
  - { method: GET, path: "/api/funding-accounts", description: "List funding accounts", roles: [BenefitsAdmin, Auditor], code: 200, input: ["employer_id?"], output: "FundingAccount[]", side_effects: [] }
  - { method: POST, path: "/api/funding-accounts/{id}/deposits", description: "Add funds; DEPLETED -> FUNDED when amount > 0", roles: [BenefitsAdmin], code: 201, input: [amount_cents], output: FundingEntry, side_effects: ["DEPOSIT entry", "funded_cents/available_cents += amount"] }
  - { method: GET, path: "/api/funding-accounts/{id}/entries", description: "Ledger entries for account", roles: [BenefitsAdmin, Auditor], code: 200, input: [], output: "FundingEntry[]", side_effects: [] }
  - { method: POST, path: "/api/funding-accounts/{id}/suspend", description: "FUNDED/DEPLETED -> SUSPENDED", roles: [BenefitsAdmin], code: 200, input: [], output: FundingAccount, side_effects: ["account.status -> SUSPENDED"] }
  - { method: POST, path: "/api/funding-accounts/{id}/reactivate", description: "SUSPENDED -> FUNDED or DEPLETED (derived from available_cents)", roles: [BenefitsAdmin], code: 200, input: [], output: FundingAccount, side_effects: ["account.status recomputed"] }
  - { method: GET, path: "/api/claims/{id}/funding-entries", description: "Ledger entries linked to a claim", roles: [BenefitsAdmin, Auditor, ClaimsReviewer], code: 200, input: [], output: "FundingEntry[]", side_effects: [] }

  # --- Fraud flags ---
  - { method: GET, path: "/api/fraud-flags/{id}", description: "Read fraud flag", roles: [BenefitsAdmin, Auditor, ClaimsReviewer], code: 200, input: [], output: FraudFlag, side_effects: [] }
  - { method: GET, path: "/api/fraud-flags", description: "List fraud flags", roles: [BenefitsAdmin, Auditor, ClaimsReviewer], code: 200, input: ["visit_id?", "claim_id?", "status?"], output: "FraudFlag[]", side_effects: [] }
  - { method: POST, path: "/api/fraud-flags/{id}/confirm", description: "OPEN -> CONFIRMED; voids flagged visit and rejects referencing open claims", roles: [ClaimsReviewer], code: 200, input: [], output: FraudFlag, side_effects: ["flagged visit -> VOIDED", "referencing open claims -> REJECTED with reservation release"] }
  - { method: POST, path: "/api/fraud-flags/{id}/clear", description: "OPEN -> CLEARED; recomputes fraud_hold on referencing claims", roles: [ClaimsReviewer], code: 200, input: [], output: FraudFlag, side_effects: ["claim fraud_hold recomputed"] }

  # --- Statements ---
  - { method: POST, path: "/api/statements", description: "Generate statement (OPEN) with provisional totals", roles: [BenefitsAdmin], code: 201, input: [member_id, period_yyyymm], output: Statement, side_effects: ["calc_statement_totals provisional variant"] }
  - { method: GET, path: "/api/statements/{id}", description: "Read statement (Member: own only)", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: [], output: Statement, side_effects: [] }
  - { method: GET, path: "/api/statements", description: "List statements", roles: [BenefitsAdmin, Auditor, Member], code: 200, input: ["member_id?", "status?"], output: "Statement[]", side_effects: [] }
  - { method: POST, path: "/api/statements/{id}/finalize", description: "OPEN -> FINALIZED; computes final totals", roles: [BenefitsAdmin], code: 200, input: [], output: Statement, side_effects: ["calc_statement_totals final variant"] }
  - { method: POST, path: "/api/statements/{id}/reopen", description: "FINALIZED -> OPEN (cycle); clears finalized_total_cents", roles: [BenefitsAdmin], code: 200, input: ["reason?"], output: Statement, side_effects: ["finalized_total_cents -> null", "recompute provisional"] }
  - { method: POST, path: "/api/statements/{id}/deliver", description: "FINALIZED -> DELIVERED (terminal)", roles: [BenefitsAdmin], code: 200, input: [], output: Statement, side_effects: ["statement.status -> DELIVERED"] }

  # --- Reports ---
  - { method: GET, path: "/api/reports/utilization", description: "Employer utilization report for a month", roles: [BenefitsAdmin, Auditor], code: 200, input: [employer_id, period_yyyymm], output: { employer_id: string, period_yyyymm: string, enrolled_members: integer, total_allowance_cents: integer, total_used_cents: integer, utilization_pct: number, paid_claim_count: integer, open_fraud_flags: integer }, side_effects: [] }

  # --- Test-driving (logical clock) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z and NEVER falls back to wall-clock time. Setting the clock forward triggers: member PENDING -> ELIGIBLE when crossing eligibility_date; enrollment quarter rollover when crossing a calendar quarter boundary.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["member eligibility auto-transitions", "enrollment quarter_key/quarter_used_cents reset on quarter crossing"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID, or entity_backed id does not resolve" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Role permitted but resource owned by another member/provider" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared value" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "amount/quantity fields non-positive" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "check_out_at <= check_in_at, period_end <= period_start, or contract_end <= contract_start" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "employer id does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan id does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not resolve" }
  - { id: ERR_DEPENDENT_NOT_FOUND, http: 404, condition: "dependent id does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "provider id does not resolve" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment id does not resolve" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "visit id does not resolve (incl. ids inside visit_ids[])" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not resolve" }
  - { id: ERR_FUNDING_ACCOUNT_NOT_FOUND, http: 404, condition: "funding account id does not resolve" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "statement id does not resolve" }
  - { id: ERR_FRAUD_FLAG_NOT_FOUND, http: 404, condition: "fraud flag id does not resolve" }
  - { id: ERR_DUPLICATE_TIER_CODE, http: 400, condition: "PUT tiers payload repeats a tier_code" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires plan ACTIVE (enrollment creation, member creation against plan)" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Activate requires plan DRAFT" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 409, condition: "Member not ELIGIBLE for the operation (PENDING or SUSPENDED)" }
  - { id: ERR_MEMBER_TERMINATED, http: 409, condition: "Member TERMINATED; all member operations blocked" }
  - { id: ERR_PROVIDER_NOT_ACTIVE, http: 409, condition: "Provider not ACTIVE for the operation (PENDING_ONBOARD or SUSPENDED)" }
  - { id: ERR_PROVIDER_TERMINATED, http: 409, condition: "Provider TERMINATED; contract amendment and new visits blocked" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Enrollment not ACTIVE (EXHAUSTED or CLOSED) where creation/approval requires ACTIVE" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "Claim review transition attempted from a state that does not allow it" }
  - { id: ERR_CLAIM_TERMINAL, http: 409, condition: "Claim review_status REJECTED is terminal" }
  - { id: ERR_PAYMENT_NOT_REVERSIBLE, http: 409, condition: "Reverse attempted when payment_status is REVERSED or CLAWED_BACK" }
  - { id: ERR_STATEMENT_NOT_OPEN, http: 409, condition: "Finalize requires statement OPEN" }
  - { id: ERR_STATEMENT_NOT_FINALIZED, http: 409, condition: "Deliver/reopen requires statement FINALIZED" }
  - { id: ERR_STATEMENT_LOCKED, http: 409, condition: "DELIVERED statement accepts no further transitions" }
  - { id: ERR_FUNDING_NOT_ACTIVE, http: 409, condition: "Funding account SUSPENDED (or, for pay, not FUNDED)" }
  - { id: ERR_FLAG_NOT_OPEN, http: 409, condition: "Confirm/clear requires fraud flag OPEN" }
  - { id: ERR_DEPENDENT_INACTIVE, http: 409, condition: "Dependent already INACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }
  - { id: ERR_FRAUD_HOLD, http: 422, condition: "Fraud gate: visit score >= 80 on verify, or claim.fraud_hold on approve" }
  - { id: ERR_CLAIM_FILING_DEADLINE, http: 422, condition: "service_date more than 90 days before the logical clock" }
  - { id: ERR_SERVICE_OUTSIDE_CONTRACT, http: 422, condition: "visit check_in_at outside provider contract window" }
  - { id: ERR_SERVICE_OUTSIDE_PLAN_PERIOD, http: 422, condition: "claim service_date outside plan period" }
  - { id: ERR_VISIT_TIME_OVERLAP, http: 409, condition: "member has a non-terminal visit whose half-open interval intersects the new one" }
  - { id: ERR_DUPLICATE_RECEIPT, http: 409, condition: "receipt_ref already used by a non-REJECTED claim of the same member" }
  - { id: ERR_FREQUENCY_CAP_EXCEEDED, http: 422, condition: "rolling 30-day visit count already at tier.visit_frequency_cap" }
  - { id: ERR_ENROLLMENT_PERIOD_OVERLAP, http: 409, condition: "member already has an enrollment whose closed plan period intersects" }
  - { id: ERR_DEPENDENT_AGE_INELIGIBLE, http: 422, condition: "CHILD dependent aged >= 26 at plan period_start" }
  - { id: ERR_MAX_RESUBMISSIONS, http: 422, condition: "resubmission_count already 3" }
  - { id: ERR_TIER_NOT_DEFINED, http: 422, condition: "member.tier_code absent from the plan's tiers" }
  - { id: ERR_VISIT_NOT_VERIFIED, http: 422, condition: "visit_ids contains a visit not VERIFIED or not owned by the claimant" }
  - { id: ERR_VISIT_IN_USE, http: 409, condition: "void blocked: visit referenced by an open claim" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "manual enrollment close blocked by open claims" }
  - { id: ERR_ALLOWANCE_EXCEEDED, http: 422, condition: "annual allowance window exhausted at approve" }
  - { id: ERR_QUARTERLY_CAP_EXCEEDED, http: 422, condition: "quarterly cap window exhausted at approve (checked before annual)" }
  - { id: ERR_FUNDING_INSUFFICIENT, http: 422, condition: "funding account available_cents < approved_amount_cents at approve" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BenefitsAdmin
    description: "Employer-side benefits operator: configures plans/tiers, onboards providers, manages members, pays/reverses claims, funds accounts, runs statements"
    identity: opaque
    exclusive_operations: [employer management, plan/tier management, provider onboarding and contract amendment, member lifecycle, funding deposits and suspension, claim pay/reverse, statement lifecycle]
    shared_operations: [read providers, read claims, read fraud flags, read reports]
  - name: ClaimsReviewer
    description: "Health-plan claims operations: reviews, approves, rejects claims; verifies/rejects/voids visits; triages fraud flags"
    identity: opaque
    exclusive_operations: [claim start-review/approve/reject/request-info, visit verify/reject/void, fraud flag confirm/clear]
    shared_operations: [read providers, read visits, read claims]
  - name: Member
    description: "Covered employee; acts only on own resources"
    identity: "entity_backed:Member"
    exclusive_operations: [claim resubmit]
    shared_operations: [read own record, manage own dependents, create own enrollment, submit REIMBURSEMENT claims, read own claims/statements/visits]
  - name: ProviderOperator
    description: "Gym/studio operator; identity is the Provider record; records visits and submits DIRECT_PAY claims for members"
    identity: "entity_backed:Provider"
    exclusive_operations: [record visits, submit DIRECT_PAY claims]
    shared_operations: [read own provider, read own visits/claims]
  - name: Auditor
    description: "Read-only oversight across all employers"
    identity: opaque
    exclusive_operations: []
    shared_operations: [all GET endpoints]
  - name: PlatformAdmin
    description: "Platform operator for test-driving facilities"
    identity: opaque
    exclusive_operations: [logical clock control]
    shared_operations: []
