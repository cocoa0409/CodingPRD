            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-02", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
