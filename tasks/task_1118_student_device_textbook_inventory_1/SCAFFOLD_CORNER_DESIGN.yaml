              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
