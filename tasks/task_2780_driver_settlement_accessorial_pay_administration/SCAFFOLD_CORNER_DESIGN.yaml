  - section: errors
    instances:
      - name: unknown_ids_on_advance_dispute_and_correction_reads_yield_distinct_404s
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_ADVANCE_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_RETRO_CORRECTION_NOT_FOUND]
        distinguishing_aspect: |
          The catalog declares one 404 per aggregate rather than a single generic not-found, so each read must
          name its own aggregate: an unknown advance id gives ERR_ADVANCE_NOT_FOUND, an unknown dispute id gives
          ERR_DISPUTE_NOT_FOUND and an unknown correction id gives ERR_RETRO_CORRECTION_NOT_FOUND. All three ids
          are well-formed UUIDs, so the discriminator is which collection was addressed, and no call may collapse
          into a shared ERR_DRIVER_NOT_FOUND or a 200 with a null body.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "GET /driver-pay/advances/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: ComplianceAuditor
              captures: { err_adv404: $.data.error_id }
            - call: "GET /driver-pay/disputes/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: ComplianceAuditor
              captures: { err_dsp404: $.data.error_id }
            - call: "GET /driver-pay/retro-corrections/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: ComplianceAuditor
              captures: { err_rc404: $.data.error_id }
          assert:
            - "the advance read returns HTTP 404 with error_id ERR_ADVANCE_NOT_FOUND"
            - "the dispute read returns HTTP 404 with error_id ERR_DISPUTE_NOT_FOUND"
            - "the retro-correction read returns HTTP 404 with error_id ERR_RETRO_CORRECTION_NOT_FOUND"
            - "no two of the three responses carry the same error_id"
            - "each response body carries the standard error envelope with error_id and message"
      - name: a_degenerate_interval_is_rejected_on_both_claims_and_settlement_periods
        claim_type: error_triggerable
        grounds:
          - validations[priority=38]
          - errors[ERR_INTERVAL_INVALID]
          - entities.AccessorialClaim.fields.end_at
          - entities.Settlement.fields.period_end
        distinguishing_aspect: |
          One error id guards two different endpoints, and both must use the strict comparison: an accessorial
          claim whose end_at equals its start_at is rejected, and a settlement whose period_end equals its
          period_start is rejected, even though an empty half-open period would otherwise sweep nothing rather
          than crash. Widening either interval by one hour or one week then succeeds, which proves the rejection
          was the interval test and not the surrounding load or driver state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_IVL ACTIVE on a LEASED_OPERATOR PRACTICAL package"
