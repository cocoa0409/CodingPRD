            - { call: "POST /school/volunteer-commitments/${vc_id}/entries", payload: { hours: 8, note: "Purim carnival booth" }, as: SchoolAdmin }
            - { call: "POST /school/milestones/${m_id}/schedule", payload: { ceremony_date: "2027-05-16" }, as: SchoolAdmin, captures: { m_final: $.data.status } }
          assert:
            - "First schedule attempt: err == ERR_VOLUNTEER_REQUIREMENT_UNMET (commitment OPEN at 0/8)"
            - "After logging 8 hours: VolunteerCommitment.${vc_id}.status == FULFILLED (inclusive >= at exactly 8)"
            - "m_final == SCHEDULED — the cross-entity gate opened only when the OTHER entity reached FULFILLED"

      - name: school_year_open_requires_active_security_plan
        grounds:
          - state_machines.SchoolYear.SETUP_to_OPEN
          - state_machines.SecurityPlan.SUBMITTED_to_ACTIVE
          - errors[ERR_SECURITY_PLAN_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair SchoolYear -> SecurityPlan (different pair than the other instance):
          opening the year is gated on a DIFFERENT entity reaching ACTIVE — blocked
          while the only plan is DRAFT, allowed immediately after approve.
