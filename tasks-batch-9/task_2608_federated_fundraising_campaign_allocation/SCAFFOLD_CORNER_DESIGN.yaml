          setup:
            - "Two ACTIVE employers, one campaign each, both with loss_reserve_amount 0.00 so nothing is absorbed."
            - "Campaign A: pledge 1701.00 fully remitted, pledge 299.00 written off. Campaign B: pledge 1700.00 fully remitted, pledge 300.00 written off."
