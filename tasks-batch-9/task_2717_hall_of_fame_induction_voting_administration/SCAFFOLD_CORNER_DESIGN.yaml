      - name: threshold_boundary_values_around_the_election_threshold
        claim_type: threshold
        grounds:
          - calculations.election_threshold_votes
          - calculations.career_eligibility_assessment
        excluded_because:
          difficulty_instance: roster_threshold_exact_equality_elects_slot
          rationale: |
            The threshold-algorithm corner (value at threshold-1, at threshold, at threshold+1) is
            already walked twice in §1.8: roster_threshold_exact_equality_elects_slot puts
            votes_received exactly on threshold_votes_final and shows the >= comparison electing the
            slot while a one-vote-lower slot fails, and
            waiting_period_inclusive_at_exact_eligible_year does the same for
            cycle_year == eligible_from_year with the year below rejected. Re-testing the boundary
            here would restate those assertions verbatim.

      - name: aggregation_running_totals_survive_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.ballot_tally_counts
          - entities.Ballot.fields.total_selections_counted
        excluded_because:
          difficulty_instance: ballot_parallel_dimensions_with_audit_rejection_cycle
          rationale: |
            The aggregation corner's reversal half (running total correct after a reversal) is the
            core of the §1.8 audit-rejection instance: it invalidates a submission, then re-tallies
            and asserts ballots_cast, total_selections_counted, votes_received and vote_pct all
            re-derived downward, and permanent_ineligibility_strike_two_hop_vote_reversal covers the
            same reduction through the strike path. The add half is covered in §1.9 by
            tally_side_effects_set_slot_counts_and_provisional_threshold and
            tally_excludes_withdrawn_submission_from_counts.

      - name: interval_merge_adjacency_and_buffer_boundaries
        claim_type: interval_merge
        grounds:
          - calculations.exhibit_window_conflict
          - calculations.escort_pool_overlap
        excluded_because:
          difficulty_instance: exhibit_case_half_open_window_and_changeover_buffer
          rationale: |
            Both interval_merge calculations already have a dedicated §1.8 instance:
            exhibit_case_half_open_window_and_changeover_buffer tests the half-open adjacency that is
            legal for one inductee, the changeover gap required across inductees and the exact-buffer
            acceptance, and escort_pool_closed_interval_touching_endpoints tests the closed-interval
            collision at touching endpoints against escort_pool_size. A §1.9 instance could only
            repeat those adjacency cases.

      - name: variant_divergence_between_the_two_threshold_bases
        claim_type: variant_divergence
        grounds:
          - calculations.election_threshold_votes.variants
          - calculations.travel_grant_award_cents.variants
        excluded_because:
          difficulty_instance: threshold_turnout_vs_roster_divergence
          rationale: |
            Variant divergence is covered for both dual-variant calculations in §1.8:
            threshold_turnout_vs_roster_divergence drives ballots_cast and
            credentialed_roster_at_close apart so threshold_votes_provisional and
            threshold_votes_final differ on the same ballot, and
            travel_award_living_vs_posthumous_delegation contrasts the living and posthumous awards
            for identical nights and airfare. §1.9 adds nothing beyond those deltas.

      - name: variant_selection_by_pipeline_stage
        claim_type: variant_selection
        grounds:
          - calculations.election_threshold_votes.variants
          - state_machines.Ballot.NOT_TALLIED_to_PENDING_AUDIT
          - state_machines.Ballot.PENDING_AUDIT_to_AUDIT_CERTIFIED
        excluded_because:
          difficulty_instance: threshold_turnout_vs_roster_divergence
          rationale: |
            Correct-variant-in-correct-context is asserted by the same §1.8 instance: it shows the
            TURNOUT_BASED variant written by the tally (threshold_votes_final still null) and the
            ROSTER_BASED variant written only by the auditor's certification, which is exactly the
            stage-selection claim. §1.9 keeps the weaker restatement out.

      - name: reconciliation_when_the_provisional_threshold_is_superseded
        claim_type: reconciliation
        grounds:
          - calculations.election_threshold_votes.variants
          - entities.Ballot.fields.threshold_votes_provisional
          - entities.Ballot.fields.threshold_votes_final
        excluded_because:
          difficulty_instance: threshold_turnout_vs_roster_divergence
          rationale: |
            The switch from the provisional to the final variant is a threshold recomputation, not a
            ledger delta, and the §1.8 instance already reconciles both stored figures on the same
            ballot row and shows the outcome resolved against the final one. The only ledger-style
            reconciliation in this domain is travel_committed_cents, covered by
            travel_commitment_restored_exactly_on_grant_cancellation.
