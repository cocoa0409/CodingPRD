            - "the refused calls did not consume the center version: the same ${center_v} still satisfies the OCC check on the successful approve"

      - name: center_read_is_shared_across_every_role
        claim_type: Shared Operations
        grounds:
          - roles.Worker.shared_operations
          - endpoints.GET_/sortation/sort-centers/{id}
        distinguishing_aspect: "The center read is the one endpoint every role including the entity-backed Worker shares, and all six callers get the identical derived projection."
        test_recipe:
