# =============================================================================
# Scaffold: Hospital Cost Accounting & Service-Line Margin (hospital decision support)
# =============================================================================

scenario: |
  1992. Hospital Cost Accounting & Service-Line Margin (hospital decision support): cost allocation (RVU/time-driven) to procedures, direct vs indirect & fixed vs variable classification, physician-level & DRG-level margin analysis, implant/supply cost variation by surgeon, payer-mix contribution analysis, budget variance & flex budgeting by volume, service-line profitability decision support, cost model refresh & data quality

domain_name: hospital-cost-accounting
api_prefix: /cost-accounting

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  # Same case data costed under two allocation bases (RVU vs time-driven) and two
  # overhead variants (static vs volume-flexed) produce divergent margins.
  secondary_archetype: workflow_orchestration
  # CostModel approval chain + refresh proposal/approve/apply cycle, case post/void/lock.
  complexity_layers:
    - dual_variant_calculation        # static vs flexed overhead; RVU vs TDABC bases
    - cascading_side_effects          # model approval -> case recompute -> service-line rollup
    - rate_threshold_triggers         # volume-tiered flex overhead rate; variance thresholds
    - derived_field_reconciliation    # service-line rollup fields reconcile against case costs
    - optimistic_concurrency          # OCC on CostModel.version for refresh approval
    - soft_delete                     # VOIDED cases excluded from aggregates but queryable
  entity_topology: flat               # peer entities joined by FKs; no URL nesting
  state_machine_shape: branching      # CostModel DRAFT->ACTIVE with supersede; Case VOID loop; refresh approve/reject fork
  relationship_patterns:
    - one_to_many                     # ServiceLine -> Case; CostModel -> ActivityCostLine
    - cross_aggregate                 # Case references CostModel, Physician, DRG, ServiceLine
  role_model: approval_chain          # CostAnalyst builds -> FinanceController approves -> posts
  consistency_model: immediate        # all cascades commit inside the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceLine
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Service line name (e.g., Orthopedic Surgery)" }
      - { name: code, type: string, source: input, description: "Unique service-line code (e.g., ORTHO)", constraints: "unique across ServiceLine" }
      - { name: base_direct_cost, type: number, source: input, description: "Direct fixed cost baseline allocated to the line per period (>= 0)" }
      - { name: budgeted_volume, type: integer, source: input, description: "Budgeted case volume per period (> 0)" }
      - { name: total_direct_cost, type: number, source: computed, description: "base_direct_cost + sum of total_indirect_allocated across POSTED cases of this line (all periods)" }
      - { name: total_revenue, type: number, source: computed, description: "Sum of expected_reimbursement across POSTED cases of this line" }
      - { name: contribution_margin, type: number, source: computed, description: "total_revenue - total_direct_cost" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE }

  - name: CostCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cost center name (e.g., OR Minutes, Laboratory)" }
      - { name: code, type: string, source: input, description: "Unique cost-center code", constraints: "unique across CostCenter" }
      - { name: cost_type, type: enum, source: input, description: "DIRECT | INDIRECT | OVERHEAD" }
      - { name: cost_behavior, type: enum, source: input, description: "FIXED | VARIABLE" }
      - { name: allocated_cost, type: number, source: input, description: "Period cost pool assigned to this center (> 0)" }
      - { name: practical_capacity_minutes, type: integer, source: input, description: "TDABC practical capacity in minutes; required when capacity_measure = MINUTES", constraints: "> 0 when capacity_measure=MINUTES else must be absent" }
      - { name: total_rvu, type: number, source: input, description: "Total RVU denominator for RVU-basis centers", constraints: "> 0 when capacity_measure=RVU else must be absent" }
      - { name: capacity_measure, type: enum, source: input, description: "MINUTES | RVU | NONE — NONE valid only for OVERHEAD centers" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier", constraints: "unique across Physician" }
      - { name: full_name, type: string, source: input, description: "Physician name" }
      - { name: specialty, type: string, source: input, description: "Specialty label (e.g., Orthopedics)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: Drg
    parent: null
    common_fields: true
    fields:
      - { name: drg_code, type: string, source: input, description: "DRG code (e.g., 470)", constraints: "unique across Drg" }
      - { name: description, type: string, source: input, description: "DRG description" }
      - { name: target_cost, type: number, source: input, description: "Target fully-allocated indirect cost per case (>= 0)" }
      - { name: base_rate, type: number, source: input, description: "DRG base reimbursement rate (>= 0)" }

  - name: CostModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model name (e.g., ORTHO-STD)" }
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id; line this model prices" }
      - { name: allocation_basis, type: enum, source: input, description: "TDABC | RVU — time-driven activity-based costing vs relative-value-unit costing" }
      - { name: rate_factor, type: number, source: input, description: "Multiplier applied to capacity rates (>= 0, e.g., 1.20)" }
      - { name: overhead_cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; must reference a center with cost_type=OVERHEAD" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | ARCHIVED" }
      - { name: supersedes_model_id, type: string, source: input, description: "FK -> CostModel.id; model this one replaces on approval", constraints: "optional; must reference an ACTIVE model of the same service_line_id" }
      - { name: effective_period, type: string, source: input, description: "First period YYYY-MM this model prices", constraints: "format YYYY-MM" }

  - name: CostModelRefresh
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> CostModel.id; ACTIVE model being refreshed" }
      - { name: period, type: string, source: input, description: "Period YYYY-MM the new rates describe" }
      - { name: proposed_rates, type: array, source: input, description: "Array of { cost_center_id, allocated_cost, practical_capacity_minutes?, total_rvu? }" }
      - { name: data_quality_score, type: number, source: input, description: "Completeness score 0..100 of the underlying GL feed" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | APPLIED" }
      - { name: variance_report, type: array, source: computed, description: "Per-center rate delta % vs current CostCenter rates, populated at proposal" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; attending/surgeon" }
      - { name: drg_id, type: string, source: input, description: "FK -> Drg.id" }
      - { name: cost_model_id, type: string, source: input, description: "FK -> CostModel.id; must be ACTIVE and belong to the same service_line_id" }
      - { name: period, type: string, source: input, description: "Service period YYYY-MM", constraints: "format YYYY-MM; must be >= cost model effective_period" }
      - { name: expected_reimbursement, type: number, source: input, description: "Expected net revenue for the case (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | VOIDED | LOCKED" }
      - { name: total_direct_cost, type: number, source: computed, description: "service_line.base_direct_cost + implant costs + supply costs" }
      - { name: total_indirect_allocated, type: number, source: computed, description: "Sum of ActivityCostLine.allocated_amount across this case's lines (pinned rounding order per §1.3)" }
      - { name: total_cost, type: number, source: computed, description: "total_direct_cost + total_indirect_allocated" }
      - { name: margin, type: number, source: computed, description: "expected_reimbursement - total_cost" }
      - { name: version_at_post, type: integer, source: computed, description: "CostModel.version captured when the case was posted (staleness marker)" }

  - name: ActivityCostLine
    parent: null
    common_fields: false   # append-only ledger lines: id + created_at only
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; must be INDIRECT or OVERHEAD" }
      - { name: quantity, type: number, source: input, description: "Minutes consumed (MINUTES centers) or RVU amount (RVU centers) (> 0)" }
      - { name: is_overhead_line, type: boolean, source: input, description: "true when cost_center is the model's overhead pool", default: false }
      - { name: allocated_amount, type: number, source: computed, description: "Computed at case post per the model's allocation_basis; 0 until posted" }

  - name: Implant
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: item_code, type: string, source: input, description: "Implant catalog code" }
      - { name: vendor, type: string, source: input, description: "Vendor name" }
      - { name: unit_cost, type: number, source: input, description: "Cost per unit (> 0)" }
      - { name: quantity, type: integer, source: input, description: "Units implanted (> 0)" }

  - name: SupplyLine
    parent: null
    common_fields: false   # append-only
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: supply_code, type: string, source: input, description: "Supply catalog code" }
      - { name: unit_cost, type: number, source: input, description: "Cost per unit (> 0)" }
      - { name: quantity, type: integer, source: input, description: "Units consumed (> 0)" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id" }
      - { name: payer_name, type: string, source: input, description: "Payer name (e.g., Medicare)" }
      - { name: payer_type, type: enum, source: input, description: "MEDICARE | MEDICAID | COMMERCIAL | SELF_PAY" }
      - { name: contracted_rate, type: number, source: input, description: "Expected payment per case under this contract (> 0)" }
      - { name: effective_period, type: string, source: input, description: "First period YYYY-MM the contract applies" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED", default: ACTIVE }

  - name: BudgetPeriod
    parent: null
    common_fields: true
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; the OVERHEAD center whose pool is budgeted" }
      - { name: period, type: string, source: input, description: "Period YYYY-MM" }
      - { name: static_budget_amount, type: number, source: input, description: "Static (budgeted) overhead pool amount (> 0)" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED", default: OPEN }
      - { name: actual_indirect_volume, type: number, source: computed, description: "Sum of total_indirect_allocated (pre-overhead) of POSTED/LOCKED cases in this period sharing the model that uses this pool" }
      - { name: flexed_overhead, type: number, source: computed, description: "Volume-flexed overhead per §1.3 flex_budget" }
      - { name: variance_amount, type: number, source: computed, description: "flexed_overhead - static_budget_amount" }
      - { name: variance_direction, type: enum, source: computed, description: "FAVORABLE | UNFAVORABLE | ON_BUDGET" }
      - { name: constraints_note, type: string, source: system, description: "Unique (cost_center_id, period) pair", constraints: "unique (cost_center_id, period)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceLine
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: POST /cost-accounting/service-lines/{id}/archive
        actor: FinanceController
        preconditions:
          - "No Case of this line is in DRAFT or POSTED status (all cases LOCKED or VOIDED) (ERR_SERVICE_LINE_HAS_OPEN_CASES)"
          - "No CostModel of this line is in ACTIVE status (ERR_SERVICE_LINE_HAS_ACTIVE_MODEL)"
        side_effects:
          - "All ACTIVE CostModels of this line -> ARCHIVED"
          - "All ACTIVE PayerContracts of this line -> TERMINATED"

  - entity: CostCenter
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: POST /cost-accounting/cost-centers/{id}/archive
        actor: FinanceController
        preconditions:
          - "No CostModel (any status except SUPERSEDED/ARCHIVED) references this center as overhead_cost_center_id (ERR_COST_CENTER_IN_USE)"
          - "No ActivityCostLine references this center on a DRAFT or POSTED case (ERR_COST_CENTER_IN_USE)"
        side_effects: []

  - entity: Physician
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: POST /cost-accounting/physicians/{id}/deactivate
        actor: FinanceController
        preconditions:
          - "No DRAFT or POSTED Case references this physician (ERR_PHYSICIAN_HAS_OPEN_CASES)"
        side_effects: []

      - from: INACTIVE
        to: ACTIVE
        trigger: POST /cost-accounting/physicians/{id}/reactivate
        actor: FinanceController
        preconditions: []
        side_effects: []

  - entity: CostModel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /cost-accounting/cost-models/{id}/approve
        actor: FinanceController
        preconditions:
          - "Referenced service line is ACTIVE (ERR_SERVICE_LINE_NOT_ACTIVE)"
          - "overhead_cost_center references an ACTIVE CostCenter with cost_type=OVERHEAD (ERR_OVERHEAD_CENTER_INVALID)"
          - "If supersedes_model_id present: that model is ACTIVE and belongs to the same service_line_id (ERR_SUPERSEDE_TARGET_INVALID)"
        side_effects:
          - "If supersedes_model_id present: that CostModel -> SUPERSEDED"
          - "increments CostModel.version by 1"

      - from: DRAFT
        to: ARCHIVED
        trigger: POST /cost-accounting/cost-models/{id}/archive
        actor: FinanceController
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: ARCHIVED
        trigger: POST /cost-accounting/cost-models/{id}/archive
        actor: FinanceController
        preconditions:
          - "No DRAFT or POSTED Case references this model (ERR_MODEL_HAS_OPEN_CASES)"
          - "No PROPOSED or APPROVED CostModelRefresh references this model (ERR_MODEL_HAS_OPEN_REFRESH)"
        side_effects: []

  - entity: CostModelRefresh
    initial_state: PROPOSED
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /cost-accounting/cost-model-refreshes/{id}/approve
        actor: FinanceController
        preconditions:
          - "Target CostModel is ACTIVE (ERR_MODEL_NOT_ACTIVE)"
          - "Every entry in variance_report has abs(delta_pct) <= VARIANCE_THRESHOLD_PCT (3.00) (ERR_REFRESH_VARIANCE_EXCEEDED)"
          - "data_quality_score >= MIN_DATA_QUALITY (80.00) (ERR_DATA_QUALITY_TOO_LOW)"
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: POST /cost-accounting/cost-model-refreshes/{id}/reject
        actor: FinanceController
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: APPLIED
        trigger: POST /cost-accounting/cost-model-refreshes/{id}/apply
        actor: FinanceController
        preconditions:
          - "Target CostModel is still ACTIVE (ERR_MODEL_NOT_ACTIVE)"
        side_effects:
          - "Each referenced CostCenter's allocated_cost / practical_capacity_minutes / total_rvu updated to proposed values"
          - "Every POSTED case priced by the target model with period >= refresh.period is recomputed per §1.3 (activity lines regenerated, totals refreshed)"
          - "Each recomputed case's ServiceLine.total_direct_cost / contribution_margin refreshed (ledger sync)"
          - "Each affected BudgetPeriod.actual_indirect_volume / flexed_overhead / variance_amount recomputed (contagion hop 3)"
          - "Target CostModel.version increments by 1"

  - entity: Case
    initial_state: DRAFT
    terminal_states: [VOIDED, LOCKED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: POST /cost-accounting/cases/{id}/post
        actor: CostAnalyst
        preconditions:
          - "At least one ActivityCostLine exists for the case (ERR_CASE_NO_ACTIVITY)"
          - "Case period >= CostModel.effective_period of its model (ERR_CASE_PERIOD_BEFORE_MODEL)"
          - "Referenced CostModel is ACTIVE (ERR_MODEL_NOT_ACTIVE)"
        side_effects:
          - "All ActivityCostLine.allocated_amount computed per §1.3 case_costing (pinned per-line rounding, then overhead single-step)"
          - "Case.total_direct_cost / total_indirect_allocated / total_cost / margin computed"
          - "version_at_post = CostModel.version"
          - "ServiceLine.total_direct_cost, total_revenue, contribution_margin updated (ledger sync, hop 1)"
          - "BudgetPeriod.actual_indirect_volume / flexed_overhead / variance recomputed for the case period (hop 2)"

      - from: POSTED
        to: VOIDED
        trigger: POST /cost-accounting/cases/{id}/void
        actor: CostAnalyst
        preconditions: []
        side_effects:
          - "ServiceLine.total_direct_cost / total_revenue / contribution_margin reduced by this case's contribution (compensation)"
          - "BudgetPeriod.actual_indirect_volume reduced; flexed_overhead / variance recomputed (compensation)"

      - from: POSTED
        to: LOCKED
        trigger: POST /cost-accounting/cases/{id}/lock
        actor: FinanceController
        preconditions:
          - "Case.version_at_post == current CostModel.version (ERR_CASE_STALE_MODEL) — a case priced under an outdated model must be voided and re-posted, not locked"
        side_effects: []

  - entity: BudgetPeriod
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: POST /cost-accounting/budget-periods/{id}/lock
        actor: FinanceController
        preconditions:
          - "No Case with this period and a model using this pool is in POSTED with version_at_post != model.version (ERR_PERIOD_HAS_STALE_CASES)"
        side_effects:
          - "All POSTED cases in this period priced by a model using this pool -> LOCKED"
          - "Final flexed_overhead / variance_amount frozen (no further recompute)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: refresh-approve-stale-model
    parent_entity: CostModel
    write_endpoint: POST /cost-accounting/cost-model-refreshes/{id}/approve
    occ_field: expected_model_version
    description: |
      Approving a CostModelRefresh while carrying an expected_model_version that
      no longer matches the target CostModel.version is rejected: the client’s
      view of the model is stale because another writer has advanced it (e.g.,
      a prior refresh apply, or a model edit). Deterministic OCC rejection.
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412

  - rule_id: case-post-stale-model
    parent_entity: CostModel
    write_endpoint: POST /cost-accounting/cases/{id}/post
    occ_field: expected_model_version
    description: |
      Posting a Case with an expected_model_version that no longer matches the
      current CostModel.version is rejected: pricing must reflect the model as
      the client last observed it; a stale observation would price the case
      against superseded rates.
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_costing
    trigger: "Case post (DRAFT->POSTED) and refresh apply recompute"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (do not reorder):
      1. For each non-overhead ActivityCostLine (is_overhead_line=false):
           center = line.cost_center
           if center.capacity_measure == MINUTES:   capacity_rate = center.allocated_cost / center.practical_capacity_minutes
           if center.capacity_measure == RVU:       capacity_rate = center.allocated_cost / center.total_rvu
           raw = line.quantity * capacity_rate * model.rate_factor
           line.allocated_amount = round_half_up(raw, 2)          # <-- per-line rounding BEFORE summation
      2. total_activity = sum(line.allocated_amount)               # sum of ALREADY-rounded lines
      3. Overhead single-step proportional allocation over the non-overhead lines:
           pool = model.overhead_cost_center.allocated_cost
           for each non-overhead line i (processed in created_at ASC, tie-break quantity DESC):
               raw_share_i = pool * line_i.allocated_amount / total_activity
               floor_share_i = floor(raw_share_i * 100) / 100
           remainder = round_half_up(pool,2) - sum(floor_share_i)
           assign remainder to the line with the largest raw_share_i
           (tie-break: largest allocated_amount; then earliest created_at)
           line_i.allocated_amount stays; overhead amount recorded separately per line
           as overhead_amount = floor_share_i (+ remainder on the chosen line)
      4. total_indirect_allocated = total_activity + pool
      5. total_direct_cost = service_line.base_direct_cost
                             + sum(implant.unit_cost * implant.quantity)
                             + sum(supply.unit_cost * supply.quantity)
      6. total_cost = total_direct_cost + total_indirect_allocated
      7. margin = expected_reimbursement - total_cost
    input_set: "All ActivityCostLine of the case (non-overhead for step 1-3); all Implant and SupplyLine of the case; case's ServiceLine.base_direct_cost"
    constants:
      ROUNDING: "per-line round_half_up to 2 decimals BEFORE summation; sum-then-round is FORBIDDEN"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: tdabc_basis
        when: "CostModel.allocation_basis == TDABC"
        difference: "capacity_rate = allocated_cost / practical_capacity_minutes; quantity interpreted as minutes"
      - name: rvu_basis
        when: "CostModel.allocation_basis == RVU"
        difference: "capacity_rate = allocated_cost / total_rvu; quantity interpreted as RVU units; identical financial data costs differently from TDABC"

  - name: flex_budget
    trigger: "BudgetPeriod recompute (case post/void, refresh apply) and GET /budget-periods/{id}"
    algorithm: threshold
    formula: |
      actual_indirect_volume = sum over POSTED/LOCKED cases in this period,
        priced by any model whose overhead_cost_center == this center,
        of (case.total_indirect_allocated - overhead_pool_amount_for_that_case)
        i.e., the pre-overhead activity total per case.
      Volume tiers on actual_indirect_volume:
        tier_rate = 0.20 if actual_indirect_volume <= 6000
                  = 0.30 if actual_indirect_volume <= 20000
                  = 0.35 otherwise
      flexed_overhead = round_half_up(tier_rate * actual_indirect_volume, 2)
      variance_amount = flexed_overhead - static_budget_amount
      variance_direction = FAVORABLE if variance_amount < 0
                         | ON_BUDGET if variance_amount == 0
                         | UNFAVORABLE if variance_amount > 0
      Boundary precision: tier inclusion is <= (6000.00 exactly uses 0.20; 20000.00 exactly uses 0.30).
    input_set: "POSTED/LOCKED cases only (VOIDED and DRAFT excluded); BudgetPeriod.status == LOCKED freezes the values"
    constants:
      TIER_1_MAX: 6000
      TIER_1_RATE: 0.20
      TIER_2_MAX: 20000
      TIER_2_RATE: 0.30
      TIER_3_RATE: 0.35
    precision: "2 decimal places, round_half_up"
    variants:
      - name: static_budget
        when: "reporting static view (variance vs budget not requested with flex)"
        difference: "uses static_budget_amount directly as the overhead baseline; no volume tiering — the same period reports a different 'budget' under the two variants"

  - name: physician_margin_report
    trigger: "GET /cost-accounting/reports/physician-margin?physician_id=...&period=..."
    algorithm: aggregation
    formula: |
      Input set: POSTED and LOCKED cases of the physician in the period (VOIDED, DRAFT excluded).
      total_revenue = sum(expected_reimbursement)
      total_cost = sum(total_cost)
      margin = total_revenue - total_cost
      margin_per_case = round_half_up(margin / count(cases), 2); count==0 -> margin_per_case = 0 and empty case list
      Sorting for the returned case list: margin ASC (worst first), tie-break case.created_at ASC.
    input_set: "Cases filtered by physician_id, period, status IN {POSTED, LOCKED}"
    precision: "2 decimal places, round_half_up"

  - name: drg_margin_report
    trigger: "GET /cost-accounting/reports/drg-margin?drg_id=...&period=..."
    algorithm: aggregation
    formula: |
      Input set: POSTED/LOCKED cases of the DRG in the period.
      avg_indirect = round_half_up(avg(total_indirect_allocated), 2)
      target_variance = avg_indirect - Drg.target_cost
      compliance = OVER if target_variance > 0 | ON_TARGET if == 0 | UNDER if < 0
      Empty input set -> avg_indirect = 0, target_variance = -target_cost, compliance = UNDER.
    input_set: "Cases filtered by drg_id, period, status IN {POSTED, LOCKED}"
    precision: "2 decimal places, round_half_up"

  - name: payer_mix_contribution
    trigger: "GET /cost-accounting/reports/payer-mix?service_line_id=...&period=..."
    algorithm: waterfall_allocation
    formula: |
      Input set: POSTED/LOCKED cases of the service line in the period, joined to the
      ACTIVE PayerContract whose contracted_rate equals the case expected_reimbursement
      (selector: contracts of this line with status ACTIVE and effective_period <= case period;
       ranking: latest effective_period; tie-break: earliest created_at; empty pool -> case excluded
       from payer mix and counted under unmatched_count).
      For each payer_type:
        revenue_pt = sum(contracted_rate over its cases)
        total_revenue_all = sum over all matched cases
        cost_share_pt = round_half_up(total_revenue share: sum(total_cost of all matched cases) * revenue_pt / total_revenue_all, 2)
        contribution_pt = revenue_pt - cost_share_pt
      Rounding remainder on cost_share across payer types is assigned to the payer_type
      with the largest revenue_pt (tie-break: payer_type enum order MEDICARE < MEDICAID < COMMERCIAL < SELF_PAY).
    input_set: "POSTED/LOCKED cases of the line in the period with a resolvable payer contract"
    precision: "2 decimal places, round_half_up"

  - name: implant_variation
    trigger: "GET /cost-accounting/reports/implant-variation?service_line_id=...&item_code=...&period=..."
    algorithm: aggregation
    formula: |
      Input set: POSTED/LOCKED cases of the line in the period that have at least one Implant with item_code.
      Per physician: implant_cost_per_case = round_half_up(sum(unit_cost*quantity over matching implants) / count(cases), 2)
      cohort_avg = round_half_up(sum over all physicians' implants / count(all matching cases), 2)
      variation_pct per physician = round_half_up((implant_cost_per_case - cohort_avg) / cohort_avg * 100, 2); cohort_avg == 0 -> variation_pct = 0
    input_set: "POSTED/LOCKED cases with matching Implant.item_code, grouped by physician"
    precision: "2 decimal places, round_half_up"

  - name: refresh_variance
    trigger: "CostModelRefresh creation (PROPOSED)"
    algorithm: constraint_propagation
    formula: |
      For each proposed_rates entry:
        current_rate = CostCenter.allocated_cost / (practical_capacity_minutes | total_rvu)   [per current center values]
        proposed_rate = proposed.allocated_cost / (proposed.practical_capacity_minutes | proposed.total_rvu)
        delta_pct = round_half_up((proposed_rate - current_rate) / current_rate * 100, 2)
      variance_report = [ { cost_center_id, current_rate, proposed_rate, delta_pct }, ... ]
      Approval gate: every abs(delta_pct) <= VARIANCE_THRESHOLD_PCT and data_quality_score >= MIN_DATA_QUALITY.
    constants:
      VARIANCE_THRESHOLD_PCT: 3.00
      MIN_DATA_QUALITY: 80.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids and body FK references must exist (path validated left-to-right, then body FKs in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource must be in the correct state for the operation (e.g., post requires DRAFT, approve requires PROPOSED, lock requires POSTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: state
    check: "Referenced parent aggregate must be ACTIVE (service line ACTIVE for model approval and case creation; cost model ACTIVE for case post and refresh approve)"
    error_id: ERR_SERVICE_LINE_NOT_ACTIVE | ERR_MODEL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cost-models/{id}/approve, POST /cases, POST /cases/{id}/post, POST /cost-model-refreshes/{id}/approve"

  - priority: 6
    category: business_referential
    check: "Cross-reference structural validity: overhead_cost_center must be an ACTIVE center with cost_type=OVERHEAD; activity line centers must be INDIRECT or OVERHEAD and ACTIVE; supersedes_model must be ACTIVE and same service_line_id; physician must be ACTIVE; case period >= model effective_period"
    error_id: ERR_OVERHEAD_CENTER_INVALID | ERR_ACTIVITY_CENTER_INVALID | ERR_SUPERSEDE_TARGET_INVALID | ERR_PHYSICIAN_NOT_ACTIVE | ERR_CASE_PERIOD_BEFORE_MODEL
    http_status: 422
    applies_to: "POST /cost-models, POST /cost-models/{id}/approve, POST /cases, POST /cases/{id}/activity-lines, POST /cases/{id}/post"

  - priority: 7
    category: business_safety
    check: "Cost-model refresh governance: every abs(variance_report delta_pct) <= 3.00 and data_quality_score >= 80.00"
    error_id: ERR_REFRESH_VARIANCE_EXCEEDED | ERR_DATA_QUALITY_TOO_LOW
    http_status: 422
    applies_to: "POST /cost-model-refreshes/{id}/approve"

  - priority: 8
    category: business_constraint
    check: "Case completeness and freshness: at least one activity line at post; version_at_post == model.version at lock; budget period has no stale cases at period lock; no open cases/models when archiving parents"
    error_id: ERR_CASE_NO_ACTIVITY | ERR_CASE_STALE_MODEL | ERR_PERIOD_HAS_STALE_CASES | ERR_SERVICE_LINE_HAS_OPEN_CASES | ERR_SERVICE_LINE_HAS_ACTIVE_MODEL | ERR_MODEL_HAS_OPEN_CASES | ERR_MODEL_HAS_OPEN_REFRESH | ERR_COST_CENTER_IN_USE | ERR_PHYSICIAN_HAS_OPEN_CASES
    http_status: 409
    applies_to: "post/lock/archive/lock endpoints"

  - priority: 9
    category: business_temporal
    check: "Temporal windowing: BudgetPeriod unique per (cost_center_id, period); payer contract selection window (effective_period <= case period); case period format YYYY-MM and >= model effective_period"
    error_id: ERR_DUPLICATE_BUDGET_PERIOD | ERR_CASE_PERIOD_BEFORE_MODEL | ERR_INVALID_PERIOD_FORMAT
    http_status: 409
    applies_to: "POST /budget-periods, POST /cases, POST /payer-contracts"

  - priority: 10
    category: business_fiscal
    check: "Numeric sanity: all monetary inputs >= 0 (unit_cost, allocated_cost, capacity, quantities > 0 where required); enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

