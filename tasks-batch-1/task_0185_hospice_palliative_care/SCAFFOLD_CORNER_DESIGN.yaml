              payload: { name: "ValCov Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Cov Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c26" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
            - call: "POST /hospice/care-plans"
