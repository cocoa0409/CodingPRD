  # =====================================================================
  # Section: errors (every error triggerable)
  # =====================================================================
  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request with no X-User-Role/X-User-ID headers -> 401 ERR_UNAUTHENTICATED before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/categories"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"
        note: "Anonymous = omit both identity headers entirely."
      - name: error_bid_ceiling_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_BID_CEILING_EXCEEDED]"]
        distinguishing_aspect: "Bid at 1001 on a ceiling-1000 OPEN tender -> 422 ERR_BID_CEILING_EXCEEDED (fiscal check reached only after state passes)."
        test_recipe:
          setup: ["OPEN tender ceiling 1000; supplier exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 1001 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BID_CEILING_EXCEEDED, HTTP 422"
      - name: error_labor_budget_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_LABOR_BUDGET_EXCEEDED]", calculations.labor_window_cost]
        distinguishing_aspect: "Weekly spend 7200 + new 3600 > budget 10000 -> 422 ERR_LABOR_BUDGET_EXCEEDED; fiscal is the last check after temporal and constraint pass."
        test_recipe:
          setup: ["store budget 10000 with two non-overlapping 2h STOCKER windows (3600 each, total 7200) in the same ISO week"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 10000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-08T06:00:00Z", ends_at: "2026-09-08T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z2", role: "STOCKER", starts_at: "2026-09-09T06:00:00Z", ends_at: "2026-09-09T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LABOR_BUDGET_EXCEEDED, HTTP 422 (7200 + 3600 = 10800 > 10000)"
      - name: error_coin_balance_negative
        claim_type: violation_to_error
        grounds: ["errors[ERR_COIN_BALANCE_NEGATIVE]", calculations.cart_coin_reconciliation]
        distinguishing_aspect: "CORRAL_COLLECT of 4 with running outstanding 3 -> 422 ERR_COIN_BALANCE_NEGATIVE; prefix-negative protection on the chronological ledger."
        test_recipe:
          setup: ["store with INSERT 3 only"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "INSERT", coin_count: 3 }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "CORRAL_COLLECT", coin_count: 4 }
              as: StoreManager
              as_user_id: ${store}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COIN_BALANCE_NEGATIVE, HTTP 422"
            - "Store.coins_outstanding remains 3 (event rejected atomically)"
      - name: error_window_limit_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_LIMIT_EXCEEDED]", "validations[priority=8]"]
        distinguishing_aspect: "7th non-overlapping window in the same ISO week -> 409 ERR_WINDOW_LIMIT_EXCEEDED (constraint reached when temporal passes)."
