  # ============================================================
  # Section: cross-cutting complexity layers
  # ============================================================
  - section: complexity_layers
    instances:
      - name: occ_meet_seed_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meet-seed-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential seeds carrying the same observed Meet.version: the first succeeds (version 3 -> 4, meet SEEDED); after a reopen/close cycle (version 6), replaying the stale version 3 is rejected with ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["meet seeded once, reopened with a new deadline, closed again; the stale version token is the one observed at the first close"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "OC1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v_stale: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v_stale}" }, as: MeetDirector, captures: { st1: "$.data.status" } }
            - { call: "POST /meets/${meet_id}/reopen-entries", payload: { new_entry_deadline_utc: "2026-08-12T00:00:00Z" }, as: MeetDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector }
          trigger:
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v_stale}" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${st1} == SEEDED  # first seed with the then-current version succeeds"
            - "${err} == ERR_STALE_VERSION  # replayed stale version rejected with 412 before the state check"
      - name: occ_event_complete_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-complete-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful complete (event version advances) and a referee reopen, replaying complete with the pre-complete version is rejected with ERR_STALE_VERSION 412 — deterministically, with strictly sequential calls."
        test_recipe:
          setup: ["event COMPLETED once with version token ${ev_v_start}, then reopened by the referee"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "OC2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
