      - name: employee_active_pip_id_conserved_across_issue_then_close
        grounds:
          - entities.Employee.fields.active_pip_id
          - state_machines.PerformanceImprovementPlan.DRAFT_to_ISSUED
          - state_machines.PerformanceImprovementPlan.ISSUED_to_CLOSED_WITHDRAWN
