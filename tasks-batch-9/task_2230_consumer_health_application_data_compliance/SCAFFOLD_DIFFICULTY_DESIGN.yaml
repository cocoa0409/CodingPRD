              as: PrivacyOfficer
              captures: { ven_id: $.data.id }
            - call: "POST /health-data/vendors/${ven_id}/execute-agreement"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app outside HIPAA" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
