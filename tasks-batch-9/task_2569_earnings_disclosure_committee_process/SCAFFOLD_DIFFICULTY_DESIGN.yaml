              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_on_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v2: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "EARNINGS_RELEASE", title: "Q2 FY2026 Earnings Release", author_member_id: "${fin_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v2}" }
