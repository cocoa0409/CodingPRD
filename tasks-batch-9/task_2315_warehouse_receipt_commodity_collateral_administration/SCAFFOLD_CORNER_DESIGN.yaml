        distinguishing_aspect: "A newly created Warehouse is APPLIED and SOLVENT with operational_posture CLOSED, and its STATE-program requirements are already derived: required_net_worth 5000000, tolerance 1250000, required_bond 2500000, both gaps 0."
        test_recipe:
          setup: ["Empty DB; clock at 2026-08-05T08:00:00Z."]
          setup_api_calls:
            - *b_clock
          trigger:
            - *b_wh
          assert:
            - "HTTP 201"
            - "Warehouse.${wh_id}.license_state == APPLIED"
            - "Warehouse.${wh_id}.insolvency_state == SOLVENT"
            - "Warehouse.${wh_id}.operational_posture == CLOSED"
            - "Warehouse.${wh_id}.licensed_by_user_id == null"
            - "Warehouse.${wh_id}.required_net_worth_cents == 5000000"
            - "Warehouse.${wh_id}.net_worth_shortfall_cents == 0"
