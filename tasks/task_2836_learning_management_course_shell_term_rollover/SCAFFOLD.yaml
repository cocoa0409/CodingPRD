      - "VALIDATE tallies validated_operation_count and rejected_operation_count without touching enrollments"
      - "APPLY executes the operations in array order, creating ACTIVE or WAITLISTED rows and cascading waitlist promotion on drops; requires batch_seq == term.sis_sync_epoch + 1 and advances sis_sync_epoch by 1"
