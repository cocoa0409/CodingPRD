              as: HearingClerk
          assert:
            - "before the triggers: HearingRoom.${room_p_id}.booked_hearing_count == 1"
            - "Protest.${prt_p1_id}.distance_to_site_km == 15.00"
            - "Protest.${prt_p2_id}.distance_to_site_km == 24.00"
            - "first trigger (13:30 start, 30-minute gap): HTTP status 409 with error_id ERR_HEARING_ROOM_CONFLICT"
            - "first trigger: error_id != ERR_STALE_ROOM_VERSION"
            - "first trigger: error_id != ERR_ROOM_DAY_CAPACITY_EXCEEDED"
            - "after the first trigger: HearingRoom.${room_p_id}.booked_hearing_count == 1 AND Protest.${prt_p2_id}.status == FILED"
            - "second trigger (14:00 start, gap exactly 60 minutes): HTTP status 200"
            - "Protest.${prt_p2_id}.status == SCHEDULED"
