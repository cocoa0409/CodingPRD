  - rule_id: compensating_invariant
    instances:
      - name: van_water_budget_conserved_on_add_remove
        grounds:
          - calculations.route_water_budget
          - state_machines.RouteStop.PLANNED_to_CANCELLED
          - entities.Van.fields.water_reserved_gal
        distinguishing_aspect: |
          Conserved quantity = van water budget: water_loaded_gal ==
          water_used_gal + water_reserved_gal + free_gal must hold before and after the
          compensating pair stop-add (+16 reserved) / stop-remove (-16 reserved).
        test_recipe:
          setup:
            - "RETAIL customer; site; 5 SEDANs; BASIC van loaded 96; DRAFT route 2026-08-05; one CONFIRMED 5-sedan order"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail VW", email: "rvw@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "VW", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V2", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V3", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V4", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V5", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q5: $.data.id } }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-VW", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech VW" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${q1}", "${q2}", "${q3}", "${q4}", "${q5}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
          trigger:
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id, stop_reserved: $.data.reserved_water_gal } }
            - { call: "GET /fleet-wash/vans/${van_id}", payload: {}, as: Dispatcher, captures: { res_after_add: $.data.water_reserved_gal, loaded_after_add: $.data.water_loaded_gal, used_after_add: $.data.water_used_gal } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "REMOVE" }, as: Dispatcher }
            - { call: "GET /fleet-wash/vans/${van_id}", payload: {}, as: Dispatcher, captures: { res_after_rm: $.data.water_reserved_gal, loaded_after_rm: $.data.water_loaded_gal, used_after_rm: $.data.water_used_gal } }
            - { call: "GET /fleet-wash/wash-orders/${order_id}", payload: {}, as: Dispatcher, captures: { order_status: $.data.status } }
          assert:
            - "stop_reserved == 16.0 (40 gross x (1 - 0.60))"
            - "After add: res_after_add == 16.0, used_after_add == 0.0, loaded_after_add == 96.0 (identity 96 == 0 + 16 + 80)"
            - "After compensating REMOVE: res_after_rm == 0.0, used_after_rm == 0.0, loaded_after_rm == 96.0 (identity restored exactly)"
            - "order_status == SCHEDULED (ASSIGNED -> SCHEDULED revert accompanies the release)"

      - name: route_vehicle_capacity_conserved_on_add_remove
        grounds:
          - entities.Route.fields.assigned_vehicle_count
          - validations[priority=16]
          - state_machines.RouteStop.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = route vehicle slots (different quantity than van water):
          assigned_vehicle_count + available_slots == 40 across the compensating pair
          add(+5) / remove(-5).
        test_recipe:
          setup:
            - "RETAIL customer; site; 5 SEDANs; BASIC van loaded 96; DRAFT route; two CONFIRMED 5-sedan orders A and B"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail RC", email: "rrc@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
