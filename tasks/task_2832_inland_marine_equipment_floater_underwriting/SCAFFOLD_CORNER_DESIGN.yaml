            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] (X-User-ID omitted) HTTP status == 401 and error_id == ERR_UNAUTHENTICATED"
            - "trigger[1] (X-User-ID blank) HTTP status == 401 and error_id == ERR_UNAUTHENTICATED"
            - "trigger[2] (X-User-Role: Broker) HTTP status == 401 and error_id == ERR_UNAUTHENTICATED - an unknown role is an authentication failure, NOT the 403 ERR_ROLE_NOT_PERMITTED"
            - "trigger[3] (both headers valid, unknown policy id) HTTP status == 404 and error_id == ERR_POLICY_NOT_FOUND - proving triggers 0-2 were stopped by priority 10/11 and not by anything downstream"
            - "re-issuing trigger[0] with valid headers returns 200 with Policy.${pol}, so the row was always readable and only the headers were at fault"
            - "all four error bodies carry response_type == error with data.error_id and data.message"

