            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { pv3: $.data.version } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "REDUCE", delta_cents: 3050000, expected_program_version: "${pv3}", memo: "Sweeping exactly the uncommitted balance" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "Over-reduction: HTTP 409 and ${e_pool} == ERR_POOL_BELOW_OBLIGATIONS — 5000000 - 3500000 == 1500000 is below the 1950000 already committed"
            - "The re-read before the second call shows subsidy_pool_cents still 5000000, subsidy_committed_cents 1950000, subsidy_available_cents 3050000 and ${pv3} equal to ${pv2} — the refused adjustment did not bump the version"
            - "Exact-balance reduction: HTTP 200 with subsidy_pool_cents == 1950000, subsidy_committed_cents == 1950000, subsidy_disbursed_cents == 0, subsidy_available_cents == 0 and program_posture == SUBSIDY_RESTRICTED"
            - "The conserved quantity holds on both sides: 5000000 == 3050000 + 1950000 + 0 before, and 1950000 == 0 + 1950000 + 0 after"

      - name: in_kind_and_cash_cost_entry_field_pairs_are_enforced
        claim_type: conditional_validation
        grounds: ["validations[priority=40]", errors.ERR_IN_KIND_AMOUNT_MISMATCH, entities.CostEntry.fields.is_in_kind, entities.CostEntry.fields.amount_cents, entities.CostEntry.fields.fair_market_value_cents, entities.CostEntry.fields.donor_name, "endpoints.POST /homeownership/cost-entries"]
        distinguishing_aspect: "One boolean flips which money field is mandatory and which must be zero, so the same numbers are legal in one shape and illegal in the other: an in-kind row carrying amount_cents, an in-kind row with no donor of record, and a cash row carrying a fair market value are all refused, while the two correctly shaped rows are accepted."
        test_recipe:
          setup:
            - "Canonical program with one build site at RAW_LAND (cost entries do not depend on readiness) and an empty cost ledger."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: true, amount_cents: 500000, fair_market_value_cents: 0, donor_name: "Cedar Lumber Co" }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_cash_on_gift: $.data.error_id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: true, amount_cents: 0, fair_market_value_cents: 250000 }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_no_donor: $.data.error_id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "LABOR", is_in_kind: false, amount_cents: 0, fair_market_value_cents: 250000 }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_fmv_on_cash: $.data.error_id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: true, amount_cents: 0, fair_market_value_cents: 250000, donor_name: "Cedar Lumber Co" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "LABOR", is_in_kind: false, amount_cents: 500000, fair_market_value_cents: 0 }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/cost-entries", payload: { build_site_id: "${site_id}" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "In-kind row carrying cash: HTTP 422 and ${e_cash_on_gift} == ERR_IN_KIND_AMOUNT_MISMATCH — is_in_kind true requires amount_cents == 0 and fair_market_value_cents > 0"
            - "In-kind row with no donor: HTTP 422 and ${e_no_donor} == ERR_IN_KIND_AMOUNT_MISMATCH"
            - "Cash row carrying a fair market value: HTTP 422 and ${e_fmv_on_cash} == ERR_IN_KIND_AMOUNT_MISMATCH — the mirror rule requires fair_market_value_cents == 0 and amount_cents > 0"
            - "Correct in-kind row: HTTP 201 with status == RECORDED, fair_market_value_cents == 250000, amount_cents == 0"
            - "Correct cash row: HTTP 201 with status == RECORDED, amount_cents == 500000, fair_market_value_cents == 0"
            - "Cost-entry list for the site: total_count == 2 — the three refusals appended nothing to the append-only ledger"
            - "Program re-read: donated_material_fmv_cents == 250000, counting only the one accepted in-kind row"

      - name: a_third_forbearance_and_a_premature_recapture_are_refused
        claim_type: violation_to_error
        grounds: ["validations[priority=41]", errors.ERR_FORBEARANCE_LIMIT_REACHED, errors.ERR_LIEN_BALANCE_OUTSTANDING, errors.ERR_ROFR_WINDOW_OPEN, entities.MortgageApplication.fields.forbearance_counseling_sessions, entities.MortgageApplication.fields.right_of_first_refusal_expires_on, "state_machines.MortgageApplication.lien_status.ACTIVE_to_FORBEARANCE", "state_machines.MortgageApplication.lien_status.TRANSFER_PENDING_to_RECAPTURED"]
        distinguishing_aspect: "Three refusals on the one lien endpoint, each with a different reason and each staged from a legal lien state so that no transition rule can pre-empt them: a third FORBEARANCE while lien_status is ACTIVE (counter already 2), a PAYOFF while 1950000 cents are still outstanding, and a RECAPTURE fifteen days into the thirty-day right of first refusal."
        setup_note: "Both the priority 41 wording (forbearance_counseling_sessions <= 1) and the §1.2 note (the third grant is refused) agree on this staging, and the RECAPTURE probe sits strictly inside the window so it fails under any reading of the comparator."
        test_recipe:
          setup:
