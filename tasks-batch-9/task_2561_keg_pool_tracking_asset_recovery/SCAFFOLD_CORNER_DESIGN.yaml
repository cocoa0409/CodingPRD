              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_va}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-02T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k2_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-03T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
          assert:
            - "both kegs read service_state == SERVICE_OK at import (exactly 730 days is not older than 730)"
            - "the first FILL returns HTTP 201 with dwell_days_closed == 1 and fill_charge_net_cents == 2200; Keg.${k1_id}.custody_state == FILLED"
            - "the second FILL returns HTTP 422 ERR_PRESSURE_TEST_OVERDUE: 2026-08-03 minus 2024-08-02 is 731 days"
            - "it is NOT ERR_KEG_NOT_FIT_FOR_FILL — Keg.${k2_id}.service_state is still the stored SERVICE_OK, because no sweep and no clock move rewrites that field"
            - "the refusal is inert: Keg.${k2_id}.custody_state stays ISSUED_TO_BREWER, fill_count 0, and FloatAgreement.${fa1_id}.billed_amount_cents stays 2200 with billed_fills_count 1"

      # ---- validation claim rows already owned by §1.8 instances ----
      - name: order_creation_state_rule_versus_fiscal_rule
        claim_type: Priority conflict
        grounds:
          - validations[priority=12]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: order_creation_agreement_state_beats_fiscal_credit_limit
          rationale: "That §1.8 instance posts one order that violates both the agreement-state rule and the credit-limit rule, asserts ERR_AGREEMENT_NOT_ACTIVE, then fixes the state and re-posts to expose ERR_CREDIT_LIMIT_EXCEEDED — both halves of the priority pair in one run."
      - name: fill_scan_safety_rule_versus_referential_rule
        claim_type: Priority conflict
        grounds:
          - validations[priority=20]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: fill_scan_safety_beats_referential_brand_mismatch
          rationale: "That §1.8 instance drives a SERVICE_DUE keg with a foreign brand code so priorities 20 and 27 are jointly violated, asserts the safety error, then repairs the certification to reveal ERR_BRAND_MISMATCH."
      - name: allocate_depends_on_the_pools_own_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - calculations.pool_posture
        excluded_because:
          difficulty_instance: order_allocate_blocked_by_frozen_pool_state
          rationale: "That §1.8 instance allocates successfully while the pool is OPEN and then, after the census drops the pool to FROZEN, re-runs the same allocate against a second order to get ERR_POOL_FROZEN — the valid and invalid sides of the cross-entity dependency."

  # ==========================================================================
  # ENDPOINTS — Table 5 endpoint-pattern rows and the side-effect audit
  # ==========================================================================
  - section: endpoints
    instances:
      - name: dwell_read_classifies_without_persisting_the_flag
        claim_type: Computed read
        grounds:
          - endpoints[GET /kegs/{keg_id}/dwell]
          - calculations.dwell_days
          - entities.Keg.fields.dwell_flag
        distinguishing_aspect: "At 37 open distributor-days the computed read returns dwell_flag APPROACHING (37 >= 36) while the STORED Keg.dwell_flag is still WITHIN_LIMIT, because only the replenishment sweep writes that column. It also reports both clocks and both constants for the current custody bucket, so a keg IN_TRADE reads limit 45 / approaching 36, not the brewer's 30 / 24."
        test_recipe:
          setup:
            - "Clock 2026-09-11T00:00:00Z; index 2026-07-01 at 480; brewer RDG; distributor High Plains; pool HB-50L with K-0001 and K-0002 (the latter at fill_count 5 to fix the ranking)."
            - "Agreement float_size_kegs 2 at 2200 activated effective 2026-08-01; K-0001 allocated, dispatched 2026-08-01T00:00:00Z, FILLed 2026-08-03T00:00:00Z and DISTRIBUTION-scanned 2026-08-05T00:00:00Z, so it sits IN_TRADE with both clocks rooted at 2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
