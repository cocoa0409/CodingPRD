    side_effects: []
  - method: POST
    path: "/enrichment/enrollments/{id}/cancel"
    description: "Cancel an enrollment; frees a seat (if ENROLLED) and promotes the next waitlisted row."
    roles: [Parent, StudioAdmin, FrontDeskStaff]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> CANCELLED"
      - "if was ENROLLED: ClassSession.enrolled_count -1, promote lowest-waitlist_seq row, ClassSession.version +1"
  - method: POST
    path: "/enrichment/enrollments/{id}/redeem-makeup"
    description: "Spend one AVAILABLE makeup credit to enroll the child into a target SCHEDULED session of the same level. Picks the credit with the earliest expires_at (created_at ASC tie-break)."
    roles: [Parent, StudioAdmin, FrontDeskStaff]
    code: 201
    input: [target_session_id, expected_session_version]
    output: Enrollment
    side_effects:
      - "selected MakeupCredit -> REDEEMED; membership.makeup_credit_balance -1 and version +1"
      - "new RECURRING Enrollment ENROLLED on target session; target ClassSession.enrolled_count +1 and version +1"

  # ---- FacilityBooking ----
  - method: POST
    path: "/enrichment/facility-bookings"
    description: "Book a room for a birthday party or open-gym add-on (validates room overlap with interval semantics). OCC on room version."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 201
    input: [room_id, family_id, booking_type, start_at, end_at, "head_count?", expected_room_version]
    output: FacilityBooking
    side_effects: ["FacilityBooking created CONFIRMED; Room.version +1"]
  - method: GET
    path: "/enrichment/facility-bookings"
    description: "List facility bookings, optionally filtered by family_id (FK reverse-reachability for FacilityBooking.family_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: ["family_id?"]
    output: FacilityBooking[]
    side_effects: []
  - method: GET
    path: "/enrichment/facility-bookings/{id}"
    description: "Fetch a facility booking."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: FacilityBooking
    side_effects: []
  - method: POST
    path: "/enrichment/facility-bookings/{id}/cancel"
    description: "Cancel a facility booking, releasing the room interval."
    roles: [Parent, StudioAdmin, FrontDeskStaff]
    code: 200
    input: []
    output: FacilityBooking
    side_effects: ["status -> CANCELLED; Room.version +1"]

  # ---- Invoice ----
  - method: GET
    path: "/enrichment/invoices/{id}"
    description: "Fetch an invoice with computed line totals."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/enrichment/invoices/{id}/pay"
    description: "Mark an OPEN invoice PAID (requires ACTIVE membership)."
    roles: [FrontDeskStaff, StudioAdmin, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID; version +1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or Parent acting on a family that is not their own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, bad enum, end_at <= start_at, capacity > room physical_capacity, birth_date in the future"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state (e.g., enroll into non-SCHEDULED session, hold a non-SCHEDULED session, cancel an already CANCELLED enrollment, pay a non-OPEN invoice)"
  - id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http: 422
    condition: "session program level_index not in instructor.certified_level_indices, or instructor INACTIVE at hold time"
  - id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "new session overlaps another of the same instructor once expanded by buffer_minutes on each side"
  - id: ERR_ROOM_SCHEDULE_CONFLICT
    http: 409
    condition: "session/booking strictly overlaps another non-CANCELLED session or BIRTHDAY_PARTY on the same room, or overlapping OPEN_GYM head_count sum exceeds physical_capacity"
  - id: ERR_AGE_BAND_MISMATCH
    http: 422
    condition: "child age_months at session.start_at outside [min_age_months, max_age_months) (exact max_age_months is ineligible)"
  - id: ERR_LEVEL_MISMATCH
    http: 422
    condition: "RECURRING enrollment/redemption where child.current_level != session.program.level_index"
  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 422
    condition: "RECURRING enrollment, redemption, or invoice pay against a non-ACTIVE membership"
  - id: ERR_SESSION_FULL
    http: 409
    condition: "TRIAL enrollment or makeup redemption when session.enrolled_count >= session.capacity"
  - id: ERR_PARTICIPATION_REQUIRED
    http: 422
    condition: "enroll into a participation_required program without an accompanying_adult"
  - id: ERR_NO_CREDIT_AVAILABLE
    http: 409
    condition: "redeem-makeup when makeup_credit_balance == 0 (no AVAILABLE non-expired credit)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_session_version / expected_room_version does not equal the live parent.version (OCC)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: StudioAdmin
    description: "Studio operator: manages programs, rooms, instructors, billing/renewal, and all scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrichment/programs"
      - "POST /enrichment/rooms"
      - "POST /enrichment/instructors"
      - "POST /enrichment/instructors/{id}/deactivate"
      - "POST /enrichment/_clock/set_current_utc"
    shared_operations:
      - "create families, children, memberships, sessions, enrollments, facility bookings"
      - "activate/renew memberships, hold/cancel sessions, pay invoices, advance children"
  - name: FrontDeskStaff
    description: "Front-desk operator: scheduling, enrollment, attendance, billing actions; cannot manage programs/rooms/instructors config."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrichment/memberships/{id}/activate (as staff for PENDING_PAYMENT)"
      - "POST /enrichment/memberships/{id}/renew"
      - "POST /enrichment/sessions"
      - "POST /enrichment/sessions/{id}/hold"
      - "POST /enrichment/sessions/{id}/cancel"
      - "POST /enrichment/children/{id}/advance"
    shared_operations:
      - "create families, children, memberships, enrollments, facility bookings"
      - "cancel enrollments/bookings, pay invoices, redeem makeup credits"
  - name: Parent
    description: "Account holder acting on their own family, children, memberships, enrollments, and bookings."
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /enrichment/memberships/{id}/freeze (own membership)"
    shared_operations:
      - "create own children/memberships/enrollments/facility bookings"
      - "cancel own enrollments/memberships/bookings, redeem own makeup credits, pay own invoices, read own resources"
