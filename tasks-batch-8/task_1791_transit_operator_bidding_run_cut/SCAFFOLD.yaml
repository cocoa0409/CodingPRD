scenario: "Transit Operator Bidding & Run-Cut Assignment (transit agency scheduling office): service schedule to run-cut construction, work rules (spread time/paid break) compliance, operator seniority bidding round & pick sequence, extra board sizing & absence coverage, overtime distribution & grievance risk, vacation/relief allocation, sign-up implementation & pay validation, service change adjustment mid-pick"
domain_name: "transit-operator-bidding-run-cut"
api_prefix: "/api"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: SignUpPeriod
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the pick, e.g. 'Fall 2026 Sign-Up'"
      - name: effective_start_date
        type: string
        source: input
        description: "ISO date the new run-cut takes service effect (YYYY-MM-DD)"
      - name: effective_end_date
        type: string
        source: input
        description: "ISO date the sign-up period ends; MUST be >= effective_start_date"
      - name: spread_limit_minutes
        type: integer
        source: input
        description: "Work-rule: max elapsed minutes from first report to final release for any run"
        constraints: "integer in [480, 900]"
      - name: paid_break_minutes
        type: integer
        source: input
        description: "Work-rule: minimum paid break minutes credited per run with spread >= 600"
        constraints: "integer in [0, 120]"
      - name: daily_ot_threshold_minutes
        type: integer
        source: input
        description: "Work-rule: paid minutes per day beyond which overtime rate applies"
        constraints: "integer in [420, 600]; default 480"
        default: 480
      - name: weekly_ot_threshold_minutes
        type: integer
        source: input
        description: "Work-rule: cumulative straight-time minutes per week beyond which weekly OT applies"
        constraints: "integer in [2100, 2700]; default 2400"
        default: 2400
      - name: extra_board_ratio_pct
        type: integer
        source: input
        description: "Extra-board sizing: board headcount as percent of posted run count"
        constraints: "integer in [5, 40]"
      - name: schedule_revision
        type: integer
        source: system
        description: "Current schedule revision number; starts at 1; bumped by mid-pick service change"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        constraints: "enum {DRAFT, RUNS_CUT, OPEN, PICKING, LOCKED, IMPLEMENTED, CANCELLED}"
      - name: picked_through_rank
        type: integer
        source: system
        description: "Highest operator seniority_rank whose pick has been adjudicated in the current PICKING round; 0 before picking starts"
        default: 0

  - name: Run
    parent: SignUpPeriod
    common_fields: true
    fields:
      - name: sign_up_period_id
        type: string
        source: input
        description: "FK -> SignUpPeriod.id; owning sign-up"
      - name: schedule_revision
        type: integer
        source: system
        description: "SignUpPeriod.schedule_revision under which this run was cut"
      - name: run_number
        type: string
        source: input
        description: "Roster identifier, unique within (sign_up_period_id, schedule_revision)"
      - name: service_date
        type: string
        source: input
        description: "ISO date this run operates (YYYY-MM-DD)"
      - name: pieces
        type: array
        source: input
        description: "Ordered work pieces; each {report_minutes, release_minutes, platform_minutes} as minutes-after-midnight; release_minutes > report_minutes within a piece; pieces non-overlapping and ascending"
      - name: spread_minutes
        type: integer
        source: computed
        description: "Final piece release_minutes minus first piece report_minutes across pieces[]"
      - name: platform_minutes
        type: integer
        source: computed
        description: "Sum of piece platform_minutes across pieces[]"
      - name: paid_minutes
        type: integer
        source: computed
        description: "platform_minutes + paid break credit per work-rule (paid_break_minutes when spread_minutes >= 600, else 0)"
      - name: status
        type: enum
        source: system
        description: "Cut lifecycle"
        constraints: "enum {CUT, VALIDATED, POSTED, AWARDED, EXTRA_BOARD_HELD, WITHDRAWN}"
      - name: awarded_operator_id
        type: string
        source: system
        description: "FK -> Operator.id; set on award; null until AWARDED"
        constraints: "nullable"

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: employee_number
        type: string
        source: input
        description: "Agency-issued employee number; unique"
      - name: full_name
        type: string
        source: input
        description: "Operator legal name"
      - name: hire_date
        type: string
        source: input
        description: "ISO date of hire; seniority derived from this"
      - name: seniority_rank
        type: integer
        source: computed
        description: "1 = most senior; computed as dense rank over Operators with status ACTIVE ordered by hire_date ASC, tie-break employee_number ASC"
      - name: status
        type: enum
        source: system
        description: "Employment status"
        constraints: "enum {ACTIVE, SUSPENDED, EXTRA_BOARD, RETIRED}"
      - name: board_position
        type: integer
        source: system
        description: "Rotation position on the extra board for operators with status EXTRA_BOARD; lower = sooner to be called; null otherwise"
        constraints: "nullable"
      - name: weekly_ot_minutes_accum
        type: integer
        source: system
        description: "Running total of overtime minutes paid to this operator in the current sign-up week; reset by week-rollover"
        default: 0
      - name: vacation_hours_balance
        type: integer
        source: system
        description: "Remaining accrued vacation hours available for bidding"
        default: 0

  - name: BidEntry
    parent: SignUpPeriod
    common_fields: true
    fields:
      - name: sign_up_period_id
        type: string
        source: input
        description: "FK -> SignUpPeriod.id; pick this bid belongs to"
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; bidding operator"
      - name: run_id
        type: string
        source: input
        description: "FK -> Run.id; desired run"
      - name: preference_rank
        type: integer
        source: input
        description: "Operator's own ranking of this run within their bid sheet; 1 = most preferred"
        constraints: "integer >= 1; unique per (sign_up_period_id, operator_id)"
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle"
        constraints: "enum {SUBMITTED, AWARDED, PASSED, WITHDRAWN}"

  - name: ExtraBoardSlot
    parent: SignUpPeriod
    common_fields: true
    fields:
      - name: sign_up_period_id
        type: string
        source: input
        description: "FK -> SignUpPeriod.id"
      - name: operator_id
        type: string
        source: system
        description: "FK -> Operator.id; operator holding this board slot; null until assigned"
        constraints: "nullable"
      - name: slot_index
        type: integer
        source: system
        description: "1-based board position; call-out order ascending"
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle"
        constraints: "enum {OPEN, FILLED, EXHAUSTED}"

  - name: DailyAssignment
    parent: SignUpPeriod
    common_fields: true
    fields:
      - name: sign_up_period_id
        type: string
        source: system
        description: "FK -> SignUpPeriod.id"
      - name: operator_id
        type: string
        source: system
        description: "FK -> Operator.id; assigned operator"
      - name: run_id
        type: string
        source: system
        description: "FK -> Run.id; run being worked; null for board stand-by assignments"
        constraints: "nullable"
      - name: service_date
        type: string
        source: system
        description: "ISO date of the assignment"
      - name: source
        type: enum
        source: system
        description: "How the assignment arose"
        constraints: "enum {BID_AWARD, EXTRA_BOARD_FILL, OVERTIME_OFFER}"
      - name: scheduled_minutes
        type: integer
        source: system
        description: "Run.paid_minutes at the moment of assignment; snapshot"
      - name: actual_platform_minutes
        type: integer
        source: input
        description: "Reported actual platform minutes worked; set by timekeeping close-out"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Work lifecycle"
        constraints: "enum {SCHEDULED, WORKED, NO_SHOW, CANCELLED}"
      - name: pay_status
        type: enum
        source: system
        description: "Parallel pay-validation dimension, independent of work status"
        constraints: "enum {PROVISIONAL, FINALIZED, DISPUTED}"

  - name: AbsenceCase
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; absent operator"
      - name: absence_date
        type: string
        source: input
        description: "ISO date of absence"
      - name: reason_code
        type: enum
        source: input
        description: "Categorized reason"
        constraints: "enum {SICK, PERSONAL, VACATION, UNEXCUSED}"
      - name: status
        type: enum
        source: system
        description: "Coverage lifecycle"
        constraints: "enum {REPORTED, COVERED, UNCOVERED, CLOSED}"
      - name: covering_assignment_id
        type: string
        source: system
        description: "FK -> DailyAssignment.id; fill assignment created to cover; null until covered"
        constraints: "nullable"

  - name: PayRecord
    parent: DailyAssignment
    common_fields: true
    fields:
      - name: daily_assignment_id
        type: string
        source: system
        description: "FK -> DailyAssignment.id; the assignment this record prices"
      - name: straight_minutes
        type: integer
        source: computed
        description: "Minutes paid at straight rate after applying daily and weekly OT thresholds"
      - name: overtime_minutes
        type: integer
        source: computed
        description: "Minutes paid at overtime rate"
      - name: gross_cents
        type: integer
        source: computed
        description: "straight_minutes*base_rate_cents_per_min + overtime_minutes*base*1.5, rounded half-up to whole cents at the final sum only"
      - name: variant
        type: enum
        source: system
        description: "PROVISIONAL priced from scheduled_minutes; FINAL priced from actual_platform_minutes"
        constraints: "enum {PROVISIONAL, FINAL}"

  - name: VacationSlot
    parent: SignUpPeriod
    common_fields: true
    fields:
      - name: sign_up_period_id
        type: string
        source: input
        description: "FK -> SignUpPeriod.id"
      - name: week_start_date
        type: string
        source: input
        description: "ISO Monday date of the vacation week"
      - name: capacity
        type: integer
        source: input
        description: "Max operators who may hold this week"
        constraints: "integer >= 1"
      - name: allocated_count
        type: integer
        source: system
        description: "Current number of operators allocated to this slot"
        default: 0
      - name: operator_id
        type: string
        source: system
        description: "FK -> Operator.id; set when this row represents a specific allocation grant"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle"
        constraints: "enum {OPEN, FULLY_ALLOCATED, CLOSED}"

  - name: GrievanceCase
    parent: null
    common_fields: true
    fields:
      - name: filed_by_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; grieving operator"
      - name: sign_up_period_id
        type: string
        source: input
        description: "FK -> SignUpPeriod.id"
      - name: category
        type: enum
        source: input
        description: "Grievance category"
        constraints: "enum {OT_EQUALIZATION, SENIORITY_BYPASS, WORK_RULE_SPREAD, PAY_VALIDATION}"
      - name: detail
        type: string
        source: input
        description: "Free-text description of the alleged violation"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle"
        constraints: "enum {FILED, UPHELD, DISMISSED, WITHDRAWN}"
      - name: remedy_minutes
        type: integer
        source: system
        description: "OT make-whole minutes credited when UPHELD on OT_EQUALIZATION"
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: SignUpPeriod
    initial_state: DRAFT
    terminal_states: [IMPLEMENTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RUNS_CUT
        trigger: "POST /api/sign-up-periods/{id}/cut-runs"
        actor: SchedulingOfficer
        preconditions:
          - "at least one Run exists for sign_up_period_id with schedule_revision == SignUpPeriod.schedule_revision"
        side_effects:
          - "each Run with status CUT and spread_minutes <= spread_limit_minutes transitions to VALIDATED"
          - "each Run with spread_minutes > spread_limit_minutes transitions to WITHDRAWN"
      - from: RUNS_CUT
        to: OPEN
        trigger: "POST /api/sign-up-periods/{id}/post-runs"
        actor: SchedulingOfficer
        preconditions:
          - "at least one Run in status VALIDATED"
        side_effects:
          - "all Runs in VALIDATED transition to POSTED"
          - "creates ExtraBoardSlot rows: count = ceil(posted_run_count * extra_board_ratio_pct / 100), slot_index 1..N, status OPEN"
      - from: OPEN
        to: PICKING
        trigger: "POST /api/sign-up-periods/{id}/open-picking"
        actor: SchedulingOfficer
        preconditions:
          - "no BidEntry in status AWARDED for this sign_up_period_id"
        side_effects:
          - "picked_through_rank set to 0"
      - from: PICKING
        to: PICKING
        trigger: "POST /api/sign-up-periods/{id}/adjudicate-next"
        actor: SchedulingOfficer
        preconditions:
          - "exists at least one Operator with status ACTIVE and seniority_rank > picked_through_rank having at least one BidEntry in SUBMITTED"
        side_effects:
          - "selects the eligible operator with smallest seniority_rank > picked_through_rank (tie-break impossible: rank unique)"
          - "awards that operator's SUBMITTED BidEntry with smallest preference_rank whose Run is still POSTED; that BidEntry -> AWARDED, its Run -> AWARDED with awarded_operator_id set"
          - "all other SUBMITTED BidEntry rows of that operator -> PASSED"
          - "if none of the operator's SUBMITTED bids reference a POSTED run, all -> PASSED and operator status -> EXTRA_BOARD with board_position = lowest OPEN ExtraBoardSlot.slot_index; that slot -> FILLED with operator_id set"
          - "picked_through_rank updated to the adjudicated operator's seniority_rank"
      - from: PICKING
        to: LOCKED
        trigger: "POST /api/sign-up-periods/{id}/lock"
        actor: SchedulingOfficer
        preconditions:
          - "every Operator with status ACTIVE holding >= 1 SUBMITTED BidEntry has seniority_rank <= picked_through_rank"
          - "every Run in POSTED either moves to AWARDED or is explicitly released to the board"
        side_effects:
          - "Runs still POSTED transition to EXTRA_BOARD_HELD"
          - "OPEN ExtraBoardSlots not FILLED transition to EXHAUSTED"
      - from: LOCKED
        to: IMPLEMENTED
        trigger: "POST /api/sign-up-periods/{id}/implement"
        actor: SchedulingOfficer
        preconditions:
          - "all Runs are in AWARDED, EXTRA_BOARD_HELD, or WITHDRAWN"
        side_effects:
          - "for every AWARDED Run, create DailyAssignment rows (source BID_AWARD, status SCHEDULED, pay_status PROVISIONAL) for each service date of the run within [effective_start_date, effective_end_date]"
          - "for every FILLED ExtraBoardSlot, create stand-by DailyAssignment (run_id null, source EXTRA_BOARD_FILL, status SCHEDULED)"
      - from: PICKING
        to: RUNS_CUT
        trigger: "POST /api/sign-up-periods/{id}/schedule-revisions (mid-pick service change)"
        actor: SchedulingOfficer
        preconditions:
          - "payload new_runs non-empty"
        side_effects:
          - "schedule_revision incremented by 1"
          - "Runs of prior revision still POSTED transition to WITHDRAWN; AWARDED runs are untouched"
          - "BidEntry rows in SUBMITTED referencing a WITHDRAWN run transition to WITHDRAWN"
          - "new Runs created in CUT under the new schedule_revision; then cut-runs validation reapplies (VALIDATED/WITHDRAWN by spread rule) and VALIDATED -> POSTED"
          - "picked_through_rank reset to 0 (pick restarts with the augmented run pool; prior AWARDED bids stay awarded)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/sign-up-periods/{id}/cancel"
        actor: SchedulingOfficer
        preconditions: []
        side_effects:
          - "all Runs of this period in CUT or VALIDATED transition to WITHDRAWN"

  - entity: Run
    initial_state: CUT
    terminal_states: [AWARDED, WITHDRAWN]
    transitions:
      - from: CUT
        to: VALIDATED
        trigger: "system during SignUpPeriod cut-runs"
        actor: system
        preconditions:
          - "spread_minutes <= SignUpPeriod.spread_limit_minutes"
        side_effects: []
      - from: CUT
        to: WITHDRAWN
        trigger: "system during SignUpPeriod cut-runs"
        actor: system
        preconditions:
          - "spread_minutes > SignUpPeriod.spread_limit_minutes"
        side_effects: []
      - from: VALIDATED
        to: POSTED
        trigger: "system during SignUpPeriod post-runs or schedule-revisions"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: AWARDED
        trigger: "system during adjudicate-next"
        actor: system
        preconditions:
          - "awarded operator's BidEntry preference chain reached this run"
        side_effects:
          - "awarded_operator_id set"
      - from: POSTED
        to: EXTRA_BOARD_HELD
        trigger: "system during SignUpPeriod lock"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: WITHDRAWN
        trigger: "system during SignUpPeriod schedule-revisions"
        actor: system
        preconditions: []
        side_effects:
          - "SUBMITTED BidEntry rows referencing this run transition to WITHDRAWN"
      - from: EXTRA_BOARD_HELD
        to: AWARDED
        trigger: "system during absence coverage (board run assignment)"
        actor: system
        preconditions: []
        side_effects:
          - "awarded_operator_id set to covering operator"

  - entity: Operator
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: EXTRA_BOARD
        trigger: "system during adjudicate-next when all bids PASS"
        actor: system
        preconditions: []
        side_effects:
          - "board_position set from allocated ExtraBoardSlot.slot_index"
      - from: EXTRA_BOARD
        to: ACTIVE
        trigger: "POST /api/operators/{id}/promote"
        actor: SchedulingOfficer
        preconditions:
          - "operator has an awarded Run in the current sign-up"
        side_effects:
          - "board_position cleared to null"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/operators/{id}/suspend"
        actor: SchedulingOfficer
        preconditions: []
        side_effects:
          - "SUBMITTED BidEntry rows of this operator in any OPEN or PICKING sign-up transition to WITHDRAWN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/operators/{id}/reinstate"
        actor: SchedulingOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/operators/{id}/retire"
        actor: SchedulingOfficer
        preconditions:
          - "no DailyAssignment in SCHEDULED status for this operator"
        side_effects: []

  - entity: BidEntry
    initial_state: SUBMITTED
    terminal_states: [AWARDED, PASSED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "system during adjudicate-next"
        actor: system
        preconditions:
          - "referenced Run in POSTED"
          - "this entry has smallest preference_rank among operator's SUBMITTED entries referencing POSTED runs"
        side_effects:
          - "referenced Run transitions to AWARDED"
      - from: SUBMITTED
        to: PASSED
        trigger: "system during adjudicate-next"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/bid-entries/{id}/withdraw OR system cascade (operator suspend, run withdrawn)"
        actor: Operator
        preconditions:
          - "owning SignUpPeriod.status in {OPEN, PICKING}"
        side_effects: []

  - entity: ExtraBoardSlot
    initial_state: OPEN
    terminal_states: [EXHAUSTED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system during adjudicate-next (operator demoted to board)"
        actor: system
        preconditions: []
        side_effects:
          - "operator_id set; Operator.board_position = slot_index"
      - from: FILLED
        to: EXHAUSTED
        trigger: "system at SignUpPeriod implement"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXHAUSTED
        trigger: "system during SignUpPeriod lock"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DailyAssignment
    initial_state: SCHEDULED
    terminal_states: [WORKED, NO_SHOW, CANCELLED]
    note: "Parallel state dimensions: status (work lifecycle) and pay_status (pay validation) evolve independently"
    transitions:
      - from: SCHEDULED
        to: WORKED
        trigger: "POST /api/daily-assignments/{id}/close-out"
        actor: PayrollClerk
        preconditions:
          - "actual_platform_minutes present in payload"
        side_effects:
          - "PayRecord FINAL created priced on actual_platform_minutes; Operator.weekly_ot_minutes_accum incremented by FINAL overtime_minutes"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/daily-assignments/{id}/mark-no-show"
        actor: SchedulingOfficer
        preconditions: []
        side_effects:
          - "if run_id non-null, absence coverage cascade may trigger via POST /api/absence-cases"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system when owning Run is WITHDRAWN by schedule revision"
        actor: system
        preconditions: []
        side_effects:
          - "PROVISIONAL PayRecord for this assignment deleted"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "pay_status: PROVISIONAL -> FINALIZED via POST /api/daily-assignments/{id}/finalize-pay"
        actor: PayrollClerk
        preconditions:
          - "status == WORKED"
          - "a FINAL PayRecord exists for this assignment"
        side_effects:
          - "pay_status set FINALIZED; delta between FINAL and PROVISIONAL gross_cents booked to operator's next week accumulator"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "pay_status: PROVISIONAL|FINALIZED -> DISPUTED via POST /api/daily-assignments/{id}/dispute-pay"
        actor: Operator
        preconditions:
          - "disputing operator is the assigned operator"
        side_effects:
          - "pay_status set DISPUTED"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "pay_status: DISPUTED -> FINALIZED via POST /api/daily-assignments/{id}/finalize-pay"
        actor: PayrollClerk
        preconditions:
          - "a FINAL PayRecord exists"
        side_effects:
          - "pay_status set FINALIZED"

  - entity: AbsenceCase
    initial_state: REPORTED
    terminal_states: [COVERED, UNCOVERED, CLOSED]
    transitions:
      - from: REPORTED
        to: COVERED
        trigger: "POST /api/absence-cases/{id}/cover"
        actor: SchedulingOfficer
        preconditions:
          - "absent operator has a SCHEDULED DailyAssignment on absence_date with run_id non-null"
          - "at least one EXTRA_BOARD Operator exists, OR overtime offer path taken"
        side_effects:
          - "select covering operator: eligibility = Operators with status EXTRA_BOARD (board path) sorted by board_position ASC tie-break hire_date ASC; if board empty and payload allow_overtime=true, eligibility = Operators with status ACTIVE sorted by weekly_ot_minutes_accum ASC tie-break seniority_rank ASC"
          - "create DailyAssignment for covering operator (source EXTRA_BOARD_FILL or OVERTIME_OFFER, same run_id and service_date, status SCHEDULED)"
          - "covering_assignment_id set on the AbsenceCase"
          - "if board path used, covering operator's ExtraBoardSlot -> EXHAUSTED and Operator.status -> ACTIVE? no: board_position stays; slot remains FILLED until implement"
          - "absent operator's original DailyAssignment transitions to NO_SHOW"
      - from: REPORTED
        to: UNCOVERED
        trigger: "POST /api/absence-cases/{id}/declare-uncovered"
        actor: SchedulingOfficer
        preconditions:
          - "no eligible covering operator exists (empty board and allow_overtime exhausted)"
        side_effects:
          - "absent operator's DailyAssignment transitions to CANCELLED"
      - from: COVERED
        to: CLOSED
        trigger: "POST /api/absence-cases/{id}/close"
        actor: SchedulingOfficer
        preconditions:
          - "covering assignment in WORKED or CANCELLED"
        side_effects: []
      - from: UNCOVERED
        to: CLOSED
        trigger: "POST /api/absence-cases/{id}/close"
        actor: SchedulingOfficer
        preconditions: []
        side_effects: []

  - entity: VacationSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULLY_ALLOCATED
        trigger: "system when allocated_count == capacity after a grant"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/vacation-slots/{id}/close"
        actor: SchedulingOfficer
        preconditions: []
        side_effects: []
      - from: FULLY_ALLOCATED
        to: CLOSED
        trigger: "POST /api/vacation-slots/{id}/close"
        actor: SchedulingOfficer
        preconditions: []
        side_effects: []

  - entity: GrievanceCase
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /api/grievance-cases/{id}/uphold"
        actor: UnionRep
        preconditions:
          - "category OT_EQUALIZATION requires evidence: exists an ACTIVE operator with strictly lower weekly_ot_minutes_accum than the assigned OT operator at time of the OT assignment"
        side_effects:
          - "remedy_minutes credited to filed_by_operator_id's weekly_ot_minutes_accum (compensating make-whole)"
      - from: FILED
        to: DISMISSED
        trigger: "POST /api/grievance-cases/{id}/dismiss"
        actor: UnionRep
        preconditions: []
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/grievance-cases/{id}/withdraw"
        actor: Operator
        preconditions:
          - "acting operator is filed_by_operator_id"
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bid-submit-stale-period
    parent_entity: SignUpPeriod
    write_endpoint: "POST /api/sign-up-periods/{id}/bid-entries"
    occ_field: "expected_sign_up_period_version"
    description: |
      Submitting a BidEntry against a SignUpPeriod whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a schedule-revision has just legitimately withdrawn previously
      POSTED runs and the client's view of the biddable run pool is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cover-absence-stale-case
    parent_entity: AbsenceCase
    write_endpoint: "POST /api/absence-cases/{id}/cover"
    occ_field: "expected_absence_case_version"
    description: |
      Covering an AbsenceCase whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      dispatcher has just legitimately covered the same case and the current
      dispatcher's view of the board is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: run_paid_minutes
    trigger: "on Run creation and whenever pieces[] changes"
    algorithm: aggregation
    formula: |
      spread_minutes = max(piece.release_minutes) - min(piece.report_minutes)
      platform_minutes = sum(piece.platform_minutes)
      break_credit = paid_break_minutes if spread_minutes >= 600 else 0
      paid_minutes = platform_minutes + break_credit
    input_set: "all pieces[] of the Run regardless of Run.status"
    constants:
      SPREAD_BREAK_THRESHOLD_MINUTES: 600
    precision: "integer minutes; no rounding"
    variants: []

  - name: extra_board_size
    trigger: "at SignUpPeriod post-runs"
    algorithm: threshold
    formula: |
      posted = count(Run where sign_up_period_id = this and status == POSTED)
      board_slots = ceil(posted * extra_board_ratio_pct / 100)
    input_set: "Runs in POSTED status only; CUT/VALIDATED/WITHDRAWN excluded"
    constants: {}
    precision: "integer; ceil toward +inf on the product before division"
    variants:
      - name: ratio_floor
        when: "extra_board_ratio_pct * posted < 100 but posted > 0"
        difference: "ceil yields 1 minimum slot whenever at least one run is posted"

  - name: seniority_rank
    trigger: "on Operator create, retire, suspend, reinstate; recomputed over the full roster"
    algorithm: chronological
    formula: |
      eligible = Operators with status in {ACTIVE, EXTRA_BOARD, SUSPENDED}
      order by hire_date ASC, tie-break employee_number ASC
      seniority_rank = 1-based position in that order
    input_set: "Operators excluding status RETIRED"
    constants: {}
    precision: "integer"
    variants: []

  - name: pay_price
    trigger: "PROVISIONAL at DailyAssignment creation; FINAL at close-out"
    algorithm: tiered_pricing
    formula: |
      # evaluation order pinned: minutes basis -> daily OT split -> weekly OT split -> price
      basis = (variant == PROVISIONAL) ? scheduled_minutes : actual_platform_minutes
      daily_ot = max(0, basis - daily_ot_threshold_minutes)
      straight_after_daily = basis - daily_ot
      weekly_remaining = max(0, weekly_ot_threshold_minutes - weekly_straight_minutes_prior_this_week)
      weekly_ot_extra = max(0, straight_after_daily - weekly_remaining)
      straight_minutes = straight_after_daily - weekly_ot_extra
      overtime_minutes = daily_ot + weekly_ot_extra
      gross_cents = round_half_up(straight_minutes * rate_cents_per_min
                                  + overtime_minutes * rate_cents_per_min * 1.5)
    input_set: "single DailyAssignment; weekly_straight_minutes_prior_this_week = sum of straight_minutes over this operator's FINAL PayRecords with service_date in the same ISO week, computed before this record"
    constants:
      OT_MULTIPLIER: 1.5
      DEFAULT_RATE_CENTS_PER_MIN: 50
    precision: "gross_cents rounded half-up to whole cents at the final sum only; minute splits are integers, no intermediate rounding"
    variants:
      - name: provisional
        when: "assignment SCHEDULED; priced at creation"
        difference: "basis = scheduled_minutes; weekly threshold uses prior FINAL records only"
      - name: final
        when: "close-out posted with actual_platform_minutes"
        difference: "basis = actual_platform_minutes; replaces the provisional record's numbers for the same assignment"

  - name: ot_equalization_pick
    trigger: "at AbsenceCase cover with allow_overtime=true"
    algorithm: weighted_scoring
    formula: |
      candidates = Operators with status == ACTIVE
      rank key = weekly_ot_minutes_accum ASC
      tie-break = seniority_rank ASC
      select first; if candidates empty -> ERR_NO_COVER_AVAILABLE
    input_set: "Operators with status ACTIVE only; EXTRA_BOARD and SUSPENDED excluded"
    constants: {}
    precision: "integer minutes"
    variants: []

  - name: vacation_allocation_order
    trigger: "at POST /api/vacation-slots/{id}/grant"
    algorithm: waterfall_allocation
    formula: |
      grant only while allocated_count < capacity
      on competing grant requests adjudicated in request order, capacity fills first-come
      operator vacation_hours_balance must be >= 40 at grant; decremented by 40 on grant
    input_set: "single VacationSlot; Operator.vacation_hours_balance"
    constants:
      VACATION_WEEK_HOURS: 40
    precision: "integer"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "body-referenced FK resources exist (run_id, operator_id, sign_up_period_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs"
  - priority: 5
    category: state
    check: "target resource in a state that permits the operation (e.g., bid only while sign-up OPEN/PICKING; close-out only from SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_constraint
    check: "pieces[] non-overlapping ascending intervals with release > report within each piece"
    error_id: ERR_INVALID_RUN_PIECES
    http_status: 422
    applies_to: "POST /api/sign-up-periods/{id}/runs, POST /api/sign-up-periods/{id}/schedule-revisions"
  - priority: 7
    category: business_constraint
    check: "run_number unique within (sign_up_period_id, schedule_revision)"
    error_id: ERR_DUPLICATE_RUN_NUMBER
    http_status: 409
    applies_to: "POST /api/sign-up-periods/{id}/runs"
  - priority: 8
    category: business_constraint
    check: "preference_rank unique per (sign_up_period_id, operator_id) among SUBMITTED bids"
    error_id: ERR_DUPLICATE_PREFERENCE
    http_status: 409
    applies_to: "POST /api/sign-up-periods/{id}/bid-entries"
  - priority: 9
    category: business_temporal
    check: "Run.service_date within [SignUpPeriod.effective_start_date, effective_end_date]"
    error_id: ERR_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /api/sign-up-periods/{id}/runs"
  - priority: 10
    category: business_temporal
    check: "AbsenceCase.absence_date within the referenced sign-up window of the operator's affected assignment"
    error_id: ERR_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /api/absence-cases"
  - priority: 11
    category: business_referential
    check: "BidEntry.run_id references a Run belonging to the same sign_up_period_id and in POSTED status at adjudication; submission allowed while OPEN/PICKING regardless of later withdrawal"
    error_id: ERR_RUN_NOT_BIDDABLE
    http_status: 422
    applies_to: "POST /api/sign-up-periods/{id}/bid-entries"
  - priority: 12
    category: business_referential
    check: "VacationSlot grant requires operator vacation_hours_balance >= 40"
    error_id: ERR_INSUFFICIENT_VACATION_BALANCE
    http_status: 422
    applies_to: "POST /api/vacation-slots/{id}/grant"
  - priority: 13
    category: business_fiscal
    check: "VacationSlot grant requires allocated_count < capacity (slot not FULLY_ALLOCATED)"
    error_id: ERR_VACATION_SLOT_FULL
    http_status: 409
    applies_to: "POST /api/vacation-slots/{id}/grant"
  - priority: 14
    category: business_safety
    check: "Run spread_minutes must be <= spread_limit_minutes to reach VALIDATED; over-spread runs are auto-WITHDRAWN at cut-runs (not user-rejectable at creation)"
    error_id: ERR_SPREAD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/sign-up-periods/{id}/runs with query flag strict=true"
  - priority: 15
    category: business_safety
    check: "close-out actual_platform_minutes must be > 0 and <= 960"
    error_id: ERR_INVALID_ACTUAL_MINUTES
    http_status: 422
    applies_to: "POST /api/daily-assignments/{id}/close-out"
  - priority: 16
    category: business_constraint
    check: "OCC expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/sign-up-periods/{id}/bid-entries, POST /api/absence-cases/{id}/cover"

