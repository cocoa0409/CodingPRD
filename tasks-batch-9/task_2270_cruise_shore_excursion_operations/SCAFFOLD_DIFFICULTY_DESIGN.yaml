        distinguishing_aspect: |
          Metric: the single round_half_up applied to the weighted audit score against
          SUSPENSION_SCORE_FLOOR 60, exercised on POST /shore-excursions/operators/{operatorId}/safety-audits.
          The exact weighted value is 59.6, which rounds to exactly 60 and therefore does NOT suspend;
          rounding before the critical-finding penalty, or truncating instead of rounding half up, would
          produce 59 and wrongly start the suspension cascade.
