      - name: repair_complete_accrues_downtime_days_into_the_invoice
        claim_type: conditional_action
        grounds:
          - endpoints[POST /facility-assets/{id}/service-events]
          - calculations.equipment_downtime_credit
          - calculations.monthly_invoice_amounts
          - constants.DOWNTIME_GRACE_DAYS
        distinguishing_aspect: |
          Downtime days accrue only on REPAIR_COMPLETE (the action is conditional
          on the asset being OUT_OF_SERVICE), and the grace period is subtracted
          per asset: 2026-08-05 to 2026-08-11 is 6 days, so (6 - 3) * 1200 =
          3600 cents of credit. The invoice then computes base 10000 (labor 5483 +
          direct supply 4517) -> markup 1200 -> gross 11200 -> no volume credit
          -> net 7600. Crediting the ungraced 6 days (7200) or applying the
          downtime credit before the markup gives a different net.
