      - name: loan_revisits_in_review_after_each_cure_cycle
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: loan_suspense_cycle_revisits_in_review_twice
          rationale: |
            The Loan purchase_status cycle IN_REVIEW -> SUSPENDED -> IN_REVIEW
            and its review_cycle_count increments are already driven twice over
            the same loan by the §1.8 cyclic-machine instance, which also pins
            that only the LAST open item leaving OPEN fires the return hop.

      - name: seller_approval_and_delivery_dimensions_move_independently
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: seller_delivery_standing_cycles_while_approval_status_pinned
          rationale: |
            The parallel-dimension claim (delivery_standing cycling
            GOOD_STANDING -> WATCH -> SUSPENDED -> GOOD_STANDING while
            approval_status stays pinned at APPROVED) is exactly the §1.8
            two-dimension instance.

      - name: settlement_cascade_reaches_advice_loan_commitment_seller_and_escrow
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: advice_settlement_cascades_advice_loan_commitment_seller_escrow
          rationale: |
            The five-entity transitive cascade fired by one settle call is the
            subject of the §1.8 cascade instance, including the EscrowTransfer
            created only for a RELEASED election.

      - name: loan_rejection_compensates_the_commitment_allocation
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: loan_rejection_restores_commitment_notional_identity
          rationale: |
            The compensating hop (allocated down, available back up, commitment
            status unchanged, conserved identity restored) is asserted by the
            §1.8 compensation instance on the same endpoints.

  # =========================================================================
  # 3. Calculations (§1.3)
  # =========================================================================
  - section: calculations
    instances:
      - name: commitment_price_clamps_at_the_ceiling_and_the_floor_constants
        claim_type: constants_applied
        grounds:
          - calculations.commitment_price_pct.constants.PRICE_CEILING_PCT
          - calculations.commitment_price_pct.constants.PRICE_FLOOR_PCT
          - calculations.commitment_price_pct.precision
        distinguishing_aspect: |
          Both clamps bite on real inputs, and the clamp is applied BEFORE the
          3-decimal rounding: base 103.900 with a +100 bps LLPA, a 15-day lock
          (0 bps) and the MANDATORY spread (+25) computes 105.150 and is stored
          104.000, while base 98.100 with a -300 bps LLPA, a 60-day lock (-40)
          and the BEST_EFFORTS spread (-35) computes 94.350 and is stored
          98.000. llpa_bps_applied still records the raw +100 / -300, so the
          clamp is visible as a price-only effect.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1} (STANDARD, GOOD_STANDING, limit 3000000000)"
            - "product CLAMPHI base_price_pct 103.900 with LLPA row +100 bps; product CLAMPLO base_price_pct 98.100 with LLPA row -300 bps"
