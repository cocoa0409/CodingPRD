            - { call: "POST /api/faces", payload: { face_code: "F-NYC-002", structure_code: "ST-002", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f2: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${f2}", permit_number: "P-002", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "GET /api/faces/${f2}", payload: {}, as: SalesPlanner, captures: { f2_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 1900000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { flA: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f2_v}" }, as: SalesPlanner, captures: { flB: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { cv: $.data.version } }
            - { call: "POST /api/flights/${flA}/confirm", payload: { expected_campaign_version: "${cv}" }, as: SalesPlanner }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv2: $.data.version } }
            - { call: "POST /api/flights/${flB}/confirm", payload: { expected_campaign_version: "${cv2}" }, as: SalesPlanner, captures: { err_credit: $.data.error_id } }
            - { call: "PUT /api/advertiser-accounts/${adv}", payload: { credit_limit_cents: 10000000 }, as: FinanceAnalyst }
            - { call: "POST /api/flights/${flB}/confirm", payload: { expected_campaign_version: "${cv2}" }, as: SalesPlanner }
            - { call: "PUT /api/advertiser-accounts/${adv}", payload: { credit_limit_cents: 1950000 }, as: FinanceAnalyst }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv3: $.data.version } }
          trigger:
            - { call: "POST /api/flights/${flB}/confirm", payload: { expected_campaign_version: "${cv3}" }, as: SalesPlanner, captures: { err2: $.data.error_id } }
          assert:
            - "First confirm of B: error_id == ERR_CREDIT_LIMIT_EXCEEDED (1150000 + 800000 = 1950000 > 1900000)"
            - "Second confirm of B (after raise): succeeds, Flight.${flB}.status == BOOKED"
            - "Third confirm of B: error_id == ERR_INVALID_STATE — state precondition (P5, flight already BOOKED) beats the fiscal failure (P14: 1950000 + 800000 > limit 1950000) that the same call would also trigger"

  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_equality_boundary_on_confirm
        grounds:
          - validations[priority=14]
          - entities.AdvertiserAccount.fields.credit_limit_cents
        distinguishing_aspect: |
          Metric = money (exposure_cents vs credit_limit_cents); endpoint =
          POST /api/flights/{id}/confirm. Boundary is >=-style inverted: exposure EQUAL
          to the limit is allowed, one cent over is rejected.
        test_recipe:
          setup:
            - "Static faces F1 (illuminated, 300000), F2 (50000), F3 (50000), each with permit to 2026-12-31; PUBLISHED static card"
            - "Advertiser credit_limit 1950000; campaign APPROVED with three HELD flights 2026-08-10..2026-09-06: A on F1 (net 1150000), B on F2 (net 800000), C on F3 (net 800000)"
            - "A confirmed (exposure 1150000)"
          setup_api_calls:
