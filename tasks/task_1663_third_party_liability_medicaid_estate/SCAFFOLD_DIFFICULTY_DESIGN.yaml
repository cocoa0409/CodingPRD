# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Third-Party Liability & Medicaid Estate Recovery
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_recovery_subrogation_vs_reimbursement
        grounds:
          - calculations.settlement_recovery_amount
          - entities.Member.fields.recovery_approach
          - entities.Settlement.fields.state_recovery_cents
        distinguishing_aspect: |
          Same offer inputs (gross 1000000, fee 0.25, costs 100000, lien outstanding
          200000) produce state_recovery_cents == 200000 under REIMBURSEMENT (CA member)
          but 150000 under SUBROGATION (MT member) — two valid algorithms on the
          Settlement/TplCase domain keyed off Member.state_code.
        test_recipe:
          setup:
            - "Two members, CA and MT; each with an ATTORNEY_NOTIFIED case (injury 2026-01-01), one expense claim of 200000, and a filed lien of 200000"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CA-1", full_name: "Ann Reim", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_ca: $.data.id } }
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-MT-1", full_name: "Bob Sub", state_code: "MT" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_mt: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_ca}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_ca: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_mt}", attorney_name: "Atty B", attorney_email: "b@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_mt: $.data.id } }
            - { call: "POST /recovery/cases/${c_ca}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_mt}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_ca}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-CA-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_mt}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-MT-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_ca}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_ca: $.data.id } }
            - { call: "POST /recovery/cases/${c_mt}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_mt: $.data.id } }
            - { call: "GET /recovery/cases/${c_ca}", as: RecoverySpecialist, captures: { c_ca_v: $.data.version } }
            - { call: "GET /recovery/cases/${c_mt}", as: RecoverySpecialist, captures: { c_mt_v: $.data.version } }
          trigger:
            - { call: "POST /recovery/cases/${c_ca}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_ca_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_ca: $.data.id } }
            - { call: "POST /recovery/cases/${c_mt}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_mt_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_mt: $.data.id } }
          assert:
            - "Settlement.${s_ca}.state_recovery_cents == 200000"
            - "Settlement.${s_ca}.cost_share_cents == 0"
            - "Settlement.${s_ca}.member_net_cents == 450000"
            - "Settlement.${s_mt}.state_recovery_cents == 150000"
            - "Settlement.${s_mt}.cost_share_cents == 50000"
            - "Settlement.${s_mt}.member_net_cents == 500000"

      - name: estate_claim_provisional_vs_final
        grounds:
          - calculations.estate_claim_amount
          - entities.EstateCase.fields.provisional_claim_cents
          - entities.EstateCase.fields.claim_amount_cents
        distinguishing_aspect: |
          Same member data produces provisional_claim_cents == 500000 (gross
          lifetime paid, no offsets) at case opening but claim_amount_cents ==
          250000 at file-claim (500000 - 200000 POSTED TPL recovery - 50000
          exempt services) — provisional vs final variants on the EstateCase
          domain, a different entity domain than Settlement.
        test_recipe:
          setup:
            - "CA member with a fully resolved TPL case: lien 200000, settlement recovery 200000, posting 200000 POSTED"
            - "Member marked deceased with lifetime_paid_cents 500000; EstateCase OPENED"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CA-2", full_name: "Cara Dec", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-03-01", lifetime_paid_cents: 500000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id", ec_prov: "$.data[0].provisional_claim_cents" } }
          trigger:
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-100", exempt_services_cents: 50000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
          assert:
            - "EstateCase.${ec_id} provisional_claim_cents at opening == 500000 (captured ec_prov == 500000)"
            - "EstateCase.${ec_id}.claim_amount_cents == 250000 after file-claim"
            - "EstateCase.${ec_id}.claim_outstanding_cents == 250000"
            - "EstateCase.${ec_id}.status == CLAIM_FILED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hardship_partial_reduction_nested_minmax
        grounds:
          - calculations.hardship_reduction
          - entities.HardshipWaiver.fields.decided_reduction_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — decided reduction =
          min(requested 3000000, max(0, outstanding 4000000 - max(0, homestead
          7000000 - cap 5000000))) = 2000000, with a conditional branch on
          waiver_type (PARTIAL vs FULL).
        test_recipe:
          setup:
            - "Member deceased (lifetime_paid 4000000, no TPL); EstateCase CLAIM_FILED with claim_amount 4000000; PARTIAL waiver PENDING (homestead 7000000, income 4000000, requested 3000000)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-H-1", full_name: "Heir Case", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-200", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/estate-cases/${ec_id}/waivers", payload: { waiver_type: "PARTIAL", household_income_annual_cents: 4000000, homestead_value_cents: 7000000, requested_reduction_cents: 3000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/waivers/${w_id}/approve", as: RecoverySupervisor, as_user_id: sup_1 }
          assert:
            - "HardshipWaiver.${w_id}.status == APPROVED"
            - "HardshipWaiver.${w_id}.decided_reduction_cents == 2000000"
            - "EstateCase.${ec_id}.claim_outstanding_cents == 2000000"
            - "EstateCase.${ec_id}.status == CLAIM_FILED"

      - name: commission_per_posting_rounding_then_sum
        grounds:
          - calculations.contractor_commission
          - entities.RecoveryPosting.fields.commission_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-posting round_half_up then sum.
          Postings 100020 and 100060 yield commissions 10002 (10001.5 up) and
          10005 (10004.5 up); the case summary total_commission_cents == 20007,
          one cent MORE than the 20006 an aggregate-round-then-split order gives.
        test_recipe:
          setup:
            - "CA case with lien 200080 (one claim of 200080), settlement recovery 200080 (gross 1000000, fee 0.25, costs 100000), settlement ACCEPTED, two postings 100020 + 100060 PENDING"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CM-1", full_name: "Comm Test", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200080, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 100020, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p1: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 100060, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /recovery/postings/${p1}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/postings/${p2}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "GET /recovery/cases/${c_id}/accounting-summary", as: RecoveryAccountant, captures: { tot_rec: $.data.total_recovered_cents, tot_comm: $.data.total_commission_cents, tot_net: $.data.total_net_to_state_cents } }
          assert:
            - "RecoveryPosting.${p1}.commission_cents == 10002"
            - "RecoveryPosting.${p2}.commission_cents == 10005"
            - "accounting-summary total_recovered_cents == 200080 (captured tot_rec == 200080)"
            - "accounting-summary total_commission_cents == 20007 (captured tot_comm == 20007), not 20006"
            - "accounting-summary total_net_to_state_cents == 180073 (captured tot_net == 180073)"

      - name: subrogation_cost_share_pinned_order
        grounds:
          - calculations.settlement_recovery_amount
          - entities.Settlement.fields.cost_share_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — cost share is capped by 25% of
          the PRE-COST recovery, not of the post-deduction value. With lien
          outstanding 200000, gross 1000000, costs 40000: cost_share ==
          min(40000, 25% of 200000 = 50000) == 40000 and recovery == 160000;
          evaluating the cap against the post-cost base would give a different
          number.
        test_recipe:
          setup:
            - "MT member (SUBROGATION), case ATTORNEY_NOTIFIED with one claim of 200000 and a filed lien of 200000"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-MT-2", full_name: "Sub Rog", state_code: "MT" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty B", attorney_email: "b@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 40000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
          assert:
            - "Settlement.${s_id}.cost_share_cents == 40000"
            - "Settlement.${s_id}.state_recovery_cents == 160000"
            - "Settlement.${s_id}.fee_amount_cents == 250000"
            - "Settlement.${s_id}.member_net_cents == 550000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_counter_cycle_rounds
        grounds:
          - state_machines.Settlement.OFFERED_to_COUNTERED
          - state_machines.Settlement.COUNTERED_to_OFFERED
          - entities.Settlement.fields.round_number
        distinguishing_aspect: |
          Cyclic shape on Settlement: OFFERED -> COUNTERED -> OFFERED is legal;
          round_number increments 1 -> 2 -> 3 while offer fields are replaced
          each cycle.
        test_recipe:
          setup:
            - "CA case with lien 100000 (one claim 100000); settlement created OFFERED round 1 (gross 500000, fee 0.20, costs 50000)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-NG-1", full_name: "Neg Cycle", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/settlements/${s_id}/counter", payload: { gross_amount_cents: 600000, attorney_fee_pct: 0.25, litigation_costs_cents: 60000, offered_by: "STATE" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/settlements/${s_id}/counter", payload: { gross_amount_cents: 700000, attorney_fee_pct: 0.25, litigation_costs_cents: 60000, offered_by: "INSURER" }, as: RecoverySpecialist, as_user_id: spec_1 }
          assert:
            - "Settlement.${s_id}.status == OFFERED after the second counter"
            - "Settlement.${s_id}.round_number == 3"
            - "Settlement.${s_id}.gross_amount_cents == 700000"
            - "Settlement.${s_id}.fee_amount_cents == 175000"

      - name: tpl_case_parallel_litigation_dimensions
        grounds:
          - state_machines.TplCaseLitigation.NO_SUIT_to_SUIT_FILED
          - state_machines.TplCaseLitigation.SUIT_FILED_to_JUDGMENT
          - state_machines.TplCase.IDENTIFIED_to_ATTORNEY_NOTIFIED
          - entities.TplCase.fields.litigation_status
        distinguishing_aspect: |
          Parallel state dimensions on TplCase: litigation_status advances
          NO_SUIT -> SUIT_FILED -> JUDGMENT while the resolution dimension
          independently advances IDENTIFIED -> ATTORNEY_NOTIFIED; neither
          dimension's transition mutates the other's value.
        test_recipe:
          setup:
            - "Member with a freshly identified case (IDENTIFIED / NO_SUIT)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-LT-1", full_name: "Lit Track", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "FILE_SUIT" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "RECORD_JUDGMENT" }, as: RecoverySpecialist, as_user_id: spec_1 }
          assert:
            - "TplCase.${c_id}.litigation_status == SUIT_FILED after first trigger while status == IDENTIFIED"
            - "TplCase.${c_id}.status == ATTORNEY_NOTIFIED after notify-attorney while litigation_status stays SUIT_FILED"
            - "TplCase.${c_id}.litigation_status == JUDGMENT after third trigger while status stays ATTORNEY_NOTIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: posting_post_cascade_depth3plus
        grounds:
          - state_machines.RecoveryPosting.PENDING_to_POSTED
          - state_machines.Lien.FILED_to_SATISFIED
          - state_machines.TplCase.SETTLEMENT_PENDING_to_RESOLVED
          - entities.CommunicationNotice.fields.notice_type
        distinguishing_aspect: |
          Depth-4 chain from a single trigger: posting post mutates Lien
          (outstanding 200000 -> 0); that lien mutation flips Lien to SATISFIED;
          the lien satisfaction flips TplCase to RESOLVED; the case resolution
          queues a CASE_RESOLUTION_NOTICE. Each hop is caused by the previous
          entity's mutation, not by the original endpoint.
        test_recipe:
          setup:
            - "CA case: lien 200000 FILED; settlement ACCEPTED with state_recovery 200000; one posting of 200000 PENDING"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-TC-1", full_name: "Cascade One", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
          assert:
            - "RecoveryPosting.${p_id}.status == POSTED, commission_cents == 17500, net_to_state_cents == 182500"
            - "Lien.${l_id}.outstanding_cents == 0 and Lien.${l_id}.status == SATISFIED"
            - "TplCase.${c_id}.status == RESOLVED and TplCase.${c_id}.total_recovered_cents == 200000"
            - "Settlement.${s_id}.status == DISBURSED"
            - "GET /recovery/notices?case_id=${c_id}&notice_type=CASE_RESOLUTION_NOTICE returns exactly 1 notice with status QUEUED and due_date == 2026-08-31 (creation date 2026-08-01 + 30 days)"

      - name: waiver_full_approve_cascade_depth2
        grounds:
          - state_machines.HardshipWaiver.PENDING_to_APPROVED
          - state_machines.EstateCase.CLAIM_FILED_to_WAIVED
          - entities.CommunicationNotice.fields.estate_case_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the posting cascade:
          waiver approval mutates EstateCase (outstanding 4000000 -> 0, status
          WAIVED); that estate mutation itself queues an ESTATE_DECISION_NOTICE.
        test_recipe:
          setup:
            - "EstateCase CLAIM_FILED with claim_amount 4000000 (lifetime 4000000, no TPL, exempt 0); FULL waiver PENDING (income 2000000 <= 3000000, homestead 4000000 <= 5000000)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-WV-1", full_name: "Waive Full", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-300", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/estate-cases/${ec_id}/waivers", payload: { waiver_type: "FULL", household_income_annual_cents: 2000000, homestead_value_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/waivers/${w_id}/approve", as: RecoverySupervisor, as_user_id: sup_1 }
          assert:
            - "HardshipWaiver.${w_id}.status == APPROVED and decided_reduction_cents == 4000000"
            - "EstateCase.${ec_id}.status == WAIVED and claim_outstanding_cents == 0"
            - "GET /recovery/notices?estate_case_id=${ec_id}&notice_type=ESTATE_DECISION_NOTICE returns exactly 1 notice with status QUEUED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lien_amend_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_LIEN_NOT_AMENDABLE]
          - errors[ERR_LIEN_EXCEEDS_CAP]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): an amend on a SATISFIED lien
          that also exceeds the statutory cap returns ERR_LIEN_NOT_AMENDABLE
          (priority 6 state) — never ERR_LIEN_EXCEEDS_CAP (priority 9 fiscal).
        test_recipe:
          setup:
            - "CA case fully resolved: lien 200000 SATISFIED via a posted 200000 posting"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-PV-1", full_name: "Prio One", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "GET /recovery/liens/${l_id}", as: RecoverySpecialist, captures: { l_v: $.data.version } }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 300000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LIEN_NOT_AMENDABLE (captured err), not ERR_LIEN_EXCEEDS_CAP"
            - "Lien.${l_id}.lien_amount_cents unchanged == 200000"

      - name: settlement_create_temporal_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SOL_EXPIRED]
          - errors[ERR_NEGOTIATION_IN_PROGRESS]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint): creating a
          settlement when the case is past its SOL AND another settlement is
          OFFERED returns ERR_SOL_EXPIRED (priority 7 temporal) — never
          ERR_NEGOTIATION_IN_PROGRESS (priority 8 constraint) — and fires the
          lazy SOL expiry cascade.
        test_recipe:
          setup:
            - "Case injury 2023-01-01 (sol_date 2026-01-01), lien 100000 FILED, settlement A OFFERED; logical clock advanced to 2026-01-02"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-PV-2", full_name: "Prio Two", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2023-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2023-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v1: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v1}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-01-02T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v2: $.data.version } }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 600000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "STATE", expected_case_version: "${c_v2}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOL_EXPIRED (captured err), not ERR_NEGOTIATION_IN_PROGRESS"
            - "TplCase.${c_id}.status == SOL_EXPIRED (lazy expiry side effect persists despite the 409)"
            - "Lien.${l_id}.status == EXPIRED"
            - "Settlement.${s_id}.status == REJECTED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lien_cap_exact_boundary
        grounds:
          - calculations.lien_perfected_amount
          - entities.Lien.fields.lien_amount_cents
        distinguishing_aspect: |
          Money boundary on the lien-filing endpoint: included claims summing to
          EXACTLY the 250000 cap produce lien_amount_cents == 250000 with no
          error (min is inclusive); a 250001 basis is capped to the same 250000.
        test_recipe:
          setup:
            - "Two members each with an ATTORNEY_NOTIFIED case: case A claims 150000 + 100000 (= 250000 exactly); case B one claim of 250001"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CB-A", full_name: "Cap A", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_a: $.data.id } }
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CB-B", full_name: "Cap B", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_b: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_a}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_a: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_b}", attorney_name: "Atty B", attorney_email: "b@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_b: $.data.id } }
            - { call: "POST /recovery/cases/${c_a}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 150000, claim_reference: "CL-A1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/expense-claims", payload: { service_date: "2026-01-11", paid_amount_cents: 100000, claim_reference: "CL-A2" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 250001, claim_reference: "CL-B1" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_a}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_a: $.data.id } }
            - { call: "POST /recovery/cases/${c_b}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_b: $.data.id } }
          assert:
            - "Lien.${l_a}.lien_amount_cents == 250000 (exact-cap basis, no error)"
            - "Lien.${l_a}.outstanding_cents == 250000"
            - "Lien.${l_b}.lien_amount_cents == 250000 (250001 basis capped)"

      - name: sol_date_exact_boundary
        grounds:
          - entities.TplCase.fields.sol_date
          - errors[ERR_SOL_EXPIRED]
        distinguishing_aspect: |
          Date boundary on the settlement-create endpoint (distinct metric and
          endpoint from the lien cap): at current date == sol_date creation is
          ALLOWED (expiry is strictly-greater); one day later it is rejected
          with ERR_SOL_EXPIRED and the case flips to SOL_EXPIRED.
        test_recipe:
          setup:
            - "Two cases (injury 2023-08-01, sol_date 2026-08-01), each ATTORNEY_NOTIFIED with a filed lien; logical clock still at its 2026-08-01T00:00:00Z default for case A"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-SB-A", full_name: "Sol A", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_a: $.data.id } }
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-SB-B", full_name: "Sol B", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_b: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_a}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2023-08-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_a: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_b}", attorney_name: "Atty B", attorney_email: "b@x.com", injury_date: "2023-08-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_b: $.data.id } }
            - { call: "POST /recovery/cases/${c_a}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/expense-claims", payload: { service_date: "2023-08-10", paid_amount_cents: 100000, claim_reference: "CL-A1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/expense-claims", payload: { service_date: "2023-08-10", paid_amount_cents: 100000, claim_reference: "CL-B1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_a}", as: RecoverySpecialist, captures: { c_a_v: $.data.version } }
          trigger:
            - { call: "POST /recovery/cases/${c_a}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_a_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_a: $.data.id } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "GET /recovery/cases/${c_b}", as: RecoverySpecialist, captures: { c_b_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_b}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_b_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err_b: $.data.error_id } }
          assert:
            - "Settlement.${s_a}.status == OFFERED (creation on sol_date allowed)"
            - "error_id for case B == ERR_SOL_EXPIRED (captured err_b)"
            - "TplCase.${c_b}.status == SOL_EXPIRED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lien_filing_requires_attorney_notified
        grounds:
          - state_machines.TplCase.IDENTIFIED_to_ATTORNEY_NOTIFIED
          - errors[ERR_ATTORNEY_NOT_NOTIFIED]
        distinguishing_aspect: |
          Entity pair Lien -> TplCase: lien creation is rejected while the parent
          TplCase is still IDENTIFIED (attorney notification not recorded).
        test_recipe:
          setup:
            - "Member with a case in IDENTIFIED status (notify-attorney never called)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CE-1", full_name: "Cross One", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ATTORNEY_NOT_NOTIFIED (captured err)"
            - "TplCase.${c_id}.status still == IDENTIFIED"
            - "GET /recovery/liens?case_id=${c_id} returns an empty list"

      - name: settlement_accept_requires_lien_active
        grounds:
          - state_machines.Settlement.OFFERED_to_ACCEPTED
          - state_machines.Lien.FILED_to_RELEASED
          - errors[ERR_LIEN_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Settlement -> Lien (different pair than Lien -> TplCase):
          accept is rejected when the case's only lien has been released
          mid-negotiation, even though the settlement itself is OFFERED.
        test_recipe:
          setup:
            - "Case SETTLEMENT_PENDING: lien 200000 FILED then RELEASED by the supervisor while settlement A sits OFFERED"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CE-2", full_name: "Cross Two", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/liens/${l_id}/release", as: RecoverySupervisor, as_user_id: sup_1 }
          trigger:
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LIEN_NOT_ACTIVE (captured err)"
            - "Settlement.${s_id}.status still == OFFERED"
            - "TplCase.${c_id}.status still == SETTLEMENT_PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_episode_half_open_window
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_EPISODE_CASE]
        distinguishing_aspect: |
          Half-open anchored window on the Member resource: a new case whose
          injury_date falls inside [existing.injury_date, existing.injury_date
          + 90 days) collides — day 89 (2026-03-31) rejected, exact end
          (2026-04-01) allowed.
        test_recipe:
          setup:
            - "Member with an existing non-terminal case injury_date 2026-01-01 (episode window [2026-01-01, 2026-04-01))"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-OV-1", full_name: "Over Lap", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-03-31", third_party_insurer: "InsCo2" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-04-01", third_party_insurer: "InsCo3" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c3: $.data.id } }
          assert:
            - "error_id == ERR_DUPLICATE_EPISODE_CASE for the 2026-03-31 attempt (captured err)"
            - "The 2026-04-01 case (exact window end) is created with status IDENTIFIED (captured c3 != null)"
            - "GET /recovery/cases?member_id=${m_id} returns exactly 2 cases"

      - name: lien_amend_negotiation_freeze_closed_interval
        grounds:
          - validations[priority=7]
          - errors[ERR_NEGOTIATION_FREEZE]
          - state_machines.Lien.FILED_to_AMENDED
        distinguishing_aspect: |
          Closed buffer interval on the Lien resource (different interval
          semantics than the half-open episode window, different resource):
          exactly 14 days after the settlement's latest negotiation activity the
          amend is STILL frozen (ERR_NEGOTIATION_FREEZE); at +15 days it succeeds.
        test_recipe:
          setup:
            - "Case SETTLEMENT_PENDING: lien 200000 FILED; settlement created while the logical clock sat at its 2026-08-01T00:00:00Z default (settlement.updated_at == 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-OV-2", full_name: "Freeze Frame", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 180000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 180000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1 }
          assert:
            - "First amend (exactly +14 days) -> error_id == ERR_NEGOTIATION_FREEZE (captured err); lien unchanged"
            - "Second amend (+15 days) succeeds: Lien.${l_id}.status == AMENDED, lien_amount_cents == 180000, amended_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lien_outstanding_post_reverse_conservation
        grounds:
          - entities.Lien.fields.outstanding_cents
          - state_machines.RecoveryPosting.POSTED_to_REVERSED
          - state_machines.Lien.SATISFIED_to_FILED
        distinguishing_aspect: |
          Conserved quantity: the lien outstanding BALANCE. Invariant formula:
          outstanding_cents == lien_amount_cents - sum(gross_recovery_cents of
          POSTED postings on the lien). Post 200000 then reverse returns the
          balance to exactly 200000 with zero drift.
        test_recipe:
          setup:
            - "CA case: lien 200000 FILED; settlement ACCEPTED (recovery 200000); posting 200000 PENDING"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CI-1", full_name: "Con Serve", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/postings/${p_id}/reverse", as: RecoveryAccountant, as_user_id: acct_1 }
          assert:
            - "After post: Lien.${l_id}.outstanding_cents == 0, status SATISFIED"
            - "After reverse: RecoveryPosting.${p_id}.status == REVERSED"
            - "After reverse: Lien.${l_id}.outstanding_cents == 200000 == lien_amount_cents - 0 POSTED (invariant holds, no drift)"
            - "After reverse: Lien.${l_id}.status == FILED and TplCase.${c_id}.status == SETTLEMENT_PENDING"
            - "After reverse: Settlement.${s_id}.status == ACCEPTED"

      - name: settlement_split_identity_conserved
        grounds:
          - entities.Settlement.fields.member_net_cents
          - entities.Settlement.fields.state_recovery_cents
          - calculations.settlement_recovery_amount
        distinguishing_aspect: |
          Conserved quantity: the settlement SPLIT identity (a partition, a
          different quantity type than a running balance): gross == fee + costs
          + state_recovery + member_net. A post + reverse cycle on the
          settlement's posting leaves every split field unchanged and the
          identity intact.
        test_recipe:
          setup:
            - "CA case: lien 200000 FILED; settlement ACCEPTED with gross 1000000, fee_pct 0.25, costs 100000 (split: fee 250000, recovery 200000, member_net 450000); posting 200000 PENDING"
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CI-2", full_name: "Split Id", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/postings/${p_id}/reverse", as: RecoveryAccountant, as_user_id: acct_1 }
          assert:
            - "Settlement.${s_id}.fee_amount_cents == 250000 (unchanged through post+reverse)"
            - "Settlement.${s_id}.cost_share_cents == 0 (REIMBURSEMENT approach)"
            - "Settlement.${s_id}.state_recovery_cents == 200000 (unchanged)"
            - "Settlement.${s_id}.member_net_cents == 450000 (unchanged)"
            - "fee_amount_cents + litigation_costs_cents + state_recovery_cents + member_net_cents == 1000000 == gross_amount_cents (partition identity holds)"
