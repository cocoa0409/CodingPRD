            - { call: "POST /work-orders/${w3}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${w3}/route", payload: { bath_id: "${b3x}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b3x}", as: LabChemist, captures: { b3x_v1: $.data.version } }
            - { call: "POST /work-orders/${w3}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b3x_v1}" }, as: LineOperator, captures: { lr31: $.data.id } }
            - { call: "POST /load-runs/${lr31}/complete", as: LineOperator }
