          assert:
            - "HTTP 200, ${st} == ACTIVE, ${total} == 235"
            - "DaypartProfile.${dp_id}.greet_target_seconds == 25, order_target_seconds == 95, pull_forward_target_seconds == 40, window_target_seconds == 75 (unchanged)"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id}&profile_state=ACTIVE returns total_count 1"

