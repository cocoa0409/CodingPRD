  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_changes_requested_branch_resets_impact_then_recycles
        grounds:
          - state_machines.ChangeRequest.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ChangeRequest.fields.revision_cycle_count
          - entities.ChangeRequest.fields.impact_consumer_count
          - calculations.change_impact_lead_time
        distinguishing_aspect: |
          ChangeRequest is a BRANCHING machine whose UNDER_REVIEW fork to CHANGES_REQUESTED
          clears reviewer_steward_id and resets the whole impact assessment to 0 / 0 / null,
          and whose re-entry edge back to SUBMITTED increments revision_cycle_count to 1 and
          recomputes earliest_apply_at against the NEW submitted_at (2026-08-16, not the
          original 2026-08-15) - a linear machine could reach APPROVED without either effect.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER ACTIVE, notification_lead_days_floor 5, classification_level INTERNAL, posture OPEN."
            - "Consumer C1 (TIER1, clearance INTERNAL, required_lead_days 10) and C2 (TIER2, clearance INTERNAL, required_lead_days 3) are ACTIVE."
            - "A REFERENCE_VALUE_ADD (non-structural) change request exists in DRAFT."
