              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { batch_6: $.data.id, b6_status: $.data.status }
          assert:
            - "${b1_status} == OPEN and ${b1_count} == 0 — an empty batch still occupies its region interval"
            - "RTB-2, whose period_start 2026-08-16 is exactly one day after RTB-1's INCLUSIVE period_end 2026-08-15, returns HTTP 409 with error.code == ERR_BATCH_BUFFER_VIOLATION: the gap must be STRICTLY greater than SETTLEMENT_BUFFER_DAYS == 1, so back-to-back and one-day-apart are both refused"
            - "RTB-3, whose closed period [2026-08-10, 2026-08-20] genuinely intersects [2026-08-01, 2026-08-15], returns HTTP 409 with error.code == ERR_BATCH_PERIOD_OVERLAP — priority 13 outranks priority 14 even though the buffer is also violated"
            - "${b4_status} == OPEN and ${b4_start} == 2026-08-17T00:00:00.000Z — a two-day gap clears the buffer, which pins the boundary between RTB-2 and RTB-4 at exactly one day"
            - "${b5_status} == OPEN and ${b5_region} == EAST — the identical period that RTB-3 was refused for is accepted in another region, because both checks are region-scoped"
            - "${b1_status_cancelled} == CANCELLED and ${b1_count_after} == 0 and ${b1_total_after} == 0"
            - "${b6_status} == OPEN for the period [2026-08-02, 2026-08-14], which sits INSIDE the cancelled batch's former period: a CANCELLED batch releases the region interval, and the occupancy set is {OPEN, LOCKED, DISBURSED} only"
            - "no batch row exists for batch_code RTB-2 or RTB-3 afterwards, so the uniqueness of batch_code is not consumed by a refused create"

  - rule_id: compensating_invariant
    instances:
      - name: recovered_chargeback_restores_committed_cents_but_write_off_deliberately_does_not
        grounds:
          - calculations.program_committed_ledger
          - state_machines.Chargeback.PENDING_to_RECOVERED
          - state_machines.Chargeback.PENDING_to_WRITTEN_OFF
          - calculations.chargeback_recovery_amount
          - entities.Dealer.fields.open_chargeback_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY — IncentiveProgram.committed_cents. The compensation is
          asymmetric by design and that asymmetry is the whole point: approve -> schedule ->
          unwind -> RECOVER returns committed_cents to EXACTLY its pre-approval value, while the
          identical path ending in WRITE-OFF leaves the amount committed forever, because the
          written-off amount re-enters the ledger through the second summation term. Dealer
          .open_chargeback_cents, by contrast, returns to zero on BOTH branches.
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program CMP-CASH, per_unit_amount_cents 150000, budget_cents 40000000, accrual_method UNIT_BASED, window [2026-08-01, 2026-09-01), MX5/WEST/CASH eligibility."
            - "Dealer D-890, ACTIVE, region WEST."
            - "Two VALIDATED MX5/CASH deliveries with sale_date 2026-08-05, reported at clock 2026-08-05."
            - "One OPEN WEST batch CMP-B1 with period [2026-08-01, 2026-08-31] and scheduled_pay_date 2026-09-10; it is never disbursed, so paid_cents stays 0 for the whole instance."
            - "No accrual is ever run, so accrued_budget_cents starts at 0 and only the unwind reversals move it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-890", name: "Copperfield Motors", region_code: "WEST", historical_volume_units: 9, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id, dealer_paid_initial: $.data.paid_cents, dealer_open_initial: $.data.open_chargeback_cents }
            - call: "POST /incentives/programs"
              payload: { program_code: "CMP-CASH", name: "Compensating Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 150000, budget_cents: 40000000, stack_group: "CMP", priority_rank: 141, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "GET /incentives/programs/${prog_id}/spend-summary"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { committed_pre: $.data.committed_cents }
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "CMP-B1", region_code: "WEST", period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z", scheduled_pay_date: "2026-09-10T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { batch_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842CMP000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3200000, sale_date: "2026-08-05T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
