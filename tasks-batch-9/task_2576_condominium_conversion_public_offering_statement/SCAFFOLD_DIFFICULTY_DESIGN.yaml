            - "ConversionProject with a PLAT_CERTIFIED DeclarationPackage and two INCLUDED Units
               D-1 and D-2, each base_percentage_interest_bp 5000."
            - "TenantHousehold H-D linked to D-1 via occupied_unit_id, notice served at
