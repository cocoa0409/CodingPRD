# =============================================================================
# Task 1334: Location Scouting & Film Permit Coordination
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: production_create_applies_initial_state_and_version
        claim_type: creation
        grounds: [entities.Production, state_machines.Production.PREP_to_ACTIVE]
        distinguishing_aspect: "POST /productions with valid input returns 201 with status PREP, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
          trigger: []
          assert:
            - "Production.${prod_id}.status == PREP"
            - "Production.${prod_id}.version == 1"
            - "Production.${prod_id}.id matches UUID format and created_at is ISO8601 UTC with 3 fractional digits"

      - name: jurisdiction_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Jurisdiction.fields.lead_time_business_days, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required lead_time_business_days on jurisdiction create yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2 }
              as: FilmOffice
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"
            - "GET /jurisdictions returns total_count == 0"

      - name: jurisdiction_create_omitting_holidays_defaults_empty
        claim_type: defaults
        grounds: [entities.Jurisdiction.fields.holidays]
        distinguishing_aspect: "Jurisdiction created without the optional holidays field defaults to an empty array."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2 }
              as: FilmOffice
              captures: { jur_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_id}.holidays == []"
            - "Jurisdiction.${jur_id}.status == ACTIVE"

      - name: location_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET on a well-formed but non-existent location id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /locations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: scout_package_coverage_score_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.ScoutPackage.fields.coverage_score_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "coverage_score_pct = 101 violates the 0-100 constraint -> 400 ERR_INVALID_REQUEST; no package persisted."
        test_recipe:
          setup: ["J1, owner, location, production exist"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 101, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"
            - "GET /productions/${prod_id}/scout-packages returns total_count == 0"

      - name: deposit_account_second_account_same_pair_rejected
        claim_type: type_constraints
        grounds: [entities.DepositAccount.fields.location_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The (production_id, location_id) uniqueness constraint: a second deposit account for the same pair is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["J1, owner, location, production; one DepositAccount already OPEN for the pair"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/deposit-accounts"
              payload: { location_id: "${loc_id}" }
              as: LocationManager
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/deposit-accounts"
              payload: { location_id: "${loc_id}" }
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"
            - "GET /productions/${prod_id}/deposit-accounts returns total_count == 1"

      - name: owners_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /owners with limit=2 over 3 owners returns exactly 2 rows, total_count == 3, has_more == true; offset=2 returns the final row with has_more == false."
        test_recipe:
          setup: ["three owners registered"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
            - call: "POST /owners"
              payload: { legal_name: "Owner Two", contact_email: "owner2@x.com", default_day_rate_cents: 160000 }
              as: LocationManager
            - call: "POST /owners"
              payload: { legal_name: "Owner Three", contact_email: "owner3@x.com", default_day_rate_cents: 170000 }
              as: LocationManager
          trigger:
            - call: "GET /owners"
              payload: {}
              as: LocationManager
          assert:
            - "GET /owners?limit=2&offset=0 -> response_type array, 2 items, total_count == 3, has_more == true"
            - "GET /owners?limit=2&offset=2 -> 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: scout_package_submit_with_five_photos_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ScoutPackage.DRAFT_to_SUBMITTED, "errors[ERR_PACKAGE_INCOMPLETE]"]
        distinguishing_aspect: "photo_count 5 (< 6 floor) blocks the DRAFT->SUBMITTED transition with ERR_PACKAGE_INCOMPLETE; the package stays DRAFT."
        test_recipe:
          setup: ["J1, owner, location, production; scout package with photo_count 5"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 5, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PACKAGE_INCOMPLETE with http 422"
            - "ScoutPackage.${sp_id}.status == DRAFT"

      - name: scout_package_review_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScoutPackage.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal; a second review call on the same package fails with ERR_INVALID_STATE and no state change."
        test_recipe:
          setup: ["J1, owner, location, production; scout package ACCEPTED"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
          trigger:
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "REJECT" }
              as: FilmOffice
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "ScoutPackage.${sp_id}.status == ACCEPTED (unchanged)"

      - name: agreement_counter_at_round_cap_returns_negotiation_exhausted
        claim_type: precondition_enforcement
        grounds: [state_machines.OwnerAgreement.PROPOSED_to_COUNTERED, "errors[ERR_NEGOTIATION_EXHAUSTED]"]
        distinguishing_aspect: "With max_rounds 2 and round_count == 2 after the second propose, the owner's counter is rejected ERR_NEGOTIATION_EXHAUSTED; the agreement stays PROPOSED."
        test_recipe:
          setup: ["J1, owner, location, production, ACCEPTED scout; agreement max_rounds 2 cycled propose-counter-propose"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12", max_rounds: 2 }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 100000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/counter"
              payload: { proposed_day_rate_cents: 180000 }
              as: OwnerRep
              as_user_id: "${owner_id}"
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 140000 }
              as: LocationManager
          trigger:
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/counter"
              payload: { proposed_day_rate_cents: 160000 }
              as: OwnerRep
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NEGOTIATION_EXHAUSTED with http 422"
            - "OwnerAgreement.${agr_id}.status == PROPOSED and round_count == 2"

      - name: permit_withdraw_from_withdrawn_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication.DRAFT_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal; a second withdraw fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["J1, owner, location, production; permit created in DRAFT then withdrawn"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/permit-applications"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12", closed_lanes: 0, shoot_hours_per_day: 8, expected_production_version: "${prod_v}" }
              as: LocationManager
              captures: { pa_id: $.data.id }
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/withdraw"
              payload: {}
              as: LocationManager
          trigger:
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/withdraw"
              payload: {}
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "PermitApplication.${pa_id}.status == WITHDRAWN"

      - name: permit_start_review_with_short_lead_time_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PermitApplication.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_LEAD_TIME_SHORT]"]
        distinguishing_aspect: "SUBMITTED application with business_days_available 4 < lead 5 cannot enter review: ERR_LEAD_TIME_SHORT; status stays SUBMITTED. (Pure temporal gate — distinct from the §1.8 priority-conflict instance which fires from DRAFT.)"
        test_recipe:
          setup: ["J1 chain through EXECUTED agreement; permit submitted at clock 2026-08-05 for window starting 2026-08-10 (business days Aug 6,7,10 = 3 < 5)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FilmOffice
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 150000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
            - call: "POST /productions/${prod_id}/permit-applications"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12", closed_lanes: 0, shoot_hours_per_day: 8, expected_production_version: "${prod_v}" }
              as: LocationManager
              captures: { pa_id: $.data.id }
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/submit"
              payload: {}
              as: LocationManager
          trigger:
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/start-review"
              payload: {}
              as: FilmOffice
              captures: { err: $.data.error_id }
          assert:
            - "PermitApplication.${pa_id}.business_days_available == 3 (Aug 6, 7, 10)"
            - "PermitApplication.${pa_id}.lead_time_satisfied == false"
            - "error_id == ERR_LEAD_TIME_SHORT with http 422; status stays SUBMITTED"

      - name: permit_submit_without_executed_agreement_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PermitApplication.DRAFT_to_SUBMITTED, "errors[ERR_AGREEMENT_NOT_EXECUTED]"]
        distinguishing_aspect: "Submit while the agreement is merely PROPOSED (never EXECUTED) fails ERR_AGREEMENT_NOT_EXECUTED; application stays DRAFT."
        test_recipe:
          setup: ["J1, owner, location, production; scout ACCEPTED; agreement PROPOSED only"]
          setup_api_calls:
