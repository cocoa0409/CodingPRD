          The conflicting pair is business_temporal (rung 6) versus business_constraint (rung 8): an
          amendment carrying an out-of-enum fitness_conclusion against a visit dated inside a FINALIZED
          period returns ERR_PERIOD_FINALIZED with 409, never ERR_INVALID_ENUM with 400 - a different
          category pair from the wall-versus-existence conflict.
        test_recipe:
          setup:
