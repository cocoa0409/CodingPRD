  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: estimate_void_leaves_billed_ledger_balanced
        grounds:
          - state_machines.SalesReport.ESTIMATED_to_SUBMITTED
          - state_machines.SalesReport.SUBMITTED_to_ACCEPTED
          - entities.LeaseYear.fields.cumulative_billed_cents
          - entities.ReportingLedgerEntry.fields.delta_billed_cents
          - calculations.percentage_rent_charge
        distinguishing_aspect: |
          Conserved quantity #1 is BILLED MONEY: after the forward estimate (+1,380,000) and its
          compensating void (-1,380,000) and the replacement periodic charge (+1,080,000),
          LeaseYear.cumulative_billed_cents == sum of amount_cents over ISSUED charges == sum of
          ReportingLedgerEntry.delta_billed_cents == 1,080,000 with zero drift.
