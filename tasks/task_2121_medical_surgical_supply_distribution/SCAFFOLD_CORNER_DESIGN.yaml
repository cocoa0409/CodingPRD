  - section: validations
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A POST /supply-rooms sent without X-User-Role and X-User-ID is refused with ERR_UNAUTHENTICATED 401 before any schema check runs, so a body that is also missing required fields still yields 401."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-400" }
              as: "(no X-User-Role header sent)"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err} != ERR_VALIDATION - priority 1 wins over priority 3"

      - name: pagination_limit_above_maximum_returns_validation_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - response_envelope.pagination_defaults
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and yields ERR_VALIDATION 400; limit 100 is accepted."
        test_recipe:
          setup:
            - "One item in the master so the list is non-empty."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-PG-CS", description: "Pagination probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
          trigger:
            - call: "GET /items"
              payload: { limit: 101, offset: 0 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
            - call: "GET /items"
              payload: { limit: 100, offset: 0 }
              as: ContractAdmin
              captures: { ok_id: "$.data[0].id" }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "the limit 100 call returns HTTP 200 with total_count == 1 and ${ok_id} is the created item"

      - name: contract_line_body_fk_item_not_found_returns_404
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_ITEM_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that does not resolve is a 404 on the referenced entity, not a 400: POST /contracts/{id}/lines with an unallocated item_id yields ERR_ITEM_NOT_FOUND."
        test_recipe:
          setup:
            - "One DRAFT contract."
          setup_api_calls:
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-FK", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "00000000-0000-4000-8000-0000000000ff", tier_price_cents: 1000, floor_price_cents: 900 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_NOT_FOUND with HTTP 404"
            - "GET /contract-lines?contract_id=${ctr_id} returns total_count == 0"

      - name: materials_manager_cannot_open_an_order_for_another_supply_room
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_SUPPLY_ROOM_SCOPE_VIOLATION]
          - roles.MaterialsManager
        distinguishing_aspect: "MaterialsManager identity is entity_backed on SupplyRoom, so an X-User-ID of room A creating an order whose supply_room_id is room B is refused with ERR_SUPPLY_ROOM_SCOPE_VIOLATION 403."
        test_recipe:
          setup:
            - "Two supply rooms, A and B."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-401", room_code: "GEN-401A", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-401", room_code: "GEN-401B", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_b_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { supply_room_id: "${room_b_id}" }
              as: MaterialsManager
              as_user_id: "${room_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SUPPLY_ROOM_SCOPE_VIOLATION with HTTP 403"
            - "GET /orders?supply_room_id=${room_b_id} returns total_count == 0"

      - name: route_stop_outside_room_receiving_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_STOP_OUTSIDE_ROOM_WINDOW]
          - entities.SupplyRoom.fields.window_close_min
        distinguishing_aspect: "A room closing at minute 600 refuses a stop at arrival_min 580 with service_minutes 30 because 610 > 600, while arrival_min 570 with the same duration fits exactly at the closing edge."
        test_recipe:
          setup:
            - "One ACUTE supply room with window 360..600 and one AMBIENT case item priced by an ACTIVE TIER_1 contract."
            - "An order for that room, one line of 2 cases, submitted and ALLOCATED from a 50-unit lot."
