    roles: [TreasuryAnalyst]
    code: 201
    input: [observed_at, value]
    output: MetricReading
    side_effects:
      - "EwiMetric.current_band recomputed from latest reading by observed_at (tie-break: created_at); last_reading_at updated"
      - "breach_detection for BoardLimit with subject == EWI_METRIC and ewi_metric_id == this metric; source_type METRIC_READING"
      - "if band became RED: posture_evaluation READING_AUTO appends PostureSnapshot; entering SEVERE/CRISIS escalates OPEN breaches"

  - method: GET
    path: "/liquidity/ewi-metrics/{id}/readings"
    description: "List readings of a metric (FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: MetricReading[]
    side_effects: []

  - method: GET
    path: "/liquidity/ewi-dashboard"
