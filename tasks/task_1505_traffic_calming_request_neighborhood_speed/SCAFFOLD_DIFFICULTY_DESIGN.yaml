      - name: signature_rejected_before_petition_opened
        grounds:
          - state_machines.TrafficCalmingRequest.SUBMITTED_to_PETITION_OPEN
          - validations[priority=5]
          - errors[ERR_REQUEST_INVALID_STATE]
        distinguishing_aspect: |
          Pair = PetitionSignature x TrafficCalmingRequest: a signature can only
