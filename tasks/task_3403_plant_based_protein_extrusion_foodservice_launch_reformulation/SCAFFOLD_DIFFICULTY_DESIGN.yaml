          - errors[ERR_PROGRAM_WINDOW_OVERLAP]
        distinguishing_aspect: "Different interval semantics from the line rule: same-partner LTO windows need a BUFFER of >= 14 days, so P2 starting exactly 14 days after P1 ends is ACCEPTED while P3 at 13 days is rejected — adjacency (gap 0) is illegal here though legal for line runs."
