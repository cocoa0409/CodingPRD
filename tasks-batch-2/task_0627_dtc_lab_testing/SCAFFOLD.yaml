# =============================================================================
# DTC Lab Testing benchmark — SCAFFOLD (§1.0–§1.7)
# Direct-to-Consumer lab testing platform (Quest/Labcorp OnDemand style):
# test catalog & physician-order (PWN) network, cart & self-pay pricing,
# patient-service-center scheduling vs at-home kit, specimen processing &
# result release (critical-value protocol), HSA/FSA payment, abnormal-result
# telehealth referral, repeat/panel bundle, data privacy.
# =============================================================================

scenario: |
  Direct-to-Consumer Lab Testing (Quest/Labcorp OnDemand style): test catalog & physician-order (PWN) network, cart & self-pay pricing, patient-service-center scheduling vs at-home kit, specimen processing & result release (critical-value protocol), HSA/FSA payment, abnormal-result telehealth referral, repeat/panel bundle, data privacy

domain_name: dtc-lab-testing
api_prefix: /catalog

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # cart estimate (forward) vs order invoice (chronological); result flag provisional vs delta-checked
    - cascading_side_effects         # result release → critical-value protocol → telehealth referral; order paid → fulfillment fan
    - rate_threshold_triggers        # critical-value thresholds, bundle qualification, repeat-discount lookback
    - optimistic_concurrency         # OCC on Cart.version (checkout-vs-edit) and Order.version (collect-vs-cancel)

  entity_topology: flat
  # Peer entities (Patient, TestOffering, PanelBundle, Cart, CartLine, Order,
  # OrderLine, PhysicianOrder, Appointment, HomeKit, Specimen, LabResult,
  # TelehealthReferral, Payment) linked by foreign keys; no nesting in URL paths.

  state_machine_shape: parallel
  # Order carries two independent axes (payment_status × fulfillment_status).
  # OrderLine has a branching/revert lifecycle. LabResult has a non-linear
  # release lifecycle with a critical-value branch. PhysicianOrder is a
  # review cycle (cyclic: SUBMITTED → MORE_INFO → SUBMITTED).

  relationship_patterns:
    - one_to_many        # Cart→CartLine, Order→OrderLine, Order→Specimen
    - flat_fk_references # OrderLine→TestOffering, Specimen→OrderLine, LabResult→Specimen
    - cross_aggregate    # LabResult.patient_id resolves repeat-discount + delta-check against prior Order history

  role_model: segregation_of_duties
  # Patient owns carts/orders; OrderingPhysician approves PhysicianOrders (PWN);
  # PhlebotomyTech collects specimens; LabTech processes/releases results;
  # the same X-User-ID cannot both collect a specimen and release its result.

  consistency_model: immediate

# =============================================================================
# Domain constants (pinned so every rule is deterministic)
# =============================================================================
domain_constants:
  PWN_RESTRICTED_TEST_CODES_RULE: "A TestOffering.test_code is PWN-restricted (requires an APPROVED PhysicianOrder before collection) if and only if it starts with the prefix 'TST' (case-sensitive). All other codes are unrestricted."
  PWN_LICENSED_STATES: [CA, TX, FL]      # physician-order approval allowed only for patients in these states
  PWN_MIN_AGE_YEARS: 18                  # derived age (logical clock today minus date_of_birth) must be >= this
  HOME_KIT_BANNED_STATES: [NY, NJ, RI]   # at-home kits may not ship to these states
  REPEAT_LOOKBACK_DAYS: 365              # a RELEASED result for the same test_code within this many days before cart creation makes a line repeat-eligible
  REPEAT_DISCOUNT_RATE: 0.15
  PLATFORM_TIER1_CENTS: 20000
  PLATFORM_TIER1_RATE: 0.10
  PLATFORM_TIER2_CENTS: 50000
  PLATFORM_TIER2_RATE: 0.15
  DELTA_CHECK_ABS: 50
  CLOCK_DEFAULT: "2026-01-01T00:00:00Z"

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TestOffering
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: test_code, type: string, source: input, description: "Catalog code, unique among non-archived offerings (e.g. LIPID, HBA1C, TSH)" }
      - { name: display_name, type: string, source: input, description: "Patient-facing test name" }
      - { name: list_price_cents, type: integer, source: input, description: "Self-pay list price in integer cents (> 0)" }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | URINE | SALIVA" }
      - { name: home_kit_eligible, type: boolean, source: input, default: false, description: "Whether an at-home collection kit may fulfill this test" }
      - { name: requires_fasting, type: boolean, source: input, default: false, description: "Whether collection requires a fasting precondition flag at scheduling" }
      - { name: critical_low, type: number, source: input, required: false, description: "Analyzer value at or below which a result is CRITICAL (null = no low critical bound)" }
      - { name: critical_high, type: number, source: input, required: false, description: "Analyzer value at or above which a result is CRITICAL (null = no high critical bound)" }
      - { name: ref_low, type: number, source: input, required: false, description: "Lower reference-range bound; below it the result is ABNORMAL (null = no low bound)" }
      - { name: ref_high, type: number, source: input, required: false, description: "Upper reference-range bound; above it the result is ABNORMAL (null = no high bound)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED (soft delete); ARCHIVED offerings stay queryable but cannot be added to carts" }

  - name: PanelBundle
    parent: null
    common_fields: true
    fields:
      - { name: bundle_code, type: string, source: input, description: "Bundle code, unique among non-archived bundles (e.g. WELLNESS5)" }
      - { name: display_name, type: string, source: input, description: "Patient-facing bundle name" }
      - { name: member_test_codes, type: array, source: input, description: "Ordered list of TestOffering.test_code members (>= 2 distinct codes); each must reference an ACTIVE offering at create time" }
      - { name: bundle_price_cents, type: integer, source: input, description: "Flat bundle price in cents (> 0); substitutes the sum of members' list prices when all members are present in a cart" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email, unique across patients" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used to derive age for PWN order eligibility" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence; gates physician-order network and at-home kit availability" }
      - { name: hsa_balance_cents, type: integer, source: input, default: 0, description: "Available HSA/FSA funds in cents; debited when a payment uses fund_source HSA_FSA (>= 0)" }
      - { name: consent_share_results, type: boolean, source: input, default: false, description: "Data-privacy flag: when false, results may not be disclosed to a TelehealthReferral and referrals are blocked" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only state minted; reserved for future deactivation)" }

  - name: Cart
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; owner of the cart" }
      - { name: fund_source, type: enum, source: input, default: CARD, description: "CARD | HSA_FSA; pricing/payment intent; HSA_FSA draws Patient.hsa_balance_cents at checkout" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Count of CartLine children (denormalized; recomputed on every line add/remove)" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Pre-discount sum after bundle substitution over all lines (recomputed on line change)" }
      - { name: estimated_total_cents, type: integer, source: computed, default: 0, description: "Forward-looking quote: subtotal after bundle substitution, per-line repeat discount, platform tier discount, rounded per cart_estimated_total" }
      - { name: estimated_hsa_applied_cents, type: integer, source: computed, default: 0, description: "Forward-looking HSA/FSA draw under cart_estimated_total when fund_source=HSA_FSA, else 0" }
      - { name: estimated_patient_due_cents, type: integer, source: computed, default: 0, description: "estimated_total_cents - estimated_hsa_applied_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CHECKED_OUT (set when an order is placed from the cart); only OPEN carts accept line edits" }

  - name: CartLine
    parent: null
    common_fields: true
    fields:
      - { name: cart_id, type: string, source: input, description: "FK -> Cart.id; owning cart" }
      - { name: test_offering_id, type: string, source: input, description: "FK -> TestOffering.id; the ACTIVE offering being added" }
      - { name: test_code, type: string, source: system, description: "Snapshot of TestOffering.test_code at add time" }
      - { name: unit_list_price_cents, type: integer, source: system, description: "Snapshot of TestOffering.list_price_cents at add time" }
      - { name: repeat_discount_applied, type: boolean, source: computed, default: false, description: "True when the patient has a RELEASED LabResult for this test_code within REPEAT_LOOKBACK_DAYS before cart creation" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; placed from a checked-out cart" }
      - { name: cart_id, type: string, source: input, description: "FK -> Cart.id; source cart (consumed at checkout)" }
      - { name: fulfillment_mode, type: enum, source: input, description: "PSC | HOME_KIT; PSC requires a booked Appointment, HOME_KIT mints a HomeKit" }
      - { name: fund_source, type: enum, source: system, description: "Snapshot of Cart.fund_source at checkout" }
      - { name: invoiced_total_cents, type: integer, source: computed, default: 0, description: "Chronological invoice: priced over only OrderLines whose specimen RESULTED (status RESULTED), recomputed on each result release per order_final_invoiced_total" }
      - { name: hsa_applied_cents, type: integer, source: computed, default: 0, description: "Final HSA/FSA draw under order_final_invoiced_total; reconciled at each result release" }
      - { name: patient_due_cents, type: integer, source: computed, default: 0, description: "invoiced_total_cents - hsa_applied_cents" }
      - { name: payment_status, type: enum, source: system, default: AUTH_PENDING, description: "Payment axis: AUTH_PENDING | AUTHORIZED | CAPTURED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, default: AWAITING_COLLECTION, description: "Fulfillment axis: AWAITING_COLLECTION | IN_PROCESSING | PARTIALLY_RESULTED | COMPLETED | CANCELLED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: test_offering_id, type: string, source: input, description: "FK -> TestOffering.id; the offering ordered" }
      - { name: test_code, type: string, source: system, description: "Snapshot of test_code from the source CartLine" }
      - { name: unit_list_price_cents, type: integer, source: system, description: "Snapshot list price carried from the CartLine" }
      - { name: repeat_discount_applied, type: boolean, source: system, description: "Snapshot of CartLine.repeat_discount_applied" }
      - { name: requires_physician_order, type: boolean, source: system, description: "True when the offering's test_code is PWN-restricted (test_code starts with 'TST' per domain_constants.PWN_RESTRICTED_TEST_CODES_RULE); such lines need an APPROVED PhysicianOrder before collection" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | COLLECTED | RESULTED | REJECTED | CANCELLED" }

  - name: PhysicianOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line requiring physician authorization" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; derived from the order line's order" }
      - { name: reviewing_physician_id, type: string, source: system, description: "X-User-ID of the OrderingPhysician who took the review (set on first review action)" }
      - { name: clinical_note, type: string, source: input, required: false, description: "Optional intake note submitted with the request" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | NEEDS_MORE_INFO | APPROVED | DECLINED (cyclic: NEEDS_MORE_INFO -> SUBMITTED on resubmit)" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the PSC order being scheduled" }
      - { name: psc_location_code, type: string, source: input, description: "Patient-service-center location code" }
      - { name: slot_start, type: datetime, source: input, description: "ISO 8601 UTC slot start (inclusive)" }
      - { name: slot_end, type: datetime, source: input, description: "ISO 8601 UTC slot end (exclusive); must be > slot_start" }
      - { name: fasting_confirmed, type: boolean, source: input, default: false, description: "Patient attestation of fasting; required true when any order line offering requires_fasting" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | CHECKED_IN | CANCELLED" }

  - name: HomeKit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the HOME_KIT order" }
      - { name: shipping_state_code, type: string, source: input, description: "Two-letter US state the kit ships to; must equal the patient's state_code and not be in HOME_KIT_BANNED_STATES" }
      - { name: tracking_code, type: string, source: system, description: "System-minted shipment tracking code" }
      - { name: status, type: enum, source: system, default: SHIPPED, description: "SHIPPED (only state minted at kit creation)" }

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line this specimen fulfills (1:1)" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of the PhlebotomyTech (PSC) or system (home-kit accession) that collected it" }
      - { name: accession_code, type: string, source: system, description: "System-minted accession barcode" }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock timestamp at collection" }
      - { name: status, type: enum, source: system, default: COLLECTED, description: "COLLECTED | IN_ANALYSIS | RESULTED | REJECTED" }

  - name: LabResult
    parent: null
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; the specimen analyzed (1:1)" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; carried from the specimen" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; carried from the order" }
      - { name: test_code, type: string, source: system, description: "Snapshot test_code" }
      - { name: analyzer_value, type: number, source: input, description: "Raw numeric analyzer value entered at processing" }
      - { name: provisional_flag, type: enum, source: computed, description: "NORMAL | ABNORMAL | CRITICAL computed at PROCESSING from reference/critical bounds only (no history)" }
      - { name: final_flag, type: enum, source: computed, required: false, description: "NORMAL | ABNORMAL | CRITICAL computed at RELEASE incorporating delta-check vs the patient's most recent prior RELEASED result for this test_code" }
      - { name: critical_acknowledged, type: boolean, source: computed, default: false, description: "True once the critical-value protocol callback has been logged for a CRITICAL provisional_flag" }
      - { name: status, type: enum, source: system, default: PROCESSING, description: "PROCESSING | PENDING_CRITICAL_CALLBACK | RELEASED | AMENDED" }

  - name: TelehealthReferral
    parent: null
    common_fields: true
    fields:
      - { name: lab_result_id, type: string, source: input, description: "FK -> LabResult.id; the RELEASED abnormal/critical result driving the referral" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; carried from the result" }
      - { name: referral_reason, type: enum, source: computed, description: "ABNORMAL | CRITICAL; mirrors the result final_flag" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SCHEDULED | CLOSED" }

  - name: AnalyzerRun
    parent: null
    common_fields: true
    fields:
      - { name: analyzer_code, type: string, source: input, description: "Lab analyzer/instrument code being reserved (e.g. CHEM-1)" }
      - { name: run_start, type: datetime, source: input, description: "ISO 8601 UTC run start (inclusive)" }
      - { name: run_end, type: datetime, source: input, description: "ISO 8601 UTC run end; must be > run_start" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory cleaning/calibration buffer (minutes) appended after run_end; a new run on the same analyzer must start at or after the prior run_end + buffer (buffer-extended overlap semantics)" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | RELEASED (the reservation slot freed)" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being paid" }
      - { name: fund_source, type: enum, source: system, description: "Snapshot of Order.fund_source" }
      - { name: authorized_amount_cents, type: integer, source: system, description: "Amount authorized at order placement = Order.estimated patient-due captured at checkout time" }
      - { name: captured_amount_cents, type: integer, source: computed, default: 0, description: "Amount captured at order completion = final Order.patient_due_cents" }
      - { name: hsa_drawn_cents, type: integer, source: computed, default: 0, description: "Portion drawn from Patient.hsa_balance_cents at capture" }
      - { name: status, type: enum, source: system, default: AUTHORIZED, description: "AUTHORIZED | CAPTURED | REFUNDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- PhysicianOrder: cyclic review (NEEDS_MORE_INFO -> SUBMITTED) ----
  - entity: PhysicianOrder
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /catalog/physician-orders/{id}/decision  (decision=APPROVE)"
        actor: OrderingPhysician
        preconditions:
          - "PhysicianOrder.status == SUBMITTED (ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE)"
          - "Patient.state_code is in PWN_LICENSED_STATES (ERR_PWN_STATE_UNLICENSED)"
          - "Patient age derived from date_of_birth >= PWN_MIN_AGE_YEARS (ERR_PWN_AGE_INELIGIBLE)"
        side_effects:
          - "reviewing_physician_id set to X-User-ID"
          - "OrderLine becomes collectible (gate ERR_PHYSICIAN_ORDER_REQUIRED is now satisfied for this line)"
      - from: SUBMITTED
        to: NEEDS_MORE_INFO
        trigger: "POST /catalog/physician-orders/{id}/decision  (decision=REQUEST_INFO)"
        actor: OrderingPhysician
        preconditions:
          - "PhysicianOrder.status == SUBMITTED (ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE)"
        side_effects:
          - "reviewing_physician_id set to X-User-ID"
      - from: NEEDS_MORE_INFO
        to: SUBMITTED
        trigger: "POST /catalog/physician-orders/{id}/resubmit"
        actor: Patient
        preconditions:
          - "PhysicianOrder.status == NEEDS_MORE_INFO (ERR_PHYSICIAN_ORDER_NOT_RESUBMITTABLE)"
        side_effects:
          - "clinical_note overwritten with resubmission note when provided"
        note: "Cyclic loop: a request-info round returns the order to SUBMITTED for re-review."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /catalog/physician-orders/{id}/decision  (decision=DECLINE)"
        actor: OrderingPhysician
        preconditions:
          - "PhysicianOrder.status == SUBMITTED (ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE)"
        side_effects:
          - "reviewing_physician_id set to X-User-ID"
          - "Owning OrderLine transitions ORDERED -> REJECTED (cascade hop 1)"
          - "That OrderLine rejection bubbles to recompute Order.fulfillment_status (cascade hop 2)"
          - "If every other OrderLine is already terminal, Order.fulfillment_status -> COMPLETED or CANCELLED per cascade rule (cascade hop 3)"

  # ---- OrderLine: branching lifecycle with revert ----
  - entity: OrderLine
    initial_state: ORDERED
    terminal_states: [RESULTED, REJECTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /catalog/order-lines/{id}/collect  (PhlebotomyTech: PSC draw, or accessioning a returned home kit)"
        actor: PhlebotomyTech
        preconditions:
          - "OrderLine.status == ORDERED (ERR_ORDER_LINE_NOT_COLLECTIBLE)"
          - "Order.fulfillment_status == AWAITING_COLLECTION or IN_PROCESSING (ERR_ORDER_NOT_COLLECTABLE_STATE)"
          - "If OrderLine.requires_physician_order: an APPROVED PhysicianOrder exists for this line (ERR_PHYSICIAN_ORDER_REQUIRED)"
          - "For PSC orders: a CHECKED_IN Appointment exists for the order (ERR_APPOINTMENT_NOT_CHECKED_IN)"
        side_effects:
          - "Specimen minted in COLLECTED with collected_by_user_id = X-User-ID, collected_at = clock"
          - "If Order.fulfillment_status == AWAITING_COLLECTION it advances to IN_PROCESSING"
      - from: COLLECTED
        to: RESULTED
        trigger: "system on LabResult RELEASE for this line's specimen"
        actor: system
        preconditions:
          - "A LabResult for this line's specimen reached RELEASED (ERR_RESULT_NOT_RELEASABLE)"
        side_effects:
          - "Specimen.status -> RESULTED"
          - "Order.invoiced_total recomputed (order_final_invoiced_total) (cascade hop into Order)"
          - "Order.fulfillment_status bubbles to PARTIALLY_RESULTED or COMPLETED per cascade rule"
      - from: ORDERED
        to: REJECTED
        trigger: "system on PhysicianOrder DECLINE for this line"
        actor: system
        preconditions:
          - "OrderLine.status == ORDERED"
        side_effects:
          - "Excluded from order_final_invoiced_total"
          - "Order.fulfillment_status bubbles per cascade rule"
      - from: COLLECTED
        to: REJECTED
        trigger: "POST /catalog/specimens/{id}/reject  (specimen unusable: hemolyzed/insufficient)"
        actor: LabTech
        preconditions:
          - "OrderLine.status == COLLECTED and its Specimen.status in {COLLECTED, IN_ANALYSIS} (ERR_SPECIMEN_NOT_REJECTABLE)"
        side_effects:
          - "Specimen.status -> REJECTED"
          - "Excluded from order_final_invoiced_total; Order.invoiced_total recomputed"
          - "Order.fulfillment_status bubbles per cascade rule"
      - from: ORDERED
        to: CANCELLED
        trigger: "system on Order cancellation"
        actor: system
        preconditions:
          - "OrderLine.status == ORDERED (ERR_ORDER_LINE_NOT_COLLECTIBLE)"
        side_effects:
          - "Excluded from order_final_invoiced_total"

  # ---- Order: PARALLEL axes (payment_status × fulfillment_status) ----
  - entity: Order
    initial_state: "payment_status=AUTH_PENDING, fulfillment_status=AWAITING_COLLECTION"
    terminal_states: ["fulfillment_status in {COMPLETED, CANCELLED}", "payment_status in {CAPTURED, REFUNDED}"]
    transitions:
      # payment axis
      - from: "payment_status=AUTH_PENDING"
        to: "payment_status=AUTHORIZED"
        trigger: "system at order placement (POST /catalog/orders) once Payment authorized"
        actor: system
        preconditions:
          - "Payment minted AUTHORIZED for estimated patient-due"
        side_effects:
          - "Payment.status = AUTHORIZED, authorized_amount_cents = Cart.estimated_patient_due_cents"
      - from: "payment_status=AUTHORIZED"
        to: "payment_status=CAPTURED"
        trigger: "POST /catalog/orders/{id}/capture-payment"
        actor: Patient
        preconditions:
          - "Order.fulfillment_status == COMPLETED (ERR_ORDER_NOT_COMPLETE_FOR_CAPTURE)"
          - "Order.payment_status == AUTHORIZED (ERR_PAYMENT_NOT_CAPTURABLE)"
          - "expected_order_version matches (ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "Payment.status = CAPTURED, captured_amount_cents = Order.patient_due_cents"
          - "If fund_source == HSA_FSA: Patient.hsa_balance_cents -= Order.hsa_applied_cents; Payment.hsa_drawn_cents = Order.hsa_applied_cents"
          - "Increments Order.version by 1"
      - from: "payment_status=AUTHORIZED"
        to: "payment_status=REFUNDED"
        trigger: "system on Order cancellation while AUTHORIZED"
        actor: system
        preconditions:
          - "Order.payment_status == AUTHORIZED"
        side_effects:
          - "Payment.status = REFUNDED; no HSA debit occurred so no HSA restore needed"
      - from: "payment_status=CAPTURED"
        to: "payment_status=REFUNDED"
        trigger: "POST /catalog/orders/{id}/cancel  (compensating refund of a captured order)"
        actor: Patient
        preconditions:
          - "Order.payment_status == CAPTURED (ERR_PAYMENT_NOT_REFUNDABLE)"
          - "expected_order_version matches (ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "Payment.status = REFUNDED; captured_amount_cents refunded"
          - "If fund_source == HSA_FSA: Patient.hsa_balance_cents += Payment.hsa_drawn_cents (compensating invariant: HSA conserved)"
          - "Increments Order.version by 1"
      # fulfillment axis
      - from: "fulfillment_status=AWAITING_COLLECTION"
        to: "fulfillment_status=IN_PROCESSING"
        trigger: "system on first OrderLine collect"
        actor: system
        preconditions:
          - "At least one OrderLine transitioned ORDERED -> COLLECTED"
        side_effects: []
      - from: "fulfillment_status=IN_PROCESSING"
        to: "fulfillment_status=PARTIALLY_RESULTED"
        trigger: "system on LabResult RELEASE when some but not all non-cancelled lines are RESULTED"
        actor: system
        preconditions:
          - "At least one OrderLine RESULTED and at least one non-terminal OrderLine remains"
        side_effects: []
      - from: "fulfillment_status=PARTIALLY_RESULTED"
        to: "fulfillment_status=COMPLETED"
        trigger: "system on LabResult RELEASE / specimen reject when every OrderLine is terminal and >=1 is RESULTED"
        actor: system
        preconditions:
          - "Every OrderLine in {RESULTED, REJECTED, CANCELLED} and at least one is RESULTED"
        side_effects:
          - "Order.invoiced_total / hsa_applied / patient_due finalized via order_final_invoiced_total"
      - from: "fulfillment_status=IN_PROCESSING"
        to: "fulfillment_status=COMPLETED"
        trigger: "system when every OrderLine becomes terminal and >=1 RESULTED without an intermediate partial"
        actor: system
        preconditions:
          - "Every OrderLine terminal and at least one RESULTED"
        side_effects:
          - "Order.invoiced_total finalized"
      - from: "fulfillment_status in {AWAITING_COLLECTION, IN_PROCESSING, PARTIALLY_RESULTED}"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /catalog/orders/{id}/cancel"
        actor: Patient
        preconditions:
          - "No OrderLine is RESULTED (ERR_ORDER_HAS_RESULTED_LINES)"
          - "expected_order_version matches (ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "Every non-terminal OrderLine ORDERED/COLLECTED -> CANCELLED (cascade hop 1)"
          - "Each cancelled OrderLine with a non-terminal Specimen marks Specimen REJECTED (cascade hop 2)"
          - "Any BOOKED Appointment for the order -> CANCELLED"
          - "Payment refund per payment axis (AUTHORIZED -> REFUNDED, or CAPTURED -> REFUNDED with HSA restore) (cascade hop 3)"
          - "Increments Order.version by 1"

  # ---- LabResult: non-linear release with critical-value branch ----
  - entity: LabResult
    initial_state: PROCESSING
    terminal_states: [RELEASED, AMENDED]
    transitions:
      - from: PROCESSING
        to: RELEASED
        trigger: "POST /catalog/lab-results/{id}/release"
        actor: LabTech
        preconditions:
          - "LabResult.status == PROCESSING (ERR_RESULT_NOT_RELEASABLE)"
          - "provisional_flag != CRITICAL (a CRITICAL result must route through callback first) (ERR_CRITICAL_CALLBACK_REQUIRED)"
          - "X-User-ID != Specimen.collected_by_user_id (segregation of duties) (ERR_SOD_COLLECTOR_CANNOT_RELEASE)"
        side_effects:
          - "final_flag computed via result_final_flag delta-check"
          - "OrderLine -> RESULTED; Specimen -> RESULTED (cascade hop 1)"
          - "Order.invoiced_total recomputed; fulfillment bubbles (cascade hop 2)"
          - "If final_flag in {ABNORMAL, CRITICAL} and Patient.consent_share_results: a TelehealthReferral is minted OPEN (cascade hop 3)"
      - from: PROCESSING
        to: PENDING_CRITICAL_CALLBACK
        trigger: "system at processing when provisional_flag == CRITICAL"
        actor: system
        preconditions:
          - "provisional_flag == CRITICAL"
        side_effects:
          - "Result parked; release blocked until callback acknowledged"
      - from: PENDING_CRITICAL_CALLBACK
        to: RELEASED
        trigger: "POST /catalog/lab-results/{id}/acknowledge-critical then POST .../release"
        actor: LabTech
        preconditions:
          - "critical_acknowledged == true (ERR_CRITICAL_CALLBACK_REQUIRED)"
          - "X-User-ID != Specimen.collected_by_user_id (ERR_SOD_COLLECTOR_CANNOT_RELEASE)"
        side_effects:
          - "final_flag computed; OrderLine/Specimen RESULTED; invoice recompute; referral mint per release rule (full cascade)"
      - from: RELEASED
        to: AMENDED
        trigger: "POST /catalog/lab-results/{id}/amend"
        actor: LabTech
        preconditions:
          - "LabResult.status == RELEASED (ERR_RESULT_NOT_AMENDABLE)"
        side_effects:
          - "analyzer_value replaced; flags recomputed; if flag escalated to ABNORMAL/CRITICAL and none open, a referral is minted (consent permitting)"

  # ---- Appointment: PSC booking lifecycle ----
  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /catalog/appointments/{id}/check-in"
        actor: PhlebotomyTech
        preconditions:
          - "Appointment.status == BOOKED (ERR_APPOINTMENT_NOT_CHECKED_IN is for the collect side; check-in on a non-BOOKED appointment is rejected as an invalid transition)"
          - "If any order line offering requires_fasting, Appointment.fasting_confirmed == true (ERR_FASTING_NOT_CONFIRMED)"
        side_effects:
          - "Enables OrderLine collection for the PSC order"
      - from: BOOKED
        to: CANCELLED
        trigger: "system on Order cancellation"
        actor: system
        preconditions:
          - "Owning Order is being cancelled"
        side_effects: []

  # ---- AnalyzerRun: simple reservation lifecycle ----
  - entity: AnalyzerRun
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /catalog/analyzer-runs/{id}/release"
        actor: LabTech
        preconditions:
          - "AnalyzerRun.status == RESERVED (ERR_ANALYZER_RUN_NOT_RELEASABLE)"
        side_effects:
          - "Slot freed: a RELEASED run no longer participates in buffer-extended overlap checks"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: cart-checkout-stale-cart
    parent_entity: Cart
    write_endpoint: "POST /catalog/orders"
    occ_field: "expected_cart_version"
    description: |
      Placing an Order from a Cart whose version has advanced since the client
      last observed it is rejected. Adding/removing a CartLine (which legitimately
      re-prices the cart and may change estimated_patient_due_cents) bumps
      Cart.version; a checkout still carrying the pre-edit version is stale and
      must not lock in an outdated quote.
    error_id: ERR_STALE_CART_VERSION
    http_status: 412
  - rule_id: order-capture-stale-order
    parent_entity: Order
    write_endpoint: "POST /catalog/orders/{id}/capture-payment"
    occ_field: "expected_order_version"
    description: |
      Capturing payment against an Order whose version has advanced since the
      client last observed it is rejected. A result release or specimen reject
      legitimately recomputes invoiced_total_cents / patient_due_cents and bumps
      Order.version; a capture carrying the stale version would settle an
      outdated amount.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cart_estimated_total
    trigger: "every CartLine add/remove; recomputed on POST/DELETE cart-lines and read on GET cart"
    algorithm: tiered_pricing
    formula: |
      # ---- Pricing domain, FORWARD-LOOKING variant (all lines assumed fulfilled) ----
      # Step A — bundle substitution (deterministic order: bundles sorted by
      #   bundle_code ASC, then created_at ASC for ties):
      #   remaining = multiset of line test_codes
      #   subtotal = 0; matched_codes = {}
      #   for each ACTIVE PanelBundle in (bundle_code ASC, created_at ASC):
      #     if every member_test_code has an unmatched line in remaining:
      #       subtotal += bundle_price_cents
      #       move those lines' codes from remaining into matched_codes
      #   for each still-unmatched line L:
      #     line_base = L.unit_list_price_cents
      #     # Step B — per-line repeat discount, ROUNDED PER LINE (round half up)
      #     if L.repeat_discount_applied:
      #        line_net = round_half_up(line_base * (1 - REPEAT_DISCOUNT_RATE))
      #     else:
      #        line_net = line_base
      #     subtotal += line_net
      #   # NOTE: rounding is per-line then summed (NOT sum-then-round). Pinned.
      #
      # Step C — platform tier discount keyed on subtotal tier:
      #   if subtotal >= PLATFORM_TIER2_CENTS: rate = PLATFORM_TIER2_RATE (0.15)
      #   elif subtotal >= PLATFORM_TIER1_CENTS: rate = PLATFORM_TIER1_RATE (0.10)
      #   else: rate = 0
      #   estimated_total_cents = subtotal - round_half_up(subtotal * rate)
      #
      # Step D — HSA/FSA application (only if Cart.fund_source == HSA_FSA):
      #   estimated_hsa_applied_cents = min(Patient.hsa_balance_cents, estimated_total_cents)
      #   else estimated_hsa_applied_cents = 0
      #   estimated_patient_due_cents = estimated_total_cents - estimated_hsa_applied_cents
    input_set: "All CartLine rows of the OPEN cart; bundle members matched greedily in (bundle_code ASC, created_at ASC) order; each line counted once."
    constants:
      REPEAT_DISCOUNT_RATE: 0.15
      PLATFORM_TIER1_CENTS: 20000   # >= $200 subtotal -> 10%
      PLATFORM_TIER1_RATE: 0.10
      PLATFORM_TIER2_CENTS: 50000   # >= $500 subtotal -> 15%
      PLATFORM_TIER2_RATE: 0.15
    precision: "integer cents; round_half_up at each pinned rounding point (per-line repeat discount, then platform discount)"
    variants:
      - name: forward_looking_cart
        when: "Computed on the Cart over ALL lines, before any fulfillment"
        difference: "Includes every line regardless of eventual specimen outcome"

  - name: order_final_invoiced_total
    trigger: "each OrderLine RESULTED (result release) and each specimen reject; recomputed on Order"
    algorithm: chronological
    formula: |
      # ---- Pricing domain, CHRONOLOGICAL variant (only RESULTED lines billed) ----
      # Identical pricing arithmetic as cart_estimated_total BUT the input_set is
      # the subset of OrderLines whose status == RESULTED at recompute time.
      # billable = [ol for ol in order.order_lines if ol.status == RESULTED]
      # Step A bundle substitution runs ONLY over billable lines' test_codes:
      #   a bundle's flat price applies only if ALL its members are RESULTED.
      #   (A partially-resulted bundle bills its resulted members at line price.)
      # Steps B/C/D identical (per-line repeat discount round-then-sum,
      #   platform tier discount on the billable subtotal, then HSA application
      #   using min(remaining Patient.hsa_balance_cents, total)).
      # invoiced_total_cents, hsa_applied_cents, patient_due_cents updated.
    input_set: "OrderLines with status == RESULTED only; REJECTED/CANCELLED/COLLECTED/ORDERED lines excluded."
    constants:
      REPEAT_DISCOUNT_RATE: 0.15
      PLATFORM_TIER1_CENTS: 20000
      PLATFORM_TIER1_RATE: 0.10
      PLATFORM_TIER2_CENTS: 50000
      PLATFORM_TIER2_RATE: 0.15
    precision: "integer cents; round_half_up, same pinned order as cart_estimated_total"
    variants:
      - name: chronological_order
        when: "Computed on the Order as lines result over time"
        difference: "Bundle flat price requires ALL members RESULTED; excludes rejected/cancelled lines, so it can diverge from the cart estimate for the same patient inputs"

  - name: hsa_capture_split
    trigger: "POST capture-payment; cancel refund (compensating)"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c) circular-looking dependency, evaluation order PINNED:
      #   patient_due = invoiced_total - hsa_applied
      #   hsa_applied = min(Patient.hsa_balance_cents, total_after_platform_discount)
      # The discount tier keys off the *total* and the HSA draw keys off the
      # discounted total, so they look circular. Pinned order:
      #   1. compute total_after_platform_discount (Step C of order_final_invoiced_total)
      #   2. THEN hsa_applied = min(hsa_balance, that total)
      #   3. THEN patient_due = total - hsa_applied
      # At CAPTURE: debit Patient.hsa_balance_cents by hsa_applied_cents exactly once.
    input_set: "Order.invoiced_total_cents (already discount-resolved) and Patient.hsa_balance_cents at capture time."
    constants:
      MIN_HSA_DRAW_CENTS: 0
    precision: "integer cents"

  - name: result_provisional_flag
    trigger: "POST /catalog/specimens/{id}/process (LabResult minted)"
    algorithm: threshold
    formula: |
      # Clinical domain, PROVISIONAL variant — bounds only, NO history.
      #   v = analyzer_value
      #   if (critical_low != null and v <= critical_low) or
      #      (critical_high != null and v >= critical_high): provisional_flag = CRITICAL
      #   elif (ref_low != null and v < ref_low) or
      #        (ref_high != null and v > ref_high):          provisional_flag = ABNORMAL
      #   else:                                               provisional_flag = NORMAL
      # Boundary precision PINNED: critical uses <= / >= (inclusive),
      #   reference uses < / > (strict); a value exactly == ref_high is NORMAL.
    input_set: "Single LabResult.analyzer_value against its TestOffering bounds (resolved via test_code)."
    constants: {}
    precision: "exact numeric comparison; critical bounds inclusive, reference bounds strict"

  - name: result_final_flag
    trigger: "POST /catalog/lab-results/{id}/release (and amend)"
    algorithm: chronological
    formula: |
      # Clinical domain, FINAL variant — adds a DELTA-CHECK vs history.
      #   base = result_provisional_flag(v)
      #   prior = most-recent RELEASED LabResult for the same patient_id + test_code
      #           with created_at < this result's created_at (tie-break created_at ASC,
      #           i.e. the latest strictly-prior release). null if none.
      #   if prior != null and abs(v - prior.analyzer_value) >= DELTA_CHECK_ABS:
      #       # a large swing escalates one severity step
      #       final_flag = escalate(base):  NORMAL->ABNORMAL, ABNORMAL->CRITICAL, CRITICAL->CRITICAL
      #   else:
      #       final_flag = base
      # So the SAME analyzer_value that is NORMAL provisionally can be ABNORMAL
      # finally once a prior result makes the delta large — dual-variant divergence.
    input_set: "This result's analyzer_value + the patient's most-recent strictly-prior RELEASED result for the same test_code."
    constants:
      DELTA_CHECK_ABS: 50   # absolute analyzer-unit swing that escalates one step
    precision: "exact numeric comparison; >= DELTA_CHECK_ABS escalates"
    variants:
      - name: provisional_no_history
        when: "At processing"
        difference: "Bounds only; ignores prior results"
      - name: final_with_delta
        when: "At release"
        difference: "Escalates one severity step when the absolute swing vs the most-recent prior release is >= DELTA_CHECK_ABS"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity-backed Patient actions on owned resources, X-User-ID equals the resource's patient_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /catalog/orders, cart line edits, capture-payment, cancel, resubmit"
  - priority: 4
    category: existence
    check: "All path/body resource ids resolve (left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in domain, integers non-negative where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_cart_version / expected_order_version equals current parent version when supplied/required"
    error_id: "ERR_STALE_CART_VERSION / ERR_STALE_ORDER_VERSION"
    http_status: 412
    applies_to: "POST /catalog/orders; POST capture-payment; POST cancel"
    note: "OCC version check runs BEFORE state preconditions on the parent."
  - priority: 7
    category: state
    check: "Target resource is in a state that admits the requested transition"
    error_id: "ERR_*_NOT_* state error (per §1.2)"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_safety
    check: "Critical provisional result must be acknowledged (critical-value callback) before release"
    error_id: ERR_CRITICAL_CALLBACK_REQUIRED
    http_status: 409
    applies_to: "POST /catalog/lab-results/{id}/release"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: the X-User-ID releasing a result must differ from the specimen's collected_by_user_id"
    error_id: ERR_SOD_COLLECTOR_CANNOT_RELEASE
    http_status: 403
    applies_to: "POST /catalog/lab-results/{id}/release"
  - priority: 10
    category: business_safety
    check: "Patient consent_share_results must be true to create a TelehealthReferral"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /catalog/telehealth-referrals; result-release referral cascade is silently skipped (no error) when consent absent"
  - priority: 11
    category: business_referential
    check: "PWN: physician-order-required line cannot be collected without an APPROVED PhysicianOrder"
    error_id: ERR_PHYSICIAN_ORDER_REQUIRED
    http_status: 409
    applies_to: "POST /catalog/order-lines/{id}/collect"
  - priority: 12
    category: business_referential
    check: "PWN licensure: physician order approval requires the patient's state in PWN_LICENSED_STATES"
    error_id: ERR_PWN_STATE_UNLICENSED
    http_status: 409
    applies_to: "POST /catalog/physician-orders/{id}/decision (APPROVE)"
  - priority: 13
    category: business_constraint
    check: "PWN age: patient derived age >= PWN_MIN_AGE_YEARS for approval"
    error_id: ERR_PWN_AGE_INELIGIBLE
    http_status: 409
    applies_to: "POST /catalog/physician-orders/{id}/decision (APPROVE)"
  - priority: 14
    category: business_temporal
    check: "Appointment slot_end strictly after slot_start"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /catalog/appointments"
  - priority: 15
    category: business_temporal
    check: "New appointment slot must not overlap an existing BOOKED/CHECKED_IN appointment at the same psc_location_code (half-open [start,end) overlap)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /catalog/appointments"
  - priority: 15.5
    category: business_temporal
    check: "New analyzer run must not overlap a RESERVED run on the same analyzer_code under buffer-extended semantics: non-overlap holds only when new.run_start >= prior.run_end + prior.buffer_minutes OR prior.run_start >= new.run_end + new.buffer_minutes; otherwise reject"
    error_id: ERR_ANALYZER_RUN_OVERLAP
    http_status: 409
    applies_to: "POST /catalog/analyzer-runs"
    note: "Differs from appointment overlap: appointments use bare half-open [start,end) adjacency (touching slots OK); analyzer runs add a mandatory buffer gap after run_end, so two runs that merely touch still overlap."
  - priority: 16
    category: business_constraint
    check: "Fasting attestation: if any order line offering requires_fasting, Appointment.fasting_confirmed must be true"
    error_id: ERR_FASTING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /catalog/appointments; POST appointment check-in"
  - priority: 17
    category: business_referential
    check: "Home-kit shipping_state_code must equal patient state_code and not be in HOME_KIT_BANNED_STATES; offering must be home_kit_eligible"
    error_id: ERR_HOME_KIT_STATE_BANNED
    http_status: 409
    applies_to: "POST /catalog/orders (HOME_KIT); POST /catalog/home-kits"
  - priority: 18
    category: business_constraint
    check: "Cart line offering must be ACTIVE (not ARCHIVED) and cart must be OPEN"
    error_id: ERR_OFFERING_NOT_ADDABLE
    http_status: 409
    applies_to: "POST /catalog/cart-lines"
  - priority: 19
    category: business_constraint
    check: "Cannot checkout an empty cart (line_count == 0)"
    error_id: ERR_EMPTY_CART
    http_status: 409
    applies_to: "POST /catalog/orders"
  - priority: 20
    category: business_fiscal
    check: "HSA/FSA: at capture, the required HSA draw must not exceed Patient.hsa_balance_cents"
    error_id: ERR_INSUFFICIENT_HSA_FUNDS
    http_status: 402
    applies_to: "POST /catalog/orders/{id}/capture-payment (fund_source HSA_FSA)"
  - priority: 21
    category: business_constraint
    check: "PanelBundle members must reference distinct ACTIVE offerings, >= 2 members"
    error_id: ERR_INVALID_BUNDLE_MEMBERS
    http_status: 422
    applies_to: "POST /catalog/panel-bundles"
  - priority: 22
    category: business_constraint
    check: "Uniqueness: test_code unique among non-ARCHIVED TestOfferings; bundle_code unique among non-ARCHIVED bundles; Patient.email unique"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /catalog/test-offerings; POST /catalog/panel-bundles; POST /catalog/patients"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test catalog ----
  - method: POST
    path: "/catalog/test-offerings"
    description: "Create a test offering"
    roles: [CatalogAdmin]
    code: 201
    input: [test_code, display_name, list_price_cents, specimen_type, "home_kit_eligible?", "requires_fasting?", "critical_low?", "critical_high?", "ref_low?", "ref_high?"]
    output: TestOffering
    side_effects: ["status=ACTIVE; test_code uniqueness enforced among non-ARCHIVED"]
  - method: GET
    path: "/catalog/test-offerings"
    description: "List test offerings (paginated; includes ARCHIVED only with include_archived=true)"
    roles: [CatalogAdmin, Patient, LabTech, PhlebotomyTech, OrderingPhysician]
    code: 200
    input: ["status?", "include_archived?", "limit?", "offset?"]
    output: "TestOffering[]"
    side_effects: []
  - method: GET
    path: "/catalog/test-offerings/{id}"
    description: "Get one offering"
    roles: [CatalogAdmin, Patient, LabTech, PhlebotomyTech, OrderingPhysician]
    code: 200
    input: []
    output: TestOffering
    side_effects: []
  - method: POST
    path: "/catalog/test-offerings/{id}/archive"
    description: "Soft-delete (archive) an offering"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: TestOffering
    side_effects: ["status -> ARCHIVED; remains queryable, cannot be added to carts"]

  # ---- Panel bundles ----
  - method: POST
    path: "/catalog/panel-bundles"
    description: "Create a panel bundle"
    roles: [CatalogAdmin]
    code: 201
    input: [bundle_code, display_name, member_test_codes, bundle_price_cents]
    output: PanelBundle
    side_effects: ["validates >=2 distinct ACTIVE members; bundle_code uniqueness"]
  - method: GET
    path: "/catalog/panel-bundles"
    description: "List panel bundles"
    roles: [CatalogAdmin, Patient, LabTech, PhlebotomyTech, OrderingPhysician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PanelBundle[]"
    side_effects: []
  - method: GET
    path: "/catalog/panel-bundles/{id}"
    description: "Get one bundle"
    roles: [CatalogAdmin, Patient]
    code: 200
    input: []
    output: PanelBundle
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/catalog/patients"
    description: "Register a patient"
    roles: [CatalogAdmin, Patient]
    code: 201
    input: [email, full_name, date_of_birth, state_code, "hsa_balance_cents?", "consent_share_results?"]
    output: Patient
    side_effects: ["status=ACTIVE; email uniqueness"]
  - method: GET
    path: "/catalog/patients/{id}"
    description: "Get a patient (self or admin)"
    roles: [CatalogAdmin, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: PATCH
    path: "/catalog/patients/{id}"
    description: "Update patient consent / HSA balance (self or admin)"
    roles: [CatalogAdmin, Patient]
    code: 200
    input: ["consent_share_results?", "hsa_balance_cents?"]
    output: Patient
    side_effects: ["updates consent flag and/or HSA balance"]

  # ---- Carts & lines ----
  - method: POST
    path: "/catalog/carts"
    description: "Open a new cart for a patient"
    roles: [Patient]
    code: 201
    input: [patient_id, "fund_source?"]
    output: Cart
    side_effects: ["status=OPEN; totals initialized to 0"]
  - method: GET
    path: "/catalog/carts"
    description: "List carts (filterable by patient_id)"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "Cart[]"
    side_effects: []
  - method: GET
    path: "/catalog/carts/{id}"
    description: "Get a cart with computed totals"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: []
    output: Cart
    side_effects: ["recomputes estimated totals via cart_estimated_total on read"]
  - method: PATCH
    path: "/catalog/carts/{id}"
    description: "Change cart fund_source (re-prices)"
    roles: [Patient]
    code: 200
    input: ["fund_source"]
    output: Cart
    side_effects: ["re-runs cart_estimated_total; increments Cart.version by 1"]
  - method: POST
    path: "/catalog/cart-lines"
    description: "Add a line to an OPEN cart"
    roles: [Patient]
    code: 201
    input: [cart_id, test_offering_id]
    output: CartLine
    side_effects:
      - "snapshots test_code + unit_list_price_cents"
      - "computes repeat_discount_applied from patient RELEASED history within REPEAT_LOOKBACK_DAYS"
      - "recomputes Cart.subtotal/estimated totals; line_count += 1; increments Cart.version by 1"
  - method: GET
    path: "/catalog/cart-lines"
    description: "List cart lines (filterable by cart_id, test_offering_id)"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: ["cart_id?", "test_offering_id?", "limit?", "offset?"]
    output: "CartLine[]"
    side_effects: []
  - method: GET
    path: "/catalog/cart-lines/{id}"
    description: "Get one cart line"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: []
    output: CartLine
    side_effects: []
  - method: DELETE
    path: "/catalog/cart-lines/{id}"
    description: "Remove a line from an OPEN cart"
    roles: [Patient]
    code: 200
    input: []
    output: Cart
    side_effects: ["line_count -= 1; recomputes Cart totals; increments Cart.version by 1"]

  # ---- Orders (checkout consumes cart) ----
  - method: POST
    path: "/catalog/orders"
    description: "Place an order from a checked-out cart (OCC on Cart.version)"
    roles: [Patient]
    code: 201
    input: [cart_id, fulfillment_mode, expected_cart_version]
    output: Order
    side_effects:
      - "Cart.status -> CHECKED_OUT; OrderLines minted from CartLines (status ORDERED)"
      - "requires_physician_order set per PWN_RESTRICTED_TEST_CODES; a SUBMITTED PhysicianOrder minted per restricted line"
      - "Payment minted AUTHORIZED for Cart.estimated_patient_due_cents; payment_status=AUTHORIZED"
      - "fulfillment_status=AWAITING_COLLECTION; fund_source snapshot"
      - "HOME_KIT mode validates shipping eligibility"
  - method: GET
    path: "/catalog/orders/{id}"
    description: "Get an order with both status axes and totals"
    roles: [Patient, CatalogAdmin, LabTech, PhlebotomyTech]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/catalog/orders"
    description: "List orders (filterable by patient_id, cart_id)"
    roles: [Patient, CatalogAdmin, LabTech]
    code: 200
    input: ["patient_id?", "cart_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: POST
    path: "/catalog/orders/{id}/capture-payment"
    description: "Capture payment on a COMPLETED order (OCC on Order.version)"
    roles: [Patient]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "payment_status AUTHORIZED -> CAPTURED; captured_amount = patient_due_cents"
      - "HSA_FSA: debit Patient.hsa_balance_cents by hsa_applied_cents"
      - "increments Order.version by 1"
  - method: POST
    path: "/catalog/orders/{id}/cancel"
    description: "Cancel an order (no resulted lines), refunding/compensating (OCC on Order.version)"
    roles: [Patient]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED; non-terminal OrderLines -> CANCELLED; non-terminal Specimens -> REJECTED"
      - "payment AUTHORIZED -> REFUNDED, or CAPTURED -> REFUNDED with HSA restore (hsa conserved)"
      - "increments Order.version by 1"
  - method: GET
    path: "/catalog/order-lines"
    description: "List order lines (filterable by order_id, test_offering_id)"
    roles: [Patient, CatalogAdmin, LabTech, PhlebotomyTech]
    code: 200
    input: ["order_id?", "test_offering_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/catalog/order-lines/{id}"
    description: "Get one order line"
    roles: [Patient, CatalogAdmin, LabTech, PhlebotomyTech]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/catalog/order-lines/{id}/collect"
    description: "Collect a specimen for an order line (PSC tech action)"
    roles: [PhlebotomyTech]
    code: 201
    input: []
    output: Specimen
    side_effects:
      - "Specimen minted COLLECTED; collected_by_user_id=X-User-ID; OrderLine -> COLLECTED"
      - "Order.fulfillment_status AWAITING_COLLECTION -> IN_PROCESSING (first collect)"

  # ---- Physician orders (PWN) ----
  - method: GET
    path: "/catalog/physician-orders"
    description: "List physician orders (filterable by order_line_id, patient_id, status)"
    roles: [OrderingPhysician, Patient, CatalogAdmin]
    code: 200
    input: ["order_line_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "PhysicianOrder[]"
    side_effects: []
  - method: GET
    path: "/catalog/physician-orders/{id}"
    description: "Get a physician order"
    roles: [OrderingPhysician, Patient, CatalogAdmin]
    code: 200
    input: []
    output: PhysicianOrder
    side_effects: []
  - method: POST
    path: "/catalog/physician-orders/{id}/decision"
    description: "Physician review decision (APPROVE | DECLINE | REQUEST_INFO)"
    roles: [OrderingPhysician]
    code: 200
    input: [decision, "clinical_note?"]
    output: PhysicianOrder
    side_effects:
      - "APPROVE: status -> APPROVED (validates PWN state + age); line becomes collectible"
      - "DECLINE: status -> DECLINED; OrderLine -> REJECTED; fulfillment bubbles (cascade)"
      - "REQUEST_INFO: status -> NEEDS_MORE_INFO"
      - "reviewing_physician_id=X-User-ID"
  - method: POST
    path: "/catalog/physician-orders/{id}/resubmit"
    description: "Patient resubmits a NEEDS_MORE_INFO order (cyclic back to SUBMITTED)"
    roles: [Patient]
    code: 200
    input: ["clinical_note?"]
    output: PhysicianOrder
    side_effects: ["status NEEDS_MORE_INFO -> SUBMITTED"]

  # ---- Appointments (PSC) ----
  - method: POST
    path: "/catalog/appointments"
    description: "Book a PSC appointment for an order"
    roles: [Patient]
    code: 201
    input: [order_id, psc_location_code, slot_start, slot_end, "fasting_confirmed?"]
    output: Appointment
    side_effects: ["status=BOOKED; validates slot window, overlap, fasting"]
  - method: GET
    path: "/catalog/appointments"
    description: "List appointments (filterable by order_id, psc_location_code)"
    roles: [Patient, CatalogAdmin, PhlebotomyTech]
    code: 200
    input: ["order_id?", "psc_location_code?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/catalog/appointments/{id}"
    description: "Get one appointment"
    roles: [Patient, CatalogAdmin, PhlebotomyTech]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/catalog/appointments/{id}/check-in"
    description: "Check in a booked appointment (enables collection)"
    roles: [PhlebotomyTech]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CHECKED_IN; re-validates fasting"]

  # ---- Home kits ----
  - method: POST
    path: "/catalog/home-kits"
    description: "Mint/ship a home kit for a HOME_KIT order"
    roles: [CatalogAdmin, Patient]
    code: 201
    input: [order_id, shipping_state_code]
    output: HomeKit
    side_effects: ["status=SHIPPED; tracking_code minted; validates state eligibility"]
  - method: GET
    path: "/catalog/home-kits"
    description: "List home kits (filterable by order_id)"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "HomeKit[]"
    side_effects: []
  - method: GET
    path: "/catalog/home-kits/{id}"
    description: "Get one home kit"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: []
    output: HomeKit
    side_effects: []

  # ---- Specimens & results ----
  - method: GET
    path: "/catalog/specimens"
    description: "List specimens (filterable by order_line_id)"
    roles: [LabTech, PhlebotomyTech, CatalogAdmin, Patient]
    code: 200
    input: ["order_line_id?", "limit?", "offset?"]
    output: "Specimen[]"
    side_effects: []
  - method: GET
    path: "/catalog/specimens/{id}"
    description: "Get one specimen"
    roles: [LabTech, PhlebotomyTech, CatalogAdmin, Patient]
    code: 200
    input: []
    output: Specimen
    side_effects: []
  - method: POST
    path: "/catalog/specimens/{id}/process"
    description: "Enter analyzer value; mints a LabResult and computes provisional_flag"
    roles: [LabTech]
    code: 201
    input: [analyzer_value]
    output: LabResult
    side_effects:
      - "Specimen COLLECTED -> IN_ANALYSIS"
      - "LabResult minted; provisional_flag via result_provisional_flag"
      - "If provisional_flag==CRITICAL: LabResult -> PENDING_CRITICAL_CALLBACK else PROCESSING"
  - method: POST
    path: "/catalog/specimens/{id}/reject"
    description: "Reject an unusable specimen (lab tech)"
    roles: [LabTech]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "Specimen -> REJECTED; OrderLine -> REJECTED"
      - "Order.invoiced_total recomputed; fulfillment bubbles per cascade"
  - method: GET
    path: "/catalog/lab-results"
    description: "List lab results (filterable by specimen_id, order_line_id, patient_id)"
    roles: [LabTech, CatalogAdmin, Patient]
    code: 200
    input: ["specimen_id?", "order_line_id?", "patient_id?", "limit?", "offset?"]
    output: "LabResult[]"
    side_effects: []
  - method: GET
    path: "/catalog/lab-results/{id}"
    description: "Get one lab result"
    roles: [LabTech, CatalogAdmin, Patient]
    code: 200
    input: []
    output: LabResult
    side_effects: []
  - method: POST
    path: "/catalog/lab-results/{id}/acknowledge-critical"
    description: "Log the critical-value callback for a PENDING_CRITICAL_CALLBACK result"
    roles: [LabTech]
    code: 200
    input: []
    output: LabResult
    side_effects: ["critical_acknowledged=true"]
  - method: POST
    path: "/catalog/lab-results/{id}/release"
    description: "Release a result (SoD + critical-callback gated); fires the full result cascade"
    roles: [LabTech]
    code: 200
    input: []
    output: LabResult
    side_effects:
      - "status -> RELEASED; final_flag via result_final_flag (delta-check)"
      - "OrderLine -> RESULTED; Specimen -> RESULTED; Order.invoiced_total recomputed; fulfillment bubbles"
      - "If final_flag in {ABNORMAL,CRITICAL} and consent: TelehealthReferral minted OPEN"
  - method: POST
    path: "/catalog/lab-results/{id}/amend"
    description: "Amend a released result (new analyzer value, recompute flags)"
    roles: [LabTech]
    code: 200
    input: [analyzer_value]
    output: LabResult
    side_effects: ["status -> AMENDED; flags recomputed; referral minted if escalated and none open (consent permitting)"]

  # ---- Telehealth referrals ----
  - method: POST
    path: "/catalog/telehealth-referrals"
    description: "Manually create a referral from a RELEASED abnormal/critical result (consent gated)"
    roles: [LabTech, CatalogAdmin]
    code: 201
    input: [lab_result_id]
    output: TelehealthReferral
    side_effects: ["status=OPEN; referral_reason mirrors final_flag; ERR_CONSENT_REQUIRED if patient consent absent"]
  - method: GET
    path: "/catalog/telehealth-referrals"
    description: "List referrals (filterable by lab_result_id, patient_id)"
    roles: [LabTech, CatalogAdmin, Patient]
    code: 200
    input: ["lab_result_id?", "patient_id?", "limit?", "offset?"]
    output: "TelehealthReferral[]"
    side_effects: []
  - method: GET
    path: "/catalog/telehealth-referrals/{id}"
    description: "Get one telehealth referral"
    roles: [LabTech, CatalogAdmin, Patient]
    code: 200
    input: []
    output: TelehealthReferral
    side_effects: []
  - method: POST
    path: "/catalog/telehealth-referrals/{id}/schedule"
    description: "Move a referral to SCHEDULED"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: []
    output: TelehealthReferral
    side_effects: ["status OPEN -> SCHEDULED"]

  # ---- Analyzer runs (lab equipment reservations; buffered overlap) ----
  - method: POST
    path: "/catalog/analyzer-runs"
    description: "Reserve an analyzer run window (buffer-extended overlap on analyzer_code)"
    roles: [LabTech]
    code: 201
    input: [analyzer_code, run_start, run_end, "buffer_minutes?"]
    output: AnalyzerRun
    side_effects: ["status=RESERVED; validates run window and buffered overlap"]
  - method: GET
    path: "/catalog/analyzer-runs"
    description: "List analyzer runs (filterable by analyzer_code)"
    roles: [LabTech, CatalogAdmin]
    code: 200
    input: ["analyzer_code?", "limit?", "offset?"]
    output: "AnalyzerRun[]"
    side_effects: []
  - method: POST
    path: "/catalog/analyzer-runs/{id}/release"
    description: "Release an analyzer reservation (frees the slot for future runs)"
    roles: [LabTech]
    code: 200
    input: []
    output: AnalyzerRun
    side_effects: ["status RESERVED -> RELEASED; freed slot no longer blocks overlap"]

  # ---- Payments (reverse-reachability for Order FK) ----
  - method: GET
    path: "/catalog/payments"
    description: "List payments (filterable by order_id)"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: GET
    path: "/catalog/payments/{id}"
    description: "Get one payment"
    roles: [Patient, CatalogAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/catalog/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CatalogAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock set; governs collected_at, repeat-discount lookback, slot comparisons"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Patient X-User-ID is not the owner (patient_id) of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, negative integer where forbidden" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "test_code/bundle_code not unique among non-ARCHIVED, or patient email duplicate" }
  - { id: ERR_INVALID_BUNDLE_MEMBERS, http: 422, condition: "Bundle has < 2 distinct members or a member is not an ACTIVE offering" }
  - { id: ERR_OFFERING_NOT_ADDABLE, http: 409, condition: "Offering ARCHIVED or cart not OPEN when adding a line" }
  - { id: ERR_EMPTY_CART, http: 409, condition: "Checkout attempted on a cart with line_count == 0" }
  - { id: ERR_STALE_CART_VERSION, http: 412, condition: "expected_cart_version != current Cart.version at checkout" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version != current Order.version at capture/cancel" }
  - { id: ERR_ORDER_LINE_NOT_COLLECTIBLE, http: 409, condition: "OrderLine not in ORDERED when collect/reject-before-collect attempted" }
  - { id: ERR_ORDER_NOT_COLLECTABLE_STATE, http: 409, condition: "Order fulfillment_status not in {AWAITING_COLLECTION, IN_PROCESSING} for collection" }
  - { id: ERR_PHYSICIAN_ORDER_REQUIRED, http: 409, condition: "Collecting a PWN-restricted line without an APPROVED PhysicianOrder" }
  - { id: ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE, http: 409, condition: "Decision attempted on a PhysicianOrder not in SUBMITTED" }
  - { id: ERR_PHYSICIAN_ORDER_NOT_RESUBMITTABLE, http: 409, condition: "Resubmit attempted on a PhysicianOrder not in NEEDS_MORE_INFO" }
  - { id: ERR_PWN_STATE_UNLICENSED, http: 409, condition: "Approval attempted but patient state_code not in PWN_LICENSED_STATES" }
  - { id: ERR_PWN_AGE_INELIGIBLE, http: 409, condition: "Approval attempted but patient derived age < PWN_MIN_AGE_YEARS" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "PSC collection attempted with no CHECKED_IN appointment for the order" }
  - { id: ERR_INVALID_SLOT_WINDOW, http: 422, condition: "Appointment slot_end not strictly after slot_start" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New slot overlaps an existing BOOKED/CHECKED_IN appointment at the same psc_location_code (half-open)" }
  - { id: ERR_ANALYZER_RUN_OVERLAP, http: 409, condition: "New analyzer run overlaps a RESERVED run on the same analyzer_code under buffer-extended semantics" }
  - { id: ERR_ANALYZER_RUN_NOT_RELEASABLE, http: 409, condition: "Analyzer run release attempted when not in RESERVED" }
  - { id: ERR_FASTING_NOT_CONFIRMED, http: 409, condition: "An order line requires fasting but Appointment.fasting_confirmed is false" }
  - { id: ERR_HOME_KIT_STATE_BANNED, http: 409, condition: "Home-kit state mismatch/banned, or offering not home_kit_eligible" }
  - { id: ERR_SPECIMEN_NOT_REJECTABLE, http: 409, condition: "Specimen reject attempted when specimen not in {COLLECTED, IN_ANALYSIS}" }
  - { id: ERR_RESULT_NOT_RELEASABLE, http: 409, condition: "Release attempted on a result not in PROCESSING/PENDING_CRITICAL_CALLBACK" }
  - { id: ERR_CRITICAL_CALLBACK_REQUIRED, http: 409, condition: "Release attempted on a CRITICAL result before critical_acknowledged is true" }
  - { id: ERR_SOD_COLLECTOR_CANNOT_RELEASE, http: 403, condition: "Releasing X-User-ID equals the specimen's collected_by_user_id (segregation of duties)" }
  - { id: ERR_RESULT_NOT_AMENDABLE, http: 409, condition: "Amend attempted on a result not in RELEASED" }
  - { id: ERR_CONSENT_REQUIRED, http: 403, condition: "Telehealth referral creation when patient consent_share_results is false" }
  - { id: ERR_ORDER_HAS_RESULTED_LINES, http: 409, condition: "Cancel attempted on an order that already has a RESULTED line" }
  - { id: ERR_ORDER_NOT_COMPLETE_FOR_CAPTURE, http: 409, condition: "Capture attempted before fulfillment_status == COMPLETED" }
  - { id: ERR_PAYMENT_NOT_CAPTURABLE, http: 409, condition: "Capture attempted when payment_status != AUTHORIZED" }
  - { id: ERR_PAYMENT_NOT_REFUNDABLE, http: 409, condition: "Refund/cancel-refund attempted when payment not in {AUTHORIZED, CAPTURED}" }
  - { id: ERR_INSUFFICIENT_HSA_FUNDS, http: 402, condition: "Required HSA draw at capture exceeds Patient.hsa_balance_cents" }
  - { id: ERR_RESULT_NOT_PROCESSABLE, http: 409, condition: "Process attempted on a specimen not in COLLECTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Platform operator: manages catalog (offerings, bundles), patients, clock; read-all."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog/test-offerings — create offering"
      - "POST /catalog/test-offerings/{id}/archive — archive offering"
      - "POST /catalog/panel-bundles — create bundle"
      - "POST /catalog/_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /catalog/patients — register patient (shared with Patient self-register)"
      - "PATCH /catalog/patients/{id} — update consent/HSA (shared with Patient)"
      - "POST /catalog/home-kits — mint home kit (shared with Patient)"
      - "POST /catalog/telehealth-referrals — manual referral (shared with LabTech)"
      - "POST /catalog/telehealth-referrals/{id}/schedule — schedule referral (shared with Patient)"
      - "GET endpoints — broad read access"

  - name: Patient
    description: "End consumer: owns carts/orders, schedules, resubmits physician orders, captures/cancels payment."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /catalog/carts — open cart"
      - "PATCH /catalog/carts/{id} — change fund_source"
      - "POST /catalog/cart-lines — add line"
      - "DELETE /catalog/cart-lines/{id} — remove line"
      - "POST /catalog/orders — place order"
      - "POST /catalog/orders/{id}/capture-payment — capture"
      - "POST /catalog/orders/{id}/cancel — cancel/refund"
      - "POST /catalog/appointments — book PSC appointment"
      - "POST /catalog/physician-orders/{id}/resubmit — resubmit PWN order"
    shared_operations:
      - "POST /catalog/patients — self register (shared with CatalogAdmin)"
      - "PATCH /catalog/patients/{id} — update own consent/HSA"
      - "POST /catalog/home-kits — request home kit"
      - "POST /catalog/telehealth-referrals/{id}/schedule — schedule own referral"
      - "GET endpoints — own resources"

  - name: OrderingPhysician
    description: "PWN network physician: reviews physician orders (approve/decline/request-info)."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog/physician-orders/{id}/decision — review decision"
    shared_operations:
      - "GET catalog/test-offerings, panel-bundles, physician-orders — read"

  - name: PhlebotomyTech
    description: "PSC specimen collector: checks in appointments and collects specimens."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog/appointments/{id}/check-in — check in"
      - "POST /catalog/order-lines/{id}/collect — collect specimen"
    shared_operations:
      - "GET orders, order-lines, specimens, appointments — read"

  - name: LabTech
    description: "Lab analyst: processes specimens, acknowledges criticals, releases/amends results, rejects specimens. SoD: cannot release a result for a specimen they collected."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog/specimens/{id}/process — enter analyzer value"
      - "POST /catalog/specimens/{id}/reject — reject specimen"
      - "POST /catalog/lab-results/{id}/acknowledge-critical — log callback"
      - "POST /catalog/lab-results/{id}/release — release result"
      - "POST /catalog/lab-results/{id}/amend — amend result"
    shared_operations:
      - "POST /catalog/telehealth-referrals — manual referral (shared with CatalogAdmin)"
      - "GET orders, order-lines, specimens, lab-results, telehealth-referrals — read"
