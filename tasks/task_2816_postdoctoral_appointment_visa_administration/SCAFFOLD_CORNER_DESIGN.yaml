            - "the mentoring plan approved while its postdoc_acknowledged was still false"
            - "${d51_idp_ack2} == true"
            - "${d51_idp_status} == APPROVED"
            - "DevelopmentDocument.${d51_idp_id}.revision_round == 0"

      - name: a_mentor_at_the_concurrent_load_limit_cannot_have_another_offer_issued
        claim_type: aggregate_validation
        grounds:
          - validations.priority_29_ERR_MENTOR_LOAD_EXCEEDED
          - entities.FacultyMentor.max_concurrent_postdocs
          - entities.FacultyMentor.active_postdoc_count
        distinguishing_aspect: "Each appointment is individually valid - correct classes, verified funding, salary above floor, budget available - but the mentor's max_concurrent_postdocs is 1 and one scholar is already ACTIVE, so the aggregate check refuses the second issue-offer with ERR_MENTOR_LOAD_EXCEEDED (409). The count is read at issue-offer time, so the second appointment must remain DRAFT with no encumbrance posted."
        test_recipe:
          setup:
            - "One mentor with valid training and max_concurrent_postdocs 1."
            - "Two US-citizen scholars needing no sponsorship; one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
            - "Scholar 1's appointment 2026-10-01 to 2027-09-30 at 62000.00 is driven to ACTIVE via a cleared first-cycle export screen, so active_postdoc_count is 1."
            - "Scholar 2's appointment on the same mentor and award is created and left in DRAFT."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "P. Anand", department: "Nanoscience", mentor_training_valid_through: "2029-12-31", max_concurrent_postdocs: 1 }
