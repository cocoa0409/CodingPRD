  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  #   (CatalogItem -> CatalogOrder) and (DistributionCenter -> Shipment)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_release_requires_item_curation_approved
        grounds:
          - state_machines.CatalogOrder.DRAFT_AWAITING_RELEASE_to_RELEASED_AWAITING_RELEASE
          - state_machines.CatalogItem.UNREVIEWED_to_APPROVED
          - state_machines.CatalogItem.APPROVED_to_UNREVIEWED
          - validations[priority=10]
          - entities.CatalogItem.fields.curation_review_state
        distinguishing_aspect: "CatalogOrder -> CatalogItem dependency: the release transition's validity is decided by a field on a different entity entirely — revoking the item's curation review through POST /curation-reviews/{id}/revoke is what flips a RELEASABLE draft order into a rejected one, with 409 ERR_CURATION_NOT_APPROVED and no version bump on the order."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account, one curated item priced 5000 cents, BOS stock of 10 units, one DRAFT order of 2 units."
            - "The item's curation review is still APPROVED when the order was created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-7001", description: "Clevis pin 8x50", material_spec: "304 stainless steel", long_tail: false, unit_price_cents: 5000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 50, nominal_width_mm: 8, nominal_height_mm: 8, drawing_revision: 4 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Pin Diameter", attribute_value: "8.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
              captures: { rev_id: $.data.id }
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /curation-reviews/${rev_id}/revoke"
              payload: {}
              as: CatalogCurator
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "GET /items/${item_id} shows curation_review_state == UNREVIEWED before the release attempt"
            - "the response status is 409 and error_id == ERR_CURATION_NOT_APPROVED"
            - "CatalogOrder.${order_id}.order_status is still DRAFT"
            - "CatalogOrder.${order_id}.version == ${order_v} — the rejected release did not advance the order's version"
            - "CatalogOrder.${order_id}.fulfillment_status is still AWAITING_RELEASE"

      - name: shipment_holds_follow_dc_posture_not_order_state
        grounds:
          - state_machines.DistributionCenter.OPEN_to_LOCKDOWN
          - state_machines.Shipment.CUTOFF_CONFIRMED_to_HELD
          - state_machines.Shipment.HELD_to_CUTOFF_CONFIRMED
          - entities.Shipment.fields.shipment_status
          - entities.DistributionCenter.fields.operations_posture
        distinguishing_aspect: "DistributionCenter -> Shipment dependency: the shipment's own state machine has no client-reachable lock — its CUTOFF_CONFIRMED->HELD transition is driven purely by the DC's operations_posture, so the same shipment that POST /shipments/{id}/dispatch would reject at HELD returns to CUTOFF_CONFIRMED the moment the DC's last hold clears."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05, after its 06:00:00 cutoff."
            - "One account, one curated item priced 7000 cents, BOS stock of 6 units, one order of 2 units picked in full and cut off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-7101", description: "U-bolt 3/8 inch", material_spec: "zinc plated steel", long_tail: false, unit_price_cents: 7000, unit_weight_kg: 0.30, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 90, nominal_width_mm: 40, nominal_height_mm: 40, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Thread Size", attribute_value: "3/8 inch", unit_of_measure: "inch" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 6, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 2 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
              captures: { shipment_id: $.data.id }
            - call: "POST /distribution-centers/${bos_dc_id}/reeducate"
              payload: { hold_action: "RAISE", reason: "posture hold before the dispatch attempt" }
              as: DCManager
          trigger:
            - call: "POST /shipments/${shipment_id}/dispatch"
              payload: {}
              as: DCManager
              captures: { error_id: $.data.error_id }
            - call: "POST /distribution-centers/${bos_dc_id}/reeducate"
              payload: { hold_action: "CLEAR" }
              as: DCManager
            - call: "POST /shipments/${shipment_id}/dispatch"
              payload: {}
              as: DCManager
          assert:
            - "Shipment.${shipment_id}.shipment_status == HELD once the DC posture is LOCKDOWN"
            - "the first dispatch attempt returns 409 with error_id == ERR_INVALID_STATE, because the priority 6 state check sees HELD rather than CUTOFF_CONFIRMED"
            - "after the hold is cleared, Shipment.${shipment_id}.shipment_status == CUTOFF_CONFIRMED again"
            - "the second dispatch succeeds with 200 and Shipment.${shipment_id}.shipment_status == DISPATCHED"
            - "the shipment's freight_charge_cents is identical before and after the LOCKDOWN cycle"

  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  #   semantics A: closed-interval equality — the promise date EQUALS an existing promise date
  #   semantics B: point-interval inverse — the cut-off day EQUALS the rolled cut-off period
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: promise_date_equality_closed_interval_collision
        grounds:
          - validations[priority=13]
          - errors.ERR_PROMISE_DATE_IN_PAST
          - entities.Shipment.fields.promised_delivery_by
          - endpoints.POST_/orders/{id}/confirm_cutoff
        distinguishing_aspect: "Interval semantics: closed-interval equality rather than a strict crossing — a promise EQUAL to the DC's local current day is rejected, a promise exactly one day later is admitted, and a promise two days later is admitted with a different accepted date, so the rule keys on day equality and never on a simple earlier-than comparison."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05, after its 06:00:00 cutoff."
            - "One account, one curated item priced 4000 cents, BOS stock of 10 units."
            - "Three orders each of 1 unit, each released and allocated, with the first order picked so it sits at ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-8001", description: "Anchor bolt 1/2 inch", material_spec: "hot dip galvanized", long_tail: false, unit_price_cents: 4000, unit_weight_kg: 0.25, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 120, nominal_width_mm: 12, nominal_height_mm: 12, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Thread Size", attribute_value: "1/2 inch", unit_of_measure: "inch" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_a_id: $.data.id, order_a_v: $.data.version }
            - call: "POST /orders/${order_a_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_a_id}/allocate"
              payload: { expected_order_version: "${order_a_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_a_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_a_id: "$.data[0].id" }
            - call: "POST /orders/${order_a_id}/lines/${line_a_id}/pick"
              payload: { requested_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_a_id}/lines/${line_a_id}/pick_complete"
              payload: { actual_units: 1 }
              as: WarehousePicker
            - call: "GET /orders/${order_a_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_a_v_ready: $.data.version }
          trigger:
            - call: "POST /orders/${order_a_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_a_v_ready}", service_level: "GROUND" }
              as: DCManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PROMISE_DATE_IN_PAST"
            - "Shipment.shipment_status for order ${order_a_id} is still STAGED — the rejected cutoff did not advance the shipment"
            - "the same call repeated with promise set one day after the DC's local day is accepted with 200, and with promise set two days after the DC's local day is accepted with a stored promised_delivery_by differing by exactly one day from the first acceptance"
            - "CatalogOrder.${order_a_id}.fulfillment_status is still ALLOCATED after the rejected cutoff"

      - name: same_day_window_already_cut_off_inverse_overlap
        grounds:
          - validations[priority=12]
          - errors.ERR_CUTOFF_WINDOW_PASSED
          - state_machines.CatalogOrder.RELEASED_AWAITING_RELEASE_to_RELEASED_ALLOCATED
          - entities.DistributionCenter.fields.cutoff_passed
          - calculations.dc_allocation_selector
        distinguishing_aspect: "Interval semantics: a point interval against an already-occupied cut-off day in the INVERSE direction — the requested commit must fall before the interval boundary, so a delivery window that ends on or before the DC's local_cutoff_time is rejected while the same window one second later is admitted, and the winner is decided by whether the DC is already past its boundary."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05, past its 06:00:00 cutoff, so cutoff_passed is true and the DC has already entered the same-day dispatch interval for today."
            - "One account in region NORTHEAST; one curated item priced 4500 cents with curation_bundle_size 8; BOS stocks 10 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-8101", description: "Socket set screw M10x16", material_spec: "alloy steel", long_tail: false, unit_price_cents: 4500, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 16, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.50 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /distribution-centers/${bos_dc_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { posture_seen: $.data.operations_posture }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
          assert:
            - "the DC's cutoff_passed is already true because its local time 06:05 is at or after local_cutoff_time 06:00:00 — so today's same-day interval is occupied and the allocation is therefore NOT same-day committed"
            - "CatalogOrder.${order_id}.same_day_committed == false"
            - "CatalogOrder.${order_id}.commit_minutes_before_cutoff == 0, the saturated value for an order committed at or after the cutoff"
            - "CatalogOrder.${order_id}.fulfillment_status == ALLOCATED and allocated_dc_id == ${bos_dc_id}"
            - "an identical release and allocate issued at logical clock 2026-09-14T09:00:00Z (BOS local 05:00, one hour BEFORE local_cutoff_time) instead yields CatalogOrder.same_day_committed == true with commit_minutes_before_cutoff == 60"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  #   quantity 1: DC stock ledger, on_hand_units + reserved_units
  #   quantity 2: recoverable-unit ledger, DC on_hand_units + the order's damaged_units
  #   quantity 3: damage-claim counter and the order's held reservation
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: allocate_then_cancel_conserves_dc_stock_ledger
        grounds:
          - state_machines.CatalogOrder.RELEASED_AWAITING_RELEASE_to_RELEASED_ALLOCATED
          - state_machines.CatalogOrder.RELEASED_ALLOCATED_to_CANCELLED_AWAITING_RELEASE
          - entities.InventoriedStock.fields.on_hand_units
          - entities.InventoriedStock.fields.reserved_units
          - entities.InventoriedStock.fields.available_units
        distinguishing_aspect: "Conserved quantity Q_stock = sum over the DC's stock rows of (on_hand_units + reserved_units). Allocation moves 4 units from the available bucket into reserved and cancel moves the same 4 back, so Q_stock reads 17 before the allocation, 17 while allocated and 17 after the cancel, while available_units goes 17 -> 13 -> 17."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS, one account in region NORTHEAST."
            - "One curated item priced 6500 cents with curation_bundle_size 8; two stock rows at BOS for that item holding 12 and 5 units, so Q_stock starts at 17."
            - "One order of 4 units, created and released but not yet allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-9001", description: "Split pin 4x40", material_spec: "steel", long_tail: false, unit_price_cents: 6500, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 40, nominal_width_mm: 4, nominal_height_mm: 4, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Pin Diameter", attribute_value: "4.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 12, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
              captures: { stock_a_id: $.data.id }
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
              captures: { stock_b_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 4 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_allocated: $.data.version }
            - call: "GET /stock?item_id=${item_id}&dc_id=${bos_dc_id}"
              payload: { limit: 100, offset: 0 }
              as: DCManager
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /stock?item_id=${item_id}&dc_id=${bos_dc_id}"
              payload: { limit: 100, offset: 0 }
              as: DCManager
          assert:
            - "before the allocation, Q_stock = InventoriedStock.${stock_a_id}.on_hand_units + reserved_units + InventoriedStock.${stock_b_id}.on_hand_units + reserved_units == 17"
            - "after the allocation, Q_stock == 17 and reserved_units across the two rows together == 4"
            - "after the cancel, Q_stock == 17 and reserved_units across the two rows together == 0"
            - "available_units across the two rows reads 17 before the allocation, 13 while allocated, and 17 after the cancel"
            - "CatalogOrder.${order_id}.order_status == CANCELLED and its line's line_status == PENDING with allocated_units == 0"

      - name: pick_then_partial_return_conserves_recoverable_units
        grounds:
          - state_machines.CatalogOrder.RELEASED_ALLOCATED_to_RELEASED_PICKED
          - state_machines.ReturnAuthorization.APPROVED_to_RECEIVED
          - entities.InventoriedStock.fields.on_hand_units
          - entities.CatalogOrderLine.fields.damaged_units
          - entities.CatalogOrderLine.fields.restocked_units
          - calculations.restock_cap_allocation
        distinguishing_aspect: "Conserved quantity Q_recoverable = the DC's on_hand_units plus the order line's damaged_units. Picking 5 units off the shelf and then receiving a 5-unit return with a 4/1 restock/damage split takes Q_recoverable from 10 to 5 and back to 10, because the 4 restocked units re-enter on_hand while the 1 damaged unit re-enters the damaged ledger — no unit is lost or invented."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05, after its 06:00:00 cutoff."
            - "One account in region NORTHEAST; one curated item priced 2000 cents with curation_bundle_size 8; BOS stock of 10 units."
            - "One order of 5 units, picked in full and cut off, so the line is PICKED and the shipment is CUTOFF_CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-9101", description: "Wave spring 20 mm", material_spec: "carbon steel", long_tail: false, unit_price_cents: 2000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 20, nominal_width_mm: 20, nominal_height_mm: 3, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Outer Diameter", attribute_value: "20.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 5 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 5 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", lines: [{ line_id: "${line_id}", requested_return_units: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: DCManager
          trigger:
            - call: "GET /stock/${stock_id}"
              payload: {}
              as: DCManager
            - call: "GET /returns/${ret_id}"
              payload: {}
              as: DCManager
            - call: "POST /returns/${ret_id}/receive"
              payload: { removed_manufacturer_part_numbers: { "${line_id}": "WS-20-CS" } }
              as: DCManager
            - call: "GET /stock/${stock_id}"
              payload: {}
              as: DCManager
          assert:
            - "before the return receive, InventoriedStock.${stock_id}.on_hand_units == 5 and CatalogOrderLine.${line_id}.damaged_units == 0, so Q_recoverable == 5"
            - "the approved return splits the 5 claimed units as restock_units == 4 and damaged_units == 1"
            - "after the return receive, InventoriedStock.${stock_id}.on_hand_units == 9 and CatalogOrderLine.${line_id}.damaged_units == 1"
            - "after the return receive, Q_recoverable == 9 + 1 == 10, exactly the value it held before the pick, so the pick/return pair conserved it"
            - "CatalogOrderLine.${line_id}.restocked_units == 4 and CatalogOrderLine.${line_id}.return_friction_units == 1"

      - name: shortfall_claim_resume_void_restores_claim_counter
        grounds:
          - state_machines.DamageClaim.OPEN_to_RESUMED
          - state_machines.DamageClaim.RESUMED_to_VOIDED
          - state_machines.PickTask.PICKING_to_SHORT_CLOSED
          - entities.CustomerAccount.fields.open_claim_count
          - entities.CatalogOrderLine.fields.allocated_units
          - entities.CatalogOrder.fields.fulfillment_status
        distinguishing_aspect: "Conserved quantity Q_claims = CustomerAccount.open_claim_count together with the order's held reservation. A short pick opens a claim (counter 0 -> 1) and the compensating resume-then-void pair returns the counter to exactly 0 while CatalogOrderLine.allocated_units stays pinned at 3 throughout, because the shortfall never released the reservation it could not fill."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS, one account in region NORTHEAST."
            - "One curated non-long-tail item priced 3000 cents; BOS stock of 3 units against a 3-unit line."
            - "One order of 3 units, released and allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-9201", description: "Belleville washer 25 mm", material_spec: "spring steel", long_tail: false, unit_price_cents: 3000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 25, nominal_width_mm: 25, nominal_height_mm: 2, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Outer Diameter", attribute_value: "25.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 3, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 3 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 3 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 1 }
              as: WarehousePicker
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { claims_after_short: $.data.open_claim_count }
            - call: "GET /damage-claims?order_id=${order_id}"
              payload: { limit: 10, offset: 0 }
              as: DCManager
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /damage-claims/${claim_id}/resume_fulfillment"
              payload: {}
              as: WarehousePicker
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { claims_after_resume: $.data.open_claim_count }
            - call: "POST /damage-claims/${claim_id}/void"
              payload: {}
              as: DCManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
          assert:
            - "after the short pick, CustomerAccount.${acct_id}.open_claim_count == 1 and CatalogOrderLine.${line_id}.line_status == SHORT with shortage_units == 2"
            - "after resume_fulfillment the claim is RESUMED and CatalogOrder.${order_id}.fulfillment_status == ALLOCATED, while CustomerAccount.${acct_id}.open_claim_count is still 1"
            - "after void, CustomerAccount.${acct_id}.open_claim_count == 0 — exactly the pre-claim value, so the resume/void pair compensated the counter"
            - "CatalogOrderLine.${line_id}.allocated_units == 3 at every step, before the short pick, after the short pick, after the resume and after the void"
            - "CatalogOrderLine.${line_id}.allocated_small_line_fee_cents == 0 while the line is SHORT, so a SHORT line is excluded from the handling-fee pool"
