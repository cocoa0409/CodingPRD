      - name: assignment_under_suspended_agreement_rejected_before_the_panel_check
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_ERR_AGREEMENT_NOT_ACTIVE
          - validations.priority_10_ERR_PANEL_CLOSED_TO_NEW
          - state_machines.DelegationAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Suspending an agreement closes every OPEN panel, so a subsequent
          assignment attempt violates BOTH priority 8 (agreement not ACTIVE) and
          priority 10 (panel closed). The response must be
          ERR_AGREEMENT_NOT_ACTIVE with HTTP 409; an implementation that checks
          the panel first returns ERR_PANEL_CLOSED_TO_NEW. Reinstating the
          agreement does not reopen the panel, so the retry then legitimately
          returns ERR_PANEL_CLOSED_TO_NEW — the second error is only reachable
          once the first is repaired.
        test_recipe:
          setup:
            - "Agreement AGR_V10 was ACTIVE with one ACTIVE physician on an OPEN panel and one unassigned enrollee, then moved to SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
