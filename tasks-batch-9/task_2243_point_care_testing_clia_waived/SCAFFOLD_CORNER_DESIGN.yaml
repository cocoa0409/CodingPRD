      - name: reagent_lot_create_into_open_excursion_returns_temp_excursion_active
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TEMP_EXCURSION_ACTIVE]
          - validations[priority:56]
          - state_machines.StorageUnit
        distinguishing_aspect: |
          The gate is on the STORAGE UNIT, not on any lot: with no lot in the
          fridge at all, an out-of-range reading still blocks the next receipt
          until the excursion is resolved, and the same request succeeds
          immediately afterwards.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One site and one EMPTY storage unit 2.0..8.0 C; a 12.0 C reading opens an excursion."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Rehab POCT", department_code: "DEPT-3500", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 12.0, recorded_at: "2026-09-01T09:00:00Z", recorded_by_user_id: "user-facilities" }
              as: QualityCoordinator
              captures: { disp: $.data.disposition }
            - call: "GET /poct/storage-units/${su_id}"
              as: QualityCoordinator
              captures: { state_1: $.data.excursion_state, opened_at: $.data.excursion_opened_at, qcount_1: $.data.quarantined_lot_count }
          trigger:
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-B1", expiration_date: "2027-01-31", received_at: "2026-09-01T09:30:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "POST /poct/storage-units/${su_id}/excursion-resolution"
              payload: { assessment_note: "door left ajar, probe re-sited, no lots in unit", lot_disposition: "RELEASE" }
              as: QualityCoordinator
              captures: { state_2: $.data.excursion_state, opened_after: $.data.excursion_opened_at, qcount_2: $.data.quarantined_lot_count }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-B1", expiration_date: "2027-01-31", received_at: "2026-09-01T10:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id, lot_state: $.data.verification_status }
          assert:
            - "${disp} == \"OUT_OF_RANGE\"; ${state_1} == \"EXCURSION_OPEN\", ${opened_at} == \"2026-09-01T09:00:00.000Z\" and ${qcount_1} == 0 (nothing to quarantine)"
            - "the first receipt returns HTTP 422 with ${err} == \"ERR_TEMP_EXCURSION_ACTIVE\""
            - "the resolution returns HTTP 200 with ${state_2} == \"IN_RANGE\", ${opened_after} == null and ${qcount_2} == 0"
            - "the retried receipt returns HTTP 201 with ${lot_state} == \"UNVERIFIED\" - lot_number LOT-B1 was still free, proving the 422 stored nothing"

