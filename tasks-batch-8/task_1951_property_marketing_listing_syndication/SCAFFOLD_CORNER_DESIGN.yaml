            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/p.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { p_ready: $.data.id } }
            - { call: "POST /media-assets/${p_ready}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /media-assets/${v_id}/set-primary", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /media-assets/${up_id}/set-primary", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /media-assets/${p_ready}/set-primary", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err3: $.data.error_id } }
          assert:
            - "${err1} == ERR_PRIMARY_REQUIRES_PHOTO"
            - "${err2} == ERR_MEDIA_NOT_READY"
            - "${err3} == ERR_ALREADY_PRIMARY and ${p_ready} remains the only primary"

