scaffold_corner_design:

  - section: entities
    instances:

      - name: create_taxpayer_group_returns_seeded_derived_fields
        claim_type: creation
        grounds:
          - entities.TaxpayerGroup.fields.compliance_posture
          - entities.TaxpayerGroup.fields.open_registration_obligations
          - endpoints[POST /salt/groups]
        distinguishing_aspect: "A brand-new TaxpayerGroup comes back with compliance_posture COMPLIANT, open_registration_obligations 0, nowhere_sales_pool 0 and version 1, all server-seeded rather than client-supplied."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
          trigger:
            - call: "POST /salt/groups"
              payload: {name: "Fresh Group", base_state_code: "DE", everywhere_sales: 1000000, everywhere_property: 400000, everywhere_payroll: 200000}
              as: TaxManager
              captures: {g_id: $.data.id}
          assert:
            - "the response is HTTP 201 with response_type object and meta.api_request_id present"
            - "TaxpayerGroup.${g_id}.compliance_posture == COMPLIANT"
            - "TaxpayerGroup.${g_id}.open_registration_obligations == 0"
            - "TaxpayerGroup.${g_id}.nowhere_sales_pool == 0"
            - "TaxpayerGroup.${g_id}.version == 1 and fiscal_year_end_month == 12"

      - name: registration_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.StateRegistration.fields.due_month
          - entities.StateRegistration.fields.safe_harbor_basis
          - entities.StateRegistration.fields.economic_nexus_sales_threshold
          - endpoints[POST /salt/groups/{id}/registrations]
        distinguishing_aspect: "Creating a registration with only the five required fields yields due_month 4, due_day 15, extension_months 6, estimated_installment_count 4, safe_harbor_basis PRIOR_YEAR_100, economic_nexus_sales_threshold 500000 and economic_nexus_employee_days_threshold 15."
        test_recipe:
          setup:
            - "A TaxpayerGroup exists."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Defaults Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
          trigger:
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "OR", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.066, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {r_id: $.data.id}
          assert:
            - "StateRegistration.${r_id}.due_month == 4 and due_day == 15"
            - "StateRegistration.${r_id}.extension_months == 6 and estimated_installment_count == 4"
            - "StateRegistration.${r_id}.safe_harbor_basis == PRIOR_YEAR_100 and prior_year_tax == 0 and current_year_estimated_tax == 0"
            - "StateRegistration.${r_id}.economic_nexus_sales_threshold == 500000 and economic_nexus_employee_days_threshold == 15"
            - "StateRegistration.${r_id}.nexus_status == NONE and registration_status == NOT_REQUIRED and state_permits_early_revocation == false"
            - "StateRegistration.${r_id}.calendar_rolled_through_year == 0 and total_payments_received == 0 and unapplied_payment_balance == 0"

      - name: filing_original_due_date_computed_from_registration_calendar
        claim_type: computed_fields
        grounds:
          - entities.StateFiling.fields.original_due_date
          - entities.StateRegistration.fields.due_month
          - entities.StateRegistration.fields.due_day
        distinguishing_aspect: "StateFiling.original_due_date is derived as midnight UTC of (tax_year + 1, registration.due_month, registration.due_day) and equals 2027-03-01T00:00:00Z for a 2026 return on a registration configured with due_month 3 and due_day 1."
        test_recipe:
          setup:
            - "A TaxpayerGroup with a CA registration whose due_month is 3 and due_day is 1."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Calendar Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 3, due_day: 1, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 1000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
          assert:
            - "StateFiling.${f_id}.original_due_date == 2027-03-01T00:00:00Z"
            - "StateFiling.${f_id}.extended_due_date == null"
            - "StateFiling.${f_id}.preparation_status == DRAFT and payment_status == UNPAID"
            - "StateFiling.${f_id}.apportionment_percentage == 0 and balance_due == 0"

      - name: system_fields_are_server_minted_on_every_entity
        claim_type: system_fields
        grounds:
          - entities.StateRegistration.fields.state_account_number
          - entities.StateFiling.fields.filed_on_date
          - entities.TaxpayerGroup.fields.compliance_posture
        distinguishing_aspect: "id is a bare 36-character UUID with no type prefix, created_at and updated_at carry three fractional digits in UTC, version starts at 1, and system-source fields such as state_account_number and filed_on_date start null."
        test_recipe:
          setup:
            - "A TaxpayerGroup with one CA registration."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "System Fields Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
          trigger:
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
          assert:
            - "StateRegistration.${reg_ca_id}.id matches the bare UUID form 8-4-4-4-12 with no prefix such as reg_"
            - "StateRegistration.${reg_ca_id}.created_at and updated_at are ISO 8601 UTC with exactly three fractional digits"
            - "StateRegistration.${reg_ca_id}.version == 1"
            - "StateRegistration.${reg_ca_id}.state_account_number == null and registered_on_date == null"

      - name: get_filing_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_FILING_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /salt/filings/{id}]
        distinguishing_aspect: "A GET against a syntactically valid but unknown filing id answers HTTP 404 with data.error_id ERR_FILING_NOT_FOUND and the standard error envelope."
        test_recipe:
          setup:
            - "Empty database except the logical clock default."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
          trigger:
            - call: "GET /salt/filings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 404"
            - "data.error_id == ERR_FILING_NOT_FOUND"
            - "the body carries response_type error and a non-empty data.message"

      - name: create_registration_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /salt/groups/{id}/registrations]
        distinguishing_aspect: "Omitting the required throwback_rule from a registration create answers HTTP 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "A TaxpayerGroup exists."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Missing Field Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
          trigger:
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "WA", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.01, service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /salt/groups/${grp_id}/registrations returns an empty array"

      - name: create_registration_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.StateRegistration.fields.factor_formula
        distinguishing_aspect: "A factor_formula value outside {EQUAL_WEIGHTED_THREE, DOUBLE_WEIGHTED_SALES, SINGLE_SALES_FACTOR} answers HTTP 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A TaxpayerGroup exists."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Enum Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
          trigger:
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "WA", factor_formula: "TRIPLE_WEIGHTED_SALES", tax_rate: 0.01, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /salt/groups/${grp_id}/registrations returns an empty array"

      - name: activity_record_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ActivityRecord.fields.tax_year
          - endpoints[POST /salt/registrations/{id}/activity-records]
          - endpoints[GET /salt/activity-records/{id}]
        distinguishing_aspect: "ActivityRecord is declared common_fields false, so its response exposes id and created_at but no version or updated_at, and section 1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "A TaxpayerGroup with one member entity and one CA registration."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Immutable Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Corner Member", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 250000}
              as: StateAnalyst
              captures: {ar_id: $.data.id}
          assert:
            - "ActivityRecord.${ar_id}.id and created_at are present in the response"
            - "the ActivityRecord response body carries no version field and no updated_at field"
            - "the API exposes no PUT, PATCH or DELETE route for /salt/activity-records/${ar_id}"
            - "GET /salt/activity-records/${ar_id} returns the same destination_sales 250000"

      - name: legal_entity_creation_under_unknown_group_returns_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_GROUP_NOT_FOUND]
          - validations[priority=3]
          - entities.LegalEntity.fields.group_id
        distinguishing_aspect: "Creating a LegalEntity under a non-existent group id answers HTTP 404 ERR_GROUP_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Empty database except the logical clock default."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
          trigger:
            - call: "POST /salt/groups/00000000-0000-4000-8000-0000000000ff/legal-entities"
              payload: {name: "Orphan Co", incorporation_state_code: "DE"}
              as: TaxManager
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 404 with data.error_id == ERR_GROUP_NOT_FOUND"

      - name: activity_record_for_entity_of_another_group_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=19]
          - errors[ERR_ENTITY_NOT_IN_GROUP]
          - entities.ActivityRecord.fields.legal_entity_id
        distinguishing_aspect: "A legal_entity_id that resolves but belongs to a different TaxpayerGroup answers HTTP 422 ERR_ENTITY_NOT_IN_GROUP, proving cross-group FK integrity in the flat topology."
        test_recipe:
          setup:
            - "Two independent TaxpayerGroups, each with one member entity; the CA registration belongs to the first group."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Group One", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Member One", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/groups"
              payload: {name: "Group Two", base_state_code: "NV", everywhere_sales: 500000, everywhere_property: 100000, everywhere_payroll: 80000}
              as: TaxManager
              captures: {grp2_id: $.data.id}
            - call: "POST /salt/groups/${grp2_id}/legal-entities"
              payload: {name: "Member Two", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_other_id: $.data.id}
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_other_id}", tax_year: 2026, destination_sales: 100000}
              as: StateAnalyst
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 422 with data.error_id == ERR_ENTITY_NOT_IN_GROUP"
            - "GET /salt/activity-records with registration_id filter returns an empty array"

      - name: list_groups_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /salt/groups]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /salt/groups with limit 2 and offset 0 returns response_type array with limit 2, offset 0, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Three TaxpayerGroups exist."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Alpha Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups"
              payload: {name: "Beta Group", base_state_code: "NV", everywhere_sales: 1, everywhere_property: 1, everywhere_payroll: 1}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Gamma Group", base_state_code: "TX", everywhere_sales: 2, everywhere_property: 2, everywhere_payroll: 2}
              as: TaxManager
          trigger:
            - call: "GET /salt/groups"
              payload: {limit: 2, offset: 0}
              as: Auditor
          assert:
            - "the response carries response_type array"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "limit == 2, offset == 0, total_count == 3, has_more == true"
            - "exactly 2 TaxpayerGroup rows are returned"

  - section: state_machines
    instances:

      - name: approve_from_draft_returns_invalid_filing_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StateFiling.IN_REVIEW_to_APPROVED
          - validations[priority=7]
          - errors[ERR_INVALID_FILING_STATE]
        distinguishing_aspect: "A DRAFT return has no APPROVED edge, so approve answers HTTP 409 ERR_INVALID_FILING_STATE and approver_user_id stays null."
        test_recipe:
          setup:
            - "CA 2026 return in DRAFT with factors computed under JOYCE."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-99887766"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {f_v1: $.data.version}
          trigger:
            - call: "POST /salt/filings/${f_id}/approve"
              payload: {approval_note: "premature"}
              as: Controller
              as_user_id: "controller-01"
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_INVALID_FILING_STATE"
            - "StateFiling.${f_id}.preparation_status is still DRAFT"
            - "StateFiling.${f_id}.approver_user_id == null"

      - name: submit_review_twice_returns_invalid_filing_state
        claim_type: idempotency
        grounds:
          - state_machines.StateFiling.FACTORS_LOCKED_to_IN_REVIEW
          - validations[priority=7]
          - errors[ERR_INVALID_FILING_STATE]
        distinguishing_aspect: "The second submit-review on the same return is rejected with HTTP 409 ERR_INVALID_FILING_STATE because IN_REVIEW is not a legal source state for that trigger; preparer_user_id keeps its first value."
        test_recipe:
          setup:
            - "CA 2026 return in FACTORS_LOCKED."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
