  # =============================================================================
  # Section: calculations — Table 3 claims (correct result, constants, precision,
  # input-set filtering) not already covered by §1.8 instances.
  # =============================================================================
  - section: calculations
    instances:
      - name: calibration_drift_and_due_date_computed
        claim_type: correct_result
        grounds:
          - calculations.instrument_calibration_due
          - entities.Calibration.fields.drift_pct
        distinguishing_aspect: "drift_pct = abs(103.0-100.0)/100.0*100 = 3.0 <= MAX_DRIFT_PCT 5.0 so outcome=PASS; a CGI instrument's calibration_due_at = calibrated_at + 60 days = 2026-09-30T00:00:00Z exactly."
        test_recipe:
          setup:
            - "CGI Instrument I-CGI-CL exists; clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-CL", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
          trigger:
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 103.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { drift: $.data.drift_pct, outcome: $.data.outcome }
            - call: "GET /instruments/${instr_id}"
              payload: {}
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { cal_at: $.data.calibrated_at, due_at: $.data.calibration_due_at }
          assert:
            - "drift == 3.0"
            - "outcome == PASS"
            - "cal_at == 2026-08-01T00:00:00Z"
            - "due_at == 2026-09-30T00:00:00Z (CGI_INTERVAL_DAYS=60)"

      - name: calibration_drift_exactly_at_max_passes
        claim_type: constants_applied
        grounds:
          - calculations.instrument_calibration_due
          - entities.Calibration.fields.outcome
        distinguishing_aspect: "Boundary on MAX_DRIFT_PCT: drift exactly 5.0 (observed 105.0 vs reference 100.0) is PASS because the rule is 'drift_pct <= MAX_DRIFT_PCT'; observed 105.1 gives drift 5.1 and outcome FAIL."
        test_recipe:
          setup:
            - "Two CGI instruments exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-B1", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr1_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-B2", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr2_id: $.data.id }
          trigger:
            - call: "POST /instruments/${instr1_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 105.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { outcome1: $.data.outcome, drift1: $.data.drift_pct }
            - call: "POST /instruments/${instr2_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 105.1 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { outcome2: $.data.outcome, drift2: $.data.drift_pct }
          assert:
            - "drift1 == 5.0 AND outcome1 == PASS (inclusive <= boundary)"
            - "drift2 == 5.1 AND outcome2 == FAIL"

      - name: calibration_drift_fail_blocks_reactivation
        claim_type: constants_applied
        grounds:
          - calculations.instrument_calibration_due
          - state_machines.Instrument.OUT_OF_CALIBRATION_to_IN_SERVICE
          - errors[ERR_CALIBRATION_DRIFT_EXCEEDED]
        distinguishing_aspect: "An OUT_OF_CALIBRATION instrument (clock past calibration_due_at) cannot return to service with a failing calibration: POST /instruments/{id}/calibrate with drift 6.0 fails 422 ERR_CALIBRATION_DRIFT_EXCEEDED and status stays OUT_OF_CALIBRATION."
        test_recipe:
          setup:
            - "CGI instrument calibrated 2026-08-01 (due 2026-09-30); clock advanced to 2026-10-01 so status auto-flipped OUT_OF_CALIBRATION"
