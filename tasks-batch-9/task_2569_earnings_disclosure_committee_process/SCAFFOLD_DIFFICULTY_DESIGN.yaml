      - name: material_event_reassessment_cascades_three_hops_and_reverses_certification_eligibility
        grounds:
          - calculations.material_event_severity_and_deadline
          - state_machines.MaterialEvent.UNASSESSED_to_NOT_REPORTABLE
          - state_machines.MaterialEvent.NOT_REPORTABLE_to_REPORTABLE
          - state_machines.OfficerCertification.ELIGIBLE_to_BLOCKED
          - state_machines.OfficerCertification.BLOCKED_to_ELIGIBLE
          - entities.ReportingCycle.fields.open_material_event_count
          - validations[priority=28]
        distinguishing_aspect: |
          A second-order cascade that runs in BOTH directions on the same rows and is driven by an
          entity two levels away from the certifications it moves: logging the event puts it in the
          open set (HOP: count 0 -> 1) and drops both certifications ELIGIBLE -> BLOCKED; assessing it
          NOT_REPORTABLE drops it out of the open set (count 1 -> 0) and lifts both back to ELIGIBLE;
          re-assessing it REPORTABLE on new information runs the full three hops — deadline computed
          as four business days after discovery (2026-08-01T09:00:00Z -> 2026-08-06T17:30:00Z),
          count 0 -> 1, certifications ELIGIBLE -> BLOCKED — even though the event's severity_score of
          3.00 is BELOW the 5.00 reportability floor, because the floor only constrains the
          NOT_REPORTABLE determination. Implementations that key the block on severity rather than on
          the open count, or that never reverse the block, diverge at the second or third step.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with a non-officer FINANCE member, a non-officer LEGAL member and two officer FINANCE members."
            - "A ReportingCycle in CERTIFICATION_OPEN: CLOSE and REVIEW milestones COMPLETE, one SUBMITTED sub-certification giving coverage 100.00, one APPROVED PERIODIC_FILING document, and CEO_302 and CFO_302 certifications both ELIGIBLE and unsigned."
            - "cycle.open_material_event_count is 0 and no MaterialEvent exists yet."
