      - name: a_licence_amendment_can_strand_a_risk_the_carrier_may_no_longer_write
        claim_type: conditional_validation
        grounds:
          - errors[ERR_CARRIER_NOT_LICENSED_IN_TERRITORY]
          - validations[priority=11][error_id=ERR_CARRIER_NOT_LICENSED_IN_TERRITORY]
          - endpoints[POST /plan/carriers/{id}/licensing-amendment].side_effects
          - calculations.carrier_selection_for_assignment.input_set
