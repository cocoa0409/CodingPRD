# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All recipes replay against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# Standard fixture literals used across instances ("FIXTURE A" family):
#   clock default 2026-05-01T00:00:00Z; org credit_limit_cents 500000;
#   RC ASL_ONSITE/MEDICAL/CERTIFIED: hourly 9000, min 120, travel 3000/h,
#   mileage 70/mi, vri_fee 0, windows 48h/24h, late pct 0.5, effective 2026-01-01.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two valid approaches, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_estimate_vs_final_diverge_on_actuals
        grounds:
          - calculations.estimated_cost
          - calculations.final_invoice_billing
        distinguishing_aspect: |
          Billing domain on Assignment/Invoice: the provisional estimate (scheduled 150 min,
          flat 60-min travel, estimated 10 mi) yields 26200 cents, while the final
          encounter-based billing (actual 130 min, claimed 90 travel min, 12 mi) yields
          24840 cents for the same assignment — two valid algorithms, different money.
        test_recipe:
          setup:
            - "Org (credit 500000), ASL/MEDICAL/CERTIFIED rate card, activated interpreter with availability June, and a request scheduled 2026-06-10T14:00:00Z-16:30:00Z (150 min), estimated_mileage 10"
            - "Assignment OFFERED with estimated_cost_cents == 26200 (labor 22500 + travel 3000 + mileage 700)"
            - "Assignment taken through accept/confirm/depart/check-in at 14:00 and check-out at 16:10 (actual 130 min) with travel_minutes_claimed 90 and mileage_claimed 12; encounter verified"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE", "CART_ONSITE"], home_zip: "02139", vri_platform_certified: false }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
              payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cert1: $.data.id }
            - { call: "POST /interpreters/${i1}/certifications/${cert1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE", "CART_ONSITE", "VRI"] }
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { req1: $.data.id }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - call: "POST /requests/${req1}/offers"
              payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }
              as: PlatformAdmin
              captures: { asg1: $.data.id }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 90, mileage_claimed: 12 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "GET /assignments/${asg1}/encounters", payload: {}, as: Any, captures: { enc1: "$.data[0].id" } }
            - { call: "POST /encounters/${enc1}/verify", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
          trigger:
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
            - { call: "GET /assignments/${asg1}", payload: {}, as: Any, captures: { est_seen: $.data.estimated_cost_cents } }
            - { call: "GET /invoices/${inv1}", payload: {}, as: Any }
          assert:
            - "Assignment.${asg1}.estimated_cost_cents == 26200 (provisional variant: 22500 labor + 3000 travel + 700 mileage)"
            - "Invoice.${inv1}.subtotal_cents == 24840 (final variant: LABOR 19500 + TRAVEL_TIME 4500 + MILEAGE 840)"
            - "Invoice.${inv1}.subtotal_cents != Assignment.${asg1}.estimated_cost_cents (26200 != 24840)"
            - "Invoice.${inv1}.line_items contains LABOR amount_cents == 19500 with quantity == 130"

      - name: quality_score_provisional_vs_final_diverge_on_pending_complaint
        grounds:
          - calculations.quality_score_aggregation
        distinguishing_aspect: |
          Interpreter risk domain (not billing): with one SUBSTANTIATED MAJOR complaint
          (penalty 15) and one still-FILED CRITICAL complaint (penalty 30), the final
          variant quality_score == 85 while the provisional variant (assumes worst on
          pending complaints) quality_score_provisional == 55 — same rows, 30-point split.
        test_recipe:
          setup:
            - "FIXTURE A flow driven to a COMPLETED assignment for interpreter i1 (no invoice needed)"
            - "Complaint C1 (MAJOR) filed then adjudicated SUBSTANTIATED; complaint C2 (CRITICAL) filed and left FILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
              payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cert1: $.data.id }
            - { call: "POST /interpreters/${i1}/certifications/${cert1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { req1: $.data.id }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - call: "POST /requests/${req1}/offers"
              payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }
              as: PlatformAdmin
              captures: { asg1: $.data.id }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 0, mileage_claimed: 0 }, as: Interpreter, as_user_id: "${i1}" }
            - call: "POST /complaints"
              payload: { org_id: "${org1}", assignment_id: "${asg1}", category: "QUALITY", severity: "MAJOR", narrative: "Sign errors throughout" }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { cmp1: $.data.id }
            - { call: "POST /complaints/${cmp1}/begin-review", payload: {}, as: QualityReviewer }
            - { call: "POST /complaints/${cmp1}/adjudicate", payload: { outcome: "SUBSTANTIATED" }, as: QualityReviewer }
            - call: "POST /complaints"
              payload: { org_id: "${org1}", assignment_id: "${asg1}", category: "PROFESSIONALISM", severity: "CRITICAL", narrative: "Interpreter left mid-encounter" }
              as: OrgRequester
              as_user_id: "${org1}"
          trigger:
            - { call: "GET /interpreters/${i1}", payload: {}, as: Any }
          assert:
            - "Interpreter.${i1}.quality_score == 85 (final variant: 100 - 15, SUBSTANTIATED only)"
            - "Interpreter.${i1}.quality_score_provisional == 55 (provisional variant: 100 - 15 - 30, includes FILED CRITICAL)"
            - "Interpreter.${i1}.quality_score != Interpreter.${i1}.quality_score_provisional"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes a / b)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_line_rounding_order_per_line_then_sum
        grounds:
          - calculations.final_invoice_billing
        distinguishing_aspect: |
          Mode (b) nested rounding: with hourly 8999 cents the LABOR line is
          round(130*8999/60) = 19498 and MILEAGE round(10.5*65) = 683; the pinned
          round-per-line-then-sum order yields subtotal 24681, while sum-then-round of
          the same inputs yields 24680 — exactly one cent apart.
        test_recipe:
          setup:
            - "Same as FIXTURE A but rate card hourly_rate_cents 8999 and mileage_rate_cents_per_mile 65"
            - "Encounter actual 130 min; claims travel 90 min (4500 exact), mileage 10.5 mi (682.5 raw)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "City Clinic", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 8999, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 65, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
              payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cert1: $.data.id }
            - { call: "POST /interpreters/${i1}/certifications/${cert1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { req1: $.data.id }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - call: "POST /requests/${req1}/offers"
              payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }
              as: PlatformAdmin
              captures: { asg1: $.data.id }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 90, mileage_claimed: 10.5 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "GET /assignments/${asg1}/encounters", payload: {}, as: Any, captures: { enc1: "$.data[0].id" } }
            - { call: "POST /encounters/${enc1}/verify", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
          trigger:
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
          assert:
            - "Invoice.${inv1}.subtotal_cents == 24681 (round-per-line-then-sum: 19498 + 4500 + 683)"
            - "Invoice.${inv1}.line_items LABOR amount_cents == 19498 (round_half_up(19497.8333))"
            - "Invoice.${inv1}.line_items MILEAGE amount_cents == 683 (round_half_up(682.5))"
            - "Invoice.${inv1}.subtotal_cents != 24680 (sum-then-round would produce 24680)"

      - name: travel_and_mileage_caps_nested_min
        grounds:
          - calculations.travel_mileage_reimbursement
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: claimed travel 300 min and mileage 250 mi
          hit the nested caps min(300, 240) and min(250, 200) gated by modality —
          TRAVEL_TIME bills 240*3000/60 = 12000 and MILEAGE 200*70 = 14000, not the
          uncapped 15000 / 17500 an uncapped reading would give.
        test_recipe:
          setup:
            - "FIXTURE A (hourly 9000, travel 3000/h, mileage 70/mi); encounter actual 130 min; interpreter over-claims travel_minutes_claimed 300 and mileage_claimed 250 at check-out"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
              payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cert1: $.data.id }
            - { call: "POST /interpreters/${i1}/certifications/${cert1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { req1: $.data.id }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - call: "POST /requests/${req1}/offers"
              payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }
              as: PlatformAdmin
              captures: { asg1: $.data.id }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 300, mileage_claimed: 250 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "GET /assignments/${asg1}/encounters", payload: {}, as: Any, captures: { enc1: "$.data[0].id" } }
            - { call: "POST /encounters/${enc1}/verify", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
          trigger:
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
          assert:
            - "Invoice.${inv1}.line_items TRAVEL_TIME quantity == 240 and amount_cents == 12000 (cap min(300, 240))"
            - "Invoice.${inv1}.line_items MILEAGE quantity == 200 and amount_cents == 14000 (cap min(250, 200))"
            - "Invoice.${inv1}.subtotal_cents == 45500 (19500 + 12000 + 14000)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities: cycle vs parallel dims)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: request_offer_cycle_until_unfilled
        grounds:
          - state_machines.InterpretingRequest.OFFERED_to_MATCHING
          - state_machines.InterpretingRequest.OFFERED_to_UNFILLED
        distinguishing_aspect: |
          Cyclic machine on InterpretingRequest: MATCHING -> OFFERED -> MATCHING loops on
          each decline while offer_attempt_count < 3, and the loop terminates into UNFILLED
          exactly when the third offer is declined — a cycle with a counter-based exit.
        test_recipe:
          setup:
            - "FIXTURE A request MATCHING; interpreter i1 eligible; three consecutive offers all declined by the interpreter"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
