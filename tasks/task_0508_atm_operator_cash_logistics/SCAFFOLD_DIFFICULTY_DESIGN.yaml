# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × ≥2 instances = 18 instances. Clock default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_forward_vs_chronological_diverge
        grounds:
          - calculations.cash_load_forecast
          - entities.ATM.fields.note_denomination_cents
          - endpoints.GET_/atms/{id}/forecast
        distinguishing_aspect: |
          On the cash-logistics (ATM) domain, FORWARD averages the trailing-14-day
          withdrawal total (200000/day -> 1750000) while CHRONOLOGICAL averages only
          post-last-load actuals (220000/day -> 1926000); identical ATM, different
          forecast_cents.
        test_recipe:
          setup:
            - "ATM with note_denomination_cents=2000, an approved 100c fee disclosure, one cassette."
            - "Clock at 2026-01-15. Over [2026-01-01,2026-01-15) the ATM took withdrawals summing 2,800,000c (two 1,070,000c on 2026-01-02 plus one 660,000c on 2026-01-12) -> FORWARD avg 200,000/day."
            - "A LOADED replenishment was confirmed at 2026-01-12; since then only the 660,000c withdrawal posted over 3 elapsed days -> CHRONOLOGICAL avg 220,000/day."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V1", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "Deli", commission_pct_bps: 1500, commission_flat_per_wd_cents: 30, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Site1", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 Main" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-FC-1", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /atms/${atm_id}/cassettes"
              payload: { position: "C1" }
              as: PlatformAdmin
            - call: "POST /atms/${atm_id}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 100, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd_id: $.data.id }
            - call: "POST /fee-disclosures/${fd_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 1070000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 1070000 }
              as: FieldTech
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_id}", route_id: "${route_id}", order_amount_cents: 4000000, service_window_start: "2026-01-12T08:00:00Z", service_window_end: "2026-01-12T10:00:00Z" }
              as: VaultController
              captures: { ro_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /replenishment-orders/${ro_id}/dispatch"
              payload: { expected_vault_version: "${v_ver}" }
              as: VaultController
            - call: "POST /replenishment-orders/${ro_id}/confirm-load"
              payload: {}
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 660000 }
              as: FieldTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /atms/${atm_id}/forecast?basis=FORWARD&days_until_next_visit=7"
              payload: { basis: "FORWARD", days_until_next_visit: 7 }
              as: VaultController
              captures: { fwd: $.data.forecast_cents }
            - call: "GET /atms/${atm_id}/forecast?basis=CHRONOLOGICAL&days_until_next_visit=7"
              payload: { basis: "CHRONOLOGICAL", days_until_next_visit: 7 }
              as: VaultController
              captures: { chrono: $.data.forecast_cents }
          assert:
            - "FORWARD forecast_cents == 1750000"
            - "CHRONOLOGICAL forecast_cents == 1926000"
            - "FORWARD avg_daily_dispense_cents == 200000 and CHRONOLOGICAL avg_daily_dispense_cents == 220000"

      - name: commission_greater_of_vs_pct_only_diverge
        grounds:
          - calculations.commission_split
          - entities.SiteMerchant.fields.commission_basis
          - state_machines.SettlementRun.DRAFT_to_SETTLED
        distinguishing_aspect: |
          On the commission/merchant domain (different entity domain than the forecast),
          GREATER_OF picks max(pct=244, flat=150)=244 while PCT_ONLY picks pct=244 only;
          construct a run where flat > pct so the two bases diverge (flat 600 vs pct 244).
        test_recipe:
          setup:
            - "Two merchants identical except commission_basis (GREATER_OF vs PCT_ONLY), pct 1500bps, flat 120c/wd, ceiling 50000."
            - "Each owns one ATM (surcharge 295, CA, approved disclosure). Each ATM's monthly_wd_count seeded to 498."
            - "5 WITHDRAWALs of 2000c posted on each ATM (seqs 499..503); window settled."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V2", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "GreaterOf", commission_pct_bps: 1500, commission_flat_per_wd_cents: 120, commission_monthly_ceiling_cents: 50000, commission_basis: "GREATER_OF" }
              as: PlatformAdmin
              captures: { sm_g: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "PctOnly", commission_pct_bps: 1500, commission_flat_per_wd_cents: 120, commission_monthly_ceiling_cents: 50000, commission_basis: "PCT_ONLY" }
              as: PlatformAdmin
              captures: { sm_p: $.data.id }
            - call: "POST /locations"
              payload: { name: "SG", jurisdiction_code: "CA", site_merchant_id: "${sm_g}", route_id: "${route_id}", address: "1 G" }
              as: PlatformAdmin
              captures: { loc_g: $.data.id }
            - call: "POST /locations"
              payload: { name: "SP", jurisdiction_code: "CA", site_merchant_id: "${sm_p}", route_id: "${route_id}", address: "1 P" }
              as: PlatformAdmin
              captures: { loc_p: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-G", location_id: "${loc_g}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_g: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-P", location_id: "${loc_p}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_p: $.data.id }
            - call: "POST /atms/${atm_g}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd_g: $.data.id }
            - call: "POST /fee-disclosures/${fd_g}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /atms/${atm_p}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd_p: $.data.id }
            - call: "POST /fee-disclosures/${fd_p}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_inject/atm_monthly_wd_count"
              payload: { atm_id: "${atm_g}", monthly_wd_count: 498 }
              as: PlatformAdmin
            - call: "POST /_inject/atm_monthly_wd_count"
              payload: { atm_id: "${atm_p}", monthly_wd_count: 498 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm_g}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_g}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_g}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_g}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_g}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_p}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_p}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_p}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_p}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_p}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm_g}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run_g: $.data.id }
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm_p}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run_p: $.data.id }
            - call: "POST /settlement-runs/${run_g}/settle"
              payload: {}
              as: SettlementOfficer
            - call: "POST /settlement-runs/${run_p}/settle"
              payload: {}
              as: SettlementOfficer
          trigger:
            - call: "GET /commission-statements?settlement_run_id=${run_g}"
              payload: {}
              as: SettlementOfficer
              captures: { cs_g: $.data.0.commission_cents }
            - call: "GET /commission-statements?settlement_run_id=${run_p}"
              payload: {}
              as: SettlementOfficer
              captures: { cs_p: $.data.0.commission_cents }
          assert:
            - "GREATER_OF statement commission_cents == 600 (flat 120*5=600 > pct floor(1631*0.15)=244)"
            - "PCT_ONLY statement commission_cents == 244 (pct only, flat 600 ignored)"
            - "Both runs net_operator_revenue_cents == 1631"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_tiered_interchange_with_kind_branch
        grounds:
          - calculations.settlement_net_operator_revenue
          - entities.Transaction.fields.monthly_seq
          - entities.Transaction.fields.kind
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — interchange is tier-selected
          per-txn by monthly_seq (35/42/50), surcharge is conditional on kind==WITHDRAWAL,
          and network fee scales with count; BALANCE_INQUIRY rows are branch-excluded.
        test_recipe:
          setup:
            - "ATM surcharge 295, CA, approved disclosure, monthly_wd_count seeded 498."
            - "5 WITHDRAWALs (seqs 499..503) of 2000c plus 2 BALANCE_INQUIRY posted; settled over the month."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V3", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1500, commission_flat_per_wd_cents: 30, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 M" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-IC", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /atms/${atm_id}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd_id: $.data.id }
            - call: "POST /fee-disclosures/${fd_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_inject/atm_monthly_wd_count"
              payload: { atm_id: "${atm_id}", monthly_wd_count: 498 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "BALANCE_INQUIRY" }
              as: FieldTech
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "BALANCE_INQUIRY" }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /settlement-runs/${run_id}/settle"
              payload: {}
              as: SettlementOfficer
              captures: { wc: $.data.withdrawal_count, ic: $.data.interchange_revenue_cents, net: $.data.net_operator_revenue_cents }
          assert:
            - "withdrawal_count == 5 (2 BALANCE_INQUIRY excluded)"
            - "interchange_revenue_cents == 196 (seqs 499,500 @35 + 501,502,503 @42)"
            - "surcharge_revenue_cents == 1475 and network_fee_cents == 40"
            - "net_operator_revenue_cents == 1631"

      - name: commission_eval_order_pct_then_ceiling
        grounds:
          - calculations.commission_split
          - entities.SiteMerchant.fields.commission_monthly_ceiling_cents
          - entities.CommissionStatement.fields.commission_cents
        distinguishing_aspect: |
          MODE (c): circular-looking eval order — commission depends on net_operator_revenue
          (computed first), then base=max(pct,flat), then a ceiling cap keyed on month-to-date
          paid; pinning order yields commission 100 (not 815) when only 100c ceiling headroom remains.
        test_recipe:
          setup:
            - "Merchant pct 5000bps, flat 0, ceiling 200c. One ATM (surcharge 295, CA, approved disclosure)."
            - "monthly_wd_count seeded 498; 5 WITHDRAWALs of 2000c posted. A prior ACCRUED statement of 100c already exists in-month (run1) leaving 100c headroom."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V4", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "Cap", commission_pct_bps: 5000, commission_flat_per_wd_cents: 0, commission_monthly_ceiling_cents: 200, commission_basis: "PCT_ONLY" }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-CAP1", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm1: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-CAP2", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm2: $.data.id }
            - call: "POST /atms/${atm1}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd1: $.data.id }
            - call: "POST /fee-disclosures/${fd1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /atms/${atm2}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd2: $.data.id }
            - call: "POST /fee-disclosures/${fd2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm1}/transactions"
              payload: { kind: "BALANCE_INQUIRY" }
              as: FieldTech
            - call: "POST /atms/${atm1}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm1}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run1: $.data.id }
            - call: "POST /settlement-runs/${run1}/settle"
              payload: {}
              as: SettlementOfficer
            - call: "POST /_inject/atm_monthly_wd_count"
              payload: { atm_id: "${atm2}", monthly_wd_count: 498 }
              as: PlatformAdmin
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm2}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /settlement-runs/${run2}/settle"
              payload: {}
              as: SettlementOfficer
            - call: "GET /commission-statements?settlement_run_id=${run2}"
              payload: {}
              as: SettlementOfficer
              captures: { c2: $.data.0.commission_cents, k2: $.data.0.operator_keeps_cents }
          assert:
            - "run1 statement commission_cents == 161 (net 295+35-8=322; pct floor(322*0.5)=161; under ceiling 200)"
            - "run2 statement pct_amount_cents == 815 (floor(1631*0.5))"
            - "run2 statement commission_cents == 39 (ceiling 200 minus 161 already accrued in-month = 39 headroom)"
            - "run2 statement operator_keeps_cents == 1592"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_ticket_reopen_cycle
        grounds:
          - state_machines.ServiceTicket.RESOLVED_to_OPEN
          - entities.ServiceTicket.fields.reopen_count
          - state_machines.ServiceTicket.ACKNOWLEDGED_to_RESOLVED
        distinguishing_aspect: |
          ServiceTicket is CYCLIC: RESOLVED->OPEN loops back, incrementing reopen_count and
          re-faulting the ATM; a linear pipeline could never return to OPEN.
        test_recipe:
          setup:
            - "ATM IN_SERVICE. One MINOR CASH_JAM ticket opened (ATM->FAULTED), acknowledged by tech T1, resolved (ATM->IN_SERVICE)."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V5", provisioned_cents: 100000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "TX", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 T" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-RC", location_id: "${loc_id}", surcharge_cents: 100 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { atm_id: "${atm_id}", fault_kind: "CASH_JAM", severity: "MINOR" }
              as: FieldTech
              captures: { tk_id: $.data.id }
            - call: "POST /service-tickets/${tk_id}/acknowledge"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
            - call: "POST /service-tickets/${tk_id}/resolve"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
          trigger:
            - call: "POST /service-tickets/${tk_id}/reopen"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
              captures: { st: $.data.status, rc: $.data.reopen_count }
            - call: "GET /atms/${atm_id}"
              payload: {}
              as: FieldTech
              captures: { ops: $.data.operational_status }
          assert:
            - "ServiceTicket status == OPEN after reopen"
            - "ServiceTicket reopen_count == 1"
