      - name: correction_submitter_cannot_accept_its_own_request
        claim_type: RBAC denial
        grounds:
          - roles[PlatformVerifier]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.CorrectionRequest.fields.submitted_by_user_id
        distinguishing_aspect: "The same X-User-ID that filed the correction request is refused when it tries to ACCEPT it, even while holding a valid PlatformVerifier role — CLAIM by that same id is refused too."
        test_recipe:
