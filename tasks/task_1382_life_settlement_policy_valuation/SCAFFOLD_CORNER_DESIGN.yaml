  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: screening_failure_reasons_fixed_order
        claim_type: constants_applied
        grounds: [calculations.calc_eligibility_screening, entities.EligibilityScreening.fields.failure_reasons]
        distinguishing_aspect: "All five checks fail at once and failure_reasons reports them in the pinned fixed order [LICENSE, FACE, AGE, CONTESTABILITY, TYPE] regardless of evaluation accident."
        test_recipe:
          setup: ["No NV license; broker; insured DOB 1990-01-01 state NV; policy face 9999999, issue 2025-08-01 (in contestability at 2026-08-01), TERM_NONCONVERTIBLE; case submitted"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "NV" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1990-01-01", state_code: "NV", gender: "M", smoker_status: "TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 9999999, policy_type: "TERM_NONCONVERTIBLE", issue_date: "2025-08-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager, captures: { res: "$.data.result", reasons: "$.data.failure_reasons" } }
          assert:
