            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 153090, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2" }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease}", seller_stated_amount_cents: 153090, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep: $.data.id } }
            - { call: "POST /acquisitions/deposits/${dep}/reconcile", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-6", position: "MAINTENANCE_TECH", hire_date: "2020-01-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "TERMINATE", notice_date: "2026-08-10T00:00:00Z", effective_date: "2026-09-01T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/service-contracts", payload: { acquisition_id: "${acq}", vendor_name: "LiftCo", service_type: "ELEVATOR", monthly_cost_cents: 300000, term_end_date: "2026-12-31T00:00:00Z", auto_renew: false, cancellation_notice_days: 60, cancellation_penalty_cents: 0 }, as: VendorManager, as_user_id: "vm-1", captures: { sc: $.data.id } }
            - { call: "POST /acquisitions/service-contracts/${sc}/begin-review", payload: {}, as: VendorManager, as_user_id: "vm-1" }
            - { call: "POST /acquisitions/service-contracts/${sc}/assume", payload: {}, as: VendorManager, as_user_id: "vm-1" }
            - { call: "POST /acquisitions/${acq}/complete-diligence", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v2: $.data.version } }
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v2}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt_d: $.data.id } }
            - { call: "POST /acquisitions/proration-statements/${stmt_d}/submit-review", payload: {}, as: UnderwritingManager, as_user_id: "um-2" }
            - { call: "POST /acquisitions/proration-statements/${stmt_d}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-3" }
            - { call: "POST /acquisitions/${acq}/advance-to-pre-closing", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
          trigger:
            - { call: "POST /acquisitions/${acq}/terminate", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { st: $.data.status } }
            - { call: "GET /acquisitions/employee-decisions/${dec}", payload: {}, as: HRPartner, as_user_id: "hr-1", captures: { dec_st: $.data.status } }
            - { call: "GET /acquisitions/service-contracts/${sc}", payload: {}, as: VendorManager, as_user_id: "vm-1", captures: { sc_st: $.data.status } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: HRPartner, as_user_id: "hr-1", captures: { accr: $.data.payroll_accrual_cents } }
          assert:
            - "Acquisition TERMINATED"
            - "Decision RESCINDED (compensation); payroll_accrual_cents back to 0"
            - "ASSUMED contract CANCELLED_EFFECTIVE (PRE_CLOSING unwind)"
  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: proration_dual_variant_corner
        claim_type: variant_divergence
        grounds: [calculations.closing_proration]
        excluded_because:
          difficulty_instance: proration_day_count_methods_diverge
          rationale: "Variant divergence (93708 vs 95000) asserted in §1.8."

      - name: tax_and_deposit_and_basis_variants_corner
        claim_type: variant_divergence
        grounds: [calculations.tax_reassessment_projection, calculations.deposit_interest_accrual, calculations.deferred_maintenance_rollup]
        excluded_because:
          difficulty_instance: tax_projection_methods_diverge
          rationale: "Tax, deposit-interest, and maintenance-basis variants are asserted by the three remaining §1.8 dual_variant_calc instances."

      - name: net_effective_rent_excludes_unverified_concessions
        claim_type: input_set_filtering
        grounds: [calculations.net_effective_rent, entities.LeaseFile.fields.net_effective_rent_cents]
        distinguishing_aspect: "NER counts only VERIFIED concessions: PENDING concession leaves NER at 150000; verifying it at 120000 total drops NER to exactly 140000."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; unit with lease (150000 x 12 months); one PENDING RECURRING_MONTHLY concession face value 10000 covering 2026-01-01..2026-12-31"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "NER Deal", address: "21 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/concessions", payload: { lease_file_id: "${lease}", concession_type: "RECURRING_MONTHLY", value_cents: 10000, coverage_start_date: "2026-01-01T00:00:00Z", coverage_end_date: "2026-12-31T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { conc: $.data.id } }
            - { call: "GET /acquisitions/lease-files/${lease}", payload: {}, as: AcquisitionsAnalyst, captures: { ner0: $.data.net_effective_rent_cents } }
          trigger:
            - { call: "POST /acquisitions/concessions/${conc}/verify", payload: { verified_value_cents: 120000 }, as: AcquisitionsAnalyst }
            - { call: "GET /acquisitions/lease-files/${lease}", payload: {}, as: AcquisitionsAnalyst, captures: { ner1: $.data.net_effective_rent_cents } }
          assert:
            - "While PENDING: net_effective_rent_cents == 150000 (no verified concessions counted)"
            - "After verify: net_effective_rent_cents == 140000 (round_half_up((150000*12 - 120000)/12))"

      - name: utility_outlier_boundary_and_normalized_totals
        claim_type: boundary_edge
        grounds: [calculations.utility_expense_normalization, entities.UtilityExpenseRecord.fields.is_outlier]
        distinguishing_aspect: "The +-20% band is exclusive at its edge: a record exactly at 1.20x the trailing average is NOT an outlier (strict >), while 1 cent above is; expense-summary normalizes only the outlier."
        test_recipe:
          setup:
            - "Acquisition at default clock 2026-08-01 (trailing window 2025-08..2026-07)"
            - "ELECTRIC 2026-04..06 = 100000 each, 2026-07 = 120001 (avg of others 100000; 120001 > 120000 => outlier)"
            - "GAS 2026-04..06 = 100000 each, 2026-07 = 120000 (exactly 1.20x => NOT outlier)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Util Deal", address: "22 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-04", category: "ELECTRIC", amount_cents: 100000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-05", category: "ELECTRIC", amount_cents: 100000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-06", category: "ELECTRIC", amount_cents: 100000, source: "BILL_AUDIT" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-07", category: "ELECTRIC", amount_cents: 120001, source: "SELLER_T12" }, as: AcquisitionsAnalyst, captures: { rec_e: $.data.id, out_e: $.data.is_outlier, norm_e: $.data.normalized_amount_cents } }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-04", category: "GAS", amount_cents: 100000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-05", category: "GAS", amount_cents: 100000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-06", category: "GAS", amount_cents: 100000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-07", category: "GAS", amount_cents: 120000, source: "SELLER_T12" }, as: AcquisitionsAnalyst, captures: { rec_g: $.data.id, out_g: $.data.is_outlier } }
          trigger:
            - { call: "GET /acquisitions/${acq}/expense-summary", payload: {}, as: AcquisitionsAnalyst, captures: { raw: $.data.total_t12_raw_cents, norm: $.data.total_t12_normalized_cents, oc: $.data.outlier_count } }
          assert:
            - "ELECTRIC 120001 record: is_outlier == true, normalized_amount_cents == 100000 (replaced by category average)"
            - "GAS 120000 record: is_outlier == false (exactly 1.20x is not strictly greater)"
            - "expense-summary: total_t12_raw_cents == 840001, total_t12_normalized_cents == 820000, outlier_count == 1"

      - name: estimate_rows_excluded_from_expense_summary
        claim_type: input_set_filtering
        grounds: [calculations.utility_expense_normalization, entities.UtilityExpenseRecord.fields.source]
        distinguishing_aspect: "ESTIMATE rows are excluded from averages and summary sums even when their amount would dominate the raw total."
        test_recipe:
          setup: ["Acquisition; OTHER category: three SELLER_T12 rows of 200000 (2026-04..06) plus one ESTIMATE row of 999999 (2026-07)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Est Deal", address: "23 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-04", category: "OTHER", amount_cents: 200000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-05", category: "OTHER", amount_cents: 200000, source: "SELLER_T12" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-06", category: "OTHER", amount_cents: 200000, source: "BILL_AUDIT" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/utility-records", payload: { acquisition_id: "${acq}", period_month: "2026-07", category: "OTHER", amount_cents: 999999, source: "ESTIMATE" }, as: AcquisitionsAnalyst, captures: { est_out: $.data.is_outlier } }
          trigger:
            - { call: "GET /acquisitions/${acq}/expense-summary", payload: {}, as: AcquisitionsAnalyst, captures: { raw: $.data.total_t12_raw_cents, norm: $.data.total_t12_normalized_cents, oc: $.data.outlier_count } }
          assert:
            - "ESTIMATE row: is_outlier == false (excluded from the outlier test)"
            - "Summary totals: raw == 600000 and normalized == 600000 (the 999999 ESTIMATE row is ignored by both); outlier_count == 0"

      - name: severance_tier_boundaries_and_eight_week_cap
        claim_type: boundary_edge
        grounds: [calculations.severance_and_pto]
        distinguishing_aspect: "Tenure tiers floor at whole years: 364 days -> 0 weeks, 365 days -> 1 week; and the 8-week total cap binds exactly (300000 severance + 520000 PTO reduced to 500000)."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; three PROPOSED TERMINATE decisions (all salary 5200000, notice 2026-09-01, effective 2026-10-01): d1 hire 2025-10-02 PTO 40h; d2 hire 2025-10-01 PTO 0h; d3 hire 2020-01-01 PTO 208h"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Sev Deal", address: "24 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "e-364", position: "PORTER", hire_date: "2025-10-02T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "TERMINATE", notice_date: "2026-09-01T00:00:00Z", effective_date: "2026-10-01T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { d1: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "e-365", position: "PORTER", hire_date: "2025-10-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 0, decision: "TERMINATE", notice_date: "2026-09-01T00:00:00Z", effective_date: "2026-10-01T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { d2: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "e-cap", position: "MANAGER", hire_date: "2020-01-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 208, decision: "TERMINATE", notice_date: "2026-09-01T00:00:00Z", effective_date: "2026-10-01T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { d3: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/employee-decisions/${d1}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sev1: $.data.severance_cents, pto1: $.data.pto_payout_cents } }
            - { call: "POST /acquisitions/employee-decisions/${d2}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sev2: $.data.severance_cents, pto2: $.data.pto_payout_cents } }
            - { call: "POST /acquisitions/employee-decisions/${d3}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sev3: $.data.severance_cents, pto3: $.data.pto_payout_cents } }
          assert:
            - "d1 (364 days tenure): severance_cents == 0 (0 weeks), pto_payout_cents == 100000 (40h x 2500)"
            - "d2 (365 days tenure): severance_cents == 100000 (1 week x 100000), pto_payout_cents == 0"
            - "d3 (6y tenure, 208h PTO): severance_cents == 300000 (3 weeks); raw PTO would be 520000; cap 8*weekly == 800000 binds so pto_payout_cents == 500000 and severance+pto == 800000"

      - name: insurance_risk_tier_boundary_and_override
        claim_type: boundary_edge
        grounds: [calculations.insurance_loss_ratio, state_machines.InsurancePolicy.LOSS_RUNS_REVIEWED_to_ASSUMED, "errors[ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE]"]
        distinguishing_aspect: "loss_ratio exactly 0.80 is HIGH (>= boundary) and blocks assumption without an override; one cent less (0.79999...) is ELEVATED and assumable."
        test_recipe:
          setup: ["Acquisition; policy H premium 1200000 with loss_run_total 2880000 (ratio exactly 0.80); policy E premium 1200000 with loss_run_total 2879999"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Ins Deal", address: "25 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/insurance-policies", payload: { acquisition_id: "${acq}", policy_type: "PROPERTY", carrier_name: "Risky Mutual", annual_premium_cents: 1200000, expiration_date: "2027-06-30T00:00:00Z", prepaid_through_date: "2027-03-31T00:00:00Z", loss_run_total_cents: 2880000, open_claims_count: 2 }, as: AcquisitionsAnalyst, captures: { pol_h: $.data.id } }
            - { call: "POST /acquisitions/insurance-policies", payload: { acquisition_id: "${acq}", policy_type: "GENERAL_LIABILITY", carrier_name: "Calm Mutual", annual_premium_cents: 1200000, expiration_date: "2027-06-30T00:00:00Z", prepaid_through_date: "2027-03-31T00:00:00Z", loss_run_total_cents: 2879999, open_claims_count: 1 }, as: AcquisitionsAnalyst, captures: { pol_e: $.data.id } }
            - { call: "POST /acquisitions/insurance-policies/${pol_h}/review-loss-runs", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { tier_h: $.data.risk_tier } }
            - { call: "POST /acquisitions/insurance-policies/${pol_e}/review-loss-runs", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { tier_e: $.data.risk_tier } }
          trigger:
            - { call: "POST /acquisitions/insurance-policies/${pol_h}/assume", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { err_h: $.data.error_id } }
            - { call: "POST /acquisitions/insurance-policies/${pol_h}/assume", payload: { override_high_risk: true }, as: UnderwritingManager, as_user_id: "um-1", captures: { st_h: $.data.status } }
            - { call: "POST /acquisitions/insurance-policies/${pol_e}/assume", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { st_e: $.data.status } }
          assert:
            - "policy H: risk_tier == HIGH (0.80 exactly meets the >= boundary); assume without override -> ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE"
            - "policy H with override_high_risk true -> ASSUMED"
            - "policy E: risk_tier == ELEVATED (2879999/3600000 < 0.80); assume without override -> ASSUMED"
  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers is rejected 401 before any other check (here: on a payload that is otherwise valid)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /acquisitions", payload: { property_name: "No Auth", address: "27 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED"

      - name: invalid_walk_window_returns_date_range_error
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "walk_end before walk_start is a request-shape error (400 ERR_INVALID_DATE_RANGE) evaluated before any state or overlap check."
        test_recipe:
          setup: ["Acquisition with one unit"]
          setup_api_calls:
