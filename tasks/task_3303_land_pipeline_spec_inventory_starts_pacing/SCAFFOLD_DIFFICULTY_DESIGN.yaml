scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1: dual_variant_calc — different entity domains (Home vs Community)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: home_price_list_vs_net_variant
        grounds:
          - calculations.home_effective_pricing
          - entities.Home.fields.adjusted_price_cents
          - entities.Home.fields.net_effective_price_cents
        distinguishing_aspect: |
          On the Home entity domain, the list_price variant (adjusted_price_cents,
          stage-multiplied, incentive-blind) and the net_effective variant
          (net_effective_price_cents, after capped incentive stack) diverge for
          identical inputs: FRAME stage lifts adjusted to 40,400,000 while a
          500,000 PRICE_CUT pulls net to 39,900,000.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open with CLASSIC series [30000000, 50000000], one PUBLISHED plan (max_starts 20), FRAMING capacity 20"
            - "ACTIVE PRICE_CUT incentive of 500000 cents covering the clock"
            - "One home base_price_cents 40000000, premium 0, advanced to FRAME"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 500000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER, captures: {h1_adj: $.data.adjusted_price_cents, h1_net: $.data.net_effective_price_cents, h1_stage: $.data.build_stage} }
          assert:
            - "Home.${h1}.build_stage == FRAME"
            - "Home.${h1}.adjusted_price_cents == 40400000 (round_half_up(40000000 * 1.01))"
            - "Home.${h1}.stacked_incentive_cents == 500000 (cap 2424000 not binding)"
            - "Home.${h1}.net_effective_price_cents == 39900000"
            - "adjusted_price_cents != net_effective_price_cents for identical inputs"

      - name: absorption_trailing_vs_forward_pace
        grounds:
          - calculations.absorption_and_supply
          - entities.Community.fields.trailing_absorption_rate
          - entities.Community.fields.forward_pace_rate
        distinguishing_aspect: |
          On the Community entity domain, the trailing_actual variant counts only
          CLOSED contracts in the trailing 90-day window (3/3 = 1.0) while the
          forward_pace variant also counts the open pipeline (one PENDING
          contract -> 4/3 = 1.3333); same community, same instant, different rates.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 20, FRAMING capacity 20"
            - "Homes H1..H3 CLOSED today (built to COMPLETE then closed); H4 with a PENDING contract"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id", lot3: "$.data[2].id", lot4: "$.data[3].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot2}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h2: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot3}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h3: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot4}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h4: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h2}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h2}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h2}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h2}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h3}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h3}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h3}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h3}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h1}", buyer_name: "Buyer One", contract_price_cents: 41200000}, as: SALES_AGENT, captures: {sc1: $.data.id} }
            - { call: "POST /sales-contracts/${sc1}/approve", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts/${sc1}/close", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h2}", buyer_name: "Buyer Two", contract_price_cents: 41200000}, as: SALES_AGENT, captures: {sc2: $.data.id} }
            - { call: "POST /sales-contracts/${sc2}/approve", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts/${sc2}/close", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h3}", buyer_name: "Buyer Three", contract_price_cents: 41200000}, as: SALES_AGENT, captures: {sc3: $.data.id} }
            - { call: "POST /sales-contracts/${sc3}/approve", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts/${sc3}/close", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h4}", buyer_name: "Buyer Four", contract_price_cents: 40000000}, as: SALES_AGENT, captures: {sc4: $.data.id} }
          trigger:
            - { call: "GET /communities/${com}/pacing-summary", as: COMMUNITY_MANAGER, captures: {tr: $.data.trailing_absorption_rate, fp: $.data.forward_pace_rate} }
          assert:
            - "pacing-summary.trailing_absorption_rate == 1.0 (3 closes / 3.0)"
            - "pacing-summary.forward_pace_rate == 4/3 (3 closes + 1 PENDING) / 3.0, reported to 4 decimal places round_half_up == 1.3333"
            - "trailing_absorption_rate != forward_pace_rate for identical closed-sale data"

  # ------------------------------------------------------------------
  # Rule 2: combinatorial_formula — modes (a), (b), (c) all distinct
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: starts_authorization_nested_min
        grounds:
          - calculations.starts_authorization
          - entities.Community.fields.max_starts_remaining
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs and non-linear interaction —
          max_starts_remaining = min(capacity_remaining=7, quota_remaining=3,
          inventory_allowance=2) with a posture-conditional branch (STARVED
          floors the allowance at 1). The nested min over three independent
          quotas yields 2, not any single input's value.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 5 (quota remaining 3 after 2 starts)"
            - "FRAMING commitment committed_units 9 (allocated 2 -> remaining 7)"
            - "Home A standing (UNSOLD); home B RESERVED via PENDING contract"
            - "standing_spec_count == 1, effective_absorption == 1.0, target 3.0 -> allowance = ceil(3.0) - 1 = 2; posture STARVED (months 1.0 < 1.5) so allowance floor 1 does not bind"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 9}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 5, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hA: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot2}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hB: $.data.id} }
            - { call: "POST /sales-contracts", payload: {home_id: "${hB}", buyer_name: "Buyer B", contract_price_cents: 40000000}, as: SALES_AGENT }
          trigger:
            - { call: "GET /communities/${com}/pacing-summary", as: COMMUNITY_MANAGER, captures: {msr: $.data.max_starts_remaining, post: $.data.posture, mos: $.data.months_of_supply} }
          assert:
            - "pacing-summary.months_of_supply == 1.0 (standing 1 / max(0, 1.0))"
            - "pacing-summary.posture == STARVED"
            - "pacing-summary.max_starts_remaining == 2 (min(7, 3, 2))"

      - name: incentive_stacking_round_per_component
        grounds:
          - calculations.incentive_stacking
          - entities.Home.fields.stacked_incentive_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two RATE_BUYDOWN
          components (community-wide 0.0033 and CLASSIC-scoped 0.0047) on an
          adjusted price of 40,000,100: pinned per-component rounding gives
          round(132,000.33)+round(188,000.47) = 320,000, while the rejected
          sum-then-round order gives round(320,000.80) = 320,001 — one cent apart.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series band [30000000, 50000000], plan max_starts 20, capacity 20"
            - "ACTIVE RATE_BUYDOWN 0.0033 with series_code null; ACTIVE RATE_BUYDOWN 0.0047 with series_code CLASSIC"
            - "Home gross 40,000,100 (base 40,000,000 + premium 100), stage PERMITTED (multiplier 1.00)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/incentives", payload: {type: "RATE_BUYDOWN", value_pct: 0.0033, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER }
            - { call: "POST /communities/${com}/incentives", payload: {type: "RATE_BUYDOWN", value_pct: 0.0047, series_code: "CLASSIC", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000, lot_premium_cents: 100}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
          trigger:
            - { call: "GET /homes/${h1}", as: COMMUNITY_MANAGER, captures: {adj: $.data.adjusted_price_cents, stk: $.data.stacked_incentive_cents, net: $.data.net_effective_price_cents} }
          assert:
            - "Home.${h1}.adjusted_price_cents == 40000100"
            - "Home.${h1}.stacked_incentive_cents == 320000 (132000 + 188000; NOT 320001)"
            - "Home.${h1}.net_effective_price_cents == 39680100"

      - name: takedown_escalation_tier_evaluation_order
        grounds:
          - calculations.takedown_pricing
          - entities.Takedown.fields.net_due_per_lot_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation
          order — the credit tier depends on cumulative lots INCLUDING this
          takedown, and the credit applies to the escalated price, not the base.
          Executed 184 days (2 full 91-day quarters) after contract execution:
          escalated 8,160,000; cumulative 25 lots -> 2% tier; net 7,996,800.
        test_recipe:
          setup:
            - "Contract executed at clock 2026-03-01T00:00:00Z"
            - "Takedown T1 of 19 lots executed at clock 2026-06-01T00:00:00Z (92 days -> 1 quarter -> 1% escalation, cumulative 19 -> 0% credit)"
            - "Takedown T2 of 6 lots executed at clock 2026-09-01T00:00:00Z (184 days -> 2 quarters -> 2% escalation, cumulative 25 -> 2% credit)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-03-01T00:00:00Z"}, as: DIVISION_PRESIDENT }
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 19, window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-15T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-06-01T00:00:00Z"}, as: DIVISION_PRESIDENT }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER, captures: {t1_esc: $.data.escalated_lot_price_cents, t1_cred: $.data.credit_per_lot_cents, t1_net: $.data.net_due_per_lot_cents} }
            - { call: "GET /option-contracts/${c1}", as: LAND_MANAGER, captures: {c1v2: $.data.version} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 6, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", expected_contract_version: "${c1v2}"}, as: LAND_MANAGER, captures: {t2: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-01T00:00:00Z"}, as: DIVISION_PRESIDENT }
          trigger:
            - { call: "POST /takedowns/${t2}/execute", payload: {}, as: LAND_MANAGER, captures: {t2_esc: $.data.escalated_lot_price_cents, t2_cred: $.data.credit_per_lot_cents, t2_net: $.data.net_due_per_lot_cents, t2_tot: $.data.total_net_due_cents} }
          assert:
            - "Takedown.${t1}.escalated_lot_price_cents == 8080000 (8,000,000 + round_half_up(80,000 * 1))"
            - "Takedown.${t1}.credit_per_lot_cents == 0 (cumulative 19 < 20)"
            - "Takedown.${t1}.net_due_per_lot_cents == 8080000"
            - "Takedown.${t2}.escalated_lot_price_cents == 8160000 (8,000,000 + round_half_up(80,000 * 2))"
            - "Takedown.${t2}.credit_per_lot_cents == 163200 (round_half_up(0.02 * 8,160,000))"
            - "Takedown.${t2}.net_due_per_lot_cents == 7996800"
            - "Takedown.${t2}.total_net_due_cents == 47980800"

  # ------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities (Home, SalesContract)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: home_parallel_dimensions_with_cancel_cycle
        grounds:
          - state_machines.Home
          - entities.Home.fields.build_stage
          - entities.Home.fields.sales_status
        distinguishing_aspect: |
          Home carries two parallel state dimensions: build_stage advances
          PERMITTED->FOUNDATION->FRAME while sales_status cycles
          UNSOLD->RESERVED->UNSOLD on contract create/terminate; the revert does
          not touch build_stage, and build advance does not touch sales_status.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 20, capacity 20"
            - "Home H1 started (PERMITTED/UNSOLD)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h1}", buyer_name: "Buyer A", contract_price_cents: 40000000}, as: SALES_AGENT, captures: {sc1: $.data.id} }
            - { call: "POST /sales-contracts/${sc1}/terminate", payload: {}, as: SALES_AGENT }
          trigger:
            - { call: "GET /homes/${h1}", as: COMMUNITY_MANAGER, captures: {bs: $.data.build_stage, ss: $.data.sales_status} }
          assert:
            - "Home.${h1}.build_stage == FRAME (advances survived the sales cycle)"
            - "Home.${h1}.sales_status == UNSOLD (cycled RESERVED -> UNSOLD on terminate)"

      - name: sales_contract_renegotiation_cycle
        grounds:
          - state_machines.SalesContract
          - entities.SalesContract.fields.renegotiation_count
        distinguishing_aspect: |
          SalesContract supports the cycle APPROVED -> PENDING -> APPROVED via
          renegotiate (a revision loop, not a one-way pipeline): after
          renegotiating to a new price and re-approving, state is APPROVED and
          renegotiation_count == 1; the home mirrors SOLD -> RESERVED -> SOLD.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 20, capacity 20; no incentives (net floor = adjusted 40,000,000)"
            - "Home H1 (PERMITTED); contract SC1 created at 40,000,000 and APPROVED"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /sales-contracts", payload: {home_id: "${h1}", buyer_name: "Buyer A", contract_price_cents: 40000000}, as: SALES_AGENT, captures: {sc1: $.data.id} }
            - { call: "POST /sales-contracts/${sc1}/approve", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /sales-contracts/${sc1}/renegotiate", payload: {contract_price_cents: 40500000}, as: SALES_AGENT, captures: {st1: $.data.state, rc: $.data.renegotiation_count} }
            - { call: "POST /sales-contracts/${sc1}/approve", payload: {}, as: COMMUNITY_MANAGER, captures: {st2: $.data.state} }
          assert:
            - "SalesContract.${sc1}.state == PENDING after renegotiate; renegotiation_count == 1"
            - "SalesContract.${sc1}.contract_price_cents == 40500000 after renegotiate"
            - "SalesContract.${sc1}.state == APPROVED after re-approve"
            - "Home.${h1}.sales_status == SOLD after re-approve"

  # ------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth 3 vs depth 2, different triggers
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: terminate_cascade_home_to_posture_to_incentive
        grounds:
          - state_machines.SalesContract.APPROVED_to_TERMINATED
          - state_machines.Home.SOLD_to_UNSOLD
          - calculations.absorption_and_supply
        distinguishing_aspect: |
          Depth 3: terminate (SalesContract.APPROVED->TERMINATED) mutates Home
          (SOLD->UNSOLD, link 1); the Home mutation recomputes Community
          standing_spec_count 3->4 and flips posture NORMAL->OVERHELD (link 2);
          the posture flip auto-activates the flagged SCHEDULED incentive whose
          window starts tomorrow (link 3), dropping Home A's net price.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 20, capacity 20"
            - "Homes A, B, D standing UNSOLD (months 3.0 -> NORMAL); home C SOLD (APPROVED contract)"
            - "Incentive PRICE_CUT 1,000,000, window 2026-09-02..2026-09-30 (SCHEDULED at clock), auto_activate_on_overheld = true"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 1000000, window_start: "2026-09-02T00:00:00Z", window_end: "2026-09-30T00:00:00Z", auto_activate_on_overheld: true}, as: COMMUNITY_MANAGER }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lotA: "$.data[0].id", lotB: "$.data[1].id", lotC: "$.data[2].id", lotD: "$.data[3].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lotA}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hA: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lotB}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hB: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lotC}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hC: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lotD}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hD: $.data.id} }
            - { call: "POST /sales-contracts", payload: {home_id: "${hC}", buyer_name: "Buyer C", contract_price_cents: 40000000}, as: SALES_AGENT, captures: {scC: $.data.id} }
            - { call: "POST /sales-contracts/${scC}/approve", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "GET /homes/${hA}", as: COMMUNITY_MANAGER, captures: {hA_net_before: $.data.net_effective_price_cents} }
          trigger:
            - { call: "POST /sales-contracts/${scC}/terminate", payload: {}, as: SALES_AGENT }
            - { call: "GET /communities/${com}", as: COMMUNITY_MANAGER, captures: {posture: $.data.posture, mos: $.data.months_of_supply, ssc: $.data.standing_spec_count} }
            - { call: "GET /homes/${hA}", as: COMMUNITY_MANAGER, captures: {hA_net_after: $.data.net_effective_price_cents} }
            - { call: "GET /communities/${com}/incentives", as: COMMUNITY_MANAGER, captures: {inc_status: "$.data[0].status"} }
          assert:
            - "Home.${hA}.net_effective_price_cents before terminate == 40000000 (incentive SCHEDULED)"
            - "Community.posture after terminate == OVERHELD; months_of_supply == 4.0; standing_spec_count == 4"
            - "Incentive[0].status == ACTIVE (auto-activated by the OVERHELD flip)"
            - "Home.${hA}.net_effective_price_cents after terminate == 39000000"

      - name: capacity_reduce_cascade_plan_recompute_to_starts_halted
        grounds:
          - calculations.capacity_allocation
          - calculations.starts_authorization
          - entities.Community.fields.starts_halted
        distinguishing_aspect: |
          Depth 2 from a different trigger: reduce (committed 9 -> 2 with 2
          allocated, link 0) recomputes the commitment's remaining_units to 0
          (link 1); that recompute re-derives Community.max_starts_remaining to 0
          and sets starts_halted = true (link 2) even though quota (3) and
          allowance (2) are still positive.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 5, FRAMING commitment committed 9"
            - "Home A standing; home B RESERVED (allocated_units == 2, starts_this_period == 2, standing == 1)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 9}, as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {cc1: $.data.id} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 5, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hA: $.data.id} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot2}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {hB: $.data.id} }
            - { call: "POST /sales-contracts", payload: {home_id: "${hB}", buyer_name: "Buyer B", contract_price_cents: 40000000}, as: SALES_AGENT }
          trigger:
            - { call: "POST /capacity-commitments/${cc1}/reduce", payload: {new_committed_units: 2}, as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {rem: $.data.remaining_units} }
            - { call: "GET /communities/${com}/pacing-summary", as: COMMUNITY_MANAGER, captures: {msr: $.data.max_starts_remaining, halt: $.data.starts_halted} }
          assert:
            - "CapacityCommitment.${cc1}.remaining_units == 0 after reduce"
            - "pacing-summary.max_starts_remaining == 0 (capacity binds despite quota 3 and allowance 2)"
            - "pacing-summary.starts_halted == true"

  # ------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: home_start_state_beats_fiscal_quota
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_COMMUNITY_NOT_OPEN]
          - errors[ERR_STARTS_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the same home-start request
          violates both (community phase SELLING_OUT->CLOSE_OUT->CLOSED blocks
          the start AND pacing quota is exhausted with starts_this_period ==
          max_starts); priority 6 state error ERR_COMMUNITY_NOT_OPEN must win
          over the priority 10 fiscal error.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open then advanced to CLOSED (advance-phase x3)"
            - "Plan max_starts 1; one home already started (quota exhausted); second lot available"
