              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "DC-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
