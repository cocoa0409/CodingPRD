          - "Group's total SCHEDULED minutes on the UTC calendar date of scheduled_start plus this duration_minutes <= ENGAGEMENT_DAILY_CAP_MINUTES (ERR_ENGAGEMENT_DAILY_CAP_EXCEEDED)"
        side_effects: []
