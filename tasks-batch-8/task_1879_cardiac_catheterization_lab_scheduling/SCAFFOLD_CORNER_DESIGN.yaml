      - name: priority_authz_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 3): a RegistryCoordinator cancelling a nonexistent case gets ERR_INSUFFICIENT_PERMISSIONS, not ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/cases/11111111-2222-3333-4444-555555555555/cancel"
              as: RegistryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS (not 404)"

      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent without the X-User-Role header is rejected ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cath-lab/cases"
