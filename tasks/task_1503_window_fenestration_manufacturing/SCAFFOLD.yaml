# =============================================================================
# Window & Fenestration Manufacturing — scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Window & Fenestration Manufacturing (Andersen/Pella plant): configurator
  (frame/glass/grid/hardware) & price rules, IG unit build & spacer/argon fill,
  NFRC/energy label & code-by-state rules, glass breakage & reorder cycle,
  order release wave & shipping rack, warranty by component vs whole unit,
  service-part shipment, special-shape lead time

domain_name: window-fenestration-manufacturing
api_prefix: /fenestration

# Step 0 — complexity profile
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel   # WindowOrder production_status x compliance_status; IGUnit cyclic remake; ShippingRack cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # IGUnit.remake_of_id
    - cross_aggregate       # EnergyLabel -> EnergyCodeRule, ShippingRack -> WindowOrder
  role_model: hierarchical_override   # PlantManager superset of all operational roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer business name" }
      - { name: ship_to_state_code, type: string, source: input, description: "Default 2-letter US state code for shipments" }
      - { name: credit_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CREDIT_HOLD — gates order confirm", constraints: "ACTIVE | CREDIT_HOLD" }

  - name: CatalogSeries
    parent: null
    common_fields: true
    fields:
      - { name: series_code, type: string, source: input, description: "Unique series code, e.g. V200" }
      - { name: frame_material, type: enum, source: input, description: "VINYL | WOOD | ALUMINUM_CLAD | FIBERGLASS", constraints: "VINYL | WOOD | ALUMINUM_CLAD | FIBERGLASS" }
      - { name: base_rate_cents_per_ui, type: integer, source: input, description: "Base price per united inch (width+height), integer cents" }
      - { name: min_billable_sqft, type: number, source: input, description: "Minimum glazing area billed per unit" }
      - { name: max_united_inches, type: integer, source: input, description: "Size cap: width+height must be <= this" }
      - { name: special_shape_upcharge_pct, type: integer, source: input, description: "Percent upcharge on base price for non-RECTANGLE shapes (e.g. 40 = +40%)" }
      - { name: lead_time_standard_days, type: integer, source: input, description: "Production lead time for RECTANGLE lines" }
      - { name: lead_time_special_shape_days, type: integer, source: input, description: "Production lead time for ARCH | CIRCLE | TRAPEZOID lines" }
      - { name: frame_warranty_years, type: integer, source: input, description: "Frame component warranty window in years" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED — DISCONTINUED blocks new lines", constraints: "ACTIVE | DISCONTINUED" }

  - name: GlassPackage
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique glass package code" }
      - { name: pane_count, type: integer, source: input, description: "2 | 3" }
      - { name: spacer_type, type: enum, source: input, description: "ALUMINUM | WARM_EDGE", constraints: "ALUMINUM | WARM_EDGE" }
      - { name: argon_target_pct, type: integer, source: input, description: "Target argon fill percentage" }
      - { name: argon_min_pct, type: integer, source: input, description: "Minimum acceptable argon fill; QC boundary is inclusive (>= passes)" }
      - { name: catalog_u_factor, type: number, source: input, description: "Catalog (provisional) NFRC U-factor" }
      - { name: catalog_shgc, type: number, source: input, description: "Catalog (provisional) NFRC SHGC" }
      - { name: price_per_sqft_cents, type: integer, source: input, description: "Glass surcharge per billable sqft per unit, integer cents" }
      - { name: ig_warranty_years, type: integer, source: input, description: "IG seal component warranty window in years" }

  - name: EnergyCodeRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter US state code this rule applies to" }
      - { name: max_u_factor, type: number, source: input, description: "Maximum compliant U-factor (inclusive <=)" }
      - { name: max_shgc, type: number, source: input, description: "Maximum compliant SHGC (inclusive <=)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; null = open-ended", default: null }

  - name: WindowOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; ordering dealer" }
      - { name: ship_to_state_code, type: string, source: input, description: "Destination state; defaults to Dealer.ship_to_state_code when omitted", default: null }
      - { name: order_date, type: datetime, source: input, description: "Order date used for energy-code rule selection and lead-time gating" }
      - { name: production_status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | RELEASED | IN_PROGRESS | COMPLETED | SHIPPED | DELIVERED | CANCELLED", constraints: "DRAFT | CONFIRMED | RELEASED | IN_PROGRESS | COMPLETED | SHIPPED | DELIVERED | CANCELLED" }
      - { name: compliance_status, type: enum, source: system, default: PENDING, description: "PENDING | PROVISIONALLY_COMPLIANT | CERTIFIED — parallel dimension to production_status", constraints: "PENDING | PROVISIONALLY_COMPLIANT | CERTIFIED" }
      - { name: wave_id, type: string, source: system, default: null, description: "FK -> ProductionWave.id; set at wave assignment, cleared on unassign/cancel" }
      - { name: promised_date, type: datetime, source: computed, default: null, description: "order_date + max(line.lead_time_days) over non-CANCELLED lines; null until first line" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of post-rounding line_total_cents of non-CANCELLED lines" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Volume discount computed on pre-discount subtotal tier" }
      - { name: total_price_cents, type: integer, source: computed, default: 0, description: "subtotal_cents - discount_cents, frozen at confirm" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set by confirm-delivery; warranty epoch" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> WindowOrder.id" }
      - { name: series_id, type: string, source: input, description: "FK -> CatalogSeries.id" }
      - { name: glass_package_id, type: string, source: input, description: "FK -> GlassPackage.id" }
      - { name: shape, type: enum, source: input, description: "RECTANGLE | ARCH | CIRCLE | TRAPEZOID", constraints: "RECTANGLE | ARCH | CIRCLE | TRAPEZOID" }
      - { name: width_in, type: number, source: input, description: "Unit width in inches, > 0" }
      - { name: height_in, type: number, source: input, description: "Unit height in inches, > 0" }
      - { name: quantity, type: integer, source: input, description: "Units on this line, >= 1" }
      - { name: grid_style, type: enum, source: input, description: "NONE | COLONIAL | PRAIRIE | DIAMOND", constraints: "NONE | COLONIAL | PRAIRIE | DIAMOND" }
      - { name: hardware_finish, type: enum, source: input, description: "STANDARD | BRUSHED_NICKEL | OIL_RUBBED_BRONZE", constraints: "STANDARD | BRUSHED_NICKEL | OIL_RUBBED_BRONZE" }
      - { name: united_inches, type: number, source: computed, description: "width_in + height_in" }
      - { name: glazing_sqft, type: number, source: computed, description: "round_half_up(width*height/144 * SHAPE_AREA_FACTOR[shape], 2) per unit" }
      - { name: billable_sqft, type: number, source: computed, description: "max(glazing_sqft, series.min_billable_sqft)" }
      - { name: lead_time_days, type: integer, source: computed, description: "series.lead_time_special_shape_days if shape != RECTANGLE else series.lead_time_standard_days" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-line rounded total per line_pricing calculation" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONFIRMED | RELEASED | IN_PRODUCTION | GLASS_HOLD | COMPLETED | SHIPPED | CANCELLED", constraints: "PENDING | CONFIRMED | RELEASED | IN_PRODUCTION | GLASS_HOLD | COMPLETED | SHIPPED | CANCELLED" }
      - { name: rack_id, type: string, source: system, default: null, description: "FK -> ShippingRack.id; set when loaded onto a rack" }

  - name: EnergyLabel
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; 1:1, auto-created with the line" }
      - { name: basis, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL (catalog values) | CERTIFIED (measured argon, worst-unit basis)", constraints: "PROVISIONAL | CERTIFIED" }
      - { name: u_factor, type: number, source: computed, description: "Current rating U-factor per nfrc_rating calculation" }
      - { name: shgc, type: number, source: computed, description: "Current rating SHGC (always catalog_shgc)" }
      - { name: applied_energy_code_rule_id, type: string, source: system, default: null, description: "FK -> EnergyCodeRule.id; rule selected for order.ship_to_state_code at order.order_date; null when none" }
      - { name: compliance, type: enum, source: computed, default: UNEVALUATED, description: "UNEVALUATED (no rule) | PASS | FAIL", constraints: "UNEVALUATED | PASS | FAIL" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | CERTIFIED", constraints: "PROVISIONAL | CERTIFIED" }

  - name: IGUnit
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; units auto-created at wave release" }
      - { name: unit_index, type: integer, source: system, description: "1..quantity within the line" }
      - { name: remake_of_id, type: string, source: system, default: null, description: "FK -> IGUnit.id; points at the BROKEN unit this unit remakes" }
      - { name: spacer_type, type: enum, source: system, description: "Copied from GlassPackage at creation: ALUMINUM | WARM_EDGE", constraints: "ALUMINUM | WARM_EDGE" }
      - { name: argon_measured_pct, type: integer, source: input, default: null, description: "Measured argon fill recorded by qc-check; null until measured" }
      - { name: break_cause, type: enum, source: system, default: null, description: "HANDLING | LAMINATION_DEFECT | SEAL_FAILURE | SHIPPING_DAMAGE (manual) | GAS_NONCOMPLIANCE (system, QC-only)", constraints: "HANDLING | LAMINATION_DEFECT | SEAL_FAILURE | SHIPPING_DAMAGE | GAS_NONCOMPLIANCE" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | GLASS_CUT | SEALED | GAS_FILLED | QC_PASSED | BROKEN | SCRAPPED", constraints: "QUEUED | GLASS_CUT | SEALED | GAS_FILLED | QC_PASSED | BROKEN | SCRAPPED" }

  - name: ProductionWave
    parent: null
    common_fields: true
    fields:
      - { name: wave_date, type: datetime, source: input, description: "Production date of the wave" }
      - { name: capacity_units, type: integer, source: input, description: "Max total window units (inclusive <=)" }
      - { name: capacity_glass_sqft, type: number, source: input, description: "Max total glazing sqft (inclusive <=)" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Sum of quantity over assigned OrderLines with status IN {RELEASED, IN_PRODUCTION, COMPLETED}" }
      - { name: allocated_glass_sqft, type: number, source: computed, default: 0, description: "Sum of glazing_sqft*quantity over the same counted lines, rounded half-up to 2dp after summation" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | OPEN | LOCKED | RELEASED | CLOSED | CANCELLED", constraints: "PLANNED | OPEN | LOCKED | RELEASED | CLOSED | CANCELLED" }

  - name: ShippingRack
    parent: null
    common_fields: true
    fields:
      - { name: rack_code, type: string, source: input, description: "Unique rack code" }
      - { name: slot_capacity, type: integer, source: input, description: "Max window units loaded per reservation (inclusive <=)" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | BOOKED — derived: BOOKED while >= 1 active (RESERVED|LOADING) RackReservation exists", constraints: "AVAILABLE | BOOKED" }

  - name: RackReservation
    parent: null
    common_fields: true
    fields:
      - { name: rack_id, type: string, source: input, description: "FK -> ShippingRack.id" }
      - { name: order_id, type: string, source: input, description: "FK -> WindowOrder.id; must be IN_PROGRESS or COMPLETED" }
      - { name: load_date, type: datetime, source: input, description: "Occupancy window start (inclusive, closed interval)" }
      - { name: ship_date, type: datetime, source: input, description: "Occupancy window end (inclusive); 1-day turnover buffer follows" }
      - { name: assigned_units, type: integer, source: computed, default: 0, description: "Sum of quantity of lines loaded under this reservation" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | LOADING | SHIPPED | CANCELLED", constraints: "RESERVED | LOADING | SHIPPED | CANCELLED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> WindowOrder.id; must be DELIVERED" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; claim attaches to one line" }
      - { name: component, type: enum, source: input, description: "FRAME | IG_SEAL | GLASS | HARDWARE | GRID", constraints: "FRAME | IG_SEAL | GLASS | HARDWARE | GRID" }
      - { name: coverage_variant, type: enum, source: input, description: "COMPONENT (per-component windows) | WHOLE_UNIT (blanket window)", constraints: "COMPONENT | WHOLE_UNIT" }
      - { name: failure_date, type: datetime, source: input, description: "Date of failure; >= delivered_at and <= current logical time" }
      - { name: description, type: string, source: input, description: "Free-text failure description" }
      - { name: coverage_pct, type: integer, source: computed, description: "0..100 per warranty_coverage calculation for the chosen variant" }
      - { name: remedy, type: enum, source: system, default: null, description: "REPAIR_PART | REFUND — chosen at approve", constraints: "REPAIR_PART | REFUND" }
      - { name: remedy_value_cents, type: integer, source: computed, default: null, description: "round_half_up(line_total_cents_snapshot * coverage_pct / 100); set at approve" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | FULFILLED | CLOSED", constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | FULFILLED | CLOSED" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Recorded on deny" }

  - name: ServicePartShipment
    parent: null
    common_fields: true
    fields:
      - { name: warranty_claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; created at approve with remedy REPAIR_PART" }
      - { name: part_sku, type: string, source: input, description: "Service part SKU (carried from approve input)" }
      - { name: quantity, type: integer, source: input, description: "Part quantity (carried from approve input)" }
      - { name: carrier, type: enum, source: input, description: "PARCEL | STANDARD_FREIGHT | EXPEDITED (carried from approve input)", constraints: "PARCEL | STANDARD_FREIGHT | EXPEDITED" }
      - { name: shipping_charge_cents, type: integer, source: computed, description: "0 when claim coverage_pct == 100 else CARRIER_FEE[carrier]" }
      - { name: status, type: enum, source: system, default: PICKING, description: "PICKING | SHIPPED | DELIVERED", constraints: "PICKING | SHIPPED | DELIVERED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WindowOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    note: "Two parallel dimensions: production_status (this machine) x compliance_status (PENDING -> PROVISIONALLY_COMPLIANT at confirm -> CERTIFIED at completion). They evolve independently."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /fenestration/orders/{id}/confirm"
        actor: "DealerRep (own order) | PlantManager"
        preconditions:
          - "Dealer.credit_status == ACTIVE (ERR_DEALER_CREDIT_HOLD)"
          - "Order has >= 1 non-CANCELLED line (ERR_ORDER_HAS_NO_LINES)"
          - "Every line's EnergyLabel.compliance IN {PASS, UNEVALUATED} (ERR_ENERGY_CODE_VIOLATION)"
        side_effects:
          - "Recompute all line prices, order subtotal_cents/discount_cents/total_price_cents and freeze them"
          - "compliance_status -> PROVISIONALLY_COMPLIANT"
          - "Each line: PENDING -> CONFIRMED"
          - "Increments WindowOrder.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /fenestration/production-waves/{waveId}/assignments"
        actor: "ProductionLead | PlantManager"
        preconditions:
          - "Wave.status == OPEN (ERR_WAVE_NOT_OPEN)"
          - "Capacity: allocated_units + sum(line.quantity) <= capacity_units (ERR_WAVE_CAPACITY_EXCEEDED)"
          - "Glass capacity: allocated_glass_sqft + sum(line glazing_sqft*quantity) <= capacity_glass_sqft (ERR_WAVE_GLASS_CAPACITY_EXCEEDED)"
          - "Lead time: wave.wave_date >= order.order_date + max(line.lead_time_days) days (ERR_WAVE_BEFORE_LEAD_TIME)"
          - "OCC: expected_wave_version == wave.version (ERR_STALE_VERSION)"
        side_effects:
          - "order.wave_id = wave; lines CONFIRMED -> RELEASED"
          - "wave.allocated_units/allocated_glass_sqft recomputed upward"
          - "Increments ProductionWave.version by 1"
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "system (cascade of POST /fenestration/production-waves/{id}/release)"
        actor: system
        preconditions: []
        side_effects:
          - "Lines RELEASED -> IN_PRODUCTION"
          - "Create line.quantity IGUnits per line (status QUEUED, spacer copied from glass package)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (bubble-up: last line -> COMPLETED)"
        actor: system
        preconditions: ["All non-CANCELLED lines COMPLETED"]
        side_effects: ["compliance_status -> CERTIFIED"]
      - from: COMPLETED
        to: SHIPPED
        trigger: "system (bubble-up: all non-CANCELLED lines SHIPPED after rack ship)"
        actor: system
        preconditions: ["All non-CANCELLED lines SHIPPED"]
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /fenestration/orders/{id}/confirm-delivery"
        actor: "DealerRep (own order) | PlantManager"
        preconditions: []
        side_effects: ["delivered_at = current logical clock"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fenestration/orders/{id}/cancel"
        actor: "DealerRep (own order) | PlantManager"
        preconditions: []
        side_effects: ["Lines PENDING -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fenestration/orders/{id}/cancel"
        actor: "DealerRep (own order) | PlantManager"
        preconditions: []
        side_effects: ["Lines CONFIRMED -> CANCELLED"]
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /fenestration/orders/{id}/cancel"
        actor: "DealerRep (own order) | PlantManager"
        preconditions: []
        side_effects:
          - "Lines RELEASED -> CANCELLED"
          - "Wave allocation released (allocated_units/allocated_glass_sqft recomputed downward)"
          - "order.wave_id = null"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /fenestration/orders/{id}/cancel"
        actor: "PlantManager only"
        preconditions: []
        side_effects:
          - "Lines IN_PRODUCTION|GLASS_HOLD -> CANCELLED"
          - "Each cancelled line's non-terminal IGUnits (QUEUED|GLASS_CUT|SEALED|GAS_FILLED) -> SCRAPPED (depth-2 cascade hop)"
          - "Wave allocation released (recompute; this hop is caused by the line cancellation)"

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "system (order confirm cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (wave assignment cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "system (wave release cascade)"
        actor: system
        preconditions: []
        side_effects: ["IGUnits created (quantity units, QUEUED)"]
      - from: IN_PRODUCTION
        to: GLASS_HOLD
        trigger: "system (cascade hop 1 of IGUnit breakage or QC compliance failure on any of its units)"
        actor: system
        preconditions: []
        side_effects:
          - "Wave allocation released for this line (cascade hop 2: ProductionWave.allocated_units -= quantity, allocated_glass_sqft -= glazing_sqft*quantity)"
      - from: GLASS_HOLD
        to: IN_PRODUCTION
        trigger: "POST /fenestration/order-lines/{id}/resume-production"
        actor: "ProductionLead | PlantManager"
        preconditions:
          - "Line.status == GLASS_HOLD (ERR_LINE_NOT_ON_GLASS_HOLD)"
          - "Line has no BROKEN unit lacking a remake (every BROKEN unit has an IGUnit with remake_of_id == it) — guaranteed by auto-remake"
          - "Wave re-capacity check: wave.allocated_units + quantity <= capacity_units AND wave.allocated_glass_sqft + glazing_sqft*quantity <= capacity_glass_sqft (ERR_WAVE_CAPACITY_EXCEEDED / ERR_WAVE_GLASS_CAPACITY_EXCEEDED)"
          - "Wave.status == RELEASED (ERR_INVALID_STATE)"
        side_effects: ["Wave allocation re-added (cascade into ProductionWave recompute)"]
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "system (bubble-up: all non-SCRAPPED units of the line QC_PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "EnergyLabel -> CERTIFIED (basis CERTIFIED, worst-unit argon basis per nfrc_rating)"
          - "If last line of order: WindowOrder IN_PROGRESS -> COMPLETED"
      - from: COMPLETED
        to: SHIPPED
        trigger: "system (rack ship cascade; line.rack_id rack SHIPPED)"
        actor: system
        preconditions: []
        side_effects: ["If all order lines SHIPPED: WindowOrder COMPLETED -> SHIPPED"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Wave allocation released"]
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "system (order cancel cascade, PlantManager only)"
        actor: system
        preconditions: []
        side_effects: ["Non-terminal IGUnits -> SCRAPPED; wave allocation released"]
      - from: GLASS_HOLD
        to: CANCELLED
        trigger: "system (order cancel cascade, PlantManager only)"
        actor: system
        preconditions: []
        side_effects: ["Non-terminal IGUnits -> SCRAPPED"]

  - entity: IGUnit
    initial_state: QUEUED
    terminal_states: [QC_PASSED, BROKEN, SCRAPPED]
    note: "Entity-level cycle: QUEUED -> ... -> BROKEN, and each BROKEN unit spawns a remake unit (remake_of_id) starting again at QUEUED. A unit chain allows at most MAX_REMAKES_PER_UNIT remakes."
    transitions:
      - from: QUEUED
        to: GLASS_CUT
        trigger: "POST /fenestration/ig-units/{id}/advance"
        actor: "ProductionLead | PlantManager"
        preconditions: ["Parent OrderLine.status == IN_PRODUCTION (ERR_INVALID_STATE)"]
        side_effects: []
      - from: GLASS_CUT
        to: SEALED
        trigger: "POST /fenestration/ig-units/{id}/advance"
        actor: "ProductionLead | PlantManager"
        preconditions: ["Parent OrderLine.status == IN_PRODUCTION (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SEALED
        to: GAS_FILLED
        trigger: "POST /fenestration/ig-units/{id}/advance"
        actor: "ProductionLead | PlantManager"
        preconditions: ["Parent OrderLine.status == IN_PRODUCTION (ERR_INVALID_STATE)"]
        side_effects: []
      - from: GAS_FILLED
        to: QC_PASSED
        trigger: "POST /fenestration/ig-units/{id}/qc-check"
        actor: "ProductionLead | PlantManager"
        preconditions:
          - "argon_measured_pct >= glass_package.argon_min_pct (inclusive; below -> BROKEN path)"
          - "Certified U-factor at measured fill <= applied rule max_u_factor when a rule applies (else BROKEN with break_cause GAS_NONCOMPLIANCE)"
        side_effects:
          - "argon_measured_pct recorded"
          - "If all sibling units QC_PASSED: line -> COMPLETED (bubble-up chain)"
      - from: GAS_FILLED
        to: BROKEN
        trigger: "POST /fenestration/ig-units/{id}/qc-check (argon below min or certified code failure)"
        actor: system
        preconditions: []
        side_effects:
          - "break_cause = GAS_NONCOMPLIANCE"
          - "Auto-remake: new IGUnit QUEUED with remake_of_id = this unit (fails with ERR_REMAKE_LIMIT_EXCEEDED when chain already has MAX_REMAKES_PER_UNIT remakes)"
          - "Line -> GLASS_HOLD (cascade hop 1); wave allocation released (hop 2); LOCKED wave auto-reopens when allocation falls below half capacity (hop 3)"
      - from: QUEUED
        to: BROKEN
        trigger: "POST /fenestration/ig-units/{id}/report-breakage"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: ["Same breakage cascade: auto-remake + line GLASS_HOLD + wave reallocation + conditional wave auto-unlock"]
      - from: GLASS_CUT
        to: BROKEN
        trigger: "POST /fenestration/ig-units/{id}/report-breakage"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: ["Same breakage cascade"]
      - from: SEALED
        to: BROKEN
        trigger: "POST /fenestration/ig-units/{id}/report-breakage"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: ["Same breakage cascade"]
      - from: GAS_FILLED
        to: BROKEN
        trigger: "POST /fenestration/ig-units/{id}/report-breakage"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: ["Same breakage cascade"]
      - from: QUEUED
        to: SCRAPPED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GLASS_CUT
        to: SCRAPPED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SEALED
        to: SCRAPPED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GAS_FILLED
        to: SCRAPPED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductionWave
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /fenestration/production-waves/{id}/open"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /fenestration/production-waves/{id}/lock"
        actor: "ProductionLead | PlantManager"
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "system (auto-unlock: allocated_units drops below ceil(capacity_units/2) due to a GLASS_HOLD or cancellation reallocation)"
        actor: system
        preconditions: []
        side_effects: ["Wave open for new assignments again"]
      - from: RELEASED
        to: OPEN
        trigger: "system (auto-unlock: allocated_units drops below ceil(capacity_units/2) while RELEASED — wave reopened for backfill)"
        actor: system
        preconditions: []
        side_effects: ["Wave open for new assignments again"]
      - from: LOCKED
        to: RELEASED
        trigger: "POST /fenestration/production-waves/{id}/release"
        actor: "ProductionLead | PlantManager"
        preconditions: ["At least one order assigned (wave_id set, order not CANCELLED) (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Each assigned order with production_status == RELEASED -> IN_PROGRESS (orders already IN_PROGRESS untouched)"
          - "Each line with status == RELEASED -> IN_PRODUCTION, and IGUnits created ONLY for those transitioning lines (GLASS_HOLD lines untouched; no duplicate IG creation on re-release)"
      - from: RELEASED
        to: CLOSED
        trigger: "POST /fenestration/production-waves/{id}/close"
        actor: "ProductionLead | PlantManager"
        preconditions: ["No assigned order with production_status IN {RELEASED, IN_PROGRESS} and no line GLASS_HOLD (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fenestration/production-waves/{id}/cancel"
        actor: "ProductionLead | PlantManager"
        preconditions: ["allocated_units == 0 (ERR_WAVE_HAS_ASSIGNMENTS)"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /fenestration/production-waves/{id}/cancel"
        actor: "ProductionLead | PlantManager"
        preconditions: ["allocated_units == 0 (ERR_WAVE_HAS_ASSIGNMENTS)"]
        side_effects: []

  - entity: ShippingRack
    initial_state: AVAILABLE
    terminal_states: []
    note: "Derived two-state machine (cyclic AVAILABLE <-> BOOKED) driven entirely by its RackReservations."
    transitions:
      - from: AVAILABLE
        to: BOOKED
        trigger: "system (first RackReservation created with status RESERVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: AVAILABLE
        trigger: "system (last active RackReservation leaves RESERVED|LOADING, i.e. all are SHIPPED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RackReservation
    initial_state: RESERVED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: RESERVED
        to: LOADING
        trigger: "POST /fenestration/rack-reservations/{id}/load (first successful load)"
        actor: "ShippingCoordinator | PlantManager"
        preconditions:
          - "Line.status == COMPLETED (ERR_INVALID_STATE)"
          - "Line's order_id == reservation.order_id (ERR_RACK_WRONG_ORDER)"
          - "assigned_units + line.quantity <= rack.slot_capacity (ERR_RACK_CAPACITY_EXCEEDED)"
          - "Line not already loaded: line.rack_id IS NULL (ERR_INVALID_STATE)"
        side_effects: ["line.rack_id = reservation.rack_id; assigned_units += line.quantity"]
      - from: LOADING
        to: LOADING
        trigger: "POST /fenestration/rack-reservations/{id}/load (subsequent loads)"
        actor: "ShippingCoordinator | PlantManager"
        preconditions: ["Same as first load"]
        side_effects: ["line.rack_id = reservation.rack_id; assigned_units += line.quantity"]
      - from: LOADING
        to: SHIPPED
        trigger: "POST /fenestration/rack-reservations/{id}/ship"
        actor: "ShippingCoordinator | PlantManager"
        preconditions: ["Order.production_status == COMPLETED (ERR_ORDER_NOT_SHIPPABLE)"]
        side_effects:
          - "Loaded lines (rack_id == this rack AND status == COMPLETED) -> SHIPPED"
          - "If all non-CANCELLED order lines SHIPPED: order -> SHIPPED (bubble-up)"
          - "Rack recomputes BOOKED/AVAILABLE"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fenestration/rack-reservations/{id}/cancel"
        actor: "ShippingCoordinator | PlantManager"
        preconditions: ["No line loaded yet (assigned_units == 0, ERR_INVALID_STATE)"]
        side_effects: ["Rack recomputes BOOKED/AVAILABLE"]

  - entity: EnergyLabel
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "system (line completion bubble-up)"
        actor: system
        preconditions: []
        side_effects: ["basis = CERTIFIED; u_factor recomputed on worst-unit measured argon; compliance re-evaluated"]
      - from: CERTIFIED
        to: PROVISIONAL
        trigger: "system (line reconfigured — unreachable post-confirm because PATCH requires order DRAFT; declared for completeness)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /fenestration/warranty-claims/{id}/take-review"
        actor: "WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /fenestration/warranty-claims/{id}/request-info"
        actor: "WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /fenestration/warranty-claims/{id}/provide-info"
        actor: "DealerRep (own dealer's claim) | PlantManager"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fenestration/warranty-claims/{id}/approve"
        actor: "WarrantyAdjuster | PlantManager"
        preconditions: ["coverage_pct > 0 (ERR_WARRANTY_EXPIRED)"]
        side_effects:
          - "remedy + remedy_value_cents set"
          - "remedy == REPAIR_PART: create ServicePartShipment (PICKING) with part_sku/quantity/carrier from approve input; shipping_charge_cents computed"
          - "remedy == REFUND: claim immediately -> FULFILLED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /fenestration/warranty-claims/{id}/deny"
        actor: "WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: ["denial_reason recorded"]
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /fenestration/warranty-claims/{id}/appeal"
        actor: "DealerRep (own dealer's claim) | PlantManager"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: FULFILLED
        trigger: "system (ServicePartShipment -> DELIVERED cascade) or immediate on REFUND approve"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /fenestration/warranty-claims/{id}/close"
        actor: "DealerRep (own) | WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /fenestration/warranty-claims/{id}/close"
        actor: "DealerRep (own) | WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: CLOSED
        trigger: "POST /fenestration/warranty-claims/{id}/close"
        actor: "DealerRep (own) | WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []
      - from: DENIED
        to: CLOSED
        trigger: "POST /fenestration/warranty-claims/{id}/close"
        actor: "DealerRep (own) | WarrantyAdjuster | PlantManager"
        preconditions: []
        side_effects: []

  - entity: ServicePartShipment
    initial_state: PICKING
    terminal_states: [DELIVERED]
    transitions:
      - from: PICKING
        to: SHIPPED
        trigger: "POST /fenestration/service-part-shipments/{id}/ship"
        actor: "ShippingCoordinator | PlantManager"
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /fenestration/service-part-shipments/{id}/deliver"
        actor: "ShippingCoordinator | PlantManager"
        preconditions: []
        side_effects: ["Parent WarrantyClaim APPROVED -> FULFILLED"]

  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: []
    note: "credit_status mini-machine: ACTIVE <-> CREDIT_HOLD (cyclic)"
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /fenestration/dealers/{id}/credit-hold"
        actor: "PlantManager"
        preconditions: []
        side_effects: []
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /fenestration/dealers/{id}/credit-release"
        actor: "PlantManager"
        preconditions: []
        side_effects: []

  - entity: CatalogSeries
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /fenestration/catalog-series/{id}/discontinue"
        actor: "PlantEngineer | PlantManager"
        preconditions: []
        side_effects: ["New OrderLine creation with this series rejected (ERR_SERIES_DISCONTINUED); existing lines unaffected"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: wave-assignment-stale-wave
    parent_entity: ProductionWave
    write_endpoint: "POST /fenestration/production-waves/{waveId}/assignments"
    occ_field: expected_wave_version
    description: |
      Assigning an order to a wave mutates the wave's allocation counters and
      bumps ProductionWave.version. A second assignment request carrying a
      previously-observed expected_wave_version is rejected with 412 even when
      remaining capacity would legitimately admit the order, because the
      client's view of the wave is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-line-edit-stale-order
    parent_entity: WindowOrder
    write_endpoint: "PATCH /fenestration/orders/{orderId}/lines/{lineId}"
    occ_field: expected_order_version
    description: |
      Editing a DRAFT order line reprices the line and recomputes the order
      totals, bumping WindowOrder.version. A subsequent edit carrying an older
      expected_order_version is rejected with 412 even though both edits would
      be legitimate DRAFT-state mutations, because the client's view of the
      order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "OrderLine create, OrderLine PATCH, order confirm (re-freeze)"
    algorithm: constraint_propagation
    formula: |
      united_inches = width_in + height_in
      glazing_sqft = round_half_up(width_in * height_in / 144 * SHAPE_AREA_FACTOR[shape], 2)
      billable_sqft = max(glazing_sqft, series.min_billable_sqft)
      shape_mult = 1 if shape == RECTANGLE else 1 + series.special_shape_upcharge_pct/100
      per_unit_raw = united_inches * series.base_rate_cents_per_ui * shape_mult
                     + billable_sqft * glass_package.price_per_sqft_cents
                     + GRID_ADDER[grid_style] + HARDWARE_ADDER[hardware_finish]
      line_total_cents = round_half_up(per_unit_raw * quantity)   # integer cents
    input_set: "The single OrderLine and its referenced CatalogSeries + GlassPackage"
    constants:
      SHAPE_AREA_FACTOR: { RECTANGLE: 1.0, ARCH: 0.85, CIRCLE: 0.785, TRAPEZOID: 0.9 }
      GRID_ADDER: { NONE: 0, COLONIAL: 4000, PRAIRIE: 5500, DIAMOND: 7000 }
      HARDWARE_ADDER: { STANDARD: 0, BRUSHED_NICKEL: 2500, OIL_RUBBED_BRONZE: 3200 }
    precision: "money: integer cents, round_half_up; glazing_sqft: 2dp round_half_up"

  - name: order_subtotal_aggregation
    trigger: "line create/PATCH/cancel; order confirm"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round per line FIRST (line_total_cents is already integer cents), then sum.
      subtotal_cents = sum(line.line_total_cents for line in order.lines where line.status != CANCELLED)
    input_set: "All non-CANCELLED OrderLines of the order"
    precision: "integer cents; per-line rounding happens inside line_pricing, never after summation"

  - name: volume_discount
    trigger: "order confirm (and recomputed on any DRAFT line change)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order pinned (circular-looking dependency resolved):
      # 1. Compute pre-discount subtotal_cents.
      # 2. Select tier from PRE-discount subtotal only.
      # 3. discount_cents = round_half_up(subtotal_cents * pct); total = subtotal - discount.
      # The discounted total NEVER feeds back into tier selection.
      if   subtotal_cents >= 5000000: pct = 0.12
      elif subtotal_cents >= 2000000: pct = 0.08
      elif subtotal_cents >=  500000: pct = 0.05
      else:                           pct = 0.00
      discount_cents = round_half_up(subtotal_cents * pct)
      total_price_cents = subtotal_cents - discount_cents
    input_set: "WindowOrder.subtotal_cents"
    constants:
      TIER1_FLOOR: 500000
      TIER2_FLOOR: 2000000
      TIER3_FLOOR: 5000000
    precision: "integer cents, round_half_up"

  - name: nfrc_rating
    trigger: "line create/PATCH (PROVISIONAL); line completion (CERTIFIED)"
    algorithm: aggregation
    formula: |
      PROVISIONAL basis: u_factor = glass_package.catalog_u_factor; shgc = catalog_shgc
      CERTIFIED basis (pinned):
        worst_argon = min(argon_measured_pct over the line's QC_PASSED units)
        u_factor = round_half_up(catalog_u_factor
                   + (argon_target_pct - worst_argon) * ARGON_DERATE_PER_PT
                   + SPACER_DERATE[spacer_type], 2)
        shgc = catalog_shgc   # unchanged by fill
    input_set: "PROVISIONAL: glass package catalog. CERTIFIED: QC_PASSED IGUnits of the line (worst-unit minimum argon)"
    constants:
      ARGON_DERATE_PER_PT: 0.002
      SPACER_DERATE: { ALUMINUM: 0.01, WARM_EDGE: 0.0 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Line created or reconfigured; before all units QC_PASSED"
        difference: "Uses catalog values verbatim; ignores measured argon"
      - name: certified
        when: "All of the line's units QC_PASSED"
        difference: "Derates catalog U-factor by worst-unit argon shortfall and spacer thermal bridge; identical catalog data can yield a different rating"

  - name: energy_code_rule_selection
    trigger: "EnergyLabel evaluation (line create/PATCH, confirm, certification)"
    algorithm: threshold
    formula: |
      rule = the EnergyCodeRule with state_code == order.ship_to_state_code
             AND effective_from <= order.order_date
             AND (effective_to IS NULL OR order.order_date < effective_to)   # half-open window
      if rule is null: compliance = UNEVALUATED (treated as pass at confirm)
      else: compliance = PASS iff u_factor <= rule.max_u_factor AND shgc <= rule.max_shgc
            (both inclusive); else FAIL
    input_set: "EnergyCodeRules for the order's ship_to_state_code; label's current u_factor/shgc"
    precision: "2dp comparisons on stored values"

  - name: wave_allocation
    trigger: "wave assignment, unassign, line GLASS_HOLD enter/exit, order cancel from RELEASED/IN_PROGRESS"
    algorithm: aggregation
    formula: |
      counted_lines = lines of orders with wave_id == wave.id whose status IN {RELEASED, IN_PRODUCTION, COMPLETED}
      allocated_units = sum(line.quantity)
      allocated_glass_sqft = round_half_up(sum(line.glazing_sqft * line.quantity), 2)
    input_set: "OrderLines of orders assigned to the wave, filtered by line status IN {RELEASED, IN_PRODUCTION, COMPLETED} (GLASS_HOLD and CANCELLED lines are excluded)"
    precision: "units integer; glass 2dp round_half_up after summation"

  - name: wave_auto_unlock
    trigger: "any downward recompute of ProductionWave.allocated_units while status IN {LOCKED, RELEASED}"
    algorithm: threshold
    formula: |
      if status IN {LOCKED, RELEASED} and allocated_units < ceil(capacity_units / 2):
          status -> OPEN
    input_set: "The wave itself"
    precision: "integer comparison, strict <"

  - name: rack_occupancy_overlap
    trigger: "POST /fenestration/shipping-racks/{id}/reservations"
    algorithm: interval_merge
    formula: |
      # Closed-interval occupancy WITH a 1-day turnover buffer after ship_date.
      # New window [l2, s2] conflicts with an existing active reservation [l1, s1] iff
      # NOT (l2 > s1 + 1 day OR l1 > s2 + 1 day).
      # Therefore l2 == s1 + 1 day CONFLICTS (turnover day unavailable);
      # l2 == s1 + 2 days is ALLOWED. Same-day turnover is never allowed.
    input_set: "Other RackReservations of the same rack with status IN {RESERVED, LOADING}"
    precision: "calendar-day granularity"

  - name: lead_time_promise
    trigger: "line create/PATCH/cancel"
    algorithm: aggregation
    formula: |
      line.lead_time_days = series.lead_time_special_shape_days if shape != RECTANGLE
                            else series.lead_time_standard_days
      order.promised_date = order.order_date + max(lead_time_days over non-CANCELLED lines) days
      Wave assignment gate: wave.wave_date >= order.order_date + max(lead_time_days) days
    input_set: "Non-CANCELLED OrderLines of the order"
    precision: "whole days, date arithmetic"

  - name: warranty_coverage
    trigger: "WarrantyClaim create (and re-evaluated at approve)"
    algorithm: decay_function
    formula: |
      years_elapsed = floor((failure_date - order.delivered_at).days / 365)
      COMPONENT variant windows: FRAME -> series.frame_warranty_years; IG_SEAL -> glass_package.ig_warranty_years;
                                 HARDWARE -> 10; GRID -> 10; GLASS -> 2
        20-year components: years_elapsed < 10 -> 100; else max(0, 100 - 10 * (years_elapsed - 10)); 0 beyond window
        10-year components: years_elapsed < 10 -> 100; else 0
        GLASS: years_elapsed < 2 -> 100; else 0
      WHOLE_UNIT variant: blanket 15-year window for any component:
        years_elapsed < 5 -> 100; else max(0, 100 - 20 * (years_elapsed - 5)); 0 at >= 15
      remedy_value_cents = round_half_up(line.line_total_cents * coverage_pct / 100)   # prorate-then-round, once
    input_set: "The claim's OrderLine (frozen line_total_cents), order.delivered_at, failure_date"
    constants:
      COMPONENT_WINDOW: { FRAME: 20, IG_SEAL: 20, HARDWARE: 10, GRID: 10, GLASS: 2 }
      WHOLE_UNIT_WINDOW: 15
    precision: "coverage_pct integer; remedy_value_cents integer round_half_up"
    variants:
      - name: component
        when: "claim.coverage_variant == COMPONENT"
        difference: "Per-component windows and proration schedule"
      - name: whole_unit
        when: "claim.coverage_variant == WHOLE_UNIT"
        difference: "Blanket 15-year window with steeper proration; identical failure dates yield different coverage_pct than COMPONENT"

  - name: service_part_charge
    trigger: "WarrantyClaim approve with remedy REPAIR_PART"
    algorithm: threshold
    formula: |
      shipping_charge_cents = 0 if claim.coverage_pct == 100 else CARRIER_FEE[carrier]
    input_set: "The created ServicePartShipment and its claim"
    constants:
      CARRIER_FEE: { PARCEL: 2500, STANDARD_FREIGHT: 8000, EXPEDITED: 15000 }
    precision: "integer cents"

  - name: argon_qc
    trigger: "POST /fenestration/ig-units/{id}/qc-check"
    algorithm: threshold
    formula: |
      pass_fill = argon_measured_pct >= glass_package.argon_min_pct     # inclusive boundary
      certified_u = round_half_up(catalog_u + (argon_target_pct - argon_measured_pct) * 0.002 + SPACER_DERATE[spacer], 2)
      pass_code = (no applicable rule) OR (certified_u <= rule.max_u_factor AND catalog_shgc <= rule.max_shgc)
      QC_PASSED iff pass_fill AND pass_code; else BROKEN (GAS_NONCOMPLIANCE) + auto-remake cascade
    input_set: "The IGUnit, its line's glass package, and the label's applied EnergyCodeRule"
    precision: "integer pct comparison; 2dp U-factor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "DealerRep ownership: X-User-ID must equal the dealer_id of the target order/claim chain"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "DealerRep-accessible order/line/claim endpoints"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, types valid, enum membership, width/height > 0, quantity >= 1, CIRCLE requires width_in == height_in, failure_date <= current logical time"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fenestration/production-waves/{waveId}/assignments; PATCH /fenestration/orders/{orderId}/lines/{lineId}"
  - priority: 7
    category: state
    check: "Entity state preconditions of the transition (order DRAFT/CONFIRMED, wave OPEN/LOCKED, IG stage, claim review state, rack/reservation state)"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_DRAFT | ERR_ORDER_NOT_CONFIRMED | ERR_ORDER_NOT_SHIPPABLE | ERR_ORDER_NOT_DELIVERED | ERR_WAVE_NOT_OPEN | ERR_WAVE_HAS_ASSIGNMENTS | ERR_IG_NOT_READY_FOR_QC | ERR_LINE_NOT_ON_GLASS_HOLD | ERR_CLAIM_NOT_REVIEWABLE"
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 8
    category: business_safety
    check: "Regulatory: every line label compliance IN {PASS, UNEVALUATED} at confirm"
    error_id: ERR_ENERGY_CODE_VIOLATION
    http_status: 409
    applies_to: "POST /fenestration/orders/{id}/confirm"
  - priority: 9
    category: business_temporal
    check: "Temporal: wave_date >= order_date + max lead time (ERR_WAVE_BEFORE_LEAD_TIME); rack occupancy closed-interval + buffer conflict (ERR_RACK_OCCUPANCY_CONFLICT); failure_date >= delivered_at when order DELIVERED (ERR_INVALID_REQUEST)"
    error_id: "ERR_WAVE_BEFORE_LEAD_TIME | ERR_RACK_OCCUPANCY_CONFLICT | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "wave assignments, rack reservation create, claim create"
  - priority: 10
    category: business_constraint
    check: "Constraint: series ACTIVE (ERR_SERIES_DISCONTINUED), size cap (ERR_SIZE_EXCEEDS_SERIES_LIMIT, 422), remake chain <= MAX_REMAKES_PER_UNIT (ERR_REMAKE_LIMIT_EXCEEDED), no duplicate active claim for (line, component) (ERR_DUPLICATE_ACTIVE_CLAIM), energy-rule windows non-overlapping per state (ERR_ENERGY_RULE_WINDOW_OVERLAP)"
    error_id: "ERR_SERIES_DISCONTINUED | ERR_SIZE_EXCEEDS_SERIES_LIMIT | ERR_REMAKE_LIMIT_EXCEEDED | ERR_DUPLICATE_ACTIVE_CLAIM | ERR_ENERGY_RULE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "line create/PATCH, IG remake cascade, claim create, energy-code-rule create"
  - priority: 11
    category: business_fiscal
    check: "Capacity/fiscal: dealer credit (ERR_DEALER_CREDIT_HOLD), wave unit + glass capacity (ERR_WAVE_CAPACITY_EXCEEDED | ERR_WAVE_GLASS_CAPACITY_EXCEEDED), rack slot capacity (ERR_RACK_CAPACITY_EXCEEDED), warranty coverage > 0 at approve (ERR_WARRANTY_EXPIRED)"
    error_id: "ERR_DEALER_CREDIT_HOLD | ERR_WAVE_CAPACITY_EXCEEDED | ERR_WAVE_GLASS_CAPACITY_EXCEEDED | ERR_RACK_CAPACITY_EXCEEDED | ERR_WARRANTY_EXPIRED"
    http_status: 409
    applies_to: "order confirm, wave assignments, rack load, claim approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default at server start is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced"]

  # --- Dealer ---
  - method: POST
    path: "/fenestration/dealers"
    description: "Create a Dealer"
    roles: [PlantManager]
    code: 201
    input: [name, ship_to_state_code]
    output: Dealer
    side_effects: ["credit_status=ACTIVE"]
  - method: GET
    path: "/fenestration/dealers/{dealerId}"
    description: "Get a Dealer"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/fenestration/dealers/{dealerId}/credit-hold"
    description: "Place dealer on credit hold"
    roles: [PlantManager]
    code: 200
    input: []
    output: Dealer
    side_effects: ["credit_status -> CREDIT_HOLD"]
  - method: POST
    path: "/fenestration/dealers/{dealerId}/credit-release"
    description: "Release dealer credit hold"
    roles: [PlantManager]
    code: 200
    input: []
    output: Dealer
    side_effects: ["credit_status -> ACTIVE"]

  # --- CatalogSeries ---
  - method: POST
    path: "/fenestration/catalog-series"
    description: "Create a CatalogSeries"
    roles: [PlantEngineer, PlantManager]
    code: 201
    input: [series_code, frame_material, base_rate_cents_per_ui, min_billable_sqft, max_united_inches, special_shape_upcharge_pct, lead_time_standard_days, lead_time_special_shape_days, frame_warranty_years]
    output: CatalogSeries
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/fenestration/catalog-series/{seriesId}"
    description: "Get a CatalogSeries"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: CatalogSeries
    side_effects: []
  - method: POST
    path: "/fenestration/catalog-series/{seriesId}/discontinue"
    description: "Discontinue a series"
    roles: [PlantEngineer, PlantManager]
    code: 200
    input: []
    output: CatalogSeries
    side_effects: ["status -> DISCONTINUED"]

  # --- GlassPackage ---
  - method: POST
    path: "/fenestration/glass-packages"
    description: "Create a GlassPackage"
    roles: [PlantEngineer, PlantManager]
    code: 201
    input: [code, pane_count, spacer_type, argon_target_pct, argon_min_pct, catalog_u_factor, catalog_shgc, price_per_sqft_cents, ig_warranty_years]
    output: GlassPackage
    side_effects: []
  - method: GET
    path: "/fenestration/glass-packages/{glassPackageId}"
    description: "Get a GlassPackage"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: GlassPackage
    side_effects: []

  # --- EnergyCodeRule ---
  - method: POST
    path: "/fenestration/energy-code-rules"
    description: "Create an EnergyCodeRule; half-open windows per state must not overlap (adjacency allowed)"
    roles: [PlantEngineer, PlantManager]
    code: 201
    input: [state_code, max_u_factor, max_shgc, effective_from, "effective_to?"]
    output: EnergyCodeRule
    side_effects: ["ERR_ENERGY_RULE_WINDOW_OVERLAP on overlap"]
  - method: GET
    path: "/fenestration/energy-code-rules/{ruleId}"
    description: "Get an EnergyCodeRule"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: EnergyCodeRule
    side_effects: []

  # --- WindowOrder ---
  - method: POST
    path: "/fenestration/orders"
    description: "Create a DRAFT order"
    roles: [DealerRep, PlantManager]
    code: 201
    input: [dealer_id, order_date, "ship_to_state_code?"]
    output: WindowOrder
    side_effects: ["production_status=DRAFT, compliance_status=PENDING, ship_to defaults from dealer"]
  - method: GET
    path: "/fenestration/orders/{orderId}"
    description: "Get an order"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: WindowOrder
    side_effects: []
  - method: GET
    path: "/fenestration/orders"
    description: "List orders (paginated, filterable)"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["dealer_id?", "wave_id?", "production_status?", "limit?", "offset?"]
    output: WindowOrder[]
    side_effects: []
  - method: POST
    path: "/fenestration/orders/{orderId}/confirm"
    description: "Confirm a DRAFT order: freezes prices, evaluates compliance, checks credit"
    roles: [DealerRep, PlantManager]
    code: 200
    input: []
    output: WindowOrder
    side_effects: ["production_status -> CONFIRMED; compliance_status -> PROVISIONALLY_COMPLIANT; totals frozen; lines -> CONFIRMED; increments WindowOrder.version by 1"]
  - method: POST
    path: "/fenestration/orders/{orderId}/cancel"
    description: "Cancel an order (DRAFT/CONFIRMED/RELEASED any permitted role; IN_PROGRESS PlantManager only)"
    roles: [DealerRep, PlantManager]
    code: 200
    input: []
    output: WindowOrder
    side_effects: ["Cancellation cascade: lines -> CANCELLED, IGUnits -> SCRAPPED, wave allocation released"]
  - method: POST
    path: "/fenestration/orders/{orderId}/confirm-delivery"
    description: "Mark SHIPPED order delivered; starts warranty epoch"
    roles: [DealerRep, PlantManager]
    code: 200
    input: []
    output: WindowOrder
    side_effects: ["production_status -> DELIVERED; delivered_at = logical clock"]

  # --- OrderLine ---
  - method: POST
    path: "/fenestration/orders/{orderId}/lines"
    description: "Add a configured line to a DRAFT order; auto-creates its EnergyLabel"
    roles: [DealerRep, PlantManager]
    code: 201
    input: [series_id, glass_package_id, shape, width_in, height_in, quantity, grid_style, hardware_finish]
    output: OrderLine
    side_effects: ["Computes pricing + lead time; creates EnergyLabel (PROVISIONAL); recomputes order totals; increments WindowOrder.version by 1"]
  - method: GET
    path: "/fenestration/orders/{orderId}/lines"
    description: "List lines of an order"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/fenestration/order-lines/{lineId}"
    description: "Get an OrderLine"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/fenestration/order-lines"
    description: "List OrderLines filtered by catalog references or rack"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["order_id?", "series_id?", "glass_package_id?", "rack_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: PATCH
    path: "/fenestration/orders/{orderId}/lines/{lineId}"
    description: "Reconfigure a line while order is DRAFT (OCC on order version)"
    roles: [DealerRep, PlantManager]
    code: 200
    input: [expected_order_version, "series_id?", "glass_package_id?", "shape?", "width_in?", "height_in?", "quantity?", "grid_style?", "hardware_finish?"]
    output: OrderLine
    side_effects: ["Reprice line; recompute order totals; EnergyLabel re-evaluated PROVISIONAL; increments WindowOrder.version by 1"]
  - method: POST
    path: "/fenestration/order-lines/{lineId}/resume-production"
    description: "Resume a GLASS_HOLD line after remake units exist; re-checks wave capacity"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["GLASS_HOLD -> IN_PRODUCTION; wave allocation re-added"]

  # --- EnergyLabel ---
  - method: GET
    path: "/fenestration/order-lines/{lineId}/energy-label"
    description: "Get the line's EnergyLabel (array of 0-1)"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: EnergyLabel[]
    side_effects: []
  - method: GET
    path: "/fenestration/energy-labels/{labelId}"
    description: "Get an EnergyLabel"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: EnergyLabel
    side_effects: []
  - method: GET
    path: "/fenestration/energy-labels"
    description: "List EnergyLabels filtered by applied rule"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["order_line_id?", "applied_energy_code_rule_id?", "limit?", "offset?"]
    output: EnergyLabel[]
    side_effects: []

  # --- ProductionWave ---
  - method: POST
    path: "/fenestration/production-waves"
    description: "Create a wave"
    roles: [ProductionLead, PlantManager]
    code: 201
    input: [wave_date, capacity_units, capacity_glass_sqft]
    output: ProductionWave
    side_effects: ["status=PLANNED, allocations 0"]
  - method: GET
    path: "/fenestration/production-waves/{waveId}"
    description: "Get a wave"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []
  - method: POST
    path: "/fenestration/production-waves/{waveId}/open"
    description: "PLANNED -> OPEN"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []
  - method: POST
    path: "/fenestration/production-waves/{waveId}/assignments"
    description: "Assign a CONFIRMED order to an OPEN wave (OCC on wave version)"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: [order_id, expected_wave_version]
    output: ProductionWave
    side_effects: ["Order CONFIRMED -> RELEASED; lines -> RELEASED; allocation recompute; increments ProductionWave.version by 1"]
  - method: POST
    path: "/fenestration/production-waves/{waveId}/unassign"
    description: "Remove a RELEASED order from a wave (before wave release)"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: [order_id]
    output: ProductionWave
    side_effects: ["Order RELEASED -> CONFIRMED; lines -> CONFIRMED; allocation released; increments ProductionWave.version by 1"]
  - method: POST
    path: "/fenestration/production-waves/{waveId}/lock"
    description: "OPEN -> LOCKED"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []
  - method: POST
    path: "/fenestration/production-waves/{waveId}/release"
    description: "LOCKED -> RELEASED; cascades orders to IN_PROGRESS and creates IGUnits"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: ["Orders -> IN_PROGRESS; lines -> IN_PRODUCTION; IGUnits created (QUEUED)"]
  - method: POST
    path: "/fenestration/production-waves/{waveId}/close"
    description: "RELEASED -> CLOSED when nothing in flight"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []
  - method: POST
    path: "/fenestration/production-waves/{waveId}/cancel"
    description: "PLANNED|OPEN -> CANCELLED when empty"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: ProductionWave
    side_effects: []

  # --- IGUnit ---
  - method: GET
    path: "/fenestration/order-lines/{lineId}/ig-units"
    description: "List IGUnits of a line"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["limit?", "offset?"]
    output: IGUnit[]
    side_effects: []
  - method: GET
    path: "/fenestration/ig-units/{igUnitId}"
    description: "Get an IGUnit"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: IGUnit
    side_effects: []
  - method: GET
    path: "/fenestration/ig-units"
    description: "List IGUnits filtered by remake parent"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["order_line_id?", "remake_of_id?", "limit?", "offset?"]
    output: IGUnit[]
    side_effects: []
  - method: POST
    path: "/fenestration/ig-units/{igUnitId}/advance"
    description: "Advance one production stage (QUEUED->GLASS_CUT->SEALED->GAS_FILLED)"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: []
    output: IGUnit
    side_effects: []
  - method: POST
    path: "/fenestration/ig-units/{igUnitId}/qc-check"
    description: "Record measured argon and run QC (fill threshold + certified code gate)"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: [argon_measured_pct]
    output: IGUnit
    side_effects: ["Pass -> QC_PASSED (+line completion bubble-up); fail -> BROKEN (GAS_NONCOMPLIANCE) + auto-remake + GLASS_HOLD cascade"]
  - method: POST
    path: "/fenestration/ig-units/{igUnitId}/report-breakage"
    description: "Report physical breakage at any pre-QC stage"
    roles: [ProductionLead, PlantManager]
    code: 200
    input: [break_cause]
    output: IGUnit
    side_effects: ["-> BROKEN; auto-remake (ERR_REMAKE_LIMIT_EXCEEDED at cap); line -> GLASS_HOLD; wave reallocation; conditional wave auto-unlock"]

  # --- ShippingRack ---
  - method: POST
    path: "/fenestration/shipping-racks"
    description: "Create a rack"
    roles: [ShippingCoordinator, PlantManager]
    code: 201
    input: [rack_code, slot_capacity]
    output: ShippingRack
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/fenestration/shipping-racks/{rackId}"
    description: "Get a rack"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: ShippingRack
    side_effects: []
  - method: GET
    path: "/fenestration/shipping-racks"
    description: "List racks (filterable)"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ShippingRack[]
    side_effects: []
  # --- RackReservation ---
  - method: POST
    path: "/fenestration/shipping-racks/{rackId}/reservations"
    description: "Create a RackReservation for an order and occupancy window; overlap-checked under closed-interval + 1-day buffer semantics"
    roles: [ShippingCoordinator, PlantManager]
    code: 201
    input: [order_id, load_date, ship_date]
    output: RackReservation
    side_effects: ["status=RESERVED; rack AVAILABLE -> BOOKED"]
  - method: GET
    path: "/fenestration/shipping-racks/{rackId}/reservations"
    description: "List reservations of a rack"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["limit?", "offset?"]
    output: RackReservation[]
    side_effects: []
  - method: GET
    path: "/fenestration/rack-reservations/{reservationId}"
    description: "Get a RackReservation"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: RackReservation
    side_effects: []
  - method: GET
    path: "/fenestration/rack-reservations"
    description: "List RackReservations filtered by order"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["order_id?", "rack_id?", "limit?", "offset?"]
    output: RackReservation[]
    side_effects: []
  - method: POST
    path: "/fenestration/rack-reservations/{reservationId}/load"
    description: "Load one COMPLETED line (whole quantity) under this reservation"
    roles: [ShippingCoordinator, PlantManager]
    code: 200
    input: [order_line_id]
    output: RackReservation
    side_effects: ["RESERVED -> LOADING on first load; line.rack_id = reservation.rack_id; assigned_units += quantity"]
  - method: POST
    path: "/fenestration/rack-reservations/{reservationId}/ship"
    description: "Ship a LOADING reservation"
    roles: [ShippingCoordinator, PlantManager]
    code: 200
    input: []
    output: RackReservation
    side_effects: ["LOADING -> SHIPPED; loaded lines -> SHIPPED; order may -> SHIPPED; rack recomputes BOOKED/AVAILABLE"]
  - method: POST
    path: "/fenestration/rack-reservations/{reservationId}/cancel"
    description: "Cancel an un-loaded reservation"
    roles: [ShippingCoordinator, PlantManager]
    code: 200
    input: []
    output: RackReservation
    side_effects: ["RESERVED -> CANCELLED; rack recomputes BOOKED/AVAILABLE"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/fenestration/warranty-claims"
    description: "File a warranty claim against a line of a DELIVERED order"
    roles: [DealerRep, PlantManager]
    code: 201
    input: [order_id, order_line_id, component, coverage_variant, failure_date, description]
    output: WarrantyClaim
    side_effects: ["coverage_pct computed per variant; status=SUBMITTED"]
  - method: GET
    path: "/fenestration/warranty-claims/{claimId}"
    description: "Get a claim"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/fenestration/warranty-claims"
    description: "List claims (filterable)"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["order_id?", "order_line_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/fenestration/orders/{orderId}/warranty-claims"
    description: "List claims of an order"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/take-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/request-info"
    description: "UNDER_REVIEW -> INFO_REQUESTED"
    roles: [WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/provide-info"
    description: "INFO_REQUESTED -> UNDER_REVIEW"
    roles: [DealerRep, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/approve"
    description: "Approve an UNDER_REVIEW claim; sets remedy and remedy value"
    roles: [WarrantyAdjuster, PlantManager]
    code: 200
    input: [remedy, "part_sku?", "quantity?", "carrier?"]
    output: WarrantyClaim
    side_effects: ["REPAIR_PART -> create ServicePartShipment PICKING; REFUND -> claim FULFILLED immediately; remedy_value_cents computed; ERR_WARRANTY_EXPIRED when coverage_pct == 0"]
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/deny"
    description: "UNDER_REVIEW -> DENIED"
    roles: [WarrantyAdjuster, PlantManager]
    code: 200
    input: [denial_reason]
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/appeal"
    description: "DENIED -> UNDER_REVIEW"
    roles: [DealerRep, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/fenestration/warranty-claims/{claimId}/close"
    description: "Close a claim from SUBMITTED|UNDER_REVIEW|INFO_REQUESTED|DENIED"
    roles: [DealerRep, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  # --- ServicePartShipment ---
  - method: GET
    path: "/fenestration/warranty-claims/{claimId}/service-part-shipments"
    description: "List service-part shipments of a claim"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ServicePartShipment[]
    side_effects: []
  - method: GET
    path: "/fenestration/service-part-shipments/{shipmentId}"
    description: "Get a ServicePartShipment"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: []
    output: ServicePartShipment
    side_effects: []
  - method: GET
    path: "/fenestration/service-part-shipments"
    description: "List ServicePartShipments filtered by claim"
    roles: [DealerRep, PlantEngineer, ProductionLead, ShippingCoordinator, WarrantyAdjuster, PlantManager]
    code: 200
    input: ["warranty_claim_id?", "limit?", "offset?"]
    output: ServicePartShipment[]
    side_effects: []
  - method: POST
    path: "/fenestration/service-part-shipments/{shipmentId}/ship"
    description: "PICKING -> SHIPPED"
    roles: [ShippingCoordinator, PlantManager]
    code: 200
    input: []
    output: ServicePartShipment
    side_effects: []
  - method: POST
    path: "/fenestration/service-part-shipments/{shipmentId}/deliver"
    description: "SHIPPED -> DELIVERED; fulfills parent claim"
    roles: [ShippingCoordinator, PlantManager]
    code: 200
    input: []
    output: ServicePartShipment
    side_effects: ["Claim APPROVED -> FULFILLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "DealerRep acts on a resource whose dealer_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, non-positive dimension, CIRCLE with width != height, failure_date outside [delivered_at, now]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on a transition" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Line add/PATCH attempted on a non-DRAFT order" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 409, condition: "Confirm attempted on an order with zero non-CANCELLED lines" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "Wave assignment attempted for an order not in CONFIRMED" }
  - { id: ERR_ORDER_NOT_SHIPPABLE, http: 409, condition: "Rack ship attempted while order not COMPLETED" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Warranty claim attempted on an order not DELIVERED" }
  - { id: ERR_WAVE_NOT_OPEN, http: 409, condition: "Assignment attempted on a wave not OPEN" }
  - { id: ERR_WAVE_HAS_ASSIGNMENTS, http: 409, condition: "Wave cancel attempted with allocated_units > 0" }
  - { id: ERR_WAVE_BEFORE_LEAD_TIME, http: 409, condition: "wave_date earlier than order_date + max line lead time" }
  - { id: ERR_WAVE_CAPACITY_EXCEEDED, http: 409, condition: "Assignment/resume would push allocated_units over capacity_units (boundary: equality allowed)" }
  - { id: ERR_WAVE_GLASS_CAPACITY_EXCEEDED, http: 409, condition: "Assignment/resume would push allocated_glass_sqft over capacity_glass_sqft" }
  - { id: ERR_IG_NOT_READY_FOR_QC, http: 409, condition: "qc-check attempted on a unit not GAS_FILLED" }
  - { id: ERR_REMAKE_LIMIT_EXCEEDED, http: 409, condition: "Breakage/QC failure would create a remake beyond MAX_REMAKES_PER_UNIT (3) in the unit's chain" }
  - { id: ERR_LINE_NOT_ON_GLASS_HOLD, http: 409, condition: "resume-production attempted on a line not in GLASS_HOLD" }
  - { id: ERR_RACK_OCCUPANCY_CONFLICT, http: 409, condition: "Rack reservation window conflicts with an active reservation under closed-interval + 1-day buffer semantics" }
  - { id: ERR_RACK_CAPACITY_EXCEEDED, http: 409, condition: "Load would push assigned_units over slot_capacity (boundary: equality allowed)" }
  - { id: ERR_RACK_WRONG_ORDER, http: 409, condition: "Loaded line does not belong to rack.current_order_id" }
  - { id: ERR_SERIES_DISCONTINUED, http: 409, condition: "Line create/PATCH references a DISCONTINUED series" }
  - { id: ERR_SIZE_EXCEEDS_SERIES_LIMIT, http: 422, condition: "united_inches exceeds series.max_united_inches" }
  - { id: ERR_ENERGY_CODE_VIOLATION, http: 409, condition: "Order confirm with any line EnergyLabel.compliance == FAIL" }
  - { id: ERR_ENERGY_RULE_WINDOW_OVERLAP, http: 409, condition: "New EnergyCodeRule's half-open window overlaps an existing rule for the same state_code" }
  - { id: ERR_DEALER_CREDIT_HOLD, http: 409, condition: "Order confirm while dealer on CREDIT_HOLD" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Claim approve with coverage_pct == 0" }
  - { id: ERR_DUPLICATE_ACTIVE_CLAIM, http: 409, condition: "Another claim for the same (order_line_id, component) exists in SUBMITTED|UNDER_REVIEW|INFO_REQUESTED|APPROVED" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "take-review/request-info/approve/deny attempted from a non-review state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DealerRep
    description: "Dealer representative; creates and manages own dealership's orders and warranty claims"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /fenestration/orders/{id}/confirm-delivery (own orders)"
      - "POST /fenestration/warranty-claims/{id}/provide-info (own dealer's claims)"
      - "POST /fenestration/warranty-claims/{id}/appeal (own dealer's claims)"
    shared_operations:
      - "POST /fenestration/orders (dealer_id must equal X-User-ID)"
      - "POST /fenestration/orders/{id}/lines, PATCH lines, confirm, cancel (own orders; cancel of IN_PROGRESS is PlantManager-only)"
      - "POST /fenestration/warranty-claims (own orders)"
      - "GET endpoints (read-only, any authenticated role)"
  - name: PlantEngineer
    description: "Owns catalog configuration: series, glass packages, energy code rules"
    identity: "opaque"
    exclusive_operations:
      - "POST /fenestration/catalog-series, /catalog-series/{id}/discontinue"
      - "POST /fenestration/glass-packages"
      - "POST /fenestration/energy-code-rules"
    shared_operations:
      - "GET endpoints"
  - name: ProductionLead
    description: "Runs the floor: waves, IG production, QC, breakage"
    identity: "opaque"
    exclusive_operations:
      - "POST /fenestration/production-waves* (create/open/assignments/unassign/lock/release/close/cancel)"
      - "POST /fenestration/ig-units/{id}/advance, /qc-check, /report-breakage"
      - "POST /fenestration/order-lines/{id}/resume-production"
    shared_operations:
      - "GET endpoints"
  - name: ShippingCoordinator
    description: "Owns racks, rack reservations, and all shipments"
    identity: "opaque"
    exclusive_operations:
      - "POST /fenestration/shipping-racks, /shipping-racks/{id}/reservations"
      - "POST /fenestration/rack-reservations/{id}/load, /ship, /cancel"
      - "POST /fenestration/service-part-shipments/{id}/ship, /deliver"
    shared_operations:
      - "GET endpoints"
  - name: WarrantyAdjuster
    description: "Reviews and adjudicates warranty claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /fenestration/warranty-claims/{id}/take-review, /request-info, /approve, /deny"
    shared_operations:
      - "POST /fenestration/warranty-claims/{id}/close"
      - "GET endpoints"
  - name: PlantManager
    description: "Plant administrator; superset of every role plus credit control and the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /fenestration/dealers, /dealers/{id}/credit-hold, /credit-release"
      - "POST /_clock/set_current_utc"
      - "POST /fenestration/orders/{id}/cancel for IN_PROGRESS orders"
    shared_operations:
      - "All endpoints"

# Constants referenced across tables
domain_constants:
  MAX_REMAKES_PER_UNIT: 3
  DEFAULT_CLOCK: "2026-08-01T00:00:00Z"
