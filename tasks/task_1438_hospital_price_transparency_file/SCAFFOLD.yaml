# =============================================================================
# SCAFFOLD — Hospital Price Transparency File Generation
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Hospital Price Transparency File Generation (hospital price transparency office): standard-charge extraction across gross/discounted-cash/payer-specific rates, shoppable-service list & consumer display tool, machine-readable file format & schema validation, monthly/annual update cadence & versioning, payer contract confidentiality tension & rate derivation, CMS attestation & enforcement response, ancillary service inclusion rules, discrepancy correction workflow

domain_name: hospital-price-transparency
api_prefix: /transparency

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # CMS attestation, enforcement, SoD, audit trail
  secondary_archetype: pricing_engine        # multi-dimensional rate derivation & display pricing
  complexity_layers:
    - dual_variant_calculation               # rate derivation & penalty accrual each have 2 divergent variants
    - cascading_side_effects                 # item PATCH -> rate -> charge record -> cycle posture (depth 3)
    - optimistic_concurrency                 # OCC on ServiceItem.version and PublicationCycle.version
    - version_pinning_on_approval            # shoppable publish pins charge-record ids+versions; staleness detection
  entity_topology: flat                      # peer collections under /transparency, FK cross-references
  state_machine_shape: posture_driven        # PublicationCycle.posture (derived from children) gates freeze/publish
  relationship_patterns:
    - one_to_many                            # facility -> contracts/items/cycles/lists; cycle -> records/files
    - self_referential                       # StandardChargeRecord.supersedes_id (correction lineage)
    - cross_aggregate                        # rates reference contract+item; discrepancies reference cycle+record
  role_model: segregation_of_duties          # correction proposer != approver != applier; attestation submitter != CMS decider
  consistency_model: immediate               # all mutations + cascades atomic in the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (10 entities)
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hospital facility name" }
      - { name: cms_certification_number, type: string, source: input, description: "CMS Certification Number (CCN), unique per facility" }
      - { name: bed_count, type: integer, source: input, description: "Licensed bed count; drives TIERED penalty variant" }
      - { name: penalty_policy, type: enum, source: input, default: SIMPLE, description: "SIMPLE | TIERED — selects civil-monetary-penalty accrual variant", constraints: "SIMPLE | TIERED" }
      - { name: min_records_per_cycle, type: integer, source: input, default: 1, description: "Minimum VALIDATED charge records required before a cycle may freeze (CMS default posture: every item; tests use small values)" }
      - { name: shoppable_min_entries, type: integer, source: input, default: 300, description: "Minimum total shoppable entries for certification (CMS requires 300)" }
      - { name: mandated_min_entries, type: integer, source: input, default: 70, description: "Minimum CMS-mandated (cms_shoppable_mandated=true) entries for certification (CMS specifies 70)" }
      - { name: shoppable_display_enabled, type: boolean, source: input, default: true, description: "Feature flag gating the consumer display endpoint" }
      - { name: attestation_status, type: enum, source: system, default: NONE, description: "NONE | SUBMITTED | ACCEPTED | REJECTED | PLAN_SUBMITTED | CLOSED | ESCALATED", constraints: "produced only by attestation machine transitions" }
      - { name: attestation_year, type: integer, source: system, description: "Calendar year of the in-flight/last attestation; null until first submit" }
      - { name: attestation_cycle_id, type: string, source: system, description: "PublicationCycle.id of the ANNUAL PUBLISHED cycle the attestation relies on; null until first submit" }
      - { name: rejected_at, type: datetime, source: system, description: "Timestamp of latest REJECTED transition; null otherwise" }
      - { name: plan_due_date, type: datetime, source: system, description: "Deadline for corrective-action plan; set by cms-decision REJECT_ATTESTATION; null otherwise" }
      - { name: penalty_accrued_cents, type: number, source: computed, default: 0, description: "Civil monetary penalty accrued since rejected_at while attestation_status IN {REJECTED, ESCALATED}; computed per penalty accrual calculation" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer organization name" }
      - { name: payer_type, type: enum, source: input, description: "COMMERCIAL | MEDICARE_ADVANTAGE | MEDICAID_MANAGED", constraints: "COMMERCIAL | MEDICARE_ADVANTAGE | MEDICAID_MANAGED" }
      - { name: confidentiality_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PROPRIETARY — payer-level disclosure posture; PROPRIETARY forbids DERIVED_ONLY contracts from disclosing exact min", constraints: "STANDARD | PROPRIETARY" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; contracting facility" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; contracting payer" }
      - { name: confidentiality_clause, type: enum, source: input, description: "DISCLOSE_ALLOWED | DERIVED_ONLY | AGGREGATE_ONLY — contract-level disclosure clause", constraints: "DISCLOSE_ALLOWED | DERIVED_ONLY | AGGREGATE_ONLY" }
      - { name: annual_volume, type: integer, source: input, description: "Projected annual claim volume; weight input for MIX_WEIGHTED derivation" }
      - { name: effective_start, type: datetime, source: input, description: "Contract window start (date, CLOSED interval lower bound)" }
      - { name: effective_end, type: datetime, source: input, description: "Contract window end (date, CLOSED interval upper bound — inclusive)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RENEGOTIATING | TERMINATED | EXPIRED", constraints: "see state_machines.PayerContract" }

  - name: ServiceItem
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: code, type: string, source: input, description: "Billing code (e.g. CPT 70551); unique within facility" }
      - { name: code_type, type: enum, source: input, description: "CPT | HCPCS | MS_DRG | REVENUE_CODE", constraints: "CPT | HCPCS | MS_DRG | REVENUE_CODE" }
      - { name: description, type: string, source: input, description: "Plain-language service description" }
      - { name: service_class, type: enum, source: input, description: "SHOPPABLE | ANCILLARY | SUPPLY | DRUG | FACILITY_FEE", constraints: "SHOPPABLE | ANCILLARY | SUPPLY | DRUG | FACILITY_FEE" }
      - { name: gross_charge_cents, type: integer, source: input, description: "Gross (chargemaster) price in cents; >= 0" }
      - { name: medicare_base_cents, type: integer, source: input, description: "Medicare base rate in cents for PERCENT_OF_MEDICARE rates; >= 0" }
      - { name: ancillary_inclusion, type: enum, source: input, default: SEPARATELY_PRICED, description: "ALWAYS_BUNDLED | CONDITIONALLY_INCLUDED | SEPARATELY_PRICED — how this item may enter shoppable packages", constraints: "ALWAYS_BUNDLED | CONDITIONALLY_INCLUDED | SEPARATELY_PRICED" }
      - { name: cms_shoppable_mandated, type: boolean, source: input, default: false, description: "True when item is one of the CMS-specified shoppable services" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED", constraints: "see state_machines.ServiceItem" }

  - name: StandardChargeRecord
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: publication_cycle_id, type: string, source: input, description: "FK -> PublicationCycle.id; cycle this record is collected into" }
      - { name: service_item_id, type: string, source: input, description: "FK -> ServiceItem.id" }
      - { name: supersedes_id, type: string, source: input, description: "FK -> StandardChargeRecord.id; null unless this record is a correction replacement; optional", constraints: "must reference a record in the same facility when present" }
      - { name: gross_charge_cents, type: integer, source: system, description: "Snapshot of ServiceItem.gross_charge_cents at creation (or proposed override on correction)" }
      - { name: discounted_cash_cents, type: integer, source: input, description: "Discounted cash price in cents; >= 0" }
      - { name: min_negotiated_cents, type: integer, source: computed, description: "Min over includible negotiated amounts; null when no includible rates" }
      - { name: max_negotiated_cents, type: integer, source: computed, description: "Max over includible negotiated amounts; null when no includible rates" }
      - { name: derived_disclosure_cents, type: integer, source: computed, description: "Disclosed payer-specific figure per rate derivation calculation; null when no includible rates" }
      - { name: derivation_method, type: enum, source: computed, description: "EXACT_MIN | MIX_WEIGHTED | NONE — which derivation variant produced derived_disclosure_cents", constraints: "EXACT_MIN | MIX_WEIGHTED | NONE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | VALIDATED | PUBLISHED | FLAGGED | SUPERSEDED", constraints: "see state_machines.StandardChargeRecord" }

  - name: PayerNegotiatedRate
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id" }
      - { name: service_item_id, type: string, source: input, description: "FK -> ServiceItem.id" }
      - { name: rate_type, type: enum, source: input, description: "PERCENT_OF_GROSS | FEE_SCHEDULE_FLAT | PERCENT_OF_MEDICARE", constraints: "PERCENT_OF_GROSS | FEE_SCHEDULE_FLAT | PERCENT_OF_MEDICARE" }
      - { name: rate_percent, type: number, source: input, description: "Percent (0–200) for PERCENT_OF_GROSS / PERCENT_OF_MEDICARE; null otherwise", constraints: "required iff rate_type is PERCENT_OF_GROSS or PERCENT_OF_MEDICARE" }
      - { name: flat_amount_cents, type: integer, source: input, description: "Flat fee-schedule amount for FEE_SCHEDULE_FLAT; null otherwise", constraints: "required iff rate_type == FEE_SCHEDULE_FLAT" }
      - { name: negotiated_amount_cents, type: integer, source: computed, description: "Materialized dollar amount per negotiated amount calculation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | INACTIVE — mirrors contract lifecycle via cascades", constraints: "see state_machines.PayerNegotiatedRate" }

  - name: ShoppableServiceList
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: title, type: string, source: input, description: "Display title" }
      - { name: entries, type: array, source: input, description: "Array of entry objects {service_item_id (references ServiceItem.id), display_name, bundled_ancillary_item_ids (array of ServiceItem.id references), include_conditional_ancillaries (boolean), display_order (integer)}; each element references ServiceItem.id of the same facility" }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "= number of elements in entries" }
      - { name: mandated_entry_count, type: integer, source: computed, default: 0, description: "= number of entries whose service item has cms_shoppable_mandated == true" }
      - { name: pinned_records, type: array, source: system, description: "Set at publish: array of {service_item_id, charge_record_id, record_version} pinning the PUBLISHED charge record version per entry item" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CERTIFIED | PUBLISHED | ARCHIVED", constraints: "see state_machines.ShoppableServiceList" }

  - name: PublicationCycle
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: cycle_type, type: enum, source: input, description: "MONTHLY | ANNUAL", constraints: "MONTHLY | ANNUAL" }
      - { name: period_start, type: datetime, source: input, description: "Coverage window start (date, HALF-OPEN interval lower bound)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage window end (date, HALF-OPEN interval upper bound — exclusive)" }
      - { name: schema_version, type: string, source: input, description: "CMS MRF schema version label, e.g. 'v2.0.0'" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FROZEN | PUBLISHED | SUPERSEDED", constraints: "see state_machines.PublicationCycle" }
      - { name: posture, type: enum, source: computed, description: "COLLECTING | FREEZABLE | AWAITING_FILE | FILE_UNVALIDATED | PUBLISHABLE | FILE_INVALID | CURRENT | ARCHIVED — derived from status + children; gates freeze/publish", constraints: "derived per cycle posture calculation" }
      - { name: validated_record_count, type: integer, source: computed, default: 0, description: "Count of linked StandardChargeRecord with status IN {VALIDATED, PUBLISHED, FLAGGED}" }
      - { name: total_gross_cents, type: integer, source: computed, default: 0, description: "Sum of gross_charge_cents over linked records with status IN {VALIDATED, PUBLISHED, FLAGGED}" }
      - { name: derived_rollup_cents, type: integer, source: computed, default: 0, description: "Sum of derived_disclosure_cents over linked records with status IN {VALIDATED, PUBLISHED, FLAGGED}; records with null derived_disclosure_cents contribute 0" }

  - name: MachineReadableFile
    parent: null
    common_fields: true
    fields:
      - { name: publication_cycle_id, type: string, source: input, description: "FK -> PublicationCycle.id" }
      - { name: file_format, type: enum, source: input, description: "JSON | CSV", constraints: "JSON | CSV" }
      - { name: generation_status, type: enum, source: system, default: SEALED, description: "SEALED | PUBLISHED | SUPERSEDED | RETRACTED", constraints: "parallel dimension 1, see state_machines.MachineReadableFile" }
      - { name: validation_status, type: enum, source: system, default: UNVALIDATED, description: "UNVALIDATED | VALID | INVALID", constraints: "parallel dimension 2, see state_machines.MachineReadableFile" }
      - { name: record_count, type: integer, source: computed, default: 0, description: "Number of charge records serialized at generation time" }
      - { name: summary_total_discounted_cents, type: integer, source: computed, default: 0, description: "File-level rollup per MRF summary rollup calculation (per-record rounding, then sum)" }
      - { name: validation_errors, type: array, source: computed, description: "Array of schema violation codes produced by the last validate call; empty when VALID" }

  - name: DiscrepancyReport
    parent: null
    common_fields: true
    fields:
      - { name: publication_cycle_id, type: string, source: input, description: "FK -> PublicationCycle.id; the PUBLISHED cycle whose data is disputed" }
      - { name: standard_charge_record_id, type: string, source: input, description: "FK -> StandardChargeRecord.id; the disputed record" }
      - { name: reporter_type, type: enum, source: input, description: "CONSUMER | PAYER | INTERNAL", constraints: "CONSUMER | PAYER | INTERNAL" }
      - { name: description, type: string, source: input, description: "Free-text discrepancy description" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | CONFIRMED | DISMISSED | CORRECTION_PROPOSED | CORRECTION_APPROVED | CORRECTED", constraints: "see state_machines.DiscrepancyReport" }
      - { name: proposed_gross_charge_cents, type: integer, source: input, description: "Corrected gross charge; null unless correction proposed", constraints: "at least one of proposed_gross_charge_cents / proposed_discounted_cash_cents required at propose time" }
      - { name: proposed_discounted_cash_cents, type: integer, source: input, description: "Corrected discounted cash price; null unless correction proposed" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer; set at propose-correction" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; set at approve-correction" }
      - { name: applied_by_user_id, type: string, source: system, description: "X-User-ID of applier; set at apply-correction" }

# =============================================================================
# §1.2 State Machine Table (9 machines)
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: "attestation_status = NONE"
    terminal_states: []   # attestation lifecycle is perennial (CLOSED loops back to SUBMITTED next year)
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /transparency/facilities/{id}/submit-attestation"
        actor: ComplianceAuditor
        preconditions:
          - "attestation_status IN {NONE, CLOSED}"
          - "attestation_year input equals the calendar year of the current logical clock"
          - "facility has a PublicationCycle with cycle_type == ANNUAL, status == PUBLISHED, and [period_start, period_end) fully containing attestation_year-01-01 .. attestation_year-12-31 (containment semantics)"
        side_effects:
          - "attestation_status -> SUBMITTED; attestation_year set from input; attestation_cycle_id set to the containing ANNUAL PUBLISHED cycle id (selector: among matches, latest period_start, tie-break created_at ASC)"
          - "increments Facility.version by 1"
      - from: CLOSED
        to: SUBMITTED
        trigger: "POST /transparency/facilities/{id}/submit-attestation"
        actor: ComplianceAuditor
        preconditions:
          - "attestation_year input equals the calendar year of the current logical clock and differs from the previous attestation_year"
          - "same ANNUAL PUBLISHED cycle containment precondition as NONE -> SUBMITTED"
        side_effects:
          - "attestation_status -> SUBMITTED; attestation_year updated; rejected_at cleared to null; plan_due_date cleared to null"
          - "increments Facility.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /transparency/facilities/{id}/cms-decision with decision=ACCEPT_ATTESTATION"
        actor: PlatformAdmin
        preconditions: ["attestation_status == SUBMITTED"]
        side_effects:
          - "attestation_status -> ACCEPTED; penalty accrual stops (rejected_at stays null)"
          - "increments Facility.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /transparency/facilities/{id}/cms-decision with decision=REJECT_ATTESTATION"
        actor: PlatformAdmin
        preconditions: ["attestation_status == SUBMITTED"]
        side_effects:
          - "attestation_status -> REJECTED; rejected_at := current logical clock; plan_due_date := input plan_due_date"
          - "CASCADE link 1 (facility -> files): every MachineReadableFile of the attestation_cycle_id cycle with generation_status == PUBLISHED transitions to RETRACTED"
          - "increments Facility.version by 1"
      - from: REJECTED
        to: ESCALATED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to a time strictly after plan_due_date while attestation_status == REJECTED"
        actor: system
        preconditions: ["attestation_status == REJECTED", "current logical clock > plan_due_date"]
        side_effects:
          - "attestation_status -> ESCALATED (penalty continues accruing per penalty accrual calculation)"
          - "increments Facility.version by 1"
      - from: REJECTED
        to: PLAN_SUBMITTED
        trigger: "POST /transparency/facilities/{id}/submit-plan"
        actor: ComplianceAuditor
        preconditions: ["attestation_status IN {REJECTED, ESCALATED}"]
        side_effects:
          - "attestation_status -> PLAN_SUBMITTED"
          - "increments Facility.version by 1"
      - from: ESCALATED
        to: PLAN_SUBMITTED
        trigger: "POST /transparency/facilities/{id}/submit-plan"
        actor: ComplianceAuditor
        preconditions: ["attestation_status IN {REJECTED, ESCALATED}"]
        side_effects:
          - "attestation_status -> PLAN_SUBMITTED"
          - "increments Facility.version by 1"
      - from: PLAN_SUBMITTED
        to: CLOSED
        trigger: "POST /transparency/facilities/{id}/cms-decision with decision=ACCEPT_PLAN"
        actor: PlatformAdmin
        preconditions: ["attestation_status == PLAN_SUBMITTED"]
        side_effects:
          - "attestation_status -> CLOSED; penalty accrual stops at its current value (penalty_accrued_cents frozen)"
          - "increments Facility.version by 1"
      - from: PLAN_SUBMITTED
        to: REJECTED
        trigger: "POST /transparency/facilities/{id}/cms-decision with decision=REJECT_PLAN (carries a new plan_due_date)"
        actor: PlatformAdmin
        preconditions: ["attestation_status == PLAN_SUBMITTED"]
        side_effects:
          - "attestation_status -> REJECTED; plan_due_date := new input value; rejected_at UNCHANGED (accrual continues from original rejection)"
          - "increments Facility.version by 1"

  - entity: PayerContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /transparency/payer-contracts/{id}/activate"
        actor: ContractManager
        preconditions:
          - "status == DRAFT or RENEGOTIATING"
          - "effective_start <= effective_end"
          - "no other PayerContract with same facility_id, same payer_id, status == ACTIVE, whose CLOSED window [effective_start, effective_end] intersects this window — touching endpoints (this.effective_start == other.effective_end OR this.effective_end == other.effective_start) COUNT as intersection (closed-interval semantics)"
        side_effects:
          - "CASCADE link 1 (contract -> rates): its PayerNegotiatedRate rows in DRAFT -> ACTIVE; their negotiated_amount_cents recomputed"
          - "CASCADE link 2 (rate -> charge records): StandardChargeRecord rows of the same facility in {DRAFT, VALIDATED} referencing items covered by these rates recompute min/max/derived fields"
          - "CASCADE link 3 (record -> cycle): affected PublicationCycle rows recompute derived_rollup_cents and increment version"
      - from: RENEGOTIATING
        to: ACTIVE
        trigger: "POST /transparency/payer-contracts/{id}/activate"
        actor: ContractManager
        preconditions: ["same as DRAFT -> ACTIVE"]
        side_effects: ["same cascade as DRAFT -> ACTIVE"]
      - from: ACTIVE
        to: RENEGOTIATING
        trigger: "POST /transparency/payer-contracts/{id}/renegotiate"
        actor: ContractManager
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "applies optional new effective_end / confidentiality_clause from input"
          - "CASCADE link 1: its ACTIVE PayerNegotiatedRate rows -> DRAFT (editable again)"
          - "CASCADE link 2: affected StandardChargeRecord rows in {DRAFT, VALIDATED} recompute (DRAFT rates are EXCLUDED from min/max/derived input set)"
          - "CASCADE link 3: affected PublicationCycle rows recompute derived_rollup_cents and increment version"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /transparency/payer-contracts/{id}/terminate"
        actor: ContractManager
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CASCADE link 1: its ACTIVE PayerNegotiatedRate rows -> INACTIVE"
          - "CASCADE link 2: affected StandardChargeRecord rows in {DRAFT, VALIDATED} recompute min/max/derived (INACTIVE rates excluded)"
          - "CASCADE link 3: affected PublicationCycle rows recompute derived_rollup_cents and increment version"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past effective_end (current date > effective_end, closed interval)"
        actor: system
        preconditions: ["status == ACTIVE", "current logical clock date > effective_end"]
        side_effects: ["same cascade as ACTIVE -> TERMINATED"]

  - entity: PayerNegotiatedRate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, INACTIVE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "cascade from PayerContract activate"
        actor: system
        preconditions: ["owning contract transitions DRAFT|RENEGOTIATING -> ACTIVE"]
        side_effects: ["negotiated_amount_cents recomputed per negotiated amount materialization"]
      - from: ACTIVE
        to: DRAFT
        trigger: "cascade from PayerContract renegotiate"
        actor: system
        preconditions: ["owning contract transitions ACTIVE -> RENEGOTIATING"]
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "cascade from PayerContract terminate / expire"
        actor: system
        preconditions: ["owning contract transitions ACTIVE -> TERMINATED|EXPIRED"]
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /transparency/payer-negotiated-rates for the same (contract_id, service_item_id) pair while a DRAFT rate exists (create-with-supersede)"
        actor: ContractManager
        preconditions: ["contract.status IN {DRAFT, RENEGOTIATING}"]
        side_effects: ["prior DRAFT rate -> SUPERSEDED; new rate created in DRAFT"]

  - entity: ServiceItem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /transparency/service-items/{id} with status=RETIRED"
        actor: TransparencyOfficer
        preconditions:
          - "expected_service_item_version matches current version (OCC)"
          - "no ShoppableServiceList of the same facility with status IN {CERTIFIED, PUBLISHED} has an entry referencing this item (cross-entity guard, ERR_ITEM_IN_CERTIFIED_LIST)"
        side_effects:
          - "status -> RETIRED; increments ServiceItem.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "PATCH /transparency/service-items/{id} with gross_charge_cents and/or medicare_base_cents (no status change)"
        actor: TransparencyOfficer
        preconditions: ["expected_service_item_version matches current version (OCC)"]
        side_effects:
          - "CASCADE A link 1 (item -> rates): PayerNegotiatedRate rows for this item with status IN {DRAFT, ACTIVE} recompute negotiated_amount_cents"
          - "CASCADE A link 2 (rate -> records): StandardChargeRecord rows of the same facility+item in {DRAFT, VALIDATED} recompute min/max/derived"
          - "CASCADE A link 3 (record -> cycle): affected PublicationCycle rows recompute derived_rollup_cents and increment version"
          - "increments ServiceItem.version by 1"

  - entity: StandardChargeRecord
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /transparency/standard-charge-records/{id}/validate"
        actor: TransparencyOfficer
        preconditions:
          - "record.status == DRAFT"
          - "PublicationCycle.status == OPEN (cross-entity dependency)"
          - "ServiceItem.status == ACTIVE (cross-entity dependency)"
          - "min_negotiated_cents IS NOT NULL (at least one includible ACTIVE rate exists)"
          - "discounted_cash_cents <= gross_charge_cents"
        side_effects:
          - "status -> VALIDATED; PublicationCycle.validated_record_count/total_gross_cents/derived_rollup_cents recompute; increments cycle.version and record.version"
      - from: VALIDATED
        to: PUBLISHED
        trigger: "cascade from PublicationCycle publish"
        actor: system
        preconditions: ["owning cycle transitions FROZEN -> PUBLISHED"]
        side_effects: ["status -> PUBLISHED; increments record.version"]
      - from: PUBLISHED
        to: FLAGGED
        trigger: "cascade from DiscrepancyReport triage outcome=CONFIRMED"
        actor: system
        preconditions: ["record.status == PUBLISHED"]
        side_effects: ["status -> FLAGGED; increments record.version"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade from a subsequent PublicationCycle publish (same facility, same cycle_type) — monthly/annual versioning"
        actor: system
        preconditions: ["a different cycle of same facility+cycle_type transitions FROZEN -> PUBLISHED"]
        side_effects: ["status -> SUPERSEDED; increments record.version"]
      - from: FLAGGED
        to: SUPERSEDED
        trigger: "cascade from DiscrepancyReport apply-correction"
        actor: system
        preconditions: ["discrepancy.status transitions CORRECTION_APPROVED -> CORRECTED"]
        side_effects:
          - "status -> SUPERSEDED; increments record.version"
          - "new StandardChargeRecord created directly in PUBLISHED status with supersedes_id = this record id and proposed overrides applied"

  - entity: ShoppableServiceList
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /transparency/shoppable-service-lists/{id}/certify"
        actor: TransparencyOfficer
        preconditions:
          - "status == DRAFT"
          - "entry_count >= facility.shoppable_min_entries (boundary: >=, checked FIRST)"
          - "mandated_entry_count >= facility.mandated_min_entries (checked SECOND)"
        side_effects: ["status -> CERTIFIED; increments version"]
      - from: CERTIFIED
        to: PUBLISHED
        trigger: "POST /transparency/shoppable-service-lists/{id}/publish"
        actor: TransparencyOfficer
        preconditions:
          - "status == CERTIFIED"
          - "facility has at least one PublicationCycle with status == PUBLISHED (cross-entity dependency)"
          - "every entry's service_item_id has a PUBLISHED StandardChargeRecord in the latest PUBLISHED cycle of the facility (ERR_ENTRY_RECORD_MISSING otherwise)"
        side_effects:
          - "status -> PUBLISHED; pinned_records := for each entry's service_item_id, the charge record selector {facility match, service_item_id match, status == PUBLISHED, in the latest PUBLISHED cycle by period_start (tie-break created_at ASC)} capturing charge_record_id and record.version at pin time"
          - "prior ShoppableServiceList of same facility with status == PUBLISHED auto-transitions to ARCHIVED"
          - "increments version"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "cascade from a subsequent shoppable list publish at the same facility"
        actor: system
        preconditions: ["another list of same facility transitions CERTIFIED -> PUBLISHED"]
        side_effects: ["status -> ARCHIVED; increments version"]

  - entity: PublicationCycle
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /transparency/publication-cycles/{id}/freeze"
        actor: TransparencyOfficer
        preconditions: ["status == OPEN", "posture == FREEZABLE (validated_record_count >= facility.min_records_per_cycle)"]
        side_effects: ["status -> FROZEN; posture recomputes; increments version"]
      - from: FROZEN
        to: PUBLISHED
        trigger: "POST /transparency/publication-cycles/{id}/publish"
        actor: TransparencyOfficer
        preconditions: ["status == FROZEN", "posture == PUBLISHABLE (exactly one SEALED MachineReadableFile exists and its validation_status == VALID)"]
        side_effects:
          - "status -> PUBLISHED; posture -> CURRENT; increments version"
          - "linked StandardChargeRecord rows VALIDATED -> PUBLISHED"
          - "the SEALED MachineReadableFile generation_status -> PUBLISHED"
          - "prior PublicationCycle of same facility+cycle_type with status == PUBLISHED (selector: latest period_start, tie-break created_at ASC) -> SUPERSEDED; its PUBLISHED records -> SUPERSEDED; its PUBLISHED files -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade from a subsequent publish of same facility+cycle_type"
        actor: system
        preconditions: ["another cycle of same facility+cycle_type transitions FROZEN -> PUBLISHED"]
        side_effects: ["status -> SUPERSEDED; posture -> ARCHIVED; increments version"]

  - entity: MachineReadableFile
    initial_state: "generation_status = SEALED, validation_status = UNVALIDATED (parallel dimensions)"
    terminal_states: [SUPERSEDED, RETRACTED]   # on generation dimension
    transitions:
      - from: SEALED
        to: PUBLISHED
        trigger: "cascade from owning PublicationCycle publish"
        actor: system
        preconditions: ["cycle FROZEN -> PUBLISHED", "this file is the cycle's SEALED file", "validation_status == VALID"]
        side_effects: ["generation_status -> PUBLISHED; increments version"]
      - from: SEALED
        to: SUPERSEDED
        trigger: "cascade: a new POST /transparency/machine-readable-files succeeds for the same cycle (regeneration)"
        actor: system
        preconditions: ["new file created for same publication_cycle_id"]
        side_effects: ["generation_status -> SUPERSEDED; increments version"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade from owning cycle's supersession"
        actor: system
        preconditions: ["owning cycle PUBLISHED -> SUPERSEDED"]
        side_effects: ["generation_status -> SUPERSEDED; increments version"]
      - from: PUBLISHED
        to: RETRACTED
        trigger: "cascade from Facility cms-decision REJECT_ATTESTATION"
        actor: system
        preconditions: ["owning cycle == facility.attestation_cycle_id", "generation_status == PUBLISHED"]
        side_effects: ["generation_status -> RETRACTED; increments version"]
      - from: UNVALIDATED
        to: VALID
        trigger: "POST /transparency/machine-readable-files/{id}/validate — schema validation passes (validation_errors empty)"
        actor: TransparencyOfficer
        preconditions: ["generation_status == SEALED", "validation_status IN {UNVALIDATED, INVALID}"]
        side_effects: ["validation_status -> VALID; validation_errors := []; owning cycle posture recomputes; increments file.version and cycle.version"]
      - from: UNVALIDATED
        to: INVALID
        trigger: "POST /transparency/machine-readable-files/{id}/validate — schema validation fails"
        actor: TransparencyOfficer
        preconditions: ["generation_status == SEALED", "validation_status IN {UNVALIDATED, INVALID}"]
        side_effects: ["validation_status -> INVALID; validation_errors := computed violation codes; owning cycle posture recomputes; increments file.version and cycle.version"]
      - from: INVALID
        to: VALID
        trigger: "POST /transparency/machine-readable-files/{id}/validate — re-validation after remediation (cyclic loop)"
        actor: TransparencyOfficer
        preconditions: ["generation_status == SEALED", "validation_status IN {UNVALIDATED, INVALID}"]
        side_effects: ["validation_status -> VALID; validation_errors := []; owning cycle posture recomputes; increments file.version and cycle.version"]

  - entity: DiscrepancyReport
    initial_state: SUBMITTED
    terminal_states: [DISMISSED, CORRECTED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /transparency/discrepancy-reports/{id}/triage with outcome=CONFIRMED"
        actor: ComplianceAuditor
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "status -> CONFIRMED"
          - "disputed StandardChargeRecord PUBLISHED -> FLAGGED; increments record.version"
          - "increments discrepancy.version"
      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /transparency/discrepancy-reports/{id}/triage with outcome=DISMISSED"
        actor: ComplianceAuditor
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status -> DISMISSED; increments version"]
      - from: CONFIRMED
        to: CORRECTION_PROPOSED
        trigger: "POST /transparency/discrepancy-reports/{id}/propose-correction"
        actor: TransparencyOfficer
        preconditions:
          - "status == CONFIRMED"
          - "at least one of proposed_gross_charge_cents / proposed_discounted_cash_cents present"
          - "effective proposed discounted cash <= effective proposed gross (proposed value overrides current; missing side falls back to current record value)"
        side_effects: ["status -> CORRECTION_PROPOSED; proposed_by_user_id := X-User-ID; increments version"]
      - from: CORRECTION_PROPOSED
        to: CORRECTION_APPROVED
        trigger: "POST /transparency/discrepancy-reports/{id}/approve-correction"
        actor: TransparencyOfficer
        preconditions:
          - "status == CORRECTION_PROPOSED"
          - "X-User-ID != proposed_by_user_id (segregation of duties)"
        side_effects: ["status -> CORRECTION_APPROVED; approved_by_user_id := X-User-ID; increments version"]
      - from: CORRECTION_APPROVED
        to: CORRECTED
        trigger: "POST /transparency/discrepancy-reports/{id}/apply-correction"
        actor: TransparencyOfficer
        preconditions:
          - "status == CORRECTION_APPROVED"
          - "X-User-ID != approved_by_user_id (segregation of duties)"
        side_effects:
          - "CASCADE link 1 (discrepancy -> records): disputed record FLAGGED -> SUPERSEDED; new StandardChargeRecord created in PUBLISHED status with supersedes_id = disputed id, gross_charge_cents := proposed_gross_charge_cents if present else prior value, discounted_cash_cents := proposed_discounted_cash_cents if present else prior value, min/max/derived recomputed"
          - "CASCADE link 2 (record -> cycle): owning PublicationCycle validated_record_count UNCHANGED (old leaves, new enters — conserved), total_gross_cents adjusts by exactly (new gross - old gross), derived_rollup_cents recomputes; increments cycle.version"
          - "status -> CORRECTED; applied_by_user_id := X-User-ID; increments discrepancy.version"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-service-item-patch
    parent_entity: ServiceItem
    write_endpoint: "PATCH /transparency/service-items/{id}"
    occ_field: expected_service_item_version
    description: |
      A PATCH against a ServiceItem whose version has advanced beyond the
      version the client last observed is rejected. This captures the case
      where another writer has just patched the same item (gross change or
      retirement, which legitimately succeeds under product semantics) and
      the current writer's view of the item is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-cycle-file-generate
    parent_entity: PublicationCycle
    write_endpoint: "POST /transparency/machine-readable-files"
    occ_field: expected_publication_cycle_version
    description: |
      Generating a MachineReadableFile against a PublicationCycle whose
      version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just generated a file
      for the same cycle (which legitimately supersedes the prior SEALED
      file) or added/validated records (bumping the cycle version), making
      the current writer's view of the cycle stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (11 rules)
# =============================================================================
calculations:
  - name: negotiated_amount_materialization
    trigger: "PayerNegotiatedRate create; rate PATCH; ServiceItem PATCH of gross_charge_cents/medicare_base_cents (cascade link 1)"
    algorithm: conditional_formula
    formula: |
      if rate_type == FEE_SCHEDULE_FLAT:  negotiated_amount_cents = flat_amount_cents
      if rate_type == PERCENT_OF_GROSS:   negotiated_amount_cents = floor(service_item.gross_charge_cents * rate_percent / 100)
      if rate_type == PERCENT_OF_MEDICARE: negotiated_amount_cents = floor(service_item.medicare_base_cents * rate_percent / 100)
      (service_item resolved via rate.service_item_id; current item field values are used, not snapshots)
    input_set: "the single rate being materialized + its ServiceItem"
    precision: "integer cents, floor truncation"
    variants:
      - name: by_rate_type
        when: "rate_type switch"
        difference: "three mutually exclusive branches; PERCENT_OF_GROSS tracks live gross_charge_cents, PERCENT_OF_MEDICARE tracks live medicare_base_cents, FEE_SCHEDULE_FLAT is item-independent"

  - name: standard_charge_extrema
    trigger: "StandardChargeRecord create; any cascade that mutates rates/contracts touching the record's (facility_id, service_item_id)"
    algorithm: aggregation
    formula: |
      includible = [ r | r in PayerNegotiatedRate, r.service_item_id == record.service_item_id,
                     r.status == ACTIVE,
                     contract(r.contract_id).status == ACTIVE,
                     contract(r.contract_id).facility_id == record.facility_id,
                     contract(r.contract_id).confidentiality_clause == DISCLOSE_ALLOWED ]
      if includible empty: min_negotiated_cents = null; max_negotiated_cents = null
      else: min_negotiated_cents = min(r.negotiated_amount_cents); max_negotiated_cents = max(r.negotiated_amount_cents)
    input_set: "ACTIVE rates under ACTIVE DISCLOSE_ALLOWED contracts only; DRAFT/INACTIVE/SUPERSEDED rates and DERIVED_ONLY/AGGREGATE_ONLY contracts excluded"
    precision: "integer cents"

  - name: derived_disclosure
    trigger: "same as standard_charge_extrema (computed together)"
    algorithm: dual_variant_derivation
    formula: |
      disclose_set  = rates from standard_charge_extrema.includible (DISCLOSE_ALLOWED only)
      derived_only  = [ r | ACTIVE rate, ACTIVE contract, clause == DERIVED_ONLY ]
      aggregate_set = [ r | ACTIVE rate, ACTIVE contract, clause == AGGREGATE_ONLY ] included ONLY IF payer_count >= DEIDENTIFICATION_MIN_PAYERS
      payer_count   = count of DISTINCT contract.payer_id over ACTIVE contracts of record.facility_id holding an ACTIVE rate for record.service_item_id
      VARIANT SELECTION:
        if derived_only == empty AND (aggregate excluded or empty): method = EXACT_MIN
            derived_disclosure_cents = min_negotiated_cents   (null when disclose_set empty)
        else: method = MIX_WEIGHTED
            pool = disclose_set + derived_only + (aggregate_set if payer_count >= 3 else [])
            derived_disclosure_cents = floor( sum(r.negotiated_amount_cents * contract(r).annual_volume) / sum(contract(r).annual_volume) )  over pool
        if pool empty in MIX_WEIGHTED: method = NONE, derived_disclosure_cents = null
      EVALUATION ORDER (pinned): (1) materialize negotiated_amount_cents per rate; (2) partition by clause; (3) compute payer_count; (4) select variant; (5) evaluate. payer_count never depends on derived_disclosure_cents — no circularity.
    input_set: "same facility+item rate universe as standard_charge_extrema, partitioned by confidentiality_clause"
    constants:
      DEIDENTIFICATION_MIN_PAYERS: 3
    precision: "integer cents, floor truncation on the weighted mean"
    variants:
      - name: EXACT_MIN
        when: "no DERIVED_ONLY and no includible AGGREGATE_ONLY contract contributes"
        difference: "derived_disclosure_cents == min_negotiated_cents (exact disclosure)"
      - name: MIX_WEIGHTED
        when: "at least one DERIVED_ONLY or includible AGGREGATE_ONLY contract contributes"
        difference: "volume-weighted mean over the pool; for identical rate data produces a DIFFERENT number than EXACT_MIN whenever volumes and amounts differ"

  - name: consumer_display_price
    trigger: "GET /transparency/shoppable-service-lists/{id}/display — computed per entry at read time from PINNED records"
    algorithm: combinatorial_min_plus_conditional_bundle   # Rule 2 mode (a): >=3 inputs, nested min, state branch
    formula: |
      For each entry in list.entries:
        rec = pinned record for entry.service_item_id (pinned_records entry captured at publish)
        candidates = [rec.gross_charge_cents, rec.discounted_cash_cents] + ([rec.derived_disclosure_cents] if rec.derived_disclosure_cents is not null else [])
        base_cents = min(candidates)
        bundle_sum = 0
        for anc_id in entry.bundled_ancillary_item_ids (processed in ascending display_order, tie-break created_at ASC of the ServiceItem):
          anc = ServiceItem(anc_id)
          if anc.ancillary_inclusion == ALWAYS_BUNDLED: bundle_sum += floor(anc.gross_charge_cents * 0.90)
          if anc.ancillary_inclusion == CONDITIONALLY_INCLUDED and entry.include_conditional_ancillaries: bundle_sum += floor(anc.gross_charge_cents * 0.90)
          (SEPARATELY_PRICED items can never appear — rejected at list creation)
        package_price_cents = base_cents + bundle_sum
        stale = (current version of pinned charge record != pinned record_version) OR (pinned record status == SUPERSEDED)
    input_set: "PUBLISHED list's entries; pinned charge records (NOT current live records); bundled ancillary ServiceItems at their LIVE gross_charge_cents"
    constants:
      BUNDLE_DISCOUNT_PCT: 0.10
    precision: "integer cents; per-ancillary floor BEFORE summation (see bundle_ancillary_rounding)"

  - name: bundle_ancillary_rounding
    trigger: "inside consumer_display_price per entry"
    algorithm: nested_rounding    # Rule 2 mode (b): rounding order pinned
    formula: |
      PINNED ORDER: each ancillary contributes floor(ancillary.gross_charge_cents * (1 - BUNDLE_DISCOUNT_PCT)) computed PER ITEM,
      then contributions are summed; the package total is NOT re-rounded.
      FORBIDDEN alternative (documents the trap): floor(sum(ancillary gross) * 0.90) — differs by >= 1 cent whenever
      per-item fractional remainders accumulate (e.g. two items at 333 cents: pinned order 299+299 = 598; forbidden order floor(666*0.9)=599).
    input_set: "bundled ancillary items of one entry"
    constants:
      BUNDLE_DISCOUNT_PCT: 0.10
    precision: "integer cents, floor per item then sum"

  - name: mrf_schema_validation
    trigger: "POST /transparency/machine-readable-files/{id}/validate"
    algorithm: constraint_propagation
    formula: |
      violations = []
      if record_count < facility.min_records_per_cycle: violations += ["MIN_RECORDS_BELOW_FLOOR"]
      for each StandardChargeRecord linked to the cycle with status VALIDATED:
        if ServiceItem(record.service_item_id).status == RETIRED: violations += ["RETIRED_ITEM_PRESENT:<record.id>"]
        if exists ACTIVE contract of the facility with clause == AGGREGATE_ONLY holding an ACTIVE rate for record.service_item_id
           AND payer_count(record) < DEIDENTIFICATION_MIN_PAYERS: violations += ["DEIDENTIFICATION_VIOLATION:<record.id>"]
      validation_errors = violations (sorted by code then record id for determinism — sort key: violation code ASC, record created_at ASC)
      validation_status = VALID if violations empty else INVALID
    input_set: "cycle's VALIDATED records at validate time; live contract/payer state (de-identification evaluated at validate time, not generation time)"
    constants:
      DEIDENTIFICATION_MIN_PAYERS: 3

  - name: mrf_summary_rollup
    trigger: "MachineReadableFile creation (generation)"
    algorithm: aggregation
    formula: |
      serialized = cycle's StandardChargeRecord rows with status == VALIDATED, ordered by service code ASC, tie-break created_at ASC
      record_count = len(serialized)
      summary_total_discounted_cents = sum(r.discounted_cash_cents for r in serialized)
    input_set: "cycle's VALIDATED records at generation time (snapshot; later corrections do NOT mutate a SEALED/PUBLISHED file)"
    precision: "integer cents"

  - name: cycle_posture_derivation
    trigger: "any mutation to the cycle or its children (records validate/supersede, file generate/validate, freeze/publish)"
    algorithm: constraint_propagation
    formula: |
      if status == OPEN:       posture = FREEZABLE if validated_record_count >= facility.min_records_per_cycle else COLLECTING
      if status == FROZEN:     let f = the unique file with generation_status == SEALED (regeneration supersedes prior SEALED, so at most one)
                               posture = AWAITING_FILE if no such f
                                       | FILE_UNVALIDATED if f.validation_status == UNVALIDATED
                                       | PUBLISHABLE      if f.validation_status == VALID
                                       | FILE_INVALID     if f.validation_status == INVALID
      if status == PUBLISHED:  posture = CURRENT
      if status == SUPERSEDED: posture = ARCHIVED
    input_set: "cycle.status, validated_record_count, facility.min_records_per_cycle, the cycle's SEALED file"

  - name: shoppable_count_aggregation
    trigger: "ShoppableServiceList create; certify reads the aggregates"
    algorithm: threshold
    formula: |
      entry_count = len(entries)
      mandated_entry_count = count(e in entries where ServiceItem(e.service_item_id).cms_shoppable_mandated == true)
      certify passes iff entry_count >= facility.shoppable_min_entries AND mandated_entry_count >= facility.mandated_min_entries
      Boundary: exactly equal passes (>=, not >); total-count check runs BEFORE mandated-count check.
    input_set: "list entries; facility thresholds"
    constants:
      CMS_DEFAULT_TOTAL_MIN: 300
      CMS_DEFAULT_MANDATED_MIN: 70

  - name: payer_count_deidentification
    trigger: "derived_disclosure variant selection; mrf_schema_validation de-identification rule"
    algorithm: threshold
    formula: |
      payer_count = count DISTINCT contract.payer_id over ACTIVE contracts of facility holding an ACTIVE rate for the service item
      threshold: payer_count >= 3 passes; == 2 fails (boundary at exactly 3)
    input_set: "ACTIVE contracts of the facility with an ACTIVE rate on the item"
    constants:
      DEIDENTIFICATION_MIN_PAYERS: 3

  - name: penalty_accrual
    trigger: "read of Facility.penalty_accrued_cents while attestation_status IN {REJECTED, ESCALATED}; also recomputed on every clock advance"
    algorithm: dual_variant_accrual
    formula: |
      days = floor((current_logical_clock - rejected_at) / 86400 seconds); days >= 0
      VARIANT SIMPLE:  penalty_accrued_cents = days * 30000
      VARIANT TIERED:  daily = 10000 if bed_count <= 30; 20000 if 31 <= bed_count <= 199; 40000 if bed_count >= 200
                       penalty_accrued_cents = days * daily
      While attestation_status NOT IN {REJECTED, ESCALATED}: accrual frozen at its last computed value
      (0 if never rejected; rejection after CLOSED restarts from 0 because rejected_at is re-set).
    input_set: "facility.rejected_at, facility.bed_count, facility.penalty_policy, logical clock"
    constants:
      SIMPLE_DAILY_CENTS: 30000
      TIER1_MAX_BEDS: 30
      TIER1_DAILY_CENTS: 10000
      TIER2_MAX_BEDS: 199
      TIER2_DAILY_CENTS: 20000
      TIER3_DAILY_CENTS: 40000
    precision: "integer cents"
    variants:
      - name: SIMPLE
        when: "penalty_policy == SIMPLE"
        difference: "flat 30000/day regardless of bed_count"
      - name: TIERED
        when: "penalty_policy == TIERED"
        difference: "daily rate bracketed by bed_count; e.g. bed_count=25 over 3 days yields 30000 (TIERED) vs 90000 (SIMPLE) for identical dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; body FK references exist in declared field order"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PAYER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_SERVICE_ITEM_NOT_FOUND | ERR_CHARGE_RECORD_NOT_FOUND | ERR_RATE_NOT_FOUND | ERR_SHOPPABLE_LIST_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_FILE_NOT_FOUND | ERR_DISCREPANCY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: state
    check: "target resource in a legal state for the operation (contract editable, cycle OPEN/FROZEN, item ACTIVE, record DRAFT, list DRAFT/CERTIFIED, discrepancy at expected step, attestation at expected step, file SEALED)"
    error_id: "ERR_CONTRACT_NOT_EDITABLE | ERR_CONTRACT_ALREADY_TERMINAL | ERR_CYCLE_NOT_OPEN | ERR_CYCLE_NOT_FROZEN | ERR_CYCLE_NOT_PUBLISHED | ERR_RATE_LOCKED | ERR_ITEM_RETIRED | ERR_ITEM_IN_CERTIFIED_LIST | ERR_RECORD_NOT_DRAFT | ERR_LIST_NOT_DRAFT | ERR_LIST_NOT_CERTIFIED | ERR_LIST_NOT_PUBLISHED | ERR_DISCREPANCY_NOT_ACTIONABLE | ERR_ATTESTATION_INVALID_STATE | ERR_FILE_NOT_SEALED | ERR_POSTURE_NOT_FREEZABLE | ERR_POSTURE_NOT_PUBLISHABLE"
    http_status: 409
    applies_to: "state-transition and state-guarded endpoints"
  - priority: 5
    category: business_safety
    check: "regulatory/compliance guards: segregation-of-duties (proposer != approver != applier), attestation-year matches clock year, display feature flag enabled"
    error_id: "ERR_SOD_SAME_USER | ERR_ATTESTATION_YEAR_MISMATCH | ERR_DISPLAY_DISABLED"
    http_status: 422
    applies_to: "correction approve/apply, submit-attestation, display"
  - priority: 6
    category: business_constraint
    check: "uniqueness & structural constraints: duplicate CCN, duplicate item code within facility, window overlap, ancillary inclusion rules, entry item class"
    error_id: "ERR_DUPLICATE_CCN | ERR_DUPLICATE_ITEM_CODE | ERR_CONTRACT_WINDOW_OVERLAP | ERR_CYCLE_PERIOD_OVERLAP | ERR_ENTRY_NOT_SHOPPABLE | ERR_BUNDLED_ITEM_NOT_ANCILLARY | ERR_ANCILLARY_INCLUSION_VIOLATION | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "create endpoints, contract activate, cycle create"
  - priority: 7
    category: business_referential
    check: "cross-references coherent: record's item/cycle/facility belong together; discrepancy record belongs to referenced cycle; supersedes target valid"
    error_id: "ERR_CROSS_FACILITY_REFERENCE | ERR_RECORD_CYCLE_MISMATCH | ERR_RECORD_NOT_DISPUTABLE | ERR_SUPERSEDE_TARGET_INVALID | ERR_ENTRY_RECORD_MISSING"
    http_status: 422
    applies_to: "charge record create, discrepancy create, shoppable list publish"
  - priority: 8
    category: business_temporal
    check: "window sanity: effective_start <= effective_end; period_start < period_end; plan_due_date in the future"
    error_id: "ERR_INVALID_WINDOW"
    http_status: 422
    applies_to: "contract create, cycle create, cms-decision REJECT_*"
  - priority: 9
    category: business_fiscal
    check: "aggregate/threshold & monetary rules: certify minimums, validate-time monetary sanity (cash <= gross, rates exist), attestation requires containing ANNUAL PUBLISHED cycle"
    error_id: "ERR_SHOPPABLE_COUNT_BELOW_MINIMUM | ERR_MANDATED_COUNT_BELOW_MINIMUM | ERR_CASH_EXCEEDS_GROSS | ERR_NO_NEGOTIATED_RATES | ERR_NO_CONTAINING_ANNUAL_CYCLE"
    http_status: 422
    applies_to: "certify, record create/validate, submit-attestation"

# =============================================================================
# §1.5 API Endpoint Table (45 endpoints)
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "system transitions: ACTIVE PayerContract rows with effective_end date < new current date -> EXPIRED (with rate cascade); Facility attestation_status REJECTED -> ESCALATED when new clock > plan_due_date; penalty_accrued_cents recomputed for facilities in {REJECTED, ESCALATED}"

  # --- Facility + attestation/enforcement ---
  - method: POST
    path: "/transparency/facilities"
    description: "Register a facility subject to price transparency"
    roles: [PlatformAdmin]
    code: 201
    input: [name, cms_certification_number, bed_count, "penalty_policy?", "min_records_per_cycle?", "shoppable_min_entries?", "mandated_min_entries?", "shoppable_display_enabled?"]
    output: Facility
    side_effects: ["attestation_status=NONE, penalty_accrued_cents=0"]
  - method: GET
    path: "/transparency/facilities/{id}"
    description: "Read facility incl. attestation/enforcement posture and accrued penalty"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/transparency/facilities/{id}/submit-attestation"
    description: "Submit the annual CMS attestation of price-transparency compliance"
    roles: [ComplianceAuditor]
    code: 200
    input: [attestation_year]
    output: Facility
    side_effects: ["attestation machine NONE|CLOSED -> SUBMITTED; pins attestation_cycle_id"]
  - method: POST
    path: "/transparency/facilities/{id}/cms-decision"
    description: "CMS decision proxy: ACCEPT_ATTESTATION | REJECT_ATTESTATION (requires plan_due_date) | ACCEPT_PLAN | REJECT_PLAN (requires plan_due_date)"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "plan_due_date?"]
    output: Facility
    side_effects: ["attestation machine transitions per decision; REJECT_ATTESTATION retracts PUBLISHED files of the attestation cycle"]
  - method: POST
    path: "/transparency/facilities/{id}/submit-plan"
    description: "Submit corrective-action plan after CMS rejection"
    roles: [ComplianceAuditor]
    code: 200
    input: [plan_text]
    output: Facility
    side_effects: ["attestation machine REJECTED|ESCALATED -> PLAN_SUBMITTED"]

  # --- Payer ---
  - method: POST
    path: "/transparency/payers"
    description: "Register a payer organization"
    roles: [ContractManager]
    code: 201
    input: [name, payer_type, "confidentiality_tier?"]
    output: Payer
    side_effects: []
  - method: GET
    path: "/transparency/payers/{id}"
    description: "Read payer"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: Payer
    side_effects: []
  - method: GET
    path: "/transparency/payers/{id}/payer-contracts"
    description: "List contracts of a payer (FK reverse reachability for PayerContract.payer_id)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayerContract[]"
    side_effects: []

  # --- PayerContract ---
  - method: POST
    path: "/transparency/payer-contracts"
    description: "Create a payer contract in DRAFT"
    roles: [ContractManager]
    code: 201
    input: [facility_id, payer_id, confidentiality_clause, annual_volume, effective_start, effective_end]
    output: PayerContract
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/transparency/facilities/{id}/payer-contracts"
    description: "List contracts of a facility (FK reverse reachability for PayerContract.facility_id)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayerContract[]"
    side_effects: []
  - method: POST
    path: "/transparency/payer-contracts/{id}/activate"
    description: "Activate a DRAFT or RENEGOTIATING contract (closed-window overlap check)"
    roles: [ContractManager]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> ACTIVE; rate + charge-record + cycle cascades per state machine"]
  - method: POST
    path: "/transparency/payer-contracts/{id}/renegotiate"
    description: "Move ACTIVE contract to RENEGOTIATING; optionally amend window/clause"
    roles: [ContractManager]
    code: 200
    input: ["effective_end?", "confidentiality_clause?"]
    output: PayerContract
    side_effects: ["status -> RENEGOTIATING; ACTIVE rates -> DRAFT; charge-record recompute cascade"]
  - method: POST
    path: "/transparency/payer-contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract"
    roles: [ContractManager]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> TERMINATED; ACTIVE rates -> INACTIVE; charge-record recompute cascade"]

  # --- ServiceItem ---
  - method: POST
    path: "/transparency/service-items"
    description: "Register a billable service item"
    roles: [TransparencyOfficer]
    code: 201
    input: [facility_id, code, code_type, description, service_class, gross_charge_cents, "medicare_base_cents?", "ancillary_inclusion?", "cms_shoppable_mandated?"]
    output: ServiceItem
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/transparency/facilities/{id}/service-items"
    description: "List service items of a facility (FK reverse reachability)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["service_class?", "status?", "limit?", "offset?"]
    output: "ServiceItem[]"
    side_effects: []
  - method: PATCH
    path: "/transparency/service-items/{id}"
    description: "Update gross_charge_cents / medicare_base_cents, or retire via status=RETIRED. OCC-guarded."
    roles: [TransparencyOfficer]
    code: 200
    input: ["gross_charge_cents?", "medicare_base_cents?", "status?", expected_service_item_version]
    output: ServiceItem
    side_effects: ["increments ServiceItem.version by 1; gross/medicare change triggers CASCADE A (rates -> records -> cycles); status=RETIRED triggers retire transition"]

  # --- StandardChargeRecord ---
  - method: POST
    path: "/transparency/standard-charge-records"
    description: "Extract a standard charge record into an OPEN cycle; computes min/max/derived at creation"
    roles: [TransparencyOfficer]
    code: 201
    input: [facility_id, publication_cycle_id, service_item_id, discounted_cash_cents, "supersedes_id?"]
    output: StandardChargeRecord
    side_effects: ["gross snapshot; standard_charge_extrema + derived_disclosure computed; increments cycle.version"]
  - method: GET
    path: "/transparency/standard-charge-records/{id}"
    description: "Read a charge record"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: StandardChargeRecord
    side_effects: []
  - method: GET
    path: "/transparency/standard-charge-records"
    description: "List/filter charge records (FK reverse reachability for all four FKs)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["facility_id?", "publication_cycle_id?", "service_item_id?", "supersedes_id?", "status?", "limit?", "offset?"]
    output: "StandardChargeRecord[]"
    side_effects: []
  - method: POST
    path: "/transparency/standard-charge-records/{id}/validate"
    description: "Validate a DRAFT record (rates exist, cash <= gross)"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: StandardChargeRecord
    side_effects: ["status DRAFT -> VALIDATED; cycle aggregates recompute; increments cycle.version and record.version"]

  # --- PayerNegotiatedRate ---
  - method: POST
    path: "/transparency/payer-negotiated-rates"
    description: "Create a negotiated rate under a DRAFT/RENEGOTIATING contract; supersedes an existing DRAFT rate for the same (contract, item)"
    roles: [ContractManager]
    code: 201
    input: [contract_id, service_item_id, rate_type, "rate_percent?", "flat_amount_cents?"]
    output: PayerNegotiatedRate
    side_effects: ["negotiated_amount_cents materialized; existing DRAFT rate for same (contract_id, service_item_id) -> SUPERSEDED"]
  - method: GET
    path: "/transparency/payer-negotiated-rates/{id}"
    description: "Read a rate"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: PayerNegotiatedRate
    side_effects: []
  - method: GET
    path: "/transparency/payer-negotiated-rates"
    description: "List/filter rates (FK reverse reachability for contract_id and service_item_id)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["contract_id?", "service_item_id?", "status?", "limit?", "offset?"]
    output: "PayerNegotiatedRate[]"
    side_effects: []
  - method: PATCH
    path: "/transparency/payer-negotiated-rates/{id}"
    description: "Amend a DRAFT rate (rate_percent / flat_amount_cents)"
    roles: [ContractManager]
    code: 200
    input: ["rate_percent?", "flat_amount_cents?"]
    output: PayerNegotiatedRate
    side_effects: ["negotiated_amount_cents recomputed; charge-record recompute cascade for DRAFT-rate-exclusion semantics is NOT run (DRAFT rates are excluded from records); increments version"]

  # --- ShoppableServiceList ---
  - method: POST
    path: "/transparency/shoppable-service-lists"
    description: "Create a shoppable-service list with embedded entries (DRAFT)"
    roles: [TransparencyOfficer]
    code: 201
    input: [facility_id, title, entries]
    output: ShoppableServiceList
    side_effects: ["entry_count/mandated_entry_count computed"]
  - method: GET
    path: "/transparency/facilities/{id}/shoppable-service-lists"
    description: "List shoppable lists of a facility (FK reverse reachability)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShoppableServiceList[]"
    side_effects: []
  - method: POST
    path: "/transparency/shoppable-service-lists/{id}/certify"
    description: "Certify a DRAFT list (count thresholds, total before mandated)"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: ShoppableServiceList
    side_effects: ["status DRAFT -> CERTIFIED"]
  - method: POST
    path: "/transparency/shoppable-service-lists/{id}/publish"
    description: "Publish a CERTIFIED list; pins charge-record versions per entry; auto-archives prior PUBLISHED list"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: ShoppableServiceList
    side_effects: ["status CERTIFIED -> PUBLISHED; pinned_records captured; prior PUBLISHED list -> ARCHIVED"]
  - method: GET
    path: "/transparency/shoppable-service-lists/{id}/display"
    description: "Consumer display tool: per-entry package prices from pinned records with staleness flags"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: { list_id: string, entries: array, stale_any: boolean }
    side_effects: []

  # --- PublicationCycle ---
  - method: POST
    path: "/transparency/publication-cycles"
    description: "Open a monthly/annual publication cycle (half-open period, no overlap per facility+cycle_type)"
    roles: [TransparencyOfficer]
    code: 201
    input: [facility_id, cycle_type, period_start, period_end, schema_version]
    output: PublicationCycle
    side_effects: ["status=OPEN, posture=COLLECTING"]
  - method: GET
    path: "/transparency/publication-cycles/{id}"
    description: "Read a cycle incl. posture and aggregates"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: PublicationCycle
    side_effects: []
  - method: GET
    path: "/transparency/facilities/{id}/publication-cycles"
    description: "List cycles of a facility (FK reverse reachability)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["cycle_type?", "status?", "limit?", "offset?"]
    output: "PublicationCycle[]"
    side_effects: []
  - method: POST
    path: "/transparency/publication-cycles/{id}/freeze"
    description: "Freeze an OPEN cycle (posture gate: FREEZABLE)"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: PublicationCycle
    side_effects: ["status OPEN -> FROZEN"]
  - method: POST
    path: "/transparency/publication-cycles/{id}/publish"
    description: "Publish a FROZEN cycle (posture gate: PUBLISHABLE); supersedes prior published cycle of same facility+type"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: PublicationCycle
    side_effects: ["status FROZEN -> PUBLISHED; records VALIDATED -> PUBLISHED; SEALED file -> PUBLISHED; prior published cycle + its records + its files -> SUPERSEDED"]

  # --- MachineReadableFile ---
  - method: POST
    path: "/transparency/machine-readable-files"
    description: "Generate (seal) a machine-readable file for a FROZEN cycle. OCC-guarded on the cycle version."
    roles: [TransparencyOfficer]
    code: 201
    input: [publication_cycle_id, file_format, expected_publication_cycle_version]
    output: MachineReadableFile
    side_effects: ["generation_status=SEALED, validation_status=UNVALIDATED; record_count + summary_total_discounted_cents computed; prior SEALED file of same cycle -> SUPERSEDED; increments PublicationCycle.version by 1"]
  - method: GET
    path: "/transparency/publication-cycles/{id}/machine-readable-files"
    description: "List files of a cycle (FK reverse reachability)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "MachineReadableFile[]"
    side_effects: []
  - method: POST
    path: "/transparency/machine-readable-files/{id}/validate"
    description: "Run schema validation over a SEALED file (de-identification, retired-item, record-floor rules)"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: MachineReadableFile
    side_effects: ["validation_status -> VALID | INVALID; validation_errors populated; cycle posture recomputes"]

  # --- DiscrepancyReport / correction workflow ---
  - method: POST
    path: "/transparency/discrepancy-reports"
    description: "Report a discrepancy against a PUBLISHED cycle's record"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 201
    input: [publication_cycle_id, standard_charge_record_id, reporter_type, description]
    output: DiscrepancyReport
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/transparency/discrepancy-reports/{id}"
    description: "Read a discrepancy report"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: []
    output: DiscrepancyReport
    side_effects: []
  - method: GET
    path: "/transparency/discrepancy-reports"
    description: "List/filter discrepancies (FK reverse reachability for both FKs)"
    roles: [PlatformAdmin, TransparencyOfficer, ContractManager, ComplianceAuditor, Consumer]
    code: 200
    input: ["publication_cycle_id?", "standard_charge_record_id?", "status?", "limit?", "offset?"]
    output: "DiscrepancyReport[]"
    side_effects: []
  - method: POST
    path: "/transparency/discrepancy-reports/{id}/triage"
    description: "Triage a SUBMITTED report: outcome=CONFIRMED flags the record; outcome=DISMISSED closes it"
    roles: [ComplianceAuditor]
    code: 200
    input: [outcome]
    output: DiscrepancyReport
    side_effects: ["SUBMITTED -> CONFIRMED (record PUBLISHED -> FLAGGED) | DISMISSED"]
  - method: POST
    path: "/transparency/discrepancy-reports/{id}/propose-correction"
    description: "Propose corrected values for a CONFIRMED discrepancy"
    roles: [TransparencyOfficer]
    code: 200
    input: ["proposed_gross_charge_cents?", "proposed_discounted_cash_cents?"]
    output: DiscrepancyReport
    side_effects: ["CONFIRMED -> CORRECTION_PROPOSED; proposed_by_user_id := X-User-ID"]
  - method: POST
    path: "/transparency/discrepancy-reports/{id}/approve-correction"
    description: "Approve a proposed correction (SoD: approver != proposer)"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: DiscrepancyReport
    side_effects: ["CORRECTION_PROPOSED -> CORRECTION_APPROVED; approved_by_user_id := X-User-ID"]
  - method: POST
    path: "/transparency/discrepancy-reports/{id}/apply-correction"
    description: "Apply an approved correction (SoD: applier != approver); supersedes the disputed record and publishes the replacement"
    roles: [TransparencyOfficer]
    code: 200
    input: []
    output: DiscrepancyReport
    side_effects: ["CORRECTION_APPROVED -> CORRECTED; record supersede + replacement cascade; cycle aggregates recompute"]

# =============================================================================
# §1.6 Error Code Catalog (42 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for endpoint per §1.5" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility id does not exist" }
  - { id: ERR_PAYER_NOT_FOUND, http: 404, condition: "payer id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract id does not exist" }
  - { id: ERR_SERVICE_ITEM_NOT_FOUND, http: 404, condition: "service item id does not exist" }
  - { id: ERR_CHARGE_RECORD_NOT_FOUND, http: 404, condition: "charge record id does not exist" }
  - { id: ERR_RATE_NOT_FOUND, http: 404, condition: "negotiated rate id does not exist" }
  - { id: ERR_SHOPPABLE_LIST_NOT_FOUND, http: 404, condition: "shoppable list id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "publication cycle id does not exist" }
  - { id: ERR_FILE_NOT_FOUND, http: 404, condition: "machine-readable file id does not exist" }
  - { id: ERR_DISCREPANCY_NOT_FOUND, http: 404, condition: "discrepancy report id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum value, or no-op payload (e.g. neither proposed_* field present)" }
  - { id: ERR_CONTRACT_NOT_EDITABLE, http: 409, condition: "rate create attempted while contract not in {DRAFT, RENEGOTIATING}" }
  - { id: ERR_CONTRACT_ALREADY_TERMINAL, http: 409, condition: "activate/renegotiate/terminate attempted on TERMINATED or EXPIRED contract; renegotiate/terminate on non-ACTIVE contract" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "charge record create or validate attempted against a cycle not in OPEN" }
  - { id: ERR_CYCLE_NOT_FROZEN, http: 409, condition: "file generation attempted against a cycle not in FROZEN" }
  - { id: ERR_CYCLE_NOT_PUBLISHED, http: 409, condition: "discrepancy create attempted against a cycle not in PUBLISHED" }
  - { id: ERR_RATE_LOCKED, http: 409, condition: "rate PATCH attempted while rate.status != DRAFT" }
  - { id: ERR_ITEM_RETIRED, http: 409, condition: "operation references a RETIRED service item (record create/validate, entry add, PERCENT_OF_MEDICARE base read)" }
  - { id: ERR_RECORD_NOT_DRAFT, http: 409, condition: "validate attempted on a record not in DRAFT" }
  - { id: ERR_LIST_NOT_DRAFT, http: 409, condition: "certify attempted on a list not in DRAFT" }
  - { id: ERR_LIST_NOT_CERTIFIED, http: 409, condition: "publish attempted on a list not in CERTIFIED" }
  - { id: ERR_LIST_NOT_PUBLISHED, http: 409, condition: "display requested for a list not in PUBLISHED" }
  - { id: ERR_DISCREPANCY_NOT_ACTIONABLE, http: 409, condition: "triage/propose/approve/apply attempted from a state where that action is not defined" }
  - { id: ERR_ATTESTATION_INVALID_STATE, http: 409, condition: "submit-attestation / cms-decision / submit-plan attempted from an attestation_status where the transition is not defined" }
  - { id: ERR_FILE_NOT_SEALED, http: 409, condition: "validate attempted on a file whose generation_status != SEALED" }
  - { id: ERR_POSTURE_NOT_FREEZABLE, http: 409, condition: "freeze attempted while posture != FREEZABLE (validated_record_count below facility floor)" }
  - { id: ERR_POSTURE_NOT_PUBLISHABLE, http: 409, condition: "publish attempted while posture != PUBLISHABLE (no SEALED VALID file)" }
  - { id: ERR_SOD_SAME_USER, http: 422, condition: "segregation of duties violated: approver == proposer, or applier == approver" }
  - { id: ERR_ATTESTATION_YEAR_MISMATCH, http: 422, condition: "attestation_year does not equal the calendar year of the current logical clock" }
  - { id: ERR_DISPLAY_DISABLED, http: 422, condition: "consumer display requested while facility.shoppable_display_enabled == false" }
  - { id: ERR_DUPLICATE_CCN, http: 409, condition: "facility create with an already-registered cms_certification_number" }
  - { id: ERR_DUPLICATE_ITEM_CODE, http: 409, condition: "service item create with a code already used within the facility" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "activate would produce two ACTIVE contracts for the same (facility_id, payer_id) with intersecting CLOSED windows — touching endpoints count as intersection" }
  - { id: ERR_CYCLE_PERIOD_OVERLAP, http: 409, condition: "cycle create with a [period_start, period_end) HALF-OPEN window overlapping another non-terminal cycle of same facility+cycle_type — touching endpoints do NOT count as overlap" }
  - { id: ERR_ENTRY_NOT_SHOPPABLE, http: 422, condition: "shoppable entry references an item whose service_class != SHOPPABLE" }
  - { id: ERR_BUNDLED_ITEM_NOT_ANCILLARY, http: 422, condition: "bundled_ancillary_item_ids references an item whose service_class != ANCILLARY" }
  - { id: ERR_ANCILLARY_INCLUSION_VIOLATION, http: 422, condition: "bundled ancillary item has ancillary_inclusion == SEPARATELY_PRICED" }
  - { id: ERR_CROSS_FACILITY_REFERENCE, http: 422, condition: "charge record's facility_id disagrees with its cycle's or item's facility" }
  - { id: ERR_RECORD_CYCLE_MISMATCH, http: 422, condition: "discrepancy's standard_charge_record_id does not belong to the referenced publication_cycle_id" }
  - { id: ERR_RECORD_NOT_DISPUTABLE, http: 422, condition: "discrepancy create against a record whose status is not in {PUBLISHED, FLAGGED} (checked after the record-cycle match)" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 422, condition: "supersedes_id references a record that is missing, cross-facility, or not in {PUBLISHED, FLAGGED}" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "effective_start > effective_end, or period_start >= period_end, or plan_due_date not strictly after current clock" }
  - { id: ERR_SHOPPABLE_COUNT_BELOW_MINIMUM, http: 422, condition: "certify: entry_count < facility.shoppable_min_entries (checked first)" }
  - { id: ERR_MANDATED_COUNT_BELOW_MINIMUM, http: 422, condition: "certify: entry_count sufficient but mandated_entry_count < facility.mandated_min_entries (checked second)" }
  - { id: ERR_CASH_EXCEEDS_GROSS, http: 422, condition: "discounted_cash_cents > gross_charge_cents at record create/validate, or proposed_discounted > effective gross at propose-correction" }
  - { id: ERR_NO_NEGOTIATED_RATES, http: 422, condition: "validate attempted while min_negotiated_cents is null (no includible ACTIVE rate)" }
  - { id: ERR_NO_CONTAINING_ANNUAL_CYCLE, http: 422, condition: "submit-attestation without an ANNUAL PUBLISHED cycle containing the attestation year" }
  - { id: ERR_NO_PUBLISHED_CYCLE, http: 422, condition: "shoppable publish while facility has no PUBLISHED publication cycle" }
  - { id: ERR_ITEM_IN_CERTIFIED_LIST, http: 409, condition: "service item retire attempted while a CERTIFIED or PUBLISHED shoppable list of the same facility references the item" }
  - { id: ERR_ENTRY_RECORD_MISSING, http: 422, condition: "shoppable publish: some entry's service item lacks a PUBLISHED charge record in the facility's latest PUBLISHED cycle" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Hospital-system platform operator; registers facilities, drives the logical clock, and acts as the CMS decision proxy"
    identity: opaque
    exclusive_operations:
      - "POST /transparency/facilities"
      - "POST /_clock/set_current_utc"
      - "POST /transparency/facilities/{id}/cms-decision"
    shared_operations: ["all GET endpoints", "POST /transparency/discrepancy-reports"]
  - name: ContractManager
    description: "Payer-relations manager owning payers, contracts, and negotiated rates"
    identity: opaque
    exclusive_operations:
      - "POST /transparency/payers"
      - "POST /transparency/payer-contracts"
      - "POST /transparency/payer-contracts/{id}/activate"
      - "POST /transparency/payer-contracts/{id}/renegotiate"
      - "POST /transparency/payer-contracts/{id}/terminate"
      - "POST /transparency/payer-negotiated-rates"
      - "PATCH /transparency/payer-negotiated-rates/{id}"
    shared_operations: ["all GET endpoints", "POST /transparency/discrepancy-reports"]
  - name: TransparencyOfficer
    description: "Price-transparency office staff; owns service items, charge extraction, cycles, files, shoppable lists, and the correction workflow"
    identity: opaque
    exclusive_operations:
      - "POST /transparency/service-items"
      - "PATCH /transparency/service-items/{id}"
      - "POST /transparency/standard-charge-records"
      - "POST /transparency/standard-charge-records/{id}/validate"
      - "POST /transparency/publication-cycles"
      - "POST /transparency/publication-cycles/{id}/freeze"
      - "POST /transparency/publication-cycles/{id}/publish"
      - "POST /transparency/machine-readable-files"
      - "POST /transparency/machine-readable-files/{id}/validate"
      - "POST /transparency/shoppable-service-lists"
      - "POST /transparency/shoppable-service-lists/{id}/certify"
      - "POST /transparency/shoppable-service-lists/{id}/publish"
      - "POST /transparency/discrepancy-reports/{id}/propose-correction"
      - "POST /transparency/discrepancy-reports/{id}/approve-correction"
      - "POST /transparency/discrepancy-reports/{id}/apply-correction"
    shared_operations: ["all GET endpoints", "POST /transparency/discrepancy-reports"]
  - name: ComplianceAuditor
    description: "Compliance liaison to CMS; submits attestations and corrective plans, triages discrepancies. Segregated from correction propose/approve/apply and from the CMS decision proxy."
    identity: opaque
    exclusive_operations:
      - "POST /transparency/facilities/{id}/submit-attestation"
      - "POST /transparency/facilities/{id}/submit-plan"
      - "POST /transparency/discrepancy-reports/{id}/triage"
    shared_operations: ["all GET endpoints", "POST /transparency/discrepancy-reports"]
  - name: Consumer
    description: "Anonymous public user of the shoppable display tool and discrepancy intake"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /transparency/discrepancy-reports"]
