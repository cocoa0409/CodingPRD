          assert: ["trigger response error_id == ERR_UNAUTHORIZED (403)"]

  # ---------------- Cross-cutting: optimistic concurrency ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_schedule_stale_device_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[inspection-schedule-stale-device]", "errors[ERR_STALE_DEVICE_VERSION]"]
        distinguishing_aspect: "A second POST /inspections carrying the original (now stale) expected_device_version — after the first schedule already advanced Device.version — is rejected with ERR_STALE_DEVICE_VERSION (412)."
        test_recipe:
          setup: ["A device at version 1; a first inspection is scheduled successfully, advancing Device.version to 2."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Occ Store", jurisdiction: "CA-44" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Vic V", badge_number: "BADGE-30" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-OCC", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-05T09:00:00Z", scheduled_end: "2026-04-05T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-06T09:00:00Z", scheduled_end: "2026-04-06T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_STALE_DEVICE_VERSION (412)"]

      - name: occ_schedule_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[inspection-schedule-stale-device]", entities.Device.fields.status]
        distinguishing_aspect: "Scheduling with the current expected_device_version succeeds (201) and increments Device.version by exactly 1."
        test_recipe:
          setup: ["A freshly registered device at version 1."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Occ2 Store", jurisdiction: "CA-45" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Wes W", badge_number: "BADGE-31" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-OCC2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-07T09:00:00Z", scheduled_end: "2026-04-07T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_status: "$.data.status" } }
            - { call: "GET /devices/${dev_id}", payload: {}, as: ProgramAdmin, captures: { dev_v_after: "$.data.version" } }
          assert:
            - "trigger inspection created with status SCHEDULED (201)"
            - "Device.${dev_id}.version == 2 (was 1 at registration)"

