    code: 201
    input: ["gear_model_id", "part_code", "part_kind", "on_hand_units", "unit_price_cents", "low_watermark_units?", "substitution_allowed?", "substitute_for_part_code?"]
    output: PartLot
    side_effects: ["reserved_units = 0, available_units = on_hand_units, status derived", "GearModel.parts_support_status re-derived for the lot's model and for any model whose successor this model is"]
  - method: GET
    path: "/gear-service/part-lots/{id}"
    description: "read a part lot with live unit counters"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: PartLot
    side_effects: []
  - method: GET
    path: "/gear-service/part-lots"
    description: "list part lots; gear_model_id filter is the reverse-reachability channel"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["gear_model_id?", "part_kind?", "status?", "limit?", "offset?"]
    output: PartLot[]
    side_effects: []
  - method: POST
    path: "/gear-service/part-lots/{id}/adjustments"
    description: "restock or write down a lot's on-hand units"
    roles: [PartsCoordinator, ProgramAdmin]
    code: 200
    input: [delta_units, reason]
    output: PartLot
    side_effects: ["on_hand_units += delta_units, available_units recomputed, status re-derived (DEPLETED -> LOW/AVAILABLE closes the inventory cycle)", "GearModel.parts_support_status re-derived"]
  - method: POST
    path: "/gear-service/repair-orders/{id}/parts-reservations"
    description: "reserve units against a repair order, exact code or substitution"
