      - name: defect_claim_dispute_cycle_stops_at_round_two
        claim_type: cyclic
        grounds:
          - state_machines[DefectClaim.status]
          - validations[priority=59]
          - endpoints[POST /modular/defect-claims/{claimId}/dispute]
        distinguishing_aspect: |
          The claim machine cycles ADJUDICATED -> DISPUTED -> ADJUDICATED, but the cycle has a
          declared termination condition: adjudication_round must be below 2 to dispute, so the
          second re-adjudication is final and a third dispute is refused.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; module M-01 exists; an OPEN FACTORY-phase claim for 1_234_567 cents"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
