            - "${se_ver} == 3: version 1 at create, 2 at submit, 3 at activate; the two verifications bumped FinancedPolicy.version, not the agreement's"
            - "the installment list has total_count == 6 in installment_number ascending order"
            - "${i1_num} == 1, ${i1_due} == '2026-10-01', ${i1_amt} == 89941 == floor(539650 / 6), ${i1_fc} == 6275 == round_half_up(37650 / 6), ${i1_pr} == 83666, ${i1_paid} == 0, ${i1_status} == 'SCHEDULED'"
