        claim_type: precision
        grounds: [calculations.settlement_valuation]
        distinguishing_aspect: "Rounding order is pinned round-per-line-then-sum: two 30-cent sales give commission round_half_up(4.5) == 5 per line (total 10, proceeds 50); summing first would give round_half_up(60 x 0.15) == 9 commission (proceeds 51). The pinned order yields gross 50."
        test_recipe:
          setup: ["account; clock 2026-05-01; DROPOFF manifest RECEIVED (declared 2); two non-data OTHER grade D items triaged RESALE, listed (floor 1), each sold at 30 cents; reconciled; quote; finalized"]
