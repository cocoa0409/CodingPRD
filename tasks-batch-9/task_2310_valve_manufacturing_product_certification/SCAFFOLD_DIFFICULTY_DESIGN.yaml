            - "ValveModel.${m_id}.repair_kit_stock_qty == 3"

      - name: engineered_order_clarification_loop_terminates_at_three_rounds
        grounds:
          - state_machines.EngineeredOrder.UNDER_REVIEW_to_CLARIFICATION_REQUESTED
          - state_machines.EngineeredOrder.CLARIFICATION_REQUESTED_to_UNDER_REVIEW
          - validations[priority=72]
          - concurrency_rules[datasheet-revision-stale-order]
        distinguishing_aspect: |
          The review dimension is cyclic: UNDER_REVIEW -> CLARIFICATION_REQUESTED -> UNDER_REVIEW is traversed
          three times with clarification_round_count reaching 3 and datasheet_revision_no reaching 4, and the
          fourth REQUEST_CLARIFICATION is refused with ERR_CLARIFICATION_ROUNDS_EXHAUSTED — the loop has a
          declared termination condition rather than being open-ended.
        test_recipe:
          setup:
            - "One DRAFT valve model and one engineered order submitted for review."
            - "Three completed clarification rounds, each answered by a datasheet revision pinned to the order version the client last read."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "CV-600-F316", valve_type: "CONTROL", pressure_class: 600, body_material_grade: "F316", bore_size_mm: 200, seat_type: "METAL", base_break_torque_nm: 900.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-LOOP", model_id: "${m_id}", ordered_qty: 2, unit_price_cents: 800000, customer_credit_limit_cents: 9000000, datasheet_break_torque_nm: 900.0, datasheet_torque_source: "CUSTOMER_STATED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "REQUEST_CLARIFICATION" }
              as: QualityManager
              captures: { v_after_rc1: $.data.version }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/datasheet-revisions"
              payload: { datasheet_break_torque_nm: 910.0, datasheet_torque_source: "VENDOR_MEASURED", expected_engineered_order_version: "${v_after_rc1}" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "REQUEST_CLARIFICATION" }
              as: QualityManager
              captures: { v_after_rc2: $.data.version }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/datasheet-revisions"
              payload: { datasheet_break_torque_nm: 920.0, datasheet_torque_source: "VENDOR_MEASURED", expected_engineered_order_version: "${v_after_rc2}" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "REQUEST_CLARIFICATION" }
              as: QualityManager
              captures: { v_after_rc3: $.data.version }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/datasheet-revisions"
              payload: { datasheet_break_torque_nm: 930.0, datasheet_torque_source: "VENDOR_MEASURED", expected_engineered_order_version: "${v_after_rc3}" }
              as: ProductEngineer
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "REQUEST_CLARIFICATION" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLARIFICATION_ROUNDS_EXHAUSTED"
            - "HTTP status == 409"
            - "EngineeredOrder.${o_id}.status == UNDER_REVIEW"
            - "EngineeredOrder.${o_id}.clarification_round_count == 3"
            - "EngineeredOrder.${o_id}.datasheet_revision_no == 4"
            - "EngineeredOrder.${o_id}.datasheet_break_torque_nm == 930.0"

