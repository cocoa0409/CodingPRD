  - rule_id: boundary_precision_check
    instances:

      - name: ccw_rigor_score_inclusive_seventy_boundary
        grounds:
          - calculations.ccw_rigor_score
          - state_machines.CompensatingControlWorksheet.SUBMITTED_to_ACCEPTED
          - validations[priority=13]
          - entities.CompensatingControlWorksheet.fields.rigor_score
          - entities.RequirementAssessment.fields.risk_points
        distinguishing_aspect: |
          The acceptance gate is rigor_score >= 70.00 inclusive, and the two worksheets differ only in
          their parent requirement's family (R6 -> FAMILY_RISK_POINTS 4 -> risk_offset 40 versus R3 ->
          FAMILY_RISK_POINTS 5 -> risk_offset 25): the first scores exactly 70.00 and MUST be accepted,
          the second scores 66.25 - 3.75 points below the bar - and MUST be refused with
          ERR_CCW_RIGOR_INSUFFICIENT, so an implementation using > instead of >= fails on the first call.
