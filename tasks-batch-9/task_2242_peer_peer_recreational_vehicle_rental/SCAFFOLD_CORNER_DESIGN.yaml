  - section: consistency model
    instances:

      - name: confirm_reports_the_hold_and_the_debited_wallet_in_its_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Booking settlement_status
          - calculations.renter_wallet_balance
        distinguishing_aspect: >-
          Nothing in this system lags: the /confirm response itself already
          carries settlement_status HELD and hold_amount_cents 146063, the
          renter's wallet is already down to 653937 when read immediately
          afterwards, and the recomputed quote is already on the row — no second
          request or settle step is needed to observe any of it. The hold is a
          wallet debit only: no LedgerEntry exists until /settle posts.
        test_recipe:
          setup: >-
            Full canonical marketplace with the wallet funded to 800000 and
            booking B1 owner-approved.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
            - *k_bk_approve
          trigger:
            - call: "POST /rv-marketplace/bookings/${booking_id}/confirm"
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "response 200"
            - "data.trip_status == 'CONFIRMED' and data.settlement_status == 'HELD'"
            - "data.hold_amount_cents == 146063 and data.quoted_total_cents == 146063"
            - "GET /rv-marketplace/renters/${renter_id} immediately after returns data.wallet_credit_cents == 653937"
            - "GET /rv-marketplace/ledger-entries with booking_id == ${booking_id} returns total_count == 0 (settlement_ledger_posting is the only producer of rows)"
