              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 2, design_kw: 5.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack2_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 50.00, breaker_amps: 100 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_b_id}", feed_side: "B", requested_kw: 50.00, breaker_amps: 100 }
              as: ElectricalContractor
              captures: { feed_b_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack2_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 5.00, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_c_id: $.data.id }
          trigger:
            - call: "DELETE /rack-feeds/${feed_c_id}"
              payload: {}
              as: ElectricalContractor
          assert:
            - "the trigger returns 200 with the released RackFeed in the envelope; RackFeed.${feed_c_id}.status == RELEASED and released_at is non-null"
            - "RackFeed.${feed_c_id}.allocated_kw == 5.000 (the released row keeps its historical allocation)"
            - "Hall.${hall_id}.committed_kw == 100.00 — RELEASED feeds are outside the ledger's input set"
            - "Hall.${hall_id}.commissioning_reserve_kw == 25.00 — the tier-2 jump caused by the reservation is fully reversed"
            - "Hall.${hall_id}.spare_kw == 275.00 and committed + reserve + spare == 400.00 exactly as before the reservation"
            - "Busway.${bw_a_id}.committed_kw == 50.000 and Busway.${bw_a_id}.feed_count == 1"
            - "Rack.${rack2_id}.connected_kw == 0.000 and Rack.${rack2_id}.status == PLANNED"
            - "GET /rack-feeds?rack_id=${rack2_id} returns total_count == 0 while GET /rack-feeds?rack_id=${rack2_id}&include_released=true returns total_count == 1 — the compensation is auditable, not a delete"

      - name: mop_execute_then_back_out_conserves_rack_custody_counts
        grounds:
          - state_machines.MethodOfProcedure.IN_EXECUTION_to_BACKED_OUT
          - calculations.rack_custody_partition
          - calculations.hall_release_posture
          - entities.Rack.fields.pre_risk_status
          - entities.MethodOfProcedure.fields.pre_execution_target_state
        distinguishing_aspect: |
          Backing out an executed MOP must compensate all four cascade-A hops in reverse: the busway is
          restored from ISOLATED to the captured pre_execution_target_state ENERGIZED, its feed returns
          DERATED -> ENERGIZED, the rack AT_RISK -> its pre_risk_status POWERED with pre_risk_status
          cleared to null, and the cage DEGRADED -> SECURED, so custody_ops_count / custody_fitout_count /
          at_risk_rack_count all return to 1 / 0 / 0. Nothing is left drifted and the terminal status is
          BACKED_OUT rather than CLOSED even though the restoration is identical.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-05T02:30:00Z."
            - "Hall HT1 (SINGLE_TENANT, cooling_redundancy N) is in COMMISSIONING; rack R-1-1 (design_kw 15.00, cage CG-1) was POWERED on 7.50 kW feeds over BW-A1 and BW-B1; cage CG-1 was SECURED with 95.00 % camera coverage and two reader zones."
            - "MOP-1 (MEDIUM, target BW-A1, author u-elec-1, window 2026-08-05T02:00:00Z -> 04:00:00Z) has been executed, so cascade A has fired: BW-A1 ISOLATED, FEED-A DERATED, R-1-1 AT_RISK with pre_risk_status POWERED, CG-1 DEGRADED."
            - "At the moment of the trigger: Hall.custody_ops_count == 0, Hall.custody_fitout_count == 1, Hall.at_risk_rack_count == 1, Hall.release_posture == LOCKED, Hall.committed_kw == 15.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Data Hall T", code: "HT1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Northwind Systems", code: "T1", contracted_kw: 200.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { t1_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /cooling-units"
