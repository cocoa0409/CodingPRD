            - "credential_compliance_pct == 90.00 (100 * 1.80 / 2.00); the PENDING row contributes nothing to the numerator and does not change the denominator."
            - "The cycle sits in OBSERVATION_FINALIZED with a two-observer visit finalized at composite 5.83 and reliability_pct 83.33, self_assessment VERIFIED, awarded_tier still null."
