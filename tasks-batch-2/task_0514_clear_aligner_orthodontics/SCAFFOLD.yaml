scenario: "Clear-Aligner Direct Orthodontics (SmileDirectClub/Byte style): impression-kit vs in-office scan intake, dentist/ortho treatment-plan review, aligner-step manufacturing & shipment, progress check-in & tracking, financing (monthly-pay) plan, refinement/mid-course correction, retainer subscription, eligibility-decline/refund"
domain_name: "clear-aligner-orthodontics"
api_prefix: ""

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Optimistic concurrency"
    - "Scheduled / deferred actions"
    - "Rate / threshold triggers"

  entity_topology: hybrid
  # TreatmentCase is the central resource (star-ish); IntakeRecord/TreatmentPlan/
  # AlignerStep/ProgressCheckin/RefinementRequest hang off it as children, while
  # FinancingPlan/RetainerSubscription/RefundRequest and Shipment are flat peers
  # linked by FK. Clinician and Patient are flat actor entities.

  state_machine_shape: cyclic
  # TreatmentPlan review loops (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED), and a
  # RefinementRequest re-opens an already-active TreatmentCase, sending the case
  # ACTIVE -> REFINEMENT -> ACTIVE. FinancingPlan carries two independent state
  # dimensions (billing_state x delinquency_state) that evolve on one row (parallel).

  relationship_patterns:
    - one_to_many        # TreatmentCase -> AlignerStep, FinancingPlan -> Installment
    - cross_aggregate    # Shipment references AlignerStep across the case boundary; RefundRequest references FinancingPlan
    - self_referential   # AlignerStep.supersedes_step_id points at the step a refinement replaces

  role_model: peer_roles
  # Patient owns intake/check-in/financing/refund-initiation; Clinician owns plan
  # authoring/review/eligibility decisions; ManufacturingOps owns aligner production
  # and shipment; BillingAdmin owns financing posting and refund settlement. No role
  # is a superset of another.

  consistency_model: immediate
  # All side effects (ledger debits, case posture recompute, shipment status) settle
  # atomically inside the triggering request.

# ─────────────────────────────────────────────────────────────────────────────
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ─────────────────────────────────────────────────────────────────────────────
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login / contact email; unique."
        constraints: "unique across Patient; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: state_code
        type: string
        source: input
        description: "US state of residence (two-letter). Gates teledentistry eligibility."
        constraints: "two uppercase letters"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD). Used to derive age at intake."
      - name: is_minor_at_intake
        type: boolean
        source: computed
        description: "True when age at the case's intake datetime < 18, derived from date_of_birth and the IntakeRecord.captured_at. Drives guardian-consent gating."
        default: false

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician name."
      - name: license_state_codes
        type: array
        source: input
        description: "Array of US state codes the clinician is licensed in. A plan may only be reviewed for a Patient whose state_code is in this array."
        constraints: "non-empty array of two-letter codes"
      - name: role_type
        type: enum
        source: input
        description: "Clinical role."
        constraints: "one of {DENTIST, ORTHODONTIST}"
      - name: active
        type: boolean
        source: input
        description: "Whether the clinician currently accepts assignments."
        default: true

  - name: TreatmentCase
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this case belongs to."
      - name: intake_channel
        type: enum
        source: input
        description: "How impressions are captured."
        constraints: "one of {IMPRESSION_KIT, IN_OFFICE_SCAN}"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle posture."
        default: "INTAKE_PENDING"
        constraints: "one of {INTAKE_PENDING, UNDER_REVIEW, DECLINED, PLAN_APPROVED, ACTIVE, REFINEMENT, COMPLETED, REFUNDED}"
      - name: assigned_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the clinician assigned at review submission. Null until UNDER_REVIEW."
        default: null
      - name: list_price_cents
        type: integer
        source: input
        description: "Sticker price of the aligner program in cents, quoted at case creation."
        constraints: ">= 0"
      - name: total_contracted_cents
        type: integer
        source: computed
        description: "Final patient-owed amount after discounts; computed at plan approval via case_price calculation. 0 until PLAN_APPROVED."
        default: 0
      - name: amount_collected_cents
        type: integer
        source: computed
        description: "Sum of POSTED Installment.amount_cents plus any upfront payment posted against this case. Maintained by ledger-sync side effects."
        default: 0
      - name: refund_issued_cents
        type: integer
        source: computed
        description: "Total refunded back to the patient on this case; set when a RefundRequest settles."
        default: 0
      - name: refinement_count
        type: integer
        source: computed
        description: "Number of refinement cycles consumed on this case; increments when a RefinementRequest is GRANTED."
        default: 0
      - name: planned_step_count
        type: integer
        source: computed
        description: "Count of AlignerStep rows whose status != VOID belonging to this case; maintained as steps are generated/voided."
        default: 0
      - name: guardian_consent
        type: boolean
        source: input
        description: "Recorded guardian consent for a minor patient. Required true before a minor's plan can be approved."
        default: false

  - name: IntakeRecord
    parent: TreatmentCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; the case this intake feeds."
      - name: channel
        type: enum
        source: input
        description: "Intake medium; must equal the parent case's intake_channel."
        constraints: "one of {IMPRESSION_KIT, IN_OFFICE_SCAN}"
      - name: captured_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the intake was registered/uploaded."
      - name: kit_tracking_number
        type: string
        source: input
        description: "Carrier tracking number of the returned impression kit; required only when channel=IMPRESSION_KIT."
        default: null
      - name: scan_clinic_state_code
        type: string
        source: input
        description: "US state of the partner clinic that performed the scan; required only when channel=IN_OFFICE_SCAN."
        default: null
      - name: quality_score
        type: number
        source: input
        description: "0.0–1.0 image-quality score graded on upload. Below MIN_USABLE_QUALITY the intake is unusable and review cannot be requested."
        constraints: "0.0 <= quality_score <= 1.0"

  - name: TreatmentPlan
    parent: TreatmentCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; the case being planned."
      - name: author_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; clinician who authored this plan revision."
      - name: revision
        type: integer
        source: system
        description: "1-based revision index; increments each time a fresh plan is submitted after CHANGES_REQUESTED."
        default: 1
      - name: status
        type: enum
        source: system
        description: "Plan review posture."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, ELIGIBILITY_DECLINED}"
      - name: proposed_step_count
        type: integer
        source: input
        description: "Number of aligner steps this plan proposes to manufacture."
        constraints: ">= 1"
      - name: weeks_per_step
        type: integer
        source: input
        description: "Wear duration per aligner step in weeks; drives shipment cadence and projected end date."
        constraints: ">= 1"
      - name: discount_code
        type: string
        source: input
        description: "Optional promo code applied to list_price at approval."
        default: null

  - name: AlignerStep
    parent: TreatmentCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; the case this step belongs to."
      - name: step_index
        type: integer
        source: system
        description: "1-based position within the wear sequence for this case."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Manufacturing/shipping posture of this step."
        default: "PLANNED"
        constraints: "one of {PLANNED, IN_PRODUCTION, MANUFACTURED, SHIPPED, VOID}"
      - name: supersedes_step_id
        type: string
        source: system
        description: "FK -> AlignerStep.id; for refinement-generated steps, the original step this one replaces (self-referential). Null for first-run steps."
        default: null
      - name: scheduled_ship_at
        type: datetime
        source: computed
        description: "Projected ship datetime = case approval time + (step_index-1)*weeks_per_step weeks. Recomputed if the plan changes."
        default: null

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: step_id
        type: string
        source: input
        description: "FK -> AlignerStep.id; the manufactured step being shipped (cross-aggregate reference)."
      - name: carrier_code
        type: enum
        source: input
        description: "Carrier handling the parcel."
        constraints: "one of {GROUND, EXPRESS}"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the carrier pickup/delivery window (inclusive)."
      - name: window_end
        type: datetime
        source: input
        description: "End of the carrier pickup/delivery window. Exclusive for GROUND, inclusive for EXPRESS (see overlap rules §1.4)."
      - name: status
        type: enum
        source: system
        description: "Shipment posture."
        default: "BOOKED"
        constraints: "one of {BOOKED, IN_TRANSIT, DELIVERED, CANCELLED}"

  - name: ProgressCheckin
    parent: TreatmentCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; case being checked in on."
      - name: reported_step_index
        type: integer
        source: input
        description: "Aligner step the patient reports currently wearing."
        constraints: ">= 1"
      - name: photo_quality_score
        type: number
        source: input
        description: "0.0–1.0 quality score of the submitted progress photo."
        constraints: "0.0 <= photo_quality_score <= 1.0"
      - name: tracking_assessment
        type: enum
        source: computed
        description: "Clinician/auto assessment of whether teeth are tracking to plan."
        default: "PENDING"
        constraints: "one of {PENDING, ON_TRACK, OFF_TRACK}"

  - name: RefinementRequest
    parent: TreatmentCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; case requesting a mid-course correction."
      - name: triggering_checkin_id
        type: string
        source: input
        description: "FK -> ProgressCheckin.id; the OFF_TRACK check-in that justifies the refinement."
      - name: additional_step_count
        type: integer
        source: input
        description: "Number of extra aligner steps requested for the correction."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Refinement decision posture."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, GRANTED, DENIED}"
      - name: is_billable
        type: boolean
        source: computed
        description: "True when the case has already consumed its INCLUDED_REFINEMENTS allotment, so this refinement incurs a fee."
        default: false

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; the case being financed (cross-aggregate)."
      - name: term_months
        type: integer
        source: input
        description: "Number of monthly installments."
        constraints: "one of {12, 24, 36}"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Upfront amount paid at financing activation."
        constraints: ">= 0"
      - name: apr_bps
        type: integer
        source: input
        description: "Annual percentage rate in basis points (e.g. 1499 = 14.99%)."
        constraints: ">= 0"
      - name: billing_state
        type: enum
        source: system
        description: "Lifecycle dimension #1: where the plan is in its installment schedule."
        default: "PENDING_ACTIVATION"
        constraints: "one of {PENDING_ACTIVATION, ACTIVE, PAID_OFF, CANCELLED}"
      - name: delinquency_state
        type: enum
        source: system
        description: "Lifecycle dimension #2 (parallel to billing_state): payment health, evolves independently."
        default: "CURRENT"
        constraints: "one of {CURRENT, DELINQUENT, DEFAULTED}"
      - name: financed_principal_cents
        type: integer
        source: computed
        description: "total_contracted_cents - down_payment_cents at activation; the principal amortized across installments."
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "Remaining principal not yet covered by POSTED installment principal portions; ledger-synced."
        default: 0

  - name: Installment
    parent: FinancingPlan
    common_fields: true
    fields:
      - name: financing_plan_id
        type: string
        source: input
        description: "FK -> FinancingPlan.id; the schedule this installment belongs to."
      - name: sequence_no
        type: integer
        source: system
        description: "1-based installment number within the plan."
        constraints: ">= 1"
      - name: due_at
        type: datetime
        source: computed
        description: "Activation datetime + sequence_no months (calendar-month add)."
      - name: amount_cents
        type: integer
        source: computed
        description: "Scheduled installment amount (principal+interest) from the amortization calculation."
        default: 0
      - name: principal_portion_cents
        type: integer
        source: computed
        description: "Portion of amount_cents applied to principal under the chosen amortization variant."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Installment posting posture."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, POSTED, LATE, WAIVED}"

  - name: RetainerSubscription
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; the completed case this retainer follows (cross-aggregate)."
      - name: cadence
        type: enum
        source: input
        description: "How often a fresh retainer set ships."
        constraints: "one of {QUARTERLY, SEMIANNUAL}"
      - name: per_shipment_fee_cents
        type: integer
        source: input
        description: "Charge per retainer shipment in cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Subscription posture."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"
      - name: next_ship_at
        type: datetime
        source: computed
        description: "Next scheduled retainer ship datetime; advanced by cadence on each fulfilled cycle."

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> TreatmentCase.id; case being refunded (cross-aggregate)."
      - name: reason
        type: enum
        source: input
        description: "Why a refund is sought."
        constraints: "one of {ELIGIBILITY_DECLINE, PATIENT_CANCEL, GOODWILL}"
      - name: status
        type: enum
        source: system
        description: "Refund posture."
        default: "OPEN"
        constraints: "one of {OPEN, APPROVED, SETTLED, REJECTED}"
      - name: computed_refund_cents
        type: integer
        source: computed
        description: "Refund amount from the refund_amount calculation, depending on reason and case progress."
        default: 0
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: "Restocking fee withheld on PATIENT_CANCEL refunds; 0 for ELIGIBILITY_DECLINE."
        default: 0

# ─────────────────────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ─────────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: TreatmentCase
    initial_state: INTAKE_PENDING
    terminal_states: [REFUNDED, COMPLETED]
    transitions:
      - from: INTAKE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /cases/{id}/submit-for-review"
        actor: Patient
        preconditions:
          - "case has >=1 IntakeRecord whose channel == case.intake_channel and quality_score >= MIN_USABLE_QUALITY"
          - "case.status == INTAKE_PENDING"
        side_effects:
          - "set case.assigned_clinician_id via clinician_assignment selector (§1.3)"
          - "if no eligible clinician exists, reject with ERR_NO_ELIGIBLE_CLINICIAN and leave case INTAKE_PENDING"
        note: "Assignment selector filters clinicians by license_state_codes containing patient.state_code."
      - from: UNDER_REVIEW
        to: PLAN_APPROVED
        trigger: "POST /plans/{id}/approve"
        actor: Clinician
        preconditions:
          - "the plan's case.status == UNDER_REVIEW"
          - "plan.status == SUBMITTED"
          - "acting clinician.id == case.assigned_clinician_id"
        side_effects:
          - "compute case.total_contracted_cents via case_price (§1.3)"
          - "generate plan.proposed_step_count AlignerStep rows (PLANNED, step_index 1..N), set case.planned_step_count"
          - "compute each AlignerStep.scheduled_ship_at from approval time + (step_index-1)*weeks_per_step weeks"
          - "set plan.status = APPROVED"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /plans/{id}/decline-eligibility"
        actor: Clinician
        preconditions:
          - "plan.status == SUBMITTED"
          - "acting clinician.id == case.assigned_clinician_id"
        side_effects:
          - "set plan.status = ELIGIBILITY_DECLINED"
          - "auto-open a RefundRequest (reason=ELIGIBILITY_DECLINE) — cascade depth 1"
        note: "Eligibility decline is terminal-ish; a refund cascade follows."
      - from: PLAN_APPROVED
        to: ACTIVE
        trigger: "POST /cases/{id}/activate"
        actor: ManufacturingOps
        preconditions:
          - "case.status == PLAN_APPROVED"
          - "case has a FinancingPlan in billing_state == ACTIVE OR case.amount_collected_cents >= case.total_contracted_cents"
        side_effects:
          - "move AlignerStep step_index 1 from PLANNED -> IN_PRODUCTION"
        note: "Activation requires the money side to be settled (financing active or paid in full)."
      - from: ACTIVE
        to: REFINEMENT
        trigger: "POST /refinements/{id}/grant"
        actor: Clinician
        preconditions:
          - "case.status == ACTIVE"
          - "refinement.status == REQUESTED"
          - "the triggering ProgressCheckin.tracking_assessment == OFF_TRACK"
        side_effects:
          - "set refinement.status = GRANTED; increment case.refinement_count"
          - "set refinement.is_billable per refinement_fee rule (§1.3)"
          - "generate additional_step_count new AlignerStep rows (PLANNED) with supersedes_step_id set to the matching original step; bump case.planned_step_count"
          - "if refinement.is_billable, append a billable line to the case ledger (raises total_contracted_cents) — cascade depth 1"
      - from: REFINEMENT
        to: ACTIVE
        trigger: "POST /cases/{id}/resume"
        actor: ManufacturingOps
        preconditions:
          - "case.status == REFINEMENT"
          - "every refinement-generated AlignerStep for this case is in {PLANNED, IN_PRODUCTION, MANUFACTURED, SHIPPED}"
        side_effects:
          - "move the lowest-step_index PLANNED refinement step to IN_PRODUCTION"
        note: "Cyclic: case returns to ACTIVE; may loop through REFINEMENT again."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /cases/{id}/complete"
        actor: Clinician
        preconditions:
          - "case.status == ACTIVE"
          - "every non-VOID AlignerStep for the case is SHIPPED"
          - "the latest ProgressCheckin.tracking_assessment == ON_TRACK"
        side_effects:
          - "set case.status = COMPLETED"
      - from: PLAN_APPROVED
        to: REFUNDED
        trigger: "POST /refunds/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "case.status IN {DECLINED, PLAN_APPROVED, ACTIVE}"
          - "refund.status == APPROVED"
        side_effects:
          - "set case.refund_issued_cents = refund.computed_refund_cents; set case.status = REFUNDED"
          - "cancel any non-DELIVERED Shipment for the case's steps; void all PLANNED/IN_PRODUCTION AlignerStep rows"
          - "if a FinancingPlan exists, set its billing_state = CANCELLED and mark all SCHEDULED Installments WAIVED — cascade depth: settle -> case REFUNDED -> financing CANCELLED -> installments WAIVED"
      - from: DECLINED
        to: REFUNDED
        trigger: "POST /refunds/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "case.status == DECLINED"
          - "refund.status == APPROVED"
        side_effects:
          - "set case.refund_issued_cents = refund.computed_refund_cents; set case.status = REFUNDED"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /refunds/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "case.status == ACTIVE"
          - "refund.status == APPROVED"
        side_effects:
          - "set case.refund_issued_cents = refund.computed_refund_cents; set case.status = REFUNDED"
          - "cancel any non-DELIVERED Shipment for the case's steps; void all PLANNED/IN_PRODUCTION AlignerStep rows"
          - "if a FinancingPlan exists, set its billing_state = CANCELLED and mark all SCHEDULED Installments WAIVED"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, ELIGIBILITY_DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plans/{id}/submit"
        actor: Clinician
        preconditions:
          - "plan.status == DRAFT"
          - "the plan's case.status == UNDER_REVIEW"
          - "acting clinician.id == case.assigned_clinician_id"
        side_effects:
          - "set plan.status = SUBMITTED"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /plans/{id}/request-changes"
        actor: Clinician
        preconditions:
          - "plan.status == SUBMITTED"
          - "acting clinician.id == case.assigned_clinician_id"
        side_effects:
          - "set plan.status = CHANGES_REQUESTED"
        note: "Cyclic review loop."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /plans/{id}/resubmit"
        actor: Clinician
        preconditions:
          - "plan.status == CHANGES_REQUESTED"
          - "acting clinician.id == case.assigned_clinician_id"
        side_effects:
          - "increment plan.revision by 1; set plan.status = SUBMITTED"
        note: "Cycle back to SUBMITTED — revision counter advances each loop."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plans/{id}/approve (see TreatmentCase UNDER_REVIEW->PLAN_APPROVED)"
        actor: Clinician
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "set plan.status = APPROVED (case transition fires the manufacturing cascade)"
      - from: SUBMITTED
        to: ELIGIBILITY_DECLINED
        trigger: "POST /plans/{id}/decline-eligibility"
        actor: Clinician
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "set plan.status = ELIGIBILITY_DECLINED (case goes DECLINED, refund cascade fires)"

  - entity: AlignerStep
    initial_state: PLANNED
    terminal_states: [SHIPPED, VOID]
    transitions:
      - from: PLANNED
        to: IN_PRODUCTION
        trigger: "POST /aligner-steps/{id}/start-production"
        actor: ManufacturingOps
        preconditions:
          - "step.status == PLANNED"
          - "case.status IN {ACTIVE, REFINEMENT}"
          - "the immediately-prior step_index step (if any) is SHIPPED"
        side_effects:
          - "set step.status = IN_PRODUCTION"
        note: "Steps manufacture strictly in order."
      - from: IN_PRODUCTION
        to: MANUFACTURED
        trigger: "POST /aligner-steps/{id}/complete-production"
        actor: ManufacturingOps
        preconditions:
          - "step.status == IN_PRODUCTION"
        side_effects:
          - "set step.status = MANUFACTURED"
      - from: MANUFACTURED
        to: SHIPPED
        trigger: "POST /shipments (booking a Shipment for this step then it dispatches)"
        actor: ManufacturingOps
        preconditions:
          - "step.status == MANUFACTURED"
          - "a Shipment for this step has been booked (status BOOKED)"
        side_effects:
          - "set step.status = SHIPPED; set the next PLANNED step (if any) eligible to start"
      - from: PLANNED
        to: VOID
        trigger: "system: refund settle / plan supersede"
        actor: system
        preconditions:
          - "step.status IN {PLANNED, IN_PRODUCTION}"
        side_effects:
          - "set step.status = VOID; decrement case.planned_step_count"

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/dispatch"
        actor: ManufacturingOps
        preconditions:
          - "shipment.status == BOOKED"
          - "the referenced AlignerStep.status == MANUFACTURED"
        side_effects:
          - "set shipment.status = IN_TRANSIT; move the AlignerStep to SHIPPED (cross-aggregate)"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/mark-delivered"
        actor: ManufacturingOps
        preconditions:
          - "shipment.status == IN_TRANSIT"
        side_effects:
          - "set shipment.status = DELIVERED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel OR system: refund settle"
        actor: ManufacturingOps
        preconditions:
          - "shipment.status IN {BOOKED, IN_TRANSIT}"
        side_effects:
          - "set shipment.status = CANCELLED; if the AlignerStep was SHIPPED solely by this shipment, revert it to MANUFACTURED"

  - entity: FinancingPlan
    initial_state: PENDING_ACTIVATION
    terminal_states: [PAID_OFF, CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /financing-plans/{id}/activate"
        actor: BillingAdmin
        preconditions:
          - "billing_state == PENDING_ACTIVATION"
          - "the plan's case.status == PLAN_APPROVED"
          - "down_payment_cents <= case.total_contracted_cents"
        side_effects:
          - "set financed_principal_cents = case.total_contracted_cents - down_payment_cents"
          - "generate term_months Installment rows via amortization (§1.3); set outstanding_principal_cents = financed_principal_cents"
          - "post the down payment: case.amount_collected_cents += down_payment_cents"
          - "set billing_state = ACTIVE"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system: last installment posted"
        actor: system
        preconditions:
          - "billing_state == ACTIVE"
          - "outstanding_principal_cents == 0"
        side_effects:
          - "set billing_state = PAID_OFF; set delinquency_state = CURRENT"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: refund settle cascade"
        actor: system
        preconditions:
          - "billing_state == ACTIVE"
        side_effects:
          - "set billing_state = CANCELLED; mark all SCHEDULED/LATE Installments WAIVED"
    note: "delinquency_state is a PARALLEL dimension evolving independently of billing_state (see transitions below)."

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [POSTED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: POSTED
        trigger: "POST /financing-plans/{id}/installments/{seq}/post-payment"
        actor: BillingAdmin
        preconditions:
          - "installment.status IN {SCHEDULED, LATE}"
          - "the plan.billing_state == ACTIVE"
          - "all installments with a lower sequence_no are POSTED or WAIVED"
        side_effects:
          - "set installment.status = POSTED"
          - "case.amount_collected_cents += amount_cents; plan.outstanding_principal_cents -= principal_portion_cents"
          - "if plan.outstanding_principal_cents == 0, bubble up FinancingPlan to PAID_OFF and reset delinquency_state to CURRENT"
          - "recompute plan.delinquency_state via delinquency calculation (§1.3) — cascade: post -> outstanding recompute -> delinquency recompute"
      - from: SCHEDULED
        to: LATE
        trigger: "POST /financing-plans/{id}/run-delinquency-sweep"
        actor: BillingAdmin
        preconditions:
          - "installment.status == SCHEDULED"
          - "current logical clock >= installment.due_at + GRACE_DAYS (= 5) days"
        side_effects:
          - "set installment.status = LATE; recompute plan.delinquency_state via delinquency calc (§1.3)"
      - from: SCHEDULED
        to: WAIVED
        trigger: "system: financing cancel cascade (refund)"
        actor: system
        preconditions:
          - "installment.status IN {SCHEDULED, LATE}"
        side_effects:
          - "set installment.status = WAIVED"

  - entity: RefundRequest
    initial_state: OPEN
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /refunds/{id}/approve"
        actor: BillingAdmin
        preconditions:
          - "refund.status == OPEN"
          - "case.status IN {DECLINED, PLAN_APPROVED, ACTIVE}"
        side_effects:
          - "compute refund.computed_refund_cents and refund.restocking_fee_cents via refund_amount (§1.3)"
          - "set refund.status = APPROVED"
      - from: OPEN
        to: REJECTED
        trigger: "POST /refunds/{id}/reject"
        actor: BillingAdmin
        preconditions:
          - "refund.status == OPEN"
        side_effects:
          - "set refund.status = REJECTED"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /refunds/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "refund.status == APPROVED"
          - "case.status IN {DECLINED, PLAN_APPROVED, ACTIVE}"
        side_effects:
          - "set refund.status = SETTLED; drive case -> REFUNDED with its full cascade (see TreatmentCase)"

  - entity: RetainerSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /retainers/{id}/pause"
        actor: Patient
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "set status = PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /retainers/{id}/resume"
        actor: Patient
        preconditions:
          - "status == PAUSED"
        side_effects:
          - "set status = ACTIVE; advance next_ship_at by one cadence interval from the current clock"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /retainers/{id}/cancel"
        actor: Patient
        preconditions:
          - "status IN {ACTIVE, PAUSED}"
        side_effects:
          - "set status = CANCELLED"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - rule_id: refund-open-stale-case
    parent_entity: TreatmentCase
    write_endpoint: "POST /refunds"
    occ_field: "expected_case_version"
    description: |
      Opening a RefundRequest against a TreatmentCase whose version has advanced
      since the client last observed it is rejected as stale. The canonical case:
      a refinement grant has just raised the case's total_contracted_cents (and
      bumped case.version), so a refund opened from the pre-refinement view would
      compute against an outdated contracted amount. The new request legitimately
      supersedes the client's stale view, so it is rejected on the version check.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: financing-activate-stale-plan
    parent_entity: FinancingPlan
    write_endpoint: "POST /financing-plans/{id}/activate"
    occ_field: "expected_financing_plan_version"
    description: |
      Activating a FinancingPlan whose version has advanced since the client last
      read it is rejected as stale. This captures the case where the plan's terms
      were amended (a fresh down_payment or apr write bumped financing_plan.version)
      after the activating client loaded it; activating against the stale version
      would amortize the wrong principal, so it is rejected on the version check.
    error_id: ERR_STALE_FINANCING_VERSION
    http_status: 412

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: case_price
    trigger: "TreatmentCase UNDER_REVIEW -> PLAN_APPROVED (plan approve)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs, nested branches + tiered discount selection.
      base = case.list_price_cents
      # 1) channel adjustment
      if case.intake_channel == IN_OFFICE_SCAN:
          base = base + IN_OFFICE_SCAN_SURCHARGE_CENTS
      # 2) complexity tier from proposed_step_count (tier boundaries are inclusive lower)
      #    LIGHT:  step_count <= 14
      #    MODERATE: 15 <= step_count <= 28
      #    COMPLEX: step_count >= 29
      tier_mult = LIGHT_MULT if proposed_step_count <= 14
                  else MODERATE_MULT if proposed_step_count <= 28
                  else COMPLEX_MULT
      tiered = round_half_up(base * tier_mult)          # round AFTER multiply, before discount
      # 3) promo discount keyed on the post-tier total (circular-looking: discount % depends
      #    on the tiered total band, which itself fed from base). Evaluation order PINNED:
      #    compute tiered first, THEN select discount band from tiered, THEN subtract.
      if discount_code == "WELCOME15": disc = round_half_up(tiered * 0.15)
      elif discount_code == "FLAT200" : disc = 20000      # 20000 cents flat
      else: disc = 0
      total_contracted_cents = max(tiered - disc, 0)
    input_set: "Single case + its approved plan; channel from case, step_count/discount from plan."
    constants:
      IN_OFFICE_SCAN_SURCHARGE_CENTS: 25000
      LIGHT_MULT: 0.80
      MODERATE_MULT: 1.00
      COMPLEX_MULT: 1.35
    precision: "integer cents, round_half_up at each pinned step; multiply-then-round, then discount"
    variants: []

  - name: refund_amount
    trigger: "RefundRequest OPEN -> APPROVED (refund approve)"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT calc on the RefundRequest/TreatmentCase domain (distinct from
      # financing amortization, which is on FinancingPlan).
      shipped = count(AlignerStep where case_id==case.id AND status==SHIPPED AND supersedes_step_id is null)
      total_first_run = count(AlignerStep where case_id==case.id AND status!=VOID AND supersedes_step_id is null)
      if reason == ELIGIBILITY_DECLINE:
          # full refund of everything collected; no fee
          computed_refund_cents = case.amount_collected_cents
          restocking_fee_cents = 0
      elif reason == PATIENT_CANCEL:
          # pro-rata: keep value of shipped steps, withhold restocking fee
          used_fraction = shipped / total_first_run   # total_first_run guaranteed >=1 post-approval
          consumed = round_half_up(case.total_contracted_cents * used_fraction)
          restocking_fee_cents = RESTOCK_FEE_CENTS
          computed_refund_cents = max(case.amount_collected_cents - consumed - restocking_fee_cents, 0)
      else: # GOODWILL
          computed_refund_cents = case.amount_collected_cents
          restocking_fee_cents = 0
    input_set: "Case ledger + first-run AlignerStep shipment status (refinement steps excluded)."
    constants:
      RESTOCK_FEE_CENTS: 7500
    precision: "integer cents, round_half_up"
    variants:
      - name: forward_looking_eligibility
        when: "reason == ELIGIBILITY_DECLINE (case never became deliverable)"
        difference: "Returns the entire amount_collected with zero fee — ignores how many steps shipped."
      - name: chronological_patient_cancel
        when: "reason == PATIENT_CANCEL after some steps shipped"
        difference: "Withholds pro-rata consumed value of shipped first-run steps plus a flat restocking fee, so identical amount_collected yields a strictly smaller refund than the eligibility variant."

  - name: amortization
    trigger: "FinancingPlan PENDING_ACTIVATION -> ACTIVE (financing activate)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): nested rounding where ORDER matters. Pinned order:
      # compute each installment to cents (round_half_up PER installment), then make the
      # FINAL installment absorb the residual so sum(installments) == financed_principal + total_interest.
      P = financed_principal_cents            # = total_contracted_cents - down_payment_cents
      n = term_months
      monthly_rate = apr_bps / 10000 / 12     # decimal monthly rate
      if monthly_rate == 0:
          base_payment = round_half_up(P / n)            # per-installment, rounded
      else:
          # standard amortized payment, rounded per installment
          factor = (monthly_rate * (1+monthly_rate)**n) / ((1+monthly_rate)**n - 1)
          base_payment = round_half_up(P * factor)
      # Schedule: installments 1..n-1 each = base_payment; principal_portion via declining balance.
      # PINNED: per-installment interest = round_half_up(running_balance * monthly_rate);
      #         principal_portion = base_payment - interest; running_balance -= principal_portion.
      # Final installment amount = financed_principal + sum_interest - sum(first n-1 principal+interest already)
      # so the schedule's principal portions sum EXACTLY to P (residual lands on installment n).
      total_scheduled = sum(amount_cents for all n installments)
    input_set: "Single FinancingPlan at activation; principal from case ledger."
    constants: {}
    precision: "integer cents, round_half_up PER installment; final installment absorbs residual"
    variants:
      - name: per_installment_rounding
        when: "default schedule generation"
        difference: "Rounds each of the first n-1 installments to cents independently, then the final installment carries the residual — vs a naive 'sum then round' that would mis-total by a few cents."
      - name: zero_apr_straight_line
        when: "apr_bps == 0"
        difference: "Straight-line principal/n with the residual on the final installment; no interest portion."

  - name: clinician_assignment
    trigger: "TreatmentCase INTAKE_PENDING -> UNDER_REVIEW (submit-for-review)"
    algorithm: weighted_scoring
    formula: |
      # Selector policy. Candidate set: Clinician where active==true AND
      # patient.state_code IN license_state_codes.
      # Rank ASC by current open-case load (count of TreatmentCase where
      #   assigned_clinician_id==clinician.id AND status IN {UNDER_REVIEW, PLAN_APPROVED, ACTIVE, REFINEMENT}),
      # so the least-loaded eligible clinician is chosen.
      # Tie-break: lowest clinician.created_at (earliest-onboarded), then — still tied —
      #   lowest clinician.created_at is unique, so no id fallback needed.
      # Empty candidate set: ERR_NO_ELIGIBLE_CLINICIAN.
      chosen = argmin(open_load, tie_break=created_at ASC) over candidates
    input_set: "All Clinician rows; load counted over non-terminal TreatmentCase rows."
    constants: {}
    precision: "integer counts; created_at ASC tie-break (never id)"
    variants: []

  - name: delinquency
    trigger: "Installment SCHEDULED->LATE (sweep) and SCHEDULED->POSTED (payment)"
    algorithm: threshold
    formula: |
      # DUAL-VARIANT calc on the FinancingPlan domain (distinct entity from refund_amount).
      late_count = count(Installment where financing_plan_id==plan.id AND status==LATE)
      # Threshold boundaries (PINNED >= semantics):
      #   late_count == 0            -> CURRENT
      #   1 <= late_count <= 2       -> DELINQUENT
      #   late_count >= 3            -> DEFAULTED
      if late_count >= DEFAULT_THRESHOLD: delinquency_state = DEFAULTED
      elif late_count >= 1: delinquency_state = DELINQUENT
      else: delinquency_state = CURRENT
    input_set: "Installment rows of one plan; counts LATE only (POSTED/WAIVED excluded)."
    constants:
      DEFAULT_THRESHOLD: 3
    precision: "integer count; >= boundary"
    variants:
      - name: instantaneous_on_post
        when: "evaluated after a payment posts (a LATE installment cleared)"
        difference: "Recount of remaining LATE installments may move the plan back from DELINQUENT to CURRENT (recovery)."
      - name: cumulative_on_sweep
        when: "evaluated during a delinquency sweep"
        difference: "Can only add LATE installments, so the state monotonically worsens toward DEFAULTED until a payment posts."

  - name: refinement_fee
    trigger: "TreatmentCase ACTIVE -> REFINEMENT (refinement grant)"
    algorithm: threshold
    formula: |
      # >= boundary on a DIFFERENT metric/endpoint than delinquency (refinement_count
      # vs late installment count). INCLUDED_REFINEMENTS are free; beyond that, billable.
      if case.refinement_count >= INCLUDED_REFINEMENTS:
          is_billable = true
          fee_cents = REFINEMENT_FEE_CENTS
          total_contracted_cents += fee_cents   # raises the contracted amount
      else:
          is_billable = false
          fee_cents = 0
      # Note: case.refinement_count is read BEFORE this grant increments it.
    input_set: "Single case; refinement_count read pre-increment."
    constants:
      INCLUDED_REFINEMENTS: 1
      REFINEMENT_FEE_CENTS: 30000
    precision: "integer cents; >= boundary (the 2nd granted refinement is the first billable one)"
    variants: []

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (Ordered by Priority)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body foreign keys (case_id, financing_plan_id, step_id, triggering_checkin_id, patient_id, author_clinician_id) reference existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints carrying FKs"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined (§1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded creates (§1.2.1)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /refunds, POST /financing-plans/{id}/activate"
  - priority: 7
    category: business_referential
    check: "IntakeRecord.channel must equal parent TreatmentCase.intake_channel"
    error_id: ERR_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /cases/{id}/intake-records"
  - priority: 8
    category: business_referential
    check: "kit_tracking_number required when channel=IMPRESSION_KIT; scan_clinic_state_code required when channel=IN_OFFICE_SCAN"
    error_id: ERR_INTAKE_FIELDS_INCOMPLETE
    http_status: 422
    applies_to: "POST /cases/{id}/intake-records"
  - priority: 9
    category: business_safety
    check: "Submitting for review requires at least one IntakeRecord with quality_score >= MIN_USABLE_QUALITY (= 0.60) (clinical usability gate)"
    error_id: ERR_INTAKE_NOT_USABLE
    http_status: 422
    applies_to: "POST /cases/{id}/submit-for-review"
  - priority: 10
    category: business_safety
    check: "Assigned clinician must be licensed in the patient's state_code (license_state_codes contains patient.state_code)"
    error_id: ERR_CLINICIAN_NOT_LICENSED
    http_status: 422
    applies_to: "POST /plans/{id}/submit, POST /plans/{id}/approve, POST /plans/{id}/decline-eligibility"
  - priority: 11
    category: business_safety
    check: "Minor patients (is_minor_at_intake) cannot reach PLAN_APPROVED without a recorded guardian_consent=true on the case"
    error_id: ERR_GUARDIAN_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /plans/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "Refinement grant requires the triggering ProgressCheckin to belong to this case and have tracking_assessment == OFF_TRACK"
    error_id: ERR_REFINEMENT_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /refinements/{id}/grant"
  - priority: 13
    category: business_constraint
    check: "AlignerStep production order: a step may start production only if the immediately-prior step_index step is SHIPPED"
    error_id: ERR_STEP_ORDER_VIOLATION
    http_status: 422
    applies_to: "POST /aligner-steps/{id}/start-production"
  - priority: 14
    category: business_temporal
    check: "GROUND shipment windows for the SAME step must not overlap as half-open [start,end) intervals (touching endpoints allowed)"
    error_id: ERR_GROUND_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /shipments (carrier_code=GROUND)"
  - priority: 15
    category: business_temporal
    check: "EXPRESS shipment windows for the SAME step must not overlap as closed [start,end] intervals (touching endpoints collide) AND must keep a >= EXPRESS_BUFFER_HOURS (= 24h) gap from any other EXPRESS window on the step; a new EXPRESS window whose start is < 24h after a prior EXPRESS window's end is rejected"
    error_id: ERR_EXPRESS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /shipments (carrier_code=EXPRESS)"
  - priority: 16
    category: business_temporal
    check: "Shipment window_start must be strictly before window_end"
    error_id: ERR_WINDOW_INVERTED
    http_status: 422
    applies_to: "POST /shipments"
  - priority: 17
    category: business_fiscal
    check: "FinancingPlan down_payment_cents must not exceed case.total_contracted_cents"
    error_id: ERR_DOWN_PAYMENT_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /financing-plans/{id}/activate"
  - priority: 18
    category: business_fiscal
    check: "Posting an installment payment is rejected if a lower-sequence installment is still SCHEDULED or LATE (in-order posting)"
    error_id: ERR_INSTALLMENT_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /financing-plans/{id}/installments/{seq}/post-payment"
  - priority: 19
    category: business_fiscal
    check: "Case activation requires the money side settled: a FinancingPlan billing_state==ACTIVE OR amount_collected_cents >= total_contracted_cents"
    error_id: ERR_PAYMENT_NOT_SETTLED
    http_status: 422
    applies_to: "POST /cases/{id}/activate"
  - priority: 20
    category: business_constraint
    check: "RetainerSubscription may only be created for a case in COMPLETED status"
    error_id: ERR_CASE_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /retainers"
  - priority: 21
    category: business_constraint
    check: "Request body field values conform to declared types/enums and required fields are present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # ---- Patients ----
  - method: POST
    path: "/patients"
    description: "Register a patient."
    roles: [Patient, BillingAdmin]
    code: 201
    input: [email, full_name, state_code, date_of_birth]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Clinicians ----
  - method: POST
    path: "/clinicians"
    description: "Onboard a clinician."
    roles: [BillingAdmin]
    code: 201
    input: [full_name, license_state_codes, role_type, "active?"]
    output: Clinician
    side_effects: []
  - method: GET
    path: "/clinicians/{id}"
    description: "Fetch a clinician."
    roles: [Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  # ---- Cases ----
  - method: POST
    path: "/cases"
    description: "Create a treatment case for a patient."
    roles: [Patient, BillingAdmin]
    code: 201
    input: [patient_id, intake_channel, list_price_cents]
    output: TreatmentCase
    side_effects: ["case.status = INTAKE_PENDING"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case with computed ledger fields."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: TreatmentCase
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List/filter cases."
    roles: [Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: ["patient_id?", "assigned_clinician_id?", "status?", "limit?", "offset?"]
    output: TreatmentCase[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/intake-records"
    description: "Upload an intake record (impression kit or in-office scan)."
    roles: [Patient, ManufacturingOps]
    code: 201
    input: [channel, quality_score, "kit_tracking_number?", "scan_clinic_state_code?"]
    output: IntakeRecord
    side_effects: ["set IntakeRecord.captured_at = current logical clock"]
  - method: GET
    path: "/cases/{id}/intake-records"
    description: "List intake records for a case (FK reverse-reachability for IntakeRecord.case_id)."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: IntakeRecord[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/guardian-consent"
    description: "Record guardian consent for a minor patient's case."
    roles: [Patient, BillingAdmin]
    code: 200
    input: [guardian_consent]
    output: TreatmentCase
    side_effects: ["set case.guardian_consent flag (stored on case)"]
  - method: POST
    path: "/cases/{id}/submit-for-review"
    description: "Submit a case for clinical review; assigns a clinician."
    roles: [Patient]
    code: 200
    input: []
    output: TreatmentCase
    side_effects: ["case INTAKE_PENDING -> UNDER_REVIEW", "set assigned_clinician_id via clinician_assignment"]
  - method: POST
    path: "/cases/{id}/activate"
    description: "Activate manufacturing once the money side is settled."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: TreatmentCase
    side_effects: ["case PLAN_APPROVED -> ACTIVE", "step 1 PLANNED -> IN_PRODUCTION"]
  - method: POST
    path: "/cases/{id}/resume"
    description: "Resume an in-refinement case back to active manufacturing."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: TreatmentCase
    side_effects: ["case REFINEMENT -> ACTIVE", "lowest PLANNED refinement step -> IN_PRODUCTION"]
  - method: POST
    path: "/cases/{id}/complete"
    description: "Mark a case complete when all steps shipped and tracking on-track."
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentCase
    side_effects: ["case ACTIVE -> COMPLETED"]
  - method: GET
    path: "/cases/{id}/aligner-steps"
    description: "List aligner steps for a case (FK reverse-reachability for AlignerStep.case_id and self-referential supersedes_step_id)."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: AlignerStep[]
    side_effects: []
  - method: GET
    path: "/cases/{id}/checkins"
    description: "List progress check-ins for a case (FK reverse-reachability for ProgressCheckin.case_id)."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: ProgressCheckin[]
    side_effects: []
  - method: GET
    path: "/cases/{id}/refinements"
    description: "List refinement requests for a case (FK reverse-reachability for RefinementRequest.case_id)."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: RefinementRequest[]
    side_effects: []

  # ---- Plans ----
  - method: POST
    path: "/plans"
    description: "Author a draft treatment plan for an under-review case."
    roles: [Clinician]
    code: 201
    input: [case_id, author_clinician_id, proposed_step_count, weeks_per_step, "discount_code?"]
    output: TreatmentPlan
    side_effects: ["plan.status = DRAFT, revision = 1"]
  - method: GET
    path: "/plans/{id}"
    description: "Fetch a plan."
    roles: [Clinician, BillingAdmin, Patient]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans, filterable by case (FK reverse-reachability for TreatmentPlan.case_id and author_clinician_id)."
    roles: [Clinician, BillingAdmin, Patient]
    code: 200
    input: ["case_id?", "author_clinician_id?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []
  - method: POST
    path: "/plans/{id}/submit"
    description: "Submit a draft plan for the assigned clinician's review."
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["plan DRAFT -> SUBMITTED"]
  - method: POST
    path: "/plans/{id}/request-changes"
    description: "Send a submitted plan back for changes (review loop)."
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["plan SUBMITTED -> CHANGES_REQUESTED"]
  - method: POST
    path: "/plans/{id}/resubmit"
    description: "Resubmit a changed plan; advances revision."
    roles: [Clinician]
    code: 200
    input: ["proposed_step_count?", "weeks_per_step?", "discount_code?"]
    output: TreatmentPlan
    side_effects: ["plan CHANGES_REQUESTED -> SUBMITTED", "increment revision"]
  - method: POST
    path: "/plans/{id}/approve"
    description: "Approve a submitted plan, pricing the case and generating aligner steps."
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["case UNDER_REVIEW -> PLAN_APPROVED", "compute total_contracted_cents", "generate AlignerStep rows", "compute scheduled_ship_at"]
  - method: POST
    path: "/plans/{id}/decline-eligibility"
    description: "Decline a case on clinical eligibility grounds; opens a refund."
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["case UNDER_REVIEW -> DECLINED", "auto-open RefundRequest (ELIGIBILITY_DECLINE)"]

  # ---- Aligner steps ----
  - method: GET
    path: "/aligner-steps/{id}"
    description: "Fetch an aligner step."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: AlignerStep
    side_effects: []
  - method: GET
    path: "/aligner-steps"
    description: "List aligner steps, filterable by case or by the step they supersede (FK reverse-reachability for self-referential AlignerStep.supersedes_step_id)."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: ["case_id?", "supersedes_step_id?", "status?", "limit?", "offset?"]
    output: AlignerStep[]
    side_effects: []
  - method: POST
    path: "/aligner-steps/{id}/start-production"
    description: "Begin manufacturing a planned step (strict in-order)."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: AlignerStep
    side_effects: ["step PLANNED -> IN_PRODUCTION"]
  - method: POST
    path: "/aligner-steps/{id}/complete-production"
    description: "Finish manufacturing a step."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: AlignerStep
    side_effects: ["step IN_PRODUCTION -> MANUFACTURED"]

  # ---- Shipments ----
  - method: POST
    path: "/shipments"
    description: "Book a shipment for a manufactured step within a carrier window."
    roles: [ManufacturingOps]
    code: 201
    input: [step_id, carrier_code, window_start, window_end]
    output: Shipment
    side_effects: ["shipment.status = BOOKED", "overlap checks per §1.4"]
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment."
    roles: [Patient, ManufacturingOps, BillingAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List shipments, filterable by step (FK reverse-reachability for Shipment.step_id)."
    roles: [Patient, ManufacturingOps, BillingAdmin]
    code: 200
    input: ["step_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "Dispatch a booked shipment; ships the step."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["shipment BOOKED -> IN_TRANSIT", "AlignerStep MANUFACTURED -> SHIPPED"]
  - method: POST
    path: "/shipments/{id}/mark-delivered"
    description: "Mark an in-transit shipment delivered."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["shipment IN_TRANSIT -> DELIVERED"]
  - method: POST
    path: "/shipments/{id}/cancel"
    description: "Cancel a shipment; reverts the step if it was shipped solely by this shipment."
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["shipment -> CANCELLED", "AlignerStep SHIPPED -> MANUFACTURED if applicable"]

  # ---- Progress check-ins ----
  - method: POST
    path: "/cases/{id}/checkins"
    description: "Submit a progress check-in with a photo quality score."
    roles: [Patient]
    code: 201
    input: [reported_step_index, photo_quality_score]
    output: ProgressCheckin
    side_effects: ["ProgressCheckin created with tracking_assessment = PENDING"]
  - method: POST
    path: "/checkins/{id}/assess"
    description: "Clinician sets the tracking assessment on a check-in."
    roles: [Clinician]
    code: 200
    input: [tracking_assessment]
    output: ProgressCheckin
    side_effects: ["set tracking_assessment to ON_TRACK or OFF_TRACK"]
  - method: GET
    path: "/checkins/{id}"
    description: "Fetch a check-in."
    roles: [Patient, Clinician, BillingAdmin, ManufacturingOps]
    code: 200
    input: []
    output: ProgressCheckin
    side_effects: []

  # ---- Refinements ----
  - method: POST
    path: "/refinements"
    description: "Request a mid-course correction citing an off-track check-in."
    roles: [Patient]
    code: 201
    input: [case_id, triggering_checkin_id, additional_step_count]
    output: RefinementRequest
    side_effects: ["RefinementRequest.status = REQUESTED"]
  - method: GET
    path: "/refinements/{id}"
    description: "Fetch a refinement request."
    roles: [Patient, Clinician, BillingAdmin]
    code: 200
    input: []
    output: RefinementRequest
    side_effects: []
  - method: GET
    path: "/refinements"
    description: "List refinement requests, filterable by case or triggering check-in (FK reverse-reachability for RefinementRequest.triggering_checkin_id)."
    roles: [Patient, Clinician, BillingAdmin]
    code: 200
    input: ["case_id?", "triggering_checkin_id?", "status?", "limit?", "offset?"]
    output: RefinementRequest[]
    side_effects: []
  - method: POST
    path: "/refinements/{id}/grant"
    description: "Grant a refinement; generates correction steps and may add a billable fee."
    roles: [Clinician]
    code: 200
    input: []
    output: RefinementRequest
    side_effects: ["case ACTIVE -> REFINEMENT", "increment refinement_count", "set is_billable", "generate refinement AlignerStep rows", "maybe raise total_contracted_cents"]
  - method: POST
    path: "/refinements/{id}/deny"
    description: "Deny a refinement request."
    roles: [Clinician]
    code: 200
    input: []
    output: RefinementRequest
    side_effects: ["RefinementRequest REQUESTED -> DENIED"]

  # ---- Financing ----
  - method: POST
    path: "/financing-plans"
    description: "Create a monthly-pay financing plan for an approved case."
    roles: [Patient, BillingAdmin]
    code: 201
    input: [case_id, term_months, down_payment_cents, apr_bps]
    output: FinancingPlan
    side_effects: ["financing.billing_state = PENDING_ACTIVATION, delinquency_state = CURRENT"]
  - method: GET
    path: "/financing-plans/{id}"
    description: "Fetch a financing plan."
    roles: [Patient, BillingAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []
  - method: GET
    path: "/financing-plans"
    description: "List financing plans, filterable by case (FK reverse-reachability for FinancingPlan.case_id)."
    roles: [Patient, BillingAdmin]
    code: 200
    input: ["case_id?", "billing_state?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []
  - method: POST
    path: "/financing-plans/{id}/activate"
    description: "Activate a financing plan; amortizes principal into installments. Guarded by OCC on the plan version."
    roles: [BillingAdmin]
    code: 200
    input: [expected_financing_plan_version]
    output: FinancingPlan
    side_effects: ["financing PENDING_ACTIVATION -> ACTIVE", "generate Installment rows via amortization", "post down payment to case ledger", "increments FinancingPlan.version by 1"]
  - method: GET
    path: "/financing-plans/{id}/installments"
    description: "List installments for a plan (FK reverse-reachability for Installment.financing_plan_id)."
    roles: [Patient, BillingAdmin]
    code: 200
    input: []
    output: Installment[]
    side_effects: []
  - method: POST
    path: "/financing-plans/{id}/installments/{seq}/post-payment"
    description: "Post a monthly installment payment (in-order)."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Installment
    side_effects: ["installment SCHEDULED/LATE -> POSTED", "update ledger, outstanding principal, delinquency", "maybe PAID_OFF"]
  - method: POST
    path: "/financing-plans/{id}/run-delinquency-sweep"
    description: "Sweep overdue installments to LATE and recompute delinquency."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["overdue SCHEDULED installments -> LATE", "recompute delinquency_state"]

  # ---- Refunds ----
  - method: POST
    path: "/refunds"
    description: "Open a refund request against a case. Guarded by OCC on the case version."
    roles: [Patient, BillingAdmin]
    code: 201
    input: [case_id, reason, expected_case_version]
    output: RefundRequest
    side_effects: ["RefundRequest.status = OPEN", "increments TreatmentCase.version by 1"]
  - method: GET
    path: "/refunds/{id}"
    description: "Fetch a refund request."
    roles: [Patient, BillingAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: GET
    path: "/refunds"
    description: "List refunds, filterable by case (FK reverse-reachability for RefundRequest.case_id)."
    roles: [Patient, BillingAdmin]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: POST
    path: "/refunds/{id}/approve"
    description: "Approve a refund; computes refund and restocking amounts."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["refund OPEN -> APPROVED", "compute computed_refund_cents and restocking_fee_cents"]
  - method: POST
    path: "/refunds/{id}/reject"
    description: "Reject a refund request."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["refund OPEN -> REJECTED"]
  - method: POST
    path: "/refunds/{id}/settle"
    description: "Settle an approved refund; drives the case to REFUNDED with full cascade."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["refund APPROVED -> SETTLED", "case -> REFUNDED", "void steps, cancel shipments, cancel financing, waive installments"]

  # ---- Retainers ----
  - method: POST
    path: "/retainers"
    description: "Start a retainer subscription for a completed case."
    roles: [Patient, BillingAdmin]
    code: 201
    input: [case_id, cadence, per_shipment_fee_cents]
    output: RetainerSubscription
    side_effects: ["RetainerSubscription.status = ACTIVE", "set next_ship_at = current clock + cadence"]
  - method: GET
    path: "/retainers/{id}"
    description: "Fetch a retainer subscription."
    roles: [Patient, BillingAdmin]
    code: 200
    input: []
    output: RetainerSubscription
    side_effects: []
  - method: GET
    path: "/retainers"
    description: "List retainer subscriptions, filterable by case (FK reverse-reachability for RetainerSubscription.case_id)."
    roles: [Patient, BillingAdmin]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: RetainerSubscription[]
    side_effects: []
  - method: POST
    path: "/retainers/{id}/pause"
    description: "Pause a retainer subscription."
    roles: [Patient]
    code: 200
    input: []
    output: RetainerSubscription
    side_effects: ["retainer ACTIVE -> PAUSED"]
  - method: POST
    path: "/retainers/{id}/resume"
    description: "Resume a paused retainer subscription."
    roles: [Patient]
    code: 200
    input: []
    output: RetainerSubscription
    side_effects: ["retainer PAUSED -> ACTIVE", "advance next_ship_at by one cadence"]
  - method: POST
    path: "/retainers/{id}/cancel"
    description: "Cancel a retainer subscription."
    roles: [Patient]
    code: 200
    input: []
    output: RetainerSubscription
    side_effects: ["retainer -> CANCELLED"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an explicit UTC instant. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Used to drive due-date, delinquency-sweep, and shipment-window rules deterministically."
    roles: [BillingAdmin, ManufacturingOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "A body foreign key references a non-existent row."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the transition is defined."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match TreatmentCase.version on a guarded create."
  - id: ERR_STALE_FINANCING_VERSION
    http: 412
    condition: "expected_financing_plan_version does not match FinancingPlan.version on activate."
  - id: ERR_CHANNEL_MISMATCH
    http: 422
    condition: "IntakeRecord.channel differs from parent case.intake_channel."
  - id: ERR_INTAKE_FIELDS_INCOMPLETE
    http: 422
    condition: "Channel-specific intake field (kit_tracking_number / scan_clinic_state_code) missing."
  - id: ERR_INTAKE_NOT_USABLE
    http: 422
    condition: "No IntakeRecord with quality_score >= MIN_USABLE_QUALITY at submit-for-review."
  - id: ERR_NO_ELIGIBLE_CLINICIAN
    http: 422
    condition: "No active clinician licensed in the patient's state at submit-for-review."
  - id: ERR_CLINICIAN_NOT_LICENSED
    http: 422
    condition: "Acting/assigned clinician not licensed in the patient's state."
  - id: ERR_GUARDIAN_CONSENT_REQUIRED
    http: 422
    condition: "Minor patient case approved without recorded guardian consent."
  - id: ERR_REFINEMENT_NOT_JUSTIFIED
    http: 422
    condition: "Refinement grant without an OFF_TRACK triggering check-in on the case."
  - id: ERR_STEP_ORDER_VIOLATION
    http: 422
    condition: "Step started out of order (prior step_index not SHIPPED)."
  - id: ERR_GROUND_WINDOW_OVERLAP
    http: 409
    condition: "GROUND window overlaps another GROUND window for the same step ([start,end) half-open)."
  - id: ERR_EXPRESS_WINDOW_OVERLAP
    http: 409
    condition: "EXPRESS window overlaps/abuts another EXPRESS window for the same step or violates the buffer."
  - id: ERR_WINDOW_INVERTED
    http: 422
    condition: "Shipment window_start not strictly before window_end."
  - id: ERR_DOWN_PAYMENT_EXCEEDS_TOTAL
    http: 422
    condition: "down_payment_cents exceeds case.total_contracted_cents at financing activation."
  - id: ERR_INSTALLMENT_OUT_OF_ORDER
    http: 422
    condition: "Installment posted while a lower-sequence installment is still SCHEDULED/LATE."
  - id: ERR_PAYMENT_NOT_SETTLED
    http: 422
    condition: "Case activated without active financing or full payment."
  - id: ERR_CASE_NOT_COMPLETED
    http: 422
    condition: "Retainer created for a case not in COMPLETED status."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, bad enum, missing required field, or type mismatch."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific code."

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: Patient
    description: "The end customer; owns intake uploads, check-ins, refinement requests, refund initiation, financing creation, and retainer management on their own cases."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /cases/{id}/submit-for-review"
      - "POST /cases/{id}/checkins"
      - "POST /refinements"
      - "POST /retainers/{id}/pause"
      - "POST /retainers/{id}/resume"
      - "POST /retainers/{id}/cancel"
    shared_operations:
      - "POST /patients (also BillingAdmin)"
      - "POST /cases, POST /cases/{id}/guardian-consent (also BillingAdmin)"
      - "POST /financing-plans, POST /retainers, POST /refunds (also BillingAdmin)"
      - "GET reads on own patient/case/plan/financing/refund/retainer resources"
  - name: Clinician
    description: "Dentist/orthodontist; authors and reviews plans, assesses check-ins, grants/denies refinements, completes cases. Identity equals the acting Clinician row."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /plans, POST /plans/{id}/submit, POST /plans/{id}/request-changes, POST /plans/{id}/resubmit"
      - "POST /plans/{id}/approve, POST /plans/{id}/decline-eligibility"
      - "POST /checkins/{id}/assess"
      - "POST /refinements/{id}/grant, POST /refinements/{id}/deny"
      - "POST /cases/{id}/complete"
    shared_operations:
      - "GET reads on case/plan/checkin/aligner-step/clinician resources"
  - name: ManufacturingOps
    description: "Production/fulfillment operator; runs aligner manufacturing, shipment booking/dispatch, case activation/resume. Operational identity, not a persisted business entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/activate, POST /cases/{id}/resume"
      - "POST /aligner-steps/{id}/start-production, POST /aligner-steps/{id}/complete-production"
      - "POST /shipments, POST /shipments/{id}/dispatch, POST /shipments/{id}/mark-delivered, POST /shipments/{id}/cancel"
    shared_operations:
      - "POST /cases/{id}/intake-records (also Patient)"
      - "POST /_clock/set_current_utc (also BillingAdmin)"
      - "GET reads on case/step/shipment resources"
  - name: BillingAdmin
    description: "Finance/operations back-office; onboards clinicians, manages financing activation and installment posting, delinquency sweeps, and refund approval/settlement. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinicians"
      - "POST /financing-plans/{id}/activate, POST /financing-plans/{id}/installments/{seq}/post-payment, POST /financing-plans/{id}/run-delinquency-sweep"
      - "POST /refunds/{id}/approve, POST /refunds/{id}/reject, POST /refunds/{id}/settle"
    shared_operations:
      - "POST /patients, POST /cases, POST /financing-plans, POST /refunds, POST /retainers (also Patient)"
      - "POST /_clock/set_current_utc (also ManufacturingOps)"
      - "GET reads across resources"
