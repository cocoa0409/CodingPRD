            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-03", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 2, unit_price: 50.00 } ] }, as: SalesDesk, captures: { ord2: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord2}/confirm", payload: {}, as: SalesDesk }
            - { call: "GET /market/customers/${cust}", payload: {}, as: MarketAdmin, captures: { e4: "$.data.credit_exposure_cents" } }
          trigger:
            - { call: "POST /market/sales-orders/${ord2}/cancel", payload: {}, as: SalesDesk }
            - { call: "GET /market/customers/${cust}", payload: {}, as: MarketAdmin, captures: { e5: "$.data.credit_exposure_cents" } }
          assert:
            - "after confirm: exposure == 5000 (CONFIRMED order counts)"
            - "after deliver+invoice: exposure == 7500 (INVOICED order excluded; OPEN invoice balance 5000+2500 counts)"
            - "after paying 7350 within the discount window (discount 150): invoice PAID -> exposure == 0"
            - "after order2 (2 @ 50.00) confirm: exposure == 10000"
            - "after order2 cancel: exposure == 0 (CANCELLED excluded, reservation released)"

      - name: shipper_trust_exposure_drops_rejected_lots
        claim_type: input_set_filtering
        grounds: [calculations.shipper_trust_exposure, entities.Shipper.fields.trust_exposure_cents]
        distinguishing_aspect: "The trust-exposure status set is {ORDERED, RECEIVED, INSPECTED, DISPUTED, ACCEPTED}: two lots at 10000 payable each give 20000, and when one lot resolves REJECT_TO_SHIPPER (payable zeroed, status REJECTED) the shipper's exposure falls to exactly 10000 while the still-ORDERED sibling continues to count."
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; commodity + shipper + daily price band 8.00-12.00"
            - "Lot A: 10 @ 10.00 (stays ORDERED); Lot B: 10 @ 10.00 driven RECEIVED -> FAIL inspection CERTIFIED -> DISPUTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lotA: "$.data.id" } }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lotB: "$.data.id" } }
            - { call: "GET /market/shippers/${sh}", payload: {}, as: MarketAdmin, captures: { x0: "$.data.trust_exposure_cents" } }
            - { call: "POST /market/purchase-lots/${lotB}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lotB}", inspected_grade: "US2", defect_pct: 30, result: "FAIL" }, as: USDAInspector, captures: { inspB: "$.data.id" } }
            - { call: "POST /market/inspections/${inspB}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/purchase-lots/${lotB}/dispute", payload: { reason: "grade below contract" }, as: Receiver }
          trigger:
            - { call: "POST /market/purchase-lots/${lotB}/resolve-dispute", payload: { outcome: "REJECT_TO_SHIPPER" }, as: MarketAdmin, captures: { stB: "$.data.status" } }
            - { call: "GET /market/shippers/${sh}", payload: {}, as: MarketAdmin, captures: { x1: "$.data.trust_exposure_cents" } }
          assert:
            - "before rejection: trust_exposure_cents == 20000 (ORDERED lot 10000 + DISPUTED lot 10000)"
            - "after REJECT_TO_SHIPPER: lot B status == REJECTED and trust_exposure_cents == 10000"
            - "REJECTED lots are excluded from the exposure set even before any close"

      - name: early_pay_discount_boundary_on_eligible_date
        claim_type: threshold_boundary
        grounds: [calculations.invoice_settlement, entities.Invoice.fields.discount_taken_cents]
        distinguishing_aspect: "The discount comparison is inclusive (paid_date <= discount_eligible_until): a first payment dated exactly invoice_date + 5 earns round_half_up(7500 * 0.02) == 150, while a first payment dated one day later earns nothing. §1.8 tested discount accrual mid-window only, never the boundary date."
