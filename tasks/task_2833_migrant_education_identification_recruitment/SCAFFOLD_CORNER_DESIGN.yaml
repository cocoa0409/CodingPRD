          - endpoints[POST /mep/qualifying-moves/{move_id}/adjudicate]
        distinguishing_aspect: "The adjudicate trigger is not idempotent: the first call moves RECORDED -> VERIFIED and stamps adjudicated_on, the second identical call returns 409 ERR_MOVE_ALREADY_ADJUDICATED and leaves both status and adjudicated_on untouched."
