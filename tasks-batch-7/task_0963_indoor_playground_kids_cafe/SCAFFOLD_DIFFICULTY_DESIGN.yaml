scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_provisional_block_vs_final_tiered
        grounds:
          - calculations.visit_session_charge
          - entities.Visit.fields.quoted_cents
          - entities.Visit.fields.final_charge_cents
        distinguishing_aspect: |
          Same 90-minute input yields 2100 cents under the PROVISIONAL block
          variant (ceil(90/60)=2 blocks -> 1200+900) but 1650 cents under the
          FINAL per-minute tiered variant (60*20 + 30*15) — two valid
          algorithms on the Visit domain producing different results.
        test_recipe:
          setup:
            - "OPEN slot 2026-06-06 14:00-15:30 cap 10; guardian g1 with signed waiver and child c1; visit v1 RESERVED 90 min, PREPAID at quote 2100"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G One", email: "g1@x.com", phone: "111" }, as: Anonymous, captures: { g1: $.data.id, g1_ver: $.data.version } }
            - { call: "POST /guardians/${g1}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g1}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g1}/waivers", payload: { expected_guardian_version: "${g1_ver}" }, as: Guardian, as_user_id: "${g1}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g1}", visit_type: "RESERVATION", booked_duration_minutes: 90 }, as: Guardian, as_user_id: "${g1}", captures: { v1: $.data.id, q1: $.data.quoted_cents } }
            - { call: "POST /visits/${v1}/pay", payload: {}, as: Guardian, as_user_id: "${g1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:05:00Z" }, as: Admin }
            - { call: "POST /visits/${v1}/check-in", payload: { sock_method: "OWN_GRIP_SOCKS" }, as: FrontDesk, as_user_id: "${fd}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T15:35:00Z" }, as: Admin }
          trigger:
            - { call: "POST /visits/${v1}/check-out", payload: {}, as: FrontDesk, as_user_id: "${fd}", captures: { fin1: $.data.final_charge_cents, rd1: $.data.refund_delta_cents, ps1: $.data.payment_status, as1: $.data.admission_status } }
          assert:
            - "Visit.${v1}.quoted_cents == 2100 (PROVISIONAL: ceil(90/60)=2 blocks -> 1200+900)"
            - "Visit.${v1}.final_charge_cents == 1650 (FINAL: 60*20 + 30*15)"
            - "Visit.${v1}.refund_delta_cents == 450 (2100 - 1650)"
            - "Visit.${v1}.payment_status == SETTLED and admission_status == COMPLETED"

      - name: membership_credit_available_now_vs_statement
        grounds:
          - calculations.membership_credit_balance
          - entities.Guardian.fields.credits_available
          - entities.Guardian.fields.credits_statement
        distinguishing_aspect: |
          Guardian domain (not Visit): with 8 granted credits, 1 consumed and
          1 held, the AVAILABLE_NOW variant reports 6 while the STATEMENT
          variant reports 7 — forward-looking hold counting vs chronological
          settled-only counting on identical underlying data.
        test_recipe:
          setup:
            - "PLUS member g (8 credits); credit visit A RESERVED (held); credit visit B COMPLETED (consumed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G Two", email: "g2@x.com", phone: "222" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}", captures: { g_ver2: $.data.version } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver2}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid B", birth_date: "2019-05-20" }, as: Guardian, as_user_id: "${g}", captures: { c2: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60, use_credit: true }, as: Guardian, as_user_id: "${g}", captures: { va: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c2}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60, use_credit: true }, as: Guardian, as_user_id: "${g}", captures: { vb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:05:00Z" }, as: Admin }
            - { call: "POST /visits/${vb}/check-in", payload: { sock_method: "MEMBERSHIP_PROVIDED" }, as: FrontDesk, as_user_id: "${fd}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T15:00:00Z" }, as: Admin }
            - { call: "POST /visits/${vb}/check-out", payload: {}, as: FrontDesk, as_user_id: "${fd}" }
          trigger:
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { avail: $.data.credits_available, stmt: $.data.credits_statement, held: $.data.credits_held, cons: $.data.credits_consumed } }
          assert:
            - "Guardian.${g}.credits_granted == 8"
            - "Guardian.${g}.credits_consumed == 1 and credits_held == 1"
            - "Guardian.${g}.credits_available == 6 (AVAILABLE_NOW subtracts holds)"
            - "Guardian.${g}.credits_statement == 7 (STATEMENT ignores holds)"
            - "credits_available != credits_statement for identical ledger data"

  - rule_id: combinatorial_formula
    instances:
      - name: party_quote_multi_input_nonlinear
        grounds:
          - calculations.party_booking_quote
          - entities.PartyBooking.fields.quoted_total_cents
          - entities.PartyBooking.fields.deposit_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — extra-child slab,
          Saturday peak surcharge, membership discount capped at 0.25, and a
          deposit clamped by max(5000, 20%) — on a Saturday 14-child STD
          booking for a PLUS (10%) member.
        test_recipe:
          setup:
            - "PLUS member g; room r1 ACTIVE cap 20; package STD (120 min, base 30000, incl 10, extra 1500)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G Three", email: "g3@x.com", phone: "333" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}" }
          trigger:
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-06T10:00:00Z", child_count: 14, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id, qt: $.data.quoted_total_cents, dep: $.data.deposit_cents, en: $.data.end_at } }
          assert:
            - "PartyBooking.${pb}.quoted_total_cents == 37260 (extra=4*1500=6000; subtotal 36000; peak 5400; discount 4140 = 10% of 41400)"
            - "PartyBooking.${pb}.deposit_cents == 7452 (max(5000, round(0.20*37260)))"
            - "PartyBooking.${pb}.end_at == 2026-06-06T12:00:00Z"
            - "PartyBooking.${pb}.status == HELD"

      - name: cafe_total_per_line_then_sum_rounding
        grounds:
          - calculations.cafe_order_total
          - entities.CafeOrder.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — PLUS 10% cafe
          discount rounded per line then summed (1148 + 230 = 1378) differs
          from sum-then-round (round(1530*0.9) = 1377); the scaffold pins
          per-line-first.
        test_recipe:
          setup:
            - "PLUS member g with 600 loyalty points; menu: Latte 425 (MILK), Muffin 255 (WHEAT, EGG)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /cafe-menu-items", payload: { name: "Muffin", price_cents: 255, allergen_tags: ["WHEAT", "EGG"] }, as: Admin, captures: { muffin: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G Four", email: "g4@x.com", phone: "444" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/loyalty-adjustments", payload: { points: 600, note: "seed" }, as: Manager, as_user_id: "${mgr}" }
          trigger:
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 3 }, { menu_item_id: "${muffin}", quantity: 1 } ], child_ids: [], points_to_redeem: 500 }, as: Guardian, as_user_id: "${g}", captures: { o: $.data.id, sub: $.data.subtotal_cents, tot: $.data.total_cents, pr: $.data.points_redeemed } }
          assert:
            - "CafeOrder.${o}.subtotal_cents == 1378 (per-line: round(1275*0.9)=1148 + round(255*0.9)=230; sum-then-round would give 1377)"
            - "CafeOrder.${o}.points_redeemed == 500 (cap floor(1378/2)=689 not hit)"
            - "CafeOrder.${o}.total_cents == 878"

      - name: loyalty_earn_on_post_redemption_total
        grounds:
          - calculations.loyalty_redemption_and_earn
          - entities.CafeOrder.fields.points_earned
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          points are earned on the POST-redemption total (878 -> 8 points at
          BRONZE x1), not on the pre-redemption subtotal (1378 -> 13).
        test_recipe:
          setup:
            - "Same order as cafe_total_per_line_then_sum_rounding (subtotal 1378, redeemed 500, total 878), advanced to SERVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Cafe One", role: "CAFE_STAFF" }, as: Admin, captures: { cafe: $.data.id } }
            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /cafe-menu-items", payload: { name: "Muffin", price_cents: 255, allergen_tags: ["WHEAT", "EGG"] }, as: Admin, captures: { muffin: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G Five", email: "g5@x.com", phone: "555" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/loyalty-adjustments", payload: { points: 600, note: "seed" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 3 }, { menu_item_id: "${muffin}", quantity: 1 } ], child_ids: [], points_to_redeem: 500 }, as: Guardian, as_user_id: "${g}", captures: { o: $.data.id } }
            - { call: "POST /cafe-orders/${o}/start-preparing", payload: {}, as: CafeStaff, as_user_id: "${cafe}" }
          trigger:
            - { call: "POST /cafe-orders/${o}/serve", payload: {}, as: CafeStaff, as_user_id: "${cafe}", captures: { pe: $.data.points_earned } }
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { bal: $.data.points_balance } }
          assert:
            - "CafeOrder.${o}.points_earned == 8 (floor(878/100)*1 — redemption applied BEFORE earning)"
            - "points_earned != 13 (floor(1378/100) would be the pre-redemption mistake)"
            - "Guardian.${g}.points_balance == 108 (600 - 500 + 8)"

  - rule_id: non_linear_state_machine
    instances:
      - name: party_booking_reschedule_cycle
        grounds:
          - state_machines.PartyBooking.CONFIRMED_to_RESCHEDULE_REQUESTED
          - state_machines.PartyBooking.RESCHEDULE_REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic machine on PartyBooking: CONFIRMED -> RESCHEDULE_REQUESTED ->
          CONFIRMED loop re-checks room conflict and re-quotes; Saturday and
          Sunday are both peak so the quote is unchanged at 31050.
        test_recipe:
          setup:
            - "CONFIRMED STD booking for PLUS member, start 2026-06-06T10:00Z, 10 children (total 31050, deposit 6210)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G Six", email: "g6@x.com", phone: "666" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-06T10:00:00Z", child_count: 10, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id } }
            - { call: "POST /party-bookings/${pb}/confirm", payload: {}, as: Guardian, as_user_id: "${g}" }
          trigger:
            - { call: "POST /party-bookings/${pb}/request-reschedule", payload: { proposed_start_at: "2026-06-07T10:00:00Z" }, as: Guardian, as_user_id: "${g}", captures: { st1: $.data.status } }
            - { call: "POST /party-bookings/${pb}/approve-reschedule", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { st2: $.data.status, sa: $.data.start_at, ea: $.data.end_at, qt: $.data.quoted_total_cents } }
          assert:
            - "intermediate status == RESCHEDULE_REQUESTED"
            - "final status == CONFIRMED (cycle returned to origin state)"
            - "PartyBooking.${pb}.start_at == 2026-06-07T10:00:00Z and end_at == 2026-06-07T12:00:00Z"
            - "PartyBooking.${pb}.quoted_total_cents == 31050 (30000 + 4500 peak - 3450 = 10% of 34500; Sunday is also peak)"

      - name: visit_parallel_admission_payment_dimensions
        grounds:
          - state_machines.Visit (admission_status machine)
          - state_machines.Visit (payment_status machine)
        distinguishing_aspect: |
          Parallel state dimensions on one entity: paying flips payment_status
          PENDING->PREPAID while admission_status stays RESERVED; check-in then
          flips admission_status RESERVED->CHECKED_IN without touching
          payment_status — the two axes evolve independently.
        test_recipe:
          setup:
            - "OPEN slot; guardian with waiver + child; 60-min reservation v1 (quote 1200)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G Seven", email: "g7@x.com", phone: "777" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /visits/${v1}/pay", payload: {}, as: Guardian, as_user_id: "${g}", captures: { adm_after_pay: $.data.admission_status, pay_after_pay: $.data.payment_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:05:00Z" }, as: Admin }
            - { call: "POST /visits/${v1}/check-in", payload: { sock_method: "OWN_GRIP_SOCKS" }, as: FrontDesk, as_user_id: "${fd}", captures: { adm_after_ci: $.data.admission_status, pay_after_ci: $.data.payment_status } }
          assert:
            - "after pay: admission_status == RESERVED while payment_status == PREPAID"
            - "after check-in: admission_status == CHECKED_IN while payment_status == PREPAID (unchanged by the admission transition)"

  - rule_id: transitive_cascade
    instances:
      - name: emergency_slot_close_cascade
        grounds:
          - state_machines.SessionSlot.OPEN_to_CLOSED
          - state_machines.Visit.CHECKED_IN_to_EVACUATED
          - state_machines.Visit.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from POST /session-slots/{id}/close: slot CLOSED ->
          visits mutated (RESERVED->CANCELLED, CHECKED_IN->EVACUATED at 50%
          tiered charge) -> guardian credit holds released / prepayments
          refunded AND +200 compensation loyalty points per affected guardian.
        test_recipe:
          setup:
            - "OPEN slot with: G1 PREPAID 90-min reservation (2100), G2 PLUS credit reservation (1 credit held), G3 WALK_IN checked in at 14:05; clock at 14:35"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
