          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "Authentication succeeds (the acting X-User-ID resolves to a real school) and the path has no resource id, so the only failing rule is the payload FK check: school_id naming a non-existent School returns 404 ERR_FK_NOT_FOUND, not ERR_RESOURCE_NOT_FOUND."
