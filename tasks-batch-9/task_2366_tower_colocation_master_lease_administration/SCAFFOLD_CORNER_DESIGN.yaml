              payload: { site_name: "Idempotent Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
