  - name: plan_posture_is_at_risk_at_full_coverage_without_supervisor_cover
    claim_type: threshold
    grounds:
    - calculations.plan_coverage_and_posture
    - calculations.plan_coverage_and_posture.constants
    - entities.StaffingPlan.fields.supervisor_coverage_ok
    - entities.StaffingPlan.fields.readiness_posture
    distinguishing_aspect: |
      The posture ladder's first clause is a CONJUNCTION of three terms, and coverage_ratio is the term that dominates every other instance, so the only way to prove supervisor_coverage_ok is a real gate is to satisfy the coverage term perfectly and fail the supervisor term alone: a plan with five of five PERIMETER slots filled and no SUPERVISOR post at all sits at exactly 1.00 and must still be AT_RISK, then flip to READY the moment one supervisor-qualified guard is confirmed on a SUPERVISOR post.
