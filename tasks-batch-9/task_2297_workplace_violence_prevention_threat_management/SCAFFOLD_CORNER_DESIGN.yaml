            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "PreventionPlan for the worksite carries one SCREENING HazardAssessment on the only WorkArea, so hazard_coverage_pct is 100.00; no TrainingModule exists, so training_compliance_pct is vacuously 100.00 and the plan reaches ACTIVE."
            - "IncidentReport (weapon_involved true, injury_level FIRST_AID, incident_type TYPE_3_COWORKER) scores severity_points 50 / CRITICAL and is triaged ESCALATED."
            - "ThreatCase opened on that report; all five required disciplines (HR LEAD, SECURITY, OPERATIONS, CLINICAL, LEGAL) are seated, so quorum_met is true; convene sets interim_risk_score 42.00 and assessment_round 1."
            - "All five voting seats have balloted in round 1, so the case has auto-advanced to DELIBERATION."
            - "decide with disposition ELEVATED_RISK moved the case to MONITORING with consensus_risk_score 60.94, risk_band HIGH and protection window [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z)."
            - "The decide cascade appended one ViolentIncidentLogEntry for the case with required_element_count_present 6 (consequence_narrative and controls_summary are null), so log_completeness_pct is 75.00 and the plan, now REVIEW_DUE, scores 75.20 against the RESTRICTED threshold 85.00."
            - "ThreatCase.open_action_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
