      - name: instrument_assignment_constraint_gates
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_INSTRUMENT_ALREADY_ASSIGNED]"
          - "errors[ERR_INSTRUMENT_CYCLE_LIMIT]"
          - "errors[ERR_INSTRUMENT_NOT_IN_SERVICE]"
        distinguishing_aspect: "Assign gates: already-assigned instrument (ERR_INSTRUMENT_ALREADY_ASSIGNED), usage_cycles == max_cycles blocks (ERR_INSTRUMENT_CYCLE_LIMIT — equality blocks, max-1 is fine), and a FLAGGED_FOR_REPAIR instrument cannot be flagged or assigned (ERR_INSTRUMENT_NOT_IN_SERVICE)."
        test_recipe:
          setup: ["template (SCALPEL x9), technician A, tray tm IN_ASSEMBLY; instruments ia (SN-A1, usage 0/max 50), ib (SN-A2, usage 5/max 5 — at limit), ic (SN-A3) already FLAGGED_FOR_REPAIR"]
