scenario: "Continuing Education & Licensure Credits: accredited CE course/provider, credit hour (CEU/CME/CLE), board renewal cycle/requirement, carryover, audit/attestation, reciprocity, deadline reminder, certificate"
domain_name: continuing-education-credits
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions
    - cascading_side_effects

  entity_topology: flat
  # Peer top-level entities (LicenseBoard, Provider, Licensee, RenewalCycle, Completion,
  # Audit, ReciprocityGrant) linked by foreign keys in request bodies, not URL nesting.
  # api_prefix is "" so every collection is a top-level path (/providers, /licensees, ...).

  state_machine_shape: branching
  # RenewalCycle and Audit branch (fork to PASSED/FAILED, revision loops); Completion and
  # Provider carry revert cycles. No single linear A->B->C->D pipeline.

  relationship_patterns:
    - one_to_many        # LicenseBoard -> CreditRequirement; Provider -> Course; RenewalCycle -> Completion
    - cross_aggregate    # Completion references Course AND RenewalCycle across aggregate boundaries
    - polymorphic        # (not used) — kept flat, FK references are concrete

  role_model: segregation_of_duties
  # The BoardAdmin who initiates an Audit cannot be the Auditor who decides it (X-User-ID
  # segregation). Blended with peer_roles: Provider owns Courses, Licensee owns Completions.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LicenseBoard
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Board name, e.g. 'State Bar of CA'."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Two-letter jurisdiction code, e.g. 'CA'."
        constraints: "uppercase, length 2; unique across LicenseBoard together with credit_unit"
      - name: credit_unit
        type: enum
        source: input
        description: "Unit of credit hours this board accredits."
        constraints: "one of {CEU, CME, CLE}"
      - name: cycle_length_months
        type: integer
        source: input
        description: "Length of a renewal cycle window in months."
        constraints: ">= 1; commonly 24 or 36"
      - name: total_required_hours
        type: number
        source: input
        description: "Total credit hours required per renewal cycle."
        constraints: ">= 0; one decimal place"
      - name: carryover_cap_hours
        type: number
        source: input
        description: "Maximum verified surplus hours that may carry into the next cycle."
        default: 10.0
        constraints: ">= 0; one decimal place"
      - name: audit_cooldown_days
        type: integer
        source: input
        description: "Minimum days that must elapse between the close of one Audit and the initiation of the next on the same Licensee."
        default: 365
        constraints: ">= 0"
      - name: reminder_lead_days
        type: integer
        source: input
        description: "Days before a RenewalCycle deadline at which the deadline reminder becomes DUE."
        default: 60
        constraints: ">= 0"

  - name: CreditRequirement
    parent: null
    common_fields: true
    fields:
      - name: board_id
        type: string
        source: input
        description: "FK -> LicenseBoard.id"
      - name: category
        type: enum
        source: input
        description: "Credit category this requirement governs."
        constraints: "one of {ETHICS, SUBSTANCE, GENERAL}; (board_id, category) unique"
      - name: min_hours
        type: number
        source: input
        description: "Minimum hours that must be earned in this category per cycle."
        constraints: ">= 0; one decimal place. Sum of all non-GENERAL min_hours for a board must be <= board.total_required_hours."

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Accredited CE provider name."
      - name: board_id
        type: string
        source: input
        description: "FK -> LicenseBoard.id; the board that accredits this provider."
      - name: status
        type: enum
        source: system
        description: "Accreditation lifecycle state."
        default: APPLIED
        constraints: "one of {APPLIED, ACCREDITED, SUSPENDED, REVOKED}"
      - name: accredited_from
        type: datetime
        source: system
        description: "UTC timestamp at which accreditation was granted (set on APPLIED->ACCREDITED)."
        default: null
      - name: accredited_until
        type: datetime
        source: input
        description: "UTC timestamp at which accreditation lapses; a Completion is only verifiable if completed within [accredited_from, accredited_until)."
        default: null

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: title
        type: string
        source: input
        description: "Course title."
      - name: category
        type: enum
        source: input
        description: "Credit category the course awards."
        constraints: "one of {ETHICS, SUBSTANCE, GENERAL}"
      - name: credit_hours
        type: number
        source: input
        description: "Credit hours awarded on verified completion."
        constraints: "> 0; one decimal place"
      - name: status
        type: enum
        source: system
        description: "Course availability state."
        default: ACTIVE
        constraints: "one of {ACTIVE, DEACTIVATED}; DEACTIVATED when parent Provider is REVOKED"

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Licensed professional's name."
      - name: home_board_id
        type: string
        source: input
        description: "FK -> LicenseBoard.id; the board under which the licensee primarily renews."
      - name: license_number
        type: string
        source: input
        description: "License identifier."
        constraints: "unique together with home_board_id"
      - name: audit_risk_score
        type: number
        source: computed
        description: "Most recently computed weighted audit-risk score for this licensee; see audit_risk_score calculation."
        default: 0
        constraints: "integer-valued, clamped to [0, 100]"

  - name: RenewalCycle
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id"
      - name: board_id
        type: string
        source: input
        description: "FK -> LicenseBoard.id"
      - name: cycle_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the renewal window."
      - name: cycle_end
        type: datetime
        source: computed
        description: "Exclusive UTC end of the window; cycle_start + board.cycle_length_months. Renewal deadline equals cycle_end."
      - name: status
        type: enum
        source: system
        description: "Renewal lifecycle state."
        default: OPEN
        constraints: "one of {OPEN, REQUIREMENTS_MET, AUDIT_HOLD, RENEWED, LAPSED}"
      - name: carryover_in_hours
        type: number
        source: input
        description: "Verified surplus hours carried in from the licensee's immediately prior cycle on the same board."
        default: 0
        constraints: ">= 0; one decimal place. Conserved: equals prior cycle's carryover_out_hours."
      - name: carryover_out_hours
        type: number
        source: computed
        description: "Verified surplus hours eligible to carry into the next cycle; see carryover_computation. 0 until status reaches REQUIREMENTS_MET or RENEWED."
        default: 0
      - name: provisional_earned_hours
        type: number
        source: computed
        description: "Credit hours from PENDING_VERIFICATION + VERIFIED completions plus carryover_in_hours plus approved reciprocity hours; see credit_tally (provisional variant)."
        default: 0
      - name: final_earned_hours
        type: number
        source: computed
        description: "Credit hours from VERIFIED completions only plus carryover_in_hours plus approved reciprocity hours; see credit_tally (final variant)."
        default: 0
      - name: reciprocity_hours
        type: number
        source: computed
        description: "Sum of credit_hours from APPROVED ReciprocityGrant rows whose target_cycle_id is this cycle."
        default: 0
      - name: reminder_status
        type: enum
        source: computed
        description: "Deadline reminder state derived from current clock vs cycle_end and board.reminder_lead_days; see deadline_reminder calculation."
        default: NOT_DUE
        constraints: "one of {NOT_DUE, DUE, OVERDUE}"

  - name: Completion
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id"
      - name: cycle_id
        type: string
        source: input
        description: "FK -> RenewalCycle.id; the cycle the credit is applied to."
      - name: completed_at
        type: datetime
        source: input
        description: "UTC timestamp the licensee completed the course; must fall within both the cycle window and the course's provider accreditation window."
      - name: awarded_hours
        type: number
        source: system
        description: "Credit hours snapshotted from Course.credit_hours at submission; the course's later edits do not change a submitted completion."
      - name: category
        type: enum
        source: system
        description: "Credit category snapshotted from Course.category at submission."
        constraints: "one of {ETHICS, SUBSTANCE, GENERAL}"
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle state."
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, REJECTED, INVALIDATED}"
      - name: is_late
        type: boolean
        source: system
        description: "True when completed_at is within reminder_lead_days of cycle_end (filed in the reminder/overdue window); feeds audit_risk_score."
        default: false

  - name: Certificate
    parent: null
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> RenewalCycle.id"
      - name: serial_number
        type: string
        source: system
        description: "Monotonic per-board serial assigned at issuance, formatted '<jurisdiction_code>-<zero-padded-6-digit-sequence>'."
      - name: total_hours_certified
        type: number
        source: system
        description: "Snapshot of cycle.final_earned_hours at issuance."
      - name: issued_at
        type: datetime
        source: system
        description: "UTC issuance timestamp (equals created_at)."

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> RenewalCycle.id; the cycle under audit."
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; denormalized from the cycle for filtered lookup."
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardAdmin who initiated this audit; the deciding Auditor MUST differ from this value (segregation of duties)."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Auditor who set PASSED/FAILED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state."
        default: INITIATED
        constraints: "one of {INITIATED, ATTESTATION_PENDING, UNDER_REVIEW, PASSED, FAILED}"
      - name: initiated_at
        type: datetime
        source: system
        description: "UTC timestamp the audit was initiated (equals created_at)."
      - name: closed_at
        type: datetime
        source: system
        description: "UTC timestamp the audit reached PASSED or FAILED; used for the audit_cooldown_days buffer on the next audit."
        default: null

  - name: Attestation
    parent: null
    common_fields: false
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id"
      - name: statement
        type: string
        source: input
        description: "Licensee's signed attestation text affirming the completions are accurate."
      - name: attested_hours
        type: number
        source: input
        description: "Total hours the licensee attests to; must equal the cycle's final_earned_hours at attestation time or the audit fails on review."

  - name: ReciprocityGrant
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id"
      - name: target_cycle_id
        type: string
        source: input
        description: "FK -> RenewalCycle.id; the cycle the reciprocal credit is applied to."
      - name: source_jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction code the credits originate from."
        constraints: "must differ from the target cycle's board.jurisdiction_code"
      - name: category
        type: enum
        source: input
        description: "Credit category the reciprocal hours count toward."
        constraints: "one of {ETHICS, SUBSTANCE, GENERAL}"
      - name: credit_hours
        type: number
        source: input
        description: "Reciprocal credit hours requested."
        constraints: "> 0; one decimal place"
      - name: status
        type: enum
        source: system
        description: "Reciprocity lifecycle state."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Provider
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: ACCREDITED
        trigger: "POST /providers/{id}/accredit"
        actor: BoardAdmin
        preconditions:
          - "Provider.status == APPLIED"
          - "request supplies accredited_until > current clock"
        side_effects:
          - "set Provider.accredited_from = current clock"
          - "set Provider.accredited_until = request value"
          - "increments Provider.version by 1"
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /providers/{id}/suspend"
        actor: BoardAdmin
        preconditions:
          - "Provider.status == ACCREDITED"
        side_effects:
          - "increments Provider.version by 1"
        note: "Suspension freezes new verifications but does not deactivate Courses; reversible."
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /providers/{id}/reinstate"
        actor: BoardAdmin
        preconditions:
          - "Provider.status == SUSPENDED"
        side_effects:
          - "increments Provider.version by 1"
      - from: ACCREDITED
        to: REVOKED
        trigger: "POST /providers/{id}/revoke"
        actor: BoardAdmin
        preconditions:
          - "Provider.status IN {ACCREDITED, SUSPENDED}"
        side_effects:
          - "CASCADE depth-1: set every ACTIVE Course of this provider to DEACTIVATED"
          - "CASCADE depth-2: each Course deactivation sets every VERIFIED Completion on that course to INVALIDATED"
          - "CASCADE depth-3: each Completion invalidation recomputes its RenewalCycle.final_earned_hours and provisional_earned_hours (credit_tally)"
          - "CASCADE depth-4: each affected RenewalCycle whose status was REQUIREMENTS_MET and whose final_earned_hours now falls below total_required_hours reverts to OPEN"
          - "increments Provider.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /providers/{id}/revoke"
        actor: BoardAdmin
        preconditions:
          - "Provider.status IN {ACCREDITED, SUSPENDED}"
        side_effects:
          - "same four-hop cascade as ACCREDITED->REVOKED"
          - "increments Provider.version by 1"

  - entity: Completion
    initial_state: PENDING_VERIFICATION
    terminal_states: [INVALIDATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /completions/{id}/verify"
        actor: BoardAdmin
        preconditions:
          - "Completion.status == PENDING_VERIFICATION"
          - "the Course's Provider.status == ACCREDITED (cross-entity: not SUSPENDED/REVOKED)"
          - "Completion.completed_at within [Provider.accredited_from, Provider.accredited_until)"
          - "the RenewalCycle.status IN {OPEN, REQUIREMENTS_MET}"
        side_effects:
          - "recompute RenewalCycle.final_earned_hours and provisional_earned_hours (credit_tally)"
          - "BUBBLE-UP: if requirement_satisfaction now met, RenewalCycle OPEN -> REQUIREMENTS_MET and compute carryover_out_hours"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /completions/{id}/reject"
        actor: BoardAdmin
        preconditions:
          - "Completion.status == PENDING_VERIFICATION"
        side_effects:
          - "recompute RenewalCycle.provisional_earned_hours (drops this completion's hours)"
          - "recompute the Licensee.audit_risk_score (intake variant counts this rejection)"
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /completions/{id}/resubmit"
        actor: Licensee
        preconditions:
          - "Completion.status == REJECTED"
          - "the RenewalCycle.status IN {OPEN, REQUIREMENTS_MET}"
        side_effects:
          - "recompute RenewalCycle.provisional_earned_hours (re-adds this completion's hours)"
        note: "Revision loop: REJECTED -> PENDING_VERIFICATION -> VERIFIED is a cycle."
      - from: VERIFIED
        to: INVALIDATED
        trigger: "system: parent Course DEACTIVATED via Provider revoke cascade"
        actor: system
        preconditions:
          - "Completion.status == VERIFIED"
          - "the Course.status transitioned to DEACTIVATED"
        side_effects:
          - "recompute RenewalCycle.final_earned_hours and provisional_earned_hours (credit_tally)"

  - entity: RenewalCycle
    initial_state: OPEN
    terminal_states: [RENEWED, LAPSED]
    transitions:
      - from: OPEN
        to: REQUIREMENTS_MET
        trigger: "system: a Completion verify or ReciprocityGrant approve raises final_earned_hours to satisfy requirement_satisfaction"
        actor: system
        preconditions:
          - "requirement_satisfaction(cycle) == MET using final_earned_hours"
        side_effects:
          - "compute carryover_out_hours (carryover_computation)"
      - from: REQUIREMENTS_MET
        to: OPEN
        trigger: "system: a cascade (Completion INVALIDATED, ReciprocityGrant revoked) drops final_earned_hours below requirement"
        actor: system
        preconditions:
          - "requirement_satisfaction(cycle) != MET using final_earned_hours"
        side_effects:
          - "reset carryover_out_hours = 0"
        note: "Revert leg: REQUIREMENTS_MET -> OPEN, completing the cycle."
      - from: REQUIREMENTS_MET
        to: AUDIT_HOLD
        trigger: "POST /audits (audit initiated against this cycle)"
        actor: BoardAdmin
        preconditions:
          - "RenewalCycle.status == REQUIREMENTS_MET"
          - "no other Audit for this cycle is in a non-terminal state"
        side_effects:
          - "the created Audit starts in INITIATED"
      - from: OPEN
        to: AUDIT_HOLD
        trigger: "POST /audits (audit initiated against this cycle)"
        actor: BoardAdmin
        preconditions:
          - "RenewalCycle.status == OPEN"
          - "no other Audit for this cycle is in a non-terminal state"
        side_effects:
          - "the created Audit starts in INITIATED"
      - from: AUDIT_HOLD
        to: REQUIREMENTS_MET
        trigger: "system: the cycle's Audit reaches PASSED and final_earned_hours satisfies requirement"
        actor: system
        preconditions:
          - "the linked Audit.status == PASSED"
          - "requirement_satisfaction(cycle) == MET"
        side_effects:
          - "recompute carryover_out_hours (carryover_computation)"
      - from: AUDIT_HOLD
        to: OPEN
        trigger: "system: the cycle's Audit reaches PASSED but final_earned_hours no longer satisfies requirement"
        actor: system
        preconditions:
          - "the linked Audit.status == PASSED"
          - "requirement_satisfaction(cycle) != MET"
        side_effects:
          - "reset carryover_out_hours = 0"
      - from: AUDIT_HOLD
        to: LAPSED
        trigger: "system: the cycle's Audit reaches FAILED"
        actor: system
        preconditions:
          - "the linked Audit.status == FAILED"
        side_effects:
          - "reset carryover_out_hours = 0"
      - from: REQUIREMENTS_MET
        to: RENEWED
        trigger: "POST /renewal-cycles/{id}/renew"
        actor: Licensee
        preconditions:
          - "RenewalCycle.status == REQUIREMENTS_MET"
          - "no Audit for this cycle is in a non-terminal state"
          - "requirement_satisfaction(cycle) == MET"
          - "request supplies expected_renewal_cycle_version matching current"
        side_effects:
          - "issue a Certificate for this cycle (serial assigned)"
          - "finalize carryover_out_hours (carryover_computation)"
          - "increments RenewalCycle.version by 1"

  - entity: Audit
    initial_state: INITIATED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: INITIATED
        to: ATTESTATION_PENDING
        trigger: "POST /audits/{id}/request-attestation"
        actor: BoardAdmin
        preconditions:
          - "Audit.status == INITIATED"
        side_effects: []
      - from: ATTESTATION_PENDING
        to: UNDER_REVIEW
        trigger: "POST /audits/{id}/attestations (licensee submits attestation)"
        actor: Licensee
        preconditions:
          - "Audit.status == ATTESTATION_PENDING"
        side_effects:
          - "recompute the Licensee.audit_risk_score (review_final variant)"
      - from: UNDER_REVIEW
        to: ATTESTATION_PENDING
        trigger: "POST /audits/{id}/request-attestation"
        actor: Auditor
        preconditions:
          - "Audit.status == UNDER_REVIEW"
        side_effects: []
        note: "Revision loop: reviewer asks for a corrected attestation."
      - from: UNDER_REVIEW
        to: PASSED
        trigger: "POST /audits/{id}/decide"
        actor: Auditor
        preconditions:
          - "Audit.status == UNDER_REVIEW"
          - "request decision == PASS"
          - "X-User-ID != Audit.initiated_by_user_id (segregation of duties)"
          - "the latest Attestation.attested_hours == cycle.final_earned_hours"
        side_effects:
          - "set Audit.decided_by_user_id, closed_at = current clock"
          - "BUBBLE-UP: re-evaluate the cycle AUDIT_HOLD -> REQUIREMENTS_MET or OPEN"
      - from: UNDER_REVIEW
        to: FAILED
        trigger: "POST /audits/{id}/decide"
        actor: Auditor
        preconditions:
          - "Audit.status == UNDER_REVIEW"
          - "request decision == FAIL OR the latest Attestation.attested_hours != cycle.final_earned_hours"
          - "X-User-ID != Audit.initiated_by_user_id (segregation of duties)"
        side_effects:
          - "set Audit.decided_by_user_id, closed_at = current clock"
          - "BUBBLE-UP: the cycle AUDIT_HOLD -> LAPSED"

  - entity: ReciprocityGrant
    initial_state: REQUESTED
    terminal_states: [DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /reciprocity-grants/{id}/approve"
        actor: BoardAdmin
        preconditions:
          - "ReciprocityGrant.status == REQUESTED"
          - "the target RenewalCycle.status IN {OPEN, REQUIREMENTS_MET}"
          - "source_jurisdiction_code != target cycle's board.jurisdiction_code"
        side_effects:
          - "add credit_hours to target RenewalCycle.reciprocity_hours"
          - "recompute target RenewalCycle.final_earned_hours and provisional_earned_hours (credit_tally)"
          - "BUBBLE-UP: if requirement now met, cycle OPEN -> REQUIREMENTS_MET and compute carryover_out_hours"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /reciprocity-grants/{id}/deny"
        actor: BoardAdmin
        preconditions:
          - "ReciprocityGrant.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: DENIED
        trigger: "POST /reciprocity-grants/{id}/revoke"
        actor: BoardAdmin
        preconditions:
          - "ReciprocityGrant.status == APPROVED"
          - "the target RenewalCycle.status IN {OPEN, REQUIREMENTS_MET}"
        side_effects:
          - "subtract credit_hours from target RenewalCycle.reciprocity_hours (COMPENSATION; exact inverse of approve)"
          - "recompute target RenewalCycle.final_earned_hours and provisional_earned_hours (credit_tally)"
          - "BUBBLE-UP: if requirement no longer met, cycle REQUIREMENTS_MET -> OPEN and reset carryover_out_hours = 0"
        note: "Compensating action: approve then revoke leaves cycle.reciprocity_hours and final_earned_hours exactly as before approve."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cycle-renew-stale-version
    parent_entity: RenewalCycle
    write_endpoint: "POST /renewal-cycles/{id}/renew"
    occ_field: "expected_renewal_cycle_version"
    description: |
      Renewing a RenewalCycle whose version has advanced since the client last
      observed it is rejected. A verify/approve cascade or a reciprocity approval
      may have bumped the cycle's version (recomputing earned hours and possibly
      flipping it to REQUIREMENTS_MET) after the client read it, so a renew that
      carries a stale expected_renewal_cycle_version is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_tally
    trigger: "On Completion verify/reject/resubmit/invalidate and on ReciprocityGrant approve/revoke (any change to a cycle's contributing rows)."
    algorithm: aggregation
    formula: |
      base = carryover_in_hours + reciprocity_hours
      provisional_earned_hours = base
        + sum(c.awarded_hours for c in Completion
              where c.cycle_id == cycle.id and c.status IN {PENDING_VERIFICATION, VERIFIED})
      final_earned_hours = base
        + sum(c.awarded_hours for c in Completion
              where c.cycle_id == cycle.id and c.status == VERIFIED)
    input_set: "Completions on this cycle; provisional includes PENDING_VERIFICATION+VERIFIED, final includes VERIFIED only. INVALIDATED and REJECTED excluded from both."
    constants: {}
    precision: "1 decimal place, round_half_up; sum is exact then rounded once at the end"
    variants:
      - name: provisional
        when: "displayed to the licensee mid-cycle and used for the deadline reminder projection"
        difference: "includes PENDING_VERIFICATION hours that final excludes; provisional >= final always"
      - name: final
        when: "used by requirement_satisfaction, certificate issuance, and attestation matching"
        difference: "counts only VERIFIED completions; the authoritative compliance figure"

  - name: requirement_satisfaction
    trigger: "Evaluated after every credit_tally recompute to decide cycle OPEN<->REQUIREMENTS_MET, and at certificate issuance."
    algorithm: waterfall_allocation
    formula: |
      # Allocate VERIFIED hours by category across the board's CreditRequirement rows.
      # Inputs: per-category verified hours {ETHICS_h, SUBSTANCE_h, GENERAL_h} (each
      #   = carryover/reciprocity hours of that category + verified completion hours of that category),
      #   category mins {ETHICS_min, SUBSTANCE_min} from CreditRequirement,
      #   board.total_required_hours T.
      general_required = T - sum(min_hours of every non-GENERAL CreditRequirement)
      for each non-GENERAL category K with min_hours m_K:
        alloc_K   = min(hours_K, m_K)          # fill the category requirement first
        overflow_K = max(hours_K - m_K, 0.0)   # surplus spills to the general pool
        deficit_K = max(m_K - hours_K, 0.0)
      general_pool = GENERAL_h + sum(overflow_K over all non-GENERAL categories)
      general_deficit = max(general_required - general_pool, 0.0)
      MET  iff (every deficit_K == 0.0) AND (general_deficit == 0.0)
    input_set: "Per-category VERIFIED hours for the cycle (final_earned_hours decomposed by category) plus this cycle's carryover_in and approved reciprocity hours tagged by category."
    constants: {}
    precision: "1 decimal place, round_half_up; comparisons use >= (a category with exactly m_K hours is MET)"
    variants:
      - name: strict_final
        when: "the only sanctioned variant; requirement satisfaction is always computed on VERIFIED hours"
        difference: "never uses provisional hours — a cycle never reaches REQUIREMENTS_MET on PENDING completions"

  - name: carryover_computation
    trigger: "Computed when a cycle enters REQUIREMENTS_MET, on renew, and reset to 0 on revert to OPEN or LAPSED."
    algorithm: waterfall_allocation
    formula: |
      # Surplus per category, rounded per-category, then summed, then capped. Carryover surplus is
      # each category's OWN excess over its own requirement (it does NOT pool ETHICS/SUBSTANCE overflow
      # into GENERAL — that pooling is only for the requirement_satisfaction MET test, not carryover).
      for each category K in {ETHICS, SUBSTANCE, GENERAL}:
        required_K = (min_hours of K's CreditRequirement) if K != GENERAL else general_required
        hours_K    = this cycle's VERIFIED+carryover_in+approved-reciprocity hours tagged category K
        surplus_K  = round_half_up(max(hours_K - required_K, 0.0), 1)   # ROUND PER CATEGORY
      raw_carryover = surplus_ETHICS + surplus_SUBSTANCE + surplus_GENERAL              # THEN SUM
      carryover_out_hours = min(raw_carryover, board.carryover_cap_hours)               # THEN CAP
    input_set: "Per-category VERIFIED hours for this cycle (each category's own hours, not the pooled general bucket); computed only when requirement_satisfaction is MET."
    constants:
      ROUNDING_ORDER: "round_each_category_then_sum_then_cap"
    precision: |
      Pinned order: round_half_up each category surplus to 1 decimal FIRST, then sum, then cap.
      'Sum then round' is explicitly NOT used and would give a different value at fractional boundaries
      (e.g. surpluses 1.04/5.04/0.04 -> per-category 1.0+5.0+0.0 = 6.0, NOT round(6.12)=6.1).
    variants:
      - name: cap_bound
        when: "raw_carryover exceeds board.carryover_cap_hours"
        difference: "carryover_out_hours saturates at carryover_cap_hours; surplus above the cap is forfeited"

  - name: audit_risk_score
    trigger: "Recomputed on Completion reject (intake variant) and on Attestation submission (review_final variant); stored on Licensee.audit_risk_score."
    algorithm: weighted_scoring
    formula: |
      late_count   = count(Completion c where c.licensee_id == L.id and c.is_late == true
                           and c.status IN {included set per variant})
      reject_count = count(Completion c where c.licensee_id == L.id and c.status == REJECTED)
      recip_count  = count(ReciprocityGrant g where g.licensee_id == L.id and g.status == APPROVED)
      score = min(100, W_LATE*late_count + W_REJECT*reject_count + W_RECIP*recip_count)
    input_set: "Completions and approved reciprocity grants owned by the licensee; the late/reject inclusion set differs by variant."
    constants:
      W_LATE: 3
      W_REJECT: 5
      W_RECIP: 2
      SCORE_CEILING: 100
    precision: "integer; clamp to [0, 100]"
    variants:
      - name: intake_estimate
        when: "recomputed at Completion reject time"
        difference: "counts late completions in {PENDING_VERIFICATION, VERIFIED, REJECTED} and all REJECTED — an early, pessimistic estimate"
      - name: review_final
        when: "recomputed at Attestation submission time"
        difference: "counts late completions only in {VERIFIED} and excludes rejections that were later resubmitted-and-verified — the settled figure; differs from intake on the same licensee"

  - name: deadline_reminder
    trigger: "Computed on read of a RenewalCycle and its reminder sub-resource; depends on the current clock."
    algorithm: threshold
    formula: |
      remind_at = cycle_end - board.reminder_lead_days (days)
      if now < remind_at:        reminder_status = NOT_DUE
      elif remind_at <= now < cycle_end: reminder_status = DUE
      else (now >= cycle_end):    reminder_status = OVERDUE
    input_set: "The cycle's cycle_end, the board's reminder_lead_days, and the current server clock."
    constants: {}
    precision: "day-granular comparison; boundary at remind_at uses >= (exactly remind_at is DUE), boundary at cycle_end uses >= (exactly cycle_end is OVERDUE)"
    variants:
      - name: live_clock
        when: "the only variant; reminder_status is always relative to the current clock, never persisted stale"
        difference: "re-derived on every read"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource (Licensee acts on own Completion/RenewalCycle/ReciprocityGrant; Provider acts on own Course)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /completions, POST /completions/{id}/resubmit, POST /renewal-cycles/{id}/renew, POST /reciprocity-grants, POST /courses"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity gate: Completion verify requires its Course's Provider.status == ACCREDITED."
    error_id: ERR_PROVIDER_NOT_ACCREDITED
    http_status: 409
    applies_to: "POST /completions/{id}/verify"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the Auditor deciding an Audit must not be the BoardAdmin who initiated it (X-User-ID differs from Audit.initiated_by_user_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /audits/{id}/decide"

  - priority: 8
    category: business_temporal
    check: "Completion.completed_at must fall within both the RenewalCycle window [cycle_start, cycle_end) and, at verify time, the Provider accreditation window [accredited_from, accredited_until)."
    error_id: ERR_COMPLETION_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /completions, POST /completions/{id}/verify"

  - priority: 9
    category: business_temporal
    check: "RenewalCycle windows for the same (licensee_id, board_id) must not overlap; closed-open semantics — a new cycle whose cycle_start equals the prior cycle_end is allowed (adjacency), any earlier start that lands inside a prior [start,end) is rejected."
    error_id: ERR_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST /renewal-cycles"

  - priority: 10
    category: business_temporal
    check: "A new Audit on a licensee may be initiated only if (current clock) >= (most recent closed Audit's closed_at + board.audit_cooldown_days); the buffer gap must be fully elapsed."
    error_id: ERR_AUDIT_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /audits"

  - priority: 11
    category: business_constraint
    check: "At most one non-terminal Audit may exist per RenewalCycle."
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /audits"

  - priority: 12
    category: business_constraint
    check: "ReciprocityGrant.source_jurisdiction_code must differ from the target cycle's board.jurisdiction_code."
    error_id: ERR_SAME_JURISDICTION
    http_status: 422
    applies_to: "POST /reciprocity-grants, POST /reciprocity-grants/{id}/approve"

  - priority: 13
    category: business_constraint
    check: "Certificate issuance (renew) requires the cycle to currently satisfy requirement_satisfaction on VERIFIED hours; an empty or insufficient verified set is rejected."
    error_id: ERR_REQUIREMENTS_NOT_MET
    http_status: 409
    applies_to: "POST /renewal-cycles/{id}/renew"

  - priority: 14
    category: business_fiscal
    check: "carryover_in_hours supplied on a RenewalCycle must not exceed the prior cycle's carryover_out_hours nor the board.carryover_cap_hours."
    error_id: ERR_CARRYOVER_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /renewal-cycles"

  - priority: 15
    category: state
    check: "OCC: expected_renewal_cycle_version must equal the cycle's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /renewal-cycles/{id}/renew"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- LicenseBoard ----
  - method: POST
    path: "/license-boards"
    description: "Create a license board."
    roles: [BoardAdmin]
    code: 201
    input: [name, jurisdiction_code, credit_unit, cycle_length_months, total_required_hours, "carryover_cap_hours?", "audit_cooldown_days?", "reminder_lead_days?"]
    output: LicenseBoard
    side_effects: []
  - method: GET
    path: "/license-boards/{id}"
    description: "Fetch a license board."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: []
    output: LicenseBoard
    side_effects: []
  - method: POST
    path: "/license-boards/{id}/requirements"
    description: "Add a credit requirement to a board."
    roles: [BoardAdmin]
    code: 201
    input: [category, min_hours]
    output: CreditRequirement
    side_effects: []
  - method: GET
    path: "/license-boards/{id}/requirements"
    description: "List a board's credit requirements (reverse-reachability for CreditRequirement.board_id)."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditRequirement[]
    side_effects: []
  - method: GET
    path: "/credit-requirements/{id}"
    description: "Fetch a single credit requirement."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: []
    output: CreditRequirement
    side_effects: []

  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Register a provider (status APPLIED)."
    roles: [BoardAdmin]
    code: 201
    input: [name, board_id]
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers/{id}"
    description: "Fetch a provider."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers"
    description: "List providers, filterable by board_id (reverse-reachability for Provider.board_id)."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: ["board_id?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: POST
    path: "/providers/{id}/accredit"
    description: "Accredit an APPLIED provider."
    roles: [BoardAdmin]
    code: 200
    input: [accredited_until]
    output: Provider
    side_effects: ["set accredited_from/until", "increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/suspend"
    description: "Suspend an ACCREDITED provider."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/reinstate"
    description: "Reinstate a SUSPENDED provider."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/revoke"
    description: "Revoke a provider; cascades Course deactivation, Completion invalidation, cycle recompute and revert."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: Provider
    side_effects:
      - "DEACTIVATE all ACTIVE Courses"
      - "INVALIDATE all VERIFIED Completions on those courses"
      - "recompute affected RenewalCycle earned hours"
      - "revert REQUIREMENTS_MET cycles to OPEN where requirement no longer met"
      - "increments Provider.version by 1"

  # ---- Course ----
  - method: POST
    path: "/courses"
    description: "Create a course under a provider."
    roles: [Provider, BoardAdmin]
    code: 201
    input: [provider_id, title, category, credit_hours]
    output: Course
    side_effects: []
  - method: GET
    path: "/courses/{id}"
    description: "Fetch a course."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/providers/{id}/courses"
    description: "List a provider's courses (reverse-reachability for Course.provider_id)."
    roles: [BoardAdmin, Provider, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Course[]
    side_effects: []

  # ---- Licensee ----
  - method: POST
    path: "/licensees"
    description: "Register a licensee."
    roles: [BoardAdmin]
    code: 201
    input: [full_name, home_board_id, license_number]
    output: Licensee
    side_effects: []
  - method: GET
    path: "/licensees/{id}"
    description: "Fetch a licensee (includes computed audit_risk_score)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: Licensee
    side_effects: []
  - method: GET
    path: "/licensees"
    description: "List licensees, filterable by home_board_id (reverse-reachability for Licensee.home_board_id)."
    roles: [BoardAdmin, Auditor]
    code: 200
    input: ["home_board_id?", "limit?", "offset?"]
    output: Licensee[]
    side_effects: []

  # ---- RenewalCycle ----
  - method: POST
    path: "/renewal-cycles"
    description: "Open a renewal cycle for a licensee on a board (cycle_end computed; overlap and carryover checks)."
    roles: [BoardAdmin, Licensee]
    code: 201
    input: [licensee_id, board_id, cycle_start, "carryover_in_hours?"]
    output: RenewalCycle
    side_effects: ["compute cycle_end", "seed earned-hour fields from carryover_in_hours"]
  - method: GET
    path: "/renewal-cycles/{id}"
    description: "Fetch a renewal cycle (computed earned-hours and reminder_status)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: RenewalCycle
    side_effects: ["recompute reminder_status against current clock"]
  - method: GET
    path: "/renewal-cycles"
    description: "List renewal cycles, filterable by board_id (reverse-reachability for RenewalCycle.board_id)."
    roles: [BoardAdmin, Auditor]
    code: 200
    input: ["board_id?", "licensee_id?", "limit?", "offset?"]
    output: RenewalCycle[]
    side_effects: []
  - method: GET
    path: "/licensees/{id}/renewal-cycles"
    description: "List a licensee's renewal cycles (reverse-reachability for RenewalCycle.licensee_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: RenewalCycle[]
    side_effects: []
  - method: GET
    path: "/renewal-cycles/{id}/reminder"
    description: "Computed read of the deadline reminder state for a cycle."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: RenewalCycle
    side_effects: ["recompute reminder_status against current clock"]
  - method: POST
    path: "/renewal-cycles/{id}/renew"
    description: "Renew a cycle that meets requirements; issues a Certificate. OCC-guarded."
    roles: [Licensee]
    code: 200
    input: [expected_renewal_cycle_version]
    output: RenewalCycle
    side_effects:
      - "issue Certificate (serial assigned)"
      - "finalize carryover_out_hours"
      - "increments RenewalCycle.version by 1"

  # ---- Completion ----
  - method: POST
    path: "/completions"
    description: "Log a course completion against a cycle (snapshots awarded_hours/category; window check)."
    roles: [Licensee, BoardAdmin]
    code: 201
    input: [licensee_id, course_id, cycle_id, completed_at]
    output: Completion
    side_effects: ["snapshot awarded_hours/category", "set is_late", "recompute cycle provisional_earned_hours"]
  - method: GET
    path: "/completions/{id}"
    description: "Fetch a completion."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: Completion
    side_effects: []
  - method: GET
    path: "/completions"
    description: "List completions, filterable by licensee_id / course_id (reverse-reachability for Completion.licensee_id and Completion.course_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["licensee_id?", "course_id?", "cycle_id?", "limit?", "offset?"]
    output: Completion[]
    side_effects: []
  - method: GET
    path: "/renewal-cycles/{id}/completions"
    description: "List a cycle's completions (reverse-reachability for Completion.cycle_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Completion[]
    side_effects: []
  - method: POST
    path: "/completions/{id}/verify"
    description: "Verify a pending completion (provider/window/cycle gates; recompute and possible bubble-up)."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: Completion
    side_effects: ["recompute cycle earned hours", "possible cycle OPEN->REQUIREMENTS_MET + carryover compute"]
  - method: POST
    path: "/completions/{id}/reject"
    description: "Reject a pending completion (recompute provisional; recompute intake audit_risk_score)."
    roles: [BoardAdmin]
    code: 200
    input: ["reason?"]
    output: Completion
    side_effects: ["recompute cycle provisional hours", "recompute Licensee.audit_risk_score (intake)"]
  - method: POST
    path: "/completions/{id}/resubmit"
    description: "Resubmit a rejected completion (back to PENDING_VERIFICATION)."
    roles: [Licensee]
    code: 200
    input: []
    output: Completion
    side_effects: ["recompute cycle provisional hours"]

  # ---- Certificate ----
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a certificate."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/renewal-cycles/{id}/certificate"
    description: "List the certificate(s) issued for a cycle (reverse-reachability for Certificate.cycle_id; 0 or 1)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  # ---- Audit ----
  - method: POST
    path: "/audits"
    description: "Initiate an audit against a cycle (cooldown + single-open checks; cycle -> AUDIT_HOLD)."
    roles: [BoardAdmin]
    code: 201
    input: [cycle_id]
    output: Audit
    side_effects: ["record initiated_by_user_id", "cycle OPEN/REQUIREMENTS_MET -> AUDIT_HOLD"]
  - method: GET
    path: "/audits/{id}"
    description: "Fetch an audit."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: GET
    path: "/audits"
    description: "List audits, filterable by licensee_id (reverse-reachability for Audit.licensee_id)."
    roles: [BoardAdmin, Auditor]
    code: 200
    input: ["licensee_id?", "cycle_id?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/renewal-cycles/{id}/audits"
    description: "List a cycle's audits (reverse-reachability for Audit.cycle_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: POST
    path: "/audits/{id}/request-attestation"
    description: "Move an audit to ATTESTATION_PENDING (from INITIATED or UNDER_REVIEW)."
    roles: [BoardAdmin, Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/audits/{id}/attestations"
    description: "Licensee submits an attestation (audit ATTESTATION_PENDING -> UNDER_REVIEW; recompute review_final audit_risk_score)."
    roles: [Licensee]
    code: 201
    input: [statement, attested_hours]
    output: Attestation
    side_effects: ["audit -> UNDER_REVIEW", "recompute Licensee.audit_risk_score (review_final)"]
  - method: GET
    path: "/audits/{id}/attestations"
    description: "List an audit's attestations (reverse-reachability for Attestation.audit_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Attestation[]
    side_effects: []
  - method: POST
    path: "/audits/{id}/decide"
    description: "Auditor decides PASS/FAIL (segregation of duties; attestation match); bubbles up to the cycle."
    roles: [Auditor]
    code: 200
    input: [decision]
    output: Audit
    side_effects: ["set decided_by_user_id/closed_at", "cycle AUDIT_HOLD -> REQUIREMENTS_MET/OPEN/LAPSED"]

  # ---- ReciprocityGrant ----
  - method: POST
    path: "/reciprocity-grants"
    description: "Request a reciprocity grant against a target cycle."
    roles: [Licensee, BoardAdmin]
    code: 201
    input: [licensee_id, target_cycle_id, source_jurisdiction_code, category, credit_hours]
    output: ReciprocityGrant
    side_effects: []
  - method: GET
    path: "/reciprocity-grants/{id}"
    description: "Fetch a reciprocity grant."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: []
    output: ReciprocityGrant
    side_effects: []
  - method: GET
    path: "/reciprocity-grants"
    description: "List reciprocity grants, filterable by licensee_id (reverse-reachability for ReciprocityGrant.licensee_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["licensee_id?", "limit?", "offset?"]
    output: ReciprocityGrant[]
    side_effects: []
  - method: GET
    path: "/renewal-cycles/{id}/reciprocity-grants"
    description: "List a cycle's reciprocity grants (reverse-reachability for ReciprocityGrant.target_cycle_id)."
    roles: [BoardAdmin, Licensee, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ReciprocityGrant[]
    side_effects: []
  - method: POST
    path: "/reciprocity-grants/{id}/approve"
    description: "Approve a reciprocity grant (adds reciprocity_hours, recompute, possible bubble-up)."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: ReciprocityGrant
    side_effects: ["add reciprocity_hours to target cycle", "recompute cycle earned hours", "possible OPEN->REQUIREMENTS_MET"]
  - method: POST
    path: "/reciprocity-grants/{id}/deny"
    description: "Deny a requested reciprocity grant."
    roles: [BoardAdmin]
    code: 200
    input: ["reason?"]
    output: ReciprocityGrant
    side_effects: []
  - method: POST
    path: "/reciprocity-grants/{id}/revoke"
    description: "Revoke an approved reciprocity grant (compensation: subtract reciprocity_hours, recompute, possible revert)."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: ReciprocityGrant
    side_effects: ["subtract reciprocity_hours from target cycle", "recompute cycle earned hours", "possible REQUIREMENTS_MET->OPEN"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock used by reminder/cooldown/window logic."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not permitted for this operation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not exist."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed actor attempted to act on a resource it does not own."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_PROVIDER_NOT_ACCREDITED
    http: 409
    condition: "Completion verify attempted while the course's provider is not ACCREDITED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Audit decider X-User-ID equals the initiating BoardAdmin's X-User-ID."
  - id: ERR_COMPLETION_OUT_OF_WINDOW
    http: 422
    condition: "completed_at outside the cycle window or, at verify, outside the provider accreditation window."
  - id: ERR_CYCLE_OVERLAP
    http: 409
    condition: "New renewal cycle overlaps an existing cycle for the same licensee+board (closed-open semantics)."
  - id: ERR_AUDIT_COOLDOWN_ACTIVE
    http: 409
    condition: "New audit initiated before the prior audit's closed_at + board.audit_cooldown_days has elapsed."
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "A non-terminal audit already exists for this cycle."
  - id: ERR_SAME_JURISDICTION
    http: 422
    condition: "Reciprocity source_jurisdiction_code equals the target cycle board's jurisdiction_code."
  - id: ERR_REQUIREMENTS_NOT_MET
    http: 409
    condition: "Renew/certificate attempted while VERIFIED hours do not satisfy requirement_satisfaction."
  - id: ERR_CARRYOVER_EXCEEDS_CAP
    http: 422
    condition: "carryover_in_hours exceeds the prior cycle's carryover_out_hours or the board cap."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_renewal_cycle_version does not match the cycle's current version."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, or non-positive credit_hours."
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "Numeric field out of allowed range (negative hours, min_hours sum exceeds board total, etc.)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BoardAdmin
    description: "Board operator: manages boards/requirements, accredits and revokes providers, verifies/rejects completions, initiates audits, approves/denies/revokes reciprocity."
    identity: opaque
    exclusive_operations:
      - "POST /license-boards"
      - "POST /license-boards/{id}/requirements"
      - "POST /providers"
      - "POST /providers/{id}/accredit"
      - "POST /providers/{id}/suspend"
      - "POST /providers/{id}/reinstate"
      - "POST /providers/{id}/revoke"
      - "POST /licensees"
      - "POST /completions/{id}/verify"
      - "POST /completions/{id}/reject"
      - "POST /audits"
      - "POST /reciprocity-grants/{id}/approve"
      - "POST /reciprocity-grants/{id}/deny"
      - "POST /reciprocity-grants/{id}/revoke"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /courses (with Provider)"
      - "POST /renewal-cycles (with Licensee)"
      - "POST /completions (with Licensee)"
      - "POST /reciprocity-grants (with Licensee)"
      - "POST /audits/{id}/request-attestation (with Auditor)"
      - "GET reads"

  - name: Provider
    description: "Accredited CE provider; owns and manages its Courses."
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /courses (with BoardAdmin, must own provider_id)"
      - "GET reads"

  - name: Licensee
    description: "Licensed professional; logs completions, resubmits, requests reciprocity, attests, and renews."
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /completions/{id}/resubmit"
      - "POST /renewal-cycles/{id}/renew"
      - "POST /audits/{id}/attestations"
    shared_operations:
      - "POST /renewal-cycles (with BoardAdmin, own licensee_id)"
      - "POST /completions (with BoardAdmin, own licensee_id)"
      - "POST /reciprocity-grants (with BoardAdmin, own licensee_id)"
      - "GET reads on own resources"

  - name: Auditor
    description: "Independent auditor; reviews and decides audits. Must not be the BoardAdmin who initiated the audit (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /audits/{id}/decide"
    shared_operations:
      - "POST /audits/{id}/request-attestation (with BoardAdmin)"
      - "GET reads"
