        claim_type: computed_read
        grounds: [calculations.window_slot_capacity, entities.FieldDayWindow.fields.booked_slots]
        distinguishing_aspect: "The availability calendar composes window, field, and projection data into one read: after a party-2 admission the row shows booked_slots 2 and projected_remaining_oz 1000."
