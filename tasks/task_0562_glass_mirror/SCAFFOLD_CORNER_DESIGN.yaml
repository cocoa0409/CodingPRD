# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: create_contractor_account_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.ContractorAccount, "endpoints POST /contractor-accounts"]
        distinguishing_aspect: "POST with company_name/tier/credit_limit_cents -> 201; status=ACTIVE, credit_used_cents=0, version=1, server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme Glazing", tier: "GOLD", credit_limit_cents: 5000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, v: $.data.version, used: $.data.credit_used_cents, st: $.data.status }
          assert:
            - "response_type == object; data.id is a UUID with no prefix"
            - "ContractorAccount.${acct_id}.status == ACTIVE"
            - "ContractorAccount.${acct_id}.credit_used_cents == 0"
            - "ContractorAccount.${acct_id}.version == 1"

      - name: get_contractor_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ContractorAccount, "endpoints GET /contractor-accounts/{id}"]
        distinguishing_aspect: "GET with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contractor-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_line_item_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.LineItem, "validations[priority=4]"]
        distinguishing_aspect: "POST line-items without glass_type -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A DRAFT quote."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: create_line_item_invalid_thickness_returns_400
        claim_type: Type Constraints
        grounds: [entities.LineItem.fields.thickness_mm, "validations[priority=4]"]
        distinguishing_aspect: "thickness_mm=8 (not in {6,10,12}) -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A DRAFT quote."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 8, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_quote_unknown_account_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Quote.fields.contractor_account_id, "validations[priority=3]"]
        distinguishing_aspect: "POST /quotes with a non-existent contractor_account_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /quotes"
              payload: { contractor_account_id: "11111111-1111-4111-8111-111111111111" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: computed_line_prices_ignore_absent_client_price
        claim_type: Computed Fields
        grounds: [entities.LineItem.fields.unit_price_cents, calculations.line_item_pricing]
        excluded_because:
          difficulty_instance: "combinatorial_formula / line_item_pricing_nonlinear_rate_thickness_edge_area"
          rationale: "Computed unit_price_cents correctness is asserted by the named §1.8 pricing instance."

  # ==========================================================================
  - section: state_machines
    instances:
      - name: send_quote_from_ordered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.DRAFT_to_SENT, "validations[priority=5]"]
        distinguishing_aspect: "Sending an already-ORDERED quote -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A quote accepted (ORDERED)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: revise_quote_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.SENT_to_DRAFT, "validations[priority=5]"]
        distinguishing_aspect: "Revising a DRAFT (never-sent) quote -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT quote (never sent)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/revise"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: accept_quote_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.SENT_to_ORDERED, "validations[priority=5]"]
        distinguishing_aspect: "Accepting a DRAFT (unsent) quote -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT quote with a line, never sent."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: complete_batch_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TemperingBatch.SCHEDULED_to_DONE, "validations[priority=5]"]
        distinguishing_aspect: "Completing an already-DONE batch -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A job with a completed batch (DONE)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
          trigger:
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: review_claim_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ClaimReport.FILED_to_REJECTED, "validations[priority=5]"]
        distinguishing_aspect: "Reviewing an already-REJECTED claim -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A FILED claim on an installed line, then REJECTED."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /install-crews"
              payload: { name: "Crew1", certified_products: ["SHOWER_ENCLOSURE"] }
              as: ShopAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T12:00:00Z" }
              as: Scheduler
              captures: { appt_id: $.data.id }
            - call: "POST /install-appointments/${appt_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /claim-reports"
              payload: { job_id: "${job_id}", line_item_id: "${li_id}", claim_type: "BREAKAGE", cause: "hairline", billable_to_contractor: false }
              as: Scheduler
              captures: { claim_id: $.data.id }
            - call: "POST /claim-reports/${claim_id}/review"
              payload: { decision: "REJECT" }
              as: ShopAdmin
          trigger:
            - call: "POST /claim-reports/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: job_parallel_axes_bubble_up
        claim_type: Side Effect Execution
        grounds: [state_machines.Job.fabrication_status_IN_FABRICATION_to_COMPLETE]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / job_parallel_fabrication_and_install_axes"
          rationale: "Fabrication->COMPLETE bubbling install to READY is asserted by the named §1.8 instance."

  # ==========================================================================
  - section: validations
    instances:
      - name: accept_expired_quote_returns_quote_expired
        claim_type: Temporal validation
        grounds: ["validations[priority=8]", "errors[ERR_QUOTE_EXPIRED]", "endpoints POST /_clock/set_current_utc"]
        distinguishing_aspect: "Quote created at default clock (valid_until 2026-05-31); accepting after clock advanced to 2026-07-01 -> ERR_QUOTE_EXPIRED (409)."
        test_recipe:
          setup: ["A SENT quote with valid_until 2026-05-31; clock advanced past it."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "TABLETOP", glass_type: "ANNEALED", thickness_mm: 12, width_in: 40, height_in: 20, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_QUOTE_EXPIRED"

      - name: accept_over_credit_limit_returns_credit_exceeded
        claim_type: Aggregate validation
        grounds: ["validations[priority=10]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Account credit_limit_cents=10000 < quote total 33500 -> accept fails ERR_CREDIT_LIMIT_EXCEEDED (409)."
        test_recipe:
          setup: ["Account with credit_limit_cents=10000; SENT quote total 33500."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "WALK_IN", credit_limit_cents: 10000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1, edge_work: "POLISHED" }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: send_empty_quote_returns_quote_empty
        claim_type: Violation to Error
        grounds: [state_machines.Quote.DRAFT_to_SENT, "errors[ERR_QUOTE_EMPTY]"]
        distinguishing_aspect: "Sending a quote with zero line items -> ERR_QUOTE_EMPTY (422)."
        test_recipe:
          setup: ["A DRAFT quote with no lines."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_QUOTE_EMPTY"

      - name: batch_capacity_exceeded_returns_error
        claim_type: Aggregate validation
        grounds: ["validations[priority=9]", "errors[ERR_BATCH_CAPACITY_EXCEEDED]", calculations.batch_total_sqft]
        distinguishing_aspect: "Job total_sqft 90 > furnace max_batch_sqft 50 -> ERR_BATCH_CAPACITY_EXCEEDED (422)."
        test_recipe:
          setup: ["A job with a 90 sqft line; furnace max_batch_sqft=50."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 60, height_in: 72, quantity: 3 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "Small", max_batch_sqft: 50, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
          trigger:
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BATCH_CAPACITY_EXCEEDED"

      - name: install_crew_not_certified_returns_error
        claim_type: Conditional validation
        grounds: ["validations[priority=7]", "errors[ERR_CREW_NOT_CERTIFIED]"]
        distinguishing_aspect: "Crew certified only for STOREFRONT scheduling a SHOWER_ENCLOSURE job -> ERR_CREW_NOT_CERTIFIED (409)."
        test_recipe:
          setup: ["A fabrication-COMPLETE SHOWER_ENCLOSURE job; crew certified for STOREFRONT only."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "SHOWER_ENCLOSURE", glass_type: "TEMPERED", thickness_mm: 10, width_in: 30, height_in: 72, quantity: 1 }
              as: Estimator
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
            - call: "POST /tempering-furnaces"
              payload: { name: "F1", max_batch_sqft: 500, cooldown_minutes: 60 }
              as: ShopAdmin
              captures: { furnace_id: $.data.id }
            - call: "POST /tempering-batches"
              payload: { job_id: "${job_id}", furnace_id: "${furnace_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Fabricator
              captures: { batch_id: $.data.id }
            - call: "POST /tempering-batches/${batch_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /install-crews"
              payload: { name: "StorefrontCrew", certified_products: ["STOREFRONT"] }
              as: ShopAdmin
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /install-appointments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T12:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREW_NOT_CERTIFIED"

      - name: warranty_claim_after_window_returns_expired
        claim_type: Temporal validation
        grounds: ["validations[priority=12]", "errors[ERR_CLAIM_WINDOW_EXPIRED]", "endpoints POST /_clock/set_current_utc"]
        distinguishing_aspect: "WARRANTY_DEFECT claim filed after clock advanced beyond WARRANTY_DAYS (365) from install -> ERR_CLAIM_WINDOW_EXPIRED (409)."
        test_recipe:
          setup: ["An installed line; clock advanced to 2027-07-01 (> install + 365 days)."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
