            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC002202", device_type: "SOFTPHONE", nomadic: false }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev2_id: $.data.id }
          assert:
            - "Device.${dev1_id}.registration_prompt_deadline == 2026-08-04T00:00:00Z and registration_status == PENDING_REGISTRATION"
            - "before the trigger, Account.${acct_id}.e911_compliance_posture == AT_RISK and Device.${dev1_id}.calling_status == UNRESTRICTED"
            - "after the trigger, Account.${acct_id}.e911_compliance_posture == BLOCKED"
            - "after the trigger, Device.${dev1_id}.calling_status == FULL_BLOCKED and Device.${dev2_id}.calling_status == FULL_BLOCKED"
            - "Device.${dev2_id}.assigned_number_id == null and registration_prompt_deadline == 2026-08-08T00:00:00Z"

      - name: port_request_cyclic_shape_returns_to_submitted_after_mismatch
        claim_type: cyclic
        grounds:
          - state_machines.PortRequest.CSR_MISMATCH_to_SUBMITTED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / port_request_cycles_csr_mismatch_back_to_submitted_then_validates
          rationale: "The named §1.8 instance already drives SUBMITTED -> CSR_MISMATCH -> SUBMITTED -> VALIDATED and asserts the resubmission_count and snapshot-supersession bookkeeping of the loop."

      - name: device_parallel_state_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Device
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / device_registration_and_calling_dimensions_advance_independently
          rationale: "The named §1.8 instance asserts registration_status and calling_status moving on independent triggers with the combined state checked after each hop."

      - name: port_reject_cascade_reaches_slot_bridge_reservation_and_number
        claim_type: cascade_down
        grounds:
          - state_machines.PortRequest.SCHEDULED_to_REJECTED
          - endpoints[POST /voip/port-requests/{id}/reject]
        excluded_because:
          difficulty_instance: transitive_cascade / port_reject_cascades_slot_bridge_reservation_number_and_block_census
          rationale: "The named §1.8 instance walks the full four-level cascade end to end and asserts each hop's terminal fields."

      - name: reserve_then_release_leaves_no_census_drift
        claim_type: compensation
        grounds:
          - state_machines.NumberReservation.HELD_to_RELEASED
          - calculations.number_inventory_census
        excluded_because:
          difficulty_instance: compensating_invariant / reserve_then_release_restores_block_census_counts_exactly
          rationale: "The named §1.8 instance asserts the pre- and post-compensation census vectors and the retained RELEASED row."

      - name: schedule_is_guarded_by_the_cutover_slots_own_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.PortRequest.VALIDATED_to_SCHEDULED
          - validations[priority=14]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / second_port_request_cannot_schedule_a_slot_the_first_already_booked
          rationale: "The named §1.8 instance asserts the cross-entity guard (slot must be OPEN) with the port request itself fully eligible."

  - section: calculations
    instances:
      - name: relaxed_csr_policy_matches_at_exactly_the_85_point_threshold
        claim_type: weighted_scoring
        grounds:
          - calculations.csr_match_evaluation
          - entities.Carrier.fields.csr_match_policy
          - entities.CarrierAccountSnapshot.fields.match_points
        distinguishing_aspect: "A snapshot disagreeing only on billing_name loses exactly its 15-point weight, scoring 100 - 15 = 85 against the RELAXED threshold of 85, so match_status is MATCHED with mismatch_fields ['billing_name'] - equality with the threshold counts as a match."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; RELAXED carrier with foc_business_days 2"
            - "one SUBMITTED port request whose claimed_billing_name will disagree with the CSR"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1015", billing_name: "PEONY AG", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Peony Legacy", ocn: "PL13", csr_match_policy: "RELAXED", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551801"], claimed_account_number: "CSR-1015", claimed_pin: "1015", claimed_billing_name: "PEONY AG", claimed_address_line1: "15 PEONY PL", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1015", pin_on_file: "1015", billing_name_on_file: "PEONY HOLDINGS", address_line1_on_file: "15 PEONY PL", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap_id: $.data.id }
          assert:
            - "CarrierAccountSnapshot.${snap_id}.match_points == 85 and threshold_applied == 85"
            - "CarrierAccountSnapshot.${snap_id}.match_status == MATCHED and mismatch_fields == ['billing_name']"
            - "PortRequest.${pr_id}.status == VALIDATED and last_match_points == 85"
            - "PortRequest.${pr_id}.last_mismatch_fields == ['billing_name']"

      - name: earliest_cutover_floor_counts_only_business_days_across_a_weekend
        claim_type: chronological
        grounds:
          - calculations.earliest_cutover_floor
          - entities.Carrier.fields.foc_business_days
          - entities.PortRequest.fields.earliest_cutover_at
        distinguishing_aspect: "Validated on Thursday 2026-08-06 with foc_business_days 3, the floor counts Friday 2026-08-07, Monday 2026-08-10 and Tuesday 2026-08-11, skipping the weekend entirely, so earliest_cutover_at == 2026-08-11T00:00:00Z rather than 2026-08-09T00:00:00Z."
        test_recipe:
          setup:
            - "clock at 2026-08-06T15:30:00Z, a Thursday; STRICT carrier with foc_business_days 3"
            - "one SUBMITTED port request whose CSR will match exactly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T15:30:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1016", billing_name: "QUINCE BV", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Quince Legacy", ocn: "QL14", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551802"], claimed_account_number: "CSR-1016", claimed_pin: "1016", claimed_billing_name: "QUINCE BV", claimed_address_line1: "16 QUINCE RD", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1016", pin_on_file: "1016", billing_name_on_file: "QUINCE BV", address_line1_on_file: "16 QUINCE RD", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
          assert:
            - "PortRequest.${pr_id}.status == VALIDATED and validated_at == 2026-08-06T15:30:00Z"
            - "PortRequest.${pr_id}.earliest_cutover_at == 2026-08-11T00:00:00Z"
            - "PortRequest.${pr_id}.last_match_points == 100"

      - name: same_postal_network_report_is_same_location_and_keeps_registration_verified
        claim_type: constraint_propagation
        grounds:
          - calculations.relocation_drift_class
          - endpoints[POST /voip/devices/{id}/network-reports]
