  - section: rbac
    instances:
      - name: agency_cannot_issue_policy
        claim_type: rbac_denied
        grounds: [roles, endpoints]
        distinguishing_aspect: "Policy creation is an Underwriter exclusive_operation; an Agency calling POST /title/orders/{id}/policies is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["An order with an ISSUED commitment."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C28", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED, http 403"

      - name: agency_cannot_act_on_foreign_order
        claim_type: rbac_denied
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "An entity_backed Agency depositing on an order owned by a DIFFERENT agency (Order.agency_id != X-User-ID) is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Two agencies A and B; an order owned by A."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Agency A", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_a: $.data.id }
            - call: "POST /title/agencies"
              payload: { name: "Agency B", remit_split_pct: 0.80 }
              as: Underwriter
              captures: { ag_b: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_a}", parcel_id: "APN-C29", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_a}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 1000, source_ref: "WIRE-X" }
              as: Agency
              as_user_id: "${ag_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED, http 403"

      - name: missing_role_header_returns_unauthenticated
        claim_type: rbac_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/absent X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["No setup."]
          setup_api_calls: []
          trigger:
            - call: "POST /title/agencies"
              payload: { name: "Ghost", remit_split_pct: 0.5 }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED, http 401"

      - name: titleofficer_cannot_post_deposit_transition
        claim_type: rbac_denied
        grounds: [roles, endpoints]
        distinguishing_aspect: "Posting a deposit (RECEIVED->POSTED) is an Underwriter exclusive; a TitleOfficer calling it is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["An order with a RECEIVED deposit."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C30", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 100000, source_ref: "WIRE-IN-9" }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "POSTED" }
              as: TitleOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED, http 403"

