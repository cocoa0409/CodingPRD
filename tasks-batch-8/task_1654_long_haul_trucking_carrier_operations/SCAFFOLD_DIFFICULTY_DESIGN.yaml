      - name: fuel_rate_closed_window_touch_conflicts
        grounds:
          - validations[priority=9]
          - entities.StateFuelRate.fields.effective_to
          - errors[ERR_FUEL_RATE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          CLOSED-interval semantics on resource StateFuelRate (different resource and
          different interval geometry than the half-open trip window): a new TX window
          whose effective_from EQUALS the existing window's effective_to touches the
          closed interval -> conflict; one second later is disjoint -> created.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; existing TX window [2026-01-01T00:00:00Z, 2026-12-31T00:00:00Z]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /state-fuel-rates", payload: { state_code: "TX", tax_cents_per_gallon: 20, avg_pump_price_cents: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: FleetAdmin, captures: { rate1: $.data.id } }
          trigger:
            - { call: "POST /state-fuel-rates", payload: { state_code: "TX", tax_cents_per_gallon: 22, avg_pump_price_cents: 410, effective_from: "2026-12-31T00:00:00Z" }, as: FleetAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "TX", tax_cents_per_gallon: 22, avg_pump_price_cents: 410, effective_from: "2026-12-31T00:00:01Z" }, as: FleetAdmin, captures: { rate2: $.data.id } }
          assert:
            - "touching the closed window (from == existing effective_to) REJECTED: captured ${err} == ERR_FUEL_RATE_WINDOW_OVERLAP"
            - "one second later ACCEPTED: ${rate2} present (closed intervals disjoint)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_reissue_conserves_total
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.AccessorialCharge.APPROVED_to_BILLED
          - state_machines.AccessorialCharge.BILLED_to_APPROVED
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY: issue -> void -> recreate -> issue leaves
          Invoice.total_cents == linehaul 250000 + FSC 20769 + BILLED accessorials 6000
          == 276769 bit-identical across the cycle, and the compensating void restores
          accessorial APPROVED + load DELIVERED + total_accessorial_cents 0.
        test_recipe:
          setup:
            - "F1 full chain through DELIVERED with 6000 detention, charge SUBMITTED+APPROVED, invoice created and ISSUED (total 276769)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-16", full_name: "D Sixteen", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-20", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T21:00:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T07:50:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T10:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-03T17:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-03T21:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "GET /loads/${load}/accessorials", payload: {}, as: Dispatcher, captures: { acc: "$.data[0].id" } }
            - { call: "POST /accessorials/${acc}/submit", payload: {}, as: Dispatcher }
            - { call: "POST /accessorials/${acc}/approve", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/invoice", payload: {}, as: LoadPlanner, captures: { inv1: $.data.id } }
            - { call: "POST /invoices/${inv1}/issue", payload: {}, as: LoadPlanner, captures: { total1: $.data.total_cents } }
          trigger:
            - { call: "POST /invoices/${inv1}/void", payload: {}, as: LoadPlanner, captures: { void_status: $.data.status } }
            - { call: "GET /accessorials/${acc}", payload: {}, as: LoadPlanner, captures: { acc_status_mid: $.data.status } }
            - { call: "GET /loads/${load}", payload: {}, as: LoadPlanner, captures: { load_mid: $.data.status, acc_total_mid: $.data.total_accessorial_cents, fm_mid: $.data.final_margin_cents } }
            - { call: "POST /loads/${load}/invoice", payload: {}, as: LoadPlanner, captures: { inv2: $.data.id } }
            - { call: "POST /invoices/${inv2}/issue", payload: {}, as: LoadPlanner, captures: { total2: $.data.total_cents } }
          assert:
            - "first issue: ${total1} == 276769 (250000 + 20769 + 6000)"
            - "compensating void: ${void_status} == VOID, ${acc_status_mid} == APPROVED, ${load_mid} == DELIVERED, ${acc_total_mid} == 0, ${fm_mid} == null"
            - "invariant: re-issue conserves the billed total exactly: ${total2} == 276769 == ${total1}"

      - name: safety_event_void_restores_score
        grounds:
          - calculations.driver_safety_score
          - entities.SafetyEvent.fields.voided
          - errors[ERR_SAFETY_EVENT_NOT_VOIDABLE]
        distinguishing_aspect: |
          Conserved quantity is a SCORE (different type than money): adding a severity-10
          event drops driver.safety_score 100 -> 90, and its compensating void restores
          EXACTLY 100 (no drift), because voided events are excluded from the decay sum.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; driver with score 100"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-17", full_name: "D Seventeen", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id, score0: $.data.safety_score } }
          trigger:
            - { call: "POST /drivers/${drv}/safety-events", payload: { kind: "INSPECTION_VIOLATION", severity_points: 10, occurred_at: "2026-07-15T00:00:00Z" }, as: SafetyOfficer, captures: { sev: $.data.id } }
            - { call: "GET /drivers/${drv}", payload: {}, as: SafetyOfficer, captures: { score1: $.data.safety_score } }
            - { call: "POST /safety-events/${sev}/void", payload: {}, as: SafetyOfficer }
            - { call: "GET /drivers/${drv}", payload: {}, as: SafetyOfficer, captures: { score2: $.data.safety_score } }
            - { call: "POST /safety-events/${sev}/void", payload: {}, as: SafetyOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${score0} == 100; after add ${score1} == 90 (10 * 1.0 full weight)"
            - "invariant: add+void conserves the score: ${score2} == 100 == ${score0}"
            - "double void rejected: captured ${err} == ERR_SAFETY_EVENT_NOT_VOIDABLE"
