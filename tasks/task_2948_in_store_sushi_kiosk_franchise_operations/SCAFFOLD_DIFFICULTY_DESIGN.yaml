  - rule_id: non_linear_state_machine
    instances:
      - name: kiosk_parallel_operational_and_sanitation_dimensions
        grounds:
          - "state_machines.Kiosk.PROVISIONING_to_OPERATING"
          - "state_machines.Kiosk.CLEAR_to_WATCH"
          - "state_machines.Kiosk.WATCH_to_CLEAR"
          - "calculations.kiosk_risk_points"
          - "entities.Kiosk.fields.operational_state"
          - "entities.Kiosk.fields.sanitation_posture"
        distinguishing_aspect: |
          Kiosk carries TWO INDEPENDENT state dimensions. The audit lifecycle drives sanitation_posture
          CLEAR -> WATCH -> CLEAR without ever touching operational_state, which stays OPERATING throughout,
          so the pair is not reducible to a single linear chain.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "a commissioned kiosk in operational_state OPERATING and sanitation_posture CLEAR"
            - "an audit opened by user qa-opener-1 carrying two MAJOR findings, submitted so the kiosk's risk_points is 8 and its sanitation_posture is WATCH"
            - "both findings already CORRECTED and reverification requested, so round_count is 1 and the posture is still WATCH because CORRECTED findings keep their risk"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
