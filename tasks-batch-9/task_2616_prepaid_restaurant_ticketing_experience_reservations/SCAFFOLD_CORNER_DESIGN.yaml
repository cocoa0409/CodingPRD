      - name: tiered_pricing_scarcity_and_clamp_boundaries
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: scarcity_step_exact_8000_sell_through_edge
          rationale: "§1.8 already drives sell_through to exactly 8000 bp (16 of 20 seats) and to 7500 bp, and its sibling price_quote_nested_clamp_and_scarcity_step_ladder walks the floor-before-cap nesting at SAT/PEAK 18125 bp. Repeating the tier boundary walk here would duplicate the same two ladders on the same constants."

      - name: threshold_forfeiture_ladder_band_edges
        claim_type: threshold
        excluded_because:
          difficulty_instance: forfeiture_ladder_exact_72_hour_band_edge
          rationale: "§1.8 cancels at exactly 72.0 hours, at 72 hours minus one minute and at 24.0 hours on both the STANDARD and STRICT ladders, covering the threshold-1 / threshold / threshold+1 triple for cancellation_settlement, and rebook_fee_band_keyed_on_forfeiture_amount covers the REBOOK_FEE_BANDS edges 0, 9999 and 39999."

      - name: variant_divergence_forfeiture_basis
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: cancellation_settlement_deposit_basis_vs_full_ticket_basis
          rationale: "§1.8 runs two packages identical except forfeiture_basis against the same paid amount and asserts the full divergence (retained 6292 with a 5291 refund versus retention saturating at 11583 with a 0 refund, PARTIALLY_REFUNDED versus FORFEITED)."

      - name: variant_selection_waitlist_policy_picks_the_ranking_key
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: waitlist_priority_score_fair_queue_vs_yield_weighted
          rationale: "§1.8 puts the same two WAITING entries against the same released seat pool under FAIR_QUEUE and under YIELD_WEIGHTED and shows the promotion flipping between them, which is exactly the variant-selection claim; this file only asserts that the score is still persisted under FAIR_QUEUE."

      - name: reconciliation_forfeiture_reversal_delta_applied_to_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: reservation_cash_ledger_conserved_through_forfeiture_reversal
          rationale: "The only mid-life settlement switch in this domain is a refund exception reversing part of a forfeiture, and §1.8 already asserts the FORFEITURE_REVERSAL plus REFUND pair, the signed sum staying at 0 and the forfeited/refunded counters swapping the delta."

      - name: projection_ledger_replay_produces_current_reservation_counters
        claim_type: projection
        excluded_because:
          difficulty_instance: reservation_cash_ledger_conserved_through_forfeiture_reversal
          rationale: "The same §1.8 instance replays the reservation's whole immutable row set (DEPOSIT_CHARGE, FORFEITURE, REFUND, FORFEITURE_REVERSAL, REFUND) and asserts both invariants I1 and I2 against the derived amount_paid / refunded / forfeited counters, which is the projection claim end to end."

      - name: interval_merge_table_turn_adjacency_and_overlap
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: table_occupancy_half_open_adjacency_allowed
          rationale: "§1.8 accepts an assignment starting exactly at another turn's end instant and rejects the same assignment one minute earlier, covering the merged / adjacent / disjoint triple for table_turn_occupancy on a single table."

      - name: interval_merge_kitchen_window_closed_endpoints
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: kitchen_line_closed_interval_aggregate_overlap
          rationale: "§1.8 makes two prep windows touch at a single instant and shows the closed-interval semantics aggregating both loads, and kitchen_prep_load_exactly_equals_capacity pins the strict greater-than comparison at load == capacity."

      - name: aggregation_seat_pool_identity_after_every_seat_move
        claim_type: aggregation
        excluded_because:
          difficulty_instance: seat_pool_conserved_across_release_and_cancel
          rationale: "§1.8 walks seats_allocated == sold + held + released + available through a sale, a confirm, a release run, a promotion and a cancel, asserting the identity after each step; the entities and state_machines sections of this file re-assert it only as a by-product."

      - name: aggregation_goodwill_credit_liability_identity
        claim_type: aggregation
        excluded_because:
          difficulty_instance: goodwill_liability_conserved_through_partial_redeem_then_revoke
          rationale: "§1.8 issues, partially redeems and then revokes one credit while asserting issued == redeemed + revoked + remaining and the pinned status precedence at every step, which covers goodwill_credit_balance as an aggregation."

  - section: validations
    instances:

      - name: auth_ladder_missing_auth_headers_unknown_role_then_unauthorized
        claim_type: Priority Ordering
        grounds:
          - validations.priority_1_ERR_MISSING_AUTH_HEADERS
          - validations.priority_2_ERR_UNKNOWN_ROLE
          - validations.priority_3_ERR_UNAUTHORIZED
        distinguishing_aspect: "The first three rows fire in strict order even when a later rule is also violated: no headers on a request with a bogus path id still yields 401 ERR_MISSING_AUTH_HEADERS, an unknown role with a bogus id yields 401 ERR_UNKNOWN_ROLE, and a known-but-wrong role with a malformed body yields 403 ERR_UNAUTHORIZED — never a 404 and never a 400."
        test_recipe:
          setup:
            - "one restaurant and one package exist so that a legitimate call would have something to act on"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Auth House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "GET /restaurants/rst_does_not_exist"
              payload: {}
              as: NONE_NO_HEADERS_SENT
              captures: { e_noauth: $.data.error_id }
            - call: "GET /restaurants/rst_does_not_exist"
              payload: {}
              as: Sommelier
              captures: { e_unknown: $.data.error_id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "not-a-date", meal_period: "BRUNCH", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: Guest
              captures: { e_unauth: $.data.error_id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Sneaky Menu", course_count: 3, base_price_cents: 1000, prepayment_mode: "FULL" }
              as: KitchenLead
              as_user_id: "${r_id}"
              captures: { e_kitchen: $.data.error_id }
          assert:
            - "${e_noauth} == ERR_MISSING_AUTH_HEADERS with HTTP 401, even though the path id does not exist: priority 1 precedes the 404 rows"
            - "${e_unknown} == ERR_UNKNOWN_ROLE with HTTP 401 for the role name Sommelier, which is not one of the five declared roles"
            - "${e_unauth} == ERR_UNAUTHORIZED with HTTP 403 for a Guest calling POST /services, even though the body carries an invalid service_date and an invalid meal_period: priority 3 precedes the priority 7 ERR_VALIDATION row"
            - "${e_kitchen} == ERR_UNAUTHORIZED with HTTP 403: POST /experience-packages is an exclusive RestaurantManager operation and KitchenLead may only ack dietary notes"
            - "no Service and no second ExperiencePackage were created: GET /restaurants/${r_id}/services returns 0 rows and GET /restaurants/${r_id}/experience-packages returns exactly 1 row, the ${pkg_id} row"

      - name: forbidden_resource_owner_guest_cannot_read_another_guests_reservation
        claim_type: Violation → Error
        grounds:
