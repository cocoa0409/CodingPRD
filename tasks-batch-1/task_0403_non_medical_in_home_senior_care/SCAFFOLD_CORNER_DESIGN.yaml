        claim_type: peer_roles
        grounds: [roles.AgencyAdmin, roles.Scheduler, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Scheduler calling POST /caregivers (an AgencyAdmin-exclusive op) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: caregiver_cannot_finalize_invoice
        claim_type: peer_roles
        grounds: [roles.Caregiver, roles.BillingClerk, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Caregiver calling POST /invoices/{id}/finalize (BillingClerk/AgencyAdmin op) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A DRAFT invoice exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: Caregiver
              as_user_id: "${cg}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: missing_auth_header_rejected
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A request with no/blank X-User-Role -> ERR_MISSING_AUTH (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /caregivers"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_AUTH"
            - "HTTP status == 401"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_visits_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /visits?limit=1 returns a paginated array envelope with total_count and has_more reflecting two scheduled visits."
        test_recipe:
          setup: ["Two SCHEDULED visits for the same caregiver/client (different days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA", max_weekly_hours: 50 }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Scheduler
              captures: { v2: $.data.id }
          trigger:
            - call: "GET /visits?caregiver_id=${cg}&limit=1&offset=0"
              payload: {}
              as: Scheduler
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

      - name: list_care_plans_subresource_for_client
        claim_type: Retrieval
        grounds: [endpoints, entities.CarePlan.fields.client_id]
        distinguishing_aspect: "GET /clients/{id}/care-plans returns the CarePlan[] belonging to that client (FK reverse-reachability)."
        test_recipe:
          setup: ["A client with two care plans."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
