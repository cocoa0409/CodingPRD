# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (Coverage Index)
# Hospital Capacity Command Center & Transfer Center
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # 1. Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: facility_create_success_with_defaults
        claim_type: creation_defaults
        grounds: [entities.Facility]
        distinguishing_aspect: "POST /cc/facilities with required fields returns 201; computed counters all 0, diversion_status ACCEPTING, diversion_recommended false, version 1."
        test_recipe:
          setup: ["Clock at default"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /cc/facilities"
              payload: { name: "General", region: "R9" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          assert:
            - "Facility.${fac}.diversion_status == ACCEPTING and diversion_recommended == false"
            - "staffed_beds == 0 and occupied_beds == 0 and held_beds == 0 and available_beds == 0 and boarding_waiters == 0 and active_inbound_transfers == 0"
            - "version == 1 and id is a UUID without any type prefix"
            - "load_score_raw == 0 and load_score_weighted == 0 (staffed == 0 guard)"

      - name: facility_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Facility, "errors[ERR_FACILITY_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns ERR_FACILITY_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cc/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_FACILITY_NOT_FOUND"

      - name: bed_create_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.Bed, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "max_acuity outside the enum is rejected at priority 3 with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Enum Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_9_IMPOSSIBLE", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: admission_missing_required_bed_id_rejected
        claim_type: required_fields
        grounds: [entities.Admission, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required bed_id yields ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Req Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { patient_ref: "PX", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: bed_staffed_and_turnover_defaults_applied
        claim_type: defaults
        grounds: [entities.Bed.fields.staffed, entities.Bed.fields.turnover_minutes]
        distinguishing_aspect: "Omitting staffed and turnover_minutes applies defaults true and 45."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Def Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { bed: $.data.id }
          assert:
            - "Bed.${bed}.staffed == true and turnover_minutes == 45 and status == AVAILABLE"

      - name: transfer_request_computed_and_system_fields_ignored_input_ignored
        claim_type: computed_fields
        grounds: [entities.TransferRequest.fields.status, entities.TransferRequest.fields.consult_count, entities.TransferRequest.fields.intake_coordinator_id]
        distinguishing_aspect: "Client-supplied status/consult_count are ignored; status initializes INTAKE, consult_count 0, intake_coordinator_id taken from X-User-ID."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Sys Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PS1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT", status: "COMPLETED", consult_count: 99 }
              as: TransferCenterCoordinator
              as_user_id: "coord_9"
              captures: { tr: $.data.id }
          assert:
            - "TransferRequest.${tr}.status == INTAKE and consult_count == 0 (client values ignored)"
            - "TransferRequest.${tr}.intake_coordinator_id == coord_9 (from header, not payload)"

      - name: nested_child_under_wrong_parent_returns_child_404
        claim_type: parent_relationships
        grounds: [entities.Bed.fields.facility_id, "errors[ERR_BED_NOT_FOUND]"]
        distinguishing_aspect: "A bed id belonging to facility A referenced under facility B's nested path returns ERR_BED_NOT_FOUND, not cross-facility leakage."
        test_recipe:
          setup: ["Two facilities; bed created under A"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Fac A", region: "R1" }
              as: SystemAdministrator
              captures: { facA: $.data.id }
            - call: "POST /cc/facilities"
              payload: { name: "Fac B", region: "R1" }
              as: SystemAdministrator
              captures: { facB: $.data.id }
            - call: "POST /cc/facilities/${facA}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { bedA: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${facB}/admissions"
              payload: { bed_id: "${bedA}", patient_ref: "PX", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_BED_NOT_FOUND (bed of facility A invisible under facility B)"

      - name: beds_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Bed]
        distinguishing_aspect: "Pagination envelope honors limit/offset and reports total_count and has_more correctly."
        test_recipe:
          setup: ["Facility with 3 beds"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Page Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B2", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-2", label: "B3", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
          trigger:
            - call: "GET /cc/facilities/${fac}/beds?limit=2&offset=2"
              as: Any
          assert:
            - "response_type == array and data has exactly 1 bed"
            - "meta pagination: total_count == 3, has_more == false, limit == 2, offset == 2"

  # ===========================================================================
  # 2. State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_transfer_request_rejects_cancel
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransferRequest, "errors[ERR_TRANSFER_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED transfer request is terminal: cancel on it fails with ERR_TRANSFER_INVALID_STATE and no side effects fire."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/CRITICAL/AIRBORNE; physician Dr ON_CALL CARDIAC"
            - "TR walked INTAKE -> CONSULT_PENDING -> ACCEPTED -> HOLD_PLACED -> ASSIGNED -> COMPLETED"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Term Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr T", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PT1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
            - call: "GET /cc/transfer-requests/${tr}"
              as: Any
              captures: { tr_v: $.data.version }
            - call: "POST /cc/transfer-requests/${tr}/bed-assignments"
              payload: { bed_hold_id: "${hold}", expected_transfer_request_version: "${tr_v}" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { asg: $.data.id }
            - call: "POST /cc/bed-assignments/${asg}/complete"
              payload: {}
              as: BedManager
              as_user_id: "bm_1"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/cancel"
              payload: {}
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_TRANSFER_INVALID_STATE"
            - "TransferRequest.${tr}.status remains COMPLETED"

      - name: consult_response_from_intake_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TransferRequest, "errors[ERR_TRANSFER_INVALID_STATE]"]
        distinguishing_aspect: "consult-response requires CONSULT_PENDING; firing it on a fresh INTAKE request fails with ERR_TRANSFER_INVALID_STATE."
        test_recipe:
          setup: ["Facility, physician, and an INTAKE transfer request"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Inv Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr V", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PV1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_TRANSFER_INVALID_STATE"

      - name: bed_hold_initial_state_and_expiry_computation
        claim_type: initial_state
        grounds: [entities.BedHold.fields.status, entities.BedHold.fields.expires_at]
        distinguishing_aspect: "New hold starts ACTIVE with starts_at == clock, expires_at == starts_at + ttl_minutes (explicit ttl 90 -> 2026-08-01T01:30:00Z), extend_count 0, version 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/CRITICAL/AIRBORNE; physician Dr ON_CALL; TR ACCEPTED"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Init Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr N", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PN1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}", ttl_minutes: 90 }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
          assert:
            - "BedHold.${hold}.status == ACTIVE and extend_count == 0 and version == 1"
            - "BedHold.${hold}.starts_at == 2026-08-01T00:00:00Z and expires_at == 2026-08-01T01:30:00Z"

      - name: consult_dispatch_sets_deadline_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.TransferRequest.INTAKE_to_CONSULT_PENDING]
        distinguishing_aspect: "Consult dispatch stamps consult_deadline = now + 30 minutes exactly and consult_count 1."
        test_recipe:
          setup: ["Clock at 2026-08-01T00:00:00Z; facility, physician, INTAKE request"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Side Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr S", services: ["NEURO"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PS2", acuity: "ACUITY_2_STEPDOWN", isolation_need: "NONE", service: "NEURO", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
          assert:
            - "TransferRequest.${tr}.status == CONSULT_PENDING"
            - "consult_deadline == 2026-08-01T00:30:00Z and consult_count == 1 and accepting_physician_id == ${dr}"

      - name: sweep_expires_consult_past_deadline
        claim_type: automatic_transition
        grounds: [state_machines.TransferRequest.CONSULT_PENDING_to_EXPIRED, calculations.consult_window_check]
        distinguishing_aspect: "Sweep at now == consult_deadline (>= pinned) flips the request to EXPIRED with decline_reason TIMEOUT and clears consult fields."
        test_recipe:
          setup: ["Clock at 00:00; request consulted at 00:00 (deadline 00:30); clock advanced to 00:30"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Sweep Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr W", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PW9", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /cc/_sweeps/run"
              payload: {}
              as: SystemAdministrator
              captures: { ids: $.data.expired_consult_request_ids }
          assert:
            - "expired_consult_request_ids contains ${tr}"
            - "TransferRequest.${tr}.status == EXPIRED and decline_reason == TIMEOUT and accepting_physician_id == null and consult_deadline == null"

      - name: guarded_transition_diversion_gating
        claim_type: guarded_transition
        grounds: [state_machines.Facility, "errors[ERR_FACILITY_ON_DIVERSION]"]
        excluded_because:
          difficulty_instance: diversion_full_blocks_transfer_intake
          rationale: "Cross-entity gate Facility -> TransferRequest is asserted as the failure path of the named §1.8 instance."

      - name: guarded_transition_bed_state_gating
        claim_type: guarded_transition
        grounds: [state_machines.Bed, "errors[ERR_BED_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: out_of_service_bed_blocks_hold_create
          rationale: "Cross-entity gate Bed -> BedHold is asserted as the failure path of the named §1.8 instance."

      - name: cyclic_reconsult_loop
        claim_type: cyclic_shape
        grounds: [state_machines.TransferRequest]
        excluded_because:
          difficulty_instance: transfer_request_consult_reconsult_cycle
          rationale: "Cycle DECLINED -> CONSULT_PENDING -> ACCEPTED asserted in the named §1.8 instance."

      - name: parallel_dimensions_independence
        claim_type: parallel_shape
        grounds: [state_machines.BoardingRecord]
        excluded_because:
          difficulty_instance: boarding_record_parallel_dimensions
          rationale: "Placement x escalation independence asserted in the named §1.8 instance."

      - name: bed_status_endpoint_rejects_held_target
        claim_type: invalid_transition
        grounds: [state_machines.Bed, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "HELD is system-managed: POST /cc/beds/{id}/status with to_status=HELD is rejected as an invalid enum target with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Facility with one AVAILABLE bed"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "BedSt Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /cc/beds/${b1}/status"
              payload: { to_status: "HELD" }
              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"
            - "Bed.${b1}.status remains AVAILABLE"

      - name: rescind_pending_discharge_restores_admitted
        claim_type: valid_transition
        grounds: [state_machines.Admission.PENDING_DISCHARGE_to_ADMITTED]
        distinguishing_aspect: "Rescinding clears pending_discharge_at and the bed's projected_free_at, returning the admission to ADMITTED."
        test_recipe:
          setup: ["Clock at 00:00; facility; bed occupied by admission marked PENDING_DISCHARGE (expected 2026-08-01T05:00:00Z, unsigned)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Rescind Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b1}", patient_ref: "PR1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/admissions/${adm}/pending-discharge"
              payload: { expected_discharge_at: "2026-08-01T05:00:00Z", discharge_order_signed: false }
              as: BedManager
          trigger:
            - call: "POST /cc/admissions/${adm}/rescind-pending-discharge"
              payload: {}
              as: BedManager
          assert:
            - "Admission.${adm}.status == ADMITTED and pending_discharge_at == null and expected_discharge_at == null and discharge_order_signed == false"
            - "Bed.${b1}.projected_free_at == null (rescind clears the projection)"

      - name: huddle_resolve_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EscalationHuddle, "errors[ERR_HUDDLE_INVALID_STATE]"]
        distinguishing_aspect: "Resolving an already-RESOLVED huddle fails with ERR_HUDDLE_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility; ED admission with boarding record; huddle created manually and resolved once"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Hud Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PH1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { br: $.data.id }
            - call: "POST /cc/boarding-records/${br}/huddles"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { hud: $.data.id }
            - call: "POST /cc/huddles/${hud}/resolve"
              payload: { resolution: "first" }
              as: HouseSupervisor
              as_user_id: "hs_1"
          trigger:
            - call: "POST /cc/huddles/${hud}/resolve"
              payload: { resolution: "second" }
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_HUDDLE_INVALID_STATE"

      - name: forecast_publish_and_supersede
        claim_type: valid_transition
        grounds: [state_machines.CapacityForecast]
        distinguishing_aspect: "Publishing a PROVISIONAL forecast succeeds; creating a second forecast supersedes the first; publishing the SUPERSEDED one fails with ERR_FORECAST_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility with 2 staffed non-ED beds, 1 occupied"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
