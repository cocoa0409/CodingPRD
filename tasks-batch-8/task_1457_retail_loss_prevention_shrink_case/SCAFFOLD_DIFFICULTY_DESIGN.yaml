              captures: { c1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sb}", subject_type: "EXTERNAL", manual_loss_cents: 300000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c2: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sa}", subject_type: "EXTERNAL", manual_loss_cents: 300000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c3: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c1}", orc_group_id: "${g}", link_score: 90 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l1: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c2}", orc_group_id: "${g}", link_score: 85 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l2: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c3}", orc_group_id: "${g}", link_score: 75 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l3: $.data.id }
            - call: "POST /case-links/${l1}/confirm"
              payload: {}
