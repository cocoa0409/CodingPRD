          - state_machines.Cart.ABANDONED_to_OPEN
        distinguishing_aspect: "The recovery_relock variant diverges from add_time_lock on identical data: the surviving line was locked at 3420 (5% tier, subtotal 5600 including the companion line) and, after the companion line becomes ineligible, recovery re-locks it at 3600 with no discount because the re-held set alone is only 3600."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z. Offer A on SKU-ROBE is 2000 cents with max_qty 1; offer B on SKU-BELT is 3600 cents with max_qty 5. Viewer 1 holds one unit of each (line B locks at the 5% tier) and then abandons the cart; viewer 2 immediately takes offer A's single unit, so offer A is EXHAUSTED again when viewer 1 recovers."
