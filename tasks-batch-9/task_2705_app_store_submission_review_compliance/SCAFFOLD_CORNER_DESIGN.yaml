      - name: the_window_with_the_most_free_slots_wins_the_reservation
        claim_type: Correct Result
        grounds:
          - calculations.review_capacity_allocation.formula
          - calculations.review_capacity_allocation.selector
        distinguishing_aspect: "The ranking expression is slots_available DESC before starts_at ASC, so a POOL_B window opened later with 6 free slots beats the pre-existing POOL_A window with 5, and review_window_id is the POOL_B id even though POOL_A starts first and was created first."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED at clock 2026-08-01T00:00:00Z. Window POOL_A (IOS, 2026-08-01..2026-09-01, 5 slots) already exists."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /review-capacity-windows"
              payload: { platform: "IOS", reviewer_pool_code: "POOL_B", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 6 }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { winb_id: $.data.id }
            - *c_queue
          assert:
            - "the first call returns 201 with data.slots_available == 6"
            - "the queue call returns 200 with data.review_window_id == ${winb_id}"
            - "ReviewCapacityWindow.${winb_id}.slots_reserved == 1 and slots_available == 5"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_available == 5"

      - name: a_window_that_has_not_started_yet_is_invisible_to_the_selector
        claim_type: Input Set Filtering
        grounds:
          - calculations.review_capacity_allocation.selector
        distinguishing_aspect: "Eligibility requires starts_at <= clock_now, so a POOL_B window opening at 2026-08-02 with 8 free slots is excluded at clock 2026-08-01 and the reservation falls to the smaller POOL_A window instead of the bigger future one."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED at clock 2026-08-01T00:00:00Z with the POOL_A window (5 slots) live."
          setup_api_calls: *CH_PRP
