scaffold_corner_design:

  # ===========================================================================
  # section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: patient_creation_starts_in_intake_with_system_fields
        claim_type: creation
        grounds:
          - entities.Patient.fields.clinical_status
          - endpoints[POST /vision-therapy/patients]
        distinguishing_aspect: "A freshly registered patient is returned with clinical_status INTAKE, version 1 and a server-minted UUID id, and every discharge field null."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id, st: $.data.clinical_status, ver: $.data.version, dr: $.data.discharge_reason }
          assert:
            - "HTTP 201"
            - "${st} == INTAKE"
            - "${ver} == 1"
            - "${dr} == null"
            - "${pt} matches the plain UUID form with no type prefix"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: patient_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /vision-therapy/patients/{id}]
          - entities.Patient.fields.guardian_name
        distinguishing_aspect: "GET on a patient id returns exactly the stored row including the optional guardian_name supplied at creation."
        test_recipe:
          setup:
            - "One registered patient with a guardian name."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "AMBLYOPIA", guardian_name: "Marta Ruiz" }
              as: FrontDesk
              captures: { pt: $.data.id }
          trigger:
            - call: "GET /vision-therapy/patients/${pt}"
              payload: {}
              as: FrontDesk
              captures: { g: $.data.guardian_name, d: $.data.diagnosis_category }
          assert:
            - "HTTP 200"
            - "${g} == Marta Ruiz"
            - "${d} == AMBLYOPIA"

      - name: coverage_listing_paginates_and_filters_by_patient
        claim_type: listing
        grounds:
          - endpoints[GET /vision-therapy/coverages]
          - entities.Coverage.fields.patient_id
        distinguishing_aspect: "GET /vision-therapy/coverages with patient_id and limit 1 returns exactly one of the patient's two coverages together with total_count 2 and has_more true."
        test_recipe:
          setup:
            - "One patient holding two coverages, one MEDICAL and one VISION."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "Meridian Medical", payer_type: "MEDICAL", allowed_amount_timed_unit: 34.00, allowed_amount_flat_session: 120.00, allowed_amount_evaluation: 165.00, coinsurance_rate: 0.20, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { pm: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "ClearSight Vision", payer_type: "VISION", allowed_amount_timed_unit: 0.00, allowed_amount_flat_session: 0.00, allowed_amount_evaluation: 0.00, coinsurance_rate: 0.00, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { pv: $.data.id }
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${pm}", member_number: "M-1", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", deductible_total: 200.00, deductible_met: 0.00 }
              as: BillingSpecialist
              captures: { c1: $.data.id }
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${pv}", member_number: "V-1", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", vision_allowance_total: 250.00 }
              as: BillingSpecialist
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /vision-therapy/coverages"
              payload: { patient_id: "${pt}", limit: 1, offset: 0 }
              as: BillingSpecialist
          assert:
            - "HTTP 200 with response_type == array"
            - "the data array has length 1"
            - "total_count == 2 and has_more == true and limit == 1 and offset == 0"

      - name: patient_get_with_unknown_uuid_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "GET on a well-formed but unknown patient UUID returns ERR_PATIENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "GET /vision-therapy/patients/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PATIENT_NOT_FOUND"
            - "HTTP 404"
            - "response_type == error"

      - name: patient_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting date_of_birth on patient creation is refused at rung 3 with ERR_VALIDATION and no row is stored."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP 400"

      - name: coverage_defaults_applied_when_accumulators_omitted
        claim_type: defaults
        grounds:
          - entities.Coverage.fields.deductible_total
          - entities.Coverage.fields.vision_allowance_remaining
          - conservation_invariants.INVARIANT-4
        distinguishing_aspect: "Omitting every optional accumulator on coverage creation yields deductible_total 0.00, deductible_met 0.00, vision_allowance_total 0.00, vision_allowance_used 0.00 and vision_allowance_remaining 0.00, and both last_paid_service_date_* null."
        test_recipe:
          setup:
            - "One patient and one VISION payer."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "ClearSight Vision", payer_type: "VISION", allowed_amount_timed_unit: 0.00, allowed_amount_flat_session: 0.00, allowed_amount_evaluation: 0.00, coinsurance_rate: 0.00, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { pv: $.data.id }
          trigger:
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${pv}", member_number: "V-1", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { dt: $.data.deductible_total, dm: $.data.deductible_met, vt: $.data.vision_allowance_total, vu: $.data.vision_allowance_used, vr: $.data.vision_allowance_remaining, lp: $.data.last_paid_service_date_therapy }
          assert:
            - "${dt} == 0.00 and ${dm} == 0.00"
            - "${vt} == 0.00 and ${vu} == 0.00 and ${vr} == 0.00"
            - "${lp} == null"
            - "INVARIANT-4 holds: 0.00 == 0.00 + 0.00"

      - name: plan_baselines_are_computed_from_the_source_assessment
        claim_type: computed_fields
        grounds:
          - entities.TherapyPlan.fields.baseline_npc_break_cm
          - entities.TherapyPlan.fields.baseline_ciss_score
          - endpoints[POST /vision-therapy/therapy-plans]
        distinguishing_aspect: "The five baseline_* fields on a new plan are snapshotted from the source assessment's measurements and are not settable by the caller; a metric absent from the source assessment yields a null baseline."
        test_recipe:
          setup:
            - "A signed EVALUATION carrying NPC 12.0/16.0 and CISS 34 but no vergence and no acuity row."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "SYMPTOM_SURVEY", eye: "OU", ciss_score: 34 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
          trigger:
            - call: "POST /vision-therapy/therapy-plans"
              payload: { patient_id: "${pt}", source_assessment_id: "${ev1}", discharge_criteria_mode: "GOAL", prescribed_home_sessions_per_week: 2 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { bn: $.data.baseline_npc_break_cm, bc: $.data.baseline_ciss_score, bv: $.data.baseline_vergence_bo_break_pd, ba: $.data.baseline_acuity_logmar, st: $.data.status, ps: $.data.progress_state }
          assert:
            - "HTTP 201"
            - "${bn} == 12.0"
            - "${bc} == 34"
            - "${bv} == null"
            - "${ba} == null"
            - "${st} == DRAFT and ${ps} == ON_TRACK"

      - name: system_fields_are_server_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Assessment.fields.patient_age_years
          - entities.Assessment.fields.status
        distinguishing_aspect: "patient_age_years and status are server-computed on assessment creation - 10 years from a 2016-06-01 date of birth against a 2026-06-01 encounter_date, and DRAFT - regardless of what the caller sends."
        test_recipe:
          setup:
            - "One patient born 2016-06-01 and one optometrist, with the logical clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
          trigger:
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { age: $.data.patient_age_years, st: $.data.status, ver: $.data.version, amn: $.data.amendment_count }
          assert:
            - "${age} == 10"
            - "${st} == DRAFT"
            - "${ver} == 1"
            - "${amn} == 0"
            - "created_at and updated_at are ISO 8601 UTC with exactly three fractional digits"

      - name: measurement_invalid_enum_metric_code_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_ENUM]
          - entities.BinocularMeasurement.fields.metric_code
        distinguishing_aspect: "metric_code is on the exhaustive rung-4 enum list, so an unknown value returns ERR_INVALID_ENUM rather than ERR_VALIDATION."
        test_recipe:
          setup:
            - "One DRAFT EVALUATION assessment."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "STEREOPSIS", eye: "OU", npc_break_cm: 9.0 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_ENUM"
            - "HTTP 400"

      - name: binocular_measurement_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.BinocularMeasurement.fields.assessment_id
          - endpoints[GET /vision-therapy/assessments/{id}/measurements]
        distinguishing_aspect: "BinocularMeasurement is declared common_fields false, so it exposes only id and created_at, has no update endpoint, and its assessment_id comes from the path rather than the body."
        test_recipe:
          setup:
            - "One DRAFT EVALUATION with a single NPC row."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { m1: $.data.assessment_id }
          trigger:
            - call: "GET /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", limit: 10, offset: 0 }
              as: Optometrist
              as_user_id: "${od1}"
          assert:
            - "${m1} == ${ev1}"
            - "the data array has length 1"
            - "each measurement row carries id and created_at but no version and no updated_at"
            - "no PUT, PATCH or DELETE endpoint exists for a measurement anywhere in the API surface"

      - name: authorization_requires_an_existing_coverage_parent
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_COVERAGE_NOT_FOUND]
          - entities.Authorization.fields.coverage_id
        distinguishing_aspect: "Creating an authorization against an unknown coverage_id is refused at rung 6 with ERR_COVERAGE_NOT_FOUND before any counter is written."
        test_recipe:
          setup:
            - "One registered patient and no coverage at all."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
          trigger:
            - call: "POST /vision-therapy/authorizations"
              payload: { patient_id: "${pt}", coverage_id: "99999999-8888-4777-8666-555555555555", auth_number: "A-1", visits_authorized: 6, window_start_date: "2026-06-01", window_end_date: "2026-12-01" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COVERAGE_NOT_FOUND"
            - "HTTP 404"
            - "GET /vision-therapy/authorizations with patient_id ${pt} returns 0 rows"

  # ===========================================================================
  # section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: assessment_sign_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Assessment.FINALIZED_to_SIGNED
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "sign is declared only from FINALIZED, so signing a DRAFT battery is refused with ERR_INVALID_STATE and signed_by_therapist_id stays null."
        test_recipe:
          setup:
            - "One DRAFT EVALUATION carrying an NPC row that has never been finalized."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
          trigger:
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP 409"
            - "Assessment.${ev1}.status == DRAFT and Assessment.${ev1}.signed_by_therapist_id == null"
            - "Patient.${pt}.clinical_status == INTAKE"

      - name: assessment_amend_cap_third_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Assessment.SIGNED_to_DRAFT
          - entities.Assessment.fields.amendment_count
          - validations[priority=14]
        distinguishing_aspect: "The DRAFT-FINALIZED-SIGNED-DRAFT loop is capped at MAX_ASSESSMENT_AMENDMENTS 2, so the third amend is refused with ERR_INVALID_STATE and amendment_count stays at 2."
        test_recipe:
          setup:
            - "One SIGNED EVALUATION that has already been amended and re-signed twice, so amendment_count is 2."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
