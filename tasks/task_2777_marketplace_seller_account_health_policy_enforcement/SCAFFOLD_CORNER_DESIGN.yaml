              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rb2: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rb2}", reporter_type: "REGULATOR", evidence_reference: "EV-RB2-0001" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v1: $.data.id, v1_state: $.data.state }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_open_co: $.data.error_id }
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: AppealReviewer
              as_user_id: "ar-1"
              captures: { e_adj_ar: $.data.error_id }
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_issue_co: $.data.error_id }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_hold_co: $.data.error_id }
          assert:
            - "${v1_state} == REPORTED — the officer's own filing succeeded with HTTP 201"
            - "all four triggers: HTTP 403 and ${e_open_co}, ${e_adj_ar}, ${e_issue_co}, ${e_hold_co} are ERR_UNAUTHORIZED"
            - "${e_issue_co} is ERR_UNAUTHORIZED and not ERR_VIOLATION_NOT_SUBSTANTIATED — the role check precedes the state check"
            - "${e_hold_co} is ERR_UNAUTHORIZED and not ERR_SELLER_NOT_UNDER_HOLD_POSTURE"
            - "Violation.${v1}.state is still REPORTED and no EnforcementAction or DisbursementHold exists"

      - name: rbac_appeal_review_steps_cannot_be_performed_by_the_officer_or_the_investigator
        claim_type: exclusive_operations
        grounds:
          - "roles.AppealReviewer.exclusive_operations"
          - "roles.ComplianceOfficer.exclusive_operations"
        distinguishing_aspect: |
          First-level review and final escalation review are deliberately split across two roles, so
          the officer may not take over the first level and the reviewer may not take over the
          escalation. Both probes run against a live appeal in the correct state, which means the
          403 can only come from the role split and not from the appeal lifecycle.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-RB3-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One action issued by inv-1 and appealed by the seller; the appeal is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-RB3-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rb3: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rb3}", reporter_type: "BUYER", evidence_reference: "EV-RB3-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The listing attribute matched the manufacturer sheet." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id, ap1_state: $.data.state }
          trigger:
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_start_co: $.data.error_id }
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "GRANTED", rationale: "Officer decision." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_decide_co: $.data.error_id }
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "NO_NEW_EVIDENCE", rationale: "Reviewer decision." }
              as: AppealReviewer
              as_user_id: "ar-1"
              captures: { e_esc_ar: $.data.error_id }
          assert:
            - "${ap1_state} == SUBMITTED"
            - "all three triggers: HTTP 403 and ${e_start_co}, ${e_decide_co}, ${e_esc_ar} are ERR_UNAUTHORIZED"
            - "${e_esc_ar} is ERR_UNAUTHORIZED and not ERR_INVALID_STATE, even though the appeal is not ESCALATED_REVIEW"
            - "Appeal.${ap1}.state is still SUBMITTED, decided_by_user_id is null and EnforcementAction.${a1}.state is still ISSUED"

      - name: rbac_officer_only_writes_cannot_be_performed_by_the_investigator_or_reviewer
        claim_type: exclusive_operations
        grounds:
          - "roles.ComplianceOfficer.exclusive_operations"
          - "roles.PolicyInvestigator.shared_operations"
        distinguishing_aspect: |
          Everything that changes the rulebook, the metric feed or the money is officer-exclusive, so
          the investigator who runs the case may neither write the rule it will cite nor feed the
          metrics that trigger it nor move the funds it freezes. The complementary positive is that
          POST /sellers/{id}/health-evaluations IS shared with the investigator — the investigator may
          evaluate the feed it cannot write.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one seller with one snapshot fed by the officer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 400, delivered_or_refunded_volume: 400, defect_claims_pending: 1, defect_claims_substantiated: 2, late_shipments: 4, pre_fulfillment_cancellations: 2, shipments_total: 400, shipments_with_valid_tracking: 396, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap1: $.data.id }
          trigger:
            - call: "POST /policy-rules"
              payload: { code: "LA-RB4-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { e_rule_inv: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-01T00:00:00.000Z", order_volume: 100, delivered_or_refunded_volume: 100, defect_claims_pending: 3, defect_claims_substantiated: 9, late_shipments: 1, pre_fulfillment_cancellations: 1, shipments_total: 100, shipments_with_valid_tracking: 99 }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { e_snap_inv: $.data.error_id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 50000 }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { e_credit_inv: $.data.error_id }
            - call: "POST /related-account-links/00000000-0000-0000-0000-000000000000/adjudicate"
