  # =========================================================================
  # SECTION: errors — corners already covered by SCAFFOLD_DIFFICULTY_DESIGN
  # =========================================================================
  - section: errors
    instances:

      - name: error_outside_service_radius_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTSIDE_SERVICE_RADIUS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / service_radius_inclusive_at_40km_and_exclusive_at_40_1km
          rationale: "Asserted as the failure path of the named §1.8 boundary instance, including the inclusive 40.0 km edge."

      - name: error_no_billable_days_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_BILLABLE_DAYS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_billable_days_blocks_claim_build_on_empty_compliant_set
          rationale: "Asserted as the zero-count edge of the named §1.8 instance."

      - name: error_episode_not_active_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_EPISODE_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / visit_creation_blocked_while_parent_episode_is_escalated
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."

      - name: error_visit_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_VISIT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / staff_visit_turnaround_buffer_is_inclusive_at_exactly_15_minutes
          rationale: "Asserted at the 14-minute collision edge of the named §1.8 instance."

      - name: error_no_beds_available_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_BEDS_AVAILABLE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / inpatient_bed_capacity_is_aggregate_and_released_by_hold_expiry
          rationale: "Asserted while the single bed is held in the named §1.8 instance."

      - name: error_redelivery_limit_exceeded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_REDELIVERY_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / delivery_order_capped_redelivery_loop_then_abandoned_to_failed
          rationale: "Asserted on the third dispatch attempt of the named §1.8 instance."

      - name: error_med_rec_unsigned_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_MED_REC_UNSIGNED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / discharge_med_rec_safety_gate_beats_referential_delivery_gate
          rationale: "Asserted as the priority-28 winner of the named §1.8 instance."

      - name: error_delivery_not_terminal_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DELIVERY_NOT_TERMINAL]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / discharge_med_rec_safety_gate_beats_referential_delivery_gate
          rationale: "Asserted as the second-attempt error of the named §1.8 instance once the med-rec rung is satisfied."

      - name: error_stale_kit_version_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[kit-deploy-stale-kit]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / occ_stale_kit_version_beats_kit_unavailable_capacity_rule
          rationale: "The DeviceKit OCC rule is asserted as the priority-8 winner of the named §1.8 instance."

  # =========================================================================
  # SECTION: validations (continued) — admission-time re-checks and closures
  # =========================================================================
  - section: validations
    instances:

      - name: patient_moved_outside_the_radius_after_eligibility_blocks_admission
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=13]"
          - entities.Patient.fields.home_distance_km
          - "errors[ERR_OUTSIDE_SERVICE_RADIUS]"
        distinguishing_aspect: "Priority 13 is re-evaluated at POST /episodes, not only at mark-eligible: patching the patient to 55.0 km after the referral reached ELIGIBLE blocks admission, and patching back to 12.5 km admits."
        test_recipe:
          setup:
            - "One ELIGIBLE ED referral for a CHF_EXAC patient recorded at 12.5 km."
            - "The patient row is then updated to 55.0 km, which is strictly beyond the 40.0 km service radius."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-MV", full_name: "Mo Moved", home_distance_km: 12.5, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_mv: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_mv}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_mv: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_mv}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ea_mv: $.data.id }
            - call: "POST /referrals/${ref_mv}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "GET /referrals/${ref_mv}"
              payload: {}
              as: AdmittingPhysician
            - call: "GET /referrals/${ref_mv}/eligibility-assessments"
              payload: {}
              as: AdmittingPhysician
            - call: "PATCH /patients/${pat_mv}"
              payload: { home_distance_km: 55.0 }
              as: AdmittingPhysician
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "${pat_mv}", referral_id: "${ref_mv}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { err_mv: $.data.error_id }
            - call: "PATCH /patients/${pat_mv}"
              payload: { home_distance_km: 12.5 }
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_mv}", referral_id: "${ref_mv}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_mv: $.data.id }
          assert:
            - "GET /referrals/${ref_mv} shows status ELIGIBLE and first_failed_gauntlet_rung null after mark-eligible"
            - "GET /referrals/${ref_mv}/eligibility-assessments returns exactly 1 row whose id == ${ea_mv} with total_count == 1"
            - "the first admission returns error_id ERR_OUTSIDE_SERVICE_RADIUS with HTTP 422"
            - "Referral.${ref_mv}.status is still ELIGIBLE after the rejected admission"
            - "the second admission succeeds with HTTP 201, Episode.${ep_mv}.status == ACTIVE and Referral.${ref_mv}.status == ADMITTED"

      - name: no_show_visit_does_not_count_toward_the_daily_in_person_requirement
        claim_type: input_set_filtering
        grounds:
          - state_machines.Visit.SCHEDULED_to_NO_SHOW
          - calculations.daily_visit_compliance
          - entities.Visit.fields.scheduling_status
        distinguishing_aspect: "Only scheduling_status == COMPLETED visits enter the qualified count, so an attested NO_SHOW visit leaves qualified_in_person_visit_count at 0 and carves the FFS day out with INSUFFICIENT_IN_PERSON_VISITS."
        test_recipe:
          setup:
            - "One ACTIVE FEE_FOR_SERVICE episode with a single RN_IN_PERSON visit on 2026-06-01 that is closed as NO_SHOW and then attested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-NS", full_name: "Nan NoShow", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_ns: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_ns}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_ns: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_ns}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_ns}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_ns}", referral_id: "${ref_ns}", program_track: "FEE_FOR_SERVICE" }
              as: AdmittingPhysician
              captures: { ep_ns: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_ns}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 5.0 }
              as: FieldNurse
              captures: { v_ns: $.data.id }
            - call: "POST /visits/${v_ns}/close-unperformed"
              payload: { outcome: "NO_SHOW" }
              as: FieldNurse
            - call: "POST /visits/${v_ns}/attest"
              payload: {}
              as: FieldNurse
            - call: "GET /episodes/${ep_ns}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_ns: "$.data[0].id" }
          trigger:
            - call: "POST /compliance-days/${cd_ns}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "GET /episodes/${ep_ns}/visits"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
          assert:
            - "Visit.${v_ns}.scheduling_status == NO_SHOW and Visit.${v_ns}.attestation_status == ATTESTED"
            - "DailyComplianceRecord.${cd_ns}.qualified_in_person_visit_count == 0"
            - "DailyComplianceRecord.${cd_ns}.status == CARVED_OUT and carve_out_reason == INSUFFICIENT_IN_PERSON_VISITS"
            - "Episode.${ep_ns}.billable_day_count == 0, carved_out_day_count == 1, pending_day_count == 0, service_day_count == 1"
            - "GET /episodes/${ep_ns}/visits returns exactly 1 row with total_count == 1"
            - "Episode.${ep_ns}.travel_reimbursement_total_usd == 0.00"

      - name: resolving_the_last_open_escalation_returns_the_episode_to_active
        claim_type: side_effect_execution
        grounds:
          - state_machines.EscalationEvent.TIER1_ACKED_to_RESOLVED
          - state_machines.Episode.ESCALATED_to_ACTIVE
          - state_machines.EscalationEvent.TIER3_OPEN_to_TIER3_ACKED
          - entities.Episode.fields.open_escalation_count
        distinguishing_aspect: "Resolving the only non-terminal escalation of an ESCALATED episode bubbles up: open_escalation_count returns to 0 and the Episode transitions ESCALATED -> ACTIVE inside the same request."
        test_recipe:
          setup:
            - "One CMS_WAIVER STANDARD-acuity episode whose single escalation has been promoted to TIER3_OPEN, so the episode is ESCALATED."
            - "The clock sits at 2026-06-01T08:32:00Z, at or before the tier-3 acknowledgement deadline of 09:02:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-RS", full_name: "Ros Resolve", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_rs: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_rs}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_rs: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_rs}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_rs}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_rs}", referral_id: "${ref_rs}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_rs: $.data.id }
            - call: "POST /escalation-events"
              payload: { episode_id: "${ep_rs}", reason: "VITALS_OUT_OF_RANGE", opened_by_user_id: "rn-1" }
              as: FieldNurse
              captures: { esc_rs: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:11:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_rs}/promote"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:32:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_rs}/promote"
              payload: {}
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_rs}/acknowledge"
              payload: {}
              as: CommunityParamedic
              as_user_id: "medic-1"
          trigger:
            - call: "POST /escalation-events/${esc_rs}/resolve"
              payload: {}
              as: CommunityParamedic
              as_user_id: "medic-1"
            - call: "GET /episodes/${ep_rs}/escalation-events"
              payload: { status: "RESOLVED" }
              as: ProgramAdmin
          assert:
            - "before the trigger EscalationEvent.${esc_rs}.status == TIER3_ACKED, current_tier == 3, acknowledged_by_user_id == medic-1 and Episode.${ep_rs}.status == ESCALATED"
            - "after the trigger EscalationEvent.${esc_rs}.status == RESOLVED"
            - "Episode.${ep_rs}.open_escalation_count == 0"
            - "Episode.${ep_rs}.status == ACTIVE"
            - "GET /episodes/${ep_rs}/escalation-events filtered on RESOLVED returns exactly 1 row with total_count == 1"
