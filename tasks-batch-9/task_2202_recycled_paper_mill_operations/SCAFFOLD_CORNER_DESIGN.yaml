              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_2: "$.data.id", machine_2_v: "$.data.version" }
            - call: "POST /paper-machines/${machine_2}/runs"
              payload: { product_code: "TL_140", pulp_batch_id: "${batch_id}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T14:00:00Z", pulp_draw_tons: 15.000, expected_machine_version: "${machine_2_v}" }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { run_2: "$.data.id" }
            - call: "POST /paper-machines/${machine_2}/runs/${run_2}/start"
