# =============================================================================
# PRD Benchmark Seed Tables — Volunteer Application, Country Placement &
# Medical Clearance (Peace Corps-style volunteer service pipeline)
# =============================================================================

scenario: |
  Volunteer Application, Country Placement & Medical Clearance (Peace Corps): application with country and sector preferences, skill matching against requested assignments and interview evaluation, invitation issuance for specific assignments with departure dates and acceptance deadlines, medical and dental clearance with condition review against in-country medical support availability and accommodation determination, legal clearance including background checks and suitability review, pre-service training in country with language, technical and cultural components and trainee assessment before swearing in, site placement with host community and counterpart organization agreements and housing standards, volunteer support including medical care, safety and security protocols and early termination handling, readjustment allowance and non-competitive eligibility benefits at completion

domain_name: volunteer-placement-clearance
api_prefix: /volunteer-portal

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - version_pinning_on_approval
    - cascading_side_effects
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Unique email address", constraints: "unique across all applicants" }
      - { name: date_of_birth, type: datetime, source: input, description: "Applicant date of birth (ISO8601)" }
      - { name: citizenship_country, type: string, source: input, description: "Country of citizenship" }
      - { name: skills, type: array, source: input, description: "Skill codes from the catalog: TEACHING_ENGLISH | MATH_SCIENCE | PRIMARY_HEALTH | NURSING | AGRONOMY | FORESTRY | SMALL_BUSINESS | IT | WATER_SANITATION | YOUTH_DEVELOPMENT", constraints: "each element in the skill catalog enum; may be empty" }
      - { name: languages, type: array, source: input, default: [], description: "Languages spoken (free-form strings)" }

  - name: CountryProgram
    parent: null
    common_fields: true
    fields:
      - { name: country_code, type: string, source: input, description: "ISO-style country code", constraints: "unique across all programs" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: medical_support_tier, type: integer, source: input, description: "In-country medical support availability: 1=limited, 2=moderate, 3=full", constraints: "1 <= tier <= 3" }
      - { name: required_language, type: string, source: input, description: "Language trainees must demonstrate in pre-service training" }
      - { name: language_threshold_score, type: number, source: input, description: "Minimum language assessment score required to swear in", constraints: "1.0 <= score <= 5.0" }
      - { name: training_capacity, type: integer, source: input, description: "Maximum combined cohort capacity allowed to overlap in-country at once", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SUSPENDED | CLOSED — new assignment openings require OPEN" }

  - name: AssignmentOpening
    parent: null
    common_fields: true
    fields:
      - { name: country_program_id, type: string, source: input, description: "FK -> CountryProgram.id; program hosting this assignment" }
      - { name: sector, type: enum, source: input, description: "EDUCATION | HEALTH | AGRICULTURE | ENVIRONMENT | YOUTH | COMMUNITY_DEVELOPMENT" }
      - { name: title, type: string, source: input, description: "Assignment title" }
      - { name: required_skills, type: array, source: input, description: "Skill codes an applicant MUST fully hold to be invited; may be empty", constraints: "each element in the skill catalog enum; empty array allowed" }
      - { name: preferred_skills, type: array, source: input, default: [], description: "Nice-to-have skill codes (do not gate eligibility)" }
      - { name: seats_total, type: integer, source: input, description: "Total volunteers this opening can take", constraints: ">= 1" }
      - { name: seats_provisional, type: integer, source: computed, default: 0, description: "Count of Invitations for this opening with status ISSUED (seat holds)" }
      - { name: seats_committed, type: integer, source: computed, default: 0, description: "Count of Invitations for this opening with status ACCEPTED" }
      - { name: departure_date, type: datetime, source: input, description: "Planned departure date for this assignment" }
      - { name: invitation_issue_deadline, type: datetime, source: input, description: "No invitations may be issued after this instant; clock sweep closes the opening" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FILLED | CLOSED | CANCELLED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owning applicant" }
      - { name: country_preference_ids, type: array, source: input, default: [], description: "Ranked list of preferred CountryProgram ids (rank 1 first); empty means willing to serve anywhere", constraints: "each element must be an existing CountryProgram.id; no duplicates" }
      - { name: sector_preferences, type: array, source: input, default: [], description: "Preferred sectors (unordered); may be empty while DRAFT — submit requires at least 1 element", constraints: "each element in sector enum" }
      - { name: statement, type: string, source: input, default: "", description: "Motivation statement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_REVIEW | INTERVIEWING | EVALUATED | INVITED | ACCEPTED | CLEARED_TO_DEPART | IN_TRAINING | SWORN_IN | NOT_SELECTED | WITHDRAWN | SEPARATED" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; interviewed application" }
      - { name: interviewer_id, type: string, source: input, description: "Opaque identifier of the interviewing officer (no overlapping scheduled interviews per interviewer)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview window end (half-open interval end)", constraints: "must be strictly after scheduled_start" }
      - { name: motivation_score, type: number, source: system, description: "1.0-5.0, set at completion" }
      - { name: adaptability_score, type: number, source: system, description: "1.0-5.0, set at completion" }
      - { name: skill_competency_score, type: number, source: system, description: "1.0-5.0, set at completion" }
      - { name: cross_cultural_score, type: number, source: system, description: "1.0-5.0, set at completion" }
      - { name: overall_score, type: number, source: computed, description: "Weighted score per calculation interview_overall_score; rounded to 2 decimals half-up" }
      - { name: recommendation, type: enum, source: computed, description: "STRONGLY_RECOMMEND | RECOMMEND | NEUTRAL | NOT_RECOMMENDED — per interview_overall_score including the minimum-dimension cap" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Invitation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; invited application" }
      - { name: assignment_opening_id, type: string, source: input, description: "FK -> AssignmentOpening.id; assignment offered" }
      - { name: pinned_country_program_id, type: string, source: system, description: "Country program id snapshotted from the opening at issuance (immutable thereafter)" }
      - { name: pinned_country_medical_tier, type: integer, source: system, description: "Medical support tier snapshotted from the CountryProgram at issuance; ALL medical clearance reviews evaluate against this pinned value, never the live program tier" }
      - { name: pinned_departure_date, type: datetime, source: system, description: "Departure date snapshotted from the opening at issuance" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: acceptance_deadline, type: datetime, source: system, description: "= issued_at + INVITATION_ACCEPTANCE_WINDOW_DAYS (10 days); clock sweep expires unaccepted invitations past this instant" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of the issuing PlacementOfficer" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACCEPTED | DECLINED | EXPIRED | RESCINDED" }

  - name: MedicalClearance
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application being medically cleared" }
      - { name: conditions, type: array, source: input, description: "Declared medical conditions: objects {condition_code: string, severity: integer 1..3, required_support_tier: integer 1..3}; replaced wholesale on resubmit; empty array means no conditions" }
      - { name: dental_status, type: enum, source: input, description: "CLEAR | NEEDS_TREATMENT — dental screening outcome declared with the forms" }
      - { name: deferral_count, type: integer, source: system, default: 0, description: "Number of resubmissions so far; increments on each resubmit; DEFER determination requires deferral_count < MAX_MEDICAL_DEFERRALS (2)" }
      - { name: max_tier_gap, type: integer, source: computed, default: 0, description: "= max over conditions of (required_support_tier - pinned_country_medical_tier of the application's ACCEPTED invitation), or 0 when conditions is empty" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the MedicalOfficer who made the latest determination; null until first determination" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | DEFERRED | CLEARED | CLEARED_WITH_ACCOMMODATION | DENIED | VOID" }

  - name: LegalClearance
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; auto-created when an invitation is accepted" }
      - { name: background_check_status, type: enum, source: system, default: PENDING, description: "PENDING | CLEAR | ADVERSE — independent parallel dimension" }
      - { name: background_adjudicated_by, type: string, source: system, description: "X-User-ID of the LegalReviewer who adjudicated the background check; null while PENDING" }
      - { name: suitability_status, type: enum, source: system, default: PENDING, description: "PENDING | FAVORABLE | UNFAVORABLE — independent parallel dimension" }
      - { name: suitability_decided_by, type: string, source: system, description: "X-User-ID of the LegalReviewer who determined suitability; MUST differ from background_adjudicated_by (segregation of duties)" }
      - { name: overall_status, type: enum, source: computed, default: PENDING, description: "VOID if lifecycle=VOID; else DENIED if background_check_status=ADVERSE or suitability_status=UNFAVORABLE; else CLEARED if background_check_status=CLEAR and suitability_status=FAVORABLE; else PENDING" }
      - { name: lifecycle, type: enum, source: system, default: ACTIVE, description: "ACTIVE | VOID — set VOID when the parent application leaves the clearance pipeline (withdrawal, rescission cascades, denial)" }

  - name: TrainingCohort
    parent: null
    common_fields: true
    fields:
      - { name: country_program_id, type: string, source: input, description: "FK -> CountryProgram.id; program where pre-service training happens" }
      - { name: name, type: string, source: input, description: "Cohort label" }
      - { name: start_date, type: datetime, source: input, description: "Training window start (half-open)" }
      - { name: end_date, type: datetime, source: input, description: "Training window end (half-open)", constraints: "strictly after start_date" }
      - { name: capacity, type: integer, source: input, description: "Maximum trainees in this cohort", constraints: ">= 1" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of TrainingEnrollments in ENROLLED | REMEDIATION | PASSED | SWORN_IN for this cohort" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_SESSION | CONCLUDED — advanced by the clock sweep at start_date / end_date" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; enrolled application (must be ACCEPTED with both clearances cleared)" }
      - { name: training_cohort_id, type: string, source: input, description: "FK -> TrainingCohort.id; cohort joined (must belong to the invitation's pinned country program)" }
      - { name: assessment_attempts, type: integer, source: system, default: 0, description: "Number of assessments recorded; increments on each assess call; second consecutive FAILED outcome auto-separates the trainee" }
      - { name: language_score, type: number, source: system, description: "Language component score 1.0-5.0; null until assessed" }
      - { name: technical_score, type: number, source: system, description: "Technical component score 1.0-5.0; null until assessed" }
      - { name: cultural_score, type: number, source: system, description: "Cultural component score 1.0-5.0; null until assessed" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | PASSED | FAILED | REMEDIATION | SWORN_IN | SEPARATED" }

  - name: VolunteerService
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; set at swearing-in" }
      - { name: assignment_opening_id, type: string, source: system, description: "FK -> AssignmentOpening.id; copied from the accepted invitation" }
      - { name: country_program_id, type: string, source: system, description: "FK -> CountryProgram.id; copied from the invitation's pinned program" }
      - { name: service_start_date, type: datetime, source: system, description: "Logical-clock timestamp of swearing-in" }
      - { name: expected_completion_date, type: datetime, source: computed, description: "= service_start_date + SERVICE_TERM_DAYS (810 days)" }
      - { name: actual_end_date, type: datetime, source: system, description: "Set on completion or early termination; null while serving" }
      - { name: days_served, type: integer, source: computed, description: "Whole days between service_start_date and actual_end_date; null while serving" }
      - { name: months_served, type: integer, source: computed, description: "= floor((days_served + 15) / 30); null while serving" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | COMPLETED | EARLY_TERMINATED" }

  - name: SitePlacement
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_service_id, type: string, source: system, description: "FK -> VolunteerService.id; service this placement serves (from the creation path)" }
      - { name: host_community_name, type: string, source: input, description: "Host community" }
      - { name: counterpart_org_name, type: string, source: input, description: "Counterpart organization" }
      - { name: counterpart_agreement_signed, type: boolean, source: system, default: false, description: "Counterpart organization agreement signed; set via review" }
      - { name: has_running_water, type: boolean, source: system, default: false, description: "Housing standard: running water; set via review" }
      - { name: structurally_sound, type: boolean, source: system, default: false, description: "Housing standard: structural safety; set via review" }
      - { name: secure_locks, type: boolean, source: system, default: false, description: "Housing standard: secure locks; set via review" }
      - { name: inspection_passed, type: boolean, source: computed, default: false, description: "= has_running_water AND structurally_sound AND secure_locks" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | CONFIRMED | REJECTED | ENDED" }

  - name: ServiceEvent
    parent: null
    common_fields: false
    fields:
      - { name: volunteer_service_id, type: string, source: system, description: "FK -> VolunteerService.id; service this event is logged against (from the creation path)" }
      - { name: event_type, type: enum, source: input, description: "MEDICAL_CARE | SAFETY_INCIDENT | SECURITY_ALERT | ALL_CLEAR | COMMENDATION" }
      - { name: severity, type: enum, source: input, description: "ROUTINE | URGENT | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text event description" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred (ISO8601)" }

  - name: CompletionRecord
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_service_id, type: string, source: system, description: "FK -> VolunteerService.id; unique — exactly one completion record per service" }
      - { name: completion_type, type: enum, source: system, description: "FULL | EARLY" }
      - { name: et_reason, type: enum, source: system, description: "MEDICAL | FAMILY | SECURITY | ADMINISTRATIVE; null for FULL completions" }
      - { name: months_served, type: integer, source: system, description: "Copied from VolunteerService.months_served at close" }
      - { name: gross_accrued_cents, type: integer, source: computed, description: "= months_served * READJUSTMENT_MONTHLY_RATE_CENTS (47500) — the standard-accrual value regardless of variant" }
      - { name: allowance_paid_cents, type: integer, source: computed, description: "Per calculation readjustment_allowance: FULL or EARLY with months_served >= 18 -> gross_accrued_cents; EARLY with months_served < 18 -> months_served * round_half_up(47500 * 2 / 3) (per-month rounding, then sum)" }
      - { name: allowance_forfeited_cents, type: integer, source: computed, description: "= gross_accrued_cents - allowance_paid_cents" }
      - { name: nce_eligible, type: boolean, source: computed, description: "Non-competitive eligibility: true iff months_served >= NCE_MIN_MONTHS_SERVED (12) AND (completion_type = FULL OR et_reason = MEDICAL)" }
      - { name: nce_duration_months, type: integer, source: computed, description: "12 when nce_eligible else 0" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CountryProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "PATCH /volunteer-portal/country-programs/{id} with status=SUSPENDED"
        actor: SystemAdmin
        preconditions: []
        side_effects: []
        note: "SUSPENDED blocks creation of new assignment openings; existing openings/invitations are unaffected."
      - from: SUSPENDED
        to: OPEN
        trigger: "PATCH /volunteer-portal/country-programs/{id} with status=OPEN"
        actor: SystemAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /volunteer-portal/country-programs/{id} with status=CLOSED"
        actor: SystemAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "PATCH /volunteer-portal/country-programs/{id} with status=CLOSED"
        actor: SystemAdmin
        preconditions: []
        side_effects: []

  - entity: AssignmentOpening
    initial_state: OPEN
    terminal_states: [FILLED, CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system (automatic when an invitation acceptance makes seats_committed == seats_total)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILLED
        to: OPEN
        trigger: "system (automatic when a rescission cascade drops seats_committed below seats_total)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cyclic seat churn: FILLED openings reopen when an accepted invitation is rescinded."
      - from: OPEN
        to: CLOSED
        trigger: "system (clock sweep: logical clock advances past invitation_issue_deadline while status is OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /volunteer-portal/assignment-openings/{id}/cancel"
        actor: SystemAdmin
        preconditions: []
        side_effects:
          - "Every Invitation with assignment_opening_id = this opening and status ISSUED becomes RESCINDED; seats_provisional decremented per such invitation; each such invitation's Application moves INVITED -> UNDER_REVIEW."
          - "Every Invitation with status ACCEPTED becomes RESCINDED; seats_committed decremented per such invitation; each such Application moves ACCEPTED -> UNDER_REVIEW; each such application's MedicalClearance in SUBMITTED or DEFERRED becomes VOID; each such application's LegalClearance lifecycle becomes VOID."
      - from: FILLED
        to: CANCELLED
        trigger: "POST /volunteer-portal/assignment-openings/{id}/cancel"
        actor: SystemAdmin
        preconditions: []
        side_effects:
          - "Same cascade as OPEN -> CANCELLED (ISSUED invitations rescinded, ACCEPTED invitations rescinded, applications revert to UNDER_REVIEW, in-flight clearances voided)."

  - entity: Application
    initial_state: DRAFT
    terminal_states: [NOT_SELECTED, WITHDRAWN, SEPARATED, SWORN_IN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /volunteer-portal/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "sector_preferences has at least 1 element (ERR_VALIDATION)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /volunteer-portal/applications/{id}/begin-review"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INTERVIEWING
        trigger: "POST /volunteer-portal/applications/{id}/interviews (interview creation)"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: EVALUATED
        trigger: "POST /volunteer-portal/interviews/{id}/complete (interview completion)"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: UNDER_REVIEW
        trigger: "POST /volunteer-portal/interviews/{id}/cancel (all interviews cancelled leaves the application back in review)"
        actor: PlacementOfficer
        preconditions:
          - "No other SCHEDULED interview remains for this application after this cancellation"
        side_effects: []
        note: "Interview loop: cancelling the last open interview reverts the application to UNDER_REVIEW so a new interview can be scheduled."
      - from: EVALUATED
        to: INVITED
        trigger: "POST /volunteer-portal/invitations (invitation issuance)"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /volunteer-portal/invitations/{id}/accept"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: INVITED
        to: UNDER_REVIEW
        trigger: "system cascade (invitation DECLINED by applicant, EXPIRED by clock sweep, or RESCINDED by opening cancellation)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Re-matching loop: the application returns to UNDER_REVIEW and may be interviewed again or invited to another opening."
      - from: ACCEPTED
        to: UNDER_REVIEW
        trigger: "system cascade (accepted invitation RESCINDED via medical denial, legal denial, opening cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CLEARED_TO_DEPART
        trigger: "POST /volunteer-portal/training-enrollments (enrollment into a training cohort)"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: CLEARED_TO_DEPART
        to: IN_TRAINING
        trigger: "system (clock sweep advances the enrolled TrainingCohort SCHEDULED -> IN_SESSION)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRAINING
        to: SWORN_IN
        trigger: "system cascade (TrainingEnrollment swear-in creates the VolunteerService)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED_TO_DEPART
        to: SEPARATED
        trigger: "system cascade (second consecutive FAILED training assessment separates the enrollment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRAINING
        to: SEPARATED
        trigger: "system cascade (second consecutive FAILED training assessment separates the enrollment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "Any SCHEDULED Interview for this application becomes CANCELLED."
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "Any SCHEDULED Interview for this application becomes CANCELLED."
      - from: EVALUATED
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "The ISSUED Invitation becomes DECLINED; its opening's seats_provisional decremented."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "The ACCEPTED Invitation becomes RESCINDED; its opening's seats_committed decremented; if the opening was FILLED and now seats_committed < seats_total, the opening returns to OPEN."
          - "MedicalClearance in SUBMITTED or DEFERRED becomes VOID; LegalClearance lifecycle becomes VOID."
      - from: CLEARED_TO_DEPART
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "The ACCEPTED Invitation becomes RESCINDED (seat released as above)."
          - "TrainingEnrollment in ENROLLED | REMEDIATION | FAILED becomes SEPARATED; cohort enrolled_count decremented."
      - from: IN_TRAINING
        to: WITHDRAWN
        trigger: "POST /volunteer-portal/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "The ACCEPTED Invitation becomes RESCINDED (seat released as above)."
          - "TrainingEnrollment in ENROLLED | REMEDIATION | FAILED becomes SEPARATED; cohort enrolled_count decremented."
      - from: UNDER_REVIEW
        to: NOT_SELECTED
        trigger: "POST /volunteer-portal/applications/{id}/reject"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: EVALUATED
        to: NOT_SELECTED
        trigger: "POST /volunteer-portal/applications/{id}/reject"
        actor: PlacementOfficer
        preconditions: []
        side_effects: []

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /volunteer-portal/interviews/{id}/complete"
        actor: PlacementOfficer
        preconditions:
          - "All four dimension scores supplied in [1.0, 5.0] (ERR_VALIDATION)"
        side_effects:
          - "overall_score and recommendation computed per interview_overall_score"
          - "Application INTERVIEWING -> EVALUATED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /volunteer-portal/interviews/{id}/cancel"
        actor: PlacementOfficer
        preconditions: []
        side_effects:
          - "If no other SCHEDULED interview remains for the application: Application INTERVIEWING -> UNDER_REVIEW"

  - entity: Invitation
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, RESCINDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /volunteer-portal/invitations/{id}/accept"
        actor: Applicant
        preconditions:
          - "None beyond the state guard: the clock sweep expires an invitation the moment the logical clock passes acceptance_deadline, so an ISSUED invitation always satisfies logical clock <= acceptance_deadline"
        side_effects:
          - "Opening: seats_provisional -= 1; seats_committed += 1; if seats_committed == seats_total the opening becomes FILLED"
          - "Application INVITED -> ACCEPTED"
          - "LegalClearance auto-created (both dimensions PENDING, lifecycle ACTIVE)"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /volunteer-portal/invitations/{id}/decline OR system cascade (applicant withdraws while INVITED)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "Opening: seats_provisional -= 1"
          - "Application INVITED -> UNDER_REVIEW"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep: logical clock > acceptance_deadline while ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "Opening: seats_provisional -= 1"
          - "Application INVITED -> UNDER_REVIEW"
      - from: ISSUED
        to: RESCINDED
        trigger: "system cascade (opening cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Opening: seats_provisional -= 1"
          - "Application INVITED -> UNDER_REVIEW"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "system cascade (medical clearance DENIED, legal clearance overall DENIED, opening cancelled, or applicant withdrawal)"
        actor: system
        preconditions: []
        side_effects:
          - "Opening: seats_committed -= 1; if opening was FILLED and now seats_committed < seats_total, opening becomes OPEN"
          - "Application ACCEPTED -> UNDER_REVIEW"

  - entity: MedicalClearance
    initial_state: SUBMITTED
    terminal_states: [CLEARED, CLEARED_WITH_ACCOMMODATION, DENIED, VOID]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /volunteer-portal/medical-clearances/{id}/determine with determination=CLEARED"
        actor: MedicalOfficer
        preconditions:
          - "max_tier_gap <= 0 (ERR_ACCOMMODATION_DETERMINATION_INVALID when any condition exceeds the pinned tier)"
          - "dental_status == CLEAR (ERR_DENTAL_TREATMENT_PENDING otherwise)"
        side_effects: []
      - from: SUBMITTED
        to: CLEARED_WITH_ACCOMMODATION
        trigger: "POST /volunteer-portal/medical-clearances/{id}/determine with determination=CLEARED_WITH_ACCOMMODATION"
        actor: MedicalOfficer
        preconditions:
          - "max_tier_gap == 1 (ERR_ACCOMMODATION_DETERMINATION_INVALID otherwise)"
          - "accommodation_granted == true in the request (ERR_ACCOMMODATION_DETERMINATION_INVALID otherwise)"
          - "dental_status == CLEAR (ERR_DENTAL_TREATMENT_PENDING otherwise)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /volunteer-portal/medical-clearances/{id}/determine with determination=DENIED"
        actor: MedicalOfficer
        preconditions: []
        side_effects:
          - "Cascade link 1: the application's ACCEPTED Invitation becomes RESCINDED"
          - "Cascade link 2 (from link 1): the invitation's release reverts Application ACCEPTED -> UNDER_REVIEW"
          - "Cascade link 3 (from link 1): the opening's seats_committed decrements; a FILLED opening with seats_committed < seats_total returns to OPEN"
          - "Cascade link 3' (from the denial): the application's LegalClearance lifecycle becomes VOID"
      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /volunteer-portal/medical-clearances/{id}/determine with determination=DEFERRED"
        actor: MedicalOfficer
        preconditions:
          - "deferral_count < MAX_MEDICAL_DEFERRALS (2) (ERR_MAX_DEFERRALS_REACHED)"
        side_effects: []
      - from: DEFERRED
        to: SUBMITTED
        trigger: "POST /volunteer-portal/medical-clearances/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "Application status is ACCEPTED (ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "conditions and dental_status replaced wholesale from the request"
          - "deferral_count += 1; max_tier_gap recomputed"
      - from: SUBMITTED
        to: VOID
        trigger: "system cascade (application withdrawal or opening cancellation while clearance is in flight)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFERRED
        to: VOID
        trigger: "system cascade (application withdrawal or opening cancellation while clearance is in flight)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LegalClearance
    initial_state: PENDING
    terminal_states: [CLEARED, DENIED, VOID]
    note: "Parallel state dimensions: background_check_status and suitability_status evolve independently via their own endpoints; overall_status is derived from the two dimensions and lifecycle. initial_state/terminal_states refer to overall_status."
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /volunteer-portal/legal-clearances/{id}/adjudicate-background with outcome=CLEAR (suitability still PENDING)"
        actor: LegalReviewer
        preconditions:
          - "background_check_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "lifecycle == ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "background_check_status = CLEAR; background_adjudicated_by = X-User-ID"
      - from: PENDING
        to: DENIED
        trigger: "POST /volunteer-portal/legal-clearances/{id}/adjudicate-background with outcome=ADVERSE"
        actor: LegalReviewer
        preconditions:
          - "background_check_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "lifecycle == ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "background_check_status = ADVERSE; background_adjudicated_by = X-User-ID"
          - "Denial cascade identical to medical DENIED: ACCEPTED invitation RESCINDED (link 1) -> Application ACCEPTED -> UNDER_REVIEW (link 2) -> opening seat released, FILLED may reopen (link 3); MedicalClearance in SUBMITTED or DEFERRED becomes VOID"
      - from: PENDING
        to: DENIED
        trigger: "POST /volunteer-portal/legal-clearances/{id}/determine-suitability with outcome=UNFAVORABLE"
        actor: LegalReviewer
        preconditions:
          - "suitability_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "lifecycle == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "background_check_status != PENDING (ERR_INVALID_STATE: suitability requires an adjudicated background check first)"
          - "X-User-ID != background_adjudicated_by (ERR_SUITABILITY_SELF_APPROVAL)"
        side_effects:
          - "suitability_status = UNFAVORABLE; suitability_decided_by = X-User-ID"
          - "Denial cascade identical to medical DENIED (invitation rescinded, application reverts, seat released, in-flight medical clearance VOID)"
      - from: PENDING
        to: CLEARED
        trigger: "POST /volunteer-portal/legal-clearances/{id}/determine-suitability with outcome=FAVORABLE while background_check_status == CLEAR"
        actor: LegalReviewer
        preconditions:
          - "suitability_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "lifecycle == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "background_check_status != PENDING (ERR_INVALID_STATE)"
          - "X-User-ID != background_adjudicated_by (ERR_SUITABILITY_SELF_APPROVAL)"
        side_effects:
          - "suitability_status = FAVORABLE; suitability_decided_by = X-User-ID"

  - entity: TrainingCohort
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "system (clock sweep: logical clock >= start_date while SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "Each TrainingEnrollment of this cohort in ENROLLED | REMEDIATION has its Application moved CLEARED_TO_DEPART -> IN_TRAINING"
      - from: IN_SESSION
        to: CONCLUDED
        trigger: "system (clock sweep: logical clock >= end_date while IN_SESSION)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [SWORN_IN, SEPARATED]
    transitions:
      - from: ENROLLED
        to: PASSED
        trigger: "POST /volunteer-portal/training-enrollments/{id}/assess (all component thresholds met)"
        actor: TrainingDirector
        preconditions:
          - "Cohort status == IN_SESSION (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "assessment_attempts += 1; language_score/technical_score/cultural_score recorded"
      - from: ENROLLED
        to: FAILED
        trigger: "POST /volunteer-portal/training-enrollments/{id}/assess (any component below threshold)"
        actor: TrainingDirector
        preconditions:
          - "Cohort status == IN_SESSION (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "assessment_attempts += 1; scores recorded"
      - from: FAILED
        to: REMEDIATION
        trigger: "POST /volunteer-portal/training-enrollments/{id}/remediate"
        actor: TrainingDirector
        preconditions: []
        side_effects: []
      - from: REMEDIATION
        to: PASSED
        trigger: "POST /volunteer-portal/training-enrollments/{id}/assess (second attempt, all thresholds met)"
        actor: TrainingDirector
        preconditions:
          - "Cohort status == IN_SESSION (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "assessment_attempts += 1; scores recorded"
      - from: REMEDIATION
        to: SEPARATED
        trigger: "POST /volunteer-portal/training-enrollments/{id}/assess (second attempt, any threshold missed)"
        actor: TrainingDirector
        preconditions:
          - "Cohort status == IN_SESSION (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "assessment_attempts += 1; scores recorded"
          - "Application -> SEPARATED; the ACCEPTED invitation is RESCINDED (opening seat released, FILLED may reopen); cohort enrolled_count -= 1"
      - from: PASSED
        to: SWORN_IN
        trigger: "POST /volunteer-portal/training-enrollments/{id}/swear-in"
        actor: TrainingDirector
        preconditions: []
        side_effects:
          - "Cascade link 1: VolunteerService created (service_start_date = logical clock; expected_completion_date = start + 810 days; status ACTIVE; application/opening/program copied from the accepted invitation)"
          - "Cascade link 2 (from link 1): Application IN_TRAINING -> SWORN_IN (terminal)"
      - from: ENROLLED
        to: SEPARATED
        trigger: "system cascade (applicant withdrawal)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort enrolled_count -= 1"
      - from: FAILED
        to: SEPARATED
        trigger: "system cascade (applicant withdrawal)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort enrolled_count -= 1"
      - from: REMEDIATION
        to: SEPARATED
        trigger: "system cascade (applicant withdrawal)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort enrolled_count -= 1"

  - entity: VolunteerService
    initial_state: ACTIVE
    terminal_states: [COMPLETED, EARLY_TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /volunteer-portal/volunteer-services/{id}/events with event_type=SECURITY_ALERT and severity=CRITICAL"
        actor: CountryDirector
        preconditions: []
        side_effects:
          - "ServiceEvent appended (append-only); service suspended (evacuation protocol)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /volunteer-portal/volunteer-services/{id}/events with event_type=ALL_CLEAR"
        actor: CountryDirector
        preconditions: []
        side_effects:
          - "ServiceEvent appended; volunteer returned to active service"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /volunteer-portal/volunteer-services/{id}/complete"
        actor: CountryDirector
        preconditions:
          - "Logical clock >= expected_completion_date (ERR_SERVICE_TERM_NOT_REACHED)"
        side_effects:
          - "actual_end_date = logical clock; days_served and months_served computed"
          - "CompletionRecord created (completion_type=FULL) per readjustment_allowance"
          - "All SitePlacements of this service in PROPOSED | CONFIRMED | REJECTED become ENDED"
      - from: ACTIVE
        to: EARLY_TERMINATED
        trigger: "POST /volunteer-portal/volunteer-services/{id}/early-terminate"
        actor: CountryDirector
        preconditions: []
        side_effects:
          - "actual_end_date = logical clock; days_served and months_served computed"
          - "CompletionRecord created (completion_type=EARLY, et_reason from request) per readjustment_allowance"
          - "All SitePlacements of this service in PROPOSED | CONFIRMED | REJECTED become ENDED"
      - from: SUSPENDED
        to: EARLY_TERMINATED
        trigger: "POST /volunteer-portal/volunteer-services/{id}/early-terminate"
        actor: CountryDirector
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> EARLY_TERMINATED"

  - entity: SitePlacement
    initial_state: PROPOSED
    terminal_states: [CONFIRMED, REJECTED, ENDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /volunteer-portal/site-placements/{id}/review with decision=CONFIRM"
        actor: CountryDirector
        preconditions:
          - "VolunteerService status == ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
          - "counterpart_agreement_signed == true in request (ERR_AGREEMENT_NOT_SIGNED)"
          - "has_running_water AND structurally_sound AND secure_locks all true in request (ERR_HOUSING_STANDARDS_NOT_MET)"
        side_effects:
          - "Agreement and housing fields recorded; inspection_passed recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /volunteer-portal/site-placements/{id}/review with decision=REJECT"
        actor: CountryDirector
        preconditions:
          - "VolunteerService status == ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
        side_effects:
          - "Agreement and housing fields recorded; inspection_passed recomputed"
      - from: REJECTED
        to: CONFIRMED
        trigger: "POST /volunteer-portal/site-placements/{id}/review with decision=CONFIRM (re-review loop)"
        actor: CountryDirector
        preconditions:
          - "VolunteerService status == ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
          - "counterpart_agreement_signed == true in request (ERR_AGREEMENT_NOT_SIGNED)"
          - "All three housing standards true in request (ERR_HOUSING_STANDARDS_NOT_MET)"
        side_effects:
          - "Agreement and housing fields recorded; inspection_passed recomputed"
      - from: REJECTED
        to: REJECTED
        trigger: "POST /volunteer-portal/site-placements/{id}/review with decision=REJECT (re-review loop)"
        actor: CountryDirector
        preconditions:
          - "VolunteerService status == ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
        side_effects:
          - "Agreement and housing fields recorded; inspection_passed recomputed"
      - from: PROPOSED
        to: ENDED
        trigger: "system cascade (service completed or early-terminated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: ENDED
        trigger: "system cascade (service completed or early-terminated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: ENDED
        trigger: "system cascade (service completed or early-terminated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: invitation-issue-stale-opening
    parent_entity: AssignmentOpening
    write_endpoint: "POST /volunteer-portal/invitations"
    occ_field: expected_assignment_opening_version
    description: |
      Issuing an Invitation against an AssignmentOpening whose version has
      advanced since the issuing officer last observed it is rejected with
      412. The officer's issuance decision is based on a read of the opening
      (seats, dates, status); any mutation to the opening in the meantime
      (another issuance consuming a provisional seat, an accept committing a
      seat, an admin edit) invalidates that basis, so the writer must
      re-read and retry with the current version.
    error_id: ERR_STALE_OPENING_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: skill_match_score
    trigger: "GET /volunteer-portal/applications/{id}/matches (evaluated per candidate opening) and implicitly at invitation issuance (eligibility gate)"
    algorithm: weighted_scoring
    formula: |
      Let R = opening.required_skills, A = applicant.skills.
      required_met = |R intersect A|
      strict_score = (required_met / |R|) if |R| > 0 else 1.0        # empty requirements: defined as 1.0
      sector_bonus = 1.0 if opening.sector IN application.sector_preferences else 0.0
      country_bonus:
        if application.country_preference_ids is empty -> 0.5        # willing to serve anywhere
        elif opening.country_program_id is at 0-based rank index i in country_preference_ids -> 1.0 - 0.25 * i
        else -> 0.0
      weighted_score = round_half_up(0.7 * strict_score + 0.2 * sector_bonus + 0.1 * country_bonus, 2)
      Eligibility for the matches listing (selector policy):
        candidate set = openings with status == OPEN
                        AND logical clock <= opening.invitation_issue_deadline
                        AND seats_provisional + seats_committed < seats_total
                        AND strict_score == 1.0
                        AND (country_preference_ids empty OR opening.country_program_id IN country_preference_ids)
      Ranking: weighted_score DESC, then departure_date ASC, then opening.created_at ASC (never id).
      Empty candidate set -> 200 with an empty matches array (NOT an error).
    input_set: "All AssignmentOpenings (any program); the Application and its Applicant"
    constants:
      STRICT_WEIGHT: 0.7
      SECTOR_WEIGHT: 0.2
      COUNTRY_WEIGHT: 0.1
      COUNTRY_RANK_STEP: 0.25
      OPEN_PREFERENCE_COUNTRY_BONUS: 0.5
    precision: "strict_score exact rational; weighted_score 2 decimal places, round_half_up"
    variants:
      - name: strict
        when: "Eligibility gate (invitation issuance requires strict_score == 1.0) and eligibility filter of the matches listing"
        difference: "Only required-skill coverage: required_met / |R|, with empty R defined as 1.0. Ignores sector and country preferences entirely."
      - name: preference_weighted
        when: "Ranking within the matches listing"
        difference: "Blends strict coverage with sector and ranked country preferences; identical inputs yield a different number than strict (e.g. strict 1.0 vs weighted 0.98 for a rank-2 country)."

  - name: interview_overall_score
    trigger: "POST /volunteer-portal/interviews/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      raw = 0.30 * motivation_score + 0.25 * adaptability_score
            + 0.25 * skill_competency_score + 0.20 * cross_cultural_score
      overall_score = round_half_up(raw, 2)
      minimum_dimension = min(motivation_score, adaptability_score, skill_competency_score, cross_cultural_score)
      recommendation:
        if minimum_dimension < MIN_DIMENSION_FLOOR (2.0) -> NOT_RECOMMENDED     # cap rule overrides the weighted sum
        elif overall_score >= STRONGLY_RECOMMEND_MIN (4.0) -> STRONGLY_RECOMMEND
        elif overall_score >= RECOMMEND_MIN (3.0) -> RECOMMEND
        elif overall_score >= NEUTRAL_MIN (2.5) -> NEUTRAL
        else -> NOT_RECOMMENDED
      Evaluation order is fixed: round the weighted sum FIRST, then apply the cap rule, then tier.
    input_set: "The four dimension scores of the completed Interview"
    constants:
      W_MOTIVATION: 0.30
      W_ADAPTABILITY: 0.25
      W_SKILL_COMPETENCY: 0.25
      W_CROSS_CULTURAL: 0.20
      MIN_DIMENSION_FLOOR: 2.0
      STRONGLY_RECOMMEND_MIN: 4.0
      RECOMMEND_MIN: 3.0
      NEUTRAL_MIN: 2.5
    precision: "2 decimal places, round_half_up (applied to the weighted sum BEFORE tier comparison)"
    variants: []

  - name: readjustment_allowance
    trigger: "VolunteerService completion or early termination (CompletionRecord creation)"
    algorithm: tiered_pricing
    formula: |
      days_served = whole days between service_start_date and actual_end_date (end - start, in days)
      months_served = floor((days_served + HALF_MONTH_DAYS) / DAYS_PER_MONTH)    # half-month rounds up: day 44 -> 1 month, day 45 -> 2
      gross_accrued_cents = months_served * READJUSTMENT_MONTHLY_RATE_CENTS
      Variant selection:
        completion_type == FULL                    -> STANDARD
        completion_type == EARLY and months_served >= ET_SHORT_SERVICE_THRESHOLD_MONTHS -> STANDARD
        completion_type == EARLY and months_served <  ET_SHORT_SERVICE_THRESHOLD_MONTHS -> PENALIZED
      STANDARD:  allowance_paid_cents = gross_accrued_cents
      PENALIZED: allowance_paid_cents = months_served * round_half_up(READJUSTMENT_MONTHLY_RATE_CENTS * 2 / 3)
                 # rounding order PINNED: round the per-month amount to whole cents FIRST, then multiply by months.
                 # (months * 31667) — NOT round_half_up(gross * 2/3); the two differ, e.g. 3 months -> 95001 vs 95000.
      allowance_forfeited_cents = gross_accrued_cents - allowance_paid_cents     # conservation invariant: paid + forfeited == gross
      nce_eligible = (months_served >= NCE_MIN_MONTHS_SERVED) AND (completion_type == FULL OR et_reason == MEDICAL)
      nce_duration_months = NCE_DURATION_MONTHS if nce_eligible else 0
    input_set: "The closing VolunteerService (start/end dates, completion type, et_reason)"
    constants:
      READJUSTMENT_MONTHLY_RATE_CENTS: 47500
      DAYS_PER_MONTH: 30
      HALF_MONTH_DAYS: 15
      SERVICE_TERM_DAYS: 810
      ET_SHORT_SERVICE_THRESHOLD_MONTHS: 18
      NCE_MIN_MONTHS_SERVED: 12
      NCE_DURATION_MONTHS: 12
    precision: "whole cents (integer); per-month rounding half-up BEFORE multiplying in the PENALIZED variant"
    variants:
      - name: standard
        when: "FULL completion, or EARLY termination with months_served >= 18"
        difference: "Pays the full accrual: paid == gross, forfeited == 0."
      - name: penalized
        when: "EARLY termination with months_served < 18"
        difference: "Pays two-thirds per served month with per-month rounding before summation; the withheld third is forfeited. Same months_served yields a strictly smaller paid amount than standard."

  - name: medical_accommodation_gap
    trigger: "MedicalClearance creation and resubmission (max_tier_gap recompute); consulted by determine"
    algorithm: constraint_propagation
    formula: |
      pinned_tier = the application's ACCEPTED invitation's pinned_country_medical_tier
      # Evaluation order PINNED: resolve the pinned tier from the invitation snapshot FIRST;
      # the live CountryProgram.medical_support_tier is NEVER consulted for this review,
      # even if the program's tier changed after issuance.
      max_tier_gap = max over conditions c of (c.required_support_tier - pinned_tier), or 0 when conditions is empty
      Determination admissibility (enforced by determine):
        max_tier_gap <= 0 -> determination must be CLEARED | DENIED | DEFERRED
        max_tier_gap == 1 -> determination must be CLEARED_WITH_ACCOMMODATION (with accommodation_granted=true) | DENIED | DEFERRED
        max_tier_gap >= 2 -> determination must be DENIED | DEFERRED
      Any inadmissible combination -> ERR_ACCOMMODATION_DETERMINATION_INVALID (422).
      dental_status == NEEDS_TREATMENT additionally forbids CLEARED and CLEARED_WITH_ACCOMMODATION
      -> ERR_DENTAL_TREATMENT_PENDING (422).
    input_set: "The MedicalClearance's conditions; the ACCEPTED Invitation of the same application (pinned tier)"
    constants:
      MAX_MEDICAL_DEFERRALS: 2
    precision: "integer tiers"
    variants: []

  - name: cohort_overlap_capacity
    trigger: "POST /volunteer-portal/training-cohorts"
    algorithm: interval_merge
    formula: |
      Windows are half-open [start_date, end_date): two cohorts overlap iff
      new.start_date < existing.end_date AND existing.start_date < new.end_date.
      Within the same CountryProgram, consider all existing cohorts with status IN {SCHEDULED, IN_SESSION}
      that overlap the new cohort's window. Aggregate-capacity rule (NOT strict exclusion):
      require new.capacity + sum(overlapping existing capacities) <= program.training_capacity,
      else reject with ERR_TRAINING_CAPACITY_EXCEEDED.
      Note the deliberate semantic contrast with interview scheduling: interviews forbid ANY overlap
      of half-open windows (adjacency allowed), while cohorts PERMIT overlap up to a summed capacity cap.
    input_set: "TrainingCohorts of the same CountryProgram with status SCHEDULED or IN_SESSION"
    constants: {}
    precision: "integer capacities"
    variants: []

  - name: interview_overlap_check
    trigger: "POST /volunteer-portal/applications/{id}/interviews"
    algorithm: interval_merge
    formula: |
      Windows are half-open [scheduled_start, scheduled_end). For the same interviewer_id,
      the new interview must not overlap any existing interview with status == SCHEDULED:
      overlap iff new.scheduled_start < existing.scheduled_end AND existing.scheduled_start < new.scheduled_end.
      Adjacency is allowed: new.scheduled_start == existing.scheduled_end is NOT an overlap,
      and new.scheduled_end == existing.scheduled_start is NOT an overlap.
      Any overlap -> ERR_INTERVIEW_OVERLAP (409).
    input_set: "Interviews with the same interviewer_id and status SCHEDULED"
    constants: {}
    precision: "exact timestamp comparison"
    variants: []

  - name: service_duration
    trigger: "VolunteerService completion or early termination"
    algorithm: chronological
    formula: |
      days_served = (actual_end_date - service_start_date) expressed in whole days
      months_served = floor((days_served + 15) / 30)
      expected_completion_date = service_start_date + 810 days
    input_set: "The closing VolunteerService"
    constants:
      DAYS_PER_MONTH: 30
      HALF_MONTH_DAYS: 15
      SERVICE_TERM_DAYS: 810
    precision: "whole days / whole months (floor with half-month round-up)"
    variants: []

  - name: clock_sweep
    trigger: "POST /_clock/set_current_utc — every clock set runs the sweep in the pinned order below"
    algorithm: chronological
    formula: |
      On each set_current_utc(to), process in THIS order:
      1. Invitations: every Invitation with status ISSUED and acceptance_deadline < to becomes EXPIRED
         (side effects: seats_provisional -= 1 on its opening; its Application INVITED -> UNDER_REVIEW).
      2. Openings: every AssignmentOpening with status OPEN and invitation_issue_deadline < to becomes CLOSED.
      3. Cohorts: every TrainingCohort with status SCHEDULED and start_date <= to becomes IN_SESSION
         (cascade: enrolled trainees' Applications CLEARED_TO_DEPART -> IN_TRAINING).
      4. Cohorts: every TrainingCohort with status IN_SESSION and end_date <= to becomes CONCLUDED.
      Server startup default: before any set_current_utc call, the logical clock reads exactly
      2026-09-01T00:00:00Z (never the real wall clock).
    input_set: "All ISSUED invitations, OPEN openings, SCHEDULED/IN_SESSION cohorts"
    constants:
      DEFAULT_CLOCK_START: "2026-09-01T00:00:00Z"
      INVITATION_ACCEPTANCE_WINDOW_DAYS: 10
    precision: "second precision on timestamps; deadline comparisons: expiry uses strict <, session/conclusion use <="
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lower number wins
# when a single request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: for Applicant-scoped operations, X-User-ID equals the target Application's applicant_id (applications submit/withdraw, invitations accept/decline, medical-clearances create/resubmit, GET applications/{id}/matches)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /volunteer-portal/applications/{id}/submit, POST /volunteer-portal/applications/{id}/withdraw, POST /volunteer-portal/invitations/{id}/accept, POST /volunteer-portal/invitations/{id}/decline, POST /volunteer-portal/medical-clearances, POST /volunteer-portal/medical-clearances/{id}/resubmit, GET /volunteer-portal/applications/{id}/matches"
  - priority: 4
    category: existence
    check: "Path-template resources exist, validated left-to-right; body-supplied FK references exist (applicant_id, country_program_id, application_id, assignment_opening_id, training_cohort_id)"
    error_id: ERR_APPLICANT_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_OPENING_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INTERVIEW_NOT_FOUND | ERR_INVITATION_NOT_FOUND | ERR_MEDICAL_CLEARANCE_NOT_FOUND | ERR_LEGAL_CLEARANCE_NOT_FOUND | ERR_COHORT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_assignment_opening_version equals the AssignmentOpening's current version"
    error_id: ERR_STALE_OPENING_VERSION
    http_status: 412
    applies_to: "POST /volunteer-portal/invitations"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists (submit requires DRAFT; begin-review requires SUBMITTED; interview creation requires UNDER_REVIEW; interview complete/cancel require SCHEDULED; accept/decline require ISSUED; determine requires SUBMITTED; resubmit requires DEFERRED; background adjudication requires background PENDING; suitability determination requires suitability PENDING and background adjudicated; assess requires ENROLLED or REMEDIATION; remediate requires FAILED; swear-in requires PASSED; complete requires ACTIVE; early-terminate requires ACTIVE or SUSPENDED; placement review requires PROPOSED or REJECTED; opening cancel requires OPEN or FILLED)"
    error_id: ERR_INVALID_APPLICATION_STATE | ERR_OPENING_NOT_OPEN | ERR_INVITATION_NOT_ACTIONABLE | ERR_INVALID_STATE | ERR_MEDICAL_CLEARANCE_NOT_REVIEWABLE | ERR_ENROLLMENT_NOT_ASSESSABLE | ERR_SERVICE_NOT_ACTIVE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: enrollment requires the application's medical clearance CLEARED|CLEARED_WITH_ACCOMMODATION AND legal clearance overall_status CLEARED (ERR_CLEARANCES_NOT_CLEARED); suitability determination must not be made by the same reviewer who adjudicated the background check (ERR_SUITABILITY_SELF_APPROVAL); medical determination must be admissible for max_tier_gap and accommodation_granted (ERR_ACCOMMODATION_DETERMINATION_INVALID); dental NEEDS_TREATMENT forbids CLEARED outcomes (ERR_DENTAL_TREATMENT_PENDING)"
    error_id: ERR_CLEARANCES_NOT_CLEARED | ERR_SUITABILITY_SELF_APPROVAL | ERR_ACCOMMODATION_DETERMINATION_INVALID | ERR_DENTAL_TREATMENT_PENDING
    http_status: 422
    applies_to: "POST /volunteer-portal/training-enrollments, POST /volunteer-portal/legal-clearances/{id}/determine-suitability, POST /volunteer-portal/medical-clearances/{id}/determine"
  - priority: 8
    category: business_constraint
    check: "Constraint gates: application submit requires >= 1 sector preference (ERR_VALIDATION); opening creation requires program status OPEN (ERR_OPENING_NOT_OPEN); interview scheduling must not overlap the interviewer's SCHEDULED interviews (ERR_INTERVIEW_OVERLAP); invitation issuance requires strict skill coverage 1.0 (ERR_SKILL_REQUIREMENTS_NOT_MET), latest completed interview recommendation RECOMMENDED or STRONGLY_RECOMMEND (ERR_RECOMMENDATION_INSUFFICIENT), country preference compatibility (ERR_PREFERENCE_MISMATCH), seats_provisional + seats_committed < seats_total (ERR_NO_SEATS_AVAILABLE); medical clearance creation requires no other active (SUBMITTED|DEFERRED) clearance for the application (ERR_DUPLICATE_ACTIVE_CLEARANCE); DEFER determination requires deferral_count < 2 (ERR_MAX_DEFERRALS_REACHED); enrollment cohort must belong to the invitation's pinned program (ERR_COHORT_PROGRAM_MISMATCH) and have enrolled_count < capacity (ERR_COHORT_CAPACITY_EXCEEDED); cohort creation must satisfy the aggregate overlap capacity rule (ERR_TRAINING_CAPACITY_EXCEEDED); placement CONFIRM requires signed agreement (ERR_AGREEMENT_NOT_SIGNED) and all housing standards (ERR_HOUSING_STANDARDS_NOT_MET)"
    error_id: ERR_VALIDATION | ERR_OPENING_NOT_OPEN | ERR_INTERVIEW_OVERLAP | ERR_SKILL_REQUIREMENTS_NOT_MET | ERR_RECOMMENDATION_INSUFFICIENT | ERR_PREFERENCE_MISMATCH | ERR_NO_SEATS_AVAILABLE | ERR_DUPLICATE_ACTIVE_CLEARANCE | ERR_MAX_DEFERRALS_REACHED | ERR_COHORT_PROGRAM_MISMATCH | ERR_COHORT_CAPACITY_EXCEEDED | ERR_TRAINING_CAPACITY_EXCEEDED | ERR_AGREEMENT_NOT_SIGNED | ERR_HOUSING_STANDARDS_NOT_MET
    http_status: 400
    note: "HTTP status per error in the catalog: ERR_VALIDATION 400; the quota/conflict errors (ERR_OPENING_NOT_OPEN, ERR_INTERVIEW_OVERLAP, ERR_NO_SEATS_AVAILABLE, ERR_DUPLICATE_ACTIVE_CLEARANCE, ERR_COHORT_CAPACITY_EXCEEDED, ERR_TRAINING_CAPACITY_EXCEEDED) are 409; the remaining constraint errors are 422" 
    applies_to: "respective write endpoints"
  - priority: 9
    category: business_temporal
    check: "Temporal gate: service completion requires logical clock >= expected_completion_date (ERR_SERVICE_TERM_NOT_REACHED). (Invitation deadlines are enforced by the deterministic clock sweep — an ISSUED invitation is never past its acceptance_deadline, and an OPEN opening is never past its invitation_issue_deadline — so no separate temporal error exists for those paths; the sweep-induced state is what clients observe.)"
    error_id: ERR_SERVICE_TERM_NOT_REACHED
    http_status: 422
    applies_to: "POST /volunteer-portal/volunteer-services/{id}/complete"
  - priority: 10
    category: business_constraint
    check: "Field shape: required fields present; enum members valid; seats_total >= 1; capacity >= 1; training_capacity >= 1; medical_support_tier in 1..3; scores in [1.0, 5.0]; end strictly after start; severity in enum; determination/outcome/decision/reason in their enums"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Applicant-scoped operation attempted with X-User-ID different from the application's applicant_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, unknown enum member, out-of-range number, end <= start, empty sector_preferences, or other field-shape violation" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Referenced applicant does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Referenced country program does not exist (path or body FK, including entries in country_preference_ids)" }
  - { id: ERR_OPENING_NOT_FOUND, http: 404, condition: "Referenced assignment opening does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced application does not exist" }
  - { id: ERR_INTERVIEW_NOT_FOUND, http: 404, condition: "Referenced interview does not exist" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "Referenced invitation does not exist" }
  - { id: ERR_MEDICAL_CLEARANCE_NOT_FOUND, http: 404, condition: "Referenced medical clearance does not exist" }
  - { id: ERR_LEGAL_CLEARANCE_NOT_FOUND, http: 404, condition: "Referenced legal clearance does not exist" }
  - { id: ERR_COHORT_NOT_FOUND, http: 404, condition: "Referenced training cohort does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Referenced training enrollment does not exist" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "Referenced volunteer service does not exist" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "Referenced site placement does not exist" }
  - { id: ERR_STALE_OPENING_VERSION, http: 412, condition: "expected_assignment_opening_version does not match the AssignmentOpening's current version (OCC)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application is not in a state from which the requested transition exists (e.g. submit a SUBMITTED application, begin-review a DRAFT, enroll an application that is not ACCEPTED, medical clearance creation for a non-ACCEPTED application, resubmit while application not ACCEPTED)" }
  - { id: ERR_OPENING_NOT_OPEN, http: 409, condition: "AssignmentOpening status is not OPEN (invitation issuance) or program status is not OPEN (opening creation), or opening cancel attempted on CLOSED/CANCELLED opening" }
  - { id: ERR_INVITATION_NOT_ACTIONABLE, http: 409, condition: "Invitation is not ISSUED (accept/decline attempted on ACCEPTED, DECLINED, EXPIRED, or RESCINDED invitation)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for interviews (complete/cancel a non-SCHEDULED interview; create an interview for an application not UNDER_REVIEW), legal clearances (dimension not PENDING, suitability before background adjudicated, lifecycle VOID), cohorts (assess while cohort not IN_SESSION), and any other machine-guard not owning a dedicated error" }
  - { id: ERR_MEDICAL_CLEARANCE_NOT_REVIEWABLE, http: 409, condition: "determine attempted on a MedicalClearance not in SUBMITTED" }
  - { id: ERR_ENROLLMENT_NOT_ASSESSABLE, http: 409, condition: "assess attempted on an enrollment not in ENROLLED or REMEDIATION; remediate attempted on a non-FAILED enrollment; swear-in attempted on a non-PASSED enrollment" }
  - { id: ERR_SERVICE_NOT_ACTIVE, http: 409, condition: "Service-scoped action requires ACTIVE (or ACTIVE|SUSPENDED for early-terminate): complete from non-ACTIVE, site placement create/review for a non-ACTIVE service, action on a terminated service" }
  - { id: ERR_CLEARANCES_NOT_CLEARED, http: 422, condition: "Training enrollment requires medical clearance CLEARED or CLEARED_WITH_ACCOMMODATION and legal overall_status CLEARED" }
  - { id: ERR_SUITABILITY_SELF_APPROVAL, http: 422, condition: "Suitability determination attempted by the same X-User-ID that adjudicated the background check (segregation of duties)" }
  - { id: ERR_ACCOMMODATION_DETERMINATION_INVALID, http: 422, condition: "Determination inadmissible for max_tier_gap (gap<=0 forbids CLEARED_WITH_ACCOMMODATION; gap==1 requires CLEARED_WITH_ACCOMMODATION with accommodation_granted=true and forbids CLEARED; gap>=2 requires DENIED or DEFERRED)" }
  - { id: ERR_DENTAL_TREATMENT_PENDING, http: 422, condition: "dental_status NEEDS_TREATMENT blocks CLEARED and CLEARED_WITH_ACCOMMODATION determinations" }
  - { id: ERR_NO_SEATS_AVAILABLE, http: 409, condition: "Invitation issuance would exceed seats_total: seats_provisional + seats_committed >= seats_total" }
  - { id: ERR_SKILL_REQUIREMENTS_NOT_MET, http: 422, condition: "Invitation issuance requires strict skill coverage of 1.0 (every required skill held by the applicant)" }
  - { id: ERR_RECOMMENDATION_INSUFFICIENT, http: 422, condition: "Invitation issuance requires the latest completed interview's recommendation to be RECOMMENDED or STRONGLY_RECOMMEND" }
  - { id: ERR_PREFERENCE_MISMATCH, http: 422, condition: "Invitation issuance for an opening whose country program is not in the application's non-empty country_preference_ids" }
  - { id: ERR_INTERVIEW_OVERLAP, http: 409, condition: "New interview window overlaps an existing SCHEDULED interview for the same interviewer_id (half-open intervals; adjacency allowed)" }
  - { id: ERR_DUPLICATE_ACTIVE_CLEARANCE, http: 409, condition: "A MedicalClearance in SUBMITTED or DEFERRED already exists for the application" }
  - { id: ERR_MAX_DEFERRALS_REACHED, http: 422, condition: "DEFERRED determination attempted when deferral_count >= 2" }
  - { id: ERR_COHORT_PROGRAM_MISMATCH, http: 422, condition: "Enrollment cohort's country_program_id differs from the accepted invitation's pinned_country_program_id" }
  - { id: ERR_COHORT_CAPACITY_EXCEEDED, http: 409, condition: "Enrollment would make cohort enrolled_count exceed capacity" }
  - { id: ERR_TRAINING_CAPACITY_EXCEEDED, http: 409, condition: "New cohort overlaps existing SCHEDULED/IN_SESSION cohorts of the same program whose summed capacity plus the new capacity exceeds program training_capacity" }
  - { id: ERR_AGREEMENT_NOT_SIGNED, http: 422, condition: "Placement review with decision=CONFIRM but counterpart_agreement_signed is not true" }
  - { id: ERR_HOUSING_STANDARDS_NOT_MET, http: 422, condition: "Placement review with decision=CONFIRM but one or more housing standards (running water, structural soundness, secure locks) are false" }
  - { id: ERR_SERVICE_TERM_NOT_REACHED, http: 422, condition: "Completion attempted before the logical clock reaches expected_completion_date" }

# =============================================================================
# Table 5: API Endpoint Table
# (All roles: SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer,
#  LegalReviewer, TrainingDirector, CountryDirector)
# =============================================================================
endpoints:
  # --- Applicant ---
  - method: POST
    path: "/volunteer-portal/applicants"
    description: "Register an applicant (operator onboarding)"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, email, date_of_birth, citizenship_country, skills, "languages?"]
    output: Applicant
    side_effects: []

  # --- CountryProgram ---
  - method: POST
    path: "/volunteer-portal/country-programs"
    description: "Create a country program"
    roles: [SystemAdmin]
    code: 201
    input: [country_code, name, medical_support_tier, required_language, language_threshold_score, training_capacity]
    output: CountryProgram
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/volunteer-portal/country-programs/{id}"
    description: "Get a country program"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: CountryProgram
    side_effects: []
  - method: PATCH
    path: "/volunteer-portal/country-programs/{id}"
    description: "Update a country program (status transitions OPEN<->SUSPENDED, ->CLOSED; tier/capacity/threshold edits). Pinned invitation snapshots are NOT retroactively changed."
    roles: [SystemAdmin]
    code: 200
    input: ["status?", "medical_support_tier?", "training_capacity?", "language_threshold_score?"]
    output: CountryProgram
    side_effects: ["status transition per CountryProgram machine", "increments CountryProgram.version by 1"]

  # --- AssignmentOpening ---
  - method: POST
    path: "/volunteer-portal/assignment-openings"
    description: "Create an assignment opening (program must be OPEN)"
    roles: [SystemAdmin]
    code: 201
    input: [country_program_id, sector, title, required_skills, "preferred_skills?", seats_total, departure_date, invitation_issue_deadline]
    output: AssignmentOpening
    side_effects: ["status=OPEN, seats_provisional=0, seats_committed=0"]
  - method: GET
    path: "/volunteer-portal/assignment-openings/{id}"
    description: "Get an assignment opening"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: AssignmentOpening
    side_effects: []
  - method: GET
    path: "/volunteer-portal/assignment-openings"
    description: "List assignment openings with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["country_program_id?", "status?", "sector?"]
    output: AssignmentOpening[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/assignment-openings/{id}/cancel"
    description: "Cancel an opening; rescinds all its ISSUED and ACCEPTED invitations and cascades to applications and in-flight clearances"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: AssignmentOpening
    side_effects: ["status -> CANCELLED; full rescission cascade per AssignmentOpening machine", "increments AssignmentOpening.version by 1"]

  # --- Application ---
  - method: POST
    path: "/volunteer-portal/applications"
    description: "Create an application in DRAFT (X-User-ID must equal applicant_id)"
    roles: [Applicant]
    code: 201
    input: [applicant_id, "sector_preferences?", "country_preference_ids?", "statement?"]
    output: Application
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/volunteer-portal/applications/{id}"
    description: "Get an application"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/volunteer-portal/applications"
    description: "List applications with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["applicant_id?", "status?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/applications/{id}/submit"
    description: "Submit a DRAFT application"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["DRAFT -> SUBMITTED", "increments Application.version by 1"]
  - method: POST
    path: "/volunteer-portal/applications/{id}/withdraw"
    description: "Withdraw a non-terminal application; cascades to invitations, interviews, clearances, enrollments"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["-> WITHDRAWN; cascade per Application machine", "increments Application.version by 1"]
  - method: POST
    path: "/volunteer-portal/applications/{id}/begin-review"
    description: "Move SUBMITTED application to UNDER_REVIEW"
    roles: [PlacementOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "increments Application.version by 1"]
  - method: POST
    path: "/volunteer-portal/applications/{id}/reject"
    description: "Reject an UNDER_REVIEW or EVALUATED application"
    roles: [PlacementOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["-> NOT_SELECTED", "increments Application.version by 1"]
  - method: GET
    path: "/volunteer-portal/applications/{id}/matches"
    description: "Selector read: eligible openings ranked per skill_match_score (weighted DESC, departure_date ASC, created_at ASC); empty candidate set returns 200 with empty matches array. Requires application status != DRAFT. Each matches element has fields: assignment_opening_id, country_program_id, sector, departure_date, strict_score, weighted_score."
    roles: [PlacementOfficer, Applicant]
    code: 200
    input: []
    output: { matches: array }
    side_effects: []

  # --- Interview ---
  - method: POST
    path: "/volunteer-portal/applications/{id}/interviews"
    description: "Schedule an interview (application must be UNDER_REVIEW; interviewer half-open overlap check)"
    roles: [PlacementOfficer]
    code: 201
    input: [interviewer_id, scheduled_start, scheduled_end]
    output: Interview
    side_effects: ["status=SCHEDULED", "Application UNDER_REVIEW -> INTERVIEWING"]
  - method: GET
    path: "/volunteer-portal/applications/{id}/interviews"
    description: "List interviews of an application"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: Interview[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/interviews/{id}/complete"
    description: "Record the four dimension scores; computes overall_score and recommendation; moves application to EVALUATED"
    roles: [PlacementOfficer]
    code: 200
    input: [motivation_score, adaptability_score, skill_competency_score, cross_cultural_score]
    output: Interview
    side_effects: ["SCHEDULED -> COMPLETED; overall_score and recommendation computed per interview_overall_score", "Application INTERVIEWING -> EVALUATED"]
  - method: POST
    path: "/volunteer-portal/interviews/{id}/cancel"
    description: "Cancel a SCHEDULED interview; if it was the last SCHEDULED one, the application returns to UNDER_REVIEW"
    roles: [PlacementOfficer]
    code: 200
    input: []
    output: Interview
    side_effects: ["SCHEDULED -> CANCELLED", "conditional Application INTERVIEWING -> UNDER_REVIEW"]

  # --- Invitation ---
  - method: POST
    path: "/volunteer-portal/invitations"
    description: "Issue an invitation for a specific opening (OCC on the opening; pins departure date, program id, and medical tier from the opening/program at issuance)"
    roles: [PlacementOfficer]
    code: 201
    input: [application_id, assignment_opening_id, expected_assignment_opening_version]
    output: Invitation
    side_effects:
      - "status=ISSUED; issued_at = logical clock; acceptance_deadline = issued_at + 10 days"
      - "pins pinned_country_program_id, pinned_country_medical_tier, pinned_departure_date from the opening and its program"
      - "opening seats_provisional += 1; increments AssignmentOpening.version by 1"
      - "Application EVALUATED -> INVITED"
  - method: GET
    path: "/volunteer-portal/invitations/{id}"
    description: "Get an invitation"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: Invitation
    side_effects: []
  - method: GET
    path: "/volunteer-portal/invitations"
    description: "List invitations with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["application_id?", "assignment_opening_id?", "status?"]
    output: Invitation[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/invitations/{id}/accept"
    description: "Applicant accepts an ISSUED invitation before its acceptance deadline"
    roles: [Applicant]
    code: 200
    input: []
    output: Invitation
    side_effects:
      - "ISSUED -> ACCEPTED"
      - "opening seats_provisional -= 1, seats_committed += 1; opening OPEN -> FILLED when seats_committed == seats_total"
      - "Application INVITED -> ACCEPTED"
      - "LegalClearance auto-created (PENDING/PENDING, lifecycle ACTIVE)"
  - method: POST
    path: "/volunteer-portal/invitations/{id}/decline"
    description: "Applicant declines an ISSUED invitation"
    roles: [Applicant]
    code: 200
    input: []
    output: Invitation
    side_effects: ["ISSUED -> DECLINED; opening seats_provisional -= 1", "Application INVITED -> UNDER_REVIEW"]

  # --- MedicalClearance ---
  - method: POST
    path: "/volunteer-portal/medical-clearances"
    description: "Applicant submits medical+dental forms (application must be ACCEPTED; no other active clearance)"
    roles: [Applicant]
    code: 201
    input: [application_id, conditions, dental_status]
    output: MedicalClearance
    side_effects: ["status=SUBMITTED; deferral_count=0; max_tier_gap computed against the pinned tier"]
  - method: GET
    path: "/volunteer-portal/applications/{id}/medical-clearances"
    description: "List medical clearances of an application"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: MedicalClearance[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/medical-clearances/{id}/determine"
    description: "MedicalOfficer determination (CLEARED | CLEARED_WITH_ACCOMMODATION | DENIED | DEFERRED) subject to tier-gap and dental rules; DENIED fires the rescission cascade"
    roles: [MedicalOfficer]
    code: 200
    input: [determination, "accommodation_granted?"]
    output: MedicalClearance
    side_effects: ["status transition per MedicalClearance machine; reviewed_by = X-User-ID", "on DENIED: full rescission cascade per MedicalClearance machine"]
  - method: POST
    path: "/volunteer-portal/medical-clearances/{id}/resubmit"
    description: "Applicant resubmits a DEFERRED clearance with updated forms (deferral_count += 1)"
    roles: [Applicant]
    code: 200
    input: [conditions, dental_status]
    output: MedicalClearance
    side_effects: ["DEFERRED -> SUBMITTED; conditions and dental_status replaced; deferral_count += 1; max_tier_gap recomputed"]

  # --- LegalClearance ---
  - method: GET
    path: "/volunteer-portal/applications/{id}/legal-clearances"
    description: "List legal clearances of an application (the auto-created clearance is discovered here)"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: LegalClearance[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/legal-clearances/{id}/adjudicate-background"
    description: "LegalReviewer adjudicates the background check (CLEAR | ADVERSE); ADVERSE fires the denial cascade"
    roles: [LegalReviewer]
    code: 200
    input: [outcome]
    output: LegalClearance
    side_effects: ["background_check_status set; background_adjudicated_by = X-User-ID", "on ADVERSE: denial cascade per LegalClearance machine"]
  - method: POST
    path: "/volunteer-portal/legal-clearances/{id}/determine-suitability"
    description: "LegalReviewer determines suitability (FAVORABLE | UNFAVORABLE); requires an adjudicated background and a different reviewer than the background adjudicator"
    roles: [LegalReviewer]
    code: 200
    input: [outcome]
    output: LegalClearance
    side_effects: ["suitability_status set; suitability_decided_by = X-User-ID", "on UNFAVORABLE: denial cascade per LegalClearance machine"]

  # --- TrainingCohort ---
  - method: POST
    path: "/volunteer-portal/training-cohorts"
    description: "Create a pre-service training cohort (aggregate overlap capacity rule per cohort_overlap_capacity)"
    roles: [SystemAdmin]
    code: 201
    input: [country_program_id, name, start_date, end_date, capacity]
    output: TrainingCohort
    side_effects: ["status=SCHEDULED; enrolled_count=0"]
  - method: GET
    path: "/volunteer-portal/training-cohorts/{id}"
    description: "Get a training cohort"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: TrainingCohort
    side_effects: []
  - method: GET
    path: "/volunteer-portal/training-cohorts"
    description: "List training cohorts with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["country_program_id?", "status?"]
    output: TrainingCohort[]
    side_effects: []

  # --- TrainingEnrollment ---
  - method: POST
    path: "/volunteer-portal/training-enrollments"
    description: "Enroll an ACCEPTED, fully-cleared application into a SCHEDULED cohort of the invitation's pinned program"
    roles: [PlacementOfficer]
    code: 201
    input: [application_id, training_cohort_id]
    output: TrainingEnrollment
    side_effects: ["status=ENROLLED; cohort enrolled_count += 1", "Application ACCEPTED -> CLEARED_TO_DEPART"]
  - method: GET
    path: "/volunteer-portal/training-enrollments/{id}"
    description: "Get a training enrollment"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []
  - method: GET
    path: "/volunteer-portal/training-enrollments"
    description: "List training enrollments with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["application_id?", "training_cohort_id?", "status?"]
    output: TrainingEnrollment[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/training-enrollments/{id}/assess"
    description: "Record language/technical/cultural scores; PASS requires language >= cohort program language_threshold_score, technical >= 2.5, cultural >= 2.5; second consecutive fail auto-separates"
    roles: [TrainingDirector]
    code: 200
    input: [language_score, technical_score, cultural_score]
    output: TrainingEnrollment
    side_effects: ["assessment_attempts += 1; ENROLLED|REMEDIATION -> PASSED | FAILED | SEPARATED per TrainingEnrollment machine", "on SEPARATED: Application -> SEPARATED, invitation rescission cascade, enrolled_count -= 1"]
  - method: POST
    path: "/volunteer-portal/training-enrollments/{id}/remediate"
    description: "Move a FAILED enrollment into REMEDIATION (allows a second and final assessment)"
    roles: [TrainingDirector]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["FAILED -> REMEDIATION"]
  - method: POST
    path: "/volunteer-portal/training-enrollments/{id}/swear-in"
    description: "Swear in a PASSED trainee: creates the VolunteerService (start = logical clock, term = 810 days) and closes the application SWORN_IN"
    roles: [TrainingDirector]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["PASSED -> SWORN_IN", "Cascade: VolunteerService created (ACTIVE)", "Cascade: Application IN_TRAINING -> SWORN_IN"]

  # --- VolunteerService ---
  - method: GET
    path: "/volunteer-portal/volunteer-services/{id}"
    description: "Get a volunteer service record"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: VolunteerService
    side_effects: []
  - method: GET
    path: "/volunteer-portal/volunteer-services"
    description: "List volunteer services with optional filters"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: ["application_id?", "assignment_opening_id?", "country_program_id?", "status?"]
    output: VolunteerService[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/volunteer-services/{id}/events"
    description: "Append a service event; CRITICAL SECURITY_ALERT suspends ACTIVE service, ALL_CLEAR returns SUSPENDED service to ACTIVE"
    roles: [CountryDirector, MedicalOfficer]
    code: 201
    input: [event_type, severity, description, occurred_at]
    output: ServiceEvent
    side_effects: ["ServiceEvent appended (immutable)", "SECURITY_ALERT+CRITICAL: ACTIVE -> SUSPENDED", "ALL_CLEAR: SUSPENDED -> ACTIVE"]
  - method: GET
    path: "/volunteer-portal/volunteer-services/{id}/events"
    description: "List service events of a volunteer service (chronological by occurred_at, tie-break created_at ASC)"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: ServiceEvent[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/volunteer-services/{id}/early-terminate"
    description: "Early-terminate an ACTIVE or SUSPENDED service; creates the CompletionRecord per readjustment_allowance"
    roles: [CountryDirector]
    code: 200
    input: [reason]
    output: VolunteerService
    side_effects: ["-> EARLY_TERMINATED; actual_end_date = logical clock; days_served/months_served computed", "CompletionRecord created (EARLY)", "SitePlacements -> ENDED"]
  - method: POST
    path: "/volunteer-portal/volunteer-services/{id}/complete"
    description: "Complete an ACTIVE service at or after expected_completion_date; creates the CompletionRecord (FULL)"
    roles: [CountryDirector]
    code: 200
    input: []
    output: VolunteerService
    side_effects: ["-> COMPLETED; actual_end_date = logical clock; days_served/months_served computed", "CompletionRecord created (FULL)", "SitePlacements -> ENDED"]
  - method: GET
    path: "/volunteer-portal/volunteer-services/{id}/completion-record"
    description: "Get the completion record of a service (array of 0 or 1)"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: CompletionRecord[]
    side_effects: []

  # --- SitePlacement ---
  - method: POST
    path: "/volunteer-portal/volunteer-services/{id}/site-placements"
    description: "Propose a site placement for an ACTIVE service"
    roles: [CountryDirector]
    code: 201
    input: [host_community_name, counterpart_org_name]
    output: SitePlacement
    side_effects: ["status=PROPOSED; agreement/housing flags false; inspection_passed=false"]
  - method: GET
    path: "/volunteer-portal/volunteer-services/{id}/site-placements"
    description: "List site placements of a volunteer service"
    roles: [SystemAdmin, Applicant, PlacementOfficer, MedicalOfficer, LegalReviewer, TrainingDirector, CountryDirector]
    code: 200
    input: []
    output: SitePlacement[]
    side_effects: []
  - method: POST
    path: "/volunteer-portal/site-placements/{id}/review"
    description: "CountryDirector records agreement + housing inspection and decides CONFIRM or REJECT; allowed from PROPOSED and REJECTED (re-review loop)"
    roles: [CountryDirector]
    code: 200
    input: [counterpart_agreement_signed, has_running_water, structurally_sound, secure_locks, decision]
    output: SitePlacement
    side_effects: ["flags recorded; inspection_passed recomputed", "PROPOSED|REJECTED -> CONFIRMED | REJECTED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601, must not move backwards). Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Each set runs clock_sweep in its pinned order (invitation expiry, opening closure, cohort session start, cohort conclusion)."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs clock_sweep"]

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator: registers applicants, configures country programs, assignment openings and training cohorts, cancels openings, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/applicants"
      - "POST /volunteer-portal/country-programs"
      - "PATCH /volunteer-portal/country-programs/{id}"
      - "POST /volunteer-portal/assignment-openings"
      - "POST /volunteer-portal/assignment-openings/{id}/cancel"
      - "POST /volunteer-portal/training-cohorts"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: Applicant
    description: "Volunteer applicant: owns exactly the applications whose applicant_id equals X-User-ID; submits, withdraws, answers invitations, files and resubmits medical forms"
    identity: entity_backed:Applicant
    exclusive_operations:
      - "POST /volunteer-portal/applications"
      - "POST /volunteer-portal/applications/{id}/submit"
      - "POST /volunteer-portal/applications/{id}/withdraw"
      - "POST /volunteer-portal/invitations/{id}/accept"
      - "POST /volunteer-portal/invitations/{id}/decline"
      - "POST /volunteer-portal/medical-clearances"
      - "POST /volunteer-portal/medical-clearances/{id}/resubmit"
    shared_operations: ["all GET endpoints", "GET /volunteer-portal/applications/{id}/matches (own application only)"]

  - name: PlacementOfficer
    description: "Placement specialist: reviews applications, schedules and scores interviews, issues invitations, enrolls cleared applicants into training cohorts"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/applications/{id}/begin-review"
      - "POST /volunteer-portal/applications/{id}/reject"
      - "POST /volunteer-portal/applications/{id}/interviews"
      - "POST /volunteer-portal/interviews/{id}/complete"
      - "POST /volunteer-portal/interviews/{id}/cancel"
      - "POST /volunteer-portal/invitations"
      - "POST /volunteer-portal/training-enrollments"
    shared_operations: ["all GET endpoints", "GET /volunteer-portal/applications/{id}/matches"]

  - name: MedicalOfficer
    description: "Medical reviewer: determines medical clearances (including accommodation determinations) and logs medical care events"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/medical-clearances/{id}/determine"
    shared_operations:
      - "all GET endpoints"
      - "POST /volunteer-portal/volunteer-services/{id}/events (MEDICAL_CARE events)"

  - name: LegalReviewer
    description: "Legal reviewer: adjudicates background checks and determines suitability; segregation of duties forbids the same reviewer id from doing both on one clearance"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/legal-clearances/{id}/adjudicate-background"
      - "POST /volunteer-portal/legal-clearances/{id}/determine-suitability"
    shared_operations: ["all GET endpoints"]

  - name: TrainingDirector
    description: "Pre-service training lead: records trainee assessments, orders remediation, swears in passed trainees"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/training-enrollments/{id}/assess"
      - "POST /volunteer-portal/training-enrollments/{id}/remediate"
      - "POST /volunteer-portal/training-enrollments/{id}/swear-in"
    shared_operations: ["all GET endpoints"]

  - name: CountryDirector
    description: "In-country director: proposes and reviews site placements, logs safety/security events, suspends and returns volunteers, completes or early-terminates service"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-portal/volunteer-services/{id}/site-placements"
      - "POST /volunteer-portal/site-placements/{id}/review"
      - "POST /volunteer-portal/volunteer-services/{id}/early-terminate"
      - "POST /volunteer-portal/volunteer-services/{id}/complete"
    shared_operations:
      - "all GET endpoints"
      - "POST /volunteer-portal/volunteer-services/{id}/events (all event types)"
