    roles: [ContractsManager]
    code: 200
    input: [expected_agreement_version, "mfc_discount_pct?", "scope_tiers?", "product_scope?", "small_business_goal_pct?"]
    output: ManufacturerAgreement
    side_effects: ["increments ManufacturerAgreement.version", "if mfc_discount_pct changed: every ACTIVE PriceList re-evaluated for MFC floor; violations do not auto-fail here but block next activation/modification"]
  - method: POST
    path: "/agreements/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ContractsManager]
    code: 200
    input: []
    output: ManufacturerAgreement
    side_effects: ["posture recomputed", "increments ManufacturerAgreement.version"]
  - method: POST
    path: "/agreements/{id}/suspend"
    description: "ACTIVE -> SUSPENDED (cascade vehicles + teaming)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ManufacturerAgreement
    side_effects: ["cascade per §1.2", "increments ManufacturerAgreement.version"]
  - method: POST
    path: "/agreements/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE (requires dispute_credit_cents above threshold)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ManufacturerAgreement
    side_effects: ["posture recomputed", "cascade per §1.2", "increments ManufacturerAgreement.version"]
  - method: POST
    path: "/agreements/{id}/terminate"
    description: "ACTIVE -> TERMINATED (blocked when any FINALIZED report has sb_goal_met=false)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ManufacturerAgreement
    side_effects: ["cascade per §1.2", "increments ManufacturerAgreement.version"]
  - method: GET
    path: "/agreements/{id}/vehicles"
    description: "Reverse FK: list vehicles under agreement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: ContractVehicle[]
    side_effects: []
  - method: GET
    path: "/agreements/{id}/teaming"
    description: "Reverse FK: list teaming arrangements under agreement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?"]
    output: TeamingArrangement[]
    side_effects: []
  - method: GET
    path: "/agreements/{id}/sales-reports"
