scenario: |
  Vehicle History Data Sourcing & Service Record Network (Carfax): data sourcing
  agreements with motor vehicle agencies, insurers, auctions, service shops and
  inspection stations with feed reliability monitoring, record matching to a
  vehicle identification number with duplicate and conflicting record resolution,
  title brand normalization across jurisdictional terminology with severity
  ranking, accident and damage reporting from multiple sources with confidence
  indicators, service history collection from participating shops in exchange for
  reporting tools, consumer and dealer report products with subscription and
  per-report pricing, data correction requests from owners and shops with source
  verification, dealer inventory listing integration and buyback guarantee
  programs.

domain_name: vehicle-history-network
api_prefix: ""

complexity_profile:
  primary_archetype: Event sourcing
  secondary_archetype: Compliance / audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Network
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network display name" }
      - { name: epoch_index, type: integer, source: system, default: 0, description: "Feed-health monitoring epoch; incremented by advance_epoch" }
      - { name: brand_lexicon, type: object, source: system, description: "Map jurisdiction -> { canonical_brand: [synonyms] } (see calculations.brand_normalization); fixed at network creation" }
      - { name: guarantee_payout_cap_cents, type: integer, source: input, description: "Per-vehicle lifetime buyback guarantee payout cap" }
      - { name: enrolled_listing_count, type: integer, source: computed, default: 0, description: "Count of InventoryListings with guarantee_status = ENROLLED" }

  - name: DataSource
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: source_type, type: enum, source: input, description: "MVA | INSURER | AUCTION | SERVICE_SHOP | INSPECTION_STATION" }
      - { name: jurisdiction, type: string, source: input, description: "State/jurisdiction code of the reporting authority (e.g., CA, TX)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> SUSPENDED / TERMINATED; SUSPENDED <-> ACTIVE allowed on remediation" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "0..100 feed reliability; recomputed by advance_epoch" }
      - { name: consecutive_missed_epochs, type: integer, source: system, default: 0, description: "Epochs in a row with zero submitted records; drives auto-suspension" }
      - { name: suspended_epoch_index, type: integer, source: system, description: "Epoch at which the source entered SUSPENDED (null unless SUSPENDED)" }
      - { name: record_rejection_streak, type: integer, source: system, default: 0, description: "Consecutive rejected submissions; reaching 3 auto-suspends the source" }

  - name: Shop
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: legal_name, type: string, source: input, description: "Shop legal name" }
      - { name: status, type: enum, source: system, description: "APPLIED -> ACTIVE -> SUSPENDED / TERMINATED; SUSPENDED -> ACTIVE on remediation" }
      - { name: suspended_epoch_index, type: integer, source: system, description: "Epoch at which shop entered SUSPENDED (null unless SUSPENDED)" }
      - { name: data_source_id, type: string, source: system, description: "FK -> DataSource.id; auto-provisioned SERVICE_SHOP source when the shop is approved" }
      - { name: reporting_tool_tier, type: enum, source: system, description: "NONE | BASIC | PRO; earned from accepted service-record volume" }

  - name: Vehicle
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: vin, type: string, source: input, description: "17-character VIN, unique per network; vehicle row is created lazily on first matched record" }
      - { name: canonical_brand, type: enum, source: computed, description: "NONE | CLEAN | LEMON | FLOOD | REBUILT | SALVAGE; highest-severity ACTIVE title record wins (severity NONE=0 < CLEAN=1 < LEMON=2 < FLOOD=3 < REBUILT=4 < SALVAGE=5)" }
      - { name: brand_severity, type: integer, source: computed, default: 0, description: "Numeric severity of canonical_brand" }
      - { name: max_confirmed_accident_severity, type: integer, source: computed, default: 0, description: "Max damage_severity over ACTIVE accident records with confidence_score >= 70" }
      - { name: active_record_count, type: integer, source: computed, default: 0, description: "Count of ACTIVE HistoryRecords" }
      - { name: superseded_record_count, type: integer, source: computed, default: 0, description: "Count of SUPERSEDED HistoryRecords" }

  - name: HistoryRecord
    parent: Vehicle
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id (denormalized for scoping)" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; resolved from submitted vin at ingest (vehicle created lazily on first match)" }
      - { name: vin, type: string, source: input, description: "VIN the record pertains to" }
      - { name: source_id, type: string, source: system, description: "FK -> DataSource.id; the submitting source (service records carry the shop's provisioned source)" }
      - { name: record_type, type: enum, source: input, description: "TITLE_BRAND | ACCIDENT | SERVICE | INSPECTION" }
      - { name: jurisdiction, type: string, source: input, description: "Jurisdiction whose lexicon applies (TITLE_BRAND only; else null)" }
      - { name: raw_brand_text, type: string, source: input, description: "Source-jurisdiction brand wording (TITLE_BRAND only; else null)" }
      - { name: event_date, type: string, source: input, description: "ISO date YYYY-MM-DD of the underlying event; must be <= logical clock date" }
      - { name: damage_severity, type: integer, source: input, description: "1..10 reported damage severity (ACCIDENT only; else null)" }
      - { name: odometer_reading, type: integer, source: input, description: "Odometer miles at event (SERVICE/INSPECTION only; else null)" }
      - { name: reported_cost_cents, type: integer, source: input, description: "Repair/damage cost in cents (ACCIDENT/SERVICE; else null)" }
      - { name: payload_ref, type: string, source: input, description: "Source-side unique record reference; uniqueness scope for dedupe" }
      - { name: idempotency_key, type: string, source: input, description: "Client idempotency key; reuse with identical payload returns the original record" }
      - { name: dedupe_group_key, type: string, source: computed, description: "'{vin}|{record_type}|{event_date}' for ACCIDENT/INSPECTION; '{vin}|TITLE_BRAND|{jurisdiction}' for TITLE_BRAND; null for SERVICE" }
      - { name: match_method, type: enum, source: computed, description: "EXACT_VIN | FUZZY_VIN; FUZZY_VIN when submitted vin differs in exactly one position from an existing vehicle's vin" }
      - { name: confidence_score, type: integer, source: computed, description: "0..100 accident confidence (ACCIDENT only); see calculations.accident_confidence" }
      - { name: confidence_level, type: enum, source: computed, description: "HIGH (>=85) | MEDIUM (>=70) | LOW (>=40) | UNRELIABLE (<40); null for non-ACCIDENT" }
      - { name: canonical_brand, type: enum, source: computed, description: "Normalized brand for TITLE_BRAND records via brand_lexicon; null otherwise" }
      - { name: brand_severity, type: integer, source: computed, description: "Severity of canonical_brand (TITLE_BRAND only)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUPERSEDED | WITHDRAWN | VOIDED" }
      - { name: superseded_by_record_id, type: string, source: system, description: "FK -> HistoryRecord.id; set when this record is superseded" }
      - { name: submitted_epoch_index, type: integer, source: system, description: "Network epoch at submission time; feeds reliability monitoring" }

  - name: CorrectionRequest
    parent: Vehicle
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id" }
      - { name: target_record_id, type: string, source: input, description: "FK -> HistoryRecord.id being challenged" }
      - { name: requester_role, type: enum, source: system, description: "OWNER | SHOP; derived from the acting role" }
      - { name: requester_shop_id, type: string, source: system, description: "FK -> Shop.id when the requester is a Shop; else null" }
      - { name: reason, type: string, source: input, description: "Free-text correction rationale" }
      - { name: corrected_record, type: object, source: input, description: "Optional replacement field set; required when action=SUPERSEDE on review" }
      - { name: status, type: enum, source: system, description: "OPEN -> AWAITING_SOURCE -> VERIFIED / REJECTED / EXPIRED; VERIFIED -> APPLIED" }
      - { name: resolution_action, type: enum, source: system, description: "WITHDRAW | SUPERSEDE; chosen by reviewer" }
      - { name: opened_epoch_index, type: integer, source: system, description: "Epoch when opened" }
      - { name: source_deadline_epoch, type: integer, source: computed, description: "= network.epoch_index at routing + 2; set on transition to AWAITING_SOURCE" }

  - name: ConsumerAccount
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: email, type: string, source: input, description: "Unique per network" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Prepaid balance; purchases debit it" }

  - name: Dealer
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: legal_name, type: string, source: input, description: "Dealer legal name" }
      - { name: subscription_tier, type: enum, source: input, description: "NONE | STANDARD | PRO" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (suspension blocks listing sync and enrollment)" }
      - { name: subscription_started_epoch, type: integer, source: system, description: "Epoch when current STANDARD/PRO subscription began; null when NONE" }
      - { name: period_reports_used, type: integer, source: system, default: 0, description: "Reports pulled in the current 30-epoch subscription window" }
      - { name: period_overage_units, type: integer, source: computed, default: 0, description: "max(0, period_reports_used - included_reports)" }
      - { name: invoice_balance_cents, type: integer, source: computed, default: 0, description: "Accrued overage charges owed by the dealer" }

  - name: InventoryListing
    parent: Dealer
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id being offered" }
      - { name: asking_price_cents, type: integer, source: input, description: "Listing price" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> DELISTED" }
      - { name: guarantee_status, type: enum, source: system, description: "UNENROLLED -> ENROLLED -> VOIDED" }
      - { name: enrolled_brand, type: enum, source: system, description: "Vehicle.canonical_brand snapshot at enrollment time; baseline for buyback claims" }
      - { name: window_start_epoch, type: integer, source: system, description: "Epoch when the listing was published; null until PUBLISHED" }
      - { name: window_end_epoch, type: integer, source: system, description: "Optional exclusive listing-window end set at publish; null = open-ended. window_end_epoch must be > window_start_epoch" }

  - name: GuaranteeClaim
    parent: Dealer
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id that owned the enrolled listing" }
      - { name: listing_id, type: string, source: input, description: "FK -> InventoryListing.id the claim is filed against" }
      - { name: claimant_name, type: string, source: input, description: "Buyer name" }
      - { name: claim_reason, type: string, source: input, description: "Free-text reason" }
      - { name: status, type: enum, source: system, description: "OPEN -> APPROVED / REJECTED / DENIED; APPROVED -> PAID" }
      - { name: payout_cents, type: integer, source: computed, default: 0, description: "Approved payout; see calculations.guarantee_payout" }
      - { name: payout_epoch_index, type: integer, source: system, description: "Epoch when payout executed; null until PAID" }

  - name: ReportOrder
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id the report covers" }
      - { name: product, type: enum, source: input, description: "CONSUMER_SINGLE | DEALER_SUBSCRIPTION" }
      - { name: buyer_consumer_id, type: string, source: system, description: "FK -> ConsumerAccount.id when product=CONSUMER_SINGLE; else null" }
      - { name: buyer_dealer_id, type: string, source: system, description: "FK -> Dealer.id when product=DEALER_SUBSCRIPTION; else null" }
      - { name: price_cents, type: integer, source: computed, description: "Charged price; see calculations.report_price" }
      - { name: snapshot, type: object, source: computed, description: "Immutable point-in-time vehicle summary: canonical_brand, active title/accident/service/inspection records, per-accident confidence; computed at purchase and never mutated afterwards" }
      - { name: status, type: enum, source: system, description: "CONFIRMED (terminal; purchase is atomic)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: DataSource
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sources/{sourceId}/activate"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["reliability_score = 100; consecutive_missed_epochs = 0"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (during advance_epoch when consecutive_missed_epochs >= 3 or record_rejection_streak >= 3)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_epoch_index = network.epoch_index"
          - "CASCADE: every ACTIVE HistoryRecord with source_id = this source -> WITHDRAWN"
          - "Each withdrawal re-runs calculations.vehicle_brand_rollup and accident rollup on the affected Vehicle"
          - "Rollup changes may invalidate OPEN GuaranteeClaim escalations; claims are re-evaluated (DENIED if the escalation no longer holds) during the claim sweep of the same advance_epoch"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sources/{sourceId}/reactivate"
        actor: NetworkAdmin
        preconditions:
          - "network.epoch_index - suspended_epoch_index >= 1 (else ERR_REMEDIATION_TOO_EARLY)"
          - "record_rejection_streak must first be reset via POST /sources/{sourceId}/reset_streak (else ERR_STREAK_NOT_RESET)"
        side_effects:
          - "consecutive_missed_epochs = 0; reliability_score = 50"
          - "record_rejection_streak = 0"
          - "Records WITHDRAWN by the suspension cascade are NOT auto-restored; sources must resubmit"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /sources/{sourceId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "network.epoch_index - suspended_epoch_index >= 2 (else ERR_TERMINATION_TOO_EARLY)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /sources/{sourceId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "No HistoryRecord with source_id = this source is in ACTIVE status (else ERR_SOURCE_HAS_ACTIVE_RECORDS)"
        side_effects: []

  - entity: Shop
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /shops/{shopId}/approve"
        actor: NetworkAdmin
        preconditions: []
        side_effects:
          - "Auto-provision a DataSource (source_type=SERVICE_SHOP, jurisdiction='SHOP', status=ACTIVE) and set Shop.data_source_id"
          - "reporting_tool_tier = BASIC"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shops/{shopId}/suspend"
        actor: NetworkAdmin
        preconditions: []
        side_effects:
          - "suspended_epoch_index = network.epoch_index"
          - "Provisioned DataSource remains ACTIVE (suspension blocks new submissions via ERR_SHOP_NOT_ACTIVE, does not withdraw history)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shops/{shopId}/reactivate"
        actor: NetworkAdmin
        preconditions:
          - "network.epoch_index - suspended_epoch_index >= 1 (else ERR_REMEDIATION_TOO_EARLY)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /shops/{shopId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "No CorrectionRequest with requester_shop_id = this shop in status OPEN or AWAITING_SOURCE (else ERR_SHOP_HAS_OPEN_CORRECTIONS)"
        side_effects:
          - "Provisioned DataSource -> TERMINATED only if it has no ACTIVE records (else source stays ACTIVE and shop termination still succeeds)"

  - entity: HistoryRecord
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, WITHDRAWN, VOIDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (same-source replacement on ingest) OR POST /corrections/{correctionId}/apply (cross-source correction)"
        actor: system | NetworkAdmin
        preconditions:
          - "Same-source ingest replacement: new record shares source_id and dedupe_group_key (else new record is rejected with ERR_DUPLICATE_RECORD)"
          - "New record must not itself be a duplicate-with-identical-payload (idempotent replay short-circuits before dedupe)"
        side_effects:
          - "Old record: superseded_by_record_id = new record id; Vehicle.superseded_record_count += 1; Vehicle.active_record_count unchanged (swap)"
          - "Re-run calculations.vehicle_brand_rollup on the Vehicle"
          - "Rollup changes are observed by OPEN GuaranteeClaims at the next advance_epoch claim sweep"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system (source suspension cascade) OR POST /corrections/{correctionId}/apply with resolution_action=WITHDRAW"
        actor: system | NetworkAdmin
        preconditions: []
        side_effects:
          - "Vehicle.active_record_count -= 1"
          - "Re-run calculations.vehicle_brand_rollup and accident rollup"
          - "Rollup changes are observed by OPEN GuaranteeClaims at the next advance_epoch claim sweep"

      - from: ACTIVE
        to: VOIDED
        trigger: "system (advance_epoch purge: UNRELIABLE accident record, confidence_score < 40, submitted_epoch_index <= network.epoch_index - 2)"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.active_record_count -= 1; accident rollup re-run"
    note: "Brand and confidence derived fields update on ANY transition into or out of ACTIVE."

  - entity: CorrectionRequest
    initial_state: OPEN
    terminal_states: [APPLIED, REJECTED, EXPIRED]
    transitions:
      - from: OPEN
        to: AWAITING_SOURCE
        trigger: "POST /corrections/{correctionId}/route_to_source"
        actor: NetworkAdmin
        preconditions:
          - "Target record must still be ACTIVE (else ERR_RECORD_NOT_ACTIVE)"
        side_effects: ["source_deadline_epoch = network.epoch_index + 2"]

      - from: AWAITING_SOURCE
        to: VERIFIED
        trigger: "POST /corrections/{correctionId}/source_confirm"
        actor: SourceOperator
        preconditions:
          - "Acting SourceOperator's X-User-ID must equal target_record.source_id (else ERR_NOT_RECORD_SOURCE)"
        side_effects: []

      - from: AWAITING_SOURCE
        to: REJECTED
        trigger: "POST /corrections/{correctionId}/source_deny"
        actor: SourceOperator
        preconditions:
          - "Acting SourceOperator's X-User-ID must equal target_record.source_id (else ERR_NOT_RECORD_SOURCE)"
        side_effects: []

      - from: AWAITING_SOURCE
        to: EXPIRED
        trigger: "system (advance_epoch when network.epoch_index > source_deadline_epoch)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: APPLIED
        trigger: "POST /corrections/{correctionId}/apply"
        actor: NetworkAdmin
        preconditions:
          - "resolution_action = WITHDRAW always permitted; SUPERSEDE requires corrected_record payload (else ERR_CORRECTION_PAYLOAD_REQUIRED)"
        side_effects:
          - "WITHDRAW: target record -> WITHDRAWN (HistoryRecord cascade fires)"
          - "SUPERSEDE: create replacement HistoryRecord attributed to target's source_id with corrected fields; target -> SUPERSEDED (HistoryRecord cascade fires)"

  - entity: InventoryListing
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /dealers/{dealerId}/listings/{listingId}/publish"
        actor: DealerAgent
        preconditions:
          - "Dealer.status = ACTIVE (else ERR_DEALER_SUSPENDED)"
          - "Acting dealer owns the listing (else ERR_NOT_LISTING_OWNER)"
          - "Vehicle exists (else ERR_NOT_FOUND)"
        side_effects: []

      - from: PUBLISHED
        to: DELISTED
        trigger: "POST /dealers/{dealerId}/listings/{listingId}/delist"
        actor: DealerAgent
        preconditions:
          - "If guarantee_status = ENROLLED then no GuaranteeClaim on this listing in status OPEN or APPROVED (else ERR_CLAIM_IN_FLIGHT)"
        side_effects:
          - "If guarantee_status = ENROLLED: guarantee_status -> VOIDED and Network.enrolled_listing_count -= 1"

  - entity: GuaranteeClaim
    initial_state: OPEN
    terminal_states: [REJECTED, DENIED, PAID]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: GuaranteeAdmin
        preconditions:
          - "Listing.guarantee_status = ENROLLED (else ERR_GUARANTEE_NOT_ENROLLED)"
          - "Vehicle.canonical_brand severity strictly greater than listing.enrolled_brand severity (else ERR_BRAND_NOT_ESCALATED)"
          - "Current canonical_brand is attributable to a record ACTIVE at claim open or later (post-enrollment escalation)"
        side_effects:
          - "payout_cents = calculations.guarantee_payout"
          - "Listing.guarantee_status -> VOIDED; Network.enrolled_listing_count -= 1"
          - "Dealer.invoice_balance_cents += payout_cents (program cost clawed back to dealer ledger)"

      - from: OPEN
        to: REJECTED
        trigger: "POST /claims/{claimId}/reject"
        actor: GuaranteeAdmin
        preconditions: []
        side_effects: []

      - from: OPEN
        to: DENIED
        trigger: "system (advance_epoch when Vehicle brand rollup no longer exceeds enrolled_brand, e.g., the escalating record was withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "system (advance_epoch, one epoch after approval)"
        actor: system
        preconditions: []
        side_effects:
          - "payout_epoch_index = network.epoch_index"
          - "Guarantee payout drawn against Network.guarantee_payout_cap_cents lifetime per vehicle (else clamp, see calculations.guarantee_payout)"

  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (advance_epoch when invoice_balance_cents > 1000000 i.e. $10,000)"
        actor: system
        preconditions: []
        side_effects: ["Blocks publish and enrollment while SUSPENDED"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dealers/{dealerId}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "invoice_balance_cents <= 1000000 (else ERR_DEALER_BALANCE_OUTSTANDING)"
        side_effects: []

# =============================================================================
# Table 2b: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: vehicle-rollup-stale-version
    parent_entity: Vehicle
    write_endpoint: "POST /records"
    occ_field: "expected_vehicle_version"
    description: |
      Submitting a HistoryRecord against a Vehicle whose version has advanced
      since the client last observed it is rejected. Creating a record mutates
      the Vehicle (rollup recomputation bumps version), so a client working
      from a stale vehicle snapshot must re-read before submitting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: vehicle-correction-stale-version
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{vehicleId}/corrections"
    occ_field: "expected_vehicle_version"
    description: |
      Opening a CorrectionRequest against a Vehicle whose version has advanced
      since the client last observed it is rejected; the requester may be
      challenging a rollup that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: listing-enroll-stale-version
    parent_entity: InventoryListing
    write_endpoint: "POST /dealers/{dealerId}/listings/{listingId}/enroll_guarantee"
    occ_field: "expected_listing_version"
    description: |
      Enrolling a listing into the buyback guarantee with a stale listing
      version is rejected; enrollment snapshots listing state and vehicle brand,
      both of which may have changed since the client's last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vin_match
    trigger: "HistoryRecord ingest"
    algorithm: constraint_propagation
    formula: |
      submitted_vin = record.vin
      if a Vehicle exists in the network with vin == submitted_vin:
        match_method = EXACT_VIN; attach to that Vehicle
      elif exactly one Vehicle in the network has a vin differing from submitted_vin
           in exactly one character position (Hamming distance 1, same length 17):
        match_method = FUZZY_VIN; attach to that Vehicle
      elif more than one Vehicle is at Hamming distance 1:
        reject with ERR_AMBIGUOUS_VIN_MATCH
      else:
        create a new Vehicle with vin = submitted_vin; match_method = EXACT_VIN
    input_set: "All Vehicles in the network regardless of status"
    constants:
      VIN_LENGTH: 17
    precision: "exact string comparison"

  - name: dedupe_grouping
    trigger: "HistoryRecord ingest (after vin_match)"
    algorithm: aggregation
    formula: |
      if record_type == TITLE_BRAND:
        dedupe_group_key = vin + '|TITLE_BRAND|' + jurisdiction
      elif record_type in (ACCIDENT, INSPECTION):
        dedupe_group_key = vin + '|' + record_type + '|' + event_date
      else (SERVICE):
        dedupe_group_key = null  # SERVICE records never dedupe; multiple services per day allowed
      idempotency replay (same idempotency_key AND identical payload) short-circuits
      BEFORE dedupe and returns the original record unchanged.
      Same key + different payload -> ERR_IDEMPOTENCY_CONFLICT.
    input_set: "HistoryRecords for the matched vehicle"
    precision: "exact"

  - name: brand_normalization
    trigger: "TITLE_BRAND HistoryRecord ingest and rollup"
    algorithm: weighted_scoring
    formula: |
      canonical = brand_lexicon[jurisdiction][raw_brand_text]
      if raw_brand_text not present in that jurisdiction's lexicon: ERR_UNKNOWN_BRAND_TERM
      severity: NONE=0, CLEAN=1, LEMON=2, FLOOD=3, REBUILT=4, SALVAGE=5
    input_set: "TITLE_BRAND records"
    constants:
      SEVERITY_NONE: 0
      SEVERITY_CLEAN: 1
      SEVERITY_LEMON: 2
      SEVERITY_FLOOD: 3
      SEVERITY_REBUILT: 4
      SEVERITY_SALVAGE: 5
    precision: "integer"

  - name: vehicle_brand_rollup
    trigger: "Any HistoryRecord entering or leaving ACTIVE on a Vehicle"
    algorithm: aggregation
    formula: |
      active_titles = ACTIVE TITLE_BRAND records for the vehicle
      if empty: canonical_brand = NONE, brand_severity = 0
      else: winner = record with max brand_severity;
            tie-break: earliest event_date, then earliest record created_at
      canonical_brand = winner.canonical_brand; brand_severity = winner.brand_severity
      active_record_count = count(ACTIVE records of all types)
      max_confirmed_accident_severity = max(damage_severity over ACTIVE ACCIDENT
        records with confidence_score >= 70), 0 if none
    input_set: "HistoryRecords of the Vehicle with status ACTIVE"
    precision: "integer"

  - name: accident_confidence
    trigger: "ACCIDENT HistoryRecord ingest; recomputed on any source reliability change (advance_epoch)"
    algorithm: weighted_scoring
    formula: |
      let agreeing = other ACTIVE ACCIDENT records on the same vehicle whose
        |event_date - this.event_date| <= 30 days and whose source_id != this.source_id
      same_type_bonus = 10 * min(2, count(agreeing from sources with same source_type as this))
      cross_type_bonus = 20 * min(2, count(agreeing from sources with different source_type))
      reliability_factor = clamp(submitting_source.reliability_score, 0, 100) / 100
      raw = (40 + same_type_bonus + cross_type_bonus) * reliability_factor
      confidence_score = floor(raw)   # round DOWN, integer
      confidence_level: >=85 HIGH; 70..84 MEDIUM; 40..69 LOW; <40 UNRELIABLE
      Variant selection: 'provisional' at ingest uses the source's CURRENT
        reliability_score; 'recomputed' at advance_epoch uses the post-epoch score.
        The two variants produce different scores for identical record data when
        reliability moved between epochs.
    input_set: "ACTIVE ACCIDENT records on the same vehicle within ±30 days event window"
    constants:
      BASE: 40
      SAME_TYPE_BONUS: 10
      CROSS_TYPE_BONUS: 20
      DATE_WINDOW_DAYS: 30
      HIGH: 85
      MEDIUM: 70
      LOW: 40
    precision: "integer, round_half_down (floor)"
    variants:
      - name: provisional
        when: "at ingest"
        difference: "uses source reliability_score as of submission epoch"
      - name: recomputed
        when: "during advance_epoch"
        difference: "uses decayed reliability_score; may cross confidence thresholds and trigger VOIDED purge"

  - name: feed_reliability_decay
    trigger: "advance_epoch"
    algorithm: decay_function
    formula: |
      For each DataSource with status ACTIVE:
        submitted = count of records submitted by this source during the epoch just ended
        if submitted == 0:
          consecutive_missed_epochs += 1
          reliability_score = max(0, reliability_score - 10)
        else:
          consecutive_missed_epochs = 0
          reliability_score = min(100, reliability_score + 2)
        if consecutive_missed_epochs >= 3 OR record_rejection_streak >= 3:
          source -> SUSPENDED (suspension cascade fires)
      Dual step sizes: penalty -10 vs recovery +2 are intentionally asymmetric.
      On rejection of a submitted record: record_rejection_streak += 1; on accepted
      submission: record_rejection_streak = 0.
    input_set: "DataSources with status ACTIVE"
    constants:
      DECAY_PER_MISS: 10
      RECOVERY_PER_HIT: 2
      MISS_SUSPEND_THRESHOLD: 3
      REJECT_SUSPEND_THRESHOLD: 3
    precision: "integer, clamped 0..100"

  - name: shop_tool_tier
    trigger: "SERVICE HistoryRecord accepted from a Shop's provisioned source; and on reversal when such a record leaves ACTIVE"
    algorithm: threshold
    formula: |
      accepted_service_count = count of ACTIVE SERVICE records whose
        source_id = shop.data_source_id
      tier: count >= 50 -> PRO; otherwise BASIC (BASIC is the approval floor,
        granted at shop approval)
      Shop must be ACTIVE for an upgrade to PRO to apply; crossing 50 while
      SUSPENDED is deferred and applied on reactivation.
      Downgrade from PRO to BASIC applies immediately (regardless of shop
        status) when a reversal drops the count below 50.
    input_set: "ACTIVE SERVICE records attributed to the shop's provisioned source"
    constants:
      PRO_THRESHOLD: 50
    precision: "integer; boundary is inclusive (count == 50 -> PRO, count == 49 -> BASIC)"

  - name: report_price
    trigger: "ReportOrder purchase"
    algorithm: tiered_pricing
    formula: |
      if product == CONSUMER_SINGLE:
        if the buyer already holds a prior CONFIRMED ReportOrder for the SAME vehicle:
          price = 1900  # returning-buyer rate
        else:
          price = 3999
      else (DEALER_SUBSCRIPTION):
        if dealer.subscription_tier == NONE: reject ERR_NO_SUBSCRIPTION
        included = 25 (STANDARD) or 200 (PRO)
        if period_reports_used < included:
          price = 0
        else:
          overage_index = period_reports_used - included + 1   # 1-based overage unit
          overage_price = 500 - 100 * ((overage_index - 1) // 10)   # tiered overage
          overage_price = max(300, overage_price)   # floor
          price = overage_price
        dealer.period_reports_used += 1
        if price > 0: dealer.invoice_balance_cents += price
      Evaluation order pinned: determine eligibility (subscription active & window
      current) -> compute included vs overage -> compute tiered overage price ->
      apply floor -> debit ledger -> increment counter LAST, so the current order
      is priced against the pre-increment counter.
    input_set: "buyer account or dealer; dealer.period_reports_used within current 30-epoch window"
    constants:
      CONSUMER_SINGLE_PRICE_CENTS: 3999
      CONSUMER_RETURN_PRICE_CENTS: 1900
      STANDARD_INCLUDED: 25
      PRO_INCLUDED: 200
      OVERAGE_BASE_CENTS: 500
      OVERAGE_STEP_CENTS: 100
      OVERAGE_STEP_EVERY: 10
      OVERAGE_FLOOR_CENTS: 300
    precision: "integer cents"

  - name: claim_window_overlap
    trigger: "GuaranteeClaim creation"
    algorithm: interval_merge
    formula: |
      Only ONE claim per listing may occupy the non-terminal set
      {OPEN, APPROVED} at any time — a closed-occupancy rule: a second claim on
      the same listing is rejected with ERR_CLAIM_OVERLAP while any earlier
      claim on that listing is OPEN or APPROVED.
      The listing's publication window [window_start_epoch, window_end_epoch)
      must also contain the claim-open epoch: filing is rejected with
      ERR_LISTING_WINDOW_CLOSED when window_end_epoch is not null AND
      network.epoch_index >= window_end_epoch. Filing AT epoch
      window_end_epoch - 1 is valid; AT window_end_epoch is rejected
      (half-open publication interval vs closed claim-occupancy semantics).
    input_set: "GuaranteeClaims for the listing; listing window fields"
    precision: "integer epochs"

  - name: subscription_window
    trigger: "DEALER_SUBSCRIPTION purchase and advance_epoch"
    algorithm: threshold
    formula: |
      window is [subscription_started_epoch, subscription_started_epoch + 30)
      if network.epoch_index >= subscription_started_epoch + 30:
        window expired -> purchase rejected with ERR_SUBSCRIPTION_WINDOW_EXPIRED
        (dealer must resubscribe; resubscribe resets subscription_started_epoch and
        period_reports_used = 0)
      boundary: epoch_index == started + 29 is the LAST valid epoch;
      epoch_index == started + 30 rejects.
    input_set: "Dealer subscription fields"
    constants:
      WINDOW_EPOCHS: 30
    precision: "integer epochs; start inclusive, end exclusive"

  - name: guarantee_payout
    trigger: "GuaranteeClaim approval"
    algorithm: waterfall_allocation
    formula: |
      base = listing.asking_price_cents
      severity_delta = vehicle.brand_severity - listing's enrolled_brand severity
      brand_pct = 100% if severity_delta >= 3 else 75% if severity_delta == 2 else 50%
      provisional_payout = base * brand_pct / 100   (integer, round DOWN)
      prior_paid = sum of payout_cents over PAID GuaranteeClaims whose listing
        refers to the same vehicle
      lifetime_remaining = max(0, network.guarantee_payout_cap_cents - prior_paid)
      payout_cents = min(provisional_payout, lifetime_remaining)
      Circular-looking dependency resolved: brand_pct depends on the CURRENT
      vehicle rollup (post-escalation), not the snapshot; the snapshot only
      establishes eligibility (escalation must exist). Evaluation order:
      eligibility check -> base -> brand_pct -> provisional -> lifetime cap clamp.
    input_set: "ENROLLED listing, current vehicle rollup, PAID claims on same vehicle"
    constants:
      PCT_DELTA_1: 50
      PCT_DELTA_2: 75
      PCT_DELTA_3PLUS: 100
    precision: "integer cents, round_half_down (floor)"
    variants:
      - name: uncapped
        when: "lifetime_remaining >= provisional_payout"
        difference: "payout equals provisional_payout"
      - name: capped
        when: "lifetime_remaining < provisional_payout"
        difference: "payout clamped to lifetime_remaining; the two variants diverge for identical listing/vehicle data when prior claims drained the cap"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources (network, vehicle, source, shop, dealer, listing, claim, correction, record) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource state permits the operation (state-machine from-state, terminal lockdown)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "DataSource must be ACTIVE to accept record submissions"
    error_id: ERR_SOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /records (source path)"

  - priority: 6
    category: state
    check: "Shop must be ACTIVE to submit service records"
    error_id: ERR_SHOP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /shops/{id}/service-records"

  - priority: 7
    category: business_referential
    check: "VIN ambiguity: exactly one vehicle at Hamming distance 1, else reject"
    error_id: ERR_AMBIGUOUS_VIN_MATCH
    http_status: 409
    applies_to: "POST /records, POST service-records"

  - priority: 8
    category: business_temporal
    check: "event_date must not be after the logical clock's current date"
    error_id: ERR_EVENT_IN_FUTURE
    http_status: 422
    applies_to: "POST /records, POST service-records"

  - priority: 9
    category: business_constraint
    check: "Idempotency key reuse with different payload"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /records, POST service-records"

  - priority: 10
    category: business_constraint
    check: "Duplicate record in same dedupe group from same source with non-identical content is rejected; from a different source is accepted as corroboration"
    error_id: ERR_DUPLICATE_RECORD
    http_status: 409
    applies_to: "POST /records, POST service-records"

  - priority: 11
    category: business_constraint
    check: "TITLE_BRAND raw_brand_text must normalize via the jurisdiction's lexicon"
    error_id: ERR_UNKNOWN_BRAND_TERM
    http_status: 422
    applies_to: "POST /records (TITLE_BRAND)"

  - priority: 12
    category: business_constraint
    check: "Odometer monotonicity: SERVICE/INSPECTION record odometer_reading must be >= max odometer over ACTIVE SERVICE/INSPECTION records on the vehicle with earlier event_date (same-day ties allowed)"
    error_id: ERR_ODOMETER_ROLLBACK
    http_status: 422
    applies_to: "POST /records, POST service-records"

  - priority: 13
    category: business_referential
    check: "Correction target record must belong to the path vehicle and be ACTIVE"
    error_id: ERR_RECORD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST corrections, POST corrections/{id}/route_to_source"

  - priority: 14
    category: business_referential
    check: "Source verification must come from the record's owning source"
    error_id: ERR_NOT_RECORD_SOURCE
    http_status: 403
    applies_to: "POST corrections/{id}/source_confirm, source_deny"

  - priority: 15
    category: business_fiscal
    check: "Consumer credit_balance_cents >= price_cents at purchase time"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /reports (CONSUMER_SINGLE)"

  - priority: 16
    category: business_fiscal
    check: "Dealer subscription tier must be STANDARD or PRO for DEALER_SUBSCRIPTION reports"
    error_id: ERR_NO_SUBSCRIPTION
    http_status: 402
    applies_to: "POST /reports (DEALER_SUBSCRIPTION)"

  - priority: 17
    category: business_temporal
    check: "Dealer subscription 30-epoch window must be current"
    error_id: ERR_SUBSCRIPTION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /reports (DEALER_SUBSCRIPTION)"

  - priority: 18
    category: business_referential
    check: "Guarantee enrollment requires listing PUBLISHED, dealer ACTIVE, vehicle canonical_brand severity <= 1 (NONE or CLEAN)"
    error_id: ERR_NOT_ENROLLABLE
    http_status: 409
    applies_to: "POST listings/{id}/enroll_guarantee"

  - priority: 19
    category: business_constraint
    check: "Claim approval requires brand escalation above enrolled snapshot"
    error_id: ERR_BRAND_NOT_ESCALATED
    http_status: 409
    applies_to: "POST claims/{id}/approve"

  - priority: 20
    category: business_constraint
    check: "OCC expected_*_version must match the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /records, POST corrections, POST enroll_guarantee"

  - priority: 21
    category: business_temporal
    check: "Guarantee claim filing: no other claim on the same listing may be OPEN or APPROVED (closed occupancy), and the claim-open epoch must lie inside the listing's publication window [window_start_epoch, window_end_epoch)"
    error_id: "ERR_CLAIM_OVERLAP | ERR_LISTING_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /claims"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set"]

  # --- Network ---
  - method: POST
    path: "/networks"
    description: "Create a network with brand lexicon and guarantee cap"
    roles: [NetworkAdmin]
    code: 201
    input: [name, guarantee_payout_cap_cents]
    output: Network
    side_effects: ["epoch_index=0; default brand_lexicon installed (see calculations.brand_normalization; CA: {'salvage certificate':'SALVAGE','revived salvage':'REBUILT','flood':'FLOOD','lemon law buyback':'LEMON','clean':'CLEAN'}; TX: {'salvage title':'SALVAGE','rebuilt':'REBUILT','water damage':'FLOOD','manufacturer buyback':'LEMON','clear':'CLEAN'})"]

  - method: GET
    path: "/networks/{networkId}"
    description: "Get a network"
    roles: [Any]
    code: 200
    input: []
    output: Network
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/corrections"
    description: "List correction requests within a network"
    roles: [Any]
    code: 200
    input: []
    output: "CorrectionRequest[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/consumers"
    description: "List consumer accounts within a network"
    roles: [Any]
    code: 200
    input: []
    output: "ConsumerAccount[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/dealers"
    description: "List dealers within a network"
    roles: [Any]
    code: 200
    input: []
    output: "Dealer[]"
    side_effects: []

  - method: GET
    path: "/consumers"
    description: "List consumer accounts (filtered)"
    roles: [Any]
    code: 200
    input: ["network_id?"]
    output: "ConsumerAccount[]"
    side_effects: []

  - method: GET
    path: "/dealers"
    description: "List dealers (filtered)"
    roles: [Any]
    code: 200
    input: ["network_id?", "status?"]
    output: "Dealer[]"
    side_effects: []

  - method: GET
    path: "/corrections"
    description: "List correction requests (filtered; FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: ["network_id?", "vehicle_id?", "target_record_id?", "requester_shop_id?", "status?"]
    output: "CorrectionRequest[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/records"
    description: "List records within a network (FK reverse-reachability for network_id)"
    roles: [Any]
    code: 200
    input: []
    output: "HistoryRecord[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/listings"
    description: "List listings within a network"
    roles: [Any]
    code: 200
    input: []
    output: "InventoryListing[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/claims"
    description: "List claims within a network"
    roles: [Any]
    code: 200
    input: []
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}/reports"
    description: "List report orders within a network"
    roles: [Any]
    code: 200
    input: []
    output: "ReportOrder[]"
    side_effects: []

  - method: POST
    path: "/advance_epoch"
    description: "Advance the feed-health monitoring epoch by one"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Network
    side_effects:
      - "epoch_index += 1"
      - "calculations.feed_reliability_decay over ACTIVE sources (may auto-SUSPEND; suspension cascade withdraws records, re-runs rollups, may VOID guarantees)"
      - "calculations.accident_confidence recomputed variant for ACTIVE ACCIDENT records; UNRELIABLE records older than 2 epochs -> VOIDED"
      - "CorrectionRequest AWAITING_SOURCE past deadline -> EXPIRED"
      - "GuaranteeClaim APPROVED -> PAID; OPEN claims failing escalation -> DENIED"
      - "Dealer auto-suspension when invoice_balance_cents > 1000000"

  # --- DataSource ---
  - method: POST
    path: "/sources"
    description: "Register a data source agreement"
    roles: [NetworkAdmin]
    code: 201
    input: [source_type, jurisdiction]
    output: DataSource
    side_effects: ["status=PENDING, reliability_score=100"]

  - method: GET
    path: "/sources/{sourceId}"
    description: "Get a data source"
    roles: [Any]
    code: 200
    input: []
    output: DataSource
    side_effects: []

  - method: GET
    path: "/sources"
    description: "List data sources"
    roles: [Any]
    code: 200
    input: ["network_id?", "status?", "source_type?"]
    output: "DataSource[]"
    side_effects: []

  - method: POST
    path: "/sources/{sourceId}/activate"
    description: "Activate a PENDING source"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DataSource
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/sources/{sourceId}/reactivate"
    description: "Reactivate a SUSPENDED source after remediation"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DataSource
    side_effects: ["status -> ACTIVE, reliability_score=50, consecutive_missed_epochs=0"]

  - method: POST
    path: "/sources/{sourceId}/reset_streak"
    description: "Reset record_rejection_streak to 0 (required before reactivation after rejection-driven suspension)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DataSource
    side_effects: ["record_rejection_streak = 0"]

  - method: POST
    path: "/sources/{sourceId}/terminate"
    description: "Terminate a source agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DataSource
    side_effects: ["status -> TERMINATED"]

  - method: GET
    path: "/sources/{sourceId}/records"
    description: "List records submitted by a source (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "HistoryRecord[]"
    side_effects: []

  # --- Records ingest ---
  - method: POST
    path: "/records"
    description: "Submit a history record from an external data source"
    roles: [SourceOperator]
    code: 201
    input: [vin, source_id, record_type, "jurisdiction?", "raw_brand_text?", event_date, "damage_severity?", "odometer_reading?", "reported_cost_cents?", payload_ref, idempotency_key, "expected_vehicle_version?"]
    output: HistoryRecord
    side_effects:
      - "calculations.vin_match (may lazily create Vehicle)"
      - "calculations.dedupe_grouping (supersede same-source, reject same-source duplicate, accept cross-source)"
      - "calculations.brand_normalization (TITLE_BRAND) / calculations.accident_confidence provisional variant (ACCIDENT)"
      - "calculations.vehicle_brand_rollup; increments Vehicle.version by 1"
      - "Source consecutive_missed_epochs accounting at next advance_epoch; rejection increments record_rejection_streak"
      - "Guarantee VOID cascade if brand escalation exceeds enrolled snapshots"

  - method: GET
    path: "/records"
    description: "List history records across the network (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: ["network_id?", "vehicle_id?", "source_id?", "superseded_by_record_id?", "record_type?", "status?"]
    output: "HistoryRecord[]"
    side_effects: []

  - method: GET
    path: "/records/{recordId}"
    description: "Get a history record"
    roles: [Any]
    code: 200
    input: []
    output: HistoryRecord
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}/records"
    description: "List records for a vehicle (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: ["record_type?", "status?"]
    output: "HistoryRecord[]"
    side_effects: []

  # --- Vehicles ---
  - method: GET
    path: "/vehicles/{vehicleId}"
    description: "Get a vehicle (rollups included)"
    roles: [Any]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles"
    roles: [Any]
    code: 200
    input: ["network_id?", "canonical_brand?"]
    output: "Vehicle[]"
    side_effects: []

  # --- Shops ---
  - method: POST
    path: "/shops"
    description: "Apply for a service shop membership"
    roles: [NetworkAdmin]
    code: 201
    input: [legal_name]
    output: Shop
    side_effects: ["status=APPLIED, reporting_tool_tier=NONE"]

  - method: GET
    path: "/shops/{shopId}"
    description: "Get a shop"
    roles: [Any]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: GET
    path: "/shops"
    description: "List shops"
    roles: [Any]
    code: 200
    input: ["network_id?", "data_source_id?", "status?"]
    output: "Shop[]"
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/approve"
    description: "Approve a shop; provisions its SERVICE_SHOP data source"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> ACTIVE; DataSource provisioned; reporting_tool_tier=BASIC"]

  - method: POST
    path: "/shops/{shopId}/suspend"
    description: "Suspend a shop"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/shops/{shopId}/reactivate"
    description: "Reactivate a suspended shop; applies deferred tier upgrades"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> ACTIVE; calculations.shop_tool_tier applied"]

  - method: POST
    path: "/shops/{shopId}/terminate"
    description: "Terminate a shop"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> TERMINATED"]

  - method: POST
    path: "/shops/{shopId}/service-records"
    description: "Shop submits a service record via its provisioned source"
    roles: [ShopOperator]
    code: 201
    input: [vin, event_date, odometer_reading, "reported_cost_cents?", payload_ref, idempotency_key, "expected_vehicle_version?"]
    output: HistoryRecord
    side_effects:
      - "record_type=SERVICE forced; source_id = shop.data_source_id; jurisdiction=null"
      - "calculations.vin_match, dedupe_grouping, odometer monotonicity, vehicle rollup"
      - "calculations.shop_tool_tier (count == 10 exactly -> BASIC already held; count == 50 -> PRO; deferred while SUSPENDED)"
      - "increments Vehicle.version by 1"

  - method: GET
    path: "/shops/{shopId}/service-records"
    description: "List a shop's submitted service records"
    roles: [Any]
    code: 200
    input: []
    output: "HistoryRecord[]"
    side_effects: []

  # --- Corrections ---
  - method: POST
    path: "/vehicles/{vehicleId}/corrections"
    description: "Open a data correction request against a record"
    roles: [VehicleOwner, ShopOperator]
    code: 201
    input: [target_record_id, reason, "corrected_record?", expected_vehicle_version]
    output: CorrectionRequest
    side_effects: ["status=OPEN; opened_epoch_index=network.epoch_index"]

  - method: GET
    path: "/corrections/{correctionId}"
    description: "Get a correction request"
    roles: [Any]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: []


  - method: GET
    path: "/vehicles/{vehicleId}/corrections/{correctionId}"
    description: "Get a correction request (vehicle-scoped alias)"
    roles: [Any]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}/corrections"
    description: "List corrections for a vehicle"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "CorrectionRequest[]"
    side_effects: []

  - method: POST
    path: "/corrections/{correctionId}/route_to_source"
    description: "Route correction to the owning source for verification"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: ["status -> AWAITING_SOURCE; source_deadline_epoch = epoch + 2"]

  - method: POST
    path: "/corrections/{correctionId}/source_confirm"
    description: "Owning source verifies the correction"
    roles: [SourceOperator]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: ["status -> VERIFIED"]

  - method: POST
    path: "/corrections/{correctionId}/source_deny"
    description: "Owning source denies the correction"
    roles: [SourceOperator]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/corrections/{correctionId}/apply"
    description: "Apply a verified correction (withdraw or supersede the target record)"
    roles: [NetworkAdmin]
    code: 200
    input: [resolution_action, "corrected_record?"]
    output: CorrectionRequest
    side_effects: ["status -> APPLIED; HistoryRecord WITHDRAWN or SUPERSEDED cascades fire; rollups recomputed"]

  # --- Consumers ---
  - method: POST
    path: "/consumers"
    description: "Register a consumer account"
    roles: [VehicleOwner]
    code: 201
    input: [email]
    output: ConsumerAccount
    side_effects: ["credit_balance_cents=0"]

  - method: GET
    path: "/consumers/{consumerId}"
    description: "Get a consumer account"
    roles: [Any]
    code: 200
    input: []
    output: ConsumerAccount
    side_effects: []

  - method: POST
    path: "/consumers/{consumerId}/credit"
    description: "Top up consumer prepaid credit"
    roles: [NetworkAdmin]
    code: 200
    input: [amount_cents]
    output: ConsumerAccount
    side_effects: ["credit_balance_cents += amount_cents"]

  # --- Dealers ---
  - method: POST
    path: "/dealers"
    description: "Register a dealer"
    roles: [NetworkAdmin]
    code: 201
    input: [legal_name]
    output: Dealer
    side_effects: ["status=ACTIVE, subscription_tier=NONE"]

  - method: GET
    path: "/dealers/{dealerId}"
    description: "Get a dealer"
    roles: [Any]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/dealers/{dealerId}/subscribe"
    description: "Start or renew a subscription tier; resets the 30-epoch window and usage counter"
    roles: [DealerAgent]
    code: 200
    input: [tier]
    output: Dealer
    side_effects: ["subscription_tier set; subscription_started_epoch = network.epoch_index; period_reports_used = 0"]

  - method: POST
    path: "/dealers/{dealerId}/reinstate"
    description: "Reinstate a suspended dealer whose balance is within threshold"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/dealers/{dealerId}/listings"
    description: "Create an inventory listing (DRAFT)"
    roles: [DealerAgent]
    code: 201
    input: [vehicle_id, asking_price_cents]
    output: InventoryListing
    side_effects: ["status=DRAFT, guarantee_status=UNENROLLED"]

  - method: GET
    path: "/dealers/{dealerId}/listings"
    description: "List a dealer's listings"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "InventoryListing[]"
    side_effects: []

  - method: GET
    path: "/listings/{listingId}"
    description: "Get a listing"
    roles: [Any]
    code: 200
    input: []
    output: InventoryListing
    side_effects: []

  - method: POST
    path: "/dealers/{dealerId}/listings/{listingId}/publish"
    description: "Publish a listing; starts its publication window at the current epoch"
    roles: [DealerAgent]
    code: 200
    input: ["window_end_epoch?"]
    output: InventoryListing
    side_effects: ["status -> PUBLISHED; window_start_epoch = network.epoch_index; window_end_epoch = input or null"]

  - method: POST
    path: "/dealers/{dealerId}/listings/{listingId}/delist"
    description: "Delist a listing; enrolled guarantees are voided unless a claim is in flight"
    roles: [DealerAgent]
    code: 200
    input: []
    output: InventoryListing
    side_effects: ["status -> DELISTED; possible guarantee VOID + Network.enrolled_listing_count -= 1"]

  - method: POST
    path: "/dealers/{dealerId}/listings/{listingId}/enroll_guarantee"
    description: "Enroll a published listing in the buyback guarantee; snapshots current brand"
    roles: [DealerAgent]
    code: 200
    input: [expected_listing_version]
    output: InventoryListing
    side_effects: ["guarantee_status -> ENROLLED; enrolled_brand = vehicle.canonical_brand; Network.enrolled_listing_count += 1; increments InventoryListing.version by 1"]

  # --- Claims ---
  - method: POST
    path: "/claims"
    description: "File a buyback guarantee claim; DealerAgent callers must own the listing's dealer (else ERR_NOT_LISTING_OWNER)"
    roles: [GuaranteeAdmin, DealerAgent]
    code: 201
    input: [listing_id, claimant_name, claim_reason]
    output: GuaranteeClaim
    side_effects: ["status=OPEN; ERR_GUARANTEE_NOT_ENROLLED if listing.guarantee_status != ENROLLED; ERR_CLAIM_OVERLAP if another claim on the listing is OPEN or APPROVED; ERR_LISTING_WINDOW_CLOSED if window_end_epoch set and epoch >= window_end_epoch"]

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [Any]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []

  - method: GET
    path: "/dealers/{dealerId}/claims"
    description: "List claims for a dealer"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Approve a claim; computes payout, voids guarantee, debits dealer ledger"
    roles: [GuaranteeAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status -> APPROVED; calculations.guarantee_payout; listing guarantee VOIDED; Network.enrolled_listing_count -= 1; Dealer.invoice_balance_cents += payout_cents"]

  - method: POST
    path: "/claims/{claimId}/reject"
    description: "Reject a claim"
    roles: [GuaranteeAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status -> REJECTED"]


  - method: GET
    path: "/consumers/{consumerId}/reports"
    description: "List report orders bought by a consumer (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "ReportOrder[]"
    side_effects: []

  - method: GET
    path: "/dealers/{dealerId}/reports"
    description: "List report orders bought by a dealer (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "ReportOrder[]"
    side_effects: []


  # --- Reports ---
  - method: POST
    path: "/reports"
    description: "Purchase a vehicle history report (consumer per-report or dealer subscription)"
    roles: [VehicleOwner, DealerAgent]
    code: 201
    input: [vehicle_id, product, "buyer_consumer_id?", "buyer_dealer_id?"]
    output: ReportOrder
    side_effects:
      - "calculations.report_price (pinned evaluation order; counter incremented last)"
      - "CONSUMER_SINGLE: debit ConsumerAccount.credit_balance_cents"
      - "DEALER_SUBSCRIPTION: period_reports_used += 1; overage debits invoice_balance_cents"
      - "snapshot frozen at purchase; status=CONFIRMED"

  - method: GET
    path: "/reports/{reportId}"
    description: "Get a report order including its frozen snapshot"
    roles: [Any]
    code: 200
    input: []
    output: ReportOrder
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}/reports"
    description: "List report orders for a vehicle"
    roles: [Any]
    code: 200
    input: []
    output: "ReportOrder[]"
    side_effects: []


  # --- Additional FK reverse-reachability reads ---
  - method: GET
    path: "/listings"
    description: "List listings across the network (FK reverse-reachability for network_id, vehicle_id)"
    roles: [Any]
    code: 200
    input: ["network_id?", "vehicle_id?", "dealer_id?", "status?"]
    output: "InventoryListing[]"
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims across the network (FK reverse-reachability for network_id, listing_id)"
    roles: [Any]
    code: 200
    input: ["network_id?", "listing_id?", "dealer_id?", "status?"]
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: GET
    path: "/reports"
    description: "List report orders across the network (FK reverse-reachability for network_id, vehicle_id, buyer ids)"
    roles: [Any]
    code: 200
    input: ["network_id?", "vehicle_id?", "buyer_consumer_id?", "buyer_dealer_id?", "product?"]
    output: "ReportOrder[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist within the network scope" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Entity not in a from-state that permits the requested transition (includes terminal lockdown and non-idempotent re-trigger)" }
  - { id: ERR_SOURCE_NOT_ACTIVE, http: 409, condition: "Record submission to a DataSource not in ACTIVE status" }
  - { id: ERR_SHOP_NOT_ACTIVE, http: 409, condition: "Service-record submission by a shop not in ACTIVE status" }
  - { id: ERR_AMBIGUOUS_VIN_MATCH, http: 409, condition: "More than one existing vehicle sits at Hamming distance 1 from the submitted VIN" }
  - { id: ERR_EVENT_IN_FUTURE, http: 422, condition: "event_date later than the logical clock's current date" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }
  - { id: ERR_DUPLICATE_RECORD, http: 409, condition: "Same-source submission whose dedupe_group_key matches an ACTIVE record and whose content fields (raw_brand_text, damage_severity, odometer_reading, reported_cost_cents) are all identical but idempotency_key differs; identical key replays are accepted idempotently, any changed content field supersedes" }
  - { id: ERR_UNKNOWN_BRAND_TERM, http: 422, condition: "raw_brand_text absent from the jurisdiction's brand lexicon" }
  - { id: ERR_ODOMETER_ROLLBACK, http: 422, condition: "odometer_reading below the max odometer of ACTIVE earlier-dated SERVICE/INSPECTION records on the vehicle" }
  - { id: ERR_RECORD_NOT_ACTIVE, http: 409, condition: "Correction target record missing from the path vehicle or not ACTIVE" }
  - { id: ERR_NOT_RECORD_SOURCE, http: 403, condition: "Source verification attempted by a SourceOperator other than the record's owning source" }
  - { id: ERR_CORRECTION_PAYLOAD_REQUIRED, http: 400, condition: "resolution_action=SUPERSEDE without corrected_record payload" }
  - { id: ERR_REMEDIATION_TOO_EARLY, http: 409, condition: "Reactivation attempted before the minimum 1-epoch remediation window elapsed" }
  - { id: ERR_TERMINATION_TOO_EARLY, http: 409, condition: "Termination of a SUSPENDED source before 2 epochs elapsed" }
  - { id: ERR_STREAK_NOT_RESET, http: 409, condition: "Reactivation while record_rejection_streak >= 3 has not been reset" }
  - { id: ERR_SOURCE_HAS_ACTIVE_RECORDS, http: 409, condition: "Terminating an ACTIVE source that still has ACTIVE records" }
  - { id: ERR_SHOP_HAS_OPEN_CORRECTIONS, http: 409, condition: "Terminating a shop with OPEN or AWAITING_SOURCE correction requests" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Consumer credit_balance_cents below the report price" }
  - { id: ERR_NO_SUBSCRIPTION, http: 402, condition: "DEALER_SUBSCRIPTION report purchase with subscription_tier NONE" }
  - { id: ERR_SUBSCRIPTION_WINDOW_EXPIRED, http: 409, condition: "epoch_index >= subscription_started_epoch + 30 at purchase time" }
  - { id: ERR_DEALER_SUSPENDED, http: 409, condition: "Publish/enroll attempted while dealer SUSPENDED" }
  - { id: ERR_DEALER_BALANCE_OUTSTANDING, http: 409, condition: "Reinstate attempted while invoice_balance_cents > 1000000" }
  - { id: ERR_NOT_LISTING_OWNER, http: 403, condition: "Acting DealerAgent does not own the listing" }
  - { id: ERR_NOT_ENROLLABLE, http: 409, condition: "Enrollment requires PUBLISHED listing, ACTIVE dealer, and vehicle brand severity <= 1" }
  - { id: ERR_GUARANTEE_NOT_ENROLLED, http: 409, condition: "Claim filed or approved against a listing whose guarantee_status != ENROLLED" }
  - { id: ERR_BRAND_NOT_ESCALATED, http: 409, condition: "Claim approval without a brand severity escalation above the enrolled snapshot" }
  - { id: ERR_CLAIM_IN_FLIGHT, http: 409, condition: "Delist of an enrolled listing with an OPEN or APPROVED claim" }
  - { id: ERR_CLAIM_OVERLAP, http: 409, condition: "Second guarantee claim filed on a listing that already has an OPEN or APPROVED claim (closed claim-occupancy conflict)" }
  - { id: ERR_LISTING_WINDOW_CLOSED, http: 409, condition: "Claim filed at or after the listing's exclusive window_end_epoch (half-open publication window expired)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch with the parent entity's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required fields, invalid enum values, or negative amounts" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Platform operator: manages networks, sources, shops, dealers; routes/applies corrections; runs epochs and the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /networks — create network"
      - "POST /advance_epoch"
      - "POST /_clock/set_current_utc"
      - "POST /sources* (register/activate/reactivate/reset_streak/terminate)"
      - "POST /shops/{id}/approve|suspend|reactivate|terminate"
      - "POST /corrections/{id}/route_to_source|apply"
      - "POST /consumers/{id}/credit"
      - "POST /dealers/{id}/reinstate"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: SourceOperator
    description: "External feed operator acting as a specific DataSource (X-User-ID = DataSource.id)"
    identity: "entity_backed:DataSource"
    exclusive_operations:
      - "POST /records — submit feed records"
      - "POST /corrections/{id}/source_confirm|source_deny — verify corrections for own records"
    shared_operations:
      - "GET endpoints"

  - name: ShopOperator
    description: "Participating service shop (X-User-ID = Shop.id)"
    identity: "entity_backed:Shop"
    exclusive_operations:
      - "POST /shops/{id}/service-records — submit service history"
    shared_operations:
      - "POST /vehicles/{id}/corrections — open correction requests"
      - "GET endpoints"

  - name: VehicleOwner
    description: "Vehicle owner / consumer"
    identity: "entity_backed:ConsumerAccount"
    exclusive_operations:
      - "POST /consumers — register consumer account"
      - "POST /reports with product=CONSUMER_SINGLE"
    shared_operations:
      - "POST /vehicles/{id}/corrections — open correction requests"
      - "GET endpoints"

  - name: DealerAgent
    description: "Dealer staff (X-User-ID = Dealer.id)"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealers/{id}/subscribe"
      - "POST /dealers/{id}/listings* (create/publish/delist/enroll_guarantee)"
      - "POST /reports with product=DEALER_SUBSCRIPTION"
    shared_operations:
      - "GET endpoints"

  - name: GuaranteeAdmin
    description: "Buyback guarantee program administrator"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims — file claim"
      - "POST /claims/{id}/approve|reject"
    shared_operations:
      - "GET endpoints"
