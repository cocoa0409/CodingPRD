- section: errors
  instances:
  - name: error_envelope_shape
    claim_type: violation_to_error
    grounds:
    - response_envelope
    - errors
    distinguishing_aspect: Error responses carry meta + response_type='error' + data.error_id + data.message.
    test_recipe:
      setup:
      - any program
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: GET /api/patient-cases/00000000-0000-0000-0000-000000000000
        payload: {}
        as: CDIManager
        captures:
          err: $.data.error_id
          msg: $.data.message
      assert:
      - err == ERR_NOT_FOUND
      - msg is a non-empty string
  - name: err_drg_mismatch_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DRG_MISMATCH]
    excluded_because:
      difficulty_instance: compensating_invariant / agree_then_coder_prevails_reconciliation_preserves_drift
      rationale: Asserted as the failure path of the named §1.8 instance (finalize with mismatched coder DRG).
  - name: err_leading_language_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LEADING_LANGUAGE]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / leading_language_vs_provider_not_in_program_on_send
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: err_stale_version_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_STALE_VERSION]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / stale_version_vs_invalid_state_on_close
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: err_denial_target_unmet_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DENIAL_TARGET_UNMET]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / denial_target_active_window_inclusive_boundaries
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: err_review_already_active_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_REVIEW_ALREADY_ACTIVE]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / single_active_review_per_case_overlap
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: err_case_not_reviewable_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CASE_NOT_REVIEWABLE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / review_activate_requires_case_open_or_under_review
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: err_review_not_active_triggered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_REVIEW_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / query_send_requires_review_active
      rationale: Asserted as the failure path of the named §1.8 instance.
