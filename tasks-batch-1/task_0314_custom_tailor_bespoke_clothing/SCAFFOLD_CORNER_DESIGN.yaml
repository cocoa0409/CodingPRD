        distinguishing_aspect: "Deleting an option line on a DRAFT order recomputes quoted_total_cents downward by that line's upcharge."
        test_recipe:
          setup: ["DRAFT order with base 30000, meters 5.0 @ 6000 (yardage 28800), two lines MONOGRAM(1500)+WORKING_CUFFS(6000)."]
