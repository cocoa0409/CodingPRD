  - rule_id: boundary_precision_check
    instances:

      - name: labor_cost_exactly_equal_to_budget_flips_posture_to_over_budget
        grounds:
          - calculations.project_labor_rollup
          - entities.Project.fields.budget_posture
          - entities.Project.fields.labor_budget_cents
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Boundary #1 is a NUMERIC THRESHOLD CROSSING on the money metric
          Project.labor_cost_cents, reached through POST /time-entries/{timeEntryId}/state:
          at labor_cost_cents 80000 (< budget 160000) the posture is WITHIN_BUDGET, and at
          exactly 160000 == labor_budget_cents it flips to OVER_BUDGET, proving the comparison
          is >= and not >.
        test_recipe:
          setup:
            - "A project with labor_budget_cents 160000, an architect with cost_rate_cents_per_hour 10000, and two SUBMITTED non-overlapping 8.0-hour time entries (cost 80000 cents each)."
            - "Project.labor_cost_cents == 0 and Project.budget_posture == WITHIN_BUDGET before the trigger."
