# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Donut & Bagel Shop. Same call-form / lint gates as §1.8. Default logical
# clock = 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_product_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with all required fields returns 201 and echoes sku/category/unit_price_cents; active defaults true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "PLAIN", name: "Plain Bagel", category: "BAGEL", unit_price_cents: 110, dozen_price_cents: 1100, bulk_threshold: 24, bulk_unit_price_cents: 90, unit_cost_cents: 38 }
              as: ShopAdmin
              captures: { pid: $.data.id }
          assert:
            - "response_type == object"
            - "Product.${pid}.sku == PLAIN"
            - "Product.${pid}.active == true"

      - name: get_product_not_found
        claim_type: Not Found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Product.fields.unit_price_cents, "validations[priority=4]"]
        distinguishing_aspect: "POST /products missing unit_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X", name: "X", category: "DONUT", dozen_price_cents: 1500, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: product_bulk_threshold_default_applied
        claim_type: Defaults
        grounds: [entities.Product.fields.bulk_threshold]
        distinguishing_aspect: "Omitting bulk_threshold on create applies the default 24."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "CINN", name: "Cinnamon Donut", category: "DONUT", unit_price_cents: 160, dozen_price_cents: 1600, bulk_unit_price_cents: 120, unit_cost_cents: 50 }
              as: ShopAdmin
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.bulk_threshold == 24"

      - name: production_day_computed_pools_zero_before_reconcile
        claim_type: Computed Fields
        grounds: [entities.ProductionDay.fields.reconciliation_variance_cents, entities.ProductionDay.fields.gross_sales_cents]
        distinguishing_aspect: "A freshly opened ProductionDay reports gross_sales_cents 0 and reconciliation_variance_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /production-days"
              payload: { business_date: "2026-03-20", delivery_cutoff_utc: "2026-03-20T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "ProductionDay.${d_id}.status == OPEN"
            - "ProductionDay.${d_id}.gross_sales_cents == 0"
            - "ProductionDay.${d_id}.reconciliation_variance_cents == 0"

      - name: list_production_days_paginated_envelope
        claim_type: Listing
        grounds: [entities.ProductionDay, response_envelope]
        distinguishing_aspect: "GET /production-days returns an array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["one production day exists"]
          setup_api_calls:
            - call: "POST /production-days"
              payload: { business_date: "2026-03-21", delivery_cutoff_utc: "2026-03-21T20:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "GET /production-days"
              payload: {}
              as: ShopAdmin
          assert:
            - "response_type == array"
            - "meta.total_count >= 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: bake_from_non_baking_day_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.BakeBatch.PLANNED_to_BAKED, "errors[ERR_DAY_INVALID_STATE]"]
        distinguishing_aspect: "Baking a batch while the parent day is still OPEN (not BAKING) returns ERR_DAY_INVALID_STATE."
        test_recipe:
          setup: ["day OPEN with one PLANNED batch"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-22", delivery_cutoff_utc: "2026-03-22T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 30 }
              as: BakeManager
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 30 }
              as: BakeManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DAY_INVALID_STATE"

      - name: pay_already_paid_order_rejected
        claim_type: Idempotency
        grounds: [state_machines.RetailOrder.CART_to_PAID, "errors[ERR_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "Paying an order that is already PAID returns ERR_ORDER_INVALID_STATE (second pay is rejected)."
        test_recipe:
          setup: ["a PAID order on a SELLING day"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-23", delivery_cutoff_utc: "2026-03-23T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 30 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 30 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 6, marked_down: false } ] }
              as: Cashier
              captures: { o_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${o_id}/pay"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders/${o_id}/pay"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ORDER_INVALID_STATE"

      - name: reconcile_terminal_day_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ProductionDay.CUTOFF_to_RECONCILED, "errors[ERR_DAY_INVALID_STATE]"]
        distinguishing_aspect: "Reconciling a day already RECONCILED returns ERR_DAY_INVALID_STATE; no transition from a terminal state."
        test_recipe:
          setup: ["a fully RECONCILED day (no batches needed beyond one swept)"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-24", delivery_cutoff_utc: "2026-03-24T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 10 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 10 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/sweep"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/close-cutoff"
              payload: {}
              as: ShopAdmin
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: BakeManager
              captures: { v: $.data.version }
            - call: "POST /production-days/${d_id}/reconcile"
              payload: { expected_production_day_version: "${v}" }
              as: BakeManager
          trigger:
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: BakeManager
              captures: { v2: $.data.version }
            - call: "POST /production-days/${d_id}/reconcile"
              payload: { expected_production_day_version: "${v2}" }
              as: BakeManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DAY_INVALID_STATE"

      - name: reconcile_with_unswept_batch_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ProductionDay.CUTOFF_to_RECONCILED, "errors[ERR_BATCHES_NOT_SWEPT]"]
        distinguishing_aspect: "Reconcile on a CUTOFF day with a still-BAKED (unswept) batch returns ERR_BATCHES_NOT_SWEPT."
        test_recipe:
          setup: ["CUTOFF day with one BAKED batch never swept"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-25", delivery_cutoff_utc: "2026-03-25T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 10 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 10 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/close-cutoff"
              payload: {}
              as: ShopAdmin
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: BakeManager
              captures: { v: $.data.version }
          trigger:
            - call: "POST /production-days/${d_id}/reconcile"
              payload: { expected_production_day_version: "${v}" }
              as: BakeManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BATCHES_NOT_SWEPT"

      - name: start_baking_no_batches_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ProductionDay.OPEN_to_BAKING, "errors[ERR_NO_BATCHES]"]
        distinguishing_aspect: "start-baking on a day with zero batches returns ERR_NO_BATCHES."
        test_recipe:
          setup: ["OPEN day, no batches"]
          setup_api_calls:
            - call: "POST /production-days"
              payload: { business_date: "2026-03-26", delivery_cutoff_utc: "2026-03-26T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NO_BATCHES"

      - name: preorder_confirm_without_deposit_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.PreOrder.REQUESTED_to_CONFIRMED, "errors[ERR_DEPOSIT_NOT_MET]"]
        distinguishing_aspect: "Confirming a PreOrder whose deposit_paid_cents < deposit_due_cents returns ERR_DEPOSIT_NOT_MET (402)."
        test_recipe:
          setup: ["a REQUESTED PreOrder with subtotal 4050 (deposit_due 1013) and zero deposit paid"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "EVERYTHING", name: "Everything Bagel", category: "BAGEL", unit_price_cents: 135, dozen_price_cents: 1350, bulk_threshold: 24, bulk_unit_price_cents: 100, unit_cost_cents: 42 }
              as: ShopAdmin
              captures: { every_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Party Co", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-27", delivery_cutoff_utc: "2026-03-27T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pre-orders"
              payload: { wholesale_account_id: "${acct_id}", pickup_production_day_id: "${d_id}", pickup_window_start: "2026-03-27T07:00:00Z", pickup_window_end: "2026-03-27T08:00:00Z", line_items: [ { product_id: "${glazed_id}", qty: 23 }, { product_id: "${sesame_id}", qty: 3 }, { product_id: "${every_id}", qty: 4 } ] }
              as: ShopAdmin
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_id}/confirm"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DEPOSIT_NOT_MET"
            - "PreOrder.${po_id}.deposit_due_cents == 1013"

      - name: preorder_confirm_after_deposit_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.PreOrder.REQUESTED_to_CONFIRMED, entities.PreOrder.fields.deposit_paid_cents]
        distinguishing_aspect: "After recording a 1013 deposit, confirming the PreOrder moves it to CONFIRMED."
        test_recipe:
          setup: ["a REQUESTED PreOrder subtotal 4050 with deposit 1013 recorded"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "EVERYTHING", name: "Everything Bagel", category: "BAGEL", unit_price_cents: 135, dozen_price_cents: 1350, bulk_threshold: 24, bulk_unit_price_cents: 100, unit_cost_cents: 42 }
              as: ShopAdmin
              captures: { every_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Party Co", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-28", delivery_cutoff_utc: "2026-03-28T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pre-orders"
              payload: { wholesale_account_id: "${acct_id}", pickup_production_day_id: "${d_id}", pickup_window_start: "2026-03-28T07:00:00Z", pickup_window_end: "2026-03-28T08:00:00Z", line_items: [ { product_id: "${glazed_id}", qty: 23 }, { product_id: "${sesame_id}", qty: 3 }, { product_id: "${every_id}", qty: 4 } ] }
              as: ShopAdmin
              captures: { po_id: $.data.id }
            - call: "POST /pre-orders/${po_id}/deposit"
              payload: { amount_cents: 1013 }
              as: ShopAdmin
          trigger:
            - call: "POST /pre-orders/${po_id}/confirm"
              payload: {}
              as: ShopAdmin
          assert:
            - "PreOrder.${po_id}.status == CONFIRMED"
            - "PreOrder.${po_id}.deposit_paid_cents == 1013"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: markdown_price_rounding_half_up
        claim_type: Precision
        grounds: [calculations.markdown_price, entities.RetailOrder.fields.subtotal_cents]
        distinguishing_aspect: "A marked_down SESAME line (unit 120) charges round_half_up(120*0.6)=72 per unit; qty 4 -> subtotal 288."
        test_recipe:
          setup: ["day SELLING with a MARKED_DOWN SESAME batch (baked 30)"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-29", delivery_cutoff_utc: "2026-03-29T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${sesame_id}", par_qty: 30 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 30 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/markdown"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${sesame_id}", qty: 4, marked_down: true } ] }
              as: Cashier
              captures: { o_id: $.data.id }
          assert:
            - "RetailOrder.${o_id}.subtotal_cents == 288"

      - name: reward_redemption_caps_discount_at_subtotal
        claim_type: Variant Selection
        grounds: [calculations.retail_order_total, entities.RetailOrder.fields.loyalty_discount_cents, entities.LoyaltyAccount.fields.reward_balance_cents]
        distinguishing_aspect: "With reward_balance 1200 and redeem_reward true on a 1650 subtotal order, loyalty_discount_cents=1200 and total_cents=450."
        test_recipe:
          setup: ["LoyaltyAccount with reward_balance_cents 1200 (from a prior 120-GLAZED PAID order); SELLING day with GLAZED stock"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { phone: "555-0010", name: "Loy Three" }
              as: Cashier
              captures: { loy_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-30", delivery_cutoff_utc: "2026-03-30T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 140 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 140 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 120, marked_down: false } ], loyalty_account_id: "${loy_id}" }
              as: Cashier
              captures: { o0_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${o0_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 13, marked_down: false } ], loyalty_account_id: "${loy_id}", redeem_reward: true }
              as: Cashier
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders/${o_id}/pay"
              payload: {}
              as: Cashier
          assert:
            - "RetailOrder.${o_id}.loyalty_discount_cents == 1200"
            - "RetailOrder.${o_id}.total_cents == 450"

      - name: insufficient_full_price_stock_rejected
        claim_type: Input Set Filtering
        grounds: ["validations[priority=11]", entities.BakeBatch.fields.remaining_qty, "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "A full-price line qty 31 against a batch baked 30 returns ERR_INSUFFICIENT_STOCK."
        test_recipe:
