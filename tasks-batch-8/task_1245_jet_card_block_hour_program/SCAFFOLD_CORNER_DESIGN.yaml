              payload:
                email: "calc2@x.com"
                full_name: "Calc Two"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_c2: $.data.id }
            - call: "POST /members/${m_c2}/cards"
              payload: { program_id: "${prog_c2}" }
              as: Ops
              captures: { c_c2: $.data.id }
            - call: "POST /cards/${c_c2}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N444LT"
                category: "LIGHT"
                home_base_icao: "KTEB"
                seats: 6
                reposition_rate_cents_per_nm: 80
              as: Ops
              captures: { ac_c2: $.data.id }
            - call: "POST /cards/${c_c2}/trips"
              payload:
                trip_kind: "ONE_WAY"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-01-15T15:00:00Z"
                pax_count: 4
                requested_category: "MIDSIZE"
              as: Member
              as_user_id: "${m_c2}"
              captures: { t_c2: $.data.id }
            - call: "POST /trips/${t_c2}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_c2}"
            - call: "POST /trips/${t_c2}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_c2}" }
              as: Ops
            - call: "POST /trips/${t_c2}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${t_c2}/legs"
              payload: {}
              as: Ops
              captures: { leg_c2: "$.data[0].id" }
          trigger:
            - call: "POST /trips/${t_c2}/complete"
              payload: { legs: [{ trip_leg_id: "${leg_c2}", actual_block_minutes: 108 }] }
              as: Ops
          assert:
            - "TripLeg.${leg_c2}.billable_hours == 2.00"
