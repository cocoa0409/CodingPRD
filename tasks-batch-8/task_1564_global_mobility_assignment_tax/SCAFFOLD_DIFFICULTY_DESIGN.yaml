  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referential_on_settlement_create
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_VENDOR_NOT_FILED]
        distinguishing_aspect: |
          Category pair state vs business_referential: a settlement create against
          a DRAFT assignment with NO filed vendor violates both priority 5
          (ERR_INVALID_STATE) and priority 8 (ERR_VENDOR_NOT_FILED); the server
          MUST return ERR_INVALID_STATE because state preconditions outrank
          referential gates.
        test_recipe:
          setup:
            - "Assignment exists in DRAFT; no vendor engagement exists at all"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
          trigger:
            - { call: "POST /mobility/settlements", payload: { assignment_id: "${asg_id}", tax_year: 2026 }, as: PayrollSpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409), NOT ERR_VENDOR_NOT_FILED — priority 5 beats priority 8"

      - name: temporal_beats_constraint_on_record_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_PERIOD_OUTSIDE_ASSIGNMENT]
          - errors[ERR_PER_DIEM_DAYS_INVALID]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: a record for June
          2026 (entirely before the 2026-09-01 assignment start) carrying
          per_diem_days 31 (June has 30 days) violates both priority 9
          (ERR_PERIOD_OUTSIDE_ASSIGNMENT) and priority 10
          (ERR_PER_DIEM_DAYS_INVALID); the temporal error MUST win.
        test_recipe:
          setup:
            - "Fully activated assignment (totalization_applies false), split 60/40 ACTIVE — so the p8 split gate passes and the p9/p10 conflict is isolated"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 6, total_gross_cents: 900000, per_diem_days: 31, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PERIOD_OUTSIDE_ASSIGNMENT (http 422), NOT ERR_PER_DIEM_DAYS_INVALID — priority 9 beats priority 10"

      - name: referential_beats_fiscal_on_extension_approve
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_COC_COVERAGE_GAP]
          - errors[ERR_COST_OVERRUN_BLOCKED]
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal: extension approve
          on an OVERRUN assignment whose ISSUED certificate stops at 2027-08-31
          (requested 2027-11-30) violates both priority 12 (ERR_COC_COVERAGE_GAP)
          and priority 13 (ERR_COST_OVERRUN_BLOCKED); the referential coverage
