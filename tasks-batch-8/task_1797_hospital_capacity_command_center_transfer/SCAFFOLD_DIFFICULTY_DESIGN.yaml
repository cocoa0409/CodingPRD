# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Hospital Capacity Command Center & Transfer Center
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Facility vs CapacityForecast)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: load_score_raw_vs_weighted_variants
        grounds:
          - calculations.transfer_load_score
          - entities.Facility.fields.load_score_raw
          - entities.Facility.fields.load_score_weighted
          - entities.Facility.fields.diversion_recommended
        distinguishing_aspect: |
          Same facility state yields load_score_raw = 60.0 (occupied-only) and
          load_score_weighted = 95.0 (held/boarding/inbound pressure added); the
          weighted variant alone crosses the >= 95.0 diversion-recommendation
          threshold, so diversion_recommended is true while raw sits at 60.0.
          Entity domain: Facility load scoring.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Facility F with 5 staffed beds: b1 CARDIAC/ICU-1 OCCUPIED, b2 CARDIAC/ICU-1 HELD by an inbound transfer in HOLD_PLACED, b3 MEDICAL/ED-1 OCCUPIED by an admission with an open boarding record, b4 MEDICAL/M-1 OCCUPIED, b5 NEURO/N-1 AVAILABLE"
            - "occupied=3, held=1, boarding_waiters=1, active_inbound_transfers=1, staffed=5"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Load Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ICU-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ICU-1", label: "B2", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b2: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "B3", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b3: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B4", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b4: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "N-1", label: "B5", service: "NEURO", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b1}", patient_ref: "P1", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b3}", patient_ref: "P3", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm3: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b4}", patient_ref: "P4", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm3}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Card", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { phys: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PT1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr1: $.data.id }
            - call: "POST /cc/transfer-requests/${tr1}/consult"
              payload: { physician_id: "${phys}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr1}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${phys}"
            - call: "POST /cc/transfer-requests/${tr1}/bed-holds"
              payload: { bed_id: "${b2}" }
              as: TransferCenterCoordinator
          trigger:
            - call: "GET /cc/facilities/${fac}/load-score"
              as: Any
          assert:
            - "response.data.raw_occupancy_pct == 60.0"
            - "response.data.pressure_weighted_pct == 95.0"
            - "response.data.diversion_recommended == true"
            - "response.data.staffed_beds == 5 and occupied_beds == 3 and held_beds == 1 and boarding_waiters == 1 and active_inbound_transfers == 1"

      - name: forecast_committed_vs_provisional_census
        grounds:
          - calculations.projected_census
          - entities.CapacityForecast.fields.variant_snapshots
          - entities.CapacityForecast.fields.occupancy_pct_committed
          - entities.CapacityForecast.fields.occupancy_pct_provisional
        distinguishing_aspect: |
          Identical admission/discharge data produces committed census 2 vs
          provisional census 3 at hour 2: the COMMITTED variant subtracts only the
          signed discharge order, while PROVISIONAL additionally subtracts the
          unsigned pending discharge (from hour 3) and adds
          ceil(1 * 0.8) = 1 expected ED placement every hour. Entity domain:
          CapacityForecast census projection (distinct from Facility load scoring).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Facility F, 4 staffed MEDICAL beds: b1 M-1 OCCUPIED (A1, no discharge), b2 M-1 OCCUPIED (A2, PENDING_DISCHARGE signed, expected 2026-08-01T02:00:00Z), b3 M-2 OCCUPIED (A4, PENDING_DISCHARGE unsigned, expected 2026-08-01T03:00:00Z), b4 ED-1 OCCUPIED (A3) with an open boarding record"
            - "inpatient base = 3 (ED bed excluded); boarding_waiters = 1"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Forecast Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B2", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b2: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-2", label: "B3", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b3: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "B4", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b4: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b1}", patient_ref: "P1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b2}", patient_ref: "P2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm2: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b3}", patient_ref: "P4", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm4: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b4}", patient_ref: "P3", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm3: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm3}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/admissions/${adm2}/pending-discharge"
              payload: { expected_discharge_at: "2026-08-01T02:00:00Z", discharge_order_signed: true }
              as: BedManager
            - call: "POST /cc/admissions/${adm4}/pending-discharge"
              payload: { expected_discharge_at: "2026-08-01T03:00:00Z", discharge_order_signed: false }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 4 }
              as: CapacityPlanner
              captures: { fc: $.data.id }
          trigger:
            - call: "GET /cc/capacity-forecasts/${fc}"
              as: Any
          assert:
            - "response.data.variant_snapshots.committed == [3, 2, 2, 2]"
            - "response.data.variant_snapshots.provisional == [4, 3, 2, 2]"
            - "response.data.occupancy_pct_committed == 75.0"
            - "response.data.occupancy_pct_provisional == 91.7"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) tiered scoring vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: bed_match_score_tiered_ranking
        grounds:
          - calculations.bed_match_score
        distinguishing_aspect: |
          Mode (a): a >= 3-input formula with non-linear interaction — tiered
          service match (1000-point tier), inverted acuity-headroom term, and
          conditional isolation/unit bonuses. Fixture pins scores 1315 > 1200 > 415
          and excludes an acuity-ineligible and an isolation-ineligible bed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F"
            - "Request: service=CARDIAC, acuity=ACUITY_3_MEDICAL_SURGICAL (rank 2), isolation_need=CONTACT (rank 1), preferred_unit=U1"
            - "bA CARDIAC/STEPDOWN(3)/CONTACT/U1 (eligible, 1315); bB CARDIAC/CRITICAL(4)/AIRBORNE/U2 (eligible, 1200); bC MEDICAL/MEDICAL_SURGICAL(2)/CONTACT/U1 (overflow eligible, 415); bD CARDIAC/OBSERVATION(1)/CONTACT/U1 (acuity ineligible); bE CARDIAC/STEPDOWN(3)/NONE(0)/U1 (isolation ineligible)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Match Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "U1", label: "BA", service: "CARDIAC", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "CONTACT" }
              as: SystemAdministrator
              captures: { bA: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "U2", label: "BB", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { bB: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "U1", label: "BC", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "CONTACT" }
              as: SystemAdministrator
              captures: { bC: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "U1", label: "BD", service: "CARDIAC", max_acuity: "ACUITY_4_OBSERVATION", isolation_capability: "CONTACT" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "U1", label: "BE", service: "CARDIAC", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PM", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "CONTACT", service: "CARDIAC", priority: "URGENT", preferred_unit: "U1" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "GET /cc/facilities/${fac}/bed-candidates"
              as: Any
              payload: { transfer_request_id: "${tr}" }
          assert:
            - "candidates contains exactly the three ids [${bA}, ${bB}, ${bC}] in that order"
            - "candidate scores are 1315 for ${bA}, 1200 for ${bB}, 415 for ${bC}"
            - "${bD} (acuity rank 1 < 2) and ${bE} (isolation rank 0 < 1) are absent"

      - name: service_weighted_occupancy_rounding_order
        grounds:
          - calculations.facility_service_occupancy
          - entities.Facility.fields.service_weighted_occupancy_pct
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          per-service round-to-1dp FIRST then weighted aggregate: fixture yields
          36.7 (0.5*33.3 + 0.3*66.7 + 0.2*0.0). The aggregate-first order would
          yield 42.9 (300/7); the pinned order is what the API returns, and the
          same response's raw_occupancy_pct == 42.9 makes the divergence visible.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F with 7 staffed non-ED beds"
            - "CARDIAC: 3 beds, 1 occupied (occ 33.3%); MEDICAL: 3 beds, 2 occupied (occ 66.7%); NEURO: 1 bed, 0 occupied (occ 0.0%)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Occ Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "C1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { c1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "C2", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "C3", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "M1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { m1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "M2", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { m2: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-2", label: "M3", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "N-1", label: "N1", service: "NEURO", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${c1}", patient_ref: "PC", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${m1}", patient_ref: "PM1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${m2}", patient_ref: "PM2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
          trigger:
            - call: "GET /cc/facilities/${fac}/load-score"
              as: Any
          assert:
            - "response.data.service_weighted_occupancy_pct == 36.7"
            - "response.data.raw_occupancy_pct == 42.9"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (TransferRequest cycle vs BoardingRecord parallel)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_request_consult_reconsult_cycle
        grounds:
          - state_machines.TransferRequest.DECLINED_to_CONSULT_PENDING
          - state_machines.TransferRequest.INTAKE_to_CONSULT_PENDING
          - state_machines.TransferRequest.CONSULT_PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic machine on TransferRequest: CONSULT_PENDING -> DECLINED loops
          back to CONSULT_PENDING via a second consult; consult_count accumulates
          to 2 and the accepting physician switches from Dr1 to Dr2.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; physicians Dr1 and Dr2, both ON_CALL and credentialed CARDIAC"
            - "TR in INTAKE"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Cycle Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr One", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr1: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Two", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr2: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PCY", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr1}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "DECLINE", decline_reason: "PHYSICIAN_DECLINED" }
              as: AcceptingPhysician
              as_user_id: "${dr1}"
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr2}" }
              as: TransferCenterCoordinator
              captures: { consult_count_after: $.data.consult_count }
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr2}"
          assert:
            - "TransferRequest.${tr}.status == ACCEPTED"
            - "TransferRequest.${tr}.consult_count == 2"
            - "TransferRequest.${tr}.accepting_physician_id == ${dr2}"
            - "TransferRequest.${tr}.decline_reason == null after the ACCEPT"

      - name: boarding_record_parallel_dimensions
        grounds:
          - state_machines.BoardingRecord.placement_status
          - state_machines.BoardingRecord.escalation_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: placement_status
          (WAITING->OFFERED->PLACED) and escalation_status
          (NONE->HUDDLE_CALLED->HUDDLE_RESOLVED, cyclic) evolve independently —
          a huddle fires and resolves while placement stays WAITING, and placement
          advances to OFFERED while escalation is mid-cycle, each leaving the
          other dimension untouched.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; ED bed occupied by admission A; boarding record BR open"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Boarding Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PB", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { br: $.data.id }
          trigger:
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 130 }
              as: TransferCenterCoordinator
            - call: "GET /cc/boarding-records/${br}/huddles"
              as: Any
              captures: { hud: "$.data[0].id" }
            - call: "POST /cc/boarding-records/${br}/offer"
              payload: {}
              as: TransferCenterCoordinator
            - call: "POST /cc/huddles/${hud}/resolve"
              payload: { resolution: "Bed cleaning expedited" }
              as: HouseSupervisor
              as_user_id: "hs_1"
            - call: "POST /cc/boarding-records/${br}/place"
              payload: {}
              as: TransferCenterCoordinator
          assert:
            - "after heartbeat: BoardingRecord.${br}.placement_status == WAITING and escalation_status == HUDDLE_CALLED (heartbeat changed only the escalation dimension)"
            - "after offer: placement_status == OFFERED while escalation_status == HUDDLE_CALLED (placement moved without touching escalation)"
            - "after resolve: placement_status == OFFERED and escalation_status == HUDDLE_RESOLVED"
            - "after place: placement_status == PLACED and escalation_status == HUDDLE_RESOLVED"
            - "EscalationHuddle.${hud}.trigger_reason == AUTO_THRESHOLD and status == RESOLVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (discharge chain depth 3 vs diversion chain depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_discharge_invalidates_forecast_chain
        grounds:
          - state_machines.Admission.PENDING_DISCHARGE_to_DISCHARGED
          - state_machines.Bed.OCCUPIED_to_AVAILABLE
          - entities.CapacityForecast.fields.stale
          - entities.Facility.fields.next_elective_window_start
        distinguishing_aspect: |
          Depth-3 cascade from POST /cc/admissions/{id}/confirm-discharge:
          Admission -> DISCHARGED (link 1) mutates Bed (OCCUPIED -> AVAILABLE,
          cooling_until set); the bed-availability mutation (link 2) marks the
          latest PUBLISHED CapacityForecast stale = true; the staleness flip
          (link 3) nulls Facility.next_elective_window_start (was
          2026-08-01T01:00:00Z before the trigger).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F with 4 staffed MEDICAL non-ED beds (b1 occupied by A1, b2-b4 available)"
            - "A1 PENDING_DISCHARGE, signed, expected 2026-08-01T01:00:00Z"
            - "PUBLISHED forecast F1 (horizon 4): provisional census h1 = 0 <= 4-2 so Facility.next_elective_window_start == 2026-08-01T01:00:00Z and F1.stale == false"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Cascade Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B2", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-2", label: "B3", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-3", label: "B4", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b1}", patient_ref: "P1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm1: $.data.id }
            - call: "POST /cc/admissions/${adm1}/pending-discharge"
              payload: { expected_discharge_at: "2026-08-01T01:00:00Z", discharge_order_signed: true }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 4 }
              as: CapacityPlanner
              captures: { fc: $.data.id }
            - call: "POST /cc/capacity-forecasts/${fc}/publish"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /cc/admissions/${adm1}/confirm-discharge"
              payload: {}
              as: BedManager
          assert:
            - "Admission.${adm1}.status == DISCHARGED"
            - "Bed.${b1}.status == AVAILABLE and Bed.${b1}.cooling_until == 2026-08-01T00:45:00Z and Bed.${b1}.projected_free_at == null"
            - "CapacityForecast.${fc}.stale == true (link 2: bed mutation marked the PUBLISHED forecast stale)"
            - "Facility.${fac}.next_elective_window_start == null (link 3: staleness nulls the elective window; it was 2026-08-01T01:00:00Z before the trigger)"

      - name: diversion_declaration_declines_pipeline_chain
        grounds:
          - state_machines.DiversionEvent.ACTIVE_to_ACTIVE
          - state_machines.Facility.ACCEPTING_to_DIVERT_FULL
          - state_machines.TransferRequest.CONSULT_PENDING_to_DECLINED
          - state_machines.TransferRequest.INTAKE_to_DECLINED
        distinguishing_aspect: |
          Depth-2 cascade from POST /cc/facilities/{id}/diversions (different
          trigger from the discharge chain): DiversionEvent creation (link 1)
          flips Facility.diversion_status to DIVERT_FULL; the posture flip
          (link 2) auto-declines every INTAKE and CONSULT_PENDING transfer
          request with decline_reason=DIVERSION and clears their consult fields,
          dropping active_inbound_transfers from 2 to 0.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; physician Dr ON_CALL CARDIAC"
            - "TR1 in INTAKE; TR2 in CONSULT_PENDING to Dr (accepting_physician_id == Dr, consult_deadline == 2026-08-01T00:30:00Z)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Divert Facility", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr D", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PD1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PD2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr2: $.data.id }
            - call: "POST /cc/transfer-requests/${tr2}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
          trigger:
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
          assert:
            - "Facility.${fac}.diversion_status == DIVERT_FULL (link 1)"
            - "TransferRequest.${tr1}.status == DECLINED and decline_reason == DIVERSION (link 2)"
            - "TransferRequest.${tr2}.status == DECLINED and decline_reason == DIVERSION and accepting_physician_id == null and consult_deadline == null (link 2)"
            - "Facility.${fac}.active_inbound_transfers == 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state vs business_safety;
  #           business_safety vs business_constraint — different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_isolation_on_hold_create
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_TRANSFER_INVALID_STATE]
          - errors[ERR_ISOLATION_INCOMPATIBLE]
        distinguishing_aspect: |
          Category pair state vs business_safety: the request violates both —
          transfer request is INTAKE (state, priority 5) and the bed's isolation
          NONE is below the request's CONTACT need (business_safety, priority 7).
          The state error ERR_TRANSFER_INVALID_STATE (409) wins because priority
          5 is evaluated before priority 7.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F; bed b1 CARDIAC/STEPDOWN/isolation NONE, AVAILABLE"
            - "TR with service CARDIAC, isolation_need CONTACT, still in INTAKE (no consult dispatched)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Prio Facility A", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "St Elsewhere", patient_ref: "PP1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "CONTACT", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_TRANSFER_INVALID_STATE (priority 5 state beats priority 7 business_safety; isolation never evaluated)"

      - name: isolation_beats_hold_quota_on_hold_create
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - calculations.hold_quota_check
          - errors[ERR_ISOLATION_INCOMPATIBLE]
          - errors[ERR_HOLD_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair
          from the state/safety instance): the request violates both — the
          explicit bed's isolation NONE is below the request's AIRBORNE need
          (business_safety, priority 7) and the facility already holds 6 ACTIVE
          holds (business_constraint quota, priority 15). ERR_ISOLATION_INCOMPATIBLE
          (422) wins because safety precedes constraint.
