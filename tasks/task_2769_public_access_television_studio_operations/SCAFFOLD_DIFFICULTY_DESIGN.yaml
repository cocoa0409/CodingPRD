  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancelling_confirmed_reservation_restores_deposit_ledger
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Producer.fields.deposit_held_cents
          - entities.Reservation.fields.deposit_refunded_cents
          - entities.StudioResource.fields.open_reservation_count
          - calculations.reservation_deposit_hold
        distinguishing_aspect: |
          The conserved quantity is the deposit ledger: Producer.deposit_held_cents
          must always equal the sum of deposit_hold_cents over that producer's
          reservations in {CONFIRMED, CHECKED_OUT, DAMAGE_REVIEW}. Cancelling a
          confirmed reservation is the compensating action that reverses the hold
          exactly, with zero forfeiture and zero uncovered liability, and it must
          leave the other hold and the resource counter untouched.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and competency_codes [STUDIO_FLOOR, EDIT_SUITE], 0 suspension points."
            - "StudioResource STUDIO-A has base_deposit_cents 12345, replacement_value_cents 900000, capacity_slots 1, turnaround_minutes 30."
            - "Reservations R1 (2026-08-08T10:00:00Z-12:00:00Z) and R2 (2026-08-09T10:00:00Z-12:00:00Z) are both CONFIRMED at 12962 cents, so Producer.deposit_held_cents is 25924 and open_reservation_count is 2."
            - "The clock stands at 2026-08-06T00:00:00Z, so both bookings are still in the future."
          setup_api_calls:
