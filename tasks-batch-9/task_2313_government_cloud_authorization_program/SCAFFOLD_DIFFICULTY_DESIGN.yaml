      - AssessmentEngagement.${engagement_id}.status == VOIDED
      - TestSlot.${slot_a_id}.status == COMPLETED and TestSlot.${slot_b_id}.status == COMPLETED (no COMPLETED slot is cancelled)
      - AssessmentEngagement.${engagement_id}.allocated_hours == 20.00 and unallocated_hours == 180.00
      - CloudServiceOffering.${offering_id}.open_package_count == 0
      - CloudServiceOffering.${offering_id}.status == PACKAGE_SUBMITTED
