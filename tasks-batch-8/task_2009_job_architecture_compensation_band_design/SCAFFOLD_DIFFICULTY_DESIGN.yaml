  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_mapping_approve
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_DEPARTMENT_POOL_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair state-vs-business_fiscal: the approve call hits
          a decision stuck at SUBMITTED (state tier) while the department
          pool (100 cents) would also fail the fiscal check — the state-tier
          ERR_INVALID_STATE_TRANSITION must win, not ERR_DEPARTMENT_POOL_EXHAUSTED.
        test_recipe:
          setup:
            - "ENG P1/P2 bands PUBLISHED; program MAPPING_OPEN; department DA pool 100 (deliberately tiny)"
            - "employee E1 salary 10000000 on SWE1; mapping E1 -> SWE2 submitted (provisional 1050000) but NOT advanced past SUBMITTED"
