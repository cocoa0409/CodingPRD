# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3027_flash_sale_event_merchandising_drop_ship_order
#
# Nine Difficulty Rules from §0.5, two instances each (18 total). Every instance
# grounds in §1.1-§1.6 of SCAFFOLD.yaml and is drivable from empty-DB by the
# ordered §1.5 call chain in `setup_api_calls`. Every numeric assert is a literal
# computed by executing the referenced §1.3 formula in Python.
#
# Shared fixture note: these instances all begin by setting the logical clock.
# The server's startup default is 2026-09-01T00:00:00Z; every chain below sets an
# explicit instant at or after it so no assert depends on wall-clock time.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      # --- instance 1: CustomerOrder money domain -----------------------------
      - name: order_refund_variant_divergence_on_short_shipped_line
        grounds:
          - calculations.order_refund_claim
          - calculations.order_refund_claim.variants[net_of_allocation]
          - calculations.order_refund_claim.variants[gross_line_writeoff]
          - entities.Confirmation.fields.short_shipped_units
          - endpoints.POST_/orders/{id}/refunds
        distinguishing_aspect: |
          The two variants of calculations.order_refund_claim operate on the CustomerOrder money
          domain and return different cents for the identical 4-confirmed-of-5 line: net_of_allocation
          yields 100 while gross_line_writeoff yields 500.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1 STANDARD/EXCELLENT. Shop S1 OPEN. Event E1 LIVE with ship_time_quote_days 21. Listing L1 allocation 10 at 100 cents."
            - "Customer C1 with order O1 submitted: one line of quantity 5 in VENDOR_CONFIRMED with confirmed_units 4."
            - "PO1 issued and closed short, so the line is SHORT_SHIPPED with short_shipped_units 1 and payment_status CAPTURED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 21 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-COAT-01", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 5 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { confirmation_id: $.data.id, confirmation_v0: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 5 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /confirmations/${confirmation_id}/confirm"
              payload: { confirm_units: 4 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /orders/${order_id}/capture"
              payload: {}
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/close-short"
              payload: { force_close: true }
              as: InventoryPlanner
          trigger:
            - call: "POST /orders/${order_id}/refunds"
              payload: { write_off_full_line: false }
              as: InventoryPlanner
              captures: { base_refund_cents: $.data.refund_due_cents }
            - call: "POST /orders/${order_id}/reprice"
              payload: { variant: "GROSS_LINE_WRITEOFF" }
              as: InventoryPlanner
          assert:
            - "after the close-short, Confirmation.${confirmation_id}.short_shipped_units == 1 and confirmation_status == SHORT_SHIPPED"
            - "the net_of_allocation refund is exactly 100 cents — 1 missing unit * 100 cents/unit"
            - "after POST /orders/${order_id}/reprice with variant GROSS_LINE_WRITEOFF, CustomerOrder.${order_id}.refund_due_cents == 500"
            - "the two variants differ by exactly 400 cents for the same line — 500 != 100"
            - "after POST /orders/${order_id}/refunds, payment_status == REFUNDED and Customer.refund_balance_cents == 100"

      # --- instance 2: Listing allocation domain ------------------------------
      - name: oversell_split_variant_divergence_on_two_lines
        grounds:
          - calculations.oversell_allocation
          - calculations.oversell_allocation.variants[fifo_by_confirmed_at]
          - calculations.oversell_allocation.variants[cancel_newest_first]
          - entities.Confirmation.fields.oversold_units
          - endpoints.GET_/listings/{id}/oversell-preview
        distinguishing_aspect: |
          The two variants of calculations.oversell_allocation operate on the Listing allocation
          domain and split the identical 2-unit excess across two identically-sized lines in opposite
          directions: fifo_by_confirmed_at puts 0 on the earlier line and 2 on the later one, while
          cancel_newest_first puts 2 on the earlier line and 0 on the later one.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1, Shop S1 OPEN, Event E1 LIVE, Listing L1 with allocation_units 4 at 100 cents."
            - "Two customers each hold an order with one line of quantity 3 on L1; the first line's confirmed_at is 2026-09-01T10:00:00Z and the second's is 2026-09-01T11:00:00Z."
            - "Neither line has been confirmed by the vendor yet, so both sit in PENDING_VENDOR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-COAT-01", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "early@example.com", full_name: "Early Buyer" }
              as: Any
              captures: { cust_early_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "late@example.com", full_name: "Late Buyer" }
              as: Any
              captures: { cust_late_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_early_id}" }
              as: Customer
              as_user_id: "${cust_early_id}"
              captures: { order_early_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_late_id}" }
              as: Customer
              as_user_id: "${cust_late_id}"
              captures: { order_late_id: $.data.id }
            - call: "POST /orders/${order_early_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_early_id}"
              captures: { line_early_id: $.data.id }
            - call: "POST /orders/${order_late_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_late_id}"
              captures: { line_late_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: Merchandiser
            - call: "POST /orders/${order_early_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_early_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T11:00:00Z" }
              as: Merchandiser
            - call: "POST /orders/${order_late_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_late_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 6 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
          trigger:
            - call: "GET /listings/${listing_id}/oversell-preview"
              payload: {}
              as: Merchandiser
            - call: "POST /confirmations/${line_late_id}/confirm"
              payload: { confirm_units: 3 }
              as: Vendor
              as_user_id: "${vendor_id}"
          assert:
            - "Listing.${listing_id}.units_ordered == 6 and allocation_units == 4, so the excess is exactly 2"
            - "the preview named provisional_variant cancel_newest_first splits 3 and 3 into oversold_units 2 on the earlier line and 0 on the later line"
            - "after the producer confirm, Confirmation.${line_early_id}.oversold_units == 2 and Confirmation.${line_late_id}.oversold_units == 0"
            - "the two variants return different per-line numbers for identical inputs — the fifo split is 0/2 and the provisional split is 2/0"
            - "Listing.${listing_id}.oversell_units == 2 and listing_status == SOLD_OUT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: event_net_contribution_nested_min_max_with_penalty_cap
        grounds:
          - calculations.event_net_contribution
          - calculations.event_net_contribution.constants[MAX_PENALTY_RATE]
          - calculations.event_net_contribution.constants[STRATEGIC_SPIFF_RATE]
          - entities.Event.fields.net_contribution_cents
        distinguishing_aspect: |
          This instance lands on mode (a): the formula takes six inputs and combines a tier-selected
          spiff, a min-clamped penalty and a max-clamped floor, so the penalty cap bites before the
          floor does and the returned number is the max of a min-clamped expression and a floor.
        test_recipe:
          setup:
            - "Clock 2026-09-02T01:00:00Z. Vendor V1 is STRATEGIC. Shop OPEN, Event E1 LIVE with 21-day quote, Listing L1 allocation 5 at 1000 cents unit price and 700 cents unit cost."
            - "Two lines submitted and vendor-confirmed at 5 units each, so units_sold 10 and units_ordered 10 against allocation 5 — an excess of 5."
            - "An oversell of 5 units at 1000 cents, so the uncapped penalty would be 7500 and the cap at 40 percent of 10000 revenue binds first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Helios Supply", vendor_tier: "STRATEGIC" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Helios Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Helios Flash", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 21 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "HE-01", unit_price_cents: 1000, vendor_unit_cost_cents: 700, allocation_units: 5, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@example.com", full_name: "Casey Two" }
              as: Any
              captures: { cust2_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust1_id}" }
              as: Customer
              as_user_id: "${cust1_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust2_id}" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /orders/${order1_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 5 }
              as: Customer
              as_user_id: "${cust1_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /orders/${order2_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 5 }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { line2_id: $.data.id }
            - call: "POST /orders/${order1_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust1_id}"
            - call: "POST /orders/${order2_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust2_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 10 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /confirmations/${line1_id}/confirm"
              payload: { confirm_units: 5 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /confirmations/${line2_id}/confirm"
              payload: { confirm_units: 5 }
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /events/${event_id}/run-event-checkpoint"
              payload: {}
              as: Merchandiser
          assert:
            - "Event.${event_id}.units_ordered_total == 10 and Event.${event_id}.oversell_units_total == 5"
            - "vendor_payable_cents is round_half_up(700 * 10 * 0.97) == 6790 — the STRATEGIC spiff binds before any other term"
            - "the penalty is capped: min(7500, round_half_up(10000 * 0.40)) == 4000, NOT 7500"
            - "sell_through is 10 / max(5, 1) == 2.0 so buffer_credit_cents == round_half_up(2.0 * 2500) == 5000, fully saturated well above the 0.9000 tail threshold"
            - "Event.${event_id}.net_contribution_cents == 4210 — max(10000 - 6790 - 4000 + 5000, round_half_up(10000 * 0.15))"
            - "Event.${event_id}.net_contribution_cents != 1500, which is what the floor alone would give"
            - "Event.${event_id}.net_contribution_variant == PROJECTED_WHILE_LIVE and checkpoint_index == 1"

      - name: cross_dock_eta_pins_per_line_days_before_the_cutoff_roll
        grounds:
          - calculations.cross_dock_dispatch_eta
          - calculations.cross_dock_dispatch_eta.constants[DISPATCH_CUTOFF_HOUR_UTC]
          - calculations.cross_dock_dispatch_eta.constants[TRANSPARENCY_EMBARGO_HOURS]
          - entities.Parcel.fields.dispatch_eta
        distinguishing_aspect: |
          This instance lands on mode (b): the nested rounding of the per-line day count and the
          dispatch cut-off must be ordered one way, and the pinned order adds the per-line days BEFORE
          the whole-day roll, so a parcel sealed at 18:00Z lands at 2026-09-21T18:00:00Z while the
          rejected roll-then-add order would land a full day earlier at 2026-09-20T18:00:00Z.
        test_recipe:
          setup:
            - "Clock 2026-08-29T00:00:00Z. Vendor V1, Shop S1 OPEN, two LIVE events each with one listing: SLOW with ship_time_quote_days 21 and FAST with ship_time_quote_days 5."
            - "Customer C1's order O1 carries one line from each event, 2 units each. Both lines are vendor-confirmed, bought on two separate buys, shipped and received at the cross-dock by 2026-08-30T10:00:00Z."
            - "The clock is then set to 2026-08-30T18:00:00Z so the parcel is sealed at 18:00Z, after the 17:00Z dispatch cut-off, and the slow event's ends_at (2026-09-05T00:00:00Z) is far enough out that the embargo does not win."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Slow Event", starts_at: "2026-08-29T00:00:00Z", ends_at: "2026-09-05T00:00:00Z", ship_time_quote_days: 21 }
              as: Merchandiser
              captures: { event_slow_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fast Event", starts_at: "2026-08-29T00:00:00Z", ends_at: "2026-09-05T00:00:00Z", ship_time_quote_days: 5 }
              as: Merchandiser
              captures: { event_fast_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_slow_id}", vendor_sku: "SLOW-01", unit_price_cents: 500, vendor_unit_cost_cents: 300, allocation_units: 5, reveal_at: "2026-08-29T00:00:00Z" }
              as: Merchandiser
              captures: { listing_slow_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_fast_id}", vendor_sku: "FAST-01", unit_price_cents: 500, vendor_unit_cost_cents: 300, allocation_units: 5, reveal_at: "2026-08-29T00:00:00Z" }
              as: Merchandiser
              captures: { listing_fast_id: $.data.id }
            - call: "POST /events/${event_slow_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_fast_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_slow_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_fast_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_slow_id}", quantity: 2 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_slow_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_fast_id}", quantity: 2 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_fast_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_slow_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_slow_id: $.data.id }
            - call: "POST /purchase-orders/${po_slow_id}/add-line"
              payload: { listing_id: "${listing_slow_id}", quantity_ordered: 2 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_slow_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_fast_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_fast_id: $.data.id }
            - call: "POST /purchase-orders/${po_fast_id}/add-line"
              payload: { listing_id: "${listing_fast_id}", quantity_ordered: 2 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_fast_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /confirmations/${line_slow_id}/confirm"
              payload: { confirm_units: 2 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /confirmations/${line_fast_id}/confirm"
              payload: { confirm_units: 2 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /vendor-shipments"
              payload: { purchase_order_id: "${po_slow_id}", quantity_shipped: 2, carrier_tracking_code: "SLOW-TRK-1", shipped_at: "2026-08-29T12:00:00Z", allocations: [{ listing_id: "${listing_slow_id}", quantity: 2 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { ship_slow_id: $.data.id }
            - call: "POST /vendor-shipments"
              payload: { purchase_order_id: "${po_fast_id}", quantity_shipped: 2, carrier_tracking_code: "FAST-TRK-1", shipped_at: "2026-08-29T12:00:00Z", allocations: [{ listing_id: "${listing_fast_id}", quantity: 2 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { ship_fast_id: $.data.id }
