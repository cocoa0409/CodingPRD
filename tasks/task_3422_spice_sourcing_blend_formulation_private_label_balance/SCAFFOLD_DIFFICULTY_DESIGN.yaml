            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
