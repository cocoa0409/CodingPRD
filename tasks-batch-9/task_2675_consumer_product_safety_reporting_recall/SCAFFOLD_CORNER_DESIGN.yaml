      - name: shared_operations_are_open_to_every_declared_holder
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles[SafetyDirector].shared_operations
          - roles[FieldAuditor]
          - roles[ComplianceOfficer]
          - roles[ProgramAdmin].exclusive_operations
        distinguishing_aspect: |
          Peer roles overlap deliberately, and the overlap has to be real in both
          directions: the SafetyDirector may schedule an audit visit the FieldAuditor
          usually schedules, the FieldAuditor may sign the verification the director
          may also sign, the ComplianceOfficer may run the sweep and may acknowledge
          on a retailer's behalf without being subject to the RetailerRep scope rule,
          and the ProgramAdmin owns the clock and the registry that every other chain
          depends on. An implementation that hard-codes one role per endpoint fails
          here while still passing the denial instance.
