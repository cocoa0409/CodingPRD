# =============================================================================
# §1.8: Scaffold Difficulty Design — Test Targeting Index
# Task 1807: Oversize Load Escort & Pilot Car Service
# 9 Difficulty Rules x >= 2 instances = 19 instances. All monetary values in
# integer cents; all arithmetic pre-computed from §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two calculations, DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: job_quote_vs_final_invoice_divergence
        grounds:
          - calculations.quote_estimate
          - calculations.final_billing
          - calculations.invoice_total_composition
          - calculations.standby_billing
        distinguishing_aspect: |
          Pricing domain (Job/Invoice): the provisional variant prices
          forward-looking estimated hours (ceil(120mi/50mph*2)/2 = 2.5h) while
          the final variant prices chronological actual hours (270 min -> 4.5h,
          4h floor not binding) plus per-event-rounded standby — identical
          dimensions yield quoted 47500 vs invoiced 71960.
        test_recipe:
          setup:
            - "Carrier with credit_limit_cents 10000000; one TX-certified escort (no pole needed: height 170 < TX pole threshold 174)"
            - "Job: TX leg, 120mi, width 170 (rear 1, front 0 -> 1 position), height 170 (survey required: 170 >= 174-6), weight 150000, window/traversal 2026-08-10T09:00:00Z..13:00:00Z, map_min_clearance 180"
            - "Job delivered after a 45-minute CARRIER_DELAY (15 billable minutes) and a 12:00 check-in; deliver at 13:30 (comms gap exactly 90 min, allowed)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Acme Heavy Haul", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Escort One", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Press brake", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-1", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey_id: $.data.id } }
            - { call: "POST /route-surveys/${survey_id}/submit", payload: { surveyed_min_clearance_inches: 180 }, as: RouteSurveyor }
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v: $.data.version } }
            - { call: "POST /route-surveys/${survey_id}/accept", payload: { expected_leg_version: "${leg_v}", outcome: "ACCEPTED" }, as: SafetyManager }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc1_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/delay-events", payload: { cause: "CARRIER_DELAY", started_at: "2026-08-10T10:00:00Z" }, as: Dispatcher, captures: { delay_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:45:00Z" }, as: Dispatcher }
            - { call: "POST /delay-events/${delay_id}/close", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /assignments/${asg_id}/check-ins", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:30:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/invoices", payload: {}, as: BillingClerk, as_user_id: "bc-1", captures: { inv_id: $.data.id } }
          assert:
            - "Job.${job_id}.quoted_cents == 47500 (provisional: 2.5h x 1 position x 9000 = 22500 base + 25000 survey fee)"
            - "Invoice.${inv_id}.base_charges_cents == 40500 (final: 4.5 actual hours x 9000; 270 min -> ceil(270/30)/2 = 4.5h >= 4h floor)"
            - "Invoice.${inv_id}.equipment_charges_cents == 25000 and Invoice.${inv_id}.standby_total_cents == 1875 (45 min - 30 grace = 15 chargeable -> 15 billable; 0.25h x 7500 x 1 position)"
            - "Invoice.${inv_id}.subtotal_cents == 67375, volume_discount_cents == 0 (tier basis 67375 < 100000), fuel_surcharge_cents == 4585 (round_half_up(65500 x 0.07)), total_cents == 71960"
            - "quoted_cents (47500) != total_cents (71960): identical job dimensions, divergent variants"

      - name: map_vs_surveyed_clearance_verdict
        grounds:
          - calculations.clearance_assessment
          - state_machines.RouteLeg.DETERMINED_to_BLOCKED
          - state_machines.RouteSurvey.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: |
          RouteLeg/RouteSurvey domain (distinct from the pricing domain of
          job_quote_vs_final_invoice_divergence): for identical job dimensions
          (height 170 -> required clearance 176), the map_estimate variant
          (map_min_clearance 180) yields PASS while the surveyed_actual variant
          (175) yields FAIL and blocks the leg; a second survey (177) flips it
          back and supersedes the first.
        test_recipe:
          setup:
            - "Carrier; job width 170 / height 170 on a TX leg (survey required; map_min_clearance 180 advises PASS); quoted, booked, permit issued"
            - "Required clearance = 170 + 6 = 176 inches"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Bison Freight", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Tank", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-9", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey1_id: $.data.id } }
            - { call: "POST /route-surveys/${survey1_id}/submit", payload: { surveyed_min_clearance_inches: 175 }, as: RouteSurveyor }
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v1: $.data.version } }
            - { call: "POST /route-surveys/${survey1_id}/accept", payload: { expected_leg_version: "${leg_v1}", outcome: "ACCEPTED" }, as: SafetyManager }
          trigger:
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey2_id: $.data.id } }
            - { call: "POST /route-surveys/${survey2_id}/submit", payload: { surveyed_min_clearance_inches: 177 }, as: RouteSurveyor }
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v2: $.data.version } }
            - { call: "POST /route-surveys/${survey2_id}/accept", payload: { expected_leg_version: "${leg_v2}", outcome: "ACCEPTED" }, as: SafetyManager }
          assert:
            - "After survey 1 (175 < 176): RouteLeg.${leg_id}.clearance_verdict == FAIL and leg_status == BLOCKED, Job.${job_id}.job_status == BOOKED — surveyed variant FAILS what the map variant (180 >= 176) passes"
            - "Second survey request re-opened the BLOCKED leg to DETERMINED with clearance_verdict reset to UNKNOWN"
            - "After survey 2 (177 >= 176): RouteSurvey.${survey1_id}.survey_status == SUPERSEDED, RouteSurvey.${survey2_id}.survey_status == ACCEPTED, leg clearance_verdict == PASS and leg_status == CLEARED, Job.${job_id}.job_status == CLEARED"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: per_state_requirement_branching
        grounds:
          - calculations.escort_requirement_determination
          - entities.RouteLeg.fields.required_front_escorts
          - entities.RouteLeg.fields.requires_police_escort
        distinguishing_aspect: |
          Mode (a) — 4 inputs with non-linear conditional interaction: width
          alone drives rear/front/two-front branching, while police requirement
          is an OR across width and weight thresholds, so a 150-inch-wide load
          can require police with zero escort positions (weight branch alone).
        test_recipe:
          setup:
            - "Carrier; clock at 2026-08-05; two DRAFT jobs on TX legs: A width 195 / height 180 / weight 250000, B width 150 / height 150 / weight 250000"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Cimarron Carriers", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Superload A", width_inches: 195, height_inches: 180, length_inches: 600, gross_weight_lbs: 250000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 200 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_a: $.data.id } }
            - { call: "GET /jobs/${job_a}/legs", payload: {}, as: Dispatcher, captures: { leg_a: "$.data[0].id" } }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Heavy B", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 250000, window_start_at: "2026-08-11T09:00:00Z", window_end_at: "2026-08-11T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-11T09:00:00Z", planned_exit_at: "2026-08-11T13:00:00Z", map_min_clearance_inches: 200 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_b: $.data.id } }
            - { call: "GET /jobs/${job_b}/legs", payload: {}, as: Dispatcher, captures: { leg_b: "$.data[0].id" } }
          trigger:
            - { call: "POST /jobs/${job_a}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_b}/quote", payload: {}, as: Dispatcher }
          assert:
            - "Leg A: required_rear_escorts == 1 (195 >= 168), required_front_escorts == 2 (195 >= two_front 192), requires_height_pole == true (180 >= 174), requires_police_escort == true (195 >= 192 OR 250000 >= 200000), requires_route_survey == true"
            - "Job A: total_escort_positions == 3, quoted_cents == 147500 (2.5h x 3 x 9000 = 67500 base + 15000 pole + 40000 police + 25000 survey)"
            - "Leg B: required_rear_escorts == 0 and required_front_escorts == 0 (150 < 168) yet requires_police_escort == true (weight branch 250000 >= 200000 alone), requires_height_pole == false, requires_route_survey == false (150 < 168)"
            - "Job B: total_escort_positions == 0, quoted_cents == 40000 (0 base + 40000 police fee; non-linear: police fee survives zero escort positions)"

      - name: standby_per_event_rounding_order
        grounds:
          - calculations.standby_billing
          - entities.DelayEvent.fields.billable_minutes
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: rounding is pinned
          PER EVENT then summed (31 raw -> 15 billable; 46 raw -> 30 billable;
          total 45 billable min -> 11250 cents at 2 positions); summing
          chargeable minutes first (1 + 16 = 17 -> ceil(17/15)*15 = 30 ->
          7500 cents) produces a different, wrong result.
        test_recipe:
          setup:
            - "Carrier; two TX escorts; job width 185 / height 150 (rear 1 + front 1 = 2 positions, no pole/survey/police), TX 120mi, booked, permitted, both assignments ACCEPTED, departed 2026-08-10T09:00:00Z"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Dusty Roads Inc", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Front Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_f: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rear Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_r: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Wide tank", width_inches: 185, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-2", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "FRONT", escort_id: "${esc_f}" }, as: Dispatcher, captures: { asg_f: $.data.id } }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_r}" }, as: Dispatcher, captures: { asg_r: $.data.id } }
            - { call: "POST /assignments/${asg_f}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_f}" }
            - { call: "POST /assignments/${asg_r}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_r}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/delay-events", payload: { cause: "CARRIER_DELAY", started_at: "2026-08-10T10:00:00Z" }, as: Dispatcher, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:31:00Z" }, as: Dispatcher }
            - { call: "POST /delay-events/${d1}/close", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/delay-events", payload: { cause: "MECHANICAL_BREAKDOWN", started_at: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:46:00Z" }, as: Dispatcher }
            - { call: "POST /delay-events/${d2}/close", payload: {}, as: Dispatcher }
          assert:
            - "DelayEvent.${d1}: raw_minutes == 31, billable_minutes == 15 (31 - 30 grace = 1 chargeable -> ceil(1/15)*15 = 15), standby_amount_cents == 3750 (0.25h x 7500 x 2 positions)"
            - "DelayEvent.${d2}: raw_minutes == 46, billable_minutes == 30 (46 - 30 = 16 -> ceil(16/15)*15 = 30), standby_amount_cents == 7500 (0.5h x 7500 x 2)"
            - "Job standby total == 11250 = 3750 + 7500; the round-once-on-sums order would yield 7500 and is incorrect"

      - name: invoice_evaluation_order
        grounds:
          - calculations.invoice_total_composition
          - entities.Invoice.fields.volume_discount_cents
          - entities.Invoice.fields.fuel_surcharge_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          discount tier reads (ytd_billed + THIS subtotal) while the fuel
          surcharge is computed on the UNDISCOUNTED base+equipment and EXCLUDES
          standby, so total = 207125 - 4143 + 14105 = 217087 is only correct in
          the pinned order.
        test_recipe:
          setup:
            - "Carrier (ytd_billed 0); two pole-equipped TX escorts (max 192) + one plain TX escort; job width 195 / height 180 / weight 250000 TX 120mi (front 2 + rear 1 = 3 positions, pole, police, survey), fully executed with a 31-minute CARRIER_DELAY, delivered at 13:30"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Eagle Heavy", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Pole One", certified_state_codes: ["TX"], has_height_pole: true, height_pole_max_inches: 192 }, as: Dispatcher, captures: { esc_f1: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Pole Two", certified_state_codes: ["TX"], has_height_pole: true, height_pole_max_inches: 192 }, as: Dispatcher, captures: { esc_f2: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rear Plain", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_r: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Superload", width_inches: 195, height_inches: 180, length_inches: 600, gross_weight_lbs: 250000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 200 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-3", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey_id: $.data.id } }
            - { call: "POST /route-surveys/${survey_id}/submit", payload: { surveyed_min_clearance_inches: 190 }, as: RouteSurveyor }
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v: $.data.version } }
            - { call: "POST /route-surveys/${survey_id}/accept", payload: { expected_leg_version: "${leg_v}", outcome: "ACCEPTED" }, as: SafetyManager }
            - { call: "POST /legs/${leg_id}/confirm-police", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "FRONT", escort_id: "${esc_f1}" }, as: Dispatcher, captures: { asg_f1: $.data.id } }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "FRONT", escort_id: "${esc_f2}" }, as: Dispatcher, captures: { asg_f2: $.data.id } }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_r}" }, as: Dispatcher, captures: { asg_r: $.data.id } }
            - { call: "POST /assignments/${asg_f1}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_f1}" }
            - { call: "POST /assignments/${asg_f2}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_f2}" }
            - { call: "POST /assignments/${asg_r}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_r}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
