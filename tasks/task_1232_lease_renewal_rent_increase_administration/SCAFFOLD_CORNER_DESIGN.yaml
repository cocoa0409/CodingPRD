              payload: { full_name: "Ty Break", email: "ty.break@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { term: $.data.offered_term_months }
          assert:
            - "term == 24 (all-zero loads -> term_months DESC tie-break -> band max)"

      - name: expiration_forecast_counts
        claim_type: correct_result
        grounds: [calculations.expiration_forecast_load]
        distinguishing_aspect: "Computed read: forecast from clock month 2026-05 over 48 months reports committed expirations at 2027-06 (1), 2028-12 (1), 2029-06 (1) and a projected expiration at 2029-05 (1) from the open DRAFT offer's term-23 projection."
        test_recipe:
          setup: ["same fixture as staggering_selector_prefers_emptiest_month, including the created DRAFT offer (term 23 -> projected 2029-05-01)"]
          setup_api_calls:
