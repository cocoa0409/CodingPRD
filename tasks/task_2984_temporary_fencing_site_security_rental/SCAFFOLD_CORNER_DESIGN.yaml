          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, product PANEL-CL-10."
            - "Two accounts: A1 (Ridgeline) with jobsite J1 and a DRAFT quote QA, A2 (Seaboard) with jobsite J2 and an ISSUED quote QB for 500 ft."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
