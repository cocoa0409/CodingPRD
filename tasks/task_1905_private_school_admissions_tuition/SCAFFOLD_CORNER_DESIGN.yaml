  # ================================================================ calculations
  - section: calculations
    instances:
      - name: composite_with_sibling_and_legacy_points
        claim_type: correct_result
        grounds: [calculations.composite_score, "entities.Application.fields.preference_points"]
        distinguishing_aspect: "An ACTIVE student with the same family_id plus legacy_parent=true adds 10+5 preference points AFTER the weighted rounding: 0.6*80 + 0.4*90 = 84.0 -> composite 99.0."
        test_recipe:
          setup: ["OPEN cycle with G9 section; ACTIVE Student sib in family fam-s (same section); fam-s applicant with legacy_parent true; application SUBMITTED and both evaluations SCHEDULED"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/students", payload: { family_id: "fam-s", first_name: "Sid", last_name: "Sib", current_grade_section_id: "${sec}" }, as: AdmissionDirector, captures: { sib: $.data.id } }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-s", first_name: "Ann", last_name: "Sib", date_of_birth: "2013-05-01", legacy_parent: true }, as: Parent, as_user_id: "fam-s", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-s", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-s" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
          trigger:
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
          assert:
            - "Application.${app}.composite_score == 99.0 (84.0 weighted + 10 sibling + 5 legacy)"
            - "Application.${app}.preference_points == 15 and sibling_verified == true"

      - name: sibling_points_require_same_family_active_student
        claim_type: input_set_filtering
        grounds: [calculations.composite_score, "entities.Student.fields.status"]
        distinguishing_aspect: "A student in a DIFFERENT family does not count: with legacy_parent=true only, composite is 84.0 + 5 = 89.0 and sibling_verified is false — the sibling input set is filtered by family_id AND status == ACTIVE."
        test_recipe:
          setup: ["OPEN cycle with G9 section; ACTIVE student belonging to fam-other; fam-a applicant legacy_parent=true; application SUBMITTED, evaluations SCHEDULED"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/students", payload: { family_id: "fam-other", first_name: "Ola", last_name: "Other", current_grade_section_id: "${sec}" }, as: AdmissionDirector }
