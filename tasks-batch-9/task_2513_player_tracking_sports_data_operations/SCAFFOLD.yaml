scenario: |
  Generate task harder than expert level!

  2513. Player Tracking & Sports Data Operations (professional league data operations): venue sensor and optical tracking system installation with calibration and accuracy validation, data collection during games with real-time and post-game processing pipelines, event tagging and statistician workflow with quality control and correction procedures, data rights allocation among the league, clubs, broadcasters and commercial data licensees, player consent and collective bargaining constraints on biometric data usage, latency and reliability requirements for broadcast and in-venue displays, historical data normalization across system changes and seasons, third-party developer access tiers with licensing and usage auditing

domain_name: player-tracking-data-ops
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every resource is addressed by its own top-level collection (`/games/{id}`,
  # `/event-tags/{id}`, `/feed-sessions/{id}`); parent linkage is expressed by
  # foreign keys in request bodies, never by nested creation paths. Sub-resource
  # GETs exist only as reverse-lookup channels.

  state_machine_shape: parallel
  # Game carries two independent state dimensions (collection_status ×
  # certification_status) that advance on different triggers; TrackingInstallation,
  # EventTag and FeedSession each carry a revision cycle; CorrectionRequest
  # branches into two divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Venue→TrackingInstallation, Game→EventTag, FeedSession→LicenseUsageRecord
    - cross_aggregate      # FeedSession references RightsWindow and Game across aggregate boundaries
    - polymorphic          # RightsWindow.holder_id resolves to Club.id or DataLicensee.id per holder_type

  role_model: segregation_of_duties
  # The engineer who recorded a calibration run cannot certify the rig; the
  # statistician who tagged an event cannot accept it; the author of a correction
  # request cannot resolve it. All three checks compare X-User-ID values.

  consistency_model: immediate

difficulty_level: expert_plus
# Structural surface: 14 entities / 50 endpoints / 46 error codes / 6 calculations
# (4 carrying variants) / 7 state machines. Above the Expert band of §0.4 because
# the caller asked for "harder than expert"; the extra surface buys eight
# genuinely coupled subsystems (calibration posture, parallel game dimensions,
# tag/correction QC loop, rights allocation pool, consent+CBA gating, latency/
# capacity geometry, historical normalization, licensee quota ledger) rather than
# additional CRUD.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue display name
      - name: city
        type: string
        source: input
        description: city the venue sits in
      - name: tracking_tech
        type: enum
        source: input
        description: installed tracking technology family
        constraints: "one of OPTICAL, SENSOR_UWB, HYBRID"
      - name: required_certified_installations
        type: integer
        source: input
        description: number of CERTIFIED installations the venue needs before data_posture may reach CERTIFIED
        constraints: ">= 1"
      - name: transport_capacity_mbps
        type: number
        source: input
        description: total egress bandwidth the venue can sustain across concurrent FeedSessions
        constraints: "> 0"
      - name: min_achievable_latency_ms
        type: integer
        source: input
        description: physical latency floor of the venue's transport path; FeedSession.requested_latency_ms may not go below it
        constraints: ">= 1"
      - name: data_posture
        type: enum
        source: computed
        description: derived gate over all child TrackingInstallations; recomputed by calculations.venue_data_posture on every installation status change
        default: UNCERTIFIED
        constraints: "one of UNCERTIFIED, RESTRICTED, CERTIFIED"
      - name: active_installation_count
        type: integer
        source: computed
        description: count of child TrackingInstallations with status IN {DEPLOYED, CALIBRATING, VALIDATED, CERTIFIED, RECALIBRATION_REQUIRED}
        default: 0
      - name: certified_installation_count
        type: integer
        source: computed
        description: count of child TrackingInstallations with status == CERTIFIED
        default: 0
      - name: recalibrating_installation_count
        type: integer
        source: computed
        description: count of child TrackingInstallations with status IN {CALIBRATING, RECALIBRATION_REQUIRED}
        default: 0
      - name: uncertified_installation_count
        type: integer
        source: computed
        description: count of child TrackingInstallations with status IN {DEPLOYED, VALIDATED}
        default: 0
      - name: retired_installation_count
        type: integer
        source: computed
        description: count of child TrackingInstallations with status == RETIRED (excluded from active_installation_count)
        default: 0

  - name: TrackingInstallation
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this sensor/optical rig is installed in"
      - name: rig_label
        type: string
        source: input
        description: operator-facing rig label, unique per venue
        constraints: "unique within (venue_id) across installations with status != RETIRED"
      - name: modality
        type: enum
        source: input
        description: sensing modality of the rig
        constraints: "one of OPTICAL_CAMERA, UWB_ANCHOR, LIDAR"
      - name: status
        type: enum
        source: system
        description: calibration lifecycle state
        default: DEPLOYED
        constraints: "one of DEPLOYED, CALIBRATING, VALIDATED, CERTIFIED, RECALIBRATION_REQUIRED, RETIRED"
      - name: latest_run_result
        type: enum
        source: computed
        description: "result of the CalibrationRun with the greatest recorded_at_utc (tie-break created_at ASC, last wins); null before the first run"
        default: null
        constraints: "one of PASS, PROVISIONAL, FAIL, INVALID or null"
      - name: latest_run_composite_rms_mm
        type: number
        source: computed
        description: composite_rms_mm of the same latest CalibrationRun; null before the first run
        default: null
      - name: latest_run_recorded_at_utc
        type: datetime
        source: computed
        description: recorded_at_utc of the same latest CalibrationRun; null before the first run
        default: null
      - name: latest_run_engineer_user_id
        type: string
        source: computed
        description: recorded_by_user_id of the same latest CalibrationRun; the segregation-of-duties counterparty for certification
        default: null
      - name: certified_at_utc
        type: datetime
        source: computed
        description: logical clock value at the most recent DEPLOYED/VALIDATED -> CERTIFIED transition
        default: null
      - name: certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the LeagueDataOps operator who certified the rig
        default: null
      - name: calibration_run_count
        type: integer
        source: computed
        description: number of CalibrationRun rows recorded against this installation
        default: 0
      - name: drift_flag_count
        type: integer
        source: computed
        description: number of CERTIFIED -> RECALIBRATION_REQUIRED transitions this rig has undergone
        default: 0

  - name: CalibrationRun
    parent: TrackingInstallation
    common_fields: false
    fields:
      - name: installation_id
        type: string
        source: input
        description: "FK -> TrackingInstallation.id; supplied through the path, echoed on the row"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the CalibrationEngineer who recorded the run
      - name: recorded_at_utc
        type: datetime
        source: system
        description: logical clock value at the moment the run was recorded
      - name: axis_rms_x_mm
        type: number
        source: input
        description: RMS positional error on the x axis in millimetres
        constraints: ">= 0"
      - name: axis_rms_y_mm
        type: number
        source: input
        description: RMS positional error on the y axis in millimetres
        constraints: ">= 0"
      - name: axis_rms_z_mm
        type: number
        source: input
        description: RMS positional error on the z axis in millimetres
        constraints: ">= 0"
      - name: sample_count
        type: integer
        source: input
        description: number of tracking samples the run was computed over
        constraints: ">= 0"
      - name: reference_point_count
        type: integer
        source: input
        description: number of surveyed reference points used for the fit
        constraints: ">= 0"
      - name: composite_rms_mm
        type: number
        source: computed
        description: quadratic mean of the three axis errors per calculations.calibration_accuracy_evaluation, 2 decimals round_half_up
      - name: result
        type: enum
        source: computed
        description: accuracy verdict per calculations.calibration_accuracy_evaluation
        constraints: "one of PASS, PROVISIONAL, FAIL, INVALID"

  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: club display name
      - name: market_code
        type: string
        source: input
        description: three-letter market code
        constraints: "unique across clubs"
      - name: roster_size
        type: integer
        source: computed
        description: number of Player rows whose club_id is this club
        default: 0

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; the club holding this player's registration"
      - name: full_name
        type: string
        source: input
        description: player name
      - name: jersey_number
        type: integer
        source: input
        description: jersey number
        constraints: "unique within club_id; 0..99"
      - name: biometric_release_state
        type: enum
        source: computed
        description: derived from this player's ConsentRecord rows per state_machines.ConsentRecord side effects; gates biometric payloads on EventTag
        default: NONE
        constraints: "one of NONE, GRANTED, WITHDRAWN, EXPIRED"
      - name: active_consent_record_id
        type: string
        source: computed
        description: id of this player's single ConsentRecord with status == ACTIVE, or null when none exists
        default: null
      - name: masked_tag_count
        type: integer
        source: computed
        description: number of this player's EventTag rows whose biometric_masked flipped to true
        default: 0

  - name: ConsentRecord
    parent: Player
    common_fields: true
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; supplied through the path, echoed on the row"
      - name: scope
        type: enum
        source: input
        description: data category the consent covers
        constraints: "one of BIOMETRIC_TRACKING, POSITIONAL_ONLY"
      - name: cba_agreement_version
        type: string
        source: input
        description: collective bargaining agreement version the club countersigned against
        constraints: 'must equal the constant CBA_CURRENT_VERSION, whose fixed value is "CBA-2026A"'
      - name: effective_from_utc
        type: datetime
        source: input
        description: first instant the consent covers
      - name: expires_at_utc
        type: datetime
        source: input
        description: instant the consent lapses; the clock endpoint expires ACTIVE records at or after this value
      - name: status
        type: enum
        source: system
        description: consent lifecycle state
        default: PENDING
        constraints: "one of PENDING, ACTIVE, WITHDRAWN, EXPIRED"
      - name: submitted_by_club_id
        type: string
        source: system
        description: X-User-ID (a Club id) of the ClubDataOfficer that filed the record
      - name: ratified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the LeagueDataOps operator that ratified the record against the CBA
        default: null
      - name: terminated_at_utc
        type: datetime
        source: computed
        description: logical clock value at the ACTIVE -> WITHDRAWN or ACTIVE -> EXPIRED transition
        default: null

  - name: Game
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue hosting the game and supplying tracking data"
      - name: home_club_id
        type: string
        source: input
        description: "FK -> Club.id; home club"
      - name: away_club_id
        type: string
        source: input
        description: "FK -> Club.id; away club"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: scheduled tip-off instant
      - name: tracking_generation
        type: enum
        source: input
        description: generation of the tracking system that produced this game's data; drives normalization scale factors
        constraints: "one of G1, G2, G3"
      - name: licensable_minutes
        type: integer
        source: input
        description: total minutes of tracking output that may be licensed out of this game; the allocation pool for RightsWindow rows
        constraints: ">= 1"
      - name: collection_status
        type: enum
        source: system
        description: data-collection dimension of the game state; advances independently of certification_status
        default: SCHEDULED
        constraints: "one of SCHEDULED, LIVE, SUSPENDED_COLLECTION, COLLECTED, ARCHIVED"
      - name: certification_status
        type: enum
        source: system
        description: statistical-certification dimension of the game state; advances independently of collection_status
        default: PENDING
        constraints: "one of PENDING, PROVISIONAL, OFFICIAL, DISPUTED"
      - name: data_quality_flag
        type: enum
        source: computed
        description: set to DEGRADED when the hosting venue's data_posture leaves CERTIFIED while the game is LIVE; back to CLEAN on resume
        default: CLEAN
        constraints: "one of CLEAN, DEGRADED"
      - name: draft_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with review_status == DRAFT
        default: 0
      - name: submitted_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with review_status == SUBMITTED
        default: 0
      - name: accepted_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with review_status == ACCEPTED
        default: 0
      - name: under_correction_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with review_status == UNDER_CORRECTION
        default: 0
      - name: superseded_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with review_status == SUPERSEDED
        default: 0
      - name: total_tag_count
        type: integer
        source: computed
        description: all EventTag rows on this game; conserved census total (see calculations.game_tag_census)
        default: 0
      - name: approved_correction_count
        type: integer
        source: computed
        description: CorrectionRequest rows against this game's tags with status == APPROVED
        default: 0
      - name: rejected_correction_count
        type: integer
        source: computed
        description: CorrectionRequest rows against this game's tags with status == REJECTED
        default: 0
      - name: masked_tag_count
        type: integer
        source: computed
        description: EventTag rows on this game with biometric_masked == true
        default: 0
      - name: quality_index
        type: number
        source: computed
        description: weighted statistician-quality score per calculations.event_tag_quality_index, 4 decimals round_half_up
        default: 0.0
      - name: league_reserve_minutes
        type: integer
        source: computed
        description: minutes withheld for LEAGUE_ARCHIVE rights per calculations.rights_allocation_ledger step 1
        default: 0
      - name: net_allocatable_minutes
        type: integer
        source: computed
        description: licensable_minutes minus league_reserve_minutes; the pool all non-LEAGUE_ARCHIVE RightsWindows draw from
        default: 0
      - name: allocated_minutes_total
        type: integer
        source: computed
        description: sum of allocated_minutes over this game's RightsWindow rows with status == ACTIVE and rights_class != LEAGUE_ARCHIVE
        default: 0
      - name: remaining_allocatable_minutes
        type: integer
        source: computed
        description: net_allocatable_minutes minus allocated_minutes_total
        default: 0
      - name: league_reserve_allocated_minutes
        type: integer
        source: computed
        description: sum of allocated_minutes over this game's RightsWindow rows with status == ACTIVE and rights_class == LEAGUE_ARCHIVE
        default: 0
      - name: certified_at_utc
        type: datetime
        source: computed
        description: logical clock value at the most recent transition of certification_status to OFFICIAL
        default: null

  - name: EventTag
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the game the tagged event belongs to"
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player the event is attributed to"
      - name: tag_type
        type: enum
        source: input
        description: event category
        constraints: "one of SHOT, PASS, FOUL, SUBSTITUTION"
      - name: clock_ms
        type: integer
        source: input
        description: game-clock offset of the event in milliseconds
        constraints: ">= 0"
      - name: confidence
        type: number
        source: input
        description: statistician confidence in the tag, 0.00..1.00, used by the quality index
        constraints: "0 <= confidence <= 1"
      - name: biometric_payload_present
        type: boolean
        source: input
        description: whether the tag carries biometric-derived attributes (heart-rate/load) for the player
        default: false
      - name: review_status
        type: enum
        source: system
        description: statistician/QC workflow state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, UNDER_CORRECTION, SUPERSEDED"
      - name: tagged_by_user_id
        type: string
        source: system
        description: X-User-ID of the Statistician who created the tag; segregation-of-duties counterparty for acceptance
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualityReviewer who last accepted the tag
        default: null
      - name: correction_count
        type: integer
        source: computed
        description: number of APPROVED CorrectionRequests applied to this tag
        default: 0
      - name: biometric_masked
        type: boolean
        source: computed
        description: true when the attributed player's biometric release lapsed, suppressing the biometric payload
        default: false
      - name: superseded_by_tag_id
        type: string
        source: computed
        description: id of the EventTag that superseded this one on the same (game_id, tag_type, clock_ms) key
        default: null
      - name: game_version_at_tag
        type: integer
        source: system
        description: Game.version immediately after this tag's creation incremented it; audit anchor for OCC disputes
      - name: corrected_clock_ms
        type: integer
        source: computed
        description: clock_ms value written by the most recent APPROVED CorrectionRequest, or null when never corrected
        default: null

  - name: CorrectionRequest
    parent: EventTag
    common_fields: true
    fields:
      - name: event_tag_id
        type: string
        source: input
        description: "FK -> EventTag.id; supplied through the path, echoed on the row"
      - name: reason_code
        type: enum
        source: input
        description: why the tag is disputed
        constraints: "one of WRONG_PLAYER, WRONG_CLOCK, WRONG_TYPE, BIOMETRIC_REMOVAL"
      - name: proposed_clock_ms
        type: integer
        source: input
        description: replacement clock_ms; required when reason_code == WRONG_CLOCK, otherwise must be omitted
        default: null
      - name: proposed_player_id
        type: string
        source: input
        description: replacement player id; required when reason_code == WRONG_PLAYER, otherwise must be omitted. Resolves against Player.id and is validated against the game's two rosters
        default: null
      - name: status
        type: enum
        source: system
        description: correction workflow state
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the author; segregation-of-duties counterparty for resolution
      - name: submitted_by_role
        type: enum
        source: system
        description: role the author acted as
        constraints: "one of Statistician, ClubDataOfficer"
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualityReviewer who resolved the request
        default: null
      - name: resolved_at_utc
        type: datetime
        source: computed
        description: logical clock value at the APPROVED/REJECTED transition
        default: null

  - name: RightsWindow
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; supplied through the path, echoed on the row"
      - name: rights_class
        type: enum
        source: input
        description: data-rights class the window grants
        constraints: "one of BROADCAST_LIVE, IN_VENUE_DISPLAY, COMMERCIAL_LICENSE, LEAGUE_ARCHIVE"
      - name: holder_type
        type: enum
        source: input
        description: category of party holding the window
        constraints: "one of LEAGUE, CLUB, LICENSEE"
      - name: holder_id
        type: string
        source: input
        description: "polymorphic holder reference resolved by holder_type: LEAGUE -> must be omitted/null; CLUB -> a Club.id that equals this game's home_club_id or away_club_id; LICENSEE -> a DataLicensee.id"
        default: null
      - name: territory
        type: string
        source: input
        description: territory scope; the literal GLOBAL or a two-letter country code. GLOBAL collides with every territory for overlap purposes
      - name: window_start_utc
        type: datetime
        source: input
        description: first instant covered by the window (inclusive)
      - name: window_end_utc
        type: datetime
        source: input
        description: last instant covered by the window (inclusive; closed-interval semantics)
      - name: max_latency_ms
        type: integer
        source: input
        description: contractual delivery SLA ceiling; FeedSessions under this window may not request a lower-latency guarantee than the window sells
        constraints: ">= 1"
      - name: allowed_scopes
        type: array
        source: input
        description: subset of {POSITIONAL, EVENT, BIOMETRIC} that FeedSessions under this window may request
        constraints: "non-empty, values from POSITIONAL, EVENT, BIOMETRIC"
      - name: allocated_minutes
        type: integer
        source: computed
        description: ceil((window_end_utc - window_start_utc) in seconds / 60); the minutes this window draws from the game's pool
      - name: status
        type: enum
        source: system
        description: window lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, REVOKED"
      - name: revoked_at_utc
        type: datetime
        source: computed
        description: logical clock value at the ACTIVE -> REVOKED transition
        default: null
      - name: active_feed_session_count
        type: integer
        source: computed
        description: FeedSession rows under this window with status IN {ACTIVE, SUSPENDED}
        default: 0

  - name: DataLicensee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: licensee display name
      - name: licensee_class
        type: enum
        source: input
        description: commercial category of the licensee
        constraints: "one of BROADCASTER, COMMERCIAL_LICENSEE, DEVELOPER"
      - name: tier
        type: enum
        source: input
        description: access tier; fixes the unit rate and the scope set the licensee may request
        constraints: "one of BRONZE, SILVER, GOLD"
      - name: granted_units
        type: integer
        source: input
        description: total data units the license grants for the term; conserved quantity of the quota ledger
        constraints: ">= 0"
      - name: biometric_entitled
        type: boolean
        source: input
        description: whether the license paperwork permits BIOMETRIC scope at all (required in addition to tier)
        default: false
      - name: available_units
        type: integer
        source: computed
        description: units neither reserved nor consumed; initialised to granted_units
        default: 0
      - name: reserved_units
        type: integer
        source: computed
        description: units held by FeedSession rows with status IN {ACTIVE, SUSPENDED}
        default: 0
      - name: consumed_units
        type: integer
        source: computed
        description: units settled by TERMINATED FeedSession rows
        default: 0
      - name: settled_charge_cents
        type: integer
        source: computed
        description: cumulative metered charge across TERMINATED FeedSessions
        default: 0
      - name: sla_credit_cents
        type: integer
        source: computed
        description: cumulative credit issued for LicenseUsageRecord rows that breached the window SLA
        default: 0
      - name: audit_flag_count
        type: integer
        source: computed
        description: number of LicenseUsageRecord rows with sla_breach == true across all of this licensee's sessions
        default: 0

  - name: FeedSession
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the game whose tracking output the session streams"
      - name: licensee_id
        type: string
        source: system
        description: "FK -> DataLicensee.id; taken from X-User-ID of the acting Licensee, never from the body"
      - name: rights_window_id
        type: string
        source: input
        description: "FK -> RightsWindow.id; the rights window the session is exercised under"
      - name: delivery_mode
        type: enum
        source: input
        description: pipeline the session consumes; REALTIME requires the game to be LIVE, POST_GAME requires COLLECTED or ARCHIVED
        constraints: "one of REALTIME, POST_GAME"
      - name: bandwidth_mbps
        type: number
        source: input
        description: sustained egress the session occupies on the venue transport
        constraints: "> 0"
      - name: window_start_utc
        type: datetime
        source: input
        description: first instant of the session occupation (inclusive)
      - name: window_end_utc
        type: datetime
        source: input
        description: end instant of the session occupation (exclusive; half-open semantics)
      - name: requested_latency_ms
        type: integer
        source: input
        description: delivery latency the session asks for
        constraints: ">= 1"
      - name: scope
        type: array
        source: input
        description: requested data scopes, subset of {POSITIONAL, EVENT, BIOMETRIC}
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: session lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, TERMINATED"
      - name: halt_reason
        type: enum
        source: computed
        description: why the session left ACTIVE
        default: null
        constraints: "one of CLIENT_REQUEST, CONSENT_WITHDRAWN, CONSENT_EXPIRED, VENUE_DEGRADED, SLA_BREACH_THRESHOLD or null"
      - name: duration_minutes
        type: number
        source: computed
        description: (window_end_utc - window_start_utc) in seconds / 60, exact
      - name: latency_multiplier
        type: number
        source: computed
        description: premium multiplier selected from requested_latency_ms per calculations.feed_session_billing constants
      - name: reserved_units
        type: integer
        source: computed
        description: units held at creation by the RESERVED_FORWARD variant of calculations.feed_session_billing
        default: 0
      - name: reserved_charge_cents
        type: integer
        source: computed
        description: provisional charge for the reserved units at the licensee's tier rate
        default: 0
      - name: metered_units
        type: number
        source: computed
        description: sum of units_charged over this session's LicenseUsageRecord rows
        default: 0
      - name: settled_charge_cents
        type: integer
        source: computed
        description: final charge from the METERED_ACTUAL variant, written at termination
        default: 0
      - name: refunded_units
        type: integer
        source: computed
        description: reserved_units minus metered_units returned to the licensee at termination
        default: 0
      - name: usage_record_count
        type: integer
        source: computed
        description: number of LicenseUsageRecord rows on this session
        default: 0
      - name: sla_breach_count
        type: integer
        source: computed
        description: number of this session's LicenseUsageRecord rows with sla_breach == true
        default: 0

  - name: LicenseUsageRecord
    parent: FeedSession
    common_fields: false
    fields:
      - name: licensee_id
        type: string
        source: system
        description: "FK -> DataLicensee.id; copied from the parent session"
      - name: feed_session_id
        type: string
        source: input
        description: "FK -> FeedSession.id; supplied through the path, echoed on the row"
      - name: sampled_at_utc
        type: datetime
        source: input
        description: instant the usage sample covers; chronological replay key for the METERED_ACTUAL variant
      - name: bandwidth_mbps
        type: number
        source: input
        description: measured egress during the sample
        constraints: "> 0"
      - name: duration_seconds
        type: integer
        source: input
        description: length of the sample in seconds
        constraints: ">= 1"
      - name: latency_p95_ms
        type: integer
        source: input
        description: observed p95 delivery latency during the sample
        constraints: ">= 1"
      - name: units_charged
        type: number
        source: computed
        description: per-record ceil of bandwidth_mbps * duration_seconds/60 * session.latency_multiplier
      - name: sla_breach
        type: boolean
        source: computed
        description: true when latency_p95_ms exceeds the parent session's RightsWindow.max_latency_ms

  - name: NormalizationRun
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; supplied through the path, echoed on the row"
      - name: basis
        type: enum
        source: input
        description: normalization variant to apply
        constraints: "one of RAW_GENERATION, CANONICAL_SEASON"
      - name: metric_code
        type: enum
        source: input
        description: tracking metric being normalized
        constraints: "one of TOTAL_DISTANCE_M, SPRINT_DISTANCE_M"
      - name: segment_values
        type: array
        source: input
        description: per-segment raw metric values in generation-native units, ordered as captured
        constraints: "array of numbers >= 0; an empty array is schema-legal at priority 15 and is refused by validations priority 70 with ERR_NORMALIZATION_SEGMENTS_EMPTY"
      - name: source_generation
        type: enum
        source: computed
        description: copied from the game's tracking_generation at run time
        constraints: "one of G1, G2, G3"
      - name: scale_factor_applied
        type: number
        source: computed
        description: GENERATION_SCALE constant selected for source_generation
      - name: drift_correction_pct
        type: number
        source: computed
        description: CANONICAL_DRIFT_PCT constant applied by the CANONICAL_SEASON basis; 0 for RAW_GENERATION
      - name: mapping_version
        type: string
        source: computed
        description: canonical mapping table version stamped on the run; constant MAPPING_VERSION
      - name: normalized_value
        type: number
        source: computed
        description: normalized metric per calculations.normalized_tracking_metric, 2 decimals round_half_up

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: TrackingInstallation
    initial_state: DEPLOYED
    terminal_states: [RETIRED]
    note: |
      Cyclic shape: CERTIFIED -> RECALIBRATION_REQUIRED -> CALIBRATING -> VALIDATED ->
      CERTIFIED can be traversed any number of times; drift_flag_count records the laps.
    transitions:
      - from: DEPLOYED
        to: CALIBRATING
        trigger: "POST /installations/{id}/calibration-runs"
        actor: CalibrationEngineer
        preconditions:
          - "installation.status IN {DEPLOYED, CALIBRATING, RECALIBRATION_REQUIRED}"
        side_effects:
          - "create CalibrationRun with recorded_by_user_id = X-User-ID and recorded_at_utc = logical clock"
          - "run.composite_rms_mm and run.result written by calculations.calibration_accuracy_evaluation"
          - "installation.calibration_run_count += 1; latest_run_* mirror fields refreshed"
          - "recompute Venue.uncertified_installation_count / recalibrating_installation_count and Venue.data_posture via calculations.venue_data_posture"
      - from: RECALIBRATION_REQUIRED
        to: CALIBRATING
        trigger: "POST /installations/{id}/calibration-runs"
        actor: CalibrationEngineer
        preconditions:
          - "installation.status IN {DEPLOYED, CALIBRATING, RECALIBRATION_REQUIRED}"
        side_effects:
          - "same as DEPLOYED -> CALIBRATING (run created, mirrors refreshed, venue census and posture recomputed)"
      - from: CALIBRATING
        to: VALIDATED
        trigger: "system, immediately after a CalibrationRun whose result == PASS is recorded"
        actor: system
        preconditions:
          - "the just-recorded run.result == PASS"
        side_effects:
          - "Venue.uncertified_installation_count += 1 and recalibrating_installation_count -= 1; Venue.data_posture recomputed"
        note: "result PROVISIONAL or FAIL leaves the installation in CALIBRATING; result INVALID leaves it in CALIBRATING as well and no accuracy claim is recorded"
      - from: VALIDATED
        to: CERTIFIED
        trigger: "POST /installations/{id}/certify"
        actor: LeagueDataOps
        preconditions:
          - "installation.status == VALIDATED"
          - "installation.latest_run_result == PASS"
          - "logical clock - installation.latest_run_recorded_at_utc <= CERT_VALIDITY_HOURS (72h)"
          - "X-User-ID != installation.latest_run_engineer_user_id (segregation of duties)"
        side_effects:
          - "certified_at_utc = logical clock; certified_by_user_id = X-User-ID"
          - "Venue.certified_installation_count += 1, uncertified_installation_count -= 1"
          - "Venue.data_posture recomputed via calculations.venue_data_posture (may flip RESTRICTED -> CERTIFIED)"
      - from: CERTIFIED
        to: RECALIBRATION_REQUIRED
        trigger: "POST /installations/{id}/flag-drift"
        actor: CalibrationEngineer
        preconditions:
          - "installation.status == CERTIFIED"
        side_effects:
          - "installation.drift_flag_count += 1"
          - "Venue.certified_installation_count -= 1, recalibrating_installation_count += 1"
          - "CASCADE link 1: Venue.data_posture recomputed and leaves CERTIFIED"
          - "CASCADE link 2 (caused by link 1): every Game at this venue with collection_status == LIVE moves LIVE -> SUSPENDED_COLLECTION and data_quality_flag -> DEGRADED"
          - "CASCADE link 3 (caused by link 2): every FeedSession on those games with status == ACTIVE moves ACTIVE -> SUSPENDED with halt_reason = VENUE_DEGRADED (quota untouched)"
      - from: CERTIFIED
        to: RETIRED
        trigger: "POST /installations/{id}/retire"
        actor: LeagueDataOps
        preconditions:
          - "installation.status IN {CERTIFIED, RECALIBRATION_REQUIRED}"
        side_effects:
          - "Venue.certified_installation_count -= 1, active_installation_count -= 1, retired_installation_count += 1"
          - "Venue.data_posture recomputed; the same LIVE-game / ACTIVE-session cascade as flag-drift fires when the posture leaves CERTIFIED"
      - from: RECALIBRATION_REQUIRED
        to: RETIRED
        trigger: "POST /installations/{id}/retire"
        actor: LeagueDataOps
        preconditions:
          - "installation.status IN {CERTIFIED, RECALIBRATION_REQUIRED}"
        side_effects:
          - "Venue.recalibrating_installation_count -= 1, active_installation_count -= 1, retired_installation_count += 1"
          - "Venue.data_posture recomputed"

  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /consent-records/{id}/ratify"
        actor: LeagueDataOps
        preconditions:
          - "record.status == PENDING"
          - "record.cba_agreement_version == CBA_CURRENT_VERSION"
          - "record.expires_at_utc > logical clock"
        side_effects:
          - "ratified_by_user_id = X-User-ID"
          - "Player.active_consent_record_id = record.id"
          - "Player.biometric_release_state -> GRANTED when record.scope == BIOMETRIC_TRACKING (POSITIONAL_ONLY leaves it unchanged)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /consent-records/{id}/withdraw"
        actor: ClubDataOfficer
        preconditions:
          - "record.status == ACTIVE"
          - "X-User-ID == Player.club_id of the record's player"
        side_effects:
          - "terminated_at_utc = logical clock; Player.active_consent_record_id = null"
          - "CASCADE link 1: Player.biometric_release_state GRANTED -> WITHDRAWN"
          - "CASCADE link 2 (caused by link 1): every EventTag of that player with biometric_payload_present == true and review_status != SUPERSEDED gets biometric_masked = true; Player.masked_tag_count and Game.masked_tag_count increase accordingly"
          - "CASCADE link 3 (caused by link 2): every FeedSession with status == ACTIVE on a game that gained a masked tag and whose scope contains BIOMETRIC moves ACTIVE -> SUSPENDED with halt_reason = CONSENT_WITHDRAWN (quota untouched)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, during POST /_clock/set_current_utc when record.expires_at_utc <= new clock"
        actor: system
        preconditions:
          - "record.status == ACTIVE"
          - "record.expires_at_utc <= new logical clock value"
        side_effects:
          - "terminated_at_utc = new clock; Player.active_consent_record_id = null"
          - "Player.biometric_release_state GRANTED -> EXPIRED"
          - "the same link-2 tag masking and link-3 session suspension cascade as withdrawal, with halt_reason = CONSENT_EXPIRED"
        note: "records are expired in ascending expires_at_utc order, tie-break created_at ASC"

  - entity: Game
    initial_state: "collection_status = SCHEDULED, certification_status = PENDING"
    terminal_states: [ARCHIVED]
    note: |
      Two independent dimensions on one row. collection_status is driven by league
      operations and by the venue-posture cascade; certification_status is driven by
      the tagging/QC workflow. certification_status may reach OFFICIAL only while
      collection_status == COLLECTED, but DISPUTED cycles are reachable afterwards
      while collection_status is already ARCHIVED.
    transitions:
      - from: "collection_status = SCHEDULED"
        to: "collection_status = LIVE"
        trigger: "POST /games/{id}/open-collection"
        actor: LeagueDataOps
        preconditions:
          - "game.collection_status == SCHEDULED"
          - "Venue.data_posture == CERTIFIED for game.venue_id"
        side_effects:
          - "data_quality_flag = CLEAN"
      - from: "collection_status = LIVE"
        to: "collection_status = SUSPENDED_COLLECTION"
        trigger: "system, cascade from a hosting venue leaving data_posture == CERTIFIED"
        actor: system
        preconditions:
          - "game.collection_status == LIVE"
        side_effects:
          - "data_quality_flag = DEGRADED"
          - "each FeedSession on this game with status == ACTIVE moves to SUSPENDED with halt_reason = VENUE_DEGRADED"
      - from: "collection_status = SUSPENDED_COLLECTION"
        to: "collection_status = LIVE"
        trigger: "POST /games/{id}/resume-collection"
        actor: LeagueDataOps
        preconditions:
          - "game.collection_status == SUSPENDED_COLLECTION"
          - "Venue.data_posture == CERTIFIED again for game.venue_id"
        side_effects:
          - "data_quality_flag = CLEAN"
          - "each FeedSession on this game with status == SUSPENDED and halt_reason == VENUE_DEGRADED returns to ACTIVE with halt_reason = null"
      - from: "collection_status = LIVE"
        to: "collection_status = COLLECTED"
        trigger: "POST /games/{id}/close-collection"
        actor: LeagueDataOps
        preconditions:
          - "game.collection_status == LIVE"
        side_effects:
          - "each FeedSession on this game with status == ACTIVE and delivery_mode == REALTIME moves to SUSPENDED with halt_reason = CLIENT_REQUEST"
          - "quality_index recomputed by calculations.event_tag_quality_index"
      - from: "collection_status = COLLECTED"
        to: "collection_status = ARCHIVED"
        trigger: "system, on the transition of certification_status to OFFICIAL"
        actor: system
        preconditions:
          - "game.collection_status == COLLECTED"
        side_effects: ["none beyond the status write and updated_at/version refresh"]
      - from: "certification_status = PENDING"
        to: "certification_status = PROVISIONAL"
        trigger: "system, on the first EventTag acceptance for the game"
        actor: system
        preconditions:
          - "game.certification_status == PENDING"
          - "game.accepted_tag_count becomes >= 1"
        side_effects: ["quality_index recomputed"]
      - from: "certification_status = PROVISIONAL"
        to: "certification_status = OFFICIAL"
        trigger: "POST /games/{id}/certify"
        actor: LeagueDataOps
        preconditions:
          - "game.certification_status IN {PROVISIONAL, DISPUTED}"
          - "game.collection_status IN {COLLECTED, ARCHIVED} (ARCHIVED occurs on every re-certification after the first OFFICIAL transition)"
          - "game.accepted_tag_count >= 1"
          - "game.under_correction_tag_count == 0"
          - "game.quality_index >= QUALITY_INDEX_FLOOR (0.8000)"
        side_effects:
          - "certified_at_utc = logical clock"
          - "collection_status COLLECTED -> ARCHIVED (a re-certification of an already ARCHIVED row leaves collection_status ARCHIVED)"
      - from: "certification_status = OFFICIAL"
        to: "certification_status = DISPUTED"
        trigger: "system, on creation of a CorrectionRequest against any ACCEPTED tag of the game"
        actor: system
        preconditions:
          - "game.certification_status == OFFICIAL"
        side_effects: ["none beyond the status write; the tag's own UNDER_CORRECTION move is the triggering event"]
      - from: "certification_status = DISPUTED"
        to: "certification_status = PROVISIONAL"
        trigger: "system, on APPROVED resolution of the correction that caused the dispute"
        actor: system
        preconditions:
          - "game.certification_status == DISPUTED"
          - "the resolved CorrectionRequest.status == APPROVED"
        side_effects:
          - "quality_index recomputed (approved_correction_count penalty applies); re-certification is required"
      - from: "certification_status = DISPUTED"
        to: "certification_status = OFFICIAL"
        trigger: "system, on REJECTED resolution of the correction that caused the dispute"
        actor: system
        preconditions:
          - "game.certification_status == DISPUTED"
          - "the resolved CorrectionRequest.status == REJECTED"
          - "game.under_correction_tag_count == 0 after the tag returns to ACCEPTED"
        side_effects:
          - "quality_index recomputed (rejected_correction_count carries the lighter penalty weight); certified_at_utc unchanged"

  - entity: EventTag
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cycle: ACCEPTED -> UNDER_CORRECTION -> ACCEPTED, traversable once per CorrectionRequest."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /event-tags/{id}/submit"
        actor: Statistician
        preconditions:
          - "tag.review_status == DRAFT"
          - "X-User-ID == tag.tagged_by_user_id"
        side_effects:
          - "Game.draft_tag_count -= 1, submitted_tag_count += 1; Game.version += 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /event-tags/{id}/accept"
        actor: QualityReviewer
        preconditions:
          - "tag.review_status == SUBMITTED"
          - "X-User-ID != tag.tagged_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "Game.submitted_tag_count -= 1, accepted_tag_count += 1; Game.version += 1"
          - "Game.quality_index recomputed by calculations.event_tag_quality_index"
          - "Game.certification_status PENDING -> PROVISIONAL when this is the first acceptance"
      - from: ACCEPTED
        to: UNDER_CORRECTION
        trigger: "POST /event-tags/{id}/correction-requests"
        actor: "Statistician | ClubDataOfficer"
        preconditions:
          - "tag.review_status == ACCEPTED"
          - "no CorrectionRequest with status == SUBMITTED already exists on this tag"
        side_effects:
          - "create CorrectionRequest in SUBMITTED"
          - "Game.accepted_tag_count -= 1, under_correction_tag_count += 1 (total_tag_count unchanged); Game.version += 1"
          - "Game.certification_status OFFICIAL -> DISPUTED when the game was OFFICIAL"
      - from: UNDER_CORRECTION
        to: ACCEPTED
        trigger: "system, on POST /correction-requests/{id}/approve or POST /correction-requests/{id}/reject"
        actor: system
        preconditions:
          - "tag.review_status == UNDER_CORRECTION"
        side_effects:
          - "on approve: corrected_clock_ms / player_id overwritten from the request, correction_count += 1"
          - "on reject: tag fields unchanged"
          - "Game.under_correction_tag_count -= 1, accepted_tag_count += 1; Game.quality_index recomputed; Game.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on creation of a newer EventTag with the same (game_id, tag_type, clock_ms)"
        actor: system
        preconditions:
          - "existing tag.review_status IN {DRAFT, SUBMITTED, ACCEPTED}"
        side_effects:
          - "superseded_by_tag_id = the new tag id"
          - "Game census counters move the row from its previous bucket into superseded_tag_count (total_tag_count unchanged for the superseded row)"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system, on creation of a newer EventTag with the same (game_id, tag_type, clock_ms)"
        actor: system
        preconditions:
          - "existing tag.review_status IN {DRAFT, SUBMITTED, ACCEPTED}"
        side_effects:
          - "superseded_by_tag_id = the new tag id; Game.accepted_tag_count -= 1, superseded_tag_count += 1; Game.quality_index recomputed"

  - entity: CorrectionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    note: "Branching fork with divergent side-effect sets: APPROVED rewrites the tag and forces re-certification; REJECTED restores OFFICIAL directly."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /correction-requests/{id}/approve"
        actor: QualityReviewer
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID != request.submitted_by_user_id (segregation of duties)"
          - "when reason_code == WRONG_PLAYER, proposed_player_id's Player.club_id IN {game.home_club_id, game.away_club_id}"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; resolved_at_utc = logical clock"
          - "EventTag UNDER_CORRECTION -> ACCEPTED with corrected values applied and correction_count += 1"
          - "Game.approved_correction_count += 1; census counters restored; quality_index recomputed"
          - "Game.certification_status DISPUTED -> PROVISIONAL (re-certification required)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /correction-requests/{id}/reject"
        actor: QualityReviewer
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID != request.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; resolved_at_utc = logical clock"
          - "EventTag UNDER_CORRECTION -> ACCEPTED with all fields unchanged and correction_count unchanged"
          - "Game.rejected_correction_count += 1; census counters restored; quality_index recomputed with the lighter REJECTED weight"
          - "Game.certification_status DISPUTED -> OFFICIAL (certified_at_utc preserved, no re-certification needed)"

  - entity: RightsWindow
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rights-windows/{id}/revoke"
        actor: LeagueDataOps
        preconditions:
          - "window.status == ACTIVE"
        side_effects:
          - "revoked_at_utc = logical clock"
          - "CASCADE link 1: every FeedSession under this window with status IN {ACTIVE, SUSPENDED} is settled by the METERED_ACTUAL variant and moved to TERMINATED with halt_reason = CLIENT_REQUEST"
          - "CASCADE link 2 (caused by link 1): each settled session releases its unconsumed reservation - DataLicensee.reserved_units -= session.reserved_units, consumed_units += session.metered_units, available_units += session.refunded_units, settled_charge_cents += session.settled_charge_cents"
          - "Game.allocated_minutes_total (or league_reserve_allocated_minutes for LEAGUE_ARCHIVE) decreases by window.allocated_minutes and remaining_allocatable_minutes increases by the same amount"

  - entity: FeedSession
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE via the venue-degradation / resume pair."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, cascade from venue degradation, consent loss, or the third SLA breach on this session"
        actor: system
        preconditions:
          - "session.status == ACTIVE"
        side_effects:
          - "halt_reason set to VENUE_DEGRADED, CONSENT_WITHDRAWN, CONSENT_EXPIRED or SLA_BREACH_THRESHOLD depending on the cause"
          - "reservation untouched: DataLicensee.reserved_units and available_units unchanged"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /games/{id}/resume-collection (cascade)"
        actor: system
        preconditions:
          - "session.status == SUSPENDED"
          - "session.halt_reason == VENUE_DEGRADED"
        side_effects:
          - "halt_reason = null"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /feed-sessions/{id}/terminate"
        actor: Licensee
        preconditions:
          - "session.status IN {ACTIVE, SUSPENDED}"
          - "X-User-ID == session.licensee_id"
        side_effects:
          - "metered_units and settled_charge_cents written by the METERED_ACTUAL variant of calculations.feed_session_billing"
          - "refunded_units = reserved_units - ceil(metered_units)"
          - "DataLicensee.reserved_units -= reserved_units; consumed_units += ceil(metered_units); available_units += refunded_units; settled_charge_cents += session.settled_charge_cents"
          - "halt_reason = CLIENT_REQUEST; RightsWindow.active_feed_session_count -= 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /feed-sessions/{id}/terminate"
        actor: Licensee
        preconditions:
          - "session.status IN {ACTIVE, SUSPENDED}"
          - "X-User-ID == session.licensee_id"
        side_effects:
          - "identical settlement and quota release as the ACTIVE -> TERMINATED transition; halt_reason overwritten with CLIENT_REQUEST"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: event-tag-create-stale-game
    parent_entity: Game
    write_endpoint: "POST /event-tags"
    occ_field: "expected_game_version"
    description: |
      Creating an EventTag against a Game whose version has advanced since the
      client last observed it is rejected with a stale-version error. The rule is
      needed because a tag created on the (game_id, tag_type, clock_ms) key
      legitimately supersedes any earlier tag on that key, so a second create
      carrying an outdated view of the game would silently retire another
      statistician's freshly accepted tag instead of failing. The check compares
      expected_game_version against Game.version at request time.
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: calibration_accuracy_evaluation
    trigger: "POST /installations/{id}/calibration-runs, before the installation status transition"
    algorithm: threshold
    formula: |
      composite_rms_mm = round_half_up(sqrt((axis_rms_x_mm^2 + axis_rms_y_mm^2 + axis_rms_z_mm^2) / 3), 2)

      # Gate first, then the two thresholds, evaluated in this exact order:
      if sample_count < MIN_SAMPLE_COUNT or reference_point_count < MIN_REFERENCE_POINTS:
          result = INVALID
      elif composite_rms_mm <= PASS_THRESHOLD_MM:          # inclusive: exactly 90.00 passes
          result = PASS
      elif composite_rms_mm <= PROVISIONAL_CEILING_MM:     # inclusive
          result = PROVISIONAL
      else:
          result = FAIL
    input_set: "the three axis errors, sample_count and reference_point_count of the run being recorded; no prior runs participate"
    constants:
      MIN_SAMPLE_COUNT: 5000
      MIN_REFERENCE_POINTS: 12
      PASS_THRESHOLD_MM: 90.00
      PROVISIONAL_CEILING_MM: 140.00
      CERT_VALIDITY_HOURS: 72
    precision: "composite_rms_mm to 2 decimal places, round_half_up; the rounded value is what the thresholds compare against"
    variants: []

  - name: venue_data_posture
    trigger: "every TrackingInstallation status change (calibration run recorded, PASS auto-validate, certify, flag-drift, retire)"
    algorithm: aggregation
    formula: |
      certified_count      = count(installations of venue with status == CERTIFIED)
      recalibrating_count  = count(installations of venue with status IN {CALIBRATING, RECALIBRATION_REQUIRED})
      uncertified_count    = count(installations of venue with status IN {DEPLOYED, VALIDATED})
      retired_count        = count(installations of venue with status == RETIRED)
      active_count         = certified_count + recalibrating_count + uncertified_count

      if certified_count == 0:
          data_posture = UNCERTIFIED
      elif certified_count >= venue.required_certified_installations and recalibrating_count == 0:
          data_posture = CERTIFIED
      else:
          data_posture = RESTRICTED
    input_set: "all TrackingInstallation rows whose venue_id is this venue, partitioned by status; RETIRED rows are excluded from active_count and from every gating count"
    constants: {}
    precision: "integer counts; census invariant certified_count + recalibrating_count + uncertified_count == active_installation_count must hold after every recompute"
    variants: []

  - name: event_tag_quality_index
    trigger: "EventTag acceptance, supersession, CorrectionRequest creation and resolution, and POST /games/{id}/close-collection"
    algorithm: weighted_scoring
    formula: |
      scored_tags = EventTag rows of the game with review_status IN {ACCEPTED, UNDER_CORRECTION}

      # Empty-set short circuit: a game with nothing to score scores nothing.
      if count(scored_tags) == 0:
          quality_index = 0.0000            # early return, no weighting applied
      mean_confidence = sum(tag.confidence for tag in scored_tags) / count(scored_tags)

      correction_penalty = min(1.0,
          (game.approved_correction_count * APPROVED_WEIGHT
           + game.rejected_correction_count * REJECTED_WEIGHT)
          / max(1, game.accepted_tag_count))

      completeness = min(1.0, game.accepted_tag_count / EXPECTED_TAGS_PER_GAME)

      quality_index = round_half_up(
            W_CONFIDENCE * mean_confidence
          + W_CORRECTION * (1 - correction_penalty)
          + W_COMPLETENESS * completeness, 4)
    input_set: "ACCEPTED and UNDER_CORRECTION tags of one game for the confidence mean; SUPERSEDED and DRAFT/SUBMITTED tags are excluded; the correction counters count resolved requests only"
    constants:
      W_CONFIDENCE: 0.5
      W_CORRECTION: 0.3
      W_COMPLETENESS: 0.2
      APPROVED_WEIGHT: 1.0
      REJECTED_WEIGHT: 0.25
      EXPECTED_TAGS_PER_GAME: 4
      QUALITY_INDEX_FLOOR: 0.8000
    precision: "4 decimal places, round_half_up; the certify gate compares quality_index >= QUALITY_INDEX_FLOOR inclusively"
    variants: []

  - name: rights_allocation_ledger
    trigger: "POST /games/{id}/rights-windows (before persisting) and POST /rights-windows/{id}/revoke"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency pinned by evaluation order: the league reserve
      # is a share of the GROSS licensable_minutes, never of the net pool it creates.
      # Step 1 (gross basis, evaluated first):
      league_reserve_minutes = ceil(game.licensable_minutes * LEAGUE_RESERVE_PCT)
      # Step 2:
      net_allocatable_minutes = game.licensable_minutes - league_reserve_minutes
      # Step 3: two disjoint pools, each drawn in creation order (created_at ASC):
      #   pool A (reserve pool)  <- windows with rights_class == LEAGUE_ARCHIVE
      #   pool B (net pool)      <- windows with rights_class IN {BROADCAST_LIVE,
      #                             IN_VENUE_DISPLAY, COMMERCIAL_LICENSE}
      allocated_minutes(window) = ceil((window_end_utc - window_start_utc) seconds / 60)
      league_reserve_allocated_minutes = sum(allocated_minutes of ACTIVE LEAGUE_ARCHIVE windows)
      allocated_minutes_total          = sum(allocated_minutes of ACTIVE non-LEAGUE_ARCHIVE windows)
      remaining_allocatable_minutes    = net_allocatable_minutes - allocated_minutes_total

      # Step 4 admission test for a candidate window w:
      if w.rights_class == LEAGUE_ARCHIVE:
          admit iff allocated_minutes(w) <= league_reserve_minutes - league_reserve_allocated_minutes
      else:
          admit iff allocated_minutes(w) <= remaining_allocatable_minutes
      # Revocation returns allocated_minutes(w) to the pool the window drew from.
    input_set: "RightsWindow rows of one game with status == ACTIVE, partitioned by rights_class into the reserve pool and the net pool; REVOKED windows contribute nothing"
    constants:
      LEAGUE_RESERVE_PCT: 0.15
      BROADCAST_BUFFER_SECONDS: 300
    precision: "integer minutes; every duration is rounded up with ceil before it enters a pool, and the ceil is applied per window, never to a sum of windows"
    variants: []

  - name: feed_session_billing
    trigger: "POST /feed-sessions (RESERVED_FORWARD) and POST /feed-sessions/{id}/terminate or the revoke cascade (METERED_ACTUAL)"
    algorithm: tiered_pricing
    formula: |
      duration_minutes  = (window_end_utc - window_start_utc) in seconds / 60      # exact, unrounded
      latency_multiplier = 1.50 if requested_latency_ms <= ULTRA_LOW_LATENCY_MS
                           else 1.20 if requested_latency_ms <= LOW_LATENCY_MS
                           else 1.00
      tier_rate_cents = TIER_RATE_CENTS_PER_UNIT[licensee.tier]

      # RESERVED_FORWARD (at creation): one ceil over the whole booked window
      reserved_units        = ceil(bandwidth_mbps * duration_minutes * latency_multiplier)
      reserved_charge_cents = round_half_up(reserved_units * tier_rate_cents)

      # METERED_ACTUAL (at settlement): per-record ceil, then sum, replaying the
      # session's usage records in sampled_at_utc ASC, created_at ASC order
      for record in usage_records ordered by (sampled_at_utc ASC, created_at ASC):
          record.units_charged = ceil(record.bandwidth_mbps * record.duration_seconds / 60
                                      * session.latency_multiplier)
      metered_units        = sum(record.units_charged)
      settled_charge_cents = round_half_up(metered_units * tier_rate_cents)
      refunded_units       = reserved_units - metered_units        # never negative: see validations priority 82
    input_set: "RESERVED_FORWARD reads only the booked window on the session row; METERED_ACTUAL reads every LicenseUsageRecord of the session (there is no status filter on usage records - they are immutable) and ignores the booked window"
    constants:
      ULTRA_LOW_LATENCY_MS: 250
      LOW_LATENCY_MS: 1000
      TIER_RATE_CENTS_PER_UNIT: { BRONZE: 40, SILVER: 30, GOLD: 22 }
      TIER_ALLOWED_SCOPES: { BRONZE: [POSITIONAL], SILVER: [POSITIONAL, EVENT], GOLD: [POSITIONAL, EVENT, BIOMETRIC] }
      SLA_CREDIT_PCT: 0.25
      SLA_BREACH_SUSPEND_THRESHOLD: 3
    precision: "units are integers produced by ceil; charges are integer cents produced by round_half_up. The ceil granularity differs by variant: once per window for RESERVED_FORWARD, once per usage record for METERED_ACTUAL"
    variants:
      - name: RESERVED_FORWARD
        when: "at POST /feed-sessions, when no usage has been reported yet"
        difference: "prices the entire booked window as if fully consumed, with a single ceil over bandwidth * duration_minutes * latency_multiplier; the result is held as reserved_units against the licensee's available_units"
      - name: METERED_ACTUAL
        when: "at POST /feed-sessions/{id}/terminate and inside the rights-window revoke cascade"
        difference: "prices only reported usage records, ceiling each record independently before summing, so identical total wall-clock coverage yields a different unit count than RESERVED_FORWARD; the difference is refunded to available_units"

  - name: normalized_tracking_metric
    trigger: "POST /games/{id}/normalization-runs"
    algorithm: constraint_propagation
    formula: |
      scale = GENERATION_SCALE[game.tracking_generation]

      # RAW_GENERATION basis: round every segment after scaling, then add the
      # rounded segments (round-then-sum).
      if basis == RAW_GENERATION:
          drift_correction_pct = 0.0
          normalized_value = round_half_up(
              sum(round_half_up(segment * scale, 2) for segment in segment_values), 2)

      # CANONICAL_SEASON basis: add at full precision, scale once, then apply the
      # season drift correction, then round once (sum-then-round).
      else:
          drift_correction_pct = CANONICAL_DRIFT_PCT[game.tracking_generation]
          normalized_value = round_half_up(
              sum(segment_values) * scale * (1 + drift_correction_pct / 100), 2)
    input_set: "the segment_values array supplied on the request, in the supplied order, plus the game's tracking_generation; no other game data participates and empty arrays are rejected by validations priority 70"
    constants:
      GENERATION_SCALE: { G1: 1.042, G2: 1.017, G3: 1.000 }
      CANONICAL_DRIFT_PCT: { G1: -0.6, G2: -0.2, G3: 0.0 }
      MAPPING_VERSION: "MAP-2026.1"
    precision: "2 decimal places, round_half_up. The rounding ORDER is the whole point: RAW_GENERATION rounds per segment then sums; CANONICAL_SEASON sums at full precision and rounds exactly once at the end"
    variants:
      - name: RAW_GENERATION
        when: "basis == RAW_GENERATION - reproduces the value as the generation's own pipeline published it"
        difference: "per-segment rounding accumulates upward bias and no season drift correction is applied"
      - name: CANONICAL_SEASON
        when: "basis == CANONICAL_SEASON - the cross-season comparable value"
        difference: "single terminal rounding plus the generation's drift correction, so the same segments yield a strictly different number than RAW_GENERATION for G1 and G2 data"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "every path-parameter resource exists, validated left to right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_INSTALLATION_NOT_FOUND | ERR_CLUB_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_CONSENT_RECORD_NOT_FOUND | ERR_GAME_NOT_FOUND | ERR_EVENT_TAG_NOT_FOUND | ERR_CORRECTION_REQUEST_NOT_FOUND | ERR_RIGHTS_WINDOW_NOT_FOUND | ERR_LICENSEE_NOT_FOUND | ERR_FEED_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 15
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, types correct, enum members valid, arrays non-empty where declared (allowed_scopes and scope), numeric ranges honored, no unknown fields. NormalizationRun.segment_values is the one deliberate exception: an empty array passes this schema check and is refused later, by priority 70, so that the domain-specific error survives"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST endpoint"

  - priority: 20
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (venue_id, home_club_id, away_club_id, club_id, game_id, player_id, rights_window_id, holder_id, proposed_player_id)"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_CLUB_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_GAME_NOT_FOUND | ERR_RIGHTS_WINDOW_NOT_FOUND | ERR_LICENSEE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /installations, POST /players, POST /games, POST /event-tags, POST /games/{id}/rights-windows, POST /feed-sessions, POST /event-tags/{id}/correction-requests"

  - priority: 25
    category: auth
    check: "resource ownership: a ClubDataOfficer's X-User-ID equals the Club.id owning the addressed player (consent endpoints) or one of the game's two club ids (correction requests); a Licensee's X-User-ID equals FeedSession.licensee_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /players/{id}/consent-records, POST /consent-records/{id}/withdraw, POST /event-tags/{id}/correction-requests (ClubDataOfficer), POST /feed-sessions/{id}/usage-records, POST /feed-sessions/{id}/terminate"

  - priority: 30
    category: auth
    check: "segregation of duties: the acting X-User-ID differs from the counterparty id recorded on the resource (installation.latest_run_engineer_user_id on certify, tag.tagged_by_user_id on accept, request.submitted_by_user_id on correction approve/reject)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /installations/{id}/certify, POST /event-tags/{id}/accept, POST /correction-requests/{id}/approve, POST /correction-requests/{id}/reject"

  - priority: 35
    category: state
    check: "expected_game_version equals Game.version at request time"
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412
    applies_to: "POST /event-tags"

  - priority: 39
    category: business_safety
    check: "certification requires installation.latest_run_result == PASS. Deliberately ordered BEFORE the installation-state gate at priority 40: the accuracy claim is the thing being certified, so a rig with no passing run is refused on accuracy grounds even when its lifecycle state would also be wrong"
    error_id: ERR_CALIBRATION_NOT_PASSING
    http_status: 409
    applies_to: "POST /installations/{id}/certify"

  - priority: 40
    category: state
    check: "installation.status is in the transition's allowed from-set (record run: {DEPLOYED, CALIBRATING, RECALIBRATION_REQUIRED}; certify: {VALIDATED}; flag-drift: {CERTIFIED}; retire: {CERTIFIED, RECALIBRATION_REQUIRED})"
    error_id: ERR_INVALID_INSTALLATION_STATE
    http_status: 409
    applies_to: "POST /installations/{id}/calibration-runs, POST /installations/{id}/certify, POST /installations/{id}/flag-drift, POST /installations/{id}/retire"

  - priority: 41
    category: state
    check: "game.collection_status == LIVE for event tagging and for REALTIME feed sessions"
    error_id: ERR_GAME_NOT_COLLECTING
    http_status: 409
    applies_to: "POST /event-tags, POST /feed-sessions (delivery_mode == REALTIME)"

  - priority: 42
    category: state
    check: "game.collection_status IN {COLLECTED, ARCHIVED} for POST_GAME feed sessions, for normalization runs and for certification. ARCHIVED is accepted on certify on purpose: the first OFFICIAL transition archives the game, so the DISPUTED -> PROVISIONAL -> OFFICIAL re-certification cycle always runs against an ARCHIVED row, and an already-OFFICIAL game must reach the priority-44 gate instead of being deflected here"
    error_id: ERR_GAME_NOT_COLLECTED
    http_status: 409
    applies_to: "POST /feed-sessions (delivery_mode == POST_GAME), POST /games/{id}/normalization-runs, POST /games/{id}/certify"

  - priority: 43
    category: state
    check: "game.collection_status == SCHEDULED for open-collection and == SUSPENDED_COLLECTION for resume-collection and == LIVE for close-collection"
    error_id: ERR_INVALID_GAME_COLLECTION_STATE
    http_status: 409
    applies_to: "POST /games/{id}/open-collection, POST /games/{id}/resume-collection, POST /games/{id}/close-collection"

  - priority: 44
    category: state
    check: "game.certification_status != OFFICIAL (an already certified game cannot be certified twice; a still-PENDING game is rejected later, by the accepted-tags gate at priority 68)"
    error_id: ERR_GAME_ALREADY_OFFICIAL
    http_status: 409
    applies_to: "POST /games/{id}/certify"

  - priority: 45
    category: state
    check: "tag.review_status is in the transition's allowed from-set (submit: DRAFT; accept: SUBMITTED; correction request: ACCEPTED)"
    error_id: ERR_INVALID_TAG_STATE
    http_status: 409
    applies_to: "POST /event-tags/{id}/submit, POST /event-tags/{id}/accept, POST /event-tags/{id}/correction-requests"

  - priority: 46
    category: state
    check: "correction request status == SUBMITTED"
    error_id: ERR_CORRECTION_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /correction-requests/{id}/approve, POST /correction-requests/{id}/reject"

  - priority: 47
    category: state
    check: "consent record status == PENDING for ratify and == ACTIVE for withdraw"
    error_id: ERR_INVALID_CONSENT_STATE
    http_status: 409
    applies_to: "POST /consent-records/{id}/ratify, POST /consent-records/{id}/withdraw"

  - priority: 48
    category: state
    check: "rights_window.status == ACTIVE"
    error_id: ERR_RIGHTS_WINDOW_REVOKED
    http_status: 409
    applies_to: "POST /feed-sessions, POST /rights-windows/{id}/revoke"

  - priority: 49
    category: state
    check: "feed_session.status == ACTIVE for usage reporting and IN {ACTIVE, SUSPENDED} for termination"
    error_id: ERR_SESSION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /feed-sessions/{id}/usage-records, POST /feed-sessions/{id}/terminate"

  - priority: 50
    category: business_safety
    check: "Venue.data_posture == CERTIFIED for the game's venue"
    error_id: ERR_VENUE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /games/{id}/open-collection, POST /games/{id}/resume-collection"

  - priority: 51
    category: business_safety
    check: "a tag carrying biometric_payload_present == true requires the attributed Player.biometric_release_state == GRANTED"
    error_id: ERR_BIOMETRIC_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /event-tags"

  - priority: 52
    category: business_safety
    check: 'consent record cba_agreement_version equals CBA_CURRENT_VERSION, whose fixed value is "CBA-2026A"'
    error_id: ERR_CBA_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /players/{id}/consent-records, POST /consent-records/{id}/ratify"

  - priority: 53
    category: business_safety
    check: "a session whose scope contains BIOMETRIC requires licensee.biometric_entitled == true"
    error_id: ERR_BIOMETRIC_SCOPE_NOT_LICENSED
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 55
    category: business_temporal
    check: "consent effective_from_utc < expires_at_utc and expires_at_utc > logical clock"
    error_id: ERR_CONSENT_EXPIRY_IN_PAST
    http_status: 422
    applies_to: "POST /players/{id}/consent-records, POST /consent-records/{id}/ratify"

  - priority: 56
    category: business_temporal
    check: "window_end_utc is strictly after window_start_utc"
    error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    applies_to: "POST /games/{id}/rights-windows, POST /feed-sessions"

  - priority: 57
    category: business_temporal
    check: "logical clock minus installation.latest_run_recorded_at_utc <= CERT_VALIDITY_HOURS (72h)"
    error_id: ERR_CALIBRATION_EXPIRED
    http_status: 422
    applies_to: "POST /installations/{id}/certify"

  - priority: 58
    category: business_temporal
    check: "the session occupation [window_start_utc, window_end_utc) is contained in the rights window's closed interval [window_start_utc, window_end_utc]"
    error_id: ERR_SESSION_WINDOW_OUTSIDE_RIGHTS
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 60
    category: business_constraint
    check: "no ACTIVE RightsWindow on the same game with the same rights_class and a colliding territory (equal codes, or either side GLOBAL) intersects the candidate window. Intervals are CLOSED, so touching endpoints collide; for rights_class == BROADCAST_LIVE both intervals are first expanded by BROADCAST_BUFFER_SECONDS (300) on each side"
    error_id: ERR_RIGHTS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /games/{id}/rights-windows"

  - priority: 61
    category: business_constraint
    check: "the player has no other ConsentRecord with status IN {PENDING, ACTIVE} for the same scope"
    error_id: ERR_CONSENT_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /players/{id}/consent-records"

  - priority: 62
    category: business_constraint
    check: "every requested scope member is in TIER_ALLOWED_SCOPES[licensee.tier]"
    error_id: ERR_SCOPE_NOT_IN_TIER
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 63
    category: business_constraint
    check: "every requested scope member is in rights_window.allowed_scopes"
    error_id: ERR_SCOPE_NOT_IN_RIGHTS_WINDOW
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 64
    category: business_constraint
    check: "requested_latency_ms >= Venue.min_achievable_latency_ms of the game's venue (equality is allowed)"
    error_id: ERR_LATENCY_BELOW_VENUE_FLOOR
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 65
    category: business_constraint
    check: "requested_latency_ms <= rights_window.max_latency_ms (equality is allowed)"
    error_id: ERR_LATENCY_SLA_UNSATISFIABLE
    http_status: 422
    applies_to: "POST /feed-sessions"

  - priority: 66
    category: business_constraint
    check: "aggregate venue transport: at every instant inside the candidate half-open interval [window_start_utc, window_end_utc), the sum of bandwidth_mbps over FeedSessions with status IN {ACTIVE, SUSPENDED} on games at the same venue, plus the candidate's own bandwidth_mbps, must be <= Venue.transport_capacity_mbps. Adjacent sessions (one ending exactly when the next starts) do not overlap"
    error_id: ERR_VENUE_TRANSPORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /feed-sessions"

  - priority: 67
    category: business_constraint
    check: "game.under_correction_tag_count == 0"
    error_id: ERR_OPEN_CORRECTIONS
    http_status: 409
    applies_to: "POST /games/{id}/certify"

  - priority: 68
    category: business_constraint
    check: "game.accepted_tag_count >= 1 (an empty accepted set cannot be certified)"
    error_id: ERR_NO_ACCEPTED_TAGS
    http_status: 422
    applies_to: "POST /games/{id}/certify"

  - priority: 69
    category: business_constraint
    check: "game.quality_index >= QUALITY_INDEX_FLOOR (0.8000, inclusive)"
    error_id: ERR_QUALITY_INDEX_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /games/{id}/certify"

  - priority: 70
    category: business_constraint
    check: "segment_values is a non-empty array"
    error_id: ERR_NORMALIZATION_SEGMENTS_EMPTY
    http_status: 422
    applies_to: "POST /games/{id}/normalization-runs"

  - priority: 75
    category: business_referential
    check: "rights_window.game_id equals the session's game_id"
    error_id: ERR_RIGHTS_WINDOW_GAME_MISMATCH
    http_status: 409
    applies_to: "POST /feed-sessions"

  - priority: 76
    category: business_referential
    check: "the tagged player's Player.club_id is one of {game.home_club_id, game.away_club_id}; the same check applies to a correction's proposed_player_id"
    error_id: ERR_PLAYER_NOT_IN_GAME
    http_status: 409
    applies_to: "POST /event-tags, POST /correction-requests/{id}/approve"

  - priority: 77
    category: business_referential
    check: "holder_id resolution matches holder_type: LEAGUE requires holder_id omitted; CLUB requires a Club.id equal to the game's home_club_id or away_club_id; LICENSEE requires an existing DataLicensee.id"
    error_id: ERR_RIGHTS_HOLDER_MISMATCH
    http_status: 409
    applies_to: "POST /games/{id}/rights-windows"

  - priority: 80
    category: business_fiscal
    check: "the candidate window's allocated_minutes fits in its pool per calculations.rights_allocation_ledger step 4 (equality is allowed)"
    error_id: ERR_ALLOCATION_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /games/{id}/rights-windows"

  - priority: 81
    category: business_fiscal
    check: "reserved_units from the RESERVED_FORWARD variant <= licensee.available_units (equality is allowed)"
    error_id: ERR_LICENSEE_QUOTA_EXHAUSTED
    http_status: 402
    applies_to: "POST /feed-sessions"

  - priority: 82
    category: business_fiscal
    check: "session.metered_units + the new record's units_charged <= session.reserved_units (equality is allowed)"
    error_id: ERR_SESSION_RESERVATION_EXCEEDED
    http_status: 402
    applies_to: "POST /feed-sessions/{id}/usage-records"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- venues & installations -------------------------------------------------
  - method: POST
    path: "/venues"
    description: "register a venue with its certification requirement, transport capacity and latency floor"
    roles: [LeagueDataOps]
    code: 201
    input: [name, city, tracking_tech, required_certified_installations, transport_capacity_mbps, min_achievable_latency_ms]
    output: Venue
    side_effects: ["data_posture initialised to UNCERTIFIED; all census counters 0"]

  - method: GET
    path: "/venues/{id}"
    description: "read one venue including its derived data_posture and installation census"
    roles: [LeagueDataOps, CalibrationEngineer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{id}/installations"
    description: "list the installations of a venue (reverse lookup for TrackingInstallation.venue_id)"
    roles: [LeagueDataOps, CalibrationEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TrackingInstallation[]
    side_effects: []

  - method: POST
    path: "/installations"
    description: "deploy a tracking rig at a venue"
    roles: [LeagueDataOps]
    code: 201
    input: [venue_id, rig_label, modality]
    output: TrackingInstallation
    side_effects: ["Venue.active_installation_count += 1 and uncertified_installation_count += 1; Venue.data_posture recomputed"]

  - method: GET
    path: "/installations/{id}"
    description: "read one installation with its latest-run mirror fields"
    roles: [LeagueDataOps, CalibrationEngineer]
    code: 200
    input: []
    output: TrackingInstallation
    side_effects: []

  - method: POST
    path: "/installations/{id}/calibration-runs"
    description: "record an accuracy-validation run against a rig"
    roles: [CalibrationEngineer]
    code: 201
    input: [axis_rms_x_mm, axis_rms_y_mm, axis_rms_z_mm, sample_count, reference_point_count]
    output: CalibrationRun
    side_effects:
      - "run.composite_rms_mm and run.result computed by calculations.calibration_accuracy_evaluation"
      - "installation -> CALIBRATING, then -> VALIDATED when result == PASS"
      - "installation latest_run_* mirrors and calibration_run_count refreshed"
      - "Venue census counters and data_posture recomputed by calculations.venue_data_posture"

  - method: GET
    path: "/installations/{id}/calibration-runs"
    description: "list the calibration runs of a rig, newest first (reverse lookup for CalibrationRun.installation_id)"
    roles: [LeagueDataOps, CalibrationEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: CalibrationRun[]
    side_effects: []

  - method: POST
    path: "/installations/{id}/certify"
    description: "certify a validated rig; the certifying operator must not be the engineer who recorded the passing run"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: TrackingInstallation
    side_effects:
      - "installation VALIDATED -> CERTIFIED; certified_at_utc and certified_by_user_id stamped"
      - "Venue certified/uncertified counters and data_posture recomputed"

  - method: POST
    path: "/installations/{id}/flag-drift"
    description: "flag measured drift on a certified rig, forcing recalibration"
    roles: [CalibrationEngineer]
    code: 200
    input: []
    output: TrackingInstallation
    side_effects:
      - "installation CERTIFIED -> RECALIBRATION_REQUIRED; drift_flag_count += 1"
      - "cascade: Venue.data_posture leaves CERTIFIED -> LIVE games at the venue SUSPENDED_COLLECTION + DEGRADED -> their ACTIVE FeedSessions SUSPENDED with halt_reason VENUE_DEGRADED"

  - method: POST
    path: "/installations/{id}/retire"
    description: "retire a rig permanently"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: TrackingInstallation
    side_effects:
      - "installation -> RETIRED; Venue active/retired counters and data_posture recomputed"
      - "same LIVE-game / ACTIVE-session cascade as flag-drift when the posture leaves CERTIFIED"

  # --- clubs, players, consent -----------------------------------------------
  - method: POST
    path: "/clubs"
    description: "register a club"
    roles: [LeagueDataOps]
    code: 201
    input: [name, market_code]
    output: Club
    side_effects: []

  - method: GET
    path: "/clubs/{id}"
    description: "read one club"
    roles: [LeagueDataOps, ClubDataOfficer]
    code: 200
    input: []
    output: Club
    side_effects: []

  - method: POST
    path: "/players"
    description: "register a player on a club roster"
    roles: [LeagueDataOps, ClubDataOfficer]
    code: 201
    input: [club_id, full_name, jersey_number]
    output: Player
    side_effects: ["Club.roster_size += 1; biometric_release_state initialised to NONE"]

  - method: GET
    path: "/players/{id}"
    description: "read one player including biometric_release_state"
    roles: [LeagueDataOps, ClubDataOfficer, Statistician, QualityReviewer]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "list players, optionally filtered by club (reverse lookup for Player.club_id)"
    roles: [LeagueDataOps, ClubDataOfficer, Statistician, QualityReviewer]
    code: 200
    input: ["club_id?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/players/{id}/consent-records"
    description: "file a biometric or positional consent record for a player under the current CBA"
    roles: [ClubDataOfficer]
    code: 201
    input: [scope, cba_agreement_version, effective_from_utc, expires_at_utc]
    output: ConsentRecord
    side_effects: ["record created in PENDING with submitted_by_club_id = X-User-ID"]

  - method: GET
    path: "/players/{id}/consent-records"
    description: "list a player's consent records (reverse lookup for ConsentRecord.player_id)"
    roles: [LeagueDataOps, ClubDataOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []

  - method: POST
    path: "/consent-records/{id}/ratify"
    description: "league ratification of a filed consent record against the current CBA version"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["record PENDING -> ACTIVE; Player.active_consent_record_id set; Player.biometric_release_state -> GRANTED for BIOMETRIC_TRACKING scope"]

  - method: POST
    path: "/consent-records/{id}/withdraw"
    description: "club withdrawal of an active consent record"
    roles: [ClubDataOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects:
      - "record ACTIVE -> WITHDRAWN; Player.biometric_release_state -> WITHDRAWN"
      - "cascade: the player's biometric-bearing tags get biometric_masked = true -> ACTIVE BIOMETRIC-scope FeedSessions on the affected games SUSPENDED with halt_reason CONSENT_WITHDRAWN"

  # --- games ------------------------------------------------------------------
  - method: POST
    path: "/games"
    description: "schedule a game at a venue between two clubs, fixing its tracking generation and licensable minutes"
    roles: [LeagueDataOps]
    code: 201
    input: [venue_id, home_club_id, away_club_id, scheduled_start_utc, tracking_generation, licensable_minutes]
    output: Game
    side_effects: ["collection_status SCHEDULED, certification_status PENDING; league_reserve_minutes / net_allocatable_minutes / remaining_allocatable_minutes seeded by calculations.rights_allocation_ledger steps 1-2"]

  - method: GET
    path: "/games/{id}"
    description: "read one game with both state dimensions, the tag census, quality_index and the allocation ledger"
    roles: [LeagueDataOps, Statistician, QualityReviewer, ClubDataOfficer, Licensee]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/games"
    description: "list games with filters (reverse lookup for Game.venue_id, Game.home_club_id and Game.away_club_id)"
    roles: [LeagueDataOps, Statistician, QualityReviewer, ClubDataOfficer, Licensee]
    code: 200
    input: ["venue_id?", "home_club_id?", "away_club_id?", "collection_status?", "limit?", "offset?"]
    output: Game[]
    side_effects: []

  - method: POST
    path: "/games/{id}/open-collection"
    description: "open live tracking collection for a game; requires a CERTIFIED venue posture"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: Game
    side_effects: ["collection_status SCHEDULED -> LIVE; data_quality_flag CLEAN; Game.version += 1"]

  - method: POST
    path: "/games/{id}/close-collection"
    description: "close live collection and hand the game to the post-game pipeline"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: Game
    side_effects:
      - "collection_status LIVE -> COLLECTED; Game.version += 1"
      - "ACTIVE REALTIME FeedSessions on the game move to SUSPENDED with halt_reason CLIENT_REQUEST"
      - "quality_index recomputed"

  - method: POST
    path: "/games/{id}/resume-collection"
    description: "resume a game whose collection was suspended by a venue degradation, once the venue is CERTIFIED again"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: Game
    side_effects:
      - "collection_status SUSPENDED_COLLECTION -> LIVE; data_quality_flag CLEAN; Game.version += 1"
      - "FeedSessions SUSPENDED with halt_reason VENUE_DEGRADED return to ACTIVE with halt_reason null"

  - method: POST
    path: "/games/{id}/certify"
    description: "certify the game's statistical record as OFFICIAL"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: Game
    side_effects:
      - "certification_status PROVISIONAL|DISPUTED -> OFFICIAL; certified_at_utc stamped"
      - "collection_status COLLECTED -> ARCHIVED; Game.version += 1"

  # --- event tagging & corrections -------------------------------------------
  - method: POST
    path: "/event-tags"
    description: "create an event tag on a live game; a tag on an existing (game_id, tag_type, clock_ms) key supersedes the previous one, which is why the call is guarded by expected_game_version"
    roles: [Statistician]
    code: 201
    input: [game_id, player_id, tag_type, clock_ms, confidence, "biometric_payload_present?", expected_game_version]
    output: EventTag
    side_effects:
      - "increments Game.version by 1"
      - "Game.total_tag_count += 1, draft_tag_count += 1"
      - "any existing non-SUPERSEDED tag on the same (game_id, tag_type, clock_ms) key moves to SUPERSEDED with superseded_by_tag_id set and the game census rebalanced"
      - "game_version_at_tag stamped with Game.version after the increment"

  - method: GET
    path: "/event-tags/{id}"
    description: "read one event tag"
    roles: [LeagueDataOps, Statistician, QualityReviewer, ClubDataOfficer]
    code: 200
    input: []
    output: EventTag
    side_effects: []

  - method: GET
    path: "/event-tags"
    description: "list event tags with filters (reverse lookup for EventTag.game_id and EventTag.player_id)"
    roles: [LeagueDataOps, Statistician, QualityReviewer, ClubDataOfficer]
    code: 200
    input: ["game_id?", "player_id?", "review_status?", "limit?", "offset?"]
    output: EventTag[]
    side_effects: []

  - method: POST
    path: "/event-tags/{id}/submit"
    description: "submit a draft tag for quality review; only the tagging statistician may submit"
    roles: [Statistician]
    code: 200
    input: []
    output: EventTag
    side_effects: ["tag DRAFT -> SUBMITTED; Game census counters and Game.version updated"]

  - method: POST
    path: "/event-tags/{id}/accept"
    description: "accept a submitted tag; the reviewer must not be the tagger"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: EventTag
    side_effects:
      - "tag SUBMITTED -> ACCEPTED; reviewed_by_user_id stamped"
      - "Game census counters, quality_index and Game.version updated; certification_status PENDING -> PROVISIONAL on the first acceptance"

  - method: POST
    path: "/event-tags/{id}/correction-requests"
    description: "open a correction procedure against an accepted tag"
    roles: [Statistician, ClubDataOfficer]
    code: 201
    input: [reason_code, "proposed_clock_ms?", "proposed_player_id?"]
    output: CorrectionRequest
    side_effects:
      - "tag ACCEPTED -> UNDER_CORRECTION; Game census counters and Game.version updated"
      - "Game.certification_status OFFICIAL -> DISPUTED when the game was OFFICIAL"

  - method: GET
    path: "/event-tags/{id}/correction-requests"
    description: "list the correction requests filed against a tag (reverse lookup for CorrectionRequest.event_tag_id)"
    roles: [LeagueDataOps, Statistician, QualityReviewer, ClubDataOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []

  - method: POST
    path: "/correction-requests/{id}/approve"
    description: "approve a correction: rewrite the tag and force re-certification"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects:
      - "request SUBMITTED -> APPROVED; tag UNDER_CORRECTION -> ACCEPTED with corrected values and correction_count += 1"
      - "Game.approved_correction_count += 1; quality_index recomputed; certification_status DISPUTED -> PROVISIONAL"

  - method: POST
    path: "/correction-requests/{id}/reject"
    description: "reject a correction: the tag stands as recorded"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects:
      - "request SUBMITTED -> REJECTED; tag UNDER_CORRECTION -> ACCEPTED unchanged"
      - "Game.rejected_correction_count += 1; quality_index recomputed with REJECTED_WEIGHT; certification_status DISPUTED -> OFFICIAL"

  # --- data rights ------------------------------------------------------------
  - method: POST
    path: "/games/{id}/rights-windows"
    description: "allocate a data-rights window on a game to the league, a club or a licensee"
    roles: [LeagueDataOps]
    code: 201
    input: [rights_class, holder_type, "holder_id?", territory, window_start_utc, window_end_utc, max_latency_ms, allowed_scopes]
    output: RightsWindow
    side_effects:
      - "allocated_minutes computed and drawn from the reserve pool (LEAGUE_ARCHIVE) or the net pool (all other classes) per calculations.rights_allocation_ledger"
      - "Game.allocated_minutes_total / league_reserve_allocated_minutes / remaining_allocatable_minutes updated"

  - method: GET
    path: "/games/{id}/rights-windows"
    description: "list the rights windows allocated on a game (reverse lookup for RightsWindow.game_id)"
    roles: [LeagueDataOps, ClubDataOfficer, Licensee]
    code: 200
    input: ["rights_class?", "status?", "limit?", "offset?"]
    output: RightsWindow[]
    side_effects: []

  - method: POST
    path: "/rights-windows/{id}/revoke"
    description: "revoke a rights window, terminating and settling every session held under it"
    roles: [LeagueDataOps]
    code: 200
    input: []
    output: RightsWindow
    side_effects:
      - "window ACTIVE -> REVOKED; revoked_at_utc stamped"
      - "cascade: sessions under the window are settled by the METERED_ACTUAL variant and TERMINATED, then each licensee's reserved/consumed/available units and settled_charge_cents are updated"
      - "the window's allocated_minutes return to the pool it drew from"

  # --- licensees, feeds, usage -------------------------------------------------
  - method: POST
    path: "/licensees"
    description: "onboard a data licensee at an access tier with a unit grant"
    roles: [LeagueDataOps]
    code: 201
    input: [name, licensee_class, tier, granted_units, "biometric_entitled?"]
    output: DataLicensee
    side_effects: ["available_units initialised to granted_units; reserved_units and consumed_units 0"]

  - method: GET
    path: "/licensees/{id}"
    description: "read one licensee including the full quota ledger"
    roles: [LeagueDataOps, Licensee]
    code: 200
    input: []
    output: DataLicensee
    side_effects: []

  - method: POST
    path: "/feed-sessions"
    description: "open a real-time or post-game feed session under a rights window; the licensee is taken from X-User-ID"
    roles: [Licensee]
    code: 201
    input: [game_id, rights_window_id, delivery_mode, bandwidth_mbps, window_start_utc, window_end_utc, requested_latency_ms, scope]
    output: FeedSession
    side_effects:
      - "duration_minutes, latency_multiplier, reserved_units and reserved_charge_cents written by the RESERVED_FORWARD variant of calculations.feed_session_billing"
      - "DataLicensee.available_units -= reserved_units; reserved_units += reserved_units"
      - "RightsWindow.active_feed_session_count += 1"

  - method: GET
    path: "/feed-sessions/{id}"
    description: "read one feed session with its billing fields"
    roles: [LeagueDataOps, Licensee]
    code: 200
    input: []
    output: FeedSession
    side_effects: []

  - method: GET
    path: "/feed-sessions"
    description: "list feed sessions with filters (reverse lookup for FeedSession.game_id, FeedSession.licensee_id and FeedSession.rights_window_id)"
    roles: [LeagueDataOps, Licensee]
    code: 200
    input: ["game_id?", "licensee_id?", "rights_window_id?", "status?", "limit?", "offset?"]
    output: FeedSession[]
    side_effects: []

  - method: POST
    path: "/feed-sessions/{id}/usage-records"
    description: "report a metered usage sample against an active session"
    roles: [Licensee]
    code: 201
    input: [sampled_at_utc, bandwidth_mbps, duration_seconds, latency_p95_ms]
    output: LicenseUsageRecord
    side_effects:
      - "units_charged computed per record (ceil) and added to session.metered_units; usage_record_count += 1"
      - "sla_breach set when latency_p95_ms > RightsWindow.max_latency_ms; session.sla_breach_count += 1, DataLicensee.audit_flag_count += 1 and DataLicensee.sla_credit_cents += round_half_up(units_charged * tier_rate_cents * SLA_CREDIT_PCT)"
      - "on the third breach of a session, the session moves ACTIVE -> SUSPENDED with halt_reason SLA_BREACH_THRESHOLD"

  - method: GET
    path: "/feed-sessions/{id}/usage-records"
    description: "list the usage records of a session in chronological order (reverse lookup for LicenseUsageRecord.feed_session_id)"
    roles: [LeagueDataOps, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: LicenseUsageRecord[]
    side_effects: []

  - method: GET
    path: "/licensees/{id}/usage-records"
    description: "audit trail of every usage record billed to a licensee (reverse lookup for LicenseUsageRecord.licensee_id)"
    roles: [LeagueDataOps, Licensee]
    code: 200
    input: ["feed_session_id?", "sla_breach?", "limit?", "offset?"]
    output: LicenseUsageRecord[]
    side_effects: []

  - method: POST
    path: "/feed-sessions/{id}/terminate"
    description: "terminate a session and settle it against reported usage"
    roles: [Licensee]
    code: 200
    input: []
    output: FeedSession
    side_effects:
      - "metered_units, settled_charge_cents and refunded_units written by the METERED_ACTUAL variant"
      - "DataLicensee.reserved_units -= reserved_units; consumed_units += metered_units; available_units += refunded_units; settled_charge_cents += session.settled_charge_cents"
      - "session -> TERMINATED with halt_reason CLIENT_REQUEST; RightsWindow.active_feed_session_count -= 1"

  # --- historical normalization -----------------------------------------------
  - method: POST
    path: "/games/{id}/normalization-runs"
    description: "normalize a captured tracking metric of a collected game onto either the generation-native or the canonical season basis"
    roles: [LeagueDataOps]
    code: 201
    input: [basis, metric_code, segment_values]
    output: NormalizationRun
    side_effects: ["source_generation, scale_factor_applied, drift_correction_pct, mapping_version and normalized_value written by calculations.normalized_tracking_metric"]

  - method: GET
    path: "/games/{id}/normalization-runs"
    description: "list the normalization runs of a game (reverse lookup for NormalizationRun.game_id)"
    roles: [LeagueDataOps, ClubDataOfficer]
    code: 200
    input: ["basis?", "metric_code?", "limit?", "offset?"]
    output: NormalizationRun[]
    side_effects: []

  # --- test-driving surface ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default; the server never falls back to real wall-clock time). Advancing the clock materialises every ACTIVE ConsentRecord whose expires_at_utc <= the new value into EXPIRED, together with the tag-masking and BIOMETRIC-session-suspension cascade (halt_reason CONSENT_EXPIRED)."
    roles: [LeagueDataOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_consent_record_count: integer, suspended_feed_session_count: integer }
    side_effects:
      - "logical clock set; ACTIVE ConsentRecords past expires_at_utc move to EXPIRED in ascending expires_at_utc order (tie-break created_at ASC)"
      - "each expiry runs the same cascade as withdrawal with halt_reason CONSENT_EXPIRED"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource owned by another club or licensee"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the counterparty id recorded on the resource (run recorder, tagger, or correction author)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body schema violation: missing required field, wrong type, unknown field, invalid enum member, empty array where non-empty is required, or out-of-range number"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue id in path or body does not exist"
  - id: ERR_INSTALLATION_NOT_FOUND
    http: 404
    condition: "installation id in path does not exist"
  - id: ERR_CLUB_NOT_FOUND
    http: 404
    condition: "club id in path or body does not exist"
  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "player id in path or body does not exist"
  - id: ERR_CONSENT_RECORD_NOT_FOUND
    http: 404
    condition: "consent record id in path does not exist"
  - id: ERR_GAME_NOT_FOUND
    http: 404
    condition: "game id in path or body does not exist"
  - id: ERR_EVENT_TAG_NOT_FOUND
    http: 404
    condition: "event tag id in path does not exist"
  - id: ERR_CORRECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "correction request id in path does not exist"
  - id: ERR_RIGHTS_WINDOW_NOT_FOUND
    http: 404
    condition: "rights window id in path or body does not exist"
  - id: ERR_LICENSEE_NOT_FOUND
    http: 404
    condition: "licensee id in path or body (holder_id for holder_type LICENSEE) does not exist"
  - id: ERR_FEED_SESSION_NOT_FOUND
    http: 404
    condition: "feed session id in path does not exist"
  - id: ERR_STALE_GAME_VERSION
    http: 412
    condition: "expected_game_version does not equal Game.version at request time"
  - id: ERR_INVALID_INSTALLATION_STATE
    http: 409
    condition: "the installation is not in a state the requested transition allows (including any transition attempted from RETIRED)"
  - id: ERR_GAME_NOT_COLLECTING
    http: 409
    condition: "event tagging or a REALTIME feed session was attempted while collection_status != LIVE"
  - id: ERR_GAME_NOT_COLLECTED
    http: 409
    condition: "a POST_GAME feed session, a normalization run, or certification was attempted before collection closed"
  - id: ERR_INVALID_GAME_COLLECTION_STATE
    http: 409
    condition: "open/close/resume collection attempted from the wrong collection_status"
  - id: ERR_GAME_ALREADY_OFFICIAL
    http: 409
    condition: "certification attempted on a game whose certification_status is already OFFICIAL"
  - id: ERR_INVALID_TAG_STATE
    http: 409
    condition: "submit, accept or correction-request attempted from a tag state the transition does not allow (including SUPERSEDED tags)"
  - id: ERR_CORRECTION_ALREADY_RESOLVED
    http: 409
    condition: "approve or reject attempted on a correction request that is already APPROVED or REJECTED"
  - id: ERR_INVALID_CONSENT_STATE
    http: 409
    condition: "ratify attempted on a non-PENDING record, or withdraw attempted on a non-ACTIVE record"
  - id: ERR_RIGHTS_WINDOW_REVOKED
    http: 409
    condition: "a session was opened under, or a revoke was repeated on, a window whose status is REVOKED"
  - id: ERR_SESSION_NOT_ACTIVE
    http: 409
    condition: "usage reported on a non-ACTIVE session, or termination attempted on an already TERMINATED session"
  - id: ERR_VENUE_NOT_CERTIFIED
    http: 409
    condition: "collection open/resume attempted while the venue's data_posture is UNCERTIFIED or RESTRICTED"
  - id: ERR_BIOMETRIC_CONSENT_MISSING
    http: 422
    condition: "a tag with biometric_payload_present == true names a player whose biometric_release_state is not GRANTED"
  - id: ERR_BIOMETRIC_SCOPE_NOT_LICENSED
    http: 422
    condition: "a session requested BIOMETRIC scope for a licensee whose biometric_entitled is false"
  - id: ERR_CBA_VERSION_MISMATCH
    http: 422
    condition: 'the consent record''s cba_agreement_version differs from CBA_CURRENT_VERSION ("CBA-2026A")'
  - id: ERR_CONSENT_EXPIRY_IN_PAST
    http: 422
    condition: "consent expires_at_utc is at or before the logical clock, or at or before effective_from_utc"
  - id: ERR_CALIBRATION_NOT_PASSING
    http: 409
    condition: "certification attempted while the rig's latest run result is not PASS"
  - id: ERR_CALIBRATION_EXPIRED
    http: 422
    condition: "certification attempted more than CERT_VALIDITY_HOURS (72h) after the latest passing run"
  - id: ERR_INVALID_WINDOW_BOUNDS
    http: 422
    condition: "window_end_utc is at or before window_start_utc"
  - id: ERR_SESSION_WINDOW_OUTSIDE_RIGHTS
    http: 422
    condition: "the session occupation is not contained in the rights window's closed interval"
  - id: ERR_RIGHTS_WINDOW_OVERLAP
    http: 409
    condition: "the candidate rights window collides with an ACTIVE window of the same rights_class on a colliding territory under closed-interval semantics (plus the 300s broadcast buffer for BROADCAST_LIVE)"
  - id: ERR_CONSENT_ALREADY_PENDING
    http: 409
    condition: "the player already has a PENDING or ACTIVE consent record for the same scope"
  - id: ERR_SCOPE_NOT_IN_TIER
    http: 422
    condition: "a requested scope member is outside TIER_ALLOWED_SCOPES for the licensee's tier"
  - id: ERR_SCOPE_NOT_IN_RIGHTS_WINDOW
    http: 422
    condition: "a requested scope member is outside the rights window's allowed_scopes"
  - id: ERR_LATENCY_BELOW_VENUE_FLOOR
    http: 422
    condition: "requested_latency_ms is below the venue's min_achievable_latency_ms"
  - id: ERR_LATENCY_SLA_UNSATISFIABLE
    http: 422
    condition: "requested_latency_ms exceeds the rights window's max_latency_ms"
  - id: ERR_VENUE_TRANSPORT_CAPACITY_EXCEEDED
    http: 409
    condition: "the candidate session would push concurrent venue egress above transport_capacity_mbps at some instant of its half-open interval"
  - id: ERR_OPEN_CORRECTIONS
    http: 409
    condition: "certification attempted while under_correction_tag_count > 0"
  - id: ERR_NO_ACCEPTED_TAGS
    http: 422
    condition: "certification attempted on a game with accepted_tag_count == 0"
  - id: ERR_QUALITY_INDEX_BELOW_THRESHOLD
    http: 422
    condition: "certification attempted while quality_index < 0.8000"
  - id: ERR_NORMALIZATION_SEGMENTS_EMPTY
    http: 422
    condition: "segment_values is an empty array"
  - id: ERR_RIGHTS_WINDOW_GAME_MISMATCH
    http: 409
    condition: "the referenced rights window belongs to a different game than the session's game_id"
  - id: ERR_PLAYER_NOT_IN_GAME
    http: 409
    condition: "the tagged or proposed player's club is neither the home nor the away club of the game"
  - id: ERR_RIGHTS_HOLDER_MISMATCH
    http: 409
    condition: "holder_id does not match the holder_type contract (LEAGUE with a holder_id, CLUB whose id is not one of the game's clubs, or LICENSEE without a licensee id)"
  - id: ERR_ALLOCATION_POOL_EXHAUSTED
    http: 409
    condition: "the candidate window's allocated_minutes exceeds the remaining minutes of the pool it draws from"
  - id: ERR_LICENSEE_QUOTA_EXHAUSTED
    http: 402
    condition: "the reservation the session needs exceeds the licensee's available_units"
  - id: ERR_SESSION_RESERVATION_EXCEEDED
    http: 402
    condition: "the reported usage would push the session's metered units above its reserved units"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: LeagueDataOps
    description: "league data-operations desk: venues, rigs, games, rights allocation, licensee onboarding, consent ratification, normalization, clock"
    identity: opaque
    exclusive_operations:
      - "POST /venues"
      - "POST /installations"
      - "POST /installations/{id}/certify"
      - "POST /installations/{id}/retire"
      - "POST /clubs"
      - "POST /games"
      - "POST /games/{id}/open-collection"
      - "POST /games/{id}/close-collection"
      - "POST /games/{id}/resume-collection"
      - "POST /games/{id}/certify"
      - "POST /consent-records/{id}/ratify"
      - "POST /games/{id}/rights-windows"
      - "POST /rights-windows/{id}/revoke"
      - "POST /licensees"
      - "POST /games/{id}/normalization-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /players (with ClubDataOfficer)"
      - "all GET endpoints except the club-scoped consent list, which it shares with ClubDataOfficer"

  - name: CalibrationEngineer
    description: "field engineer who records accuracy-validation runs and flags drift; may never certify a rig they measured"
    identity: opaque
    exclusive_operations:
      - "POST /installations/{id}/calibration-runs"
      - "POST /installations/{id}/flag-drift"
    shared_operations:
      - "GET /venues/{id}, GET /venues/{id}/installations, GET /installations/{id}, GET /installations/{id}/calibration-runs (with LeagueDataOps)"

  - name: Statistician
    description: "event tagger; owns tag creation and submission and may open corrections"
    identity: opaque
    exclusive_operations:
      - "POST /event-tags"
      - "POST /event-tags/{id}/submit"
    shared_operations:
      - "POST /event-tags/{id}/correction-requests (with ClubDataOfficer)"
      - "GET /games, GET /games/{id}, GET /event-tags, GET /event-tags/{id}, GET /event-tags/{id}/correction-requests, GET /players, GET /players/{id}"

  - name: QualityReviewer
    description: "quality-control desk; accepts tags and resolves corrections, never authors the work it reviews"
    identity: opaque
    exclusive_operations:
      - "POST /event-tags/{id}/accept"
      - "POST /correction-requests/{id}/approve"
      - "POST /correction-requests/{id}/reject"
    shared_operations:
      - "GET /games, GET /games/{id}, GET /event-tags, GET /event-tags/{id}, GET /event-tags/{id}/correction-requests, GET /players, GET /players/{id}"

  - name: ClubDataOfficer
    description: "club-side data officer; files and withdraws player consent, may dispute tags of its own games"
    identity: "entity_backed:Club"
    exclusive_operations:
      - "POST /players/{id}/consent-records"
      - "POST /consent-records/{id}/withdraw"
    shared_operations:
      - "POST /players (with LeagueDataOps)"
      - "POST /event-tags/{id}/correction-requests (with Statistician)"
      - "GET /clubs/{id}, GET /players, GET /players/{id}, GET /players/{id}/consent-records, GET /games, GET /games/{id}, GET /event-tags, GET /event-tags/{id}, GET /event-tags/{id}/correction-requests, GET /games/{id}/rights-windows, GET /games/{id}/normalization-runs"

  - name: Licensee
    description: "third-party data licensee or broadcaster consuming feeds under a rights window at its access tier"
    identity: "entity_backed:DataLicensee"
    exclusive_operations:
      - "POST /feed-sessions"
      - "POST /feed-sessions/{id}/usage-records"
      - "POST /feed-sessions/{id}/terminate"
    shared_operations:
      - "GET /licensees/{id}, GET /licensees/{id}/usage-records, GET /feed-sessions, GET /feed-sessions/{id}, GET /feed-sessions/{id}/usage-records, GET /games, GET /games/{id}, GET /games/{id}/rights-windows"
