# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2436 — Real Estate Auction Marketplace & Trustee Sale Bidding
#
# Every instance grounds only in SCAFFOLD.yaml §1.1–§1.7. Deleting this file
# leaves the declared behaviour identical.
#
# Shared fixture conventions (each instance still drives empty-DB itself):
#   logical clock default            2026-08-01T00:00:00Z
#   primary county                   CA-ALAMEDA   (secondary: CA-CONTRA-COSTA)
#   canonical event window           2026-09-15T17:00:00Z .. 19:00:00Z
#   canonical lot window             2026-09-15T17:00:00Z .. 18:00:00Z
#   AuctionOps segregation of duties lot closer "ops-closer-1" != contract
#                                    executor "ops-contract-2"
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_variant_diverges_when_title_cleared_after_hammer
        grounds:
          - calculations.buyer_premium
          - calculations.contract_price
          - calculations.doc_fee_and_total_due
          - calculations.settlement_split
          - state_machines.AssetListing.PENDING_to_CLEARED
          - state_machines.TrusteeSale.CONFIRMED_to_HELD
          - entities.AuctionLot.fields.provisional_buyer_premium_cents
          - entities.SaleContract.fields.final_buyer_premium_cents
          - endpoints[GET /auction-lots/{id}/settlement-preview]
        distinguishing_aspect: |
          The two buyer_premium variants read DIFFERENT price bases and DIFFERENT title
          snapshots of the same lot: PROVISIONAL uses hammer_price_cents with the seller's
          own UNKNOWN disclosure (250 bps title surcharge), FINAL uses contract_price_cents
          (hammer plus postponement carry) with the TitleOfficer's verified CLEAR condition
          (0 bps), so the FINAL premium is 992000 cents LOWER than the PROVISIONAL one even
          though the FINAL price base is HIGHER — a variant switch cannot be modelled as a
          monotone adjustment of one number.
        test_recipe:
          setup:
            - "One SERVICER seller with default_commission_bps 500."
            - "One VACANT asset in CA-ALAMEDA whose seller-disclosed title_condition is UNKNOWN and whose title_clearance_status is still PENDING at hammer time."
            - "Its TrusteeSale was postponed exactly once (postponement_count 1) before any event existed, then re-confirmed."
            - "One AuctionEvent bound to that sale, holding a single lot with opening_bid 38000000 and reserve 38000000."
            - "One VERIFIED/REGISTERED bidder with 2000000 cents funded (required_deposit is 1900000)."
            - "The lot is hammered down at 40000000 by that bidder, then the TitleOfficer clears the title to CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Cascade Servicing", seller_type: "SERVICER", contact_email: "ops@cascade.example", settlement_account_ref: "ACH-CASCADE-1", default_commission_bps: 500 }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "812 Fruitvale Ave", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 45000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "UNKNOWN" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-10T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id }
            - call: "POST /trustee-sales/${sale_id}/postpone"
              payload: { new_sale_at: "2026-09-15T18:00:00Z", postponement_reason: "trustee continued the sale by one week" }
              as: Trustee
            - call: "POST /trustee-sales/${sale_id}/confirm"
              payload: { confirmation_reference: "TS-ALA-4471" }
              as: Trustee
            - call: "POST /auction-events"
              payload: { title: "Alameda September Trustee Sale", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "${sale_id}" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 38000000, reserve_price_cents: 38000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Harbor Point Holdings LLC", email: "buys@harborpoint.example", mailing_address: "44 Market St, San Francisco CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-8813" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 2000000, funding_reference: "WIRE-55120" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 40000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-2211" }
              as: TitleOfficer
          trigger:
            - call: "GET /auction-lots/${lot_id}/settlement-preview"
              payload: {}
              as: AuctionOps
              captures: { prov_prem: $.data.provisional_premium_cents, fin_prem: $.data.final_premium_cents, prem_delta: $.data.premium_variant_delta_cents }
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: { closing_window_days: 21 }
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id }
          assert:
            - "AuctionLot.${lot_id}.hammer_price_cents == 40000000"
            - "AuctionLot.${lot_id}.provisional_buyer_premium_cents == 4200000"
            - "${prov_prem} == 4200000"
            - "${fin_prem} == 3208000"
            - "${prem_delta} == -992000"
            - "SaleContract.${contract_id}.contract_price_cents == 40100000"
            - "SaleContract.${contract_id}.final_buyer_premium_cents == 3208000"
            - "SaleContract.${contract_id}.doc_fee_cents == 71250"
            - "SaleContract.${contract_id}.total_due_cents == 43379250"
            - "SaleContract.${contract_id}.settlement_gross_cents == 43308000"
            - "SaleContract.${contract_id}.seller_net_cents == 37954650"
            - "SaleContract.${contract_id}.platform_fee_cents == 2145350"
            - "SaleContract.${contract_id}.closing_deadline_at == 2026-10-06T18:05:00Z"
            - "TrusteeSale.${sale_id}.postponement_count == 1"
            - "TrusteeSale.${sale_id}.status == HELD"
            - "AssetListing.${listing_id}.title_condition == CLEAR"

      - name: risk_score_screen_counts_future_exclusion_audit_does_not
        grounds:
          - calculations.bidder_risk_score
          - entities.Bidder.fields.screen_risk_score
          - entities.EligibilityExclusion.fields.effective_at
          - endpoints[GET /bidders/{id}/eligibility-assessment]
          - validations[priority=16]
        distinguishing_aspect: |
          SCREEN and AUDIT disagree about the SAME exclusion row because they use different
          reference instants and different membership predicates: SCREEN is forward-looking
          and counts an ACTIVE exclusion whose effective_at is still in the future (+20),
          while AUDIT anchors on the lot's AuctionEvent.starts_at and excludes it (0). The
          divergence is produced by predicate scope, not by the two runs seeing different data.
        test_recipe:
          setup:
            - "One VACANT asset in CA-ALAMEDA with disclosed title CLEAR."
            - "One REO AuctionEvent (trustee_sale_id null) starting 2026-09-15T17:00:00Z holding a lot with opening_bid 20000000 (required_deposit 1000000)."
            - "One bidder verified at 2026-09-01T00:00:00Z with 2000000 cents funded and fallout_count 0."
            - "At clock 2026-09-16T00:00:00Z an ACTIVE STATE_INELIGIBLE exclusion with county_code ALL and effective_at 2026-09-20T00:00:00Z (future) exists, so the bidder is still REGISTERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Bayline Bank", seller_type: "BANK", contact_email: "reo@bayline.example", settlement_account_ref: "ACH-BAYLINE-2" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "17 Elmhurst Ct", city: "Hayward", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Alameda REO Mid-September", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Delta Ridge Capital LLC", email: "bids@deltaridge.example", mailing_address: "9 Harbor Way, Alameda CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-9002" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 2000000, funding_reference: "WIRE-77001" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /eligibility-exclusions"
              payload: { bidder_id: "${bidder_id}", exclusion_type: "STATE_INELIGIBLE", effective_at: "2026-09-20T00:00:00Z", county_code: "ALL", notes: "state registration lapses 2026-09-20" }
              as: ComplianceOfficer
              captures: { exclusion_id: $.data.id }
          trigger:
            - call: "GET /bidders/${bidder_id}/eligibility-assessment"
              payload: { mode: "SCREEN", auction_lot_id: "${lot_id}" }
              as: ComplianceOfficer
              captures: { screen_score: $.data.risk_score, screen_count: $.data.counted_exclusion_count, screen_eligible: $.data.eligible }
            - call: "GET /bidders/${bidder_id}/eligibility-assessment"
              payload: { mode: "AUDIT", auction_lot_id: "${lot_id}" }
              as: ComplianceOfficer
              captures: { audit_score: $.data.risk_score, audit_count: $.data.counted_exclusion_count, audit_identity: $.data.identity_penalty_applied }
          assert:
            - "${screen_score} == 20"
            - "${screen_count} == 1"
            - "${screen_eligible} == true"
            - "${audit_score} == 0"
            - "${audit_count} == 0"
            - "${audit_identity} == 0"
            - "Bidder.${bidder_id}.registration_status == REGISTERED"
            - "EligibilityExclusion.${exclusion_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_split_rounds_each_component_before_summing
        grounds:
          - calculations.settlement_split
          - calculations.buyer_premium
          - calculations.doc_fee_and_total_due
          - entities.Seller.fields.default_commission_bps
          - entities.Seller.fields.settled_net_cents
          - entities.SaleContract.fields.platform_fee_cents
        distinguishing_aspect: |
          contract_price_cents 32081229 is chosen so the commission component (1604061.45)
          and the marketing-recovery component (112284.3015) each round DOWN while their
          summed-bps counterpart (1716345.7515) rounds UP: per-component rounding yields
          platform_fee 1761345 / seller_net 30319884, summing the basis points first yields
          1761346 / 30319883. The one-cent gap makes the pinned rounding ORDER observable,
          which no single multiply-and-round could expose.
        test_recipe:
          setup:
            - "One SERVICER seller with default_commission_bps 500."
            - "One VACANT asset in CA-ALAMEDA disclosed as title UNKNOWN, later verified CLOUDED (so TITLE_SERVICE_FEE_CENTS 45000 applies and the title surcharge is 175 bps)."
            - "One REO AuctionEvent (no trustee sale, so no postponement carry) holding one lot with opening_bid 30000000 and reserve 30000000 (required_deposit 1500000)."
            - "The lot is hammered down at exactly 32081229 by a VERIFIED bidder funded with 2000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Meridian Loan Servicing", seller_type: "SERVICER", contact_email: "reo@meridian.example", settlement_account_ref: "ACH-MERIDIAN-7", default_commission_bps: 500 }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "3300 Grand Ave", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 39000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "UNKNOWN" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Alameda REO Block C", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 30000000, reserve_price_cents: 30000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Stonegate Property Fund", email: "desk@stonegate.example", mailing_address: "220 Broadway, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-4410" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 2000000, funding_reference: "WIRE-31877" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 32081229 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLOUDED_DISCLOSED", verified_title_condition: "CLOUDED", title_report_reference: "TR-5590" }
              as: TitleOfficer
          trigger:
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id }
          assert:
            - "SaleContract.${contract_id}.contract_price_cents == 32081229"
            - "SaleContract.${contract_id}.final_buyer_premium_cents == 3127920"
            - "SaleContract.${contract_id}.platform_fee_cents == 1761345"
            - "SaleContract.${contract_id}.seller_net_cents == 30319884"
            - "SaleContract.${contract_id}.buyer_premium_cents == 3127920"
            - "SaleContract.${contract_id}.settlement_gross_cents == 35209149"
            - "SaleContract.${contract_id}.doc_fee_cents == 71250"
            - "SaleContract.${contract_id}.total_due_cents == 35280399"
            - "SaleContract.${contract_id}.settlement_status == POSTED"
            - "Seller.${seller_id}.settled_net_cents == 30319884"
            - "the summed-bps shortcut is NOT accepted: platform_fee_cents != 1761346 and seller_net_cents != 30319883"
            - "seller_net_cents + platform_fee_cents + buyer_premium_cents == settlement_gross_cents (30319884 + 1761345 + 3127920 == 35209149)"

      - name: doc_fee_tier_keyed_on_provisional_total_only
        grounds:
          - calculations.doc_fee_and_total_due
          - calculations.buyer_premium
          - calculations.contract_price
          - entities.SaleContract.fields.doc_fee_cents
          - entities.SaleContract.fields.total_due_cents
        distinguishing_aspect: |
          doc_fee depends on a tier keyed on the total, and the total depends on doc_fee; the
          scaffold breaks the cycle with a pinned 3-step order. With contract_price 23064815
          and premium 1845185 the step-1 provisional total is 25005000 (>= the 25000000 tier
          floor, discount 0.25, doc_fee 71250) while the step-3 total_due is 24981250 — BELOW
          the very floor that granted the discount. A fixed-point or re-keyed reading returns
          doc_fee 95000 / total 25005000, so the evaluation order is the only thing that
          distinguishes the correct answer.
        test_recipe:
          setup:
            - "One VACANT asset in CA-ALAMEDA with title verified CLEAR (0 bps title surcharge, no title service fee)."
            - "One REO AuctionEvent (no trustee sale) holding one lot with opening_bid 20000000 and reserve 20000000 (required_deposit 1000000)."
            - "The lot is hammered down at exactly 23064815, so contract_price_cents == 23064815."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Northgate GSE Disposition", seller_type: "GSE", contact_email: "disp@northgate.example", settlement_account_ref: "ACH-NORTHGATE-3", default_commission_bps: 500 }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "58 Kestrel Ln", city: "Fremont", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 28000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-6001" }
              as: TitleOfficer
            - call: "POST /auction-events"
              payload: { title: "Alameda REO Block D", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Kestrel Homes LLC", email: "acq@kestrelhomes.example", mailing_address: "12 Mission Blvd, Fremont CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-1187" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 1500000, funding_reference: "WIRE-90233" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 23064815 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
          trigger:
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id }
