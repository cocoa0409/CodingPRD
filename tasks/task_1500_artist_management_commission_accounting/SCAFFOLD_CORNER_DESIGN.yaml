          trigger:
            - call: "GET /artists/${a_id}"
              payload: {}
              as: Agent
              as_user_id: "${tm_b}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ARTIST_ACCESS_DENIED (http 403): the caller's TeamMember.artist_id != ${a_id}"

      - name: auditor_read_only_plus_audit_actions
        claim_type: rbac_exclusive_denied
        grounds: ["roles.Auditor", "roles.FirmAdmin"]
        distinguishing_aspect: "Auditor (opaque) can run audit actions and read anything, but cannot perform FirmAdmin exclusives like POST /artists (ERR_FORBIDDEN_FOR_ROLE)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /artists"
              payload: { stage_name: "Nope Act", legal_name: "Nope Act LLC", primary_genre: "pop" }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (http 403); no artist persisted"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_agreement_create_rejects_stale_artist_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-create-stale-artist]", "errors[ERR_STALE_ARTIST_VERSION]"]
        distinguishing_aspect: "CREATE-with-supersede OCC: after an activation bumps Artist.version to 3, a new POST /agreements carrying the pre-activation version 2 is rejected with ERR_STALE_ARTIST_VERSION (412) - two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Artist (v1 at create); agreement A1 created with expected v1 (artist v2); A1 ACTIVATED (artist v3); the client still holds the pre-activation version 2 captured from the agreement-create response? No - artist versions are captured via GET /artists/{id}; the chain captures v2 BEFORE activation"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Occ Act", legal_name: "Occ Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr1: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr1}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "GET /artists/${a_id}"
              payload: {}
              as: FirmAdmin
              captures: { a_v_pre: $.data.version }
            - call: "POST /agreements/${agr1}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2028-01-01", term_end_date: "2029-12-31", expected_artist_version: "${a_v_pre}" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
            - call: "GET /artists/${a_id}"
              payload: {}
              as: FirmAdmin
              captures: { a_v_now: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2028-01-01", term_end_date: "2029-12-31", expected_artist_version: "${a_v_now}" }
              as: FirmAdmin
              captures: { agr2: $.data.id }
          assert:
            - "The create carrying the pre-activation version fails: err == ERR_STALE_ARTIST_VERSION (http 412)"
            - "The same create with the fresh version succeeds: Agreement.${agr2} created in DRAFT; Artist.version advanced to ${a_v_now} + 1"

      - name: occ_agreement_patch_rejects_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-update-stale-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "UPDATE OCC: a PATCH carrying the agreement's pre-edit version is rejected 412; the same PATCH with the current version succeeds and increments the version again."
        test_recipe:
          setup: ["Artist + DRAFT agreement (version 1 captured); one successful PATCH applied (version 2)"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Patch Act", legal_name: "Patch Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr: $.data.id, agr_v1: $.data.version }
            - call: "PATCH /agreements/${agr}"
              payload: { expected_agreement_version: "${agr_v1}", term_end_date: "2028-06-30" }
              as: FirmAdmin
              captures: { agr_v2: $.data.version }
          trigger:
            - call: "PATCH /agreements/${agr}"
              payload: { expected_agreement_version: "${agr_v1}", recoupment_policy: "PRO_RATA" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /agreements/${agr}"
              payload: { expected_agreement_version: "${agr_v2}", recoupment_policy: "PRO_RATA" }
              as: FirmAdmin
              captures: { agr_v3: $.data.version }
          assert:
            - "Stale PATCH (replaying version ${agr_v1}) fails: err == ERR_STALE_AGREEMENT_VERSION (http 412); term_end_date stays 2028-06-30 and recoupment_policy stays FIFO"
            - "Fresh PATCH with version ${agr_v2} succeeds: recoupment_policy == PRO_RATA and version == ${agr_v3} == ${agr_v2} + 1"

      - name: occ_counter_offer_rejects_stale_opportunity_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[opportunity-counter-stale-version]", "errors[ERR_STALE_OPPORTUNITY_VERSION]"]
        distinguishing_aspect: "Negotiation OCC: two counter-offers are sequential writes to the same negotiation; the second one carrying the pre-first-counter version is rejected ERR_STALE_OPPORTUNITY_VERSION even though NEGOTIATING permits both."
        test_recipe:
          setup: ["Artist + Agent; opportunity 1000000 (no artist approval) in NEGOTIATING with version captured"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Neg Act", legal_name: "Neg Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ng", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /opportunities"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "FestNg", proposed_value_cents: 1000000, offer_expiry_date: "2026-12-31", proposed_window_start: "2026-10-01T00:00:00Z", proposed_window_end: "2026-10-02T00:00:00Z", fit_score: 60 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp: $.data.id }
            - call: "POST /opportunities/${opp}/evaluate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /opportunities/${opp}/negotiate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp_v: $.data.version }
          trigger:
            - call: "POST /opportunities/${opp}/counter-offer"
              payload: { new_value_cents: 1050000, expected_opportunity_version: "${opp_v}" }
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /opportunities/${opp}/counter-offer"
              payload: { new_value_cents: 1030000, expected_opportunity_version: "${opp_v}" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "First counter-offer succeeds (delta 5% <= 10%: stays NEGOTIATING, round_number 1, version advanced)"
            - "Second counter-offer replaying the same expected version fails: err == ERR_STALE_OPPORTUNITY_VERSION (http 412); current_value_cents stays 1050000"

      - name: clock_default_is_fixed_and_monotonic
        claim_type: scheduled_actions
        grounds: ["endpoints: POST /_clock/set_current_utc"]
        distinguishing_aspect: "Without any clock call, server-side stamps read exactly 2026-08-01T00:00:00Z (never wall-clock); and the clock cannot regress (ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Artist + agreement + BM; statement issued without any prior clock call"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Time Act", legal_name: "Time Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Ti", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-06-01", period_end_date: "2026-06-30", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st1: $.data.id }
            - call: "POST /statements/${st1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { issued_at: $.data.issued_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Statement.${st1}.issued_at == 2026-08-01T00:00:00Z exactly (the fixed startup default, not wall clock)"
            - "dispute_window_ends_at == 2026-08-31T00:00:00Z (issued_at + 30 days)"
            - "Regression attempt (2026-08-15 after 2026-09-01) fails: err == ERR_INVALID_REQUEST (http 400)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.commission_amount"]
        distinguishing_aspect: "Immediate consistency: the verify response AND a subsequent GET both expose the freshly pinned commission fields; no eventual recompute window exists."
        test_recipe:
          setup: ["Artist + ACTIVE agreement (RECORDING 2000bps); Agent + BM; event gross 300000 recognized 2026-02-10 REPORTED"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Imm Act", legal_name: "Imm Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "RECORDING", in_term_rate_bps: 2000, sunset_rate_bps: 1000, sunset_months: 24, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Im", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Im", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "RECORDING", gross_amount_cents: 300000, recognition_date: "2026-02-10", source_name: "Label" }
              as: Agent
              as_user_id: "${tm_agent}"
