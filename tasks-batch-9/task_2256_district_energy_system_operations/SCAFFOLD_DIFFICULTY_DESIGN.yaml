              as: BillingAnalyst
              captures: { rs_u_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_h_id}", rate_schedule_id: "${rs_u_id}", customer_name: "Hilltop University", customer_class: "UNIVERSITY", reserved_capacity_kw: 1000.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ch1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ch1_id}/activate"
              payload: {}
