  # =========================================================================
  # 9. Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.qa_defect_density
        distinguishing_aspect: "consistency_model is immediate, so there is no settling period anywhere: the write's own response body already carries every recomputed field, and an immediate follow-up read of the PARENT shows the same numbers. A dirty-read implementation that recomputes lazily on the next GET, or one that returns the pre-write row, both fail."
        test_recipe:
          setup:
            - "Title NOVA-89 with two keys and a JP plan at IN_LOCALIZATION; both units drafted."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-89", name: "Nova Drift 89", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 60, ui_surface: "HUD", display_char_limit: 80, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
              captures: { e_not_scoped: "$.data.error_id" }
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { scoped_units: "$.data.text_effort_units", scoped_cost: "$.data.localization_cost_cents", scoped_required: "$.data.required_unit_count" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_jp}&string_key_id=${k_menu}"
              payload: {}
              as: TranslationVendor
              captures: { u_menu: "$.data[0].id" }
            - call: "GET /translation-units?market_plan_id=${mp_jp}&string_key_id=${k_hud}"
              payload: {}
              as: TranslationVendor
              captures: { u_hud: "$.data[0].id" }
            - call: "PUT /translation-units/${u_menu}"
              payload: { target_text: "ゲームを始める", target_char_count: 90, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "PUT /translation-units/${u_hud}"
              payload: { target_text: "残弾数の表示が長い", target_char_count: 95, applied_tm_match_pct: 80 }
              as: TranslationVendor
              captures: { hud_overflow_in_write_response: "$.data.overflow_chars" }
          trigger:
            - call: "POST /translation-units/${u_menu}/deliver"
              payload: {}
              as: TranslationVendor
              captures: { menu_status: "$.data.translation_status" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: LocalizationProducer
              captures: { delivered_after_one: "$.data.delivered_unit_count" }
            - call: "POST /translation-units/${u_hud}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { lqa_units: "$.data.text_effort_units", lqa_cost: "$.data.localization_cost_cents", lqa_variant: "$.data.text_effort_variant" }
            - call: "GET /titles/${title_id}"
              payload: {}
              as: LocalizationProducer
              captures: { title_state: "$.data.localization_state" }
            - call: "POST /qa-passes"
              payload: { market_plan_id: "${mp_jp}", pass_type: "FUNCTIONAL", inspected_unit_count: 20 }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { pass_id: "$.data.id", initial_density: "$.data.defect_density", initial_points: "$.data.weighted_defect_points" }
            - call: "POST /lqa-bugs"
              payload: { qa_pass_id: "${pass_id}", translation_unit_id: "${u_hud}", bug_class: "TEXT_OVERFLOW", severity: "S2", summary: "Ammo readout truncates on the 4:3 HUD" }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { bug_weight_in_write_response: "$.data.severity_weight" }
            - call: "GET /qa-passes/${pass_id}"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { density_after_bug: "$.data.defect_density", points_after_bug: "$.data.weighted_defect_points" }
            - call: "GET /translation-units/${u_hud}"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { hud_qa_after_bug: "$.data.qa_status", hud_open_bugs: "$.data.open_bug_count" }
          assert:
            - "the pre-scope start-localization returns HTTP 409 ERR_MARKET_PLAN_STATE_INVALID, confirming the scope numbers below were produced by scope itself"
            - "scope's own response already carries text_effort_units == 0.40, localization_cost_cents == 1680 and required_unit_count == 2 - no second call is needed to see them"
            - "the PUT response already reports overflow_chars == 15 for the HUD unit (95 target chars against display_char_limit 80)"
            - "the first deliver's response shows translation_status DELIVERED, and the immediately following GET on the PARENT plan already shows delivered_unit_count == 1"
            - "enter-lqa's response carries text_effort_variant == DELIVERED_ACTUAL with text_effort_units == 0.40 and localization_cost_cents == 1680, and the immediately following GET on the Title already shows localization_state == CERT_WINDOW"
            - "the new QaPass response carries defect_density == 0.0000 and weighted_defect_points == 0 rather than null"
            - "POST /lqa-bugs returns severity_weight == 4 in its own response; the immediate GET of the pass shows weighted_defect_points == 4 and defect_density == 0.2000, and the immediate GET of the unit shows qa_status FUNC_FLAGGED with open_bug_count == 1"
