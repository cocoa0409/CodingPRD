              as: Applicant
              as_user_id: "${appA_id}"
              captures: { consentA_id: $.data.id, consentA_v0: $.data.version }
            - call: "POST /api/v1/consents/${consentA_id}/grant"
              payload: { expected_consent_disclosure_version: "${consentA_v0}" }
              as: Applicant
              as_user_id: "${appA_id}"
            - call: "POST /api/v1/applications/${applA_id}/submit"
              payload: { expected_application_version: "${applA_v0}" }
              as: Applicant
              as_user_id: "${appA_id}"
              captures: { applA_v1: $.data.version }
            - call: "POST /api/v1/applications/${applA_id}/conditional-offer"
              payload: { expected_application_version: "${applA_v1}" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { applA_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${applA_id}", consent_id: "${consentA_id}", expected_application_version: "${applA_v2}" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { orderA_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${orderA_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { crimA_id: $.data.id, crimA_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${orderA_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { mvrA_id: $.data.id, mvrA_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${orderA_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { eduA_id: $.data.id, eduA_v0: $.data.version }
            - call: "POST /api/v1/verifications/${crimA_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${crimA_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${mvrA_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${mvrA_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${eduA_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${eduA_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            # ---- Order B: one fail ----
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Margaret Hamilton", email: "margaret@example.com", date_of_birth: "1980-08-17T00:00:00.000Z" }
              as: Applicant
              captures: { appB_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${appB_id}", jurisdiction_id: "${jur_wa_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${appB_id}"
              captures: { applB_id: $.data.id, applB_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${applB_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${appB_id}"
              captures: { consentB_id: $.data.id, consentB_v0: $.data.version }
            - call: "POST /api/v1/consents/${consentB_id}/grant"
              payload: { expected_consent_disclosure_version: "${consentB_v0}" }
