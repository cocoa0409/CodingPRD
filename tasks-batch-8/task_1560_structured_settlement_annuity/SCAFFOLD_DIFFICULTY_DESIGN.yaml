              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-G", insurer_name: "LifeCo", premium_cents: 15000000, contract_discount_rate_bps: 500, commutation_rider: "NONE", certain_period_end_date: "2036-12-31" }
              as: CaseManager
