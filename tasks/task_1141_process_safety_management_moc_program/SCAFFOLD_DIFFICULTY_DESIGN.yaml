            - { call: "POST /psm/units/${u_id}/audits", payload: { title: "AU3", lead_auditor_id: "${aud_id}", field_window_start: "2026-08-19", field_window_end: "2026-08-22" }, as: PsmManager, captures: { err: $.data.error_id } }
          assert:
            - "AU-2 created (201): 2026-08-20 > 2026-08-05 + 14d (2026-08-19) satisfies the buffer"
            - "AU-3 rejected: error_id == ERR_AUDIT_WINDOW_CONFLICT (2026-08-19 is NOT > 2026-08-19 — buffer boundary is strict)"

  - rule_id: compensating_invariant
    instances:
      - name: action_item_verify_reopen_count_invariant
        grounds:
          - state_machines.ActionItem.SUBMITTED_FOR_VERIFICATION_to_VERIFIED_CLOSED
          - state_machines.ActionItem.VERIFIED_CLOSED_to_IN_PROGRESS
          - entities.PlantUnit.fields.open_action_count
        distinguishing_aspect: |
          Conserved quantity: PlantUnit.open_action_count. The forward action (verify, −1)
          paired with its compensating action (reopen, +1) restores the count exactly:
          open_action_count == count of items in {OPEN, IN_PROGRESS,
          SUBMITTED_FOR_VERIFICATION, REJECTED} holds before and after the pair.
        test_recipe:
          setup:
            - "Unit U; REQ exists; manual P1 item A assigned to REQ (unit.open_action_count == 1)"
            - "A is IN_PROGRESS with one evidence item attached"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a", priority: "P1", assignee_id: "${req_id}" }, as: PsmManager, captures: { a_id: $.data.id } }
            - { call: "POST /psm/action-items/${a_id}/start", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/evidence-items", payload: { file_ref: "s3://ev/e1.pdf", description: "evidence" }, as: Requester, as_user_id: "${req_id}" }
          trigger:
            - { call: "POST /psm/action-items/${a_id}/submit-verification", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/verify", payload: {}, as: PsmManager }
            - { call: "POST /psm/action-items/${a_id}/reopen", payload: { reason: "audit query" }, as: PsmManager }
          assert:
            - "Pre-verify baseline: open_action_count was 1; post-verify: 0 (forward −1)"
            - "Post-reopen: PlantUnit.${u_id}.open_action_count == 1 (compensating +1; verify+reopen pair is net-zero on the conserved quantity)"
            - "open_action_count == 1 equals the number of ${u_id} items in OPEN-class states (item A IN_PROGRESS)"
            - "ActionItem.${a_id}.reopen_count == 1"

      - name: pha_open_abandon_schedule_invariant
        grounds:
          - state_machines.PhaStudy.OVERDUE_to_IN_REVALIDATION
          - state_machines.PhaStudy.IN_REVALIDATION_to_OVERDUE
          - state_machines.PhaRevalidation.OPEN_to_ABANDONED
          - entities.PhaStudy.fields.last_validated_at
        distinguishing_aspect: |
          Conserved quantity: the PHA schedule tuple (last_validated_at, nominal_next_due,
          risk_accelerated_due, effective_next_due, revalidation_count) — a different
          quantity than an item count. open-revalidation (forward) followed by abandon
          (compensating) leaves the whole tuple unchanged and restores the OVERDUE status.
        test_recipe:
          setup:
            - "Unit U (cycle 12 → 360 days); study validated 2026-01-01 (nominal/risk/effective all 2026-12-27, N=0)"
            - "Clock at 2026-12-28 → study OVERDUE; HAZ (HAZOP_LEADER) exists"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-01" }, as: PsmManager, captures: { s_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Haz", employee_ref: "E-HAZ", qualifications: ["HAZOP_LEADER"] }, as: PsmAdmin, captures: { haz_id: $.data.id } }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-12-28T00:00:00Z" }, as: PsmAdmin }
          trigger:
            - { call: "POST /psm/pha-studies/${s_id}/open-revalidation", payload: { leader_id: "${haz_id}" }, as: PsmManager, captures: { rv_id: $.data.id } }
            - { call: "POST /psm/pha-revalidations/${rv_id}/abandon", payload: {}, as: PsmManager }
          assert:
            - "During revalidation: study was IN_REVALIDATION; after abandon: PhaStudy.${s_id}.status == OVERDUE (status_before_revalidation restored)"
            - "PhaStudy.${s_id}.last_validated_at == 2026-01-01T00:00:00Z (unchanged)"
            - "PhaStudy.${s_id}.nominal_next_due == 2026-12-27T00:00:00Z and effective_next_due == 2026-12-27T00:00:00Z (unchanged)"
            - "PhaStudy.${s_id}.revalidation_count == 0 (unchanged) and PhaRevalidation.${rv_id}.status == ABANDONED"
