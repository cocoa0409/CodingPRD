              payload: { code: "ABT-01", category: "STRUCTURAL", description: "roof", severity_weight: 7, cure_period_days: 5, base_fine_cents: 20000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner N", party_type: "OWNER", email: "n@x.com", contact_phone: "555-0113", mailing_address: "14 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-CR2", street_address: "18 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B14", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["ABT-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
          trigger:
            - call: "POST /registry/properties/${prop_id}/abatement-orders"
              payload: { scheduled_start: "2026-03-20T08:00:00Z", scheduled_end: "2026-03-20T16:00:00Z", estimated_cost_cents: 50000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/properties/${prop_id}/abatement-orders"
              payload: { scheduled_start: "2026-03-20T08:00:00Z", scheduled_end: "2026-03-20T16:00:00Z", estimated_cost_cents: 50000 }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
          assert:
