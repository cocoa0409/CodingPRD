  - rule_id: transitive_cascade
    instances:
      - name: customer_suspend_cascade_depth3
        grounds:
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - state_machines.WorkOrder.PENDING_to_CANCELLED
          - state_machines.Stop.PLANNED_to_CANCELLED
          - entities.Route.fields.committed_bottles
        distinguishing_aspect: |
          Cascade: Customer.suspend -> WorkOrders CANCELLED -> linked Stops CANCELLED
          -> Route.committed_bottles decremented. Depth = 3 (Customer -> WorkOrder ->
          Stop -> Route). Each link caused by previous link, not by the original
          suspend directly.
        test_recipe:
          setup:
            - "Customer C6 ACTIVE with outstanding_balance > 0 (from unpaid invoice)"
            - "WorkOrder WO1 PENDING"
            - "WorkOrder WO2 SCHEDULED, linked to PLANNED Stop S1 on Route R1"
            - "Route R1.committed_bottles == planned_bottles of S1"
