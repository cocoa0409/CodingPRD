# =============================================================================
# Task 0662 — Soft-Wash & Roof/Exterior Cleaning
# Difficulty: Expert
# SCAFFOLD.yaml  (§1.0–§1.7; preamble keys)
# =============================================================================

scenario: |
  662. Soft-Wash & Roof/Exterior Cleaning: quote by sq-ft/stories & surface,
  service (roof soft-wash/house/concrete) & chemical mix, weather scheduling &
  route, before/after photo, recurring plan, satisfaction re-clean, ladder/safety
  & insurance, per-visit billing

domain_name: soft-wash-exterior-cleaning
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on Property.version for quote supersede
    - cascading_side_effects        # plan-cancel & visit-complete cascade chains
    - dual_variant_calculation      # provisional vs final visit cost; risk score variants
    - derived_field_reconciliation  # Customer.outstanding_balance_cents, Technician.scheduled_minutes

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no nesting in URL paths except two
  #       read-only sub-resources (quote line-items, visit photos). api_prefix is
  #       "/" so every collection sits at the root.

  state_machine_shape: cyclic
  # Visit carries a re-clean loop (COMPLETED → RECLEAN_REQUESTED → SCHEDULED → …)
  # and ServiceQuote carries a revision loop (SENT → DRAFT → SENT). Invoice adds a
  # branching dispute/void shape. Mixed cyclic + branching, no pure linear pipeline.

  relationship_patterns:
    - one_to_many        # Customer→Property, Property→Quote, Quote→QuoteLineItem, Visit→CrewAssignment
    - cross_aggregate    # Visit references Route & Quote; CrewAssignment references Technician

  role_model: peer_roles
  # Dispatcher (ops), FieldTech (entity-backed Technician), Customer (entity-backed),
  # BillingAdmin (ops) each own distinct resource types.

  consistency_model: immediate
  # All mutations and their cascades complete atomically within the triggering request.

  entity_count: 13
  state_machine_count: 6
  calculation_count: 8
  validation_layers: 15
  endpoint_count: 56
  error_code_count: 27
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Property owner / billing contact name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Customers" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Max unpaid balance allowed before new visits are blocked; 0 means no credit (must prepay)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of amount_due_cents over Invoices with status IN {ISSUED, DISPUTED}; recomputed on every invoice mutation; floored at 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new quote/visit creation" }

  # ---------------------------------------------------------------------------
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: ladder_cert_max_stories, type: integer, source: input, default: 1, description: "Highest building height (stories) this tech may safely work at via ladder; gates roof/upper-story assignments" }
      - { name: insurance_status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | EXPIRED — EXPIRED techs may not be assigned to any Visit" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "Sum of duration_minutes over CrewAssignments for this tech with status IN {RESERVED, CONFIRMED}; conserved quantity for invariant tech_minutes_conserved" }

  # ---------------------------------------------------------------------------
  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Geographic route / service zone name" }
      - { name: travel_buffer_minutes, type: integer, source: input, default: 30, description: "Setup+travel buffer applied to technician interval overlap on this route" }

  # ---------------------------------------------------------------------------
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this property" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; service zone the property belongs to" }
      - { name: address, type: string, source: input, description: "Street address label" }
      - { name: stories, type: integer, source: input, description: "Building height in stories; integer >= 1; drives height surcharge and ladder gating" }
      - { name: roof_sqft, type: integer, source: input, default: 0, description: "Roof surface area in square feet; integer >= 0" }
      - { name: siding_sqft, type: integer, source: input, default: 0, description: "House/siding surface area in square feet; integer >= 0" }
      - { name: concrete_sqft, type: integer, source: input, default: 0, description: "Flatwork/concrete surface area in square feet; integer >= 0" }

  # ---------------------------------------------------------------------------
  - name: ServiceQuote
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property being quoted" }
      - { name: soiling_level, type: enum, source: input, default: "MODERATE", description: "LIGHT | MODERATE | HEAVY; drives chemical dose tier multiplier" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over QuoteLineItems of line_total_cents (each already rounded to whole cents per-line, THEN summed)" }
      - { name: travel_surcharge_cents, type: integer, source: computed, description: "Computed after subtotal via quote_travel_surcharge; depends on the discount tier keyed on subtotal_cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + travel_surcharge_cents; pinned evaluation order in quote_total" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SENT | ACCEPTED | DECLINED | SUPERSEDED; SUPERSEDED set when a newer quote on the same property is created" }

  # ---------------------------------------------------------------------------
  - name: QuoteLineItem
    parent: ServiceQuote
    common_fields: false   # id, created_at only (append-only priced line)
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: quote_id, type: string, source: input, description: "FK -> ServiceQuote.id; parent quote" }
      - { name: surface_type, type: enum, source: input, description: "ROOF | SIDING | CONCRETE; selects sqft source and surface rate" }
      - { name: service_type, type: enum, source: input, description: "ROOF_SOFT_WASH | HOUSE_WASH | CONCRETE_CLEAN; service-rate multiplier" }
      - { name: measured_sqft, type: integer, source: input, description: "Surface area for this line in square feet; integer >= 1" }
      - { name: chemical_dose_oz, type: number, source: computed, description: "Sodium-hypochlorite dose in fluid ounces via chemical_dose (3 inputs, nested min/max, tiered)" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-line price rounded to whole cents via quote_line_total (round per-line, then summed into quote subtotal)" }

  # ---------------------------------------------------------------------------
  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property serviced on a cadence" }
      - { name: source_quote_id, type: string, source: input, description: "FK -> ServiceQuote.id; ACCEPTED quote whose line-items define each visit's scope and base price" }
      - { name: cadence_days, type: integer, source: input, description: "Days between visits; integer >= 1" }
      - { name: next_due_utc, type: datetime, source: computed, description: "ISO8601 UTC; first equals start_utc, then advances by cadence_days on each visit completion under this plan" }
      - { name: visits_generated_count, type: integer, source: computed, default: 0, description: "Count of Visits created under this plan; loyalty discount tier input" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CANCELLED; CANCELLED cascades to future Visits" }

  # ---------------------------------------------------------------------------
  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; site to be cleaned" }
      - { name: quote_id, type: string, source: input, description: "FK -> ServiceQuote.id; ACCEPTED quote pricing this visit (null for plan-generated visits that inherit plan.source_quote_id)" }
      - { name: plan_id, type: string, source: input, description: "FK -> RecurringPlan.id; null for one-off visits" }
      - { name: route_id, type: string, source: computed, description: "FK -> Route.id; copied from Property.route_id at creation; selects the WeatherWindow pool" }
      - { name: scheduled_date, type: string, source: input, description: "Target service day as YYYY-MM-DD (UTC calendar day); must be covered by a CLEAR WeatherWindow to schedule" }
      - { name: duration_minutes, type: integer, source: input, default: 120, description: "Estimated on-site minutes; integer >= 1; reserved against tech schedule" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Cost at scheduling time from the quote's total_cents (estimate)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Cost at completion from on-site re_measured_sqft via visit_final_cost (actual); null until COMPLETED" }
      - { name: reclean_of_visit_id, type: string, source: system, description: "FK -> Visit.id; set when this visit is a free re-clean spawned from a SatisfactionClaim; null otherwise" }
      - { name: billing_status, type: enum, source: computed, default: "UNBILLED", description: "UNBILLED | BILLED | VOIDED; BILLED once an Invoice is ISSUED for this visit" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | RECLEAN_REQUESTED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; visit being staffed" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned crew member" }
      - { name: window_start_utc, type: datetime, source: input, description: "ISO8601 UTC; start of the tech's on-site interval (half-open [start,end))" }
      - { name: duration_minutes, type: integer, source: computed, description: "Copied from Visit.duration_minutes at reservation; defines interval end = start + duration; contributes to tech scheduled_minutes" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CONFIRMED | RELEASED; RELEASED frees the interval and the conserved minutes" }

  # ---------------------------------------------------------------------------
  - name: WeatherWindow
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; route this forecast window covers" }
      - { name: window_start_utc, type: datetime, source: input, description: "ISO8601 UTC; inclusive start of the closed forecast interval [start,end]" }
      - { name: window_end_utc, type: datetime, source: input, description: "ISO8601 UTC; inclusive end of the closed forecast interval [start,end]; must be > start" }
      - { name: wind_mph, type: integer, source: input, description: "Forecast sustained wind speed in mph; integer >= 0; soft-wash blocked when >= MAX_WIND" }
      - { name: condition, type: enum, source: computed, default: "CLEAR", description: "CLEAR | BLOCKED; BLOCKED when wind_mph >= MAX_WIND or precip flagged" }
      - { name: precip_flag, type: boolean, source: input, default: false, description: "True if rain/precipitation forecast inside the window; forces condition BLOCKED" }

  # ---------------------------------------------------------------------------
  - name: PhotoSet
    parent: Visit
    common_fields: false   # id, created_at only (append-only evidence record)
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; visit documented" }
      - { name: phase, type: enum, source: input, description: "BEFORE | AFTER; BEFORE required to start work, AFTER required to complete" }
      - { name: photo_url, type: string, source: input, description: "Storage URL of the uploaded image" }

  # ---------------------------------------------------------------------------
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the single completed visit this invoice bills (per-visit billing)" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; copied from the visit's property owner at issuance" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Visit.final_cost_cents minus loyalty_discount_cents; 0 for re-clean visits (reclean_of_visit_id not null)" }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "invoice_loyalty_discount applied at issuance from the plan's visits_generated_count tier" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | PAID | DISPUTED | VOIDED; DISPUTED & VOIDED branch off ISSUED" }

  # ---------------------------------------------------------------------------
  - name: SatisfactionClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the COMPLETED visit the customer is dissatisfied with" }
      - { name: reason, type: string, source: input, description: "Free-text dissatisfaction reason" }
      - { name: reclean_visit_id, type: string, source: system, description: "FK -> Visit.id; the free re-clean Visit spawned on approval; null until APPROVED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | APPROVED | REJECTED; APPROVED spawns a free re-clean and flips the source visit to RECLEAN_REQUESTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: ServiceQuote
    field: status
    initial_state: DRAFT
    terminal_states: [DECLINED, SUPERSEDED]
    # Cyclic shape: SENT → DRAFT → SENT (revision loop).
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: Dispatcher
        preconditions:
          - "Quote has >= 1 QuoteLineItem (ERR_QUOTE_EMPTY) — boundary: empty line-item set"
          - "Quote.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute subtotal_cents, travel_surcharge_cents, total_cents (quote_total) and freeze them on the quote"

      - from: SENT
        to: DRAFT
        trigger: "POST /quotes/{id}/revise"
        actor: Dispatcher
        preconditions:
          - "Quote.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Quote reopened for line-item edits; subtotal/total cleared to recompute on next send"
        note: "Revision loop — completes the SENT→DRAFT→SENT cycle."

      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == SENT (ERR_INVALID_STATE)"
          - "Acting Customer owns the quote's Property (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Quote becomes eligible to back Visits and RecurringPlans"

      - from: SENT
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Customer
        preconditions:
          - "Quote.status == SENT (ERR_INVALID_STATE)"
        side_effects: []

      - from: [DRAFT, SENT, ACCEPTED]
        to: SUPERSEDED
        trigger: "system (a newer ServiceQuote is created for the same Property)"
        actor: system
        preconditions:
          - "A newer ServiceQuote was created on the same property_id"
        side_effects:
          - "Prior non-terminal quote on the property → SUPERSEDED; increments Property.version by 1"
        note: "Drives the OCC supersede race quote-create-stale-property."

  # ---------------------------------------------------------------------------
  - entity: Visit
    field: status
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    # Cyclic shape: COMPLETED → RECLEAN_REQUESTED → (new re-clean Visit) and
    # a one-off visit may be re-scheduled SCHEDULED → REQUESTED on weather block.
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /visits/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Visit.status == REQUESTED (ERR_INVALID_STATE)"
          - "A WeatherWindow on Visit.route_id with condition==CLEAR covers Visit.scheduled_date (ERR_NO_CLEAR_WEATHER) — cross-entity: Visit depends on WeatherWindow.condition"
          - "expected_visit_version matches Visit.version (ERR_STALE_VERSION)"
        side_effects:
          - "Set provisional_cost_cents from the backing quote's total_cents (visit_provisional_cost)"
          - "increments Visit.version by 1"

      - from: SCHEDULED
        to: REQUESTED
        trigger: "POST /visits/{id}/unschedule"
        actor: Dispatcher
        preconditions:
          - "Visit.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "All RESERVED/CONFIRMED CrewAssignments for this visit → RELEASED (each release frees tech interval and decrements Technician.scheduled_minutes)"
          - "Clear provisional_cost_cents to null"
        note: "Re-schedule loop when a window turns BLOCKED."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /visits/{id}/start"
        actor: FieldTech
        preconditions:
          - "Visit.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Visit has >= 1 CrewAssignment in CONFIRMED status (ERR_NO_CONFIRMED_CREW)"
          - "A BEFORE PhotoSet exists for the visit (ERR_BEFORE_PHOTO_MISSING)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: FieldTech
        preconditions:
          - "Visit.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "An AFTER PhotoSet exists for the visit (ERR_AFTER_PHOTO_MISSING)"
        side_effects:
          - "Set final_cost_cents from re_measured_sqft (visit_final_cost)"
          - "If plan_id not null: RecurringPlan.next_due_utc advances by cadence_days; visits_generated_count is unaffected"
          - "Visit becomes invoiceable"

      - from: COMPLETED
        to: RECLEAN_REQUESTED
        trigger: "system (a SatisfactionClaim on this visit is APPROVED)"
        actor: system
        preconditions:
          - "Visit.status == COMPLETED"
        side_effects:
          - "Spawn a new free re-clean Visit (reclean_of_visit_id = this visit; same property/scope; status REQUESTED)"
        note: "Cascade hop 2 of claim_approval_cascade; closes the COMPLETED→RECLEAN cycle."

      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel OR system (parent RecurringPlan cancelled)"
        actor: Dispatcher
        preconditions:
          - "Visit.status IN {REQUESTED, SCHEDULED} (ERR_INVALID_STATE)"
        side_effects:
          - "All RESERVED/CONFIRMED CrewAssignments for this visit → RELEASED (frees intervals and decrements Technician.scheduled_minutes)"
        note: "Cascade hops 2–3 of plan_cancel_cascade."

  # ---------------------------------------------------------------------------
  - entity: CrewAssignment
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /crew-assignments/{id}/confirm"
        actor: Dispatcher
        preconditions:
          - "CrewAssignment.status == RESERVED (ERR_INVALID_STATE)"
          - "Technician.insurance_status == ACTIVE (ERR_TECH_NOT_ASSIGNABLE) — cross-entity: CrewAssignment depends on Technician state"
        side_effects: []

      - from: [RESERVED, CONFIRMED]
        to: RELEASED
        trigger: "POST /crew-assignments/{id}/release OR system (parent Visit unscheduled/cancelled)"
        actor: Dispatcher
        preconditions:
          - "CrewAssignment.status IN {RESERVED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "Free the technician interval; decrement Technician.scheduled_minutes by this assignment's duration_minutes (tech_minutes_conserved invariant)"

  # ---------------------------------------------------------------------------
  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    # Branching shape: ISSUED → {PAID, DISPUTED, VOIDED}; DISPUTED → VOIDED or PAID.
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingAdmin
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute Customer.outstanding_balance_cents (PAID invoices drop out of the sum)"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: Customer
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVALID_STATE)"
          - "Acting Customer owns the invoice (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Customer.outstanding_balance_cents unchanged (DISPUTED stays in the sum)"

      - from: [ISSUED, DISPUTED]
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "Invoice.status IN {ISSUED, DISPUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "Linked Visit.billing_status → VOIDED (cascade hop 2 of invoice_void_cascade)"
          - "Recompute Customer.outstanding_balance_cents — drops this invoice's amount_due_cents (cascade hop 3); leaves balance equal to its pre-issuance value (invoice_balance_conserved invariant)"

      - from: DISPUTED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingAdmin
        preconditions:
          - "Invoice.status == DISPUTED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute Customer.outstanding_balance_cents (PAID invoices drop out of the sum)"

  # ---------------------------------------------------------------------------
  - entity: SatisfactionClaim
    field: status
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /satisfaction-claims/{id}/approve"
        actor: Dispatcher
        preconditions:
          - "SatisfactionClaim.status == OPEN (ERR_INVALID_STATE)"
          - "Linked Visit.status == COMPLETED (ERR_INVALID_STATE) — cross-entity: claim approval depends on Visit state"
        side_effects:
          - "Spawn a free re-clean Visit (reclean_of_visit_id = claim.visit_id) and set reclean_visit_id (cascade hop 1 of claim_approval_cascade)"
          - "Source Visit COMPLETED → RECLEAN_REQUESTED (cascade hop 2)"

      - from: OPEN
        to: REJECTED
        trigger: "POST /satisfaction-claims/{id}/reject"
        actor: Dispatcher
        preconditions:
          - "SatisfactionClaim.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: RecurringPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "RecurringPlan.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All REQUESTED/SCHEDULED Visits under this plan → CANCELLED (cascade hop 2 of plan_cancel_cascade)"
          - "Each cancelled Visit's RESERVED/CONFIRMED CrewAssignments → RELEASED, decrementing Technician.scheduled_minutes (hop 3)"
        note: "Depth-3 cascade origin: plan → visits → assignments → tech minutes."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quote-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /quotes"
    occ_field: "expected_property_version"
    description: |
      Creating a ServiceQuote against a Property whose version has advanced since
      the client last observed it is rejected. Creating a new quote legitimately
      supersedes the prior non-terminal quote on that property (setting it
      SUPERSEDED and bumping Property.version); a create that still carries the
      pre-supersede property version observed a stale view and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 2(a): combinatorial, >=3 inputs, nested min/max + tiered -----------
  - name: chemical_dose
    trigger: "QuoteLineItem creation (POST /quotes/{id}/line-items)"
    algorithm: tiered_pricing
    formula: |
      # Three inputs: measured_sqft, service_type (base concentration), soiling_level (tier).
      base_oz_per_100sqft = BASE_OZ[line.service_type]          # ROOF_SOFT_WASH=6, HOUSE_WASH=3, CONCRETE_CLEAN=4
      tier_mult           = SOIL_MULT[quote.soiling_level]       # LIGHT=0.8, MODERATE=1.0, HEAVY=1.4
      raw_oz = (measured_sqft / 100.0) * base_oz_per_100sqft * tier_mult
      # Clamp into the safe mix band, then never below the priming minimum:
      chemical_dose_oz = max(MIN_PRIME_OZ, min(raw_oz, MAX_TANK_OZ))
      # round_half_up to 1 decimal place
    input_set: "Single QuoteLineItem at creation; uses parent quote.soiling_level."
    constants:
      BASE_OZ: { ROOF_SOFT_WASH: 6, HOUSE_WASH: 3, CONCRETE_CLEAN: 4 }
      SOIL_MULT: { LIGHT: 0.8, MODERATE: 1.0, HEAVY: 1.4 }
      MIN_PRIME_OZ: 8.0
      MAX_TANK_OZ: 320.0
    precision: "1 decimal place, round_half_up"

  # --- Rule 2(b): combinatorial, nested rounding order pinned ------------------
  - name: quote_line_total
    trigger: "QuoteLineItem creation (POST /quotes/{id}/line-items)"
    algorithm: tiered_pricing
    formula: |
      surface_rate_cents_per_sqft = SURFACE_RATE[line.surface_type]  # ROOF=22, SIDING=15, CONCRETE=11 (cents/sqft)
      service_mult                = SERVICE_MULT[line.service_type]   # ROOF_SOFT_WASH=1.25, HOUSE_WASH=1.0, CONCRETE_CLEAN=1.1
      story_mult                  = 1.0 + HEIGHT_STEP * (property.stories - 1)   # HEIGHT_STEP=0.10 per story above the first
      raw_line = line.measured_sqft * surface_rate_cents_per_sqft * service_mult * story_mult
      line_total_cents = round_half_up(raw_line)   # ROUND PER LINE ITEM to whole cents, BEFORE summing into the quote
    input_set: "Single QuoteLineItem; reads the line's parent quote's property.stories."
    constants:
      SURFACE_RATE: { ROOF: 22, SIDING: 15, CONCRETE: 11 }
      SERVICE_MULT: { ROOF_SOFT_WASH: 1.25, HOUSE_WASH: 1.0, CONCRETE_CLEAN: 1.1 }
      HEIGHT_STEP: 0.10
    precision: "whole cents, round_half_up; ROUNDING ORDER PINNED: round each line_total_cents first, THEN sum into subtotal_cents (never sum raw then round)"

  # --- subtotal + Rule 2(b) ordering + Rule 2(c)-adjacent travel surcharge ------
  - name: quote_total
    trigger: "POST /quotes/{id}/send (freezes the quote totals)"
    algorithm: aggregation
    formula: |
      # Step 1 — subtotal: sum of the already-rounded per-line totals.
      subtotal_cents = sum(li.line_total_cents for li in QuoteLineItems where quote_id == quote.id)   # each li.line_total_cents already rounded per quote_line_total
      # Step 2 — travel surcharge is computed AFTER subtotal (it reads the subtotal tier); see quote_travel_surcharge.
      travel_surcharge_cents = quote_travel_surcharge(subtotal_cents)
      # Step 3 — total.
      total_cents = subtotal_cents + travel_surcharge_cents
    input_set: "All QuoteLineItems for the quote at send time."
    precision: "whole cents; evaluation order pinned: subtotal → travel_surcharge → total"

  - name: quote_travel_surcharge
    trigger: "POST /quotes/{id}/send (inside quote_total step 2)"
    algorithm: threshold
    formula: |
      # Circular-looking: total depends on surcharge, surcharge depends on the discount tier keyed on subtotal.
      # Pinned: surcharge is a function of subtotal_cents ONLY (never of total_cents), breaking the cycle.
      if   subtotal_cents >= LARGE_JOB_CENTS:  travel_surcharge_cents = 0          # large jobs ship free travel
      elif subtotal_cents >= MID_JOB_CENTS:    travel_surcharge_cents = FLAT_TRAVEL_CENTS / 2
      else:                                    travel_surcharge_cents = FLAT_TRAVEL_CENTS
      # round_half_up to whole cents (the /2 branch may be fractional)
    input_set: "Scalar subtotal_cents from quote_total step 1."
    constants:
      LARGE_JOB_CENTS: 5000000   # $50,000.00
      MID_JOB_CENTS: 1500000     # $15,000.00
      FLAT_TRAVEL_CENTS: 7500    # $75.00
    precision: "whole cents, round_half_up"
    note: "Boundary precision: subtotal_cents == MID_JOB_CENTS lands in the half-travel branch (>=), not the full-travel branch."

  # --- Rule 1 dual-variant A: visit cost (provisional vs final) ----------------
  - name: visit_provisional_cost
    trigger: "POST /visits/{id}/schedule"
    algorithm: forward_looking
    formula: |
      provisional_cost_cents = backing_quote.total_cents
      # backing_quote = Visit.quote_id if set, else RecurringPlan(plan_id).source_quote_id
    input_set: "Single backing ServiceQuote frozen total at schedule time (the ESTIMATE)."
    precision: "whole cents"
    variants:
      - name: provisional
        when: "At /schedule, before any on-site measurement exists"
        difference: "Uses the quote's frozen total_cents (estimate from quoted measured_sqft)."

  - name: visit_final_cost
    trigger: "POST /visits/{id}/complete"
    algorithm: chronological
    formula: |
      # ACTUAL cost re-derived from on-site re_measured_sqft supplied at completion.
      # Re-price each backing line at its actual measured area, round per line, then sum,
      # then add the same travel surcharge tier the backing quote used.
      for li in backing_quote line-items:
        actual_sqft = re_measured_sqft[li.surface_type]            # supplied in /complete payload
        raw = actual_sqft * SURFACE_RATE[li.surface_type] * SERVICE_MULT[li.service_type] * story_mult
        actual_line_cents = round_half_up(raw)                     # round per line
      actual_subtotal = sum(actual_line_cents)                     # then sum
      final_cost_cents = actual_subtotal + quote_travel_surcharge(actual_subtotal)
      # Re-clean visits (reclean_of_visit_id not null) are FREE: final_cost_cents = 0
    input_set: "On-site re_measured_sqft per surface at completion (the ACTUAL)."
    constants:
      SURFACE_RATE: { ROOF: 22, SIDING: 15, CONCRETE: 11 }
      SERVICE_MULT: { ROOF_SOFT_WASH: 1.25, HOUSE_WASH: 1.0, CONCRETE_CLEAN: 1.1 }
      HEIGHT_STEP: 0.10
    precision: "whole cents, round_half_up; same round-per-line-then-sum order as quote_line_total"
    variants:
      - name: final
        when: "At /complete, using actual re-measured areas"
        difference: "Re-prices on actual sqft; diverges from provisional whenever re_measured_sqft != quoted measured_sqft; 0 for re-clean visits."

  # --- Rule 1 dual-variant B: technician risk score (different domain) ---------
  - name: technician_risk_score
    trigger: "GET /technicians/{id}/risk-score?mode=projected|chronological"
    algorithm: weighted_scoring
    formula: |
      # Two valid approaches over the SAME technician data, different numbers (domain: Technician, not Visit/Invoice).
      # PROJECTED (forward-looking): weight the tech's current workload commitments plus current insurance risk.
      #   committed = count of CrewAssignments for this tech with status IN {RESERVED, CONFIRMED}
      #   projected = committed * LOAD_RISK + (UNINSURED_RISK if technician.insurance_status == EXPIRED else 0)
      # CHRONOLOGICAL (actual): replay only assignments that actually reached a COMPLETED visit, in completion
      #   order, applying a DECAY so older jobs count less; insurance penalty is excluded (it is a forward concern):
      #   ordered = CrewAssignments whose linked Visit.status == COMPLETED, sorted by Visit.updated_at ASC, then
      #             Visit.created_at ASC (NEVER by id)
      #   chronological = sum over ordered[k] of LOAD_RISK * (DECAY ^ k)        # k = 0 for the EARLIEST completion
      # Both variants clamp to [0, RISK_CEILING].
      score = min(RISK_CEILING, max(0, value))
    input_set: "CrewAssignments for the technician; PROJECTED filters status IN {RESERVED,CONFIRMED}; CHRONOLOGICAL filters CrewAssignments whose Visit.status==COMPLETED, ordered by Visit.updated_at ASC then Visit.created_at ASC."
    constants:
      LOAD_RISK: 20
      UNINSURED_RISK: 50
      DECAY: 0.5
      RISK_CEILING: 100
    precision: "integer, round_half_up after weighting"
    variants:
      - name: projected
        when: "mode=projected (default when mode omitted)"
        difference: "Forward-looking over committed (RESERVED/CONFIRMED) assignments; includes uninsured penalty; no decay."
      - name: chronological
        when: "mode=chronological"
        difference: "Replays only COMPLETED-visit assignments in completion order with geometric decay; excludes uninsured penalty; ignores RESERVED/CONFIRMED-only assignments."

  # --- Invoice loyalty discount (recurring plan) -------------------------------
  - name: invoice_loyalty_discount
    trigger: "POST /visits/{id}/complete (invoice auto-issued) — applied to Invoice.amount_due_cents"
    algorithm: threshold
    formula: |
      n = RecurringPlan(visit.plan_id).visits_generated_count if visit.plan_id else 0
      if   n >= 10: pct = 0.15
      elif n >= 5:  pct = 0.10
      elif n >= 2:  pct = 0.05
      else:         pct = 0.0
      loyalty_discount_cents = round_half_up(visit.final_cost_cents * pct)
      amount_due_cents       = max(0, visit.final_cost_cents - loyalty_discount_cents)
      # Re-clean visits: final_cost_cents == 0, so loyalty_discount_cents == 0 and amount_due_cents == 0.
    input_set: "Plan visits_generated_count tier; visit.final_cost_cents."
    constants:
      TIER_2_PCT: 0.05
      TIER_5_PCT: 0.10
      TIER_10_PCT: 0.15
    precision: "whole cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource IDs exist, validated left-to-right (parent before child)"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_ROUTE_NOT_FOUND / ERR_PROPERTY_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_VISIT_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_WEATHER_WINDOW_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource being mutated (Customer owns property/quote/invoice; FieldTech assigned to visit)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /quotes/{id}/accept, /decline; /invoices/{id}/dispute; visit start/complete by FieldTech"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: enums valid, integers within declared ranges (stories>=1, sqft>=0, measured_sqft>=1, cadence_days>=1, wind_mph>=0, window_end_utc > window_start_utc)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/update endpoints

  - priority: 6
    category: state
    check: "Target resource in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_constraint
    check: "Quote must hold >= 1 QuoteLineItem to be sent (empty-set boundary)"
    error_id: ERR_QUOTE_EMPTY
    http_status: 409
    applies_to: "POST /quotes/{id}/send"

  - priority: 8
    category: business_referential
    check: "A Visit/Plan may only reference an ACCEPTED ServiceQuote as its backing scope"
    error_id: ERR_QUOTE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /visits, POST /recurring-plans"

  - priority: 9
    category: business_temporal
    check: "WeatherWindow on the visit's route with condition==CLEAR covering scheduled_date (cross-entity: Visit→WeatherWindow)"
    error_id: ERR_NO_CLEAR_WEATHER
    http_status: 409
    applies_to: "POST /visits/{id}/schedule"

  - priority: 10
    category: business_temporal
    check: "WeatherWindow create must not overlap an existing window on the same route — CLOSED interval [start,end]; touching endpoints collide (route_window_overlap)"
    error_id: ERR_WEATHER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /weather-windows"

  - priority: 11
    category: business_safety
    check: "Assigned Technician.ladder_cert_max_stories >= Property.stories (ladder/height safety). Checked at RESERVE time (ladder is a physical-reach gate that must hold before a tech is put on the job)."
    error_id: ERR_TECH_NOT_ASSIGNABLE
    http_status: 403
    applies_to: "POST /crew-assignments"

  - priority: 12
    category: business_temporal
    check: "CrewAssignment interval must not overlap the technician's existing RESERVED/CONFIRMED intervals — HALF-OPEN [start,end) padded by Route.travel_buffer_minutes (tech_interval_overlap)"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 11.5
    category: business_safety
    check: "At CONFIRM time the Technician must be currently assignable: insurance_status == ACTIVE AND ladder_cert_max_stories >= Property.stories (insurance can lapse after reservation)"
    error_id: ERR_TECH_NOT_ASSIGNABLE
    http_status: 403
    applies_to: "POST /crew-assignments/{id}/confirm"

  - priority: 13
    category: business_fiscal
    check: "Issuing/scheduling for a Customer whose outstanding_balance_cents + this job's provisional/amount would exceed credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /visits/{id}/schedule"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_property_version must equal current Property.version on quote create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /quotes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Clock (test-driving; logical clock) ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is fixed at 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Dispatcher]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["Logical clock advances to to_iso8601 for all subsequent now() reads"]

  # ----- Customer ------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [Dispatcher]
    code: 201
    input: [full_name, email, "credit_limit_cents?"]
    output: Customer
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]

  - method: GET
    path: "/customers"
    description: "List Customers"
    roles: [Dispatcher, BillingAdmin]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a Customer (includes derived outstanding_balance_cents)"
    roles: [Dispatcher, BillingAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a Customer (blocks new quote/visit creation)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED"]

  # ----- Technician ----------------------------------------------------------
  - method: POST
    path: "/technicians"
    description: "Create a Technician"
    roles: [Dispatcher]
    code: 201
    input: [full_name, "ladder_cert_max_stories?", "insurance_status?"]
    output: Technician
    side_effects: ["scheduled_minutes=0"]

  - method: GET
    path: "/technicians"
    description: "List Technicians; filter by insurance_status"
    roles: [Dispatcher]
    code: 200
    input: ["insurance_status?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Get a Technician (includes derived scheduled_minutes)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: GET
    path: "/technicians/{id}/risk-score"
    description: "Computed read: technician_risk_score in projected or chronological mode"
    roles: [Dispatcher]
    code: 200
    input: ["mode?"]
    output: "{ risk_score: integer, mode: string }"
    side_effects: []

  # ----- Route ---------------------------------------------------------------
  - method: POST
    path: "/routes"
    description: "Create a Route / service zone"
    roles: [Dispatcher]
    code: 201
    input: [name, "travel_buffer_minutes?"]
    output: Route
    side_effects: []

  - method: GET
    path: "/routes/{id}"
    description: "Get a Route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: []

  # ----- Property ------------------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Create a Property for a Customer"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, route_id, address, stories, "roof_sqft?", "siding_sqft?", "concrete_sqft?"]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List Properties; filter by customer_id (FK reverse-reachability)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["customer_id?", "route_id?", "limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/properties/{id}"
    description: "Get a Property"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: Property
    side_effects: []

  # ----- ServiceQuote --------------------------------------------------------
  - method: POST
    path: "/quotes"
    description: "Create a ServiceQuote for a Property. OCC on Property.version; supersedes the prior non-terminal quote on the property."
    roles: [Dispatcher]
    code: 201
    input: [property_id, "soiling_level?", expected_property_version]
    output: ServiceQuote
    side_effects:
      - "status=DRAFT"
      - "Prior non-terminal ServiceQuote on the same property → SUPERSEDED"
      - "increments Property.version by 1"

  - method: GET
    path: "/quotes"
    description: "List ServiceQuotes; filter by property_id (FK reverse-reachability)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: "ServiceQuote[]"
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get a ServiceQuote (includes frozen subtotal/travel/total once SENT)"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/line-items"
    description: "Add a QuoteLineItem; computes chemical_dose_oz and line_total_cents"
    roles: [Dispatcher]
    code: 201
    input: [surface_type, service_type, measured_sqft]
    output: QuoteLineItem
    side_effects: ["chemical_dose_oz computed (chemical_dose); line_total_cents computed (quote_line_total)"]

  - method: GET
    path: "/quotes/{id}/line-items"
    description: "List QuoteLineItems for a quote (sub-resource; FK reverse-reachability)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuoteLineItem[]"
    side_effects: []

  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a DRAFT quote to the customer; freezes subtotal/travel/total"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["status → SENT", "quote_total freezes subtotal_cents, travel_surcharge_cents, total_cents"]

  - method: POST
    path: "/quotes/{id}/revise"
    description: "Return a SENT quote to DRAFT for edits (revision loop)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["status → DRAFT; frozen totals cleared"]

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts a SENT quote"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["status → ACCEPTED"]

  - method: POST
    path: "/quotes/{id}/decline"
    description: "Customer declines a SENT quote"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceQuote
    side_effects: ["status → DECLINED"]

  # ----- RecurringPlan -------------------------------------------------------
  - method: POST
    path: "/recurring-plans"
    description: "Create a RecurringPlan from an ACCEPTED quote"
    roles: [Dispatcher]
    code: 201
    input: [property_id, source_quote_id, cadence_days, start_utc]
    output: RecurringPlan
    side_effects: ["status=ACTIVE; next_due_utc=start_utc; visits_generated_count=0"]

  - method: GET
    path: "/recurring-plans"
    description: "List RecurringPlans; filter by property_id or source_quote_id (FK reverse-reachability)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["property_id?", "source_quote_id?", "limit?", "offset?"]
    output: "RecurringPlan[]"
    side_effects: []

  - method: GET
    path: "/recurring-plans/{id}"
    description: "Get a RecurringPlan"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []

  - method: POST
    path: "/recurring-plans/{id}/cancel"
    description: "Cancel a RecurringPlan; cascades to future visits"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RecurringPlan
    side_effects:
      - "status → CANCELLED (cascade hop 1 of plan_cancel_cascade)"
      - "All REQUESTED/SCHEDULED Visits under this plan → CANCELLED (hop 2)"
      - "Each cancelled Visit's RESERVED/CONFIRMED CrewAssignments → RELEASED, decrementing Technician.scheduled_minutes (hop 3)"

  - method: POST
    path: "/recurring-plans/{id}/generate-visit"
    description: "Generate the next due Visit under an ACTIVE plan (inherits source_quote scope)"
    roles: [Dispatcher]
    code: 201
    input: ["duration_minutes?"]
    output: Visit
    side_effects: ["new Visit (plan_id set, quote_id=plan.source_quote_id) status=REQUESTED; RecurringPlan.visits_generated_count += 1"]

  # ----- Visit ---------------------------------------------------------------
  - method: POST
    path: "/visits"
    description: "Create a one-off Visit for a Property against an ACCEPTED quote"
    roles: [Dispatcher]
    code: 201
    input: [property_id, quote_id, scheduled_date, "duration_minutes?"]
    output: Visit
    side_effects: ["status=REQUESTED; route_id copied from Property.route_id; billing_status=UNBILLED"]

  - method: GET
    path: "/visits"
    description: "List Visits; filter by property_id, quote_id, plan_id, route_id, or reclean_of_visit_id (FK reverse-reachability, including the self-referential re-clean link)"
    roles: [Dispatcher, Customer, FieldTech]
    code: 200
    input: ["property_id?", "quote_id?", "plan_id?", "route_id?", "reclean_of_visit_id?", "status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []

  - method: GET
    path: "/visits/{id}"
    description: "Get a Visit (includes provisional/final cost and billing_status)"
    roles: [Dispatcher, Customer, FieldTech]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{id}/schedule"
    description: "Schedule a REQUESTED visit; OCC on Visit.version; requires CLEAR weather and credit headroom"
    roles: [Dispatcher]
    code: 200
    input: [expected_visit_version]
    output: Visit
    side_effects: ["status → SCHEDULED; provisional_cost_cents set (visit_provisional_cost); increments Visit.version by 1"]

  - method: POST
    path: "/visits/{id}/unschedule"
    description: "Return a SCHEDULED visit to REQUESTED (e.g., weather turned BLOCKED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Visit
    side_effects: ["status → REQUESTED; all RESERVED/CONFIRMED CrewAssignments → RELEASED (decrement tech scheduled_minutes); provisional_cost_cents cleared"]

  - method: POST
    path: "/visits/{id}/start"
    description: "FieldTech starts work on a SCHEDULED visit"
    roles: [FieldTech]
    code: 200
    input: []
    output: Visit
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/visits/{id}/complete"
    description: "FieldTech completes a visit; supplies on-site re-measured areas; auto-issues an Invoice"
    roles: [FieldTech]
    code: 200
    input: [re_measured_roof_sqft, re_measured_siding_sqft, re_measured_concrete_sqft]
    output: Visit
    side_effects:
      - "status → COMPLETED; final_cost_cents set (visit_final_cost)"
      - "Auto-issue Invoice (status ISSUED; amount_due_cents via invoice_loyalty_discount); Visit.billing_status → BILLED"
      - "Recompute Customer.outstanding_balance_cents"
      - "If plan_id set: RecurringPlan.next_due_utc advances by cadence_days"

  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a REQUESTED/SCHEDULED visit"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Visit
    side_effects: ["status → CANCELLED; RESERVED/CONFIRMED CrewAssignments → RELEASED (decrement tech scheduled_minutes)"]

  - method: GET
    path: "/visits/{id}/photos"
    description: "List PhotoSets for a visit (sub-resource; FK reverse-reachability)"
    roles: [Dispatcher, Customer, FieldTech]
    code: 200
    input: ["phase?", "limit?", "offset?"]
    output: "PhotoSet[]"
    side_effects: []

  - method: POST
    path: "/visits/{id}/photos"
    description: "Upload a BEFORE or AFTER PhotoSet for a visit"
    roles: [FieldTech]
    code: 201
    input: [phase, photo_url]
    output: PhotoSet
    side_effects: []

  # ----- CrewAssignment ------------------------------------------------------
  - method: POST
    path: "/crew-assignments"
    description: "Reserve a technician for a visit; ladder/insurance safety + interval overlap checks"
    roles: [Dispatcher]
    code: 201
    input: [visit_id, technician_id, window_start_utc]
    output: CrewAssignment
    side_effects: ["status=RESERVED; duration_minutes copied from Visit; increment Technician.scheduled_minutes by duration_minutes"]

  - method: GET
    path: "/crew-assignments"
    description: "List CrewAssignments; filter by visit_id or technician_id (FK reverse-reachability)"
    roles: [Dispatcher]
    code: 200
    input: ["visit_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: "CrewAssignment[]"
    side_effects: []

  - method: GET
    path: "/crew-assignments/{id}"
    description: "Get a CrewAssignment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: POST
    path: "/crew-assignments/{id}/confirm"
    description: "Confirm a reserved assignment (re-checks tech assignability)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status → CONFIRMED"]

  - method: POST
    path: "/crew-assignments/{id}/release"
    description: "Release a reserved/confirmed assignment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status → RELEASED; decrement Technician.scheduled_minutes by duration_minutes"]

  # ----- WeatherWindow -------------------------------------------------------
  - method: POST
    path: "/weather-windows"
    description: "Create a forecast WeatherWindow on a route; closed-interval non-overlap on the route; condition derived"
    roles: [Dispatcher]
    code: 201
    input: [route_id, window_start_utc, window_end_utc, wind_mph, "precip_flag?"]
    output: WeatherWindow
    side_effects: ["condition computed: BLOCKED if wind_mph >= MAX_WIND (35) or precip_flag, else CLEAR"]

  - method: GET
    path: "/weather-windows"
    description: "List WeatherWindows; filter by route_id (FK reverse-reachability)"
    roles: [Dispatcher]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: "WeatherWindow[]"
    side_effects: []

  - method: GET
    path: "/weather-windows/{id}"
    description: "Get a WeatherWindow"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WeatherWindow
    side_effects: []

  # ----- Invoice -------------------------------------------------------------
  - method: GET
    path: "/invoices"
    description: "List Invoices; filter by visit_id or customer_id (FK reverse-reachability)"
    roles: [Dispatcher, BillingAdmin, Customer]
    code: 200
    input: ["visit_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an Invoice"
    roles: [Dispatcher, BillingAdmin, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an invoice PAID"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → PAID; recompute Customer.outstanding_balance_cents"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Customer disputes an ISSUED invoice"
    roles: [Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → DISPUTED; outstanding_balance_cents unchanged"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an ISSUED/DISPUTED invoice; reverses billing on the visit"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status → VOIDED (hop 1 of invoice_void_cascade)"
      - "Linked Visit.billing_status → VOIDED (hop 2)"
      - "Recompute Customer.outstanding_balance_cents — drops this invoice (hop 3); restores pre-issuance balance (invoice_balance_conserved)"

  # ----- SatisfactionClaim ---------------------------------------------------
  - method: POST
    path: "/satisfaction-claims"
    description: "Customer files a satisfaction claim against a COMPLETED visit"
    roles: [Customer]
    code: 201
    input: [visit_id, reason]
    output: SatisfactionClaim
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/satisfaction-claims"
    description: "List SatisfactionClaims; filter by visit_id (the disputed visit) or reclean_visit_id (the spawned re-clean visit) (FK reverse-reachability)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["visit_id?", "reclean_visit_id?", "status?", "limit?", "offset?"]
    output: "SatisfactionClaim[]"
    side_effects: []

  - method: GET
    path: "/satisfaction-claims/{id}"
    description: "Get a SatisfactionClaim"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: SatisfactionClaim
    side_effects: []

  - method: POST
    path: "/satisfaction-claims/{id}/approve"
    description: "Approve a claim; spawns a free re-clean visit"
    roles: [Dispatcher]
    code: 200
    input: []
    output: SatisfactionClaim
    side_effects:
      - "status → APPROVED; spawn free re-clean Visit (reclean_of_visit_id set), set reclean_visit_id (hop 1 of claim_approval_cascade)"
      - "Source Visit COMPLETED → RECLEAN_REQUESTED (hop 2)"

  - method: POST
    path: "/satisfaction-claims/{id}/reject"
    description: "Reject a claim"
    roles: [Dispatcher]
    code: 200
    input: []
    output: SatisfactionClaim
    side_effects: ["status → REJECTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting entity_backed user is not the owner of the targeted resource" }

  # --- Validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: bad enum, out-of-range integer, missing required field, or window_end_utc <= window_start_utc" }

  # --- Not Found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "ServiceQuote id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "RecurringPlan id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Visit id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CrewAssignment id does not exist" }
  - { id: ERR_WEATHER_WINDOW_NOT_FOUND, http: 404, condition: "WeatherWindow id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "SatisfactionClaim id does not exist" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is legal" }
  - { id: ERR_QUOTE_EMPTY, http: 409, condition: "Quote has zero QuoteLineItems and cannot be sent (empty-set boundary)" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 409, condition: "Backing quote for a Visit/Plan is not in ACCEPTED status" }
  - { id: ERR_NO_CONFIRMED_CREW, http: 409, condition: "Visit has no CONFIRMED CrewAssignment and cannot start" }
  - { id: ERR_BEFORE_PHOTO_MISSING, http: 409, condition: "No BEFORE PhotoSet exists; cannot start the visit" }
  - { id: ERR_AFTER_PHOTO_MISSING, http: 409, condition: "No AFTER PhotoSet exists; cannot complete the visit" }

  # --- Business: weather / scheduling ---
  - { id: ERR_NO_CLEAR_WEATHER, http: 409, condition: "No CLEAR WeatherWindow on the route covers the visit's scheduled_date" }
  - { id: ERR_WEATHER_WINDOW_OVERLAP, http: 409, condition: "New WeatherWindow's closed interval overlaps (incl. touching endpoints) an existing window on the same route" }

  # --- Business: safety ---
  - { id: ERR_TECH_NOT_ASSIGNABLE, http: 403, condition: "Technician ladder cert below property stories (at reserve), or insurance EXPIRED (at confirm)" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Technician interval (half-open, padded by route travel buffer) overlaps an existing RESERVED/CONFIRMED interval" }

  # --- Business: fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Customer outstanding_balance + this job's provisional cost would exceed credit_limit_cents" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_property_version does not match current Property.version on quote create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations role: builds quotes, schedules visits, manages routes/weather/crew, runs plans and claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /technicians — create technician"
      - "POST /routes — create route"
      - "POST /properties — create property"
      - "POST /quotes, /quotes/{id}/line-items, /send, /revise — build & send quotes"
      - "POST /recurring-plans, /cancel, /generate-visit — manage recurring plans"
      - "POST /visits, /schedule, /unschedule, /cancel — manage visits"
      - "POST /crew-assignments, /confirm, /release — staff visits"
      - "POST /weather-windows — record forecast windows"
      - "POST /satisfaction-claims/{id}/approve, /reject — adjudicate claims"
      - "GET /technicians/{id}/risk-score — read risk score"
    shared_operations:
      - "GET reads across customers, properties, quotes, visits, crew, weather, invoices, claims"

  - name: FieldTech
    description: "Crew member on site; starts/completes visits and uploads photos."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /visits/{id}/start — begin work"
      - "POST /visits/{id}/complete — finish work + on-site re-measure"
      - "POST /visits/{id}/photos — upload BEFORE/AFTER photos"
    shared_operations:
      - "GET /visits, /visits/{id}, /visits/{id}/photos"

  - name: Customer
    description: "Property owner; accepts/declines quotes, files & disputes claims/invoices."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/accept, /decline — decide on a quote"
      - "POST /satisfaction-claims — file a claim"
      - "POST /invoices/{id}/dispute — dispute an invoice"
    shared_operations:
      - "GET /properties, /quotes, /recurring-plans, /visits, /invoices, /satisfaction-claims (own resources)"

  - name: BillingAdmin
    description: "Finance role: invoice lifecycle and customer suspension."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{id}/pay — record payment"
      - "POST /invoices/{id}/void — void an invoice"
      - "POST /customers/{id}/suspend — suspend a customer"
    shared_operations:
      - "GET /customers, /invoices"
