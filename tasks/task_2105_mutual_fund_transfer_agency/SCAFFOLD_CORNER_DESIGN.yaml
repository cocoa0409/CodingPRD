            - "GET /share-classes/${sc_a}/nav-records returns total_count 0"

      - name: account_holder_cannot_capture_a_trade_on_another_account
        claim_type: ownership_denied
        grounds:
          - roles.AccountHolder.identity
          - "validations[priority=60]"
          - errors[ERR_ACCOUNT_OWNERSHIP_REQUIRED]
        distinguishing_aspect: "AccountHolder is entity_backed on ShareholderAccount, so an X-User-ID equal to account one's id may not capture a trade whose account_id is account two, and the call returns 403 ERR_ACCOUNT_OWNERSHIP_REQUIRED."
        test_recipe:
          setup:
            - "Class A, CA registration, two ACTIVE DIRECT/CA accounts, NAV 2026-08-03 at the 10.0000 seed and FINAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
