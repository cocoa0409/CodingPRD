            - "GET /ill/partners/${partner_id} reports lend_receivable_cents == 3200 — the face-value sum of the two OPEN charges, unaffected by the surcharge"
            - "${pv2} == ${pv1} + 2 — the first invoice draft and the second lending charge each bumped Partner.version"

      - name: standing_score_blocks_intake_at_forty_and_admits_at_thirty_nine
        claim_type: weighted_scoring
        grounds:
          - calculations.patron_standing_score
          - validations[priority=60]
          - errors[ERR_PATRON_STANDING_BLOCKED]
          - entities.Patron.fields.provisional_risk_score
          - endpoints[POST /ill/patrons/{id}/infraction-records]
        distinguishing_aspect: "The comparison against STANDING_BLOCK_THRESHOLD 40 is >=, so a patron whose weighted base is exactly 25 + 12 + 3 = 40 is refused at intake with ERR_PATRON_STANDING_BLOCKED while an otherwise identical patron at 25 + 12 + 2 = 39 is admitted — one 1000-cent unpaid unit is the whole difference."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron BLOCKY with historical infractions LOST 1 (W_LOST 25) and DAMAGED 1 (W_DAMAGED 12) and unpaid 3000 cents (3 units of UNPAID_UNIT_CENTS 1000), giving a weighted base of 40; unpaid_balance_cap_cents is 20000, so the fiscal rule at priority 80 is not violated."
            - "Patron ADMITY with the identical infractions but unpaid 2000 cents, giving 39."
            - "Neither patron holds a loan, so the in-flight and on-time-return terms are 0 and the provisional and final variants agree."
            - "Partner NORTHU on a single-entry LOAN rota and one BibItem with local_holding_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-BLOCKY", full_name: "Vic Blocky", email: "vic@u.edu", patron_type: "UNDERGRAD", department: "PSYC", unpaid_balance_cap_cents: 20000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { blocky_id: $.data.id }
            - call: "POST /ill/patrons/${blocky_id}/infraction-records"
              payload: { kind: "LOST", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${blocky_id}/infraction-records"
              payload: { kind: "DAMAGED", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${blocky_id}/infraction-records"
              payload: { kind: "UNPAID_CHARGE", unpaid_amount_cents: 3000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { blocky_prov: $.data.provisional_risk_score, blocky_final: $.data.final_risk_score, blocky_status: $.data.status }
            - call: "POST /ill/patrons"
              payload: { external_id: "P-ADMITY", full_name: "Wes Admity", email: "wes@u.edu", patron_type: "UNDERGRAD", department: "PSYC", unpaid_balance_cap_cents: 20000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { admity_id: $.data.id }
            - call: "POST /ill/patrons/${admity_id}/infraction-records"
              payload: { kind: "LOST", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${admity_id}/infraction-records"
              payload: { kind: "DAMAGED", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${admity_id}/infraction-records"
              payload: { kind: "UNPAID_CHARGE", unpaid_amount_cents: 2000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { admity_prov: $.data.provisional_risk_score }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Cognition and Memory", item_type: "BOOK", publication_year: 2017, isbn: "978-0-000-00045-5", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
