            - "After assign-contract (asset ACTIVE): patch create returns PatchJob.status == SCHEDULED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_double_book_with_travel_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
          - entities.Dispatch.fields.travel_buffer_minutes
        distinguishing_aspect: "Technician resource with buffered half-open intervals: a 2nd ONSITE dispatch starting 09:15 collides with the 08:00-09:00 dispatch's 30-min trailing buffer (busy to 09:30) and is rejected; a 09:45 start (after the buffer) is accepted."
        test_recipe:
          setup:
            - "Client + SILVER contract active; technician; ticket1 IN_PROGRESS with ONSITE dispatch 08:00-09:00; ticket2 IN_PROGRESS."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Omi", primary_contact_email: "o@omi.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "Val Tech", hourly_rate_cents: 9500 }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "t1" }
              as: ServiceManager
              captures: { ticket1: $.data.id }
            - call: "POST /tickets/${ticket1}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /tickets/${ticket1}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "ONSITE", scheduled_start: "2026-05-01T08:00:00Z", scheduled_end: "2026-05-01T09:00:00Z" }
              as: Dispatcher
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P2", subject: "t2" }
              as: ServiceManager
              captures: { ticket2: $.data.id }
            - call: "POST /tickets/${ticket2}/assign"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /tickets/${ticket2}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "ONSITE", scheduled_start: "2026-05-01T09:15:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
            - call: "POST /tickets/${ticket2}/dispatches"
              payload: { technician_id: "${tech_id}", mode: "ONSITE", scheduled_start: "2026-05-01T09:45:00Z", scheduled_end: "2026-05-01T10:30:00Z" }
              as: Dispatcher
              captures: { ok_status: $.data.status }
          assert:
            - "Dispatch at 09:15 (inside 09:00 end + 30m buffer): error_id == ERR_TECHNICIAN_DOUBLE_BOOKED"
            - "Dispatch at 09:45 (after buffer): Dispatch.status == SCHEDULED"

      - name: patch_window_overlap_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_PATCH_WINDOW_CONFLICT]
          - entities.PatchJob.fields.window_start
        distinguishing_aspect: "Asset resource with strict half-open intervals and NO buffer: a 2nd window 10:30-11:30 overlapping 10:00-11:00 is rejected, but a window starting exactly at 11:00 (adjacent, gap 0) is accepted — geometrically different from the buffered technician rule."
        test_recipe:
          setup:
            - "Client + SILVER contract active; site; asset ACTIVE; one SCHEDULED patch job 10:00-11:00."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Pi", primary_contact_email: "p@pi.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", label: "S", address: "4 Ash" }
              as: ServiceManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${client_id}", site_id: "${site_id}", asset_type: "LAPTOP", hostname: "lap-9" }
              as: ServiceManager
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/assign-contract"
              payload: { contract_id: "${contract_id}" }
              as: ServiceManager
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-05T10:00:00Z", window_end: "2026-05-05T11:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-05T10:30:00Z", window_end: "2026-05-05T11:30:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-05T11:00:00Z", window_end: "2026-05-05T12:00:00Z" }
              as: Dispatcher
              captures: { ok_status: $.data.status }
          assert:
            - "Window 10:30-11:30 (overlaps 10:00-11:00): error_id == ERR_PATCH_WINDOW_CONFLICT"
            - "Window 11:00-12:00 (adjacent, gap 0): PatchJob.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: seat_availability_conserved_assign_unassign
        grounds:
          - calculations.contract_seats_available
          - state_machines.Asset.UNMONITORED_to_ACTIVE
          - state_machines.Asset.ACTIVE_to_UNMONITORED
          - entities.Contract.fields.seats_available
        distinguishing_aspect: "Conserved quantity = integer seat availability: assign debits seats_available 5->4, unassign (the compensating action) credits it 4->5, restoring seats_available == seat_count with zero drift."
        test_recipe:
          setup:
            - "Client + SILVER contract active, seat_count 5; site; one UNMONITORED asset."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Rho", primary_contact_email: "r@rho.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", label: "S", address: "5 Fir" }
              as: ServiceManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${client_id}", site_id: "${site_id}", asset_type: "DESKTOP", hostname: "pc-9" }
              as: ServiceManager
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/assign-contract"
              payload: { contract_id: "${contract_id}" }
              as: ServiceManager
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ServiceManager
              captures: { sa_after_assign: $.data.seats_available }
            - call: "POST /assets/${asset_id}/unassign-contract"
              payload: {}
              as: ServiceManager
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ServiceManager
              captures: { sa_after_unassign: $.data.seats_available }
          assert:
            - "After assign: Contract.seats_available == 4"
            - "After unassign (compensating): Contract.seats_available == 5 == seat_count (no drift)"

      - name: client_credit_conserved_place_cancel
        grounds:
          - calculations.client_credit_available
          - state_machines.ProcurementOrder.DRAFT_to_PLACED
          - state_machines.ProcurementOrder.PLACED_to_CANCELLED
          - entities.Client.fields.credit_available_cents
        distinguishing_aspect: "Conserved quantity = monetary credit in cents (a different type from seats): place debits credit_available_cents by 733, cancel (the compensating action) refunds it, restoring credit_available_cents == credit_limit_cents."
        test_recipe:
          setup:
            - "Client credit_limit_cents 1000000; DRAFT procurement order total 733 (lines 333x1, 334x1, tax 0.10)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Sig", primary_contact_email: "s@sig.test", credit_limit_cents: 1000000 }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /procurement-orders"
              payload: { client_id: "${client_id}", line_items: [ { description: "cable", unit_price_cents: 333, qty: 1 }, { description: "clip", unit_price_cents: 334, qty: 1 } ], tax_rate: 0.10 }
              as: AccountManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /procurement-orders/${order_id}/place"
              payload: {}
              as: AccountManager
            - call: "GET /clients/${client_id}"
              payload: {}
              as: ServiceManager
              captures: { ca_after_place: $.data.credit_available_cents }
            - call: "POST /procurement-orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
            - call: "GET /clients/${client_id}"
              payload: {}
              as: ServiceManager
              captures: { ca_after_cancel: $.data.credit_available_cents }
          assert:
            - "After place: Client.credit_available_cents == 999267 (1000000 - 733)"
            - "After cancel (compensating): Client.credit_available_cents == 1000000 == credit_limit_cents (no drift)"
