      - name: visit_window_violation_beats_daily_capacity_exhaustion
        grounds: "§1.4 priority 37 (category business_temporal, ERR_VISIT_DATE_OUTSIDE_WINDOW) versus priority 40 (category business_constraint, ERR_RESEARCH_VISIT_DAILY_CAPACITY_EXCEEDED), both applying to POST /research-billing/subject-visits."
        distinguishing_aspect: "Category pair (business_temporal, business_constraint) - a third distinct pair. The request is both out of protocol window (visit 2's window is days 27-33 but the request lands on day 1) and blocked by an exhausted daily capacity for the study on 2026-09-02. The per-row temporal check outranks the aggregate capacity check, so the coordinator is told the date is wrong for that visit rather than that the day is full - the diagnosis a scheduler needs. An implementation that counts the day's load first (cheaper, since it needs no window arithmetic) returns the wrong code."
