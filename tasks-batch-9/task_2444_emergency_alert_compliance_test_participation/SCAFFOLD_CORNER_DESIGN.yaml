              as_user_id: adm-1
              payload: { state_code: "NE", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_b: "$.data.id" }
            - call: "POST /state-plans/${plan_b}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
