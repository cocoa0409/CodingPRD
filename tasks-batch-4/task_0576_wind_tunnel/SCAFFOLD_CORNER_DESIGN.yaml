      - name: flight_insufficient_minutes_on_staffed_session_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_MINUTES]", entities.Booking.fields.minutes_remaining]
        distinguishing_aspect: "On a STAFFED session, POST /flights with scheduled_minutes 5 > booking minutes 2 returns ERR_INSUFFICIENT_MINUTES."
        test_recipe:
          setup: ["A staffed session and a party-1 booking with only 2 minutes."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
