  - rule_id: transitive_cascade
    instances:
      - name: lease_expiry_cascades_oa_alteration_writeoff
        grounds:
          - state_machines.Lease.EXPIRING_to_EXPIRED
          - state_machines.OccupancyAgreement.ACTIVE_to_EXPIRED
          - state_machines.AlterationRequest.APPROVED_to_CANCELLED
          - entities.OccupancyAgreement.fields.terminal_writeoff_cents
          - calculations.space_inventory_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade fired by the clock sweep: lease EXPIRING -> EXPIRED
          (hop 1) forces the OA ACTIVE -> EXPIRED (hop 2), whose cascade
          CANCELS the in-flight APPROVED alteration (hop 3a) and accelerates
          the COMPLETED alteration's remaining amortization balance into
          terminal_writeoff_cents == 3,052,345 (exact balance after six
          applied monthly payments of 519,160 on 6,000,000 @ 7%/12), while
          the cancelled alteration's PENDING lump charge flips to REVERSED
          (hop 3b) and the leased-stock building's available_sf returns to
          200,000. Distinct trigger (clock sweep) from the reduction-execute
          instance.
