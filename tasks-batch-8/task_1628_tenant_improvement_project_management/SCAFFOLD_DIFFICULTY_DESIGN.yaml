              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-09-01T00:00:00Z", lease_term_months: 60, abatement_basis: "CALENDAR" }
