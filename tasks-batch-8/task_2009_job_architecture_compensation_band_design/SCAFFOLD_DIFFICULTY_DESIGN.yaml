            - "error_id != ERR_BAND_OVERLAP_EXCEEDS_POLICY although unrounded overlap 970000/1140000 == 0.8509 > 0.2500 (safety tier 8 beats constraint tier 12)"
            - "error_id != ERR_PROGRESSION_BELOW_POLICY although progression 0.0526 < 0.1200"
            - "PayBand.${band2}.status still PRICED"

  - rule_id: boundary_precision_check
    instances:
      - name: flsa_salary_basis_exact_threshold
        grounds:
          - validations[priority=8]
          - errors[ERR_FLSA_SALARY_BASIS_VIOLATION]
          - entities.JobProfile.fields.salary_basis_weekly_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on weekly salary cents via
          determine-flsa: exactly 68400 (== FLSA_WEEKLY_MINIMUM_CENTS) with
          duties passed classifies EXEMPT (>= passes), while 68399
          classifies NON_EXEMPT — one cent flips the outcome.
        test_recipe:
          setup: ["ENG family and level P1 exist; two DRAFT profiles differing only in salary_basis_weekly_cents"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "At Threshold", summary: "s", salary_basis_weekly_cents: 68400, duties_test_passed: true }, as: CompAnalyst, captures: { profA: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "One Cent Below", summary: "s", salary_basis_weekly_cents: 68399, duties_test_passed: true }, as: CompAnalyst, captures: { profB: $.data.id } }
          trigger:
            - { call: "POST /comp/job-profiles/${profA}/determine-flsa", payload: {}, as: CompAnalyst, captures: { clsA: $.data.flsa_classification } }
            - { call: "POST /comp/job-profiles/${profB}/determine-flsa", payload: {}, as: CompAnalyst, captures: { clsB: $.data.flsa_classification } }
          assert:
            - "68400 exactly: flsa_classification == EXEMPT (>= threshold passes)"
            - "68399: flsa_classification == NON_EXEMPT (one cent below fails the salary-basis test)"

      - name: price_with_empty_candidate_set
        grounds:
          - calculations.market_composite_pricing
          - errors[ERR_NO_MARKET_DATA]
        distinguishing_aspect: |
          Empty-collection boundary via the price endpoint (distinct metric
          and endpoint from the FLSA cents threshold): both variants reject
          with ERR_NO_MARKET_DATA when the candidate set is empty, and the
          band version must not advance on the failed calls.
        test_recipe:
          setup: ["ENG family, levels P1/P2, zone US-NAT, profile SWE2 APPROVED, program in PRICING; band created; NO market surveys or cuts exist"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band: $.data.id, band_v: $.data.version } }
          trigger:
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "PROVISIONAL", expected_pay_band_version: "${band_v}" }, as: CompAnalyst, captures: { err1: $.data.error_id } }
