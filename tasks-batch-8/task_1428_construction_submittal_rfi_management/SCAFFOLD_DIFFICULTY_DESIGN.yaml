  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_vs_fiscal_priority
        grounds:
          - "validations[priority=8]"
          - "validations[priority=13]"
          - "errors[ERR_ASSESSMENT_NOT_PRICED]"
          - "errors[ERR_CONTINGENCY_EXHAUSTED]"
