# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing on an endpoint that does not list Anonymous in its roles"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles"

  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "the path store_id does not resolve to a Store row"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a non-null id in the path or body does not resolve to a row of the declared entity type"

  - id: ERR_PARENT_MISMATCH
    http: 404
    condition: "a child id in a nested path does not belong to the store_id in the path"

  - id: ERR_BAY_NOT_FOUND
    http: 404
    condition: "bay_no falls outside 1..Store.load_bays_total inclusive for the owning store"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in any source state the requested transition declares"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target entity is already in one of its terminal_states"

  - id: ERR_POSTURE_FROZEN
    http: 409
    condition: "Store.attraction_posture == FROZEN blocks a session confirmation, check-in or service-order start"

  - id: ERR_POSTURE_RESTRICTED
    http: 409
    condition: "Store.attraction_posture == RESTRICTED blocks promotion of a WAITLIST_FALLBACK session"

  - id: ERR_WAIVER_REQUIRED
    http: 422
    condition: "a waiver-required attraction session or a boat-delivery-orientation release is submitted without a matching waiver_id"

  - id: ERR_WAIVER_EXPIRED
    http: 422
    condition: "the referenced LiabilityWaiver is not SIGNED, or its expires_on is earlier than the store clock's current instant"

  - id: ERR_LANE_CAPACITY_EXCEEDED
    http: 422
    condition: "an ARCHERY_LANE session requests lane_no above 12, or a SIMULATOR session requests lane_no above 6"

  - id: ERR_PERMIT_VERIFICATION_REQUIRED
    http: 422
    condition: "a TAXIDERMY intake lacks a permit_sale_id whose PermitSale is of type HUNTING or ARCHERY_RANGE and in status ISSUED or REMITTED"

  - id: ERR_RECEIVING_CROSS_CHECK_REQUIRED
    http: 422
    condition: "a fulfillment release carries an empty rm_cross_check_code, or one equal to the acting operator's X-User-ID"

  - id: ERR_NO_SHOW_STRIKE_LIMIT
    http: 422
    condition: "the member's effective no_show_strikes at the attraction is 3 or more at request time"

  - id: ERR_TITLE_STATE_MISMATCH
    http: 422
    condition: "the TitleFiling.state_code differs from the originating Store.state_code, or a LIEN_RELEASE filing targets a unit with no prior_title_no"

  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "a confirmed or in-progress session on the same attraction_id overlaps the requested half-open interval and the combined party size exceeds venue capacity"

  - id: ERR_BAY_BOOKING_CONFLICT
    http: 409
    condition: "another bay booking on the same store and bay_no overlaps the requested interval widened by the 15-minute turnover buffer"

  - id: ERR_EVENT_VENUE_CONFLICT
    http: 409
    condition: "a published event offering on the same attraction_id overlaps the requested interval with zero adjacency tolerance"

  - id: ERR_INVALID_SLOT_WINDOW
    http: 422
    condition: "slot_end_utc is not strictly after slot_start_utc, or booked_end_utc is not strictly after booked_start_utc"

  - id: ERR_DUPLICATE_STOCK_NO
    http: 409
    condition: "BoatUnit.stock_no already exists within the same store_id"

  - id: ERR_DUPLICATE_HIN
    http: 409
    condition: "BoatUnit.hull_id_no already exists within the same store_id"

  - id: ERR_DUPLICATE_MEMBER_EMAIL
    http: 409
    condition: "Member.email already exists within the same store_id"

  - id: ERR_FULFILLMENT_BLOCKED
    http: 409
    condition: "a service order cannot be scheduled while a linked OrderFulfillment is not in READY_FOR_RELEASE"

  - id: ERR_RIGGING_ALREADY_OPEN
    http: 409
    condition: "a second non-terminal RIGGING order exists for the same deal_id"

  - id: ERR_VENUE_CAPACITY_EXCEEDED
    http: 409
    condition: "Attraction.in_use_units plus the requested party_size exceeds Attraction.capacity_units"

  - id: ERR_REGISTRATION_CAP_EXCEEDED
    http: 409
    condition: "EventOffering.confirmed_count plus the requested seats exceeds registration_cap when registration_cap is greater than zero"

  - id: ERR_DWELL_BUDGET_EXCEEDED
    http: 409
    condition: "publishing an event would drive Store.dwell_free_minutes below zero"

  - id: ERR_EMPTY_REMIT_WINDOW
    http: 422
    condition: "the half-open remittance window contains no eligible PermitSale"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the sealing operator also recorded a sale in the batch, or the credit decision maker is the same operator who underwrote the application"

  - id: ERR_FUNDING_SHORTFALL
    http: 422
    condition: "the recorded funding amount is below the deal's current balance_due_cents"

  - id: ERR_BALANCE_OUTSTANDING
    http: 422
    condition: "settling a deal whose balance_due_cents is strictly greater than zero"

  - id: ERR_CREDIT_LIMIT_BELOW_FLOOR
    http: 422
    condition: "an approved club card application carries credit_limit_cents below 50000"

  - id: ERR_INVALID_TERM_DAYS
    http: 422
    condition: "PermitSale.term_days is below 1, or land_access_units is negative"

  - id: ERR_OUTSTANDING_DEPOSIT_REQUIRED
    http: 422
    condition: "a ServiceIntake advances to MATERIALS_ORDERED with deposit_cents below 5000"

  - id: ERR_TYPE_IMMUTABLE
    http: 422
    condition: "a write attempts to change ServiceIntake.specimen_quantity after MATERIALS_ORDERED, or TradeInAppraisal.appraised_at_utc at all"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, an enum member is invalid, or a numeric field is negative"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_<parent>_version does not equal the parent entity's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Anonymous
    description: "An unauthenticated walk-in guest of the destination store; may enrol as a club member and hold an attraction session or event seat without a login."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /stores/{store_id}/members"
      - "POST /stores/{store_id}/attraction-sessions"
      - "POST /stores/{store_id}/event-offerings/{offering_id}/registrations"
      - "GET /stores/{store_id}"
      - "GET /stores/attractions/{attraction_id}"
      - "GET /stores/event-offerings/{offering_id}"

  - name: Member
