        distinguishing_aspect: |
          Both violations are live on the same submit call: the solicitation is CLOSED (priority 22, 409)
          and the bid's 30,913,950-cent provisional price is above the 25,000,000-cent cap (priority 63,
          422 — deliberately the last check on submit). The lifecycle gate must win, and the control bid
          on a still-OPEN solicitation proves the cap check is genuinely reachable.
        test_recipe:
          setup:
            - "TYPE_C_CONV + ELEC-155 and the PUBLISHED CA 2026-2027 profile"
            - "Solicitation SOL-CA-003 for 12 units with price_cap_cents_per_unit 25,000,000, closed after the bid was drafted"
            - "Control Solicitation SOL-CA-004 with the same 25,000,000 cap, left OPEN"
