            - "the overlap set includes PENDING_SIGNATURE agreements — A1 was never signed"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two instances over DIFFERENT conserved
  # quantities (honey mass kg, money balance cents)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: honey_mass_conserved_across_approve_void
        grounds:
          - calculations.season_pool_and_reserve
          - state_machines.Harvest.RECORDED_to_APPROVED
          - state_machines.Harvest.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: honey mass (kg). Forward action (approve h3) and its compensating
          action (void h3) leave every allocation field identical: pool 10.000 -> 12.000 ->
          10.000, projected host 2.950 -> 3.540 -> 2.950; and at finalization the identity
          host_kg + reserve_kg + operator_kg == pool_net_kg holds exactly (2.950+0.500+6.550=10.000).
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; PLUS subscription paid; HOST-101 COMPLETED (effective 2950 bps)"
            - "One hive; h1 APPROVED net 4.000, h2 APPROVED net 6.000 (inspections verified 2026-06-01)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentyFive", email: "h25@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "25 Clover St", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "PLUS" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "HOST-101" }, as: Host, as_user_id: "${h}", captures: { en: $.data.id } }
            - { call: "POST /api/enrollments/${en}/complete", payload: { quiz_score: 89 }, as: PlatformOps }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-06-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-15T00:00:00Z", gross_kg: 4.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { h1: $.data.id } }
            - { call: "POST /api/harvests/${h1}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-16T00:00:00Z", gross_kg: 6.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { h2: $.data.id } }
            - { call: "POST /api/harvests/${h2}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/allocations", payload: { hive_id: "${hv}", season_id: "${s1}" }, as: PlatformOps, captures: { alloc: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-17T00:00:00Z", gross_kg: 2.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { h3: $.data.id } }
            - { call: "POST /api/harvests/${h3}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps, captures: { pool_fwd: $.data.projected_pool_net_kg, host_fwd: $.data.projected_host_kg } }
            - { call: "POST /api/harvests/${h3}/void", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps, captures: { pool_back: $.data.projected_pool_net_kg, host_back: $.data.projected_host_kg } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps }
          assert:
            - "forward: captured ${pool_fwd} == 12.000 and ${host_fwd} == 3.540 (2.950 + round3(2.000*0.295)=0.590)"
            - "compensating void restores exactly: captured ${pool_back} == 10.000 and ${host_back} == 2.950 — zero drift"
            - "final identity: host_kg 2.950 + reserve_kg 0.500 + operator_kg 6.550 == pool_net_kg 10.000"
            - "HoneyAllocation.${alloc}.edu_bonus_kg == 0.200 (round3(10.000*0.02)); reserve 0.300 + 0.200 == 0.500"

      - name: invoice_balance_conserved_across_issue_void
        grounds:
          - calculations.invoice_total
          - state_machines.Invoice.OPEN_to_VOID
          - entities.Host.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity: money balance (cents) — a different conserved quantity than honey
          mass. Rollover issuance adds exactly invoice2.total_cents to host balance_due_cents;
          the compensating void subtracts exactly the same amount, returning the balance to its
          pre-rollover value of 0.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; BASIC subscription ACTIVE; invoice1 (2999) PAID -> balance_due_cents == 0"
            - "Logical clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentySix", email: "h26@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { bal_before: $.data.balance_due_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-mid", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv2: "$.data[1].id" } }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { bal_after_issue: $.data.balance_due_cents } }
            - { call: "POST /api/invoices/${inv2}/void", payload: {}, as: PlatformOps, captures: { inv2_status: $.data.status } }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { bal_after_void: $.data.balance_due_cents } }
          assert:
            - "captured ${bal_before} == 0 (invoice1 PAID before rollover)"
            - "captured ${bal_after_issue} == 2999 (invoice2: fee 2999 + carried 0 + late 0 - credit 0; host owns no hives so no overwinter credit)"
            - "captured ${inv2_status} == VOID and ${bal_after_void} == 0 == ${bal_before} (issue/void pair conserves the balance exactly)"
            - "Subscription.${sub}.status == ACTIVE throughout (invoice1 was PAID, so no OVERDUE aging fired)"
