            - call: "POST /v1/finds-buys/${buy1}/activate"
              as: CategoryManager
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod_f2}", week_start_date: "2026-09-13", week_end_date: "2026-09-20", total_quantity: 5 }
              as: CategoryManager
              captures: { buy2: $.data.id, buy2_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy2}/allocations"
              payload: { expected_finds_buy_version: "${buy2_v}" }
              as: CategoryManager
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod_f2}", week_start_date: "2026-09-14", week_end_date: "2026-09-20", total_quantity: 5 }
              as: CategoryManager
              captures: { buy3: $.data.id, buy3_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy3}/allocations"
              payload: { expected_finds_buy_version: "${buy3_v}" }
              as: CategoryManager
            - call: "GET /v1/finds-buys/${buy1}/allocations"
              as: CategoryManager
              captures: { alloc1: "$.data[0].id" }
          trigger:
            - call: "POST /v1/finds-buys/${buy2}/activate"
              as: CategoryManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /v1/finds-buys/${buy3}/activate"
              as: CategoryManager
              captures: { ok_status: $.data.status }
            - call: "POST /v1/allocations/${alloc1}/clearance"
              payload: { clearance_markdown_pct: 0.30, clearance_start_date: "2026-09-13", clearance_end_date: "2026-09-19" }
              as: StoreManager
              as_user_id: ${store}
              captures: { err_gap: $.data.error_id }
          assert:
            - "buy2 activate rejected: error_id == ERR_SALE_WINDOW_CONFLICT, HTTP 409 (shared day 2026-09-13 counts as overlap under inclusive semantics)"
            - "buy3 (starting 2026-09-14) activate succeeds, status == ON_SALE"
            - "clearance starting 2026-09-13 rejected: error_id == ERR_CLEARANCE_GAP_VIOLATION (must be >= sale_end 09-13 + 1 day)"

  # =====================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cart_insert_return_conserve_liability
        grounds:
          - calculations.cart_coin_reconciliation
          - entities.Store.fields.coin_liability_cents
          - entities.Store.fields.coins_outstanding
        distinguishing_aspect: |
          Conserved quantity: coin liability cents. An INSERT of 5 coins followed
          by its compensating RETURN of 5 coins leaves
          Store.coins_outstanding == 0 and coin_liability_cents == 0 exactly;
          intermediate state must show 5 coins / 125 cents.
        test_recipe:
          setup:
            - "Store S1 exists with zero coin events"
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "INSERT", coin_count: 5 }
              as: StoreManager
              as_user_id: ${store}
            - call: "GET /v1/stores/${store}/cart-reconciliation"
              as: StoreManager
              as_user_id: ${store}
              captures: { mid_out: $.data.coins_outstanding, mid_liab: $.data.coin_liability_cents }
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "RETURN", coin_count: 5 }
              as: StoreManager
              as_user_id: ${store}
            - call: "GET /v1/stores/${store}/cart-reconciliation"
              as: StoreManager
              as_user_id: ${store}
              captures: { end_out: $.data.coins_outstanding, end_liab: $.data.coin_liability_cents }
          assert:
            - "after INSERT: coins_outstanding == 5 and coin_liability_cents == 125"
            - "after compensating RETURN: coins_outstanding == 0 and coin_liability_cents == 0 (invariant restored, no drift)"

      - name: claim_approve_rescind_conserve_refund_liability
        grounds:
          - state_machines.QualityClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.QualityClaim.APPROVED_to_RESCINDED
          - entities.Store.fields.refund_liability_cents
        distinguishing_aspect: |
          Conserved quantity: store refund liability cents (a different quantity
          than cart coins). Approve (+1047 liability) paired with its
          compensating rescind leaves Store.refund_liability_cents == 0 and
          refund_paid_cents == 0.
        test_recipe:
          setup:
            - "Category, product, store; DAMAGED claim (349 x 3) UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 3, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "DAMAGED" }
              as: CustomerServiceAgent
              captures: { cl: $.data.id }
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
          trigger:
            - call: "POST /v1/claims/${cl}/approve"
              as: CustomerServiceAgent
            - call: "GET /v1/stores/${store}"
              as: CustomerServiceAgent
              captures: { mid_liab: $.data.refund_liability_cents }
            - call: "POST /v1/claims/${cl}/rescind"
              as: CustomerServiceAgent
              captures: { cl_status: $.data.status }
            - call: "GET /v1/stores/${store}"
              as: CustomerServiceAgent
              captures: { end_liab: $.data.refund_liability_cents, end_paid: $.data.refund_paid_cents }
          assert:
            - "after approve: Store.refund_liability_cents == 1047"
            - "after compensating rescind: Store.refund_liability_cents == 0 and refund_paid_cents == 0"
            - "QualityClaim.${cl}.status == RESCINDED (terminal)"
