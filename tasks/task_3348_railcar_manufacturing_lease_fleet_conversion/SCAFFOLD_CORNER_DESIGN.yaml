          lease_fleet_car_id: ${car_id}
          lease_contract_id: ${lc_id}
          lessee_id: ${lessee_id}
          start_date: '2026-10-03'
          end_date: '2026-11-02'
          mileage_allowance: 1000
        as: LeaseAdministrator
        captures:
          asg2: $.data.id
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: ${car_id}
          car_assignment_id: ${asg2}
          return_date: '2026-11-02'
          mileage_since_last: 4500
          condition_grade: A
        as: LeaseAdministrator
        captures:
          ret2: $.data.id
          ret2_over: $.data.mileage_overage_cents
          ret2_status: $.data.settlement_status
      trigger:
      - call: GET /api/v1/lessees/${lessee_id}/outstanding-balance
        payload: {}
        as: PlatformAdmin
        captures:
          bal_out: $.data.outstanding_balance_cents
          bal_charges: $.data.settled_charges_cents
          bal_credits: $.data.credits_applied_cents
      assert:
      - 'The settled return contributed exactly its true-up: CarReturn.${ret1}.mileage_overage_cents ==
        ${ret1_over} == 18000 and settlement_status == ${ret1_status} == "SETTLED"'
      - 'The second placement was legal because the car was free again: LeaseFleetCar.${car_id}.status
        == ${car_held} == "HELD" before A2, and A2 starts 2026-10-03, two days after A1''s end_date 2026-10-01'
      - 'The PENDING return is large but excluded: CarReturn.${ret2}.mileage_overage_cents == ${ret2_over}
        == 42000 with settlement_status == ${ret2_status} == "PENDING"'
      - GET /lessees/${lessee_id}/outstanding-balance returns outstanding_balance_cents == ${bal_out}
        == 18000, i.e. only the SETTLED return's 18000 and not the PENDING 42000
      - settled_charges_cents == ${bal_charges} == 18000, the sum of SETTLED return charges
      - credits_applied_cents == ${bal_credits} == 0, because no sale writeback and no RETAINED-order
        credit has landed on this lessee
      - 18000 == max(0, mileage_used 2500 - ceil(30/30) * mileage_allowance 1000) * 12, and 42000 == max(0,
        4500 - 1000) * 12, so both figures are the §1.3 mileage_true_up_settlement literals
