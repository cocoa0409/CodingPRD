      - name: assignment_cycle_windows_are_closed_and_demand_one_clear_day
        grounds:
          - validations[priority=10][error_id=ERR_CYCLE_WINDOW_CONFLICT]
          - entities.AssignmentCycle.fields.window_start
          - entities.AssignmentCycle.fields.window_end
          - errors[ERR_CYCLE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          The other interval semantics: sibling AssignmentCycle windows of one PlanPeriod are CLOSED
          intervals that must be separated by at least one clear settlement day, so a window opening
          the day after the incumbent closes is refused even though the closed intervals do not
          share a single instant, and only a window opening two days later is accepted. Resource
          entity is the PlanPeriod, and mere adjacency is illegal here — the exact opposite of the
          vehicle policy-term rule.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. PlanPeriod 2026-P3 is OPEN over 2026-09-01 .. 2026-11-30."
            - "It already has one cycle with the closed window 2026-09-01 .. 2026-09-30, status SCHEDULED."
