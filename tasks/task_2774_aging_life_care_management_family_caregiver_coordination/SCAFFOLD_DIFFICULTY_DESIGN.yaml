        grounds:
          - state_machines.ConferenceDecision.RATIFIED_to_RESCINDED
          - state_machines.ServiceAuthorization.ACTIVE_to_TERMINATED
          - calculations.client_authorized_coverage_hours
          - calculations.client_risk_posture
          - entities.CarePlan.fields.coverage_gap_flag
