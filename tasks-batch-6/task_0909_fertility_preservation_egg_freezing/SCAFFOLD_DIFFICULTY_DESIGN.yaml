# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Fertility Preservation & Egg Freezing — 9 rules, 20 instances.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_cost_estimate_vs_final
        grounds:
          - calculations.cycle_cost
          - entities.StimulationCycle.fields.estimated_cost_cents
          - entities.StimulationCycle.fields.final_cost_cents
          - state_machines.StimulationCycle.DRAFT_to_SCHEDULED
          - state_machines.StimulationCycle.TRIGGERED_to_COMPLETED
        distinguishing_aspect: "On StimulationCycle, estimate projects EXPECTED_MONITORING_VISITS(5) and omits RETRIEVAL_FEE (=1225000) while final uses actual monitoring_visit_count(3) plus RETRIEVAL_FEE (=1575000); different entity domain than benefit_provisional_vs_settled."
        test_recipe:
          setup:
            - "Physician provider, retrieval room, tank capacity 10; eligible patient (amh 4.0, afc 20, age 30 -> yield 18 -> ANTAGONIST)."
            - "Cycle scheduled (estimate pinned), 3 monitoring visits logged, triggered, then retrieved."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr A", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR1", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T1", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P One", date_of_birth: "1994-03-01T00:00:00Z", email: "p1@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator, captures: { est: "$.data.estimated_cost_cents" } }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 12, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}", captures: { fin: "$.data.final_cost_cents" } }
          assert:
            - "StimulationCycle.${cyc_id}.estimated_cost_cents == 1225000"
            - "StimulationCycle.${cyc_id}.final_cost_cents == 1575000"
            - "StimulationCycle.${cyc_id}.estimated_cost_cents != StimulationCycle.${cyc_id}.final_cost_cents"

      - name: benefit_provisional_vs_settled
        grounds:
          - calculations.benefit_coverage_applied
          - entities.Invoice.fields.estimated_coverage_cents
          - entities.Invoice.fields.settled_coverage_cents
          - state_machines.Invoice.DRAFT_to_FINALIZED
        distinguishing_aspect: "On BenefitCoverage/Invoice, invoice B's provisional coverage (=40000, cap seen at draft) diverges from settled coverage (=30000, cap reduced by an intervening finalized claim); different entity domain than cycle_cost."
        test_recipe:
          setup:
            - "Patient with employer BenefitCoverage cap 40000, covered_pct 0.5, covers CYCLE."
            - "Invoice B (subtotal 100000) drafted while cap full; then Invoice A (subtotal 20000) finalized consuming 10000; then finalize B."
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P Two", date_of_birth: "1992-01-01T00:00:00Z", email: "p2@x.com", employer_name: "Acme" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /benefit-coverages", payload: { patient_id: "${p_id}", employer_name: "Acme", annual_cap_cents: 40000, covered_pct: 0.5, covered_service_types: ["CYCLE"] }, as: BillingAdmin, captures: { ben_id: "$.data.id" } }
            - { call: "POST /invoices", payload: { patient_id: "${p_id}", service_type: "CYCLE", line_items: [ { description: "stim", amount_cents: 100000 } ] }, as: BillingAdmin, captures: { invB: "$.data.id", est_b: "$.data.estimated_coverage_cents" } }
            - { call: "POST /invoices", payload: { patient_id: "${p_id}", service_type: "CYCLE", line_items: [ { description: "labs", amount_cents: 20000 } ] }, as: BillingAdmin, captures: { invA: "$.data.id" } }
            - { call: "POST /invoices/${invA}/finalize", payload: {}, as: BillingAdmin }
          trigger:
            - { call: "POST /invoices/${invB}/finalize", payload: {}, as: BillingAdmin, captures: { set_b: "$.data.settled_coverage_cents" } }
          assert:
            - "Invoice.${invB}.estimated_coverage_cents == 40000"
            - "Invoice.${invB}.settled_coverage_cents == 30000"
            - "Invoice.${invB}.estimated_coverage_cents != Invoice.${invB}.settled_coverage_cents"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: expected_oocyte_yield_age_tiered
        grounds:
          - calculations.expected_oocyte_yield
          - entities.Consultation.fields.expected_oocyte_yield
          - state_machines.Consultation.REQUESTED_to_COMPLETED
        distinguishing_aspect: "Mode (a): 3 inputs (amh 1.0, afc 8, age 39) with a non-linear age_multiplier branch (0.65 for 38<=age<41) plus floor and min/max clamp => yield 3, INELIGIBLE-boundary safe, MINIMAL_STIM."
        test_recipe:
          setup:
            - "Patient consulted at age 39 with amh 1.0, afc 8."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr B", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Three", date_of_birth: "1987-06-01T00:00:00Z", email: "p3@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 39, amh_level: 1.0, antral_follicle_count: 8 }, as: Coordinator, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { y: "$.data.expected_oocyte_yield" } }
          assert:
            - "Consultation.${c_id}.expected_oocyte_yield == 3"
            - "Consultation.${c_id}.eligibility_status == ELIGIBLE"
            - "Consultation.${c_id}.recommended_protocol == MINIMAL_STIM"

      - name: storage_renewal_fee_per_specimen_rounding
        grounds:
          - calculations.storage_renewal_fee
          - entities.StorageSubscription.fields.annual_fee_cents
          - state_machines.StorageSubscription.ACTIVE_to_PAST_DUE
        distinguishing_aspect: "Mode (b): rounding order pinned — round_half_up(4000*(1-0.0333))=3867 PER specimen, then *10 = 38670; the sum-then-round alternative (=38668) is wrong."
        test_recipe:
          setup:
            - "Eligible patient with an ACTIVE storage subscription; a retrieval cryopreserves 10 specimens (specimen_count 10); clock advanced past period end; renew."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr C", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR2", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T2", capacity_slots: 20 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Four", date_of_birth: "1994-03-01T00:00:00Z", email: "p4@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions/${sub_id}/record-payment", payload: {}, as: BillingAdmin }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 15, mature_oocyte_count: 10, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /storage-subscriptions/${sub_id}/renew", payload: {}, as: BillingAdmin, captures: { fee: "$.data.annual_fee_cents" } }
          assert:
            - "StorageSubscription.${sub_id}.specimen_count == 10"
            - "StorageSubscription.${sub_id}.annual_fee_cents == 38670"
            - "StorageSubscription.${sub_id}.status == PAST_DUE"

      - name: invoice_total_tiered_facility_fee_circular
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.facility_fee_cents
          - entities.Invoice.fields.total_due_cents
          - state_machines.Invoice.DRAFT_to_FINALIZED
        distinguishing_aspect: "Mode (c): facility_pct is keyed on the subtotal tier (0.05 for subtotal 100000 < 500000) so evaluation order subtotal->tier->fee->coverage->total is forced; total_due = 100000 + 5000 - 40000 = 65000."
        test_recipe:
          setup:
            - "Patient with BenefitCoverage cap 40000, covered_pct 0.5, covers CYCLE; draft one CYCLE invoice subtotal 100000."
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P Five", date_of_birth: "1990-01-01T00:00:00Z", email: "p5@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /benefit-coverages", payload: { patient_id: "${p_id}", employer_name: "Beta", annual_cap_cents: 40000, covered_pct: 0.5, covered_service_types: ["CYCLE"] }, as: BillingAdmin, captures: { ben_id: "$.data.id" } }
          trigger:
            - { call: "POST /invoices", payload: { patient_id: "${p_id}", service_type: "CYCLE", line_items: [ { description: "stim cycle", amount_cents: 100000 } ] }, as: BillingAdmin, captures: { inv_id: "$.data.id" } }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 100000"
            - "Invoice.${inv_id}.facility_fee_cents == 5000"
            - "Invoice.${inv_id}.estimated_coverage_cents == 40000"
            - "Invoice.${inv_id}.total_due_cents == 65000"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_monitoring_suspend_resume_cycle
        grounds:
          - state_machines.StimulationCycle.MONITORING_to_SUSPENDED
          - state_machines.StimulationCycle.SUSPENDED_to_MONITORING
          - entities.StimulationCycle.fields.status
        distinguishing_aspect: "StimulationCycle revisits MONITORING via MONITORING->SUSPENDED->MONITORING (cycle), not a linear pipeline; a different entity than the subscription cycle."
        test_recipe:
          setup:
            - "Cycle scheduled and moved to MONITORING by its first appointment."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr D", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Six", date_of_birth: "1993-01-01T00:00:00Z", email: "p6@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 31, amh_level: 3.0, antral_follicle_count: 16 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/suspend", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/resume", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { st: "$.data.status" } }
          assert:
            - "StimulationCycle.${cyc_id}.status == MONITORING"

      - name: subscription_active_pastdue_active_cycle
        grounds:
          - state_machines.StorageSubscription.ACTIVE_to_PAST_DUE
          - state_machines.StorageSubscription.PAST_DUE_to_ACTIVE
          - entities.StorageSubscription.fields.status
        distinguishing_aspect: "StorageSubscription revisits ACTIVE via ACTIVE->PAST_DUE->ACTIVE (renewal cycle); a different entity than the stimulation cycle."
        test_recipe:
          setup:
            - "Subscription activated (period 2026-05-01..2027-05-01); clock advanced past period end and renewed to PAST_DUE, then paid within grace."
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P Seven", date_of_birth: "1991-01-01T00:00:00Z", email: "p7@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions/${sub_id}/record-payment", payload: {}, as: BillingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storage-subscriptions/${sub_id}/renew", payload: {}, as: BillingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /storage-subscriptions/${sub_id}/record-payment", payload: {}, as: BillingAdmin, captures: { st: "$.data.status" } }
          assert:
            - "StorageSubscription.${sub_id}.status == ACTIVE"

      - name: thaw_authorization_branching_forkjoin
        grounds:
          - state_machines.ThawTransferAuthorization.REQUESTED_to_AUTHORIZED
          - state_machines.ThawTransferAuthorization.REQUESTED_to_DENIED
          - state_machines.CryoSpecimen.STORED_to_RESERVED
        distinguishing_aspect: "ThawTransferAuthorization forks from REQUESTED: the AUTHORIZED branch reserves specimens (STORED->RESERVED) while the DENIED branch leaves them STORED — divergent side-effect sets."
        test_recipe:
          setup:
            - "Patient with 2 STORED specimens, ACTIVE consent + disposition directives; two physicians (requester != authorizer)."
            - "auth1 authorized (reserves specimen 0); auth2 requested over specimen 1."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr E1", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Dr E2", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys2: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR3", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T3", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Eight", date_of_birth: "1994-03-01T00:00:00Z", email: "p8@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 8, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { s0: "$.data[0].id", s1: "$.data[1].id" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s1}"], transfer_type: "RESEARCH_DONATION" }, as: Physician, as_user_id: "${phys1}", captures: { auth2: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth2}/deny", payload: {}, as: Physician, as_user_id: "${phys2}", captures: { st: "$.data.status" } }
          assert:
            - "ThawTransferAuthorization.${auth1}.status == AUTHORIZED"
            - "ThawTransferAuthorization.${auth2}.status == DENIED"
            - "CryoSpecimen.${s0}.status == RESERVED"
            - "CryoSpecimen.${s1}.status == STORED"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: retrieval_complete_cascade_depth3
        grounds:
          - state_machines.StimulationCycle.TRIGGERED_to_COMPLETED
          - state_machines.CryoSpecimen.STORED_to_RESERVED
          - entities.StorageTank.fields.used_slots
          - entities.StorageTank.fields.is_full
          - entities.StorageSubscription.fields.specimen_count
        distinguishing_aspect: "Trigger=retrieve: hop1 create CryoSpecimen(STORED) -> hop2 increment StorageTank.used_slots -> hop3 used_slots>=capacity flips StorageTank.is_full; each hop caused by the previous (depth 3)."
        test_recipe:
          setup:
            - "Eligible patient with ACTIVE subscription; tank capacity exactly 2; cycle triggered."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr F", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR4", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T4", capacity_slots: 2 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Nine", date_of_birth: "1994-03-01T00:00:00Z", email: "p9@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions/${sub_id}/record-payment", payload: {}, as: BillingAdmin }
