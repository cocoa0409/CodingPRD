          difficulty_instance: settlement_provisional_vs_final_payment
          rationale: "Variant divergence with pinned literals is asserted in §1.8 (also per_diem_full_week_vs_actual_days)."
      - name: calc_rounding_order_covered_by_difficulty
        claim_type: precision
        grounds: [calculations.calc_per_diem, calculations.calc_crew_call_pay]
        excluded_because:
          difficulty_instance: per_diem_half_day_rounding_order_mode_b
          rationale: "Rounding-order precision pinned with literal cent values in §1.8."
      - name: calc_royalty_boundaries_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.calc_licensor_royalty]
        excluded_because:
          difficulty_instance: royalty_tier_threshold_exact
          rationale: "Tier-threshold == boundary and marginal-vs-flat ambiguity pinned in §1.8 (also royalty_marginal_vs_flat_pinned)."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_cover_rank_returns_duplicate_record
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_RECORD]"]
        distinguishing_aspect: "A second non-RELEASED UNDERSTUDY with priority_rank 1 on the same track violates the uniqueness constraint."
        test_recipe:
          setup: ["Track with one UNDERSTUDY rank-1 coverage; second CONTRACTED understudy exists"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U1", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u1: $.data.id }
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U2", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u2: $.data.id }
            - call: "PUT /cast/${u1}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${u2}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Lead", required_covers: 2 }
              as: CompanyManager
              captures: { t: $.data.id }
            - call: "POST /tracks/${t}/coverages"
              payload: { cast_member_id: "${u1}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
          trigger:
            - call: "POST /tracks/${t}/coverages"
              payload: { cast_member_id: "${u2}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
              captures: { err: $.data.error_id }
          assert:
            - "Second UNDERSTUDY rank 1 -> 422 ERR_DUPLICATE_RECORD"

      - name: duplicate_per_diem_returns_duplicate_record
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_RECORD]"]
