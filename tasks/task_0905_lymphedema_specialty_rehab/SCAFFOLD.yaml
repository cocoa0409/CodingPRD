# =============================================================================
# Task 0905 — Lymphedema & Specialty Rehab Clinic  (Expert tier)
# SCAFFOLD.yaml — §1.0–§1.7
# =============================================================================

scenario: |
  905. Lymphedema & Specialty Rehab Clinic: evaluation & staging/measurement,
  treatment plan (CDT) & session, compression-garment order & L-code, insurance
  auth & visit cap, home-program & adherence, reassessment & maintenance, DME
  dispensing, outcome

domain_name: lymphedema-specialty-rehab
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"        # insurance visit cap = finite pool reserved/committed/released
  secondary_archetype: "Ledger reconciliation"    # limb-volume outcome & visit ledger, provisional vs final
  complexity_layers:
    - optimistic_concurrency        # OCC on Patient.version for supersede-on-create
    - cascading_side_effects        # session-complete -> auth exhaust -> plan hold (depth 3)
    - dual_variant_calculation      # visit ledger (reserved/used) + outcome (reduction vs PERV)
    - derived_field_reconciliation  # visits_remaining, on_hand_qty, adherence_rate
    - rate_threshold_triggers       # visit_cap boundary, volume-bump garment class
  entity_topology: flat             # peer entities linked by FK ids in bodies; non-nested URLs
  state_machine_shape: cyclic       # Authorization loops DENIED->SUBMITTED, EXHAUSTED->APPROVED; Session parallel dims
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles            # Clinician / Authorizer / DMECoordinator own different resource types; ClinicAdmin admin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: mrn, type: string, source: input, description: "Medical record number (clinic-unique)" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "ISO date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (patients are created ACTIVE and remain so within this scope)" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: body_region, type: enum, source: input, description: "LEFT_ARM | RIGHT_ARM | LEFT_LEG | RIGHT_LEG | HEAD_NECK | TRUNK | GENITAL" }
      - { name: etiology, type: enum, source: input, description: "PRIMARY | SECONDARY" }
      - { name: isl_stage, type: enum, source: input, description: "ISL clinical stage: STAGE_0 | STAGE_I | STAGE_II | STAGE_III" }
      - { name: interval_cm, type: number, source: input, description: "Spacing (cm) between adjacent circumference measurement points" }
      - { name: circumferences_cm, type: array, source: input, description: "Ordered circumferences (cm) of the affected limb, proximal->distal; >= 2 required" }
      - { name: contralateral_circumferences_cm, type: array, source: input, description: "Circumferences (cm) of the unaffected contralateral limb; same length as circumferences_cm" }
      - { name: limb_volume_ml, type: number, source: computed, description: "Truncated-cone volume of affected limb; see calculations.limb_volume_ml" }
      - { name: contralateral_volume_ml, type: number, source: computed, description: "Truncated-cone volume of contralateral limb (same formula)" }
      - { name: excess_volume_ml, type: number, source: computed, description: "max(0, limb_volume_ml - contralateral_volume_ml), rounded to 1 dp" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> FINALIZED -> SUPERSEDED" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: body_region, type: enum, source: input, description: "Region this auth covers; same enum as Evaluation.body_region" }
      - { name: payer_name, type: string, source: input, description: "Insurer / payer name" }
      - { name: auth_number, type: string, source: input, description: "Payer authorization number" }
      - { name: visit_cap, type: integer, source: input, description: "Maximum authorized CDT visits (non-negative integer)" }
      - { name: effective_start_date, type: string, source: input, description: "Inclusive ISO date the auth window opens" }
      - { name: effective_end_date, type: string, source: input, description: "Inclusive ISO date the auth window closes" }
      - { name: visits_reserved, type: integer, source: computed, default: 0, description: "Count of Sessions on this auth in clinical_status SCHEDULED or CHECKED_IN" }
      - { name: visits_used, type: integer, source: computed, default: 0, description: "Count of Sessions on this auth in clinical_status COMPLETED or NO_SHOW" }
      - { name: visits_remaining, type: integer, source: computed, description: "visit_cap - visits_reserved - visits_used" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED -> EXHAUSTED; SUBMITTED -> DENIED; DENIED -> SUBMITTED (resubmit); EXHAUSTED -> APPROVED (renew)" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; must be FINALIZED and belong to patient_id" }
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; governing insurance authorization for this CDT plan" }
      - { name: prescribed_daily_minutes, type: integer, source: input, description: "Prescribed daily home-program minutes (bandaging/exercise), used for adherence scoring" }
      - { name: phase, type: enum, source: system, default: PHASE_1_INTENSIVE, description: "PHASE_1_INTENSIVE -> PHASE_2_MAINTENANCE (advanced by a finalized qualifying Reassessment)" }
      - { name: adherence_rate, type: number, source: computed, default: 0, description: "Percent of AdherenceLog entries that are compliant; see calculations.adherence_rate" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> ON_HOLD -> ACTIVE (loop) -> COMPLETED" }

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Therapist full name" }
      - { name: credential, type: enum, source: input, description: "CLT (certified lymphedema therapist) | OT | PT" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (therapists are created ACTIVE within this scope)" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; must equal the plan's authorization_id" }
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC session start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC session end; must be after scheduled_start" }
      - { name: cdt_component, type: enum, source: input, description: "MLD | COMPRESSION_BANDAGING | EXERCISE | SKIN_CARE | EDUCATION" }
      - { name: clinical_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> CHECKED_IN -> COMPLETED; SCHEDULED|CHECKED_IN -> CANCELLED; SCHEDULED|CHECKED_IN -> NO_SHOW" }
      - { name: billing_status, type: enum, source: system, default: RESERVED, description: "Parallel dimension: RESERVED -> BILLED (complete/no-show); RESERVED -> VOID (cancel)" }

  - name: GarmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; must be FINALIZED and belong to patient_id" }
      - { name: body_region, type: enum, source: computed, description: "Copied from the referenced Evaluation.body_region" }
      - { name: quantity, type: integer, source: input, description: "Number of garment units ordered (>= 1)" }
      - { name: garment_type, type: enum, source: computed, description: "Derived from body_region: SLEEVE | STOCKING | CHIN_STRAP | VEST | COMPRESSION_SHORT" }
      - { name: compression_class, type: enum, source: computed, description: "CLASS_1 | CLASS_2 | CLASS_3 | CLASS_4; see calculations.garment_classification" }
      - { name: l_code, type: string, source: computed, description: "HCPCS L-code; see calculations.garment_classification" }
      - { name: custom_fabrication, type: boolean, source: computed, description: "True when compression_class == CLASS_4 or excess volume exceeds the custom threshold" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> APPROVED (payer) | DENIED (payer); DRAFT|APPROVED -> SUPERSEDED (system on newer order for same patient+region)" }

  - name: DMEItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "DME stock-keeping unit (clinic-unique)" }
      - { name: description, type: string, source: input, required: false, description: "Human-readable item description" }
      - { name: l_code, type: string, source: input, description: "HCPCS L-code this SKU fulfills (e.g., L8100)" }
      - { name: initial_stock_qty, type: integer, source: input, description: "Physical units received into inventory (>= 0); the conserved base quantity" }
      - { name: outstanding_dispensed_qty, type: integer, source: computed, default: 0, description: "Sum of quantity over Dispenses of this item in status DISPENSED" }
      - { name: on_hand_qty, type: integer, source: computed, description: "initial_stock_qty - outstanding_dispensed_qty" }

  - name: Dispense
    parent: null
    common_fields: true
    fields:
      - { name: garment_order_id, type: string, source: input, description: "FK -> GarmentOrder.id; must be APPROVED" }
      - { name: dme_item_id, type: string, source: input, description: "FK -> DMEItem.id; item l_code must equal the garment order l_code" }
      - { name: quantity, type: integer, source: input, description: "Units dispensed (>= 1); must not exceed item on_hand_qty" }
      - { name: l_code, type: string, source: system, description: "Snapshot of the DMEItem.l_code at dispense time" }
      - { name: status, type: enum, source: system, default: DISPENSED, description: "DISPENSED -> RETURNED" }

  - name: Reassessment
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: baseline_evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; the earlier (baseline) finalized evaluation" }
      - { name: current_evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; the later (current) finalized evaluation" }
      - { name: volume_reduction_pct, type: number, source: computed, description: "Percent reduction vs own baseline; see calculations.outcome_metrics" }
      - { name: perv_pct, type: number, source: computed, description: "Percent Excess Volume Reduction vs contralateral; see calculations.outcome_metrics" }
      - { name: outcome_category, type: enum, source: computed, description: "EXCELLENT | GOOD | PARTIAL | REGRESSION (keyed off perv_pct)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> FINALIZED" }

  - name: AdherenceLog
    parent: null
    common_fields: false   # append-only: id + created_at only, immutable
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: log_date, type: string, source: input, description: "ISO date the home-program day was recorded" }
      - { name: minutes_completed, type: integer, source: input, description: "Home-program minutes completed that day (>= 0)" }
      - { name: wore_garment, type: boolean, source: input, description: "Whether the compression garment was worn that day" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Evaluation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /evaluations/{id}/finalize"
        actor: Clinician
        preconditions:
          - "Evaluation is in DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "limb_volume_ml, contralateral_volume_ml, excess_volume_ml are frozen as the finalized measurement"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer Evaluation is created for the same patient_id + body_region via POST /evaluations)"
        actor: system
        preconditions:
          - "A newer Evaluation for the same patient_id + body_region is created and the prior one is FINALIZED"
        side_effects:
          - "The prior FINALIZED evaluation.status becomes SUPERSEDED; its updated_at/version advance"

  - entity: Authorization
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authorizations/{id}/submit"
        actor: Authorizer
        preconditions:
          - "Authorization is in DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /authorizations/{id}/approve"
        actor: Authorizer
        preconditions:
          - "Authorization is in SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /authorizations/{id}/deny"
        actor: Authorizer
        preconditions:
          - "Authorization is in SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /authorizations/{id}/submit"
        actor: Authorizer
        preconditions:
          - "Authorization is in DENIED (resubmission loop) (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic edge — a denied authorization can be resubmitted."
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (a Session completion or no-show drives visits_reserved + visits_used to visit_cap)"
        actor: system
        preconditions:
          - "visits_used >= visit_cap after the debit"
        side_effects:
          - "CASCADE (link 2 of session-complete chain): every TreatmentPlan with authorization_id == this auth and status ACTIVE transitions to ON_HOLD"
      - from: EXHAUSTED
        to: APPROVED
        trigger: "POST /authorizations/{id}/renew"
        actor: Authorizer
        preconditions:
          - "Authorization is in EXHAUSTED (ERR_INVALID_STATE)"
        side_effects:
          - "visit_cap += additional_visits"
          - "Every TreatmentPlan with authorization_id == this auth and status ON_HOLD transitions back to ACTIVE"
        note: "Cyclic edge — renewal reopens the visit pool and resumes held plans."

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate"
        actor: Clinician
        preconditions:
          - "Plan is in DRAFT (ERR_INVALID_STATE)"
          - "Referenced Authorization.status == APPROVED (ERR_AUTH_NOT_APPROVED)"
        side_effects: []
      - from: ACTIVE
        to: ON_HOLD
        trigger: "system (governing Authorization transitions to EXHAUSTED)"
        actor: system
        preconditions:
          - "Plan is ACTIVE and its authorization_id just became EXHAUSTED"
        side_effects: []
      - from: ON_HOLD
        to: ACTIVE
        trigger: "system (governing Authorization is renewed back to APPROVED)"
        actor: system
        preconditions:
          - "Plan is ON_HOLD and its authorization_id just returned to APPROVED"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/complete"
        actor: Clinician
        preconditions:
          - "Plan is ACTIVE (ERR_INVALID_STATE)"
          - "No Session on this plan is in clinical_status SCHEDULED or CHECKED_IN (ERR_OPEN_SESSIONS_EXIST)"
        side_effects: []

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /sessions/{id}/check-in"
        actor: Clinician
        preconditions:
          - "Session is SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: Clinician
        preconditions:
          - "Session is CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status: RESERVED -> BILLED"
          - "CASCADE (link 1): Authorization.visits_used += 1, visits_reserved -= 1, visits_remaining recomputed"
          - "CASCADE (link 2, conditional): if visits_used >= visit_cap, Authorization APPROVED -> EXHAUSTED"
          - "CASCADE (link 3, conditional): each ACTIVE TreatmentPlan on the EXHAUSTED auth -> ON_HOLD"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: Clinician
        preconditions:
          - "Session is SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status: RESERVED -> VOID"
          - "COMPENSATION: Authorization.visits_reserved -= 1, visits_remaining recomputed (visit released)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: Clinician
        preconditions:
          - "Session is SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status: RESERVED -> VOID"
          - "COMPENSATION: Authorization.visits_reserved -= 1, visits_remaining recomputed (visit released)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sessions/{id}/no-show"
        actor: Clinician
        preconditions:
          - "Session is SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status: RESERVED -> BILLED"
          - "CASCADE (link 1): Authorization.visits_used += 1, visits_reserved -= 1 (no-show consumes the visit)"
          - "CASCADE (link 2/3, conditional): auth EXHAUSTED and ACTIVE plans ON_HOLD as in completion"
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /sessions/{id}/no-show"
        actor: Clinician
        preconditions:
          - "Session is SCHEDULED or CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status: RESERVED -> BILLED"
          - "CASCADE (link 1): Authorization.visits_used += 1, visits_reserved -= 1"
          - "CASCADE (link 2/3, conditional): auth EXHAUSTED and ACTIVE plans ON_HOLD as in completion"

  - entity: GarmentOrder
    initial_state: DRAFT
    terminal_states: [DENIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /garment-orders/{id}/approve"
        actor: Authorizer
        preconditions:
          - "GarmentOrder is DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: DENIED
        trigger: "POST /garment-orders/{id}/deny"
        actor: Authorizer
        preconditions:
          - "GarmentOrder is DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer GarmentOrder is created for the same patient_id + body_region)"
        actor: system
        preconditions:
          - "A newer GarmentOrder for the same patient_id + body_region is created and the prior one is DRAFT or APPROVED"
        side_effects: ["prior order.status -> SUPERSEDED"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer GarmentOrder is created for the same patient_id + body_region)"
        actor: system
        preconditions:
          - "A newer GarmentOrder for the same patient_id + body_region is created and the prior one is DRAFT or APPROVED"
        side_effects: ["prior order.status -> SUPERSEDED"]

  - entity: Dispense
    initial_state: DISPENSED
    terminal_states: [RETURNED]
    transitions:
      - from: DISPENSED
        to: RETURNED
        trigger: "POST /dispenses/{id}/return"
        actor: DMECoordinator
        preconditions:
          - "Dispense is DISPENSED (ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: DMEItem.outstanding_dispensed_qty -= quantity, on_hand_qty += quantity (stock restored)"

  - entity: Reassessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /reassessments/{id}/finalize"
        actor: Clinician
        preconditions:
          - "Reassessment is DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "volume_reduction_pct, perv_pct, outcome_category are computed and frozen"
          - "CASCADE (depth 2): if perv_pct >= MAINTENANCE_THRESHOLD (50), the referenced TreatmentPlan.phase PHASE_1_INTENSIVE -> PHASE_2_MAINTENANCE"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on Patient.version — supersede-on-create)
# =============================================================================
concurrency_rules:
  - rule_id: evaluation-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /evaluations"
    occ_field: "expected_patient_version"
    description: |
      Creating an Evaluation against a Patient whose version has advanced since
      the client last observed it is rejected. A new Evaluation for a
      patient+body_region legitimately supersedes the prior FINALIZED evaluation;
      the OCC guard captures the case where another writer has already created a
      superseding evaluation, so this writer's view of the patient is stale.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
  - rule_id: garment-order-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /garment-orders"
    occ_field: "expected_patient_version"
    description: |
      Creating a GarmentOrder against a Patient whose version has advanced since
      the client last observed it is rejected. A new order supersedes the prior
      DRAFT/APPROVED order for the same patient+body_region; the OCC guard rejects
      a stale-version writer whose view predates another writer's superseding order.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: limb_volume_ml
    trigger: "POST /evaluations (computed at creation; frozen at finalize)"
    algorithm: interval_merge   # truncated-cone (frustum) summation over circumference segments
    formula: |
      Given circumferences_cm = [C0, C1, ... Cn] (cm) and interval_cm = h (cm):
      For each adjacent pair (Ci, Ci+1), i = 0..n-1:
        seg_i = h * (Ci^2 + Ci*Ci+1 + Ci+1^2) / (12 * PI)    # cm^3 == ml
        seg_i_rounded = round_half_up(seg_i, 2)              # ROUND PER SEGMENT FIRST
      limb_volume_ml = round_half_up( sum(seg_i_rounded), 1 )  # THEN SUM, then round to 1 dp
      contralateral_volume_ml uses the identical formula over contralateral_circumferences_cm.
      excess_volume_ml = round_half_up( max(0, limb_volume_ml - contralateral_volume_ml), 1 )
    input_set: "All circumference points of the evaluation, in listed order; requires len >= 2 and equal-length affected/contralateral arrays"
    constants:
      PI: 3.141592653589793
    precision: "per-segment 2 dp round_half_up, then sum, then total 1 dp round_half_up"
    note: "Rounding order is PINNED (per-segment then sum). 'Sum raw then round' can differ by 0.1 ml."

  - name: visit_ledger
    trigger: "Session create/complete/cancel/no-show (reserved/used counters on Authorization)"
    algorithm: aggregation
    formula: |
      visits_reserved = count(Session where authorization_id == auth.id and clinical_status in {SCHEDULED, CHECKED_IN})
      visits_used     = count(Session where authorization_id == auth.id and clinical_status in {COMPLETED, NO_SHOW})
      visits_remaining = visit_cap - visits_reserved - visits_used
    input_set: "Sessions referencing this Authorization, filtered by clinical_status as above"
    precision: "integer counts"
    variants:
      - name: provisional_reservation
        when: "at Session creation (SCHEDULED) and check-in"
        difference: "the visit is counted against the cap via visits_reserved (provisional hold), not visits_used"
      - name: finalized_consumption
        when: "at Session completion or no-show"
        difference: "the visit moves reserved -> used (finalized); cancellation instead releases the reservation with no used debit"

  - name: garment_classification
    trigger: "POST /garment-orders (computed from the referenced FINALIZED Evaluation)"
    algorithm: constraint_propagation   # >=3 inputs, nested conditionals + capped bump
    formula: |
      Inputs: eval.isl_stage, eval.excess_volume_ml, eval.body_region.
      region_group = ARM if body_region in {LEFT_ARM, RIGHT_ARM}
                     LEG if body_region in {LEFT_LEG, RIGHT_LEG}
                     OTHER otherwise
      base_class = {STAGE_0:1, STAGE_I:1, STAGE_II:2, STAGE_III:3}[isl_stage]
      bump_threshold = {ARM:150, LEG:500, OTHER:150}[region_group]
      bumped = base_class + (1 if excess_volume_ml >= bump_threshold else 0)
      compression_class_num = min(bumped, 4)         # cap at CLASS_4
      compression_class = "CLASS_" + compression_class_num
      custom_threshold = {ARM:400, LEG:1200, OTHER:400}[region_group]
      custom_fabrication = (compression_class_num == 4) or (excess_volume_ml >= custom_threshold)
      garment_type = {LEFT_ARM:SLEEVE, RIGHT_ARM:SLEEVE, LEFT_LEG:STOCKING, RIGHT_LEG:STOCKING,
                      HEAD_NECK:CHIN_STRAP, TRUNK:VEST, GENITAL:COMPRESSION_SHORT}[body_region]
      l_code = L_CODE_TABLE[garment_type][custom_fabrication]   # see constants
    input_set: "The single referenced Evaluation (must be FINALIZED)"
    constants:
      ARM_BUMP_THRESHOLD_ML: 150
      LEG_BUMP_THRESHOLD_ML: 500
      OTHER_BUMP_THRESHOLD_ML: 150
      ARM_CUSTOM_THRESHOLD_ML: 400
      LEG_CUSTOM_THRESHOLD_ML: 1200
      OTHER_CUSTOM_THRESHOLD_ML: 400
      MAX_CLASS: 4
      L_CODE_TABLE: "{ SLEEVE: {false: L8100, true: L8102}, STOCKING: {false: L8110, true: L8112}, CHIN_STRAP: {false: L8130, true: L8130}, VEST: {false: L8140, true: L8140}, COMPRESSION_SHORT: {false: L8150, true: L8150} }"
    precision: "integer class 1-4"

  - name: outcome_metrics
    trigger: "POST /reassessments/{id}/finalize"
    algorithm: aggregation
    formula: |
      b = baseline_evaluation, c = current_evaluation.
      volume_reduction_pct = round_half_up( (b.limb_volume_ml - c.limb_volume_ml) / b.limb_volume_ml * 100, 1 )
      perv_pct             = round_half_up( (b.excess_volume_ml - c.excess_volume_ml) / b.excess_volume_ml * 100, 1 )
      outcome_category = EXCELLENT if perv_pct >= 50
                         GOOD      if 25 <= perv_pct < 50
                         PARTIAL   if 0 <= perv_pct < 25
                         REGRESSION if perv_pct < 0
    input_set: "The two referenced FINALIZED evaluations (baseline and current)"
    constants:
      MAINTENANCE_THRESHOLD: 50
      EXCELLENT_MIN: 50
      GOOD_MIN: 25
      PARTIAL_MIN: 0
    precision: "1 dp round_half_up"
    variants:
      - name: reduction_vs_own_baseline
        when: "volume_reduction_pct"
        difference: "measures shrinkage of the affected limb relative to its own earlier volume (ignores the contralateral limb)"
      - name: percent_excess_volume_reduction
        when: "perv_pct"
        difference: "measures shrinkage of the excess over the contralateral limb; the denominator is baseline EXCESS, not baseline volume, so it yields a materially different number for identical inputs"

  - name: adherence_rate
    trigger: "AdherenceLog create; read on TreatmentPlan"
    algorithm: aggregation
    formula: |
      logs = AdherenceLog where plan_id == plan.id
      total = count(logs)
      compliant = count(logs where wore_garment == true and minutes_completed >= plan.prescribed_daily_minutes)
      adherence_rate = 0.0 if total == 0 else round_half_up(compliant / total * 100, 1)
    input_set: "All AdherenceLog rows for the plan (append-only; none excluded)"
    precision: "1 dp round_half_up; empty set yields exactly 0.0"

  - name: dme_stock
    trigger: "Dispense create (DISPENSED) and return (RETURNED)"
    algorithm: aggregation
    formula: |
      outstanding_dispensed_qty = sum(Dispense.quantity where dme_item_id == item.id and status == DISPENSED)
      on_hand_qty = initial_stock_qty - outstanding_dispensed_qty
    input_set: "Dispenses of this item in status DISPENSED (RETURNED excluded)"
    precision: "integer units; invariant on_hand_qty + outstanding_dispensed_qty == initial_stock_qty"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids and body FK ids resolve to existing resources (validated left-to-right)"
    error_id: "ERR_PATIENT_NOT_FOUND / ERR_EVALUATION_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_AUTHORIZATION_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_THERAPIST_NOT_FOUND / ERR_GARMENT_ORDER_NOT_FOUND / ERR_DME_ITEM_NOT_FOUND / ERR_DISPENSE_NOT_FOUND / ERR_REASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range, scheduled_end > scheduled_start"
    error_id: "ERR_VALIDATION / ERR_INVALID_ENUM"
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_patient_version equals the current Patient.version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /evaluations, POST /garment-orders"
  - priority: 6
    category: state
    check: "Target resource (and cross-entity guard) is in a valid state for the operation"
    error_id: "ERR_INVALID_STATE / ERR_PLAN_NOT_ACTIVE / ERR_AUTH_NOT_APPROVED / ERR_EVALUATION_NOT_FINALIZED / ERR_GARMENT_ORDER_NOT_APPROVED / ERR_OPEN_SESSIONS_EXIST"
    http_status: 409
    applies_to: "state-transition and dependent-create endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-reference consistency (session.authorization_id == plan.authorization_id; evaluation belongs to patient; dispense item l_code == order l_code)"
    error_id: "ERR_AUTH_PLAN_MISMATCH / ERR_EVALUATION_PATIENT_MISMATCH / ERR_DME_LCODE_MISMATCH"
    http_status: 409
    applies_to: "POST /sessions, POST /treatment-plans, POST /garment-orders, POST /dispenses"
  - priority: 8
    category: business_temporal
    check: "Temporal windows: (a) session [scheduled_start, scheduled_end] within auth [effective_start_date, effective_end_date]; (b) therapist not double-booked — reject if any existing Session for same therapist_id with clinical_status in {SCHEDULED, CHECKED_IN, COMPLETED} has [start,end) within 15 minutes of the new [start,end) (buffered half-open); (c) auth window does not overlap an existing Authorization for same patient_id+body_region with status in {DRAFT, SUBMITTED, APPROVED, EXHAUSTED} (closed inclusive, touching endpoints overlap)"
    error_id: "ERR_SESSION_OUTSIDE_AUTH_WINDOW / ERR_THERAPIST_DOUBLE_BOOKED / ERR_AUTH_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /sessions, POST /authorizations"
  - priority: 9
    category: business_constraint
    check: "Measurement sufficiency and DME stock: >= 2 circumferences and equal array lengths; dispense quantity <= on_hand_qty"
    error_id: "ERR_INSUFFICIENT_MEASUREMENT / ERR_MEASUREMENT_LENGTH_MISMATCH / ERR_DME_INSUFFICIENT_STOCK"
    http_status: 422
    applies_to: "POST /evaluations, POST /dispenses"
  - priority: 10
    category: business_fiscal
    check: "Visit cap: visits_reserved + visits_used < visit_cap before reserving a new session"
    error_id: ERR_VISIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Patient ----
  - { method: POST, path: "/patients", description: "Register a patient", roles: [ClinicAdmin], code: 201, input: ["full_name", "mrn", "date_of_birth?"], output: Patient, side_effects: ["status=ACTIVE, version=1"] }
  - { method: GET,  path: "/patients", description: "List patients", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: [], output: "Patient[]", side_effects: [] }
  - { method: GET,  path: "/patients/{id}", description: "Get a patient", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: [], output: Patient, side_effects: [] }

  # ---- Evaluation ----
  - method: POST
    path: "/evaluations"
    description: "Create an evaluation (staging + circumferential measurement); supersedes prior FINALIZED evaluation for same patient+region"
    roles: [Clinician]
    code: 201
    input: [patient_id, body_region, etiology, isl_stage, interval_cm, circumferences_cm, contralateral_circumferences_cm, expected_patient_version]
    output: Evaluation
    side_effects:
      - "computes limb_volume_ml, contralateral_volume_ml, excess_volume_ml (calculations.limb_volume_ml)"
      - "prior FINALIZED Evaluation for same patient_id+body_region -> SUPERSEDED"
      - "increments Patient.version by 1"
  - { method: GET, path: "/evaluations", description: "List evaluations", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: ["patient_id?"], output: "Evaluation[]", side_effects: [] }
  - { method: GET, path: "/evaluations/{id}", description: "Get an evaluation", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: [], output: Evaluation, side_effects: [] }
  - { method: POST, path: "/evaluations/{id}/finalize", description: "Finalize an evaluation", roles: [Clinician], code: 200, input: [], output: Evaluation, side_effects: ["status DRAFT -> FINALIZED"] }

  # ---- Authorization ----
  - method: POST
    path: "/authorizations"
    description: "Create an insurance authorization with a visit cap and effective window"
    roles: [Authorizer, ClinicAdmin]
    code: 201
    input: [patient_id, body_region, payer_name, auth_number, visit_cap, effective_start_date, effective_end_date]
    output: Authorization
    side_effects: ["status=DRAFT, visits_reserved=0, visits_used=0, visits_remaining=visit_cap", "reject if window overlaps an existing auth for same patient+region (ERR_AUTH_WINDOW_OVERLAP)"]
  - { method: GET, path: "/authorizations", description: "List authorizations", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: ["patient_id?"], output: "Authorization[]", side_effects: [] }
  - { method: GET, path: "/authorizations/{id}", description: "Get an authorization", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: [], output: Authorization, side_effects: [] }
  - { method: POST, path: "/authorizations/{id}/submit", description: "Submit (or resubmit) an authorization", roles: [Authorizer], code: 200, input: [], output: Authorization, side_effects: ["DRAFT|DENIED -> SUBMITTED"] }
  - { method: POST, path: "/authorizations/{id}/approve", description: "Approve an authorization", roles: [Authorizer], code: 200, input: [], output: Authorization, side_effects: ["SUBMITTED -> APPROVED"] }
  - { method: POST, path: "/authorizations/{id}/deny", description: "Deny an authorization", roles: [Authorizer], code: 200, input: [], output: Authorization, side_effects: ["SUBMITTED -> DENIED"] }
  - method: POST
    path: "/authorizations/{id}/renew"
    description: "Renew an exhausted authorization (adds visits, resumes held plans)"
    roles: [Authorizer]
    code: 200
    input: [additional_visits]
    output: Authorization
    side_effects:
      - "EXHAUSTED -> APPROVED; visit_cap += additional_visits; visits_remaining recomputed"
      - "each ON_HOLD TreatmentPlan on this auth -> ACTIVE"

  # ---- TreatmentPlan ----
  - method: POST
    path: "/treatment-plans"
    description: "Create a CDT treatment plan"
    roles: [Clinician]
    code: 201
    input: [patient_id, evaluation_id, authorization_id, prescribed_daily_minutes]
    output: TreatmentPlan
    side_effects: ["status=DRAFT, phase=PHASE_1_INTENSIVE, adherence_rate=0", "reject if evaluation not FINALIZED (ERR_EVALUATION_NOT_FINALIZED) or not owned by patient (ERR_EVALUATION_PATIENT_MISMATCH)"]
  - { method: GET, path: "/treatment-plans", description: "List treatment plans", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: ["patient_id?", "evaluation_id?", "authorization_id?"], output: "TreatmentPlan[]", side_effects: [] }
  - { method: GET, path: "/treatment-plans/{id}", description: "Get a treatment plan", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: [], output: TreatmentPlan, side_effects: [] }
  - { method: POST, path: "/treatment-plans/{id}/activate", description: "Activate a plan (requires approved auth)", roles: [Clinician], code: 200, input: [], output: TreatmentPlan, side_effects: ["DRAFT -> ACTIVE"] }
  - { method: POST, path: "/treatment-plans/{id}/complete", description: "Complete a plan", roles: [Clinician], code: 200, input: [], output: TreatmentPlan, side_effects: ["ACTIVE -> COMPLETED"] }

  # ---- Therapist ----
  - { method: POST, path: "/therapists", description: "Register a therapist", roles: [ClinicAdmin], code: 201, input: [full_name, credential], output: Therapist, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/therapists", description: "List therapists", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: [], output: "Therapist[]", side_effects: [] }
  - { method: GET, path: "/therapists/{id}", description: "Get a therapist", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: [], output: Therapist, side_effects: [] }

  # ---- Session ----
  - method: POST
    path: "/sessions"
    description: "Schedule a CDT session (reserves a visit against the authorization)"
    roles: [Clinician]
    code: 201
    input: [plan_id, authorization_id, therapist_id, scheduled_start, scheduled_end, cdt_component]
    output: Session
    side_effects:
      - "clinical_status=SCHEDULED, billing_status=RESERVED"
      - "Authorization.visits_reserved += 1, visits_remaining recomputed"
  - { method: GET, path: "/sessions", description: "List sessions", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: ["plan_id?", "authorization_id?", "therapist_id?"], output: "Session[]", side_effects: [] }
  - { method: GET, path: "/sessions/{id}", description: "Get a session", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: [], output: Session, side_effects: [] }
  - { method: POST, path: "/sessions/{id}/check-in", description: "Check in a scheduled session", roles: [Clinician], code: 200, input: [], output: Session, side_effects: ["clinical_status SCHEDULED -> CHECKED_IN"] }
  - { method: POST, path: "/sessions/{id}/complete", description: "Complete a session (cascade: consume visit, maybe exhaust auth, maybe hold plans)", roles: [Clinician], code: 200, input: [], output: Session, side_effects: ["clinical_status -> COMPLETED, billing_status -> BILLED", "visit_ledger cascade (see §1.2)"] }
  - { method: POST, path: "/sessions/{id}/cancel", description: "Cancel a session (release reserved visit)", roles: [Clinician], code: 200, input: [], output: Session, side_effects: ["clinical_status -> CANCELLED, billing_status -> VOID", "Authorization.visits_reserved -= 1"] }
  - { method: POST, path: "/sessions/{id}/no-show", description: "Mark a session no-show (consume visit)", roles: [Clinician], code: 200, input: [], output: Session, side_effects: ["clinical_status -> NO_SHOW, billing_status -> BILLED", "visit_ledger cascade"] }

  # ---- GarmentOrder ----
  - method: POST
    path: "/garment-orders"
    description: "Order a compression garment; classifies compression_class and L-code from the evaluation"
    roles: [Clinician]
    code: 201
    input: [patient_id, evaluation_id, quantity, expected_patient_version]
    output: GarmentOrder
    side_effects:
      - "computes body_region, garment_type, compression_class, custom_fabrication, l_code (calculations.garment_classification)"
      - "prior DRAFT/APPROVED order for same patient_id+body_region -> SUPERSEDED"
      - "increments Patient.version by 1"
  - { method: GET, path: "/garment-orders", description: "List garment orders", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: ["patient_id?", "evaluation_id?"], output: "GarmentOrder[]", side_effects: [] }
  - { method: GET, path: "/garment-orders/{id}", description: "Get a garment order", roles: [Clinician, Authorizer, DMECoordinator, ClinicAdmin], code: 200, input: [], output: GarmentOrder, side_effects: [] }
  - { method: POST, path: "/garment-orders/{id}/approve", description: "Payer approves the garment order", roles: [Authorizer], code: 200, input: [], output: GarmentOrder, side_effects: ["DRAFT -> APPROVED"] }
  - { method: POST, path: "/garment-orders/{id}/deny", description: "Payer denies the garment order", roles: [Authorizer], code: 200, input: [], output: GarmentOrder, side_effects: ["DRAFT -> DENIED"] }

  # ---- DMEItem ----
  - { method: POST, path: "/dme-items", description: "Add a DME inventory item", roles: [DMECoordinator, ClinicAdmin], code: 201, input: ["sku", "description?", "l_code", "initial_stock_qty"], output: DMEItem, side_effects: ["outstanding_dispensed_qty=0, on_hand_qty=initial_stock_qty"] }
  - { method: GET, path: "/dme-items", description: "List DME items", roles: [Clinician, DMECoordinator, ClinicAdmin], code: 200, input: ["l_code?"], output: "DMEItem[]", side_effects: [] }
  - { method: GET, path: "/dme-items/{id}", description: "Get a DME item", roles: [Clinician, DMECoordinator, ClinicAdmin], code: 200, input: [], output: DMEItem, side_effects: [] }

  # ---- Dispense ----
  - method: POST
    path: "/dispenses"
    description: "Dispense DME against an approved garment order (decrements stock)"
    roles: [DMECoordinator]
    code: 201
    input: [garment_order_id, dme_item_id, quantity]
    output: Dispense
    side_effects:
      - "status=DISPENSED, l_code snapshot from item"
      - "DMEItem.outstanding_dispensed_qty += quantity, on_hand_qty -= quantity"
  - { method: GET, path: "/dispenses", description: "List dispenses", roles: [Clinician, DMECoordinator, ClinicAdmin], code: 200, input: ["garment_order_id?", "dme_item_id?"], output: "Dispense[]", side_effects: [] }
  - { method: GET, path: "/dispenses/{id}", description: "Get a dispense", roles: [Clinician, DMECoordinator, ClinicAdmin], code: 200, input: [], output: Dispense, side_effects: [] }
  - { method: POST, path: "/dispenses/{id}/return", description: "Return a dispense (restores stock)", roles: [DMECoordinator], code: 200, input: [], output: Dispense, side_effects: ["status DISPENSED -> RETURNED", "DMEItem.outstanding_dispensed_qty -= quantity, on_hand_qty += quantity"] }

  # ---- Reassessment ----
  - method: POST
    path: "/reassessments"
    description: "Create a reassessment comparing two finalized evaluations"
    roles: [Clinician]
    code: 201
    input: [plan_id, baseline_evaluation_id, current_evaluation_id]
    output: Reassessment
    side_effects: ["status=DRAFT", "reject if either evaluation is still DRAFT, i.e. status not in {FINALIZED, SUPERSEDED} (ERR_EVALUATION_NOT_FINALIZED); a SUPERSEDED baseline is acceptable since the current evaluation supersedes it"]
  - { method: GET, path: "/reassessments", description: "List reassessments", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: ["plan_id?", "baseline_evaluation_id?", "current_evaluation_id?"], output: "Reassessment[]", side_effects: [] }
  - { method: GET, path: "/reassessments/{id}", description: "Get a reassessment", roles: [Clinician, Authorizer, ClinicAdmin], code: 200, input: [], output: Reassessment, side_effects: [] }
  - { method: POST, path: "/reassessments/{id}/finalize", description: "Finalize a reassessment (computes outcome; may advance plan to maintenance)", roles: [Clinician], code: 200, input: [], output: Reassessment, side_effects: ["computes volume_reduction_pct, perv_pct, outcome_category", "if perv_pct >= 50: plan.phase -> PHASE_2_MAINTENANCE"] }

  # ---- AdherenceLog ----
  - { method: POST, path: "/adherence-logs", description: "Record a home-program adherence day", roles: [Clinician], code: 201, input: [plan_id, log_date, minutes_completed, wore_garment], output: AdherenceLog, side_effects: ["recomputes plan.adherence_rate"] }
  - { method: GET, path: "/adherence-logs", description: "List adherence logs", roles: [Clinician, ClinicAdmin], code: 200, input: ["plan_id?"], output: "AdherenceLog[]", side_effects: [] }
  - { method: GET, path: "/adherence-logs/{id}", description: "Get an adherence log", roles: [Clinician, ClinicAdmin], code: 200, input: [], output: AdherenceLog, side_effects: [] }

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advances to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad type, or out-of-range value (incl. scheduled_end <= scheduled_start)" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patient_id does not resolve" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "evaluation_id does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan_id does not resolve" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "authorization_id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "session id does not resolve" }
  - { id: ERR_THERAPIST_NOT_FOUND, http: 404, condition: "therapist_id does not resolve" }
  - { id: ERR_GARMENT_ORDER_NOT_FOUND, http: 404, condition: "garment_order_id does not resolve" }
  - { id: ERR_DME_ITEM_NOT_FOUND, http: 404, condition: "dme_item_id does not resolve" }
  - { id: ERR_DISPENSE_NOT_FOUND, http: 404, condition: "dispense id does not resolve" }
  - { id: ERR_REASSESSMENT_NOT_FOUND, http: 404, condition: "reassessment id does not resolve" }
  - { id: ERR_STALE_PATIENT_VERSION, http: 412, condition: "expected_patient_version != current Patient.version on evaluation/garment-order create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Session scheduling requires the plan in ACTIVE" }
  - { id: ERR_AUTH_NOT_APPROVED, http: 409, condition: "Plan activation / session scheduling requires the authorization in APPROVED" }
  - { id: ERR_EVALUATION_NOT_FINALIZED, http: 409, condition: "Operation requires a FINALIZED evaluation" }
  - { id: ERR_GARMENT_ORDER_NOT_APPROVED, http: 409, condition: "Dispense requires the garment order in APPROVED" }
  - { id: ERR_OPEN_SESSIONS_EXIST, http: 409, condition: "Plan completion blocked by SCHEDULED/CHECKED_IN sessions" }
  - { id: ERR_AUTH_PLAN_MISMATCH, http: 409, condition: "session.authorization_id does not equal the plan's authorization_id" }
  - { id: ERR_EVALUATION_PATIENT_MISMATCH, http: 409, condition: "Referenced evaluation does not belong to the given patient" }
  - { id: ERR_DME_LCODE_MISMATCH, http: 409, condition: "Dispensed item l_code does not match the garment order l_code" }
  - { id: ERR_SESSION_OUTSIDE_AUTH_WINDOW, http: 409, condition: "Session start/end falls outside the authorization effective window" }
  - { id: ERR_THERAPIST_DOUBLE_BOOKED, http: 409, condition: "Session overlaps another non-cancelled session for the same therapist within the 15-min buffer" }
  - { id: ERR_AUTH_WINDOW_OVERLAP, http: 409, condition: "New authorization window overlaps an existing auth for the same patient+region (closed inclusive)" }
  - { id: ERR_INSUFFICIENT_MEASUREMENT, http: 422, condition: "Fewer than 2 circumference points supplied" }
  - { id: ERR_MEASUREMENT_LENGTH_MISMATCH, http: 422, condition: "Affected and contralateral circumference arrays differ in length" }
  - { id: ERR_DME_INSUFFICIENT_STOCK, http: 409, condition: "Dispense quantity exceeds item on_hand_qty" }
  - { id: ERR_VISIT_CAP_EXCEEDED, http: 409, condition: "visits_reserved + visits_used would reach or exceed visit_cap" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Clinician
    description: "Certified lymphedema therapist; owns clinical documentation, plans, sessions, garment orders, reassessments, adherence logs"
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /evaluations, POST /evaluations/{id}/finalize"
      - "POST /treatment-plans, POST /treatment-plans/{id}/activate, POST /treatment-plans/{id}/complete"
      - "POST /sessions and all session lifecycle actions (check-in, complete, cancel, no-show)"
      - "POST /garment-orders (create/classify)"
      - "POST /reassessments, POST /reassessments/{id}/finalize"
      - "POST /adherence-logs"
    shared_operations:
      - "GET reads on patients, evaluations, plans, authorizations, therapists, sessions, garment-orders, dme-items, dispenses, reassessments, adherence-logs"
  - name: Authorizer
    description: "Payer / utilization-management actor; owns insurance authorizations and garment-order payer decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /authorizations and lifecycle actions (submit, approve, deny, renew)"
      - "POST /garment-orders/{id}/approve, POST /garment-orders/{id}/deny"
    shared_operations:
      - "GET reads on patients, evaluations, plans, authorizations, sessions, garment-orders, reassessments"
  - name: DMECoordinator
    description: "Durable medical equipment coordinator; owns DME inventory and dispensing"
    identity: "opaque"
    exclusive_operations:
      - "POST /dme-items"
      - "POST /dispenses, POST /dispenses/{id}/return"
    shared_operations:
      - "GET reads on dme-items, dispenses, garment-orders, patients, therapists"
  - name: ClinicAdmin
    description: "Clinic administrator; patient/therapist registration, DME item setup, logical clock, cross-cutting reads (admin superset)"
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /therapists"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /authorizations (co-owned with Authorizer)"
      - "POST /dme-items (co-owned with DMECoordinator)"
      - "GET reads across all collections"
