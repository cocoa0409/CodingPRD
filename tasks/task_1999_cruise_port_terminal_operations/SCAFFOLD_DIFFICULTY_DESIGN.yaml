            - { call: "POST /port-ops/port-calls/${pc2}/berth-assignments", payload: { berth_id: "${b2}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc2_v}" }, as: Harbormaster, captures: { ba2: $.data.id } }
