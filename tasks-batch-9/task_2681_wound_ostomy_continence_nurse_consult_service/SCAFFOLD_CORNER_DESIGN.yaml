      - name: body_fk_probe_rejects_with_the_first_declared_unknown_foreign_key
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_SURVEY_ROUND_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_CONSULT_NOT_FOUND]
          - errors[ERR_NURSE_NOT_FOUND]
