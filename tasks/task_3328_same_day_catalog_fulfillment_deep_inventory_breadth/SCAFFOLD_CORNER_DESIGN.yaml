          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "CatalogOrder.${order_id}.order_status == CANCELLED and fulfillment_status == AWAITING_RELEASE"
            - "CatalogOrder.${order_id}.allocated_dc_id is null"
            - "no InventoriedStock.reserved_units was written"

      - name: claim_and_shipment_cannot_be_re_driven_from_their_terminal_states
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DamageClaim.RESUMED_to_RESOLVED
          - state_machines.Shipment
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Two different machines are locked down at once: a RESOLVED damage claim refuses a further resolve, and a DISPATCHED shipment refuses a further dispatch, both with 409 ERR_INVALID_STATE — terminal states are inert regardless of which entity owns them."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05 after its cutoff. One order of 3 units whose pick comes up short by 2, so a claim is opened."
            - "The claim is resumed and resolved, and the order is picked in full, cut off and dispatched."
