          assert:
            - "the check-in is rejected with data.error_id == ERR_ALREADY_TERMINAL and http 409"
            - "the same request does NOT return ERR_WAIVER_REQUIRED even though LiabilityWaiver.${wv_id}.expires_on == 2026-08-02T00:00:00Z is well before the 2026-09-01T00:00:00Z clock"
