  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: system_decommission_three_hop_cascade
        grounds:
          - state_machines.ProtectedSystem.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.InspectionEvent.SCHEDULED_to_CANCELLED
          - calculations.plan_posture_derive
        distinguishing_aspect: |
          Depth-3 chain from the decommission trigger: system decommission ->
          each SCHEDULED InspectionEvent -> CANCELLED (hop 1); each event
          cancellation re-derives parent plan posture (hop 2); posture re-derive
          can flip plan to LAPSED which cascades cancellation to REMAINING
          scheduled events (hop 3).
        test_recipe:
          setup:
            - "Published 2026 plan with TWO scheduled events on the same SPRINKLER system"
            - "System decommissioned -> both events cancelled; plan posture re-derived"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Cascade Co", state_license_no: "C-7007" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "44 Hose Ln", occupancy_class: "STORAGE", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "GAUGE_VALVE", serial_no: "GV-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Gail Valve", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "SPRINKLER", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev1: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-10-01T09:00:00Z", scheduled_end: "2026-10-01T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev2: $.data.id }
          trigger:
            - call: "POST /fire-compliance/systems/${sys_id}/decommission"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "ProtectedSystem.${sys_id}.status == DECOMMISSIONED"
            - "ProtectedSystem.${sys_id}.impairment_status == OUT_OF_SERVICE"
            - "InspectionEvent.${ev1}.status == CANCELLED"
            - "InspectionEvent.${ev2}.status == CANCELLED"
            - "Device list for ${sys_id} shows every device status == REMOVED"
            - "InspectionPlan.${plan_id}.plan_posture != FULFILLED (events_completed 0 < required)"
      - name: permit_commencement_impairment_two_hop_cascade
        grounds:
          - state_machines.ModificationPermit.ISSUED_to_WORK_COMMENCED
          - state_machines.Impairment.transitions
          - calculations.impairment_status_derive
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger: permit commence-work ->
          auto-creates UNPLANNED Impairment (hop 1); impairment creation ->
          system impairment_status re-derived to IMPAIRED (hop 2), which then
          gates permit ISSUE on any other permit of the same system.
        test_recipe:
          setup:
            - "ISSUED permit on a FIRE_ALARM system; clock within validity window"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
