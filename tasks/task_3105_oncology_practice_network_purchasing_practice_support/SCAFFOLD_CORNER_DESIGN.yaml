          - roles.NetworkAdmin.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Practice-suspension is a NetworkAdmin-only operation, so a PracticeAdmin cannot suspend even its own practice — the operation is on the wrong side of the role boundary regardless of ownership."
        test_recipe:
