      - name: cascade_layer_end_to_end_depth_and_ordering
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /contact-logs/{id}/void]", state_machines.NoviceTeacher.transitions.RECOMMENDED_to_NOT_ELIGIBLE, "endpoints[POST /mentors/{id}/certification]"]
        excluded_because:
          difficulty_instance: "transitive_cascade / contact_void_four_hop_cascade"
          rationale: |
            The two deepest cascades in the design are already walked hop by hop
            in §1.8: contact_void_four_hop_cascade verifies all four hops of the
            void chain (ledger reversal -> milestone revocation -> license
            de-recommendation -> packet return) together with the
            sequence_index ASC ordering of hop 2, and
            mentor_suspension_two_hop_cascade verifies the suspension chain and
            its effect on live matches. A §1.9 duplicate would need the same
            expensive readiness/attainment setup and could only re-assert the
            same observables, so the layer is covered there rather than here.

