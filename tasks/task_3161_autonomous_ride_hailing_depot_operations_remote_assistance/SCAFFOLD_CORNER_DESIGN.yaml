  # ===========================================================================
  - section: consistency_model
    instances:
      - name: if_match_cycle_complete_side_effects_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.DepotCycle.transitions.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Consistency is immediate: the cycle-complete response and the very next vehicle read already reflect every derived value (battery_pct, service_status, Vehicle.version), with no lag or reconcile step."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory, Depot A, a DRAFT vehicle with battery 50 staged at Depot A and a CHARGE cycle IN_PROGRESS."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 50, cleanliness_score: 90, calib_valid: true, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CHARGE" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CHARGE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
          trigger:
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: {}
              as: DepotTechnician
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
          assert:
            - "the complete response returns DepotCycle.${c1_id}.status == COMPLETED"
            - "the immediately following GET returns Vehicle.${v1_id}.battery_pct == 100"
            - "the immediately following GET returns Vehicle.${v1_id}.service_status == AVAILABLE and version == 3"
            - "no second write or reconcile call is required between the complete and the read"
