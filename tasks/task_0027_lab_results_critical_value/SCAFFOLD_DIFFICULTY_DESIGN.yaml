            - call: "POST /instrument-runs"
              payload: { instrument_id: "${inst_id}", specimen_id: "${sp_c}", scheduled_start: "2026-05-28T09:30:00Z", scheduled_end: "2026-05-28T09:40:00Z" }
              as: LabTech
