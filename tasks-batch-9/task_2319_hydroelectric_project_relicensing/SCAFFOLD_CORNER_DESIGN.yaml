  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_project_version_on_settlement_creation_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-open-stale-project]
          - validations[priority=35]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "Opening a settlement takes a lock on the project row: the version captured before the PAD filing is already stale, so the same payload fails with 412 and succeeds only with the version read after every intervening write."
        test_recipe:
          setup:
            - "Project P-9057 created (version 1), then the PAD filed so the project version advances before the settlement is opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9057", project_name: "Occ Settlement Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id, v0: $.data.version }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Settlement at a stale version", expected_project_version: "${v0}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
            - call: "GET /relicensing/settlements"
              payload: { project_id: "${proj}" }
              as: Regulator
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { v2: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Settlement at the current version", expected_project_version: "${v2}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id, st: $.data.status, rnd: $.data.round_number }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { v3: $.data.version }
          assert:
            - "${v0} == 1 and ${v1} == 2 (the PAD filing bumped the project)"
            - "${err} == ERR_STALE_PROJECT_VERSION with HTTP 412"
            - "the settlement list for the project returns total_count == 0 after the rejected call"
            - "${v2} == 2, the second create returns HTTP 201 with ${st} == NEGOTIATING and ${rnd} == 1"
            - "${v3} == 3 (opening the settlement wrote the project row once)"

      - name: stale_project_version_on_application_filing_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-file-stale-project]
          - validations[priority=35]
          - validations[priority=43]
        distinguishing_aspect: "The OCC check sits at priority 35, ahead of every stage and content rule, so a PRE_FILING project with a stale version answers 412 and the identical call at the current version gets all the way to the stage rule instead."
        test_recipe:
          setup:
            - "Project P-9058 still in PRE_FILING; a name patch moves the version so the creation-time value is stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9058", project_name: "Occ Filing Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id, v0: $.data.version }
            - call: "PATCH /relicensing/projects/${proj}"
              payload: { project_name: "Occ Filing Reach Renamed" }
              as: Regulator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${v0}", filing_note: "stale and out of stage" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_stale: $.data.error_id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { v2: $.data.version, stage: $.data.stage }
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${v2}", filing_note: "fresh version, wrong stage" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_stage: $.data.error_id }
            - call: "GET /relicensing/applications"
              payload: { project_id: "${proj}" }
              as: Regulator
          assert:
            - "${v0} == 1, ${v1} == 2 and ${v2} == 2 with ${stage} == PRE_FILING"
            - "${err_stale} == ERR_STALE_PROJECT_VERSION with HTTP 412 (the version check runs before the stage check)"
            - "${err_stage} == ERR_PROJECT_STAGE_INVALID with HTTP 409 at the current version, proving the OCC gate passed"
            - "the application list for the project returns total_count == 0"

