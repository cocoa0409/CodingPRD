            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${mA_id}" }, as: Member, as_user_id: "${mA_id}", captures: { rA_id: "$.data.id", rA_st: "$.data.status" } }
            - { call: "POST /v1/members", payload: { email: "b@x.edu", full_name: "M B", affiliation: "STUDENT" }, as: RecAdmin, captures: { mB_id: "$.data.id", mB_v: "$.data.version" } }
            - { call: "POST /v1/members/${mB_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mB_id}", captures: { mB_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mB_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mB_v2}" }, as: Member, as_user_id: "${mB_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${mB_id}" }, as: Member, as_user_id: "${mB_id}", captures: { rB_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "c@x.edu", full_name: "M C", affiliation: "STUDENT" }, as: RecAdmin, captures: { mC_id: "$.data.id", mC_v: "$.data.version" } }
            - { call: "POST /v1/members/${mC_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mC_id}", captures: { mC_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mC_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mC_v2}" }, as: Member, as_user_id: "${mC_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${mC_id}" }, as: Member, as_user_id: "${mC_id}", captures: { rC_id: "$.data.id", rC_st: "$.data.status" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
            - { call: "GET /v1/fitness-classes/${c_id}", payload: {}, as: RecAdmin, captures: { c_reg0: "$.data.registered_count", c_wait0: "$.data.waitlist_count" } }
          trigger:
            - { call: "POST /v1/class-registrations/${rA_id}/cancel", payload: {}, as: Member, as_user_id: "${mA_id}" }
            - { call: "GET /v1/fitness-classes/${c_id}", payload: {}, as: RecAdmin, captures: { c_reg1: "$.data.registered_count", c_wait1: "$.data.waitlist_count" } }
            - { call: "GET /v1/class-registrations/${rC_id}", payload: {}, as: RecAdmin, captures: { rC_after: "$.data.status" } }
            - { call: "GET /v1/class-registrations/${rA_id}", payload: {}, as: RecAdmin, captures: { rA_after: "$.data.status" } }
          assert:
            - "before cancel: registered_count == 2, waitlist_count == 1, rC status == WAITLISTED (third seat request overflowed)"
            - "after cancel+promotion pair: registered_count == 2 (CONSERVED — the seat changed hands, not count), waitlist_count == 0"
            - "rA status == CANCELLED; rC status == REGISTERED (earliest-created WAITLISTED head promoted)"
