            - "Two MID-ATL partners accepting MEAT: CHILLED with cold_chain_certified true and AMBIENT with the default false."
            - "One SCHEDULED pickup per partner on different dock doors, so no dock window conflicts."
            - "Clock at 2026-08-13T12:00:00.000Z, inside the donation window that opened at 2026-08-13T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
