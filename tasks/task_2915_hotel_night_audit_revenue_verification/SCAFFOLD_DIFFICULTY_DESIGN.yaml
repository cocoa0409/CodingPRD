            - "Filing POST /night-audit/authorization-documents with doc_type ALLOWANCE_APPROVAL, allowance_id ${alw_big_id}, no folio_id, valid_from_date 2026-08-01 and valid_to_date 2026-08-31 as NightAuditor u_na_1 returns 201 with status == PENDING, and repeating the trigger still fails 409 ERR_ALLOWANCE_DOCUMENT_MISSING - PENDING satisfies no gate."
            - "After RevenueManager u_rm_1 reviews that document with decision APPROVE (status ACTIVE), repeating the trigger returns 200 with status == POSTED and approved_amount == 1000.00."
            - "GET /night-audit/folios/${folio_h_id} then returns charges_total_amount == 217.75, credits_total_amount == -1000.00, balance_amount == -782.25 and settlement_status == PARTIALLY_SETTLED."
