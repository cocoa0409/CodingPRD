            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/site-dup.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MILESTONE_SUBMISSION_CONFLICT (HTTP 409)"
            - "Exactly one SITE_CONTROL submission exists for ${p1_id}"

      - name: cluster_capacity_exact_boundary_then_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CLUSTER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "The capacity check is inclusive: committed_mw equal to capacity_mw is accepted (10 + 20 == 30 ok), but one more MW is rejected with ERR_CLUSTER_CAPACITY_EXCEEDED."
        test_recipe:
