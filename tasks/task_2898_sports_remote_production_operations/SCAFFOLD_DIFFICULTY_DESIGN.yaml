      - name: accepted_crew_call_cancellation_cascades_to_stage_demotion_then_show_hold
        grounds:
          - endpoints[POST /broadcast-ops/crew-calls/{id}/cancel].side_effects
          - calculations.production_readiness_score
          - state_machines.Production.REHEARSED_to_PROVISIONED
          - entities.ShowExecution.fields.readiness_hold
          - calculations.crew_turnaround_reference
        distinguishing_aspect: |
          Depth 3 from a different trigger than the feed cascade, and it stops one level short by a
          different mechanism: cancelling an ACCEPTED CrewCall drops the certified crew component
          (link 1), which drops readiness_score_certified to 92.50 and demotes REHEARSED -> PROVISIONED
          via step 4 rather than step 3 (link 2), which in turn sets readiness_hold on the PRE_SHOW
          show (link 3). Because provisioning_conditions still hold, the SCHEDULED rehearsal is NOT
          aborted - proving the cascade followed the step-4 branch, not the step-3 branch.
        test_recipe:
          setup:
            - "The REHEARSED fixture of feed_suspension_cascades_prep_then_production_then_rehearsal_and_show_hold rebuilt call-for-call (same ids: prod_id, truck_id, survey_id, path_a_id, primary_id, feed_id, prep_id, cm1_id/cm2_id, call1_id/call2_id, reh1_id/reh2_id, show_id), with the feed left ACTIVE and the prep left VALIDATED."
            - "One deviation: the second crew call is left OFFERED across the rehearsal outcome and is accepted by this recipe's own setup, so the show is created while readiness_hold is false and the production sits at REHEARSED with readiness_score_certified == 100.00."
            - "Both crew calls then stand ACCEPTED at 9000 cents/h for 600 minutes: provisional 104000 each, labor_committed_cents == 208000."
          setup_api_calls:
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm2_id}"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { status_before: $.data.status, certified_before: $.data.readiness_score_certified, committed_before: $.data.labor_committed_cents }
            - call: "GET /broadcast-ops/show-executions/${show_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { hold_before: $.data.readiness_hold }
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/cancel"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cancelled_status: $.data.status }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T18:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/show-executions/${show_id}/air-status"
              payload: { target_air_status: "ON_AIR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { blocked_error: $.data.error_id }
          assert:
            - "Before the trigger: Production.${prod_id}.status == REHEARSED, readiness_score_certified == 100.00, labor_committed_cents == 208000, ShowExecution.${show_id}.readiness_hold == false"
            - "Link 1 - CrewCall.${call2_id}.status == CANCELLED, settled_total_cents == null, and Production.${prod_id}.labor_committed_cents == 104000 with labor_available_cents == 1896000"
            - "Link 2 - Production.${prod_id}.readiness_score_certified == 92.50 and status == PROVISIONED"
            - "Link 3 - ShowExecution.${show_id}.readiness_hold == true"
            - "Rehearsal.${reh2_id}.status is still SCHEDULED (step 4, not step 3) and Rehearsal.${reh1_id}.status is still COMPLETED"
            - "Consequence of link 3 - the ON_AIR attempt returns HTTP 422 with error_id == ERR_READINESS_NOT_CERTIFIED (not ERR_PRODUCTION_STATE_INVALID: priority 19 admits PROVISIONED for this endpoint so the readiness rung is the one that answers)"
            - "CrewMember.${cm2_id}.lifetime_meal_penalty_units == 0 (cancellation never accrues meal penalties)"
            - "Production.${prod_id}.readiness_score_preflight == 100.00 (the preflight variant still counts the offered/cancelled headcount slot as fillable)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: path_not_found_outranks_stale_production_version
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_PATH_NOT_FOUND]
          - errors[ERR_STALE_PRODUCTION_VERSION]
        distinguishing_aspect: |
          existence (404) versus state (412): one request carries a non-existent path_id AND a stale
          expected_production_version. Only the referential rung at priority 7 may answer; an
          implementation that resolves OCC first would return 412 and never mention the bad FK.
        test_recipe:
          setup:
            - "One TIER_3 production, no truck, no bookings."
            - "The production's current version is read, and the request deliberately sends version - 1."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "00000000-0000-4000-8000-000000000999", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pv1} - 1" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_PATH_NOT_FOUND"
            - "error_id != ERR_STALE_PRODUCTION_VERSION"
            - "No PathBooking row exists for production ${prod_id}"
            - "Production.${prod_id}.version is unchanged by the rejected request"

      - name: stale_production_version_outranks_labor_budget_exceeded
        grounds:
          - validations[priority=17]
          - validations[priority=50]
          - concurrency_rules[crew-call-create-stale-production]
          - errors[ERR_LABOR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          state (412) versus business_fiscal (422): the crew call is simultaneously stale and 54000
          cents over budget. Priority 17 must win over the deliberately-last fiscal rung at 50, so
          the caller is told to re-read the production before being told about money.
        test_recipe:
          setup:
            - "One TIER_3 production with labor_budget_total_cents = 50000 - far below one 600-minute call at 9000 cents/h (104000)."
            - "One STAFF crew member certified for TIER_3 at 9000 cents/h."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 50000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T02:00:00Z", expected_production_version: "${pv1} - 1" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_PRODUCTION_VERSION"
            - "error_id != ERR_LABOR_BUDGET_EXCEEDED"
            - "Production.${prod_id}.labor_committed_cents == 0 and labor_available_cents == 50000"
            - "GET /broadcast-ops/crew-calls?production_id=${prod_id} returns total_count == 0"

      - name: crew_turnaround_violation_outranks_labor_budget_exceeded
        grounds:
          - validations[priority=37]
          - validations[priority=50]
          - calculations.crew_turnaround_reference
          - errors[ERR_CREW_TURNAROUND_VIOLATION]
        distinguishing_aspect: |
          business_safety (422) versus business_fiscal (422) - two rungs of the same HTTP status, so
          only the error_id distinguishes them. The member's turnaround gap is 599 minutes (one short
          of TURNAROUND_MINUTES) on a second production whose budget is also blown, and the union
          rule must answer. Same-production re-offers cannot be used here because
          ERR_DUPLICATE_CREW_CALL at priority 30 would pre-empt both.
        test_recipe:
          setup:
            - "Production A (TIER_3, budget 2000000) with an ACCEPTED call for member cm1: call 2026-08-15T16:00:00Z, scheduled release 2026-08-15T20:00:00Z (the turnaround reference)."
            - "Production B (TIER_3) with labor_budget_total_cents = 10000, far below a 240-minute call at 9000 cents/h (36000)."
            - "The new call on B starts at 2026-08-16T05:59:00Z - exactly 599 minutes after the reference release."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a_id: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbour Dome", venue_power_capacity_amps: 400, venue_roof_type: "FIXED", venue_curfew_utc: "2026-08-18T06:00:00Z", scheduled_start_utc: "2026-08-17T18:00:00Z", scheduled_end_utc: "2026-08-17T22:00:00Z", labor_budget_total_cents: 10000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b_id: $.data.id, pvb: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_a_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-15T20:00:00Z", expected_production_version: "${pva}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call_a_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls/${call_a_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
          trigger:
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_b_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-16T05:59:00Z", scheduled_release_utc: "2026-08-16T09:59:00Z", expected_production_version: "${pvb}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_CREW_TURNAROUND_VIOLATION"
            - "error_id != ERR_LABOR_BUDGET_EXCEEDED and error_id != ERR_DUPLICATE_CREW_CALL"
            - "Production.${prod_b_id}.labor_committed_cents == 0 and labor_available_cents == 10000"
            - "CrewCall.${call_a_id}.status == ACCEPTED and provisional_total_cents == 36000"

      - name: booking_state_invalid_outranks_test_window_invalid
        grounds:
          - validations[priority=22]
          - validations[priority=31]
          - errors[ERR_BOOKING_STATE_INVALID]
          - errors[ERR_TEST_WINDOW_INVALID]
        distinguishing_aspect: |
          state (409) versus business_temporal (422) on the retest loop: the booking has already been
          CONFIRMED by a PASS, and the re-scheduled test window is also outside the booking window
          (a 15:00-15:30 test on a 16:00-23:00 booking). The booking-status rung at 22 must answer, so
          an implementation that validates the window arithmetic first returns the wrong error_id.
        test_recipe:
          setup:
            - "One TIER_3 production and one FIBER path FIB-A (capacity 300, PRIMARY_ELIGIBLE)."
            - "One PRIMARY booking for 16:00-23:00 taken all the way to CONFIRMED: schedule-test 16:00-17:00, clock moved to 16:30, test-result PASS."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-A", path_type: "FIBER", carrier_code: "CARR1", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_a_id: $.data.id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_a_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id }
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/schedule-test"
              payload: { test_window_start_utc: "2026-08-15T16:00:00Z", test_window_end_utc: "2026-08-15T17:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T16:30:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/test-result"
              payload: { outcome: "PASS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { confirmed_status: $.data.status, attempts: $.data.test_attempt_count }
          trigger:
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/schedule-test"
              payload: { test_window_start_utc: "2026-08-15T15:00:00Z", test_window_end_utc: "2026-08-15T15:30:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_BOOKING_STATE_INVALID"
            - "error_id != ERR_TEST_WINDOW_INVALID"
            - "PathBooking.${booking_id}.status == CONFIRMED and test_attempt_count == 1"
            - "PathBooking.${booking_id}.test_window_start_utc == 2026-08-15T16:00:00Z and test_window_end_utc == 2026-08-15T17:00:00Z (untouched by the rejected reschedule)"
            - "TransmissionPath.${path_a_id}.committed_mbps_total == 100 and active_booking_count == 1"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: worked_minutes_at_exactly_360_versus_361_meal_window
        grounds:
          - calculations.crew_call_labor_cost
          - entities.CrewCall.fields.meal_penalty_units
          - entities.CrewCall.fields.settled_total_cents
          - endpoints[POST /broadcast-ops/crew-calls/{id}/release]
        distinguishing_aspect: |
          Metric: worked minutes against MEAL_WINDOW_MINUTES (360), exercised on the release endpoint.
          At exactly 360 worked minutes with no meal break the union owes nothing (0 units, 54000);
          one minute later the first 30-minute increment is charged whole (1 unit, 54150 + 3500 =
          57650). A `>` / `>=` slip or a floor instead of a ceiling on the increment changes both rows.
        test_recipe:
          setup:
            - "One TIER_3 production, labor_budget_total_cents = 2000000."
            - "Two STAFF members certified TIER_3 at 9000 cents/h, so the two calls never collide on the duplicate-call or turnaround rules."
            - "Both calls are called at 2026-08-15T16:00:00Z and accepted."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Ellis Park", position: "EIC", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm2_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-15T22:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id, prov1: $.data.provisional_total_cents }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm2_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-15T22:01:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call2_id: $.data.id, prov2: $.data.provisional_total_cents }
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm2_id}"
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/release"
              payload: { actual_release_utc: "2026-08-15T22:00:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { units1: $.data.meal_penalty_units, settled1: $.data.settled_total_cents }
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/release"
              payload: { actual_release_utc: "2026-08-15T22:01:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { units2: $.data.meal_penalty_units, settled2: $.data.settled_total_cents }
          assert:
            - "CrewCall.${call1_id}.provisional_total_cents == 54000 and meal_penalty_units == 0 and settled_total_cents == 54000"
            - "CrewCall.${call2_id}.provisional_total_cents == 57650 and meal_penalty_units == 1 and settled_total_cents == 57650"
            - "CrewMember.${cm1_id}.lifetime_meal_penalty_units == 0"
            - "CrewMember.${cm2_id}.lifetime_meal_penalty_units == 1"
            - "Production.${prod_id}.labor_committed_cents == 111650 and labor_available_cents == 1888350"

      - name: survey_submit_at_zero_versus_one_camera_position
        grounds:
          - validations[priority=40]
          - errors[ERR_SURVEY_NO_CAMERA_POSITIONS]
          - entities.VenueSurvey.fields.camera_position_count
          - endpoints[POST /broadcast-ops/venue-surveys/{id}/submit]
        distinguishing_aspect: |
          A different metric (camera_position_count) on a different endpoint (survey submit): the
          count-0 camera plot is refused and the survey stays DRAFT, while count 1 - the smallest
          admissible plot - submits cleanly. Implementations that only guard the signal-loss budget
          happily submit an empty plot, because an empty sum is 0.0 and passes every dB check.
        test_recipe:
          setup:
            - "One TIER_3 production, venue power 400 A."
            - "One DRAFT survey with no camera positions at all."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id, count0: $.data.camera_position_count, loss0: $.data.total_signal_loss_db }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos1_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { status_after: $.data.status }
          assert:
            - "At count 0: HTTP 422 with error_id == ERR_SURVEY_NO_CAMERA_POSITIONS, VenueSurvey.${survey_id}.status == DRAFT, camera_position_count == 0, total_signal_loss_db == 0.0"
            - "At count 1: HTTP 200, VenueSurvey.${survey_id}.status == SUBMITTED, camera_position_count == 1, total_signal_loss_db == 2.03, submitted_by_user_id == td-001"
            - "Production.${prod_id}.status == PLANNED (submitting does not advance the production; only APPROVE does)"

      - name: feed_consumer_count_at_exactly_max_concurrent_consumers
        grounds:
          - validations[priority=35]
          - errors[ERR_FEED_CONSUMER_LIMIT]
          - entities.DataFeed.fields.active_consumer_count
          - endpoints[POST /broadcast-ops/system-preps/{id}/validate-feed]
        distinguishing_aspect: |
          A third metric (active_consumer_count against max_concurrent_consumers) on a third endpoint
          (validate-feed), and the comparison is `>=`, so equality blocks: with max_concurrent_consumers
          == 1 the first validation succeeds at count 0 and the second is refused at count 1 - even
          though a naive `>` guard would let a second consumer in and only refuse a third.
        test_recipe:
          setup:
            - "One TIER_3 production (still PLANNED - prep creation does not require a survey)."
            - "One ACTIVE feed with latency_ms 120, contract_expiry_utc 2026-12-31T00:00:00Z and max_concurrent_consumers = 1."
            - "Two preps of different kinds bound to that one feed: GRAPHICS and REPLAY."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-12-31T00:00:00Z", max_concurrent_consumers: 1 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id, consumers0: $.data.active_consumer_count }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep1_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "REPLAY", replay_channel_count: 4 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep2_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/system-preps/${prep1_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep1_status: $.data.status }
            - call: "POST /broadcast-ops/system-preps/${prep2_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "At count 0: HTTP 200 and SystemPrep.${prep1_id}.status == VALIDATED with feed_validated_at == 2026-08-01T00:00:00Z (the logical-clock default)"
            - "DataFeed.${feed_id}.active_consumer_count == 1 after the first validation"
            - "At count 1 (== max): HTTP 422 with error_id == ERR_FEED_CONSUMER_LIMIT"
            - "SystemPrep.${prep2_id}.status == PENDING and feed_validated_at == null"
            - "DataFeed.${feed_id}.active_consumer_count is still 1 and status == ACTIVE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prep_validation_depends_on_data_feed_status
        grounds:
          - validations[priority=25]
          - errors[ERR_FEED_STATE_INVALID]
          - state_machines.SystemPrep
          - entities.DataFeed.fields.status
        distinguishing_aspect: |
          Entity pair (SystemPrep, DataFeed): the prep's own status is a perfectly legal PENDING in
          both halves of this test, so the only thing that changes the verdict is a *different* row's
          status. The same validate-feed call succeeds while the feed is ACTIVE and is refused with
          409 once the feed is SUSPENDED, and prep creation against a SUSPENDED feed is refused too.
        test_recipe:
          setup:
            - "One TIER_3 production (PLANNED)."
            - "One ACTIVE feed with max_concurrent_consumers = 2 and two preps: GRAPHICS and REPLAY, both PENDING."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-12-31T00:00:00Z", max_concurrent_consumers: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep1_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "REPLAY", replay_channel_count: 4 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep2_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep1_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep1_status: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/data-feeds/${feed_id}/suspend"
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { feed_status: $.data.status }
            - call: "POST /broadcast-ops/system-preps/${prep2_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "STATS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err2: $.data.error_id }
          assert:
            - "While the feed was ACTIVE: SystemPrep.${prep1_id}.status == VALIDATED"
            - "DataFeed.${feed_id}.status == SUSPENDED and active_consumer_count == 0 after suspend"
            - "SystemPrep.${prep1_id}.status == PENDING (reverted by the suspend cascade) with feed_validated_at == null"
            - "validate-feed on the second prep returns HTTP 409 with error_id == ERR_FEED_STATE_INVALID"
            - "SystemPrep.${prep2_id}.status == PENDING (unchanged, never FAILED - the feed's state blocks the check, it does not fail it)"
            - "Creating a third prep against the suspended feed returns HTTP 409 with error_id == ERR_FEED_STATE_INVALID"
            - "Production.${prod_id}.status == PLANNED throughout"

      - name: rehearsal_completion_depends_on_approved_survey_position_count
