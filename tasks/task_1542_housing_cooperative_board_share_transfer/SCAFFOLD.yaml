      - "Sets transferred_at"
      - "Supersedes old ShareLedgerEntry rows; creates new entry for buyer"
      - "Creates Shareholder for buyer if email unknown"
      - "Increments Cooperative.version"

  - method: POST
    path: "/cooperatives/{cid}/purchase-applications/{paid}/withdraw"
    description: "Seller withdraws application"
    roles: [Shareholder]
    code: 200
