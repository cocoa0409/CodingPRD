  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_revoke_cascade_depth2
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_REVOKED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - entities.Appointment.fields.cancel_reason
        distinguishing_aspect: |
          Depth-2 chain from CONSENT revoke: revoke consent (A) -> the referencing SCHEDULED appointment is
          cancelled with cancel_reason CONSENT_REVOKED (B, caused by A, which itself releases the table
          interval). The cancel is a consequence of the revoke, not a direct fan-out of it; this is the
          second of the two cascades whose other member (the void cascade) reaches depth 3.
        test_recipe:
          setup:
            - "A MEMBERSHIP appointment that is still SCHEDULED (never priced), so its package credit has not been debited (balance stays at the initial GRANT of 1), referencing an ACTIVE consent."
            - "Revoking the consent cascades: revoke -> cancel the SCHEDULED appointment (cancel_reason CONSENT_REVOKED) -> since no credit was redeemed, no REFUND ledger entry is needed and credit_balance_sessions stays 1; the depth-3 chain's third hop (Package.credit_balance recompute) is a no-op leaving the conserved balance at 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
