          - state_machines.AuditAdjustment.ACCEPTED_BY_PROVIDER_to_INCORPORATED
          - entities.WorkpaperEntry.fields.source_audit_adjustment_id
          - entities.CostCenter.fields.adjustment_amount_cents
          - entities.StepdownRun.fields.stale_reason
          - entities.CostReport.fields.allocation_status
          - validations[priority=7]
        distinguishing_aspect: |
          Depth-5 cascade from a DIFFERENT triggering transition (AuditAdjustment
          ACCEPTED_BY_PROVIDER -> INCORPORATED, not a stepdown run): the resolution mints an
          AUDIT-sourced WorkpaperEntry, which moves CostCenter.adjustment_amount_cents, which staled
          the COMPLETED StepdownRun with reason WORKPAPER_ENTRY_CHANGED, which set
          CostReport.allocation_status STALE, which raised Settlement.recompute_required.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a TENTATIVE_SETTLED CostReport with a COMPLETED SINGLE_APPORTIONMENT run and total_allowable_cost_cents 448666667"
