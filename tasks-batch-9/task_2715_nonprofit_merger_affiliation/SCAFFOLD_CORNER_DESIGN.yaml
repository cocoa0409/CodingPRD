              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { finding: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "DILIGENCE_ADJUSTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/respond"
