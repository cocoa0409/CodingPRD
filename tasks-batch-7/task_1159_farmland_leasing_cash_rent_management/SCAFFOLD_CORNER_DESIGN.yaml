          trigger:
            - call: "POST /installments/${i1}/reverse_payment"
              as: FarmManager
              as_user_id: "mgr-1"
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_DUTY_SEGREGATION_VIOLATION (X-User-ID == paid_recorded_by)"
            - "installment ${i1} remains PAID with paid_cents 1250000"

