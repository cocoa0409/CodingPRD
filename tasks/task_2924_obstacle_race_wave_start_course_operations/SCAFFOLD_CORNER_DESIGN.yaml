# =====================================================================
# §1.9 Scaffold Corner Design (Breadth Index)
# Task 2924 — Obstacle Race Wave Start & Course Operations
# Walk of references/claim-extraction-guide.md against §1.1–§1.7.
# section: values are the guide's nine sections; claim_type: values are
# the guide's per-section rows. Corners already asserted by §1.8 appear
# as excluded_because: stubs naming the covering difficulty instance.
# The logical clock reads 2026-08-01T00:00:00Z until a chain moves it.
# =====================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: venue_creation_returns_the_full_declared_field_set_with_zeroed_ledger
        claim_type: Creation
        grounds:
          - entities.Venue
          - endpoints[POST /ocr/venues]
        distinguishing_aspect: "POST /ocr/venues with all six input fields returns 201 and a body carrying every declared Venue field, with site_posture OPEN, disturbed_area_sqm 0 and the bond residual equal to the posted bond."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to its default 2026-08-01T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PermitOfficer
          trigger:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
          assert:
            - "The response status is 201 and response_type is object"
            - "Venue.${venue_id}.site_posture == OPEN and Venue.${venue_id}.version == 1"
            - "Venue.${venue_id}.disturbed_area_sqm == 0, bond_released_cents == 0 and bond_forfeited_cents == 0"
            - "Venue.${venue_id}.bond_held_cents == 1000000"
            - "Venue.${venue_id}.terrain_type == QUARRY, water_access == POND, land_use_zone == AG-2, protected_acreage_sqm == 2000"
            - "The response data carries id, created_at and updated_at, and created_at == 2026-08-01T00:00:00Z"

      - name: get_one_obstacle_returns_the_stored_row_with_its_computed_rates
        claim_type: Retrieval
        grounds:
          - endpoints[GET /ocr/obstacles/{id}]
          - entities.Obstacle.fields.design_clearance_rate_per_min
        distinguishing_aspect: "GET /ocr/obstacles/{id} echoes every stored input field and both computed rates: design_clearance_rate_per_min 12.00 and effective_clearance_rate_per_min 0.00 while unstaffed."
        test_recipe:
          setup:
            - "One venue with one DRAFT course (corral_release_rate_per_min 12.00) carrying one obstacle: 4 lanes at 3.00 per minute, bypass_mode NONE, no marshals yet."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
          trigger:
            - call: "GET /ocr/obstacles/${o1_id}"
              payload: {}
              as: ObstacleMarshal
          assert:
            - "The response status is 200 and data.id == ${o1_id}"
            - "Obstacle.${o1_id}.course_id == ${course_id} and paired_obstacle_id == null"
            - "Obstacle.${o1_id}.design_clearance_rate_per_min == 12.00"
            - "Obstacle.${o1_id}.effective_clearance_rate_per_min == 0.00 and staffing_state == UNSTAFFED"
            - "Obstacle.${o1_id}.confirmed_marshal_count == 0"

      - name: list_venues_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /ocr/venues]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three venues stored, GET /ocr/venues?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three venues exist: two QUARRY parcels and one FOREST parcel, created in that order."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_a_id: $.data.id }
            - call: "POST /ocr/venues"
              payload: { name: "Southpit Quarry", terrain_type: "QUARRY", water_access: "RIVER", land_use_zone: "AG-3", protected_acreage_sqm: 500, restoration_bond_cents: 400000 }
              as: PermitOfficer
              captures: { venue_b_id: $.data.id }
            - call: "POST /ocr/venues"
              payload: { name: "Hollow Woods", terrain_type: "FOREST", water_access: "NONE", land_use_zone: "RU-1", protected_acreage_sqm: 9000, restoration_bond_cents: 300000 }
              as: PermitOfficer
              captures: { venue_c_id: $.data.id }
          trigger:
            - call: "GET /ocr/venues"
              payload: { limit: 2, offset: 0 }
              as: PermitOfficer
            - call: "GET /ocr/venues"
              payload: { limit: 2, offset: 2 }
              as: PermitOfficer
            - call: "GET /ocr/venues"
              payload: { terrain_type: "FOREST", limit: 10, offset: 0 }
              as: PermitOfficer
          assert:
            - "The first trigger call returns response_type array with exactly 2 items, total_count == 3, has_more == true, limit == 2 and offset == 0"
            - "The second trigger call returns exactly 1 item, total_count == 3 and has_more == false"
            - "The third trigger call returns exactly 1 item whose id == ${venue_c_id}, total_count == 1 and has_more == false"
            - "The union of the first two pages contains ${venue_a_id}, ${venue_b_id} and ${venue_c_id} with no duplicates"

      - name: get_unknown_venue_id_returns_venue_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_VENUE_NOT_FOUND]
          - endpoints[GET /ocr/venues/{id}]
        distinguishing_aspect: "A syntactically valid but unpersisted id on GET /ocr/venues/{id} returns 404 with error_id ERR_VENUE_NOT_FOUND, not 200 with an empty body and not 422."
        test_recipe:
          setup:
            - "One venue exists so the collection is non-empty; the probed id is a well-formed UUID that was never issued."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
          trigger:
            - call: "GET /ocr/venues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitOfficer
          assert:
            - "The response status is 404, response_type is error and data.error_id == ERR_VENUE_NOT_FOUND"
            - "GET /ocr/venues/${venue_id} still returns 200, so the collection itself is intact"

      - name: create_obstacle_without_lane_count_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4].ERR_INVALID_REQUEST
          - endpoints[POST /ocr/courses/{id}/obstacles]
        distinguishing_aspect: "Omitting the required input field lane_count returns 422 ERR_INVALID_REQUEST and persists nothing, so the parent course's obstacle_count stays 0."
        test_recipe:
          setup:
            - "One venue with one DRAFT course and no obstacles yet."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
          assert:
            - "The response status is 422 and data.error_id == ERR_INVALID_REQUEST"
            - "Course.${course_id}.obstacle_count == 0 and design_capacity_pph == 0"
            - "GET /ocr/obstacles with course_id == ${course_id} returns an empty array with total_count == 0"

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Obstacle.fields.paired_obstacle_id
          - entities.Participant.fields.medical_flags
          - entities.FestivalService.fields.water_draw_lpm
        distinguishing_aspect: "Omitting paired_obstacle_id, medical_flags and water_draw_lpm yields null, [] and 0 respectively — and the participant lands in CLEARED because an empty flag list contains no blocking condition."
        test_recipe:
          setup:
            - "One venue with one DRAFT course."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/participants"
              payload: { full_name: "Ada Rock", birth_year: 2000, email: "ada@example.com", chip_id: "CHIP-001" }
              as: SiteOpsLead
              captures: { p1_id: $.data.id }
            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Ada Rock" }
              as: Participant
              as_user_id: "${p1_id}"
            - call: "POST /ocr/venues/${venue_id}/festival-services"
              payload: { service_type: "SPECTATOR_ZONE", footprint_sqm: 600, capacity: 900 }
              as: SiteOpsLead
              captures: { fs_id: $.data.id }
          assert:
            - "Obstacle.${o1_id}.paired_obstacle_id == null"
            - "Participant.${p1_id}.medical_flags == [] and clearance_status == CLEARED"
            - "FestivalService.${fs_id}.water_draw_lpm == 0 and status == OPEN"
            - "Venue.${venue_id}.disturbed_area_sqm == 1800 (1200 obstacle plus 600 installation)"

      - name: computed_course_fields_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds:
          - entities.Course.fields.obstacle_count
          - entities.Course.fields.design_capacity_pph
          - calculations.course_design_capacity
        distinguishing_aspect: "obstacle_count and design_capacity_pph are recomputed from the stored obstacles on every obstacle creation: 0 at course creation, then 720 and 1 after one 12.00-per-minute station, regardless of any value a client tries to send."
        test_recipe:
          setup:
            - "One venue; the course is created with only its four declared input fields."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "GET /ocr/courses/${course_id}"
              payload: {}
              as: CourseDesigner
          assert:
            - "Course.${course_id}.obstacle_count == 1"
            - "Course.${course_id}.design_capacity_pph == 720 and bottleneck_capacity_pph == 0"
            - "Course.${course_id}.difficulty_progression_score == 0.00 (fewer than two stations)"
            - "Course.${course_id}.status == DRAFT and readiness_posture == RESTRICTED"
            - "Course.${course_id}.medic_headcount == 0, water_safety_headcount == 0 and scheduled_capacity_total == 0"

      - name: attempt_recorded_at_and_recorder_identity_are_stamped_by_the_server
        claim_type: System Fields
        grounds:
          - entities.ObstacleAttempt.fields.recorded_at
          - entities.ObstacleAttempt.fields.recorded_by_user_id
          - entities.ObstacleAttempt.fields.obstacle_staffing_state_at_record
        distinguishing_aspect: "recorded_at comes from the logical clock, recorded_by_user_id and recorded_by_role from the request headers, and obstacle_staffing_state_at_record snapshots the station's live staffing — none of the four is a client input on POST /ocr/entries/{id}/attempts."
        test_recipe:
          setup:
            - "The canonical published course: venue Ridgeline Quarry (water_access NONE) with one APPROVED permit (water_use_allowed false, max_disturbed_area_sqm 5000, quiet window [22,6)), a course with corral_release_rate_per_min 12.00 and corral_throughput_capacity 200, and three dry primary stations at difficulty 3 / 5 / 7 whose footprints total 3700 sqm."
            - "Design rates are 12.00, 7.50 and 12.00 (station 3's 9.00 plus 4.50 relief is capped by the corral), so design_capacity_pph is 450 and the wave-creation cap is 112."
            - "The course is validated and published, then one MARSHAL per station and one MEDIC are confirmed, so every station is MARSHALED, bottleneck_capacity_pph is 450 and readiness_posture is OPEN."
            - "Heat S1 at 2026-09-12T08:00:00Z capacity 10 with one checked-in entry is locked, released and started at 08:00:00; the clock then moves to 08:03:00."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "C-2924-01", water_use_allowed: false, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-10-01T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Mud Trench", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 1, footprint_sqm: 1500, water_contact: false, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/validate"
              payload: {}
              as: CourseDesigner
            - call: "POST /ocr/courses/${course_id}/publish"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-1", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-2", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-3", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o3_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-4", staff_role: "MEDIC", certification_level: "PARAMEDIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z" }
              as: SafetyOfficer
            - call: "POST /ocr/divisions"
              payload: { name: "Open Wave", division_type: "OPEN", bypass_policy: "ALLOWED_WITH_PENALTY", scoring_mode: "GUN_TIME", min_age: 16, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_open_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "S1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 10 }
              as: RaceDirector
              captures: { wave_s1_id: $.data.id }
            - call: "POST /ocr/participants"
              payload: { full_name: "Ada Rock", birth_year: 2000, email: "ada@example.com", chip_id: "CHIP-001" }
              as: SiteOpsLead
              captures: { p1_id: $.data.id }
            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Ada Rock" }
              as: Participant
              as_user_id: "${p1_id}"
            - call: "POST /ocr/waves/${wave_s1_id}/entries"
              payload: { participant_id: "${p1_id}", bib_number: 1 }
              as: SiteOpsLead
              captures: { e1_id: $.data.id }
            - call: "POST /ocr/entries/${e1_id}/check-in"
              payload: { bag_tag_code: "BAG-001", chip_start_offset_seconds: 20 }
              as: SiteOpsLead
            - call: "POST /ocr/waves/${wave_s1_id}/lock-roster"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_s1_id}/release"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:00:00Z" }
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_s1_id}/start"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T08:03:00Z" }
              as: RaceDirector
          trigger:
            - call: "POST /ocr/entries/${e1_id}/attempts"
              payload: { obstacle_id: "${o1_id}", outcome: "COMPLETED" }
              as: ObstacleMarshal
              as_user_id: "marshal-7"
              captures: { att_id: $.data.id }
          assert:
            - "The response status is 201 and ObstacleAttempt.${att_id}.recorded_at == 2026-09-12T08:03:00Z"
            - "ObstacleAttempt.${att_id}.recorded_by_user_id == marshal-7 and recorded_by_role == ObstacleMarshal"
            - "ObstacleAttempt.${att_id}.obstacle_staffing_state_at_record == MARSHALED"
            - "ObstacleAttempt.${att_id}.provisional_penalty_seconds == 0 and entry_id == ${e1_id}"

      - name: unknown_enum_member_on_obstacle_creation_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Obstacle.fields.bypass_mode
          - validations[priority=4].ERR_INVALID_REQUEST
        distinguishing_aspect: "bypass_mode accepts only NONE, PENALTY_LOOP, TIMED_PENALTY and MANDATORY, so PENALTY_ALLOWED is rejected with 422 ERR_INVALID_REQUEST at the schema stage, before any business rule runs."
        test_recipe:
          setup:
            - "One venue with one DRAFT course and no obstacles."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "PENALTY_ALLOWED", penalty_seconds: 0 }
              as: CourseDesigner
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 0, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 11, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
          assert:
            - "All three trigger calls return 422 with data.error_id == ERR_INVALID_REQUEST"
            - "The first fails on the bypass_mode enum, the second on station_index >= 1 and the third on difficulty_rating 1..10"
            - "Course.${course_id}.obstacle_count == 0 after all three refusals"

      - name: division_and_attempt_are_immutable_rows_without_version_or_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Division
          - entities.ObstacleAttempt
        distinguishing_aspect: "Division and ObstacleAttempt declare common_fields false, so their read payloads expose id and created_at but no version and no updated_at, and §1.5 declares no PATCH, PUT or DELETE on either."
        test_recipe:
          setup:
            - "One division exists; §1.5 is the contract under audit for the absence of mutating routes."
          setup_api_calls:
            - call: "POST /ocr/divisions"
              payload: { name: "Elite", division_type: "COMPETITIVE", bypass_policy: "DQ_ON_BYPASS", scoring_mode: "CHIP_TIME", min_age: 18, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_comp_id: $.data.id }
          trigger:
            - call: "GET /ocr/divisions/${div_comp_id}"
              payload: {}
              as: RaceDirector
          assert:
            - "The response status is 200 and data.id == ${div_comp_id}"
            - "The response data carries no version field and no updated_at field"
            - "Division.${div_comp_id}.division_type == COMPETITIVE, bypass_policy == DQ_ON_BYPASS, scoring_mode == CHIP_TIME, min_age == 18"
            - "No PATCH, PUT or DELETE route exists for /ocr/divisions/{id} or for any attempt path in §1.5"

      - name: creating_a_course_under_an_unknown_venue_returns_venue_not_found
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_VENUE_NOT_FOUND]
          - validations[priority=3]
          - entities.Course.parent
        distinguishing_aspect: "The path-existence check at priority 3 runs before the body schema check, so a POST to /ocr/venues/{unknown}/courses returns 404 ERR_VENUE_NOT_FOUND even when the body is well formed, and nothing is persisted."
        test_recipe:
          setup:
            - "One real venue exists; the probe uses a well-formed id that was never issued."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /ocr/venues/00000000-0000-0000-0000-000000000000/courses"
              payload: { name: "Ghost Course", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
          assert:
            - "The response status is 404 and data.error_id == ERR_VENUE_NOT_FOUND"
            - "GET /ocr/venues/${venue_id}/courses returns an empty array with total_count == 0"

      - name: self_referential_bypass_lane_resolves_and_is_excluded_from_primary_aggregates
        claim_type: Parent Relationships
        grounds:
          - entities.Obstacle.fields.paired_obstacle_id
          - calculations.course_design_capacity
          - complexity_profile.entity_topology
        distinguishing_aspect: "A bypass lane row naming its primary through paired_obstacle_id is stored and readable through GET /ocr/obstacles?paired_obstacle_id=..., yet it is excluded from design_capacity_pph, which stays at the primary stations' minimum of 450 rather than dropping to the lane's own rate."
        test_recipe:
          setup:
            - "One venue with a DRAFT course carrying the three canonical primary stations (design rates 12.00, 7.50 and 12.00, so design_capacity_pph is 450)."
          setup_api_calls:
