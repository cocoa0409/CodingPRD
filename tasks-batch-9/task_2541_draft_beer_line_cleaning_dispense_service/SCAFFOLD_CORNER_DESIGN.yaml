          rationale: "The named §1.8 instance pins four geometries and asserts every intermediate (target_co2_volumes, equilibrium_psi, total_restriction_psi, required_applied_psi, required_co2_pct, balance_state) as literals."

      - name: corner_gas_balance_constraints_propagate_to_the_applied_setpoints
        claim_type: constraint_propagation
