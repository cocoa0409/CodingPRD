# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3043_extensive_menu_complexity_station_prep_par_management
# Breadth probe: every claim §1.1–§1.7 declares that §1.8 does not already
# exercise. Corners covered by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: restaurant_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Restaurant
          - endpoints.POST_/api/restaurants
        distinguishing_aspect: "A restaurant created with name/code/budget returns 201 with status ACTIVE, weekly_bakery_budget_spent_cents 0, current_waitlist_minutes 0, version 1, and server-minted id/created_at/updated_at — none of the system fields accept client input."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Restaurant.${rest_id}.status == ACTIVE"
            - "Restaurant.${rest_id}.weekly_bakery_budget_spent_cents == 0 and current_waitlist_minutes == 0"
            - "Restaurant.${rest_id}.version == 1 and id, created_at, updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: prep_item_get_roundtrips_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.PrepItem
          - endpoints.GET_/api/prep-items/{id}
        distinguishing_aspect: "Every PrepItem configuration field round-trips through GET exactly as posted, and status starts ACTIVE even though the client never sends it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/prep-items"
              payload: { name: "Diced Onions", station_type: "SAUTE", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - call: "GET /api/prep-items/${pi_id}"
              payload: {}
              as: MenuAdmin
          assert:
            - "the response status is 200"
            - "PrepItem.${pi_id}.name == \"Diced Onions\" and station_type == SAUTE"
            - "PrepItem.${pi_id}.shelf_life_hours == 48 and min_batch_size == 10 and batch_unit == OZ"
            - "PrepItem.${pi_id}.status == ACTIVE"

      - name: cooks_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/cooks
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With a manager plus two cooks (3 rows), limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false — total_count counts the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One restaurant; one manager cook plus two additional cooks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Cook Two", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Cook Three", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "GET /api/cooks"
              payload: { restaurant_id: "${rest_id}", limit: 2, offset: 0 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/cooks?restaurant_id=${rest_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/cooks?restaurant_id=${rest_id} with no pagination params returns 3 rows with default limit 10 and offset 0"

      - name: recipe_get_unknown_id_returns_recipe_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/recipes/{id}
          - errors.ERR_RECIPE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated recipe id produces the entity-specific 404 ERR_RECIPE_NOT_FOUND inside the standard error envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No recipes exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /api/recipes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MenuAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_RECIPE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: station_create_missing_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Station.fields.rack_slot_capacity
          - validations[priority=2]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "rack_slot_capacity is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the schema check, not a 404 or 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One restaurant; one manager cook."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
          trigger:
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/stations?restaurant_id=${rest_id} returns 0 rows"

      - name: menu_revision_retraining_count_computed_at_publish
        claim_type: Computed Fields
        grounds:
          - entities.MenuRevision.fields.retraining_required_count
          - state_machines.MenuRevision.APPROVED_to_PUBLISHED
        distinguishing_aspect: "retraining_required_count is computed by the publish cascade: with two cooks whose certification_menu_revision_id differs from the published revision it becomes 2, and client input for the field is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant with a manager cook and one additional cook (both certification_menu_revision_id null)."
            - "MenuRevision V1 in APPROVED with one recipe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Chris Cook", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { cook_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "Butter", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "V1", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "Steak", station_type: "GRILL", components: [{ prep_item_id: "${pi_id}", quantity_per_portion: 1, unit: "EA" }] }
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
          trigger:
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
              as: MenuAdmin
          assert:
            - "MenuRevision.${rev_id}.retraining_required_count == 2"
            - "Cook.${cook_id}.status == RETRAINING_REQUIRED (certification_menu_revision_id null != published revision)"
            - "MenuRevision.${rev_id}.recipe_card_redistribution_status == COMPLETE"

      - name: waste_entry_recorded_by_comes_from_header_not_payload
        claim_type: System Fields
        grounds:
          - entities.WasteEntry.fields.recorded_by_cook_id
          - endpoints.POST_/api/waste-entries
        distinguishing_aspect: "recorded_by_cook_id is source system: it equals the caller's X-User-ID, and the endpoint's input schema has no recorded_by_cook_id field at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T08:00:00Z. Restaurant; GRILL station (capacity 100); prep item P (min_batch 10); published recipe; FINALIZED forecast; LOCKED prep list; one PREPPED batch of 50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Paula Prep", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "P", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "V1", effective_from: "2026-09-01T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "R", station_type: "GRILL", components: [{ prep_item_id: "${pi_id}", quantity_per_portion: 5, unit: "OZ" }] }
              as: MenuAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL", rack_slot_capacity: 100 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-09-02T00:00:00Z", expected_covers: 10, item_mix: [{ recipe_id: "${rec_id}", expected_count: 10 }] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_id: $.data.id }
            - call: "POST /api/demand-forecasts/${fc_id}/submit"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/demand-forecasts/${fc_id}/finalize"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/prep-lists"
              payload: { restaurant_id: "${rest_id}", demand_forecast_id: "${fc_id}" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /api/prep-lists/${pl_id}/generate"
              payload: { generation_variant: "OPTIMISTIC" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/prep-lists/${pl_id}/lock"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/prep-batches"
              payload: { prep_list_id: "${pl_id}", prep_item_id: "${pi_id}", station_id: "${st_id}", quantity: 50 }
              as: PrepCook
              as_user_id: "${pc_id}"
              captures: { b_id: $.data.id }
            - call: "POST /api/prep-batches/${b_id}/mark-prepped"
              payload: {}
              as: PrepCook
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /api/waste-entries"
              payload: { station_id: "${st_id}", prep_batch_id: "${b_id}", quantity: 5, reason: "SPILLAGE" }
              as: PrepCook
              as_user_id: "${pc_id}"
              captures: { we_id: $.data.id }
          assert:
            - "the response status is 201"
            - "WasteEntry.${we_id}.recorded_by_cook_id == ${pc_id} (the X-User-ID header value)"
            - "WasteEntry.${we_id}.status == RECORDED"

      - name: bakery_order_invalid_cheesecake_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.BakeryOrder.fields.cheesecake_type
          - validations[priority=2]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cheesecake_type is a closed enum (ORIGINAL | CHOCOLATE | STRAWBERRY | SEASONAL); the value MANGO is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; pastry cook."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Pat Pastry", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pastry_id: $.data.id }
          trigger:
            - call: "POST /api/bakery-orders"
              payload: { restaurant_id: "${rest_id}", cheesecake_type: "MANGO", whole_cakes_ordered: 5 }
              as: PastryChef
              as_user_id: "${pastry_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/bakery-orders?restaurant_id=${rest_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: forecast_finalize_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DemandForecast.SUBMITTED_to_FINALIZED
          - errors.ERR_FORECAST_NOT_SUBMITTED
        distinguishing_aspect: "finalize from DRAFT (skipping SUBMITTED) is rejected with ERR_FORECAST_NOT_SUBMITTED and the forecast stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; DRAFT forecast for a future service_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-09-02T00:00:00Z", expected_covers: 50, item_mix: [] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /api/demand-forecasts/${fc_id}/finalize"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FORECAST_NOT_SUBMITTED"
            - "DemandForecast.${fc_id}.status == DRAFT"

      - name: bakery_order_cancelled_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.BakeryOrder.DRAFT_to_CANCELLED
          - errors.ERR_BAKERY_ORDER_INVALID_STATE
        distinguishing_aspect: "Once CANCELLED, every further transition is rejected: submit on a CANCELLED order returns 409 ERR_BAKERY_ORDER_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; pastry cook; a DRAFT bakery order that has been cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Pat Pastry", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pastry_id: $.data.id }
            - call: "POST /api/bakery-orders"
              payload: { restaurant_id: "${rest_id}", cheesecake_type: "ORIGINAL", whole_cakes_ordered: 5 }
              as: PastryChef
              as_user_id: "${pastry_id}"
              captures: { bo_id: $.data.id }
            - call: "POST /api/bakery-orders/${bo_id}/cancel"
              payload: {}
              as: PastryChef
              as_user_id: "${pastry_id}"
          trigger:
            - call: "POST /api/bakery-orders/${bo_id}/submit"
              payload: {}
              as: PastryChef
              as_user_id: "${pastry_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_BAKERY_ORDER_INVALID_STATE"
            - "BakeryOrder.${bo_id}.status == CANCELLED"

      - name: prep_batch_starts_planned_with_null_expiry
        claim_type: initial_state
        grounds:
          - state_machines.PrepBatch
          - entities.PrepBatch.fields.expires_at
        distinguishing_aspect: "A newly created batch is PLANNED with produced_at null and expires_at null — shelf life starts only at mark-prepped."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T08:00:00Z. Restaurant; station; prep item; published recipe; FINALIZED forecast; LOCKED prep list."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["COLD"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Paula Prep", certified_station_types: ["COLD"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "P", station_type: "COLD", shelf_life_hours: 6, min_batch_size: 10, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "V1", effective_from: "2026-09-01T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "R", station_type: "COLD", components: [{ prep_item_id: "${pi_id}", quantity_per_portion: 2, unit: "EA" }] }
              as: MenuAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
