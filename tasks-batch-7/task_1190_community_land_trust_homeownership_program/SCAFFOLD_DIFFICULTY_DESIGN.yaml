            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease_s}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Buyer with education completed 13 months ago
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/approve"
              as: ComplianceOfficer
            # Completed 2025-04-01 → expires 2026-04-01
            - call: "POST /programs/${prog}/households/${hh_b}/education-completions"
              payload: { course_id: "${course}", completed_at: "2025-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_b}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease_s}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { listing_v: $.data.version }
          trigger:
            # now (2026-05-01) > expires_at (2026-04-01) → education invalid
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/run-matching"
              payload: { expected_listing_version: "${listing_v}" }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_NO_ELIGIBLE_BUYER"
            - "ResaleListing.${listing}.status == OPEN"

      - name: ground_lease_term_date_overlap_via_unit_uniqueness
        grounds:
          - entities.Unit.fields.current_lease_id
          - validations[priority=19]
        distinguishing_aspect: |
          Different interval semantic: half-open interval on a resource — a Unit may hold at
          most one ACTIVE lease at a time. Attempting to activate a second lease while another
          is ACTIVE is an interval-overlap conflict on the Unit (resource), but the rejection
          happens via the unique-current_lease invariant, NOT a time-range comparison.
          Different resource (Unit vs Household's education validity window) and different
          interval semantics (slot-occupancy vs closed-window).
        test_recipe:
          setup:
            - "Unit U with existing ACTIVE lease L1 (household H1)"
            - "A second household H2 ELIGIBLE with education complete"
            - "A draft lease L2 on same unit U for H2"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P16", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 O St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            # H1 flow
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H1", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { h1: $.data.id }
            - call: "POST /programs/${prog}/households/${h1}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { c1: $.data.id }
            - call: "POST /programs/${prog}/households/${h1}/income-certifications/${c1}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h1}/income-certifications/${c1}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h1}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${h1}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { l1: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v1: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${l1}/activate"
              payload: { expected_unit_version: "${unit_v1}" }
              as: LeaseManager
            # H2 flow
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H2", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { h2: $.data.id }
            - call: "POST /programs/${prog}/households/${h2}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { c2: $.data.id }
            - call: "POST /programs/${prog}/households/${h2}/income-certifications/${c2}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h2}/income-certifications/${c2}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h2}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${h2}", start_date: "2026-05-15T00:00:00Z", purchase_price_cents: 21000000 }
              as: LeaseManager
              captures: { l2: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v2: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/leases/${l2}/activate"
              payload: { expected_unit_version: "${unit_v2}" }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_UNIT_OCCUPIED"
            - "GroundLease.${l2}.status == DRAFT"
            - "GroundLease.${l1}.status == ACTIVE"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: subsidy_plus_proceeds_conservation_across_resale
        grounds:
          - calculations.subsidy_retention
          - entities.ResaleListing.fields.subsidy_retained_cents
          - entities.ResaleListing.fields.seller_proceeds_cents
        distinguishing_aspect: |
          Conserved quantity: total_appreciation_split. For a fixed (P0, A0, A1, S0, Y), the
          invariant (subsidy_retained_cents - S0) + seller_proceeds_cents = max(0, A1 - A0)
          must hold after every resale. The compensating action pair (formula selection) must
          leave the conserved quantity unchanged. Different quantity from fee arrears.
        test_recipe:
          setup:
            - "Two programs (APPRAISAL_BASED, INDEXED) with identical inputs"
            - "P0=20000000, A0=25000000, A1=35000000, S0=5000000, Y=10"
            - "Invariant: (subsidy_retained - S0) + seller_proceeds = A1 - A0 = 10000000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "PA", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "APPRAISAL_BASED", appraisal_seller_share_pct: 0.25 }
              as: PlatformAdmin
              captures: { prog_a: $.data.id }
            - call: "POST /programs"
              payload: { name: "PI", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", indexed_annual_appreciation_pct: 0.015 }
              as: PlatformAdmin
              captures: { prog_i: $.data.id }
            - call: "POST /programs/${prog_a}/units"
              payload: { address: "1 PA St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /programs/${prog_i}/units"
              payload: { address: "1 PI St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_i: $.data.id }
            - call: "POST /programs/${prog_a}/households"
              payload: { legal_name: "S A", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_a: $.data.id }
            - call: "POST /programs/${prog_i}/households"
              payload: { legal_name: "S I", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2016-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog_a}/units/${unit_a}/leases"
              payload: { household_id: "${hh_a}", start_date: "2016-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_a: $.data.id }
            - call: "POST /programs/${prog_i}/units/${unit_i}/leases"
              payload: { household_id: "${hh_i}", start_date: "2016-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs/${prog_a}/units/${unit_a}/resale-listings"
              payload: { seller_lease_id: "${lease_a}", appraisal_at_listing_cents: 35000000 }
              as: LeaseManager
              captures: { l_a: $.data.id }
            - call: "POST /programs/${prog_i}/units/${unit_i}/resale-listings"
              payload: { seller_lease_id: "${lease_i}", appraisal_at_listing_cents: 35000000 }
              as: LeaseManager
              captures: { l_i: $.data.id }
          assert:
            # APPRAISAL_BASED: subsidy_retained=12500000, proceeds=2500000
            # Invariant: (12500000-5000000) + 2500000 = 10000000 = A1-A0 ✓
            - "ResaleListing.${l_a}.subsidy_retained_cents - 5000000 + ResaleListing.${l_a}.seller_proceeds_cents == 10000000"
            # INDEXED: subsidy_retained=17000000, proceeds=3000000
            # Invariant: (17000000-5000000) + 3000000 = 15000000 — note for INDEXED the conservation is
            # different: subsidy_retained = S0 + max(0, A1 - asking) — we test the value
            - "ResaleListing.${l_i}.subsidy_retained_cents == 17000000"
            - "ResaleListing.${l_i}.seller_proceeds_cents == 3000000"

      - name: fee_arrears_compensating_pay_and_waive
        grounds:
          - entities.GroundLease.fields.fee_arrears_cents
          - state_machines.LeaseFee
        distinguishing_aspect: |
          Different conserved quantity: fee_arrears_cents conservation. Forward action: LeaseFee
          PENDING → LATE increases fee_arrears_cents by amount_cents. Compensating action: pay
          (or waive) decreases it by the same amount. After a (late → pay) or (late → waive)
          pair, fee_arrears_cents must return to its prior value (no drift).
        test_recipe:
          setup:
            - "Household on ACTIVE lease with one PENDING LeaseFee (amount=50000)"
            - "fee_arrears_cents = 0 initially"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P17", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 Z St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            - call: "GET /programs/${prog}/units/${unit}/leases/${lease}/fees"
              as: LeaseManager
              captures: { fee_id: "$.data[0].id", fee_amt: "$.data[0].amount_cents" }
            # Force LATE via clock advancement past due_date + grace
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /programs/${prog}/units/${unit}/leases/${lease}"
              as: LeaseManager
              captures: { arrears_mid: $.data.fee_arrears_cents }
          trigger:
            # Compensating action: pay the late fee in full
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/fees/${fee_id}/pay"
              payload: { payment_amount_cents: 41667 }
              as: Household
              as_user_id: "${hh}"
          assert:
            - "LeaseFee.${fee_id}.status == PAID"
            # After forward (LATE +41667) then compensate (PAY -41667): fee_arrears_cents returns to 0
            - "GroundLease.${lease}.fee_arrears_cents == 0"
