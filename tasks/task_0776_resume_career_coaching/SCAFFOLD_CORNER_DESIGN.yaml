scaffold_corner_design:
  # ==========================================================================
  # section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "POST /orders with all required fields returns 201 and a body whose data carries id, status INTAKE, provisional_total_cents, and deliverables_total."
        test_recipe:
          setup:
            - "A BASIC plan with a single RESUME deliverable exists; a client exists."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Amy Client", email: "amy@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id, st: $.data.status, dt: $.data.deliverables_total }
          assert:
            - "Order.${order_id}.status == INTAKE"
            - "Order.${order_id}.deliverables_total == 1"
            - "Order.${order_id}.provisional_total_cents == 20000"

      - name: get_order_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Order, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown-uuid} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No order with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CareerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FOUND"

      - name: order_missing_required_plan_id_returns_validation
        claim_type: required_fields
        grounds: [entities.Order.fields.plan_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders without plan_id returns ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "A client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Bo Client", email: "bo@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: plan_invalid_enum_tier_returns_validation
        claim_type: type_constraints
        grounds: [entities.PackagePlan.fields.tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /package-plans with tier 'GOLD' (not in {BASIC,PRO,EXECUTIVE}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /package-plans"
              payload: { tier: "GOLD", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: coach_default_buffer_minutes_applied
        claim_type: defaults
        grounds: [entities.Coach.fields.buffer_minutes]
        distinguishing_aspect: "Creating a coach without buffer_minutes applies the default 15."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Cy Coach", email: "cy@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
          trigger:
            - call: "GET /coaches/${coach_id}"
              payload: {}
              as: CareerAdmin
              captures: { buf: $.data.buffer_minutes }
          assert:
            - "Coach.${coach_id}.buffer_minutes == 15"

      - name: order_system_fields_generated
        claim_type: system_fields
        grounds: [entities.Order]
        distinguishing_aspect: "POST /orders mints id/created_at/updated_at and version == 1; client-supplied system fields are ignored."
        test_recipe:
          setup:
            - "A plan and client exist."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Di Client", email: "di@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
          assert:
            - "Order.${order_id}.version == 1"
            - "Order.${order_id}.id is a server-minted UUID with no type prefix"

      - name: deliverable_computed_ats_score_reflects_latest_scan
        claim_type: computed_fields
        grounds: [entities.Deliverable.fields.current_strict_ats_score, calculations.ats_keyword_score]
        distinguishing_aspect: "After an ATS scan (single section 2/4 -> 50), GET deliverable shows current_strict_ats_score == 50."
        test_recipe:
          setup:
            - "Confirmed order, one drafted RESUME deliverable on an ATS-included plan."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, includes_ats: true, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ed Client", email: "ed@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Ez Coach", email: "ez@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/ats-scans"
              payload: { sections: [ { name: "S1", weight: 1, keywords_total: 4, matched_strict: 2, matched_semantic: 2 } ] }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "GET /deliverables/${deliv_id}"
              payload: {}
              as: CareerAdmin
              captures: { sc: $.data.current_strict_ats_score }
          assert:
            - "Deliverable.${deliv_id}.current_strict_ats_score == 50"

      - name: list_package_plans_pagination_envelope
        claim_type: listing
        grounds: [entities.PackagePlan, response_envelope]
        distinguishing_aspect: "GET /package-plans returns a paginated array envelope carrying total_count and has_more."
        test_recipe:
          setup:
            - "One plan exists."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
          trigger:
            - call: "GET /package-plans"
              payload: {}
              as: CareerAdmin
          assert:
            - "response meta pagination includes total_count and has_more fields"
            - "response_type == array"

  # ==========================================================================
  # section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_in_production_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.INTAKE_to_IN_PRODUCTION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an order that is already IN_PRODUCTION (second confirm) fails with ERR_INVALID_STATE; no second CHARGE is posted."
        test_recipe:
          setup:
            - "An order is created and confirmed once (now IN_PRODUCTION)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Fi Client", email: "fi@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: approve_pending_deliverable_returns_not_drafted
        claim_type: precondition_enforcement
        grounds: [state_machines.Deliverable.DRAFTED_to_APPROVED, "errors[ERR_DELIVERABLE_NOT_DRAFTED]"]
        distinguishing_aspect: "Approving a deliverable still in PENDING (no draft yet) fails with ERR_DELIVERABLE_NOT_DRAFTED."
        test_recipe:
          setup:
            - "Confirmed order with a PENDING RESUME deliverable (no draft uploaded)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Go Client", email: "go@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
          trigger:
            - call: "POST /deliverables/${deliv_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERABLE_NOT_DRAFTED"

      - name: complete_already_completed_session_returns_not_scheduled
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CoachingSession.SCHEDULED_to_COMPLETED, "errors[ERR_SESSION_NOT_SCHEDULED]"]
        distinguishing_aspect: "Completing a session already COMPLETED (terminal) fails with ERR_SESSION_NOT_SCHEDULED."
        test_recipe:
          setup:
            - "Confirmed order with one included session booked and then completed."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 1, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ha Client", email: "ha@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Hi Coach", email: "hi@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_SCHEDULED"

      - name: deliver_not_ready_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.READY_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Delivering an order still IN_PRODUCTION (deliverables not all approved) fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Confirmed order with an unapproved deliverable (status IN_PRODUCTION, not READY)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "BASIC", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Iz Client", email: "iz@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /orders/${order_id}/deliver"
              payload: {}
              as: CareerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # ==========================================================================
  # section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: volume_discount_not_applied_below_three_addons
        claim_type: constants_applied
        grounds: [calculations.order_price_quote, entities.Order.fields.discount_cents]
        distinguishing_aspect: "With only 2 intake add-ons (count < 3), the 10% add-on volume discount does NOT apply: discount_cents == 0 and provisional_total_cents == 51000 (base 30000 + 21000 add-ons)."
        test_recipe:
          setup:
            - "PRO plan base 30000; order created with two intake add-ons (EXTRA_COACHING 12000 + EXTRA_DELIVERABLE 9000), no rush, no coupon."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 30000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Jo Client", email: "jo@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7, addon_types: ["EXTRA_COACHING", "EXTRA_DELIVERABLE"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.addons_subtotal_cents == 21000"
            - "Order.${order_id}.discount_cents == 0"
            - "Order.${order_id}.provisional_total_cents == 51000"

      - name: included_session_is_free
        claim_type: input_set_filtering
        grounds: [calculations.session_billing, entities.CoachingSession.fields.billable, entities.CoachingSession.fields.fee_cents]
        distinguishing_aspect: "Booking within the included session pool yields billable == false and fee_cents == 0; no overage add-on is created."
        test_recipe:
          setup:
            - "PRO plan with 1 included coaching session; confirmed order."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 1, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ki Client", email: "ki@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Ko Coach", email: "ko@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_id: $.data.id, billable: $.data.billable, fee: $.data.fee_cents }
          assert:
            - "CoachingSession.${sess_id}.billable == false"
            - "CoachingSession.${sess_id}.fee_cents == 0"
            - "Order.${order_id}.amount_charged_cents == 20000"

      - name: order_pricing_dual_variant_covered
        claim_type: variant_divergence
        grounds: [calculations.order_price_quote]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_pricing_provisional_vs_final
          rationale: "Provisional-vs-final divergence on Order pricing is asserted by the named §1.8 instance."

      - name: ats_dual_variant_covered
        claim_type: variant_divergence
        grounds: [calculations.ats_keyword_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / ats_strict_vs_semantic_score
          rationale: "Strict-vs-semantic divergence on Deliverable ATS scoring is asserted by the named §1.8 instance."

  # ==========================================================================
  # section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: session_end_not_after_start_returns_validation
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Booking with scheduled_end == scheduled_start returns ERR_VALIDATION (422) before any temporal check."
        test_recipe:
          setup:
            - "Confirmed order, active coach, one included session."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 1, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "La Client", email: "la@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Le Coach", email: "le@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T10:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: claim_on_undelivered_order_returns_not_delivered
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ORDER_NOT_DELIVERED]"]
        distinguishing_aspect: "Submitting a guarantee claim on an IN_PRODUCTION (not DELIVERED/CLOSED) order returns ERR_ORDER_NOT_DELIVERED."
        test_recipe:
          setup:
            - "Confirmed order on a SATISFACTION plan, not yet delivered."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "SATISFACTION" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Ma Client", email: "ma@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /orders/${order_id}/guarantee-claims"
              payload: { claim_type: "SATISFACTION", evidence: "too soon" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_DELIVERED"

      - name: claim_type_not_offered_returns_guarantee_not_offered
        claim_type: conditional_validation
