  # ===========================================================================
  # Rule 7: cross_entity_state_dependency (>=2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: quote_issue_requires_assessment_approved
        grounds:
          - state_machines.Quote.DRAFT_to_ISSUED
          - entities.HomeAssessment
        distinguishing_aspect: |
          Entity pair Quote → HomeAssessment: Quote's DRAFT→ISSUED transition
          requires the linked HomeAssessment to be in APPROVED state; if the
          assessment is still MEASURED (or REJECTED/SUPERSEDED), issue fails with
          ERR_ASSESSMENT_NOT_APPROVED.
        test_recipe:
          setup:
            - "HomeAssessment A1 in MEASURED (not APPROVED)"
            - "Quote Q1 in DRAFT referencing A1"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
