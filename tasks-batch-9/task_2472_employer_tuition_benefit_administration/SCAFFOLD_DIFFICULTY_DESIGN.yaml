                legal_name: "Lakeshore Health Partners"
                benefit_admin_contact_email: "benefits@lakeshore-health.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - &c_policy
              call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["CLINICAL"]
                annual_cap_cents: 800000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.55
                max_concurrent_credits: 12
                drop_window_days: 10
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - &c_activate_policy
              call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - &c_employee
              call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Alina Serrano"
                work_email: "alina.serrano@lakeshore-health.example"
                hire_date: "2024-03-01"
                weekly_hours: 36
                job_family: "CLINICAL"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - &c_school
              call: "POST /schools"
              payload:
                legal_name: "Puget Sound College"
                state_code: "WA"
                contact_email: "partners@pugetsound-college.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - &c_program
              call: "POST /schools/${school_id}/programs"
              payload:
                name: "RN to BSN Completion"
                credential_type: "BACHELOR"
                skill_track: "NURSING"
                list_tuition_per_credit_cents: 40000
                total_credits: 60
                term_length_weeks: 15
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_id: "$.data.id" }
            - &c_agreement
              call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.20
                direct_bill_enabled: false
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { agreement_id: "$.data.id" }
            - &c_activate_agreement
              call: "POST /partner-agreements/${agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version: "$.data.version" }
            - &c_listing
              call: "POST /catalog-listings"
