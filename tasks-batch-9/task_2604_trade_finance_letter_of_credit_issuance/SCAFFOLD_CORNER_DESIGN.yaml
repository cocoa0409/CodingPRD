      - name: settlement_waterfall_deducts_commission_then_discount_then_document_fees
        claim_type: waterfall_allocation
        grounds:
          - calculations.settlement_proceeds
          - calculations.settlement_proceeds.variants.NEGOTIATION_UNDER_DISCOUNT
          - errors.ERR_CHARGES_EXCEED_PROCEEDS
          - endpoints.POST_/settlement-claims/{id}/settle
        distinguishing_aspect: |
          Two claims on the same NEGOTIATION credit share every rate but differ
          only in size. The 6000000 claim runs the full waterfall - commission
          12000, then discount 44250 over 59 days, then document fees 6500 - for
          a net of 5937250. The 3000 claim incurs a flat 3500 per-document fee on
          the bill of lading that alone swamps the proceeds, so the waterfall
          bottoms out at -530 and the settlement is REJECTED with 422
          ERR_CHARGES_EXCEED_PROCEEDS while the claim stays LODGED and the credit's
          reservation is untouched. An implementation that clamps the net at zero,
