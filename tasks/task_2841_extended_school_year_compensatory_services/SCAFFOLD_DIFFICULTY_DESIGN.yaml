      - name: dispute_arbitration_blocked_by_open_due_process_record
        grounds:
          - validations.priority_11_ERR_STAY_PUT_BLOCKED
          - state_machines.CompensatoryAward.DISPUTED_to_AGREED
          - state_machines.DueProcessRecord.OPEN_to_RESOLVED
