            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Jo Kim", employee_number: "E-1011", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "DAS-II", instrument_code: "DAS2", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1600, license_seat_total: 2, license_expires_on: "2026-07-31", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pa}" }
              as: DistrictAdmin
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-K", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 3 cognition" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-K-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/testing-start"
              payload: { instrument_id: "${inst}" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
          assert:
            - "Both conditions hold at trigger time: AssessmentInstrument.${inst}.license_status == EXPIRED (license_expires_on 2026-07-31 < clock date 2026-08-01) AND protocol_stock_count == 0 < 1 * 1 required unit"
            - "The trigger returns HTTP 422 with error_id == ERR_SCORING_LICENSE_INVALID (priority 12 wins)"
            - "The response is NOT 409 / ERR_PROTOCOL_STOCK_INSUFFICIENT (priority 29 never runs)"
            - "Evaluation.${eval1}.assessment_status is still ASSIGNED, testing_instrument_id == null and protocol_units_consumed == 0"
            - "AssessmentInstrument.${inst}.protocol_stock_count == 0 (unchanged, never driven negative)"

  - rule_id: boundary_precision_check
    instances:
      - name: parent_notice_lead_days_exact_ten_boundary
        grounds:
          - validations[priority=13]
          - state_machines.EligibilityMeeting.PROPOSED_to_NOTICED
          - entities.EligibilityMeeting.fields.notice_lead_days
          - endpoints["POST /psych-services/eligibility-meetings/{meeting_id}/notice"]
        distinguishing_aspect: |
          Metric under test is notice_lead_days (an integer calendar-day lead measured from the logical clock)
          on the notice endpoint, with the pass/fail edge one day wide: 10 passes, 9 fails.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z; one building with concurrent_meeting_capacity 1."
            - "Two consented INITIAL referrals give two Evaluations; meeting M1 is proposed for 2026-09-20T15:00:00Z-16:00:00Z and meeting M2 for 2026-09-20T17:00:00Z-18:00:00Z (disjoint closed intervals, so the capacity rule at priority 19 never fires)."
