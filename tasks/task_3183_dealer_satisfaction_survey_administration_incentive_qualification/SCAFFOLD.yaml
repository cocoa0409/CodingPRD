# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3183_dealer_satisfaction_survey_administration_incentive_qualification
# Dealer Satisfaction Survey Administration & Incentive Qualification
# (Toyota Motor North America style)
# =============================================================================

scenario: |
  Dealer Satisfaction Survey Administration & Incentive Qualification (Toyota
  Motor North America): survey deployment to customers after sales and service
  visits with sampling rules and response windows, score computation at dealer,
  department and advisor level with regional benchmarks, incentive program
  qualification where scores gate margin payments and allocation preference,
  survey manipulation detection including coaching customers, opt-out
  suppression and contact data tampering, dealer appeal of individual responses
  with review criteria, action planning and factory field staff consultation
  for underperforming dealers, question set changes with historical
  comparability handling, response rate management and contact information
  quality.

domain_name: dealer-survey-incentives
api_prefix: /survey

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique region code, e.g. 'SW'", constraints: "unique across regions" }
      - { name: name, type: string, source: input, description: "Display name of the sales region" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region the dealer belongs to" }
      - { name: name, type: string, source: input, description: "Dealership display name" }
      - { name: dealer_code, type: string, source: input, description: "Unique factory dealer code", constraints: "unique across dealers" }
      - { name: posture, type: enum, source: computed, description: "GOOD_STANDING | WATCH | PROBATION | SUSPENDED; derived at wave close and on manipulation-flag confirmation per calculation dealer_posture", default: GOOD_STANDING }
      - { name: current_score_adjusted, type: number, source: computed, description: "Score (0-1000 scale, 2dp) from the most recently CLOSED wave; null before first close", default: null }
      - { name: current_response_rate, type: number, source: computed, description: "Response rate (4dp) from the most recently CLOSED wave; null before first close", default: null }
      - { name: confirmed_flag_count, type: integer, source: computed, description: "Count of ManipulationFlag rows for this dealer in CONFIRMED status over the trailing two CLOSED waves", default: 0 }

  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; owning dealer" }
      - { name: kind, type: enum, source: input, description: "SALES | SERVICE", constraints: "one department per (dealer_id, kind)" }
      - { name: name, type: string, source: input, description: "Display name" }

  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department" }
      - { name: name, type: string, source: input, description: "Advisor full name" }
      - { name: employee_ref, type: string, source: input, description: "Dealership employee reference", constraints: "unique within department" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email; must contain '@'" }
      - { name: phone, type: string, source: input, description: "Contact phone, digits only, 10-15 chars" }
      - { name: do_not_contact, type: boolean, source: input, description: "Customer-requested survey opt-out master flag", default: false }

  - name: QuestionSet
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique question set code, e.g. 'QS-2026-A'", constraints: "unique" }
      - { name: questions, type: array, source: input, description: "Array of {question_code, prompt, weight}; weights are positive numbers", constraints: "at least 1 question; question_code unique within the set" }
      - { name: comparability_factor, type: number, source: input, description: "Multiplier in (0.5, 1.5] mapping this set's scores onto the predecessor scale; used by historical_comparability_mapping" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; at most one ACTIVE at a time", default: DRAFT }

  - name: SurveyWave
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Half-open period start (inclusive), ISO8601 UTC" }
      - { name: period_end, type: datetime, source: input, description: "Half-open period end (exclusive); must be > period_start" }
      - { name: question_set_id, type: string, source: input, description: "FK -> QuestionSet.id; questionnaire pinned to this wave" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | FINALIZED", default: DRAFT }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close; null until CLOSED", default: null }
      - { name: invitations_total, type: integer, source: computed, description: "Total invitations ever created in this wave (partition invariant anchor)", default: 0 }
      - { name: queued_count, type: integer, source: computed, description: "Invitations in QUEUED", default: 0 }
      - { name: sent_count, type: integer, source: computed, description: "Invitations in SENT", default: 0 }
      - { name: responded_count, type: integer, source: computed, description: "Invitations in RESPONDED", default: 0 }
      - { name: expired_count, type: integer, source: computed, description: "Invitations in EXPIRED", default: 0 }
      - { name: opted_out_count, type: integer, source: computed, description: "Invitations in OPTED_OUT", default: 0 }
      - { name: suppressed_count, type: integer, source: computed, description: "Invitations in SUPPRESSED", default: 0 }

  - name: Transaction
    parent: null
    common_fields: false
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; dealer that performed the visit" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; department that performed the visit; department must belong to dealer_id" }
      - { name: advisor_id, type: string, source: input, description: "FK -> Advisor.id; servicing advisor; null allowed", constraints: "nullable; when present must belong to department_id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; visiting customer" }
      - { name: kind, type: enum, source: input, description: "SALE | SERVICE_VISIT" }
      - { name: completed_at, type: datetime, source: input, description: "Visit completion timestamp, ISO8601 UTC" }
      - { name: margin_cents, type: integer, source: input, description: "Dealer gross margin attributable to this visit, integer cents >= 0" }

  - name: SurveyInvitation
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; visit being surveyed" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from transaction at creation" }
      - { name: wave_id, type: string, source: system, description: "FK -> SurveyWave.id; wave that generated the invitation" }
      - { name: question_set_id, type: string, source: system, description: "FK -> QuestionSet.id; copied from wave at creation" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | RESPONDED | EXPIRED | OPTED_OUT | SUPPRESSED", default: QUEUED }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock send timestamp; null until SENT", default: null }
      - { name: window_closes_at, type: datetime, source: system, description: "sent_at + 14 days; null until SENT", default: null }

  - name: SurveyResponse
    parent: null
    common_fields: true
    fields:
      - { name: invitation_id, type: string, source: input, description: "FK -> SurveyInvitation.id; exactly one response per invitation" }
      - { name: answers, type: array, source: input, description: "Array of {question_code, score}; score integer 1-10; must cover every question in the invitation's question set exactly once" }
      - { name: score, type: number, source: computed, description: "Weighted mean of answers using QuestionSet question weights, round_half_up to 2dp" }
      - { name: status, type: enum, source: system, description: "SCORED | FLAGGED | EXCLUDED", default: SCORED }
      - { name: excluded_reason, type: enum, source: system, description: "APPEAL_UPHELD | MANIPULATION_CONFIRMED; null unless EXCLUDED", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock submission timestamp" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: response_id, type: string, source: input, description: "FK -> SurveyResponse.id; response under appeal" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; resolved from the response's invitation transaction at creation" }
      - { name: reason, type: string, source: input, description: "Dealer's stated grounds for the appeal" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | DENIED", default: FILED }
      - { name: decision_rationale, type: string, source: input, description: "Auditor rationale recorded at decide; null until decided", default: null }
      - { name: prior_response_status, type: enum, source: system, description: "SurveyResponse.status captured when the appeal was filed; response returns to it if the appeal is DENIED" }

  - name: ManipulationFlag
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; dealer under suspicion" }
      - { name: response_id, type: string, source: input, description: "FK -> SurveyResponse.id; specific response implicated; null allowed for dealer-level signals", constraints: "nullable" }
      - { name: kind, type: enum, source: input, description: "COACHING | OPT_OUT_SUPPRESSION | CONTACT_TAMPERING" }
      - { name: evidence, type: string, source: input, description: "Free-text evidence summary" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED", default: OPEN }

  - name: IncentiveStatement
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; statement subject" }
      - { name: wave_id, type: string, source: input, description: "FK -> SurveyWave.id; wave the statement settles" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | PAID | SUPERSEDED", default: PROVISIONAL }
      - { name: supersedes_id, type: string, source: system, description: "FK -> IncentiveStatement.id; prior PROVISIONAL statement superseded by this one; null on first statement", default: null }
      - { name: score_used, type: number, source: computed, description: "Dealer adjusted composite score (0-1000, 2dp) used for tiering" }
      - { name: response_rate_used, type: number, source: computed, description: "Dealer response rate (4dp) used for the eligibility gate" }
      - { name: tier, type: enum, source: computed, description: "GOLD | SILVER | BRONZE | INELIGIBLE" }
      - { name: eligible_margin_cents, type: integer, source: computed, description: "Sum of margin_cents over the dealer's transactions with completed_at in the wave period" }
      - { name: payout_cents, type: integer, source: computed, description: "round_half_up(eligible_margin_cents * tier_rate, 0); 0 when INELIGIBLE" }

  - name: ActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; dealer the plan remediates" }
      - { name: wave_id, type: string, source: input, description: "FK -> SurveyWave.id; wave whose results triggered the plan" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: items, type: array, source: input, description: "Array of {action, owner, due_date}; at least one item" }
      - { name: due_date, type: datetime, source: input, description: "Overall plan due date, ISO8601 UTC" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | IN_PROGRESS | COMPLETED | OVERDUE", default: DRAFT }
      - { name: review_note, type: string, source: input, description: "Field consultant note recorded at review; null until reviewed", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: QuestionSet
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /survey/question-sets/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "No other QuestionSet is in ACTIVE status (ERR_ACTIVE_QUESTION_SET_EXISTS)"
        side_effects:
          - "QuestionSet becomes the questionnaire chosen by subsequent SurveyWave creation"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /survey/question-sets/{id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "No SurveyWave in DRAFT or OPEN may be created against it afterwards; existing waves keep their pinned question_set_id"

  - entity: SurveyWave
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /survey/waves/{id}/open"
        actor: PlatformAdmin
        preconditions:
          - "Pinned QuestionSet is in ACTIVE status (ERR_QUESTION_SET_NOT_ACTIVE)"
        side_effects:
          - "Survey generation sweep runs once: for each Transaction with completed_at in [period_start, period_end), creates SurveyInvitation rows selected by survey_sampling_rule"
          - "Each generated invitation increments wave.invitations_total and wave.queued_count by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /survey/waves/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "Logical clock >= period_end (ERR_WAVE_STILL_OPEN)"
        side_effects:
          - "Invitations in QUEUED or SENT transition to EXPIRED; wave.queued_count and wave.sent_count decrement accordingly and wave.expired_count increments by the number expired"
          - "For every Dealer with at least one transaction in the period: runs score_computation and response_rate_computation, writes dealer.current_score_adjusted and dealer.current_response_rate, and recomputes dealer posture via dealer_posture_rule"
          - "increments SurveyWave.version by 1"

      - from: CLOSED
        to: FINALIZED
        trigger: "POST /survey/waves/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "Every Appeal whose response belongs to this wave is in UPHELD or DENIED (ERR_APPEALS_PENDING)"
          - "Every ManipulationFlag whose dealer has invitations in this wave is in CONFIRMED or DISMISSED (ERR_FLAGS_PENDING)"
        side_effects:
          - "Every IncentiveStatement for this wave in PROVISIONAL status transitions to FINAL"
          - "increments SurveyWave.version by 1"

  - entity: SurveyInvitation
    field: status
    initial_state: QUEUED
    terminal_states: [RESPONDED, EXPIRED, OPTED_OUT, SUPPRESSED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /survey/invitations/{id}/send"
        actor: SurveyVendor
        preconditions:
          - "Owning SurveyWave is OPEN (ERR_WAVE_NOT_OPEN)"
          - "Customer.do_not_contact is false (ERR_CONTACT_RESTRICTED)"
        side_effects:
          - "sent_at := logical clock; window_closes_at := sent_at + 14 days"
          - "wave.queued_count -= 1; wave.sent_count += 1"

      - from: SENT
        to: RESPONDED
        trigger: "POST /survey/invitations/{id}/responses"
        actor: Customer
        preconditions:
          - "Logical clock < invitation.window_closes_at (ERR_RESPONSE_WINDOW_CLOSED)"
          - "X-User-ID equals invitation.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "Creates SurveyResponse with status SCORED and score per response_score rule"
          - "wave.sent_count -= 1; wave.responded_count += 1"

      - from: [QUEUED, SENT]
        to: EXPIRED
        trigger: "system (SurveyWave close sweeps non-terminal invitations)"
        actor: system
        preconditions: []
        side_effects:
          - "wave.queued_count or wave.sent_count decrements; wave.expired_count increments"

      - from: [QUEUED, SENT]
        to: OPTED_OUT
        trigger: "POST /survey/invitations/{id}/opt-out"
        actor: Customer
        preconditions:
          - "X-User-ID equals invitation.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "Customer.do_not_contact := true"
          - "wave count for the prior status decrements; wave.opted_out_count increments"

      - from: [QUEUED, SENT]
        to: SUPPRESSED
        trigger: "POST /survey/invitations/{id}/suppress"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "wave count for the prior status decrements; wave.suppressed_count increments"
          - "If the invitation is SENT and has a SurveyResponse, that response transitions to EXCLUDED with excluded_reason MANIPULATION_CONFIRMED"

  - entity: SurveyResponse
    field: status
    initial_state: SCORED
    terminal_states: []
    transitions:
      - from: SCORED
        to: FLAGGED
        trigger: "POST /survey/appeals (response_id = this response)"
        actor: DealerPrincipal
        preconditions:
          - "No Appeal exists for this response with status in {FILED, UNDER_REVIEW} (ERR_APPEAL_ALREADY_OPEN)"
        side_effects:
          - "Response excluded from subsequent score_computation sweeps until appeal resolves"

      - from: FLAGGED
        to: SCORED
        trigger: "system (appeal resolved DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Response re-enters score_computation input set"

      - from: FLAGGED
        to: EXCLUDED
        trigger: "system (appeal resolved UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "excluded_reason := APPEAL_UPHELD; response permanently out of all scoring"

      - from: SCORED
        to: EXCLUDED
        trigger: "system (linked ManipulationFlag confirmed) or system (invitation suppressed while SENT)"
        actor: system
        preconditions: []
        side_effects:
          - "excluded_reason := MANIPULATION_CONFIRMED"

  - entity: Appeal
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /survey/appeals/{id}/assign"
        actor: RegionalManager
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /survey/appeals/{id}/decide with outcome=UPHELD"
        actor: ComplianceAuditor
        preconditions:
          - "decision_rationale is non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Response transitions FLAGGED -> EXCLUDED with excluded_reason APPEAL_UPHELD"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /survey/appeals/{id}/decide with outcome=DENIED"
        actor: ComplianceAuditor
        preconditions:
          - "decision_rationale is non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Response transitions FLAGGED -> SCORED"

  - entity: ManipulationFlag
    field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /survey/flags/{id}/resolve with outcome=CONFIRMED"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "If response_id is non-null and the response is SCORED: response -> EXCLUDED (MANIPULATION_CONFIRMED)"
          - "dealer.confirmed_flag_count recomputed per dealer_posture_rule"
          - "dealer posture recomputed; if posture becomes SUSPENDED, every ActionPlan for the dealer in DRAFT transitions to SUBMITTED"

      - from: OPEN
        to: DISMISSED
        trigger: "POST /survey/flags/{id}/resolve with outcome=DISMISSED"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []

  - entity: IncentiveStatement
    field: status
    initial_state: PROVISIONAL
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system (wave finalize)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FINAL
        to: PAID
        trigger: "POST /survey/statements/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (POST /survey/statements creates a replacement for the same (dealer_id, wave_id))"
        actor: system
        preconditions: []
        side_effects:
          - "Replacement statement records supersedes_id = this statement's id"

  - entity: ActionPlan
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /survey/action-plans/{id}/submit"
        actor: DealerPrincipal
        preconditions:
          - "X-User-ID equals plan.dealer_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /survey/action-plans/{id}/review with outcome=APPROVED"
        actor: FieldConsultant
        preconditions:
          - "review_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /survey/action-plans/{id}/review with outcome=REJECTED"
        actor: FieldConsultant
        preconditions:
          - "review_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /survey/action-plans/{id}/revise"
        actor: DealerPrincipal
        preconditions:
          - "X-User-ID equals plan.dealer_id (ERR_FORBIDDEN)"
        side_effects:
          - "review_note cleared to null"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /survey/action-plans/{id}/start"
        actor: DealerPrincipal
        preconditions:
          - "X-User-ID equals plan.dealer_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /survey/action-plans/{id}/complete"
        actor: FieldConsultant
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (logical clock >= due_date while IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "Evaluated lazily on every read of the plan and at wave close"

  - entity: Dealer
    field: posture
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Derived posture — see calculation dealer_posture_rule; transitions are system-driven"
    transitions:
      - from: GOOD_STANDING
        to: WATCH
        trigger: "system (dealer_posture_rule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WATCH
        to: PROBATION
        trigger: "system (dealer_posture_rule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PROBATION
        to: SUSPENDED
        trigger: "system (dealer_posture_rule)"
        actor: system
        preconditions: []
        side_effects:
          - "Every ActionPlan for the dealer in DRAFT transitions to SUBMITTED"

      - from: [WATCH, PROBATION, SUSPENDED]
        to: GOOD_STANDING
        trigger: "system (dealer_posture_rule recovery)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [GOOD_STANDING, PROBATION, SUSPENDED]
        to: WATCH
        trigger: "system (dealer_posture_rule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [GOOD_STANDING, WATCH, SUSPENDED]
        to: PROBATION
        trigger: "system (dealer_posture_rule)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: statement-create-stale-wave
    parent_entity: SurveyWave
    write_endpoint: "POST /survey/statements"
    occ_field: "expected_wave_version"
    description: |
      Creating an IncentiveStatement against a SurveyWave whose version has
      advanced since the client last observed it is rejected. A prior writer
      may have closed or finalized the wave (each bumping SurveyWave.version),
      so the current writer's view of the wave is stale and must be refreshed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appeal-create-stale-response
    parent_entity: SurveyResponse
    write_endpoint: "POST /survey/appeals"
    occ_field: "expected_response_version"
    description: |
      Filing an Appeal against a SurveyResponse whose version has advanced
      since the client last observed it is rejected. A system cascade (flag
      confirmation or suppression) may have already excluded the response,
      advancing its version; the stale appeal attempt is rejected so the
      caller re-reads the response first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: response_score
    trigger: "SurveyResponse creation (invitation responds)"
    algorithm: weighted_scoring
    formula: |
      w_total = sum(q.weight for q in question_set.questions)
      s = sum(a.score * q.weight for (a, q) in zip(answers, question_set.questions)
              where a.question_code == q.question_code)
      score = round_half_up(s * 100.0 / w_total, 2)
    input_set: "All answers on the response, matched 1:1 to the wave-pinned QuestionSet"
    precision: "2 decimal places, round_half_up"

  - name: score_computation
    trigger: "SurveyWave close"
    algorithm: aggregation
    formula: |
      # Unit score domain is 0-100; composite scaled to 0-1000.
      raw = round_half_up(avg(r.score for r in dealer responses in wave
                              where r.status == SCORED) * 10, 2)
      adjusted = round_half_up(raw - 25.0 * dealer.confirmed_flag_count, 2)
      adjusted = max(adjusted, 0)
    input_set: |
      All SurveyResponse rows whose invitation's transaction.dealer_id is the dealer,
      invitation.wave_id is the closing wave, and response.status == SCORED.
      FLAGGED and EXCLUDED responses are NOT included.
    variants:
      - name: raw
        when: "reported on wave summary; not used for tiering"
        difference: "no manipulation deduction"
      - name: adjusted
        when: "stored on Dealer.current_score_adjusted and IncentiveStatement.score_used"
        difference: "subtracts 25 points per CONFIRMED ManipulationFlag; floor 0"

  - name: response_rate_computation
    trigger: "SurveyWave close"
    algorithm: aggregation
    formula: |
      invitations = all SurveyInvitation rows for this dealer in this wave
      response_rate = round_half_up(count(invitations where status == RESPONDED) /
                                    count(invitations), 4)
      If count(invitations) == 0, response_rate is null (dealer not scored this wave).
    input_set: "SurveyInvitation rows whose transaction.dealer_id is the dealer and wave_id is the closing wave; ALL terminal statuses (RESPONDED, EXPIRED, OPTED_OUT, SUPPRESSED) count in the denominator"
    precision: "4 decimal places, round_half_up"

  - name: dealer_posture_rule
    trigger: "wave close (after score_computation) and ManipulationFlag confirm"
    algorithm: threshold
    formula: |
      score = dealer.current_score_adjusted
      flags = dealer.confirmed_flag_count
      if score is null: posture = GOOD_STANDING
      elif flags >= 3: posture = SUSPENDED
      elif flags >= 2 or score < 700: posture = PROBATION
      elif flags == 1 or score < 800: posture = WATCH
      else: posture = GOOD_STANDING
    constants:
      WATCH_SCORE_LT: 800
      PROBATION_SCORE_LT: 700
      SUSPENDED_FLAGS_GTE: 3
      PROBATION_FLAGS_GTE: 2

  - name: incentive_tiering
    trigger: "IncentiveStatement creation and wave finalize recompute"
    algorithm: threshold
    formula: |
      s = score_used
      r = response_rate_used
      # Evaluation order: eligibility first, then tier selection by score.
      if s is null or r is null: tier = INELIGIBLE; rate = 0
      elif r < 0.30: tier = INELIGIBLE; rate = 0
      elif s >= 900: tier = GOLD; rate = 0.08
      elif s >= 800: tier = SILVER; rate = 0.05
      elif s >= 700: tier = BRONZE; rate = 0.02
      else: tier = INELIGIBLE; rate = 0
      payout_cents = round_half_up(eligible_margin_cents * rate, 0)
    input_set: "Dealer's transactions with completed_at in wave period for eligible_margin_cents; dealer.current_score_adjusted and dealer.current_response_rate for gating"
    constants:
      MIN_RESPONSE_RATE: 0.30
      GOLD_SCORE_GTE: 900
      SILVER_SCORE_GTE: 800
      BRONZE_SCORE_GTE: 700
      GOLD_RATE: 0.08
      SILVER_RATE: 0.05
      BRONZE_RATE: 0.02

  - name: survey_sampling_rule
    trigger: "SurveyWave open"
    algorithm: aggregation
    formula: |
      For each dealer, collect eligible transactions:
        completed_at in [period_start, period_end)
        AND customer.do_not_contact == false
        AND no other SurveyInvitation exists for (transaction.customer_id, transaction.kind)
          in any wave whose period overlaps [period_start, period_end) (90-day contact suppression)
      Sort eligible transactions by (Transaction.completed_at ASC, Transaction.created_at ASC).
      Selection: keep at most 20 transactions per (dealer, kind); ties broken by the sort above.
    constants:
      MAX_PER_DEALER_KIND: 20
      CONTACT_SUPPRESSION_DAYS: 90
    precision: "n/a — selection, not arithmetic"

  - name: response_window_validation
    trigger: "POST /survey/invitations/{id}/responses"
    algorithm: threshold
    formula: |
      Reject with ERR_RESPONSE_WINDOW_CLOSED unless
        logical_clock_now < invitation.window_closes_at
      where window_closes_at = invitation.sent_at + 14 days.
      The boundary is EXCLUSIVE: now == window_closes_at is rejected.
    constants:
      WINDOW_DAYS: 14

  - name: regional_benchmark
    trigger: "GET /survey/waves/{id}/benchmarks/{dealer_id}"
    algorithm: weighted_scoring
    formula: |
      eligible = [d for d in Dealer where d.region_id == target.region_id
                  AND d has at least one transaction in wave period
                  AND d.current_score_adjusted is not null]
      rank = 1 + count(d in eligible where d.current_score_adjusted > target.current_score_adjusted)
      percentile = round_half_up(100.0 * (1 - (rank - 1) / max(len(eligible), 1)), 2)
      Output: { region_id, wave_id, dealer_count, dealer_rank: rank, percentile }
      Tie-break: dealers with equal adjusted score share the same rank (rank = 1 + strictly-greater count).
    input_set: "Dealers in the same region with a non-null adjusted score for the wave"

  - name: historical_comparability_mapping
    trigger: "GET /survey/dealers/{id}/score-history"
    algorithm: aggregation
    formula: |
      For each prior wave, report both:
        raw_score = score as computed under that wave's question set (0-1000)
        normalized_score = round_half_up(raw_score * wave.question_set.comparability_factor, 2)
      normalized_score uses the question set's own comparability_factor, NOT the current set's.
    input_set: "All CLOSED or FINALIZED waves with at least one SCORED response for the dealer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership / scope: entity-backed role's X-User-ID matches the resource owner (Customer on own invitations, DealerPrincipal on own appeals/plans/statements)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /survey/invitations/{id}/responses, POST /survey/invitations/{id}/opt-out, POST /survey/appeals, action-plan transitions, GET statements/{id}"

  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist (dealer, department, advisor, customer, wave, question set, invitation, response, appeal, flag, statement, plan)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Cross-reference consistency: Transaction.department_id belongs to Transaction.dealer_id; Transaction.advisor_id (when present) belongs to Transaction.department_id; Appeal dealer resolved from response matches the X-User-ID dealer"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /survey/transactions, POST /survey/appeals"

  - priority: 6
    category: state
    check: "Resource in valid from-state for the requested transition (wave OPEN for send/respond/close, response SCORED for appeal file, appeal UNDER_REVIEW for decide, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /survey/statements, POST /survey/appeals"

  - priority: 8
    category: business_temporal
    check: "Customer responds before response window closes (response_window_validation, exclusive upper bound)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /survey/invitations/{id}/responses"

  - priority: 9
    category: business_temporal
    check: "Wave close requires logical clock >= period_end"
    error_id: ERR_WAVE_STILL_OPEN
    http_status: 422
    applies_to: "POST /survey/waves/{id}/close"

  - priority: 10
    category: business_temporal
    check: "Contact-suppression window: sampling skips customers with an invitation in any wave overlapping the trailing 90 days"
    error_id: ERR_CONTACT_RESTRICTED
    http_status: 422
    applies_to: "POST /survey/invitations/{id}/send when customer.do_not_contact flipped true after queueing"

  - priority: 11
    category: business_constraint
    check: "Structural constraints: unique dealer_code; unique QuestionSet.code; at most one ACTIVE QuestionSet; one Appeal open per response; department.kind unique per dealer; question weights positive; answers cover question set exactly"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "create/update endpoints"

  - priority: 12
    category: business_constraint
    check: "At most one ACTIVE QuestionSet at activate time"
    error_id: ERR_ACTIVE_QUESTION_SET_EXISTS
    http_status: 409
    applies_to: "POST /survey/question-sets/{id}/activate"

  - priority: 13
    category: business_constraint
    check: "Wave open requires pinned QuestionSet in ACTIVE status"
    error_id: ERR_QUESTION_SET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /survey/waves/{id}/open"

  - priority: 14
    category: business_constraint
    check: "Send requires wave in OPEN status"
    error_id: ERR_WAVE_NOT_OPEN
    http_status: 409
    applies_to: "POST /survey/invitations/{id}/send"

  - priority: 15
    category: business_constraint
    check: "No second Appeal on a response with an open (FILED or UNDER_REVIEW) appeal"
    error_id: ERR_APPEAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /survey/appeals"

  - priority: 16
    category: business_constraint
    check: "Wave finalize requires all appeals on the wave's responses decided and all flags on the wave's dealers resolved"
    error_id: ERR_APPEALS_PENDING
    http_status: 409
    applies_to: "POST /survey/waves/{id}/finalize"

  - priority: 17
    category: business_constraint
    check: "Wave finalize blocked by unresolved manipulation flags"
    error_id: ERR_FLAGS_PENDING
    http_status: 409
    applies_to: "POST /survey/waves/{id}/finalize"

  - priority: 18
    category: business_safety
    check: "SUSPENDED dealers cannot submit new ActionPlans (must route via FieldConsultant consultation first); their DRAFT plans were auto-submitted on suspension"
    error_id: ERR_DEALER_SUSPENDED
    http_status: 422
    applies_to: "POST /survey/action-plans/{id}/submit when dealer posture == SUSPENDED"

  - priority: 19
    category: business_referential
    check: "Required request fields present and well-typed (answers array matches question set schema, ISO8601 datetimes, enum values valid)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
