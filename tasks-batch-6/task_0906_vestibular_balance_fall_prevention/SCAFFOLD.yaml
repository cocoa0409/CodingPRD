  - method: POST
    path: "/community-linkages"
    description: "Link a patient to an evidence-based community program (version-guarded supersede-create)."
    roles: [IntakeCoordinator, ClinicSupervisor]
    code: 201
    input: [patient_id, care_plan_id, assessment_id, program_name, expected_care_plan_version]
    output: CommunityProgramLinkage
    side_effects:
      - "CommunityProgramLinkage created status=REFERRED"
      - "withdraw prior non-terminal linkage on the same plan (status -> WITHDRAWN)"
      - "increment care_plan.version by 1"

  - method: GET
    path: "/community-linkages/{id}"
    description: "Fetch a community-program linkage."
    roles: [IntakeCoordinator, Clinician, ClinicSupervisor]
    code: 200
    input: []
    output: CommunityProgramLinkage
    side_effects: []

  - method: GET
    path: "/community-linkages"
    description: "List/filter linkages (reverse-reachability for patient_id, care_plan_id, assessment_id)."
    roles: [IntakeCoordinator, Clinician, ClinicSupervisor]
    code: 200
    input: ["patient_id?", "care_plan_id?", "assessment_id?", "status?", "limit?", "offset?"]
    output: CommunityProgramLinkage[]
    side_effects: []

  - method: POST
    path: "/community-linkages/{id}/status"
    description: "Advance a linkage lifecycle (enroll/complete/decline/withdraw)."
    roles: [IntakeCoordinator, ClinicSupervisor]
    code: 200
    input: [new_status]
    output: CommunityProgramLinkage
    side_effects: ["status advanced per §1.2 CommunityProgramLinkage machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Clinician acting on an assessment/reassessment/session whose clinician_id != X-User-ID"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field or wrong type"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "enum field carries a value outside its declared set"
  - id: ERR_INVALID_TIME_RANGE
    http: 400
    condition: "scheduled_end not strictly after scheduled_start"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "referenced patient id does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referenced referral id does not exist"
  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "referenced clinician id does not exist"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "referenced room id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced assessment id does not exist"
  - id: ERR_CARE_PLAN_NOT_FOUND
    http: 404
    condition: "referenced care plan id does not exist"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "referenced authorization id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "referenced session id does not exist"
  - id: ERR_HOME_SAFETY_NOT_FOUND
    http: 404
    condition: "referenced home-safety evaluation id does not exist"
  - id: ERR_DEVICE_REFERRAL_NOT_FOUND
    http: 404
    condition: "referenced device referral id does not exist"
  - id: ERR_LINKAGE_NOT_FOUND
    http: 404
    condition: "referenced community linkage id does not exist"
  - id: ERR_REASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced reassessment id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "generic: entity not in a state that admits the requested transition"
  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 409
    condition: "care plan create references an assessment not in FINALIZED"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "schedule/link/reassess against a care plan whose status != ACTIVE"
  - id: ERR_AUTH_NOT_APPROVED
    http: 409
    condition: "schedule against an authorization whose status != APPROVED"
  - id: ERR_TIER_NOT_ELIGIBLE
    http: 422
    condition: "community linkage against an assessment whose fall_risk_tier not in {MODERATE, HIGH}"
  - id: ERR_CLINICIAN_DOUBLE_BOOKED
    http: 409
    condition: "session interval overlaps another non-CANCELLED session for the same clinician (half-open)"
  - id: ERR_ROOM_BUFFER_CONFLICT
    http: 409
    condition: "session in the same room within the 15-minute turnover buffer of another non-CANCELLED session"
  - id: ERR_VISIT_CAP_EXCEEDED
    http: 409
    condition: "authorization.visits_used would reach or exceed visits_authorized"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_care_plan_version != current CarePlan.version on community-linkage supersede-create"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-desk intake, scheduling, authorizations, community linkage."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /referrals"
    shared_operations:
      - "POST /referrals/{id}/decision"
      - "POST /care-plans"
      - "POST /authorizations"
      - "POST /sessions"
      - "POST /sessions/{id}/cancel"
      - "POST /community-linkages"
      - "POST /community-linkages/{id}/status"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: Clinician
    description: "Licensed therapist performing assessments, sessions, evaluations, reassessments."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /assessments"
      - "POST /assessments/{id}/finalize"
      - "POST /sessions/{id}/attend"
      - "POST /sessions/{id}/no-show"
      - "POST /home-safety-evaluations"
      - "POST /home-safety-evaluations/{id}/finalize"
      - "POST /care-plans/{id}/reassessments"
      - "POST /reassessments/{id}/finalize"
    shared_operations:
      - "POST /device-referrals"
      - "POST /sessions/{id}/cancel"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: ClinicSupervisor
    description: "Oversees approvals, plan activation/discharge, resource setup."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinicians"
      - "POST /rooms"
      - "POST /authorizations/{id}/decision"
      - "POST /care-plans/{id}/activate"
      - "POST /care-plans/{id}/discharge"
      - "POST /device-referrals/{id}/decision"
    shared_operations:
      - "POST /referrals/{id}/decision"
      - "POST /care-plans"
      - "POST /authorizations"
      - "POST /sessions"
      - "POST /sessions/{id}/cancel"
      - "POST /device-referrals"
      - "POST /community-linkages"
      - "POST /community-linkages/{id}/status"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
