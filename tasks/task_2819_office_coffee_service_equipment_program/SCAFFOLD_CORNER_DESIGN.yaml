      - name: corner_loaner_dimension_gates_resolution_while_wo_status_cycles_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MaintenanceWorkOrder.transitions
          - validations[priority=17]
          - errors[ERR_LOANER_STATE_INVALID]
        distinguishing_aspect: "wo_status and loaner_status are independent dimensions of one row: cycling IN_PROGRESS -> AWAITING_PARTS -> IN_PROGRESS never disturbs loaner_status OUT, and RESOLVED is blocked with ERR_LOANER_STATE_INVALID until the loaner comes back."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30; one PLACEMENT asset and one LOANER asset LNR-0001"
            - "one account with a planned site holding an ACTIVE RENTAL placement; one REPAIR work order on the placed asset"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "LNR-0001", asset_role: "LOANER" }
              as: ProgramAdmin
              captures: { loaner_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "REPAIR" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { wo_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/loaner-swap"
              payload: { loaner_asset_id: "${loaner_id}", loaner_out_date: "2026-08-03T00:00:00Z", loaner_due_back_date: "2026-08-10T00:00:00Z" }
              as: RouteTechnician
              as_user_id: "${route_id}"
          trigger:
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "AWAITING_PARTS", parts_eta: "2026-08-06T00:00:00Z" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "RESOLVED", resolution_note: "Pump replaced" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/loaner-return"
              payload: { returned_on: "2026-08-05T00:00:00Z" }
