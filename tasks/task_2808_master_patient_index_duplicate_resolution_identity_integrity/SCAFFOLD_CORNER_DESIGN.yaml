            - "First trigger call: HTTP 200 with $.data.state == SENT and $.data.attempt_count == 1 and $.data.version == 2"
            - "Third trigger call: HTTP 409 with $.data.error_id == \"ERR_PROPAGATION_WINDOW_EXPIRED\""
