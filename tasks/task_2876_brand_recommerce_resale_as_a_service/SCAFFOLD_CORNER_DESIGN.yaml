              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { e_credit: "$.data.error_id" }
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { e_chan: "$.data.error_id" }
            - call: "POST /recommerce/customers"
