  # The claim-extraction guide's "Bulk action" endpoint row has no instance because
  # §1.5 declares no bulk endpoint: every mutation writes exactly one aggregate, and
  # POST /development-agreements/{id}/cure-sweep is a fan-out side effect of a single
  # agreement write rather than a per-item bulk request with partial-success semantics.

  - section: errors
    instances:
      - name: corner_every_path_scoped_not_found_code_is_reachable
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
          - errors.ERR_STUDIO_NOT_FOUND
          - errors.ERR_PUBLISHER_NOT_FOUND
          - errors.ERR_PUBLISHER_USER_NOT_FOUND
          - errors.ERR_BUILD_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_PAYMENT_NOT_FOUND
          - errors.ERR_CHANGE_ORDER_NOT_FOUND
          - errors.ERR_ENGAGEMENT_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
        distinguishing_aspect: "Each path-scoped 404 must carry its OWN error_id rather than a generic ERR_NOT_FOUND, and it must be reported even though rows of that type exist in the database (the registry is populated before the sweep). Every id below is a syntactically valid UUID that was never issued, so the failure is a lookup miss and not a request-shape rejection."
        test_recipe:
          setup:
            - "Studio Northlight and publisher Vantage exist with one FINANCE PublisherUser, so each collection is non-empty and a naive 'is the table empty' shortcut cannot pass."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
