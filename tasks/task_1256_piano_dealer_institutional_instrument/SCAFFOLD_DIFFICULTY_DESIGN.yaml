            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-05T09:00:00Z", window_end: "2026-05-05T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
            - call: "POST /piano-dealer/service-plans"
              payload: { order_id: "${o_id}", tier: "STANDARD" }
              as: ServiceCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /piano-dealer/technicians"
              payload: { full_name: "Uma Upright", certification_level: "STANDARD" }
