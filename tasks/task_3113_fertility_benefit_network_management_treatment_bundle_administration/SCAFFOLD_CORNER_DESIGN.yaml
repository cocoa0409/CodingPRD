# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3113_fertility_benefit_network_management_treatment_bundle_administration
#
# Breadth probe over every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Section / claim_type names come from references/claim-extraction-guide.md.
#
# The first instance carries the anchored base setup chain (`&c_*`); later
# instances alias those calls by fixed binding name, so a chain that reuses
# the base resolves the same `${be}`/`${bm}`/`${bc}` captures each time.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: employer_account_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.EmployerAccount
          - endpoints.POST_/employer-accounts
          - endpoints.GET_/employer-accounts/{id}
        distinguishing_aspect: "An employer account created with the five declared inputs comes back 201 with account_status ACTIVE, both computed counters at 0, version 1 and server-minted id / created_at / updated_at — account_status is never client-supplied and entitlement_count starts at 0 even though no bundle exists yet."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - &c_emp
              call: "POST /employer-accounts"
              payload: { employer_name: "Base Employer", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { be: $.data.id }
            - &c_bundle
              call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${be}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 6, max_cycles_per_year: 6, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { bb: $.data.id }
            - &c_bundle_act
              call: "POST /bundle-entitlements/${bb}/activate"
              payload: {}
              as: PlanAdministrator
            - &c_adv
              call: "POST /care-advocates"
              payload: { full_name: "Base Advocate", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { ba: $.data.id }
            - &c_member
              call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "BASE-1", full_name: "Base Member", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { bm: $.data.id }
            - &c_assign
              call: "POST /members/${bm}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - &c_intake
              call: "POST /members/${bm}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
            - &c_clinic
              call: "POST /clinics"
              payload: { legal_name: "Base Clinic", npi: "2000000001", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { bc: $.data.id }
            - &c_clinic_v
              call: "GET /clinics/${bc}"
              payload: {}
              as: NetworkManager
              captures: { bcv: $.data.version }
            - &c_contract
              call: "POST /clinics/${bc}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
              as: NetworkManager
              captures: { bct: $.data.id }
            - &c_contract_act
              call: "POST /clinic-contracts/${bct}/activate"
              payload: { expected_clinic_version: "${bcv}" }
              as: NetworkManager
            - &c_plan
              call: "POST /treatment-plans"
              payload: { member_id: "${bm}", bundle_entitlement_id: "${bb}", pathway_type: "STANDARD_IVF", planned_cycles: 1, min_inter_cycle_days: 0 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bp: $.data.id }
            - &c_member_v
              call: "GET /members/${bm}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bmv: $.data.version }
            - &c_select
              call: "POST /treatment-plans/${bp}/select-clinic"
              payload: { clinic_id: "${bc}", expected_member_version: "${bmv}" }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bpv: $.data.version }
            - &c_auth
              call: "POST /treatment-plans/${bp}/preauthorizations"
              payload: { cycle_sequence_index: 1, criteria_inputs: { age_years: 33, amh_ng_ml: 2.0, prior_cycles: 0, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bax: $.data.id }
            - &c_plan_v
              call: "GET /treatment-plans/${bp}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bpv2: $.data.version }
            - &c_approve
              call: "POST /preauthorizations/${bax}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${bpv}" }
              as: ClinicalReviewer
              as_user_id: "rev-base"
              captures: { bph: $.data.id }
          trigger:
            - call: "GET /employer-accounts/${be}"
              payload: {}
              as: PlanAdministrator
              captures: { be_read: $.data.id }
          assert:
            - "the GET returns 200 with response_type object"
            - "EmployerAccount.${be}.employer_name == \"Base Employer\" and EmployerAccount.${be}.plan_year == 2026"
            - "EmployerAccount.${be}.funding_type == SELF_FUNDED and EmployerAccount.${be}.allocation_method == CONCURRENT_BUNDLE"
            - "EmployerAccount.${be}.account_status == ACTIVE and EmployerAccount.${be}.version >= 1"
            - "EmployerAccount.${be}.active_member_count == 1 and EmployerAccount.${be}.entitlement_count == 1"
            - "the response carries non-null id, created_at and updated_at and meta.api_request_id"

      - name: member_create_missing_required_track_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.required_track
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "required_track is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 404 from the foreign-key gate that an unknown employer_account_id would raise."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer account."
          setup_api_calls:
            - *c_clock
            - *c_emp
          trigger:
            - call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "OMIT-1", full_name: "Omission Member", state_code: "TX" }
              as: CareAdvocate
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_NOT_FOUND"
            - "GET /members?employer_account_id=${be} returns 0 rows"

      - name: bundle_entitlement_create_initializes_counters_and_starts_draft
        claim_type: Defaults
        grounds:
          - entities.BundleEntitlement.fields.bundle_status
          - entities.BundleEntitlement.fields.cycles_remaining
          - endpoints.POST_/bundle-entitlements
          - calculations.bundle_cycle_allowance
        distinguishing_aspect: "A bundle created with 6 lifetime cycles still reports cycles_remaining 0 and cycles_consumed 0 while bundle_status is DRAFT — the allowance is not drawn into cycles_remaining until the entitlement is activated, so reading the pool before activation understates it rather than overstating it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer account."
          setup_api_calls:
            - *c_clock
            - *c_emp
          trigger:
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${be}", bundle_type: "DIAGNOSTIC_IUI", lifetime_max_cycles: 6, max_cycles_per_year: 3, max_transfers_per_cycle: 1, pharmacy_pool_cents: 250000, copay_max: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { nbb: $.data.id }
          assert:
            - "the response status is 201 and BundleEntitlement.${nbb}.bundle_status == DRAFT"
            - "BundleEntitlement.${nbb}.cycles_remaining == 0 and BundleEntitlement.${nbb}.cycles_consumed == 0 and BundleEntitlement.${nbb}.cycles_committed == 0"
            - "BundleEntitlement.${nbb}.pharmacy_remaining_cents == 0 and BundleEntitlement.${nbb}.pharmacy_consumed_cents == 0"
            - "after POST /bundle-entitlements/${nbb}/activate, BundleEntitlement.${nbb}.cycles_remaining == 3 — capped by max_cycles_per_year rather than by the 6-cycle lifetime"
            - "after activation BundleEntitlement.${nbb}.pharmacy_remaining_cents == 250000"
            - "EmployerAccount.${be}.entitlement_count == 1"

      - name: clinic_get_with_unknown_id_returns_clinic_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/clinics/{id}
          - errors[ERR_CLINIC_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the clinic path segment produces the entity-specific 404 ERR_CLINIC_NOT_FOUND, not the generic ERR_NOT_FOUND that an unresolvable body foreign key raises."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No clinic has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /clinics/00000000-0000-4000-8000-000000000099"
              payload: {}
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_CLINIC_NOT_FOUND"
            - "err != ERR_NOT_FOUND — the path-segment miss is entity-specific"
            - "response_type is error and data carries both error_id and message"

      - name: clinic_create_out_of_enum_network_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Clinic.fields.network_tier
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "network_tier is a closed three-member enum, so a value of TIER_ZERO is rejected with 400 ERR_INVALID_REQUEST at the required-field gate rather than silently defaulting to STANDARD or being accepted as a free string."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /clinics"
              payload: { legal_name: "Bad Tier Clinic", npi: "2000000099", state_code: "TX", network_tier: "TIER_ZERO", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /clinics returns 0 rows and the clinic was not persisted"
            - "GET /clinic-contracts returns 0 rows"

      - name: clinic_quality_readings_computed_with_client_values_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.Clinic.fields.live_birth_rate_bps
          - entities.Clinic.fields.composite_quality_bps
          - calculations.network_quality_score
          - endpoints.GET_/clinics/{id}
        distinguishing_aspect: "live_birth_rate_bps, multiple_birth_rate_bps and composite_quality_bps are source: computed, so a client-supplied live_birth_rate_bps of 9999 at creation is ignored and both rates read 0 against an empty workset, and the composite score is 0 rather than 9999 or a maturity bonus."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /clinics"
              payload: { legal_name: "Computed Field Clinic", npi: "2000000002", state_code: "TX", network_tier: "STANDARD", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"], live_birth_rate_bps: 9999, composite_quality_bps: 12345 }
              as: NetworkManager
              captures: { cc: $.data.id }
          assert:
            - "Clinic.${cc}.live_birth_rate_bps == 0 and Clinic.${cc}.multiple_birth_rate_bps == 0"
            - "Clinic.${cc}.composite_quality_bps == 0 — no maturity bonus applies to an empty workset because min(n, 5) is 0"
            - "Clinic.${cc}.cycles_reported == 0 and Clinic.${cc}.clinic_status == IN_REVIEW"
            - "Clinic.${cc}.live_birth_rate_bps != 9999 and Clinic.${cc}.composite_quality_bps != 12345"

      - name: members_list_filters_by_care_advocate_and_clinic_with_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/members
          - response_envelope.pagination_fields
          - entities.Member.fields.care_advocate_id
        distinguishing_aspect: "Members are listed with two independent foreign-key filters available at once — care_advocate_id and clinic_id — and total_count counts the whole filtered set rather than the page, while an unfiltered list also carries every member regardless of status."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base plus a second member on the same employer with no advocate assigned and no clinic of record."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "BASE-2", full_name: "Unassigned Member", state_code: "CA", required_track: "DIAGNOSTIC_IUI" }
              as: CareAdvocate
              captures: { bm2: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { care_advocate_id: "${ba}", limit: 1, offset: 0 }
              as: CareAdvocate
              as_user_id: "${ba}"
          assert:
            - "GET /members?care_advocate_id=${ba} returns exactly 1 row with total_count == 1 and has_more == false"
            - "GET /members?employer_account_id=${be} returns exactly 2 rows with total_count == 2"
            - "GET /members?employer_account_id=${be}&limit=1&offset=1 returns exactly 1 row with total_count == 2 and has_more == false"
            - "GET /members?clinic_id=${bc} returns exactly 1 row — the member whose clinic of record was set by select-clinic"
            - "GET /members?state_code=CA returns exactly 1 row, the unassigned member"
            - "GET /members with no query parameters returns 2 rows with limit defaulting to 10 and offset to 0"
            - "the unassigned member has care_advocate_id null and member_status INTAKE"

      - name: treatment_plan_create_rejects_unknown_bundle_entitlement
        claim_type: Parent Relationships
        grounds:
          - entities.TreatmentPlan.fields.bundle_entitlement_id
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The hybrid topology still puts bundle_entitlement_id in the request body, so an unknown id there is a 404 ERR_NOT_FOUND from the body foreign-key gate — distinct from the entity-specific 404 a missing path segment raises and from the 422 the clinic gate raises."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
          trigger:
            - call: "POST /treatment-plans"
              payload: { member_id: "${bm}", bundle_entitlement_id: "00000000-0000-4000-8000-000000000076", pathway_type: "STANDARD_IVF", planned_cycles: 1 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"
            - "err != ERR_BUNDLE_NOT_FOUND — a body foreign key miss carries the generic id, not the entity-specific one"
            - "GET /treatment-plans?member_id=${bm} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: member_created_in_intake_and_cannot_complete_care_from_intake
        claim_type: Initial State
        grounds:
          - state_machines.Member.initial_state
          - state_machines.Member.CARE_ACTIVE_to_CARE_COMPLETE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A freshly created member starts in INTAKE with intake_completed_at null, and CARE_ACTIVE to CARE_COMPLETE is the only declared close transition, so calling complete-care from INTAKE is a 409 ERR_INVALID_STATE — the member cannot skip the intake hop."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member creation only."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
            - *c_member
          trigger:
            - call: "POST /members/${bm}/complete-care"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { err: $.data.error_id }
          assert:
            - "Member.${bm}.member_status == INTAKE and Member.${bm}.intake_completed_at is null"
            - "Member.${bm}.care_advocate_id is null and Member.${bm}.version == 1"
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "GET /members?care_advocate_id=${ba} returns 0 rows"

      - name: treatment_cycle_revert_from_terminal_outcome_recorded_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TreatmentCycle.terminal_states
          - state_machines.TreatmentCycle.OUTCOME_PENDING_to_OUTCOME_RECORDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "OUTCOME_RECORDED is terminal for the cycle, so cancel and every forward hop attempted after it — start-stimulation, record-retrieval, record-fertilization, record-transfer — all return 409 ERR_INVALID_STATE, and the consumption marker stays CONSUMED rather than being released by the failed cancel."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-26T00:00:00Z. The anchored base through an APPROVED authorization, a cycle created and driven to OUTCOME_RECORDED."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /treatment-plans/${bp}/treatment-cycles"
              payload: { preauthorization_id: "${bph}", retrieval_date: "2026-09-28T00:00:00Z", transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { bcy: $.data.id }
            - call: "POST /treatment-cycles/${bcy}/start-stimulation"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${bcy}/record-retrieval"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${bcy}/record-fertilization"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${bcy}/record-transfer"
              payload: { transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-14T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /_system/tick"
              payload: {}
              as: PlanAdministrator
            - call: "POST /treatment-cycles/${bcy}/record-outcome"
              payload: { live_birth: false, births_count: 0, multiple_birth: false, gestational_weeks: 0 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { bcy_v: $.data.version }
          trigger:
            - call: "POST /treatment-cycles/${bcy}/cancel"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { err_cancel: $.data.error_id }
            - call: "POST /treatment-cycles/${bcy}/start-stimulation"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { err_start: $.data.error_id }
          assert:
            - "TreatmentCycle.${bcy}.cycle_status == OUTCOME_RECORDED and TreatmentCycle.${bcy}.consumption_marker == CONSUMED"
            - "the cancel returns 409 and err_cancel == ERR_INVALID_STATE"
            - "the start-stimulation returns 409 and err_start == ERR_INVALID_STATE"
            - "TreatmentCycle.${bcy}.consumption_marker is still CONSUMED after both refusals — a failed cancel does not release the cycle"
            - "TreatmentCycle.${bcy}.version == ${bcy_v}"
            - "BundleEntitlement.${bb}.cycles_consumed == 1 and BundleEntitlement.${bb}.cycles_remaining == 5"

      - name: pathway_request_begin_review_without_consent_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PathwayRequest.DRAFT_to_CLINICAL_REVIEW
          - errors[ERR_INVALID_STATE]
          - entities.PathwayRequest.fields.consent_signed
        distinguishing_aspect: "DRAFT to CLINICAL_REVIEW requires consent_signed true AND a non-null consent_signed_on, so a request filed with consent_signed false is refused with 409 ERR_INVALID_STATE even though every other gate — member state, employer state — is satisfied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake, plus a PRESERVATION pathway request filed without consent."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - call: "POST /pathway-requests"
              payload: { member_id: "${bm}", pathway_type: "PRESERVATION", consent_signed: false, consent_signed_on: null, coverage_pct: 80 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bpr: $.data.id }
          trigger:
            - call: "POST /pathway-requests/${bpr}/begin-clinical-review"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-consent"
              captures: { err: $.data.error_id }
          assert:
            - "PathwayRequest.${bpr}.pathway_status == DRAFT and PathwayRequest.${bpr}.consent_signed == false"
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "PathwayRequest.${bpr}.pathway_cost_cents == 0"
            - "Member.${bm}.pathway_selected == NONE"
            - "after the request is withdrawn, PathwayRequest.${bpr}.pathway_status == WITHDRAWN"

      - name: surrogacy_pathway_without_carrier_ref_returns_surrogacy_carrier_required
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PathwayRequest.DRAFT_to_CLINICAL_REVIEW
          - errors[ERR_SURROGACY_CARRIER_REQUIRED]
          - errors[ERR_DONOR_AGENCY_REQUIRED]
          - entities.PathwayRequest.fields.gestational_carrier_ref
        distinguishing_aspect: "The two pathway-specific reference fields are required on disjoint enum members: a SURROGACY request without gestational_carrier_ref raises 400 ERR_SURROGACY_CARRIER_REQUIRED while the same payload shape as DONOR_EGG without donor_agency_ref raises the sibling 400 ERR_DONOR_AGENCY_REQUIRED, so neither error is reachable from the other pathway type."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake, plus a consented SURROGACY request with no carrier reference and a consented DONOR_EGG request with no agency reference."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - call: "POST /pathway-requests"
              payload: { member_id: "${bm}", pathway_type: "SURROGACY", consent_signed: true, consent_signed_on: "2026-08-20T00:00:00Z", coverage_pct: 50 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { pr_sur: $.data.id }
            - call: "POST /pathway-requests"
              payload: { member_id: "${bm}", pathway_type: "DONOR_EGG", consent_signed: true, consent_signed_on: "2026-08-20T00:00:00Z", coverage_pct: 50 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { pr_don: $.data.id }
          trigger:
            - call: "POST /pathway-requests/${pr_sur}/begin-clinical-review"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-path"
              captures: { err_sur: $.data.error_id }
            - call: "POST /pathway-requests/${pr_don}/begin-clinical-review"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-path"
              captures: { err_don: $.data.error_id }
          assert:
            - "the surrogacy call returns 400 and err_sur == ERR_SURROGACY_CARRIER_REQUIRED"
            - "the donor call returns 400 and err_don == ERR_DONOR_AGENCY_REQUIRED"
            - "err_sur != ERR_DONOR_AGENCY_REQUIRED and err_don != ERR_SURROGACY_CARRIER_REQUIRED"
            - "both requests remain in pathway_status DRAFT"
            - "no PathwayRequest for ${bm} has pathway_status APPROVED"

      - name: clinic_terminate_twice_returns_invalid_state_on_the_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.Clinic.SUSPENDED_to_TERMINATED
          - state_machines.Clinic.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Clinic TERMINATED is terminal, so the second terminate of an already-terminated clinic returns 409 ERR_INVALID_STATE while the first returns 200 — and the failed second call leaves version unchanged, so the refusal advances nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an ACTIVE clinic contract, then the clinic suspended."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - call: "POST /clinics/${bc}/suspend"
              payload: {}
              as: NetworkManager
              captures: { bc_s1: $.data.version }
            - call: "POST /clinics/${bc}/terminate"
              payload: {}
              as: NetworkManager
              captures: { bc_term: $.data.version }
          trigger:
            - call: "POST /clinics/${bc}/terminate"
              payload: {}
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "Clinic.${bc}.clinic_status == TERMINATED and ClinicContract.${bct}.contracting_status == TERMINATED"
            - "the second terminate does not open a transition — ClinicContract.${bct}.contracting_status == TERMINATED, not ACTIVE"
            - "GET /clinic-contracts?clinic_id=${bc}&contracting_status=ACTIVE returns 0 rows"
            - "the second terminate returns 409 and err == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:

      - name: bundle_cycle_allowance_sequential_versus_concurrent_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.bundle_cycle_allowance
          - entities.EmployerAccount.fields.allocation_method
          - endpoints.GET_/bundle-entitlements/{id}
        distinguishing_aspect: "The same three approved-but-unconsumed authorizations against a 3-cycle bundle leave a CONCURRENT_BUNDLE employer at cycles_remaining 0 while a SEQUENTIAL_BUNDLE employer on an identical bundle sits at 3 — the two allocation_method members net different inclusion sets, so the divergence is 3 cycles rather than a rounding difference."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two employers on identical 3-cycle bundles: BE1 CONCURRENT_BUNDLE, BE2 SEQUENTIAL_BUNDLE, each with its own advocate, member, clinic and contract, and each with three APPROVED authorizations at sequence indices 1, 2 and 3 that have not been consumed by any cycle outcome."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "GET /treatment-plans/${bp}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bp_after1: $.data.version }
            - call: "POST /treatment-plans/${bp}/preauthorizations"
              payload: { cycle_sequence_index: 2, criteria_inputs: { age_years: 33, amh_ng_ml: 2.0, prior_cycles: 1, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bax2: $.data.id }
            - call: "GET /treatment-plans/${bp}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bp_v2: $.data.version }
            - call: "POST /preauthorizations/${bax2}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${bp_v2}" }
              as: ClinicalReviewer
              as_user_id: "rev-var-a"
              captures: { bph2: $.data.id }
            - call: "GET /bundle-entitlements/${bb}"
              payload: {}
              as: PlanAdministrator
              captures: { bb_v: $.data.version }
          trigger:
            - call: "GET /bundle-entitlements/${bb}"
              payload: {}
              as: PlanAdministrator
          assert:
            - "BundleEntitlement.${bb}.cycles_consumed == 0 — the bundle is 3-cycle with two approvals still unconsumed"
            - "BundleEntitlement.${bb}.cycles_committed == 2"
            - "BundleEntitlement.${bb}.cycles_remaining == 1 under CONCURRENT_BUNDLE, because both approved-unconsumed cycles are netted"
            - "the same two authorizations under a SEQUENTIAL_BUNDLE employer leave cycles_remaining at 3, because only consumed cycles are netted"
            - "BundleEntitlement.${bb}.bundle_status == ACTIVE, not EXHAUSTED"
            - "BundleEntitlement.${bb}.version > ${bb_v} - 1"

      - name: claim_allowed_amount_ancillary_slices_are_independent_not_additive
        claim_type: Constants Applied
        grounds:
          - calculations.claim_allowed_amount
          - entities.Claim.fields.adjudication_basis
          - entities.TreatmentPlan.fields.selected_bundle_price_cents
        distinguishing_aspect: "With a pinned bundle ceiling of 1175000 the LAB slice is 141000 and the STORAGE slice is 47000, and because the slices are NOT additive four ancillary claims may each reach their own slice — a bill of 200000 against the 141000 LAB ceiling is allowed at 141000 with 59000 written off, while a 40000 STORAGE bill under its 47000 ceiling is allowed in full."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization, so the pinned ceiling is 1175000."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /claims"
              payload: { member_id: "${bm}", preauthorization_id: "${bph}", service_category: "LAB", billed_cents: 200000, service_date_iso: "2026-09-01T00:00:00Z" }
              as: ClaimsProcessor
              captures: { cl_lab: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${bm}", preauthorization_id: "${bph}", service_category: "STORAGE", billed_cents: 40000, service_date_iso: "2026-09-01T00:00:00Z" }
              as: ClaimsProcessor
              captures: { cl_sto: $.data.id }
          trigger:
            - call: "POST /claims/${cl_lab}/adjudicate"
              payload: {}
              as: ClaimsProcessor
              captures: { cl_lab_v: $.data.version }
          assert:
            - "TreatmentPlan.${bp}.selected_bundle_price_cents == 1175000"
            - "Claim.${cl_lab}.allowed_cents == 141000 — the LAB slice of 1175000 at 12 percent, and the 59000 excess is written off rather than billed"
            - "Claim.${cl_lab}.adjudication_basis == BUNDLE_COMPONENT_RULE because the bill exceeded its slice"
            - "Claim.${cl_lab}.member_cost_share_cents == 28200 and Claim.${cl_lab}.plan_paid_cents == 112800"
            - "after POST /claims/${cl_sto}/adjudicate the STORAGE claim reads allowed_cents 40000 and adjudication_basis CONTRACT_RATE, because 40000 is under its own 47000 slice — the two slices did not consume each other"
            - "Claim.${cl_lab}.version > ${cl_lab_v} - 1"

      - name: cycle_index_assigned_by_created_at_ordering_with_tie_breaks
        claim_type: Correct Result
        grounds:
          - calculations.cycle_sequence_validity_and_consumption
          - entities.TreatmentCycle.fields.cycle_index
          - endpoints.GET_/treatment-cycles
        distinguishing_aspect: "cycle_index is a one-based ordinal over the plan's cycles sorted by created_at ascending with the creating actor and then retrieval_date as tie-breaks, so two cycles created in the same instant do not swap positions and a cancelled cycle keeps its index — the plan's second cycle still reads cycle_index 2 after the first is cancelled."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization, plus two further APPROVED authorizations at sequence indices 2 and 3 and their cycles."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /treatment-plans/${bp}/treatment-cycles"
              payload: { preauthorization_id: "${bph}", retrieval_date: "2026-09-05T00:00:00Z", transfer_date: "2026-09-10T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { cy_a: $.data.id }
            - call: "GET /treatment-plans/${bp}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bp_v3: $.data.version }
            - call: "POST /treatment-plans/${bp}/preauthorizations"
              payload: { cycle_sequence_index: 2, criteria_inputs: { age_years: 33, amh_ng_ml: 2.0, prior_cycles: 1, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { ax_b: $.data.id }
            - call: "POST /preauthorizations/${ax_b}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${bp_v3}" }
              as: ClinicalReviewer
              as_user_id: "rev-ord"
              captures: { ph_b: $.data.id }
            - call: "POST /treatment-plans/${bp}/treatment-cycles"
              payload: { preauthorization_id: "${ph_b}", retrieval_date: "2026-09-20T00:00:00Z", transfer_date: "2026-09-25T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { cy_b: $.data.id }
          trigger:
            - call: "GET /treatment-cycles"
              payload: { treatment_plan_id: "${bp}" }
              as: ClinicCoordinator
              as_user_id: "${bc}"
          assert:
            - "TreatmentCycle.${cy_a}.cycle_index == 1 and TreatmentCycle.${cy_b}.cycle_index == 2"
            - "after POST /treatment-cycles/${cy_a}/cancel, TreatmentCycle.${cy_b}.cycle_index is still 2 — cancellation does not renumber"
            - "TreatmentCycle.${cy_a}.cycle_status == CANCELLED and TreatmentCycle.${cy_a}.consumption_marker == UNCONSUMED"
            - "TreatmentPlan.${bp}.cycles_completed == 0"
            - "GET /treatment-cycles?treatment_plan_id=${bp} returns exactly 2 rows ordered by cycle_index ascending"
            - "GET /treatment-cycles?treatment_plan_id=${bp}&cycle_status=CANCELLED returns exactly 1 row"

  # ===========================================================================
  - section: validations
    instances:

      - name: employer_suspend_expires_pending_authorizations_and_nulls_the_bundle_allowance
        claim_type: Violation → Error
        grounds:
          - state_machines.EmployerAccount.ACTIVE_to_SUSPENDED
          - state_machines.BundleEntitlement.ACTIVE_to_ACTIVE
          - errors[ERR_BENEFIT_INACTIVE]
          - validations[priority=10]
        distinguishing_aspect: "Suspending the employer account cascades in one request: the bundle reads DRAFT with cycles_remaining recomputed to 0 and pharmacy_remaining_cents 0, and each authorization still in SUBMITTED expires with denial_reason_code ACCOUNT_SUSPENDED — so a subsequent decide on that authorization fails at the state gate rather than at the benefit gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization, plus a second plan with a SUBMITTED authorization AX-S and a third plan with a still-DRAFT template."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "GET /bundle-entitlements/${bb}"
              payload: {}
              as: PlanAdministrator
              captures: { bb_pre: $.data.version }
          trigger:
            - call: "POST /employer-accounts/${be}/suspend"
              payload: {}
              as: PlanAdministrator
              captures: { be_v: $.data.version }
          assert:
            - "EmployerAccount.${be}.account_status == SUSPENDED"
            - "the suspend call returns 200 and EmployerAccount.${be}.version > ${bb_pre}"
            - "BundleEntitlement.${bb}.cycles_remaining == 0 after the suspension, even though an APPROVED authorization consumed nothing"
            - "BundleEntitlement.${bb}.pharmacy_remaining_cents == 0 after the suspension"
            - "after POST /employer-accounts/${be}/reactivate, BundleEntitlement.${bb}.cycles_remaining == 3 again under CONCURRENT_BUNDLE with one approval outstanding"
            - "EmployerAccount.${be}.version > ${be_v} after the reactivation"
            - "POST /preauthorizations/${bax}/decide with a conforming reviewer on the already-APPROVED authorization returns 409 ERR_INVALID_STATE, not ERR_BENEFIT_INACTIVE, because the state gate sits above the benefit gate"

      - name: member_care_complete_with_live_plan_returns_invalid_state
        claim_type: Satisfaction → Pass
        grounds:
          - state_machines.Member.CARE_ACTIVE_to_CARE_COMPLETE
          - errors[ERR_INVALID_STATE]
          - state_machines.TreatmentPlan.terminal_states
        distinguishing_aspect: "CARE_ACTIVE to CARE_COMPLETE is refused while any plan of the member is still live, and admitted only after every plan reaches a terminal state — so the same complete-care call flips from 409 ERR_INVALID_STATE to 200 purely as a function of plan state, with no change to the member row in between."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through a PLAN_DRAFT plan on a CARE_ACTIVE member, and a second member with no plan at all."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_plan
            - call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "CARE-2", full_name: "Planless Member", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { bm3: $.data.id }
            - call: "POST /members/${bm3}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${bm3}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
          trigger:
            - call: "POST /members/${bm}/complete-care"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { err_busy: $.data.error_id }
            - call: "POST /members/${bm3}/complete-care"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bm3_v: $.data.version }
          assert:
            - "Member.${bm}.member_status == CARE_ACTIVE and Member.${bm}.intake_completed_at is not null"
            - "the first complete-care returns 409 and err_busy == ERR_INVALID_STATE because TreatmentPlan.${bp}.plan_status == PLAN_DRAFT is live"
            - "the planless member closes successfully: Member.${bm3}.member_status == CARE_COMPLETE and Member.${bm3}.version > ${bm3_v} - 1"
            - "after POST /treatment-plans/${bp}/abandon the first member closes too: Member.${bm}.member_status == CARE_COMPLETE"
            - "EmployerAccount.${be}.active_member_count == 0 once both members are CARE_COMPLETE"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clinic_contract_list_filters_by_status_and_reports_pagination
        claim_type: Computed read
        grounds:
          - endpoints.GET_/clinic-contracts
          - entities.ClinicContract.fields.contracting_status
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Clinic contracts are discoverable from the clinic side only through the filtered list, and contracting_status ACTIVE versus IN_REVIEW partition the rows so that a fresh contract appears under IN_REVIEW and disappears from ACTIVE until its activation — the reverse-reachability channel introduced for the ClinicContract foreign key."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through a clinic with an IN_REVIEW contract, then that contract activated."
          setup_api_calls:
            - *c_clock
            - *c_clinic
            - *c_clinic_v
            - *c_contract
          trigger:
            - call: "GET /clinic-contracts"
              payload: { clinic_id: "${bc}" }
              as: CareAdvocate
              as_user_id: "${ba}"
          assert:
            - "GET /clinic-contracts?clinic_id=${bc} returns exactly 1 row with total_count == 1"
            - "ClinicContract.${bct}.contracting_status == IN_REVIEW and ClinicContract.${bct}.frozen_reason is null"
            - "GET /clinic-contracts?clinic_id=${bc}&contracting_status=ACTIVE returns 0 rows before the activation"
            - "after POST /clinic-contracts/${bct}/activate, ClinicContract.${bct}.contracting_status == ACTIVE and Clinic.${bc}.clinic_status == CONTRACTED"
            - "after the activation GET /clinic-contracts?clinic_id=${bc}&contracting_status=ACTIVE returns exactly 1 row"
            - "GET /clinic-contracts with no query parameters returns 1 row with limit defaulting to 10 and offset to 0"

      - name: preauthorizations_list_partitions_the_two_state_dimensions
        claim_type: Computed read
        grounds:
          - endpoints.GET_/preauthorizations
          - entities.Preauthorization.fields.review_status
          - entities.Preauthorization.fields.consumption_status
        distinguishing_aspect: "The authorization list exposes both state dimensions as independent filters, so review_status=APPROVED and consumption_status=UNCONSUMED both match the same fresh approval whereas consumption_status=PARTIALLY_CONSUMED matches nothing until a cycle is consumed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization that has consumed no cycle."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
          trigger:
            - call: "GET /preauthorizations"
              payload: { treatment_plan_id: "${bp}" }
              as: ClinicalReviewer
              as_user_id: "rev-list"
          assert:
            - "GET /preauthorizations?treatment_plan_id=${bp} returns exactly 1 row with total_count == 1"
            - "GET /preauthorizations?treatment_plan_id=${bp}&review_status=APPROVED returns exactly 1 row"
            - "GET /preauthorizations?treatment_plan_id=${bp}&consumption_status=UNCONSUMED returns exactly 1 row"
            - "GET /preauthorizations?treatment_plan_id=${bp}&consumption_status=PARTIALLY_CONSUMED returns 0 rows"
            - "Preauthorization.${bax}.approved_cycles == 1 and Preauthorization.${bax}.consumed_cycles == 0"
            - "Preauthorization.${bax}.effective_from == \"2026-09-01T00:00:00Z\" and Preauthorization.${bax}.effective_to == \"2027-02-28T00:00:00Z\""

      - name: members_id_surrender_routes_returns_the_child_array
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/members/{id}/surrender-routes
          - entities.SurrenderRoute.fields.route_status
          - endpoints.POST_/members/{id}/surrender-routes
        distinguishing_aspect: "The nested reverse-reachability route returns SurrenderRoute[] under the member, so a member with no route returns an empty array rather than a 404, and a member with one route returns a one-element array — the 1:1-or-0 cardinality shape the contract pins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake, then a PRESERVATION surrender route filed."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_member_v
            - call: "POST /members/${bm}/surrender-routes"
              payload: { pathway_type: "PRESERVATION", carrier_kind: "CUSTODIAN", route_from: "2026-09-01T00:00:00Z", route_to: "2026-10-01T00:00:00Z", expected_member_version: "${bmv}" }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bsr: $.data.id }
          trigger:
            - call: "GET /members/${bm}/surrender-routes"
              payload: {}
              as: Member
              as_user_id: "${bm}"
          assert:
            - "the response returns exactly 1 row and response_type is array"
            - "SurrenderRoute.${bsr}.pathway_type == PRESERVATION and SurrenderRoute.${bsr}.carrier_kind == CUSTODIAN"
            - "SurrenderRoute.${bsr}.route_status == SUBMITTED and SurrenderRoute.${bsr}.surrender_cost_cents == 0"
            - "SurrenderRoute.${bsr}.member_id == ${bm}"
            - "GET /surrender-routes?route_status=ROUTED returns 0 rows before any tick"
            - "after POST /_system/tick at 2026-09-01T00:00:00Z the route reads ROUTED, and GET /members/${bm}/surrender-routes?route_status=ROUTED returns exactly 1 row"

      - name: outcome_records_filtered_list_is_the_only_discovery_channel_for_a_cascade_created_record
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/outcome-records
          - endpoints.POST_/clinics/{id}/report-outcome
          - entities.OutcomeRecord.fields.outcome_status
        distinguishing_aspect: "report-outcome returns the OutcomeRecord it creates, but a record synthesized by the cycle-outcome path under a different plan is discoverable only through the filtered list, so the list is what proves the row exists rather than the creation response."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-26T00:00:00Z. The anchored base through an APPROVED authorization, a cycle driven to OUTCOME_RECORDED, and the outcome reported to the clinic."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
