          - entities.AllowanceLedgerEntry.fields.kind
        distinguishing_aspect: |
          Conserved quantity three, subscription allowance credits: GRANTED minus CONSUMED minus
          EXPIRED plus RESTORED must equal allowance_remaining for the cycle, so invoicing one item
          against a 2-item allowance and then voiding that invoice writes a RESTORED entry and
          returns allowance_remaining to exactly 2. This conserves a credit ledger, not minutes or
          physical units.
        test_recipe:
          setup:
            - "PlanTier BLADE_BASIC with included_items_per_cycle 2; an ACTIVE MONTHLY Subscription with allowance_remaining 2 and one GRANTED ledger entry of quantity 2."
            - "One delivered CHEF_KNIFE ROUTINE_HONE visit linked to that subscription."
            - "A DRAFT PER_VISIT Invoice for the visit that consumed one allowance unit, leaving allowance_remaining 1."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test", billing_mode: "PER_VISIT" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-06-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id }
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind", certifications: [] }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-01" }
              as: PlatformAdmin
              captures: { van: $.data.id }
            - call: "POST /sharpening/bench-days"
              payload: { bench_date: "2026-05-01", bench_minute_budget: 480 }
              as: PlatformAdmin
              captures: { bench: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-01", subscription_id: "${sub}" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/route-runs"
              payload: { van_id: "${van}", technician_id: "${tech}", run_date: "2026-05-01", zone_code: "ZONE_N", service_minute_budget: 420, stop_cap: 8 }
              as: Dispatcher
              captures: { run: $.data.id, run_v: $.data.version }
            - call: "POST /sharpening/route-runs/${run}/stops"
              payload: { service_request_id: "${sr}", sequence: 1, arrival_window_start: "09:00", expected_route_run_version: "${run_v}" }
              as: Dispatcher
              captures: { stop: $.data.id }
            - call: "POST /sharpening/route-runs/${run}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /sharpening/route-stops/${stop}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/pickup"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/bench-intake"
              payload: { bench_day_id: "${bench}" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item}/assess"
              payload: { assessed_damage_tier: "ROUTINE_HONE" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/deliver"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/invoices"
              payload: { account_id: "${acct}", service_request_id: "${sr}" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /sharpening/invoices/${inv}/void"
              payload: {}
              as: BillingClerk
              captures: { inv_status: $.data.status }
          assert:
            - "Invoice.${inv}.status == VOID"
            - "Subscription.${sub}.allowance_remaining == 2"
            - "ServiceRequest.${sr}.billing_status == UNBILLED"
            - "RequestItem.${item}.allowance_applied == false"
            - "GET /sharpening/allowance-entries?subscription_id=${sub} returns total_count == 3 with kinds GRANTED, CONSUMED and RESTORED"
            - "Account.${acct}.outstanding_balance_cents == 0"
