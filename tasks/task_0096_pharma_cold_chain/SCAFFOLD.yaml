# =============================================================================
# Pharmaceutical Cold-Chain Warehousing Management — Seed Tables
# =============================================================================

scenario: |
  Pharmaceutical cold-chain warehousing management: temperature-zone partitioning
  with frozen / refrigerated / cool / room-temperature / controlled-temperature
  zones, sub-zone alarm thresholds, zone-mapping with WMS location tree,
  environmental-monitoring sensor deployment plan, and zone-change-event log;
  inbound receiving with temperature-record-chain verification on the inbound
  shipment (carrier's data logger), visual-and-packaging inspection,
  expiration-date and lot-number recording, qualified-supplier and
  qualified-product cross-check, quarantine-zone placement for non-conforming
  receipts, and inbound-acceptance certificate generation; bin allocation with
  bin attributes (temperature-zone/weight-limit/special-storage requirement),
  product-segregation rules (narcotic / psychotropic / biological / vaccine
  separate storage), cross-contamination prevention, FEFO bin-priority
  assignment, and capacity-utilization monitoring; outbound picking with
  pick-list generation with lot-and-expiration constraints (FEFO), cold-chain
  handover packaging configuration (insulated container with PCM / dry ice),
  packing-temperature pre-check, courier-vehicle temperature pre-conditioning
  verification, and outbound-shipment temperature-logger arming;
  temperature-deviation handling with real-time deviation alert from sensors
  and data loggers, deviation-duration and magnitude classification,
  affected-stock isolation, quality-assurance assessment of product impact,
  customer-notification rules for shipped product, and corrective-and-
  preventive-action workflow; lot recall with recall-classification
  (Class I/II/III), recall-scope identification by lot and shipment-
  destination, downstream-customer notification, recalled-stock return-and-
  quarantine, regulatory-reporting deadline tracking, and post-recall
  effectiveness check; event-driven synchronization with regulatory authority,
  GSP-compliance reporting, manufacturer pharmacovigilance, and transportation
  TMS systems; audit logging for temperature events and recall actions.

domain_name: pharma-cold-chain
api_prefix: /warehouses

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - version_pinning_on_approval
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Warehouse → Zone → Bin tree, plus cross-cutting Lot/Shipment/Recall graphs
  # that span across the tree (a Lot in many Bins, a Recall over many Lots).

  state_machine_shape: branching
  # InboundReceipt has a branching graph (ACCEPT vs QUARANTINE vs REJECT,
  # with revert from QUARANTINE→ACCEPTED after QA release).

  relationship_patterns:
    - one_to_many        # Warehouse → Zone → Bin, Lot → BinAllocations
    - many_to_many       # Recall ↔ Lot (RecallScopeEntry junction)
    - cross_aggregate    # TemperatureEvent on a Zone freezes Lots stored in its Bins

  role_model: segregation_of_duties
  # Receiver may not also QA-release the same receipt; QA may not also pick;
  # Recall officer may not be the QA who first quarantined the lot.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------- Configuration / master data ----------

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique short code" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: gsp_license_no, type: string, source: input, description: "Good Storage Practice license id" }
      - { name: clock_minutes, type: integer, source: system, default: 0, description: "Deterministic clock, minutes since epoch, advanced via /_clock/advance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "{ACTIVE, SUSPENDED}" }

  - name: Zone
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: code, type: string, source: input, description: "Zone code, unique within warehouse" }
      - { name: zone_type, type: enum, source: input, description: "Temperature category", constraints: "{FROZEN, REFRIGERATED, COOL, ROOM_TEMP, CONTROLLED_TEMP, QUARANTINE}" }
      - { name: target_temp_low_c, type: number, source: input, description: "Lower bound of permitted operating range, inclusive, Celsius" }
      - { name: target_temp_high_c, type: number, source: input, description: "Upper bound of permitted operating range, inclusive, Celsius" }
      - { name: alarm_low_c, type: number, source: input, description: "Hard alarm threshold below target_temp_low_c" }
      - { name: alarm_high_c, type: number, source: input, description: "Hard alarm threshold above target_temp_high_c" }
      - { name: current_posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | FROZEN; derived from open deviations", constraints: "{OPEN, RESTRICTED, FROZEN}" }
      - { name: last_sensor_reading_c, type: number, source: computed, description: "Most recent sensor reading; null if no readings yet" }
      - { name: capacity_units, type: integer, source: input, description: "Total bin capacity (sum of bin volume_units), copied at create" }
      - { name: utilization_units, type: integer, source: computed, default: 0, description: "Sum of allocated volume_units across child bins" }

  - name: Bin
    parent: Zone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "Parent zone id" }
      - { name: warehouse_id, type: string, source: system, description: "Denormalised warehouse id (FEFO and recall queries)" }
      - { name: code, type: string, source: input, description: "Bin code, unique within zone" }
      - { name: volume_units, type: integer, source: input, description: "Capacity in abstract storage units" }
      - { name: weight_limit_kg, type: number, source: input, description: "Maximum total weight allowed in this bin" }
      - { name: special_storage_tag, type: enum, source: input, default: NONE, description: "Special-handling tag; NONE means general bin", constraints: "{NONE, NARCOTIC, PSYCHOTROPIC, BIOLOGICAL, VACCINE}" }
      - { name: current_lot_id, type: string, source: computed, description: "Lot currently occupying this bin; null if empty" }
      - { name: occupied_volume, type: integer, source: computed, default: 0, description: "Volume_units consumed by current allocation" }
      - { name: occupied_weight_kg, type: number, source: computed, default: 0, description: "Weight kg consumed by current allocation" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OCCUPIED | LOCKED (when parent zone FROZEN)", constraints: "{AVAILABLE, OCCUPIED, LOCKED}" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal supplier name" }
      - { name: qualified, type: boolean, source: input, default: true, description: "Currently approved on supplier register" }
      - { name: qualification_expiry_minutes, type: integer, source: input, description: "Clock_minutes after which supplier qualification expires" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: required_zone_type, type: enum, source: input, description: "Storage class required", constraints: "{FROZEN, REFRIGERATED, COOL, ROOM_TEMP, CONTROLLED_TEMP}" }
      - { name: special_storage_tag, type: enum, source: input, default: NONE, description: "Segregation class", constraints: "{NONE, NARCOTIC, PSYCHOTROPIC, BIOLOGICAL, VACCINE}" }
      - { name: qualified, type: boolean, source: input, default: true, description: "Cleared on qualified-product register" }
      - { name: unit_weight_kg, type: number, source: input, description: "Weight of one unit" }
      - { name: stability_budget_minutes, type: integer, source: input, description: "Max cumulative out-of-range minutes the product can tolerate before quality is presumed lost" }

  # ---------- Inbound ----------

  - name: InboundReceipt
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: supplier_id, type: string, source: input, description: "Source supplier id" }
      - { name: product_id, type: string, source: input, description: "Product id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: expiry_minutes, type: integer, source: input, description: "Lot expiration timestamp in clock_minutes" }
      - { name: quantity_units, type: integer, source: input, description: "Quantity received in storage units" }
      - { name: carrier_logger_readings, type: array, source: input, description: "Array of {minutes:int, temp_c:number} entries from carrier data logger; chronological" }
      - { name: visual_pass, type: boolean, source: input, description: "Visual & packaging inspection outcome" }
      - { name: temp_chain_intact, type: boolean, source: computed, description: "True iff every reading lies within product.required_zone_type's permitted range" }
      - { name: nonconformance_reason, type: enum, source: computed, description: "Set when receipt rejected/quarantined", constraints: "{NONE, UNQUALIFIED_SUPPLIER, UNQUALIFIED_PRODUCT, VISUAL_FAIL, TEMP_EXCURSION, EXPIRED_ON_ARRIVAL}" }
      - { name: assigned_bin_id, type: string, source: computed, description: "Bin allocated upon ACCEPT; null until accepted" }
      - { name: acceptance_certificate_no, type: string, source: computed, description: "Generated on ACCEPT, format CERT-{warehouse.code}-{seq:06d}" }
      - { name: status, type: enum, source: system, default: PENDING_INSPECTION, description: "Receipt lifecycle", constraints: "{PENDING_INSPECTION, INSPECTED, QUARANTINED, ACCEPTED, REJECTED}" }

  - name: Lot
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: product_id, type: string, source: system, description: "Product id (copied from receipt)" }
      - { name: supplier_id, type: string, source: system, description: "Supplier id (copied from receipt)" }
      - { name: lot_number, type: string, source: system, description: "Manufacturer lot number" }
      - { name: expiry_minutes, type: integer, source: system, description: "Expiry timestamp in clock_minutes" }
      - { name: receipt_id, type: string, source: system, description: "Originating receipt id" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Units currently in stock (not yet picked)" }
      - { name: quantity_picked, type: integer, source: computed, default: 0, description: "Units consumed by outbound picks" }
      - { name: bin_id, type: string, source: computed, description: "Current bin storing this lot; null if quarantined off-bin" }
      - { name: cumulative_excursion_minutes, type: integer, source: computed, default: 0, description: "Total out-of-range minutes accumulated on stored bin" }
      - { name: quality_status, type: enum, source: system, default: RELEASED, description: "RELEASED | QUARANTINED | REJECTED | RECALLED", constraints: "{RELEASED, QUARANTINED, REJECTED, RECALLED}" }

  # ---------- Outbound ----------

  - name: OutboundShipment
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: customer_id, type: string, source: input, description: "Downstream customer identifier (string, not a managed entity)" }
      - { name: product_id, type: string, source: input, description: "Product to ship" }
      - { name: quantity_units, type: integer, source: input, description: "Quantity requested" }
      - { name: packaging_kind, type: enum, source: input, description: "Cold-chain packaging selection", constraints: "{INSULATED_PCM, INSULATED_DRY_ICE, AMBIENT}" }
      - { name: pick_lot_id, type: string, source: computed, description: "Lot chosen by FEFO at picking" }
      - { name: pick_temp_c, type: number, source: input, description: "Recorded packing-bay temperature at time of pack" }
      - { name: vehicle_precondition_temp_c, type: number, source: input, description: "Courier vehicle pre-conditioning reading" }
      - { name: logger_armed, type: boolean, source: computed, default: false, description: "Set true when outbound logger arm event fires" }
      - { name: dispatched_at_minutes, type: integer, source: computed, description: "Clock_minutes when dispatched" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED → PICKED → PACKED → DISPATCHED, with QUARANTINED revert", constraints: "{PLANNED, PICKED, PACKED, DISPATCHED, QUARANTINED, CANCELLED}" }

  # ---------- Monitoring / deviations ----------

  - name: TemperatureEvent
    parent: Zone
    common_fields: false  # append-only: only id + created_at
    fields:
      - { name: zone_id, type: string, source: system, description: "Source zone id" }
      - { name: warehouse_id, type: string, source: system, description: "Denormalised warehouse id" }
      - { name: at_minutes, type: integer, source: input, description: "Clock_minutes when sensor recorded reading" }
      - { name: temp_c, type: number, source: input, description: "Reading in Celsius" }
      - { name: kind, type: enum, source: computed, description: "Classification vs zone thresholds", constraints: "{IN_RANGE, WARNING_LOW, WARNING_HIGH, ALARM_LOW, ALARM_HIGH}" }
      - { name: deviation_id, type: string, source: computed, description: "Deviation aggregated by; null when IN_RANGE" }

  - name: Deviation
    parent: Zone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "Affected zone id" }
      - { name: warehouse_id, type: string, source: system, description: "Denormalised warehouse id" }
      - { name: started_at_minutes, type: integer, source: system, description: "First out-of-range sample minutes" }
      - { name: ended_at_minutes, type: integer, source: computed, description: "Last out-of-range sample minutes before return to range; null while open" }
      - { name: max_magnitude_c, type: number, source: computed, description: "Max abs deviation from nearest zone bound during event" }
      - { name: duration_minutes, type: integer, source: computed, description: "ended_at - started_at + 1; 0 while open" }
      - { name: classification, type: enum, source: computed, description: "Severity tier, pinned by Calculation rule", constraints: "{MINOR, MAJOR, CRITICAL}" }
      - { name: qa_decision, type: enum, source: input, description: "QA assessment outcome", constraints: "{PENDING, RELEASE, QUARANTINE, REJECT}" }
      - { name: capa_id, type: string, source: computed, description: "Linked CAPA when MAJOR/CRITICAL" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Lifecycle", constraints: "{OPEN, CLOSED_PENDING_QA, CLOSED_ASSESSED}" }

  - name: CAPA
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: deviation_id, type: string, source: system, description: "Originating deviation; null when CAPA opened from recall" }
      - { name: recall_id, type: string, source: system, description: "Originating recall; null when CAPA opened from deviation" }
      - { name: due_minutes, type: integer, source: computed, description: "Deadline clock_minutes for completion" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Workflow", constraints: "{OPEN, IN_PROGRESS, COMPLETED, OVERDUE}" }

  # ---------- Recall ----------

  - name: Recall
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: classification, type: enum, source: input, description: "FDA-style recall class", constraints: "{CLASS_I, CLASS_II, CLASS_III}" }
      - { name: reason, type: string, source: input, description: "Free-text recall reason" }
      - { name: initiated_at_minutes, type: integer, source: system, description: "Recall initiation clock_minutes" }
      - { name: report_due_minutes, type: integer, source: computed, description: "Regulatory reporting deadline" }
      - { name: notifications_required, type: integer, source: computed, description: "Count of distinct customer_ids that received affected stock" }
      - { name: notifications_sent, type: integer, source: computed, default: 0, description: "Count of customer notifications dispatched" }
      - { name: returns_expected_units, type: integer, source: computed, description: "Sum of units shipped to downstream customers in scope" }
      - { name: returns_received_units, type: integer, source: computed, default: 0, description: "Sum of units returned by customers" }
      - { name: effectiveness_pass, type: boolean, source: computed, description: "Per Calculation rule; null until effectiveness check run" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle", constraints: "{DRAFT, ANNOUNCED, RETURNS_IN_PROGRESS, EFFECTIVENESS_CHECK, CLOSED}" }

  - name: RecallScopeEntry
    parent: Recall
    common_fields: false  # append-only junction: id + created_at
    fields:
      - { name: recall_id, type: string, source: system, description: "Parent recall id" }
      - { name: lot_id, type: string, source: system, description: "Lot in scope" }
      - { name: shipment_id, type: string, source: system, description: "Outbound shipment that received this lot; null for on-hand stock entries" }
      - { name: scope_kind, type: enum, source: system, description: "Tag", constraints: "{ON_HAND, SHIPPED}" }
      - { name: units, type: integer, source: system, description: "Quantity in this scope entry" }

  # ---------- External-system sync ----------

  - name: ExternalSyncEvent
    parent: Warehouse
    common_fields: false  # append-only event log
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: target_system, type: enum, source: system, description: "Downstream system", constraints: "{REGULATORY_AUTHORITY, GSP_REPORT, PHARMACOVIGILANCE, TMS}" }
      - { name: event_type, type: enum, source: system, description: "Event kind", constraints: "{INBOUND_ACCEPTED, INBOUND_QUARANTINED, DEVIATION_OPENED, DEVIATION_CLOSED, RECALL_ANNOUNCED, RECALL_CLOSED, SHIPMENT_DISPATCHED, CAPA_OVERDUE}" }
      - { name: payload, type: object, source: system, description: "Snapshot of relevant ids and counts" }

  - name: AuditLogEntry
    parent: Warehouse
    common_fields: false  # tamper-evident append-only
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: actor_user_id, type: string, source: system, description: "Acting X-User-ID" }
      - { name: actor_role, type: string, source: system, description: "Acting X-User-Role" }
      - { name: action, type: string, source: system, description: "Verb + entity (e.g., RECEIPT_ACCEPT)" }
      - { name: target_id, type: string, source: system, description: "Target entity id" }
      - { name: at_minutes, type: integer, source: system, description: "Clock_minutes at write" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- InboundReceipt: branching (ACCEPT / QUARANTINE / REJECT, with revert) ----
  - entity: InboundReceipt
    initial_state: PENDING_INSPECTION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_INSPECTION
        to: INSPECTED
        trigger: "POST /receipts/{id}/inspect"
        actor: Receiver
        preconditions:
          - "carrier_logger_readings is non-empty"
          - "visual_pass is provided"
        side_effects:
          - "Compute temp_chain_intact: every reading.temp_c lies within Product.required_zone_type permitted range (Zone.target_temp_low_c..target_temp_high_c lookup table)"
          - "Compute nonconformance_reason in priority order: UNQUALIFIED_SUPPLIER > UNQUALIFIED_PRODUCT > EXPIRED_ON_ARRIVAL (expiry_minutes <= warehouse.clock_minutes) > VISUAL_FAIL > TEMP_EXCURSION; first matching wins, else NONE"

      - from: INSPECTED
        to: ACCEPTED
        trigger: "POST /receipts/{id}/accept"
        actor: QAOfficer
        preconditions:
          - "nonconformance_reason == NONE"
          - "X-User-ID of accept call must differ from X-User-ID of inspect call (segregation of duties)"
        side_effects:
          - "Allocate bin via Calculation fefo_bin_allocation"
          - "Mint Lot row with quantity_on_hand = quantity_units, quality_status = RELEASED, bin_id = assigned_bin_id"
          - "Set Bin.current_lot_id, status=OCCUPIED, occupied_volume += quantity_units, occupied_weight_kg += quantity_units * product.unit_weight_kg"
          - "Recompute Zone.utilization_units (cascades to Bin level)"
          - "Generate acceptance_certificate_no = CERT-{warehouse.code}-{seq:06d} (seq monotonically per warehouse)"
          - "Append ExternalSyncEvent(target=REGULATORY_AUTHORITY, type=INBOUND_ACCEPTED) and (target=GSP_REPORT, type=INBOUND_ACCEPTED)"
          - "Append AuditLogEntry(action=RECEIPT_ACCEPT)"

      - from: INSPECTED
        to: QUARANTINED
        trigger: "POST /receipts/{id}/quarantine"
        actor: QAOfficer
        preconditions:
          - "nonconformance_reason != NONE"
        side_effects:
          - "Allocate a QUARANTINE-zone bin (zone.zone_type=QUARANTINE) of matching warehouse"
          - "Mint Lot row with quality_status = QUARANTINED, bin_id = quarantine bin"
          - "Append ExternalSyncEvent(target=REGULATORY_AUTHORITY, type=INBOUND_QUARANTINED)"
          - "Append AuditLogEntry(action=RECEIPT_QUARANTINE)"

      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /receipts/{id}/release-from-quarantine"
        actor: QAOfficer
        preconditions:
          - "Acting QAOfficer.X-User-ID must differ from the QAOfficer X-User-ID that performed the QUARANTINE transition (segregation of duties)"
          - "Receipt's nonconformance_reason ∈ {VISUAL_FAIL, TEMP_EXCURSION} only (UNQUALIFIED_* and EXPIRED_ON_ARRIVAL are not releasable)"
        side_effects:
          - "Re-allocate bin via Calculation fefo_bin_allocation"
          - "Update Lot.quality_status = RELEASED, Lot.bin_id = new bin, clear quarantine bin"
          - "Generate acceptance_certificate_no"
          - "Append AuditLogEntry(action=RECEIPT_RELEASE_FROM_QUARANTINE)"
        note: "Revert path — branching state machine with comeback from QUARANTINED to ACCEPTED."

      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /receipts/{id}/reject"
        actor: QAOfficer
        preconditions:
          - "Receipt is in QUARANTINED"
        side_effects:
          - "Set Lot.quality_status = REJECTED, clear Bin.current_lot_id of quarantine bin"
          - "Append AuditLogEntry(action=RECEIPT_REJECT)"

      - from: INSPECTED
        to: REJECTED
        trigger: "POST /receipts/{id}/reject"
        actor: QAOfficer
        preconditions:
          - "nonconformance_reason ∈ {UNQUALIFIED_SUPPLIER, UNQUALIFIED_PRODUCT, EXPIRED_ON_ARRIVAL}"
        side_effects:
          - "Append AuditLogEntry(action=RECEIPT_REJECT)"

  # ---- OutboundShipment: linear with QUARANTINE branch ----
  - entity: OutboundShipment
    initial_state: PLANNED
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PICKED
        trigger: "POST /shipments/{id}/pick"
        actor: Picker
        preconditions:
          - "Calculation fefo_pick_selection yields a Lot with sufficient quantity_on_hand"
          - "Selected Lot.quality_status == RELEASED"
          - "Lot.expiry_minutes > warehouse.clock_minutes"
        side_effects:
          - "Set pick_lot_id"
          - "Decrement selected Lot.quantity_on_hand by quantity_units; increment Lot.quantity_picked"
          - "Recompute Bin.occupied_volume, Bin.occupied_weight_kg; set Bin.status=AVAILABLE if occupied_volume drops to 0"
          - "Recompute Zone.utilization_units"

      - from: PICKED
        to: PACKED
        trigger: "POST /shipments/{id}/pack"
        actor: Picker
        preconditions:
          - "packaging_kind matches product.required_zone_type per Validation pack_packaging_match"
          - "pick_temp_c within product's required range"
          - "vehicle_precondition_temp_c within product's required range"
        side_effects:
          - "No stock side effects (pre-dispatch staging)"

      - from: PACKED
        to: DISPATCHED
        trigger: "POST /shipments/{id}/dispatch"
        actor: Picker
        preconditions:
          - "Shipment in PACKED"
          - "All temperature pre-checks still satisfied"
        side_effects:
          - "Set logger_armed = true, dispatched_at_minutes = warehouse.clock_minutes"
          - "Append ExternalSyncEvent(target=TMS, type=SHIPMENT_DISPATCHED)"
          - "Append AuditLogEntry(action=SHIPMENT_DISPATCH)"

      - from: PACKED
        to: QUARANTINED
        trigger: "system: deviation_on_packed_shipment (auto when any IN-RANGE→ALARM_HIGH/ALARM_LOW transition occurs in zone whose bin held this shipment's lot before pick) — fires inside POST /zones/{id}/temperature-events"
        actor: system
        preconditions:
          - "Shipment in PACKED"
          - "Sensor event classification ∈ {ALARM_LOW, ALARM_HIGH}"
        side_effects:
          - "Cascade: stock isolation freezes shipment pending QA"

      - from: QUARANTINED
        to: PACKED
        trigger: "POST /shipments/{id}/qa-release"
        actor: QAOfficer
        preconditions:
          - "Linked deviation.qa_decision == RELEASE"
        side_effects:
          - "Append AuditLogEntry(action=SHIPMENT_QA_RELEASE)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: Picker
        preconditions:
          - "Shipment in PLANNED"
        side_effects:
          - "No stock changes (no pick yet)"

      - from: PICKED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: Picker
        preconditions:
          - "Shipment in PICKED"
        side_effects:
          - "Restore Lot.quantity_on_hand += shipment.quantity_units; Lot.quantity_picked -= shipment.quantity_units (compensating action — see Calculation conserved_lot_units)"
          - "Recompute Bin and Zone utilization"

  # ---- Deviation: linear with QA branch ----
  - entity: Deviation
    initial_state: OPEN
    terminal_states: [CLOSED_ASSESSED]
    transitions:
      - from: OPEN
        to: CLOSED_PENDING_QA
        trigger: "system: zone reading returns to IN_RANGE — fires inside POST /zones/{id}/temperature-events"
        actor: system
        preconditions:
          - "Deviation has at least one out-of-range event"
        side_effects:
          - "Set ended_at_minutes, duration_minutes, classification per Calculation deviation_classification"
          - "Affected stock isolation: every Lot.bin_id ∈ deviation.zone's bins gets quality_status=QUARANTINED if RELEASED; record cumulative_excursion_minutes += duration_minutes"
          - "Cascade: every PACKED OutboundShipment whose pick_lot_id is now quarantined transitions to QUARANTINED"
          - "Append ExternalSyncEvent(target=REGULATORY_AUTHORITY, type=DEVIATION_CLOSED)"
          - "Append AuditLogEntry(action=DEVIATION_CLOSE)"

      - from: CLOSED_PENDING_QA
        to: CLOSED_ASSESSED
        trigger: "POST /deviations/{id}/assess"
        actor: QAOfficer
        preconditions:
          - "qa_decision ∈ {RELEASE, QUARANTINE, REJECT}"
          - "If classification ∈ {MAJOR, CRITICAL} and qa_decision == RELEASE, request must include capa_id of an OPEN CAPA"
        side_effects:
          - "Update each affected Lot's quality_status per qa_decision (RELEASE→RELEASED, QUARANTINE→QUARANTINED, REJECT→REJECTED)"
          - "If classification ∈ {MAJOR, CRITICAL}: open CAPA with due_minutes = closed_at + (classification CRITICAL ? 720 : 4320) (12h vs 72h)"
          - "Append AuditLogEntry(action=DEVIATION_ASSESS)"

  # ---- Recall: linear ----
  - entity: Recall
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /recalls/{id}/announce"
        actor: RecallOfficer
        preconditions:
          - "Recall has ≥1 RecallScopeEntry"
          - "Acting RecallOfficer.X-User-ID must differ from the QAOfficer who performed the most recent DEVIATION_ASSESS on any in-scope lot (segregation of duties)"
        side_effects:
          - "Set initiated_at_minutes = warehouse.clock_minutes"
          - "Compute report_due_minutes per Calculation recall_report_due_minutes"
          - "Mark each in-scope Lot.quality_status = RECALLED (cascade) — any picked OutboundShipment that drew from these lots becomes a notification candidate"
          - "Compute notifications_required (distinct customer_ids from scope entries where scope_kind=SHIPPED)"
          - "Append ExternalSyncEvent(target=REGULATORY_AUTHORITY, type=RECALL_ANNOUNCED) and (target=PHARMACOVIGILANCE, type=RECALL_ANNOUNCED)"
          - "Append AuditLogEntry(action=RECALL_ANNOUNCE)"

      - from: ANNOUNCED
        to: RETURNS_IN_PROGRESS
        trigger: "POST /recalls/{id}/notify-next-customer"
        actor: RecallOfficer
        preconditions:
          - "notifications_sent < notifications_required"
        side_effects:
          - "Increment notifications_sent by 1"
          - "Auto-advance to RETURNS_IN_PROGRESS when notifications_sent == notifications_required"

      - from: RETURNS_IN_PROGRESS
        to: EFFECTIVENESS_CHECK
        trigger: "POST /recalls/{id}/record-return"
        actor: RecallOfficer
        preconditions:
          - "Returns recorded only against SHIPPED scope entries"
        side_effects:
          - "Increment returns_received_units"
          - "Move returned units into a QUARANTINE-zone bin (cascade: Bin.occupied_volume, Zone.utilization_units)"
          - "Auto-advance to EFFECTIVENESS_CHECK when returns_received_units >= returns_expected_units OR clock_minutes >= report_due_minutes"

      - from: EFFECTIVENESS_CHECK
        to: CLOSED
        trigger: "POST /recalls/{id}/close"
        actor: RecallOfficer
        preconditions:
          - "Calculation recall_effectiveness has been computed"
        side_effects:
          - "Set effectiveness_pass per Calculation recall_effectiveness"
          - "If effectiveness_pass == false: open CAPA with due_minutes = clock_minutes + 4320"
          - "Append ExternalSyncEvent(target=REGULATORY_AUTHORITY, type=RECALL_CLOSED)"
          - "Append AuditLogEntry(action=RECALL_CLOSE)"

  # ---- Zone: posture (compound) ----
  - entity: Zone
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: first WARNING_* event without a follow-up IN_RANGE within 5 deterministic minutes"
        actor: system
        preconditions:
          - "Open deviation exists with classification ∈ {MINOR}"
        side_effects:
          - "Zone.current_posture = RESTRICTED — picks may proceed; new ACCEPT allocations blocked"

      - from: OPEN
        to: FROZEN
        trigger: "system: ALARM_LOW or ALARM_HIGH event"
        actor: system
        preconditions:
          - "Reading classified as ALARM_*"
        side_effects:
          - "Zone.current_posture = FROZEN — all child Bin.status flip to LOCKED; ACCEPT and PICK on these bins rejected with ERR_ZONE_FROZEN"
          - "Open new Deviation if none currently open for the zone"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system: subsequent ALARM_* event on same zone"
        actor: system
        preconditions:
          - "Reading classified as ALARM_*"
        side_effects:
          - "As above"

      - from: FROZEN
        to: OPEN
        trigger: "system: linked Deviation.status == CLOSED_ASSESSED"
        actor: system
        preconditions:
          - "All deviations on this zone in CLOSED_ASSESSED"
        side_effects:
          - "Bin.status reverts AVAILABLE/OCCUPIED based on current_lot_id"

      - from: RESTRICTED
        to: OPEN
        trigger: "system: linked Deviation.status == CLOSED_ASSESSED"
        actor: system
        preconditions:
          - "All deviations on this zone in CLOSED_ASSESSED"
        side_effects:
          - "No bin status change"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - scenario: "Two QAOfficers attempt to accept the same InboundReceipt simultaneously"
    guarantee: "At most one acceptance succeeds; the second is rejected as state conflict"
    error_id: ERR_RECEIPT_NOT_INSPECTED
    http_status: 409
    serialization: "First-writer-wins on InboundReceipt.status transition INSPECTED→ACCEPTED"

  - scenario: "Two pickers race to pick the last available units from the same Lot"
    guarantee: "Exactly one pick succeeds for the contested units; the loser is rejected"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    serialization: "First-writer-wins on Lot.quantity_on_hand decrement (atomic compare-and-swap)"

  - scenario: "Two FEFO bin allocations target the same Bin concurrently"
    guarantee: "At most one Lot occupies a Bin at any time"
    error_id: ERR_BIN_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Bin.current_lot_id when Bin.status=AVAILABLE"

  - scenario: "QA assess on Deviation arrives while a new ALARM event opens a new deviation on the same zone"
    guarantee: "Deviation's first assessment wins for the original deviation; new alarm spawns a separate Deviation row, not mutating the in-flight one"
    error_id: ERR_DEVIATION_STATE_INVALID
    http_status: 409
    serialization: "First-writer-wins on Deviation.status; new alarms always create new rows"

  - scenario: "Two RecallOfficers attempt to announce the same Recall simultaneously"
    guarantee: "Exactly one announce succeeds; subsequent announce rejected"
    error_id: ERR_RECALL_NOT_DRAFT
    http_status: 409
    serialization: "First-writer-wins on Recall.status DRAFT→ANNOUNCED"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: fefo_bin_allocation
    trigger: "InboundReceipt INSPECTED→ACCEPTED, and InboundReceipt QUARANTINED→ACCEPTED revert"
    algorithm: waterfall_allocation
    formula: |
      # Candidate set:
      candidates = [b for b in warehouse.bins
                    if b.status == AVAILABLE
                    and b.zone.zone_type == product.required_zone_type
                    and b.zone.current_posture == OPEN
                    and b.special_storage_tag == product.special_storage_tag
                    and b.volume_units >= receipt.quantity_units
                    and b.weight_limit_kg >= receipt.quantity_units * product.unit_weight_kg]
      # Sort key (FEFO priority):
      candidates.sort(key=lambda b: (
        # 1. Lot expiry ordering across the zone (group with earliest expiring neighbours first)
        # zone_earliest_neighbour_expiry = min(expiry_minutes of Lots already in same zone), or INF if zone empty
        zone_earliest_neighbour_expiry(b.zone),
        b.zone.code,    # 2. tie-break by zone code lex asc
        b.code          # 3. tie-break by bin code lex asc
      ))
      if not candidates: raise ERR_NO_ELIGIBLE_BIN
      return candidates[0]
    input_set: "Bins where status=AVAILABLE AND zone.zone_type matches product.required_zone_type AND zone.current_posture=OPEN AND special_storage_tag matches"
    constants: {}
    precision: "Integer comparisons; no rounding."
    variants: []

  - name: fefo_pick_selection
    trigger: "OutboundShipment PLANNED→PICKED"
    algorithm: chronological
    formula: |
      # Candidate set: Lots that match product, are RELEASED, have enough qty
      candidates = [L for L in warehouse.lots
                    if L.product_id == shipment.product_id
                    and L.quality_status == RELEASED
                    and L.expiry_minutes > warehouse.clock_minutes
                    and L.quantity_on_hand >= shipment.quantity_units]
      # Sort key — FEFO chronological (earliest expiry first)
      candidates.sort(key=lambda L: (L.expiry_minutes, L.created_at, L.id))
      if not candidates: raise ERR_NO_FEFO_LOT
      return candidates[0]
    input_set: "Lots in same warehouse with matching product_id and quality_status=RELEASED and not-yet-expired"
    constants: {}
    precision: "Integer minutes."
    variants:
      - name: provisional_pick_estimate
        when: "GET /shipments/{id}/preview before commit (read-only projection)"
        difference: "Same algorithm but DOES NOT decrement Lot.quantity_on_hand; uses a snapshot inclusion of in-flight PLANNED shipments via subtract-reserved virtual debit. Different result vs final pick when another PLANNED shipment has reserved units in between."

  - name: deviation_classification
    trigger: "Deviation transitions OPEN→CLOSED_PENDING_QA (when zone returns to IN_RANGE)"
    algorithm: threshold
    formula: |
      m = deviation.max_magnitude_c            # max abs deviation from zone bound, Celsius
      d = deviation.duration_minutes            # ended_at - started_at + 1
      # Tier table (inclusive lower bounds; >= at every step)
      if d >= 240 or m >= 5.0:        return CRITICAL
      elif d >= 60 or m >= 2.0:       return MAJOR
      else:                           return MINOR
    input_set: "Single Deviation row computed over its TemperatureEvent stream."
    constants:
      CRITICAL_DURATION_MIN: 240
      MAJOR_DURATION_MIN: 60
      CRITICAL_MAGNITUDE_C: 5.0
      MAJOR_MAGNITUDE_C: 2.0
    precision: "Magnitude rounded to 2 decimal places, round_half_up. Duration is integer minutes."
    variants: []

  - name: recall_report_due_minutes
    trigger: "Recall DRAFT→ANNOUNCED"
    algorithm: tiered_pricing
    formula: |
      # Tiered deadline by classification — deadline = initiated_at + tier_offset
      offset = { CLASS_I: 1440,    # 24h
                 CLASS_II: 4320,   # 72h
                 CLASS_III: 14400 }[recall.classification]    # 240h / 10d
      return recall.initiated_at_minutes + offset
    input_set: "One Recall row."
    constants:
      CLASS_I_OFFSET: 1440
      CLASS_II_OFFSET: 4320
      CLASS_III_OFFSET: 14400
    precision: "Integer minutes."
    variants: []

  - name: recall_effectiveness
    trigger: "Recall RETURNS_IN_PROGRESS→EFFECTIVENESS_CHECK or close call"
    algorithm: aggregation
    formula: |
      # Two valid interpretations — scaffold pins (A) as authoritative; (B) is provisional projection used by GET /recalls/{id}/preview
      # (A) Final, customer-confirmed:
      ratio_final = recall.returns_received_units / recall.returns_expected_units    # 0 if expected=0
      pass_final  = ratio_final >= 0.80                                                # threshold inclusive
      # Pin denominator inclusion: ONLY scope_kind=SHIPPED entries count; ON_HAND entries excluded.
    input_set: "RecallScopeEntry rows where scope_kind=SHIPPED."
    constants:
      EFFECTIVENESS_THRESHOLD: 0.80
    precision: "ratio rounded to 4 decimal places, round_half_up; comparison >= 0.80 exactly."
    variants:
      - name: provisional_projection
        when: "GET /recalls/{id}/preview before close"
        difference: |
          (B) Provisional projection: include both SHIPPED scope-entry units AND outstanding-notification-credit:
              projected_received = returns_received_units + (notifications_sent - any_returned_customers) * AVG_RETURN_PER_NOTIFICATION
              ratio_proj = projected_received / returns_expected_units
              pass_proj  = ratio_proj >= 0.80
          Where AVG_RETURN_PER_NOTIFICATION = 1.0 (one unit credit per notified-not-yet-returned customer).
          Variants A and B produce different results for the same Recall when notifications outpace returns.

  - name: conserved_lot_units
    trigger: "Any forward action that decrements Lot.quantity_on_hand (pick) followed by its compensator (shipment cancel)"
    algorithm: aggregation
    formula: |
      # Invariant — for any Lot L, at all times:
      #   L.quantity_on_hand + L.quantity_picked == L.initial_quantity
      #   where L.initial_quantity = receipt.quantity_units at the receipt that minted L
      # Compensating cancel: PICK lowers on_hand by Q and raises picked by Q.
      # Cancel raises on_hand by Q and lowers picked by Q. Sum invariant.
    input_set: "Per-Lot, all-time."
    constants: {}
    precision: "Integer units."
    variants: []

  - name: zone_utilization_invariant
    trigger: "Any allocation, pick, cancel, recall-return that updates Bin.occupied_volume"
    algorithm: aggregation
    formula: |
      # Invariant — for any Zone Z:
      #   Z.utilization_units == sum(B.occupied_volume for B in Z.bins)
      # Pin recompute order: BIN side effects FIRST, then ZONE rollup, then WAREHOUSE-level aggregates.
      # No drift allowed at end of any single request handler.
    input_set: "Per-Zone, recomputed inline at end of every request that touches a child Bin."
    constants: {}
    precision: "Integer units."
    variants: []

  - name: shipment_outbound_total
    trigger: "GET /shipments/{id}/summary (computed read)"
    algorithm: tiered_pricing
    formula: |
      # base packaging cost — tiered by zone_type required
      tier = product.required_zone_type
      base = { FROZEN: 5000, REFRIGERATED: 3000, COOL: 1500, ROOM_TEMP: 500, CONTROLLED_TEMP: 4000 }[tier]   # cents
      # surcharge — non-linear interaction: depends on packaging_kind AND quantity tier
      if shipment.packaging_kind == INSULATED_DRY_ICE:
          surcharge = max(2000, 100 * shipment.quantity_units)            # cents
      elif shipment.packaging_kind == INSULATED_PCM:
          surcharge = min(3000, 50 * shipment.quantity_units)             # cents
      else:    # AMBIENT
          surcharge = 0
      # special-handling premium
      premium = 1000 if product.special_storage_tag in {NARCOTIC, PSYCHOTROPIC, BIOLOGICAL, VACCINE} else 0
      # Pin evaluation order: compute per-line components, ROUND each to whole cents (round_half_up),
      # then SUM. (Alternative — sum first then round — would diverge for fractional intermediate values,
      # which arise once any future per-unit fee is introduced; the scaffold pins per-line rounding.)
      total_cents = round_half_up(base) + round_half_up(surcharge) + round_half_up(premium)
      return total_cents
    input_set: "One OutboundShipment."
    constants:
      FROZEN_BASE_CENTS: 5000
      REFRIGERATED_BASE_CENTS: 3000
      COOL_BASE_CENTS: 1500
      ROOM_TEMP_BASE_CENTS: 500
      CONTROLLED_TEMP_BASE_CENTS: 4000
      DRY_ICE_MIN_CENTS: 2000
      DRY_ICE_PER_UNIT_CENTS: 100
      PCM_MAX_CENTS: 3000
      PCM_PER_UNIT_CENTS: 50
      SPECIAL_PREMIUM_CENTS: 1000
    precision: "round_half_up to whole cents at the per-line level, then sum."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # ---- 1–3: auth / authz / existence ----
  - { priority: 1, category: auth, check: "X-User-Role header present and ∈ declared roles", error_id: ERR_AUTH_MISSING_ROLE, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-ID header present", error_id: ERR_AUTH_MISSING_USER, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role permitted for operation per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-bound resource(s) exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Body-referenced foreign keys (supplier_id, product_id, customer_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "POST /warehouses/{wid}/receipts, POST /warehouses/{wid}/shipments" }

  # ---- 6–10: state preconditions ----
  - { priority: 6, category: state, check: "InboundReceipt in PENDING_INSPECTION for inspect", error_id: ERR_RECEIPT_NOT_PENDING, http_status: 409, applies_to: "POST /receipts/{id}/inspect" }
  - { priority: 7, category: state, check: "InboundReceipt in INSPECTED for accept/quarantine", error_id: ERR_RECEIPT_NOT_INSPECTED, http_status: 409, applies_to: "POST /receipts/{id}/accept, POST /receipts/{id}/quarantine" }
  - { priority: 8, category: state, check: "Shipment status matches transition source", error_id: ERR_SHIPMENT_STATE_INVALID, http_status: 409, applies_to: "POST /shipments/{id}/*" }
  - { priority: 9, category: state, check: "Recall.status == DRAFT for announce", error_id: ERR_RECALL_NOT_DRAFT, http_status: 409, applies_to: "POST /recalls/{id}/announce" }
  - { priority: 10, category: state, check: "Deviation.status == CLOSED_PENDING_QA for assess", error_id: ERR_DEVIATION_STATE_INVALID, http_status: 409, applies_to: "POST /deviations/{id}/assess" }

  # ---- 11–14: business_safety (compliance & cold-chain integrity) ----
  - { priority: 11, category: business_safety, check: "Zone.current_posture != FROZEN for any allocation or pick on that zone's bins", error_id: ERR_ZONE_FROZEN, http_status: 409, applies_to: "POST /receipts/{id}/accept, POST /receipts/{id}/release-from-quarantine, POST /shipments/{id}/pick" }
  - { priority: 12, category: business_safety, check: "On accept: Supplier.qualified=true AND Supplier.qualification_expiry_minutes > warehouse.clock_minutes; if not, route must be quarantine/reject not accept", error_id: ERR_UNQUALIFIED_SUPPLIER, http_status: 422, applies_to: "POST /receipts/{id}/accept" }
  - { priority: 13, category: business_safety, check: "On accept: Product.qualified=true; if not, must quarantine or reject", error_id: ERR_UNQUALIFIED_PRODUCT, http_status: 422, applies_to: "POST /receipts/{id}/accept" }
  - { priority: 14, category: business_safety, check: "On accept: lot expiry_minutes > warehouse.clock_minutes + 1 (cannot accept expired or same-minute-expiring lot)", error_id: ERR_EXPIRED_LOT, http_status: 422, applies_to: "POST /receipts/{id}/accept" }

  # ---- 15–18: business_constraint (segregation, capacity, FEFO) ----
  - { priority: 15, category: business_constraint, check: "Pack: packaging_kind matches required_zone_type — FROZEN→INSULATED_DRY_ICE; REFRIGERATED/COOL/CONTROLLED_TEMP→INSULATED_PCM; ROOM_TEMP→AMBIENT", error_id: ERR_PACKAGING_MISMATCH, http_status: 422, applies_to: "POST /shipments/{id}/pack" }
  - { priority: 16, category: business_constraint, check: "Bin allocation: chosen Bin.special_storage_tag == product.special_storage_tag (NARCOTIC/PSYCHOTROPIC/BIOLOGICAL/VACCINE must use bin with matching tag; NONE products must use NONE bins)", error_id: ERR_SEGREGATION_VIOLATION, http_status: 422, applies_to: "POST /receipts/{id}/accept, POST /receipts/{id}/release-from-quarantine" }
  - { priority: 17, category: business_constraint, check: "Pick: selected Lot is the FEFO-earliest (calc fefo_pick_selection); if a non-FEFO lot is requested via override, reject", error_id: ERR_FEFO_VIOLATION, http_status: 422, applies_to: "POST /shipments/{id}/pick" }
  - { priority: 18, category: business_constraint, check: "Pack/dispatch temperature pre-checks: pick_temp_c and vehicle_precondition_temp_c lie within product zone range", error_id: ERR_TEMP_PRECHECK_FAIL, http_status: 422, applies_to: "POST /shipments/{id}/pack, POST /shipments/{id}/dispatch" }

  # ---- 19–22: business_constraint (capacity / segregation cap) ----
  - { priority: 19, category: business_constraint, check: "Bin allocation: receipt.quantity_units <= bin.volume_units AND total weight <= bin.weight_limit_kg", error_id: ERR_BIN_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /receipts/{id}/accept, POST /receipts/{id}/release-from-quarantine" }
  - { priority: 20, category: business_constraint, check: "Pick: requested quantity_units > 0", error_id: ERR_QUANTITY_INVALID, http_status: 422, applies_to: "POST /warehouses/{wid}/shipments" }
  - { priority: 21, category: business_constraint, check: "Pick: Lot.quantity_on_hand >= shipment.quantity_units", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /shipments/{id}/pick" }
  - { priority: 22, category: business_constraint, check: "RBAC segregation of duties: inspector of a receipt may not accept it; assessor of a deviation may not initiate the recall it spawned", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /receipts/{id}/accept, POST /recalls/{id}/announce" }

  # ---- 23–25: business_referential ----
  - { priority: 23, category: business_referential, check: "Carrier logger readings array non-empty and monotonic in minutes", error_id: ERR_LOGGER_DATA_INVALID, http_status: 422, applies_to: "POST /receipts/{id}/inspect" }
  - { priority: 24, category: business_referential, check: "Recall scope contains ≥1 lot from this warehouse", error_id: ERR_RECALL_SCOPE_EMPTY, http_status: 422, applies_to: "POST /recalls/{id}/announce" }
  - { priority: 25, category: business_referential, check: "On record-return: scope entry belongs to this recall and is SHIPPED", error_id: ERR_RETURN_SCOPE_INVALID, http_status: 422, applies_to: "POST /recalls/{id}/record-return" }

  # ---- 26–27: business_temporal ----
  - { priority: 26, category: business_temporal, check: "Temperature event at_minutes >= warehouse.clock_minutes - 1 AND <= warehouse.clock_minutes (no back-dating, no future-dating)", error_id: ERR_TEMP_EVENT_TIME_INVALID, http_status: 422, applies_to: "POST /zones/{id}/temperature-events" }
  - { priority: 27, category: business_temporal, check: "Recall announce: report_due_minutes computed and > initiated_at_minutes (sanity)", error_id: ERR_RECALL_DEADLINE_INVALID, http_status: 422, applies_to: "POST /recalls/{id}/announce" }

  # ---- 28: business_fiscal (capacity is the fiscal-style budget here) ----
  - { priority: 28, category: business_fiscal, check: "Zone.utilization_units + receipt.quantity_units <= zone.capacity_units", error_id: ERR_ZONE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /receipts/{id}/accept, POST /receipts/{id}/release-from-quarantine" }

  # ---- 29: OCC ----
  - { priority: 29, category: business_constraint, check: "If body includes version, must equal current resource.version", error_id: ERR_VERSION_CONFLICT, http_status: 409, applies_to: "all PATCH/POST action endpoints" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Warehouse / Zone / Bin master data ----------
  - { method: POST,  path: "/warehouses",                                description: "Create warehouse",                              roles: [WarehouseAdmin], code: 201, input: [code, name, gsp_license_no], output: Warehouse }
  - { method: GET,   path: "/warehouses",                                description: "List warehouses",                               roles: [WarehouseAdmin, Receiver, QAOfficer, Picker, RecallOfficer], code: 200, input: ["limit?", "offset?"], output: "Warehouse[]" }
  - { method: GET,   path: "/warehouses/{wid}",                          description: "Get warehouse",                                 roles: [WarehouseAdmin, Receiver, QAOfficer, Picker, RecallOfficer], code: 200, input: [], output: Warehouse }

  - { method: POST,  path: "/warehouses/{wid}/zones",                    description: "Create zone",                                   roles: [WarehouseAdmin], code: 201, input: [code, zone_type, target_temp_low_c, target_temp_high_c, alarm_low_c, alarm_high_c, capacity_units], output: Zone }
  - { method: GET,   path: "/warehouses/{wid}/zones",                    description: "List zones",                                    roles: [WarehouseAdmin, Receiver, QAOfficer, Picker, RecallOfficer], code: 200, input: ["limit?", "offset?", "filter[zone_type]?", "filter[current_posture]?"], output: "Zone[]" }
  - { method: GET,   path: "/zones/{id}",                                description: "Get zone (with posture, utilization)",          roles: [WarehouseAdmin, Receiver, QAOfficer, Picker, RecallOfficer], code: 200, input: [], output: Zone }

  - { method: POST,  path: "/zones/{zid}/bins",                          description: "Create bin",                                    roles: [WarehouseAdmin], code: 201, input: [code, volume_units, weight_limit_kg, "special_storage_tag?"], output: Bin }
  - { method: GET,   path: "/zones/{zid}/bins",                          description: "List bins in zone",                             roles: [WarehouseAdmin, Receiver, QAOfficer, Picker, RecallOfficer], code: 200, input: ["limit?", "offset?", "filter[status]?"], output: "Bin[]" }

  # ---------- Suppliers / products (master data) ----------
  - { method: POST,  path: "/suppliers",                                 description: "Register supplier",                             roles: [WarehouseAdmin], code: 201, input: [name, "qualified?", qualification_expiry_minutes], output: Supplier }
  - { method: GET,   path: "/suppliers/{id}",                            description: "Get supplier",                                  roles: [WarehouseAdmin, Receiver, QAOfficer], code: 200, input: [], output: Supplier }
  - { method: POST,  path: "/products",                                  description: "Register product",                              roles: [WarehouseAdmin], code: 201, input: [sku, name, required_zone_type, "special_storage_tag?", "qualified?", unit_weight_kg, stability_budget_minutes], output: Product }
  - { method: GET,   path: "/products/{id}",                             description: "Get product",                                   roles: [WarehouseAdmin, Receiver, QAOfficer, Picker], code: 200, input: [], output: Product }

  # ---------- Inbound ----------
  - { method: POST,  path: "/warehouses/{wid}/receipts",                 description: "Create receipt (PENDING_INSPECTION)",           roles: [Receiver], code: 201, input: [supplier_id, product_id, lot_number, expiry_minutes, quantity_units, carrier_logger_readings, visual_pass], output: InboundReceipt }
  - { method: GET,   path: "/warehouses/{wid}/receipts",                 description: "List receipts",                                 roles: [Receiver, QAOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[status]?"], output: "InboundReceipt[]" }
  - { method: GET,   path: "/receipts/{id}",                             description: "Get receipt",                                   roles: [Receiver, QAOfficer, WarehouseAdmin], code: 200, input: [], output: InboundReceipt }
  - { method: POST,  path: "/receipts/{id}/inspect",                     description: "Receiver inspection (computes temp_chain_intact, nonconformance_reason)", roles: [Receiver], code: 200, input: ["version?"], output: InboundReceipt }
  - { method: POST,  path: "/receipts/{id}/accept",                      description: "QA accept — mints Lot, allocates bin, issues certificate", roles: [QAOfficer], code: 200, input: ["version?"], output: InboundReceipt }
  - { method: POST,  path: "/receipts/{id}/quarantine",                  description: "QA route to quarantine zone",                   roles: [QAOfficer], code: 200, input: ["version?"], output: InboundReceipt }
  - { method: POST,  path: "/receipts/{id}/release-from-quarantine",     description: "QA later releases quarantined receipt to ACCEPTED (revert)", roles: [QAOfficer], code: 200, input: ["version?"], output: InboundReceipt }
  - { method: POST,  path: "/receipts/{id}/reject",                      description: "QA reject (terminal)",                          roles: [QAOfficer], code: 200, input: ["version?"], output: InboundReceipt }

  # ---------- Lots ----------
  - { method: GET,   path: "/warehouses/{wid}/lots",                     description: "List lots",                                     roles: [Receiver, QAOfficer, Picker, RecallOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[product_id]?", "filter[quality_status]?"], output: "Lot[]" }
  - { method: GET,   path: "/lots/{id}",                                 description: "Get lot",                                       roles: [Receiver, QAOfficer, Picker, RecallOfficer, WarehouseAdmin], code: 200, input: [], output: Lot }

  # ---------- Outbound ----------
  - { method: POST,  path: "/warehouses/{wid}/shipments",                description: "Create shipment (PLANNED)",                     roles: [Picker], code: 201, input: [customer_id, product_id, quantity_units, packaging_kind, pick_temp_c, vehicle_precondition_temp_c], output: OutboundShipment }
  - { method: GET,   path: "/warehouses/{wid}/shipments",                description: "List shipments",                                roles: [Picker, QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[status]?"], output: "OutboundShipment[]" }
  - { method: GET,   path: "/shipments/{id}",                            description: "Get shipment",                                  roles: [Picker, QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: [], output: OutboundShipment }
  - { method: GET,   path: "/shipments/{id}/summary",                    description: "Computed summary (shipment_outbound_total cents)", roles: [Picker, WarehouseAdmin], code: 200, input: [], output: "object" }
  - { method: POST,  path: "/shipments/{id}/pick",                       description: "FEFO pick — selects Lot, decrements stock",     roles: [Picker], code: 200, input: ["version?"], output: OutboundShipment }
  - { method: POST,  path: "/shipments/{id}/pack",                       description: "Pack — temperature pre-check",                  roles: [Picker], code: 200, input: ["version?"], output: OutboundShipment }
  - { method: POST,  path: "/shipments/{id}/dispatch",                   description: "Dispatch — arms logger",                        roles: [Picker], code: 200, input: ["version?"], output: OutboundShipment }
  - { method: POST,  path: "/shipments/{id}/qa-release",                 description: "Release a QUARANTINED shipment back to PACKED",  roles: [QAOfficer], code: 200, input: ["version?"], output: OutboundShipment }
  - { method: POST,  path: "/shipments/{id}/cancel",                     description: "Cancel shipment (compensates lot stock)",       roles: [Picker], code: 200, input: ["version?"], output: OutboundShipment }

  # ---------- Temperature monitoring ----------
  - { method: POST,  path: "/zones/{id}/temperature-events",             description: "Record sensor reading; auto-classify and update Deviation, Zone posture, Lot quality cascades", roles: [WarehouseAdmin], code: 201, input: [at_minutes, temp_c], output: TemperatureEvent }
  - { method: GET,   path: "/zones/{id}/temperature-events",             description: "List temperature events for zone",              roles: [WarehouseAdmin, QAOfficer, RecallOfficer], code: 200, input: ["limit?", "offset?", "filter[kind]?"], output: "TemperatureEvent[]" }

  # ---------- Deviations / CAPA ----------
  - { method: GET,   path: "/warehouses/{wid}/deviations",               description: "List deviations",                               roles: [QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[status]?", "filter[classification]?"], output: "Deviation[]" }
  - { method: GET,   path: "/deviations/{id}",                           description: "Get deviation",                                 roles: [QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: [], output: Deviation }
  - { method: POST,  path: "/deviations/{id}/assess",                    description: "QA decision (RELEASE/QUARANTINE/REJECT)",       roles: [QAOfficer], code: 200, input: [qa_decision, "capa_id?", "version?"], output: Deviation }
  - { method: GET,   path: "/warehouses/{wid}/capas",                    description: "List CAPAs",                                    roles: [QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[status]?"], output: "CAPA[]" }
  - { method: GET,   path: "/capas/{id}",                                description: "Get CAPA",                                      roles: [QAOfficer, RecallOfficer, WarehouseAdmin], code: 200, input: [], output: CAPA }
  - { method: POST,  path: "/capas/{id}/complete",                       description: "Mark CAPA completed",                           roles: [QAOfficer], code: 200, input: ["version?"], output: CAPA }

  # ---------- Recalls ----------
  - { method: POST,  path: "/warehouses/{wid}/recalls",                  description: "Create recall (DRAFT)",                         roles: [RecallOfficer], code: 201, input: [classification, reason], output: Recall }
  - { method: POST,  path: "/recalls/{id}/scope",                        description: "Add a RecallScopeEntry (lot_id, optional shipment_id, units, scope_kind)", roles: [RecallOfficer], code: 201, input: [lot_id, "shipment_id?", units, scope_kind], output: RecallScopeEntry }
  - { method: POST,  path: "/recalls/{id}/announce",                     description: "Announce recall — sets deadline, marks lots RECALLED", roles: [RecallOfficer], code: 200, input: ["version?"], output: Recall }
  - { method: POST,  path: "/recalls/{id}/notify-next-customer",         description: "Send one customer notification",                roles: [RecallOfficer], code: 200, input: ["version?"], output: Recall }
  - { method: POST,  path: "/recalls/{id}/record-return",                description: "Record customer return into quarantine bin",    roles: [RecallOfficer], code: 200, input: [scope_entry_id, units], output: Recall }
  - { method: POST,  path: "/recalls/{id}/close",                        description: "Close after effectiveness check",               roles: [RecallOfficer], code: 200, input: ["version?"], output: Recall }
  - { method: GET,   path: "/recalls/{id}",                              description: "Get recall",                                    roles: [RecallOfficer, QAOfficer, WarehouseAdmin], code: 200, input: [], output: Recall }
  - { method: GET,   path: "/recalls/{id}/preview",                      description: "Provisional effectiveness projection",          roles: [RecallOfficer, QAOfficer], code: 200, input: [], output: "object" }
  - { method: GET,   path: "/warehouses/{wid}/recalls",                  description: "List recalls",                                  roles: [RecallOfficer, QAOfficer, WarehouseAdmin], code: 200, input: ["limit?", "offset?", "filter[status]?", "filter[classification]?"], output: "Recall[]" }

  # ---------- External-system sync log ----------
  - { method: GET,   path: "/warehouses/{wid}/external-events",          description: "List ExternalSyncEvents",                       roles: [WarehouseAdmin, RecallOfficer, QAOfficer], code: 200, input: ["limit?", "offset?", "filter[target_system]?", "filter[event_type]?"], output: "ExternalSyncEvent[]" }

  # ---------- Audit log ----------
  - { method: GET,   path: "/warehouses/{wid}/audit-log",                description: "List AuditLogEntry rows",                       roles: [WarehouseAdmin, QAOfficer, RecallOfficer], code: 200, input: ["limit?", "offset?", "filter[action]?", "filter[actor_role]?"], output: "AuditLogEntry[]" }

  # ---------- Deterministic clock / time-gated control ----------
  - { method: POST,  path: "/warehouses/{wid}/_clock/advance",           description: "Advance deterministic clock_minutes by N minutes; triggers any scheduled auto-transitions (e.g., CAPA OVERDUE, recall RETURNS_IN_PROGRESS→EFFECTIVENESS_CHECK on deadline)", roles: [WarehouseAdmin], code: 200, input: [minutes], output: Warehouse }
  - { method: POST,  path: "/warehouses/{wid}/_sweep/run",               description: "Idempotent sweep: mark CAPAs OVERDUE if due_minutes < clock_minutes; auto-advance recalls past their deadline; recompute zone postures",  roles: [WarehouseAdmin], code: 200, input: [], output: "object" }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_AUTH_MISSING_ROLE,         http: 401, condition: "X-User-Role header missing or not in declared roles" }
  - { id: ERR_AUTH_MISSING_USER,         http: 401, condition: "X-User-ID header missing" }
  - { id: ERR_FORBIDDEN,                 http: 403, condition: "Role not permitted for the requested operation" }
  - { id: ERR_SOD_VIOLATION,             http: 403, condition: "Segregation-of-duties: same user attempting two-step operation" }

  # Existence
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Path or body-referenced resource does not exist" }

  # State preconditions
  - { id: ERR_RECEIPT_NOT_PENDING,       http: 409, condition: "Receipt not in PENDING_INSPECTION for inspect" }
  - { id: ERR_RECEIPT_NOT_INSPECTED,     http: 409, condition: "Receipt not in INSPECTED for accept/quarantine" }
  - { id: ERR_RECEIPT_NOT_QUARANTINED,   http: 409, condition: "Receipt not in QUARANTINED for release/reject from quarantine" }
  - { id: ERR_SHIPMENT_STATE_INVALID,    http: 409, condition: "Shipment current status invalid for this transition" }
  - { id: ERR_RECALL_NOT_DRAFT,          http: 409, condition: "Recall not in DRAFT for announce" }
  - { id: ERR_RECALL_STATE_INVALID,      http: 409, condition: "Recall current status invalid for this transition" }
  - { id: ERR_DEVIATION_STATE_INVALID,   http: 409, condition: "Deviation status not eligible for assess" }
  - { id: ERR_CAPA_STATE_INVALID,        http: 409, condition: "CAPA not in OPEN/IN_PROGRESS for complete" }
  - { id: ERR_BIN_UNAVAILABLE,           http: 409, condition: "Target bin not AVAILABLE (race or already occupied)" }

  # Business — safety / compliance
  - { id: ERR_ZONE_FROZEN,               http: 409, condition: "Zone posture is FROZEN; operation blocked" }
  - { id: ERR_UNQUALIFIED_SUPPLIER,      http: 422, condition: "Supplier not qualified or qualification expired at time of accept" }
  - { id: ERR_UNQUALIFIED_PRODUCT,       http: 422, condition: "Product not qualified at time of accept" }
  - { id: ERR_EXPIRED_LOT,               http: 422, condition: "Lot expiry_minutes <= clock_minutes on accept" }
  - { id: ERR_TEMP_PRECHECK_FAIL,        http: 422, condition: "pick_temp_c or vehicle_precondition_temp_c out of product's required range" }
  - { id: ERR_LOGGER_DATA_INVALID,       http: 422, condition: "Carrier logger readings empty or not monotonic" }

  # Business — constraint
  - { id: ERR_PACKAGING_MISMATCH,        http: 422, condition: "packaging_kind does not match product.required_zone_type" }
  - { id: ERR_SEGREGATION_VIOLATION,     http: 422, condition: "Bin.special_storage_tag does not match Product.special_storage_tag" }
  - { id: ERR_FEFO_VIOLATION,            http: 422, condition: "Pick attempted on non-FEFO-earliest lot" }
  - { id: ERR_NO_FEFO_LOT,               http: 422, condition: "No eligible lot satisfies pick criteria" }
  - { id: ERR_NO_ELIGIBLE_BIN,           http: 422, condition: "No bin satisfies FEFO bin allocation criteria" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED,     http: 422, condition: "Receipt quantity or weight exceeds chosen bin's capacity/weight limit" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED,    http: 422, condition: "Zone.utilization_units + receipt.quantity_units > zone.capacity_units" }
  - { id: ERR_QUANTITY_INVALID,          http: 422, condition: "Requested quantity_units <= 0" }
  - { id: ERR_INSUFFICIENT_STOCK,        http: 409, condition: "Lot.quantity_on_hand < shipment.quantity_units at pick time" }
  - { id: ERR_RECALL_SCOPE_EMPTY,        http: 422, condition: "Recall has no scope entries at announce" }
  - { id: ERR_RETURN_SCOPE_INVALID,      http: 422, condition: "Return references invalid scope entry" }
  - { id: ERR_TEMP_EVENT_TIME_INVALID,   http: 422, condition: "Temperature event at_minutes outside permitted window" }
  - { id: ERR_RECALL_DEADLINE_INVALID,   http: 422, condition: "Computed report_due_minutes not strictly after initiated_at_minutes" }
  - { id: ERR_VERSION_CONFLICT,          http: 409, condition: "Submitted version != current resource.version" }
  - { id: ERR_VALIDATION_FAILED,         http: 422, condition: "Generic field-level validation failure (type/format)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: WarehouseAdmin
    description: "Operator that creates warehouses/zones/bins, registers master data, advances the deterministic clock, runs sweeps."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses, POST /warehouses/{wid}/zones, POST /zones/{zid}/bins"
      - "POST /suppliers, POST /products"
      - "POST /zones/{id}/temperature-events"
      - "POST /warehouses/{wid}/_clock/advance"
      - "POST /warehouses/{wid}/_sweep/run"
    shared_operations:
      - "All GET endpoints"

  - name: Receiver
    description: "Receives inbound deliveries and performs the first-pass inspection. Cannot accept its own inspection (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses/{wid}/receipts"
      - "POST /receipts/{id}/inspect"
    shared_operations:
      - "GET endpoints for warehouses, zones, bins, receipts, lots, products, suppliers"

  - name: QAOfficer
    description: "Quality Assurance reviewer — accepts/quarantines/rejects receipts, assesses deviations. Cannot inspect the receipt it accepts."
    identity: opaque
    exclusive_operations:
      - "POST /receipts/{id}/accept, /quarantine, /release-from-quarantine, /reject"
      - "POST /shipments/{id}/qa-release"
      - "POST /deviations/{id}/assess"
      - "POST /capas/{id}/complete"
    shared_operations:
      - "GET endpoints for receipts, lots, shipments, deviations, capas, recalls, audit-log"

  - name: Picker
    description: "Outbound operator — creates shipments, picks (FEFO), packs, dispatches."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses/{wid}/shipments"
      - "POST /shipments/{id}/pick, /pack, /dispatch, /cancel"
    shared_operations:
      - "GET endpoints for shipments, lots, products, zones, bins, warehouses"

  - name: RecallOfficer
    description: "Manages recall lifecycle — drafts, announces, notifies, records returns, closes. Cannot announce a recall whose triggering deviation it personally assessed (SOD)."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses/{wid}/recalls"
      - "POST /recalls/{id}/scope, /announce, /notify-next-customer, /record-return, /close"
    shared_operations:
      - "GET endpoints for recalls, lots, deviations, shipments, audit-log, external-events"
