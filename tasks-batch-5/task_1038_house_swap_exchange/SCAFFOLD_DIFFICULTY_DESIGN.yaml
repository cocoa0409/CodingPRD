              as: PlatformAdmin
            - call: "POST /home-listings"
              payload: { owner_member_id: "${h}", title: "Loft", address_city: "Denver", address_country: "US", points_per_night: 75, max_points_per_exchange: 10000, capacity: 2 }
              as: Member
              as_user_id: "${h}"
              captures: { lst: $.data.id }
            - call: "POST /home-listings/${lst}/activate"
              payload: {}
              as: Member
              as_user_id: "${h}"
              captures: { lst_v: $.data.version }
          trigger:
            - call: "POST /exchange-requests"
              payload: { requester_member_id: "${g}", target_listing_id: "${lst}", exchange_type: "POINTS", requested_start_date: "2026-07-10", requested_end_date: "2026-07-12" }
              as: Member
              as_user_id: "${g}"
              captures: { req: $.data.id, cost: $.data.points_cost }
          assert:
            - "ExchangeRequest.${req}.points_cost == 202"

      - name: damage_final_payout_tiered_deductible_mode_a
