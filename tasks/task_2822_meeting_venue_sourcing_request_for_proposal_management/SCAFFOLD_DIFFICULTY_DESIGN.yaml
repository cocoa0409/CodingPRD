        - 'Round 2: Cascade Bay shortlisted afterwards (the Harborline entry is already RFP_ISSUED and therefore not re-invited), Rfp round 2 issued with previous_rfp_id pointing at the CLOSED round 1, Cascade Bay submitted the 275.00 GROSS / 400-night grid, round 2 closed - so the event is back in BID_REVIEW with one UNDER_REVIEW proposal per round.'
        - 'Both proposals evaluated once on CONTRACTED_BASIS: Harborline 447844.84, Cascade Bay 290551.07.'
        - Harborline awarded first, minting Contract 1 with contracted_total_usd 432170.27, and that contract routed so it is IN_APPROVAL with two PENDING ApprovalSteps; MeetingEvent.committed_spend_usd is 432170.27 and budget_remaining_usd is 67829.73.
