              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # call1 90s -> 2u
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c1: $.data.id }
            - call: "POST /va/calls/${c1}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:01:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c1}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:02:30Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c1}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${c1}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            # call2 61s -> 2u
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550002", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { c2: $.data.id }
            - call: "POST /va/calls/${c2}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:05:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${c2}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:06:01Z" }
