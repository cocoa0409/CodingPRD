scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_variant_divergence
        grounds:
          - calculations.purchase_capacity
          - calculations.purchase_capacity.variants.CONSERVATIVE
          - calculations.purchase_capacity.variants.OPTIMISTIC
          - entities.Qualification.fields.variant_used
        distinguishing_aspect: |
          The identical Qualification inputs produce capacity_cents 21000000 under variant_used
          CONSERVATIVE and 24000000 under OPTIMISTIC — a 3000000-cent divergence caused solely by
          the MARKET_APPRECIATION_BPS term that CONSERVATIVE omits, on the Qualification entity domain.
        test_recipe:
          setup:
            - "Homeowner H exists with credit_score 700, household_income_cents 10000000 (above the income clamp)."
            - "Departing property D is appraised 60000000 with mortgage_payoff_cents 30000000 and condition_grade B; net equity 30000000."
            - "New property N is kind NEW, appraised 55000000."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Cons", email: "h.cons@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "1 Departing Way", kind: "DEPARTING", appraised_value_cents: 60000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "2 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
          trigger:
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { qc_id: $.data.id, cap_c: $.data.capacity_cents }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "OPTIMISTIC" }
              as: Coordinator
              captures: { qo_id: $.data.id, cap_o: $.data.capacity_cents }
          assert:
            - "Qualification.${qc_id}.capacity_cents == 21000000"
            - "Qualification.${qo_id}.capacity_cents == 24000000"
            - "Qualification.${qo_id}.capacity_cents - Qualification.${qc_id}.capacity_cents == 3000000"
            - "Qualification.${qc_id}.equity_ratio == 0.5"
      - name: carrying_cost_variant_divergence
        grounds:
          - calculations.carrying_cost_burden
          - calculations.carrying_cost_burden.variants.sum_then_prorate
          - calculations.carrying_cost_burden.variants.prorate_then_sum
          - entities.BridgeProgram.fields.projected_carry_months
        distinguishing_aspect: |
          Identical CarryingCost rows produce outstanding_carrying_cost_cents 4375000 under the
          sum_then_prorate variant and 4000000 under prorate_then_sum — a 375000-cent divergence
          driven by whether the 2500-bps construction adjustment is pooled-then-floored once or
          floored per row, on the BridgeProgram/CarryingCost entity domain.
        test_recipe:
          setup:
            - "A funded BridgeProgram P with projected_carry_months 4 (>= 3, so sum_then_prorate applies by default)."
            - "CarryingCost rows: NEW_INSURANCE 2000000, NEW_TAX 1000000, DEPARTING_TAX 500000, all UNPAID."
            - "The new property N has condition_grade A, so the high_cost_bucket is NEW_INSURANCE."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Carry", email: "h.carry@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "3 Departing Way", kind: "DEPARTING", appraised_value_cents: 60000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "4 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /knock/bridge-programs/${bp_id}/fund"
              payload: { expected_bridge_program_version: "${bp_v}", interest_rate_bps: 800 }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /knock/carrying-costs"
              payload: { bridge_program_id: "${bp_id}", kind: "NEW_INSURANCE", amount_cents: 2000000, due_date: "2026-10-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/carrying-costs"
              payload: { bridge_program_id: "${bp_id}", kind: "NEW_TAX", amount_cents: 1000000, due_date: "2026-10-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/carrying-costs"
              payload: { bridge_program_id: "${bp_id}", kind: "DEPARTING_TAX", amount_cents: 500000, due_date: "2026-10-01T00:00:00Z" }
              as: Coordinator
              captures: { cc_id: $.data.id }
          trigger:
            - call: "GET /knock/bridge-programs/${bp_id}/summary"
              payload: {}
              as: Coordinator
              captures: { occ: $.data.outstanding_carrying_cost_cents, truec: $.data.true_cost_cents, amortc: $.data.amortized_cost_cents }
          assert:
            - "BridgeProgram.${bp_id}.outstanding_carrying_cost_cents == 4375000 under projected_carry_months 4 (sum_then_prorate)"
            - "the same three rows with projected_carry_months 2 yield 4000000 (prorate_then_sum); delta == 375000"
            - "CarryingCost.${cc_id}.repayment_status == UNPAID so it enters the input set"
  - rule_id: combinatorial_formula
    instances:
      - name: purchase_capacity_nested_min_max
        grounds:
          - calculations.purchase_capacity
          - entities.Qualification.fields.capacity_cents
          - entities.Homeowner.fields.household_income_cents
        distinguishing_aspect: |
          Mode (a): the capacity formula combines three inputs (equity, condition_credit_bps derived
          from a condition_rank lookup, and the income multiple clamp) with nested min/max and a
          conditional credit branch, so the income clamp and the condition credit interact
          non-linearly rather than as a single arithmetic product.
        test_recipe:
          setup:
            - "Homeowner H has household_income_cents 10000000; property D is appraised 60000000, payoff 30000000, condition_grade A."
            - "Gross equity 30000000 with condition_credit_bps 500 gives 31500000, below the 50000000 income clamp, so the clamp does not bind here."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Comb", email: "h.comb@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "5 Departing Way", kind: "DEPARTING", appraised_value_cents: 60000000, mortgage_payoff_cents: 30000000, condition_grade: "A" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "6 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
          trigger:
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
          assert:
            - "Qualification.${q_id}.capacity_cents == 31500000 (equity 30000000 * (7000 + 500) bps), unaffected by the 50000000 income clamp"
      - name: disclosure_evaluation_order_trap
        grounds:
          - calculations.program_charge_disclosure
          - entities.BridgeProgram.fields.total_program_charge_cents
          - entities.InterimLoan.fields.principal_cents
        distinguishing_aspect: |
          Mode (c): total = subtotal + escalator, but the escalator is itself selected by the subtotal
          tier (<= 300000 floors the FIXED reference base, 300000 < subtotal <= 500000 applies the
          low rate to the actual subtotal, subtotal > 500000 applies the high rate), so evaluation
          order of subtotal -> tier -> escalator -> total is what makes the value well-defined.
        test_recipe:
          setup:
            - "A BridgeProgram P is created from an approved Qualification whose capacity is 30000000; funding originates an InterimLoan with principal 30000000."
            - "Exactly one OPEN Referral exists for P, so coordination_cents is the flat 45000."
            - "subtotal = 30000000*150//10000 + 45000 = 495000, which is below DISCLOSURE_REVIEW_CENTS (500000) but above DISCLOSURE_MIN_CENTS (300000), so the escalator is the LOW rate applied to the actual subtotal."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Disc", email: "h.disc@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "7 Departing Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "8 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 40000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4, program_fee_basis_points: 150 }
              as: Coordinator
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /knock/bridge-programs/${bp_id}/fund"
              payload: { expected_bridge_program_version: "${bp_v}", interest_rate_bps: 800 }
              as: Coordinator
            - call: "POST /knock/agents"
              payload: { full_name: "A Disc", brokerage_name: "Broker", license_number: "LIC-DISC" }
              as: Coordinator
              captures: { ag_id: $.data.id }
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp_id}", role_scope: "DEPARTING_SIDE" }
              as: Coordinator
          trigger:
            - call: "GET /knock/bridge-programs/${bp_id}/summary"
              payload: {}
              as: Coordinator
              captures: { orig: $.data.origination_cents, coord: $.data.coordination_cents, esc: $.data.escalator_cents, tot: $.data.total_program_charge_cents }
          assert:
            - "origination_cents == 450000 (InterimLoan principal 30000000 * 150 // 10000)"
            - "coordination_cents == 45000 with a single active Referral"
            - "escalator_cents == 12375 — subtotal 495000 sits in the disclosed tier (300000 < subtotal <= 500000) so the LOW escalator tracks the actual subtotal"
            - "total_program_charge_cents == 507375"
  - rule_id: non_linear_state_machine
    instances:
      - name: backup_offer_cyclic_expire_extend_reissue
        grounds:
          - state_machines.BackupOffer.EXPIRED_to_ISSUED
          - state_machines.BackupOffer.EXTENDED_to_ISSUED
          - state_machines.BackupOffer.ISSUED_to_EXTENDED
        distinguishing_aspect: |
          The BackupOffer machine is cyclic: ISSUED -> EXPIRED -> ISSUED and ISSUED -> EXTENDED -> ISSUED
          both return to ISSUED, so the same entity loops through its exercise window more than once
          on the BackupOffer domain — a cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "A BridgeProgram P is in occupancy_status DEPARTING_SIDE-equivalent DEPARTING_LISTED with departing property D LISTED, and BackupOffer O is DRAFT with window_start 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Cyc", email: "h.cyc@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "9 Departing Way", kind: "DEPARTING", appraised_value_cents: 50000000, mortgage_payoff_cents: 20000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "10 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A", repair_progress_bps: 300 }
              as: Coordinator
              captures: { new_id: $.data.id, new_v: $.data.version }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 40000000, variant_used: "OPTIMISTIC" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
            - call: "POST /knock/bridge-programs/${bp_id}/occupy-new"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/listings"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", list_price_cents: 44000000 }
              as: Coordinator
              captures: { lst_id: $.data.id }
            - call: "POST /knock/listings/${lst_id}/go-live"
              payload: {}
              as: Coordinator
            - call: "POST /knock/backup-offers"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", offer_price_cents: 42500000, window_days: 30, window_start: "2026-09-01T00:00:00Z" }
              as: Coordinator
              captures: { bo_id: $.data.id, bo_v1: $.data.version }
          trigger:
            - call: "POST /knock/backup-offers/${bo_id}/issue"
              payload: {}
              as: Coordinator
              captures: { v2: $.data.version, exp1: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/backup-offers/${bo_id}/extend"
              payload: {}
              as: Coordinator
              captures: { v3: $.data.version }
          assert:
            - "BackupOffer.${bo_id}.status == ISSUED after issue, then EXPIRED once the clock passes expires_at ${exp1}, then ISSUED again after extend (EXPIRED -> ISSUED cycle)"
            - "BackupOffer.${bo_id}.version strictly increases across the cycle"
            - "BackupOffer.${bo_id}.expires_at is recomputed on each re-issue"
      - name: qualification_revision_pending_cycle
        grounds:
          - state_machines.Qualification.APPROVED_to_PENDING
          - state_machines.Qualification.PENDING_to_APPROVED
          - entities.Qualification.fields.variant_used
        distinguishing_aspect: |
          The Qualification machine is cyclic on the Qualification domain: APPROVED -> PENDING
          (revision) -> APPROVED re-enters PENDING, and the capacity_cents recompute on re-approval
          reflects the newly chosen variant — a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Homeowner H, departing property D (appraised 60000000, payoff 30000000, grade B), new property N (appraised 55000000)."
            - "Qualification Q is created CONSERVATIVE (capacity 21000000) and approved."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Rev", email: "h.rev@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "13 Departing Way", kind: "DEPARTING", appraised_value_cents: 60000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "14 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
          trigger:
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id, cap_c: $.data.capacity_cents }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
              captures: { qv1: $.data.version }
            - call: "PATCH /knock/qualifications/${q_id}"
              payload: { variant_used: "OPTIMISTIC" }
              as: Coordinator
              captures: { qv2: $.data.version }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
              captures: { qv3: $.data.version }
          assert:
            - "Qualification.${q_id}.capacity_cents == 21000000 after the first approve (CONSERVATIVE)"
            - "Qualification.${q_id}.status == PENDING after PATCH (APPROVED -> PENDING cycle) and capacity_cents == 24000000 (OPTIMISTIC recompute)"
            - "Qualification.${q_id}.status == APPROVED after the second approve and version strictly increased at each step"
  - rule_id: transitive_cascade
    instances:
      - name: cascade_listing_go_live_depth4
        grounds:
          - state_machines.Listing.DRAFT_to_LIVE
          - state_machines.BridgeProgram.OCCUPYING_NEW_to_DEPARTING_LISTED
          - state_machines.Property.UNLISTED_to_LISTED
          - state_machines.CoordinationTask.OPEN_to_IN_PROGRESS
        distinguishing_aspect: |
          A depth-4 chain originating from the Listing go-live transition: Listing DRAFT->LIVE
          causes BridgeProgram.occupancy_status OCCUPYING_NEW->DEPARTING_LISTED, which sets
          Property.listing_status->LISTED, which escalates the Referral's overdue OPEN
          CoordinationTask to IN_PROGRESS and bumps the Referral — each hop caused by the prior hop.
        test_recipe:
          setup:
            - "BridgeProgram P on property D is FUNDED with occupancy_status OCCUPYING_NEW and D.repair_status COMPLETE."
            - "A Referral R for P is OPEN with one CoordinationTask T (PHOTOGRAPHY) whose due_date 2026-08-25 already precedes the 2026-09-01 clock."
            - "Listing L for D exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Casc", email: "h.casc@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "15 Departing Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "16 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 34000000, variant_used: "OPTIMISTIC" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /knock/bridge-programs/${bp_id}/fund"
              payload: { expected_bridge_program_version: "${bp_v}", interest_rate_bps: 800 }
              as: Coordinator
            - call: "POST /knock/bridge-programs/${bp_id}/occupy-new"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/agents"
              payload: { full_name: "A Casc", brokerage_name: "Broker", license_number: "LIC-CASC" }
              as: Coordinator
              captures: { ag_id: $.data.id }
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp_id}", role_scope: "DEPARTING_SIDE" }
              as: Coordinator
              captures: { rf_id: $.data.id, rf_v: $.data.version }
            - call: "POST /knock/coordination-tasks"
              payload: { bridge_program_id: "${bp_id}", referral_id: "${rf_id}", task_kind: "PHOTOGRAPHY", due_date: "2026-08-25T00:00:00Z" }
              as: Coordinator
              captures: { ct_id: $.data.id }
            - call: "POST /knock/listings"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", list_price_cents: 44000000 }
              as: Coordinator
              captures: { lst_id: $.data.id }
          trigger:
            - call: "POST /knock/listings/${lst_id}/go-live"
              payload: {}
              as: Coordinator
              captures: { lst_v: $.data.version }
          assert:
            - "Listing.${lst_id}.status == LIVE"
            - "BridgeProgram.${bp_id}.occupancy_status == DEPARTING_LISTED (hop 1)"
            - "Property.${dep_id}.listing_status == LISTED (hop 2)"
            - "CoordinationTask.${ct_id}.status == IN_PROGRESS (hop 3, escalated because due_date 2026-08-25 < clock)"
            - "Referral.${rf_id}.version > ${rf_v} (hop 3 side effect)"
      - name: cascade_advance_disbursement_depth3
        grounds:
          - state_machines.BridgeAdvance.APPROVED_to_DISBURSED
          - state_machines.InterimLoan.ORIGINATED_to_DRAWN
          - state_machines.BridgeProgram.FUNDING_to_FUNDED
          - state_machines.Homeowner.ENROLLED_to_BRIDGED
        distinguishing_aspect: |
          A depth-4 chain originating from the BridgeAdvance disbursement transition: disburse
          causes InterimLoan ORIGINATED->DRAWN, which causes BridgeProgram.advance_status
          FUNDING->FUNDED, which causes Homeowner.program_status ENROLLED->BRIDGED.
        test_recipe:
          setup:
            - "BridgeProgram P is FUNDED with an InterimLoan of principal 30000000, and one DOWN_PAYMENT BridgeAdvance A of 8000000 is APPROVED."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Adv", email: "h.adv@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "17 Departing Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "18 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /knock/bridge-programs/${bp_id}/fund"
              payload: { expected_bridge_program_version: "${bp_v}", interest_rate_bps: 800 }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /knock/bridge-advances"
              payload: { bridge_program_id: "${bp_id}", interim_loan_id: "${loan_id}", purpose: "DOWN_PAYMENT", amount_cents: 8000000 }
              as: Coordinator
              captures: { adv_id: $.data.id }
            - call: "POST /knock/bridge-advances/${adv_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /knock/bridge-advances/${adv_id}/disburse"
              payload: {}
              as: Coordinator
              captures: { adv_v: $.data.version }
          assert:
            - "BridgeAdvance.${adv_id}.status == DISBURSED"
            - "InterimLoan.${loan_id}.status == DRAWN and drawn_cents == 8000000 (hop 1)"
            - "BridgeProgram.${bp_id}.advance_status == FUNDED (hop 2)"
            - "Homeowner.${h_id}.program_status == BRIDGED (hop 3)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_fiscal_carrying_cost
        grounds:
          - validations[priority=12]
          - validations[priority=27]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARRYING_COST_UNPAID]
        distinguishing_aspect: |
          The `state` error-category pair: a final repayment on an already-REPAID loan that ALSO has
          unpaid carrying costs fails the priority-11 state check first, so ERR_INVALID_STATE wins
          over the priority-26 ERR_CARRYING_COST_UNPAID.
        test_recipe:
          setup:
            - "A loan L is ORIGINATED (funded but not yet drawn) while its program P carries one UNPAID CarryingCost of 500000, so a fresh repayment violates both the state check and the fiscal check."
