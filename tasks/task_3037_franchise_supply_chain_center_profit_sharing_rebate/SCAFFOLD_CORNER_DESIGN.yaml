              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCT_UNAVAILABLE"

      - name: capacity_exceeded_blocks_po_confirm
        claim_type: Violation → Error
        grounds:
          - validations.priority_8_business_constraint
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: "PO confirm blocked when capacity plan has insufficient available units."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. Capacity plan with 0 available units. SUBMITTED PO for that week."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.0, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-CE", operator_name: "CE", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/capacity-plans"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: SupplyChainAdmin
              captures: { plan_id: $.data.id }
            # Fill capacity with a first PO
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po1_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po1_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1000 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po1_id}/submit"
              payload: { expected_store_version: "${store_v}" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po1_id}/confirm"
              payload: {}
              as: SupplyChainAdmin
            # Second PO should fail
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po2_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po2_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po2_id}/submit"
              payload: { expected_store_version: "${store_v}" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po2_id}/confirm"
              payload: {}
              as: SupplyChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "error_id == ERR_CAPACITY_EXCEEDED"

      - name: credit_limit_exceeded_blocks_po_submit
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_fiscal
