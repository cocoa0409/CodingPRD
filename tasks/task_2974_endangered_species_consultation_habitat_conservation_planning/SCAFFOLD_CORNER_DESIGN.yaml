            - "GET /consultations/${consultation_id} still reports status == 'OPINION_ISSUED' and reinitiation_count == 0"

      - name: conservation_bank_creation_seeds_the_credit_ledger_identity
        claim_type: computed_fields
        grounds:
          - entities.ConservationBank.fields.credits_available
          - entities.ConservationBank.fields.credits_reserved
          - entities.ConservationBank.fields.credits_transferred
          - endpoints["POST /conservation-banks"]
          - endpoints["GET /species/{id}/conservation-banks"]
          - validations[priority=13]
        distinguishing_aspect: >-
          A new bank must satisfy the ledger identity credits_available +
          credits_reserved + credits_transferred == credits_total_minted with
          available carrying the whole balance — credits_available is initialised
          FROM credits_total_minted rather than to 0 or to null. The same
          endpoint also refuses a bank over a PROPOSED or CANDIDATE species at
          priority 13.
        test_recipe:
          setup:
            - "SP-E (ENDANGERED) and one CANDIDATE species are registered; clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Athene cunicularia hypugaea", common_name: "Western burrowing owl", listing_status: "CANDIDATE", take_authorization_unit: "NESTS", take_density_per_acre: 0.12, recovery_unit_population: 21000, survey_season_start_month: 3, survey_season_end_month: 8}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {owl_id: "$.data.id"}
          trigger:
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {new_bank_id: "$.data.id"}
          assert:
            - "HTTP 201 with data.credits_available == 500.00, data.credits_reserved == 0.00 and data.credits_transferred == 0.00"
            - "data.credits_total_minted == 500.00 and the ledger identity available + reserved + transferred == total_minted holds"
            - "data.credit_price_cents == 250000 and data.service_area_county_codes == ['06037']"
            - "GET /species/${species_e_id}/conservation-banks returns exactly 1 row, unpaginated, and GET /species/${owl_id}/conservation-banks returns 0 rows"
            - "the same body with covered_species_id ${owl_id} (a CANDIDATE species) returns ERR_SPECIES_NOT_LISTED (422)"
            - "the same body with service_area_county_codes ['6037'] returns ERR_INVALID_REQUEST (400) — each code is exactly 5 digits"

