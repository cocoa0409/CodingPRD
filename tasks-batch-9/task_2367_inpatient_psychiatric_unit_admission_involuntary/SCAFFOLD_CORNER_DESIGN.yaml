          - endpoints[PATCH /behavioral-health/beds/{id}]
        distinguishing_aspect: "A shared operation must behave identically for each declared role - including the posture recompute and Unit.version increment fired by PATCH /beds/{id} - and every GET is shared by all five roles, including the advocate who owns no exclusive operation."
        test_recipe:
          setup:
            - "Roster: intake clinician Nolan, charge nurse Kim, advocate Cho; one single-bed unit whose only bed is AVAILABLE."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
