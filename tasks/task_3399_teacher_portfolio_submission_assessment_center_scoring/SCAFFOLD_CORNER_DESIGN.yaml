              as: BoardAdministrator
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "CKA" }
              as: Candidate
              as_user_id: "${cand_bb}"
          trigger:
            - call: "GET /cycles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_cycle: $.data.error_id }
            - call: "GET /candidates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_cand: $.data.error_id }
            - call: "GET /submissions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_sub: $.data.error_id }
            - call: "GET /assessment-centers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_ctr: $.data.error_id }
            - call: "GET /bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_bk: $.data.error_id }
            - call: "GET /assessors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ScoringAdministrator
              captures: { e_asr: $.data.error_id }
            - call: "GET /assignments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ScoringAdministrator
              captures: { e_asg: $.data.error_id }
            - call: "GET /certifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdministrator
              captures: { e_cert: $.data.error_id }
            - call: "POST /renewals/00000000-0000-0000-0000-000000000000/review"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { e_ren: $.data.error_id }
            - call: "GET /incentive-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IncentiveAdministrator
              captures: { e_prog: $.data.error_id }
            - call: "POST /stipends/00000000-0000-0000-0000-000000000000/transition"
              payload: { to: "APPROVED" }
              as: IncentiveAdministrator
              captures: { e_stip: $.data.error_id }
            - call: "POST /assignments"
              payload: { benchmark_id: "00000000-0000-0000-0000-000000000000" }
              as: ScoringAdministrator
              captures: { e_bm: $.data.error_id }
            - call: "POST /bookings"
              payload: { center_id: "00000000-0000-0000-0000-000000000000", cycle_id: "${cyc_id}", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
              as_user_id: "${cand_bb}"
              captures: { e_ctr_body: $.data.error_id }
            - call: "POST /bookings"
              payload: { center_id: "${ctr_id}", cycle_id: "00000000-0000-0000-0000-000000000000", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
              as_user_id: "${cand_bb}"
              captures: { e_cyc_body: $.data.error_id }
            - call: "POST /bookings"
              payload: { center_id: "${ctr_id}", cycle_id: "${cyc_id}", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
