            - "ClaimPayment.${pay_h_id}.payment_status == REVERSED with reversal_reason ADJUSTER_ERROR and gross_amount_usd still 250000.00"
            - "Policy.${pol_b_id}.aggregate_limit_remaining_usd == 250000.00 and limit_status == INTACT"
            - "the BUSINESS_INTERRUPTION CoverageSection of ${pol_b_id} has sublimit_remaining_usd == 250000.00"
            - "IncidentClaim.${clm_h_id}.paid_total_usd == 0.00"
            - "IncidentClaim.${clm_h_id}.retention_absorbed_usd == 0.00 and unallocated_loss_usd == 0.00"
            - "IncidentClaim.${clm_h_id}.status == APPROVED_FOR_PAYMENT"
            - "GET /cyber/policies/${pol_b_id}/loss-summary returns paid_total_usd == 0.00 and aggregate_limit_remaining_usd == 250000.00"
      - name: claim_denial_restores_panel_vendor_capacity_slots
        grounds:
          - state_machines.IncidentClaim.TRIAGE_to_DENIED
          - state_machines.VendorEngagement.AUTHORIZED_to_TERMINATED
          - entities.PanelVendor.fields.active_engagement_count
          - entities.VendorEngagement.fields.incurred_amount_usd
          - entities.IncidentClaim.fields.reserved_amount_usd
          - calculations.engagement_incurred_amount
        distinguishing_aspect: |
          Conserved quantity = the panel firm's concurrency slot count, not money: denying the claim must
          terminate both live engagements and decrement PanelVendor.active_engagement_count from 2 back to
          0 while deliberately RETAINING the 45207.50 already incurred as an unpaid figure, so the counter
          reconciles even though no dollars are returned.
        test_recipe:
          setup:
            - "Bound Aurora Health policy with the five-section tower and retention 250000."
            - "PanelVendor Postmark Notify: NOTIFICATION, tier 1, 200.00 per hour, 3.50 per notified record, sectors [HEALTHCARE, TECHNOLOGY], capacity 5, ACTIVE."
            - "Logical clock at 2026-09-10T00:00:00Z; one RANSOMWARE claim in RESPONSE_ACTIVE with affected_record_count 12345, covered_section_keys [FIRST_PARTY_RESPONSE, BUSINESS_INTERRUPTION] and reserved_amount_usd 250000.00."
            - "Two engagements on that firm, both directed and both live: the first is ACTIVE with 10.00 hours and 12345 records logged (incurred_amount_usd 45207.50), the second is AUTHORIZED with nothing logged; PanelVendor.active_engagement_count is 2."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/external-scans"
              payload: { scan_vendor_name: "Perimeter Signal", scan_score: 68 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { scan_app_a_id: "$.data.id" }
            - call: "POST /cyber/external-scans/${scan_app_a_id}/complete"
              payload: { outcome: "COMPLETED", findings: [{ control_key: "EMAIL_FILTERING", severity: "HIGH", observed_level: "PARTIAL" }] }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications/${app_a_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v1: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/quote"
              payload: { expected_application_version: "${app_a_v1}" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v2: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/bind"
              payload: { expected_application_version: "${app_a_v2}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z", bi_baseline_method: "TRAILING_12M", coverage_sections: [{ section_key: "FIRST_PARTY_RESPONSE", sublimit_usd: 1000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 10 }, { section_key: "BUSINESS_INTERRUPTION", sublimit_usd: 2000000, waiting_period_hours: 12, coinsurance_pct: 0.1, erosion_priority: 20 }, { section_key: "DEPENDENT_BI", sublimit_usd: 500000, waiting_period_hours: 24, coinsurance_pct: 0.2, erosion_priority: 30 }, { section_key: "THIRD_PARTY_LIABILITY", sublimit_usd: 3000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 40 }, { section_key: "CYBER_EXTORTION", sublimit_usd: 500000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 50 }], named_dependency_keys: ["CSP_ALPHA"] }
              as: Underwriter
              as_user_id: "u-underwriter-2"
              captures: { pol_a_id: "$.data.id" }
            - call: "POST /cyber/panel-vendors"
              payload: { vendor_name: "Postmark Notify", vendor_type: "NOTIFICATION", pre_approved_hourly_rate_usd: 200, per_record_notification_rate_usd: 3.5, specialty_sectors: ["HEALTHCARE", "TECHNOLOGY"], tier: 1, capacity_concurrent_engagements: 5 }
              as: PanelAdmin
              as_user_id: "u-panel-1"
              captures: { v_notify_id: "$.data.id" }
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/incident-claims"
              payload: { policy_id: "${pol_a_id}", incident_type: "RANSOMWARE", incident_discovered_at: "2026-09-05T00:00:00Z", outage_start_at: "2026-09-05T00:00:00Z", outage_end_at: "2026-09-08T00:00:00Z", affected_record_count: 12345 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_i_id: "$.data.id" }
            - call: "POST /cyber/incident-claims/${clm_i_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
            - call: "POST /cyber/incident-claims/${clm_i_id}/confirm-coverage"
              payload: { covered_section_keys: ["FIRST_PARTY_RESPONSE", "BUSINESS_INTERRUPTION"], initial_reserve_usd: 250000 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
            - call: "POST /cyber/incident-claims/${clm_i_id}/vendor-engagements"
              payload: { vendor_type: "NOTIFICATION", deployment_start_at: "2026-09-10T00:00:00Z", deployment_end_at: "2026-09-20T00:00:00Z", authorized_hours_cap: 40, panel_vendor_id: "${v_notify_id}" }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { eng_i1_id: "$.data.id" }
            - call: "POST /cyber/incident-claims/${clm_i_id}/vendor-engagements"
              payload: { vendor_type: "NOTIFICATION", deployment_start_at: "2026-09-21T00:00:00Z", deployment_end_at: "2026-09-30T00:00:00Z", authorized_hours_cap: 20, panel_vendor_id: "${v_notify_id}" }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { eng_i2_id: "$.data.id" }
            - call: "POST /cyber/vendor-engagements/${eng_i1_id}/log-hours"
              payload: { hours: 10, records_notified: 12345 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
          trigger:
            - call: "POST /cyber/incident-claims/${clm_i_id}/deny"
              payload: { denial_reason: "EXCLUDED_CAUSE" }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
          assert:
            - "IncidentClaim.${clm_i_id}.status == DENIED with denial_reason EXCLUDED_CAUSE and reserved_amount_usd == 0.00"
            - "VendorEngagement.${eng_i1_id}.status == TERMINATED and incurred_amount_usd == 45207.50, retained rather than zeroed"
            - "VendorEngagement.${eng_i2_id}.status == TERMINATED and incurred_amount_usd == 0.00"
            - "PanelVendor.${v_notify_id}.active_engagement_count == 0"
            - "GET /cyber/claim-payments with incident_claim_id ${clm_i_id} returns total_count == 0, so no dollars moved"
            - "Policy.${pol_a_id}.aggregate_limit_remaining_usd == 5000000.00 and limit_status == INTACT"
