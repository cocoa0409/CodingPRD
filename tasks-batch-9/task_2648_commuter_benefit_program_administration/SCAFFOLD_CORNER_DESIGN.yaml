  # ===========================================================================
  - section: endpoints
    instances:
      - name: employer_patch_overwrites_only_the_supplied_setup_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/benefits/employers/{employer_id}
          - entities.Employer.fields.spill_policy
          - entities.Employer.fields.program_cap_cents
        distinguishing_aspect: "The Update leg of CRUD on an ACTIVE employer: a two-field PATCH must overwrite exactly spill_policy and program_cap_cents, leave transit_group_limit_cents, parking_group_limit_cents, pretax_ratio_cap_pct, rollover_policy and enrolled_employee_count byte-identical, and take Employer.version from 2 to 3 - an implementation that treats the PATCH body as a full replacement zeroes the untouched limits."
        test_recipe:
          setup:
            - "Employer 'Patch Me Co' was created in US-WA-SEA with transit_group_limit_cents 30000, parking_group_limit_cents 28000, program_cap_cents 5000000, pretax_ratio_cap_pct 90, rollover_policy CAPPED_ROLLOVER and rollover_cap_cents 9000 (version 1), then ACTIVATED (version 2)."
            - "One ACTIVE employee is enrolled, so enrolled_employee_count is 1 at the time of the PATCH."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Patch Me Co", region_code: "US-WA-SEA", transit_group_limit_cents: 30000, parking_group_limit_cents: 28000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 90, rollover_policy: "CAPPED_ROLLOVER", rollover_cap_cents: 9000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id, v_create: $.data.version, spill_before: $.data.spill_policy }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_active: $.data.version, status_active: $.data.program_status }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "SEA-PM-1", work_region_code: "US-WA-SEA", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "PATCH /benefits/employers/${er_id}"
              payload: { spill_policy: "REJECT_OVERAGE", program_cap_cents: 7000 }
              as: ProgramAdmin
              captures: { spill_after: $.data.spill_policy, cap_after: $.data.program_cap_cents, transit_after: $.data.transit_group_limit_cents, parking_after: $.data.parking_group_limit_cents, ratio_after: $.data.pretax_ratio_cap_pct, rollover_after: $.data.rollover_policy, cap_roll_after: $.data.rollover_cap_cents, headcount_after: $.data.enrolled_employee_count, v_after: $.data.version, status_after: $.data.program_status }
          assert:
            - "${v_create} == 1"
            - "${v_active} == 2"
            - "${status_active} == ACTIVE"
            - "${spill_before} == SPILL_TO_POSTTAX"
            - "HTTP status is 200"
            - "${spill_after} == REJECT_OVERAGE"
            - "${cap_after} == 7000"
            - "${transit_after} == 30000"
            - "${parking_after} == 28000"
            - "${ratio_after} == 90"
            - "${rollover_after} == CAPPED_ROLLOVER"
            - "${cap_roll_after} == 9000"
            - "${headcount_after} == 1"
            - "${v_after} == 3"
            - "${status_after} == ACTIVE"

      - name: payroll_acknowledge_with_rejected_outcome_takes_the_rejected_branch
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/benefits/payroll-files/{file_id}/acknowledge
          - state_machines.PayrollFile.TRANSMITTED_to_REJECTED
          - entities.PayrollFile.fields.acknowledgement_code
        distinguishing_aspect: "One action endpoint with two target states chosen by the request body: outcome REJECTED must land TRANSMITTED->REJECTED (not ACKNOWLEDGED), store acknowledgement_code 'E42-BAD-FORMAT', keep transmitted_at set from the prior step, and leave the pinned money fields untouched - an implementation that hardcodes ACKNOWLEDGED for the acknowledge route leaves PayrollFile.REJECTED unreachable."
        test_recipe:
          setup:
            - "Employer 'Ack Branch Co' is ACTIVE in US-TX-AUS with an ACTIVE TRANSIT_PASS category (limit 30000)."
            - "One ACTIVE employee elected 5000 pre-tax cents in the 2026-08 window, which has been LOCKED, so the election is FUNDED."
            - "A PayrollFile for 2026-08 has been generated (employer_charge_cents 10000) and transmitted, so it is in status TRANSMITTED with transmitted_at stamped."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Ack Branch Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-AB-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 5000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/payroll-files"
              payload: { employer_id: "${er_id}", period_month: "2026-08" }
              as: PayrollProcessor
              as_user_id: "pay-ack"
              captures: { pf_id: $.data.id }
            - call: "POST /benefits/payroll-files/${pf_id}/generate"
              payload: {}
              as: PayrollProcessor
              as_user_id: "pay-ack"
              captures: { pf_charge: $.data.employer_charge_cents }
            - call: "POST /benefits/payroll-files/${pf_id}/transmit"
              payload: {}
              as: PayrollProcessor
              as_user_id: "pay-ack"
              captures: { pf_transmitted: $.data.status, pf_v_transmitted: $.data.version }
          trigger:
            - call: "POST /benefits/payroll-files/${pf_id}/acknowledge"
              payload: { outcome: "REJECTED", acknowledgement_code: "E42-BAD-FORMAT" }
              as: PayrollProcessor
              as_user_id: "pay-ack"
              captures: { pf_status: $.data.status, pf_code: $.data.acknowledgement_code, pf_charge_after: $.data.employer_charge_cents, pf_v_after: $.data.version }
          assert:
            - "${pf_charge} == 10000"
            - "${pf_transmitted} == TRANSMITTED"
            - "${pf_v_transmitted} == 3"
            - "HTTP status is 200"
            - "${pf_status} == REJECTED"
            - "${pf_status} is NOT ACKNOWLEDGED"
            - "${pf_code} == E42-BAD-FORMAT"
            - "${pf_charge_after} == 10000"
            - "${pf_v_after} == 4"
            - "PayrollFile.${pf_id}.transmitted_at is still the value stamped by the transmit step"

      - name: month_close_processes_every_account_of_the_employer
        claim_type: Bulk action
        excluded_because:
          difficulty_instance: month_close_standard_vs_termination_variant_bucket_split
          rationale: "That instance is the bulk semantics of POST /benefits/employers/{employer_id}/month-close - one request sweeping two accounts with per-account outcomes, plus the window and election transitions the same run performs."

      - name: media_order_link_requires_all_three_referenced_rows_to_exist
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/benefits/media-orders
          - validations[priority=38]
