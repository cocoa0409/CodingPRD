  # ===========================================================================
  - section: errors
    instances:

      - name: every_entity_lookup_returns_its_own_not_found_code
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_PRACTICE_NOT_FOUND
          - errors.ERR_DOCTOR_NOT_FOUND
          - errors.ERR_DOCTOR_EMPLOYMENT_NOT_FOUND
          - errors.ERR_SERVICE_AGREEMENT_NOT_FOUND
          - errors.ERR_MIGRATION_BATCH_NOT_FOUND
          - errors.ERR_PAYER_ENROLLMENT_NOT_FOUND
          - errors.ERR_EARNOUT_TRANCHE_NOT_FOUND
          - errors.ERR_SUPPLY_EXCEPTION_NOT_FOUND
          - errors.ERR_VENDOR_CONSOLIDATION_NOT_FOUND
          - errors.ERR_QUALITY_REVIEW_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "Each read of an unknown identifier answers with the code for its own entity rather than one shared 404, so ten reads of the same fabricated identifier produce ten distinct error_id values."
        test_recipe:
          setup:
            - "An empty system with the logical clock set to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
          trigger:
            - call: "GET /dso/practices/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_practice: "$.data.error_id" }
            - call: "GET /dso/doctors/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_doctor: "$.data.error_id" }
            - call: "GET /dso/doctor-employments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_employment: "$.data.error_id" }
            - call: "GET /dso/service-agreements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_agreement: "$.data.error_id" }
            - call: "GET /dso/migration-batches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_batch: "$.data.error_id" }
            - call: "GET /dso/payer-enrollments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_enrollment: "$.data.error_id" }
            - call: "GET /dso/earnout-tranches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_tranche: "$.data.error_id" }
            - call: "GET /dso/supply-preference-exceptions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_exception: "$.data.error_id" }
            - call: "GET /dso/vendor-consolidations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_consolidation: "$.data.error_id" }
            - call: "GET /dso/clinical-quality-reviews/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DsoIntegrationLead
              captures: { e_review: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 404 with response_type == error and a data.message string"
            - "${e_practice} == ERR_PRACTICE_NOT_FOUND, ${e_doctor} == ERR_DOCTOR_NOT_FOUND, ${e_employment} == ERR_DOCTOR_EMPLOYMENT_NOT_FOUND, ${e_agreement} == ERR_SERVICE_AGREEMENT_NOT_FOUND, ${e_batch} == ERR_MIGRATION_BATCH_NOT_FOUND"
            - "${e_enrollment} == ERR_PAYER_ENROLLMENT_NOT_FOUND, ${e_tranche} == ERR_EARNOUT_TRANCHE_NOT_FOUND, ${e_exception} == ERR_SUPPLY_EXCEPTION_NOT_FOUND, ${e_consolidation} == ERR_VENDOR_CONSOLIDATION_NOT_FOUND, ${e_review} == ERR_QUALITY_REVIEW_NOT_FOUND"

      - name: unauthenticated_write_returns_401_before_any_other_check
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - response_envelope.error
        distinguishing_aspect: "A request carrying no role identity is refused at priority 1, so a create whose body is also invalid still answers ERR_UNAUTHENTICATED rather than ERR_INVALID_REQUEST and writes nothing."
        test_recipe:
          setup:
            - "The logical clock set to 2026-09-01T00:00:00Z and no other data."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
          trigger:
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: -4 }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and response_type == error (the request carries no role header at all, which the harness expresses as the placeholder actor Anonymous)"
            - "data.message is a non-empty string and no ConversionVendor row is created"
            - "GET /dso/conversion-vendors/{any id} still returns ERR_CONVERSION_VENDOR_NOT_FOUND for every identifier"

