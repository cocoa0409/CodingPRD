              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id }
            - call: "POST /esa/program-years/${py_id}/disbursement-runs"
              payload: { quarter: 1 }
              as: ProgramAdmin
            - call: "POST /esa/misuse-cases"
              payload: { account_id: "${acct1_id}", detection_rule: "NON_ALLOWABLE_EXPENSE", disallowed_principal_cents: 100000, narrative: "Reimbursement claimed for a non-allowable recreational purchase." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /esa/misuse-cases"
              payload: { account_id: "${acct1_id}", detection_rule: "PROVIDER_COLLUSION", disallowed_principal_cents: 20000, narrative: "Provider and household share a mailing address." }
              as: ComplianceOfficer
