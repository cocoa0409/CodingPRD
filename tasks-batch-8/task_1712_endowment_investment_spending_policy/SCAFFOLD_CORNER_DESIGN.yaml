            - { call: "POST /endowment/valuations", payload: { pool_id: "${iu_pool}", estimated_pool_market_value_cents: 5000000 }, as: InvestmentOfficer, captures: { iu_v1: $.data.id } }
            - { call: "GET /endowment/pools/${iu_pool}", as: InvestmentOfficer, captures: { iu_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${iu_v1}/finalize", payload: { final_pool_market_value_cents: 5000000, expected_pool_version: "${iu_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${iu_mgr}", quarter_index: 2, beginning_mv_cents: 5000000, ending_mv_cents: 100000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${iu_pool}", estimated_pool_market_value_cents: 100000 }, as: InvestmentOfficer, captures: { iu_v2: $.data.id } }
            - { call: "GET /endowment/pools/${iu_pool}", as: InvestmentOfficer, captures: { iu_pv2: $.data.version } }
