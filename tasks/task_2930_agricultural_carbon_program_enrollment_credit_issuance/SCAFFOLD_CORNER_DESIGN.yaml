              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: false, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
