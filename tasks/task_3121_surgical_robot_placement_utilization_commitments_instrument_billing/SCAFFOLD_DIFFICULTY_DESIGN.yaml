# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3121_surgical_robot_placement_utilization_commitments_instrument_billing
#
# Depth probe. Nine §0.5 Difficulty Rules, two differentiating instances each
# (18 instances total), every instance grounded in §1.1–§1.6 and drivable from
# empty-DB using only §1.5 endpoints. Setup chains are transcribed verbatim by
# the downstream unit-test-generator, so every `${var}` closes over an earlier
# `captures:` in the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc  (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: instrument_billing_quote_vs_settle_on_same_case
        grounds:
          - calculations.instrument_billing_amount
          - calculations.instrument_lives_remaining
          - entities.ProcedureCase.fields.instrument_billing_cents
          - endpoints.POST_/api/robot-systems/{systemId}/procedure-cases
          - endpoints.POST_/api/procedure-cases/{caseId}/mark-completed
        distinguishing_aspect: "On one PURCHASE-agreement system the quote variant bills the *attempted* load (3 x 125000 = 375000) while the settle variant bills the *lives-clamped* load (1 x 125000 = 125000), so the identical procedure case reports two different billable amounts at two points in its lifecycle."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One hospital account, one configuration with max_instrument_lives 1 and base_placement_fee_cents 4800000, one PASSED readiness review, one PURCHASE agreement, one system installed, commissioned, one comprehensive contract, one credentialed surgeon."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Cedar Ridge Health", idn_group_code: "IDN-CEDAR", region_code: "WEST", placement_cap: 6, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V1", base_placement_fee_cents: 4800000, max_instrument_lives: 1, feature_entitlements: [{ feature_code: "FIREFLY", min_release_index: 1 }], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "CR-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Prior", simulation_modules_completed: 4, required_proctored_cases: 2 }
              as: ClinicalOperationsLead
              captures: { tr: $.data.id, tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/complete-simulation"
              payload: { simulation_modules_completed: 4, expected_training_record_version: "${tr_v}" }
              as: ClinicalOperationsLead
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/begin-proctoring"
              payload: { required_proctored_cases: 2, expected_training_record_version: "${tr_v}" }
              as: RegionalSalesDirector
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/credentialing-evidence"
              payload: { evidence_type: "CREDENTIAL_LETTER", issued_utc: "2026-08-01T00:00:00Z", expires_utc: "2027-08-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /api/training-records/${tr}/proctor-cases"
              payload: { case_observation_ref: "OBS-1", occurred_at_utc: "2026-08-20T00:00:00Z" }
              as: ClinicalOperationsLead
              captures: { pc: $.data.id, tr_v: $.data.version }
            - call: "POST /api/proctor-cases/${pc}/approve"
              payload: { expected_training_record_version: "${tr_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/training-records/${tr}/proctor-cases"
              payload: { case_observation_ref: "OBS-2", occurred_at_utc: "2026-08-21T00:00:00Z" }
              as: ClinicalOperationsLead
              captures: { pc2: $.data.id, tr_v: $.data.version }
            - call: "POST /api/proctor-cases/${pc2}/approve"
              payload: { expected_training_record_version: "${tr_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 250000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6500000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "CR-2", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev2: $.data.id, rev2_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev2}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev2_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, sys_v: $.data.synthesized_system_version, sc: $.data.synthesized_service_contract_id }
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 120, instrument_load: 3, is_emergency: false }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { case_id: $.data.id, quote_cents: $.data.instrument_billing_cents, approved_load: $.data.approved_instrument_load, case_v: $.data.version }
          assert:
            - "ProcedureCase.${case_id}.instrument_billing_cents == 375000 (quote variant prices the attempted load of 3)"
            - "ProcedureCase.${case_id}.approved_instrument_load == 1 (clamped to the accessory set's 1 remaining life)"
            - "RobotSystem.${sys}.instrument_lives_remaining == 0"
            - "POST /api/procedure-cases/${case_id}/mark-completed with expected_case_version ${case_v} then leaves ProcedureCase.${case_id}.instrument_billing_cents == 125000"
            - "ProcedureCase.${case_id}.case_status == COMPLETED"

      - name: placement_fee_list_at_submit_vs_net_at_activation
        grounds:
          - calculations.placement_fee
          - entities.PlacementAgreement.fields.placement_fee_cents
          - entities.HospitalAccount.fields.account_status
          - endpoints.POST_/api/placement-agreements/{agreementId}/submit
          - endpoints.POST_/api/placement-agreements/{agreementId}/accept
        distinguishing_aspect: "The placement_fee ladder is evaluated on the HospitalAccount domain: the same agreement is submitted while its account is still CONTRACTED (idn_scale 0, discount rate 0.00) and accepted after that account has become ACTIVE (idn_scale 1, discount rate 0.02), so the invoiced fee is strictly below the list fee it was submitted at — for the identical agreement."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account, one DA_V2 configuration (base_placement_fee_cents 6000000, integration_tier 2), one PASSED readiness review, one PURCHASE agreement already submitted."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Juniper Valley Surgical", idn_group_code: "IDN-JUNIPER", region_code: "WEST", placement_cap: 6, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V2", base_placement_fee_cents: 6000000, max_instrument_lives: 12, feature_entitlements: [{ feature_code: "FIREFLY", min_release_index: 1 }], requires_dark_fiber: true, requires_dedicated_power_circuit: true, integration_tier: 2, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "JV-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Vale", simulation_modules_completed: 3, required_proctored_cases: 1 }
              as: ClinicalOperationsLead
              captures: { tr: $.data.id }
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 250000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 7000000 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version, list_fee: $.data.placement_fee_cents }
          trigger:
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, net_fee: $.data.net_placement_fee_cents }
          assert:
            - "the submit response reported the list fee at discount rate 0.00: PlacementAgreement.${agr}.placement_fee_cents == 3850000"
            - "the accept response reports the net fee at discount rate 0.02: net_placement_fee_cents == 3773000"
            - "net_placement_fee_cents < the submit-response placement_fee_cents, for the identical agreement"
            - "HospitalAccount.${acct}.account_status == ACTIVE and account_posture == ACTIVE"

  # ===========================================================================
  # Rule 2 — combinatorial_formula  (≥2 instances, different modes (a)/(b)/(c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: construction_uplift_nested_max_rounding_order
        grounds:
          - calculations.construction_uplift_fee
          - entities.SiteReadinessReview.fields.operating_room_length_cm
          - endpoints.POST_/api/account-readiness-reviews
        distinguishing_aspect: "Mode (b) nested rounding with a pinned order: the uplift is base 304800 per uplift unit plus an escalating 76200 for every unit after the first, and the pinned order matters — one unit costs 304800, two cost 685800 (not 609600), and three cost 1066800 (not 914400), so summing per-unit fees before applying the escalation gives a different answer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account and one DA_V2 configuration with integration_tier 2 whose minimum clear OR length is 780 cm."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Alder Point Surgical", idn_group_code: "IDN-ALDER", region_code: "EAST", placement_cap: 4, maximum_procedure_commitment: 20 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V2", base_placement_fee_cents: 6000000, max_instrument_lives: 12, feature_entitlements: [{ feature_code: "FIREFLY", min_release_index: 1 }], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 2, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
          trigger:
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "AP-1", operating_room_length_cm: 776, operating_room_width_cm: 698, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, uplift_2: $.data.construction_uplift_fee_cents }
          assert:
            - "two uplift units (length 776 is 4 cm below 780, width 698 is 2 cm below 700): construction_uplift_fee_cents == 685800"
            - "SiteReadinessReview.${rev}.conditional_clearance_count == 2"
            - "the per-unit-then-sum implementation would report 609600, so the assertion discriminates the pinned order"

      - name: shortfall_compliance_tier_escalation_remainder_ladder
        grounds:
          - calculations.shortfall_compliance_status
          - calculations.shortfall_escalation
          - calculations.shortfall_fee
          - validations[priority=35]
          - endpoints.POST_/api/month-close/runs
        distinguishing_aspect: "Mode (c) circular-looking dependency whose evaluation order must be pinned: compliance_status is derived from the streak tier, but the escalation that drives the agreement to REMEDIATION_REQUIRED is derived from a remainder ladder whose promotion index is itself the tier — and the save-grid promotion index is not the position in the table."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account in IDN-ODAK, one DA_V1 configuration, one PASSED review, one surgeon record, one USAGE_BASED agreement with minimum_procedures_per_cycle 12, placement_fee_cents 1500000 and usage_rate_basis_points 400."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Odak Regional", idn_group_code: "IDN-ODAK", region_code: "MIDWEST", placement_cap: 6, maximum_procedure_commitment: 30 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V1", base_placement_fee_cents: 4800000, max_instrument_lives: 10, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "OD-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Odak", simulation_modules_completed: 3, required_proctored_cases: 1 }
              as: ClinicalOperationsLead
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "USAGE_BASED", base_monthly_fee_cents: 0, minimum_procedures_per_cycle: 12, interval_months: 1, placement_fee_cents: 1500000, usage_rate_basis_points: 400 }
              as: RegionalSalesDirector
              captures: { agr: $.data.id, agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/submit"
              payload: { expected_agreement_version: "${agr_v}" }
              as: RegionalSalesDirector
              captures: { agr_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, sys_v: $.data.synthesized_system_version }
          trigger:
            - call: "POST /api/month-close/runs"
              payload: { as_of_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${agr}"
              payload: {}
              as: ComplianceOfficer
              captures: { fee_after: $.data.last_shortfall_fee_cents, status_after: $.data.compliance_status }
              
          assert:
            - "zero procedures delivered against a 12-procedure commitment gives shortfall_procedures 12 and last_shortfall_fee_cents == 3000000 ((12 - 2 grace) x 1500000 x 0.02)"
            - "PlacementAgreement.${agr}.shortfall_procedures == 12"
            - "the streak ladder stops at tier 2 because REMAINDER(2^3, 7) == 1, so period_quota is 2 and an implementation that promotes on tier 3 is wrong"
            - "PlacementAgreement.${agr}.compliance_status ∈ {SHORTFALL_CHARGEABLE, NON_COMPLIANT, REMEDIATION_REQUIRED} and is never MEETS_COMMITMENT"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine  (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: readiness_review_rejected_pending_revision_loop
        grounds:
          - state_machines.SiteReadinessReview.REJECTED_to_PENDING_REVIEW
          - state_machines.SiteReadinessReview.PENDING_REVIEW_to_REJECTED
          - entities.SiteReadinessReview.fields.review_round
          - endpoints.POST_/api/account-readiness-reviews/{reviewId}/return-to-review
        distinguishing_aspect: "A genuine cycle on a different entity from the agreement loop: a SiteReadinessReview walks PENDING_REVIEW → REJECTED → PENDING_REVIEW → PASSED, and the second visit to PENDING_REVIEW carries review_round 2, so the same row re-enters the state it was created in — not a linear pipeline."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account and one DA_V2 configuration."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Birch Run Surgical", idn_group_code: "IDN-BIRCH", region_code: "EAST", placement_cap: 3, maximum_procedure_commitment: 20 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V2", base_placement_fee_cents: 6000000, max_instrument_lives: 12, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 2, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "BR-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/reject"
              payload: { remediation_note: "Widen the door to 120 cm before re-measure." }
              as: ClinicalOperationsLead
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /api/account-readiness-reviews/${rev}/return-to-review"
              payload: { remediation_note: "Door widened." }
              as: ClinicalOperationsLead
              captures: { rev_v: $.data.version, loop_round: $.data.review_round, loop_status: $.data.readiness_status }
          assert:
            - "SiteReadinessReview.${rev}.readiness_status == PENDING_REVIEW after having already been REJECTED"
            - "SiteReadinessReview.${rev}.review_round == 2"
            - "submitting verdict PASSED with expected_review_version ${rev_v} then yields readiness_status PASSED with review_round still 2"

      - name: agreement_draft_pending_active_reject_revision_loop
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_DRAFT
          - state_machines.PlacementAgreement.PENDING_ACCEPTANCE_to_ACTIVE
          - state_machines.PlacementAgreement.DRAFT_to_PENDING_ACCEPTANCE
          - endpoints.POST_/api/placement-agreements/{agreementId}/reject
        distinguishing_aspect: "A cycle that traverses the whole activation path and returns: the agreement goes DRAFT → PENDING_ACCEPTANCE → ACTIVE → DRAFT and then back up to PENDING_ACCEPTANCE, reusing the same row while the synthesized system from its first activation remains in existence — a non-linear loop, not a one-way pipeline."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with placement_cap 4, one configuration, one PASSED review, one surgeon record, one PURCHASE agreement."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/accounts"
              payload: { account_name: "Larkspur Surgical Center", idn_group_code: "IDN-LARK", region_code: "SOUTH", placement_cap: 4, maximum_procedure_commitment: 25 }
              as: RegionalSalesDirector
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V1", base_placement_fee_cents: 4800000, max_instrument_lives: 10, feature_entitlements: [], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 1, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "LK-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
