          assert:
            - "trigger call 1 -> 200: BurnInRun.${run1}.run_state == ABORTED with abort_reason recorded and completed_by_user_id == 'qa-1'; Cabinet.${cab}.cabinet_state is back to POPULATED"
            - "trigger call 2 -> 409 with ${err_complete_aborted} == 'ERR_INVALID_RUN_STATE': complete and abort share the SCHEDULED-only window, and the aborted run keeps its abort_reason with no measurements stored"
            - "trigger call 3 -> 201: the cabinet is re-schedulable after an abort, so ${run2} exists in run_state SCHEDULED"
            - "trigger call 5 -> 200: ${run2}.run_state == PASSED and Cabinet.${cab}.cabinet_state == BURN_IN_PASSED"
