              payload: { carrier_id: "${c39_id}", application_kind: "NEW", transportation_type: "HOUSEHOLD_GOODS", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
