  # ---- ranking and sort order governance -----------------------------------
  - method: POST
    path: "/ranking-runs"
    description: "Builds a DRAFT ranking for one market and travel_date. Runs ranking_score over every LIVE offer whose rate plan is ACTIVE in that market for that date, materialises one immutable RankingEntry per offer and snapshots the weights actually used. Rejected with ERR_NO_ELIGIBLE_OFFERS when the pool is empty."
    roles: [CommercialManager, PlatformAdmin]
    code: 201
    input: [market_id, travel_date, sort_profile, "disclosure_version?"]
    output: RankingRun
    side_effects:
      - "creates one RankingEntry per eligible offer with price_competitiveness, organic_score, boost_points_applied, final_score, rank_position, is_paid_placement and disclosure_label"
      - "writes weights_snapshot, entry_count and paid_entry_count"
  - method: GET
    path: "/ranking-runs/{id}"
    description: "Reads one ranking run."
    roles: *all_roles
    code: 200
    input: []
    output: RankingRun
    side_effects: []
  - method: GET
    path: "/ranking-runs"
    description: "Lists ranking runs, filterable by market, travel date and status, ordered by created_at DESC."
    roles: *all_roles
    code: 200
    input: ["market_id?", "travel_date?", "status?", "limit?", "offset?"]
    output: "RankingRun[]"
    side_effects: []
  - method: POST
    path: "/ranking-runs/{id}/publish"
    description: "Publishes a DRAFT ranking to travellers. Requires the regulatory disclosure_version whenever the market demands it, and requires every paid entry's placement agreement to still be ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: RankingRun
    side_effects: ["RankingRun DRAFT -> PUBLISHED", "stamps published_at and published_by_user_id", "increments RankingRun.version by 1"]
  - method: POST
    path: "/ranking-runs/{id}/withdraw"
    description: "Withdraws a DRAFT or PUBLISHED ranking."
    roles: [ComplianceOfficer, CommercialManager]
    code: 200
    input: [withdrawal_reason]
    output: RankingRun
    side_effects: ["RankingRun DRAFT|PUBLISHED -> WITHDRAWN", "increments RankingRun.version by 1"]
  - method: GET
    path: "/ranking-entries/{id}"
    description: "Reads one immutable ranking entry with its score decomposition and paid-placement disclosure label."
    roles: *all_roles
    code: 200
    input: []
    output: RankingEntry
    side_effects: []
  - method: GET
    path: "/ranking-entries"
    description: "Lists ranking entries, filterable by run, offer and placement agreement, ordered by rank_position ASC."
    roles: *all_roles
    code: 200
    input: ["ranking_run_id?", "offer_id?", "placement_agreement_id?", "is_paid_placement?", "limit?", "offset?"]
    output: "RankingEntry[]"
    side_effects: []

  # ---- packages ------------------------------------------------------------
  - method: POST
    path: "/packages"
    description: "Opens a DRAFT air-plus-hotel package for one market and travel_date. An opaque package hides supplier identity until after booking."
    roles: [CommercialManager, BookingAgent]
    code: 201
    input: [market_id, travel_date, name, opaque]
    output: Package
    side_effects: ["stores created_by_user_id from X-User-ID"]
  - method: GET
    path: "/packages/{id}"
    description: "Reads one package with its subtotal, discount and total, plus its version for optimistic concurrency."
    roles: *all_roles
    code: 200
    input: []
    output: Package
    side_effects: []
  - method: GET
    path: "/packages"
    description: "Lists packages, filterable by market, travel date and status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["market_id?", "travel_date?", "status?", "opaque?", "limit?", "offset?"]
    output: "Package[]"
    side_effects: []
  - method: POST
    path: "/packages/{id}/components"
    description: "Attaches a LIVE offer as an AIR or HOTEL leg. The offer's travel_date must equal the package's and its plan must sit in the package's market. Adding a leg to a PRICED package invalidates the price and returns the package to DRAFT."
    roles: [CommercialManager, BookingAgent]
    code: 201
    input: [offer_id, component_type]
    output: PackageComponent
    side_effects:
      - "snapshots display_total_snapshot_cents from the offer"
      - "increments Package.component_count by 1"
      - "Package PRICED -> DRAFT, clearing components_subtotal_cents, discount_pct, discount_cents, package_total_cents, priced_at and every component's discount_alloc_cents and allocated_cents"
      - "increments Package.version by 1"
  - method: POST
    path: "/packages/{id}/price"
    description: "Runs package_pricing_and_allocation: sums the component display totals, applies the opaque discount tier, floors the discount, then allocates it across components by floor-plus-largest-remainder with Offer.created_at ASC as the remainder tie-break. Guarded by expected_package_version."
    roles: [CommercialManager, BookingAgent]
    code: 200
    input: [expected_package_version]
    output: Package
    side_effects:
      - "writes components_subtotal_cents, discount_pct, discount_cents, package_total_cents and priced_at"
      - "writes discount_alloc_cents and allocated_cents on every component"
      - "Package DRAFT -> PRICED, or PRICED -> PRICED on a reprice"
      - "increments Package.version by 1"
  - method: POST
    path: "/packages/{id}/publish"
    description: "Publishes a PRICED package. reveal_supplier_names defaults to false and must stay false while opaque is true; the stored reveal_supplier_names field is written from this flag."
    roles: [CommercialManager]
    code: 200
    input: ["reveal_supplier_names?", "note?"]
    output: Package
    side_effects: ["Package PRICED -> PUBLISHED", "stores reveal_supplier_names", "increments Package.version by 1"]
  - method: POST
    path: "/packages/{id}/withdraw"
    description: "Withdraws a PUBLISHED package."
    roles: [CommercialManager, ComplianceOfficer]
    code: 200
    input: [withdrawal_reason]
    output: Package
    side_effects: ["Package PUBLISHED -> WITHDRAWN", "increments Package.version by 1"]
  - method: GET
    path: "/package-components/{id}"
    description: "Reads one immutable package component with its snapshot, allocated discount and allocated price."
    roles: *all_roles
    code: 200
    input: []
    output: PackageComponent
    side_effects: []
  - method: GET
    path: "/package-components"
    description: "Lists package components, filterable by package and offer, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["package_id?", "offer_id?", "component_type?", "limit?", "offset?"]
    output: "PackageComponent[]"
    side_effects: []

  # ---- bookings ------------------------------------------------------------
  - method: POST
    path: "/bookings"
    description: "Books exactly one of a LIVE offer or a PUBLISHED package. quoted_total_cents must equal the server's current charged total or the request is rejected with ERR_PRICE_CHANGED. collection_model is MARKETPLACE_OF_RECORD when the governing agreement is MERCHANT and SUPPLIER_OF_RECORD when it is AGENCY. arrival_at is travel_date at ARRIVAL_HOUR_UTC (15:00Z)."
    roles: [BookingAgent]
    code: 201
    input: ["offer_id?", "package_id?", traveler_reference, quoted_total_cents, payment_token]
    output: Booking
    side_effects:
      - "writes charged_total_cents, taxes_fees_cents, marketplace_margin_cents, supplier_payable_cents, collection_model and arrival_at"
      - "on every booked Offer: decrements allotment_remaining by 1 and increments allotment_held by 1"
      - "increments the version of every touched offer by 1"
  - method: GET
    path: "/bookings/{id}"
    description: "Reads one booking with both state dimensions and its money decomposition."
    roles: *all_roles
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "Lists bookings, filterable by offer, package and either state dimension, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["offer_id?", "package_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []
  - method: POST
    path: "/bookings/{id}/capture"
    description: "Captures the authorized payment. Payment dimension only."
    roles: [BookingAgent]
    code: 200
    input: ["note?"]
    output: Booking
    side_effects: ["Booking.payment_status AUTHORIZED -> CAPTURED", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Supplier confirms the reservation and converts held allotment into sold allotment. Fulfillment dimension only."
    roles: [SupplierUser]
    code: 200
    input: [supplier_confirmation_code]
    output: Booking
    side_effects:
      - "Booking.fulfillment_status RESERVED -> CONFIRMED"
      - "on every booked Offer: decrements allotment_held by 1 and increments allotment_sold by 1"
      - "increments the version of the booking and of every touched offer by 1"
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancels the stay and runs refund_passthrough_due against the plan's cancellation policy and the logical clock's distance from arrival_at, splitting the refund into a marketplace margin clawback, a supplier debit and a tax refund."
    roles: [BookingAgent]
    code: 200
    input: [cancellation_reason]
    output: Booking
    side_effects:
      - "Booking.fulfillment_status RESERVED|CONFIRMED -> CANCELLED and stamps cancelled_at"
      - "writes cancellation_refund_pct, refunded_cents, last_refund_clawback_cents, last_refund_supplier_debit_cents and last_refund_tax_cents, and reduces marketplace_margin_cents, supplier_payable_cents and taxes_fees_cents by those three amounts"
      - "moves payment_status to REFUNDED_FULL at a 100% refund and to REFUNDED_PARTIAL at a partial refund"
      - "returns inventory: decrements allotment_held or allotment_sold by 1 and increments allotment_remaining by 1"
      - "increments the version of the booking and of every touched offer by 1"
  - method: POST
    path: "/bookings/{id}/complete"
    description: "Marks the stay consumed once the logical clock has reached arrival_at."
    roles: [SupplierUser]
    code: 200
    input: ["note?"]
    output: Booking
    side_effects: ["Booking.fulfillment_status CONFIRMED -> COMPLETED", "increments Booking.version by 1"]

  # ---- supplier dispute mediation ------------------------------------------
  - method: POST
    path: "/bookings/{id}/dispute-cases"
    description: "Files a dispute against a booking. Runs dispute_settlement_total (mediation fee tiered on refund_due_cents, not on the settlement total) and the PRELIMINARY variant of dispute_liability_split, which reads the ModelAgreement covering the filing date. dispute_type CHARGEBACK requires payment_status CHARGEBACK."
    roles: [ComplianceOfficer, SupplierUser, BookingAgent]
    code: 201
    input: [dispute_type, claim_cents, narrative]
    output: DisputeCase
    side_effects:
      - "resolves supplier_id from the booked inventory and writes filing_agreement_id and binding_agreement_id"
      - "writes refund_due_cents, mediation_fee_pct, mediation_fee_cents and settlement_total_cents"
      - "writes preliminary_marketplace_cents and preliminary_supplier_cents"
      - "stores filed_by_user_id from X-User-ID"
  - method: GET
    path: "/dispute-cases/{id}"
    description: "Reads one dispute with both liability variants and its mediation round count."
    roles: *all_roles
    code: 200
    input: []
    output: DisputeCase
    side_effects: []
  - method: GET
    path: "/dispute-cases"
    description: "Lists disputes, filterable by booking, supplier and either governing agreement, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["booking_id?", "supplier_id?", "filing_agreement_id?", "binding_agreement_id?", "status?", "limit?", "offset?"]
    output: "DisputeCase[]"
    side_effects: []
  - method: POST
    path: "/dispute-cases/{id}/request-response"
    description: "Puts the supplier on notice. Repeatable from MEDIATION, bounded by DISPUTE_MAX_ROUNDS (3)."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: DisputeCase
    side_effects: ["DisputeCase FILED|MEDIATION -> RESPONSE_REQUESTED", "increments mediation_rounds by 1", "increments DisputeCase.version by 1"]
  - method: POST
    path: "/dispute-cases/{id}/respond"
    description: "Supplier states its position and returns the case to mediation."
    roles: [SupplierUser]
    code: 200
    input: [supplier_position]
    output: DisputeCase
    side_effects: ["DisputeCase RESPONSE_REQUESTED -> MEDIATION", "stores supplier_position", "increments DisputeCase.version by 1"]
  - method: POST
    path: "/dispute-cases/{id}/resolve"
    description: "Resolves the dispute and runs the BINDING variant of dispute_liability_split, which reads the ModelAgreement covering the booking's travel_date and applies the fraud liability cap on FRAUD disputes. outcome REVERSE_REFUND additionally reverses the booking's refund. The resolving X-User-ID must differ from filed_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "note?"]
    output: DisputeCase
    side_effects:
      - "DisputeCase FILED|RESPONSE_REQUESTED|MEDIATION -> RESOLVED, storing outcome and resolved_by_user_id"
      - "writes uncapped_marketplace_cents, binding_marketplace_cents and binding_supplier_cents"
      - "on outcome REVERSE_REFUND: Booking.payment_status REFUNDED_PARTIAL|REFUNDED_FULL -> CAPTURED, refunded_cents back to 0 and the three last_refund_* amounts added back to marketplace_margin_cents, supplier_payable_cents and taxes_fees_cents before resetting to 0"
      - "increments the version of the dispute and of any touched booking by 1"

  # ---- supplier scorecards -------------------------------------------------
  - method: POST
    path: "/suppliers/{id}/scorecards"
    description: "Opens a PROVISIONAL scorecard for a closed or open period and runs supplier_composite_score in its PROVISIONAL variant, which charges every parity case opened in the period including still-open ones plus a projected escalation penalty."
    roles: [CommercialManager, ComplianceOfficer]
    code: 201
    input: [period_start, period_end]
    output: SupplierScorecard
    side_effects: ["writes parity_penalty_points, parity_component, content_component, connectivity_component, dispute_component, composite_score and cases_counted"]
  - method: GET
    path: "/scorecards/{id}"
    description: "Reads one scorecard with its component decomposition."
    roles: *all_roles
    code: 200
    input: []
    output: SupplierScorecard
    side_effects: []
  - method: GET
    path: "/scorecards"
    description: "Lists scorecards, filterable by supplier and variant, ordered by period_start ASC then created_at ASC."
    roles: *all_roles
    code: 200
    input: ["supplier_id?", "variant?", "limit?", "offset?"]
    output: "SupplierScorecard[]"
    side_effects: []
  - method: POST
    path: "/scorecards/{id}/finalize"
    description: "Recomputes the scorecard under the FINAL variant, which charges only cases closed non-compliant or escalated and drops the projected escalation penalty. Requires the logical clock date to be strictly after period_end."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: SupplierScorecard
    side_effects: ["SupplierScorecard PROVISIONAL -> FINAL", "recomputes every component and composite_score", "stores finalized_by_user_id", "increments SupplierScorecard.version by 1"]

# --- §1.6 Error Code Catalog -------------------------------------------------
errors:
  # auth
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed on the endpoint" }
  - { id: ERR_SUPPLIER_SCOPE_VIOLATION, http: 403, condition: "a SupplierUser writes against a resource owned by a different Supplier" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the approving, waiving or resolving X-User-ID equals the proposing, opening or filing X-User-ID" }
  # existence
  - { id: ERR_MARKET_NOT_FOUND, http: 404, condition: "market id in the path or body does not resolve" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "supplier id in the path or body does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "model agreement id does not resolve" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id does not resolve" }
  - { id: ERR_RATE_PLAN_NOT_FOUND, http: 404, condition: "rate plan id does not resolve" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "offer id does not resolve" }
  - { id: ERR_OBSERVATION_NOT_FOUND, http: 404, condition: "direct rate observation id does not resolve" }
  - { id: ERR_PARITY_CASE_NOT_FOUND, http: 404, condition: "parity case id does not resolve" }
  - { id: ERR_OVERRIDE_NOT_FOUND, http: 404, condition: "commission override id does not resolve" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "placement agreement id does not resolve" }
  - { id: ERR_RANKING_RUN_NOT_FOUND, http: 404, condition: "ranking run id does not resolve" }
  - { id: ERR_RANKING_ENTRY_NOT_FOUND, http: 404, condition: "ranking entry id does not resolve" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "package id does not resolve" }
  - { id: ERR_PACKAGE_COMPONENT_NOT_FOUND, http: 404, condition: "package component id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute case id does not resolve" }
  - { id: ERR_SCORECARD_NOT_FOUND, http: 404, condition: "scorecard id does not resolve" }
  # request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "required field missing, undeclared enum value, wrong scalar type, percentage outside 0..1, negative integer amount, or pagination limit outside 1..100 or offset below 0" }
  # optimistic concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rate_plan_version does not equal RatePlan.version, or expected_package_version does not equal Package.version" }
  # state preconditions
  - { id: ERR_AGREEMENT_NOT_DRAFT, http: 409, condition: "activate or withdraw on a model agreement that is not DRAFT" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE_STATE, http: 409, condition: "terminate on a model agreement that is not ACTIVE" }
  - { id: ERR_CERT_NOT_REVIEWABLE, http: 409, condition: "start-review on a certification that is not SUBMITTED or REMEDIATION_SUBMITTED" }
  - { id: ERR_CERT_NOT_DECIDED, http: 409, condition: "decide on a certification that is not IN_REVIEW" }
  - { id: ERR_CERT_NOT_REJECTED, http: 409, condition: "remediate on a certification that is not REJECTED" }
  - { id: ERR_SUPPLIER_NOT_SUSPENDED, http: 409, condition: "reinstate a supplier that is not SUSPENDED, or reinstate one with no live certification at the current logical clock" }
  - { id: ERR_SUPPLIER_OFFBOARDED, http: 409, condition: "any write against a supplier, plan, offer or certification whose supplier is OFFBOARDED" }
  - { id: ERR_RATE_PLAN_NOT_ON_HOLD, http: 409, condition: "release-parity-hold on a rate plan that is not PARITY_HOLD, or whose parity_hold_case_id case is still open" }
  - { id: ERR_OFFER_NOT_PUBLISHABLE, http: 409, condition: "publish on an offer that is not PENDING or SUPPRESSED, or whose rate plan is not ACTIVE" }
  - { id: ERR_OFFER_NOT_LIVE, http: 409, condition: "suppress on an offer that is not LIVE, or booking an offer that is not LIVE" }
  - { id: ERR_PARITY_CASE_CLOSED, http: 409, condition: "any transition on a parity case already in RESOLVED_COMPLIANT or WAIVED" }
  - { id: ERR_PARITY_CASE_NOT_NOTIFIED, http: 409, condition: "respond on a parity case that is not SUPPLIER_NOTIFIED, or close with outcome WAIVED from a state other than SUPPLIER_NOTIFIED" }
  - { id: ERR_PARITY_CASE_NOT_ESCALATABLE, http: 409, condition: "escalate a parity case that is not SUPPLIER_NOTIFIED or SUPPLIER_RESPONDED" }
  - { id: ERR_OVERRIDE_NOT_PENDING, http: 409, condition: "approve an override that is not PROPOSED, or reject one that is neither PROPOSED nor ACTIVE" }
  - { id: ERR_PLACEMENT_NOT_PROPOSED, http: 409, condition: "approve a placement agreement that is not PROPOSED, or cancel one that is neither PROPOSED nor ACTIVE" }
  - { id: ERR_RUN_NOT_DRAFT, http: 409, condition: "publish a ranking run that is not DRAFT" }
  - { id: ERR_RUN_NOT_PUBLISHED, http: 409, condition: "withdraw a ranking run that is neither DRAFT nor PUBLISHED" }
  - { id: ERR_PACKAGE_NOT_DRAFT_OR_PRICED, http: 409, condition: "add a component to a package that is neither DRAFT nor PRICED" }
  - { id: ERR_PACKAGE_NOT_PRICED, http: 409, condition: "price a package that is not DRAFT or PRICED, or publish one that is not PRICED" }
  - { id: ERR_PACKAGE_NOT_PUBLISHED, http: 409, condition: "withdraw a package that is not PUBLISHED, or book a package that is not PUBLISHED" }
  - { id: ERR_PAYMENT_NOT_AUTHORIZED, http: 409, condition: "capture a booking whose payment_status is not AUTHORIZED" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "simulate a chargeback on a booking whose payment_status is not CAPTURED" }
  - { id: ERR_BOOKING_NOT_RESERVED, http: 409, condition: "confirm a booking whose fulfillment_status is not RESERVED" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "complete a booking that is not CONFIRMED, or complete one before the logical clock reaches arrival_at" }
  - { id: ERR_BOOKING_ALREADY_CANCELLED, http: 409, condition: "cancel a booking whose fulfillment_status is already CANCELLED or COMPLETED, or cancel one whose payment_status is CHARGEBACK" }
  - { id: ERR_DISPUTE_NOT_AWAITING_RESPONSE, http: 409, condition: "respond on a dispute that is not RESPONSE_REQUESTED, or request-response on one that is neither FILED nor MEDIATION" }
  - { id: ERR_DISPUTE_ALREADY_RESOLVED, http: 409, condition: "any transition on a dispute already RESOLVED" }
  - { id: ERR_SCORECARD_ALREADY_FINAL, http: 409, condition: "finalize a scorecard whose variant is already FINAL" }
  # business_safety
  - { id: ERR_SUPPLIER_NOT_CERTIFIED, http: 422, condition: "publishing an offer whose supplier has certification_level NONE or whose visibility_status is not ACTIVE" }
  - { id: ERR_DISCLOSURE_MISSING, http: 422, condition: "publishing a ranking run without disclosure_version in a market where ranking_disclosure_required is true" }
  - { id: ERR_OPAQUE_DISCLOSURE_FORBIDDEN, http: 422, condition: "publishing an opaque package with reveal_supplier_names true" }
  # business_temporal
  - { id: ERR_MODEL_AGREEMENT_OVERLAP, http: 409, condition: "activating a model agreement whose closed effective interval intersects an ACTIVE sibling's, including the touching case where one interval's start equals the other's end; the equal-effective_from supersede case is exempt" }
  - { id: ERR_PLACEMENT_CAPACITY_EXCEEDED, http: 409, condition: "approving a placement agreement would push the ACTIVE slot total above Market.paid_slot_capacity on any date of its half-open window" }
  - { id: ERR_TRAVEL_DATE_OUT_OF_RANGE, http: 422, condition: "travel_date is before the logical clock date or more than MAX_HORIZON_DAYS (500) after it" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 409, condition: "finalizing a scorecard while the logical clock date is on or before period_end" }
  # business_constraint
  - { id: ERR_MARKET_CODE_TAKEN, http: 409, condition: "market_code already exists" }
  - { id: ERR_PARITY_ROUND_LIMIT, http: 409, condition: "notify-supplier when notify_rounds has reached PARITY_MAX_NOTIFY_ROUNDS (3)" }
  - { id: ERR_REMEDIATION_LIMIT, http: 409, condition: "remediate when remediation_rounds has reached CERT_MAX_REMEDIATION_ROUNDS (3)" }
  - { id: ERR_DISPUTE_ROUND_LIMIT, http: 409, condition: "request-response when mediation_rounds has reached DISPUTE_MAX_ROUNDS (3)" }
  - { id: ERR_PACKAGE_COMPONENT_MIX_INVALID, http: 422, condition: "pricing or publishing a package with fewer than MIN_COMPONENTS (2) components or without at least one AIR and one HOTEL leg" }
  - { id: ERR_BOOKING_TARGET_INVALID, http: 422, condition: "POST /bookings supplies neither offer_id nor package_id, or supplies both" }
  - { id: ERR_NO_ELIGIBLE_OFFERS, http: 422, condition: "a ranking run is requested for a market and travel_date with no LIVE offer on an ACTIVE plan" }
  # business_referential
  - { id: ERR_PLACEMENT_NOT_ACTIVE, http: 422, condition: "publishing a ranking run holding a paid entry whose placement agreement is no longer ACTIVE" }
  - { id: ERR_COMPONENT_NOT_LIVE, http: 422, condition: "pricing or publishing a package one of whose component offers is not LIVE" }
  - { id: ERR_COMPONENT_DATE_MISMATCH, http: 422, condition: "the component offer's travel_date differs from the package's, or its rate plan sits in a different market" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 422, condition: "no ACTIVE model agreement of the supplier covers the offer's travel_date at ingestion or publication" }
  - { id: ERR_OVERRIDE_MODEL_MISMATCH, http: 422, condition: "approving a COMMISSION_PCT override under a MERCHANT agreement, or a MARKUP_PCT override under an AGENCY agreement" }
  - { id: ERR_PAYMENT_NOT_CHARGED_BACK, http: 409, condition: "filing a CHARGEBACK dispute against a booking whose payment_status is not CHARGEBACK" }
  # business_fiscal
  - { id: ERR_PRICE_CHANGED, http: 409, condition: "quoted_total_cents does not equal the server-computed charged total of the offer or package" }
  - { id: ERR_ALLOTMENT_EXHAUSTED, http: 409, condition: "a booked offer has allotment_remaining of 0" }
  - { id: ERR_NOTHING_TO_DISPUTE, http: 422, condition: "filing a dispute against a booking whose charged_total_cents minus refunded_cents is 0" }

# --- §1.7 RBAC Matrix --------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Marketplace operator. Owns market configuration, supplier onboarding and offboarding, paid-slot capacity approval and the two test-driving endpoints. Deliberately holds NO commercial or compliance powers: it cannot draft or activate model agreements, cannot adjudicate certifications, cannot approve overrides and cannot publish a ranking."
    identity: "opaque"
    exclusive_operations:
      - "POST /markets"
      - "POST /suppliers/{id}/offboard"
      - "POST /placement-agreements/{id}/approve"
      - "POST /_clock/set_current_utc"
      - "POST /_payments/simulate-chargeback"
    shared_operations:
      - "POST /suppliers (with CommercialManager)"
      - "POST /ranking-runs (with CommercialManager)"
      - "POST /placement-agreements/{id}/cancel (with CommercialManager)"
      - "all GET endpoints"
  - name: CommercialManager
    description: "Supply-side commercial owner. Proposes the merchant-versus-agency model agreement, the negotiated overrides and the preferred-placement deals, and maintains rate plans, offers and packages on the supplier's behalf. Proposes but never approves: every artifact it proposes is activated by another identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /suppliers/{id}/model-agreements"
      - "POST /model-agreements/{id}/terminate"
      - "POST /model-agreements/{id}/withdraw"
      - "POST /commission-overrides"
      - "POST /placement-agreements"
      - "POST /rate-plans/{id}/archive"
    shared_operations:
      - "POST /suppliers (with PlatformAdmin)"
      - "POST /suppliers/{id}/certifications, POST /suppliers/{id}/rate-plans, POST /rate-plans/{id}/offers, POST /offers/{id}/publish, POST /offers/{id}/close-out (with SupplierUser)"
      - "POST /offers/{id}/suppress (with ParityAnalyst and ComplianceOfficer)"
      - "POST /ranking-runs (with PlatformAdmin), POST /ranking-runs/{id}/withdraw (with ComplianceOfficer)"
      - "POST /packages, POST /packages/{id}/components, POST /packages/{id}/price (with BookingAgent), POST /packages/{id}/publish"
      - "POST /packages/{id}/withdraw (with ComplianceOfficer)"
      - "POST /placement-agreements/{id}/cancel (with PlatformAdmin)"
      - "POST /suppliers/{id}/scorecards (with ComplianceOfficer)"
      - "all GET endpoints"
  - name: ComplianceOfficer
    description: "Regulatory and approval authority. Activates model agreements, adjudicates certifications, approves or revokes overrides, publishes rankings with their disclosure version, waives parity cases and resolves supplier disputes. Segregation of duties is enforced by X-User-ID inequality against the proposing, opening or filing identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /model-agreements/{id}/activate"
      - "POST /certifications/{id}/start-review"
      - "POST /certifications/{id}/decide"
      - "POST /certifications/{id}/revoke"
      - "POST /suppliers/{id}/reinstate"
      - "POST /commission-overrides/{id}/approve"
      - "POST /commission-overrides/{id}/reject"
      - "POST /ranking-runs/{id}/publish"
      - "POST /dispute-cases/{id}/request-response"
      - "POST /dispute-cases/{id}/resolve"
      - "POST /scorecards/{id}/finalize"
    shared_operations:
      - "POST /parity-cases/{id}/escalate, POST /parity-cases/{id}/close, POST /rate-plans/{id}/release-parity-hold (with ParityAnalyst); outcome WAIVED on close is ComplianceOfficer-only"
      - "POST /offers/{id}/suppress (with ParityAnalyst and CommercialManager)"
      - "POST /packages/{id}/withdraw, POST /ranking-runs/{id}/withdraw (with CommercialManager)"
      - "POST /bookings/{id}/dispute-cases (with SupplierUser and BookingAgent)"
      - "POST /suppliers/{id}/scorecards (with CommercialManager)"
      - "all GET endpoints"
  - name: ParityAnalyst
    description: "Rate-parity monitor. Records direct-channel observations, works the parity case ladder and suppresses out-of-parity inventory. Cannot waive a case and cannot touch commercial terms."
    identity: "opaque"
    exclusive_operations:
      - "POST /rate-plans/{id}/parity-observations"
      - "POST /parity-cases/{id}/notify-supplier"
    shared_operations:
      - "POST /parity-cases/{id}/escalate, POST /parity-cases/{id}/close with outcome COMPLIANT, POST /rate-plans/{id}/release-parity-hold (with ComplianceOfficer)"
      - "POST /offers/{id}/suppress (with ComplianceOfficer and CommercialManager)"
      - "all GET endpoints"
  - name: SupplierUser
    description: "The supplier acting on its own account. X-User-ID is the Supplier id, so every SupplierUser write is scope-checked against the owning supplier of the target resource."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /certifications/{id}/remediate"
      - "POST /parity-cases/{id}/respond"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/complete"
      - "POST /dispute-cases/{id}/respond"
    shared_operations:
      - "POST /suppliers/{id}/certifications, POST /suppliers/{id}/rate-plans, POST /rate-plans/{id}/offers, POST /offers/{id}/publish, POST /offers/{id}/close-out (with CommercialManager)"
      - "POST /bookings/{id}/dispute-cases (with ComplianceOfficer and BookingAgent)"
      - "all GET endpoints"
  - name: BookingAgent
    description: "Demand-side booking channel. Assembles and prices packages, takes bookings, captures payment and cancels stays. Cannot publish anything and cannot resolve a dispute it files."
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/capture"
      - "POST /bookings/{id}/cancel"
    shared_operations:
      - "POST /packages, POST /packages/{id}/components, POST /packages/{id}/price (with CommercialManager)"
      - "POST /bookings/{id}/dispute-cases (with ComplianceOfficer and SupplierUser)"
      - "all GET endpoints"
