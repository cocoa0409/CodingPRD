      - name: tier_ladder_patch_is_free_on_draft_and_evidence_gated_on_active
        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /gpo/contracts/{contract_id}/tiers]
          - validations[priority=10]
          - errors.ERR_CLINICAL_REVIEW_NOT_ENDORSED
          - entities.Contract.fields.default_tier_code
        distinguishing_aspect: "The same endpoint is ordinary setup on a DRAFT contract and a category conversion on an ACTIVE one: the DRAFT patch just replaces the ladder and re-derives default_tier_code, while the ACTIVE patch is refused with ERR_CLINICAL_REVIEW_NOT_ENDORSED until an ENDORSED review recommending CONVERT exists — and a review that is merely UNDER_REVIEW with a passing score does not open the gate."
        test_recipe:
          setup: ["DRAFT contract C-CNV on the short ladder, plus one ClinicalEvidenceReview submitted with scores 8.00 / 7.00 / 6.00 by CR-1 (weighted 7.15, CONVERT) and left UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-CNV", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id, dt0: $.data.default_tier_code, cv0: $.data.version }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 8.00, safety_score: 7.00, supply_resilience_score: 6.00, summary: "conversion dossier" }
              as: ClinicalReviewer
              as_user_id: "CR-1"
