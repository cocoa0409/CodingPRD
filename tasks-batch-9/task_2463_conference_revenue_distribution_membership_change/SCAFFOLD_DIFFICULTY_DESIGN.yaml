              captures: { r1_id: $.data.id }
            - call: "POST /protected-rivalries"
              payload: { conference_id: "${conf_id}", member_a_id: "${m_s_id}", member_b_id: "${m_e_id}", required_annual_meetings: 1, label: "Harbor Cup" }
              as: ScheduleCoordinator
              captures: { r2_id: $.data.id }
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_s_id}", away_member_id: "${m_n_id}", venue_id: "${v1_id}", game_date: "2026-10-03T19:00:00Z", fiscal_year: 2027, media_designated: false, protected_rivalry_id: "${r1_id}" }
              as: ScheduleCoordinator
              captures: { gb1_id: $.data.id }
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_s_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-10-08T19:00:00Z", fiscal_year: 2027, media_designated: false, protected_rivalry_id: "${r2_id}" }
              as: ScheduleCoordinator
