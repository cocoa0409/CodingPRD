            - call: "POST /allocation-runs/${run_d}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_d}/lines/${l_d}/ship"
              payload: { qty: 10 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_d}"
              as: DistributorAdmin
              captures: { claim_d: "$.data[0].id" }
          trigger:
