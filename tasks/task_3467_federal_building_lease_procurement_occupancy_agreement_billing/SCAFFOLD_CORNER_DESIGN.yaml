  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data; error responses carry response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["one agency exists"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-370", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
          trigger:
            - { call: "GET /leasing/agencies/${ag}", as: GSAAdmin }
            - { call: "GET /leasing/agencies/00000000-0000-0000-0000-000000000000", as: GSAAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Success: response_type == 'object'; meta.api_request_id present; data.id == ${ag}"
            - "Error: response_type == 'error'; ${err} == ERR_NOT_FOUND; data.message present"

      - name: offer_create_with_unknown_building_returns_not_found
        claim_type: action_endpoint
        grounds: ["validations[priority=4]", "entities.LeaseOffer.fields.building_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body-level FK integrity: an offer referencing a nonexistent building_id is rejected 404 ERR_NOT_FOUND (referential existence, validated after path ids)."
        test_recipe:
          setup: ["requirement SOLICITING"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-371", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
