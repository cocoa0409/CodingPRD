          Priority-ordering claim where two 409s are simultaneously true. Two escalated
          WELFARE complaints push welfare_incident_count to 2, which freezes the
          production and — through the freeze cascade — stamps welfare_hold = true on
          applicant B's DRAFTED agreement. Sending it therefore violates BOTH priority
          11 and priority 14, and the response must be ERR_CASTING_FROZEN; a build that
          checked the row's own hold flag before the parent posture answers
          ERR_WELFARE_HOLD_ACTIVE instead. The two escalations also pin the tier-at-
          start-of-transition rule: 12 sessions under STANDARD, then 18 under ENHANCED.
