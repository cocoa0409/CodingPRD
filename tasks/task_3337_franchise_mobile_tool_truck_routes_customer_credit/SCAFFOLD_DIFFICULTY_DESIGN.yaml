          trigger:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_balance_after: "$.data.current_balance_cents", a1_due_after: "$.data.minimum_payment_due_cents", a1_accrued: "$.data.accrued_finance_charge_cents" } }
          assert:
            - "CreditAccount.${a1_id}.current_balance_cents == 45338 before the 2026-09-14 accrual, with minimum_payment_due_cents == 4534"
            - "CreditAccount.${a1_id}.accrued_finance_charge_cents == 136 after the 2026-09-14 accrual"
            - "CreditAccount.${a1_id}.current_balance_cents == 45474"
            - "CreditAccount.${a1_id}.minimum_payment_due_cents == 4547"
            - "CreditAccount.${a1_id}.minimum_payment_due_cents != 4534"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine  (two DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_cyclic_loops_on_franchisee_and_route
        grounds: [state_machines.Franchisee.CERTIFIED_to_ENROLLED, state_machines.Franchisee.ENROLLED_to_CERTIFIED, state_machines.Route.IN_SERVICE_to_SUSPENDED, state_machines.Route.SUSPENDED_to_IN_SERVICE, entities.Franchisee.fields.can_resell_territory, entities.ShopLocation.fields.shop_status]
        distinguishing_aspect: |
          Two cyclic machines on two different entities: Franchisee.training_status
          loops NOT_ENROLLED->ENROLLED->CERTIFIED->ENROLLED (the CERTIFIED_to_ENROLLED
          back-edge clears certified_on) and Route.route_status loops
          DRAFT->IN_SERVICE->SUSPENDED->IN_SERVICE (the SUSPENDED_to_IN_SERVICE
          back-edge does NOT reopen the shops suspension closed). Neither is a
          linear pipeline, and the two loops terminate in different entities.
        test_recipe:
          setup:
            - "Franchisee F starts NOT_ENROLLED and is brought to CERTIFIED with 45 training points"
            - "Route R1 belongs to F and is IN_SERVICE with an ACTIVE shop S1"
            - "Logical clock 2026-09-07T00:00:00Z"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { f_certified: "$.data.training_status" } }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: SUSPEND }, as: FranchiseManager }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: REINSTATE }, as: FranchiseManager, captures: { r1_reinstated: "$.data.route_status" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: RECERTIFY, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { f_looped: "$.data.training_status", f_resell: "$.data.can_resell_territory" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_final: "$.data.route_status" } }
            - { call: "GET /retail/franchisees/${f_id}", payload: {}, as: CreditOfficer, captures: { f_routes: "$.data.active_route_count" } }
          assert:
            - "Franchisee.${f_id}.training_status == ENROLLED after RECERTIFY"
            - "Franchisee.${f_id}.can_resell_territory == false after RECERTIFY"
            - "Franchisee.${f_id}.certified_on == null after RECERTIFY"
            - "Route.${r1_id}.route_status == IN_SERVICE after REINSTATE"
            - "ShopLocation.${s1_id}.shop_status == INACTIVE — the reinstate back-edge does not reopen shops suspension closed"
            - "Franchisee.${f_id}.active_route_count == 1"

      - name: non_linear_parallel_dimensions_on_route
        grounds: [state_machines.Route.DRAFT_to_IN_SERVICE, state_machines.Route.UNASSIGNED_to_IN_DEVELOPMENT, state_machines.Route.NONE_to_PENDING, state_machines.Route.PENDING_to_DECLINED, entities.Route.fields.resale_status, entities.Route.fields.territory_development_status]
        distinguishing_aspect: |
          Route carries three parallel state dimensions that evolve independently
          on the same row: route_status, territory_development_status and
          resale_status. Driving resale NONE->PENDING->DECLINED leaves
          route_status at IN_SERVICE and territory_development_status at QUALIFIED
          untouched, so the machine is compound of independent axes rather than a
          single A->B->C pipeline.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (mix_plan DIAGNOSTIC_WEIGHTED) is DRAFT with territory UNASSIGNED and resale_status NONE"
            - "Logical clock 2026-09-07T00:00:00Z"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: FILE, buyer_training_status: ENROLLED, buyer_training_points: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_resale_pending: "$.data.resale_status", r1_fee: "$.data.reopening_fee_cents" } }
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: DECLINE }, as: FranchiseManager, captures: { r1_resale_declined: "$.data.resale_status" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_status: "$.data.route_status", r1_territory: "$.data.territory_development_status", r1_resale: "$.data.resale_status" } }
          assert:
            - "Route.${r1_id}.resale_status == DECLINED"
            - "Route.${r1_id}.route_status == IN_SERVICE — the resale axis moved without touching the lifecycle axis"
            - "Route.${r1_id}.territory_development_status == QUALIFIED — the resale axis moved without touching the territory axis"
            - "Route.${r1_id}.reopening_fee_cents == 635000 (ENROLLED buyer, 10 points = one discount unit)"
            - "the PENDING filing capture is a distinct observation from the DECLINED result"

  # ===========================================================================
  # Rule 4 — transitive_cascade  (two DIFFERENT triggering transitions;
  # one depth >= 3, the other depth >= 2; every hop caused by the previous)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: transitive_collection_cascade_five_hops
        grounds: [state_machines.Payment.BOOKED_to_COLLECTED, state_machines.CreditAccount.ACTIVE_to_DELINQUENT, calculations.payment_allocation, calculations.finance_charge_accrual, entities.CreditAccount.fields.current_balance_cents, entities.Technician.fields.revolving_used_cents, entities.Franchisee.fields.outstanding_credit_cents]
        distinguishing_aspect: |
          Cascade of depth 5 originating at the BOOKED_to_COLLECTED payment
          transition: Payment -> FinanceCharge (allocation closes the charge) ->
          CreditAccount (principal and balances) -> Technician
          (revolving_used_cents) -> Franchisee (outstanding_credit_cents). Each
          hop is caused by the previous hop's write, not by the original collect:
          the fee closes, the account balance follows the fee, the technician
          aggregate follows the account, and the franchisee aggregate follows the
          technician.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1, credit_line_limit_cents 100000"
            - "Product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application (approved_limit_cents 50000) minted to A1 (ACTIVE)"
            - "Clock was 2026-09-07 when O1 (3 x P1, gross 45338) was created and DELIVERED, so A1.principal_balance_cents is 45338 and no finance charge has accrued"
            - "One BOOKED 20000-cent payment for the week of 2026-09-07 sits on A1"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/credit-accounts/${a1_id}/payments", payload: { amount_cents: 20000, collection_source: TRUCK_COLLECTION, expected_week_start: "2026-09-07T00:00:00Z" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm1_id: "$.data.id" } }
            - { call: "GET /retail/credit-accounts/${a1_id}/finance-charges", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_charged: "$.data.accrued_finance_charge_cents" } }
            - { call: "POST /retail/credit-accounts/${a1_id}/payments/${pm1_id}/status", payload: { action: COLLECT }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/credit-accounts/${a1_id}/payments/${pm1_id}/status", payload: { action: COLLECT }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { dup_error: "$.data.error_id" } }
          assert:
            - "hop 1 - the accrual charge closes: the account's sole FinanceCharge has charge_status == CLOSED with collection_applied_cents == 136 and charge_resolved_iso_week == 2026-09-14T00:00:00Z"
            - "hop 1 - Payment.${pm1_id}.charge_applied_cents == 136"
            - "hop 2 - CreditAccount.${a1_id}.accrued_finance_charge_cents == 0"
            - "hop 2 - CreditAccount.${a1_id}.principal_balance_cents == 25474"
            - "hop 2 - CreditAccount.${a1_id}.current_balance_cents == 25474"
            - "hop 3 - Technician.${t_id}.revolving_used_cents == 25474"
            - "hop 4 - Franchisee.${f_id}.outstanding_credit_cents == 25474"
            - "the second COLLECT of the same payment captures ${dup_error} == ERR_PAYMENT_NOT_BOOKED"

      - name: transitive_trade_exit_cascade_four_hops
        grounds: [state_machines.Technician.ACTIVE_to_TRADE_EXITED, state_machines.CreditAccount.ACTIVE_to_SUSPENDED, entities.ShopLocation.fields.active_technician_count, entities.Technician.fields.revolving_available_cents, entities.Franchisee.fields.outstanding_credit_cents]
        distinguishing_aspect: |
          Cascade of depth 4 originating at a DIFFERENT transition, the Technician
          ACTIVE_to_TRADE_EXITED exit: Technician -> CreditAccount (status flips
          ACTIVE to SUSPENDED) -> Technician.revolving_available_cents (the
          status filter drops the suspended balance out of revolving_used_cents)
          -> Franchisee.outstanding_credit_cents (SUSPENDED is outside the
          aggregate's {ACTIVE, DELINQUENT} filter) and -> the source
          ShopLocation.active_technician_count. The account flip is caused by the
          exit, and every later aggregate moves because the account flipped.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1, credit_line_limit_cents 100000; S1.active_technician_count is 1"
            - "Product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application (approved_limit_cents 50000) minted to A1 (ACTIVE); a DELIVERED order put 45338 cents of principal on A1"
            - "Logical clock 2026-09-07T00:00:00Z"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /retail/technicians/${t_id}/status", payload: { action: EXIT_TRADE }, as: FranchiseManager, captures: { t_exit_shop: "$.data.last_known_shop_name", t_exit_current: "$.data.current_shop_location_id", t_exit_home: "$.data.home_route_id" } }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_status: "$.data.account_status" } }
            - { call: "GET /retail/technicians/${t_id}", payload: {}, as: CreditOfficer, captures: { t_used: "$.data.revolving_used_cents", t_avail: "$.data.revolving_available_cents", t_status: "$.data.technician_status" } }
            - { call: "GET /retail/franchisees/${f_id}", payload: {}, as: CreditOfficer, captures: { f_outstanding: "$.data.outstanding_credit_cents", f_exposure: "$.data.recourse_exposure_cents" } }
            - { call: "GET /retail/shop-locations/${s1_id}", payload: {}, as: FranchiseOwner, captures: { s1_count: "$.data.active_technician_count" } }
          assert:
            - "hop 1 - CreditAccount.${a1_id}.account_status == SUSPENDED"
            - "hop 2 - Technician.${t_id}.revolving_used_cents == 0 (SUSPENDED is outside the {ACTIVE, DELINQUENT} filter)"
            - "hop 2 - Technician.${t_id}.revolving_available_cents == 100000"
            - "hop 3 - Franchisee.${f_id}.outstanding_credit_cents == 0"
            - "hop 4 - ShopLocation.${s1_id}.active_technician_count == 0"
            - "Technician.${t_id}.technician_status == TRADE_EXITED"
            - "Technician.${t_id}.current_shop_location_id == null"
            - "Technician.${t_id}.home_route_id == null"
            - "Technician.${t_id}.last_known_shop_name == Northside Diesel"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict  (two DIFFERENT category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_state_over_business_fiscal_on_suspended_over_limit_account
        grounds: ["validations[priority=6]", "validations[priority=20]", "errors[ERR_ACCOUNT_NOT_ACTIVE]", "errors[ERR_ACCOUNT_LIMIT_EXCEEDED]", state_machines.SalesOrder.CONFIRMED_to_DELIVERED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: an order is CONFIRMED against a
          zero-limit account whose credit_available_cents is 0, and the account is
          then SUSPENDED. The DELIVER request violates BOTH the priority-6 state
          check (financing requires account_status == ACTIVE) and the priority-20
          fiscal check (financed_principal_cents 15113 exceeds
          credit_available_cents 0); the lower priority number wins, so the
          response is ERR_ACCOUNT_NOT_ACTIVE 409, never ERR_ACCOUNT_LIMIT_EXCEEDED 402.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan DIAGNOSTIC_WEIGHTED) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "AP1 is an APPROVED FRANCHISEE-sourced REVOLVING application with requested_limit_cents 0, so the minted account A1 has credit_limit_cents 0 and credit_available_cents 0"
            - "Order O1 (1 x P1, gross 15113) on R1 is CONFIRMED against A1 while A1 is still ACTIVE"
            - "A1 has then been SUSPENDED (its credit_available_cents was 0, satisfying that precondition)"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 0, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/credit-accounts/${a1_id}/status", payload: { action: SUSPEND }, as: CreditOfficer, captures: { a1_suspended: "$.data.account_status", a1_headroom: "$.data.credit_available_cents" } }
          trigger:
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { deliver_error: "$.data.error_id", deliver_status: "$.data.message" } }
          assert:
            - "the DELIVER response captures ${deliver_error} == ERR_ACCOUNT_NOT_ACTIVE"
            - "the DELIVER response http status is 409 — the priority-6 state check fires before the priority-20 fiscal check"
            - "the DELIVER response never carries ERR_ACCOUNT_LIMIT_EXCEEDED"
            - "CreditAccount.${a1_id}.credit_available_cents == 0 before the attempt"
            - "SalesOrder.${o1_id}.financed_principal_cents == 15113, which is > 0 and would also have failed the fiscal check"
            - "SalesOrder.${o1_id}.order_status == CONFIRMED — the rejected DELIVER changed nothing"

      - name: priority_state_over_business_temporal_on_surrendered_territory
        grounds: ["validations[priority=6]", "validations[priority=18]", "errors[ERR_INVALID_STATE]", "errors[ERR_TERRITORY_WINDOW_CONFLICT]", state_machines.Route.IN_DEVELOPMENT_to_SURRENDERED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: route R1 already surrendered a
          territory round, so territory_development_status is SURRENDERED with a
          stamped in_force_to_week. A DEVELOP request violates BOTH the priority-6
          state check (no transition is declared from SURRENDERED) and the
          priority-18 temporal check (an earlier round is still in force because
          in_force_to_week is not null); the lower priority number wins, so the
          response is ERR_INVALID_STATE 409, never ERR_TERRITORY_WINDOW_CONFLICT 422.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (mix_plan DIAGNOSTIC_WEIGHTED) is DRAFT with territory UNASSIGNED; clock 2026-09-07"
            - "R1 develops a round (IN_DEVELOPMENT, territory_points 90) and then surrenders it, leaving territory_development_status SURRENDERED"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_dev: "$.data.territory_development_status", r1_from: "$.data.in_force_from_week" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: SURRENDER, territory_points: 90 }, as: FranchiseManager, captures: { r1_surrendered: "$.data.territory_development_status", r1_to: "$.data.in_force_to_week" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { develop_error: "$.data.error_id" } }
          assert:
            - "the rejected DEVELOP captures ${develop_error} == ERR_INVALID_STATE"
            - "the rejected DEVELOP http status is 409 — the priority-6 state check fires before the priority-18 temporal check"
            - "the rejected DEVELOP never carries ERR_TERRITORY_WINDOW_CONFLICT"
            - "Route.${r1_id}.territory_development_status == SURRENDERED, unchanged by the rejected request"
            - "Route.${r1_id}.in_force_to_week is not null, which is exactly the condition the priority-18 check would also have failed on"

  # ===========================================================================
  # Rule 6 — boundary_precision_check  (two DIFFERENT metrics, each reachable
  # through a DISTINCT endpoint)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_rate_tier_crossing_at_exactly_50000_cents
        grounds: [calculations.finance_charge_accrual, entities.CreditAccount.fields.current_balance_cents, state_machines.CreditAccount.APPLIED_to_ACTIVE]
        distinguishing_aspect: |
          Numeric threshold crossing on the accrual tier boundary: the rate
          selector is strict-less-than on the cents, so an opening principal of
          exactly 50000 takes RATE_MID and accrues
          round_half_up(50000*0.1820/52) == 175, while 49999 — one cent lower —
          takes RATE_LOW and accrues round_half_up(49999*0.1560/52) == 150. The
          boundary is >=/<-on-the-cents, reachable only through the accrual read
          endpoint GET /retail/credit-accounts/{id}.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1, credit_line_limit_cents 200000"
            - "Product P1 retails 49875; product P2 retails 49874 — POWER_TOOLS weights them to gross 50000 and 49999"
            - "R1 holds 10 units of P1 and 10 units of P2"
            - "AP1 requests 50000 and AP2 requests 49999, both FRANCHISEE-sourced REVOLVING at decision_score 100, approved in full and minted to A1 and A2 (both ACTIVE, both FRANCHISOR-recourse, limits 50000 and 49999)"
            - "Clock 2026-09-07; a 1 x P1 order is DELIVERED on A1 and a 1 x P2 order on A2, putting exactly 50000 and 49999 cents of principal on them"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 200000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 49999, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap2_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap2_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap2_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap2_id}/accounts", payload: { expected_application_version: "${ap2_ver}" }, as: CreditOfficer, captures: { a2_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Upper Boundary Tool", category: POWER_TOOLS, unit_cost_cents: 40000, retail_price_cents: 49875, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P2, product_name: "Lower Boundary Tool", category: POWER_TOOLS, unit_cost_cents: 40000, retail_price_cents: 49874, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p2_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p2_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 1, unit_price_cents: 49875, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id", o1_gross: "$.data.gross_total_cents" } }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a2_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p2_id}", quantity: 1, unit_price_cents: 49874, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o2_id: "$.data.id", o2_gross: "$.data.gross_total_cents" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o2_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o2_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_principal: "$.data.principal_balance_cents", a1_accrued: "$.data.accrued_finance_charge_cents" } }
            - { call: "GET /retail/credit-accounts/${a2_id}", payload: {}, as: CreditOfficer, captures: { a2_principal: "$.data.principal_balance_cents", a2_accrued: "$.data.accrued_finance_charge_cents" } }
          assert:
            - "CreditAccount.${a1_id}.principal_balance_cents == 50000 (at the boundary)"
            - "CreditAccount.${a2_id}.principal_balance_cents == 49999 (one cent below)"
            - "CreditAccount.${a1_id}.accrued_finance_charge_cents == 175"
            - "CreditAccount.${a2_id}.accrued_finance_charge_cents == 150"
            - "CreditAccount.${a1_id}.accrued_finance_charge_cents - CreditAccount.${a2_id}.accrued_finance_charge_cents == 25"

      - name: boundary_fully_committed_stock_adds_zero_over_pledge
        grounds: [calculations.inventory_over_pledge, calculations.order_gross_total, state_machines.SalesOrder.DRAFT_to_CONFIRMED, entities.InventoryPosition.fields.reserved_qty, entities.Route.fields.over_pledge_cents]
        distinguishing_aspect: |
          Empty-versus-over capacity edge on the route's aggregate stock rather
          than a money threshold: with committed reserved_qty equal to on_hand_qty
          the strict "committed > on_hand_qty" test contributes 0 cents of
          over-pledge, and dropping on_hand_qty by one unit while the commitment
          stands flips the SAME position to exactly 1 x unit_cost == 12000 cents.
          The zero side is not an error state, only the strict crossing adds cost.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000"
            - "R1 holds 2 units of P1; T holds an APPROVED account A1 (limit 50000) and a CONFIRMED 2 x P1 order reserving both units"
            - "Clock 2026-09-07"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
