              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
            - call: "POST /rental-contracts/${rc_id}/suspend"
              payload: {}
              as: BillingClerk
            - call: "POST /rental-contracts/${rc_id}/resume"
              payload: {}
              as: BillingClerk
              captures: { rc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /rental-contracts/${rc_id}/terminate"
              payload: { expected_rentalcontract_version: "${rc_v}" }
              as: BillingClerk
              captures: { final_v: $.data.version }
          assert:
            - "RentalContract.${rc_id}.status == TERMINATED"
            - "RentalContract.${rc_id}.version == 4"

      - name: occ_terminate_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rental-terminate-stale-contract]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Terminating with a stale expected_rentalcontract_version (the value observed before a suspend bumped it, i.e. captured_version - 1) returns ERR_STALE_VERSION (412) and leaves the contract un-terminated."
        test_recipe:
          setup:
            - "An ACTIVE contract that has been suspended once (version advanced); the client holds the pre-suspend version."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Os Owner", email: "os@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Os Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
            - call: "POST /rental-contracts/${rc_id}/suspend"
              payload: {}
              as: BillingClerk
              captures: { rc_v_after_suspend: $.data.version }
          trigger:
            - call: "POST /rental-contracts/${rc_id}/terminate"
              payload: { expected_rentalcontract_version: "${rc_v_after_suspend} - 1" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "RentalContract.${rc_id}.status == SUSPENDED"

      - name: clock_default_start_time_makes_invoice_not_past_due
        claim_type: scheduled_actions
        grounds:
          - endpoints
          - state_machines.Invoice.OPEN_to_PAST_DUE
        distinguishing_aspect: "Before any clock set, the logical clock reads the 2026-01-01T00:00:00Z startup default; evaluating an invoice whose due window ends 2026-09-01 leaves it OPEN (not yet PAST_DUE)."
        test_recipe:
          setup:
            - "An OPEN invoice with period_end 2026-08-01 and due_offset_days 30 (due 2026-08-31); clock never set (default 2026-01-01)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ck Owner", email: "ck@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", invoice_kind: "SERVICE_REPAIR", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", due_offset_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/evaluate"
              payload: {}
              as: BillingClerk
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == OPEN"

      - name: invoice_void_restores_account_to_good_standing
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - state_machines.Invoice.OPEN_to_PAST_DUE
          - entities.ServiceAccount.fields.standing
        distinguishing_aspect: "Voiding the sole PAST_DUE invoice that drove an account DELINQUENT recomputes standing back to GOOD."
        test_recipe:
          setup:
            - "An account driven DELINQUENT by one PAST_DUE invoice."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Iv Owner", email: "iv@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", invoice_kind: "SERVICE_REPAIR", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_offset_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: BillingClerk
            - call: "POST /invoices/${inv_id}/evaluate"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "ServiceAccount.${acct_id}.standing == GOOD"

