            - call: "POST /signal-ops/performance-evaluations/${ev_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { e_not_provisional: $.data.error_id }
          assert:
            - "${st_tuning} == FIELD_TUNING"
            - "${e_too_early} == ERR_OBSERVATION_OUT_OF_WINDOW with HTTP 422 — one second before the implementation moment"
            - "${e_future} == ERR_OBSERVATION_OUT_OF_WINDOW — one second after the logical clock now; the window is closed on both sides"
            - "${obs_res0} == OPEN, ${obs_res1} == ADDRESSED, and ${e_not_open} == ERR_OBSERVATION_NOT_OPEN with HTTP 409 on the second PATCH"
            - "${e_no_after} == ERR_NO_AFTER_STUDY with HTTP 409 — first trigger: the AFTER run set is empty"
            - "${run1_recorded} == 2026-08-01T00:00:00Z (system-assigned from the clock, not from started_at)"
            - "${ev_status} == PROVISIONAL, ${ev_variant} == PROVISIONAL_UNWEIGHTED, ${ev_before} == 320.00, ${ev_after} == 300.00, ${ev_delay} == 6.25, ${ev_aog_after} == 66.67 and ${ev_incl} == 1"
            - "${st_eval} == EVALUATION with ${tuned_at} == 2026-08-01T01:00:00Z"
            - "${e_no_after2} == ERR_NO_AFTER_STUDY — second trigger: run 1's recorded_at 2026-08-01T00:00:00Z is strictly before last_tuning_completed_at, so the certified variant's AFTER set is empty even though the provisional variant used that very run"
            - "${run2_recorded} == 2026-08-01T01:00:00Z, and the certification then succeeds: ${c_status} == CERTIFIED, ${c_variant} == CERTIFIED_WEIGHTED, ${c_incl} == 1, ${c_after} == 280.00, ${c_delay} == 12.50, ${c_stops_pct} == 60.00, ${c_aog_after} == 75.00 and ${c_by} == cert-1"
            - "${e_not_provisional} == ERR_EVALUATION_NOT_PROVISIONAL with HTTP 409 on the repeat certification, and the metrics are unchanged by it"

  # ===================================================================================
  # RBAC — §1.7's six roles, the segregation_of_duties role model, PublicRequester's
  # entity_backed identity, and the peer-role sharing declared in shared_operations.
  # The bare priority-1 / priority-2 header gates (ERR_UNAUTHENTICATED, ERR_UNKNOWN_ROLE)
  # are covered by validations.gate_ladder_from_auth_to_pagination_rejected_in_priority_order
  # and are not repeated here.
  # ===================================================================================
  - section: rbac
    instances:

      - name: every_roles_exclusive_operations_are_closed_to_the_other_five_roles
        claim_type: role_denied
        grounds:
          - roles.SignalOpsAdmin.exclusive_operations
          - roles.TimingEngineer.exclusive_operations
          - roles.CertifyingEngineer.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.CitizenLiaison.exclusive_operations
          - roles.PublicRequester.exclusive_operations
          - validations[priority 10 ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The role gate sits at priority 10, ABOVE the existence gate at 20, so every one of these denials is observable against a fabricated path id on a completely empty database — the response is ERR_ROLE_NOT_PERMITTED (403) and never a 404. The matrix is genuinely closed in both directions: the SignalOpsAdmin who owns the inventory cannot open a retiming project, the TimingEngineer who authors plans cannot certify one or collect a count, the CertifyingEngineer who certifies cannot deploy priority or submit a plan, the FieldTechnician who files observations cannot triage a complaint, the CitizenLiaison cannot file an observation, and PublicRequester — whose exclusive_operations list is empty — is absent from every operational GET."
        test_recipe:
          setup:
            - "Empty database; the clock at its startup default 2026-08-01T00:00:00Z."
            - "FAKE := 11111111-1111-4111-8111-111111111111, a syntactically valid UUID that names no row."
            - "The OCC tokens (expected_project_version / expected_intersection_version) are deliberately absent from these bodies: the priority-10 role gate answers first, so priorities 25, 30 and 45 never read the payload at all. No token can be captured on an empty database anyway."
          setup_api_calls: []
          trigger:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
