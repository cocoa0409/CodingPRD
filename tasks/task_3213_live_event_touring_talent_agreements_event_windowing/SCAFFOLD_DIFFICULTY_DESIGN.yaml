  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_on_event_lock
        grounds:
          - validations[priority=5]
          - validations[priority=19]
          - state_machines.Event.SCHEDULED_to_LOCKED
        distinguishing_aspect: |
          Error-category pair (state vs business_constraint): a lock request on
          an ALREADY-LOCKED event whose roster minimums are also unmet MUST
          surface ERR_INVALID_STATE (priority 5), never
          ERR_ROSTER_MINIMUM_UNMET (priority 19).
        test_recipe:
          setup:
            - "EV1: roster_min_total == 0, roster_min_main == 0, already LOCKED (a second lock violates only the state rule)"
            - "EV2 (same arena, next date): roster_min_total == 2, roster_min_main == 1, zero bookings (its lock violates only the roster-minimum rule)"
            - "Together the two triggers isolate the priority order state(5) above business_constraint(19), each error surfacing on its own resource"
          setup_api_calls:
            - call: "POST /touring/arenas"
              payload: { name: "Prio Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "EV1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { ev1_id: $.data.id, ev1_v: $.data.version }
            - call: "POST /touring/events/${ev1_id}/lock"
              payload: { expected_event_version: "${ev1_v}" }
              as: TourPlanner
              captures: { ev1_v2: $.data.version }
            - call: "POST /touring/events"
              payload: { name: "EV2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 1, roster_min_total: 2 }
              as: TourPlanner
              captures: { ev2_v: $.data.version }
          trigger:
            - call: "POST /touring/events/${ev1_id}/lock"
              payload: { expected_event_version: "${ev1_v2}" }
              as: TourPlanner
              captures: { err1: $.data.error_id }
            - call: "POST /touring/events/${ev2_id}/lock"
              payload: { expected_event_version: "${ev2_v}" }
              as: TourPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger response $.data.error_id == ERR_INVALID_STATE (state check at priority 5 beats roster-minimum business_constraint at priority 19)"
            - "second trigger response $.data.error_id == ERR_ROSTER_MINIMUM_UNMET (SCHEDULED event, minimums unmet)"

      - name: safety_vs_referential_on_merch_sale
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - state_machines.MedicalCase.OPEN_to_CLEARED
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_referential): a
          clearance request violating segregation-of-duties while the talent
          ALSO lacks likeness grant for a parallel merch sale shows the two
          errors on their own endpoints — the clearance MUST fail with
          ERR_CLEARANCE_PROTOCOL_VIOLATION (safety) and the merch sale with
          ERR_LIKENESS_NOT_GRANTED (referential); neither leaks the other's.
        test_recipe:
          setup:
            - "Talent T with a DRAFT-only agreement (likeness_granted == false) and an OPEN MedicalCase"
            - "The case has exactly one recommending evaluation by medic evaluator M1"
            - "A SCHEDULED house event HS exists for the merch sale attempt"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Hurt Hank", legal_name: "Hank Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: false, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /touring/medical-cases"
              payload: { talent_id: "${t_id}", severity: "MINOR" }
              as: Medic
              captures: { mc_id: $.data.id }
            - call: "POST /touring/medical-cases/${mc_id}/evaluations"
              payload: { evaluator_id: "medic-m1", findings: "sprained ankle, clearing", recommends_clearance: true }
              as: Medic
            - call: "POST /touring/arenas"
              payload: { name: "Merch Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 1, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "MHS", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hs_id: $.data.id }
          trigger:
            - call: "POST /touring/medical-cases/${mc_id}/clearances"
              payload: { cleared_by: "medic-m1" }
              as: Medic
              captures: { err1: $.data.error_id }
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${hs_id}", talent_id: "${t_id}", quantity: 1, unit_price_cents: 2500, sold_at: "2026-09-05T20:00:00Z" }
              as: MerchOps
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger response $.data.error_id == ERR_CLEARANCE_PROTOCOL_VIOLATION (only one recommending evaluation AND clearer == evaluator; safety category fires before any fiscal/referential check)"
            - "second trigger response $.data.error_id == ERR_LIKENESS_NOT_GRANTED"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: booking_mode_threshold_limited_band_floor
        grounds:
          - calculations.booking_mode_derivation
          - validations[priority=8]
          - entities.Talent.fields.wellness_score
        distinguishing_aspect: |
          Inclusive band boundaries on wellness_score via POST /touring/bookings:
          exactly 50.00 sits inside the LIMITED band (>= 40.00), so a PREMIUM
          booking is rejected with ERR_TALENT_UNBOOKABLE while a HOUSE_SHOW
          booking of the same talent succeeds — the band floor is inclusive, and
          LIMITED vs BOOKABLE is decided by the 70.00 ceiling, not by request
          shape.
        test_recipe:
          setup:
            - "Talent FRESH at wellness 50.00, i.e. exactly the WELLNESS_LIMITED_MIN boundary (inclusive >= puts 50.00 in the LIMITED band, not UNBOOKABLE)"
            - "HOUSE_SHOW HS_OK and PREMIUM PE_NO both on distinct dates"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Boundary Bob", legal_name: "Bob Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Bnd Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "HS_OK", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hok_id: $.data.id, hok_v: $.data.version }
            - call: "POST /touring/events"
              payload: { name: "PE_NO", event_type: "PREMIUM", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "20:00", end_time: "23:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { pno_id: $.data.id }
          trigger:
            - call: "POST /touring/bookings"
              payload: { event_id: "${pno_id}", talent_id: "${t_id}", segment_label: "MAIN_EVENT" }
              as: TourPlanner
              captures: { err_ltd: $.data.error_id }
            - call: "POST /touring/bookings"
