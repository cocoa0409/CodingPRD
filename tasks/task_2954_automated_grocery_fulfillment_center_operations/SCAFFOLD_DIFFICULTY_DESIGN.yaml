              as: FulfillmentAdmin
              captures: { slot_2: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T14:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_3: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T16:00:00.000Z", window_end: "2026-08-05T18:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_4: $.data.id }
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_1}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_1: $.data.id }
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_2}", wave_code: "W2", cutoff_at: "2026-08-05T10:00:00.000Z" }
