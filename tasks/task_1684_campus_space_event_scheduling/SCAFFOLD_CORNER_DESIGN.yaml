            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:00:00Z", service_end_at: "2026-09-16T14:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so2: $.data.id } }
