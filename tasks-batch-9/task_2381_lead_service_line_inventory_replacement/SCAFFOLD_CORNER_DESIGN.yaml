  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_water_system_version_blocks_the_publication_draft
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.water_system_publication_draft
          - validations.priority_50_ERR_STALE_WATER_SYSTEM_VERSION
          - endpoints.POST_lsl_inventory_publications
        distinguishing_aspect: "WaterSystem.version walks 1 (create) -> 2 (advance-inventory-status) -> 3 (corrosion-control PATCH) -> 4 (accepted draft); replaying the version captured at step 2 returns ERR_STALE_WATER_SYSTEM_VERSION 412 with no publication row created, and only the freshly read 3 is accepted. Creating service lines and evidence items does NOT bump the water system version."
        test_recipe:
          setup:
            - "One water system with a LEAD line and a VALIDATED batch, advanced to VALIDATION_PENDING; the version returned by that advance is captured, then a corrosion-control PATCH moves the version on."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2105001", system_name: "OCC Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 5.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "PATCH /lsl/water-systems/${ws}/corrosion-control"
              payload: { cct_optimization_status: "OPTIMIZED", cct_target_ph: 7.6 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v3: $.data.version }
          trigger:
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v3}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
          assert:
            - "${ws_v} == 2 and ${ws_v3} == 3"
            - "The first draft returns HTTP 412 with ${err} == ERR_STALE_WATER_SYSTEM_VERSION"
            - "GET /lsl/inventory-publications filtered by water_system_id returns total_count == 0 after the rejected call"
            - "The second draft returns HTTP 201 with InventoryPublication.${pub}.state == DRAFT and drafted_by_user_id == analyst-1"
            - "WaterSystem.${ws}.version == 4 after the accepted draft"

      - name: stale_expected_service_line_version_blocks_the_classification_override
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.service_line_classification_override
          - validations.priority_50_ERR_STALE_SERVICE_LINE_VERSION
          - endpoints.POST_lsl_service_lines_id_classification_overrides
        distinguishing_aspect: "ServiceLine.version walks 1 (create) -> 2 -> 3 (one bump per evidence item) -> 4 (accepted override); the version captured at creation is stale by two writes and returns ERR_STALE_SERVICE_LINE_VERSION 412 without inserting the override evidence. The accepted override then inserts a POTHOLE/MANUAL item stamped at the logical clock, which outranks the July potholes on observed_at and flips the line to NON_LEAD at certainty 100.00 with the score zeroed by the ELIGIBLE -> NOT_REQUIRED edge."
        test_recipe:
          setup:
            - "One line with POTHOLE utility LEAD (2026-07-01) and POTHOLE customer COPPER (2026-07-02), so it is CLASSIFIED_VERIFIED / LEAD / 100.00 with priority 65.00; the version returned by the create call is captured before both evidence items."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2105002", system_name: "Override OCC Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id, sl_v0: $.data.version }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "POTHOLE", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-07-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "POTHOLE", side: "CUSTOMER", observed_material: "COPPER", observed_at: "2026-07-02T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { sl_v3: $.data.version }
          trigger:
            - call: "POST /lsl/service-lines/${l1}/classification-overrides"
              payload: { expected_service_line_version: "${sl_v0}", side: "UTILITY", asserted_material: "COPPER", justification: "Pothole photo shows copper" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /lsl/service-lines/${l1}/classification-overrides"
              payload: { expected_service_line_version: "${sl_v3}", side: "UTILITY", asserted_material: "COPPER", justification: "Pothole photo shows copper" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${sl_v0} == 1 and ${sl_v3} == 3"
            - "The first override returns HTTP 412 with ${err} == ERR_STALE_SERVICE_LINE_VERSION and ServiceLine.${l1}.classification is still LEAD"
            - "The second override returns HTTP 200"
            - "A new EvidenceItem exists with source_type == POTHOLE, origin == MANUAL, side == UTILITY, observed_material == COPPER and observed_at == 2026-08-01T00:00:00Z"
            - "ServiceLine.${l1}.utility_side_material == COPPER, classification == NON_LEAD, certainty_score == 100.00"
            - "ServiceLine.${l1}.replacement_state == NOT_REQUIRED and replacement_priority_score == 0.00"
            - "ServiceLine.${l1}.version == 4"
            - "WaterSystem.${ws}.lead_count == 0 and WaterSystem.${ws}.non_lead_count == 1"

      - name: version_increments_by_exactly_one_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.FundingSource.common_fields
          - endpoints.POST_lsl_funding_sources_id_status
        distinguishing_aspect: "A FundingSource is created at version 1 and each status write bumps it by exactly one (SUSPENDED -> 2, ACTIVE -> 3); the single-axis entity makes the increment unambiguous, and the SUSPENDED round trip leaves the ledger fields untouched."
        test_recipe:
          setup:
            - "One water system and one 200000-cent funding source."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2105003", system_name: "Version Water", compliance_deadline_date: "2027-10-16" }
