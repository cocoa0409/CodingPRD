  # ───────────────────────────────────────────────────────────────────────────
  # Rule 4 — transitive_cascade
  # Two cascades from DIFFERENT triggering transitions.
  #   (A) POC discharge → depth-3: Visit CANCELLED → grant.units_consumed
  #       recomputed → grant ACTIVE -> CANCELLED.
  #   (B) Visit finalize → depth-2: cumulative_billed recomputed → capped_status
  #       recomputed (UNDER_CAP → AT_CAP_WARNING → EXCEEDED).
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: poc_discharge_depth3_visit_cancel_grant_recompute_grant_cancel
        grounds:
          - state_machines.PlanOfCare.ACTIVE_to_DISCHARGED
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - calculations.units_consumed_running
          - state_machines.AuthorizationGrant.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Triggered by PlanOfCare ACTIVE -> DISCHARGED. Each hop is CAUSED by
          the previous, not the original trigger: hop1 — discharge cancels
          SCHEDULED Visits (Visit SCHEDULED -> CANCELLED) under the POC's
          grants; hop2 — each visit cancellation triggers
          units_consumed_running recompute on its grant; hop3 — the recomputed
          state causes the grant ACTIVE -> CANCELLED via the discharge
          side-effect-on-side-effect rule (originates_in: poc-discharge). Depth 3.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL POC. 1 ACTIVE Grant under POC (total_units_granted=20, units_consumed=4 from one SCHEDULED Visit with planned_minutes=60). DischargeAssessment recorded (so discharge transition is unblocked)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Casc1", npi_number: "1000000040", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Casc1", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 20, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-10T10:00:00Z", scheduled_end_utc: "2026-06-10T11:00:00Z", planned_minutes: 60, cpt_code: "CPT_97110" }
              as: Therapist
