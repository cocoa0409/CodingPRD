scenario: |
  2863. Youth Sports Coach Screening & Athlete Safety Compliance (national governing body member organization): coach and volunteer registration with background screening tiers and disqualifying criteria, abuse prevention training assignment and completion tracking before contact with athletes, required reporting obligations and incident intake routing to the investigating body, minor athlete abuse prevention policies covering travel, lodging, locker rooms and electronic communication, temporary and permanent measures for individuals under investigation, club compliance audits and sanction of noncompliant organizations, membership renewal gating on training and screening currency, records retention and inquiry response

domain_name: youth-sports-safety-compliance
api_prefix: "/safesport"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Member, Club, Case, ClubAudit and CoachAssignment form a many-to-many
  # web — one Member may hold CoachAssignments at several Clubs, one Case may
  # spawn InterimMeasures that reach across every Club that member serves, and
  # AuditFinding cross-references both ClubAudit and Member. URL paths are a
  # mix of flat collections with FK filters and a few genuine sub-resources.

  state_machine_shape: parallel
  # Member carries two independent state dimensions on the same row
  # (screening_status × membership_status), each of which is itself cyclic;
  # Case is branching fork-join with divergent side-effect sets per branch;
  # AuditFinding is cyclic (OPEN -> REMEDIATED -> OPEN).

  relationship_patterns:
    - one_to_many        # Club -> Member, ClubAudit -> AuditFinding, Case -> InterimMeasure
    - many_to_many       # Member <-> Club via CoachAssignment
    - cross_aggregate    # AuditFinding.member_id crosses the ClubAudit aggregate into Member
    - polymorphic        # RoomStay occupant is either an ADULT_MEMBER (member_id set) or a MINOR_ATHLETE (member_id null, minor_athlete_age set)

  role_model: segregation_of_duties
  # The SafeSportOfficer who imposed an InterimMeasure may not be the officer who
  # converts it to PERMANENT; the ClubAdministrator submits remediation but only
  # a ComplianceAuditor may reject or waive it; the ScreeningVendor returns raw
  # results but may never adjudicate them.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the Expert band of SKILL.md §0.4 (12 entities, 57
  # endpoints, 45 error codes, 11 calculations, 10 state machines). Density, not
  # volume, carries the difficulty: every calculation reads fields written by
  # another entity's transition, and two four-hop cascades cross four entities
  # each.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the member organization
        constraints: "1..120 chars, required"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code where the club is chartered
        constraints: "exactly 2 uppercase letters"
      - name: minor_athlete_program
        type: boolean
        source: input
        default: true
        description: Whether this club runs programs serving minor athletes; when true the electronic-communication policy and the travel and lodging policy are enforced
      - name: roster_size_attested
        type: integer
        source: input
        description: Roster headcount the club self-attests at charter time; denominator of the SELF_ATTESTED compliance-score variant
        constraints: ">= 0"
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: Unspent screening escrow in cents; debited by screening-order creation, credited back by screening-order void
        default: 0
        constraints: ">= 0 at all times"
      - name: total_funded_cents
        type: integer
        source: computed
        description: Lifetime sum of every escrow funding event including initial_escrow_cents; never decreases
        default: 0
      - name: sanction_status
        type: enum
        source: computed
        description: Sanction standing set by ClubAudit closure
        default: NONE
        constraints: "NONE | PROBATION | SUSPENDED | TERMINATED"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate over all child operations; recomputed by calculations.club_compliance_posture after every mutation that touches this club's findings, sanction_status or member eligibility
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: compliance_score
        type: number
        source: computed
        description: Latest finalized ClubAudit compliance_score for this club, 2 decimal places; null until the first audit is finalized
        default: null
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows with status OPEN across every ClubAudit of this club
        default: 0
      - name: critical_open_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows with status OPEN and severity CRITICAL across every ClubAudit of this club
        default: 0
      - name: restricted_member_count
        type: integer
        source: computed
        description: Count of distinct Member rows holding a CoachAssignment at this club with status IN {ACTIVE, SUSPENDED} whose contact_eligibility IN {RESTRICTED, PROHIBITED}. A PENDING assignment is deliberately excluded - nobody is in front of athletes yet - so a not-yet-eligible member awaiting activation does not restrict the club and the activation attempt reports its own eligibility error instead
        default: 0
      - name: active_assignment_count
        type: integer
        source: computed
        description: Count of CoachAssignment rows at this club with status ACTIVE
        default: 0

  - name: Member
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the chartering club that registered this coach or volunteer
      - name: full_name
        type: string
        source: input
        description: Legal name of the coach or volunteer
        constraints: "1..120 chars, required"
      - name: email
        type: string
        source: input
        description: Contact email; unique within the owning club
        constraints: "must contain '@'; unique per club_id"
      - name: role_type
        type: enum
        source: input
        description: Functional role held at the club, an input to the screening-tier risk score
        constraints: "HEAD_COACH | ASSISTANT_COACH | OFFICIAL | CHAPERONE | VOLUNTEER"
      - name: has_minor_athlete_contact
        type: boolean
        source: input
        description: Whether the role involves direct contact with minor athletes
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of birth; adults only, used for lodging-policy classification
      - name: jurisdiction_codes
        type: array
        source: input
        description: Two-letter state codes the background screen must cover; length drives the jurisdiction surcharge
        constraints: "1..6 entries, each exactly 2 uppercase letters, no duplicates"
      - name: risk_points
        type: integer
        source: computed
        description: Screening risk score from calculations.screening_tier_assignment, 0..100
        default: 0
      - name: required_tier
        type: enum
        source: computed
        description: Screening tier demanded by risk_points, from calculations.screening_tier_assignment
        default: TIER_1
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: screening_status
        type: enum
        source: computed
        description: State dimension 1 of this row, driven by state_machines.Member.screening
        default: UNSCREENED
        constraints: "UNSCREENED | SCREENING_ORDERED | FLAGGED | CLEARED | EXPIRED | DISQUALIFIED"
      - name: screening_expires_at
        type: datetime
        source: computed
        description: adjudicated_at + SCREENING_VALIDITY_DAYS of the latest non-disqualifying ADJUDICATED ScreeningOrder; null when none exists
        default: null
      - name: membership_status
        type: enum
        source: computed
        description: State dimension 2 of this row, driven by state_machines.Member.membership; evolves independently of screening_status
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | LAPSED | REVOKED"
      - name: training_status
        type: enum
        source: computed
        description: Abuse-prevention training currency from calculations.contact_eligibility_derivation
        default: NEVER
        constraints: "NEVER | CURRENT | LAPSED"
      - name: contact_eligibility
        type: enum
        source: computed
        description: Whether this member may have contact with athletes, from calculations.contact_eligibility_derivation
        default: RESTRICTED
        constraints: "ELIGIBLE | RESTRICTED | PROHIBITED"
      - name: eligible_through
        type: datetime
        source: computed
        description: AUDIT_SNAPSHOT projected_eligible_through from calculations.member_eligibility_projection, stamped on every adjudication, training completion and renewal; null when either input is null
        default: null
      - name: records_retained_through
        type: datetime
        source: computed
        description: Records-retention horizon; latest of (eligible_through + RETENTION_YEARS) and (last case closure + RETENTION_YEARS); answers inquiry requests
        default: null
      - name: last_renewed_at
        type: datetime
        source: computed
        description: Clock instant of the most recent successful membership renewal; null before the first renewal
        default: null
      - name: active_assignment_count
        type: integer
        source: computed
        description: Count of CoachAssignment rows for this member with status ACTIVE
        default: 0

  - name: ScreeningOrder
    parent: Member
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; taken from the path, never from the body
      - name: tier
        type: enum
        source: computed
        description: Snapshot of Member.required_tier at order time; fixes the base fee
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: jurisdiction_count
        type: integer
        source: computed
        description: Snapshot of len(Member.jurisdiction_codes) at order time
      - name: expedited
        type: boolean
        source: input
        description: Whether the expedite fee applies
        default: false
      - name: gross_subtotal_cents
        type: integer
        source: computed
        description: Step 3 of calculations.screening_order_charge - tier base plus jurisdiction surcharge, before discount and expedite
      - name: discount_cents
        type: integer
        source: computed
        description: Step 5 of calculations.screening_order_charge - volume discount keyed on gross_subtotal_cents
      - name: expedite_cents
        type: integer
        source: computed
        description: Step 7 of calculations.screening_order_charge - EXPEDITE_PCT applied to the post-discount net subtotal, 0 when expedited is false
      - name: charged_cents
        type: integer
        source: computed
        description: Final amount debited from Club.escrow_balance_cents at order creation
      - name: status
        type: enum
        source: computed
        description: State machine of this order
        default: ORDERED
        constraints: "ORDERED | RESULT_RETURNED | ADJUDICATED | VOIDED"
      - name: vendor_disposition
        type: enum
        source: input
        description: Raw vendor return posted by the ScreeningVendor
        default: null
        constraints: "NO_RECORD | RECORD_FOUND"
      - name: disposition
        type: enum
        source: input
        description: Adjudicated outcome recorded by a SafeSportOfficer
        default: null
        constraints: "CLEAR | NON_DISQUALIFYING_RECORD | DISQUALIFYING_RECORD"
      - name: returned_at
        type: datetime
        source: computed
        description: Logical-clock instant when the vendor result was posted
        default: null
      - name: adjudicated_at
        type: datetime
        source: computed
        description: Logical-clock instant of adjudication; base of screening validity
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: adjudicated_at + SCREENING_VALIDITY_DAYS; null unless disposition IN {CLEAR, NON_DISQUALIFYING_RECORD}
        default: null
      - name: void_reason
        type: string
        source: input
        description: Free-text reason recorded when an order is voided
        default: null

  - name: TrainingCourse
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: code
        type: string
        source: input
        description: Natural key of the course; TrainingAssignment.course_code must equal one of these
        constraints: "3..20 chars, uppercase letters, digits and hyphens, globally unique"
      - name: title
        type: string
        source: input
        description: Human-readable course title
      - name: validity_days
        type: integer
        source: input
        description: Days a completion of this course stays current
        constraints: "1..3650"
      - name: delivery_mode
        type: enum
        source: input
        description: How the course is delivered
        constraints: "ONLINE | IN_PERSON"
      - name: required_for_tiers
        type: array
        source: input
        description: Screening tiers for which this course is mandatory before athlete contact
        constraints: "non-empty subset of {TIER_1, TIER_2, TIER_3}, no duplicates"
      - name: pass_score
        type: integer
        source: input
        description: Minimum score accepted at completion
        default: 80
        constraints: "0..100"

  - name: TrainingAssignment
    parent: Member
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member who must complete the course
      - name: course_code
        type: string
        source: input
        description: Natural-key reference to TrainingCourse.code; MUST equal the code of an existing TrainingCourse
      - name: status
        type: enum
        source: computed
        description: State machine of this assignment
        default: ASSIGNED
        constraints: "ASSIGNED | IN_PROGRESS | COMPLETED | EXPIRED"
      - name: assigned_at
        type: datetime
        source: computed
        description: Logical-clock instant of assignment creation
      - name: due_at
        type: datetime
        source: input
        description: Contractual completion deadline; also the projected completion instant used by the RENEWAL_FORWARD variant
      - name: started_at
        type: datetime
        source: computed
        description: Logical-clock instant the member started the course
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: Logical-clock instant of completion; base of training validity
        default: null
      - name: score
        type: integer
        source: input
        description: Score achieved at completion
        default: null
        constraints: "0..100"
      - name: expires_at
        type: datetime
        source: computed
        description: completed_at + TrainingCourse.validity_days for the referenced course; null until COMPLETED
        default: null

  - name: CoachAssignment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the coach or volunteer being placed on a team
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club whose team the member is placed on, which may differ from Member.club_id
      - name: team_name
        type: string
        source: input
        description: Team the member is assigned to
      - name: season_start
        type: datetime
        source: input
        description: Inclusive start of the coaching season interval
      - name: season_end
        type: datetime
        source: input
        description: Exclusive end of the coaching season interval
        constraints: "must be strictly after season_start"
      - name: status
        type: enum
        source: computed
        description: State machine of this assignment
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | EXPIRED | TERMINATED"
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant of activation
        default: null
      - name: eligibility_snapshot_version
        type: integer
        source: computed
        description: Member.version pinned at activation, proving which eligibility view was approved
        default: null
      - name: electronic_comm_authorized
        type: boolean
        source: computed
        description: Whether electronic communication with minor athletes is authorized for this assignment
        default: false
      - name: electronic_comm_channel_kind
        type: enum
        source: input
        description: Authorized electronic channel
        default: null
        constraints: "TEAM_PLATFORM | GROUP_EMAIL | GROUP_SMS | PRIVATE_DIRECT_MESSAGE"
      - name: parent_copy_required
        type: boolean
        source: input
        description: Whether a parent or guardian must be copied on every electronic message
        default: null
      - name: suspended_reason
        type: string
        source: computed
        description: Reason stamped when a cascade suspends or terminates this assignment
        default: null

  - name: InvestigatingBody
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Name of the independent investigating body
      - name: scope_categories
        type: array
        source: input
        description: Allegation categories this body accepts
        constraints: "non-empty subset of {SEXUAL_MISCONDUCT, PHYSICAL_ABUSE, EMOTIONAL_MISCONDUCT, POLICY_VIOLATION, FAILURE_TO_REPORT}, no duplicates"
      - name: intake_status
        type: enum
        source: input
        description: Whether the body currently accepts routed cases
        default: ACCEPTING
        constraints: "ACCEPTING | PAUSED"
      - name: max_open_cases
        type: integer
        source: input
        description: Hard ceiling on concurrently routed cases
        constraints: ">= 1"
      - name: open_case_count
        type: integer
        source: computed
        description: Count of Case rows with status ROUTED referencing this body
        default: 0

  - name: Case
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club at which the incident is alleged to have occurred
      - name: reported_member_id
        type: string
        source: input
        description: FK -> Member.id; the coach or volunteer named in the report
      - name: investigating_body_id
        type: string
        source: computed
        description: FK -> InvestigatingBody.id; set by routing, null while in INTAKE_REVIEW
        default: null
      - name: allegation_category
        type: enum
        source: input
        description: Category of the allegation, matched against the body's scope_categories
        constraints: "SEXUAL_MISCONDUCT | PHYSICAL_ABUSE | EMOTIONAL_MISCONDUCT | POLICY_VIOLATION | FAILURE_TO_REPORT"
      - name: reporter_kind
        type: enum
        source: input
        description: Who filed the report, which determines the mandatory reporting window
        constraints: "MANDATORY_REPORTER | PARENT | ATHLETE | ANONYMOUS"
      - name: reporter_user_id
        type: string
        source: system
        description: X-User-ID of the caller who filed the report; retained for the reporting-obligation audit trail
      - name: narrative
        type: string
        source: input
        description: Narrative of the allegation
        constraints: "20..4000 chars"
      - name: occurred_at
        type: datetime
        source: input
        description: Instant the alleged conduct occurred; base of the mandatory reporting window
      - name: intake_received_at
        type: datetime
        source: computed
        description: Logical-clock instant the report was received
      - name: report_timeliness
        type: enum
        source: computed
        description: TIMELY when intake_received_at - occurred_at <= MANDATORY_REPORT_WINDOW_HOURS, else LATE; LATE reports on MANDATORY_REPORTER filings raise a FAILURE_TO_REPORT audit exposure
        constraints: "TIMELY | LATE"
      - name: status
        type: enum
        source: computed
        description: State machine of this case
        default: INTAKE_REVIEW
        constraints: "INTAKE_REVIEW | ROUTED | CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED | CLOSED_ADMINISTRATIVE"
      - name: routed_at
        type: datetime
        source: computed
        description: Logical-clock instant of routing to the investigating body
        default: null
      - name: closure_reason
        type: enum
        source: input
        description: Reason recorded at closure
        default: null
        constraints: "NO_JURISDICTION | DUPLICATE_REPORT | INVESTIGATION_COMPLETE"
      - name: outcome
        type: enum
        source: input
        description: Finding of the investigating body; required when closing from ROUTED, forbidden when closing from INTAKE_REVIEW
        default: null
        constraints: "SUBSTANTIATED | UNSUBSTANTIATED"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant of closure
        default: null

  - name: InterimMeasure
    parent: Case
    common_fields: true
    kind: resource
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> Case.id; taken from the path
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the individual placed under measure, which must equal Case.reported_member_id
      - name: measure_kind
        type: enum
        source: input
        description: Kind of restriction imposed
        constraints: "NO_CONTACT_DIRECTIVE | TEMPORARY_SUSPENSION | SUPERVISED_CONTACT_ONLY"
      - name: permanence
        type: enum
        source: computed
        description: TEMPORARY at creation; flips to PERMANENT on conversion or on substantiated case closure
        default: TEMPORARY
        constraints: "TEMPORARY | PERMANENT"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the restriction interval
      - name: effective_to
        type: datetime
        source: input
        description: Inclusive end of the restriction interval; null means open-ended
        default: null
        constraints: "when present, must be >= effective_from"
      - name: status
        type: enum
        source: computed
        description: State machine of this measure
        default: ACTIVE
        constraints: "ACTIVE | LIFTED | PERMANENT"
      - name: imposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafeSportOfficer who imposed the measure; the segregation-of-duties comparator on conversion
      - name: converted_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafeSportOfficer who converted the measure to PERMANENT
        default: null
      - name: lifted_at
        type: datetime
        source: computed
        description: Logical-clock instant the measure was lifted
        default: null
      - name: lift_reason
        type: string
        source: input
        description: Reason recorded when a measure is lifted
        default: null
      - name: rationale
        type: string
        source: input
        description: Rationale recorded when a measure is converted to PERMANENT
        default: null

  - name: ClubAudit
    parent: Club
    common_fields: true
    kind: resource
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the audited member organization
      - name: audit_period_start
        type: datetime
        source: input
        description: Inclusive start of the audited period
      - name: audit_period_end
        type: datetime
        source: input
        description: Exclusive end of the audited period
        constraints: "must be strictly after audit_period_start"
      - name: score_variant
        type: enum
        source: input
        description: Which denominator calculations.club_compliance_score uses
        constraints: "SELF_ATTESTED | REGISTRY_VERIFIED"
      - name: sampled_member_ids
        type: array
        source: input
        description: Member ids drawn into the audit sample; every entry must be a Member of club_id; MAY be empty
        constraints: "0..50 entries, no duplicates"
      - name: sampled_member_count
        type: integer
        source: computed
        description: len(sampled_member_ids)
      - name: compliant_member_count
        type: integer
        source: computed
        description: Numerator of calculations.club_compliance_score, evaluated at finalize time
        default: null
      - name: denominator_count
        type: integer
        source: computed
        description: Denominator selected by score_variant, evaluated at finalize time
        default: null
      - name: compliance_score
        type: number
        source: computed
        description: Output of calculations.club_compliance_score, 2 decimal places; null until FINDINGS_ISSUED
        default: null
      - name: finding_total_count
        type: integer
        source: computed
        description: Count of AuditFinding rows on this audit, in any status
        default: 0
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows on this audit with status OPEN
        default: 0
      - name: remediated_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows on this audit with status REMEDIATED
        default: 0
      - name: waived_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows on this audit with status WAIVED
        default: 0
      - name: sanction_fine_cents
        type: integer
        source: computed
        description: Output of calculations.audit_sanction_fine, stamped only on the CLOSED_SANCTIONED branch
        default: null
      - name: status
        type: enum
        source: computed
        description: State machine of this audit
        default: SAMPLED
        constraints: "SAMPLED | FINDINGS_ISSUED | CLOSED_COMPLIANT | CLOSED_SANCTIONED"
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant of finalization
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant of closure
        default: null
      - name: resolution
        type: enum
        source: input
        description: Closure decision supplied by the auditor
        default: null
        constraints: "CLOSE_COMPLIANT | SANCTION"

  - name: AuditFinding
    parent: ClubAudit
    common_fields: true
    kind: resource
    fields:
      - name: audit_id
        type: string
        source: system
        description: FK -> ClubAudit.id; taken from the path
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member the finding is written against, null for organization-level findings
        default: null
      - name: finding_code
        type: enum
        source: input
        description: Catalogued compliance defect
        constraints: "SCREENING_LAPSED | TRAINING_LAPSED | UNSCREENED_CONTACT | LODGING_POLICY_BREACH | ELECTRONIC_COMM_BREACH | FAILURE_TO_REPORT | RECORDS_INCOMPLETE"
      - name: severity
        type: enum
        source: input
        description: Severity band feeding the per-finding fine multiplier
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: is_repeat
        type: boolean
        source: input
        description: Whether the same finding_code was already sanctioned in a prior audit of this club
        default: false
      - name: status
        type: enum
        source: computed
        description: State machine of this finding
        default: OPEN
        constraints: "OPEN | REMEDIATED | WAIVED"
      - name: fine_cents
        type: integer
        source: computed
        description: Per-finding fine from calculations.audit_sanction_fine, rounded to whole cents before summation; null until the audit is closed with SANCTION
        default: null
      - name: evidence_note
        type: string
        source: input
        description: Remediation evidence recorded by the ClubAdministrator
        default: null
      - name: decision_note
        type: string
        source: input
        description: Note recorded by the ComplianceAuditor on rejection or waiver
        default: null

  - name: RoomStay
    parent: Club
    common_fields: true
    kind: resource
    fields:
      - name: club_id
        type: string
        source: system
        description: FK -> Club.id; taken from the path; the travelling organization
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the adult occupant; MUST be null when occupant_kind is MINOR_ATHLETE and MUST be set when occupant_kind is ADULT_MEMBER
        default: null
      - name: occupant_kind
        type: enum
        source: input
        description: Whether this bed is occupied by an adult member or a minor athlete
        constraints: "ADULT_MEMBER | MINOR_ATHLETE"
      - name: minor_athlete_age
        type: integer
        source: input
        description: Age of the minor athlete; MUST be set when occupant_kind is MINOR_ATHLETE and MUST be null otherwise
        default: null
        constraints: "5..17"
      - name: trip_label
        type: string
        source: input
        description: Trip identifier; part of the room-slot key (club_id, trip_label, room_number)
        constraints: "1..60 chars"
      - name: room_number
        type: string
        source: input
        description: Room identifier at the lodging property; part of the room-slot key
        constraints: "1..12 chars"
      - name: check_in
        type: datetime
        source: input
        description: Inclusive start of the occupancy interval
      - name: check_out
        type: datetime
        source: input
        description: Exclusive end of the occupancy interval
        constraints: "must be strictly after check_in"
      - name: status
        type: enum
        source: computed
        description: State machine of this stay
        default: BOOKED
        constraints: "BOOKED | CANCELLED"
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded on cancellation
        default: null

# =============================================================================
# 1.2 State Machine Table
#
# Member carries TWO independent state dimensions on the same row:
#   dimension `screening`  -> Member.screening_status
#   dimension `membership` -> Member.membership_status
# They advance on different triggers and neither is a function of the other,
# which is what makes the pair a parallel-dimension machine rather than one
# long pipeline. Grounds references use the form
# state_machines.Member.<dimension>.<FROM>_to_<TO>.
# =============================================================================
state_machines:
  - entity: Member
    dimension: screening
    state_field: screening_status
    initial_state: UNSCREENED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNSCREENED
        to: SCREENING_ORDERED
        trigger: "POST /safesport/members/{member_id}/screening-orders"
        actor: ClubAdministrator
        preconditions:
          - "Club.compliance_posture != FROZEN for Member.club_id"
          - "Member.screening_status IN {UNSCREENED, CLEARED, EXPIRED}"
          - "Member.screening_status != DISQUALIFIED"
          - "no ScreeningOrder for this member with status IN {ORDERED, RESULT_RETURNED}"
          - "payload.expected_club_version == Club.version"
          - "Club.escrow_balance_cents >= calculations.screening_order_charge.charged_cents"
        side_effects:
          - "creates ScreeningOrder with status ORDERED, tier = Member.required_tier, jurisdiction_count = len(Member.jurisdiction_codes)"
          - "runs calculations.screening_order_charge and stamps gross_subtotal_cents, discount_cents, expedite_cents, charged_cents"
          - "debits Club.escrow_balance_cents by ScreeningOrder.charged_cents"
          - "increments Club.version by 1"
          - "recomputes Member.contact_eligibility via calculations.contact_eligibility_derivation (SCREENING_ORDERED is never ELIGIBLE)"
          - "increments Member.version by 1"
          - "recomputes Club.compliance_posture via calculations.club_compliance_posture for every club where this member holds a CoachAssignment with status IN {PENDING, ACTIVE, SUSPENDED}"
      - from: CLEARED
        to: SCREENING_ORDERED
        trigger: "POST /safesport/members/{member_id}/screening-orders"
        actor: ClubAdministrator
        preconditions:
          - "same preconditions as UNSCREENED_to_SCREENING_ORDERED"
        side_effects:
          - "same side effects as UNSCREENED_to_SCREENING_ORDERED"
          - "Member.screening_expires_at is retained until the new order is adjudicated, so contact_eligibility stays RESTRICTED only because screening_status left CLEARED"
        note: "Re-screen before expiry; together with EXPIRED_to_SCREENING_ORDERED this closes the CLEARED -> SCREENING_ORDERED -> CLEARED cycle."
      - from: EXPIRED
        to: SCREENING_ORDERED
        trigger: "POST /safesport/members/{member_id}/screening-orders"
        actor: ClubAdministrator
        preconditions:
          - "same preconditions as UNSCREENED_to_SCREENING_ORDERED"
        side_effects:
          - "same side effects as UNSCREENED_to_SCREENING_ORDERED"
      - from: SCREENING_ORDERED
        to: FLAGGED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/result with vendor_disposition = RECORD_FOUND"
        actor: ScreeningVendor
        preconditions:
          - "ScreeningOrder.status == ORDERED"
        side_effects:
          - "sets ScreeningOrder.status = RESULT_RETURNED, vendor_disposition = RECORD_FOUND, returned_at = clock"
          - "sets Member.screening_status = FLAGGED"
          - "recomputes Member.contact_eligibility (FLAGGED is at best RESTRICTED)"
          - "increments Member.version by 1"
      - from: SCREENING_ORDERED
        to: CLEARED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate with disposition IN {CLEAR, NON_DISQUALIFYING_RECORD}"
        actor: SafeSportOfficer
        preconditions:
          - "ScreeningOrder.status == RESULT_RETURNED"
          - "ScreeningOrder.vendor_disposition == NO_RECORD when disposition == CLEAR"
        side_effects:
          - "sets ScreeningOrder.status = ADJUDICATED, adjudicated_at = clock, expires_at = adjudicated_at + SCREENING_VALIDITY_DAYS"
          - "sets Member.screening_status = CLEARED and Member.screening_expires_at = ScreeningOrder.expires_at"
          - "when disposition == NON_DISQUALIFYING_RECORD, re-runs calculations.screening_tier_assignment so Member.risk_points and Member.required_tier are uplifted by the new history point"
          - "runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and stamps Member.eligible_through"
          - "recomputes Member.records_retained_through"
          - "recomputes Member.contact_eligibility"
          - "bubbles up: when Member.membership_status == PENDING and contact_eligibility == ELIGIBLE, membership dimension auto-advances PENDING -> ACTIVE"
          - "increments Member.version by 1"
          - "recomputes Club.compliance_posture for every club where this member holds a CoachAssignment with status IN {PENDING, ACTIVE, SUSPENDED} and for Member.club_id"
        note: "vendor_disposition NO_RECORD reaches CLEARED through this transition without ever visiting FLAGGED."
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate with disposition = NON_DISQUALIFYING_RECORD"
        actor: SafeSportOfficer
        preconditions:
          - "ScreeningOrder.status == RESULT_RETURNED"
          - "ScreeningOrder.vendor_disposition == RECORD_FOUND"
        side_effects:
          - "same side effects as SCREENING_ORDERED_to_CLEARED"
      - from: FLAGGED
        to: DISQUALIFIED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate with disposition = DISQUALIFYING_RECORD"
        actor: SafeSportOfficer
        preconditions:
          - "ScreeningOrder.status == RESULT_RETURNED"
          - "ScreeningOrder.vendor_disposition == RECORD_FOUND"
        side_effects:
          - "sets ScreeningOrder.status = ADJUDICATED, adjudicated_at = clock, expires_at = null"
          - "sets Member.screening_status = DISQUALIFIED and Member.screening_expires_at = null"
          - "sets Member.contact_eligibility = PROHIBITED"
          - "membership dimension transitions to REVOKED (see state_machines.Member.membership)"
          - "cascade hop 3: every CoachAssignment of this member with status IN {PENDING, ACTIVE, SUSPENDED} moves to TERMINATED with suspended_reason = 'SCREENING_DISQUALIFICATION'"
          - "cascade hop 4: for each club that lost an ACTIVE assignment, Club.active_assignment_count is decremented, Club.restricted_member_count is recomputed and Club.compliance_posture is recomputed"
          - "increments Member.version by 1"
      - from: SCREENING_ORDERED
        to: UNSCREENED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/void"
        actor: NgbAdmin
        preconditions:
          - "ScreeningOrder.status IN {ORDERED, RESULT_RETURNED}"
          - "Member has no other ScreeningOrder with status ADJUDICATED and disposition IN {CLEAR, NON_DISQUALIFYING_RECORD}"
        side_effects:
          - "sets ScreeningOrder.status = VOIDED and void_reason = payload.reason"
          - "credits Club.escrow_balance_cents by ScreeningOrder.charged_cents, restoring calculations.escrow_conservation_invariant"
          - "increments Club.version by 1"
          - "recomputes Member.contact_eligibility and increments Member.version by 1"
        note: "Compensating action for UNSCREENED_to_SCREENING_ORDERED."
      - from: FLAGGED
        to: UNSCREENED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/void"
        actor: NgbAdmin
        preconditions:
          - "same preconditions as SCREENING_ORDERED_to_UNSCREENED"
        side_effects:
          - "same side effects as SCREENING_ORDERED_to_UNSCREENED"
      - from: CLEARED
        to: EXPIRED
        trigger: "system: lazily evaluated on every read or mutation touching this member once clock >= Member.screening_expires_at"
        actor: system
        preconditions:
          - "Member.screening_status == CLEARED"
          - "Member.screening_expires_at != null AND clock >= Member.screening_expires_at"
        side_effects:
          - "sets Member.screening_status = EXPIRED"
          - "recomputes Member.contact_eligibility to at best RESTRICTED"
          - "does NOT terminate CoachAssignments; activation of new assignments is blocked by validations[priority=17]"
        note: "Boundary is >= : at exactly screening_expires_at the screen is already EXPIRED."

  - entity: Member
    dimension: membership
    state_field: membership_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system bubble-up on POST /safesport/screening-orders/{screening_order_id}/adjudicate or POST /safesport/training-assignments/{training_assignment_id}/complete"
        actor: system
        preconditions:
          - "Member.membership_status == PENDING"
          - "Member.screening_status == CLEARED"
          - "Member.training_status == CURRENT"
          - "no InterimMeasure for this member with status IN {ACTIVE, PERMANENT}"
        side_effects:
          - "sets Member.membership_status = ACTIVE"
          - "stamps Member.eligible_through from calculations.member_eligibility_projection variant AUDIT_SNAPSHOT"
      - from: ACTIVE
        to: LAPSED
        trigger: "system: lazily evaluated on every read or mutation touching this member once clock >= Member.eligible_through"
        actor: system
        preconditions:
          - "Member.membership_status == ACTIVE"
          - "Member.eligible_through != null AND clock >= Member.eligible_through"
        side_effects:
          - "sets Member.membership_status = LAPSED"
          - "recomputes Member.contact_eligibility (training or screening currency has run out, so at best RESTRICTED)"
        note: "Boundary is >= : at exactly eligible_through the membership is already LAPSED."
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /safesport/members/{member_id}/renew"
        actor: ClubAdministrator
        preconditions:
          - "Member.membership_status IN {ACTIVE, LAPSED}"
          - "Club.compliance_posture == OPEN for Member.club_id"
          - "Member.screening_status == CLEARED (validations[priority=17])"
          - "Member.training_status == CURRENT (validations[priority=18])"
          - "clock >= Member.eligible_through - RENEWAL_WINDOW_DAYS (validations[priority=20])"
          - "payload.attestation_signed == true"
        side_effects:
          - "sets Member.membership_status = ACTIVE and Member.last_renewed_at = clock"
          - "re-runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and re-stamps Member.eligible_through"
          - "recomputes Member.records_retained_through"
          - "recomputes Member.contact_eligibility"
          - "increments Member.version by 1"
        note: "Closes the ACTIVE -> LAPSED -> ACTIVE renewal cycle."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /safesport/members/{member_id}/renew (early renewal, inside the window)"
        actor: ClubAdministrator
        preconditions:
          - "Member.membership_status == ACTIVE"
          - "Club.compliance_posture == OPEN for Member.club_id"
          - "Member.screening_status == CLEARED (validations[priority=17])"
          - "Member.training_status == CURRENT (validations[priority=18])"
          - "clock >= Member.eligible_through - RENEWAL_WINDOW_DAYS (validations[priority=20])"
          - "payload.attestation_signed == true"
        side_effects:
          - "sets Member.last_renewed_at = clock and leaves membership_status ACTIVE"
          - "re-runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and re-stamps Member.eligible_through"
          - "recomputes Member.records_retained_through"
          - "increments Member.version by 1"
        note: |
          The self-loop is what makes validations[priority=20] observable: a club may
          renew a still-ACTIVE member once the clock reaches eligible_through minus
          RENEWAL_WINDOW_DAYS, and a renewal attempted earlier than that reports
          ERR_RENEWAL_WINDOW_NOT_OPEN rather than ERR_MEMBER_INVALID_STATE. Renewal
          from PENDING, SUSPENDED or REVOKED has no transition at all and reports
          ERR_MEMBER_INVALID_STATE at validations[priority=11].
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade hop 2 of POST /safesport/cases/{case_id}/interim-measures with measure_kind = TEMPORARY_SUSPENSION"
        actor: system
        preconditions:
          - "an InterimMeasure with status ACTIVE, permanence TEMPORARY and measure_kind TEMPORARY_SUSPENSION now exists for this member"
        side_effects:
          - "sets Member.membership_status = SUSPENDED"
          - "sets Member.contact_eligibility = RESTRICTED"
          - "cascade hop 3: every CoachAssignment of this member with status ACTIVE moves to SUSPENDED with suspended_reason = 'INTERIM_MEASURE'"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade of POST /safesport/interim-measures/{interim_measure_id}/lift"
        actor: system
        preconditions:
          - "no remaining InterimMeasure for this member with status IN {ACTIVE, PERMANENT}"
          - "Member.screening_status == CLEARED AND Member.training_status == CURRENT"
        side_effects:
          - "sets Member.membership_status = ACTIVE"
          - "sets Member.contact_eligibility = ELIGIBLE"
          - "every CoachAssignment of this member with status SUSPENDED and suspended_reason 'INTERIM_MEASURE' returns to ACTIVE"
          - "Club.restricted_member_count and Club.compliance_posture recomputed for each affected club"
        note: "Compensating counterpart of ACTIVE_to_SUSPENDED; leaves no drift in Club.active_assignment_count."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate with disposition = DISQUALIFYING_RECORD, or POST /safesport/interim-measures/{interim_measure_id}/convert-permanent, or cascade hop 3 of POST /safesport/cases/{case_id}/close with outcome = SUBSTANTIATED"
        actor: system
        preconditions:
          - "Member.screening_status == DISQUALIFIED OR an InterimMeasure for this member has status PERMANENT"
        side_effects:
          - "sets Member.membership_status = REVOKED and Member.contact_eligibility = PROHIBITED"
          - "every CoachAssignment of this member with status IN {PENDING, ACTIVE, SUSPENDED} moves to TERMINATED"
          - "Club.active_assignment_count, Club.restricted_member_count and Club.compliance_posture recomputed for each affected club"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent or cascade hop 3 of POST /safesport/cases/{case_id}/close with outcome = SUBSTANTIATED"
        actor: system
        preconditions:
          - "an InterimMeasure for this member has status PERMANENT"
        side_effects:
          - "same side effects as ACTIVE_to_REVOKED"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate with disposition = DISQUALIFYING_RECORD"
        actor: system
        preconditions:
          - "Member.screening_status == DISQUALIFIED"
        side_effects:
          - "same side effects as ACTIVE_to_REVOKED"

  - entity: ScreeningOrder
    initial_state: ORDERED
    terminal_states: [ADJUDICATED, VOIDED]
    transitions:
      - from: ORDERED
        to: RESULT_RETURNED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/result"
        actor: ScreeningVendor
        preconditions:
          - "ScreeningOrder.status == ORDERED"
        side_effects:
          - "stamps vendor_disposition and returned_at = clock"
          - "when vendor_disposition == RECORD_FOUND, Member.screening_status moves SCREENING_ORDERED -> FLAGGED"
          - "when vendor_disposition == NO_RECORD, Member.screening_status stays SCREENING_ORDERED"
          - "increments Member.version by 1"
      - from: RESULT_RETURNED
        to: ADJUDICATED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/adjudicate"
        actor: SafeSportOfficer
        preconditions:
          - "ScreeningOrder.status == RESULT_RETURNED"
          - "disposition == CLEAR is only permitted when vendor_disposition == NO_RECORD"
        side_effects:
          - "stamps disposition, adjudicated_at = clock and expires_at"
          - "drives the Member screening dimension to CLEARED or DISQUALIFIED"
      - from: ORDERED
        to: VOIDED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/void"
        actor: NgbAdmin
        preconditions:
          - "ScreeningOrder.status IN {ORDERED, RESULT_RETURNED}"
        side_effects:
          - "credits Club.escrow_balance_cents by charged_cents and increments Club.version by 1"
          - "reverts Member.screening_status to UNSCREENED"
      - from: RESULT_RETURNED
        to: VOIDED
        trigger: "POST /safesport/screening-orders/{screening_order_id}/void"
        actor: NgbAdmin
        preconditions:
          - "ScreeningOrder.status IN {ORDERED, RESULT_RETURNED}"
        side_effects:
          - "same side effects as ORDERED_to_VOIDED"

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /safesport/training-assignments/{training_assignment_id}/start"
        actor: Member
        preconditions:
          - "TrainingAssignment.status == ASSIGNED"
          - "X-User-Role Member implies X-User-ID == TrainingAssignment.member_id"
        side_effects:
          - "stamps started_at = clock"
          - "makes this assignment visible to the RENEWAL_FORWARD variant of calculations.member_eligibility_projection, whose projected completion instant is due_at"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /safesport/training-assignments/{training_assignment_id}/complete"
        actor: Member
        preconditions:
          - "TrainingAssignment.status == IN_PROGRESS"
          - "payload.score >= TrainingCourse.pass_score for the referenced course_code"
        side_effects:
          - "stamps completed_at = clock, score and expires_at = completed_at + TrainingCourse.validity_days"
          - "recomputes Member.training_status via calculations.contact_eligibility_derivation"
          - "re-runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and stamps Member.eligible_through"
          - "recomputes Member.contact_eligibility and Member.records_retained_through"
          - "bubbles up: PENDING -> ACTIVE on the membership dimension when screening is CLEARED"
          - "increments Member.version by 1"
          - "recomputes Club.restricted_member_count and Club.compliance_posture for Member.club_id and every club where this member holds a CoachAssignment with status IN {PENDING, ACTIVE, SUSPENDED}"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system: lazily evaluated once clock >= TrainingAssignment.due_at while status == ASSIGNED"
        actor: system
        preconditions:
          - "TrainingAssignment.status == ASSIGNED AND clock >= due_at"
        side_effects:
          - "sets status = EXPIRED"
          - "the assignment is excluded from both variants of calculations.member_eligibility_projection"
        note: "An IN_PROGRESS assignment is NOT expired by the clock; only ASSIGNED ones are."

  - entity: CoachAssignment
    initial_state: PENDING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /safesport/coach-assignments/{coach_assignment_id}/activate"
        actor: ClubAdministrator
        preconditions:
          - "CoachAssignment.status == PENDING"
          - "payload.expected_member_version == Member.version"
          - "Club.compliance_posture == OPEN for CoachAssignment.club_id"
          - "Member.screening_status == CLEARED"
          - "Member.training_status == CURRENT"
          - "Member.contact_eligibility == ELIGIBLE"
        side_effects:
          - "sets status = ACTIVE, activated_at = clock and eligibility_snapshot_version = Member.version (version-pinning on approval)"
          - "increments Club.active_assignment_count for CoachAssignment.club_id"
          - "increments Member.active_assignment_count and Member.version by 1"
          - "recomputes Club.compliance_posture for CoachAssignment.club_id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade hop 3 of POST /safesport/cases/{case_id}/interim-measures"
        actor: system
        preconditions:
          - "the assignment's member reached membership_status SUSPENDED or contact_eligibility left ELIGIBLE"
        side_effects:
          - "sets status = SUSPENDED and suspended_reason = 'INTERIM_MEASURE'"
          - "decrements Club.active_assignment_count and Member.active_assignment_count"
          - "cascade hop 4: increments Club.restricted_member_count and recomputes Club.compliance_posture for CoachAssignment.club_id"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade of POST /safesport/interim-measures/{interim_measure_id}/lift"
        actor: system
        preconditions:
          - "suspended_reason == 'INTERIM_MEASURE'"
          - "the member has no remaining InterimMeasure with status IN {ACTIVE, PERMANENT}"
          - "Member.screening_status == CLEARED AND Member.training_status == CURRENT"
        side_effects:
          - "sets status = ACTIVE and suspended_reason = null"
          - "increments Club.active_assignment_count and Member.active_assignment_count back"
          - "recomputes Club.restricted_member_count and Club.compliance_posture"
      - from: PENDING
        to: TERMINATED
        trigger: "cascade of Member membership dimension reaching REVOKED, or of POST /safesport/club-audits/{club_audit_id}/close with resolution = SANCTION"
        actor: system
        preconditions:
          - "Member.membership_status == REVOKED OR Club.sanction_status == SUSPENDED"
        side_effects:
          - "sets status = TERMINATED and suspended_reason"
          - "recomputes Club.restricted_member_count and Club.compliance_posture"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade of Member membership dimension reaching REVOKED, or of POST /safesport/club-audits/{club_audit_id}/close with resolution = SANCTION"
        actor: system
        preconditions:
          - "Member.membership_status == REVOKED OR Club.sanction_status == SUSPENDED"
        side_effects:
          - "sets status = TERMINATED and suspended_reason"
          - "decrements Club.active_assignment_count and Member.active_assignment_count"
          - "recomputes Club.restricted_member_count and Club.compliance_posture"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent cascade, or cascade hop 3 of POST /safesport/cases/{case_id}/close with outcome = SUBSTANTIATED"
        actor: system
        preconditions:
          - "an InterimMeasure for this member has status PERMANENT"
        side_effects:
          - "sets status = TERMINATED and suspended_reason = 'PERMANENT_MEASURE'"
          - "recomputes Club.restricted_member_count and Club.compliance_posture"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazily evaluated once clock >= CoachAssignment.season_end"
        actor: system
        preconditions:
          - "CoachAssignment.status == ACTIVE AND clock >= season_end"
        side_effects:
          - "sets status = EXPIRED"
          - "decrements Club.active_assignment_count and Member.active_assignment_count"
          - "recomputes Club.compliance_posture"
        note: "season_end is exclusive: at exactly season_end the assignment is already EXPIRED."

  - entity: Case
    initial_state: INTAKE_REVIEW
    terminal_states: [CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED, CLOSED_ADMINISTRATIVE]
    transitions:
      - from: INTAKE_REVIEW
        to: ROUTED
        trigger: "POST /safesport/cases/{case_id}/route"
        actor: SafeSportOfficer
        preconditions:
          - "Case.status == INTAKE_REVIEW"
          - "Case.allegation_category IN InvestigatingBody.scope_categories (validations[priority=21])"
          - "InvestigatingBody.intake_status == ACCEPTING (validations[priority=22])"
          - "InvestigatingBody.open_case_count < InvestigatingBody.max_open_cases (validations[priority=23])"
        side_effects:
          - "sets Case.status = ROUTED, investigating_body_id and routed_at = clock"
          - "increments InvestigatingBody.open_case_count by 1 and InvestigatingBody.version by 1"
        note: "Branch 1 of the INTAKE_REVIEW fork."
      - from: INTAKE_REVIEW
        to: CLOSED_ADMINISTRATIVE
        trigger: "POST /safesport/cases/{case_id}/close with closure_reason IN {NO_JURISDICTION, DUPLICATE_REPORT} and outcome omitted"
        actor: SafeSportOfficer
        preconditions:
          - "Case.status == INTAKE_REVIEW"
          - "payload.outcome is absent"
        side_effects:
          - "sets Case.status = CLOSED_ADMINISTRATIVE, closure_reason and closed_at = clock"
          - "does NOT touch InvestigatingBody.open_case_count (the case was never routed)"
          - "does NOT touch any InterimMeasure: measures imposed during intake survive administrative closure"
        note: "Branch 2 of the INTAKE_REVIEW fork; side-effect set is disjoint from branch 1."
      - from: ROUTED
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /safesport/cases/{case_id}/close with closure_reason = INVESTIGATION_COMPLETE and outcome = SUBSTANTIATED"
        actor: SafeSportOfficer
        preconditions:
          - "Case.status == ROUTED"
          - "payload.outcome == SUBSTANTIATED"
        side_effects:
          - "cascade hop 1: sets Case.status = CLOSED_SUBSTANTIATED, closed_at = clock and decrements InvestigatingBody.open_case_count by 1"
          - "cascade hop 2: because the case closed SUBSTANTIATED, every InterimMeasure on Case.reported_member_id with status ACTIVE flips to status PERMANENT and permanence PERMANENT"
          - "cascade hop 3: because a PERMANENT measure now exists, Member.contact_eligibility becomes PROHIBITED and the membership dimension moves to REVOKED"
          - "cascade hop 4: because the member is REVOKED, every CoachAssignment of that member with status IN {PENDING, ACTIVE, SUSPENDED} moves to TERMINATED, and each affected Club has active_assignment_count, restricted_member_count and compliance_posture recomputed"
          - "recomputes Member.records_retained_through from the closure instant"
          - "increments Member.version by 1"
        note: "Branch A of the ROUTED fork."
      - from: ROUTED
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /safesport/cases/{case_id}/close with closure_reason = INVESTIGATION_COMPLETE and outcome = UNSUBSTANTIATED"
        actor: SafeSportOfficer
        preconditions:
          - "Case.status == ROUTED"
          - "payload.outcome == UNSUBSTANTIATED"
        side_effects:
          - "sets Case.status = CLOSED_UNSUBSTANTIATED, closed_at = clock and decrements InvestigatingBody.open_case_count by 1"
          - "every InterimMeasure on Case.reported_member_id with status ACTIVE moves to LIFTED with lifted_at = clock and lift_reason = 'CASE_UNSUBSTANTIATED'"
          - "Member.contact_eligibility is recomputed; when no measure remains and screening/training are current the membership dimension returns SUSPENDED -> ACTIVE"
          - "every CoachAssignment of that member with status SUSPENDED and suspended_reason 'INTERIM_MEASURE' returns to ACTIVE, restoring Club.active_assignment_count"
          - "recomputes Club.restricted_member_count and Club.compliance_posture for each affected club"
          - "increments Member.version by 1"
        note: "Branch B of the ROUTED fork; the side-effect set is the mirror image of branch A - LIFTED versus PERMANENT, reactivation versus termination."

  - entity: InterimMeasure
    initial_state: ACTIVE
    terminal_states: [LIFTED, PERMANENT]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /safesport/interim-measures/{interim_measure_id}/lift"
        actor: SafeSportOfficer
        preconditions:
          - "InterimMeasure.status == ACTIVE"
          - "Case.status IN {INTAKE_REVIEW, ROUTED}"
        side_effects:
          - "sets status = LIFTED, lifted_at = clock and lift_reason"
          - "recomputes Member.contact_eligibility; membership dimension SUSPENDED -> ACTIVE when nothing else blocks"
          - "SUSPENDED CoachAssignments with suspended_reason 'INTERIM_MEASURE' return to ACTIVE"
          - "recomputes Club.restricted_member_count and Club.compliance_posture for each affected club"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: PERMANENT
        trigger: "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent"
        actor: SafeSportOfficer
        preconditions:
          - "InterimMeasure.status == ACTIVE"
          - "Case.status == ROUTED"
          - "X-User-ID != InterimMeasure.imposed_by_user_id (validations[priority=25], segregation of duties)"
        side_effects:
          - "sets status = PERMANENT, permanence = PERMANENT and converted_by_user_id = X-User-ID"
          - "sets Member.contact_eligibility = PROHIBITED and moves the membership dimension to REVOKED"
          - "every CoachAssignment of that member with status IN {PENDING, ACTIVE, SUSPENDED} moves to TERMINATED"
          - "recomputes Club.active_assignment_count, Club.restricted_member_count and Club.compliance_posture for each affected club"
          - "increments Member.version by 1"

  - entity: ClubAudit
    initial_state: SAMPLED
    terminal_states: [CLOSED_COMPLIANT, CLOSED_SANCTIONED]
    transitions:
      - from: SAMPLED
        to: FINDINGS_ISSUED
        trigger: "POST /safesport/club-audits/{club_audit_id}/finalize"
        actor: ComplianceAuditor
        preconditions:
          - "ClubAudit.status == SAMPLED"
        side_effects:
          - "runs calculations.club_compliance_score with the audit's score_variant and stamps compliant_member_count, denominator_count and compliance_score"
          - "copies compliance_score onto Club.compliance_score"
          - "sets status = FINDINGS_ISSUED and finalized_at = clock"
          - "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"
      - from: FINDINGS_ISSUED
        to: CLOSED_COMPLIANT
        trigger: "POST /safesport/club-audits/{club_audit_id}/close with resolution = CLOSE_COMPLIANT"
        actor: ComplianceAuditor
        preconditions:
          - "ClubAudit.status == FINDINGS_ISSUED"
          - "ClubAudit.compliance_score >= COMPLIANCE_PASS_SCORE"
          - "ClubAudit.open_finding_count == 0"
        side_effects:
          - "sets status = CLOSED_COMPLIANT, closed_at = clock, sanction_fine_cents = 0"
          - "sets Club.sanction_status = NONE and recomputes Club.compliance_posture"
      - from: FINDINGS_ISSUED
        to: CLOSED_SANCTIONED
        trigger: "POST /safesport/club-audits/{club_audit_id}/close with resolution = SANCTION"
        actor: ComplianceAuditor
        preconditions:
          - "ClubAudit.status == FINDINGS_ISSUED"
          - "ClubAudit.compliance_score < COMPLIANCE_PASS_SCORE OR ClubAudit.open_finding_count >= 1"
        side_effects:
          - "runs calculations.audit_sanction_fine and stamps AuditFinding.fine_cents on every finding with status OPEN, then ClubAudit.sanction_fine_cents as the sum of those rounded per-finding amounts"
          - "sets status = CLOSED_SANCTIONED and closed_at = clock"
          - "sets Club.sanction_status = SUSPENDED"
          - "sets Club.compliance_posture = FROZEN via calculations.club_compliance_posture"
          - "every CoachAssignment at that club with status IN {PENDING, ACTIVE} moves to TERMINATED with suspended_reason = 'CLUB_SANCTION'"
          - "recomputes Club.active_assignment_count and Club.restricted_member_count"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /safesport/audit-findings/{audit_finding_id}/decision with decision = REMEDIATION_SUBMITTED"
        actor: ClubAdministrator
        preconditions:
          - "AuditFinding.status == OPEN"
          - "ClubAudit.status == FINDINGS_ISSUED"
          - "acting role is ClubAdministrator (validations[priority=26])"
        side_effects:
          - "sets status = REMEDIATED and evidence_note = payload.note"
          - "decrements ClubAudit.open_finding_count and increments ClubAudit.remediated_finding_count, preserving calculations.finding_partition_invariant"
          - "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"
      - from: REMEDIATED
        to: OPEN
        trigger: "POST /safesport/audit-findings/{audit_finding_id}/decision with decision = REMEDIATION_REJECTED"
        actor: ComplianceAuditor
        preconditions:
          - "AuditFinding.status == REMEDIATED"
          - "ClubAudit.status == FINDINGS_ISSUED"
          - "acting role is ComplianceAuditor (validations[priority=26])"
        side_effects:
          - "sets status = OPEN and decision_note = payload.note"
          - "increments ClubAudit.open_finding_count and decrements ClubAudit.remediated_finding_count, preserving calculations.finding_partition_invariant"
          - "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"
        note: "Compensating action of OPEN_to_REMEDIATED; closes the OPEN -> REMEDIATED -> OPEN cycle."
      - from: OPEN
        to: WAIVED
        trigger: "POST /safesport/audit-findings/{audit_finding_id}/decision with decision = WAIVED"
        actor: ComplianceAuditor
        preconditions:
          - "AuditFinding.status == OPEN"
          - "ClubAudit.status == FINDINGS_ISSUED"
          - "acting role is ComplianceAuditor (validations[priority=26])"
        side_effects:
          - "sets status = WAIVED and decision_note = payload.note"
          - "decrements ClubAudit.open_finding_count and increments ClubAudit.waived_finding_count, preserving calculations.finding_partition_invariant"
          - "the finding is excluded from calculations.audit_sanction_fine"
          - "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"

  - entity: RoomStay
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /safesport/room-stays/{room_stay_id}/cancel"
        actor: ClubAdministrator
        preconditions:
          - "RoomStay.status == BOOKED"
        side_effects:
          - "sets status = CANCELLED and cancel_reason"
          - "the interval is released: it no longer participates in calculations.room_slot_overlap_check"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: screening-order-create-stale-club
    parent_entity: Club
    write_endpoint: "POST /safesport/members/{member_id}/screening-orders"
    occ_field: "expected_club_version"
    description: |
      Ordering a background screen debits the club's screening escrow, so the
      request carries the club version the caller last observed. When that
      version no longer matches Club.version the request is rejected: another
      order (or a void, or an escrow funding) has already moved the balance the
      caller based its budgeting on, and the debit would be computed against a
      stale escrow view.
    error_id: ERR_STALE_CLUB_VERSION
    http_status: 412
  - rule_id: coach-assignment-activate-stale-member
    parent_entity: Member
    write_endpoint: "POST /safesport/coach-assignments/{coach_assignment_id}/activate"
    occ_field: "expected_member_version"
    description: |
      Activation pins the member's eligibility view onto the assignment as
      eligibility_snapshot_version. A request whose expected_member_version is
      behind Member.version is approving an eligibility snapshot that has since
      been superseded - a training completion, a renewal or a screening
      adjudication has already rewritten the member - so it is rejected.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: interim-measure-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /safesport/cases/{case_id}/interim-measures"
    occ_field: "expected_member_version"
    description: |
      A new InterimMeasure legitimately supersedes the member's prior
      restriction posture, so a second measure of a different kind against an
      unchanged member would itself succeed. The version check is therefore the
      only guard: a caller whose expected_member_version is stale is imposing a
      restriction on top of a member record that has already changed, and the
      request is rejected.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
#
# Global constants shared by several rules:
#   SCREENING_VALIDITY_DAYS      = 730
#   RENEWAL_WINDOW_DAYS          = 90
#   COMPLIANCE_PASS_SCORE        = 90.00
#   MANDATORY_REPORT_WINDOW_HOURS = 24
#   RETENTION_YEARS              = 7
#   ROOM_SLOT_CAPACITY           = 2
#   MEASURE_COOLING_BUFFER_DAYS  = 14
#   CLOCK_DEFAULT                = 2026-08-01T00:00:00Z
# Every "latest"/"max over" selection below pins its own tie-break; no rule ever
# reads an `id` to decide an observable outcome.
# =============================================================================
calculations:
  - name: screening_tier_assignment
    trigger: "POST /safesport/members (creation), and re-run inside the side effects of POST /safesport/screening-orders/{screening_order_id}/adjudicate when disposition == NON_DISQUALIFYING_RECORD, and inside POST /safesport/members/{member_id}/renew"
    algorithm: weighted_scoring
    combinatorial_mode: "(a) formula with >= 3 inputs and non-linear interaction: two nested caps plus a conditional branch on role_type"
    formula: |
      role_points = ROLE_POINTS[member.role_type]
      contact_points = MINOR_CONTACT_POINTS if member.has_minor_athlete_contact else 0
      jurisdiction_points = min(JURISDICTION_POINT_CAP,
                                JURISDICTION_POINTS_PER_EXTRA * max(0, len(member.jurisdiction_codes) - 1))
      prior_nondisq = count(ScreeningOrder o WHERE o.member_id == member.id
                                              AND o.status == 'ADJUDICATED'
                                              AND o.disposition == 'NON_DISQUALIFYING_RECORD')
      open_member_findings = count(AuditFinding f WHERE f.member_id == member.id
                                                   AND f.status == 'OPEN')
      history_points = min(HISTORY_POINT_CAP,
                           PRIOR_RECORD_POINTS * prior_nondisq
                           + OPEN_FINDING_POINTS * open_member_findings)
      risk_points = min(100, role_points + contact_points + jurisdiction_points + history_points)
      required_tier = 'TIER_3' if risk_points >= TIER_3_THRESHOLD
                      else ('TIER_2' if risk_points >= TIER_2_THRESHOLD else 'TIER_1')
    input_set: |
      ScreeningOrder rows are counted only in status ADJUDICATED with disposition
      NON_DISQUALIFYING_RECORD (ORDERED, RESULT_RETURNED and VOIDED rows are
      excluded, and DISQUALIFYING_RECORD rows never reach this rule because the
      member is terminal). AuditFinding rows are counted only in status OPEN
      (REMEDIATED and WAIVED are excluded). The count is over all audits of all
      clubs, with no time window - the score is a lifetime exposure measure.
    constants:
      ROLE_POINTS: { HEAD_COACH: 40, ASSISTANT_COACH: 30, CHAPERONE: 25, OFFICIAL: 20, VOLUNTEER: 10 }
      MINOR_CONTACT_POINTS: 25
      JURISDICTION_POINTS_PER_EXTRA: 5
      JURISDICTION_POINT_CAP: 15
      PRIOR_RECORD_POINTS: 12
      OPEN_FINDING_POINTS: 6
      HISTORY_POINT_CAP: 30
      TIER_2_THRESHOLD: 45
      TIER_3_THRESHOLD: 75
    precision: "risk_points is an integer; both thresholds use >= (a score of exactly 75 is TIER_3, exactly 45 is TIER_2)"

  - name: screening_order_charge
    trigger: "POST /safesport/members/{member_id}/screening-orders"
    algorithm: tiered_pricing
    combinatorial_mode: "(c) circular-looking dependency with a pinned evaluation order: the volume-discount tier is keyed on the PRE-discount gross subtotal, while the expedite fee is a percentage of the POST-discount net subtotal"
    formula: |
      step1  base            = TIER_BASE_CENTS[order.tier]
      step2  surcharge       = JURISDICTION_SURCHARGE_CENTS * max(0, order.jurisdiction_count - 1)
      step3  gross_subtotal  = base + surcharge
      step4  discount_pct    = 0.10 if gross_subtotal >= VOLUME_TIER_2_CENTS
                               else (0.05 if gross_subtotal >= VOLUME_TIER_1_CENTS else 0.00)
      step5  discount_cents  = round_half_up(gross_subtotal * discount_pct)          # whole cents
      step6  net_subtotal    = gross_subtotal - discount_cents
      step7  expedite_cents  = round_half_up(net_subtotal * EXPEDITE_PCT) if order.expedited else 0
      step8  charged_cents   = net_subtotal + expedite_cents
      # PINNED ORDER. The rejected alternative is to key the discount tier on the
      # post-expedite total (which would push a TIER_3 expedited order into the
      # 10% band) or to apply the expedite percentage to gross_subtotal before the
      # discount. Both produce different cents; only the order above is correct.
    input_set: "Uses only the order's own snapshot fields tier and jurisdiction_count, so a later change to Member.required_tier never retroactively reprices an existing order."
    constants:
      TIER_BASE_CENTS: { TIER_1: 2500, TIER_2: 4800, TIER_3: 9200 }
      JURISDICTION_SURCHARGE_CENTS: 1100
      VOLUME_TIER_1_CENTS: 8000
      VOLUME_TIER_2_CENTS: 12000
      EXPEDITE_PCT: 0.35
    precision: "all monetary values are integer cents; round_half_up is applied exactly twice, at step5 and step7, never to charged_cents itself"

  - name: member_eligibility_projection
    trigger: "GET /safesport/members/{member_id}/eligibility-projection (either variant on demand); the AUDIT_SNAPSHOT variant additionally runs inside the side effects of POST /safesport/screening-orders/{screening_order_id}/adjudicate, POST /safesport/training-assignments/{training_assignment_id}/complete and POST /safesport/members/{member_id}/renew, where it stamps Member.eligible_through"
    algorithm: forward_looking
    formula: |
      required_courses = [c in TrainingCourse WHERE member.required_tier in c.required_for_tiers]

      screening_expiry =
        max over o in ScreeningOrder WHERE o.member_id == member.id
                                       AND o.status == 'ADJUDICATED'
                                       AND o.disposition in {'CLEAR','NON_DISQUALIFYING_RECORD'}
            of o.expires_at
        # tie-break when two orders share the same expires_at: keep the row with
        # the earliest created_at. null when no such order exists.

      per_course_expiry(c, candidate_statuses) =
        max over a in TrainingAssignment WHERE a.member_id == member.id
                                           AND a.course_code == c.code
                                           AND a.status in candidate_statuses
            of ( a.completed_at + c.validity_days days   if a.status == 'COMPLETED'
                 else a.due_at   + c.validity_days days )   # projected completion
        # tie-break on equal expiry: earliest created_at. null when the candidate
        # set for that course is empty.

      training_expiry(candidate_statuses) =
        null if any c in required_courses has per_course_expiry(c, candidate_statuses) == null
        else min over c in required_courses of per_course_expiry(c, candidate_statuses)

      projected_eligible_through(variant) =
        null if screening_expiry == null or training_expiry(variant_statuses) == null
        else min(screening_expiry, training_expiry(variant_statuses))
    input_set: |
      required_courses is the full TrainingCourse set filtered on the member's
      CURRENT required_tier, so a tier uplift can widen the required set and turn
      a previously non-null projection into null. Assignments in status EXPIRED
      are excluded by both variants.
    constants:
      SCREENING_VALIDITY_DAYS: 730
    precision: "instants are ISO 8601 UTC with three fractional digits; day arithmetic adds exact 24-hour multiples"
    variants:
      - name: AUDIT_SNAPSHOT
        when: "the default; used whenever the system stamps Member.eligible_through, and requested with variant=AUDIT_SNAPSHOT on the projection read; also the variant every ClubAudit compliance evaluation uses"
        difference: "variant_statuses = {COMPLETED} only. An in-flight assignment contributes nothing, so a member whose only completion for a required course is old projects an earlier (or null) eligible_through."
      - name: RENEWAL_FORWARD
        when: "requested with variant=RENEWAL_FORWARD on the projection read; the forward-looking view a club uses to plan a renewal"
        difference: "variant_statuses = {COMPLETED, IN_PROGRESS}. An IN_PROGRESS assignment is projected to complete at its due_at and therefore contributes due_at + validity_days, which can move projected_eligible_through years later than the AUDIT_SNAPSHOT answer for exactly the same rows. ASSIGNED assignments are still excluded - only a started course counts as in flight."

  - name: club_compliance_score
    trigger: "POST /safesport/club-audits/{club_audit_id}/finalize"
    algorithm: aggregation
    formula: |
      compliant_member_count =
        count over m in ClubAudit.sampled_member_ids WHERE
             m.screening_status == 'CLEARED'
         AND m.training_status  == 'CURRENT'
         AND m.membership_status in {'ACTIVE'}
         AND no InterimMeasure exists for m with status in {'ACTIVE','PERMANENT'}
        # evaluated against live member state at finalized_at, not at sampling time

      denominator_count =
          club.roster_size_attested                                   if score_variant == 'SELF_ATTESTED'
          else count(CoachAssignment a WHERE a.club_id == club.id
                                        AND a.status in {'PENDING','ACTIVE'})   # REGISTRY_VERIFIED

      compliance_score =
          100.00                                                       if ClubAudit.sampled_member_count == 0
          else 0.00                                                    if denominator_count == 0
          else min(100.00, round_half_up(100 * compliant_member_count / denominator_count, 2))
    input_set: |
      The numerator ranges only over the audit's own sampled_member_ids. The
      REGISTRY_VERIFIED denominator counts CoachAssignment rows in status PENDING
      or ACTIVE only - SUSPENDED, EXPIRED and TERMINATED rows are excluded, which
      is what makes a sanctioned club's registry denominator shrink. The
      SELF_ATTESTED denominator ignores the registry entirely.
    constants:
      COMPLIANCE_PASS_SCORE: 90.00
    precision: "2 decimal places, round_half_up, capped at 100.00"
    variants:
      - name: SELF_ATTESTED
        when: "ClubAudit.score_variant == 'SELF_ATTESTED'"
        difference: "denominator is Club.roster_size_attested, a number the club itself supplied at charter time; an inflated attestation drives the score down for the same sample."
      - name: REGISTRY_VERIFIED
        when: "ClubAudit.score_variant == 'REGISTRY_VERIFIED'"
        difference: "denominator is the live count of CoachAssignment rows in status PENDING or ACTIVE at that club; for identical sampled members and identical compliance this yields a different score whenever roster_size_attested != registry count."

  - name: audit_sanction_fine
    trigger: "POST /safesport/club-audits/{club_audit_id}/close with resolution = SANCTION"
    algorithm: tiered_pricing
    combinatorial_mode: "(b) nested rounding where the order matters: each finding is rounded to whole cents BEFORE the sum"
    formula: |
      shortfall_points = max(0.00, COMPLIANCE_PASS_SCORE - ClubAudit.compliance_score)   # 2dp decimal
      shortfall_factor = 1 + SHORTFALL_RATE_PER_POINT * shortfall_points

      per finding f in AuditFinding WHERE f.audit_id == audit.id AND f.status == 'OPEN':
        raw_f        = BASE_FINE_CENTS
                       * SEVERITY_MULTIPLIER[f.severity]
                       * (1 + (REPEAT_UPLIFT_PCT if f.is_repeat else 0))
                       * shortfall_factor
        f.fine_cents = round_half_up(raw_f)            # ROUND PER FINDING - pinned

      ClubAudit.sanction_fine_cents = sum of f.fine_cents over those findings,
                                     accumulated in ascending f.created_at order
      # PINNED ORDER: round each finding first, then sum. The rejected
      # alternative - sum the raw amounts and round once - differs by whole cents
      # whenever several findings each carry a fractional part below 0.5 that
      # together exceed 0.5.
    input_set: "Only AuditFinding rows on this audit with status OPEN at close time. REMEDIATED and WAIVED rows are excluded and keep fine_cents null."
    constants:
      BASE_FINE_CENTS: 25000
      SEVERITY_MULTIPLIER: { MINOR: 0.20, MAJOR: 0.55, CRITICAL: 1.00 }
      REPEAT_UPLIFT_PCT: 0.375
      SHORTFALL_RATE_PER_POINT: 0.012
      COMPLIANCE_PASS_SCORE: 90.00
    precision: "round_half_up to whole cents per finding; the audit total is an exact integer sum of those rounded values"

  - name: club_compliance_posture
    trigger: "recomputed inside every transition whose side_effects mention Club.compliance_posture - screening order creation, adjudication, training completion, coach-assignment activation and status changes, interim-measure imposition/lift/conversion, audit finalize and close, and finding decisions"
    algorithm: constraint_propagation
    formula: |
      # evaluated top to bottom; first match wins
      compliance_posture =
        'FROZEN'     if club.sanction_status in {'SUSPENDED','TERMINATED'}
                        or club.critical_open_finding_count >= CRITICAL_FREEZE_THRESHOLD
        'RESTRICTED' if club.open_finding_count >= RESTRICT_FINDING_THRESHOLD
                        or club.restricted_member_count >= 1
        'OPEN'       otherwise
    input_set: |
      open_finding_count and critical_open_finding_count aggregate AuditFinding
      rows in status OPEN across every ClubAudit of the club, in any audit status.
      restricted_member_count counts distinct Members holding a CoachAssignment at
      this club in status ACTIVE or SUSPENDED whose contact_eligibility is
      RESTRICTED or PROHIBITED. PENDING assignments are excluded, so a member who
      is still working through screening or training does not by itself restrict
      the club and the activation attempt surfaces validations[priority=17] or
      [priority=18] rather than [priority=12].
    constants:
      CRITICAL_FREEZE_THRESHOLD: 1
      RESTRICT_FINDING_THRESHOLD: 3
    precision: "integer comparisons, both thresholds use >="

  - name: contact_eligibility_derivation
    trigger: "recomputed inside every transition whose side_effects mention Member.contact_eligibility or Member.training_status"
    algorithm: constraint_propagation
    formula: |
      training_expiry = training_expiry({'COMPLETED'})      # AUDIT_SNAPSHOT view
      training_status =
        'NEVER'   if training_expiry == null
        'LAPSED'  if clock >= training_expiry
        'CURRENT' otherwise

      # evaluated top to bottom; first match wins
      contact_eligibility =
        'PROHIBITED' if member.screening_status == 'DISQUALIFIED'
                        or exists InterimMeasure m WHERE m.member_id == member.id AND m.status == 'PERMANENT'
        'RESTRICTED' if exists InterimMeasure m WHERE m.member_id == member.id AND m.status == 'ACTIVE'
                        or member.screening_status in {'UNSCREENED','SCREENING_ORDERED','FLAGGED','EXPIRED'}
                        or member.training_status in {'NEVER','LAPSED'}
        'ELIGIBLE'   otherwise
    input_set: "InterimMeasure rows in status LIFTED are ignored entirely; TrainingAssignment rows in status ASSIGNED, IN_PROGRESS and EXPIRED are ignored by training_status."
    precision: "training lapse boundary uses >= : at exactly training_expiry the status is already LAPSED"

  - name: escrow_conservation_invariant
    trigger: "asserted after every request; the two actions that move the quantity are POST /safesport/members/{member_id}/screening-orders (forward) and POST /safesport/screening-orders/{screening_order_id}/void (compensating)"
    algorithm: aggregation
    formula: |
      for every Club c:
        c.escrow_balance_cents
          + sum( o.charged_cents
                 for o in ScreeningOrder
                 join Member m on o.member_id == m.id
                 where m.club_id == c.id
                   and o.status in {'ORDERED','RESULT_RETURNED','ADJUDICATED'} )
        == c.total_funded_cents
      # A voided order keeps its charged_cents on the row but leaves the sum,
      # because status VOIDED is excluded; the refund puts exactly the same
      # number of cents back into escrow_balance_cents, so the identity holds.
    input_set: "Screening orders of every member whose club_id is this club, in status ORDERED, RESULT_RETURNED or ADJUDICATED. VOIDED orders are excluded."
    constants: {}
    precision: "exact integer cents; no rounding participates, so order/void round-trips leave zero drift"

  - name: finding_partition_invariant
    trigger: "asserted after every request; the actions that move the quantity are the three POST /safesport/audit-findings/{audit_finding_id}/decision variants and POST /safesport/club-audits/{club_audit_id}/findings"
    algorithm: aggregation
    formula: |
      for every ClubAudit a:
        a.finding_total_count
          == a.open_finding_count + a.remediated_finding_count + a.waived_finding_count
        and a.finding_total_count == count(AuditFinding f WHERE f.audit_id == a.id)
      # REMEDIATION_SUBMITTED moves one unit OPEN -> REMEDIATED; the compensating
      # REMEDIATION_REJECTED moves the same unit back REMEDIATED -> OPEN. The
      # conserved quantity is the cardinality of the finding set, not money.
    input_set: "All AuditFinding rows of the audit regardless of severity, member_id or fine_cents."
    constants: {}
    precision: "exact integer counts"

  - name: room_slot_overlap_check
    trigger: "POST /safesport/clubs/{club_id}/room-stays"
    algorithm: interval_merge
    formula: |
      slot(s) = (s.club_id, s.trip_label, s.room_number)
      HALF-OPEN semantics: a stay occupies [check_in, check_out).
      intersects(new, s) = new.check_in < s.check_out AND s.check_in < new.check_out
      # adjacency is explicitly allowed: new.check_in == s.check_out does NOT intersect

      neighbours = [ s in RoomStay WHERE slot(s) == slot(new)
                                     AND s.status == 'BOOKED'
                                     AND intersects(new, s) ]

      check 1 (safety, validations[priority=15]):
        any s in neighbours with s.occupant_kind != new.occupant_kind
        -> ERR_MINOR_ADULT_LODGING_PROHIBITED
      check 2 (capacity, validations[priority=24]):
        len(neighbours) + 1 > ROOM_SLOT_CAPACITY
        -> ERR_ROOM_OCCUPANCY_CONFLICT
      # check 1 strictly precedes check 2, so a request that trips both reports
      # the lodging-safety error.
    input_set: "Only RoomStay rows in status BOOKED within the same (club_id, trip_label, room_number) slot; CANCELLED rows never conflict."
    constants:
      ROOM_SLOT_CAPACITY: 2
    precision: "half-open interval arithmetic on ISO 8601 instants; no buffer is applied"

  - name: measure_window_conflict_check
    trigger: "POST /safesport/cases/{case_id}/interim-measures"
    algorithm: interval_merge
    formula: |
      CLOSED semantics with a trailing cooling buffer: an existing measure
      occupies [effective_from, effective_to + MEASURE_COOLING_BUFFER_DAYS], and a
      null effective_to means +infinity.
      existing = [ e in InterimMeasure WHERE e.member_id == new.member_id
                                         AND e.status == 'ACTIVE'
                                         AND e.measure_kind == new.measure_kind ]
      blocked_to(e)   = +infinity if e.effective_to is null
                        else e.effective_to + MEASURE_COOLING_BUFFER_DAYS days
      new_to          = +infinity if new.effective_to is null else new.effective_to
      conflict(e,new) = new.effective_from <= blocked_to(e) AND e.effective_from <= new_to
      # CLOSED endpoints: new.effective_from == blocked_to(e) IS a conflict, unlike
      # the half-open room-stay rule where touching endpoints are legal.
      any conflict -> ERR_MEASURE_WINDOW_CONFLICT
    input_set: "Only InterimMeasure rows for the same member with the same measure_kind in status ACTIVE. LIFTED and PERMANENT rows do not participate (a PERMANENT measure blocks earlier, at validations[priority=14])."
    constants:
      MEASURE_COOLING_BUFFER_DAYS: 14
    precision: "closed interval arithmetic plus a 14-day trailing buffer, evaluated on exact 24-hour day multiples"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# Domain ordering rationale: authentication, then authorization, then path
# existence, then scope, then request shape, then body-reference existence, then
# uniqueness, then optimistic concurrency, then state, then the club posture
# gate, then ATHLETE-SAFETY rules, then temporal rules, then routing/constraint
# rules, and finally fiscal capacity. Safety always precedes money in this
# domain, which is what makes priority 13 beat priority 27.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-templated resource id resolves to an existing row, validated left-to-right"
    error_id: "ERR_CLUB_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_SCREENING_ORDER_NOT_FOUND | ERR_TRAINING_ASSIGNMENT_NOT_FOUND | ERR_COACH_ASSIGNMENT_NOT_FOUND | ERR_INVESTIGATING_BODY_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_INTERIM_MEASURE_NOT_FOUND | ERR_CLUB_AUDIT_NOT_FOUND | ERR_AUDIT_FINDING_NOT_FOUND | ERR_ROOM_STAY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path-templated id"
  - priority: 4
    category: auth
    check: "when X-User-Role is ClubAdministrator, X-User-ID equals the club_id of the addressed resource (Club.id, Member.club_id, CoachAssignment.club_id, RoomStay.club_id, ClubAudit.club_id, or the Member.club_id behind a ScreeningOrder / TrainingAssignment / AuditFinding)"
    error_id: ERR_CLUB_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all ClubAdministrator-callable endpoints"
  - priority: 5
    category: auth
    check: "when X-User-Role is Member, X-User-ID equals TrainingAssignment.member_id on start/complete, Member.id on the member read and projection read, and Case.reported_member_id is NOT required (a member may report about anyone)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "GET /safesport/members/{member_id}, GET /safesport/members/{member_id}/eligibility-projection, POST /safesport/training-assignments/{training_assignment_id}/start, POST /safesport/training-assignments/{training_assignment_id}/complete"
  - priority: 6
    category: business_constraint
    check: "request body conforms to the endpoint's input schema - required fields present, types correct, enum members valid, string lengths within bounds, limit in 1..100 and offset >= 0, season_end > season_start, check_out > check_in, audit_period_end > audit_period_start, effective_to >= effective_from, jurisdiction_codes non-empty with no duplicates, and RoomStay's member_id / minor_athlete_age pairing consistent with occupant_kind"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 7
    category: existence
    check: "every body-referenced id or natural key resolves: club_id, member_id, investigating_body_id, sampled_member_ids entries, and course_code against TrainingCourse.code"
    error_id: "ERR_CLUB_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_INVESTIGATING_BODY_NOT_FOUND | ERR_TRAINING_COURSE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /safesport/members, POST /safesport/training-assignments, POST /safesport/coach-assignments, POST /safesport/investigating-bodies, POST /safesport/cases, POST /safesport/cases/{case_id}/route, POST /safesport/cases/{case_id}/interim-measures, POST /safesport/club-audits, POST /safesport/clubs/{club_id}/room-stays"
  - priority: 8
    category: business_referential
    check: "InterimMeasure.member_id equals Case.reported_member_id; every ClubAudit.sampled_member_ids entry is a Member of ClubAudit.club_id; AuditFinding.member_id, when present, is in the audit's sampled_member_ids"
    error_id: ERR_CLUB_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /safesport/cases/{case_id}/interim-measures, POST /safesport/club-audits, POST /safesport/club-audits/{club_audit_id}/findings"
  - priority: 9
    category: business_constraint
    check: "Member.email is unique across every Member in the governing body, compared case-insensitively; TrainingCourse.code is unique across every TrainingCourse"
    error_id: "ERR_DUPLICATE_MEMBER_EMAIL | ERR_DUPLICATE_COURSE_CODE"
    http_status: 409
    applies_to: "POST /safesport/members, POST /safesport/training-courses"
  - priority: 10
    category: state
    check: "the OCC field matches the parent's current version - expected_club_version == Club.version, expected_member_version == Member.version"
    error_id: "ERR_STALE_CLUB_VERSION | ERR_STALE_MEMBER_VERSION"
    http_status: 412
    applies_to: "POST /safesport/members/{member_id}/screening-orders, POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/cases/{case_id}/interim-measures"
  - priority: 11
    category: state
    check: "the addressed resource is in a state from which the requested transition exists, per the matching §1.2 machine"
    error_id: "ERR_SCREENING_ORDER_INVALID_STATE | ERR_TRAINING_ASSIGNMENT_INVALID_STATE | ERR_COACH_ASSIGNMENT_INVALID_STATE | ERR_CASE_INVALID_STATE | ERR_INTERIM_MEASURE_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_FINDING_INVALID_STATE | ERR_ROOM_STAY_INVALID_STATE | ERR_MEMBER_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 12
    category: state
    check: "the governing Club.compliance_posture permits the operation: FROZEN blocks member registration, screening orders, coach-assignment creation and activation, room stays and renewals; RESTRICTED additionally blocks coach-assignment activation and renewal but allows screening orders, training and room stays"
    error_id: ERR_CLUB_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /safesport/members, POST /safesport/members/{member_id}/screening-orders, POST /safesport/coach-assignments, POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/clubs/{club_id}/room-stays, POST /safesport/members/{member_id}/renew"
  - priority: 13
    category: business_safety
    check: "the subject Member.screening_status is not DISQUALIFIED"
    error_id: ERR_MEMBER_DISQUALIFIED
    http_status: 409
    applies_to: "POST /safesport/members/{member_id}/screening-orders, POST /safesport/training-assignments, POST /safesport/coach-assignments, POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/clubs/{club_id}/room-stays, POST /safesport/members/{member_id}/renew"
  - priority: 14
    category: business_safety
    check: "the subject Member has no InterimMeasure in status PERMANENT, and no InterimMeasure in status ACTIVE when the operation would place the member in contact with athletes. This gate is measure-based ONLY: a member whose contact_eligibility is merely RESTRICTED because screening or training currency is missing passes priority 14 and is refused later, at priority 17 or priority 18"
    error_id: ERR_CONTACT_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /safesport/coach-assignments, POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/coach-assignments/{coach_assignment_id}/electronic-communication-authorization, POST /safesport/clubs/{club_id}/room-stays, POST /safesport/members/{member_id}/renew"
  - priority: 15
    category: business_safety
    check: "no BOOKED stay whose half-open interval intersects the requested one in the same (club_id, trip_label, room_number) slot has a different occupant_kind - an adult member and a minor athlete may never share a room slot in overlapping time"
    error_id: ERR_MINOR_ADULT_LODGING_PROHIBITED
    http_status: 409
    applies_to: "POST /safesport/clubs/{club_id}/room-stays"
  - priority: 16
    category: business_safety
    check: "electronic communication with minor athletes requires the assignment to be ACTIVE, the member's contact_eligibility to be ELIGIBLE, channel_kind to be other than PRIVATE_DIRECT_MESSAGE whenever the governing Club.minor_athlete_program is true, and parent_copy_required to be true whenever Member.has_minor_athlete_contact is true"
    error_id: ERR_ELECTRONIC_COMM_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /safesport/coach-assignments/{coach_assignment_id}/electronic-communication-authorization"
  - priority: 17
    category: business_safety
    check: "Member.screening_status == CLEARED (a screen that has reached EXPIRED, or was never ordered, blocks the operation)"
    error_id: ERR_SCREENING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/members/{member_id}/renew"
  - priority: 18
    category: business_safety
    check: "Member.training_status == CURRENT - every TrainingCourse required for the member's required_tier has a COMPLETED assignment whose expires_at is still in the future"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /safesport/coach-assignments/{coach_assignment_id}/activate, POST /safesport/members/{member_id}/renew"
  - priority: 19
    category: business_temporal
    check: "calculations.measure_window_conflict_check finds no ACTIVE measure of the same measure_kind whose closed interval plus 14-day cooling buffer overlaps the requested window"
    error_id: ERR_MEASURE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /safesport/cases/{case_id}/interim-measures"
  - priority: 20
    category: business_temporal
    check: "the renewal window is open: clock >= Member.eligible_through - RENEWAL_WINDOW_DAYS"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /safesport/members/{member_id}/renew"
  - priority: 21
    category: business_referential
    check: "Case.allegation_category is a member of the target InvestigatingBody.scope_categories"
    error_id: ERR_BODY_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /safesport/cases/{case_id}/route"
  - priority: 22
    category: business_constraint
    check: "InvestigatingBody.intake_status == ACCEPTING"
    error_id: ERR_BODY_INTAKE_PAUSED
    http_status: 409
    applies_to: "POST /safesport/cases/{case_id}/route"
  - priority: 23
    category: business_constraint
    check: "InvestigatingBody.open_case_count < InvestigatingBody.max_open_cases"
    error_id: ERR_BODY_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /safesport/cases/{case_id}/route"
  - priority: 24
    category: business_constraint
    check: "the count of intersecting BOOKED stays in the slot plus one does not exceed ROOM_SLOT_CAPACITY (2)"
    error_id: ERR_ROOM_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /safesport/clubs/{club_id}/room-stays"
  - priority: 25
    category: business_constraint
    check: "the acting X-User-ID differs from InterimMeasure.imposed_by_user_id when converting a measure to permanent, and differs from Case.reporter_user_id when closing a case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent, POST /safesport/cases/{case_id}/close"
  - priority: 26
    category: business_constraint
    check: "the decision value is permitted for the acting role - ClubAdministrator may only submit REMEDIATION_SUBMITTED, ComplianceAuditor may only submit REMEDIATION_REJECTED or WAIVED"
    error_id: ERR_DECISION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /safesport/audit-findings/{audit_finding_id}/decision"
  - priority: 27
    category: business_fiscal
    check: "Club.escrow_balance_cents >= the charged_cents computed by calculations.screening_order_charge for this order"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 402
    applies_to: "POST /safesport/members/{member_id}/screening-orders"

# =============================================================================
# 1.5 API Endpoint Table   (api_prefix /safesport applies to every path)
# All list endpoints accept limit? and offset? and emit the §1.0 pagination
# fields. Every FK declared in §1.1 has a reverse-reachability GET below.
# =============================================================================
endpoints:
  # ---- reads -------------------------------------------------------------
  - method: GET
    path: "/safesport/clubs/{club_id}"
    description: "Read one club including its derived compliance posture, escrow ledger and finding counters"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: []
    output: Club
    side_effects: ["lazily applies clock-driven Member and CoachAssignment auto-transitions before recomputing this club's derived counters"]
  - method: GET
    path: "/safesport/clubs/{club_id}/members"
    description: "List the members chartered by this club (reverse reachability for Member.club_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["screening_status?", "membership_status?", "contact_eligibility?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/safesport/clubs/{club_id}/audits"
    description: "List the compliance audits of this club, newest created_at first (reverse reachability for ClubAudit.club_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClubAudit[]
    side_effects: []
  - method: GET
    path: "/safesport/clubs/{club_id}/room-stays"
    description: "List the travel room stays booked by this club, ascending check_in then created_at (reverse reachability for RoomStay.club_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor]
    code: 200
    input: ["trip_label?", "room_number?", "status?", "limit?", "offset?"]
    output: RoomStay[]
    side_effects: []
  - method: GET
    path: "/safesport/members/{member_id}"
    description: "Read one member including both state dimensions, risk score, tier, training status and contact eligibility"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["lazily applies the CLEARED->EXPIRED screening transition and the ACTIVE->LAPSED membership transition when the clock has passed the relevant instant"]
  - method: GET
    path: "/safesport/members/{member_id}/screening-orders"
    description: "List this member's screening orders, ascending created_at (reverse reachability for ScreeningOrder.member_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScreeningOrder[]
    side_effects: []
  - method: GET
    path: "/safesport/members/{member_id}/training-assignments"
    description: "List this member's abuse-prevention training assignments, ascending created_at (reverse reachability for TrainingAssignment.member_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer, Member]
    code: 200
    input: ["course_code?", "status?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: ["lazily applies the ASSIGNED->EXPIRED transition for assignments past due_at"]
  - method: GET
    path: "/safesport/members/{member_id}/room-stays"
    description: "List the room stays this adult member occupies, ascending check_in (reverse reachability for RoomStay.member_id)"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoomStay[]
    side_effects: []
  - method: GET
    path: "/safesport/members/{member_id}/eligibility-projection"
    description: "Computed read: run calculations.member_eligibility_projection under the requested variant (default AUDIT_SNAPSHOT) and return the projection alongside the records-retention horizon that answers a records inquiry"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer, Member]
    code: 200
    input: ["variant?"]
    output: { variant: string, projected_eligible_through: datetime, screening_expiry: datetime, training_expiry: datetime, screening_status: string, training_status: string, membership_status: string, contact_eligibility: string, required_tier: string, risk_points: integer, records_retained_through: datetime, blocking_reasons: array }
    side_effects: []
  - method: GET
    path: "/safesport/members"
    description: "Governing-body-wide member roster filtered by club, role and either state dimension (reverse reachability for Member.club_id)"
    roles: [NgbAdmin, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["club_id?", "role_type?", "screening_status?", "membership_status?", "contact_eligibility?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/safesport/screening-orders"
    description: "List screening orders across clubs filtered by member and status (reverse reachability for ScreeningOrder.member_id)"
    roles: [NgbAdmin, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: ScreeningOrder[]
    side_effects: []
  - method: GET
    path: "/safesport/screening-orders/{screening_order_id}"
    description: "Read one screening order including its priced charge breakdown, vendor disposition and adjudication"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer, ScreeningVendor]
    code: 200
    input: []
    output: ScreeningOrder
    side_effects: []
  - method: GET
    path: "/safesport/training-assignments"
    description: "List training assignments across clubs filtered by member, course and status (reverse reachability for TrainingAssignment.member_id)"
    roles: [NgbAdmin, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["member_id?", "course_code?", "status?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: ["lazily applies the ASSIGNED->EXPIRED transition for assignments past due_at"]
  - method: GET
    path: "/safesport/training-assignments/{training_assignment_id}"
    description: "Read one training assignment including completion score and expiry"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["lazily applies the ASSIGNED->EXPIRED transition when the clock has passed due_at"]
  - method: GET
    path: "/safesport/club-audits"
    description: "List compliance audits across clubs filtered by club, status and scoring variant (reverse reachability for ClubAudit.club_id)"
    roles: [NgbAdmin, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: ["club_id?", "status?", "score_variant?", "limit?", "offset?"]
    output: ClubAudit[]
    side_effects: []
  - method: GET
    path: "/safesport/club-audits/{club_audit_id}"
    description: "Read one compliance audit including its four finding counters, denominator and compliance score"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
    code: 200
    input: []
    output: ClubAudit
    side_effects: []
  - method: GET
    path: "/safesport/room-stays"
    description: "List travel room stays across clubs filtered by club, occupant member, trip and status (reverse reachability for RoomStay.club_id and RoomStay.member_id)"
    roles: [NgbAdmin, ComplianceAuditor, SafeSportOfficer]
