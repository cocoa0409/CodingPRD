            - "The two ratings differ only in the third decimal of the rating factor (1.000 vs 0.999) yet produce opposite posting decisions"

      - name: submit_inspection_with_zero_elements_empty_set
        grounds:
          - validations.priority_17_ERR_NO_ELEMENT_CONDITIONS
          - calculations.bridge_health_index
          - calculations.inspection_interval_months
        distinguishing_aspect: |
          The empty element set is the degenerate input to every roll-up in the domain: bridge health
          index over zero elements, component ratings over zero groups, deficiency percentage with a
          zero denominator. The spec forbids the submit outright rather than letting the aggregates
          divide by zero or silently produce 0.00 / NBI 0, which would post an otherwise sound bridge.
        test_recipe:
          setup:
            - "Baseline staff and Cedar Creek Bridge; a ROUTINE inspection is created and then left with no ElementCondition rows at all."
            - "A second inspection on a different bridge shows the one-element boundary passes, so the rule really is 'at least one' and not 'at least four'."
            - "The clock is advanced to 2026-09-02T12:00:00Z so inspection_date 2026-09-02T10:00:00Z satisfies priority 27."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "SPECIAL", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_empty_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspections/${ins_empty_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          assert:
            - "HTTP 422 with error_id ERR_NO_ELEMENT_CONDITIONS"
            - "Inspection.${ins_empty_id}.status is still DRAFT and element_count == 0"
            - "Inspection.${ins_empty_id}.bridge_health_index == null - no 0.00 is written for the empty set"
            - "Bridge.${br_id}.min_nbi_rating == 7 (the 7/7/7 initial_* seeds, untouched), bridge_health_index == null, last_routine_inspection_date == null, inspection_interval_months == 24 and next_inspection_due_date == 2028-09-01 (24 months from the creation date, because year_built 1972 fails the extended-interval test)"
            - "GET /element-conditions?inspection_id=${ins_empty_id} returns an empty list with total_count 0, not an error"
            - "Adding a single SPECIAL-inspection element row (element_key GIRDER, element_group SUPERSTRUCTURE, total_quantity 300, cs1 300, photo_count 0) and re-submitting succeeds with element_count 1 and bridge_health_index 100.00, proving the rule is the empty-set boundary and nothing wider"

