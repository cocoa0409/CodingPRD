            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
