  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: council_event_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_EVENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) pairwise exclusion on the
          AcquisitionTarget's calendar — a hearing ending at 02:00 and a vote starting
          at exactly 02:00 is allowed, while one starting at 01:59:59 collides. Resource
          entity: AcquisitionTarget event calendar — a different interval semantics than
          crew-capacity aggregation.
        test_recipe:
          setup:
            - "Target T in MUNICIPAL_REVIEW with one existing event window 2026-09-02T00:00:00Z..2026-09-02T02:00:00Z"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
          trigger:
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-02T02:00:00Z", scheduled_end: "2026-09-02T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_ok: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-02T03:59:59Z", scheduled_end: "2026-09-02T05:00:00Z" }
              as: MunicipalClerk
              captures: { err: $.data.error_id }
          assert:
            - "First trigger call succeeds with 201 (adjacent back-to-back windows allowed under half-open semantics)"
            - "Second trigger call returns error_id == ERR_EVENT_OVERLAP (interior overlap rejected)"

      - name: capital_item_crew_capacity_aggregation
        grounds:
          - validations[priority=9]
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
          - state_machines.CapitalNeedItem.PLANNED_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics: aggregate capacity, not pairwise exclusion — two SCHEDULED
          items needing 2 and 1 crews may overlap pairwise (summed demand exactly 3, at
          the cap, allowed), but a third concurrent item needing 1 crew pushes the summed
          demand to 4 > MAX_CREWS_PER_TARGET=3 during the triple-overlap instants and is
          rejected even though each pair stays within the cap. Resource entity:
          AcquisitionTarget crew pool — different semantics than the half-open calendar.
        test_recipe:
          setup:
            - "Target T in VALUATION with ACCEPTED assessment holding three PLANNED items: I1 crews=2, I2 crews=1, I3 crews=1; I1 SCHEDULED 2026-10-01T00:00:00Z..2026-10-05T00:00:00Z, I2 SCHEDULED 2026-10-03T00:00:00Z..2026-10-07T00:00:00Z (summed demand in 10-03..10-05 is exactly 3)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d1", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 2 }
              as: AcquisitionAnalyst
              captures: { i1: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d2", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i2: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "STORAGE", horizon: "SHORT_TERM", description: "d3", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i3: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "POST /acquisitions/capital-items/${i1}/schedule"
              payload: { window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: TransitionManager
            - call: "POST /acquisitions/capital-items/${i2}/schedule"
              payload: { window_start: "2026-10-03T00:00:00Z", window_end: "2026-10-07T00:00:00Z" }
              as: TransitionManager
          trigger:
            - call: "POST /acquisitions/capital-items/${i3}/schedule"
              payload: { window_start: "2026-10-04T00:00:00Z", window_end: "2026-10-06T00:00:00Z" }
              as: TransitionManager
              captures: { err: $.data.error_id }
          assert:
            - "Setup schedules both succeeded: summed demand 2+1 == 3 == MAX_CREWS_PER_TARGET is allowed (at-cap boundary is inclusive)"
            - "CapitalNeedItem.${i1}.status == SCHEDULED"
            - "CapitalNeedItem.${i2}.status == SCHEDULED"
            - "error_id == ERR_CREW_CAPACITY_EXCEEDED (during 10-04..10-05 demand would be 2+1+1 == 4 > 3)"
            - "CapitalNeedItem.${i3}.status == PLANNED (unchanged)"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_settlement_conservation
        grounds:
          - calculations.deposit_settlement
        distinguishing_aspect: |
          Conserved quantity: deposit dollars. Migration decomposes deposit_cents into
          deposit_offset_cents + refund_cents with sum exactly equal, and
          new_ar_balance_cents + deposit_offset_cents == ar_balance_cents — a monetary
          liability invariant, a different conserved quantity than the capital-split
          instance.
        test_recipe:
          setup:
            - "Target T in CLOSING; BILLING_RECORDS transition DONE; LEGACY account CA deposit=50000, AR=30000"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
