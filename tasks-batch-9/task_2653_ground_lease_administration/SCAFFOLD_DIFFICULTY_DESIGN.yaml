              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/arbitration-referrals"
