          One request violates both the priority-40 cycle-state rule and the priority-48 routing
          rule: the cycle is CLOSED and the destination MEM is not on the segment. The 409
          ERR_CYCLE_NOT_OPEN must win, and the routing error must never surface — an implementation
          that validates the body before the cycle state returns ERR_ROUTE_NOT_SERVED instead.
