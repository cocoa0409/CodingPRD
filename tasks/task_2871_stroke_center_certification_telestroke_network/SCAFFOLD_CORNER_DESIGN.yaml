    grounds:
    - complexity_profile.consistency_model immediate
    - state_machines.CodeStrokeCase ELIGIBILITY_DETERMINED -> THROMBOLYSIS_ADMINISTERED side_effects
    - endpoints.GET /stroke-network/deviations
    - calculations.clock_interval_metrics
    distinguishing_aspect: 'The row this write creates belongs to a DIFFERENT entity and has no direct endpoint of its own: a SYSTEM_DETECTED deviation is only reachable through the list filter. Immediate consistency therefore has to hold across an aggregate counter, a derived interval and a cascade-created row in another collection, all observable at the same clock instant as the administer call — and the administer response must already show deviation_count 1 rather than leaving it to a later recount.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement, one board-certified ON_CALL Neurologist.
      - 'Case CD at the spoke: door 08:00, last known well 07:40, imaging complete at 08:10 (door-to-imaging 10 minutes, comfortably inside DTI_TARGET_MIN so no DTI deviation exists), consult completed at 08:22 and a checklist with all four inclusion items and NO contraindications, determined ELIGIBLE.'
      - The case has deviation_count 0 and the deviations list filtered by this case is empty before the trigger.
      - The clock is then set to 09:10 — 70 minutes after the door — and never advanced again.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Nora Ainsley
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n1_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n1_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n1_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${spoke_id}
          patient_ref: P-CD-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cd_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:10:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${cd_id}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:14:00Z'
        as: ProgramCoordinator
      - call: GET /stroke-network/code-strokes/${cd_id}
        as: EdPhysician
        captures:
          cd_v: $.data.version
      - call: POST /stroke-network/consults
        payload:
          case_id: ${cd_id}
          agreement_id: ${agr_id}
          requested_privilege_scope: CONSULT_AND_THROMBOLYSIS
          expected_case_version: ${cd_v}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cd_k: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:16:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/consults/${cd_k}/accept
        payload: {}
        as: Neurologist
        as_user_id: ${n1_id}
      - call: POST /stroke-network/consults/${cd_k}/video-sessions
        payload:
          started_at: '2026-09-01T08:17:00Z'
          ended_at: '2026-09-01T08:21:00Z'
          video_quality: HD
          disconnect_count: 0
        as: Neurologist
        as_user_id: ${n1_id}
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:22:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/consults/${cd_k}/complete
        payload:
          recommendation: THROMBOLYSIS
          nihss_score: 12
        as: Neurologist
        as_user_id: ${n1_id}
      - call: POST /stroke-network/checklists
        payload:
          case_id: ${cd_id}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cd_ck: $.data.id
      - call: POST /stroke-network/checklists/${cd_ck}/inclusion-items
        payload:
          item_code: INC_ONSET_CONFIRMED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${cd_ck}/inclusion-items
        payload:
          item_code: INC_NIHSS_RECORDED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${cd_ck}/inclusion-items
        payload:
          item_code: INC_BP_CONTROLLED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${cd_ck}/inclusion-items
        payload:
          item_code: INC_ANTICOAG_REVIEWED
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /stroke-network/checklists/${cd_ck}/determine
        payload: {}
        as: Neurologist
        as_user_id: ${n1_id}
      - call: GET /stroke-network/code-strokes/${cd_id}
        as: EdPhysician
        captures:
          cd_dev0: $.data.deviation_count
          cd_v0: $.data.version
      - call: GET /stroke-network/deviations?case_id=${cd_id}&limit=10&offset=0
        payload:
          case_id: ${cd_id}
          limit: 10
          offset: 0
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:10:00Z'
        as: ProgramCoordinator
      trigger:
      - call: POST /stroke-network/code-strokes/${cd_id}/administer-thrombolytic
        payload:
          thrombolytic_agent: ALTEPLASE
          thrombolytic_dose_mg: 65.0
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cd_st: $.data.status
          cd_dtn: $.data.door_to_needle_minutes
          cd_lkw: $.data.lkw_to_needle_minutes
          cd_needle: $.data.needle_at
          cd_disp: $.data.disposition
          cd_win: $.data.thrombolytic_window_class
          cd_dev1: $.data.deviation_count
          cd_v1: $.data.version
      - call: GET /stroke-network/deviations?case_id=${cd_id}&limit=10&offset=0
        payload:
          case_id: ${cd_id}
          limit: 10
          offset: 0
        as: ProgramCoordinator
        captures:
          cd_d_type: $.data[0].deviation_type
          cd_d_sev: $.data[0].severity
          cd_d_src: $.data[0].source
          cd_d_st: $.data[0].status
          cd_d_by: $.data[0].opened_by_user_id
          cd_d_case: $.data[0].case_id
      - call: GET /stroke-network/code-strokes/${cd_id}
        as: EdPhysician
        captures:
          cd_dev2: $.data.deviation_count
          cd_dtn2: $.data.door_to_needle_minutes
          cd_v2: $.data.version
      - call: GET /stroke-network/deviations?case_id=${cd_id}&source=SYSTEM_DETECTED&severity=MAJOR&limit=10&offset=0
        payload:
          case_id: ${cd_id}
          source: SYSTEM_DETECTED
          severity: MAJOR
          limit: 10
          offset: 0
        as: ProgramCoordinator
      assert:
      - ${cd_dev0} == 0 and the pre-trigger deviations list has total_count 0
      - 'the administer response is self-contained: ${cd_st} == THROMBOLYSIS_ADMINISTERED, ${cd_disp} == TREATED_LOCAL, ${cd_needle} == 2026-09-01T09:10:00Z, ${cd_dtn} == 70, ${cd_lkw} == 90 and ${cd_win} == WITHIN_3H'
      - ${cd_dev1} == 1 IN THE SAME RESPONSE — the counter is not left for a later recount
      - 'the cascade-created row is immediately discoverable through the only channel it has: the list has total_count 1 with ${cd_d_type} == DTN_EXCEEDED, ${cd_d_sev} == MAJOR, ${cd_d_src} == SYSTEM_DETECTED, ${cd_d_st} == OPEN, ${cd_d_by} == system and ${cd_d_case} == ${cd_id}'
      - 'the re-read at the same clock instant agrees: ${cd_dev2} == 1 and ${cd_dtn2} == ${cd_dtn} == 70'
      - ${cd_v2} == ${cd_v1} == ${cd_v0} + 1 — one write, one version increment, and the read did not bump it again
      - the same row is returned when the list is filtered by source SYSTEM_DETECTED and severity MAJOR (total_count 1), so the cascade wrote a fully-formed row rather than a placeholder
