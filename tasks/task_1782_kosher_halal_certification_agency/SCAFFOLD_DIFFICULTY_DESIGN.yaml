            - { call: "POST /api/certificates/${certW}/issue", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/holiday-windows/${wW}/confirm", payload: { assigned_supervisor_id: "sup-9" }, as: CertificationReviewer, captures: { stW: $.data.status } }
          assert:
