      - name: location_class_aggregate_capacity_overlap
        grounds:
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - validations[priority=21]
          - entities.VehicleClass.fields.total_count
        distinguishing_aspect: |
          Aggregate-capacity overlap on a Location (different resource entity and different interval semantics
          than the pairwise Vehicle rule): with only one ECON vehicle at LAX, confirming a second reservation
          whose interval overlaps an already-CONFIRMED one is rejected with ERR_LOCATION_CLASS_CAPACITY.
        test_recipe:
          setup:
            - "Exactly one ECON vehicle at LAX. Reservation R1 [Jul 1, Jul 5) already CONFIRMED. R2 [Jul 2, Jul 6) is QUOTED and overlaps R1."
          setup_api_calls:
