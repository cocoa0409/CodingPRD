      - name: sm_compound_order_status_is_re_derived_downward_when_a_completed_child_is_scrapped
        claim_type: "Shape: compound"
        grounds:
          - state_machines.ProductionOrder.COMPLETE_to_IN_PRODUCTION
          - state_machines.FinishedUnit.build_status.SELLABLE_to_SCRAPPED
