            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "POST /recovery/liens/${l_id}/release", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "GET /recovery/liens/${l_id}", as: RecoverySpecialist, captures: { l_v2: $.data.version } }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 90000, expected_lien_version: "${l_v2}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LIEN_NOT_AMENDABLE (captured err), not ERR_SOL_EXPIRED"
