    description: "List pieces (filtered list; FK reverse-reachability for ChargePiece.charge_id)"
    roles: [PlantOperator, LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "charge_id?"]
    output: "ChargePiece[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/cycles"
    description: "List cycles (filtered list; FK reverse-reachability for TreatmentCycle.charge_id, TreatmentCycle.preservative_id)"
    roles: [PlantOperator, LabTechnician, QualityManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "charge_id?", "preservative_id?"]
    output: "TreatmentCycle[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/assays"
    description: "List assays (filtered list; FK reverse-reachability for RetentionAssay.charge_id, RetentionAssay.cycle_id)"
    roles: [LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer, PlantOperator]
    code: 200
    input: ["limit?", "offset?", "charge_id?", "cycle_id?"]
    output: "RetentionAssay[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/drip-logs"
    description: "List drip pad logs (filtered list; FK reverse-reachability for DripPadLog.charge_id)"
    roles: [PlantOperator, QualityManager, QualityAgencyInspector, ComplianceOfficer, LabTechnician]
    code: 200
    input: ["limit?", "offset?", "charge_id?", "containment_breach?"]
    output: "DripPadLog[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/warranties"
    description: "List warranties (filtered list; FK reverse-reachability for WarrantyRegistration.charge_id)"
    roles: [PlantOperator, QualityManager, AccountsReceivable, ComplianceOfficer, QualityAgencyInspector]
    code: 200
    input: ["limit?", "offset?", "status?", "charge_id?"]
    output: "WarrantyRegistration[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/slots"
    description: "List slots (filtered list; FK reverse-reachability for CylinderScheduleSlot.cylinder_id, CylinderScheduleSlot.charge_id)"
    roles: [PlantOperator, QualityManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "slot_kind?", "cylinder_id?", "charge_id?"]
    output: "CylinderScheduleSlot[]"
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical clock to the given ISO 8601 UTC timestamp.
      Server startup default (before any set_current_utc call) is exactly
      2026-08-01T00:00:00Z. Used to deterministically test time-gated rules
      (drip dwell, inspection windows, slot overlap boundaries).
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Server logical clock = to_iso8601"

  - method: POST
    path: "/_charges/{chargeId}/force-state"
    description: "Test-only: force a Charge into an arbitrary state (bypasses transitions). Used to construct corner-case fixtures."
    roles: [ComplianceOfficer]
    code: 200
    input: [target_status]
    output: Charge
    side_effects:
      - "Charge.status = target_status"
      - "increments charge.version by 1"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to call this endpoint" }

  # --- Generic request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, or invalid enum value" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "inspection_window_end must be > inspection_window_start; slot_end must be > slot_start; exited_pad_at must be > entered_pad_at" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum value not in the declared set (use_category, species_group, chemical_family, severity, etc.)" }

  # --- Not found ---
  - { id: ERR_PLANT_NOT_FOUND, http: 404, condition: "TreatmentPlant not found" }
  - { id: ERR_CYLINDER_NOT_FOUND, http: 404, condition: "TreatmentCylinder not found" }
  - { id: ERR_PRESERVATIVE_NOT_FOUND, http: 404, condition: "PreservativeConcentrate not found" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "CustomerAccount not found" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "Charge not found" }
  - { id: ERR_PIECE_NOT_FOUND, http: 404, condition: "ChargePiece not found" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "TreatmentCycle not found" }
  - { id: ERR_ASSAY_NOT_FOUND, http: 404, condition: "RetentionAssay not found" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "QualityInspection not found" }
  - { id: ERR_DRIP_LOG_NOT_FOUND, http: 404, condition: "DripPadLog not found" }
  - { id: ERR_WARRANTY_NOT_FOUND, http: 404, condition: "WarrantyRegistration not found" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "CylinderScheduleSlot not found" }

  # --- State ---
  - { id: ERR_PLANT_NOT_LICENSED, http: 409, condition: "Operation requires TreatmentPlant.status == LICENSED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition (resource not in a valid from-state)" }
  - { id: ERR_CYLINDER_NOT_IDLE, http: 409, condition: "Charge load requires cylinder IDLE" }
  - { id: ERR_CYLINDER_NOT_LOADED, http: 409, condition: "Cycle operations require cylinder LOADED" }
  - { id: ERR_CYCLE_NOT_RUNNING, http: 409, condition: "begin-drain requires cycle RUNNING" }
  - { id: ERR_CYCLE_NOT_DRAINING, http: 409, condition: "complete requires cycle DRAINING" }
  - { id: ERR_CHARGE_NOT_ASSAYED_PASS, http: 409, condition: "tag requires charge ASSAYED_PASS" }
  - { id: ERR_CHARGE_NOT_TAGGED, http: 409, condition: "warranty registration requires charge TAGGED" }
  - { id: ERR_CHARGE_NOT_ASSAYED_FAIL, http: 409, condition: "order-retreat requires charge ASSAYED_FAIL" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "begin requires inspection SCHEDULED" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "issue-findings requires inspection IN_PROGRESS" }
  - { id: ERR_PRESERVATIVE_QUARANTINED, http: 422, condition: "PreservativeConcentrate.status == QUARANTINED at cycle start" }
  - { id: ERR_SLOT_IN_PAST, http: 409, condition: "DELETE requires slot_start > now" }

  # --- Capacity / Scheduling ---
  - { id: ERR_CYLINDER_CAPACITY_EXCEEDED, http: 409, condition: "current_loaded_mbf + new_charge.volume_mbf > max_volume_mbf" }
  - { id: ERR_CYLINDER_SLOT_CONFLICT, http: 409, condition: "Effective slot (including buffer) intersects another effective slot on the same cylinder" }
  - { id: ERR_NO_SLOT_FOR_CHARGE, http: 409, condition: "Charge load requires a matching TREATMENT CylinderScheduleSlot covering now" }

  # --- Assay / Safety ---
  - { id: ERR_ASSAY_BELOW_WORKING_MINIMUM, http: 422, condition: "concentrate_assay_pct < min_working_assay_pct at cycle start" }
  - { id: ERR_ASSAY_CYCLE_MISMATCH, http: 422, condition: "RetentionAssay.cycle_id does not belong to the path charge" }
  - { id: ERR_INCISING_REQUIRED, http: 422, condition: "Charge requires_incising == true but not all pieces are incised" }
  - { id: ERR_DRIP_PAD_CONTAINMENT_BREACH, http: 422, condition: "Latest DripPadLog has containment_breach == true" }
  - { id: ERR_DRIP_DWELL_TOO_SHORT, http: 422, condition: "DripPadLog dwell time < 24 hours" }
  - { id: ERR_INSPECTION_WINDOW_MISSED, http: 409, condition: "now outside [inspection_window_start, inspection_window_end]" }
  - { id: ERR_RETREAT_NOT_PERMITTED, http: 422, condition: "Re-treat not permitted (last assay FAIL_GROSS or cycle_number >= 3)" }
  - { id: ERR_SLOT_CHARGE_INVALID, http: 422, condition: "CylinderScheduleSlot.charge_id references charge not in STAGED or RE_TREAT_PENDING" }

  # --- Fiscal ---
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "CustomerAccount.status == CREDIT_HOLD, or posting would push balance over credit_limit" }
  - { id: ERR_CUSTOMER_BALANCE_NOT_ZERO, http: 409, condition: "CustomerAccount close requires outstanding_balance_cents == 0" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_charge_version does not match Charge.version (OCC conflict)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlantOperator
    description: "Runs the physical plant: loads charges, runs cycles, tags lumber, books slots"
    identity: opaque
    exclusive_operations:
      - "POST /treatment-plants/{plantId}/cylinders — Register cylinder"
      - "POST /cylinders/{cylinderId}/mark-cleaned"
      - "POST /cylinders/{cylinderId}/decommission"
      - "POST /cylinders/{cylinderId}/charges — Load charge"
      - "POST /cylinders/{cylinderId}/cycles — Schedule cycle"
      - "POST /cycles/{cycleId}/start | begin-drain | complete | abort"
      - "POST /charges/{chargeId}/pieces/{pieceId}/incise"
      - "POST /charges/{chargeId}/tag"
      - "POST /charges/{chargeId}/warranty-registrations"
      - "POST /charges/{chargeId}/drip-pad-logs"
      - "POST /cylinders/{cylinderId}/slots — Book slot"
      - "DELETE /cylinders/{cylinderId}/slots/{slotId}"
    shared_operations:
      - "GET on all entities"

  - name: LabTechnician
    description: "Runs the wet lab: assays concentrates, records retention assays"
    identity: opaque
    exclusive_operations:
      - "POST /treatment-plants/{plantId}/preservatives — Register preservative"
      - "POST /preservatives/{preservativeId}/assay | replenish | quarantine | release-quarantine"
      - "POST /charges/{chargeId}/retention-assays"
    shared_operations:
      - "GET on all entities"

  - name: QualityManager
    description: "Plant-side quality owner; orders re-treats, rejects, scraps"
    identity: opaque
    exclusive_operations:
      - "POST /charges/{chargeId}/order-retreat"
      - "POST /charges/{chargeId}/reject"
      - "POST /charges/{chargeId}/scrap"
    shared_operations:
      - "GET on all entities"

  - name: QualityAgencyInspector
    description: "Third-party agency inspector (ALSC, SPIB, TPI, WCLIB)"
    identity: opaque
    exclusive_operations:
      - "POST /treatment-plants/{plantId}/inspections — Schedule"
      - "POST /inspections/{inspectionId}/begin | issue-findings | close"
    shared_operations:
      - "GET on all entities"

  - name: ComplianceOfficer
    description: "Regulator-level role; suspends/reinstates/revokes plant licenses"
    identity: opaque
    exclusive_operations:
      - "POST /treatment-plants — Register plant"
      - "POST /treatment-plants/{plantId}/suspend | reinstate | revoke"
      - "POST /_clock/set_current_utc"
      - "POST /_charges/{chargeId}/force-state"
    shared_operations:
      - "GET on all entities"

  - name: AccountsReceivable
    description: "Customer-facing finance: opens customer accounts, records payments"
    identity: opaque
    exclusive_operations:
      - "POST /customers — Open account"
      - "POST /customers/{customerId}/record-payment"
      - "POST /customers/{customerId}/close"
      - "POST /treatment-plants/{plantId}/settle-liability"
    shared_operations:
      - "GET on all entities"
