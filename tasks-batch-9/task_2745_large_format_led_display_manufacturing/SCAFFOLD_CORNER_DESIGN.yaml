            - "The commissioned FP16-STD wall: cabinet ${cab} holds ${m1} (A1, rank 0, 4900 nits, slot 1) and ${m2} (A1, 4950, slot 2); contract ${sc} is GOLD/ACTIVE with spare_required_count == 1."
