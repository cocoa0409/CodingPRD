      - name: certify_then_rescind_conserves_the_seat_ledger_total
        grounds:
          - calculations.governance_seat_allocation
          - state_machines.BoardApproval.CERTIFIED_to_RESCINDED
          - entities.Restructuring.fields.reserved_seat_pool
          - entities.Organization.fields.governance_seats
        distinguishing_aspect: |
          seat_ledger_total = reserved_seat_pool + the allocated_seats of every CERTIFIED
          approval must equal combined_board_seats = 15 at every observable instant: 15
          + 0 before either certification, 0 + 8 + 7 after both, and 7 + 8 after the
          target's certification is rescinded. The rescission is the compensating
          transition and must return exactly the seats it drew, reset the target's
          governance_seats to 0, and revert the deal from REGULATORY_REVIEW back to
          BOARD_APPROVAL. Returning a hardcoded half of the pool, or forgetting the
          organization-level reset, breaks the ledger without breaking any single row.
        test_recipe:
          setup:
            - "A Restructuring in status BOARD_APPROVAL with combined_board_seats 15 and reserved_seat_pool 15"
            - "An EXECUTED LetterOfIntent with board_seat_split_initiator 8, so the initiator is due 8 seats and the target 7"
            - "Two BoardApprovals already RECORDED with APPROVED decisions, one per party, neither certified yet"
