# =============================================================================
# Scaffold: Product Certification Testing, Follow-Up Inspection & Mark Licensing
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Product Certification Testing, Follow-Up Inspection & Mark Licensing (UL Solutions): standards selection for a product category with construction requirements and performance test protocols, sample submission and testing with construction records documenting every component and material, certification issuance with a listing report that constrains permitted variations, follow-up service where factories are inspected periodically to verify continued conformity with the certified construction, component substitution requests requiring evaluation before implementation, mark licensing with label authorization, counting and traceability, field evaluation of installed equipment that was never certified with jurisdictional acceptance, certification withdrawal and public notice when nonconformity is found, multi-jurisdiction acceptance and reciprocity arrangements

domain_name: product-certification-followup
api_prefix: /certification

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - pagination_with_filtering
  entity_topology: hybrid
  state_machine_shape: branching   # branching + cyclic loops + one parallel-dimension entity
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the certification client" }
      - { name: home_jurisdiction_code, type: string, source: input, description: "Jurisdiction code where the manufacturer is domiciled" }
      - { name: annual_revenue_tier, type: enum, source: input, description: "MICRO | SMALL | STANDARD | ENTERPRISE — drives fee discount" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED blocks new projects" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded at suspension; null while ACTIVE" }

  - name: Factory
    parent: Manufacturer
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: system, description: "FK -> Manufacturer.id; owning manufacturer" }
      - { name: site_code, type: string, source: input, description: "Factory site code; unique within the manufacturer" }
      - { name: country_code, type: string, source: input, description: "ISO country of the site" }
      - { name: jurisdiction_code, type: string, source: input, description: "Inspection jurisdiction code of the site" }
      - { name: conformity_regime, type: enum, source: computed, default: STANDARD, description: "STANDARD | PROBATION — selects conformity score variant and label quota variant" }
      - { name: conformity_score, type: number, source: computed, default: 100, description: "0..100 score per factory_conformity_score calculation" }
      - { name: open_critical_findings, type: integer, source: computed, default: 0, description: "Count of CRITICAL findings on non-VOIDED COMPLETED inspections of this factory" }
      - { name: last_inspection_completed_on, type: datetime, source: computed, description: "Completion timestamp of latest non-VOIDED COMPLETED inspection; null if none" }
      - { name: next_inspection_due_on, type: datetime, source: computed, description: "last_inspection_completed_on + interval from inspection_interval_derived; null before first inspection" }

  - name: Standard
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: string, source: input, description: "Product category code this standard belongs to" }
      - { name: standard_code, type: string, source: input, description: "Standard code, e.g. UL-60335; editions share (category_code, standard_code)" }
      - { name: edition_label, type: string, source: input, description: "Human edition label, e.g. 'Ed. 6'" }
      - { name: effective_from, type: datetime, source: input, description: "Start of effectiveness window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of effectiveness window (exclusive); null = open-ended" }
      - { name: construction_requirements, type: array, source: input, description: "Array of required component slot names, e.g. ['enclosure','power_supply']" }
      - { name: test_protocols, type: array, source: input, description: "Array of {protocol_code, name, mandatory, safety_critical, pass_threshold, base_fee_cents}" }
      - { name: status, type: enum, source: computed, description: "UPCOMING | ACTIVE | RETIRED — derived from logical clock vs [effective_from, effective_to); refreshed on clock sweep" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Unique authority code, e.g. 'US-OSHA', 'DE-LGA'" }
      - { name: name, type: string, source: input, description: "Authority having jurisdiction display name" }
      - { name: accepts_field_labels, type: boolean, source: input, description: "Whether this AHJ directly accepts field-evaluation labels" }
      - { name: accepts_reciprocity, type: boolean, source: input, description: "Whether this AHJ honors one-hop reciprocity" }
      - { name: reciprocity_sources, type: array, source: input, default: [], description: "Array of jurisdiction_codes accepted as reciprocity sources" }
      - { name: reciprocity_group, type: enum, source: input, default: NONE, description: "NONE | NATIONAL | BILATERAL_EU | CUSTOMS_UNION — reciprocity requires group equality unless NONE on both" }

  - name: CertificationProject
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: system, description: "FK -> Manufacturer.id; set from X-User-ID of the ManufacturerRep" }
      - { name: factory_id, type: string, source: input, description: "FK -> Factory.id; production site under certification" }
      - { name: category_code, type: string, source: input, description: "Product category code; must equal the selected standard's category_code" }
      - { name: standard_id, type: string, source: input, description: "FK -> Standard.id; pinned selected standard (immutable after creation)" }
      - { name: product_model, type: string, source: input, description: "Model designation under certification" }
      - { name: retest_count, type: integer, source: system, default: 0, description: "Number of RETEST decisions; drives fee surcharge" }
      - { name: fee_snapshot_cents, type: integer, source: computed, description: "Program fee computed by project_fee_calculation when entering EVALUATION; null before" }
      - { name: status, type: enum, source: system, description: "STANDARD_SELECTED | TESTING | EVALUATION | APPROVED | REJECTED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding CertificationReviewer; null until decided" }
      - { name: decided_on, type: datetime, source: system, description: "Decision timestamp; null until APPROVED/REJECTED" }

  - name: Sample
    parent: CertificationProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> CertificationProject.id" }
      - { name: serial_no, type: string, source: input, description: "Sample serial identifier supplied by the manufacturer" }
      - { name: condition, type: enum, source: input, description: "INTACT | DAMAGED — DAMAGED caps outcomes at CONDITIONAL and raises fee multiplier" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | TESTED" }
      - { name: triaged_by, type: string, source: system, description: "X-User-ID of TestEngineer who triaged; null until triaged" }
      - { name: results, type: array, source: system, default: [], description: "Append-only array of {protocol_code, measured_value, outcome, margin, recorded_by, recorded_at}" }

  - name: ConstructionRecord
    parent: CertificationProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> CertificationProject.id" }
      - { name: revision_no, type: integer, source: system, description: "1 + max existing revision_no for the project" }
      - { name: components, type: array, source: input, description: "Array of {slot, component_name, material, part_number, rating}; must cover every construction_requirements slot exactly once" }
      - { name: status, type: enum, source: system, description: "FROZEN | SUPERSEDED — exactly one FROZEN per project; created FROZEN, auto-SUPERSEDED by newer revision" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> CertificationProject.id; unique — one certification per approved project" }
      - { name: manufacturer_id, type: string, source: system, description: "FK -> Manufacturer.id (denormalized from project)" }
      - { name: factory_id, type: string, source: system, description: "FK -> Factory.id (denormalized from project)" }
      - { name: standard_id, type: string, source: system, description: "FK -> Standard.id (pinned from project)" }
      - { name: construction_record_id, type: string, source: system, description: "FK -> ConstructionRecord.id; pinned construction revision" }
      - { name: construction_record_revision, type: integer, source: system, description: "Pinned revision number of the construction record" }
      - { name: listing_number, type: string, source: system, description: "Server-minted listing number: 'E' + zero-padded 6-digit sequence in creation order" }
      - { name: permitted_variations, type: array, source: system, default: [], description: "Array of {slot, allowed_alternates[]} constraining permitted component variations" }
      - { name: issued_on, type: datetime, source: system, description: "Issuance timestamp (logical clock at approval)" }
      - { name: expires_on, type: datetime, source: system, description: "issued_on + validity_months from decision; null = no expiry" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | WITHDRAWN | EXPIRED" }
      - { name: suspension_causes, type: array, source: system, default: [], description: "Array of cause strings, e.g. 'MANUAL', 'CRITICAL_FINDING:<finding_ref>'; reinstate requires only MANUAL causes absent" }

  - name: SubstitutionRequest
    parent: Certification
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id" }
      - { name: slot, type: string, source: input, description: "Component slot proposed for substitution" }
      - { name: proposed_component, type: object, source: input, description: "{component_name, material, part_number, rating} of the substitute" }
      - { name: rationale, type: string, source: input, description: "Engineering rationale for the substitution" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | IMPLEMENTED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding CertificationReviewer; null until decided" }
      - { name: decided_on, type: datetime, source: system, description: "Decision timestamp; null until decided" }

  - name: FollowUpInspection
    parent: Factory
    common_fields: true
    fields:
      - { name: factory_id, type: string, source: system, description: "FK -> Factory.id" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned inspection instant; must be >= current logical time and >= 25 days from any other non-VOIDED inspection of the factory" }
      - { name: inspector_ref, type: string, source: system, description: "X-User-ID of the FactoryInspector who scheduled" }
      - { name: completed_on, type: datetime, source: system, description: "Completion timestamp (logical clock); null until COMPLETED" }
      - { name: result, type: enum, source: computed, description: "CONFORMING | MINOR_NC | MAJOR_NC | CRITICAL_NC — max severity over findings; CONFORMING when findings empty; null until COMPLETED" }
      - { name: findings, type: array, source: input, default: [], description: "Array of {finding_ref, certification_id?, severity, description}; severity CRITICAL | MAJOR | MINOR; certification_id optional, must belong to this factory when present" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OVERDUE | COMPLETED | VOIDED" }

  - name: MarkLicense
    parent: Certification
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id" }
      - { name: label_type, type: enum, source: input, description: "STANDARD | HOLOGRAM | SECURED" }
      - { name: declared_annual_volume, type: integer, source: input, description: "Manufacturer-declared annual production volume feeding the quota calculation" }
      - { name: quota_variant, type: enum, source: computed, description: "STANDARD_QUOTA | PROBATION_QUOTA — selected from factory conformity_regime at license creation" }
      - { name: authorized_quantity, type: integer, source: computed, description: "Authorized label count per label_quota_allocation" }
      - { name: used_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity over ISSUED (non-VOIDED) LabelBatches" }
      - { name: next_serial, type: integer, source: system, default: 1, description: "Next unallocated serial; monotonically increases, never rewound by voids" }
      - { name: serial_prefix, type: string, source: system, description: "listing_number + '-' + first letter of label_type" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | SUSPENDED | REVOKED" }

  - name: LabelBatch
    parent: MarkLicense
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> MarkLicense.id" }
      - { name: quantity, type: integer, source: input, description: "Labels in this batch; must be >= 1 and fit remaining quota" }
      - { name: serial_start, type: integer, source: computed, description: "= license.next_serial at issuance" }
      - { name: serial_end, type: integer, source: computed, description: "= serial_start + quantity - 1" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }

  - name: FieldEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: system, description: "FK -> Manufacturer.id; set from X-User-ID of the ManufacturerRep" }
      - { name: standard_id, type: string, source: input, description: "FK -> Standard.id; evaluation basis" }
      - { name: evaluating_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction under which the body evaluates" }
      - { name: site_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; AHJ where equipment is installed and which decides acceptance" }
      - { name: equipment_description, type: string, source: input, description: "Description of the installed, never-certified equipment" }
      - { name: site_address, type: string, source: input, description: "Installation address" }
      - { name: eval_status, type: enum, source: system, description: "REQUESTED | EVALUATED_PASS | EVALUATED_FAIL (parallel dimension 1)" }
      - { name: acceptance_status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED (parallel dimension 2)" }
      - { name: evaluated_by, type: string, source: system, description: "X-User-ID of evaluating TestEngineer; null until evaluated" }
      - { name: ahj_decided_by, type: string, source: system, description: "X-User-ID of AHJAuthority decider; null until decided" }
      - { name: label_issued_on, type: datetime, source: system, description: "Set when acceptance_status becomes ACCEPTED; null otherwise" }

  - name: WithdrawalNotice
    parent: Certification
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id" }
      - { name: reason_code, type: enum, source: input, description: "SAFETY | NONCONFORMITY | VOLUNTARY | MISUSE_OF_MARK" }
      - { name: public_text, type: string, source: input, description: "Public notice text" }
      - { name: published_on, type: datetime, source: system, description: "Logical time of publication; null while DRAFT" }
      - { name: effective_on, type: datetime, source: system, description: "published_on + 14 days; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | EFFECTIVE" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CertificationProject
    initial_state: STANDARD_SELECTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: STANDARD_SELECTED
        to: TESTING
        trigger: "system (automatic when the project's first Sample is triaged ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["Project becomes eligible to accumulate protocol results"]
      - from: TESTING
        to: EVALUATION
        trigger: "system (automatic when evaluation_readiness gate becomes satisfied after a result is recorded)"
        actor: system
        preconditions:
          - "every mandatory protocol of the pinned standard has at least one result recorded on a Sample with status in {ACCEPTED, TESTED}"
          - "exactly one ConstructionRecord with status FROZEN exists for the project"
        side_effects:
          - "fee_snapshot_cents computed via project_fee_calculation and stored"
      - from: EVALUATION
        to: APPROVED
        trigger: "POST /certification/projects/{id}/decide with outcome=APPROVED"
        actor: CertificationReviewer
        preconditions:
          - "decider X-User-ID differs from every results[].recorded_by on the project's samples (ERR_SEGREGATION_OF_DUTIES)"
          - "every safety_critical protocol's latest outcome is PASS (ERR_SAFETY_PROTOCOL_NOT_PASSED)"
          - "every mandatory protocol's latest outcome is in {PASS, CONDITIONAL} (ERR_MANDATORY_PROTOCOL_FAILING)"
        side_effects:
          - "create Certification: listing_number minted, construction record pinned (current FROZEN revision), permitted_variations from payload or [], issued_on = now, expires_on = now + validity_months when provided else null"
          - "decided_by / decided_on recorded"
      - from: EVALUATION
        to: REJECTED
        trigger: "POST /certification/projects/{id}/decide with outcome=REJECTED"
        actor: CertificationReviewer
        preconditions:
          - "decider X-User-ID differs from every results[].recorded_by on the project's samples (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by / decided_on recorded"]
      - from: EVALUATION
        to: TESTING
        trigger: "POST /certification/projects/{id}/decide with outcome=RETEST"
        actor: CertificationReviewer
        preconditions:
          - "decider X-User-ID differs from every results[].recorded_by on the project's samples (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "retest_count += 1"
          - "fee_snapshot_cents cleared to null (recomputed on next EVALUATION entry)"
        note: "cyclic retest loop: TESTING -> EVALUATION -> TESTING"

  - entity: Sample
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /certification/samples/{id}/triage with decision=ACCEPT"
        actor: TestEngineer
        preconditions: ["project status in {STANDARD_SELECTED, TESTING}"]
        side_effects:
          - "triaged_by recorded"
          - "if project was STANDARD_SELECTED: project -> TESTING"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certification/samples/{id}/triage with decision=REJECT"
        actor: TestEngineer
        preconditions: []
        side_effects: ["triaged_by recorded"]
      - from: ACCEPTED
        to: TESTED
        trigger: "system (automatic when the first result is recorded on the sample)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ConstructionRecord
    initial_state: FROZEN
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FROZEN
        to: SUPERSEDED
        trigger: "system (automatic when a newer ConstructionRecord revision is created for the same project, including via substitution implementation)"
        actor: system
        preconditions: []
        side_effects: []
        note: "exactly one FROZEN revision per project at all times after the first creation"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /certification/certifications/{id}/suspend, OR system cascade when a CRITICAL finding naming this certification is recorded on a COMPLETED inspection"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "suspension_causes gains 'MANUAL' (endpoint) or 'CRITICAL_FINDING:<finding_ref>' (cascade)"
          - "cascade: every MarkLicense of this certification in ACTIVE or EXHAUSTED -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /certification/certifications/{id}/reinstate, OR system cascade when an inspection void removes this certification's last CRITICAL_FINDING cause and no 'MANUAL' cause remains"
        actor: "ComplianceOfficer | system"
        preconditions:
          - "endpoint path only: open_critical_findings of the factory == 0 for findings naming this certification (ERR_OPEN_CRITICAL_FINDINGS)"
        side_effects:
          - "suspension_causes cleared"
          - "cascade: each SUSPENDED MarkLicense -> ACTIVE if used_quantity < authorized_quantity else EXHAUSTED"
        note: "ACTIVE -> SUSPENDED -> ACTIVE cycle"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system (clock sweep enforces a PUBLISHED WithdrawalNotice of this certification whose effective_on <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every non-REVOKED MarkLicense of this certification -> REVOKED"
          - "depth-3 cascade: on each REVOKED license, every ISSUED LabelBatch -> VOIDED and used_quantity recomputed"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "system (same withdrawal enforcement sweep)"
        actor: system
        preconditions: []
        side_effects: ["same cascades as ACTIVE -> WITHDRAWN"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when expires_on is not null and expires_on <= now)"
        actor: system
        preconditions: []
        side_effects: []
        note: "SUSPENDED certifications do not expire"

  - entity: SubstitutionRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, IMPLEMENTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /certification/substitution-requests/{id}/decide with outcome=APPROVE"
        actor: CertificationReviewer
        preconditions:
          - "slot exists among the pinned construction record's components (ERR_UNKNOWN_COMPONENT_SLOT)"
        side_effects: ["decided_by / decided_on recorded"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certification/substitution-requests/{id}/decide with outcome=REJECT"
        actor: CertificationReviewer
        preconditions: []
        side_effects: ["decided_by / decided_on recorded"]
      - from: APPROVED
        to: IMPLEMENTED
        trigger: "POST /certification/substitution-requests/{id}/implement"
        actor: ManufacturerRep
        preconditions:
          - "certification status == ACTIVE (ERR_CERTIFICATION_NOT_ACTIVE)"
          - "expected_certification_version matches certification.version (ERR_STALE_VERSION)"
        side_effects:
          - "new ConstructionRecord revision created on the certification's project: pinned components with the slot replaced by proposed_component; prior FROZEN revision -> SUPERSEDED"
          - "certification re-pins construction_record_id / construction_record_revision to the new revision"
          - "certification.permitted_variations gains {slot, allowed_alternates: [proposed_component.part_number]}"
          - "certification.version incremented by 1 (the standard mutation bump of this write)"

  - entity: FollowUpInspection
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (clock sweep when scheduled_for < now and not yet COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /certification/inspections/{id}/complete"
        actor: FactoryInspector
        preconditions:
          - "every finding's certification_id (when present) belongs to this factory (ERR_FINDING_CERTIFICATION_MISMATCH)"
        side_effects:
          - "completed_on = now; result = max severity over findings (CRITICAL > MAJOR > MINOR), CONFORMING when empty"
          - "factory conformity_score / conformity_regime / open_critical_findings / last_inspection_completed_on / next_inspection_due_on recomputed"
          - "for each CRITICAL finding naming a certification: that certification (if ACTIVE) -> SUSPENDED with cause 'CRITICAL_FINDING:<finding_ref>', cascading to its MarkLicenses"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /certification/inspections/{id}/complete"
        actor: FactoryInspector
        preconditions: ["same as SCHEDULED -> COMPLETED"]
        side_effects: ["same as SCHEDULED -> COMPLETED; lateness is observable via completed_on > scheduled_for"]
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /certification/inspections/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "findings of this inspection cease to count: factory conformity_score / conformity_regime / open_critical_findings / last_inspection_completed_on / next_inspection_due_on recomputed without them"
          - "compensation cascade: each certification whose suspension_causes contained only causes from this inspection's findings (and no 'MANUAL') -> ACTIVE, cascading to its SUSPENDED MarkLicenses"

  - entity: MarkLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when used_quantity reaches authorized_quantity after a batch issuance)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (automatic when a batch void drops used_quantity below authorized_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from certification suspension)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: SUSPENDED
        trigger: "system (cascade from certification suspension)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade from certification reinstatement when used_quantity < authorized_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXHAUSTED
        trigger: "system (cascade from certification reinstatement when used_quantity == authorized_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (cascade from certification withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["every ISSUED LabelBatch -> VOIDED; used_quantity recomputed"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (cascade from certification withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["every ISSUED LabelBatch -> VOIDED; used_quantity recomputed"]
      - from: EXHAUSTED
        to: REVOKED
        trigger: "system (cascade from certification withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["every ISSUED LabelBatch -> VOIDED; used_quantity recomputed"]

  - entity: LabelBatch
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /certification/label-batches/{id}/void, OR system cascade from license revocation"
        actor: "ManufacturerRep | system"
        preconditions: []
        side_effects:
          - "license.used_quantity -= quantity (used_quantity always equals the sum over ISSUED batches)"
          - "license.next_serial is NOT rewound"
          - "if license was EXHAUSTED and is not SUSPENDED/REVOKED: license -> ACTIVE"

  - entity: FieldEvaluation
    initial_state: REQUESTED   # eval_status dimension; acceptance_status starts PENDING
    terminal_states: [EVALUATED_FAIL]
    transitions:
      - from: REQUESTED
        to: EVALUATED_PASS
        trigger: "POST /certification/field-evaluations/{id}/evaluate with outcome=PASS"
        actor: TestEngineer
        preconditions: []
        side_effects: ["evaluated_by recorded"]
      - from: REQUESTED
        to: EVALUATED_FAIL
        trigger: "POST /certification/field-evaluations/{id}/evaluate with outcome=FAIL"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "evaluated_by recorded"
          - "acceptance_status stays PENDING but no acceptance decision may follow"
      - from: EVALUATED_PASS
        to: EVALUATED_PASS   # acceptance dimension: PENDING -> ACCEPTED (eval_status unchanged)
        trigger: "POST /certification/field-evaluations/{id}/decide-acceptance with decision=ACCEPT"
        actor: AHJAuthority
        preconditions:
          - "X-User-ID == site_jurisdiction_id (ERR_FORBIDDEN)"
          - "reciprocity_acceptance rule passes for the site jurisdiction (ERR_RECIPROCITY_NOT_GRANTED)"
        side_effects: ["acceptance_status = ACCEPTED", "label_issued_on = now", "ahj_decided_by recorded"]
        note: "parallel dimensions: eval_status and acceptance_status evolve on independent triggers"
      - from: EVALUATED_PASS
        to: EVALUATED_PASS   # acceptance dimension: PENDING -> REJECTED
        trigger: "POST /certification/field-evaluations/{id}/decide-acceptance with decision=REJECT"
        actor: AHJAuthority
        preconditions: ["X-User-ID == site_jurisdiction_id (ERR_FORBIDDEN)"]
        side_effects: ["acceptance_status = REJECTED", "ahj_decided_by recorded"]
      - from: EVALUATED_FAIL
        to: EVALUATED_FAIL   # acceptance dimension: PENDING -> REJECTED (ACCEPT impossible)
        trigger: "POST /certification/field-evaluations/{id}/decide-acceptance with decision=REJECT"
        actor: AHJAuthority
        preconditions: ["X-User-ID == site_jurisdiction_id (ERR_FORBIDDEN)"]
        side_effects: ["acceptance_status = REJECTED", "ahj_decided_by recorded"]

  - entity: WithdrawalNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /certification/withdrawal-notices/{id}/publish"
        actor: ComplianceOfficer
        preconditions: ["certification status in {ACTIVE, SUSPENDED}"]
        side_effects:
          - "published_on = now"
          - "effective_on = published_on + 14 days (NOTICE_PERIOD_DAYS)"
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "system (clock sweep when effective_on <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "certification -> WITHDRAWN, cascading to MarkLicenses (REVOKED) and their ISSUED LabelBatches (VOIDED)"

  - entity: Manufacturer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /certification/manufacturers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["suspension_reason recorded; new CertificationProject creation for this manufacturer is rejected with ERR_MANUFACTURER_SUSPENDED"]

# =============================================================================
# Concurrency Rules (OCC — see §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: construction-record-supersede-stale-project
    parent_entity: CertificationProject
    write_endpoint: "POST /certification/projects/{id}/construction-records"
    occ_field: expected_project_version
    description: |
      Creating a new ConstructionRecord revision against a CertificationProject
      whose version has advanced since the client last observed it is rejected.
      Creating a revision legitimately supersedes the previously FROZEN record,
      so a writer holding a stale project version would silently supersede a
      revision it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: substitution-implement-stale-certification
    parent_entity: Certification
    write_endpoint: "POST /certification/substitution-requests/{id}/implement"
    occ_field: expected_certification_version
    description: |
      Implementing an approved SubstitutionRequest against a Certification whose
      version has advanced since the client last observed it is rejected.
      Implementation re-pins the certification's construction revision, so a
      stale writer would re-pin on top of a certification state it never saw
      (e.g. after a suspend/reinstate cycle).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: test_outcome_determination
    trigger: "POST /certification/samples/{id}/results"
    algorithm: threshold
    formula: |
      threshold = protocol.pass_threshold
      band_floor = round_half_up(threshold * CONDITIONAL_BAND_PCT, 2)
      if sample.condition == DAMAGED:
        best_possible = CONDITIONAL            # DAMAGED caps: never PASS
      else:
        best_possible = PASS
      if measured_value >= threshold:
        raw = PASS
      elif measured_value >= band_floor:
        raw = CONDITIONAL
      else:
        raw = FAIL
      if raw == PASS and best_possible == CONDITIONAL:
        outcome = CONDITIONAL
      elif raw == CONDITIONAL and protocol.mandatory and protocol.safety_critical:
        outcome = FAIL                          # safety-critical protocols never yield CONDITIONAL
      else:
        outcome = raw
      margin = round_half_up(measured_value - threshold, 2)
    input_set: "the recorded measured_value, the protocol entry of the project's pinned standard, the sample's condition"
    constants:
      CONDITIONAL_BAND_PCT: 0.95
    precision: "margin: 2 decimal places, round_half_up"

  - name: project_fee_calculation
    trigger: "CertificationProject enters EVALUATION"
    algorithm: aggregation
    formula: |
      # Pinned evaluation/rounding order — per-line rounding BEFORE summation:
      lines = []
      for each protocol p in standard.test_protocols with a latest result (see evaluation_readiness):
        s = the sample carrying that latest result
        mult = DAMAGED_FEE_MULTIPLIER if s.condition == DAMAGED else 1.0
        lines.append(round_half_up(p.base_fee_cents * mult, 0))   # integer cents per line
      subtotal = sum(lines)
      discount = SMALL_CLIENT_DISCOUNT if manufacturer.annual_revenue_tier == "SMALL" else 0
      after_discount = round_half_up(subtotal * (1 - discount), 0)
      surcharge = round_half_up(after_discount * RETEST_SURCHARGE_PCT * project.retest_count, 0)
      fee_snapshot_cents = after_discount + surcharge
      # NOTE: summing unrounded lines first (30002.50) and then rounding yields
      # 30003 -> a different fee; the per-line-first order above is authoritative.
    input_set: "protocols of the pinned standard having a latest result, their carrying samples' condition, manufacturer tier, retest_count"
    constants:
      DAMAGED_FEE_MULTIPLIER: 1.25
      SMALL_CLIENT_DISCOUNT: 0.10
      RETEST_SURCHARGE_PCT: 0.5
    precision: "integer cents, round_half_up at each pinned rounding step"

  - name: evaluation_readiness
    trigger: "after every result recording, sample triage, and construction-record creation"
    algorithm: aggregation
    formula: |
      eligible_samples = samples of project with status in {ACCEPTED, TESTED}
      latest_outcome(p) = outcome of the result for protocol p across eligible_samples
        ordered by recorded_at ASC; ties broken by measured_value DESC
      ready = (for every mandatory protocol p: latest_outcome(p) exists)
              and (exactly one FROZEN ConstructionRecord exists for the project)
    input_set: "samples in {ACCEPTED, TESTED} only; REJECTED/SUBMITTED samples never contribute results"

  - name: factory_conformity_score
    trigger: "inspection completion, inspection void, and clock sweep (STANDARD-regime factories only on sweep)"
    algorithm: weighted_scoring
    formula: |
      penalty(f) = 40 if f.severity == CRITICAL; 15 if MAJOR; 5 if MINOR
      base = 100
      score = max(0, base - sum(penalty(f) for f in included_findings))
      # Regime transitions (evaluated after each completion/void):
      #   STANDARD -> PROBATION when new CRITICAL finding recorded or windowed score < PROBATION_THRESHOLD
      #   PROBATION -> STANDARD when a COMPLETED inspection has zero findings
      #     or when a void leaves no open CRITICAL findings and windowed score >= PROBATION_THRESHOLD
    input_set: "findings of non-VOIDED COMPLETED inspections of the factory; membership window per variant"
    constants:
      PENALTY_CRITICAL: 40
      PENALTY_MAJOR: 15
      PENALTY_MINOR: 5
      PROBATION_THRESHOLD: 70
      WINDOW_MONTHS: 24
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD_REGIME
        when: "factory.conformity_regime == STANDARD"
        difference: "included_findings = findings on inspections with completed_on >= now - 24 months (inclusive lower bound); aged-out findings stop counting"
      - name: PROBATION_REGIME
        when: "factory.conformity_regime == PROBATION"
        difference: "included_findings = ALL findings on non-VOIDED COMPLETED inspections regardless of age; time-invariant, so clock sweeps never recompute PROBATION scores"

  - name: label_quota_allocation
    trigger: "POST /certification/certifications/{id}/mark-licenses"
    algorithm: threshold
    formula: |
      if quota_variant == STANDARD_QUOTA:
        raw = min(floor(declared_annual_volume * 1.10), STANDARD_HARD_CAP)
      else:  # PROBATION_QUOTA
        raw = min(floor(declared_annual_volume * 0.25), PROBATION_HARD_CAP)
      authorized_quantity = max(MIN_LOT, floor(raw / 100) * 100)
    input_set: "declared_annual_volume from the request; quota_variant from the certification's factory conformity_regime at creation"
    constants:
      STANDARD_HARD_CAP: 100000
      PROBATION_HARD_CAP: 500
      MIN_LOT: 100
    precision: "integer labels"
    variants:
      - name: STANDARD_QUOTA
        when: "factory.conformity_regime == STANDARD at license creation"
        difference: "110% of declared volume, capped at 100000"
      - name: PROBATION_QUOTA
        when: "factory.conformity_regime == PROBATION at license creation"
        difference: "25% of declared volume, hard-capped at 500 — produces a far smaller authorization for identical volume"

  - name: serial_range_allocation
    trigger: "POST /certification/mark-licenses/{id}/label-batches"
    algorithm: aggregation
    formula: |
      remaining = license.authorized_quantity - license.used_quantity
      if quantity < 1: reject ERR_INVALID_LABEL_QUANTITY
      if quantity > remaining: reject ERR_LABEL_QUOTA_EXCEEDED   # exact fit (quantity == remaining) is allowed
      serial_start = license.next_serial
      serial_end = serial_start + quantity - 1
      license.next_serial += quantity
      license.used_quantity += quantity
      if license.used_quantity == license.authorized_quantity: license -> EXHAUSTED
    input_set: "the parent license; quantity from request"
    precision: "integer serials; next_serial never decreases (voids do not rewind)"

  - name: inspection_interval_derived
    trigger: "after factory_conformity_score recomputation"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (breaks the apparent score<->interval loop):
      #   1) recompute conformity_score  2) re-evaluate conformity_regime
      #   3) derive interval             4) next_inspection_due_on = last_inspection_completed_on + interval
      if conformity_regime == PROBATION or conformity_score < 70: interval = 3 months
      elif conformity_score < 90: interval = 6 months
      else: interval = 12 months
    input_set: "factory conformity_score, conformity_regime, last_inspection_completed_on"
    constants:
      INTERVAL_HIGH_MONTHS: 12
      INTERVAL_MID_MONTHS: 6
      INTERVAL_PROBATION_MONTHS: 3
    precision: "calendar-month addition on the completion date"

  - name: standard_edition_overlap
    trigger: "POST /certification/standards"
    algorithm: interval_merge
    formula: |
      # Half-open windows [effective_from, effective_to); null effective_to = open-ended.
      # Adjacency is allowed: a.effective_to == b.effective_from does NOT overlap.
      for each existing standard s with same (category_code, standard_code):
        overlap = (new.effective_from < coalesce(s.effective_to, +inf))
                  and (s.effective_from < coalesce(new.effective_to, +inf))
        if overlap: reject ERR_STANDARD_EDITION_OVERLAP
    input_set: "all standards sharing (category_code, standard_code), any status"
    precision: "strict inequality on both ends — touching windows are legal"

  - name: inspection_scheduling_gap
    trigger: "POST /certification/factories/{id}/inspections"
    algorithm: interval_merge
    formula: |
      # Buffer semantics (different from standard_edition_overlap): a minimum gap
      # is required BETWEEN instants — even exactly-adjacent scheduling is illegal.
      for each existing non-VOIDED inspection i of the factory (status SCHEDULED or OVERDUE or COMPLETED):
        if abs(new.scheduled_for - i.scheduled_for) < MIN_INSPECTION_GAP_DAYS days:
          reject ERR_INSPECTION_GAP_VIOLATION
      # A gap of exactly MIN_INSPECTION_GAP_DAYS days is allowed (>= passes).
    input_set: "non-VOIDED inspections of the same factory"
    constants:
      MIN_INSPECTION_GAP_DAYS: 25
    precision: "absolute difference in whole days; >= 25 passes"

  - name: reciprocity_acceptance
    trigger: "POST /certification/field-evaluations/{id}/decide-acceptance with decision=ACCEPT"
    algorithm: constraint_propagation
    formula: |
      J = site jurisdiction; E = evaluating jurisdiction
      accepted = J.accepts_field_labels
                 or (J.accepts_reciprocity
                     and E.jurisdiction_code in J.reciprocity_sources
                     and E.accepts_field_labels
                     and (J.reciprocity_group == E.reciprocity_group
                          or (J.reciprocity_group == NONE and E.reciprocity_group == NONE)))
      # One hop only: sources-of-sources are never consulted.
      if not accepted: reject ERR_RECIPROCITY_NOT_GRANTED
    input_set: "site and evaluating Jurisdiction records of the FieldEvaluation"
    precision: "boolean; no transitive closure"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be a declared role; for entity_backed roles X-User-ID must be the id of an instance of the backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is permitted on this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership/scope: ManufacturerRep may only mutate resources whose manufacturer_id equals X-User-ID (projects, samples, construction records, substitution requests, mark licenses, label batches, field evaluations); AHJAuthority X-User-ID must equal the field evaluation's site_jurisdiction_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "mutating endpoints on owned resources"
  - priority: 4
    category: existence
    check: "Path and body references exist (project, sample, certification, license, batch, inspection, notice, standard, factory, manufacturer, jurisdiction), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /certification/projects/{id}/construction-records, POST /certification/substitution-requests/{id}/implement"
  - priority: 6
    category: state
    check: "Target entity is in a state that admits the transition (project EVALUATION for decide: ERR_PROJECT_NOT_EVALUABLE; sample ACCEPTED/TESTED for results: ERR_SAMPLE_NOT_ACCEPTED; certification ACTIVE where required: ERR_CERTIFICATION_NOT_ACTIVE; license ACTIVE for batch issuance: ERR_LICENSE_NOT_ACTIVE; manufacturer ACTIVE at project creation: ERR_MANUFACTURER_SUSPENDED; standard ACTIVE at project creation: ERR_STANDARD_NOT_ACTIVE; evaluation passed before acceptance: ERR_FIELD_EVALUATION_NOT_PASSED; terminal entities reject all further transitions: ERR_ALREADY_TERMINAL; otherwise ERR_INVALID_STATE)"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | domain-specific state errors"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates at decision points: segregation of duties (project decider must not have recorded any result on the project); every safety_critical protocol's latest outcome must be PASS before approval"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_SAFETY_PROTOCOL_NOT_PASSED"
    http_status: 409
    applies_to: "POST /certification/projects/{id}/decide"
  - priority: 8
    category: business_referential
    check: "Cross-references are coherent: project category_code equals the standard's category_code (ERR_CATEGORY_STANDARD_MISMATCH); result protocol_code exists in the pinned standard (ERR_UNKNOWN_PROTOCOL_CODE); substitution slot exists in the pinned construction record (ERR_UNKNOWN_COMPONENT_SLOT); finding certification_id belongs to the inspected factory (ERR_FINDING_CERTIFICATION_MISMATCH); construction record covers every required slot exactly once (ERR_MISSING_REQUIRED_SLOT, ERR_DUPLICATE_COMPONENT_SLOT). The exactly-one-FROZEN-record requirement is enforced by the evaluation_readiness gate, not at decision time."
    error_id: "ERR_CATEGORY_STANDARD_MISMATCH | ERR_UNKNOWN_PROTOCOL_CODE | ERR_UNKNOWN_COMPONENT_SLOT | ERR_FINDING_CERTIFICATION_MISMATCH | ERR_MISSING_REQUIRED_SLOT | ERR_DUPLICATE_COMPONENT_SLOT"
    http_status: 422
    applies_to: "creation and decision endpoints with cross-references"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: standard edition half-open windows must not overlap within (category_code, standard_code); inspection scheduled_for >= now (ERR_INSPECTION_DATE_PAST) and >= 25 days from any non-VOIDED inspection of the factory (ERR_INSPECTION_GAP_VIOLATION)"
    error_id: "ERR_STANDARD_EDITION_OVERLAP | ERR_INSPECTION_DATE_PAST | ERR_INSPECTION_GAP_VIOLATION"
    http_status: 409
    applies_to: "POST /certification/standards, POST /certification/factories/{id}/inspections"
  - priority: 10
    category: business_constraint
    check: "Aggregate/structural rules: every mandatory protocol's latest outcome in {PASS, CONDITIONAL} at approval (ERR_MANDATORY_PROTOCOL_FAILING); reciprocity rule for field-label acceptance (ERR_RECIPROCITY_NOT_GRANTED)"
    error_id: "ERR_MANDATORY_PROTOCOL_FAILING | ERR_RECIPROCITY_NOT_GRANTED"
    http_status: 409
    applies_to: "decision endpoints"
  - priority: 11
    category: business_fiscal
    check: "Quota rules: label batch quantity >= 1 (ERR_INVALID_LABEL_QUANTITY) and fits remaining quota (ERR_LABEL_QUOTA_EXCEEDED)"
    error_id: "ERR_INVALID_LABEL_QUANTITY | ERR_LABEL_QUOTA_EXCEEDED"
    http_status: 422
    applies_to: "POST /certification/mark-licenses/{id}/label-batches"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/certification/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Sweep side effects: enforce due PUBLISHED withdrawal notices (effective_on <= now -> EFFECTIVE with cascades), expire ACTIVE certifications with expires_on <= now, mark SCHEDULED inspections with scheduled_for < now as OVERDUE, refresh Standard.status from effectiveness windows, recompute conformity_score for STANDARD-regime factories."
    roles: [CertificationBodyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["withdrawal enforcement cascade", "certification expiry", "inspection overdue marking", "standard status refresh", "STANDARD-regime conformity recompute"]

  # --- configuration ---
  - method: POST
    path: "/certification/standards"
    description: "Register a standard edition for a product category; rejects overlapping effectiveness windows for the same (category_code, standard_code)"
    roles: [CertificationBodyAdmin]
    code: 201
    input: [category_code, standard_code, edition_label, effective_from, "effective_to?", construction_requirements, test_protocols]
    output: Standard
    side_effects: ["status computed from current logical time"]
  - method: POST
    path: "/certification/jurisdictions"
    description: "Register a jurisdiction / AHJ with reciprocity arrangement"
    roles: [CertificationBodyAdmin]
    code: 201
    input: [jurisdiction_code, name, accepts_field_labels, accepts_reciprocity, "reciprocity_sources?", "reciprocity_group?"]
    output: Jurisdiction
    side_effects: []

  # --- manufacturers & factories ---
  - method: POST
    path: "/certification/manufacturers"
    description: "Register a manufacturer (certification client)"
    roles: [CertificationBodyAdmin]
    code: 201
    input: [legal_name, home_jurisdiction_code, annual_revenue_tier]
    output: Manufacturer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/certification/manufacturers/{id}"
    description: "Get a manufacturer"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []
  - method: POST
    path: "/certification/manufacturers/{id}/suspend"
    description: "Suspend a manufacturer; blocks new project creation"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Manufacturer
    side_effects: ["status=SUSPENDED", "suspension_reason recorded"]
  - method: POST
    path: "/certification/manufacturers/{id}/factories"
    description: "Register a factory for a manufacturer"
    roles: [CertificationBodyAdmin]
    code: 201
    input: [site_code, country_code, jurisdiction_code]
    output: Factory
    side_effects: ["conformity_regime=STANDARD, conformity_score=100"]
  - method: GET
    path: "/certification/manufacturers/{id}/factories"
    description: "List factories of a manufacturer"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: Factory[]
    side_effects: []
  - method: GET
    path: "/certification/factories/{id}"
    description: "Get a factory with computed conformity fields"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: Factory
    side_effects: []

  # --- certification projects ---
  - method: POST
    path: "/certification/projects"
    description: "Open a certification project with standards selection pinned (category + standard chosen at creation). manufacturer_id is set from X-User-ID."
    roles: [ManufacturerRep]
    code: 201
    input: [factory_id, category_code, standard_id, product_model]
    output: CertificationProject
    side_effects: ["status=STANDARD_SELECTED"]
  - method: GET
    path: "/certification/projects"
    description: "List/filter projects"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["manufacturer_id?", "factory_id?", "standard_id?", "status?", "limit?", "offset?"]
    output: CertificationProject[]
    side_effects: []
  - method: GET
    path: "/certification/projects/{id}"
    description: "Get a project"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: CertificationProject
    side_effects: []
  - method: POST
    path: "/certification/projects/{id}/decide"
    description: "Certification decision: APPROVED (issues Certification), REJECTED (terminal), or RETEST (loops back to TESTING, retest_count += 1)"
    roles: [CertificationReviewer]
    code: 200
    input: [outcome, "validity_months?", "permitted_variations?"]
    output: CertificationProject
    side_effects: ["on APPROVED: Certification created with pinned FROZEN construction record; fee_snapshot already stored at EVALUATION entry", "on RETEST: fee_snapshot cleared, retest_count incremented"]
  - method: POST
    path: "/certification/projects/{id}/samples"
    description: "Submit a test sample to a project"
    roles: [ManufacturerRep]
    code: 201
    input: [serial_no, condition]
    output: Sample
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/certification/projects/{id}/samples"
    description: "List samples of a project"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: Sample[]
    side_effects: []
  - method: POST
    path: "/certification/samples/{id}/triage"
    description: "Accept or reject a submitted sample"
    roles: [TestEngineer]
    code: 200
    input: [decision, "note?"]
    output: Sample
    side_effects: ["SUBMITTED -> ACCEPTED or REJECTED", "first ACCEPTED sample moves project STANDARD_SELECTED -> TESTING"]
  - method: POST
    path: "/certification/samples/{id}/results"
    description: "Record a protocol test result on an ACCEPTED/TESTED sample; outcome computed via test_outcome_determination"
    roles: [TestEngineer]
    code: 201
    input: [protocol_code, measured_value]
    output: Sample
    side_effects: ["result appended to sample.results with recorded_by", "first result moves sample ACCEPTED -> TESTED", "project auto-advances TESTING -> EVALUATION when evaluation_readiness is satisfied (fee_snapshot computed)"]
  - method: POST
    path: "/certification/projects/{id}/construction-records"
    description: "Create a new FROZEN construction-record revision (supersedes the previous FROZEN revision); OCC-guarded on the project version"
    roles: [ManufacturerRep]
    code: 201
    input: [components, expected_project_version]
    output: ConstructionRecord
    side_effects: ["prior FROZEN revision -> SUPERSEDED", "revision_no = max + 1", "increments CertificationProject.version by 1"]
  - method: GET
    path: "/certification/projects/{id}/construction-records"
    description: "List construction-record revisions of a project"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: ConstructionRecord[]
    side_effects: []

  # --- certifications ---
  - method: GET
    path: "/certification/certifications"
    description: "List/filter certifications (the listing reports)"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["project_id?", "manufacturer_id?", "factory_id?", "standard_id?", "construction_record_id?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: "/certification/certifications/{id}"
    description: "Get a certification"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: POST
    path: "/certification/certifications/{id}/suspend"
    description: "Suspend a certification; cascades to its mark licenses"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Certification
    side_effects: ["ACTIVE -> SUSPENDED with 'MANUAL' cause", "MarkLicenses ACTIVE/EXHAUSTED -> SUSPENDED"]
  - method: POST
    path: "/certification/certifications/{id}/reinstate"
    description: "Reinstate a suspended certification; blocked while CRITICAL findings naming it remain open"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Certification
    side_effects: ["SUSPENDED -> ACTIVE", "MarkLicenses SUSPENDED -> ACTIVE or EXHAUSTED by quota"]

  # --- substitution requests ---
  - method: POST
    path: "/certification/certifications/{id}/substitution-requests"
    description: "Request a component substitution against an ACTIVE certification; evaluation required before implementation"
    roles: [ManufacturerRep]
    code: 201
    input: [slot, proposed_component, rationale]
    output: SubstitutionRequest
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/certification/certifications/{id}/substitution-requests"
    description: "List substitution requests of a certification"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []
  - method: POST
    path: "/certification/substitution-requests/{id}/decide"
    description: "Evaluate and decide a substitution request (APPROVE/REJECT)"
    roles: [CertificationReviewer]
    code: 200
    input: [outcome, "note?"]
    output: SubstitutionRequest
    side_effects: ["SUBMITTED -> APPROVED or REJECTED"]
  - method: POST
    path: "/certification/substitution-requests/{id}/implement"
    description: "Implement an APPROVED substitution: freezes a new construction-record revision on the project and re-pins the certification; OCC-guarded on the certification version"
    roles: [ManufacturerRep]
    code: 200
    input: [expected_certification_version]
    output: SubstitutionRequest
    side_effects: ["new ConstructionRecord revision FROZEN, prior SUPERSEDED", "certification re-pinned to new revision", "permitted_variations extended", "increments Certification.version by 1"]

  # --- follow-up inspections ---
  - method: POST
    path: "/certification/factories/{id}/inspections"
    description: "Schedule a follow-up inspection; enforces the 25-day minimum gap against other non-VOIDED inspections of the factory"
    roles: [FactoryInspector]
    code: 201
    input: [scheduled_for]
    output: FollowUpInspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/certification/factories/{id}/inspections"
    description: "List inspections of a factory"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: FollowUpInspection[]
    side_effects: []
  - method: POST
    path: "/certification/inspections/{id}/complete"
    description: "Complete an inspection with findings; recomputes factory conformity and cascades CRITICAL findings to certifications and mark licenses"
    roles: [FactoryInspector]
    code: 200
    input: [findings, "note?"]
    output: FollowUpInspection
    side_effects: ["status -> COMPLETED; result derived from max severity", "factory conformity fields recomputed", "CRITICAL findings suspend named ACTIVE certifications and cascade to their licenses"]
  - method: POST
    path: "/certification/inspections/{id}/void"
    description: "Void a COMPLETED inspection as a correction; unwinds all finding side effects (compensating action)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: FollowUpInspection
    side_effects: ["status -> VOIDED", "factory conformity recomputed without this inspection's findings", "certifications suspended solely by this inspection's findings are reinstated, cascading to licenses"]

  # --- mark licenses & label batches ---
  - method: POST
    path: "/certification/certifications/{id}/mark-licenses"
    description: "Authorize a mark license with a label quota computed from the factory's conformity regime"
    roles: [ManufacturerRep]
    code: 201
    input: [label_type, declared_annual_volume]
    output: MarkLicense
    side_effects: ["quota_variant selected", "authorized_quantity computed", "serial_prefix minted, next_serial=1, used_quantity=0"]
  - method: GET
    path: "/certification/certifications/{id}/mark-licenses"
    description: "List mark licenses of a certification"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: MarkLicense[]
    side_effects: []
  - method: GET
    path: "/certification/mark-licenses/{id}"
    description: "Get a mark license with quota usage"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: MarkLicense
    side_effects: []
  - method: POST
    path: "/certification/mark-licenses/{id}/label-batches"
    description: "Issue a batch of mark labels with serial-range allocation; enforces quota"
    roles: [ManufacturerRep]
    code: 201
    input: [quantity]
    output: LabelBatch
    side_effects: ["serial_start/serial_end allocated", "license.used_quantity and next_serial advanced", "license -> EXHAUSTED when quota reached"]
  - method: GET
    path: "/certification/mark-licenses/{id}/label-batches"
    description: "List label batches of a license (traceability)"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: LabelBatch[]
    side_effects: []
  - method: POST
    path: "/certification/label-batches/{id}/void"
    description: "Void an ISSUED batch; quantity returns to the license quota (serials are never reused)"
    roles: [ManufacturerRep]
    code: 200
    input: [reason]
    output: LabelBatch
    side_effects: ["ISSUED -> VOIDED", "license.used_quantity recomputed", "EXHAUSTED license -> ACTIVE"]

  # --- field evaluations ---
  - method: POST
    path: "/certification/field-evaluations"
    description: "Request a field evaluation of installed, never-certified equipment. manufacturer_id is set from X-User-ID."
    roles: [ManufacturerRep]
    code: 201
    input: [standard_id, evaluating_jurisdiction_id, site_jurisdiction_id, equipment_description, site_address]
    output: FieldEvaluation
    side_effects: ["eval_status=REQUESTED, acceptance_status=PENDING"]
  - method: GET
    path: "/certification/field-evaluations"
    description: "List/filter field evaluations"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["manufacturer_id?", "standard_id?", "evaluating_jurisdiction_id?", "site_jurisdiction_id?", "limit?", "offset?"]
    output: FieldEvaluation[]
    side_effects: []
  - method: GET
    path: "/certification/field-evaluations/{id}"
    description: "Get a field evaluation"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: []
    output: FieldEvaluation
    side_effects: []
  - method: POST
    path: "/certification/field-evaluations/{id}/evaluate"
    description: "Record the engineering evaluation outcome (PASS/FAIL) against the referenced standard"
    roles: [TestEngineer]
    code: 200
    input: [outcome, "notes?"]
    output: FieldEvaluation
    side_effects: ["eval_status -> EVALUATED_PASS or EVALUATED_FAIL"]
  - method: POST
    path: "/certification/field-evaluations/{id}/decide-acceptance"
    description: "AHJ decides jurisdictional acceptance of the field label; ACCEPT applies the one-hop reciprocity rule"
    roles: [AHJAuthority]
    code: 200
    input: [decision, "basis?"]
    output: FieldEvaluation
    side_effects: ["acceptance_status -> ACCEPTED (label_issued_on set) or REJECTED"]

  # --- withdrawal notices ---
  - method: POST
    path: "/certification/certifications/{id}/withdrawal-notices"
    description: "Draft a public withdrawal notice for a certification"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason_code, public_text]
    output: WithdrawalNotice
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/certification/certifications/{id}/withdrawal-notices"
    description: "List withdrawal notices of a certification"
    roles: [CertificationBodyAdmin, ManufacturerRep, TestEngineer, CertificationReviewer, FactoryInspector, ComplianceOfficer, AHJAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: WithdrawalNotice[]
    side_effects: []
  - method: POST
    path: "/certification/withdrawal-notices/{id}/publish"
    description: "Publish a notice; sets published_on = now and effective_on = now + 14 days (cooling-off before enforcement)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WithdrawalNotice
    side_effects: ["DRAFT -> PUBLISHED", "enforcement occurs via clock sweep at effective_on"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or entity_backed role id not found" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed actor does not own the target resource (manufacturer mismatch, or AHJ is not the site jurisdiction)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is in a state that does not admit the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is in a terminal state (REJECTED/WITHDRAWN/EXPIRED/VOIDED/IMPLEMENTED/EVALUATED_FAIL)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_MANUFACTURER_SUSPENDED, http: 409, condition: "New project creation while manufacturer status is SUSPENDED" }
  - { id: ERR_CATEGORY_STANDARD_MISMATCH, http: 422, condition: "Project category_code differs from the selected standard's category_code" }
  - { id: ERR_STANDARD_NOT_ACTIVE, http: 409, condition: "Selected standard is UPCOMING or RETIRED at project creation time" }
  - { id: ERR_STANDARD_EDITION_OVERLAP, http: 409, condition: "New standard edition's half-open effectiveness window overlaps an existing edition of the same (category_code, standard_code)" }
  - { id: ERR_UNKNOWN_PROTOCOL_CODE, http: 422, condition: "Result references a protocol_code not declared in the pinned standard" }
  - { id: ERR_SAMPLE_NOT_ACCEPTED, http: 409, condition: "Result recorded on a sample not in ACCEPTED/TESTED (SUBMITTED or REJECTED)" }
  - { id: ERR_PROJECT_NOT_EVALUABLE, http: 409, condition: "decide called while project is not in EVALUATION" }
  - { id: ERR_SAFETY_PROTOCOL_NOT_PASSED, http: 409, condition: "A safety_critical protocol's latest outcome is not PASS at approval" }
  - { id: ERR_MANDATORY_PROTOCOL_FAILING, http: 409, condition: "A mandatory protocol's latest outcome is FAIL at approval" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "The deciding reviewer recorded at least one test result on the project" }
  - { id: ERR_MISSING_REQUIRED_SLOT, http: 422, condition: "Construction record omits a slot required by the standard's construction_requirements" }
  - { id: ERR_DUPLICATE_COMPONENT_SLOT, http: 422, condition: "Construction record lists the same slot twice" }
  - { id: ERR_UNKNOWN_COMPONENT_SLOT, http: 422, condition: "Substitution slot not present in the pinned construction record's components" }
  - { id: ERR_CERTIFICATION_NOT_ACTIVE, http: 409, condition: "Operation requires certification status ACTIVE" }
  - { id: ERR_OPEN_CRITICAL_FINDINGS, http: 409, condition: "Reinstatement blocked by open CRITICAL findings naming this certification" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Label batch issuance requires license status ACTIVE" }
  - { id: ERR_LABEL_QUOTA_EXCEEDED, http: 422, condition: "Batch quantity exceeds remaining quota (used + quantity > authorized); exact fit is allowed" }
  - { id: ERR_INVALID_LABEL_QUANTITY, http: 400, condition: "Batch quantity < 1" }
  - { id: ERR_INSPECTION_DATE_PAST, http: 422, condition: "scheduled_for is before the current logical time" }
  - { id: ERR_INSPECTION_GAP_VIOLATION, http: 409, condition: "scheduled_for is within 25 days of another non-VOIDED inspection of the same factory" }
  - { id: ERR_FINDING_CERTIFICATION_MISMATCH, http: 422, condition: "A finding's certification_id does not belong to the inspected factory" }
  - { id: ERR_RECIPROCITY_NOT_GRANTED, http: 409, condition: "Site jurisdiction neither accepts field labels directly nor honors the evaluating jurisdiction via one-hop reciprocity" }
  - { id: ERR_FIELD_EVALUATION_NOT_PASSED, http: 409, condition: "Acceptance decision requires eval_status EVALUATED_PASS (ACCEPT) or any evaluated status (REJECT)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CertificationBodyAdmin
    description: "Certification body administrator: registers standards, jurisdictions, manufacturers, factories; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /certification/_clock/set_current_utc"
      - "POST /certification/standards"
      - "POST /certification/jurisdictions"
      - "POST /certification/manufacturers"
      - "POST /certification/manufacturers/{id}/factories"
    shared_operations: ["all GET endpoints"]
  - name: ManufacturerRep
    description: "Representative of a manufacturer; X-User-ID equals the Manufacturer id. Opens projects, submits samples and construction records, requests substitutions, mark licenses, label batches, and field evaluations"
    identity: "entity_backed:Manufacturer"
    exclusive_operations:
      - "POST /certification/projects"
      - "POST /certification/projects/{id}/samples"
      - "POST /certification/projects/{id}/construction-records"
      - "POST /certification/certifications/{id}/substitution-requests"
      - "POST /certification/substitution-requests/{id}/implement"
      - "POST /certification/certifications/{id}/mark-licenses"
      - "POST /certification/mark-licenses/{id}/label-batches"
      - "POST /certification/label-batches/{id}/void"
      - "POST /certification/field-evaluations"
    shared_operations: ["all GET endpoints"]
  - name: TestEngineer
    description: "Laboratory engineer: triages samples, records test results, evaluates field equipment"
    identity: opaque
    exclusive_operations:
      - "POST /certification/samples/{id}/triage"
      - "POST /certification/samples/{id}/results"
      - "POST /certification/field-evaluations/{id}/evaluate"
    shared_operations: ["all GET endpoints"]
  - name: CertificationReviewer
    description: "Certification decision-maker; segregated from test-result recording (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /certification/projects/{id}/decide"
      - "POST /certification/substitution-requests/{id}/decide"
    shared_operations: ["all GET endpoints"]
  - name: FactoryInspector
    description: "Follow-up service inspector: schedules and completes factory inspections"
    identity: opaque
    exclusive_operations:
      - "POST /certification/factories/{id}/inspections"
      - "POST /certification/inspections/{id}/complete"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Compliance officer: suspends/reinstates certifications and manufacturers, voids inspections, drafts and publishes withdrawal notices"
    identity: opaque
    exclusive_operations:
      - "POST /certification/manufacturers/{id}/suspend"
      - "POST /certification/certifications/{id}/suspend"
      - "POST /certification/certifications/{id}/reinstate"
      - "POST /certification/inspections/{id}/void"
      - "POST /certification/certifications/{id}/withdrawal-notices"
      - "POST /certification/withdrawal-notices/{id}/publish"
    shared_operations: ["all GET endpoints"]
  - name: AHJAuthority
    description: "Authority having jurisdiction; X-User-ID equals the Jurisdiction id. Decides field-evaluation acceptance for installations in its jurisdiction"
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /certification/field-evaluations/{id}/decide-acceptance"
    shared_operations: ["all GET endpoints"]
