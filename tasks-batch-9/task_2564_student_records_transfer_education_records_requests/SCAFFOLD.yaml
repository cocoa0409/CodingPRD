  # ---- students -------------------------------------------------------------------------
  - method: POST
    path: "/records-office/students"
    description: >
      Enrolls a student in a district and mints the student's records skeleton in the same
      transaction.
    roles: [SystemAdmin, RecordsClerk]
    code: 201
    input: [district_id, first_name, last_name, dob, grade_level, "has_iep?", guardian_user_id, "student_user_id?"]
    output: Student
    side_effects:
      - "enrollment_status := ENROLLED; has_iep defaults to false"
      - "is_eligible_student computed per calculations.eligible_student_status against clock_now"
      - "directory_optout_deadline_at := created_at + StateRecordsRule[district.state_code].directory_optout_grace_days calendar days; directory_optout_effective := false"
      - "exactly one CumulativeFile is minted with assembly_status NOT_STARTED, required_component_types [ACADEMIC, HEALTH, DISCIPLINE] plus SPECIAL_EDUCATION when has_iep == true, and all page counters 0"
      - "FOUR FileComponent rows are minted — one per component_type — each with status PENDING, page_count 0 and is_required set from required_component_types; a non-required SPECIAL_EDUCATION component may still be collected, certified and priced, it simply does not gate completeness"
      - "no RetentionSchedule exists yet; it is minted only when the withdrawal completes"
  - method: GET
    path: "/records-office/students"
    description: "Lists students with filters; the FK-reverse channel from District to Student."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, ReceivingRegistrar]
    code: 200
    input: ["district_id?", "enrollment_status?", "has_iep?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/records-office/students/{id}"
    description: "Reads one student including is_eligible_student, directory opt-out state and records_disposition_date."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, ReceivingRegistrar, Parent, EligibleStudent]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: "/records-office/students/{id}/directory-optout"
    description: >
      Files a directory-information opt-out for the listed categories. Effective only inside the
      grace window; the boundary at directory_optout_deadline_at is inclusive.
    roles: [Parent, EligibleStudent]
    code: 200
    input: [directory_optout_categories]
    output: Student
    side_effects:
      - "directory_optout_received_at := clock_now; directory_optout_categories stored sorted in the fixed order [NAME, ADDRESS, PHONE, PHOTO, HONORS, SPORTS_PARTICIPATION]"
      - "directory_optout_effective := (directory_optout_received_at <= directory_optout_deadline_at)"
  - method: POST
    path: "/records-office/students/{id}/directory-disclosures"
    description: "Logs a release of directory information to a third party. Refused for opted-out categories."
    roles: [RecordsClerk, RecordsOfficer]
    code: 201
    input: [recipient_name, disclosed_categories, "legitimate_interest_note?"]
    output: DisclosureLogEntry
    side_effects:
      - "a DisclosureLogEntry is appended with disclosure_type DIRECTORY_INFORMATION, source_type STUDENT_DIRECTORY, source_id := Student.id, page_count 0, disclosed_at := clock_now, logged_by_user_id := X-User-ID"
      - "when the student has a RetentionSchedule, its last_activity_at and destruction_eligible_at are recomputed and Student.records_disposition_date is re-mirrored"
  - method: GET
    path: "/records-office/students/{id}/disclosure-log"
    description: >
      The student's append-only FERPA disclosure log, newest last. This is the only discovery
      channel for DisclosureLogEntry rows, all of which are cascade-created.
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, Parent, EligibleStudent]
    code: 200
    input: ["disclosure_type?", "source_type?", "limit?", "offset?"]
    output: DisclosureLogEntry[]
    side_effects: []

  # ---- withdrawal ------------------------------------------------------------------------
  - method: POST
    path: "/records-office/students/{id}/withdrawals"
    description: "Opens a withdrawal for an enrolled student and moves the student to WITHDRAWAL_PENDING."
    roles: [RecordsClerk]
    code: 201
    input: [effective_date, destination_district_code, withdrawal_reason]
    output: Withdrawal
    side_effects:
      - "status := CLEARED; hold_count := 0; active_hold_types := []"
      - "Student.enrollment_status := WITHDRAWAL_PENDING"
      - "destination_district_code is stored as a free natural-key string and is NOT required to match any registered District"
  - method: GET
    path: "/records-office/students/{id}/withdrawals"
    description: "Lists the student's withdrawals, newest last."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, ReceivingRegistrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Withdrawal[]
    side_effects: []
  - method: GET
    path: "/records-office/withdrawals/{id}"
    description: "Reads one withdrawal including its hold set."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []
  - method: POST
    path: "/records-office/withdrawals/{id}/holds"
    description: "Places an exit hold, blocking completion until every hold is released."
    roles: [RecordsClerk]
    code: 200
    input: [hold_type]
    output: Withdrawal
    side_effects:
      - "hold_type appended to active_hold_types, re-sorted ascending by enum name; hold_count := len(active_hold_types); status := HOLD"
  - method: POST
    path: "/records-office/withdrawals/{id}/hold-releases"
    description: "Releases one exit hold. The final release returns the withdrawal to CLEARED."
    roles: [RecordsClerk]
    code: 200
    input: [hold_type]
    output: Withdrawal
    side_effects:
      - "hold_type removed from active_hold_types; hold_count := len(active_hold_types)"
      - "when hold_count reaches 0 the status returns to CLEARED (the CLEARED -> HOLD -> CLEARED cycle)"
  - method: POST
    path: "/records-office/withdrawals/{id}/complete"
    description: >
      Completes the withdrawal. Fires the five-link cascade: Withdrawal COMPLETED -> Student
      WITHDRAWN + exit_effective_date -> CumulativeFile IN_ASSEMBLY -> RetentionSchedule minted ->
      Student.records_disposition_date mirrored.
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "status := COMPLETED; completed_at := clock_now"
      - "Student.enrollment_status := WITHDRAWN; Student.exit_effective_date := Withdrawal.effective_date"
      - "the student's CumulativeFile transitions NOT_STARTED -> IN_ASSEMBLY"
      - "a RetentionSchedule is minted with status ACTIVE, destruction_min_age_years copied from the district's state rule, and both eligible dates computed"
      - "Student.records_disposition_date := RetentionSchedule.destruction_eligible_at"

  # ---- cumulative file + components -------------------------------------------------------
  - method: GET
    path: "/records-office/students/{id}/cumulative-files"
    description: "The student's cumulative file as a one-element array (the FK-reverse channel from Student)."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, Parent, EligibleStudent]
    code: 200
    input: ["limit?", "offset?"]
    output: CumulativeFile[]
    side_effects: []
  - method: GET
    path: "/records-office/cumulative-files/{id}"
    description: "Reads the file's derived assembly_status, completeness_pct, page-custody counters and version."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, Parent, EligibleStudent]
    code: 200
    input: []
    output: CumulativeFile
    side_effects: []
  - method: GET
    path: "/records-office/cumulative-files/{id}/components"
    description: >
      Lists the file's four components in the fixed order [ACADEMIC, HEALTH, DISCIPLINE,
      SPECIAL_EDUCATION]. The FK-reverse channel from CumulativeFile and the only way to learn a
      cascade-created component's id.
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, Parent, EligibleStudent]
    code: 200
    input: ["status?", "component_type?", "limit?", "offset?"]
    output: FileComponent[]
    side_effects: []
  - method: PATCH
    path: "/records-office/cumulative-files/{id}/components/{component_id}"
    description: >
      Drives the component's whole lifecycle by target status: COLLECTED (collect or reinstate),
      CERTIFIED (certify), EXCLUDED (exclude with a reason). Every accepted call increments the
      parent CumulativeFile.version, which is what mark-ready's OCC token is taken against.
    roles: [RecordsClerk, RecordsOfficer]
    code: 200
    input: [status, "page_count?", "redacted_page_count?", "exclusion_reason?"]
    output: FileComponent
    side_effects:
      - "PENDING -> COLLECTED requires page_count; disclosable_page_count := page_count - redacted_page_count (redacted_page_count defaults to 0)"
      - "COLLECTED -> CERTIFIED sets certified_by_user_id := X-User-ID and certified_at := clock_now"
      - "{COLLECTED, CERTIFIED} -> EXCLUDED requires exclusion_reason and moves page_count from included_page_count to excluded_page_count, leaving total_page_count untouched"
      - "EXCLUDED -> COLLECTED restores the page-custody identity exactly and clears exclusion_reason"
      - "parent CumulativeFile counters, completeness_pct and assembly_status are re-derived, and version += 1, on every accepted call"
      - "when the parent leaves COMPLETE, every READY_FOR_RELEASE RecordsRequest of the student reverts to ASSEMBLING with reopen_count += 1 and packet_status := VOID"
  - method: GET
    path: "/records-office/cumulative-files/{id}/retention-schedules"
    description: >
      The file's retention schedule as a zero-or-one element array — zero before the withdrawal
      completes. The FK-reverse channel from CumulativeFile to its cascade-created schedule.
    roles: [SystemAdmin, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetentionSchedule[]
    side_effects: []

