      - name: frozen_unit_and_missing_demonstration_errors_are_both_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNIT_FROZEN
          - errors.ERR_EXTENSION_DEMONSTRATION_MISSING
        excluded_because:
          difficulty_instance: unit_frozen_outranks_missing_extension_demonstration
          rationale: "That instance triggers both conditions on the same request to prove the priority order, then clears the freeze to observe ERR_EXTENSION_DEMONSTRATION_MISSING alone."

      - name: agreement_state_and_committed_tons_errors_are_both_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_AGREEMENT_STATE
          - errors.ERR_COMMITTED_TONS_EXCEEDED
        excluded_because:
          difficulty_instance: agreement_state_outranks_committed_tons_ceiling_on_shipment
          rationale: "That instance ships against a non-ACTIVE agreement with an over-ceiling tonnage and asserts the state error, then repeats the tonnage alone on an ACTIVE agreement."

      - name: ash_quality_specification_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASH_QUALITY_FAILS_SPEC
        excluded_because:
          difficulty_instance: loi_exactly_six_percent_meets_class_f_and_six_point_zero_one_fails
          rationale: "That instance qualifies an agreement at exactly the Class F loss-on-ignition ceiling and takes ERR_ASH_QUALITY_FAILS_SPEC one hundredth of a percent above it."

      - name: network_certification_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NETWORK_NOT_CERTIFIED
          - errors.ERR_INSUFFICIENT_DOWNGRADIENT_WELLS
        excluded_because:
          difficulty_instance: exactly_three_downgradient_wells_certifies_network_and_two_does_not
          rationale: "That instance certifies at exactly three downgradient wells and takes both the well-count error at two and the downstream ERR_NETWORK_NOT_CERTIFIED on an uncertified program."

      - name: license_state_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LICENSE_NOT_ACTIVE
        excluded_because:
          difficulty_instance: stability_certification_gated_by_the_signing_professionals_license_state
          rationale: "That instance suspends and restores the signing professional's license around one otherwise identical certification call."

      - name: unit_restricted_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNIT_RESTRICTED
          - errors.ERR_REMEDY_REQUIRES_REMOVAL
        excluded_because:
          difficulty_instance: in_place_approval_gated_by_the_monitoring_programs_corrective_action_phase
          rationale: "That instance drives the program into CORRECTIVE_ACTION so an in-place approval is refused, which is the only path that reaches both the restriction and the remedy error."

      - name: sample_interval_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SAMPLE_INTERVAL_TOO_SHORT
        excluded_because:
          difficulty_instance: sampling_interval_window_is_half_open_at_exactly_ninety_days
          rationale: "That instance sits on the interval boundary, taking the error at eighty-nine days and passing at exactly ninety."

      - name: commitment_overlap_and_inventory_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REUSE_COMMITMENT_OVERLAP
          - errors.ERR_ASH_TONS_EXCEED_INVENTORY
        excluded_because:
          difficulty_instance: adjacent_commitment_windows_touching_at_one_endpoint_exceed_the_ash_inventory
          rationale: "That instance uses windows that touch at a single endpoint, which is the only configuration that separates the overlap error from the aggregate inventory error."

  - section: rbac
    instances:
      - name: each_role_cannot_perform_another_roles_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles.UtilityAdmin.exclusive_operations
          - roles.Regulator.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.StatisticalReviewer.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The seven roles are peers, not a hierarchy: the Regulator who approves plans still cannot create a
          unit, the UtilityAdmin who owns the inventory cannot approve its own plan, the ComplianceOfficer
          cannot issue a statistical evaluation, and the Hydrogeologist who owns the sampling data cannot
          evaluate it. Every refusal is 403 ERR_UNAUTHORIZED before any body validation, and the identical
          request succeeds for the owning role.
        test_recipe:
          setup:
            - "One clean unit and one DRAFT plan, plus one statistics professional"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Rae Novak", license_number: "ST-44004", license_state: "NC", discipline: "STATISTICS" }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0147", unit_name: "Ash Pond 147", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0147", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0147X", unit_name: "Regulator Pond", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: Regulator
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/closure-plans/${plan_id}/approve"
              payload: { approved_on: "2026-08-01", permit_reference: "PERMIT-2026-E" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/statistical-evaluations"
              payload: { program_id: "${prog_id}", compliance_well_id: "9f1e7a52-0000-4000-8000-000000000001", evaluation_code: "EV-CO", parameter_code: "SULFATE" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-08-01", document_uri: "https://utility.example.com/ccr/imp-0147/annual-2026.pdf", document_sha256: "7e907e907e907e907e907e907e907e907e907e907e907e907e907e907e907e90" }
              as: StatisticalReviewer
              as_user_id: "${st_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-08-01", document_uri: "https://utility.example.com/ccr/imp-0147/annual-2026.pdf", document_sha256: "7e907e907e907e907e907e907e907e907e907e907e907e907e907e907e907e90" }
              as: ComplianceOfficer
          assert:
            - "trigger calls 1 through 4 each return HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "trigger call 3 returns ERR_UNAUTHORIZED rather than the 404 the same unknown well id would produce for a StatisticalReviewer, proving the role gate runs before any lookup"
            - "trigger call 5 returns HTTP 201 with status POSTED, showing the endpoint itself is sound"
            - "after all five calls exactly one DisposalUnit exists, ClosurePlan.${plan_id}.status is still DRAFT, and no StatisticalEvaluation row exists"

      - name: public_viewer_reads_the_public_record_and_nothing_else
        claim_type: shared_operations
        grounds:
          - roles.PublicViewer.shared_operations
          - roles.PublicViewer.exclusive_operations
          - endpoints.GET_/ccr/public-postings
          - endpoints.GET_/ccr/units/{id}/compliance-summary
        distinguishing_aspect: |
          PublicViewer has an empty exclusive set and exactly three readable routes. The community surface
          must be genuinely open — the posting list, the posting detail and the unit compliance summary all
          answer 200 — while the neighbouring unit detail route, which every internal role may read, answers
          403 for the same caller. An implementation that gates reads by a single is_internal flag either
          opens too much or closes the summary.
        test_recipe:
          setup:
            - "One clean unit with a stability assessment and one POSTED document"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0148", unit_name: "Ash Pond 148", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "STABILITY_ASSESSMENT", posted_on: "2026-08-01", document_uri: "https://utility.example.com/ccr/imp-0148/stability-2026.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          trigger:
            - call: "GET /ccr/public-postings"
              as: PublicViewer
              captures: { listed_posting_id: "$.data[0].id" }
            - call: "GET /ccr/public-postings/${posting_id}"
              as: PublicViewer
              captures: { posting_status: $.data.status }
            - call: "GET /ccr/units/${unit_id}/compliance-summary"
              as: PublicViewer
              captures: { summary_posture: $.data.compliance_posture }
            - call: "GET /ccr/units/${unit_id}"
              as: PublicViewer
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/units/${unit_id}"
              as: ComplianceOfficer
              captures: { unit_code: $.data.unit_code }
          assert:
            - "trigger call 1 returns HTTP 200 with total_count 1, has_more false and listed_posting_id == ${posting_id}"
            - "trigger call 2 returns HTTP 200 with posting_status POSTED, satisfied_obligation true and days_late 0"
            - "trigger call 3 returns HTTP 200 with summary_posture COMPLIANT and governing_stability_verdict ADEQUATE"
            - "trigger call 4 returns HTTP 403 with error_id ERR_UNAUTHORIZED even though the same row is readable through the summary"
            - "trigger call 5 returns HTTP 200 with unit_code IMP-0148, proving the route works for a role that holds it"

      - name: same_engineer_cannot_sign_both_certifications_on_one_plan
        claim_type: segregation_of_duties
        grounds:
          - roles.ProfessionalEngineer.exclusive_operations
          - validations.priority_28_ERR_SEGREGATION_OF_DUTIES
          - state_machines.ClosurePlan.ENGINEERING_CERTIFIED_to_FULLY_CERTIFIED
          - complexity_profile.role_model
        distinguishing_aspect: |
          A CIVIL engineer is qualified for both certifications, so the discipline gate cannot catch the
          conflict — only the identity comparison against engineering_certified_by can. The refused request
          is byte-identical to the accepted one except for X-User-ID, and it must be 403
          ERR_SEGREGATION_OF_DUTIES rather than ERR_DISCIPLINE_NOT_QUALIFIED or a plan-state error.
        test_recipe:
