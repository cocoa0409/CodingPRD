            - "Signup.${sg1}.status == CANCELLED (was CHECKED_IN — link 3) and Signup.${sg2}.status == CANCELLED"
            - "credential DistributionRecord.status == REVOKED (${d1_status}) and supply record ${d2} == REVOKED (${d2_status})"
            - "SupplyInventory.quantity_issued went 1 -> 0 (${issued_pre} -> ${issued_post}) — stock restored by the revoke link"

      - name: training_expiry_waitlist_cascade
        grounds:
          - state_machines.TrainingRecord.PASSED_to_EXPIRED
          - state_machines.Signup.CONFIRMED_to_CANCELLED
          - state_machines.Signup.WAITLISTED_to_APPROVED
          - calculations.waitlist_promotion_rank
        distinguishing_aspect: |
          Depth-4 cascade from a THIRD trigger kind (the epoch sweep, not an actor
          action): sweep expires a PASSED TrainingRecord (1) which causes the
          volunteer's CONFIRMED signup on a training-gated role -> CANCELLED (2)
          which drops Shift.confirmed_count below headcount (3) which fires waitlist
          promotion moving the WAITLISTED signup -> APPROVED (4).
        test_recipe:
          setup:
            - "Role MARSHAL requires SAFETY_BRIEFING; shift 06:00-08:00 headcount 1"
            - "V1 passed SAFETY_BRIEFING at 2026-08-20 (valid until 2026-09-19), CONFIRMED on the shift (FULL)"
            - "V2 passed SAFETY_BRIEFING at 2026-09-10 (valid until 2026-10-10), WAITLISTED"
            - "Clock at 2026-09-20; event still PUBLISHED (signup_closes_at 2026-09-27 not yet reached)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16, required_skill: NONE, required_training_module: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T08:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { tr1: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr1}/pass", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02", is_returning: true }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v2}", module_code: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { tr2: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr2}/pass", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id, sg2_status0: $.data.status } }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: EventDirector }
          trigger:
