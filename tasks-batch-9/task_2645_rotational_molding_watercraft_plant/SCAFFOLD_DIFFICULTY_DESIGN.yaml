  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Three conserved quantities of three DIFFERENT types, each with an explicit
  # compensating move, and each instance asserts the invariant after the DRAW
  # and again after the RESTORE:
  #   resin mass (kg, 3 dp)      — reserve / release, with an IRREVERSIBLE consume leg
  #   warranty money (int cents) — approve / void, an exact reversal
  #   storage volume (m3, 4 dp)  — store / release-storage, ASYMMETRIC via anchor promotion
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: resin_mass_ledger_conserved_across_reserve_release_and_irreversible_consume
        grounds:
          - calculations.resin_mass_ledger
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.ResinCharge.RESERVED_to_CONSUMED
          - state_machines.ResinLot.AVAILABLE_to_DEPLETED
          - state_machines.ResinLot.DEPLETED_to_AVAILABLE
          - state_machines.MoldingCycle.OVEN_RUNNING_to_ABORTED
          - "CASCADE-A link 2"
        distinguishing_aspect: |
          The conserved quantity is physical MASS in kilograms at 3 decimal places, partitioned
          three ways as available_kg + reserved_kg + consumed_kg == received_kg, and its
          compensating move is only PARTIALLY symmetric: releasing a RESERVED charge returns mass
          to available_kg exactly, but once start-oven has moved mass to consumed_kg an abort from
          OVEN_RUNNING leaves the ledger completely untouched, so the invariant holds while the
          reversal does not.
        test_recipe:
          setup:
            - "ProductModel PM-X9A-KM: KAYAK/MID, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, max_regrind_pct 30.00, melt band 2.50 to 6.00, min_cooling_minutes 30."
            - "Single-cavity Mold MLD-X9A-1 with nominal_charge_kg 24.000 and service_interval_cycles 10; OvenStation OV-X9A (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE); CoolingBay CB-X9A (concurrent_slot_capacity 2, FORCED_AIR)."
            - "Two distinct ACTIVE Technicians: T-X9A-RES (RESIN_TECH, RESIN_BLENDING) and T-X9A-OPR (MOLDING_OPERATOR)."
            - "Warehouse WH-X9A 20.0000 in one zone Z-A; nothing is stored, so posture stays NORMAL."
            - "ResinLot LOT-X9A is deliberately SMALL: received_kg exactly 48.000 == two full 24.000 kg charges, with regrind_pct_by_mass 10.00, melt_index_g10min 4.00, colour SEAFOAM at color_delta_e 0.50, additive UV12, expires_on 2027-12-31. At creation the ledger reads available_kg 48.000 / reserved_kg 0.000 / consumed_kg 0.000."
            - "48.000 also clears the qualification floor round(24.000 * (1 - 5.00/100), 3) == 22.800, so the order releases to READY_TO_SCHEDULE."
            - "ProductionOrder PO-X9A (ordered_qty 2, no demand_bucket_id) released, then TWO SCHEDULED cycles on the one mould: cyc1 at 09:00-10:30 and cyc2 at 12:00-13:30. Both sit on arm 1, which is legal because the buffered span of cyc1 is [08:45:00, 10:15:00) and 12:00 lies beyond it, and the two mould spans [09:00, 10:30) and [12:00, 13:30) are disjoint."
            - "floor(2 * 1.20) == 2 admits exactly these two single-cavity cycles (§1.4 priority 79)."
            - "The clock starts at its 2026-08-01T00:00:00Z default and is advanced only to 09:00 for the start-oven, so cyc2's window is never in the past."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-X9A-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X9A-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-X9A", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-X9A", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X9A-RES", full_name: "Rae Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X9A-OPR", full_name: "Odin Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
