            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
