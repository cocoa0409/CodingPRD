  # =======================================================================
  - section: endpoints
    instances:

      - name: corner_logical_clock_starts_at_the_declared_default
        claim_type: action_endpoint
        grounds: ["endpoints", "calculations.renewal_eligibility_window"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z, so the first set call echoes that value back as previous_utc rather than a wall-clock instant."
        test_recipe:
          setup:
            - "Empty database; the server has just started and no clock call has been made."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PermitOfficer
          assert:
            - 'HTTP status is 200'
            - 'data.previous_utc == "2026-08-01T00:00:00.000Z"'
            - 'data.current_utc == "2026-09-01T00:00:00.000Z"'

