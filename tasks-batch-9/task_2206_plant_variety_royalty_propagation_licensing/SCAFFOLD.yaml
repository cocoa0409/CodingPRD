scenario: "2206. Plant Variety Royalty & Propagation Licensing (plant breeder royalty program): variety protection through plant patents and certificates with filing and maintenance calendars, licensed propagator agreements with production quotas and quality standards, royalty structure per plant or per acre with reporting and audit rights, tag and label programs providing traceability and enabling royalty verification, unauthorized propagation detection through market surveys and genetic testing, variety trialing and regional performance evaluation before commercial release, brand and trademark management separate from the variety name, sublicensing to nurseries and retail programs with territory restrictions"
domain_name: "plant-variety-royalty-licensing"
api_prefix: "/"
# Flat/graph topology: Variety, TrialSite and Propagator are peer roots; every
# other entity is discovered by filtered list on its declared FK fields rather
# than by deep URL nesting, so no single top-level resource path owns the API.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Variety, Propagator and TrialSite are peers joined by many-to-many junction
  # entities (ProductionQuota over Variety x PropagatorAgreement, VarietyTrial
  # over Variety x TrialSite, SublicenseGrant over Variety x PropagatorAgreement,
  # RoyaltyLineItem over RoyaltyReport x ProductionQuota, AuditEngagement over
  # PropagatorAgreement x RoyaltyReport, SurveillanceCase over Variety x
  # Propagator). Reverse discovery is by filtered list on FK fields.

  state_machine_shape: parallel
  # Two entities carry independent parallel state dimensions on a single row
  # (Variety.lifecycle_state x Variety.brand_status; RoyaltyReport.review_status
  # x RoyaltyReport.settlement_status), plus two cycles (ProtectionFiling
  # GRANTED <-> MAINTENANCE_DUE; PropagatorAgreement ACTIVE <-> SUSPENDED and
  # RoyaltyReport ACCEPTED -> DISPUTED -> DRAFT) and three server-chosen forks
  # (VarietyTrial EVALUATED -> {PASSED, FAILED}, SurveillanceCase TESTING ->
  # {MATCH_CONFIRMED, NO_MATCH}, AuditEngagement OPENED -> {FINDINGS_ISSUED,
  # CLOSED_NO_FINDING}).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The LicensingOfficer whose X-User-ID countersigned an agreement may not
  # accept royalty reports filed under it, and the officer who accepted a
  # report may not settle that same report.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities, 76 endpoints, 12 state machines, 9 calculations,
  # 40 ordered validations, 54 error codes, 5 roles, 3 OCC concurrency rules.
  # Density, not volume, is the point: every royalty number depends on the
  # quality tier of an agreement, the territory class of a quota, the tag
  # activation reconciled against that quota, and the protection posture
  # derived from filings in a third aggregate.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Variety
    parent: null
    common_fields: true
    fields:
      - name: denomination
        type: string
        source: input
        description: "Official variety denomination of record; deliberately distinct from the marketing brand."
        constraints: "1-80 chars; unique across all Variety rows, compared case-insensitively"
      - name: species
        type: string
        source: input
        description: "Botanical species, e.g. 'Rubus idaeus'."
        constraints: "1-60 chars"
      - name: breeder_code
        type: string
        source: input
        description: "Breeding program code that owns the variety."
        constraints: "2-12 uppercase chars"
      - name: lifecycle_state
        type: enum
        source: system
        description: "Commercial-release dimension of the variety's parallel state machine; evolves independently of brand_status."
        default: CANDIDATE
        constraints: "CANDIDATE | IN_TRIAL | TRIAL_COMPLETE | RELEASED | RETIRED"
      - name: brand_status
        type: enum
        source: system
        description: "Trademark dimension of the variety's parallel state machine; evolves independently of lifecycle_state."
        default: BRAND_NONE
        constraints: "BRAND_NONE | BRAND_REGISTERED | BRAND_RENEWAL_DUE | BRAND_ABANDONED"
      - name: brand_mark_text
        type: string
        source: system
        description: "Registered trademark text taken from the brand-register payload; null while brand_status == BRAND_NONE."
        constraints: "1-60 chars; unique across all Variety rows compared case-insensitively; MUST NOT equal any Variety.denomination compared case-insensitively"
      - name: brand_registry_class
        type: integer
        source: system
        description: "Nice classification class recorded at brand registration; null while brand_status == BRAND_NONE."
        constraints: "1-45"
      - name: brand_registered_on
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into BRAND_REGISTERED; null before first registration."
      - name: brand_renewal_due_at
        type: datetime
        source: system
        description: "Instant at which the mark must be renewed; the clock sweep flips BRAND_REGISTERED -> BRAND_RENEWAL_DUE at or after this instant."
      - name: brand_renewal_count
        type: integer
        source: system
        description: "Number of BRAND_RENEWAL_DUE -> BRAND_REGISTERED transitions performed on this mark."
        default: 0
      - name: protection_posture
        type: enum
        source: computed
        description: "Derived from this variety's ProtectionFiling rows; see calculations.variety_protection_posture."
        default: UNPROTECTED
        constraints: "UNPROTECTED | PENDING | PROTECTED | LAPSED_PROTECTION"
      - name: protected_jurisdictions
        type: array
        source: computed
        description: "Lexicographically ascending DISTINCT jurisdiction_code list over this variety's ProtectionFiling rows with status IN {GRANTED, MAINTENANCE_DUE}."
        default: []
      - name: royalty_basis_default
        type: enum
        source: input
        description: "Royalty basis inherited by ProductionQuota rows that omit basis."
        default: PER_PLANT
        constraints: "PER_PLANT | PER_ACRE"
      - name: base_royalty_cents_per_plant
        type: integer
        source: input
        description: "Base per-plant royalty in whole cents before any multiplier."
        constraints: ">= 1"
      - name: base_royalty_cents_per_acre
        type: integer
        source: input
        description: "Base per-acre royalty in whole cents before any multiplier."
        constraints: ">= 1"
      - name: regional_performance_index
        type: number
        source: computed
        description: "Mean VarietyTrial.performance_index over this variety's trials with status == PASSED, 2 dp; see calculations.trial_performance_index."
        default: 0
      - name: passed_trial_region_count
        type: integer
        source: computed
        description: "Count of DISTINCT TrialSite.region_code values among this variety's VarietyTrial rows with status == PASSED."
        default: 0
      - name: active_sublicense_count
        type: integer
        source: computed
        description: "Count of SublicenseGrant rows with variety_id == this Variety.id and status == ACTIVE."
        default: 0
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant at which lifecycle_state became RELEASED; null before release."

  - name: ProtectionFiling
    parent: Variety
    common_fields: true
    fields:
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; the variety this filing protects."
      - name: instrument_type
        type: enum
        source: input
        description: "Legal instrument sought for this jurisdiction."
        constraints: "PLANT_PATENT | PLANT_VARIETY_CERTIFICATE"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction of the filing, e.g. 'US', 'EU', 'CA'."
        constraints: "2-4 uppercase chars; unique per (variety_id, jurisdiction_code, instrument_type) among filings with status IN {DRAFT, FILED, GRANTED, MAINTENANCE_DUE}"
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle; cycles between GRANTED and MAINTENANCE_DUE once per scheduled annuity."
        default: DRAFT
        constraints: "DRAFT | FILED | GRANTED | MAINTENANCE_DUE | LAPSED | ABANDONED"
      - name: filed_on
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> FILED transition; null while DRAFT."
      - name: granted_on
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into GRANTED."
      - name: term_years
        type: integer
        source: input
        description: "Protection term in years measured from grant."
        default: 20
        constraints: "5-25"
      - name: annuity_base_cents
        type: integer
        source: input
        description: "Base maintenance annuity per installment, whole cents."
        constraints: ">= 1000"
      - name: annuity_sequence_no
        type: integer
        source: system
        description: "1-based ordinal of the currently scheduled annuity within this filing's maintenance calendar; 0 before the first schedule-annuity call."
        default: 0
      - name: annuity_due_date
        type: datetime
        source: system
        description: "Calendar due instant of the currently scheduled annuity, taken from the schedule-annuity payload; null while none is scheduled."
      - name: annuity_grace_days
        type: integer
        source: system
        description: "Days after annuity_due_date during which late payment is still accepted, taken from the schedule-annuity payload."
        default: 90
        constraints: "0-90"
      - name: annuity_days_late
        type: integer
        source: computed
        description: "Whole days between annuity_due_date and the payment instant; 0 when paid at or before annuity_due_date. See calculations.annuity_total_due."
        default: 0
      - name: annuity_surcharge_cents
        type: integer
        source: computed
        description: "Late surcharge component of the currently scheduled annuity; see calculations.annuity_total_due step 2."
        default: 0
      - name: annuity_volume_credit_cents
        type: integer
        source: computed
        description: "Volume credit subtracted after surcharge tiering; see calculations.annuity_total_due step 4."
        default: 0
      - name: annuity_total_due_cents
        type: integer
        source: computed
        description: "Amount owed for the currently scheduled annuity; see calculations.annuity_total_due step 5."
        default: 0
      - name: installments_paid_count
        type: integer
        source: computed
        description: "Number of MAINTENANCE_DUE -> GRANTED transitions completed by payment on this filing."
        default: 0
      - name: lapse_reason
        type: enum
        source: system
        description: "Why the filing left the protected states; null while status != LAPSED."
        constraints: "GRACE_EXPIRED | VOLUNTARY_LAPSE | null"

  - name: TrialSite
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: "Human-readable trial site name."
        constraints: "1-60 chars"
      - name: region_code
        type: string
        source: input
        description: "Growing region identifier used for regional performance coverage, e.g. 'PNW', 'SE'."
        constraints: "2-6 uppercase chars"
      - name: plot_capacity
        type: integer
        source: input
        description: "Plots the site can host across any single instant."
        constraints: ">= 1"
      - name: occupied_plot_count
        type: integer
        source: computed
        description: "Sum of VarietyTrial.plot_count over this site's trials with status IN {PLANNED, PLANTED}."
        default: 0

  - name: VarietyTrial
    parent: null
    common_fields: true
    fields:
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; the variety under regional evaluation."
      - name: trial_site_id
        type: string
        source: input
        description: "FK -> TrialSite.id; the site hosting this trial."
      - name: plot_count
        type: integer
        source: input
        description: "Plots this trial occupies at the site for its whole occupancy interval."
        constraints: ">= 1"
      - name: plant_date
        type: datetime
        source: input
        description: "Inclusive start of the site occupancy interval [plant_date, harvest_date)."
      - name: harvest_date
        type: datetime
        source: input
        description: "Exclusive end of the site occupancy interval; MUST be > plant_date."
      - name: status
        type: enum
        source: system
        description: "Trial lifecycle; EVALUATED forks to PASSED or FAILED with divergent side-effect sets."
        default: PLANNED
        constraints: "PLANNED | PLANTED | EVALUATED | PASSED | FAILED"
      - name: yield_index
        type: number
        source: input
        description: "Observed yield index supplied in the evaluate payload; null while status IN {PLANNED, PLANTED}."
        constraints: "0-100, 2 dp"
      - name: vigor_score
        type: number
        source: input
        description: "Observed vigor score supplied in the evaluate payload."
        constraints: "0-100, 2 dp"
      - name: uniformity_score
        type: number
        source: input
        description: "Observed uniformity score supplied in the evaluate payload."
        constraints: "0-100, 2 dp"
      - name: disease_resistance_score
        type: number
        source: input
        description: "Observed disease resistance score supplied in the evaluate payload."
        constraints: "0-100, 2 dp"
      - name: propagation_pass_rate
        type: number
        source: input
        description: "Fraction of propagated plants meeting the quality standard, supplied in the evaluate payload."
        constraints: "0-1, exactly 4 dp"
      - name: performance_index
        type: number
        source: computed
        description: "Weighted evaluation score, 2 dp; see calculations.trial_performance_index."
        default: 0
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PLANTED -> EVALUATED transition; null before evaluation."

  - name: Propagator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered nursery / propagator legal name."
        constraints: "1-80 chars; unique across all Propagator rows compared case-insensitively"
      - name: home_territory_code
        type: string
        source: input
        description: "Primary territory the propagator operates from, e.g. 'US-OR'."
        constraints: "2-8 uppercase chars, may contain '-'"
      - name: compliance_score
        type: integer
        source: computed
        description: "Rolling-window compliance score; see calculations.propagator_compliance_score variant rolling_120d."
        default: 100
        constraints: "0-100"
      - name: lifetime_compliance_score
        type: integer
        source: computed
        description: "Lifetime compliance score over all penalty events regardless of age; see calculations.propagator_compliance_score variant lifetime."
        default: 100
        constraints: "0-100"
      - name: royalty_payable_cents
        type: integer
        source: computed
        description: "Booked but unsettled royalty across this propagator's agreements; see calculations.propagator_royalty_ledger."
        default: 0
      - name: royalty_settled_cents
        type: integer
        source: computed
        description: "Cumulative settled royalty across this propagator's agreements; see calculations.propagator_royalty_ledger."
        default: 0
      - name: damages_credit_cents
        type: integer
        source: computed
        description: "Cumulative SurveillanceCase.propagator_credit_cents attributed to this propagator; kept outside the royalty ledger so calculations.propagator_royalty_ledger stays conserved."
        default: 0
      - name: material_audit_finding_count
        type: integer
        source: computed
        description: "Count of AuditEngagement rows whose agreement_id belongs to this propagator with status == FINDINGS_ISSUED and finding_severity == MATERIAL."
        default: 0

  - name: PropagatorAgreement
    parent: null
    common_fields: true
    fields:
      - name: propagator_id
        type: string
        source: input
        description: "FK -> Propagator.id; the licensed propagator bound by this agreement."
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle; cycles ACTIVE <-> SUSPENDED any number of times before TERMINATED."
        default: PENDING_COUNTERSIGN
        constraints: "PENDING_COUNTERSIGN | ACTIVE | SUSPENDED | TERMINATED"
      - name: quality_tier
        type: enum
        source: input
        description: "Certified quality standard tier achieved under this agreement; drives the royalty rate multiplier."
        default: TIER_B
        constraints: "TIER_A | TIER_B | TIER_C"
      - name: territory_codes
        type: array
        source: input
        description: "Territory codes the propagator may produce and sublicense in."
        constraints: "non-empty array of 2-8 uppercase codes (may contain '-'); no duplicates"
      - name: term_start
        type: datetime
        source: input
        description: "Inclusive first instant of the agreement term."
      - name: term_end
        type: datetime
        source: input
        description: "Exclusive last instant of the agreement term; MUST be > term_start."
      - name: countersigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensingOfficer who countersigned; drives the segregation-of-duties check on report acceptance."
      - name: countersigned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PENDING_COUNTERSIGN -> ACTIVE transition."
      - name: suspension_reason
        type: enum
        source: system
        description: "Reason for the most recent ACTIVE -> SUSPENDED transition; null while never suspended."
        constraints: "COMPLIANCE_SCORE_BREACH | AUDIT_FINDING | MANUAL | null"
      - name: reinstatement_count
        type: integer
        source: system
        description: "Number of SUSPENDED -> ACTIVE transitions performed on this agreement."
        default: 0

  - name: ProductionQuota
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PropagatorAgreement.id; the head licence authorizing this production."
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; the variety to be propagated."
      - name: season_code
        type: string
        source: input
        description: "Production season identifier, e.g. '2026S1'."
        constraints: "4-8 chars; unique per (agreement_id, variety_id, season_code, territory_code) among quotas with status IN {ACTIVE, FROZEN}"
      - name: basis
        type: enum
        source: input
        description: "Royalty basis for this quota; when omitted it is copied from Variety.royalty_basis_default at creation."
        constraints: "PER_PLANT | PER_ACRE"
      - name: territory_code
        type: string
        source: input
        description: "Territory this quota's production is destined for; MUST be a member of PropagatorAgreement.territory_codes."
        constraints: "2-8 uppercase chars, may contain '-'"
      - name: territory_class
        type: enum
        source: input
        description: "Pricing class of the destination territory; drives the royalty rate multiplier."
        default: DOMESTIC
        constraints: "DOMESTIC | EXPORT"
      - name: allocated_units
        type: integer
        source: input
        description: "Authorized production, in plants when basis == PER_PLANT and in whole acres when basis == PER_ACRE."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Quota lifecycle; FROZEN blocks tag issuance and line-item creation, CLOSED is terminal."
        default: ACTIVE
        constraints: "ACTIVE | FROZEN | CLOSED"
      - name: tags_committed_units
        type: integer
        source: computed
        description: "Sum of TagOrder.requested_units over this quota's tag orders with status IN {ISSUED, RECONCILED}; see calculations.quota_tag_inventory."
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: "allocated_units - tags_committed_units; see calculations.quota_tag_inventory invariant I1."
        default: 0
      - name: tags_activated_units
        type: integer
        source: computed
        description: "Sum of TagOrder.activated_units over this quota's tag orders with status == RECONCILED; the audited royalty floor."
        default: 0

  - name: TagOrder
    parent: null
    common_fields: true
    fields:
      - name: quota_id
        type: string
        source: input
        description: "FK -> ProductionQuota.id; the quota whose authorized units these traceability tags draw down."
      - name: requested_units
        type: integer
        source: input
        description: "Number of traceability tags requested; commits quota units at issuance."
        constraints: ">= 1"
      - name: serial_prefix
        type: string
        source: system
        description: "Server-minted serial prefix printed on every tag of this order; null before issuance. Format '<breeder_code>-<season_code>-<zero-padded 4-digit issuance ordinal within the quota>'."
      - name: status
        type: enum
        source: system
        description: "Tag order lifecycle."
        default: REQUESTED
        constraints: "REQUESTED | ISSUED | RECONCILED | VOIDED"
      - name: activated_units
        type: integer
        source: input
        description: "Tags reported as affixed to saleable plants, supplied in the reconcile payload; MUST be <= requested_units."
        default: 0
        constraints: ">= 0"
      - name: voided_units
        type: integer
        source: computed
        description: "requested_units captured at the moment of voiding, else 0; the compensating quantity for calculations.quota_tag_inventory."
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the REQUESTED -> ISSUED transition; null before issuance."

  - name: RoyaltyReport
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PropagatorAgreement.id; the agreement being reported under."
      - name: period_code
        type: string
        source: input
        description: "Reporting period identifier, e.g. '2026-Q3'."
        constraints: "4-10 chars; unique per (agreement_id, period_code)"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period; MUST be >= PropagatorAgreement.term_start."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the reporting period; MUST be > period_start and <= PropagatorAgreement.term_end."
      - name: due_at
        type: datetime
        source: input
        description: "Filing deadline; submission strictly after this instant marks the report late."
      - name: review_status
        type: enum
        source: system
        description: "Review dimension of the report's parallel state machine; cycles ACCEPTED -> DISPUTED -> DRAFT."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | DISPUTED"
      - name: settlement_status
        type: enum
        source: system
        description: "Settlement dimension of the report's parallel state machine; evolves independently of review_status."
        default: UNSETTLED
        constraints: "UNSETTLED | SETTLED | REVERSED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT -> SUBMITTED transition."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent SUBMITTED -> ACCEPTED transition."
      - name: is_late
        type: boolean
        source: computed
        description: "True when submitted_at > due_at at the moment of the most recent submission."
        default: false
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Sum of RoyaltyLineItem.provisional_amount_cents over this report's lines; see calculations.royalty_report_totals variant reported_basis."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Sum of RoyaltyLineItem.final_amount_cents over this report's lines, computed at acceptance; see calculations.royalty_report_totals variant audited_basis."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Late filing fee added at acceptance when is_late is true; see calculations.royalty_report_totals step 4."
        default: 0
      - name: booked_amount_cents
        type: integer
        source: computed
        description: "final_total_cents + late_fee_cents while review_status == ACCEPTED; 0 while review_status IN {DRAFT, SUBMITTED, DISPUTED}."
        default: 0
      - name: revision_no
        type: integer
        source: system
        description: "Increments by 1 on every DISPUTED -> DRAFT transition."
        default: 0
      - name: accepted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensingOfficer who most recently accepted the report; null before acceptance."
      - name: settled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensingOfficer who settled the report; null before settlement."

  - name: RoyaltyLineItem
    parent: RoyaltyReport
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> RoyaltyReport.id; the report this line belongs to."
      - name: quota_id
        type: string
        source: input
        description: "FK -> ProductionQuota.id; the quota this line reports production against."
      - name: reported_units
        type: integer
        source: input
        description: "Units the propagator declares for this quota over the report period (plants or acres per ProductionQuota.basis)."
        constraints: ">= 0"
      - name: effective_rate_cents
        type: number
        source: computed
        description: "Per-unit royalty rate after all multipliers and clamps, 4 dp; see calculations.effective_royalty_rate."
        default: 0
      - name: billable_units
        type: integer
        source: computed
        description: "Units actually billed under the variant in force: reported_units under reported_basis, max(reported_units, ProductionQuota.tags_activated_units) under audited_basis."
        default: 0
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "Reported-basis line amount in whole cents; see calculations.royalty_report_totals variant reported_basis."
        default: 0
      - name: final_amount_cents
        type: integer
        source: computed
        description: "Audited-basis line amount in whole cents, computed at report acceptance; see calculations.royalty_report_totals variant audited_basis."
        default: 0
      - name: overrun_flagged
        type: boolean
        source: computed
        description: "True when the audited billable_units computed at acceptance exceeds ProductionQuota.allocated_units; feeds the QUOTA_OVERRUN penalty event."
        default: false

  - name: SublicenseGrant
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PropagatorAgreement.id; the head licence this sublicense hangs off."
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; the variety being sublicensed."
      - name: sublicensee_name
        type: string
        source: input
        description: "Nursery or retail program receiving the sublicense."
        constraints: "1-80 chars"
      - name: territory_code
        type: string
        source: input
        description: "Territory the sublicense is restricted to; MUST be a member of PropagatorAgreement.territory_codes."
        constraints: "2-8 uppercase chars, may contain '-'"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction whose ProtectionFiling must be in {GRANTED, MAINTENANCE_DUE} for this grant to activate and stay active."
        constraints: "2-4 uppercase chars"
      - name: exclusivity
        type: enum
        source: input
        description: "EXCLUSIVE grants occupy the (variety_id, territory_code) buffered interval alone; NON_EXCLUSIVE grants never conflict."
        default: NON_EXCLUSIVE
        constraints: "EXCLUSIVE | NON_EXCLUSIVE"
      - name: effective_date
        type: datetime
        source: input
        description: "Inclusive start of the exclusivity interval [effective_date, expiry_date]."
      - name: expiry_date
        type: datetime
        source: input
        description: "Inclusive end of the exclusivity interval; MUST be > effective_date."
      - name: status
        type: enum
        source: system
        description: "Grant lifecycle."
        default: PROPOSED
        constraints: "PROPOSED | ACTIVE | REVOKED | EXPIRED"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PROPOSED -> ACTIVE transition; null before activation."
      - name: revocation_reason
        type: enum
        source: system
        description: "Reason for the transition into REVOKED; null while status != REVOKED."
        constraints: "PROTECTION_LAPSED | AGREEMENT_TERMINATED | MANUAL | null"

  - name: SurveillanceCase
    parent: null
    common_fields: true
    fields:
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; the protected variety suspected of unauthorized propagation."
      - name: suspected_propagator_id
        type: string
        source: input
        description: "FK -> Propagator.id; the licensed propagator suspected of over-propagation. Optional: null denotes an unlicensed third party."
      - name: market_survey_ref
        type: string
        source: input
        description: "Reference of the market survey that raised the suspicion."
        constraints: "1-40 chars"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle; TESTING forks to MATCH_CONFIRMED or NO_MATCH on the server's own reading of max_match_confidence."
        default: OPENED
        constraints: "OPENED | SAMPLED | TESTING | MATCH_CONFIRMED | NO_MATCH | RESOLVED"
      - name: sampled_unit_count
        type: integer
        source: input
        description: "Plants sampled in the market survey, supplied in the sample payload."
        default: 0
        constraints: ">= 1 when supplied"
      - name: max_match_confidence
        type: number
        source: computed
        description: "Highest GeneticTest.match_confidence among this case's tests, 4 dp; 0 while the case has no tests."
        default: 0
      - name: concluded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the TESTING -> {MATCH_CONFIRMED, NO_MATCH} fork; the event_at of the CONFIRMED_UNAUTH_MATCH penalty event."
      - name: recovered_damages_cents
        type: integer
        source: input
        description: "Damages recovered at resolution, supplied in the resolve payload."
        default: 0
        constraints: ">= 0"
      - name: enforcement_cost_cents
        type: integer
        source: input
        description: "Documented enforcement costs, supplied in the resolve payload; recovered before the breeder pool."
        default: 0
        constraints: ">= 0"
      - name: enforcement_recovery_cents
        type: integer
        source: computed
        description: "Bucket 1 of calculations.damages_waterfall."
        default: 0
      - name: breeder_pool_cents
        type: integer
        source: computed
        description: "Bucket 2 of calculations.damages_waterfall; the breeder royalty pool share."
        default: 0
      - name: propagator_credit_cents
        type: integer
        source: computed
        description: "Bucket 3 of calculations.damages_waterfall; credited to Propagator.damages_credit_cents when suspected_propagator_id is non-null."
        default: 0

  - name: GeneticTest
    parent: SurveillanceCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurveillanceCase.id; the case this immutable laboratory result belongs to."
      - name: lab_code
        type: string
        source: input
        description: "Accredited laboratory that ran the marker panel."
        constraints: "2-12 uppercase chars"
      - name: marker_panel
        type: string
        source: input
        description: "Marker panel identifier used, e.g. 'SSR-24'."
        constraints: "2-16 chars"
      - name: match_confidence
        type: number
        source: input
        description: "Probability the sample is genetically identical to the protected variety."
        constraints: "0-1, exactly 4 dp"
      - name: result
        type: enum
        source: computed
        description: "MATCH when match_confidence >= GENETIC_MATCH_THRESHOLD (0.9000), else NO_MATCH; the boundary is inclusive."
        constraints: "MATCH | NO_MATCH"

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PropagatorAgreement.id; the agreement whose contractual audit rights are being exercised."
      - name: royalty_report_id
        type: string
        source: input
        description: "FK -> RoyaltyReport.id; the accepted report under audit."
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle; OPENED forks to FINDINGS_ISSUED or CLOSED_NO_FINDING on the finalize payload's severity."
        default: OPENED
        constraints: "OPENED | FINDINGS_ISSUED | CLOSED_NO_FINDING"
      - name: finding_severity
        type: enum
        source: input
        description: "Severity supplied in the finalize payload; null while status == OPENED."
        constraints: "NONE | MINOR | MATERIAL | null"
      - name: underreported_units
        type: integer
        source: input
        description: "Units the audit determined were propagated beyond the report's declaration, supplied in the finalize payload."
        default: 0
        constraints: ">= 0"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the finalize fork; the event_at of the MINOR/MATERIAL_AUDIT_FINDING penalty event."
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor who finalized this engagement."

state_machines:
  - entity: Variety
    state_field: lifecycle_state
    initial_state: CANDIDATE
    terminal_states: [RETIRED]
    transitions:
      - from: CANDIDATE
        to: IN_TRIAL
        trigger: "system event raised by POST /variety-trials/{trial_id}/plant"
        actor: system
        preconditions: ["variety.lifecycle_state == CANDIDATE"]
        side_effects:
          - "set Variety.lifecycle_state = IN_TRIAL"
          - "increment Variety.version by 1"
      - from: IN_TRIAL
        to: TRIAL_COMPLETE
        trigger: "system event raised by POST /variety-trials/{trial_id}/certify when the recomputed Variety.passed_trial_region_count >= MIN_RELEASE_REGIONS (2)"
        actor: system
        preconditions:
          - "variety.lifecycle_state == IN_TRIAL"
          - "recomputed variety.passed_trial_region_count >= 2"
        side_effects:
          - "set Variety.lifecycle_state = TRIAL_COMPLETE"
          - "recompute Variety.regional_performance_index via calculations.trial_performance_index aggregate step"
          - "increment Variety.version by 1"
      - from: TRIAL_COMPLETE
        to: IN_TRIAL
        trigger: "system event raised by POST /variety-trials/{trial_id}/plant on a further regional trial"
        actor: system
        preconditions:
          - "variety.lifecycle_state == TRIAL_COMPLETE"
          - "variety.released_at is null"
        side_effects:
          - "set Variety.lifecycle_state = IN_TRIAL"
          - "increment Variety.version by 1"
        note: "Revision loop: the variety re-enters trialing for additional regions until it is released; after release, planting a further trial no longer moves lifecycle_state."
      - from: TRIAL_COMPLETE
        to: RELEASED
        trigger: "POST /varieties/{variety_id}/release"
        actor: BreederAdmin
        preconditions:
          - "variety.lifecycle_state == TRIAL_COMPLETE"
          - "variety.passed_trial_region_count >= MIN_RELEASE_REGIONS (2)"
          - "variety.regional_performance_index >= RELEASE_MIN_INDEX (72.00)"
          - "variety.protection_posture IN {PENDING, PROTECTED}"
        side_effects:
          - "set Variety.lifecycle_state = RELEASED"
          - "set Variety.released_at = logical clock now"
          - "increment Variety.version by 1"
      - from: RELEASED
        to: RETIRED
        trigger: "POST /varieties/{variety_id}/retire"
        actor: BreederAdmin
        preconditions:
          - "variety.lifecycle_state == RELEASED"
          - "variety.active_sublicense_count == 0"
        side_effects:
          - "set Variety.lifecycle_state = RETIRED"
          - "cascade level 1: every ProductionQuota with variety_id == this variety and status IN {ACTIVE, FROZEN} moves to CLOSED (processed created_at ASC, then season_code ASC)"
          - "cascade level 2 (caused by each quota closure): every TagOrder of that quota with status == REQUESTED moves to VOIDED with voided_units = requested_units"
          - "increment Variety.version by 1, and the version of each closed ProductionQuota and each voided TagOrder by 1"

  - entity: Variety
    state_field: brand_status
    initial_state: BRAND_NONE
    terminal_states: [BRAND_ABANDONED]
    transitions:
      - from: BRAND_NONE
        to: BRAND_REGISTERED
        trigger: "POST /varieties/{variety_id}/brand-register"
        actor: BreederAdmin
        preconditions:
          - "variety.brand_status == BRAND_NONE"
          - "payload.brand_mark_text != variety.denomination compared case-insensitively"
          - "payload.brand_mark_text does not equal any existing Variety.denomination or Variety.brand_mark_text compared case-insensitively"
        side_effects:
          - "set Variety.brand_mark_text, Variety.brand_registry_class, Variety.brand_renewal_due_at from the payload"
          - "set Variety.brand_registered_on = logical clock now"
          - "set Variety.brand_status = BRAND_REGISTERED"
          - "increment Variety.version by 1"
        note: "This dimension is orthogonal to lifecycle_state: a CANDIDATE variety may hold a registered mark, and a RETIRED variety may still hold one."
      - from: BRAND_REGISTERED
        to: BRAND_RENEWAL_DUE
        trigger: "system event raised by the POST /_clock/set_current_utc sweep when now >= variety.brand_renewal_due_at"
        actor: system
        preconditions:
          - "variety.brand_status == BRAND_REGISTERED"
          - "logical clock now >= variety.brand_renewal_due_at"
        side_effects:
          - "set Variety.brand_status = BRAND_RENEWAL_DUE"
          - "increment Variety.version by 1"
      - from: BRAND_RENEWAL_DUE
        to: BRAND_REGISTERED
        trigger: "POST /varieties/{variety_id}/brand-renew"
        actor: BreederAdmin
        preconditions:
          - "variety.brand_status == BRAND_RENEWAL_DUE"
          - "payload.brand_renewal_due_at > logical clock now"
        side_effects:
          - "set Variety.brand_renewal_due_at = payload.brand_renewal_due_at"
          - "set Variety.brand_registered_on = logical clock now"
          - "increment Variety.brand_renewal_count by 1"
          - "set Variety.brand_status = BRAND_REGISTERED"
          - "increment Variety.version by 1"
        note: "Cycle: BRAND_REGISTERED -> BRAND_RENEWAL_DUE -> BRAND_REGISTERED repeats once per renewal term, independently of the ProtectionFiling maintenance cycle."
      - from: BRAND_REGISTERED
        to: BRAND_ABANDONED
        trigger: "POST /varieties/{variety_id}/brand-abandon"
        actor: BreederAdmin
        preconditions: ["variety.brand_status IN {BRAND_REGISTERED, BRAND_RENEWAL_DUE}"]
        side_effects:
          - "set Variety.brand_status = BRAND_ABANDONED"
          - "increment Variety.version by 1"
      - from: BRAND_RENEWAL_DUE
        to: BRAND_ABANDONED
        trigger: "POST /varieties/{variety_id}/brand-abandon"
        actor: BreederAdmin
        preconditions: ["variety.brand_status IN {BRAND_REGISTERED, BRAND_RENEWAL_DUE}"]
        side_effects:
          - "set Variety.brand_status = BRAND_ABANDONED"
          - "increment Variety.version by 1"

  - entity: ProtectionFiling
    state_field: status
    initial_state: DRAFT
    terminal_states: [LAPSED, ABANDONED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /protection-filings/{filing_id}/file"
        actor: BreederAdmin
        preconditions: ["filing.status == DRAFT"]
        side_effects:
          - "set ProtectionFiling.filed_on = logical clock now"
          - "recompute Variety.protection_posture via calculations.variety_protection_posture (UNPROTECTED -> PENDING when no GRANTED/MAINTENANCE_DUE filing exists)"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: FILED
        to: GRANTED
        trigger: "POST /protection-filings/{filing_id}/grant"
        actor: BreederAdmin
        preconditions: ["filing.status == FILED"]
        side_effects:
          - "set ProtectionFiling.granted_on = logical clock now"
          - "recompute Variety.protection_posture (becomes PROTECTED) and Variety.protected_jurisdictions via calculations.variety_protection_posture"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: GRANTED
        to: MAINTENANCE_DUE
        trigger: "POST /protection-filings/{filing_id}/schedule-annuity"
        actor: BreederAdmin
        preconditions:
          - "filing.status == GRANTED"
          - "payload.annuity_due_date > logical clock now"
        side_effects:
          - "increment ProtectionFiling.annuity_sequence_no by 1"
          - "set ProtectionFiling.annuity_due_date and annuity_grace_days from the payload"
          - "reset ProtectionFiling.annuity_days_late, annuity_surcharge_cents, annuity_volume_credit_cents and annuity_total_due_cents to 0"
          - "set ProtectionFiling.status = MAINTENANCE_DUE"
          - "increment ProtectionFiling.version by 1"
        note: "An outstanding annuity obligation puts the filing in MAINTENANCE_DUE; the variety stays PROTECTED while in this state, so protection_posture is unchanged."
      - from: MAINTENANCE_DUE
        to: GRANTED
        trigger: "POST /protection-filings/{filing_id}/pay-annuity"
        actor: BreederAdmin
        preconditions:
          - "filing.status == MAINTENANCE_DUE"
          - "logical clock now <= filing.annuity_due_date + filing.annuity_grace_days days (inclusive at the exact grace instant)"
          - "payload.paid_amount_cents == the annuity_total_due_cents computed by calculations.annuity_total_due at this instant"
        side_effects:
          - "compute annuity_days_late, annuity_surcharge_cents, annuity_volume_credit_cents and annuity_total_due_cents via calculations.annuity_total_due"
          - "increment ProtectionFiling.installments_paid_count by 1"
          - "set ProtectionFiling.status = GRANTED and granted_on = logical clock now"
          - "increment ProtectionFiling.version by 1"
        note: "Cycle: GRANTED -> MAINTENANCE_DUE -> GRANTED repeats once per annuity in the maintenance calendar; installments_paid_count counts the completed laps."
      - from: MAINTENANCE_DUE
        to: LAPSED
        trigger: "system event raised by the POST /_clock/set_current_utc sweep when now > filing.annuity_due_date + filing.annuity_grace_days days"
        actor: system
        preconditions:
          - "filing.status == MAINTENANCE_DUE"
          - "logical clock now > filing.annuity_due_date + filing.annuity_grace_days days"
        side_effects:
          - "set ProtectionFiling.status = LAPSED and ProtectionFiling.lapse_reason = GRACE_EXPIRED"
          - "cascade level 1 (caused by the lapse): recompute Variety.protection_posture and Variety.protected_jurisdictions via calculations.variety_protection_posture; the posture becomes LAPSED_PROTECTION when no filing of this variety remains in {GRANTED, MAINTENANCE_DUE} and jurisdiction_code drops out of protected_jurisdictions"
          - "cascade level 2 (caused by the protected_jurisdictions change from level 1): every SublicenseGrant with variety_id == filing.variety_id, jurisdiction_code == filing.jurisdiction_code and status == ACTIVE moves to REVOKED with revocation_reason = PROTECTION_LAPSED (processed created_at ASC, then territory_code ASC, then sublicensee_name ASC)"
          - "cascade level 3 (caused by each revocation in level 2): recompute Variety.active_sublicense_count, decrementing it once per revoked grant, and increment each revoked SublicenseGrant.version by 1"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: GRANTED
        to: LAPSED
        trigger: "POST /protection-filings/{filing_id}/lapse"
        actor: BreederAdmin
        preconditions: ["filing.status IN {GRANTED, MAINTENANCE_DUE}"]
        side_effects:
          - "set ProtectionFiling.status = LAPSED and ProtectionFiling.lapse_reason = VOLUNTARY_LAPSE"
          - "cascade level 1 (caused by the lapse): recompute Variety.protection_posture and Variety.protected_jurisdictions"
          - "cascade level 2 (caused by the protected_jurisdictions change): ACTIVE SublicenseGrant rows of this variety in filing.jurisdiction_code move to REVOKED with revocation_reason = PROTECTION_LAPSED"
          - "cascade level 3 (caused by each revocation): recompute Variety.active_sublicense_count"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: MAINTENANCE_DUE
        to: LAPSED
        trigger: "POST /protection-filings/{filing_id}/lapse"
        actor: BreederAdmin
        preconditions: ["filing.status IN {GRANTED, MAINTENANCE_DUE}"]
        side_effects:
          - "set ProtectionFiling.status = LAPSED and ProtectionFiling.lapse_reason = VOLUNTARY_LAPSE"
          - "the same three-level cascade declared on the GRANTED -> LAPSED transition runs"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /protection-filings/{filing_id}/abandon"
        actor: BreederAdmin
        preconditions: ["filing.status IN {DRAFT, FILED}"]
        side_effects:
          - "set ProtectionFiling.status = ABANDONED"
          - "recompute Variety.protection_posture (PENDING -> UNPROTECTED when no other filing of this variety is in {DRAFT, FILED, GRANTED, MAINTENANCE_DUE, LAPSED})"
          - "increment ProtectionFiling.version and Variety.version by 1"
      - from: FILED
        to: ABANDONED
        trigger: "POST /protection-filings/{filing_id}/abandon"
        actor: BreederAdmin
        preconditions: ["filing.status IN {DRAFT, FILED}"]
        side_effects:
          - "set ProtectionFiling.status = ABANDONED"
          - "recompute Variety.protection_posture"
          - "increment ProtectionFiling.version and Variety.version by 1"

  - entity: VarietyTrial
    state_field: status
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PLANNED
        to: PLANTED
        trigger: "POST /variety-trials/{trial_id}/plant"
        actor: TrialCoordinator
        preconditions:
          - "trial.status == PLANNED"
          - "logical clock now >= trial.plant_date"
          - "variety.lifecycle_state IN {CANDIDATE, IN_TRIAL, TRIAL_COMPLETE, RELEASED}"
        side_effects:
          - "set VarietyTrial.status = PLANTED"
          - "recompute TrialSite.occupied_plot_count"
          - "cross-entity: Variety.lifecycle_state moves CANDIDATE -> IN_TRIAL or TRIAL_COMPLETE -> IN_TRIAL per the Variety lifecycle machine; a RELEASED variety is left alone"
          - "increment VarietyTrial.version and TrialSite.version by 1, and Variety.version by 1 only when lifecycle_state actually changed"
      - from: PLANTED
        to: EVALUATED
        trigger: "POST /variety-trials/{trial_id}/evaluate"
        actor: TrialCoordinator
        preconditions:
          - "trial.status == PLANTED"
          - "logical clock now >= trial.harvest_date"
        side_effects:
          - "store yield_index, vigor_score, uniformity_score, disease_resistance_score and propagation_pass_rate from the payload"
          - "compute VarietyTrial.performance_index via calculations.trial_performance_index"
          - "set VarietyTrial.evaluated_at = logical clock now and VarietyTrial.status = EVALUATED"
          - "increment VarietyTrial.version by 1"
      - from: EVALUATED
        to: PASSED
        trigger: "POST /variety-trials/{trial_id}/certify"
        actor: BreederAdmin
        preconditions:
          - "trial.status == EVALUATED"
          - "trial.performance_index >= RELEASE_MIN_INDEX (72.00)"
          - "trial.propagation_pass_rate >= MIN_PASS_RATE (0.9500), inclusive at exactly 0.9500"
        side_effects:
          - "set VarietyTrial.status = PASSED"
          - "recompute TrialSite.occupied_plot_count (the trial's plots are released)"
          - "recompute Variety.passed_trial_region_count over DISTINCT TrialSite.region_code of this variety's PASSED trials"
          - "recompute Variety.regional_performance_index as the mean performance_index over this variety's PASSED trials"
          - "when the recomputed passed_trial_region_count >= 2, Variety.lifecycle_state moves IN_TRIAL -> TRIAL_COMPLETE"
          - "increment VarietyTrial.version, TrialSite.version and Variety.version by 1"
        note: "Fork branch A of the EVALUATED fork. The server picks the branch from the stored evaluation scores; the caller supplies no branch selector."
      - from: EVALUATED
        to: FAILED
        trigger: "POST /variety-trials/{trial_id}/certify"
        actor: BreederAdmin
        preconditions:
          - "trial.status == EVALUATED"
          - "trial.performance_index < 72.00 OR trial.propagation_pass_rate < 0.9500"
        side_effects:
          - "set VarietyTrial.status = FAILED"
          - "recompute TrialSite.occupied_plot_count (the trial's plots are released)"
          - "Variety.passed_trial_region_count and Variety.regional_performance_index are NOT recomputed"
          - "Variety.lifecycle_state is NOT changed"
          - "increment VarietyTrial.version and TrialSite.version by 1; Variety.version is NOT incremented"
        note: "Fork branch B. The divergent side-effect set - no variety recomputation and no Variety.version bump - is what distinguishes the branches observably."

  - entity: PropagatorAgreement
    state_field: status
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /propagator-agreements/{agreement_id}/countersign"
        actor: LicensingOfficer
        preconditions:
          - "agreement.status == PENDING_COUNTERSIGN"
          - "logical clock now < agreement.term_end"
        side_effects:
          - "set PropagatorAgreement.countersigned_by_user_id = the request's X-User-ID"
          - "set PropagatorAgreement.countersigned_at = logical clock now"
          - "set PropagatorAgreement.status = ACTIVE"
          - "increment PropagatorAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /propagator-agreements/{agreement_id}/suspend"
        actor: LicensingOfficer
        preconditions: ["agreement.status == ACTIVE"]
        side_effects:
          - "set PropagatorAgreement.status = SUSPENDED and suspension_reason = MANUAL"
          - "cascade level 1 (caused by the suspension): every ProductionQuota with agreement_id == this agreement and status == ACTIVE moves to FROZEN (processed created_at ASC, then season_code ASC)"
          - "increment PropagatorAgreement.version by 1 and each frozen ProductionQuota.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event raised whenever calculations.propagator_compliance_score variant rolling_120d is recomputed and yields compliance_score < SUSPEND_THRESHOLD (70)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "recomputed propagator.compliance_score < 70"
        side_effects:
          - "set PropagatorAgreement.status = SUSPENDED and suspension_reason = COMPLIANCE_SCORE_BREACH"
          - "cascade (caused by the suspension): every ProductionQuota of this agreement with status == ACTIVE moves to FROZEN"
          - "increment PropagatorAgreement.version by 1 and each frozen ProductionQuota.version by 1"
        note: "Recompute sites are listed in calculations.propagator_compliance_score.trigger. Recovery is never automatic: a later recompute that lifts the score back to >= 70 does NOT reinstate the agreement."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event raised by POST /audit-engagements/{engagement_id}/finalize with finding_severity == MATERIAL"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "engagement.finding_severity == MATERIAL"
        side_effects:
          - "set PropagatorAgreement.status = SUSPENDED and suspension_reason = AUDIT_FINDING"
          - "cascade (caused by the suspension): every ProductionQuota of this agreement with status == ACTIVE moves to FROZEN"
          - "increment PropagatorAgreement.version by 1 and each frozen ProductionQuota.version by 1"
        note: "When a MATERIAL finding also drops compliance_score below 70, suspension_reason is AUDIT_FINDING: the audit reason is applied first and the later compliance recompute finds the agreement already SUSPENDED and leaves suspension_reason alone."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /propagator-agreements/{agreement_id}/reinstate"
        actor: LicensingOfficer
        preconditions:
          - "agreement.status == SUSPENDED"
          - "propagator.compliance_score >= SUSPEND_THRESHOLD (70)"
          - "propagator.material_audit_finding_count == 0"
          - "logical clock now < agreement.term_end"
        side_effects:
          - "set PropagatorAgreement.status = ACTIVE and suspension_reason = null"
          - "increment PropagatorAgreement.reinstatement_count by 1"
          - "cascade level 1 (caused by the reinstatement): every ProductionQuota of this agreement with status == FROZEN moves back to ACTIVE"
          - "increment PropagatorAgreement.version by 1 and each thawed ProductionQuota.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE repeats; reinstatement_count records the laps."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /propagator-agreements/{agreement_id}/terminate"
        actor: LicensingOfficer
        preconditions:
          - "agreement.status IN {ACTIVE, SUSPENDED}"
          - "no RoyaltyReport of this agreement has review_status == ACCEPTED and settlement_status == UNSETTLED"
        side_effects:
          - "set PropagatorAgreement.status = TERMINATED"
          - "cascade level 1 (caused by the termination): every ProductionQuota of this agreement with status IN {ACTIVE, FROZEN} moves to CLOSED"
          - "cascade level 2 (caused by each quota closure): every TagOrder of that quota with status == REQUESTED moves to VOIDED with voided_units = requested_units"
          - "cascade level 1b (caused by the termination): every SublicenseGrant of this agreement with status IN {PROPOSED, ACTIVE} moves to REVOKED with revocation_reason = AGREEMENT_TERMINATED"
          - "cascade level 2b (caused by each revocation): recompute Variety.active_sublicense_count for each affected variety"
          - "increment PropagatorAgreement.version by 1 and the version of every mutated ProductionQuota, TagOrder, SublicenseGrant and Variety by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /propagator-agreements/{agreement_id}/terminate"
        actor: LicensingOfficer
        preconditions:
          - "agreement.status IN {ACTIVE, SUSPENDED}"
          - "no RoyaltyReport of this agreement has review_status == ACCEPTED and settlement_status == UNSETTLED"
        side_effects:
          - "the same cascade declared on the ACTIVE -> TERMINATED transition runs"
          - "increment PropagatorAgreement.version by 1"

  - entity: ProductionQuota
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system event raised by any PropagatorAgreement ACTIVE -> SUSPENDED transition"
        actor: system
        preconditions: ["quota.status == ACTIVE", "agreement.status has just become SUSPENDED"]
        side_effects:
          - "set ProductionQuota.status = FROZEN"
          - "increment ProductionQuota.version by 1"
        note: "FROZEN is a gate, not a terminal state: it blocks POST /tag-orders/{id}/issue and POST /royalty-reports/{id}/line-items for this quota."
      - from: FROZEN
        to: ACTIVE
        trigger: "system event raised by the PropagatorAgreement SUSPENDED -> ACTIVE transition"
        actor: system
        preconditions: ["quota.status == FROZEN", "agreement.status has just become ACTIVE"]
        side_effects:
          - "set ProductionQuota.status = ACTIVE"
          - "increment ProductionQuota.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event raised by PropagatorAgreement -> TERMINATED or Variety RELEASED -> RETIRED"
        actor: system
        preconditions: ["quota.status IN {ACTIVE, FROZEN}"]
        side_effects:
          - "set ProductionQuota.status = CLOSED"
          - "cascade (caused by the closure): every TagOrder of this quota with status == REQUESTED moves to VOIDED with voided_units = requested_units"
          - "increment ProductionQuota.version by 1 and each voided TagOrder.version by 1"
      - from: FROZEN
        to: CLOSED
        trigger: "system event raised by PropagatorAgreement -> TERMINATED or Variety RELEASED -> RETIRED"
        actor: system
        preconditions: ["quota.status IN {ACTIVE, FROZEN}"]
        side_effects:
          - "set ProductionQuota.status = CLOSED"
          - "cascade (caused by the closure): REQUESTED TagOrder rows of this quota move to VOIDED"
          - "increment ProductionQuota.version by 1"

  - entity: TagOrder
    state_field: status
    initial_state: REQUESTED
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /tag-orders/{tag_order_id}/issue"
        actor: LicensingOfficer
        preconditions:
          - "tag_order.status == REQUESTED"
          - "quota.status == ACTIVE"
          - "tag_order.requested_units <= quota.units_available"
        side_effects:
          - "mint TagOrder.serial_prefix as '<variety.breeder_code>-<quota.season_code>-<4-digit count of this quota's tag orders already in status ISSUED or RECONCILED, plus one, zero padded>'"
          - "set TagOrder.issued_at = logical clock now and TagOrder.status = ISSUED"
          - "recompute ProductionQuota.tags_committed_units and ProductionQuota.units_available via calculations.quota_tag_inventory"
          - "increment TagOrder.version and ProductionQuota.version by 1"
      - from: ISSUED
        to: RECONCILED
        trigger: "POST /tag-orders/{tag_order_id}/reconcile"
        actor: Propagator
        preconditions:
          - "tag_order.status == ISSUED"
          - "payload.activated_units <= tag_order.requested_units"
          - "the acting X-User-ID equals agreement.propagator_id for the quota's agreement"
        side_effects:
          - "set TagOrder.activated_units = payload.activated_units and TagOrder.status = RECONCILED"
          - "recompute ProductionQuota.tags_activated_units via calculations.quota_tag_inventory (tags_committed_units and units_available are unchanged: RECONCILED stays in the committed set)"
          - "increment TagOrder.version and ProductionQuota.version by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /tag-orders/{tag_order_id}/void"
        actor: LicensingOfficer
        preconditions: ["tag_order.status IN {REQUESTED, ISSUED}"]
        side_effects:
          - "set TagOrder.voided_units = TagOrder.requested_units and TagOrder.status = VOIDED"
          - "recompute ProductionQuota.tags_committed_units and units_available (a REQUESTED order was never committed, so both are unchanged)"
          - "increment TagOrder.version and ProductionQuota.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /tag-orders/{tag_order_id}/void"
        actor: LicensingOfficer
        preconditions: ["tag_order.status IN {REQUESTED, ISSUED}"]
        side_effects:
          - "set TagOrder.voided_units = TagOrder.requested_units and TagOrder.status = VOIDED"
          - "recompute ProductionQuota.tags_committed_units and units_available: the order drops out of the committed set, so units_available rises by exactly voided_units"
          - "increment TagOrder.version and ProductionQuota.version by 1"
        note: "Compensating action for the REQUESTED -> ISSUED commitment; calculations.quota_tag_inventory invariant I1 must hold before and after."

  - entity: RoyaltyReport
    state_field: review_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /royalty-reports/{report_id}/submit"
        actor: Propagator
        preconditions:
          - "report.review_status == DRAFT"
          - "agreement.status == ACTIVE"
          - "the report has at least one RoyaltyLineItem"
          - "the acting X-User-ID equals agreement.propagator_id"
        side_effects:
          - "set RoyaltyReport.submitted_at = logical clock now"
          - "set RoyaltyReport.is_late = (submitted_at > report.due_at)"
          - "recompute every RoyaltyLineItem.effective_rate_cents, billable_units and provisional_amount_cents, and RoyaltyReport.provisional_total_cents, via calculations.royalty_report_totals variant reported_basis"
          - "set RoyaltyReport.review_status = SUBMITTED"
          - "increment RoyaltyReport.version by 1 and each recomputed RoyaltyLineItem.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /royalty-reports/{report_id}/accept"
        actor: LicensingOfficer
        preconditions:
          - "report.review_status == SUBMITTED"
          - "agreement.status == ACTIVE"
          - "the acting X-User-ID != agreement.countersigned_by_user_id (segregation of duties)"
        side_effects:
          - "recompute every RoyaltyLineItem.billable_units, effective_rate_cents, final_amount_cents and overrun_flagged, and RoyaltyReport.final_total_cents, via calculations.royalty_report_totals variant audited_basis"
          - "set RoyaltyReport.late_fee_cents per calculations.royalty_report_totals step 4"
          - "set RoyaltyReport.booked_amount_cents = final_total_cents + late_fee_cents"
          - "set RoyaltyReport.accepted_at = logical clock now and accepted_by_user_id = the request's X-User-ID"
          - "set RoyaltyReport.review_status = ACCEPTED"
          - "cascade level 1 (caused by the acceptance): recompute Propagator.royalty_payable_cents via calculations.propagator_royalty_ledger"
          - "cascade level 2 (caused by the LATE_REPORT and QUOTA_OVERRUN penalty events that the acceptance materializes): recompute Propagator.compliance_score and lifetime_compliance_score via calculations.propagator_compliance_score"
          - "cascade level 3 (caused by a recomputed compliance_score < 70): the propagator's ACTIVE PropagatorAgreement rows move to SUSPENDED with suspension_reason = COMPLIANCE_SCORE_BREACH"
          - "cascade level 4 (caused by each suspension): that agreement's ACTIVE ProductionQuota rows move to FROZEN"
          - "increment RoyaltyReport.version, every RoyaltyLineItem.version and Propagator.version by 1, plus the version of every suspended agreement and frozen quota"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "POST /royalty-reports/{report_id}/dispute"
        actor: LicensingOfficer
        preconditions:
          - "report.review_status == ACCEPTED"
          - "report.settlement_status == UNSETTLED"
        side_effects:
          - "set RoyaltyReport.review_status = DISPUTED and RoyaltyReport.booked_amount_cents = 0"
          - "cascade level 1 (caused by the un-booking): recompute Propagator.royalty_payable_cents via calculations.propagator_royalty_ledger"
          - "increment RoyaltyReport.version and Propagator.version by 1"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "system event raised by POST /audit-engagements/{engagement_id}/finalize with finding_severity IN {MINOR, MATERIAL}"
        actor: system
        preconditions:
          - "report.review_status == ACCEPTED"
          - "report.settlement_status == UNSETTLED"
          - "engagement.royalty_report_id == report.id"
        side_effects:
          - "set RoyaltyReport.review_status = DISPUTED and RoyaltyReport.booked_amount_cents = 0"
          - "cascade (caused by the un-booking): recompute Propagator.royalty_payable_cents"
          - "increment RoyaltyReport.version and Propagator.version by 1"
        note: "A SETTLED or REVERSED report is never disputed by an audit finding; the engagement still reaches FINDINGS_ISSUED and the compliance penalty still lands."
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /royalty-reports/{report_id}/revise"
        actor: Propagator
        preconditions:
          - "report.review_status == DISPUTED"
          - "report.settlement_status == UNSETTLED"
          - "the acting X-User-ID equals agreement.propagator_id"
        side_effects:
          - "increment RoyaltyReport.revision_no by 1"
          - "reset RoyaltyReport.submitted_at, accepted_at, accepted_by_user_id to null and is_late to false"
          - "reset RoyaltyReport.final_total_cents, late_fee_cents and booked_amount_cents to 0 (provisional_total_cents and the line items are retained so the propagator can amend reported_units by adding lines for further quotas)"
          - "set RoyaltyReport.review_status = DRAFT"
          - "increment RoyaltyReport.version by 1"
        note: "Revision loop: ACCEPTED -> DISPUTED -> DRAFT -> SUBMITTED -> ACCEPTED may repeat any number of times; revision_no records the laps."

  - entity: RoyaltyReport
    state_field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [REVERSED]
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /royalty-reports/{report_id}/settle"
        actor: LicensingOfficer
        preconditions:
          - "report.settlement_status == UNSETTLED"
          - "report.review_status == ACCEPTED"
          - "report.booked_amount_cents > 0"
          - "the acting X-User-ID != report.accepted_by_user_id (segregation of duties)"
        side_effects:
          - "set RoyaltyReport.settlement_status = SETTLED and settled_by_user_id = the request's X-User-ID"
          - "cascade level 1 (caused by the settlement): recompute Propagator.royalty_payable_cents and Propagator.royalty_settled_cents via calculations.propagator_royalty_ledger"
          - "increment RoyaltyReport.version and Propagator.version by 1"
        note: "The settlement dimension is independent of the review dimension: this transition never touches review_status."
      - from: SETTLED
        to: REVERSED
        trigger: "POST /royalty-reports/{report_id}/reverse"
        actor: LicensingOfficer
        preconditions:
          - "report.settlement_status == SETTLED"
          - "report.review_status == ACCEPTED"
        side_effects:
          - "set RoyaltyReport.settlement_status = REVERSED and settled_by_user_id = null"
          - "cascade level 1 (caused by the reversal): recompute Propagator.royalty_payable_cents and Propagator.royalty_settled_cents; the reversed report re-enters the payable set"
          - "increment RoyaltyReport.version and Propagator.version by 1"
        note: "Compensating action for settle; calculations.propagator_royalty_ledger invariant I2 must hold before and after, and royalty_payable_cents must return to its exact pre-settle value."

  - entity: SublicenseGrant
    state_field: status
    initial_state: PROPOSED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /sublicense-grants/{grant_id}/activate"
        actor: LicensingOfficer
        preconditions:
          - "grant.status == PROPOSED"
          - "agreement.status == ACTIVE"
          - "variety.lifecycle_state == RELEASED"
          - "grant.jurisdiction_code IS a member of variety.protected_jurisdictions"
          - "logical clock now <= grant.expiry_date"
        side_effects:
          - "set SublicenseGrant.activated_at = logical clock now and SublicenseGrant.status = ACTIVE"
          - "recompute Variety.active_sublicense_count"
          - "increment SublicenseGrant.version and Variety.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /sublicense-grants/{grant_id}/revoke"
        actor: LicensingOfficer
        preconditions: ["grant.status IN {PROPOSED, ACTIVE}"]
        side_effects:
          - "set SublicenseGrant.status = REVOKED and revocation_reason = MANUAL"
          - "recompute Variety.active_sublicense_count"
          - "increment SublicenseGrant.version and Variety.version by 1"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /sublicense-grants/{grant_id}/revoke"
        actor: LicensingOfficer
        preconditions: ["grant.status IN {PROPOSED, ACTIVE}"]
        side_effects:
          - "set SublicenseGrant.status = REVOKED and revocation_reason = MANUAL"
          - "Variety.active_sublicense_count is unchanged (a PROPOSED grant was never counted)"
          - "increment SublicenseGrant.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system event raised by a ProtectionFiling transition into LAPSED whose jurisdiction_code matches this grant"
        actor: system
        preconditions:
          - "grant.status == ACTIVE"
          - "grant.jurisdiction_code dropped out of variety.protected_jurisdictions"
        side_effects:
          - "set SublicenseGrant.status = REVOKED and revocation_reason = PROTECTION_LAPSED"
          - "recompute Variety.active_sublicense_count"
          - "increment SublicenseGrant.version and Variety.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event raised by the POST /_clock/set_current_utc sweep when now > grant.expiry_date"
        actor: system
        preconditions: ["grant.status == ACTIVE", "logical clock now > grant.expiry_date"]
        side_effects:
          - "set SublicenseGrant.status = EXPIRED"
          - "recompute Variety.active_sublicense_count"
          - "increment SublicenseGrant.version and Variety.version by 1"

  - entity: SurveillanceCase
    state_field: status
    initial_state: OPENED
    terminal_states: [RESOLVED]
    transitions:
      - from: OPENED
        to: SAMPLED
        trigger: "POST /surveillance-cases/{case_id}/sample"
        actor: ComplianceAuditor
        preconditions: ["case.status == OPENED", "payload.sampled_unit_count >= 1"]
        side_effects:
          - "set SurveillanceCase.sampled_unit_count = payload.sampled_unit_count and status = SAMPLED"
          - "increment SurveillanceCase.version by 1"
      - from: SAMPLED
        to: TESTING
        trigger: "system event raised by the first POST /surveillance-cases/{case_id}/genetic-tests on this case"
        actor: system
        preconditions: ["case.status == SAMPLED"]
        side_effects:
          - "create the immutable GeneticTest row with result = MATCH when match_confidence >= 0.9000 else NO_MATCH"
          - "recompute SurveillanceCase.max_match_confidence as the maximum GeneticTest.match_confidence over this case's tests"
          - "set SurveillanceCase.status = TESTING"
          - "increment SurveillanceCase.version by 1"
        note: "Further genetic tests may be added while status == TESTING; each one refreshes max_match_confidence without changing the status."
      - from: TESTING
        to: MATCH_CONFIRMED
        trigger: "POST /surveillance-cases/{case_id}/conclude-testing"
        actor: ComplianceAuditor
        preconditions:
          - "case.status == TESTING"
          - "case.max_match_confidence >= GENETIC_MATCH_THRESHOLD (0.9000), inclusive at exactly 0.9000"
        side_effects:
          - "set SurveillanceCase.concluded_at = logical clock now and status = MATCH_CONFIRMED"
          - "cascade level 1 (caused by the confirmation, only when case.suspected_propagator_id is non-null): the CONFIRMED_UNAUTH_MATCH penalty event materializes and Propagator.compliance_score / lifetime_compliance_score are recomputed"
          - "cascade level 2 (caused by a recomputed compliance_score < 70): the propagator's ACTIVE agreements move to SUSPENDED with suspension_reason = COMPLIANCE_SCORE_BREACH"
          - "cascade level 3 (caused by each suspension): that agreement's ACTIVE quotas move to FROZEN"
          - "increment SurveillanceCase.version by 1 and the version of every mutated Propagator, PropagatorAgreement and ProductionQuota by 1"
        note: "Fork branch A of the TESTING fork; the server reads max_match_confidence, the caller supplies no branch selector."
      - from: TESTING
        to: NO_MATCH
        trigger: "POST /surveillance-cases/{case_id}/conclude-testing"
        actor: ComplianceAuditor
        preconditions:
          - "case.status == TESTING"
          - "case.max_match_confidence < 0.9000"
        side_effects:
          - "set SurveillanceCase.concluded_at = logical clock now and status = NO_MATCH"
          - "no penalty event materializes and no Propagator field changes"
          - "increment SurveillanceCase.version by 1"
        note: "Fork branch B: the divergent side-effect set is the absence of the compliance cascade."
      - from: MATCH_CONFIRMED
        to: RESOLVED
        trigger: "POST /surveillance-cases/{case_id}/resolve"
        actor: ComplianceAuditor
        preconditions: ["case.status IN {MATCH_CONFIRMED, NO_MATCH}"]
        side_effects:
          - "set recovered_damages_cents and enforcement_cost_cents from the payload"
          - "compute enforcement_recovery_cents, breeder_pool_cents and propagator_credit_cents via calculations.damages_waterfall"
          - "when suspected_propagator_id is non-null, add propagator_credit_cents to Propagator.damages_credit_cents"
          - "set SurveillanceCase.status = RESOLVED"
          - "increment SurveillanceCase.version by 1 and Propagator.version by 1 when a credit was applied"
      - from: NO_MATCH
        to: RESOLVED
        trigger: "POST /surveillance-cases/{case_id}/resolve"
        actor: ComplianceAuditor
        preconditions: ["case.status IN {MATCH_CONFIRMED, NO_MATCH}"]
        side_effects:
          - "the same damages waterfall runs on whatever recovered_damages_cents the payload carries (0 in the common NO_MATCH case)"
          - "set SurveillanceCase.status = RESOLVED"
          - "increment SurveillanceCase.version by 1"

  - entity: AuditEngagement
    state_field: status
    initial_state: OPENED
    terminal_states: [FINDINGS_ISSUED, CLOSED_NO_FINDING]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: "POST /audit-engagements/{engagement_id}/finalize with finding_severity IN {MINOR, MATERIAL}"
        actor: ComplianceAuditor
        preconditions:
          - "engagement.status == OPENED"
          - "payload.finding_severity IN {MINOR, MATERIAL}"
          - "payload.underreported_units >= 1"
        side_effects:
          - "set finding_severity, underreported_units, finalized_at = logical clock now, finalized_by_user_id = the request's X-User-ID and status = FINDINGS_ISSUED"
          - "cascade level 1 (caused by the finding, only when finding_severity == MATERIAL): recompute Propagator.material_audit_finding_count"
          - "cascade level 1b (caused by the finding): when the audited RoyaltyReport has review_status == ACCEPTED and settlement_status == UNSETTLED it moves to DISPUTED with booked_amount_cents = 0"
          - "cascade level 2 (caused by the un-booking in level 1b): recompute Propagator.royalty_payable_cents"
          - "cascade level 1c (caused by the MINOR_AUDIT_FINDING or MATERIAL_AUDIT_FINDING penalty event): recompute Propagator.compliance_score and lifetime_compliance_score"
          - "cascade level 2c (caused by finding_severity == MATERIAL): the agreement moves ACTIVE -> SUSPENDED with suspension_reason = AUDIT_FINDING; a MINOR finding suspends only when the recomputed compliance_score < 70, in which case suspension_reason = COMPLIANCE_SCORE_BREACH"
          - "cascade level 3c (caused by the suspension): that agreement's ACTIVE quotas move to FROZEN"
          - "increment AuditEngagement.version by 1 and the version of every mutated RoyaltyReport, Propagator, PropagatorAgreement and ProductionQuota by 1"
        note: "Fork branch A of the OPENED fork."
      - from: OPENED
        to: CLOSED_NO_FINDING
        trigger: "POST /audit-engagements/{engagement_id}/finalize with finding_severity == NONE"
        actor: ComplianceAuditor
        preconditions:
          - "engagement.status == OPENED"
          - "payload.finding_severity == NONE"
        side_effects:
          - "set finding_severity = NONE, underreported_units = 0, finalized_at = logical clock now, finalized_by_user_id = the request's X-User-ID and status = CLOSED_NO_FINDING"
          - "no penalty event materializes; the audited RoyaltyReport keeps review_status == ACCEPTED and its booked_amount_cents"
          - "increment AuditEngagement.version by 1"
        note: "Fork branch B: the divergent side-effect set is the absence of the dispute and compliance cascades."

concurrency_rules:
  - rule_id: tag-order-create-stale-quota
    parent_entity: ProductionQuota
    write_endpoint: "POST /tag-orders"
    occ_field: "expected_quota_version"
    description: |
      Requesting a TagOrder against a ProductionQuota whose version has
      advanced past the value the client last observed is rejected. A quota's
      version advances on every tag issuance, void, freeze, thaw and closure,
      so a client that read units_available before any of those and then
      requests tags is working from a stale view of the quota's remaining
      authorization. Multiple tag orders per quota are legitimate, so nothing
      in the state machine would otherwise reject the second create.
    error_id: ERR_STALE_QUOTA_VERSION
    http_status: 412

  - rule_id: line-item-create-stale-report
    parent_entity: RoyaltyReport
    write_endpoint: "POST /royalty-reports/{report_id}/line-items"
    occ_field: "expected_report_version"
    description: |
      Adding a RoyaltyLineItem to a RoyaltyReport whose version has advanced
      past the value the client last observed is rejected. The report's version
      advances when another line is added, when it is submitted, and when a
      revision resets its totals, so a stale view means the client is appending
      to a report whose provisional total it can no longer predict. Many lines
      per report are legitimate, so no state precondition covers this.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

  - rule_id: sublicense-create-stale-agreement
    parent_entity: PropagatorAgreement
    write_endpoint: "POST /sublicense-grants"
    occ_field: "expected_agreement_version"
    description: |
      Proposing a SublicenseGrant against a PropagatorAgreement whose version
      has advanced past the value the client last observed is rejected. The
      agreement's version advances on countersign, suspend, reinstate and
      terminate, each of which changes whether and where a sublicense may be
      granted. Many grants per agreement are legitimate, so the create would
      otherwise succeed.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

calculations:
  - name: trial_performance_index
    trigger: "per-trial on POST /variety-trials/{trial_id}/evaluate (writes VarietyTrial.performance_index); the aggregate step runs on POST /variety-trials/{trial_id}/certify when the trial PASSES and on the Variety IN_TRIAL -> TRIAL_COMPLETE transition (writes Variety.regional_performance_index and Variety.passed_trial_region_count)"
    algorithm: weighted_scoring
    formula: |
      # --- per-trial step (VarietyTrial.performance_index) ---
      # Evaluation order is PINNED: round each weighted component to 2 dp FIRST,
      # then sum, then apply the pass-rate multiplier, then round to 2 dp.
      # Rounding the sum of unrounded components instead can differ by 0.01.
      c_yield      = round_half_up(trial.yield_index              * W_YIELD,      2)
      c_vigor      = round_half_up(trial.vigor_score              * W_VIGOR,      2)
      c_uniformity = round_half_up(trial.uniformity_score         * W_UNIFORMITY, 2)
      c_disease    = round_half_up(trial.disease_resistance_score * W_DISEASE,    2)
      raw_score    = c_yield + c_vigor + c_uniformity + c_disease
      performance_index = round_half_up(raw_score * trial.propagation_pass_rate, 2)

      # --- aggregate step (Variety) ---
      passed = every VarietyTrial of this variety with status == PASSED
      passed_trial_region_count = count of DISTINCT TrialSite.region_code over `passed`
      if passed is empty:
        regional_performance_index = 0.00
      else:
        regional_performance_index = round_half_up(
            (sum of trial.performance_index over `passed`) / count(passed), 2)
      # Worked example (two PASSED trials in distinct regions):
      #   trial A: yield 88, vigor 76, uniformity 80, disease 70, pass_rate 0.9600
      #     -> 35.20 + 15.20 + 16.00 + 14.00 = 80.40; 80.40 * 0.9600 = 77.184 -> 77.18
      #   trial B: yield 82, vigor 74, uniformity 78, disease 68, pass_rate 0.9500
      #     -> 32.80 + 14.80 + 15.60 + 13.60 = 76.80; 76.80 * 0.9500 = 72.96   -> 72.96
      #   passed_trial_region_count = 2
      #   regional_performance_index = (77.18 + 72.96) / 2 = 75.07
    input_set: "Per-trial step: the single VarietyTrial being evaluated. Aggregate step: only VarietyTrial rows of this variety with status == PASSED. PLANNED, PLANTED, EVALUATED and FAILED trials are excluded from both the region count and the mean, so a FAILED trial with a high performance_index never lifts the variety's index."
    constants:
      W_YIELD: 0.40
      W_VIGOR: 0.20
      W_UNIFORMITY: 0.20
      W_DISEASE: 0.20
      MIN_PASS_RATE: 0.9500
      RELEASE_MIN_INDEX: 72.00
      MIN_RELEASE_REGIONS: 2
    precision: "performance_index and regional_performance_index: 2 decimal places, round_half_up. Each weighted component is independently rounded to 2 decimal places before summation (pinned order). propagation_pass_rate is a 4-decimal fraction and is never rounded."

  - name: variety_protection_posture
    trigger: "on every ProtectionFiling status transition (file, grant, schedule-annuity, pay-annuity, lapse, abandon, and the clock-sweep grace expiry); writes Variety.protection_posture and Variety.protected_jurisdictions"
    algorithm: projection
    formula: |
      filings = every ProtectionFiling with variety_id == variety.id
      in_force = filings where status IN {GRANTED, MAINTENANCE_DUE}
      pending  = filings where status IN {DRAFT, FILED}
      lapsed   = filings where status == LAPSED

      # First matching branch wins; the ladder is PINNED.
      if in_force is non-empty:   protection_posture = PROTECTED
      elif pending is non-empty:  protection_posture = PENDING
      elif lapsed is non-empty:   protection_posture = LAPSED_PROTECTION
      else:                       protection_posture = UNPROTECTED

      protected_jurisdictions = DISTINCT filing.jurisdiction_code over `in_force`,
                                sorted lexicographically ascending
      # MAINTENANCE_DUE keeps protection in force: an unpaid-but-in-grace annuity
      # does NOT remove the jurisdiction from protected_jurisdictions.
      # ABANDONED filings contribute to no branch and to no jurisdiction.
    input_set: "All ProtectionFiling rows of the variety. status == ABANDONED rows are excluded from every branch (an abandoned application is not pending, not in force, and not lapsed). Only {GRANTED, MAINTENANCE_DUE} rows contribute jurisdiction codes."
    constants:
      IN_FORCE_STATUSES: "GRANTED, MAINTENANCE_DUE"
      PENDING_STATUSES: "DRAFT, FILED"
    precision: "No arithmetic. protected_jurisdictions is a lexicographically ascending list of distinct uppercase jurisdiction codes; ordering is by the code itself, never by row creation order or id."

  - name: annuity_total_due
    trigger: "on POST /protection-filings/{filing_id}/pay-annuity (both to validate payload.paid_amount_cents and to write annuity_days_late, annuity_surcharge_cents, annuity_volume_credit_cents and annuity_total_due_cents)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and the tier lookups are NOT interchangeable:
      # the volume credit tier is keyed on the PRE-CREDIT total, not on the
      # final total_due it helps produce. Keying it on the final figure would be
      # circular and yields a different (lower) credit band on straddling inputs.

      # step 1 - lateness in whole days, floored, never negative
      elapsed_seconds = (logical_now - filing.annuity_due_date) as seconds
      annuity_days_late = max(0, floor(elapsed_seconds / 86400))

      # step 2 - late surcharge on the BASE amount only
      if   annuity_days_late == 0:                       surcharge_pct = 0.00
      elif 1  <= annuity_days_late <= 30:                surcharge_pct = 0.05
      elif 31 <= annuity_days_late <= 60:                surcharge_pct = 0.12
      else:                                              surcharge_pct = 0.20
      annuity_surcharge_cents = round_half_up(filing.annuity_base_cents * surcharge_pct, 0)

      # step 3 - pre-credit total
      pre_credit_total = filing.annuity_base_cents + annuity_surcharge_cents

      # step 4 - portfolio volume credit, keyed on pre_credit_total
      if   pre_credit_total < 200000:                    credit_pct = 0.00
      elif 200000 <= pre_credit_total <= 499999:         credit_pct = 0.03
      else:                                             credit_pct = 0.06
      annuity_volume_credit_cents = round_half_up(pre_credit_total * credit_pct, 0)

      # step 5 - amount payable
      annuity_total_due_cents = pre_credit_total - annuity_volume_credit_cents

      # Worked straddling example (the credit tier is crossed BY the surcharge):
      #   annuity_base_cents = 481000, annuity_days_late = 5
      #   surcharge_pct = 0.05 -> surcharge = round_half_up(24050.0) = 24050
      #   pre_credit_total = 481000 + 24050 = 505050  (>= 500000)
      #   credit_pct = 0.06 -> credit = round_half_up(30303.0) = 30303
      #   annuity_total_due_cents = 505050 - 30303 = 474747
      #   Keying the credit on the final figure instead would land in the
      #   200000..499999 band (0.03) and produce 489898 - a 15151-cent divergence.
    input_set: "The single ProtectionFiling being paid, evaluated against the logical clock at the moment of the call. Only filings in status MAINTENANCE_DUE are payable; annuity_sequence_no scopes the obligation to the current lap of the GRANTED -> MAINTENANCE_DUE -> GRANTED cycle, and figures from earlier laps are overwritten, never accumulated."
    constants:
      SECONDS_PER_DAY: 86400
      SURCHARGE_PCT_ON_TIME: 0.00
      SURCHARGE_PCT_1_30: 0.05
      SURCHARGE_PCT_31_60: 0.12
      SURCHARGE_PCT_61_PLUS: 0.20
      CREDIT_PCT_UNDER_200000: 0.00
      CREDIT_PCT_200000_499999: 0.03
      CREDIT_PCT_500000_PLUS: 0.06
      CREDIT_TIER_LOW_BOUND_CENTS: 200000
      CREDIT_TIER_HIGH_BOUND_CENTS: 500000
    precision: "All money is integer cents; each of annuity_surcharge_cents and annuity_volume_credit_cents is independently rounded to 0 decimal places with round_half_up before it enters the next step. annuity_days_late is a floored whole day count, so a 5-day-plus-23-hour delay is 5 days late."

  - name: effective_royalty_rate
    trigger: "per RoyaltyLineItem, inside calculations.royalty_report_totals, on POST /royalty-reports/{report_id}/submit and POST /royalty-reports/{report_id}/accept; writes RoyaltyLineItem.effective_rate_cents"
    algorithm: tiered_pricing
    formula: |
      quota     = the ProductionQuota referenced by the line item
      agreement = the PropagatorAgreement of the report
      variety   = the Variety of the quota

      # base rate is selected by the quota's royalty basis
      if quota.basis == PER_PLANT: base_rate = variety.base_royalty_cents_per_plant
      else:                        base_rate = variety.base_royalty_cents_per_acre

      # factor 1 - quality tier of the agreement
      tier_mult = {TIER_A: 1.15, TIER_B: 1.00, TIER_C: 0.85}[agreement.quality_tier]

      # factor 2 - territory class of the quota
      territory_mult = {EXPORT: 1.25, DOMESTIC: 1.00}[quota.territory_class]

      # factor 3 - volume band on the line's billable_units (variant-dependent;
      # see calculations.royalty_report_totals for how billable_units is derived)
      if   billable_units <= 10000:                 volume_mult = 1.00
      elif 10001 <= billable_units <= 50000:        volume_mult = 0.95
      else:                                         volume_mult = 0.90

      # factor 4 - regional performance premium, clamped into [0.00, 0.10]
      perf_mult = 1 + min(0.10, max(0.00,
                    (variety.regional_performance_index - RELEASE_MIN_INDEX) / 100))

      raw_rate = round_half_up(
          base_rate * tier_mult * territory_mult * volume_mult * perf_mult, 4)

      # collar: the effective rate may never stray far from the published base
      floor_rate = round_half_up(base_rate * RATE_FLOOR_FACTOR, 4)
      cap_rate   = round_half_up(base_rate * RATE_CAP_FACTOR,   4)
      effective_rate_cents = round_half_up(min(cap_rate, max(floor_rate, raw_rate)), 4)

      # Worked example: base_rate 35, TIER_A, DOMESTIC, billable_units 9800,
      # regional_performance_index 0.00 (perf_mult clamps to exactly 1.00):
      #   raw_rate = 35 * 1.15 * 1.00 * 1.00 * 1.00 = 40.2500
      #   collar   = [26.2500, 52.5000] -> unchanged -> 40.2500
    input_set: "The line item's own quota, that quota's variety, and the report's agreement. The volume band reads the line's billable_units, which differs between the reported_basis and audited_basis variants of royalty_report_totals - so the same line can land in different volume bands under the two variants."
    constants:
      TIER_MULT_A: 1.15
      TIER_MULT_B: 1.00
      TIER_MULT_C: 0.85
      TERRITORY_MULT_EXPORT: 1.25
      TERRITORY_MULT_DOMESTIC: 1.00
      VOLUME_MULT_TO_10000: 1.00
      VOLUME_MULT_10001_50000: 0.95
      VOLUME_MULT_50001_PLUS: 0.90
      VOLUME_BAND_1_UPPER: 10000
      VOLUME_BAND_2_UPPER: 50000
      RELEASE_MIN_INDEX: 72.00
      PERF_PREMIUM_CAP: 0.10
      RATE_FLOOR_FACTOR: 0.75
      RATE_CAP_FACTOR: 1.50
    precision: "effective_rate_cents carries 4 decimal places, round_half_up. The product is rounded to 4 dp once before the collar is applied, and the collared result is rounded to 4 dp again; floor_rate and cap_rate are each rounded to 4 dp before comparison."

  - name: royalty_report_totals
    trigger: "on POST /royalty-reports/{report_id}/submit (variant reported_basis) and on POST /royalty-reports/{report_id}/accept (variant audited_basis); writes RoyaltyLineItem.billable_units, effective_rate_cents, provisional_amount_cents, final_amount_cents and overrun_flagged, plus RoyaltyReport.provisional_total_cents, final_total_cents, late_fee_cents and booked_amount_cents"
    algorithm: aggregation
    formula: |
      lines = every RoyaltyLineItem with report_id == report.id,
              processed in created_at ASC order, ties broken by quota_id's
              season_code ASC then territory_code ASC (never by id)

      # step 1 - billable units (variant-dependent, see `variants` below)
      for each line in lines:
        if variant == reported_basis:
          line.billable_units = line.reported_units
        else:  # audited_basis
          line.billable_units = max(line.reported_units,
                                    quota_of(line).tags_activated_units)
          line.overrun_flagged = (quota_of(line).tags_activated_units
                                  > line.reported_units)

      # step 2 - per-line money. The rate's volume band is re-derived from the
      # billable_units computed in step 1, so the variant choice propagates
      # into the rate as well as into the quantity.
      for each line in lines:
        line.effective_rate_cents = calculations.effective_royalty_rate(line)
        amount = round_half_up(line.billable_units * line.effective_rate_cents, 0)
        if variant == reported_basis: line.provisional_amount_cents = amount
        else:                         line.final_amount_cents       = amount

      # step 3 - report total. Rounding order is PINNED: each line amount is
      # rounded to whole cents FIRST and the ALREADY-ROUNDED line amounts are
      # summed. Summing the unrounded products and rounding once at the end is
      # a different result.
      if variant == reported_basis:
        report.provisional_total_cents = sum of line.provisional_amount_cents
      else:
        report.final_total_cents = sum of line.final_amount_cents

      # step 4 - late fee and booked amount (audited_basis only)
      if variant == audited_basis:
        if report.is_late:
          report.late_fee_cents = round_half_up(report.final_total_cents * LATE_FEE_PCT, 0)
        else:
          report.late_fee_cents = 0
        report.booked_amount_cents = report.final_total_cents + report.late_fee_cents

      # Worked per-line-then-sum example (base_rate 35, TIER_C, EXPORT,
      # regional_performance_index 0.00 -> effective_rate_cents 37.1875):
      #   two lines, each reported_units = 2
      #   per line: round_half_up(2 * 37.1875) = round_half_up(74.375) = 74
      #   report total = 74 + 74 = 148
      #   sum-then-round would give round_half_up(148.75) = 149 - off by one cent.
    input_set: "Only RoyaltyLineItem rows whose report_id is this report; a line whose quota was later FROZEN or CLOSED still counts (the units were produced under a live quota). Lines belonging to any other report are excluded even when they reference the same quota."
    constants:
      LATE_FEE_PCT: 0.02
    precision: "Line amounts are rounded to 0 decimal places (whole cents) with round_half_up individually, and the report total is the sum of those already-rounded integers (pinned per-line-then-sum order). late_fee_cents is rounded to 0 decimal places with round_half_up."
    variants:
      - name: reported_basis
        when: "POST /royalty-reports/{report_id}/submit - the propagator's self-declared figures, written to billable_units / provisional_amount_cents / provisional_total_cents"
        difference: "billable_units = line.reported_units verbatim; overrun_flagged is left false; no late fee and no booked amount are produced; final_total_cents stays 0."
      - name: audited_basis
        when: "POST /royalty-reports/{report_id}/accept - the licensor's tag-verified figures, written to billable_units / final_amount_cents / final_total_cents / late_fee_cents / booked_amount_cents"
        difference: "billable_units = max(reported_units, quota.tags_activated_units), so tag activations above the self-declared figure raise the quantity AND can push the line into a lower volume_mult band, changing effective_rate_cents too; overrun_flagged is set per line; the late fee and booked_amount_cents are produced."
      - name: divergence_example
        when: "documentation only - the pinned figures the two variants must produce for identical stored data"
        difference: "Given base_royalty_cents_per_plant 35, quality_tier TIER_A, territory_class DOMESTIC, regional_performance_index 0.00, one line with reported_units 9800 and quota.tags_activated_units 12000: reported_basis yields billable_units 9800, effective_rate_cents 40.2500 and provisional_total_cents 394450; audited_basis yields billable_units 12000, effective_rate_cents 38.2375 (volume band drops to 0.95) and final_total_cents 458850."

  - name: propagator_compliance_score
    trigger: "recomputed on POST /royalty-reports/{report_id}/accept, on POST /audit-engagements/{engagement_id}/finalize, on the SurveillanceCase TESTING -> MATCH_CONFIRMED transition, and on every POST /_clock/set_current_utc call (the rolling window slides); writes Propagator.compliance_score and Propagator.lifetime_compliance_score"
    algorithm: decay_function
    formula: |
      # Penalty events are DERIVED from persisted rows - nothing is stored as an
      # event log. Each source contributes (penalty_points, event_at):
      #
      #   LATE_REPORT            6  <- RoyaltyReport where is_late == true
      #                                AND review_status == ACCEPTED;
      #                                event_at = report.submitted_at
      #   QUOTA_OVERRUN         15  <- RoyaltyLineItem where overrun_flagged == true
      #                                AND its report review_status == ACCEPTED;
      #                                event_at = report.accepted_at
      #   MINOR_AUDIT_FINDING   10  <- AuditEngagement where status == FINDINGS_ISSUED
      #                                AND finding_severity == MINOR;
      #                                event_at = engagement.finalized_at
      #   MATERIAL_AUDIT_FINDING 25 <- AuditEngagement where status == FINDINGS_ISSUED
      #                                AND finding_severity == MATERIAL;
      #                                event_at = engagement.finalized_at
      #   CONFIRMED_UNAUTH_MATCH 30 <- SurveillanceCase where status IN
      #                                {MATCH_CONFIRMED, RESOLVED} AND its
      #                                pre-resolution conclusion was MATCH_CONFIRMED
      #                                AND suspected_propagator_id == propagator.id;
      #                                event_at = case.concluded_at
      #
      # Report- and audit-sourced events are attributed to the propagator through
      # the agreement chain (report.agreement_id -> agreement.propagator_id).

      events = all derived penalty events for this propagator

      # variant rolling_120d (writes compliance_score)
      window_lower = logical_now - ROLLING_WINDOW_DAYS days   # EXCLUSIVE
      in_window = events where window_lower < event_at <= logical_now  # upper INCLUSIVE
      compliance_score = max(0, min(100,
          BASE_SCORE - (sum of penalty_points over in_window)))

      # variant lifetime (writes lifetime_compliance_score)
      lifetime_compliance_score = max(0, min(100,
          BASE_SCORE - (sum of penalty_points over events)))

      # suspension hook: whenever compliance_score is recomputed and lands
      # strictly below SUSPEND_THRESHOLD, every ACTIVE PropagatorAgreement of
      # this propagator moves to SUSPENDED (see §1.2). A later recompute that
      # lifts the score back to >= SUSPEND_THRESHOLD never reinstates anything.
    input_set: "Penalty events derived only from rows in the listed statuses: a SUBMITTED-but-not-yet-ACCEPTED late report contributes nothing, a DISPUTED report stops contributing its LATE_REPORT and QUOTA_OVERRUN points, an OPENED audit engagement contributes nothing, a CLOSED_NO_FINDING engagement contributes nothing, and a NO_MATCH surveillance case contributes nothing. Cases with a null suspected_propagator_id are attributed to no propagator."
    constants:
      BASE_SCORE: 100
      ROLLING_WINDOW_DAYS: 120
      PENALTY_LATE_REPORT: 6
      PENALTY_QUOTA_OVERRUN: 15
      PENALTY_MINOR_AUDIT_FINDING: 10
      PENALTY_MATERIAL_AUDIT_FINDING: 25
      PENALTY_CONFIRMED_UNAUTH_MATCH: 30
      SUSPEND_THRESHOLD: 70
      REINSTATE_THRESHOLD: 70
    precision: "Both scores are integers clamped to [0, 100]; no rounding is involved. The rolling window is half-open: an event exactly ROLLING_WINDOW_DAYS before logical_now has aged OUT (lower bound exclusive), while an event at exactly logical_now is IN (upper bound inclusive)."
    variants:
      - name: rolling_120d
        when: "always - this is the variant that gates suspension and reinstatement; written to Propagator.compliance_score"
        difference: "Only penalty events with window_lower < event_at <= logical_now are summed, so advancing the logical clock past an event's 120-day anniversary raises the score without any new API write."
      - name: lifetime
        when: "always - written to Propagator.lifetime_compliance_score for the audit record"
        difference: "Every penalty event ever derived is summed regardless of age, so this score never rises when the clock advances; it is monotonically non-increasing for a given set of source rows."

  - name: damages_waterfall
    trigger: "on POST /surveillance-cases/{case_id}/resolve; writes SurveillanceCase.enforcement_recovery_cents, breeder_pool_cents and propagator_credit_cents, and adds propagator_credit_cents to Propagator.damages_credit_cents when suspected_propagator_id is non-null"
    algorithm: waterfall_allocation
    formula: |
      recovered  = payload.recovered_damages_cents   (>= 0)
      enf_cost   = payload.enforcement_cost_cents    (>= 0)

      # bucket 1 - enforcement cost recovery fills FIRST, capped by what came in
      enforcement_recovery_cents = min(recovered, enf_cost)
      remainder_1 = recovered - enforcement_recovery_cents

      # bucket 2 - breeder pool, capped by the remainder AND by a fixed share of
      # the GROSS recovery (not of the remainder) - the two caps interact
      breeder_target = round_half_up(recovered * BREEDER_POOL_PCT, 0)
      breeder_pool_cents = min(remainder_1, breeder_target)
      remainder_2 = remainder_1 - breeder_pool_cents

      # bucket 3 - the residue is credited back to the propagator, absorbing
      # every rounding remainder so the allocation is exact
      propagator_credit_cents = remainder_2

      # invariant: recovered == enforcement_recovery_cents
      #                       + breeder_pool_cents
      #                       + propagator_credit_cents   (always, exactly)

      # Worked example: recovered 1000000, enf_cost 150000
      #   bucket 1 = 150000, remainder_1 = 850000
      #   breeder_target = round_half_up(700000.0) = 700000
      #   bucket 2 = min(850000, 700000) = 700000, remainder_2 = 150000
      #   bucket 3 = 150000
      # Overflow example: recovered 100000, enf_cost 150000
      #   bucket 1 = 100000, remainder_1 = 0, bucket 2 = 0, bucket 3 = 0
      #   (enforcement cost is only partly recovered; no bucket goes negative)
    input_set: "The single SurveillanceCase being resolved, plus its suspected Propagator when one is recorded. No other case's figures are pooled: each resolution allocates only its own recovered_damages_cents."
    constants:
      BREEDER_POOL_PCT: 0.70
    precision: "All amounts are integer cents. breeder_target is rounded to 0 decimal places with round_half_up; the final bucket takes the exact arithmetic remainder so the three buckets always sum to recovered_damages_cents with no drift."

  - name: quota_tag_inventory
    trigger: "on POST /tag-orders (no change to the derived fields, but the quota's version bumps), POST /tag-orders/{tag_order_id}/issue, POST /tag-orders/{tag_order_id}/reconcile, POST /tag-orders/{tag_order_id}/void, and the cascade voids raised by ProductionQuota -> CLOSED; writes ProductionQuota.tags_committed_units, units_available and tags_activated_units"
    algorithm: aggregation
    formula: |
      orders = every TagOrder with quota_id == quota.id

      committed = orders where status IN {ISSUED, RECONCILED}
      tags_committed_units = sum of order.requested_units over `committed`
      units_available      = quota.allocated_units - tags_committed_units

      activated = orders where status == RECONCILED
      tags_activated_units = sum of order.activated_units over `activated`

      # INVARIANT I1 (compensating): for every ProductionQuota, at every
      # observable instant,
      #     allocated_units == units_available + tags_committed_units
      # This must hold after issue (units_available falls by requested_units),
      # after reconcile (both sides unchanged - RECONCILED stays committed), and
      # after voiding an ISSUED order (units_available rises by exactly
      # requested_units, returning to its pre-issue value with no drift).
      # Voiding a REQUESTED order changes neither side, since a REQUESTED order
      # was never committed.
    input_set: "All TagOrder rows of this quota. REQUESTED orders are excluded from tags_committed_units (a request is not yet an authorization to print tags) and VOIDED orders are excluded from both sums, which is exactly what makes void the compensating action for issue. Only RECONCILED orders contribute activated units, so an ISSUED-but-unreconciled order contributes to committed units and nothing to activated units."
    constants:
      COMMITTED_STATUSES: "ISSUED, RECONCILED"
      ACTIVATED_STATUSES: "RECONCILED"
    precision: "All quantities are non-negative integers; no rounding. units_available is recomputed from the committed sum on every write, never adjusted by delta, so repeated issue/void cycles cannot accumulate drift."

  - name: propagator_royalty_ledger
    trigger: "on POST /royalty-reports/{report_id}/accept, POST /royalty-reports/{report_id}/dispute, POST /royalty-reports/{report_id}/settle, POST /royalty-reports/{report_id}/reverse, and the audit-driven ACCEPTED -> DISPUTED transition; writes Propagator.royalty_payable_cents and Propagator.royalty_settled_cents"
    algorithm: aggregation
    formula: |
      reports = every RoyaltyReport whose agreement.propagator_id == propagator.id

      accepted = reports where review_status == ACCEPTED
      royalty_payable_cents = sum of report.booked_amount_cents over
          `accepted` where settlement_status IN {UNSETTLED, REVERSED}
      royalty_settled_cents = sum of report.booked_amount_cents over
          `accepted` where settlement_status == SETTLED

      # INVARIANT I2 (compensating): for every Propagator, at every observable
      # instant,
      #     royalty_payable_cents + royalty_settled_cents
      #       == sum of booked_amount_cents over reports with
      #          review_status == ACCEPTED
      # settle moves one report's booked amount from the payable side to the
      # settled side; reverse moves the identical amount back, so
      # royalty_payable_cents must return to its exact pre-settle value.
      # dispute is NOT a compensation of settle: it zeroes booked_amount_cents
      # and therefore shrinks BOTH sides of the invariant's right-hand side.
    input_set: "Only RoyaltyReport rows reached through this propagator's agreements and having review_status == ACCEPTED. DRAFT, SUBMITTED and DISPUTED reports are excluded from both sums - and a DISPUTED report additionally carries booked_amount_cents == 0, so it would contribute nothing even if included. A REVERSED report is back on the payable side, not dropped from the ledger."
    constants:
      PAYABLE_SETTLEMENT_STATUSES: "UNSETTLED, REVERSED"
      SETTLED_SETTLEMENT_STATUSES: "SETTLED"
    precision: "Integer cents throughout; no rounding. Both fields are recomputed by full re-aggregation over the propagator's accepted reports on every write, never by incremental delta, so settle/reverse cycles cannot drift."

validations:
  - priority: 1
    category: auth
    check: "Both the X-User-ID and X-User-Role request headers are present and non-empty. No claim about the role's permissions is made yet."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The value of X-User-Role is one of the five declared roles AND appears in the called endpoint's `roles:` list in §1.5. Checked before any body parsing, so a forbidden role never learns whether its payload was well-formed."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: schema
    check: "The request body parses, carries every field marked required in the endpoint's `input:`, carries no unknown field, and every value satisfies its §1.1 constraints: enum members are declared values, integer quantities are >= 0 (or >= 1 where §1.1 says so), decimal fields carry no more precision than declared, and timestamp/date fields are ISO-8601. Rejected before any database lookup."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 4
    category: existence
    check: "Every templated path segment resolves to an existing row, validated STRICTLY LEFT-TO-RIGHT so the leftmost missing id decides the error. Each entity has its own code: ERR_VARIETY_NOT_FOUND, ERR_PROTECTION_FILING_NOT_FOUND, ERR_TRIAL_SITE_NOT_FOUND, ERR_VARIETY_TRIAL_NOT_FOUND, ERR_PROPAGATOR_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_QUOTA_NOT_FOUND, ERR_TAG_ORDER_NOT_FOUND, ERR_ROYALTY_REPORT_NOT_FOUND, ERR_LINE_ITEM_NOT_FOUND, ERR_SUBLICENSE_GRANT_NOT_FOUND, ERR_SURVEILLANCE_CASE_NOT_FOUND, ERR_GENETIC_TEST_NOT_FOUND, ERR_AUDIT_ENGAGEMENT_NOT_FOUND."
    error_id: ERR_VARIETY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to an existing row, validated in the order the fields are listed in the endpoint's `input:`. Uses the same per-entity 404 codes as priority 4 (e.g. an unknown variety_id on POST /production-quotas returns ERR_VARIETY_NOT_FOUND, an unknown quota_id on POST /royalty-reports/{report_id}/line-items returns ERR_QUOTA_NOT_FOUND)."
    error_id: ERR_QUOTA_NOT_FOUND
    http_status: 404
    applies_to: "POST /protection-filings, POST /variety-trials, POST /propagator-agreements, POST /production-quotas, POST /tag-orders, POST /royalty-reports, POST /royalty-reports/{report_id}/line-items, POST /sublicense-grants, POST /surveillance-cases, POST /surveillance-cases/{case_id}/genetic-tests, POST /audit-engagements"

  - priority: 6
    category: existence
    check: "When X-User-Role is Propagator (identity entity_backed:Propagator), the X-User-ID must equal the propagator reached from the target resource: agreement.propagator_id for a RoyaltyReport or its line items, and quota.agreement.propagator_id for a TagOrder. Another propagator's resources are indistinguishable from forbidden ones, not from missing ones."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /tag-orders, POST /tag-orders/{tag_order_id}/reconcile, POST /royalty-reports, POST /royalty-reports/{report_id}/line-items, POST /royalty-reports/{report_id}/submit, POST /royalty-reports/{report_id}/revise"

  - priority: 7
    category: state
    check: "The OCC guard declared in §1.2.1 holds: the supplied expected_<parent>_version equals the parent's current version. ERR_STALE_QUOTA_VERSION on POST /tag-orders, ERR_STALE_REPORT_VERSION on POST /royalty-reports/{report_id}/line-items, ERR_STALE_AGREEMENT_VERSION on POST /sublicense-grants. Evaluated after existence and ownership but before any state or business check, so a stale client learns its view is out of date rather than receiving a business verdict computed against data it has not seen."
    error_id: ERR_STALE_QUOTA_VERSION
    http_status: 412
    applies_to: "POST /tag-orders, POST /royalty-reports/{report_id}/line-items, POST /sublicense-grants"

  - priority: 8
    category: state
    check: "The target resource is not already in a terminal state for the state machine the action drives: Variety.lifecycle_state == RETIRED, Variety.brand_status == BRAND_ABANDONED, ProtectionFiling.status IN {LAPSED, ABANDONED}, VarietyTrial.status IN {PASSED, FAILED}, PropagatorAgreement.status == TERMINATED, ProductionQuota.status == CLOSED, TagOrder.status IN {RECONCILED, VOIDED}, RoyaltyReport.settlement_status == REVERSED (for settlement actions), SublicenseGrant.status IN {REVOKED, EXPIRED}, SurveillanceCase.status == RESOLVED, AuditEngagement.status IN {FINDINGS_ISSUED, CLOSED_NO_FINDING}. Checked before the generic transition check so a terminal resource yields the specific terminal code."
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every POST action endpoint that drives a §1.2 transition"

  - priority: 9
    category: state
    check: "The target resource's current state appears as the `from:` state of a §1.2 transition for this trigger. Covers non-terminal but wrong-state attempts: granting a DRAFT filing, paying an annuity on a GRANTED filing, evaluating a PLANNED trial, reconciling a REQUESTED tag order, accepting a DRAFT report, settling a SUBMITTED report, disputing an already-DISPUTED report, activating an already-ACTIVE sublicense, concluding testing on a SAMPLED case. Also makes every action idempotency-safe: a second identical trigger finds the resource past the `from:` state and is rejected."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST action endpoint that drives a §1.2 transition"

  - priority: 10
    category: state
    check: "The ProductionQuota that the operation consumes is not FROZEN. A frozen quota blocks tag issuance and blocks new royalty line items, because the underlying agreement is suspended and no further production is authorized."
    error_id: ERR_QUOTA_FROZEN
    http_status: 409
    applies_to: "POST /tag-orders, POST /tag-orders/{tag_order_id}/issue, POST /royalty-reports/{report_id}/line-items"

  - priority: 11
    category: business_safety
    check: "The governing PropagatorAgreement is in status ACTIVE. Required to add a royalty line item, submit or accept a report, request or issue tags, create a production quota, and activate a sublicense. A SUSPENDED or PENDING_COUNTERSIGN agreement authorizes no downstream production or billing activity."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /production-quotas, POST /tag-orders, POST /tag-orders/{tag_order_id}/issue, POST /royalty-reports/{report_id}/line-items, POST /royalty-reports/{report_id}/submit, POST /royalty-reports/{report_id}/accept, POST /sublicense-grants/{grant_id}/activate"

  - priority: 12
    category: business_safety
    check: "Segregation of duties over X-User-ID: on POST /royalty-reports/{report_id}/accept the acting X-User-ID must differ from agreement.countersigned_by_user_id; on POST /royalty-reports/{report_id}/settle the acting X-User-ID must differ from report.accepted_by_user_id. The same officer may never both commit the licensor to the agreement and accept billing under it, nor both accept a report and disburse against it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /royalty-reports/{report_id}/accept, POST /royalty-reports/{report_id}/settle"

  - priority: 13
    category: business_safety
    check: "On POST /sublicense-grants/{grant_id}/activate, the grant's jurisdiction_code is a member of variety.protected_jurisdictions - i.e. that variety holds a ProtectionFiling in status GRANTED or MAINTENANCE_DUE for that jurisdiction. No royalty-bearing sublicense may be activated where the variety carries no enforceable right."
    error_id: ERR_PROTECTION_NOT_IN_FORCE
    http_status: 422
    applies_to: "POST /sublicense-grants/{grant_id}/activate"

  - priority: 14
    category: business_safety
    check: "On POST /sublicense-grants/{grant_id}/activate, variety.lifecycle_state == RELEASED. A variety still in trialing (or already retired) may not be sublicensed to nurseries or retail programs."
    error_id: ERR_VARIETY_NOT_RELEASED
    http_status: 422
    applies_to: "POST /sublicense-grants/{grant_id}/activate"

  - priority: 15
    category: business_safety
    check: "On POST /varieties/{variety_id}/release, the variety satisfies every release criterion: passed_trial_region_count >= MIN_RELEASE_REGIONS (2), regional_performance_index >= RELEASE_MIN_INDEX (72.00), and protection_posture IN {PENDING, PROTECTED}. An UNPROTECTED or LAPSED_PROTECTION variety is never commercially released."
    error_id: ERR_RELEASE_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /varieties/{variety_id}/release"

  - priority: 16
    category: business_safety
    check: "On POST /propagator-agreements/{agreement_id}/reinstate, propagator.compliance_score >= REINSTATE_THRESHOLD (70). Reinstatement is never automatic and never available while the rolling compliance score is still below the suspension threshold."
    error_id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /propagator-agreements/{agreement_id}/reinstate"

  - priority: 17
    category: business_safety
    check: "On POST /propagator-agreements/{agreement_id}/reinstate, propagator.material_audit_finding_count == 0. A propagator carrying an unresolved MATERIAL audit finding cannot be reinstated even when the rolling score has recovered above 70."
    error_id: ERR_MATERIAL_FINDING_UNRESOLVED
    http_status: 422
    applies_to: "POST /propagator-agreements/{agreement_id}/reinstate"

  - priority: 18
    category: business_referential
    check: "On POST /royalty-reports/{report_id}/line-items, quota.agreement_id == report.agreement_id. A propagator may not bill units produced under one agreement on a report filed under another."
    error_id: ERR_QUOTA_AGREEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /royalty-reports/{report_id}/line-items"

  - priority: 19
    category: business_referential
    check: "The territory being licensed is inside the agreement's licensed footprint: on POST /production-quotas, payload.territory_code is a member of agreement.territory_codes; on POST /sublicense-grants, payload.territory_code is a member of agreement.territory_codes."
    error_id: ERR_TERRITORY_NOT_LICENSED
    http_status: 422
    applies_to: "POST /production-quotas, POST /sublicense-grants"

  - priority: 20
    category: business_referential
    check: "On POST /audit-engagements, the audited RoyaltyReport belongs to the audited agreement: royalty_report.agreement_id == payload.agreement_id."
    error_id: ERR_REPORT_ENGAGEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /audit-engagements"

  - priority: 21
    category: business_referential
    check: "On POST /varieties/{variety_id}/brand-register and POST /varieties/{variety_id}/brand-renew, the brand mark is kept separate from the variety denomination: payload.brand_mark_text must not equal this variety's denomination, must not equal any other Variety.denomination, and must not equal any other Variety.brand_mark_text, all compared case-insensitively after trimming. The variety name is generic once protection lapses, so it may never double as the trademark."
    error_id: ERR_BRAND_CONFLICTS_DENOMINATION
    http_status: 422
    applies_to: "POST /varieties/{variety_id}/brand-register, POST /varieties/{variety_id}/brand-renew"

  - priority: 22
    category: business_constraint
    check: "Variety.denomination is unique across all varieties, compared case-insensitively after trimming."
    error_id: ERR_DUPLICATE_DENOMINATION
    http_status: 409
    applies_to: "POST /varieties"

  - priority: 23
    category: business_constraint
    check: "At most one ProtectionFiling per (variety_id, instrument_type, jurisdiction_code) may exist in a non-terminal or in-force status, i.e. in status IN {DRAFT, FILED, GRANTED, MAINTENANCE_DUE}. Once a filing is LAPSED or ABANDONED a replacement filing for the same triple may be created."
    error_id: ERR_DUPLICATE_FILING_JURISDICTION
    http_status: 409
    applies_to: "POST /protection-filings"

  - priority: 24
    category: business_constraint
    check: "At most one ProductionQuota per (agreement_id, variety_id, season_code, territory_code) may exist with status IN {ACTIVE, FROZEN}. A CLOSED quota does not block a replacement."
    error_id: ERR_DUPLICATE_QUOTA_SEASON
    http_status: 409
    applies_to: "POST /production-quotas"

  - priority: 25
    category: business_constraint
    check: "At most one RoyaltyReport per (agreement_id, period_code) may exist, regardless of review_status or settlement_status. Corrections go through the DISPUTED -> DRAFT revision loop, never through a second report for the same period."
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /royalty-reports"

  - priority: 26
    category: business_constraint
    check: "At most one RoyaltyLineItem per (report_id, quota_id). Reporting the same quota twice on one report would double-count the same production."
    error_id: ERR_DUPLICATE_LINE_ITEM_QUOTA
    http_status: 409
    applies_to: "POST /royalty-reports/{report_id}/line-items"

  - priority: 27
    category: business_constraint
    check: "On POST /varieties/{variety_id}/retire, variety.active_sublicense_count == 0. A variety with live nursery or retail sublicenses may not be retired; the grants must be revoked or allowed to expire first."
    error_id: ERR_ACTIVE_SUBLICENSES_EXIST
    http_status: 409
    applies_to: "POST /varieties/{variety_id}/retire"

  - priority: 28
    category: business_constraint
    check: "On POST /propagator-agreements/{agreement_id}/terminate, no RoyaltyReport of this agreement has review_status == ACCEPTED together with settlement_status == UNSETTLED. Accepted-but-unpaid royalties must be settled or disputed before the agreement is closed out."
    error_id: ERR_UNSETTLED_ROYALTY_OUTSTANDING
    http_status: 409
    applies_to: "POST /propagator-agreements/{agreement_id}/terminate"

  - priority: 29
    category: business_temporal
    check: "Every supplied interval is well-ordered with the boundary semantics §1.1 declares: VarietyTrial requires plant_date < harvest_date (half-open [plant_date, harvest_date)); PropagatorAgreement requires term_start < term_end; RoyaltyReport requires period_start < period_end and period_end <= due_at; SublicenseGrant requires effective_date <= expiry_date (closed [effective_date, expiry_date]); brand-register and brand-renew require brand_renewal_due_at > the logical clock now; schedule-annuity requires annuity_due_date > the logical clock now."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /variety-trials, POST /propagator-agreements, POST /royalty-reports, POST /sublicense-grants, POST /varieties/{variety_id}/brand-register, POST /varieties/{variety_id}/brand-renew, POST /protection-filings/{filing_id}/schedule-annuity"

  - priority: 30
    category: business_temporal
    check: "The requested window sits inside the agreement's term: on POST /royalty-reports, agreement.term_start <= period_start AND period_end <= agreement.term_end; on POST /sublicense-grants, agreement.term_start <= effective_date AND expiry_date <= agreement.term_end."
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /royalty-reports, POST /sublicense-grants"

  - priority: 31
    category: business_temporal
    check: "The trial calendar has been reached: POST /variety-trials/{trial_id}/plant requires logical clock now >= trial.plant_date, and POST /variety-trials/{trial_id}/evaluate requires logical clock now >= trial.harvest_date. A trial cannot be planted before its plant date nor evaluated before harvest."
    error_id: ERR_TRIAL_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /variety-trials/{trial_id}/plant, POST /variety-trials/{trial_id}/evaluate"

  - priority: 32
    category: business_temporal
    check: "On POST /protection-filings/{filing_id}/pay-annuity, the logical clock now is at or before filing.annuity_due_date plus filing.annuity_grace_days days. The grace boundary is INCLUSIVE: a payment landing at exactly due_date + grace_days seconds-equal instant is accepted, and the next instant is not. Past the boundary the only remaining path is the clock-sweep transition to LAPSED."
    error_id: ERR_GRACE_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /protection-filings/{filing_id}/pay-annuity"

  - priority: 33
    category: business_temporal
    check: "On POST /sublicense-grants/{grant_id}/activate, no other SublicenseGrant with the same (variety_id, territory_code) and status == ACTIVE occupies an overlapping window when either grant has exclusivity == EXCLUSIVE. Windows are the closed interval [effective_date, expiry_date] extended by EXCLUSIVITY_BUFFER_DAYS (30) on BOTH ends of the already-active grant; overlap is tested against the candidate's un-extended closed interval. Two NON_EXCLUSIVE grants may overlap freely."
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /sublicense-grants/{grant_id}/activate"

  - priority: 34
    category: business_temporal
    check: "On POST /_clock/set_current_utc, payload.current_utc is strictly greater than the clock's present value (the startup default is 2026-08-01T00:00:00Z). The logical clock only moves forward, so already-fired sweeps are never replayed."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 35
    category: business_fiscal
    check: "On POST /variety-trials/{trial_id}/plant, the trial site has room: the sum of plot_count over every VarietyTrial at that trial_site_id with status IN {PLANNED, PLANTED} whose half-open window [plant_date, harvest_date) overlaps this trial's window, INCLUDING this trial, must not exceed trial_site.plot_capacity. Adjacency is not overlap: a trial whose harvest_date equals another's plant_date does not co-occupy the site within one shared window."
    error_id: ERR_TRIAL_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /variety-trials/{trial_id}/plant"

  - priority: 36
    category: business_fiscal
    check: "On POST /tag-orders/{tag_order_id}/issue, tag_order.requested_units <= quota.units_available as recomputed by calculations.quota_tag_inventory. Tags are the traceability instrument that makes royalties verifiable, so no more may be issued than the quota authorizes."
    error_id: ERR_QUOTA_UNITS_EXCEEDED
    http_status: 422
    applies_to: "POST /tag-orders/{tag_order_id}/issue"

  - priority: 37
    category: business_fiscal
    check: "On POST /tag-orders/{tag_order_id}/reconcile, payload.activated_units <= tag_order.requested_units. A propagator can activate fewer tags than were issued, never more."
    error_id: ERR_ACTIVATION_EXCEEDS_ISSUED
    http_status: 422
    applies_to: "POST /tag-orders/{tag_order_id}/reconcile"

  - priority: 38
    category: business_fiscal
    check: "On POST /protection-filings/{filing_id}/pay-annuity, payload.paid_amount_cents equals the annuity_total_due_cents produced by calculations.annuity_total_due at this instant. Underpaying or overpaying the maintenance annuity is rejected rather than partially applied, because a partial payment would leave the filing's lapse date ambiguous."
    error_id: ERR_ANNUITY_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /protection-filings/{filing_id}/pay-annuity"

  - priority: 39
    category: business_fiscal
    check: "On POST /royalty-reports/{report_id}/submit, the report has at least one RoyaltyLineItem. An empty report has no reported units and would compute a zero total that is indistinguishable from a genuine zero-production period."
    error_id: ERR_REPORT_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /royalty-reports/{report_id}/submit"

  - priority: 40
    category: business_fiscal
    check: "On POST /royalty-reports/{report_id}/settle, report.booked_amount_cents > 0. A report whose booked amount is zero - including one zeroed by a dispute - has nothing to disburse."
    error_id: ERR_NOTHING_TO_SETTLE
    http_status: 422
    applies_to: "POST /royalty-reports/{report_id}/settle"

endpoints:
  # ---------------------------------------------------------------- Variety
  - method: POST
    path: "/varieties"
    description: "Register a new breeding candidate with its published per-plant and per-acre base royalty rates."
    roles: [BreederAdmin]
    code: 201
    input: [denomination, species, breeder_code, "royalty_basis_default?", base_royalty_cents_per_plant, base_royalty_cents_per_acre]
    output: Variety
    side_effects: ["creates Variety with lifecycle_state = CANDIDATE, brand_status = BRAND_NONE, protection_posture = UNPROTECTED, protected_jurisdictions = [], regional_performance_index = 0.00, passed_trial_region_count = 0, active_sublicense_count = 0, version = 1"]

  - method: GET
    path: "/varieties"
    description: "List varieties, optionally filtered by species, lifecycle state or protection posture."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["species?", "lifecycle_state?", "protection_posture?", "limit?", "offset?"]
    output: Variety[]
    side_effects: []

  - method: GET
    path: "/varieties/{variety_id}"
    description: "Fetch one variety including its computed protection posture, protected jurisdiction list, regional performance index and active sublicense count."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: Variety
    side_effects: []

  - method: POST
    path: "/varieties/{variety_id}/release"
    description: "Release a trial-complete variety for commercial propagation."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: Variety
    side_effects: ["drives Variety.lifecycle_state TRIAL_COMPLETE -> RELEASED", "sets released_at = logical clock now", "increments Variety.version"]

  - method: POST
    path: "/varieties/{variety_id}/retire"
    description: "Retire a released variety, closing every production quota that references it."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: Variety
    side_effects: ["drives Variety.lifecycle_state RELEASED -> RETIRED", "cascade: ACTIVE and FROZEN ProductionQuota rows of this variety move to CLOSED, then their REQUESTED TagOrder rows move to VOIDED", "increments Variety.version and the version of every cascaded quota and tag order"]

  - method: POST
    path: "/varieties/{variety_id}/brand-register"
    description: "Register the commercial trademark for a variety. The mark is deliberately separate from the variety denomination and is validated against every existing denomination and mark."
    roles: [BreederAdmin]
    code: 200
    input: [brand_mark_text, brand_registry_class, brand_renewal_due_at]
    output: Variety
    side_effects: ["drives Variety.brand_status BRAND_NONE -> BRAND_REGISTERED", "sets brand_mark_text, brand_registry_class, brand_renewal_due_at and brand_registered_on = logical clock now", "increments Variety.version"]

  - method: POST
    path: "/varieties/{variety_id}/brand-renew"
    description: "Renew a trademark whose renewal became due, optionally restating the mark text, and set the next renewal date."
    roles: [BreederAdmin]
    code: 200
    input: [brand_mark_text, brand_renewal_due_at]
    output: Variety
    side_effects: ["drives Variety.brand_status BRAND_RENEWAL_DUE -> BRAND_REGISTERED", "increments brand_renewal_count", "sets brand_registered_on = logical clock now and brand_renewal_due_at from the payload", "increments Variety.version"]

  - method: POST
    path: "/varieties/{variety_id}/brand-abandon"
    description: "Abandon the trademark. The variety's lifecycle and protection state are untouched: brand and protection are independent dimensions."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: Variety
    side_effects: ["drives Variety.brand_status BRAND_REGISTERED or BRAND_RENEWAL_DUE -> BRAND_ABANDONED", "increments Variety.version"]

  # ------------------------------------------------------- ProtectionFiling
  - method: POST
    path: "/protection-filings"
    description: "Open a plant patent or plant variety certificate application for a variety in one jurisdiction."
    roles: [BreederAdmin]
    code: 201
    input: [variety_id, instrument_type, jurisdiction_code, "term_years?", annuity_base_cents]
    output: ProtectionFiling
    side_effects: ["creates ProtectionFiling with status = DRAFT, annuity_sequence_no = 0, installments_paid_count = 0, version = 1"]

  - method: GET
    path: "/protection-filings"
    description: "List protection filings; filter by variety_id to walk a variety's protection portfolio, or by status / jurisdiction_code."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["variety_id?", "status?", "jurisdiction_code?", "limit?", "offset?"]
    output: ProtectionFiling[]
    side_effects: []

  - method: GET
    path: "/protection-filings/{filing_id}"
    description: "Fetch one protection filing including its computed annuity figures for the current maintenance lap."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: ProtectionFiling
    side_effects: []

  - method: POST
    path: "/protection-filings/{filing_id}/file"
    description: "File the drafted application with the jurisdiction's registry."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: ProtectionFiling
    side_effects: ["drives ProtectionFiling.status DRAFT -> FILED", "sets filed_on = logical clock now", "recomputes Variety.protection_posture (UNPROTECTED -> PENDING)", "increments ProtectionFiling.version and Variety.version"]

  - method: POST
    path: "/protection-filings/{filing_id}/grant"
    description: "Record the registry's grant of protection."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: ProtectionFiling
    side_effects: ["drives ProtectionFiling.status FILED -> GRANTED", "sets granted_on = logical clock now", "recomputes Variety.protection_posture (-> PROTECTED) and Variety.protected_jurisdictions (adds jurisdiction_code in lexicographic position)", "increments ProtectionFiling.version and Variety.version"]

  - method: POST
    path: "/protection-filings/{filing_id}/schedule-annuity"
    description: "Post the next maintenance annuity onto the filing's calendar, opening a new lap of the GRANTED -> MAINTENANCE_DUE -> GRANTED cycle."
    roles: [BreederAdmin]
    code: 200
    input: [annuity_due_date, "annuity_grace_days?"]
    output: ProtectionFiling
    side_effects: ["drives ProtectionFiling.status GRANTED -> MAINTENANCE_DUE", "increments annuity_sequence_no", "sets annuity_due_date and annuity_grace_days, and resets annuity_days_late, annuity_surcharge_cents, annuity_volume_credit_cents and annuity_total_due_cents to 0", "increments ProtectionFiling.version", "Variety.protection_posture is unchanged - MAINTENANCE_DUE is still in force"]

  - method: POST
    path: "/protection-filings/{filing_id}/pay-annuity"
    description: "Pay the outstanding maintenance annuity. The amount due is computed by calculations.annuity_total_due at the moment of the call and the payload must match it exactly."
    roles: [BreederAdmin]
    code: 200
    input: [paid_amount_cents]
    output: ProtectionFiling
    side_effects: ["computes annuity_days_late, annuity_surcharge_cents, annuity_volume_credit_cents and annuity_total_due_cents via calculations.annuity_total_due", "drives ProtectionFiling.status MAINTENANCE_DUE -> GRANTED", "increments installments_paid_count and sets granted_on = logical clock now", "increments ProtectionFiling.version"]

  - method: POST
    path: "/protection-filings/{filing_id}/lapse"
    description: "Voluntarily abandon maintenance of a granted or in-maintenance filing, letting protection lapse in that jurisdiction."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: ProtectionFiling
    side_effects: ["drives ProtectionFiling.status GRANTED or MAINTENANCE_DUE -> LAPSED with lapse_reason = VOLUNTARY_LAPSE", "cascade level 1: recomputes Variety.protection_posture and Variety.protected_jurisdictions", "cascade level 2: ACTIVE SublicenseGrant rows for that variety and jurisdiction move to REVOKED with revocation_reason = PROTECTION_LAPSED", "cascade level 3: recomputes Variety.active_sublicense_count", "increments the version of the filing, the variety and every revoked grant"]

  - method: POST
    path: "/protection-filings/{filing_id}/abandon"
    description: "Abandon a draft or filed application before grant."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: ProtectionFiling
    side_effects: ["drives ProtectionFiling.status DRAFT or FILED -> ABANDONED", "recomputes Variety.protection_posture", "increments ProtectionFiling.version and Variety.version"]

  # ------------------------------------------------------------- TrialSite
  - method: POST
    path: "/trial-sites"
    description: "Register a regional trialing site with a fixed plot capacity."
    roles: [TrialCoordinator]
    code: 201
    input: [site_name, region_code, plot_capacity]
    output: TrialSite
    side_effects: ["creates TrialSite with occupied_plot_count = 0 and version = 1"]

  - method: GET
    path: "/trial-sites"
    description: "List trial sites, optionally filtered by region_code."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: TrialSite[]
    side_effects: []

  - method: GET
    path: "/trial-sites/{trial_site_id}"
    description: "Fetch one trial site including its computed occupied plot count."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: TrialSite
    side_effects: []

  # ----------------------------------------------------------- VarietyTrial
  - method: POST
    path: "/variety-trials"
    description: "Schedule a regional performance trial of a variety at a site over the half-open window [plant_date, harvest_date)."
    roles: [TrialCoordinator]
    code: 201
    input: [variety_id, trial_site_id, plot_count, plant_date, harvest_date]
    output: VarietyTrial
    side_effects: ["creates VarietyTrial with status = PLANNED, performance_index = 0.00 and version = 1"]

  - method: GET
    path: "/variety-trials"
    description: "List trials; filter by variety_id to walk a variety's trialing history or by trial_site_id to walk a site's booking calendar."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["variety_id?", "trial_site_id?", "status?", "limit?", "offset?"]
    output: VarietyTrial[]
    side_effects: []

  - method: GET
    path: "/variety-trials/{trial_id}"
    description: "Fetch one trial including its computed performance index."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: VarietyTrial
    side_effects: []

  - method: POST
    path: "/variety-trials/{trial_id}/plant"
    description: "Plant a scheduled trial, consuming plots at the site for the duration of its window."
    roles: [TrialCoordinator]
    code: 200
    input: []
    output: VarietyTrial
    side_effects: ["drives VarietyTrial.status PLANNED -> PLANTED after the aggregate site-capacity check over overlapping [plant_date, harvest_date) windows", "recomputes TrialSite.occupied_plot_count", "cross-entity: Variety.lifecycle_state moves CANDIDATE -> IN_TRIAL or TRIAL_COMPLETE -> IN_TRIAL", "increments VarietyTrial.version and TrialSite.version, and Variety.version when the lifecycle state changed"]

  - method: POST
    path: "/variety-trials/{trial_id}/evaluate"
    description: "Record the post-harvest evaluation scores and compute the trial's weighted performance index."
    roles: [TrialCoordinator]
    code: 200
    input: [yield_index, vigor_score, uniformity_score, disease_resistance_score, propagation_pass_rate]
    output: VarietyTrial
    side_effects: ["stores the five evaluation inputs", "computes VarietyTrial.performance_index via calculations.trial_performance_index", "drives VarietyTrial.status PLANTED -> EVALUATED and sets evaluated_at = logical clock now", "increments VarietyTrial.version"]

  - method: POST
    path: "/variety-trials/{trial_id}/certify"
    description: "Certify an evaluated trial. The server chooses PASSED or FAILED from the stored performance index and propagation pass rate; the caller supplies no branch selector."
    roles: [BreederAdmin]
    code: 200
    input: []
    output: VarietyTrial
    side_effects: ["drives VarietyTrial.status EVALUATED -> PASSED when performance_index >= 72.00 AND propagation_pass_rate >= 0.9500, else EVALUATED -> FAILED", "recomputes TrialSite.occupied_plot_count on both branches", "on PASSED only: recomputes Variety.passed_trial_region_count and Variety.regional_performance_index, and moves Variety.lifecycle_state IN_TRIAL -> TRIAL_COMPLETE once the region count reaches 2", "increments VarietyTrial.version and TrialSite.version; Variety.version is incremented on the PASSED branch only"]

  # ------------------------------------------------------------ Propagator
  - method: POST
    path: "/propagators"
    description: "Register a propagator counterparty. Its compliance and money fields all start at their clean baselines."
    roles: [LicensingOfficer]
    code: 201
    input: [legal_name, home_territory_code]
    output: Propagator
    side_effects: ["creates Propagator with compliance_score = 100, lifetime_compliance_score = 100, royalty_payable_cents = 0, royalty_settled_cents = 0, damages_credit_cents = 0, material_audit_finding_count = 0 and version = 1"]

  - method: GET
    path: "/propagators"
    description: "List propagators, optionally filtered by home territory."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["home_territory_code?", "limit?", "offset?"]
    output: Propagator[]
    side_effects: []

  - method: GET
    path: "/propagators/{propagator_id}"
    description: "Fetch one propagator including the rolling and lifetime compliance scores and the royalty ledger fields."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: Propagator
    side_effects: []

  # --------------------------------------------------- PropagatorAgreement
  - method: POST
    path: "/propagator-agreements"
    description: "Draft a licensed-propagator agreement with a quality tier and a licensed territory list. It authorizes nothing until countersigned."
    roles: [LicensingOfficer]
    code: 201
    input: [propagator_id, "quality_tier?", territory_codes, term_start, term_end]
    output: PropagatorAgreement
    side_effects: ["creates PropagatorAgreement with status = PENDING_COUNTERSIGN, reinstatement_count = 0 and version = 1"]

  - method: GET
    path: "/propagator-agreements"
    description: "List agreements; filter by propagator_id to walk one propagator's agreement history."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["propagator_id?", "status?", "limit?", "offset?"]
    output: PropagatorAgreement[]
    side_effects: []

  - method: GET
    path: "/propagator-agreements/{agreement_id}"
    description: "Fetch one agreement including countersigned_by_user_id (the segregation-of-duties reference), suspension_reason and reinstatement_count."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: PropagatorAgreement
    side_effects: []

  - method: POST
    path: "/propagator-agreements/{agreement_id}/countersign"
    description: "Countersign the agreement on the licensor's side, activating it. The acting X-User-ID is recorded and is barred from later accepting royalty reports under this agreement."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: PropagatorAgreement
    side_effects: ["drives PropagatorAgreement.status PENDING_COUNTERSIGN -> ACTIVE", "sets countersigned_by_user_id = the request's X-User-ID and countersigned_at = logical clock now", "increments PropagatorAgreement.version"]

  - method: POST
    path: "/propagator-agreements/{agreement_id}/suspend"
    description: "Suspend an active agreement, freezing every production quota under it."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: PropagatorAgreement
    side_effects: ["drives PropagatorAgreement.status ACTIVE -> SUSPENDED with suspension_reason = MANUAL", "cascade: ACTIVE ProductionQuota rows of this agreement move to FROZEN", "increments PropagatorAgreement.version and each frozen quota's version"]

  - method: POST
    path: "/propagator-agreements/{agreement_id}/reinstate"
    description: "Reinstate a suspended agreement once the rolling compliance score has recovered and no material audit finding is outstanding. Reinstatement is never automatic."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: PropagatorAgreement
    side_effects: ["drives PropagatorAgreement.status SUSPENDED -> ACTIVE and clears suspension_reason", "increments reinstatement_count", "cascade: FROZEN ProductionQuota rows of this agreement move back to ACTIVE", "increments PropagatorAgreement.version and each thawed quota's version"]

  - method: POST
    path: "/propagator-agreements/{agreement_id}/terminate"
    description: "Terminate the agreement, closing its quotas and revoking its sublicenses. Blocked while accepted royalties remain unsettled."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: PropagatorAgreement
    side_effects: ["drives PropagatorAgreement.status ACTIVE or SUSPENDED -> TERMINATED", "cascade: ACTIVE and FROZEN quotas move to CLOSED, then their REQUESTED tag orders move to VOIDED", "cascade: PROPOSED and ACTIVE SublicenseGrant rows move to REVOKED with revocation_reason = AGREEMENT_TERMINATED, then Variety.active_sublicense_count is recomputed per affected variety", "increments the version of the agreement and of every cascaded quota, tag order, grant and variety"]

  # ------------------------------------------------------ ProductionQuota
  - method: POST
    path: "/production-quotas"
    description: "Allocate a season production quota for one variety in one licensed territory under an active agreement, on a per-plant or per-acre royalty basis."
    roles: [LicensingOfficer]
    code: 201
    input: [agreement_id, variety_id, season_code, basis, territory_code, "territory_class?", allocated_units]
    output: ProductionQuota
    side_effects: ["creates ProductionQuota with status = ACTIVE, tags_committed_units = 0, tags_activated_units = 0, units_available = allocated_units and version = 1"]

  - method: GET
    path: "/production-quotas"
    description: "List production quotas; filter by agreement_id to walk an agreement's quotas or by variety_id to walk a variety's licensed production."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "variety_id?", "status?", "season_code?", "limit?", "offset?"]
    output: ProductionQuota[]
    side_effects: []

  - method: GET
    path: "/production-quotas/{quota_id}"
    description: "Fetch one quota including the computed tag inventory fields tags_committed_units, units_available and tags_activated_units, and its version for optimistic concurrency."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: ProductionQuota
    side_effects: []

  # ------------------------------------------------------------- TagOrder
  - method: POST
    path: "/tag-orders"
    description: "Request a batch of traceability tags against a quota. Requires the quota version the client last observed, because every issuance, void, freeze, thaw and closure changes the remaining authorization."
    roles: [Propagator]
    code: 201
    input: [quota_id, requested_units, expected_quota_version]
    output: TagOrder
    side_effects: ["creates TagOrder with status = REQUESTED, activated_units = 0, voided_units = 0 and version = 1", "increments ProductionQuota.version by 1 (the derived tag inventory fields are unchanged - a REQUESTED order is not yet committed)"]

  - method: GET
    path: "/tag-orders"
    description: "List tag orders; filter by quota_id to walk a quota's tag issuance history."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["quota_id?", "status?", "limit?", "offset?"]
    output: TagOrder[]
    side_effects: []

  - method: GET
    path: "/tag-orders/{tag_order_id}"
    description: "Fetch one tag order including its minted serial_prefix and activated/voided unit counts."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: TagOrder
    side_effects: []

  - method: POST
    path: "/tag-orders/{tag_order_id}/issue"
    description: "Issue the requested tags, minting the serial prefix and committing quota units. Blocked when the quota is frozen or when the request exceeds units_available."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: TagOrder
    side_effects: ["drives TagOrder.status REQUESTED -> ISSUED", "mints serial_prefix from breeder_code, season_code and the zero-padded ordinal of this quota's already-committed tag orders", "sets issued_at = logical clock now", "recomputes ProductionQuota.tags_committed_units and units_available via calculations.quota_tag_inventory", "increments TagOrder.version and ProductionQuota.version"]

  - method: POST
    path: "/tag-orders/{tag_order_id}/reconcile"
    description: "Report how many of the issued tags were actually applied to plants. Activated tags are what makes royalty verification possible on audit."
    roles: [Propagator]
    code: 200
    input: [activated_units]
    output: TagOrder
    side_effects: ["drives TagOrder.status ISSUED -> RECONCILED", "sets activated_units from the payload", "recomputes ProductionQuota.tags_activated_units (tags_committed_units and units_available are unchanged)", "increments TagOrder.version and ProductionQuota.version"]

  - method: POST
    path: "/tag-orders/{tag_order_id}/void"
    description: "Void a tag order. Voiding an ISSUED order is the compensating action for issuance: the committed units return to the quota exactly."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: TagOrder
    side_effects: ["drives TagOrder.status REQUESTED or ISSUED -> VOIDED and sets voided_units = requested_units", "recomputes ProductionQuota.tags_committed_units and units_available; from ISSUED, units_available rises by exactly requested_units, restoring invariant I1 with no drift", "increments TagOrder.version and ProductionQuota.version"]

  # --------------------------------------------- RoyaltyReport / LineItem
  - method: POST
    path: "/royalty-reports"
    description: "Open a royalty report for one reporting period of an agreement. The period must sit inside the agreement term and be unique per agreement."
    roles: [Propagator]
    code: 201
    input: [agreement_id, period_code, period_start, period_end, due_at]
    output: RoyaltyReport
    side_effects: ["creates RoyaltyReport with review_status = DRAFT, settlement_status = UNSETTLED, is_late = false, revision_no = 0, all money fields 0 and version = 1"]

  - method: GET
    path: "/royalty-reports"
    description: "List royalty reports; filter by agreement_id to walk an agreement's reporting history, or by either state dimension independently."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "review_status?", "settlement_status?", "period_code?", "limit?", "offset?"]
    output: RoyaltyReport[]
    side_effects: []

  - method: GET
    path: "/royalty-reports/{report_id}"
    description: "Fetch one royalty report including both state dimensions, the provisional and final totals, the late fee, the booked amount, revision_no, accepted_by_user_id and its version for optimistic concurrency."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: []

  - method: POST
    path: "/royalty-reports/{report_id}/line-items"
    description: "Add one quota's reported production to a draft report. Requires the report version the client last observed, because each added line and each revision changes the report's provisional total."
    roles: [Propagator]
    code: 201
    input: [quota_id, reported_units, expected_report_version]
    output: RoyaltyLineItem
    side_effects: ["creates RoyaltyLineItem with billable_units = 0, effective_rate_cents = 0.0000, provisional_amount_cents = 0, final_amount_cents = 0, overrun_flagged = false and version = 1", "increments RoyaltyReport.version by 1"]

  - method: GET
    path: "/royalty-line-items"
    description: "List royalty line items; filter by report_id to read a report's lines or by quota_id to trace every report that billed a given quota."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["report_id?", "quota_id?", "overrun_flagged?", "limit?", "offset?"]
    output: RoyaltyLineItem[]
    side_effects: []

  - method: GET
    path: "/royalty-line-items/{line_item_id}"
    description: "Fetch one line item including its computed billable_units, 4-decimal effective_rate_cents, provisional and final amounts and overrun flag."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: RoyaltyLineItem
    side_effects: []

  - method: POST
    path: "/royalty-reports/{report_id}/submit"
    description: "Submit the report on the reported basis. Lateness is stamped against due_at and every line is priced from the propagator's self-declared units."
    roles: [Propagator]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.review_status DRAFT -> SUBMITTED", "sets submitted_at = logical clock now and is_late = (submitted_at > due_at)", "recomputes every line's effective_rate_cents, billable_units and provisional_amount_cents plus RoyaltyReport.provisional_total_cents via calculations.royalty_report_totals variant reported_basis", "increments RoyaltyReport.version and each line item's version"]

  - method: POST
    path: "/royalty-reports/{report_id}/accept"
    description: "Accept the report on the audited basis, repricing every line against tag activations and booking the amount payable. The acting officer must differ from the officer who countersigned the agreement."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.review_status SUBMITTED -> ACCEPTED", "recomputes every line's billable_units, effective_rate_cents, final_amount_cents and overrun_flagged plus final_total_cents via calculations.royalty_report_totals variant audited_basis", "sets late_fee_cents and booked_amount_cents, accepted_at = logical clock now and accepted_by_user_id = the request's X-User-ID", "cascade: recomputes Propagator.royalty_payable_cents, then Propagator.compliance_score and lifetime_compliance_score, then suspends ACTIVE agreements when the rolling score falls below 70, then freezes those agreements' ACTIVE quotas", "increments the version of the report, every line item, the propagator and every cascaded agreement and quota"]

  - method: POST
    path: "/royalty-reports/{report_id}/dispute"
    description: "Dispute an accepted but unsettled report, zeroing its booked amount and sending it back for revision."
    roles: [LicensingOfficer]
    code: 200
    input: ["dispute_note?"]
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.review_status ACCEPTED -> DISPUTED and sets booked_amount_cents = 0", "cascade: recomputes Propagator.royalty_payable_cents", "increments RoyaltyReport.version and Propagator.version"]

  - method: POST
    path: "/royalty-reports/{report_id}/revise"
    description: "Return a disputed report to draft so the propagator can amend it, clearing the submission and acceptance stamps and the final money fields."
    roles: [Propagator]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.review_status DISPUTED -> DRAFT", "increments revision_no", "clears submitted_at, accepted_at, accepted_by_user_id and is_late, and resets final_total_cents, late_fee_cents and booked_amount_cents to 0 while retaining provisional_total_cents and the existing line items", "increments RoyaltyReport.version"]

  - method: POST
    path: "/royalty-reports/{report_id}/settle"
    description: "Settle the booked royalty, moving the amount from the propagator's payable side to its settled side. The acting officer must differ from the officer who accepted the report."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.settlement_status UNSETTLED -> SETTLED and sets settled_by_user_id = the request's X-User-ID", "review_status is NOT touched - the two dimensions are independent", "cascade: recomputes Propagator.royalty_payable_cents and royalty_settled_cents via calculations.propagator_royalty_ledger", "increments RoyaltyReport.version and Propagator.version"]

  - method: POST
    path: "/royalty-reports/{report_id}/reverse"
    description: "Reverse a settlement. This is the compensating action for settle: the identical amount returns to the payable side with no drift."
    roles: [LicensingOfficer]
    code: 200
    input: ["reversal_note?"]
    output: RoyaltyReport
    side_effects: ["drives RoyaltyReport.settlement_status SETTLED -> REVERSED and clears settled_by_user_id", "cascade: recomputes Propagator.royalty_payable_cents and royalty_settled_cents; royalty_payable_cents returns to its exact pre-settle value", "increments RoyaltyReport.version and Propagator.version"]

  # ------------------------------------------------------- SublicenseGrant
  - method: POST
    path: "/sublicense-grants"
