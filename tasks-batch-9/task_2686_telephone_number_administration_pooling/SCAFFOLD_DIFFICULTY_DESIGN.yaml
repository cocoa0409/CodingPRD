              captures: { blk_v2: $.data.version }
            - call: "POST /numbering/blocks/${blk_id}/routing-records"
              payload: { lrn: "6145580000", switch_clli: "CLMBOH01DS0", effective_at: "2026-09-01T00:00:00Z", expected_block_version: "${blk_v2}" }
              as: NumberingAdministrator
              captures: { rec2_id: $.data.id }
          trigger:
            - call: "POST /numbering/port-requests/${port_id}/transitions"
              payload: { action: "ACTIVATE" }
