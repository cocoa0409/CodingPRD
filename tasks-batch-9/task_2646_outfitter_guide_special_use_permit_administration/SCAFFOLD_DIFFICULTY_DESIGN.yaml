          assert:
            - "before the trigger: ${a_route} == DIRECT, ${avail_mid} == 80, ${ratio_mid} == 0.9111 and ${posture_mid} == CONSTRAINED"
            - "HOP 1: ${c_route} == PROSPECTUS and ${c_status} == PROSPECTUS_QUEUED, so the 300-day request joins the pending set"
            - "HOP 2: GET /osup/use-areas/${ua_id}/allocation-summary now returns committed_service_days 700, pending_service_days 420, available_service_days -220, demand_ratio 1.2444 and allocation_posture EXHAUSTED"
            - "HOP 3: PermitApplication.${appa_id}.status == PROSPECTUS_QUEUED and routing_decision == PROSPECTUS even though the request never named that application — the sibling was rerouted because available_service_days went strictly negative"
            - "HOP 3 boundary: the application being screened is excluded from the reroute sweep, so ${appc_id} is not double-processed and its status is PROSPECTUS_QUEUED exactly once"
            - "HOP 4: NeedsAssessment.${na_id}.allocated_service_days == 1120, unallocated_service_days == -220 and prospectus_required == true"
            - "Permit.${pl_id} is untouched and still ISSUED with authorized_service_days 700 — the cascade moved pending days only"
            - "the conservation identity still holds at 900 == 700 committed + 420 pending + (-220) available"

      - name: amend_report_revert_assessment_delinquency_depth_four
        grounds:
          - state_machines.TripUseReport.ACCEPTED_to_SUPERSEDED
          - state_machines.FeeAssessment.PAID_to_PROVISIONAL
          - calculations.permit_fee_assessment
          - entities.Permit.fields.fee_delinquent
          - entities.Permit.fields.compliance_status
          - entities.FeeAssessment.fields.balance_due_cents
        distinguishing_aspect: |
          TRIGGER: amending an already accepted use report. DEPTH 4 through a money path and it runs
          BACKWARDS through a terminal-looking state: (1) the amended report is SUPERSEDED and a
          replacement is created in ACCEPTED, (2) because the accepted set changed the FeeAssessment
          reverts from PAID to PROVISIONAL, drops FINAL_AGGREGATE for PROVISIONAL_PER_REPORT and
          re-prices to 146002, (3) because 146002 exceeds the 131002 already paid, balance_due_cents
          becomes 15000 and Permit.fee_delinquent flips to true, (4) because fee_delinquent is true
          the compliance dimension is re-derived COMPLIANT -> PROBATION. Hop 2 un-does a completed
          settlement, which is what distinguishes this chain from the forward-only cascades.
