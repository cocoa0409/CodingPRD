            - "First response: HTTP 201 with data.mission_impact_score == 72.00, membership_trend_points == 100, giving_trend_points == 100, community_points == 60 and denominational_points == 0"
            - "Second response: HTTP 422 with ${e_score} == \"ERR_MISSION_IMPACT_SCORE_TOO_LOW\" — 72.00 < 92.00, so priority 44 answers before the forgiveness cap is even consulted"
            - "Fourth response: HTTP 201 with data.mission_impact_score == 92.00 and denominational_points == 100"
            - "Fifth response: HTTP 422 with ${e_forgive} == \"ERR_FORGIVENESS_EXCEEDS_OUTSTANDING\" — the mission floor now passes at exactly 92.00 and priority 51 rejects 1000000 against outstanding_principal_cents 0"
            - "Seventh response: HTTP 409 with ${e_pred} == \"ERR_PREDECESSOR_WORKOUT_INVALID\" — the predecessor is PROPOSED, not APPROVED, and priority 25's plan-state clause has no target on a create"
            - "Eighth response: HTTP 422 with ${e_pay} == \"ERR_PAYMENT_EXCEEDS_OUTSTANDING\" — 1000 > 0"
            - "GET /loans/${loan} at the end: risk_posture still \"WATCH\" (no plan reached APPROVED), forgiven_principal_cents == 0, deferred_payments_count == 0, principal_repaid_cents == 0, outstanding_principal_cents == 0 and ${loan_v3} == ${loan_v1}"
