# =============================================================================
# Task 1219 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 19 instances (rule 2 contributes 3: modes a/b/c)
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ RULE 1
  - rule_id: dual_variant_calc
    instances:
      - name: supply_allowance_standard_vs_actualized_diverge
        grounds:
          - calculations.monthly_supply_allowance
          - calculations.order_capacity_gate
          - state_machines.SupplyOrder.APPROVED_to_CLOSED
          - entities.SupplyOrder.fields.standard_allowance_units
          - entities.SupplyOrder.fields.actualized_units
        distinguishing_aspect: |
          Supply-logistics domain: the SAME month yields standard_allowance_units == 72 (forward-looking
          prescription formula) but actualized_units == 30 (chronological replay of logs); the -42 delta
          carries into the next month and cuts its allowance gate from 72 to 30.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient, tpw=3, units_per_treatment=6, storage cap 400, on_hand 0"
            - "May 2026 order of 40 DIALYSATE_2L units APPROVED and fully DELIVERED (on_hand 40)"
            - "5 treatment logs dated 2026-05-05..2026-05-09, each consuming 6 units (all REVIEWED, cadence review SIGNED_OFF so no overdue review)"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program A", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 }, { sku: "TUBING_SET", name: "Tubing set", unit_price_cents: 3400, handling_rate_cents: 25, unit_credit_cents: 800 }, { sku: "CONCENTRATE_5L", name: "Concentrate 5L", unit_price_cents: 4000, handling_rate_cents: 20, unit_credit_cents: 1000 }, { sku: "FILTER_CART", name: "Filter cartridge", unit_price_cents: 5000, handling_rate_cents: 12.5, unit_credit_cents: 1500 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat One", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-1", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 40 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord_may: $.data.id } }
            - { call: "POST /api/supply-orders/${ord_may}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord_may}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord_may}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z" }, as: SupplyCoordinator, captures: { appt1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/delivery-appointments/${appt1}/complete", payload: { delivered_units: 40 }, as: SupplyCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-05", duration_minutes: 240, consumption: [ { sku: "DIALYSATE_2L", units: 6 } ] }, as: Patient, as_user_id: "${pat}", captures: { log1: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-06", duration_minutes: 240, consumption: [ { sku: "DIALYSATE_2L", units: 6 } ] }, as: Patient, as_user_id: "${pat}", captures: { log2: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-07", duration_minutes: 240, consumption: [ { sku: "DIALYSATE_2L", units: 6 } ] }, as: Patient, as_user_id: "${pat}", captures: { log3: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-08", duration_minutes: 240, consumption: [ { sku: "DIALYSATE_2L", units: 6 } ] }, as: Patient, as_user_id: "${pat}", captures: { log4: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-09", duration_minutes: 240, consumption: [ { sku: "DIALYSATE_2L", units: 6 } ] }, as: Patient, as_user_id: "${pat}", captures: { log5: $.data.id } }
            - { call: "GET /api/patients/${pat}/clinical-reviews", as: ProgramAdmin, captures: { rev1: "$.data[0].id" } }
            - { call: "POST /api/treatment-logs/${log1}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log2}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log3}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log4}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log5}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/clinical-reviews/${rev1}/sign-off", payload: { outcome: CONTINUE }, as: Nephrologist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/supply-orders/${ord_may}/close", as: SupplyCoordinator }
          trigger:
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v3: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-06", lines: [ { sku: "DIALYSATE_2L", quantity: 31 } ], expected_patient_version: "${pat_v3}" }, as: Patient, as_user_id: "${pat}", captures: { ord_jun: $.data.id } }
            - { call: "POST /api/supply-orders/${ord_jun}/submit", as: Patient, as_user_id: "${pat}", captures: { err_over: $.data.error_id } }
            - { call: "PATCH /api/supply-orders/${ord_jun}", payload: { lines: [ { sku: "DIALYSATE_2L", quantity: 30 } ] }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord_jun}/submit", as: Patient, as_user_id: "${pat}", captures: { jun_status: $.data.order_status, jun_std: $.data.standard_allowance_units, jun_carry: $.data.carried_adjustment_units } }
          assert:
            - "SupplyOrder.${ord_may}.standard_allowance_units == 72   (3 * 4 * 6, STANDARD variant)"
            - "SupplyOrder.${ord_may}.actualized_units == 30           (5 logs x 6 units, ACTUALIZED variant — diverges from 72 for identical month)"
            - "SupplyOrder.${ord_may}.adjustment_units == -42"
            - "June submit of 31 units -> error_id ERR_ALLOWANCE_EXCEEDED (allowance_room = 72 + (-42) = 30)"
            - "SupplyOrder.${ord_jun}.order_status == SUBMITTED and standard_allowance_units == 72 and carried_adjustment_units == -42"

      - name: adherence_streak_vs_rolling_diverge
        grounds:
          - calculations.missed_log_streak
          - calculations.adherence_rolling_pct
          - calculations.posture_derivation
          - entities.ClinicalReview.fields.adherence_rolling_pct
        distinguishing_aspect: |
          Clinical-adherence domain (distinct from supply logistics): identical log data yields
          adherence_rolling_pct == 41.7 at sign-off (trailing-window ratio) while the STREAK variant
          later escalates the same patient to AT_RISK with missed_log_streak == 3 — two valid
          adherence algorithms, different verdicts, different consumers (review reporting vs posture).
        test_recipe:
          setup:
            - "ACTIVE_HOME patient, tpw=3 (expected_interval_days = floor(7/3) = 2), program max_missed_log_streak = 3, review_cadence_treatments = 2"
            - "5 zero-consumption logs dated 2026-05-02..2026-05-06, all REVIEWED, cadence review SIGNED_OFF at clock 2026-05-06"
            - "clock then advanced to 2026-05-13 (7 days silence -> streak floor(7/2) = 3)"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program B", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Two", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 85 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 85 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 85 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 85 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 85 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-2", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-02", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { log1: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-03", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { log2: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-04", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { log3: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-05", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { log4: $.data.id } }
            - { call: "POST /api/treatment-logs", payload: { patient_id: "${pat}", machine_id: "${mach}", treatment_date: "2026-05-06", duration_minutes: 240, consumption: [] }, as: Patient, as_user_id: "${pat}", captures: { log5: $.data.id } }
            - { call: "GET /api/patients/${pat}/clinical-reviews", as: ProgramAdmin, captures: { rev1: "$.data[0].id" } }
            - { call: "POST /api/treatment-logs/${log1}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log2}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log3}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log4}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/treatment-logs/${log5}/mark-reviewed", as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/clinical-reviews/${rev1}/sign-off", payload: { outcome: CONTINUE }, as: Nephrologist, captures: { rolling: $.data.adherence_rolling_pct } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { posture: $.data.posture, streak: $.data.missed_log_streak } }
          assert:
            - "ClinicalReview.${rev1}.adherence_rolling_pct == 41.7   (5 logs in trailing 28 days / 12 scheduled, ROLLING_28 variant)"
            - "Patient.${pat}.missed_log_streak == 3                 (STREAK variant: floor(7 days silence / 2 day interval))"
            - "Patient.${pat}.posture == AT_RISK                   (streak >= max_missed_log_streak escalates even though rolling review read 41.7)"

  # ------------------------------------------------------------------ RULE 2
  - rule_id: combinatorial_formula
    instances:
      - name: return_credit_tiered_overage_and_expiry
        grounds:
          - calculations.return_credit
          - state_machines.WasteReturnRecord.REPORTED_to_CREDITED
          - entities.WasteReturnRecord.fields.credit_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: nested min() over (line units, delivered
          attribution minus prior returns, remaining full-credit tier), a tiered full/half rate, and a
          conditional zero for expired lines; credits 1800 then 1350 then 0 for the same SKU as tier
          state and prior returns shift the inputs.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient (cap 400, allowance 72), May order of 20 DIALYSATE_2L APPROVED, appointment DELIVERED with delivered_units 15 of 20 (on_hand 15, attribution: 15 units to the DIALYSATE_2L line)"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program C", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Three", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-3", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 20 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z" }, as: SupplyCoordinator, captures: { appt: $.data.id } }
            - { call: "POST /api/delivery-appointments/${appt}/complete", payload: { delivered_units: 15 }, as: SupplyCoordinator }
          trigger:
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: RETURN, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 6, expired: false } ] }, as: Patient, as_user_id: "${pat}", captures: { ret1: $.data.id } }
            - { call: "POST /api/waste-return-records/${ret1}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { credit1: $.data.credit_cents } }
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: RETURN, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 5, expired: false } ] }, as: Patient, as_user_id: "${pat}", captures: { ret2: $.data.id } }
            - { call: "POST /api/waste-return-records/${ret2}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { credit2: $.data.credit_cents } }
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: RETURN, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 2, expired: true } ] }, as: Patient, as_user_id: "${pat}", captures: { ret3: $.data.id } }
            - { call: "POST /api/waste-return-records/${ret3}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { credit3: $.data.credit_cents } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { onhand: $.data.on_hand_units } }
          assert:
            - "WasteReturnRecord.${ret1}.credit_cents == 1800   (6 eligible, all inside full tier: 6 * 300)"
            - "WasteReturnRecord.${ret2}.credit_cents == 1350   (eligible min(5, 15-6)=5; full_portion min(5, 10-6)=4 -> 1200; overage 1 -> round(1*300*0.5)=150)"
            - "WasteReturnRecord.${ret3}.credit_cents == 0      (expired line earns zero even though 2 units remain attributable)"
            - "WasteReturnRecord.${ret1}.status == CREDITED and .${ret2}.status == CREDITED and .${ret3}.status == CREDITED"
            - "Patient.${pat}.on_hand_units == 2                (15 - 6 - 5 - 2)"

      - name: handling_fee_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.handling_fee
          - entities.SupplyOrder.fields.handling_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: two fractional .5 line amounts (10.5 and 12.5 cents) round
          to 11 and 13 per-line (fee 524) but to 23 when summed first (fee 523); the scaffold pins
          per-line-then-sum, so 524 is the only correct answer.
        test_recipe:
          setup:
            - "Program with catalog DIALYSATE_2L handling_rate_cents 10.5 and FILTER_CART handling_rate_cents 12.5"
            - "ACTIVE_HOME patient; DRAFT order for 2026-05 with lines DIALYSATE_2L x1 and FILTER_CART x1"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program D", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 }, { sku: "FILTER_CART", name: "Filter cartridge", unit_price_cents: 5000, handling_rate_cents: 12.5, unit_credit_cents: 1500 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Four", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
          trigger:
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 1 }, { sku: "FILTER_CART", quantity: 1 } ], expected_patient_version: "${pat_v}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id, fee: $.data.handling_fee_cents, subtotal: $.data.subtotal_cents } }
          assert:
            - "SupplyOrder.${ord}.handling_fee_cents == 524   (500 + round_half_up(1*10.5)=11 + round_half_up(1*12.5)=13; sum-then-round would give 523 and is forbidden)"
            - "SupplyOrder.${ord}.subtotal_cents == 6200      (1200 + 5000)"

      - name: grand_total_discount_keyed_on_subtotal_not_total
        grounds:
          - calculations.order_grand_total
          - entities.SupplyOrder.fields.discount_cents
          - entities.SupplyOrder.fields.grand_total_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the 5% volume discount is
          keyed on subtotal_cents (pre-discount), never on grand_total_cents; at exactly 20000 cents the
          discount fires (>=) yielding grand 19600, while 17000 yields zero discount — and a second order
          at 20400 yields discount 1020 and grand 20059.
        test_recipe:
          setup:
            - "Program with catalog CONCENTRATE_5L price 4000/rate 20 and TUBING_SET price 3400/rate 25 and DIALYSATE_2L price 1200/rate 10.5"
            - "ACTIVE_HOME patient"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program E", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 }, { sku: "TUBING_SET", name: "Tubing set", unit_price_cents: 3400, handling_rate_cents: 25, unit_credit_cents: 800 }, { sku: "CONCENTRATE_5L", name: "Concentrate 5L", unit_price_cents: 4000, handling_rate_cents: 20, unit_credit_cents: 1000 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Five", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
          trigger:
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "TUBING_SET", quantity: 5 } ], expected_patient_version: "${pat_v}" }, as: Patient, as_user_id: "${pat}", captures: { ord_a: $.data.id, disc_a: $.data.discount_cents, grand_a: $.data.grand_total_cents } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "CONCENTRATE_5L", quantity: 5 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord_b: $.data.id, disc_b: $.data.discount_cents, grand_b: $.data.grand_total_cents } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v3: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 17 } ], expected_patient_version: "${pat_v3}" }, as: Patient, as_user_id: "${pat}", captures: { ord_c: $.data.id, disc_c: $.data.discount_cents, grand_c: $.data.grand_total_cents } }
          assert:
            - "SupplyOrder.${ord_a}.discount_cents == 0 and grand_total_cents == 17625     (subtotal 17000 < 20000 -> no discount; fee 500 + 5*25 = 625)"
            - "SupplyOrder.${ord_a}.order_status == SUPERSEDED after the second create"
            - "SupplyOrder.${ord_b}.discount_cents == 1000 and grand_total_cents == 19600   (subtotal exactly 20000 -> >= threshold fires: round(20000*0.05)=1000; fee 500 + 5*20 = 600)"
            - "SupplyOrder.${ord_b}.order_status == SUPERSEDED after the third create"
            - "SupplyOrder.${ord_c}.discount_cents == 1020 and grand_total_cents == 20059   (subtotal 20400; discount 1020; fee 500 + round(17*10.5)=179 -> 679)"
            - "SupplyOrder.${ord_c}.order_status == DRAFT"
  # ------------------------------------------------------------------ RULE 3
  - rule_id: non_linear_state_machine
    instances:
      - name: home_assessment_remediation_resubmission_cycle
        grounds:
          - state_machines.HomeAssessment.REMEDIATION_REQUIRED_to_SUBMITTED
          - state_machines.HomeModificationWorkOrder.INSPECTED_FAIL_to_SCHEDULED
          - state_machines.HomeAssessment.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic (not linear): the assessment loops SUBMITTED -> REMEDIATION_REQUIRED -> SUBMITTED ->
          ACCEPTED while its work order independently loops SCHEDULED -> COMPLETED -> INSPECTED_FAIL ->
          SCHEDULED -> COMPLETED -> INSPECTED_PASS — two interlocked cycles on different entities, with
          resubmit gated on the work-order cycle settling.
        test_recipe:
          setup:
            - "Program + TRAINING patient; assessment with chloramine 0.2 (FAIL) moved to REMEDIATION_REQUIRED; linked work order driven through one failed inspection loop then passed"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program F", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Six", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.2, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id, result0: $.data.result } }
            - { call: "POST /api/home-assessments/${asmt}/require-remediation", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-modification-work-orders", payload: { patient_id: "${pat}", assessment_id: "${asmt}", work_type: PLUMBING, cost_estimate_cents: 250000 }, as: HomeNurse, as_user_id: "nurse-1", captures: { wo: $.data.id } }
            - { call: "POST /api/home-modification-work-orders/${wo}/approve", payload: { scheduled_window_start: "2026-05-05T08:00:00Z", scheduled_window_end: "2026-05-05T16:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/home-modification-work-orders/${wo}/complete", payload: { final_cost_cents: 240000 }, as: BiomedTechnician }
            - { call: "POST /api/home-modification-work-orders/${wo}/inspect", payload: { passed: false }, as: BiomedTechnician, captures: { wo_mid: $.data.status } }
            - { call: "POST /api/home-modification-work-orders/${wo}/approve", payload: { scheduled_window_start: "2026-05-12T08:00:00Z", scheduled_window_end: "2026-05-12T16:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/home-modification-work-orders/${wo}/complete", payload: { final_cost_cents: 245000 }, as: BiomedTechnician }
            - { call: "POST /api/home-modification-work-orders/${wo}/inspect", payload: { passed: true }, as: BiomedTechnician }
          trigger:
            - { call: "POST /api/home-assessments/${asmt}/resubmit", payload: { water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { result1: $.data.result, status1: $.data.status } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2", captures: { status2: $.data.status, cap: $.data.storage_cap_units } }
          assert:
            - "initial assessment result == FAIL (chloramine 0.2 > 0.1)"
            - "work order reached INSPECTED_FAIL then cycled back to SCHEDULED (rework loop)"
            - "resubmit -> status SUBMITTED with recomputed result PASS"
            - "accept -> status ACCEPTED with storage_cap_units == 400 (min(400, floor(100*4)))"
            - "cycle proof: same assessment row visited SUBMITTED twice (initial create and post-remediation resubmit)"

      - name: supply_order_parallel_order_and_fulfillment_axes
        grounds:
          - state_machines.SupplyOrder.UNFULFILLED_to_PARTIALLY_DELIVERED
          - state_machines.SupplyOrder.PARTIALLY_DELIVERED_to_DELIVERED
          - state_machines.SupplyOrder.APPROVED_to_CLOSED
          - entities.SupplyOrder.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (distinct from the assessment cycle): order_status
          stays APPROVED while fulfillment_status walks UNFULFILLED -> PARTIALLY_DELIVERED -> DELIVERED
          across two partial deliveries, and only the explicit close moves order_status to CLOSED
          without touching fulfillment_status.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient (cap 400, allowance 72); May order 20 DIALYSATE_2L SUBMITTED then APPROVED"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program G", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Seven", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-7", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 20 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
          trigger:
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z" }, as: SupplyCoordinator, captures: { appt1: $.data.id } }
            - { call: "POST /api/delivery-appointments/${appt1}/complete", payload: { delivered_units: 10 }, as: SupplyCoordinator }
            - { call: "GET /api/supply-orders/${ord}", as: ProgramAdmin, captures: { os_mid: $.data.order_status, fs_mid: $.data.fulfillment_status } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-18T08:00:00Z", window_end: "2026-05-18T12:00:00Z" }, as: SupplyCoordinator, captures: { appt2: $.data.id } }
            - { call: "POST /api/delivery-appointments/${appt2}/complete", payload: { delivered_units: 10 }, as: SupplyCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/supply-orders/${ord}/close", as: SupplyCoordinator, captures: { os_end: $.data.order_status, fs_end: $.data.fulfillment_status } }
          assert:
            - "after first partial delivery: order_status == APPROVED and fulfillment_status == PARTIALLY_DELIVERED (axes evolve independently)"
            - "after second delivery: fulfillment_status == DELIVERED while order_status == APPROVED"
            - "after close: order_status == CLOSED and fulfillment_status == DELIVERED (close does not rewrite the fulfillment axis)"
            - "SupplyOrder.${ord}.delivered_units_total == 20"

  # ------------------------------------------------------------------ RULE 4
  - rule_id: transitive_cascade
    instances:
      - name: permanent_transition_machine_maintenance_cascade
        grounds:
          - state_machines.TransitionRecord.APPROVED_to_ACTIVE
          - state_machines.Patient.ACTIVE_HOME_to_TRANSITIONED_OUT
          - state_machines.DialysisMachine.ASSIGNED_to_IN_STOCK
          - state_machines.MaintenanceEvent.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from transition activation (trigger 1): activate -> Patient TRANSITIONED_OUT
          -> DialysisMachine ASSIGNED->IN_STOCK -> that machine's SCHEDULED MaintenanceEvent CANCELLED;
          each link is caused by the previous link, and sibling cascades (plan CLOSED, order CANCELLED,
          reservation CANCELLED) fire off the patient link.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient with assigned machine, one SCHEDULED maintenance event on that machine, ACTIVE plan, one DRAFT May order, one RESERVED backup slot on 2026-05-12"
            - "permanent HOME_TO_CENTER transition (effective_from 2026-05-02, effective_to null) APPROVED; clock advanced to 2026-05-02"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program H", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
