              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 1, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
