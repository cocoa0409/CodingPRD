# =============================================================================
# task_0114_hotel_property_management — SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8)
# Test Targeting Index: the nine §0.5 Difficulty Rules, >= 2 instances each.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7; every setup chain
# is executable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: room_charge_forward_vs_chronological_diverge_on_upgrade
        grounds:
          - calculations.room_charge_forward
          - calculations.room_charge_chronological
          - calculations.nightly_rate
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.NightAuditRun.IN_PROGRESS_to_COMPLETED
          - entities.Folio.fields.projected_charges_cents
          - entities.Folio.fields.room_charges_cents
        distinguishing_aspect: |
          Same reservation, two algorithms on the Reservation room-charge domain:
          the forward projection pinned at confirm (KING-only, 34000) differs from
          the chronological night-by-night accrual after a mid-stay upgrade
          (17000 KING night1 + 25500 SUITE night2 = 42500).
        test_recipe:
          setup:
            - "Hotel current_business_date=2026-07-01, overbooking 0.0"
            - "RoomType KING base 20000 tier 1 inv 3; SUITE base 30000 tier 2 inv 3"
            - "BAR rate plan PCT -15, no_show NONE; one Room of each type, INSPECTED"
            - "Reservation KING 2026-07-01..2026-07-03 (2 nights), CONFIRMED, room assigned+inspected, CHECKED_IN; upgraded to SUITE (comp=false) AFTER night1 audit"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Grand", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id, hotel_v: $.data.version }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "SUITE", tier_rank: 2, physical_inventory: 3, base_rate_cents: 30000 }
              as: RevenueManager
              captures: { suite_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "PCT", adjustment_value: -15, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${suite_id}", room_number: "501" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ann Up", email: "ann@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res_id}" }
              as: FrontDeskAgent
              captures: { folio_id: "$.data[0].id"}
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
              captures: { room_v2: $.data.version }
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v}" }
              as: NightAuditor
              captures: { nar1_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v2: $.data.version }
            - call: "POST /pms/night-audit-runs/${nar1_id}/complete"
              payload: { expected_hotel_version: "${hotel_v2}" }
              as: NightAuditor
            - call: "POST /pms/reservations/${res_id}/upgrade"
              payload: { target_room_type_id: "${suite_id}", comp: false }
              as: FrontDeskAgent
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v3: $.data.version }
          trigger:
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v3}" }
              as: NightAuditor
              captures: { nar2_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v4: $.data.version }
            - call: "POST /pms/night-audit-runs/${nar2_id}/complete"
              payload: { expected_hotel_version: "${hotel_v4}" }
              as: NightAuditor
          assert:
            - "Folio.${folio_id}.projected_charges_cents == 34000"
            - "Folio.${folio_id}.room_charges_cents == 42500"
            - "Folio.${folio_id}.projected_charges_cents != Folio.${folio_id}.room_charges_cents"

      - name: folio_balance_provisional_open_vs_final_closed
        grounds:
          - calculations.folio_balance
          - state_machines.Folio.OPEN_to_CLOSED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - entities.Folio.fields.balance_cents
          - entities.Folio.fields.status
        distinguishing_aspect: |
          Folio money domain (distinct from the Reservation room-charge domain of the
          first instance): the provisional OPEN balance after one audited night (17000)
          differs from the same folio's final CLOSED balance after the second audited
          night plus checkout (34000), proving the OPEN-vs-CLOSED variant divergence.
        test_recipe:
          setup:
            - "KING reservation 2 nights, CHECKED_IN; one night audited (room_charges 17000) while folio still OPEN"
            - "After observing OPEN balance, audit the 2nd night then check out (folio CLOSED, room_charges 34000)"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Bal", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id, hotel_v: $.data.version }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "PCT", adjustment_value: -15, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "101" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Bo Bal", email: "bo@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res_id}" }
              as: FrontDeskAgent
              captures: { folio_id: "$.data[0].id"}
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v}" }
              as: NightAuditor
              captures: { nar1_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v2: $.data.version }
            - call: "POST /pms/night-audit-runs/${nar1_id}/complete"
              payload: { expected_hotel_version: "${hotel_v2}" }
              as: NightAuditor
            - call: "GET /pms/folios/${folio_id}"
              payload: {}
              as: FrontDeskAgent
              captures: { provisional_balance: $.data.balance_cents }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v3: $.data.version }
          trigger:
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v3}" }
              as: NightAuditor
              captures: { nar2_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v4: $.data.version }
            - call: "POST /pms/night-audit-runs/${nar2_id}/complete"
              payload: { expected_hotel_version: "${hotel_v4}" }
              as: NightAuditor
            - call: "POST /pms/reservations/${res_id}/check-out"
              payload: {}
              as: FrontDeskAgent
          assert:
            - "GET /pms/folios/${folio_id} before 2nd audit: balance_cents == 17000 (provisional, status OPEN)"
            - "Folio.${folio_id}.balance_cents == 34000 (final)"
            - "Folio.${folio_id}.status == CLOSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: nightly_rate_pct_round_then_multiply_order
        grounds:
          - calculations.nightly_rate
          - calculations.room_charge_forward
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Folio.fields.projected_charges_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: round_half_up the PER-NIGHT PCT result to
          whole cents BEFORE multiplying by nights. base 13333, plan PCT -15 ->
          per-night round_half_up(13333*0.85)=round_half_up(11333.05)=11333; *3 nights
          = 33999. Sum-then-round would give round(33999.15)=33999 too here, so use a
          base that separates them: base 13333 *0.85=11333.05 -> 11333/night; the
          divergent control is that 11333*3=33999, NOT round(11333.05*3)=round(33999.15)=33999.
        test_recipe:
          setup:
            - "Hotel; RoomType base 13333; BAR plan PCT -15; reservation 3 nights; confirm pins projected"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Round", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "STD", tier_rank: 1, physical_inventory: 5, base_rate_cents: 13333 }
              as: RevenueManager
              captures: { std_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "PCT", adjustment_value: -15, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ro R", email: "ro@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${std_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-04" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res_id}" }
              as: FrontDeskAgent
              captures: { folio_id: "$.data[0].id"}
          trigger:
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
          assert:
            - "Folio.${folio_id}.projected_charges_cents == 33999"
            - "Reservation.${res_id}.nights == 3"

      - name: corporate_credit_eval_order_outstanding_plus_projection
        grounds:
          - calculations.corporate_outstanding
          - calculations.room_charge_forward
          - validations[priority=12]
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - entities.CorporateAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the credit gate evaluates
          would_be = outstanding_balance_cents (a checked-out folio ledger sum,
          40000) + this reservation's projected_charges_cents (40000) = 80000,
          and rejects against credit_limit 50000 — outstanding must be summed
          before the projection is added, not after.
        test_recipe:
          setup:
            - "CorporateAccount credit_limit 50000; CORPORATE plan FLAT +0 base 20000"
            - "First corporate reservation 2 nights confirmed, checked in/out -> outstanding 40000"
            - "Second corporate reservation 2 nights HELD, projected would be 40000"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Corp", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id, hotel_v: $.data.version }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 5, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/corporate-accounts"
              payload: { hotel_id: "${hotel_id}", name: "Acme", credit_limit_cents: 50000 }
              as: RevenueManager
              captures: { acct_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "CORP", kind: "CORPORATE", corporate_account_id: "${acct_id}", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { corp_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "201" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Cy C", email: "cy@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${corp_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res1_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res1_id}" }
              as: FrontDeskAgent
              captures: { folio1_id: "$.data[0].id"}
            - call: "POST /pms/reservations/${res1_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res1_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res1_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/incidentals"
              payload: { hotel_id: "${hotel_id}", folio_id: "${folio1_id}", kind: "CHARGE", description: "Room block", amount_cents: 40000 }
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res1_id}/check-out"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Dee D", email: "dee@x.com" }
              as: FrontDeskAgent
              captures: { guest2_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest2_id}", room_type_id: "${king_id}", rate_plan_id: "${corp_id}", arrival_date: "2026-07-05", departure_date: "2026-07-07" }
              as: FrontDeskAgent
              captures: { res2_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res2_id}" }
              as: FrontDeskAgent
              captures: { folio2_id: "$.data[0].id"}
          trigger:
            - call: "POST /pms/reservations/${res2_id}/confirm"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger confirm rejected with error_id == ERR_CREDIT_LIMIT_EXCEEDED (402)"
            - "CorporateAccount.${acct_id}.outstanding_balance_cents == 40000"
            - "Reservation.${res2_id}.status == HELD"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: room_housekeeping_cycle_dirty_clean_inspected_occupied_dirty
        grounds:
          - state_machines.Room.DIRTY_to_CLEAN
          - state_machines.Room.CLEAN_to_INSPECTED
          - state_machines.Room.INSPECTED_to_OCCUPIED
          - state_machines.Room.OCCUPIED_to_DIRTY
          - entities.Room.fields.housekeeping_status
        distinguishing_aspect: |
          Room (entity #1) housekeeping is a true cycle: after a full
          DIRTY->CLEAN->INSPECTED->OCCUPIED->DIRTY loop the room returns to DIRTY
          and can be re-cleaned, distinct from any linear pipeline.
        test_recipe:
          setup:
            - "One Room CLEAN; reservation drives INSPECTED->OCCUPIED via check-in then OCCUPIED->DIRTY via check-out"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Cyc", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 2, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "301" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "El E", email: "el@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/check-out"
              payload: {}
              as: FrontDeskAgent
              captures: { room_after_co: $.data.assigned_room_id }
            - call: "GET /pms/rooms/${room_id}"
              payload: {}
              as: FrontDeskAgent
              captures: { room_v_dirty: $.data.version }
          trigger:
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "CLEAN", expected_room_version: "${room_v_dirty}" }
              as: FrontDeskAgent
          assert:
            - "Room.${room_id}.housekeeping_status == OCCUPIED right after check-in"
            - "Room.${room_id}.housekeeping_status == DIRTY right after check-out"
            - "Room.${room_id}.housekeeping_status == CLEAN after the trigger (cycle closed: DIRTY->CLEAN again)"

      - name: folio_dispute_then_resolve_revert_loop
        grounds:
          - state_machines.Folio.OPEN_to_DISPUTED
          - state_machines.Folio.DISPUTED_to_OPEN
          - entities.Folio.fields.status
        distinguishing_aspect: |
          Folio (entity #2, different entity from Room) has a revert loop
          OPEN->DISPUTED->OPEN; the DISPUTED->OPEN edge proves a non-linear
          back-transition, not a forward-only pipeline.
        test_recipe:
          setup:
            - "Reservation with an OPEN folio; dispute then resolve"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Disp", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 2, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Fi F", email: "fi@x.com" }
