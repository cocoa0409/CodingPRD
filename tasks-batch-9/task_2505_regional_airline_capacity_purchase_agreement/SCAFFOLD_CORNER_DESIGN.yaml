      - name: stale_scorecard_blocks_issue_final
        claim_type: violation_to_error
        grounds:
          - validations[priority=76]
          - errors[ERR_SCORECARD_STALE]
          - state_machines.Scorecard.PUBLISHED_to_STALE
        distinguishing_aspect: "A brand audit raised after close stales the scorecard, and because the FINAL invoice is created afterwards it escapes the auto-void cascade — so issue-final is refused on the scorecard's status alone and succeeds unchanged once the scorecard is republished."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and a CLOSED cycle 2026-09 (published_departures 0, no legs, no pass-throughs) whose scorecard was PUBLISHED at close."
            - "A MINOR audit with findings_count 2 is then raised on that base, staling the scorecard."
            - "Only after the staling is the DRAFT FINAL invoice created, so no auto-void cascade touches it."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 0 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/schedule-cycles/${cyc}/close"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/scorecards?cycle_id=${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { sc: "$.data[0].id" }
            - call: "POST /cpa/brand-audits"
              payload: { base_id: "${base}", audit_scope: "UNIFORM", findings_count: 2, severity: "MINOR" }
              as: BrandAuditor
              captures: { a1: $.data.id }
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v: $.data.version }
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "FINAL", expected_schedule_cycle_version: "${cyc_v}" }
              as: CPAAdministrator
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /cpa/invoices/${inv}/issue-final"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/scorecards/${sc}/recompute"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/invoices/${inv}/issue-final"
              payload: {}
              as: CPAAdministrator
          assert:
            - "Scorecard.${sc}.status == \"STALE\" after the audit is raised, and Invoice.${inv}.status == \"DRAFT\" with void_reason == null"
            - "The first issue-final returns HTTP 409 with data.error_id == \"ERR_SCORECARD_STALE\"; Agreement.${ag}.settled_to_date_usd == 0.00"
            - "The recompute returns HTTP 200 with status \"PUBLISHED\", recompute_count == 1 and brand_penalty_usd == 1000.00 (2 * 500.00)"
            - "The second issue-final returns HTTP 200 with status \"ISSUED\"; Invoice.${inv}.brand_penalty_component_usd is still 0.00 and total_usd is still 262500.00 (250000.00 fixed + 12500.00 incentive) because every component was frozen at creation"
            - "Agreement.${ag}.settled_to_date_usd == 262500.00 and ScheduleCycle.${cyc}.status == \"SETTLED\""

      - name: extension_offer_not_later_than_current_term_rejected
        claim_type: violation_to_error
        grounds:
