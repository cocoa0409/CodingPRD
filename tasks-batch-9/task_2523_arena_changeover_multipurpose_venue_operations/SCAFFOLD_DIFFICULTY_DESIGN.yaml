            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 9", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-09T00:00:00Z", event_end_utc: "2026-09-09T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b1: $.data.id }
            - call: "POST /event-bookings/${b1}/hold"
