              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V6-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V6-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 20.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version" }
          trigger:
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 20.0, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 5.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { fs1: "$.data.fill_status" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v3: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 20.0, expected_station_version: "${st_v3}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s2: "$.data.id" }
          assert:
            - "second create while s1 is PRECOOLING: HTTP 409 and ${err} == ERR_NO_NOZZLE_AVAILABLE"
            - "${fs1} == COMPLETED with corrected_kg 5.000 and metering_error_pct 0.000 (density_correction_factor is exactly 1 at ambient 20.0 C and 700.00 bar)"
