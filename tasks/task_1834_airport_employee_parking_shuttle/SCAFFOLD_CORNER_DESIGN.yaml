          - "state_machines.TowEvent.TOWED_to_RELEASED"
        distinguishing_aspect: "RELEASE is fiscally gated too: after the tow's cycle is closed (no OPEN cycle remains), RELEASE fails with ERR_NO_OPEN_BILLING_CYCLE and the tow stays TOWED with impound_fee_cents null."
        test_recipe:
          setup: ["Program threshold 3, tow_hold 48, pool 0; CORE lot; August cycle; E1 SUSPENDED by 3 violations at 2026-08-10T08:00:00Z; tow authorized 08-12T09:00 and MARK_TOWED 08-12T10:00; cycle then closed"]
