  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_date_point_collision_on_subscription
        grounds:
          - validations[priority=10]
          - entities.WeeklyBox.fields.delivery_date
          - entities.WeeklyBox.fields.selection_status
        distinguishing_aspect: |
          Interval semantics: zero-width point collision — at most one non-SKIPPED WeeklyBox may occupy
          a single delivery_date on a Subscription; a second box on the same date is rejected with
          ERR_DELIVERY_DATE_TAKEN. (Point equality, not range overlap.)
        test_recipe:
          setup:
            - "One OPEN box exists for delivery 2026-07-15 on subscription s"
            - "A second box for the same date is created"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_OV", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { pov: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zov: $.data.id }
            - call: "POST /members"
              payload: { email: "ov@x.com", full_name: "Ov", shipping_zone_id: "${zov}" }
              as: Anonymous
              captures: { ovm: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${ovm}", plan_id: "${pov}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${ovm}"
              captures: { ovs: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${ovs}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${ovm}"
              captures: { ovbox: $.data.id }
          trigger:
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${ovs}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${ovm}"
              captures: { ov_err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_DELIVERY_DATE_TAKEN"

      - name: pause_window_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=11]
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Subscription.fields.scheduled_resume_date
        distinguishing_aspect: |
          Different interval semantics on a different resource (Subscription): pause windows
          [now, resume_date) are half-open — an overlapping window is rejected with
          ERR_PAUSE_WINDOW_OVERLAP, but adjacency (a new pause starting exactly at the prior
          resume_date) is allowed. Range overlap arithmetic, not point equality.
        test_recipe:
          setup:
            - "Subscription paused [2026-07-05, 2026-07-20); then resumed at 2026-07-21 clock"
            - "A new pause [2026-07-21, 2026-08-01) starting at/after the prior resume is allowed (adjacency)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
