            - "o_alloc == ALLOCATED; e3 == ERR_ORDER_STATE_INVALID (ship from ALLOCATED skips pick)"
            - "o_pick == PICKED; e4 == ERR_ORDER_STATE_INVALID (second pick — no idempotent replay)"
            - "o_ship == SHIPPED; e5 == ERR_ORDER_STATE_INVALID (second ship) and e6 == ERR_ORDER_STATE_INVALID (SHIPPED terminal for cancel)"

      - name: finished_lot_recall_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FinishedGoodLot.AVAILABLE_to_RECALLED
          - errors[ERR_LOT_STATE_INVALID]
        distinguishing_aspect: |
          RECALLED is terminal: a second recall on the same lot fails with
          ERR_LOT_STATE_INVALID; the first recall succeeds from AVAILABLE.
        test_recipe:
          setup:
            - "Full pipeline; lot AVAILABLE"
          setup_api_calls:
