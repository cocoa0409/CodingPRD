  - rule_id: transitive_cascade
    instances:
      - name: certificate_revoke_cascades_to_cancellation
        grounds:
          - state_machines.SafetyCertificate.VERIFIED_to_REVOKED
          - state_machines.Renter.QUALIFIED_to_SUSPENDED
          - state_machines.Booking.HELD_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
        distinguishing_aspect: |
          Depth-4 chain triggered by the certificate decision endpoint: cert VERIFIED -> REVOKED
          causes renter QUALIFIED -> SUSPENDED, which itself cancels every future HELD/CONFIRMED
          booking, and each cancellation itself releases the deposit, posts the 100% CANCELLATION_REFUND
          charge, voids the itinerary and cancels turn/orientation. Different trigger than the sibling
          incident-resolve cascade.
