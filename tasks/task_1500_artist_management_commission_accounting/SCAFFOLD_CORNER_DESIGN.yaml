      - name: void_settled_event_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_ALREADY_SETTLED]", "state_machines.IncomeEvent"]
        distinguishing_aspect: "SETTLED events are financially materialized and can only be corrected via ADJUSTMENT children; void fails ERR_EVENT_ALREADY_SETTLED."
        test_recipe:
          setup: ["Artist + agreement (TOURING 1500bps) + Agent + BM; event gross 200000 VERIFIED then SETTLED (received 200000 on 2026-03-12)"]
