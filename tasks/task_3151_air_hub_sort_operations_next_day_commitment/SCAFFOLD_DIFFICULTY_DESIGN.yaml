              as: SortOperator
            - call: "POST /airhub/packages/${pkg_f1}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_f1_v: $.data.version }
            - call: "POST /airhub/packages/${pkg_f2}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_f2}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_f2_v: $.data.version }
            - call: "POST /airhub/moves/${move_id}/assign-buildup"
              payload: { package_id: "${pkg_f1}", buildup_id: "${bd_id}" }
              as: LoadPlanner
              captures: { move_v: $.data.version }
          trigger:
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_f1}", expected_load_move_version: "${move_v}", expected_package_version: "${pkg_f1_v}" }
              as: LoadPlanner
              captures: { move_v2: $.data.version }
            - call: "GET /airhub/moves/${move_id}"
              payload: {}
              as: LoadPlanner
              captures: { cap_mid: $.data.forward_capacity_grams, tier_mid: $.data.load_plan_tier }
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_f2}", expected_load_move_version: "${move_v2}", expected_package_version: "${pkg_f2_v}" }
              as: LoadPlanner
            - call: "GET /airhub/moves/${move_id}"
              payload: {}
              as: LoadPlanner
              captures: { cap_final: $.data.forward_capacity_grams, tier_final: $.data.load_plan_tier }
            - call: "GET /airhub/buildups/${bd_id}"
              payload: {}
              as: LoadPlanner
