          - "validations[priority=10]"
          - "state_machines.Inspection.SCHEDULED_to_ASSIGNED"
        distinguishing_aspect: "On assign, an already-ASSIGNED inspection (state, priority 7) plus an uncertified inspector (business_safety, priority 10) both fail; the state error ERR_INSPECTION_NOT_SCHEDULED wins — pairing {state, business_safety}, distinct from the certificate {business_referential, business_fiscal} conflict."
        test_recipe:
          setup:
            - "A PASSENGER inspection is already ASSIGNED to a certified inspector; a second inspector is certified only for ESCALATOR (uncertified for PASSENGER)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Iris Co", contact_email: "i@x.com" }
              as: Registrar
