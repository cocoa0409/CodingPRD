          ship_to_address: 5 Stable Way
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-R2
          product_name: Needle Box
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 999
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-R2
          expiry_date: '2026-10-25'
          qty_on_hand: 10
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 5 Stable Way
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 3
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s_id: $.data.id
      - call: POST /vet/shipments/${s_id}/dispatch
        as: SupplyChainPlanner
      - call: POST /vet/shipments/${s_id}/deliver
        as: SupplyChainPlanner
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          line_id: $.data[0].id
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-20T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: POST /vet/short-date-credits
        payload:
          order_line_id: ${line_id}
          lot_id: ${lot_id}
          qty: 3
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          sdc_claimed: $.data.claimed_credit_cents
      assert:
      - ShortDateCredit.days_to_expiry_at_request == 35 (50% tier, 31..90)
      - claimed_credit_cents == 1500 (500 per unit * 3), explicitly NOT 1499 (sum-then-round)
- rule_id: non_linear_state_machine
  instances:
  - name: order_backorder_cycle_via_refill
    grounds:
    - state_machines.Order.SUBMITTED_to_BACKORDERED
    - state_machines.Order.BACKORDERED_to_APPROVED
    - state_machines.OrderLine.BACKORDERED_to_ALLOCATED
    distinguishing_aspect: "Order machine is CYCLIC (APPROVED <- BACKORDERED via system refill),\nnot a linear pipeline: an order approved into shortage lands in\nBACKORDERED, and a later lot receipt loops\
      \ it back to APPROVED \u2014\na shape the ManufacturerAuthorization cycle (other instance) does\nnot share, on a different entity.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; CONSUMABLE product (GEN, 10000c); lot L1 of 5 units (expiry 2027-06-30) fully allocated to order O1 (APPROVED)
      - Order O2 qty 5 approved into shortage -> BACKORDERED with OPEN BackorderLine
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic B
          license_number: LIC-B1
