            - "an explicit POST /appeals/{appeal_id}/assign-reviewer {reviewer_assessor_id: ${asr2_id}} on a fresh appeal returns 422 ERR_NOT_APPEAL_PANEL_MEMBER"

      - name: pla_claim_listing_filter_and_offset_pagination_interact
        claim_type: standard_crud
        grounds:
          - endpoints[GET /pla-claims]
          - endpoints[GET /portfolios]
        distinguishing_aspect: |
          Three claims for the same student across three courses paginate in
          created_at then claim_number order with total_count 3 and has_more
          toggling, and an assessment_status filter narrows the set before the
          window is applied rather than after — page 1 of a filtered query is not
          page 1 of the unfiltered query.
        test_recipe:
          setup:
            - "Program BSCS and three 6-credit LOWER CS courses CS150, CS160, CS170, each with a single OC1 weighted 10000."
            - "Student S-1001 with three DRAFT PORTFOLIO claims, one per course, created in that order."
            - "The CS150 claim is then withdrawn so exactly one claim is WITHDRAWN and two remain DRAFT."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c150_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS160", title: "Data Structures", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Choose a structure", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c160_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS170", title: "Systems", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Trace a syscall", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c170_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c150_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cl1_id: "$.data.id", cl1_num: "$.data.claim_number" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c160_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cl2_id: "$.data.id", cl2_num: "$.data.claim_number" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c170_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cl3_id: "$.data.id", cl3_num: "$.data.claim_number" }
            - call: "POST /pla-claims/${cl1_id}/withdraw"
              payload: { withdraw_reason: "Course already transferred in" }
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "GET /pla-claims?student_id=${stu_id}&limit=2&offset=0"
              as: PlaCoordinator
              captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" }
            - call: "GET /pla-claims?student_id=${stu_id}&limit=2&offset=2"
              as: PlaCoordinator
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /pla-claims?student_id=${stu_id}&assessment_status=DRAFT&limit=2&offset=0"
              as: PlaCoordinator
              captures: { f1_first: "$.data[0].id" }
          assert:
            - "page 1 returns [${cl1_id}, ${cl2_id}] with meta.total_count == 3 and meta.has_more == true"
            - "page 2 returns [${cl3_id}] with meta.total_count == 3 and meta.has_more == false"
            - "the DRAFT-filtered page 1 returns [${cl2_id}, ${cl3_id}] with meta.total_count == 2 and meta.has_more == false — the withdrawn ${cl1_id} is filtered out before the window"
            - "GET /pla-claims?student_id=${stu_id}&assessment_status=WITHDRAWN returns exactly [${cl1_id}] with total_count == 1"
            - "GET /pla-claims?course_id=${c160_id} returns exactly [${cl2_id}]"
            - "ordering is created_at ASC then claim_number ASC and never by id"

