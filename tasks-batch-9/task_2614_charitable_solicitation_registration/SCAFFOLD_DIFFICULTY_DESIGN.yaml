      - name: coventure_remittance_shortfall_boundary_of_one_cent
        grounds:
          - calculations.coventure_benefit_determination
          - state_machines.CoventurePromotion.ACTIVE_to_SETTLED
          - state_machines.CoventurePromotion.ACTIVE_to_DEFICIENT_REMITTANCE
          - entities.CoventurePromotion.fields.shortfall_cents
        boundary:
          quantity: "remitted_cents measured against final_benefit_cents = max(500000, 250 * 1600) = 500000"
          comparator: ">= routes to SETTLED, < routes to DEFICIENT_REMITTANCE"
          at: { remitted_cents: 500000, expected_status: SETTLED, expected_shortfall_cents: 0 }
          at_minus_one: { remitted_cents: 499999, expected_status: DEFICIENT_REMITTANCE, expected_shortfall_cents: 1 }
        distinguishing_aspect: |
          Both promotions report the same 1600 actual units, so both have final_benefit_cents
          pinned to the guaranteed minimum 500000 rather than the 400000 per-unit product. One
          cent of shortfall is enough to route the settle transition to DEFICIENT_REMITTANCE
          with shortfall_cents 1, while an exact remittance lands in SETTLED with shortfall 0.
          An implementation that compares remitted_cents against the per-unit product, or that
          treats a shortfall as a validation failure instead of a state branch, diverges.
        test_recipe:
          setup:
            - "StateProfile CA with coventure_filing_required true, coventure_buffer_days 7 and fundraiser_bond_minimum_cents 2500000."
            - "Organization with a certifying officer on file."
            - "A COMMERCIAL_COVENTURER with an ACTIVE CA FundraiserRegistration."
            - "Two FILED CA promotions with disjoint windows separated by more than the buffer: [2026-09-01, 2026-09-30] and [2026-10-08, 2026-10-20], both with guaranteed_minimum_cents 500000, per_unit_cents 250 and projected_units 3000."
