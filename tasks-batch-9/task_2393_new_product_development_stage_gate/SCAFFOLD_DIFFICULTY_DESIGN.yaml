              as_user_id: "chair-wp"
            - call: "POST /innovation-projects/${wp_id}/sell-in-presentations"
              payload: { retailer_id: "${wret_id}", shelf_reset_window_id: "${wwin_id}", scheduled_at: "2026-09-14T10:00:00Z", proposed_sku_count: 3 }
              as: SalesAccountManager
              captures: { wpres1_id: $.data.id }
          trigger:
            - call: "POST /sell-in-presentations/${wpres1_id}/withdraw"
              payload: { reason: "Buyer meeting moved to the next reset" }
              as: SalesAccountManager
            - call: "POST /innovation-projects/${wp_id}/sell-in-presentations"
              payload: { retailer_id: "${wret_id}", shelf_reset_window_id: "${wwin_id}", scheduled_at: "2026-09-16T10:00:00Z", proposed_sku_count: 3 }
              as: SalesAccountManager
              captures: { wpres2_id: $.data.id }
          assert:
            - "before the trigger, ShelfResetWindow.${wwin_id}.booked_slot_count == 1"
            - "after the withdraw, ShelfResetWindow.${wwin_id}.booked_slot_count == 0"
            - "after the re-booking, ShelfResetWindow.${wwin_id}.booked_slot_count == 1 again, never 2"
            - "SellInPresentation.${wpres1_id}.status == WITHDRAWN and SellInPresentation.${wpres2_id}.status == PLANNED"
            - "the re-booking succeeds against max_presentations 1, proving the withdraw genuinely released the slot rather than merely marking the row"
            - "InnovationProject.${wp_id}.commercial_status == SELL_IN_SCHEDULED and authorized_acv_pct == 0.00"
