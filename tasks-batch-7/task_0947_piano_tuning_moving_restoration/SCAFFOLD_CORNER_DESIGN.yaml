  # =======================================================================
  # VALIDATIONS
  # =======================================================================
  - section: validations
    instances:

      - name: pitch_assessment_with_wrong_reference_pitch_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=32]
          - errors[ERR_PITCH_REFERENCE_MISMATCH]
          - entities.Instrument.fields.target_pitch_hz
        distinguishing_aspect: "An instrument pinned to 442.0 Hz rejects an assessment citing 440.0 with 422 ERR_PITCH_REFERENCE_MISMATCH and no pitch field is written."
        test_recipe:
          setup: ["One client with a ZONE_A location and one GRAND instrument whose target_pitch_hz is 442.0."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Baroque Ensemble", email: "baroque@example.com", phone: "555-0330", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Hall", zone_code: "ZONE_A", address_key: "baroque-hall", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Steinway", model: "A", serial_number: "SN-C30-0001", instrument_class: "GRAND", usage_tier: "PERFORMANCE", target_pitch_hz: 442.0 }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 4.0 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id ERR_PITCH_REFERENCE_MISMATCH"
            - "Instrument.${inst_id}.pitch_deviation_cents == null and pitch_raise_tier == null"
            - "Instrument.${inst_id}.version == 1"

      - name: voice_quote_on_an_unassessed_instrument_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]
          - errors[ERR_SERVICE_PREREQUISITE_NOT_MET]
          - entities.Instrument.fields.condition_status
        distinguishing_aspect: "A VOICE quote demands condition_status IN {SERVICEABLE, NEEDS_VOICING, RESTORED}; an instrument still at NEEDS_ASSESSMENT is refused with 422 ERR_SERVICE_PREREQUISITE_NOT_MET."
        test_recipe:
          setup: ["One client with a ZONE_A location and one UPRIGHT instrument assessed for pitch but still at condition_status NEEDS_ASSESSMENT."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Ladder Client", email: "ladder@example.com", phone: "555-0331", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "ladder-room", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C31-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
          trigger:
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id ERR_SERVICE_PREREQUISITE_NOT_MET"
            - "the same call with service_type TUNE succeeds, because TUNE is only barred at REBUILD_REQUIRED"

      - name: apprentice_technician_cannot_take_a_voice_service_order
        claim_type: Violation → Error
        grounds:
          - validations[priority=34]
          - calculations.technician_certification_gate
          - errors[ERR_TECH_CERT_INSUFFICIENT]
        distinguishing_aspect: "VOICE demands SERVICE_MIN_CERT_RANK_VOICE (2) but an APPRENTICE ranks 1, so POST /service-orders is refused with 422 ERR_TECH_CERT_INSUFFICIENT and no order is created."
