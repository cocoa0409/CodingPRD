            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100015", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 250000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Dana Whitfield", role_title: "ENTITY_HOLDER", direct_ownership_bps: 5000 }
              as: LicensingManager
              captures: { cp_id: "$.data.id" }
          trigger:
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /control-persons/${cp_id}/background-check-adjudication"
              payload: { outcome: "CLEARED" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
          assert:
            - "trigger call 1: HTTP 409 with error_id == ERR_BACKGROUND_CHECK_INCOMPLETE; LicenseApplication.${app_id}.status stays UNDER_REVIEW and decision_at is null"
            - "after trigger call 2: ControlPerson.${cp_id}.background_check_status == CLEARED, status == SEATED, and Licensee.${lic_id}.control_chain_status == VERIFIED"
            - "trigger call 3: HTTP 200; LicenseApplication.${app_id}.status == APPROVED"
            - "a StateLicense now exists for application ${app_id} with license_status == PENDING_BOND and bond_requirement_cents == 10000000"
            - "ControlPerson.${cp_id}.change_of_control_status == NOT_REQUIRED (the licensee had zero ACTIVE licenses when the row was created)"

