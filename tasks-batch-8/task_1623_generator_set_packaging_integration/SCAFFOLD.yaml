# =============================================================================
# Task 1623: Generator Set Packaging & Integration — scaffold seed tables
# =============================================================================

scenario: |
  Generator Set Packaging & Integration (Generac/Cummins packager): engine/alternator
  selection & sizing calc, enclosure/fuel-tank configuration & permits, controls
  programming & paralleling scheme, emissions tier certification by locale, factory
  test & load bank record, freight/lift plan & site delivery, startup commissioning
  & training, extended-warranty & PM contract

domain_name: generator-set-packaging
api_prefix: /genset-packaging

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding commitment allowed", constraints: ">= 0" }
      - { name: credit_utilized_cents, type: integer, source: computed, default: 0, description: "Sum of committed_amount_cents over this customer's orders with commercial_status IN {AUTHORIZED, INVOICED}" }
      - { name: primary_locale, type: enum, source: input, description: "Home jurisdiction", constraints: "US_CA | US_TX | DE" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "Account posture", constraints: "ACTIVE | SUSPENDED" }

  - name: EngineModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Manufacturer model code" }
      - { name: manufacturer, type: string, source: input, description: "Engine manufacturer name" }
      - { name: rated_kw, type: integer, source: input, description: "Nameplate standby rating in kW", constraints: "> 0" }
      - { name: fuel_burn_gph_at_75, type: number, source: input, description: "Fuel burn in gallons per hour at 75% load", constraints: "> 0" }
      - { name: emissions_tier_capability, type: enum, source: input, description: "Highest emissions tier this engine is certified for", constraints: "TIER_2 | EPA_TIER_4 | STAGE_V | TIER_4_FINAL_CARB" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "Catalog posture", constraints: "ACTIVE | DISCONTINUED" }

  - name: AlternatorModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Alternator model code" }
      - { name: rated_kva, type: integer, source: input, description: "Nameplate rating in kVA", constraints: "> 0" }
      - { name: efficiency_pct, type: number, source: input, description: "Efficiency percentage at full load", constraints: "0 < x <= 100" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in cents", constraints: ">= 0" }

  - name: PackageOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; ordering account" }
      - { name: site_locale, type: enum, source: input, description: "Installation jurisdiction; drives ullage, permit fee/expiry, emissions tier", constraints: "US_CA | US_TX | DE" }
      - { name: occupancy_type, type: enum, source: input, description: "Building occupancy class; HOSPITAL forces 48h runtime", constraints: "STANDARD | HOSPITAL" }
      - { name: application, type: enum, source: input, description: "Duty application; PRIME forces hour-log requirement on emissions", constraints: "STANDBY | PRIME" }
      - { name: build_status, type: enum, source: system, description: "Physical build pipeline dimension", constraints: "SPEC | SIZING | CONFIGURING | PERMITTING | TESTING | READY_TO_SHIP | DELIVERED | COMMISSIONED | CANCELLED" }
      - { name: commercial_status, type: enum, source: system, description: "Commercial dimension, evolves independently of build_status", constraints: "QUOTE | AUTHORIZED | INVOICED | CLOSED | REFUNDED" }
      - { name: authorized_amount_cents, type: integer, source: system, default: 0, description: "Amount committed at authorization" }
      - { name: committed_amount_cents, type: integer, source: system, default: 0, description: "Open commitment counted against customer credit" }
      - { name: refunded_amount_cents, type: integer, source: system, default: 0, description: "Amount refunded on cancellation" }
      - { name: restocking_fee_cents, type: integer, source: system, default: 0, description: "10% restocking fee withheld when cancelling past SIZING" }
      - { name: freight_charge_cents, type: integer, source: system, default: 0, description: "Freight charge set at authorize; never discounted" }
      - { name: total_price_cents, type: integer, source: computed, description: "Computed at configuration lock: pre_discount - discount + freight" }
      - { name: discount_tier, type: enum, source: computed, description: "Tier keyed on PRE-discount subtotal", constraints: "NONE | TIER_8 | TIER_12" }

  - name: SizingStudy
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; order this study sizes" }
      - { name: engine_model_id, type: string, source: input, description: "FK -> EngineModel.id; candidate engine" }
      - { name: alternator_model_id, type: string, source: input, description: "FK -> AlternatorModel.id; candidate alternator" }
      - { name: load_steps, type: array, source: input, description: "Array of {description, kva, duty} with duty IN {CONTINUOUS, STANDBY_START}" }
      - { name: largest_motor_kva, type: number, source: input, description: "Largest single motor load for starting analysis", constraints: "> 0" }
      - { name: starting_method, type: enum, source: input, description: "Motor starting method", constraints: "DOL | SOFT_START" }
      - { name: altitude_m, type: integer, source: input, description: "Site altitude in meters", constraints: ">= 0" }
      - { name: ambient_c, type: integer, source: input, description: "Design ambient temperature Celsius", constraints: ">= -40 and <= 60" }
      - { name: method, type: enum, source: input, description: "Sizing algorithm variant", constraints: "NAMEPLATE_SUM | DERATED_STOCHASTIC" }
      - { name: required_kva, type: number, source: computed, description: "Required genset kVA per selected method variant, 1 decimal" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> SizingStudy.id; self-reference set when a later approval supersedes this study; null otherwise", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured on reject; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Study lifecycle", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: PackageConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; owning order" }
      - { name: sizing_study_id, type: string, source: input, description: "FK -> SizingStudy.id; approved study this configuration realizes" }
      - { name: enclosure_type, type: enum, source: input, description: "Enclosure package", constraints: "OPEN | WEATHERPROOF | SOUND_ATTENUATED" }
      - { name: enclosure_price_cents, type: integer, source: input, description: "Enclosure option price in cents", constraints: ">= 0" }
      - { name: fuel_tank_gallons, type: integer, source: input, description: "Base fuel tank nominal capacity in gallons", constraints: "> 0" }
      - { name: usable_gallons, type: number, source: computed, description: "= fuel_tank_gallons * (1 - ullage_pct(locale))" }
      - { name: tank_price_cents, type: integer, source: computed, description: "= fuel_tank_gallons * TANK_PRICE_PER_GALLON_CENTS" }
      - { name: runtime_hours, type: number, source: computed, description: "= usable_gallons / engine.fuel_burn_gph_at_75, 2 decimals half-up" }
      - { name: min_runtime_hours, type: integer, source: computed, description: "= 48 when order.occupancy_type == HOSPITAL else 24" }
      - { name: status, type: enum, source: system, description: "Configuration lifecycle", constraints: "DRAFT | LOCKED | RELEASED | CANCELLED" }

  - name: PermitCase
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; owning order" }
      - { name: configuration_id, type: string, source: input, description: "FK -> PackageConfiguration.id; configuration being permitted" }
      - { name: jurisdiction_locale, type: enum, source: system, description: "Copied from order.site_locale at creation", constraints: "US_CA | US_TX | DE" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Permit fee by locale: US_CA 250000, US_TX 100000, DE 175000" }
      - { name: resubmission_fee_cents, type: integer, source: computed, description: "= 50% of base_fee_cents, round half-up" }
      - { name: total_fees_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative fees: base on first submit + resubmission per correction cycle" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of CORRECTION_REQUESTED -> SUBMITTED cycles completed" }
      - { name: submitted_on, type: string, source: system, description: "YYYY-MM-DD logical-clock date of latest submission; null before first submit", constraints: "nullable" }
      - { name: expires_on, type: string, source: system, description: "= submitted_on + jurisdiction_expiry_days (US_CA 60, US_TX 45, DE 90); null before submit", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Permit lifecycle with AHJ correction cycle", constraints: "DRAFT | SUBMITTED | CORRECTION_REQUESTED | APPROVED | EXPIRED | WITHDRAWN" }

  - name: EmissionsCertificate
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; owning order" }
      - { name: configuration_id, type: string, source: input, description: "FK -> PackageConfiguration.id; configuration being certified" }
      - { name: required_tier, type: enum, source: computed, description: "US_CA -> TIER_4_FINAL_CARB; DE -> STAGE_V; else EPA_TIER_4", constraints: "TIER_2 | EPA_TIER_4 | STAGE_V | TIER_4_FINAL_CARB" }
      - { name: engine_tier, type: enum, source: computed, description: "emissions_tier_capability of the engine on the linked sizing study", constraints: "TIER_2 | EPA_TIER_4 | STAGE_V | TIER_4_FINAL_CARB" }
      - { name: requires_hour_log, type: boolean, source: computed, description: "true when order.application == PRIME" }
      - { name: hour_log_attached, type: boolean, source: input, default: false, description: "Whether certified hour log is attached at submit" }
      - { name: rejection_reason, type: string, source: system, description: "Authority rejection reason; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle", constraints: "APP_DRAFT | SUBMITTED | ISSUED | REJECTED | VOIDED" }

  - name: ParallelingScheme
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; owning order" }
      - { name: sync_mode, type: enum, source: input, description: "Paralleling topology", constraints: "ISOLATED | PARALLEL_WITH_UTILITY | MULTI_UNIT" }
      - { name: max_units, type: integer, source: input, description: "Maximum unit positions in the scheme", constraints: ">= 1 and <= 8" }
      - { name: positions, type: array, source: system, default: [], description: "Array of {position_no, kw_rating}; position_no assigned sequentially from 1" }
      - { name: control_program_version, type: string, source: system, description: "Controls program identifier set at program; null before", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Scheme lifecycle", constraints: "DESIGN | PROGRAMMED | VERIFIED" }

  - name: TestBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_code, type: string, source: input, description: "Physical test bay identifier" }
      - { name: max_kw, type: integer, source: input, description: "Maximum load-bank capacity in kW", constraints: "> 0" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "Bay availability posture", constraints: "ACTIVE | OUT_OF_SERVICE" }

  - name: FactoryTest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; order under test" }
      - { name: configuration_id, type: string, source: input, description: "FK -> PackageConfiguration.id; configuration under test" }
      - { name: bay_id, type: string, source: input, description: "FK -> TestBay.id; reserved bay" }
      - { name: retest_of_id, type: string, source: input, description: "FK -> FactoryTest.id; prior failed test this retest supersedes; null for first test", constraints: "nullable" }
      - { name: service_date, type: string, source: input, description: "YYYY-MM-DD bay reservation date" }
      - { name: start_hour, type: integer, source: input, description: "Reservation start hour (0-23)", constraints: ">= 0 and < end_hour" }
      - { name: end_hour, type: integer, source: input, description: "Reservation end hour, half-open [start_hour, end_hour)", constraints: "<= 24 and > start_hour" }
      - { name: readings, type: array, source: system, default: [], description: "Recorded steps: array of {kw, hours, power_factor}" }
      - { name: total_kwh, type: number, source: computed, description: "Sum of per-step energy rounded to 0.1 kWh half-up per step, then summed" }
      - { name: measured_avg_pf, type: number, source: computed, description: "Hours-weighted mean power factor across steps, 4 decimals half-up" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Sum over steps of round_half_up(step_kwh_rounded * LOAD_BANK_RATE_CENTS_PER_KWH)" }
      - { name: verdict, type: enum, source: computed, description: "PASS iff every step power_factor >= 0.80, else FAIL; null until record", constraints: "PASS | FAIL | null" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the TestEngineer who recorded results" }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of the accepting TestEngineer; must differ from recorded_by_user_id", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Test lifecycle", constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | ACCEPTED" }

  - name: CraneSlot
    parent: null
    common_fields: true
    fields:
      - { name: service_date, type: string, source: input, description: "YYYY-MM-DD crane service date" }
      - { name: window_start_hour, type: integer, source: input, description: "Window open hour (0-23)", constraints: ">= 0 and < window_end_hour" }
      - { name: window_end_hour, type: integer, source: input, description: "Window close hour", constraints: "<= 24 and > window_start_hour" }
      - { name: buffer_hours, type: number, source: input, default: 0.5, description: "Mandatory setup buffer appended to every booking's occupancy" }
      - { name: reserved_hours, type: number, source: computed, default: 0, description: "Sum over active bookings of (lift_hours + buffer_hours)" }
      - { name: free_hours, type: number, source: computed, description: "= (window_end_hour - window_start_hour) - reserved_hours" }
      - { name: status, type: enum, source: input, default: "OPEN", description: "Slot posture", constraints: "OPEN | CLOSED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; order being shipped" }
      - { name: crane_slot_id, type: string, source: input, description: "FK -> CraneSlot.id; lift slot booked" }
      - { name: lift_start_hour, type: number, source: input, description: "Lift start hour within the slot window" }
      - { name: lift_hours, type: number, source: input, description: "Lift duration in hours; occupancy is [lift_start_hour, lift_start_hour + lift_hours + buffer_hours)", constraints: "> 0" }
      - { name: gross_weight_kg, type: integer, source: input, description: "Shipping gross weight", constraints: "> 0" }
      - { name: freight_class, type: enum, source: input, description: "Freight classification", constraints: "STANDARD | OVERSIZE | HEAVY_HAUL" }
      - { name: status, type: enum, source: system, description: "Shipment lifecycle", constraints: "BOOKED | DISPATCHED | DELIVERED | RELEASED" }

  - name: CommissioningEvent
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; order being commissioned" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; delivery this startup follows" }
      - { name: service_date, type: string, source: input, description: "YYYY-MM-DD startup date" }
      - { name: assigned_engineer_id, type: string, source: system, description: "Opaque X-User-ID of assigned FieldServiceEngineer; null until assign", constraints: "nullable" }
      - { name: training_hours, type: number, source: system, description: "Delivered training hours recorded at complete; must be >= 2.0", constraints: "nullable until complete" }
      - { name: checklist_completed, type: boolean, source: system, description: "Startup checklist flag recorded at complete", constraints: "nullable until complete" }
      - { name: status, type: enum, source: system, description: "Commissioning lifecycle", constraints: "REQUESTED | ASSIGNED | IN_PROGRESS | COMPLETED | ACCEPTED | CANCELLED" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PackageOrder.id; covered order" }
      - { name: pricing_variant, type: enum, source: input, description: "Pricing algorithm variant", constraints: "FLAT_RISK_PREMIUM | TIME_AND_MATERIALS_EV" }
      - { name: term_years, type: integer, source: input, description: "Coverage term in years", constraints: ">= 1 and <= 10" }
      - { name: nameplate_kw, type: integer, source: input, description: "Nameplate kW basis for flat pricing", constraints: "> 0" }
      - { name: pm_interval_days, type: integer, source: input, default: 90, description: "Preventive-maintenance interval in days", constraints: ">= 30" }
      - { name: annual_price_cents, type: integer, source: computed, description: "Per-year price per variant" }
      - { name: total_price_cents, type: integer, source: computed, description: "Full-term price per variant" }
      - { name: next_pm_due_date, type: string, source: computed, description: "= activation date + pm_interval_days; null until activate", constraints: "nullable" }
      - { name: end_date, type: string, source: computed, description: "= activation date + term_years * 365 days; null until activate", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle", constraints: "QUOTED | BOUND | ACTIVE | LAPSED | EXPIRED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PackageOrder
    initial_state: "build_status=SPEC, commercial_status=QUOTE"
    terminal_states: ["build_status=COMMISSIONED", "build_status=CANCELLED", "commercial_status=CLOSED", "commercial_status=REFUNDED"]
    note: "Two parallel state dimensions on one row. build_status and commercial_status evolve independently; each transition below names the dimension it moves."
    transitions:
      - from: "build_status=SPEC"
        to: "build_status=SIZING"
        trigger: "system (automatic when the first SizingStudy for this order transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"

      - from: "build_status=SIZING"
        to: "build_status=CONFIGURING"
        trigger: "system (automatic when the first PackageConfiguration for this order transitions to LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"

      - from: "build_status=CONFIGURING"
        to: "build_status=PERMITTING"
        trigger: "system (automatic when the first PermitCase for this order transitions to SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"

      - from: "build_status=PERMITTING"
        to: "build_status=TESTING"
        trigger: "system (automatic when a PermitCase is APPROVED for this order AND an EmissionsCertificate is ISSUED for this order; evaluated on both events)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"

      - from: "build_status=TESTING"
        to: "build_status=READY_TO_SHIP"
        trigger: "system (automatic when a FactoryTest for this order transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"

      - from: "build_status=TESTING"
        to: "build_status=CONFIGURING"
        trigger: "system (automatic when a FactoryTest for this order records verdict FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"
          - "Every BOOKED Shipment for this order transitions to RELEASED; its crane occupancy (lift_hours + buffer_hours) is returned to the CraneSlot (CraneSlot.reserved_hours decremented, free_hours recomputed, CraneSlot.version incremented)"
        note: "Test failure regresses the build; logistics booked against READY_TO_SHIP is unwound"

      - from: "build_status=READY_TO_SHIP"
        to: "build_status=CONFIGURING"
        trigger: "system (automatic when a post-acceptance retest FactoryTest for this order records verdict FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"
          - "Every BOOKED Shipment for this order transitions to RELEASED; its crane occupancy (lift_hours + buffer_hours) is returned to the CraneSlot (CraneSlot.reserved_hours decremented, free_hours recomputed, CraneSlot.version incremented)"

      - from: "build_status=READY_TO_SHIP"
        to: "build_status=DELIVERED"
        trigger: "system (automatic when a Shipment for this order transitions to DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"
          - "commercial_status AUTHORIZED -> INVOICED (if currently AUTHORIZED)"

      - from: "build_status=DELIVERED"
        to: "build_status=COMMISSIONED"
        trigger: "system (automatic when a CommissioningEvent for this order transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PackageOrder.version by 1"
          - "commercial_status INVOICED -> CLOSED (if currently INVOICED)"

      - from: "commercial_status=QUOTE"
        to: "commercial_status=AUTHORIZED"
        trigger: "POST /genset-packaging/orders/{orderId}/authorize"
        actor: SalesEngineer
        preconditions:
          - "At least one SizingStudy for this order has status APPROVED (ERR_SIZING_NOT_APPROVED)"
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "customer.credit_utilized_cents + amount_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "authorized_amount_cents = amount_cents; committed_amount_cents = amount_cents; freight_charge_cents = freight_charge_cents input"
          - "CustomerAccount.credit_utilized_cents += amount_cents"
          - "increments PackageOrder.version by 1"

      - from: "any build_status NOT IN {COMMISSIONED, CANCELLED}"
        to: "build_status=CANCELLED"
        trigger: "POST /genset-packaging/orders/{orderId}/cancel"
        actor: SalesEngineer
        preconditions:
          - "build_status NOT IN {COMMISSIONED, CANCELLED} (ERR_INVALID_BUILD_STATE)"
        side_effects:
          - "Hop 1: every PackageConfiguration for this order with status IN {DRAFT, LOCKED, RELEASED} -> CANCELLED"
          - "Hop 2 (caused by hop 1): each configuration cancelled in hop 1 forces its PermitCase with status IN {DRAFT, SUBMITTED, CORRECTION_REQUESTED} -> WITHDRAWN"
          - "Hop 3 (caused by hop 2): each permit withdrawal in hop 2 voids that configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED"
          - "Every BOOKED Shipment for this order -> RELEASED; crane occupancy returned to its CraneSlot (reserved_hours -= lift_hours + buffer_hours; free_hours recomputed; CraneSlot.version incremented)"
          - "Every CommissioningEvent with status IN {REQUESTED, ASSIGNED, IN_PROGRESS} -> CANCELLED"
          - "Every ServiceContract with status IN {QUOTED, BOUND} -> CANCELLED"
          - "If commercial_status IN {AUTHORIZED, INVOICED}: refund = committed_amount_cents - restocking_fee, where restocking_fee = round_half_up(committed_amount_cents * 0.10) when build_status was NOT IN {SPEC, SIZING} at cancel time, else 0; refunded_amount_cents = refund; restocking_fee_cents recorded; commercial_status -> REFUNDED; CustomerAccount.credit_utilized_cents -= committed_amount_cents; committed_amount_cents -> 0"
          - "increments PackageOrder.version by 1"

  - entity: SizingStudy
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    note: "APPROVED is terminal for the study itself but a later study's approval supersedes it; REJECTED loops back to DRAFT."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /genset-packaging/sizing-studies/{studyId}/submit"
        actor: ApplicationEngineer
        preconditions:
          - "Order build_status NOT IN {CANCELLED} (ERR_INVALID_BUILD_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /genset-packaging/sizing-studies/{studyId}/approve"
        actor: SalesEngineer
        preconditions:
          - "engine.rated_kw / 0.8 >= required_kva (ERR_CAPACITY_UNDERSIZED)"
          - "alternator.rated_kva >= required_kva (ERR_CAPACITY_UNDERSIZED)"
        side_effects:
          - "Any other SizingStudy for the same order with status APPROVED -> SUPERSEDED, with superseded_by_id set to this study's id"
          - "Order build_status SPEC -> SIZING when this is the order's first APPROVED study"
          - "increments SizingStudy.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /genset-packaging/sizing-studies/{studyId}/reject"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "rejection_reason = reason input"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /genset-packaging/sizing-studies/{studyId}/submit"
        actor: ApplicationEngineer
        preconditions:
          - "Order build_status NOT IN {CANCELLED} (ERR_INVALID_BUILD_STATE)"
        side_effects:
          - "rejection_reason -> null"
        note: "revision loop: a rejected study may be resubmitted"

  - entity: PackageConfiguration
    initial_state: DRAFT
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /genset-packaging/configurations/{configurationId}/lock"
        actor: ApplicationEngineer
        preconditions:
          - "Order commercial_status == AUTHORIZED (ERR_INVALID_COMMERCIAL_STATE)"
          - "Linked SizingStudy status == APPROVED (ERR_SIZING_NOT_APPROVED)"
          - "runtime_hours >= min_runtime_hours (ERR_FUEL_RUNTIME_INSUFFICIENT)"
        side_effects:
          - "Recompute and persist PackageOrder.total_price_cents and discount_tier per order_total_price calculation"
          - "Order build_status SIZING -> CONFIGURING when this is the order's first LOCKED configuration"
          - "increments PackageConfiguration.version by 1"

      - from: LOCKED
        to: DRAFT
        trigger: "POST /genset-packaging/configurations/{configurationId}/unlock"
        actor: ApplicationEngineer
        preconditions:
          - "No PermitCase for this configuration with status IN {SUBMITTED, APPROVED} (ERR_PERMIT_STATE_INVALID)"
        side_effects:
          - "increments PackageConfiguration.version by 1"

      - from: LOCKED
        to: RELEASED
        trigger: "system (automatic when a FactoryTest for this configuration transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "system (order cancellation cascade, hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's PermitCase with status IN {DRAFT, SUBMITTED, CORRECTION_REQUESTED} -> WITHDRAWN (hop 2)"
          - "If the configuration has NO non-terminal PermitCase: this configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED directly (hop 2 alternate; when a permit exists the cert is voided by the permit withdrawal, hop 3)"

      - from: LOCKED
        to: CANCELLED
        trigger: "system (order cancellation cascade, hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's PermitCase with status IN {DRAFT, SUBMITTED, CORRECTION_REQUESTED} -> WITHDRAWN (hop 2)"
          - "If the configuration has NO non-terminal PermitCase: this configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED directly (hop 2 alternate; when a permit exists the cert is voided by the permit withdrawal, hop 3)"

      - from: RELEASED
        to: CANCELLED
        trigger: "system (order cancellation cascade, hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's PermitCase with status IN {DRAFT, SUBMITTED, CORRECTION_REQUESTED} -> WITHDRAWN (hop 2)"
          - "If the configuration has NO non-terminal PermitCase: this configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED directly (hop 2 alternate; when a permit exists the cert is voided by the permit withdrawal, hop 3)"

  - entity: PermitCase
    initial_state: DRAFT
    terminal_states: [APPROVED, EXPIRED, WITHDRAWN]
    note: "Cyclic: SUBMITTED -> CORRECTION_REQUESTED -> SUBMITTED may repeat; each cycle increments revision_count and accrues a resubmission fee."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /genset-packaging/permit-cases/{permitId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Configuration status == LOCKED (ERR_CONFIG_STATE_INVALID)"
        side_effects:
          - "submitted_on = current logical-clock date; expires_on = submitted_on + jurisdiction_expiry_days"
          - "total_fees_paid_cents += base_fee_cents"
          - "Order build_status CONFIGURING -> PERMITTING when this is the order's first SUBMITTED permit"
          - "increments PermitCase.version by 1"

      - from: CORRECTION_REQUESTED
        to: SUBMITTED
        trigger: "POST /genset-packaging/permit-cases/{permitId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Current logical-clock date <= expires_on (ERR_PERMIT_EXPIRED)"
        side_effects:
          - "revision_count += 1"
          - "submitted_on = current logical-clock date; expires_on = submitted_on + jurisdiction_expiry_days"
          - "total_fees_paid_cents += resubmission_fee_cents"
          - "increments PermitCase.version by 1"

      - from: SUBMITTED
        to: CORRECTION_REQUESTED
        trigger: "POST /genset-packaging/permit-cases/{permitId}/request-correction"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments PermitCase.version by 1"
        note: "PlatformAdmin simulates the external AHJ reviewer"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /genset-packaging/permit-cases/{permitId}/approve-ahj"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Order build_status PERMITTING -> TESTING when an EmissionsCertificate ISSUED already exists for this order"
          - "increments PermitCase.version by 1"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /genset-packaging/permit-cases/{permitId}/expire-check"
        actor: PlatformAdmin
        preconditions:
          - "Current logical-clock date > expires_on (strictly greater; equal does not expire) (ERR_PERMIT_NOT_EXPIRED)"
        side_effects:
          - "increments PermitCase.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /genset-packaging/permit-cases/{permitId}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED"
          - "increments PermitCase.version by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /genset-packaging/permit-cases/{permitId}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED"
          - "increments PermitCase.version by 1"

      - from: CORRECTION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /genset-packaging/permit-cases/{permitId}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED"
          - "increments PermitCase.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (order cancellation cascade, hop 2)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED (hop 3)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system (order cancellation cascade, hop 2)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED (hop 3)"

      - from: CORRECTION_REQUESTED
        to: WITHDRAWN
        trigger: "system (order cancellation cascade, hop 2)"
        actor: system
        preconditions: []
        side_effects:
          - "This configuration's EmissionsCertificate with status IN {APP_DRAFT, SUBMITTED, REJECTED} -> VOIDED (hop 3)"

  - entity: EmissionsCertificate
    initial_state: APP_DRAFT
    terminal_states: [ISSUED, VOIDED]
    transitions:
      - from: APP_DRAFT
        to: SUBMITTED
        trigger: "POST /genset-packaging/emissions-certificates/{certificateId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Configuration status IN {LOCKED, RELEASED} (ERR_CONFIG_STATE_INVALID)"
          - "If requires_hour_log == true then hour_log_attached == true (ERR_HOUR_LOG_REQUIRED)"
        side_effects:
          - "increments EmissionsCertificate.version by 1"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /genset-packaging/emissions-certificates/{certificateId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Configuration status IN {LOCKED, RELEASED} (ERR_CONFIG_STATE_INVALID)"
          - "If requires_hour_log == true then hour_log_attached == true (ERR_HOUR_LOG_REQUIRED)"
        side_effects:
          - "rejection_reason -> null"
          - "increments EmissionsCertificate.version by 1"
        note: "resubmission loop after authority rejection"

      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /genset-packaging/emissions-certificates/{certificateId}/issue"
        actor: PlatformAdmin
        preconditions:
          - "tier_rank(engine_tier) >= tier_rank(required_tier), ranks TIER_2=1, EPA_TIER_4=2, STAGE_V=3, TIER_4_FINAL_CARB=4 (ERR_EMISSIONS_TIER_INSUFFICIENT)"
        side_effects:
          - "Order build_status PERMITTING -> TESTING when a PermitCase APPROVED already exists for this order"
          - "increments EmissionsCertificate.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /genset-packaging/emissions-certificates/{certificateId}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "rejection_reason = reason input"
          - "increments EmissionsCertificate.version by 1"

      - from: APP_DRAFT
        to: VOIDED
        trigger: "system (permit withdrawal cascade, hop 3)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: VOIDED
        trigger: "system (permit withdrawal cascade, hop 3)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: VOIDED
        trigger: "system (permit withdrawal cascade, hop 3)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ParallelingScheme
    initial_state: DESIGN
    terminal_states: [VERIFIED]
    transitions:
      - from: DESIGN
        to: PROGRAMMED
        trigger: "POST /genset-packaging/paralleling-schemes/{schemeId}/program"
        actor: ApplicationEngineer
        preconditions:
          - "1 <= len(positions) <= max_units (ERR_PARALLEL_CAPACITY_EXCEEDED when len(positions) would exceed max_units; ERR_INVALID_REQUEST when empty)"
        side_effects:
          - "control_program_version = program_version input"
          - "increments ParallelingScheme.version by 1"

      - from: PROGRAMMED
        to: DESIGN
        trigger: "POST /genset-packaging/paralleling-schemes/{schemeId}/rework"
        actor: ApplicationEngineer
        preconditions: []
        side_effects:
          - "control_program_version -> null"
          - "increments ParallelingScheme.version by 1"
        note: "rework loop back to design"

      - from: PROGRAMMED
        to: VERIFIED
        trigger: "POST /genset-packaging/paralleling-schemes/{schemeId}/verify"
        actor: ApplicationEngineer
        preconditions:
          - "Order build_status IN {TESTING, READY_TO_SHIP, DELIVERED, COMMISSIONED} (ERR_INVALID_BUILD_STATE)"
        side_effects:
          - "increments ParallelingScheme.version by 1"

  - entity: FactoryTest
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /genset-packaging/factory-tests/{testId}/start"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "increments FactoryTest.version by 1"

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /genset-packaging/factory-tests/{testId}/record (computed verdict == PASS)"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "readings, total_kwh, measured_avg_pf, invoice_total_cents computed and persisted per load_bank_billing and test_verdict calculations"
          - "recorded_by_user_id = X-User-ID of the recorder"
          - "increments FactoryTest.version by 1"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /genset-packaging/factory-tests/{testId}/record (computed verdict == FAIL)"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "readings, total_kwh, measured_avg_pf, invoice_total_cents computed and persisted"
          - "recorded_by_user_id = X-User-ID of the recorder"
          - "Order build_status TESTING -> CONFIGURING or READY_TO_SHIP -> CONFIGURING (build regression)"
          - "Every BOOKED Shipment for the order -> RELEASED; crane occupancy returned to the CraneSlot (reserved_hours -= lift_hours + buffer_hours; free_hours recomputed; CraneSlot.version incremented)"
          - "increments FactoryTest.version by 1"

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /genset-packaging/factory-tests (a new FactoryTest with retest_of_id set to this test)"
        actor: TestEngineer
        preconditions: []
        side_effects: []
        note: "retest loop: a failed test is followed by creating a new test linked via retest_of_id; the failed row itself never leaves FAILED"

      - from: PASSED
        to: ACCEPTED
        trigger: "POST /genset-packaging/factory-tests/{testId}/accept"
        actor: TestEngineer
        preconditions:
          - "X-User-ID != recorded_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "accepted_by_user_id = X-User-ID"
          - "Order build_status TESTING -> READY_TO_SHIP"
          - "Configuration status LOCKED -> RELEASED"
          - "increments FactoryTest.version by 1"

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, RELEASED]
    transitions:
      - from: BOOKED
        to: DISPATCHED
        trigger: "POST /genset-packaging/shipments/{shipmentId}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "Current logical-clock date >= CraneSlot.service_date (ERR_SHIPMENT_DATE_NOT_REACHED)"
        side_effects:
          - "increments Shipment.version by 1"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /genset-packaging/shipments/{shipmentId}/deliver"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "Order build_status READY_TO_SHIP -> DELIVERED; commercial_status AUTHORIZED -> INVOICED"
          - "increments Shipment.version by 1"

      - from: BOOKED
        to: RELEASED
        trigger: "POST /genset-packaging/shipments/{shipmentId}/release"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "CraneSlot.reserved_hours -= (lift_hours + buffer_hours); free_hours recomputed; CraneSlot.version incremented"
          - "increments Shipment.version by 1"

      - from: BOOKED
        to: RELEASED
        trigger: "system (order cancellation cascade or FactoryTest FAIL regression)"
        actor: system
        preconditions: []
        side_effects:
          - "CraneSlot.reserved_hours -= (lift_hours + buffer_hours); free_hours recomputed; CraneSlot.version incremented"

  - entity: CommissioningEvent
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /genset-packaging/commissioning-events/{eventId}/assign"
        actor: FieldServiceManager
        preconditions:
          - "Count of this engineer's events (assigned_engineer_id == engineer_id) with status IN {ASSIGNED, IN_PROGRESS, COMPLETED} on the same service_date < 2 (ERR_ENGINEER_DAY_CAPACITY_EXCEEDED)"
        side_effects:
          - "assigned_engineer_id = engineer_id input"
          - "increments CommissioningEvent.version by 1"

      - from: ASSIGNED
        to: REQUESTED
        trigger: "POST /genset-packaging/commissioning-events/{eventId}/assign with a different engineer_id"
        actor: FieldServiceManager
        preconditions: []
        side_effects:
          - "assigned_engineer_id -> null, then immediately re-ASSIGNED to the new engineer within the same call"
        note: "reassignment passes through REQUESTED atomically; capacity check applies to the new engineer"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /genset-packaging/commissioning-events/{eventId}/start"
        actor: FieldServiceManager
        preconditions: []
        side_effects:
          - "increments CommissioningEvent.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /genset-packaging/commissioning-events/{eventId}/complete"
        actor: FieldServiceManager
        preconditions:
          - "Linked Shipment status == DELIVERED (ERR_SHIPMENT_NOT_DELIVERED)"
          - "checklist_completed == true (ERR_TRAINING_INCOMPLETE)"
          - "training_hours >= 2.0 (ERR_TRAINING_INCOMPLETE)"
        side_effects:
          - "training_hours, checklist_completed persisted"
          - "increments CommissioningEvent.version by 1"

      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /genset-packaging/commissioning-events/{eventId}/accept"
        actor: CustomerContact
        preconditions:
          - "X-User-ID == order.customer_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "Order build_status DELIVERED -> COMMISSIONED; commercial_status INVOICED -> CLOSED"
          - "increments CommissioningEvent.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceContract
    initial_state: QUOTED
    terminal_states: [EXPIRED, LAPSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /genset-packaging/service-contracts/{contractId}/bind"
        actor: SalesEngineer
        preconditions:
          - "Order build_status NOT IN {CANCELLED} (ERR_INVALID_BUILD_STATE)"
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: BOUND
        to: ACTIVE
        trigger: "POST /genset-packaging/service-contracts/{contractId}/activate"
        actor: SalesEngineer
        preconditions:
          - "A CommissioningEvent for this order has status ACCEPTED (ERR_COMMISSIONING_NOT_ACCEPTED)"
        side_effects:
          - "next_pm_due_date = current logical-clock date + pm_interval_days"
          - "end_date = current logical-clock date + term_years * 365 days"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /genset-packaging/service-contracts/{contractId}/lapse-check"
        actor: PlatformAdmin
        preconditions:
          - "Current logical-clock date > next_pm_due_date AND current logical-clock date <= end_date (ERR_CONTRACT_NOT_LAPSABLE)"
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /genset-packaging/service-contracts/{contractId}/lapse-check"
        actor: PlatformAdmin
        preconditions:
          - "Current logical-clock date > end_date (ERR_CONTRACT_NOT_LAPSABLE when neither lapse nor expiry condition holds)"
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /genset-packaging/service-contracts/{contractId}/cancel"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /genset-packaging/service-contracts/{contractId}/cancel"
        actor: SalesEngineer
        preconditions: []
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: QUOTED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BOUND
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: sizing-study-create-stale-order
    parent_entity: PackageOrder
    write_endpoint: "POST /genset-packaging/sizing-studies"
    occ_field: expected_order_version
    description: |
      Creating a SizingStudy against a PackageOrder whose version has advanced
      since the client last observed it is rejected with ERR_STALE_ORDER_VERSION.
      This captures the case where another writer has just created or approved a
      study (advancing the order's version and superseding the prior approved
      study) and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: shipment-book-stale-slot
    parent_entity: CraneSlot
    write_endpoint: "POST /genset-packaging/shipments"
    occ_field: expected_crane_slot_version
    description: |
      Booking a Shipment against a CraneSlot whose version has advanced since the
      client last observed it is rejected with ERR_STALE_CRANE_SLOT_VERSION.
      This captures the case where another booking or release has legitimately
      changed the slot's free_hours and the current writer's capacity view is
      therefore stale.
    error_id: ERR_STALE_CRANE_SLOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sizing_required_kva
    trigger: "on POST /genset-packaging/sizing-studies (at creation)"
    algorithm: aggregation
    formula: |
      running_kva = sum(step.kva for step in load_steps where step.duty == "CONTINUOUS")
      start_multiplier = 3.0 if starting_method == "DOL" else 1.6
      starting_kva = running_kva - largest_motor_kva + largest_motor_kva * start_multiplier
      base_kva = max(running_kva, starting_kva)
      if method == "NAMEPLATE_SUM":
        required_kva = round(base_kva, 1 decimal, half-up)
      else:  # DERATED_STOCHASTIC
        altitude_derate = 0.01 * floor(max(0, altitude_m - 1000) / 500)
        ambient_derate  = 0.02 * floor(max(0, ambient_c - 40) / 5)
        derate_factor = max(0.70, 1 - altitude_derate - ambient_derate)
        required_kva = round(base_kva / derate_factor * 1.10, 1 decimal, half-up)
    input_set: "load_steps as supplied; steps with duty STANDBY_START never enter running_kva"
    constants:
      DOL_START_MULTIPLIER: 3.0
      SOFT_START_MULTIPLIER: 1.6
      STOCHASTIC_RESERVE_FACTOR: 1.10
      DERATE_FLOOR: 0.70
    precision: "1 decimal place, round_half_up"
    variants:
      - name: NAMEPLATE_SUM
        when: "method == NAMEPLATE_SUM"
        difference: "Ignores altitude/ambient derate and stochastic reserve; returns base_kva directly"
      - name: DERATED_STOCHASTIC
        when: "method == DERATED_STOCHASTIC"
        difference: "Divides base by derate_factor (floored at 0.70) and multiplies by 1.10 reserve; identical inputs yield a strictly larger required_kva whenever any derate applies"

  - name: fuel_tank_runtime
    trigger: "on POST /genset-packaging/configurations (persisted) and re-evaluated at configuration lock"
    algorithm: threshold
    formula: |
      ullage_pct = 0.12 if order.site_locale == "US_CA" else 0.10
      usable_gallons = fuel_tank_gallons * (1 - ullage_pct)
      burn_gph = engine.fuel_burn_gph_at_75  (engine taken from the linked APPROVED sizing study)
      runtime_hours = round(usable_gallons / burn_gph, 2 decimals, half-up)
      min_runtime_hours = 48 if order.occupancy_type == "HOSPITAL" else 24
      lock gate: runtime_hours >= min_runtime_hours (>=, so an exactly-equal runtime passes)
    input_set: "the configuration's tank size, the order's locale/occupancy, the approved study's engine burn rate"
    constants:
      ULLAGE_PCT_CA: 0.12
      ULLAGE_PCT_DEFAULT: 0.10
      MIN_RUNTIME_HOSPITAL: 48
      MIN_RUNTIME_STANDARD: 24
      TANK_PRICE_PER_GALLON_CENTS: 150
    precision: "runtime_hours 2 decimals, round_half_up"

  - name: order_total_price
    trigger: "on PackageConfiguration transition DRAFT -> LOCKED"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned to break the circularity between tier and total:
      study = the configuration's sizing_study (must be APPROVED)
      equipment_subtotal = study.engine.list_price_cents + study.alternator.list_price_cents
      options_subtotal = configuration.enclosure_price_cents + configuration.tank_price_cents
      pre_discount = equipment_subtotal + options_subtotal
      # Step 1: tier is keyed on PRE-discount subtotal (never on the discounted total)
      if pre_discount >= 100000000: discount_tier = TIER_12, rate = 0.12
      elif pre_discount >= 50000000: discount_tier = TIER_8, rate = 0.08
      else: discount_tier = NONE, rate = 0.0
      # Step 2: discount applies to equipment+options only; freight is NEVER discounted
      discount_cents = round_half_up(pre_discount * rate)
      # Step 3: freight added after discount
      total_price_cents = pre_discount - discount_cents + order.freight_charge_cents
    input_set: "latest LOCKED configuration for the order, its APPROVED sizing study, catalog prices, order.freight_charge_cents"
    constants:
      TIER_12_THRESHOLD_CENTS: 100000000
      TIER_8_THRESHOLD_CENTS: 50000000
    precision: "integer cents, round_half_up on discount"

  - name: load_bank_billing
    trigger: "on POST /genset-packaging/factory-tests/{testId}/record"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per step first, then sum. Never sum-then-round.
      total_kwh = 0; invoice_total_cents = 0
      for each step in readings (in array order):
        step_kwh_raw = step.kw * step.hours
        step_kwh = round(step_kwh_raw, 1 decimal, half-up)
        total_kwh += step_kwh
        step_charge = round_half_up(step_kwh * LOAD_BANK_RATE_CENTS_PER_KWH)
        invoice_total_cents += step_charge
      total_kwh = round(total_kwh, 1 decimal, half-up)
    input_set: "readings array supplied at record"
    constants:
      LOAD_BANK_RATE_CENTS_PER_KWH: 32
    precision: "step energy 1 decimal half-up; charges integer cents half-up per step"

  - name: test_verdict
    trigger: "on POST /genset-packaging/factory-tests/{testId}/record"
    algorithm: threshold
    formula: |
      verdict = PASS iff for EVERY step in readings: step.power_factor >= 0.80
      (0.80 exactly passes; 0.79 fails)
      measured_avg_pf = round(sum(step.power_factor * step.hours) / sum(step.hours), 4 decimals, half-up)
      readings must be a non-empty array and every step.hours > 0 (ERR_INVALID_REQUEST otherwise)
    input_set: "readings array supplied at record"
    constants:
      PF_PASS_THRESHOLD: 0.80
    precision: "measured_avg_pf 4 decimals, round_half_up"

  - name: crane_slot_capacity
    trigger: "on POST /genset-packaging/shipments (book), POST /genset-packaging/shipments/{id}/release, and cascaded releases"
    algorithm: interval_merge
    formula: |
      occupancy of a booking = half-open interval [lift_start_hour, lift_start_hour + lift_hours + slot.buffer_hours)
      two bookings conflict iff their occupancy intervals intersect (a.start < b.end AND b.start < a.end);
      adjacency where a_end == b_start does NOT conflict
      reserved_hours = sum over Shipment rows for this slot with status IN {BOOKED, DISPATCHED} of (lift_hours + slot.buffer_hours)
      free_hours = (window_end_hour - window_start_hour) - reserved_hours
      invariant: free_hours + reserved_hours == window_end_hour - window_start_hour at all times
    input_set: "shipments for this slot with status IN {BOOKED, DISPATCHED}"
    constants: {}
    precision: "hours as decimal (0.5 granularity), no rounding"

  - name: emissions_tier_determination
    trigger: "on POST /genset-packaging/emissions-certificates (persisted)"
    algorithm: threshold
    formula: |
      if order.site_locale == "US_CA": required_tier = TIER_4_FINAL_CARB
      elif order.site_locale == "DE": required_tier = STAGE_V
      else: required_tier = EPA_TIER_4
      requires_hour_log = (order.application == "PRIME")
      tier_rank: TIER_2=1, EPA_TIER_4=2, STAGE_V=3, TIER_4_FINAL_CARB=4
      issue gate: tier_rank(engine_tier) >= tier_rank(required_tier)
    input_set: "order.site_locale, order.application, linked study's engine emissions_tier_capability"
    constants:
      RANK_TIER_2: 1
      RANK_EPA_TIER_4: 2
      RANK_STAGE_V: 3
      RANK_TIER_4_FINAL_CARB: 4
    precision: "exact enum comparison"

  - name: service_contract_price
    trigger: "on POST /genset-packaging/service-contracts (persisted at creation)"
    algorithm: tiered_pricing
    formula: |
      if pricing_variant == "FLAT_RISK_PREMIUM":
        locale_mult = 1.25 if order.site_locale == "US_CA" else (1.10 if order.site_locale == "DE" else 1.0)
        annual_price_cents = round_half_up(FLAT_RATE_CENTS_PER_KW_YEAR * nameplate_kw * locale_mult)
        total_price_cents = annual_price_cents * term_years
      else:  # TIME_AND_MATERIALS_EV
        per_visit_cents = PM_VISIT_HOURS * LABOR_RATE_CENTS_PER_HOUR + PM_PARTS_ALLOWANCE_CENTS
        annual_price_cents = round_half_up(per_visit_cents * PM_VISITS_PER_YEAR * RISK_FACTOR)
        total_price_cents = annual_price_cents * term_years
    input_set: "contract pricing_variant, nameplate_kw, term_years, order.site_locale"
    constants:
      FLAT_RATE_CENTS_PER_KW_YEAR: 1200
      PM_VISIT_HOURS: 6
      LABOR_RATE_CENTS_PER_HOUR: 15000
      PM_PARTS_ALLOWANCE_CENTS: 40000
      PM_VISITS_PER_YEAR: 4
      RISK_FACTOR: 1.15
    precision: "integer cents, round_half_up"
    variants:
      - name: FLAT_RISK_PREMIUM
        when: "pricing_variant == FLAT_RISK_PREMIUM"
        difference: "Flat rate per kW-year scaled by locale multiplier; ignores PM visit structure"
      - name: TIME_AND_MATERIALS_EV
        when: "pricing_variant == TIME_AND_MATERIALS_EV"
        difference: "Expected-value build-up from PM visits (labor + parts) scaled by risk factor 1.15; identical inputs yield a different total than FLAT_RISK_PREMIUM"

  - name: permit_fee_schedule
    trigger: "on PermitCase transitions into SUBMITTED"
    algorithm: aggregation
    formula: |
      base_fee_cents = 250000 if locale == "US_CA" else (175000 if locale == "DE" else 100000)
      resubmission_fee_cents = round_half_up(base_fee_cents * 0.50)
      first submission: total_fees_paid_cents += base_fee_cents
      each CORRECTION_REQUESTED -> SUBMITTED cycle: total_fees_paid_cents += resubmission_fee_cents
      jurisdiction_expiry_days = 60 if locale == "US_CA" else (90 if locale == "DE" else 45)
    input_set: "permit.jurisdiction_locale, submission events"
    constants:
      PERMIT_FEE_CA_CENTS: 250000
      PERMIT_FEE_DE_CENTS: 175000
      PERMIT_FEE_DEFAULT_CENTS: 100000
      EXPIRY_DAYS_CA: 60
      EXPIRY_DAYS_DE: 90
      EXPIRY_DAYS_DEFAULT: 45
    precision: "integer cents, round_half_up"

  - name: credit_utilization
    trigger: "on order authorize and on order cancel"
    algorithm: aggregation
    formula: |
      CustomerAccount.credit_utilized_cents = sum(committed_amount_cents over that customer's
        PackageOrder rows with commercial_status IN {AUTHORIZED, INVOICED})
      invariant: credit_utilized_cents tracks the set sum exactly across authorize (+) and
        cancellation/refund (-); an authorize-then-cancel round trip returns utilization to
        its pre-authorize value
    input_set: "orders of the customer with commercial_status IN {AUTHORIZED, INVOICED}"
    constants: {}
    precision: "integer cents"

  - name: engineer_day_load
    trigger: "on POST /genset-packaging/commissioning-events/{eventId}/assign"
    algorithm: aggregation
    formula: |
      day_load(engineer, date) = count of CommissioningEvent rows with assigned_engineer_id == engineer
        AND service_date == date AND status IN {ASSIGNED, IN_PROGRESS, COMPLETED}
      assignment gate: day_load(engineer, event.service_date) < 2 before assignment
      (the 2nd same-day assignment is allowed; the 3rd is rejected)
    input_set: "all commissioning events for the engineer on the service_date"
    constants:
      MAX_EVENTS_PER_ENGINEER_PER_DAY: 2
    precision: "integer count"

  - name: restocking_refund
    trigger: "on POST /genset-packaging/orders/{orderId}/cancel when commercial_status IN {AUTHORIZED, INVOICED}"
    algorithm: threshold
    formula: |
      if build_status at cancel time IN {SPEC, SIZING}: restocking_fee_cents = 0
      else: restocking_fee_cents = round_half_up(committed_amount_cents * 0.10)
      refunded_amount_cents = committed_amount_cents - restocking_fee_cents
    input_set: "the order being cancelled"
    constants:
      RESTOCKING_RATE: 0.10
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; ownership rules (CustomerContact owns the account; TestEngineer is not the recorder for accept)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids and body FK ids exist; path-template ids validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "OCC expected version matches the parent's current version (sizing-study create vs PackageOrder; shipment create vs CraneSlot)"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_CRANE_SLOT_VERSION"
    http_status: 412
    applies_to: "POST /genset-packaging/sizing-studies, POST /genset-packaging/shipments"

  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition; order build/commercial gates on dependent operations (shipment create needs READY_TO_SHIP; commissioning-event create needs DELIVERED; scheme verify needs TESTING+; cancel forbids COMMISSIONED; configuration lock needs AUTHORIZED commercial; study submit/bind forbid CANCELLED order)"
    error_id: "ERR_INVALID_BUILD_STATE | ERR_INVALID_COMMERCIAL_STATE | ERR_STUDY_STATE_INVALID | ERR_CONFIG_STATE_INVALID | ERR_PERMIT_STATE_INVALID | ERR_CERT_STATE_INVALID | ERR_SCHEME_STATE_INVALID | ERR_TEST_STATE_INVALID | ERR_SHIPMENT_STATE_INVALID | ERR_EVENT_STATE_INVALID | ERR_CONTRACT_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints, POST /genset-packaging/shipments, POST /genset-packaging/commissioning-events"

  - priority: 6
    category: business_safety
    check: "Emissions/locale safety: engine tier rank >= required tier rank at issue; hour log attached when PRIME"
    error_id: "ERR_EMISSIONS_TIER_INSUFFICIENT | ERR_HOUR_LOG_REQUIRED"
    http_status: 422
    applies_to: "POST /genset-packaging/emissions-certificates/{id}/issue, POST /genset-packaging/emissions-certificates/{id}/submit"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: FactoryTest acceptor X-User-ID must differ from recorded_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /genset-packaging/factory-tests/{id}/accept"

  - priority: 8
    category: business_constraint
    check: "Capacity/overlap: crane occupancy intervals must not intersect (buffer-augmented half-open); test-bay windows must not overlap (plain half-open); engineer day load < 2; paralleling positions <= max_units; sizing capacity at approve (engine.rated_kw/0.8 >= required_kva, alternator.rated_kva >= required_kva)"
    error_id: "ERR_CRANE_WINDOW_OVERLAP | ERR_TEST_BAY_OVERLAP | ERR_ENGINEER_DAY_CAPACITY_EXCEEDED | ERR_PARALLEL_CAPACITY_EXCEEDED | ERR_CAPACITY_UNDERSIZED"
    http_status: 409
    applies_to: "POST /genset-packaging/shipments, POST /genset-packaging/factory-tests, POST /genset-packaging/commissioning-events/{id}/assign, POST /genset-packaging/paralleling-schemes/{id}/positions, POST /genset-packaging/sizing-studies/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "Clock-relative windows: permit resubmission before expiry; expire-check requires date > expires_on; dispatch requires date >= slot service_date; lapse-check requires date > next_pm_due_date or end_date"
    error_id: "ERR_PERMIT_EXPIRED | ERR_PERMIT_NOT_EXPIRED | ERR_SHIPMENT_DATE_NOT_REACHED | ERR_CONTRACT_NOT_LAPSABLE"
    http_status: 422
    applies_to: "POST /genset-packaging/permit-cases/{id}/submit, POST /genset-packaging/permit-cases/{id}/expire-check, POST /genset-packaging/shipments/{id}/dispatch, POST /genset-packaging/service-contracts/{id}/lapse-check"

  - priority: 10
    category: business_referential
    check: "Cross-entity state references: authorize needs an APPROVED study; configuration lock needs APPROVED study + AUTHORIZED order; factory-test create needs ISSUED cert; commissioning create and complete need a DELIVERED shipment (create also needs order build_status == DELIVERED, gated as ERR_INVALID_BUILD_STATE under priority 5); contract activate needs ACCEPTED commissioning; customer must be ACTIVE"
    error_id: "ERR_SIZING_NOT_APPROVED | ERR_CERT_NOT_ISSUED | ERR_SHIPMENT_NOT_DELIVERED | ERR_COMMISSIONING_NOT_ACCEPTED | ERR_CUSTOMER_SUSPENDED | ERR_INVALID_COMMERCIAL_STATE"
    http_status: 409
    applies_to: "POST /genset-packaging/orders/{id}/authorize, POST /genset-packaging/configurations/{id}/lock, POST /genset-packaging/factory-tests, POST /genset-packaging/commissioning-events, POST /genset-packaging/commissioning-events/{id}/complete, POST /genset-packaging/service-contracts/{id}/activate"

  - priority: 11
    category: business_fiscal
    check: "Credit gate: customer.credit_utilized_cents + amount_cents <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /genset-packaging/orders/{id}/authorize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/genset-packaging/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All date comparisons (permit expiry, dispatch eligibility, contract lapse) read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: []

  # --- CustomerAccount ---
  - method: POST
    path: "/genset-packaging/customers"
    description: "Create a customer account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, credit_limit_cents, primary_locale, "status?"]
    output: CustomerAccount
    side_effects: ["credit_utilized_cents = 0"]

  - method: GET
    path: "/genset-packaging/customers/{customerId}"
    description: "Get a customer account"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  # --- EngineModel ---
  - method: POST
    path: "/genset-packaging/engine-models"
    description: "Create an engine catalog model"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, manufacturer, rated_kw, fuel_burn_gph_at_75, emissions_tier_capability, list_price_cents, "status?"]
    output: EngineModel
    side_effects: []

  - method: GET
    path: "/genset-packaging/engine-models/{engineModelId}"
    description: "Get an engine model"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: EngineModel
    side_effects: []

  # --- AlternatorModel ---
  - method: POST
    path: "/genset-packaging/alternator-models"
    description: "Create an alternator catalog model"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, rated_kva, efficiency_pct, list_price_cents]
    output: AlternatorModel
    side_effects: []

  - method: GET
    path: "/genset-packaging/alternator-models/{alternatorModelId}"
    description: "Get an alternator model"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: AlternatorModel
    side_effects: []

  # --- PackageOrder ---
  - method: POST
    path: "/genset-packaging/orders"
    description: "Create a package order (build_status=SPEC, commercial_status=QUOTE)"
    roles: [SalesEngineer]
    code: 201
    input: [customer_id, site_locale, occupancy_type, application]
    output: PackageOrder
    side_effects: ["build_status=SPEC, commercial_status=QUOTE"]

  - method: GET
    path: "/genset-packaging/orders/{orderId}"
    description: "Get an order"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: PackageOrder
    side_effects: []

  - method: GET
    path: "/genset-packaging/orders"
    description: "List orders (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: PackageOrder[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/orders/{orderId}/authorize"
    description: "Authorize the order commercially (QUOTE -> AUTHORIZED) with credit check"
    roles: [SalesEngineer]
    code: 200
    input: [amount_cents, freight_charge_cents]
    output: PackageOrder
    side_effects:
      - "commercial_status -> AUTHORIZED; authorized/committed = amount_cents; freight_charge_cents stored"
      - "CustomerAccount.credit_utilized_cents += amount_cents"
      - "increments PackageOrder.version by 1"

  - method: POST
    path: "/genset-packaging/orders/{orderId}/cancel"
    description: "Cancel the order; cascades to configurations, permits, certificates, shipments, events, contracts; refunds per restocking_refund"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: PackageOrder
    side_effects:
      - "build_status -> CANCELLED; commercial -> REFUNDED when AUTHORIZED/INVOICED"
      - "3-hop cascade: configurations CANCELLED -> permits WITHDRAWN -> certificates VOIDED"
      - "BOOKED shipments RELEASED (crane hours restored); open events/contracts CANCELLED"
      - "increments PackageOrder.version by 1"

  # --- SizingStudy ---
  - method: POST
    path: "/genset-packaging/sizing-studies"
    description: "Create a sizing study (OCC-guarded on the order's version)"
    roles: [ApplicationEngineer]
    code: 201
    input: [order_id, engine_model_id, alternator_model_id, load_steps, largest_motor_kva, starting_method, altitude_m, ambient_c, method, expected_order_version]
    output: SizingStudy
    side_effects:
      - "required_kva computed per sizing_required_kva variant"
      - "increments PackageOrder.version by 1"

  - method: GET
    path: "/genset-packaging/sizing-studies/{studyId}"
    description: "Get a sizing study"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: SizingStudy
    side_effects: []

  - method: GET
    path: "/genset-packaging/sizing-studies"
    description: "List sizing studies (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "engine_model_id?", "alternator_model_id?", "superseded_by_id?", "limit?", "offset?"]
    output: SizingStudy[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/sizing-studies/{studyId}/submit"
    description: "Submit study for approval (DRAFT -> SUBMITTED, or REJECTED -> SUBMITTED)"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: SizingStudy
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/genset-packaging/sizing-studies/{studyId}/approve"
    description: "Approve study; capacity gate; supersedes any prior APPROVED study"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: SizingStudy
    side_effects:
      - "status -> APPROVED; prior APPROVED study for the order -> SUPERSEDED (superseded_by_id set)"
      - "order build SPEC -> SIZING when first approval"
      - "increments PackageOrder.version by 1 when build advances"

  - method: POST
    path: "/genset-packaging/sizing-studies/{studyId}/reject"
    description: "Reject study (SUBMITTED -> REJECTED)"
    roles: [SalesEngineer]
    code: 200
    input: [reason]
    output: SizingStudy
    side_effects: ["status -> REJECTED; rejection_reason stored"]

  # --- PackageConfiguration ---
  - method: POST
    path: "/genset-packaging/configurations"
    description: "Create a package configuration; runtime/usable/tank price computed immediately"
    roles: [ApplicationEngineer]
    code: 201
    input: [order_id, sizing_study_id, enclosure_type, enclosure_price_cents, fuel_tank_gallons]
    output: PackageConfiguration
    side_effects: ["usable_gallons, tank_price_cents, runtime_hours, min_runtime_hours computed"]

  - method: GET
    path: "/genset-packaging/configurations/{configurationId}"
    description: "Get a configuration"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: PackageConfiguration
    side_effects: []

  - method: GET
    path: "/genset-packaging/configurations"
    description: "List configurations (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "sizing_study_id?", "limit?", "offset?"]
    output: PackageConfiguration[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/configurations/{configurationId}/lock"
    description: "Lock configuration; runtime gate; computes order total price; advances build to CONFIGURING"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: PackageConfiguration
    side_effects:
      - "status -> LOCKED; order total_price_cents/discount_tier computed"
      - "order build SIZING -> CONFIGURING; increments PackageOrder.version by 1 when build advances"

  - method: POST
    path: "/genset-packaging/configurations/{configurationId}/unlock"
    description: "Unlock a LOCKED configuration (revert) when no live permit exists"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: PackageConfiguration
    side_effects: ["status -> DRAFT"]

  # --- PermitCase ---
  - method: POST
    path: "/genset-packaging/permit-cases"
    description: "Create a permit case for a configuration"
    roles: [ComplianceOfficer]
    code: 201
    input: [order_id, configuration_id]
    output: PermitCase
    side_effects: ["jurisdiction_locale, base_fee_cents, resubmission_fee_cents computed from order.site_locale"]

  - method: GET
    path: "/genset-packaging/permit-cases/{permitId}"
    description: "Get a permit case"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: PermitCase
    side_effects: []

  - method: GET
    path: "/genset-packaging/permit-cases"
    description: "List permit cases (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "configuration_id?", "limit?", "offset?"]
    output: PermitCase[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/permit-cases/{permitId}/submit"
    description: "Submit permit to AHJ (DRAFT -> SUBMITTED, or CORRECTION_REQUESTED -> SUBMITTED with revision_count += 1)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PermitCase
    side_effects: ["status -> SUBMITTED; fees accrued; submitted_on/expires_on set from logical clock"]

  - method: POST
    path: "/genset-packaging/permit-cases/{permitId}/request-correction"
    description: "AHJ requests corrections (SUBMITTED -> CORRECTION_REQUESTED); PlatformAdmin simulates the external AHJ"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PermitCase
    side_effects: ["status -> CORRECTION_REQUESTED"]

  - method: POST
    path: "/genset-packaging/permit-cases/{permitId}/approve-ahj"
    description: "AHJ approves permit (SUBMITTED -> APPROVED); may advance order to TESTING"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PermitCase
    side_effects: ["status -> APPROVED; order PERMITTING -> TESTING if cert ISSUED exists"]

  - method: POST
    path: "/genset-packaging/permit-cases/{permitId}/withdraw"
    description: "Withdraw permit; voids the configuration's non-terminal emissions certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PermitCase
    side_effects: ["status -> WITHDRAWN; linked certificate APP_DRAFT/SUBMITTED/REJECTED -> VOIDED"]

  - method: POST
    path: "/genset-packaging/permit-cases/{permitId}/expire-check"
    description: "Expire a SUBMITTED permit when the logical-clock date is strictly past expires_on"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PermitCase
    side_effects: ["status -> EXPIRED when clock date > expires_on"]

  # --- EmissionsCertificate ---
  - method: POST
    path: "/genset-packaging/emissions-certificates"
    description: "Create an emissions certificate application; required tier derived from locale/application"
    roles: [ComplianceOfficer]
    code: 201
    input: [order_id, configuration_id, "hour_log_attached?"]
    output: EmissionsCertificate
    side_effects: ["required_tier, engine_tier, requires_hour_log computed"]

  - method: GET
    path: "/genset-packaging/emissions-certificates/{certificateId}"
    description: "Get an emissions certificate"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: EmissionsCertificate
    side_effects: []

  - method: GET
    path: "/genset-packaging/emissions-certificates"
    description: "List emissions certificates (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "configuration_id?", "limit?", "offset?"]
    output: EmissionsCertificate[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/emissions-certificates/{certificateId}/submit"
    description: "Submit certificate application (APP_DRAFT -> SUBMITTED, or REJECTED -> SUBMITTED)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["hour_log_attached?"]
    output: EmissionsCertificate
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/genset-packaging/emissions-certificates/{certificateId}/issue"
    description: "Authority issues certificate when engine tier rank >= required rank"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EmissionsCertificate
    side_effects: ["status -> ISSUED; order PERMITTING -> TESTING if permit APPROVED exists"]

  - method: POST
    path: "/genset-packaging/emissions-certificates/{certificateId}/reject"
    description: "Authority rejects certificate application"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: EmissionsCertificate
    side_effects: ["status -> REJECTED; rejection_reason stored"]

  # --- ParallelingScheme ---
  - method: POST
    path: "/genset-packaging/paralleling-schemes"
    description: "Create a paralleling scheme (DESIGN)"
    roles: [ApplicationEngineer]
    code: 201
    input: [order_id, sync_mode, max_units]
    output: ParallelingScheme
    side_effects: ["status=DESIGN, positions=[]"]

  - method: GET
    path: "/genset-packaging/paralleling-schemes/{schemeId}"
    description: "Get a paralleling scheme"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: ParallelingScheme
    side_effects: []

  - method: GET
    path: "/genset-packaging/paralleling-schemes"
    description: "List paralleling schemes (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: ParallelingScheme[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/paralleling-schemes/{schemeId}/positions"
    description: "Append a unit position (DESIGN only); position_no assigned sequentially; count must stay <= max_units"
    roles: [ApplicationEngineer]
    code: 201
    input: [kw_rating]
    output: ParallelingScheme
    side_effects: ["positions appended with next position_no"]

  - method: POST
    path: "/genset-packaging/paralleling-schemes/{schemeId}/program"
    description: "Program controls (DESIGN -> PROGRAMMED); requires 1..max_units positions"
    roles: [ApplicationEngineer]
    code: 200
    input: [program_version]
    output: ParallelingScheme
    side_effects: ["status -> PROGRAMMED; control_program_version stored"]

  - method: POST
    path: "/genset-packaging/paralleling-schemes/{schemeId}/rework"
    description: "Send scheme back to design (PROGRAMMED -> DESIGN)"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: ParallelingScheme
    side_effects: ["status -> DESIGN; control_program_version cleared"]

  - method: POST
    path: "/genset-packaging/paralleling-schemes/{schemeId}/verify"
    description: "Verify programmed scheme once order has reached TESTING"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: ParallelingScheme
    side_effects: ["status -> VERIFIED"]

  # --- TestBay ---
  - method: POST
    path: "/genset-packaging/test-bays"
    description: "Create a test bay"
    roles: [PlatformAdmin]
    code: 201
    input: [bay_code, max_kw, "status?"]
    output: TestBay
    side_effects: []

  - method: GET
    path: "/genset-packaging/test-bays/{testBayId}"
    description: "Get a test bay"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: TestBay
    side_effects: []

  # --- FactoryTest ---
  - method: POST
    path: "/genset-packaging/factory-tests"
    description: "Schedule a factory load-bank test on a bay. Preconditions: (referential) an EmissionsCertificate for the order has status ISSUED (ERR_CERT_NOT_ISSUED); (state) the referenced PackageConfiguration has status IN {LOCKED, RELEASED} (ERR_CONFIG_STATE_INVALID) and belongs to the referenced order (ERR_NOT_FOUND); (constraint) the bay is ACTIVE and the half-open window [start_hour, end_hour) does not intersect any existing non-terminal test window on the same bay and service_date (ERR_TEST_BAY_OVERLAP); if retest_of_id is given it must reference a FAILED test of the same order (ERR_INVALID_REQUEST). NOTE: no order build_status gate on creation — the ISSUED-certificate gate is the cross-entity precondition, so a cert-less order fails with ERR_CERT_NOT_ISSUED rather than a build-state error; this is what allows post-acceptance retests at READY_TO_SHIP."
    roles: [TestEngineer]
    code: 201
    input: [order_id, configuration_id, bay_id, service_date, start_hour, end_hour, "retest_of_id?"]
    output: FactoryTest
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/genset-packaging/factory-tests/{testId}"
    description: "Get a factory test"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: FactoryTest
    side_effects: []

  - method: GET
    path: "/genset-packaging/factory-tests"
    description: "List factory tests (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "configuration_id?", "bay_id?", "retest_of_id?", "limit?", "offset?"]
    output: FactoryTest[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/factory-tests/{testId}/start"
    description: "Start a scheduled test (SCHEDULED -> IN_PROGRESS)"
    roles: [TestEngineer]
    code: 200
    input: []
    output: FactoryTest
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/genset-packaging/factory-tests/{testId}/record"
    description: "Record load-bank readings; computes verdict, energy, billing; FAIL regresses order build and releases booked shipments"
    roles: [TestEngineer]
    code: 200
    input: [readings]
    output: FactoryTest
    side_effects:
      - "verdict/total_kwh/measured_avg_pf/invoice_total_cents computed; recorded_by_user_id = X-User-ID"
      - "verdict FAIL: order build -> CONFIGURING; BOOKED shipments -> RELEASED (crane hours restored)"

  - method: POST
    path: "/genset-packaging/factory-tests/{testId}/accept"
    description: "Accept a PASSED test; acceptor must differ from recorder (segregation of duties)"
    roles: [TestEngineer]
    code: 200
    input: []
    output: FactoryTest
    side_effects:
      - "status -> ACCEPTED; accepted_by_user_id = X-User-ID"
      - "order build TESTING -> READY_TO_SHIP; configuration LOCKED -> RELEASED"

  # --- CraneSlot ---
  - method: POST
    path: "/genset-packaging/crane-slots"
    description: "Create a crane service slot"
    roles: [PlatformAdmin]
    code: 201
    input: [service_date, window_start_hour, window_end_hour, "buffer_hours?", "status?"]
    output: CraneSlot
    side_effects: ["reserved_hours=0, free_hours=window length"]

  - method: GET
    path: "/genset-packaging/crane-slots/{craneSlotId}"
    description: "Get a crane slot"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: CraneSlot
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/genset-packaging/shipments"
    description: "Book a shipment against a crane slot (OCC-guarded on the slot's version); requires order READY_TO_SHIP"
    roles: [LogisticsCoordinator]
    code: 201
    input: [order_id, crane_slot_id, lift_start_hour, lift_hours, gross_weight_kg, freight_class, expected_crane_slot_version]
    output: Shipment
    side_effects:
      - "status=BOOKED; CraneSlot.reserved_hours += lift_hours + buffer_hours; free_hours recomputed"
      - "increments CraneSlot.version by 1"

  - method: GET
    path: "/genset-packaging/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/genset-packaging/shipments"
    description: "List shipments (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "crane_slot_id?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/shipments/{shipmentId}/dispatch"
    description: "Dispatch a booked shipment; logical-clock date must be >= slot service_date"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/genset-packaging/shipments/{shipmentId}/deliver"
    description: "Mark shipment delivered; advances order to DELIVERED and commercial to INVOICED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DELIVERED; order build -> DELIVERED; commercial AUTHORIZED -> INVOICED"]

  - method: POST
    path: "/genset-packaging/shipments/{shipmentId}/release"
    description: "Release a booked shipment; returns crane occupancy to the slot"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> RELEASED; CraneSlot.reserved_hours -= lift_hours + buffer_hours; free_hours recomputed; increments CraneSlot.version by 1"]

  # --- CommissioningEvent ---
  - method: POST
    path: "/genset-packaging/commissioning-events"
    description: "Request startup commissioning for a delivered order"
    roles: [FieldServiceManager]
    code: 201
    input: [order_id, shipment_id, service_date]
    output: CommissioningEvent
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/genset-packaging/commissioning-events/{eventId}"
    description: "Get a commissioning event"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: CommissioningEvent
    side_effects: []

  - method: GET
    path: "/genset-packaging/commissioning-events"
    description: "List commissioning events (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "shipment_id?", "limit?", "offset?"]
    output: CommissioningEvent[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/commissioning-events/{eventId}/assign"
    description: "Assign (or reassign) a field engineer; engineer day capacity is 2 events per service_date"
    roles: [FieldServiceManager]
    code: 200
    input: [engineer_id]
    output: CommissioningEvent
    side_effects: ["status -> ASSIGNED; assigned_engineer_id set"]

  - method: POST
    path: "/genset-packaging/commissioning-events/{eventId}/start"
    description: "Begin startup work (ASSIGNED -> IN_PROGRESS)"
    roles: [FieldServiceManager]
    code: 200
    input: []
    output: CommissioningEvent
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/genset-packaging/commissioning-events/{eventId}/complete"
    description: "Complete startup; requires delivered shipment, checklist done, >= 2.0 training hours"
    roles: [FieldServiceManager]
    code: 200
    input: [training_hours, checklist_completed]
    output: CommissioningEvent
    side_effects: ["status -> COMPLETED; training_hours/checklist_completed stored"]

  - method: POST
    path: "/genset-packaging/commissioning-events/{eventId}/accept"
    description: "Customer accepts commissioning; advances order to COMMISSIONED and commercial to CLOSED"
    roles: [CustomerContact]
    code: 200
    input: []
    output: CommissioningEvent
    side_effects: ["status -> ACCEPTED; order build -> COMMISSIONED; commercial INVOICED -> CLOSED"]

  # --- ServiceContract ---
  - method: POST
    path: "/genset-packaging/service-contracts"
    description: "Quote an extended-warranty/PM contract; price computed per pricing_variant"
    roles: [SalesEngineer]
    code: 201
    input: [order_id, pricing_variant, term_years, nameplate_kw, "pm_interval_days?"]
    output: ServiceContract
    side_effects: ["annual_price_cents and total_price_cents computed per service_contract_price variant"]

  - method: GET
    path: "/genset-packaging/service-contracts/{contractId}"
    description: "Get a service contract"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/genset-packaging/service-contracts"
    description: "List service contracts (paginated, filterable)"
    roles: [PlatformAdmin, SalesEngineer, ApplicationEngineer, ComplianceOfficer, TestEngineer, LogisticsCoordinator, FieldServiceManager, CustomerContact]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/genset-packaging/service-contracts/{contractId}/bind"
    description: "Bind a quoted contract (QUOTED -> BOUND)"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> BOUND"]

  - method: POST
    path: "/genset-packaging/service-contracts/{contractId}/activate"
    description: "Activate a bound contract once commissioning is ACCEPTED; sets PM due date and end date from the logical clock"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> ACTIVE; next_pm_due_date/end_date set"]

  - method: POST
    path: "/genset-packaging/service-contracts/{contractId}/cancel"
    description: "Cancel a quoted or bound contract"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/genset-packaging/service-contracts/{contractId}/lapse-check"
    description: "Advance ACTIVE contract to LAPSED (past PM due, within term) or EXPIRED (past end_date)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> LAPSED or EXPIRED per clock position"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint, or ownership check failed (CustomerContact accepting another account's commissioning)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, invalid enum member, empty readings array, non-positive hours/quantities, start_hour >= end_hour" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match the order's current version at sizing-study creation" }
  - { id: ERR_STALE_CRANE_SLOT_VERSION, http: 412, condition: "expected_crane_slot_version does not match the slot's current version at shipment booking" }
  - { id: ERR_INVALID_BUILD_STATE, http: 409, condition: "Order build_status does not allow this operation (e.g., shipment before READY_TO_SHIP, cancel after COMMISSIONED, verify before TESTING)" }
  - { id: ERR_INVALID_COMMERCIAL_STATE, http: 409, condition: "Order commercial_status does not allow this operation (e.g., configuration lock before AUTHORIZED)" }
  - { id: ERR_STUDY_STATE_INVALID, http: 409, condition: "SizingStudy not in the required from-state (e.g., approve a DRAFT study, submit an APPROVED study)" }
  - { id: ERR_CONFIG_STATE_INVALID, http: 409, condition: "PackageConfiguration not in the required from-state (e.g., permit submit before LOCKED, unlock a DRAFT configuration)" }
  - { id: ERR_PERMIT_STATE_INVALID, http: 409, condition: "PermitCase not in the required from-state (e.g., approve-ahj a DRAFT permit, unlock with a live SUBMITTED permit)" }
  - { id: ERR_CERT_STATE_INVALID, http: 409, condition: "EmissionsCertificate not in the required from-state (e.g., issue an APP_DRAFT application)" }
  - { id: ERR_SCHEME_STATE_INVALID, http: 409, condition: "ParallelingScheme not in the required from-state (e.g., program a VERIFIED scheme, add position while PROGRAMMED)" }
  - { id: ERR_TEST_STATE_INVALID, http: 409, condition: "FactoryTest not in the required from-state (e.g., record before start, accept a FAILED test)" }
  - { id: ERR_SHIPMENT_STATE_INVALID, http: 409, condition: "Shipment not in the required from-state (e.g., deliver before dispatch, release a DELIVERED shipment)" }
  - { id: ERR_EVENT_STATE_INVALID, http: 409, condition: "CommissioningEvent not in the required from-state (e.g., start before assign, accept before complete)" }
  - { id: ERR_CONTRACT_STATE_INVALID, http: 409, condition: "ServiceContract not in the required from-state (e.g., activate a QUOTED contract, bind an ACTIVE contract)" }
  - { id: ERR_EMISSIONS_TIER_INSUFFICIENT, http: 422, condition: "Engine tier rank below the locale-required tier rank at certificate issue" }
  - { id: ERR_HOUR_LOG_REQUIRED, http: 422, condition: "PRIME application certificate submitted without hour_log_attached" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "FactoryTest acceptor X-User-ID equals recorded_by_user_id" }
  - { id: ERR_CAPACITY_UNDERSIZED, http: 409, condition: "Engine (rated_kw/0.8) or alternator (rated_kva) below study required_kva at approve" }
  - { id: ERR_PARALLEL_CAPACITY_EXCEEDED, http: 409, condition: "Adding a position would exceed scheme max_units" }
  - { id: ERR_CRANE_WINDOW_OVERLAP, http: 409, condition: "Lift occupancy (including buffer) intersects an existing booking's occupancy or exceeds the slot window" }
  - { id: ERR_TEST_BAY_OVERLAP, http: 409, condition: "Requested half-open bay window intersects an existing test's window on the same bay/date" }
  - { id: ERR_ENGINEER_DAY_CAPACITY_EXCEEDED, http: 409, condition: "Engineer already has 2 active commissioning events on that service_date" }
  - { id: ERR_FUEL_RUNTIME_INSUFFICIENT, http: 422, condition: "runtime_hours below min_runtime_hours at configuration lock" }
  - { id: ERR_PERMIT_EXPIRED, http: 422, condition: "Resubmission attempted after expires_on" }
  - { id: ERR_PERMIT_NOT_EXPIRED, http: 422, condition: "expire-check while clock date <= expires_on" }
  - { id: ERR_SHIPMENT_DATE_NOT_REACHED, http: 422, condition: "Dispatch before the crane slot's service_date" }
  - { id: ERR_CONTRACT_NOT_LAPSABLE, http: 422, condition: "lapse-check while neither lapse nor expiry clock condition holds" }
  - { id: ERR_SIZING_NOT_APPROVED, http: 409, condition: "Operation requires an APPROVED sizing study (authorize, configuration lock)" }
  - { id: ERR_CERT_NOT_ISSUED, http: 409, condition: "Factory test creation requires an ISSUED emissions certificate for the order" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Commissioning creation/completion requires a DELIVERED shipment" }
  - { id: ERR_COMMISSIONING_NOT_ACCEPTED, http: 409, condition: "Contract activation requires an ACCEPTED commissioning event for the order" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Order authorization requires CustomerAccount.status == ACTIVE" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Authorization would push credit_utilized_cents above credit_limit_cents" }
  - { id: ERR_TRAINING_INCOMPLETE, http: 422, condition: "Commissioning completion requires checklist_completed == true and training_hours >= 2.0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Packager operations administrator; manages catalog/resources and simulates external authorities (AHJ, emissions authority); drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/customers"
      - "POST /genset-packaging/engine-models, POST /genset-packaging/alternator-models"
      - "POST /genset-packaging/test-bays, POST /genset-packaging/crane-slots"
      - "POST /genset-packaging/permit-cases/{id}/request-correction, approve-ahj, expire-check"
      - "POST /genset-packaging/emissions-certificates/{id}/issue, reject"
      - "POST /genset-packaging/service-contracts/{id}/lapse-check"
      - "POST /genset-packaging/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: SalesEngineer
    description: "Owns commercial lifecycle: order creation, authorization, cancellation; sizing approval; service contracts"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/orders, authorize, cancel"
      - "POST /genset-packaging/sizing-studies/{id}/approve, reject"
      - "POST /genset-packaging/service-contracts (create, bind, activate, cancel)"
    shared_operations:
      - "All GET endpoints"

  - name: ApplicationEngineer
    description: "Owns engineering definition: sizing studies, package configurations, paralleling schemes"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/sizing-studies (create, submit)"
      - "POST /genset-packaging/configurations (create, lock, unlock)"
      - "POST /genset-packaging/paralleling-schemes (create, positions, program, rework, verify)"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Owns regulatory artifacts: permit cases and emissions certificate applications; may NOT act as the AHJ/authority (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/permit-cases (create, submit, withdraw)"
      - "POST /genset-packaging/emissions-certificates (create, submit)"
    shared_operations:
      - "All GET endpoints"

  - name: TestEngineer
    description: "Owns factory testing; the recorder of a test may NOT accept that same test (segregation of duties enforced on X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/factory-tests (create, start, record, accept)"
    shared_operations:
      - "All GET endpoints"

  - name: LogisticsCoordinator
    description: "Owns freight/lift planning and site delivery"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/shipments (create, dispatch, deliver, release)"
    shared_operations:
      - "All GET endpoints"

  - name: FieldServiceManager
    description: "Owns startup commissioning and training delivery; assigns field engineers (opaque engineer ids)"
    identity: opaque
    exclusive_operations:
      - "POST /genset-packaging/commissioning-events (create, assign, start, complete)"
    shared_operations:
      - "All GET endpoints"

  - name: CustomerContact
    description: "External customer representative; accepts commissioning for their own account only"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /genset-packaging/commissioning-events/{id}/accept (only when X-User-ID == order.customer_id)"
    shared_operations:
      - "All GET endpoints"
