scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: copy_fee_certified_vs_informational_same_copy_count
        grounds:
          - calculations.certified_copy_fee
          - calculations.copy_eligibility
          - entities.CertifiedCopyRequest.fields.fee_total_cents
          - entities.CertifiedCopyRequest.fields.copy_class
        distinguishing_aspect: "Same CertifiedCopyRequest inputs (copy_count=3, expedite=false, STANDARD) yield 3100c under the CERTIFIED variant (confidential record) but 3000c under the INFORMATIONAL variant (record aged past 75y), a 100c divergence on the CertifiedCopyRequest domain."
        test_recipe:
          setup:
            - "A HOSPITAL facility and a REGISTERED BIRTH event (event_date 2026-02-25) in jurisdiction CTY-01."
            - "Two SUBMITTED->ID_VERIFIED copy requests R1,R2 on that event, both copy_count=3 expedite=false requester SELF category STANDARD."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Gen Hosp", facility_type: "HOSPITAL", jurisdiction_code: "CTY-01", npi: "NPI-001" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Roe", subject_first_name: "Baby", sex: "FEMALE", jurisdiction_code: "CTY-01", facility_id: "${fac}", place_of_event: "Gen Hosp" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Baby Roe", requester_relationship: "SELF", requester_category: "STANDARD", id_document_type: "DRIVERS_LICENSE", copy_count: 3, expedite: false }
              as: Applicant
              captures: { r1: "$.data.id" }
            - call: "POST /certified-copy-requests/${r1}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Baby Roe", requester_relationship: "SELF", requester_category: "STANDARD", id_document_type: "DRIVERS_LICENSE", copy_count: 3, expedite: false }
              as: Applicant
              captures: { r2: "$.data.id" }
            - call: "POST /certified-copy-requests/${r2}/verify-id"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v_a: "$.data.version" }
            - call: "POST /certified-copy-requests/${r1}/issue"
              payload: { expected_vital_event_version: "${ev_v_a}" }
              as: StateRegistrar
              captures: { r1_class: "$.data.copy_class", r1_fee: "$.data.fee_total_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2102-01-01T00:00:00Z" }
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v_b: "$.data.version" }
            - call: "POST /certified-copy-requests/${r2}/issue"
              payload: { expected_vital_event_version: "${ev_v_b}" }
              as: StateRegistrar
              captures: { r2_class: "$.data.copy_class", r2_fee: "$.data.fee_total_cents" }
          assert:
            - "CertifiedCopyRequest.${r1}.copy_class == CERTIFIED"
            - "CertifiedCopyRequest.${r1}.fee_total_cents == 3100"
            - "CertifiedCopyRequest.${r2}.copy_class == INFORMATIONAL"
            - "CertifiedCopyRequest.${r2}.fee_total_cents == 3000"

      - name: registration_fee_timely_vs_delayed_same_event_type
        grounds:
          - calculations.registration_delay_fee
          - entities.VitalEvent.fields.delayed_fee_cents
          - entities.VitalEvent.fields.registration_type
          - state_machines.VitalEvent.DRAFT_to_FILED
        distinguishing_aspect: "Two DEATH events (window=5) filed 5 vs 6 days after event_date produce delayed_fee_cents 0 (TIMELY variant) vs 2100 (DELAYED variant) on the VitalEvent domain — a different entity domain from the copy-fee dual variant."
        test_recipe:
          setup:
            - "A FUNERAL_HOME facility; two DRAFT DEATH events A and B, both event_date 2026-03-01, jurisdiction CTY-02."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Rest Home", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-02", npi: "NPI-002" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Doe", subject_first_name: "John", sex: "MALE", jurisdiction_code: "CTY-02", facility_id: "${fac}", place_of_event: "Home" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev_a: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Doe", subject_first_name: "Jane", sex: "FEMALE", jurisdiction_code: "CTY-02", facility_id: "${fac}", place_of_event: "Home" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev_b: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: StateRegistrar
            - call: "POST /vital-events/${ev_a}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { a_type: "$.data.registration_type", a_fee: "$.data.delayed_fee_cents", a_late: "$.data.days_late" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: StateRegistrar
            - call: "POST /vital-events/${ev_b}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { b_type: "$.data.registration_type", b_fee: "$.data.delayed_fee_cents", b_late: "$.data.days_late" }
          assert:
            - "VitalEvent.${ev_a}.days_late == 5"
            - "VitalEvent.${ev_a}.registration_type == TIMELY"
            - "VitalEvent.${ev_a}.delayed_fee_cents == 0"
            - "VitalEvent.${ev_b}.days_late == 6"
            - "VitalEvent.${ev_b}.registration_type == DELAYED"
            - "VitalEvent.${ev_b}.delayed_fee_cents == 2100"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copy_fee_tiered_expedite_category_branch
        grounds:
          - calculations.certified_copy_fee
          - entities.CertifiedCopyRequest.fields.fee_total_cents
        distinguishing_aspect: "Mode (a): certified_copy_fee combines >=3 interacting inputs (copy_count tiered base, expedite surcharge, requester_category branch) non-linearly — n=3 INDIGENT expedite=false gives round_half_up(3100*0.5)=1550c, not a linear per-copy price."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event (event_date 2026-02-25, confidential in 2026) in CTY-03; one ID_VERIFIED copy request copy_count=3 expedite=false requester SELF category INDIGENT."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H3", facility_type: "HOSPITAL", jurisdiction_code: "CTY-03", npi: "NPI-003" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Lee", subject_first_name: "Ann", sex: "FEMALE", jurisdiction_code: "CTY-03", facility_id: "${fac}", place_of_event: "H3" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Ann Lee", requester_relationship: "SELF", requester_category: "INDIGENT", id_document_type: "STATE_ID", copy_count: 3, expedite: false }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
              captures: { fee: "$.data.fee_total_cents", cls: "$.data.copy_class" }
          assert:
            - "CertifiedCopyRequest.${cc}.copy_class == CERTIFIED"
            - "CertifiedCopyRequest.${cc}.fee_total_cents == 1550"

      - name: state_remittance_round_per_txn_then_sum
        grounds:
          - calculations.state_remittance
          - entities.StatisticsReport.fields.state_remittance_cents
          - entities.StatisticsReport.fields.total_fees_collected_cents
        distinguishing_aspect: "Mode (b): two ISSUED copies of fee 1550 each remit round_half_up(1550*0.45)=698 per transaction summed to 1396c; summing raw (3100) then rounding gives 1395c — the pinned round-then-sum order changes the cent."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-07; two ID_VERIFIED INDIGENT copy_count=3 requests, both issued at clock 2026-03-05 (confidential -> CERTIFIED -> 1550c each)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H7", facility_type: "HOSPITAL", jurisdiction_code: "CTY-07", npi: "NPI-007" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Kim", subject_first_name: "Sam", sex: "MALE", jurisdiction_code: "CTY-07", facility_id: "${fac}", place_of_event: "H7" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Sam Kim", requester_relationship: "SELF", requester_category: "INDIGENT", id_document_type: "STATE_ID", copy_count: 3, expedite: false }
              as: Applicant
              captures: { c1: "$.data.id" }
            - call: "POST /certified-copy-requests/${c1}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v1: "$.data.version" }
            - call: "POST /certified-copy-requests/${c1}/issue"
              payload: { expected_vital_event_version: "${ev_v1}" }
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Sam Kim", requester_relationship: "SELF", requester_category: "INDIGENT", id_document_type: "STATE_ID", copy_count: 3, expedite: false }
              as: Applicant
              captures: { c2: "$.data.id" }
            - call: "POST /certified-copy-requests/${c2}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v2: "$.data.version" }
            - call: "POST /certified-copy-requests/${c2}/issue"
              payload: { expected_vital_event_version: "${ev_v2}" }
              as: StateRegistrar
          trigger:
            - call: "POST /statistics-reports"
              payload: { jurisdiction_code: "CTY-07", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: StateRegistrar
              captures: { rep: "$.data.id", rem: "$.data.state_remittance_cents", tot: "$.data.total_fees_collected_cents" }
          assert:
            - "StatisticsReport.${rep}.total_fees_collected_cents == 3100"
            - "StatisticsReport.${rep}.state_remittance_cents == 1396"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: amendment_reject_then_resubmit_cycle
        grounds:
          - state_machines.Amendment.SUBMITTED_to_REJECTED
          - state_machines.Amendment.REJECTED_to_SUBMITTED
          - entities.Amendment.fields.status
        distinguishing_aspect: "Amendment is cyclic: SUBMITTED->REJECTED->SUBMITTED, a revision loop no linear pipeline permits; the entity re-enters SUBMITTED after a REJECTED detour."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-04; a DEMOGRAPHIC Amendment in DRAFT targeting subject_last_name."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H4", facility_type: "HOSPITAL", jurisdiction_code: "CTY-04", npi: "NPI-004" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Ono", subject_first_name: "Yo", sex: "MALE", jurisdiction_code: "CTY-04", facility_id: "${fac}", place_of_event: "H4" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /amendments"
              payload: { vital_event_id: "${ev}", amendment_type: "DEMOGRAPHIC", field_name: "subject_last_name", new_value: "Ohno", reason: "typo" }
              as: StateRegistrar
              captures: { am: "$.data.id" }
            - call: "POST /amendments/${am}/submit"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /amendments/${am}/reject"
              payload: {}
              as: StateRegistrar
              captures: { s_reject: "$.data.status" }
            - call: "POST /amendments/${am}/submit"
              payload: {}
              as: StateRegistrar
              captures: { s_resub: "$.data.status" }
          assert:
            - "Amendment.${am}.status transitions REJECTED then back to SUBMITTED"
            - "Amendment.${am}.status == SUBMITTED"

      - name: paternity_acknowledge_then_rescind_branch
        grounds:
          - state_machines.PaternityAcknowledgment.DRAFT_to_ACKNOWLEDGED
          - state_machines.PaternityAcknowledgment.ACKNOWLEDGED_to_RESCINDED
          - entities.PaternityAcknowledgment.fields.status
          - entities.VitalEvent.fields.paternity_established
        distinguishing_aspect: "PaternityAcknowledgment branches from ACKNOWLEDGED to one of {RESCINDED, FINALIZED}; taking the RESCINDED fork reverses the father-field cascade — a different entity from the cyclic Amendment machine."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-05; a DRAFT PaternityAcknowledgment with mother_consent=true; clock at 2026-03-01."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H5", facility_type: "HOSPITAL", jurisdiction_code: "CTY-05", npi: "NPI-005" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Vale", subject_first_name: "Kid", sex: "MALE", jurisdiction_code: "CTY-05", facility_id: "${fac}", place_of_event: "H5" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /paternity-acknowledgments"
              payload: { vital_event_id: "${ev}", father_last_name: "Vale", father_first_name: "Max", mother_consent: true }
              as: Applicant
              captures: { pa: "$.data.id" }
            - call: "POST /paternity-acknowledgments/${pa}/acknowledge"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /paternity-acknowledgments/${pa}/rescind"
              payload: {}
              as: StateRegistrar
              captures: { s: "$.data.status" }
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { pe: "$.data.paternity_established" }
          assert:
            - "PaternityAcknowledgment.${pa}.status == RESCINDED"
            - "VitalEvent.${ev}.paternity_established == false"
            - "VitalEvent.${ev}.father_first_name == null"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: register_death_locks_cert_bumps_certifier_depth3
        grounds:
          - state_machines.VitalEvent.FILED_to_REGISTERED
          - state_machines.MedicalCertification.CERTIFIED_to_LOCKED
          - entities.Certifier.fields.locked_certification_count
          - entities.MedicalCertification.fields.status
        distinguishing_aspect: "Depth-3 chain from POST /vital-events/{id}/register: event->REGISTERED (link1) causes MedicalCertification CERTIFIED->LOCKED (link2) which causes Certifier.locked_certification_count 0->1 (link3); each link is caused by the prior, not by the register action directly."
        test_recipe:
          setup:
            - "A FUNERAL_HOME facility, a Certifier, a DEATH event (event_date 2026-03-01, clock default) FILED with a CERTIFIED MedicalCertification."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FH6", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-06", npi: "NPI-006" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /certifiers"
              payload: { name: "Dr Grey", certifier_type: "PHYSICIAN", license_number: "LIC-6", jurisdiction_code: "CTY-06" }
              as: StateRegistrar
              captures: { cer: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Poe", subject_first_name: "Ed", sex: "MALE", jurisdiction_code: "CTY-06", facility_id: "${fac}", place_of_event: "FH6" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /certifications"
              payload: { vital_event_id: "${ev}", certifier_id: "${cer}", cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalCertifier
              as_user_id: "${cer}"
              captures: { mc: "$.data.id" }
            - call: "POST /certifications/${mc}/certify"
              payload: {}
              as: MedicalCertifier
              as_user_id: "${cer}"
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
              captures: { ev_status: "$.data.status" }
            - call: "GET /certifications/${mc}"
              payload: {}
              as: StateRegistrar
              captures: { mc_status: "$.data.status" }
            - call: "GET /certifiers/${cer}"
              payload: {}
              as: StateRegistrar
              captures: { locked: "$.data.locked_certification_count" }
          assert:
            - "VitalEvent.${ev}.status == REGISTERED"
            - "MedicalCertification.${mc}.status == LOCKED"
            - "Certifier.${cer}.locked_certification_count == 1"

      - name: medical_amendment_cascades_cert_then_event_depth2
        grounds:
          - state_machines.Amendment.SUBMITTED_to_APPROVED
          - state_machines.MedicalCertification.LOCKED_to_AMENDED
          - entities.VitalEvent.fields.cause_of_death_amended
          - entities.MedicalCertification.fields.cause_of_death
        distinguishing_aspect: "Depth-2 chain from POST /amendments/{id}/approve (MEDICAL): amendment->APPROVED mutates MedicalCertification (LOCKED->AMENDED, cause_of_death:=new_value) (link1) which itself sets VitalEvent.cause_of_death_amended=true (link2) — a different trigger and propagation path than the register cascade."
        test_recipe:
          setup:
            - "A DEATH event REGISTERED with a LOCKED MedicalCertification (cause 'MI'); a MEDICAL Amendment SUBMITTED targeting cause_of_death -> 'Sepsis'."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FH8", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-08", npi: "NPI-008" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /certifiers"
              payload: { name: "Dr House", certifier_type: "MEDICAL_EXAMINER", license_number: "LIC-8", jurisdiction_code: "CTY-08" }
              as: StateRegistrar
              captures: { cer: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Fry", subject_first_name: "Al", sex: "MALE", jurisdiction_code: "CTY-08", facility_id: "${fac}", place_of_event: "FH8" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /certifications"
              payload: { vital_event_id: "${ev}", certifier_id: "${cer}", cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalCertifier
              as_user_id: "${cer}"
              captures: { mc: "$.data.id" }
            - call: "POST /certifications/${mc}/certify"
              payload: {}
              as: MedicalCertifier
              as_user_id: "${cer}"
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /amendments"
              payload: { vital_event_id: "${ev}", amendment_type: "MEDICAL", target_certification_id: "${mc}", field_name: "cause_of_death", new_value: "Sepsis", reason: "autopsy" }
              as: StateRegistrar
              captures: { am: "$.data.id" }
            - call: "POST /amendments/${am}/submit"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
            - call: "POST /amendments/${am}/approve"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
            - call: "GET /certifications/${mc}"
              payload: {}
              as: StateRegistrar
              captures: { mc_status: "$.data.status", mc_cause: "$.data.cause_of_death" }
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { coda: "$.data.cause_of_death_amended", ac: "$.data.amendment_count" }
          assert:
            - "MedicalCertification.${mc}.status == AMENDED"
            - "MedicalCertification.${mc}.cause_of_death == Sepsis"
            - "VitalEvent.${ev}.cause_of_death_amended == true"
            - "VitalEvent.${ev}.amendment_count == 1"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_event_not_registered_outprioritizes_not_eligible
        grounds:
          - validations[priority=13]
          - validations[priority=21]
          - errors[ERR_EVENT_NOT_REGISTERED]
          - errors[ERR_NOT_ELIGIBLE]
        distinguishing_aspect: "On issue, a FILED (unregistered) event AND an ineligible OTHER requester on a confidential record both fail; the state check (pri 13, ERR_EVENT_NOT_REGISTERED) wins over the business_referential check (pri 21, ERR_NOT_ELIGIBLE)."
        test_recipe:
          setup:
            - "A FILED (not registered) BIRTH event in CTY-13; an ID_VERIFIED copy request with requester_relationship OTHER (ineligible for a confidential record)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H13", facility_type: "HOSPITAL", jurisdiction_code: "CTY-13", npi: "NPI-013" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Ray", subject_first_name: "Sun", sex: "FEMALE", jurisdiction_code: "CTY-13", facility_id: "${fac}", place_of_event: "H13" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Nosy Neighbor", requester_relationship: "OTHER", id_document_type: "PASSPORT", copy_count: 1 }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_EVENT_NOT_REGISTERED"

      - name: register_certification_required_outprioritizes_delayed
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_CERTIFICATION_REQUIRED]
          - errors[ERR_DELAYED_REGISTRATION_REQUIRED]
        distinguishing_aspect: "Registering a late-filed DEATH event with neither a CERTIFIED certification nor an ACCEPTED packet fails both checks; business_safety (pri 15, ERR_CERTIFICATION_REQUIRED) wins over business_temporal (pri 16, ERR_DELAYED_REGISTRATION_REQUIRED) — a different category pair than instance one."
        test_recipe:
          setup:
            - "A DEATH event event_date 2026-02-20 FILED at clock 2026-03-01 (days_late 9 -> DELAYED), with no certification and no packet."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FH14", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-14", npi: "NPI-014" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-02-20T00:00:00Z", subject_last_name: "Cole", subject_first_name: "Ken", sex: "MALE", jurisdiction_code: "CTY-14", facility_id: "${fac}", place_of_event: "FH14" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_CERTIFICATION_REQUIRED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delay_fee_boundary_five_vs_six_days_on_file
        grounds:
          - calculations.registration_delay_fee
          - entities.VitalEvent.fields.days_late
          - state_machines.VitalEvent.DRAFT_to_FILED
        distinguishing_aspect: "Numeric threshold crossing on POST /vital-events/{id}/file: days_late == window(5) is TIMELY (fee 0); days_late == 6 crosses to DELAYED (fee 2100). The comparison is strict '>' window."
        test_recipe:
          setup:
            - "A FUNERAL_HOME facility; two DRAFT DEATH events event_date 2026-03-01 in CTY-15."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FH15", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-15", npi: "NPI-015" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Ash", subject_first_name: "One", sex: "MALE", jurisdiction_code: "CTY-15", facility_id: "${fac}", place_of_event: "FH15" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev_a: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Ash", subject_first_name: "Two", sex: "MALE", jurisdiction_code: "CTY-15", facility_id: "${fac}", place_of_event: "FH15" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev_b: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: StateRegistrar
            - call: "POST /vital-events/${ev_a}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { a_fee: "$.data.delayed_fee_cents", a_type: "$.data.registration_type" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: StateRegistrar
            - call: "POST /vital-events/${ev_b}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { b_fee: "$.data.delayed_fee_cents", b_type: "$.data.registration_type" }
          assert:
            - "VitalEvent.${ev_a}.days_late == 5"
            - "VitalEvent.${ev_a}.delayed_fee_cents == 0"
            - "VitalEvent.${ev_b}.days_late == 6"
            - "VitalEvent.${ev_b}.delayed_fee_cents == 2100"

      - name: copy_request_zero_count_rejected_on_create
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_COPY_COUNT]
          - entities.CertifiedCopyRequest.fields.copy_count
        distinguishing_aspect: "Zero-count edge on POST /certified-copy-requests: copy_count == 0 is rejected with ERR_INVALID_COPY_COUNT — a different metric (a count floor) reached through a different endpoint than the days-late threshold."
        test_recipe:
          setup:
            - "A HOSPITAL facility and a DRAFT BIRTH event in CTY-16 (copy-request create only needs the event to exist)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H16", facility_type: "HOSPITAL", jurisdiction_code: "CTY-16", npi: "NPI-016" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Zed", subject_first_name: "Ze", sex: "UNDETERMINED", jurisdiction_code: "CTY-16", facility_id: "${fac}", place_of_event: "H16" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
          trigger:
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Ze Zed", requester_relationship: "SELF", id_document_type: "STATE_ID", copy_count: 0 }
              as: Applicant
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_COPY_COUNT"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: death_register_blocked_when_certification_not_certified
        grounds:
          - state_machines.VitalEvent.FILED_to_REGISTERED
          - entities.MedicalCertification.fields.status
          - errors[ERR_CERTIFICATION_REQUIRED]
        distinguishing_aspect: "VitalEvent's FILED->REGISTERED depends on MedicalCertification.status == CERTIFIED; with the certification only PENDING, register is rejected with ERR_CERTIFICATION_REQUIRED (pair VitalEvent -> MedicalCertification)."
        test_recipe:
          setup:
            - "A DEATH event (event_date 2026-03-01) FILED timely, with a PENDING (not certified) MedicalCertification."
          setup_api_calls:
