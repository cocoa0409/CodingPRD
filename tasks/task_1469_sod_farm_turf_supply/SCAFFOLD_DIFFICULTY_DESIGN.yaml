  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_fleet_half_open_aggregate_overlap
        grounds:
          - calculations.zone_capacity_overlap
          - "endpoints.POST /truck-blocks"
        distinguishing_aspect: |
          Interval semantics = continuous half-open [start,end) with AGGREGATE
          capacity 4 per zone, resource = zone fleet. Partial overlap
          ([09:00,11:00) against four [08:00,10:00) blocks) counts against
          capacity, while exact adjacency ([10:00,12:00)) does not.
        test_recipe:
          setup:
            - "Zone 1: four TruckBlocks [2026-08-04T08:00, 10:00) created (capacity full)"
          setup_api_calls:
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T10:00:00Z", reason: "b1" }
              as: FleetManager
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T10:00:00Z", reason: "b2" }
              as: FleetManager
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T10:00:00Z", reason: "b3" }
              as: FleetManager
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T10:00:00Z", reason: "b4" }
              as: FleetManager
          trigger:
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T09:00:00Z", window_end: "2026-08-04T11:00:00Z", reason: "partial-overlap" }
              as: FleetManager
              captures: { err1: $.data.error_id }
            - call: "POST /truck-blocks"
              payload: { freight_zone: 1, window_start: "2026-08-04T10:00:00Z", window_end: "2026-08-04T12:00:00Z", reason: "adjacent" }
              as: FleetManager
              captures: { ok_id: $.data.id }
          assert:
            - "${err1} == ERR_CAPACITY_EXCEEDED  # partial overlap [09:00,11:00) collides"
            - "TruckBlock.${ok_id} created (201)  # adjacency [10:00,12:00) is not an overlap"

