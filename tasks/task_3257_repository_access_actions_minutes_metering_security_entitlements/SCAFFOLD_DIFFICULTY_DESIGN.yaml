              captures: { r2_billing: $.data.billing_status, r2_overage: $.data.overage_cost_cents }
          assert:
            - "r1_billing == ALLOWANCE_APPLIED   # billed 500 == remaining 500: boundary settles inside allowance"
            - "r1_overage == 0"
            - "r2_billing == BILLED   # remaining 0: entire 1 minute is overage"
            - "r2_overage == 1   # ceil(1 × 0.8)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: sso_enforcement_requires_all_orgs_active
        grounds:
          - state_machines.Enterprise.CONFIGURING_to_ENFORCED
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - errors[ERR_ORG_SUSPENDED_BLOCKS_SSO]
        distinguishing_aspect: |
          Enterprise.sso_enforcement's ENFORCE transition depends on the state
          of a different entity — every child Organization must be ACTIVE; one
          SUSPENDED org blocks enforcement (Enterprise ← Organization pair).
        test_recipe:
          setup:
            - "Enterprise with two Organizations; org2 is SUSPENDED; SSO in CONFIGURING"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 9 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org2", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org2_id: $.data.id }
            - call: "POST /organizations/${org2_id}/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "CONFIGURE" }
              as: EnterpriseAdmin
          trigger:
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "ENFORCE" }
              as: EnterpriseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORG_SUSPENDED_BLOCKS_SSO"
            - "Enterprise.${ent_id}.sso_enforcement == CONFIGURING   # unchanged"

      - name: runner_heartbeat_requires_org_active
        grounds:
          - state_machines.SelfHostedRunner.OFFLINE_to_ACTIVE
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - errors[ERR_ORG_NOT_ACTIVE]
        distinguishing_aspect: |
          SelfHostedRunner's OFFLINE → ACTIVE heartbeat transition depends on a
          different entity pair than the SSO case — the runner's owning
          Organization must be ACTIVE; a heartbeat against a SUSPENDED org's
          runner fails (Runner ← Organization pair).
        test_recipe:
          setup:
            - "Enterprise + Organization + runner heartbeated to ACTIVE, then org SUSPENDED (cascade forces runner OFFLINE)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /organizations/${org_id}/runners"
              payload: { name: "r1", os_type: "LINUX" }
              as: OrgAdmin
              captures: { runner_id: $.data.id }
            - call: "POST /runners/${runner_id}/heartbeat"
              payload: {}
              as: RunnerAgent
            - call: "POST /organizations/${org_id}/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
          trigger:
            - call: "POST /runners/${runner_id}/heartbeat"
              payload: {}
              as: RunnerAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORG_NOT_ACTIVE"
            - "SelfHostedRunner.${runner_id}.status == OFFLINE   # cascade set it; heartbeat could not revive it"

  - rule_id: resource_temporal_overlap
    instances:
      - name: artifact_retention_freeze_half_open_adjacency
        grounds:
          - calculations.storage_billing
          - validations[priority=12]
          - entities.Organization.fields.retention_freeze_windows
        distinguishing_aspect: |
          Interval semantics #1 (half-open interval-vs-interval): an artifact
          whose retention window [created_at, expires_at) ends exactly at a
          freeze window's start is ADJACENT, not overlapping, and is accepted;
          one ending one second into the freeze is rejected — resource is the
          StorageArtifact retention window.
        test_recipe:
          setup:
            - "Enterprise + Organization with retention_freeze_windows = [{start: 2026-10-01T00:00:00Z, end: 2026-10-08T00:00:00Z}]"
            - "Repository r1; clock at 2026-09-01T00:00:00Z"
            - "Artifact A: retention_days=30 → expires exactly at freeze start (2026-10-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM", retention_freeze_windows: [{ start: "2026-10-01T00:00:00Z", end: "2026-10-08T00:00:00Z" }] }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "POST /repositories/${repo_id}/artifacts"
              payload: { name: "adjacent-ok", size_mb: 100, retention_days: 30 }
              as: OrgAdmin
              captures: { art_a_status: $.data.status }
          trigger:
            - call: "POST /repositories/${repo_id}/artifacts"
              payload: { name: "overlap-bad", size_mb: 100, retention_days: 31 }
              as: OrgAdmin
              captures: { err: $.data.error_id }
          assert:
            - "art_a_status == RETAINED   # expires_at == freeze.start: half-open adjacency accepted"
            - "err == ERR_RETENTION_FREEZE_CONFLICT   # 31 days crosses one second into the freeze window"

      - name: invite_expiry_strict_deadline
        grounds:
          - state_machines.OutsideCollaborator.INVITED_to_EXPIRED
          - validations[priority=13]
          - entities.OutsideCollaborator.fields.invite_expires_at
        distinguishing_aspect: |
          Interval semantics #2 (instant-vs-deadline, strict inequality): an
          invite accepted one second before invite_expires_at succeeds, while
          acceptance at exactly invite_expires_at is rejected — a point-in-time
          deadline on the OutsideCollaborator resource, geometrically distinct
          from the artifact's interval-vs-interval half-open rule.
        test_recipe:
          setup:
            - "Enterprise (purchased_seats=5) + TEAM Organization + Repository + invited collaborator"
            - "invite created at clock 2026-09-01T00:00:00Z → invite_expires_at = 2026-09-08T00:00:00Z"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id }
            - call: "POST /users"
              payload: { login: "u1", email: "u1@x.com" }
              as: EnterpriseAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /users"
              payload: { login: "u2", email: "u2@x.com" }
              as: EnterpriseAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "POST /organizations/${org_id}/outside-collaborators"
              payload: { user_id: "${u1_id}", repository_id: "${repo_id}" }
              as: OrgAdmin
              captures: { collab1_id: $.data.id }
            - call: "POST /organizations/${org_id}/outside-collaborators"
              payload: { user_id: "${u2_id}", repository_id: "${repo_id}" }
              as: OrgAdmin
              captures: { collab2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T23:59:59Z" }
              as: EnterpriseAdmin
            - call: "POST /outside-collaborators/${collab1_id}/accept"
              payload: {}
              as: UserAccount
              as_user_id: "${u1_id}"
              captures: { c1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "POST /outside-collaborators/${collab2_id}/accept"
