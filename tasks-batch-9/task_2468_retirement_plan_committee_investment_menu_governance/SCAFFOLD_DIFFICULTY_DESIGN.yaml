            - "trigger step 7 shows Plan.${plan_id}.at_risk_slot_ratio == 0.0000 and menu_posture == OPEN, with the capacity triple unchanged at occupied 2 / reserved 0 / available 2 throughout — reopen touches at-risk state, never capacity"
            - "trigger step 8 shows FundReplacementProposal.${prop_id}.status restored to DRAFT with pre_block_status == null, because the posture relaxed all the way to OPEN"
            - "the ONLY non-restored fields are the ratchets: QuarterlyReview.${rev_id}.reopen_count is 1 (never 0 again) and Fund.${fund_lg_id}.last_scored_quarter_index stays 0, so a second finalize/reopen pair would take reopen_count to 2 and a third reopen would be refused with 409 ERR_REOPEN_LIMIT_REACHED at priority 76"
