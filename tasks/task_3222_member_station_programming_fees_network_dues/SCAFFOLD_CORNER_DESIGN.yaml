          - endpoints[POST /network/programming-fee-schedules]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Only PlatformAdmin may mint a programming fee schedule; the same request under the NetworkComplianceAuditor role is refused at the authorization gate."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026AC", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: NetworkComplianceAuditor
              captures: { neg_forbidden_role: "$.data.error_id" }
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026AD", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
