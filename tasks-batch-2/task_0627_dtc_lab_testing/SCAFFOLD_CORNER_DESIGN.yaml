# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# DTC Lab Testing. Breadth probe across the nine claim-extraction-guide
# sections. Every setup_api_calls chain is executable from empty-DB using only
# §1.5 endpoints; numeric asserts are pre-computed literals. excluded_because
# stubs cite a §1.8 instance by name and carry no test_recipe.
# Clock default: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_test_offering_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.TestOffering, endpoints]
        distinguishing_aspect: "POST /catalog/test-offerings with all required fields returns 201; status defaults ACTIVE, version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "CBC", display_name: "Complete Blood Count", list_price_cents: 5500, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { cbc: '$.data.id', cbc_status: '$.data.status', cbc_v: '$.data.version' }
          assert:
            - "TestOffering.${cbc}.status == ACTIVE"
            - "TestOffering.${cbc}.version == 1"
            - "TestOffering.${cbc}.list_price_cents == 5500"

      - name: get_offering_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.TestOffering", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /catalog/test-offerings/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /catalog/test-offerings/00000000-0000-4000-8000-000000000abc"
              as: CatalogAdmin
              captures: { err: '$.data.error_id' }
          assert: ["returns 404 ERR_NOT_FOUND"]

      - name: create_offering_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.TestOffering.fields.list_price_cents", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catalog/test-offerings omitting list_price_cents returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "NOPRICE", display_name: "No Price", specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { err: '$.data.error_id' }
          assert: ["returns 422 ERR_INVALID_REQUEST"]

      - name: create_offering_invalid_specimen_enum_returns_422
        claim_type: Type Constraints
        grounds: ["entities.TestOffering.fields.specimen_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "specimen_type outside {BLOOD,URINE,SALIVA} returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "BADTYPE", display_name: "Bad Type", list_price_cents: 1000, specimen_type: "TISSUE" }
              as: CatalogAdmin
              captures: { err: '$.data.error_id' }
          assert: ["returns 422 ERR_INVALID_REQUEST"]

      - name: duplicate_test_code_returns_409
        claim_type: Type Constraints
        grounds: ["entities.TestOffering.fields.test_code", "validations[priority=22]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Second ACTIVE offering with an existing test_code returns 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["Offering DUP @1000 exists."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "DUP", display_name: "Dup One", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "DUP", display_name: "Dup Two", list_price_cents: 2000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { err: '$.data.error_id' }
          assert: ["returns 409 ERR_DUPLICATE_CODE"]

      - name: offering_home_kit_eligible_defaults_false
        claim_type: Defaults
        grounds: [entities.TestOffering.fields.home_kit_eligible]
        distinguishing_aspect: "Omitting home_kit_eligible applies default false; omitting requires_fasting applies default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "DEF", display_name: "Default Flags", list_price_cents: 1000, specimen_type: "SALIVA" }
              as: CatalogAdmin
              captures: { def_id: '$.data.id', def_hk: '$.data.home_kit_eligible', def_fast: '$.data.requires_fasting' }
          assert:
            - "TestOffering.${def_id}.home_kit_eligible == false"
            - "TestOffering.${def_id}.requires_fasting == false"

      - name: archived_offering_still_queryable
        claim_type: Retrieval
        grounds: [entities.TestOffering.fields.status, endpoints]
        distinguishing_aspect: "After archive, GET /catalog/test-offerings/{id} still returns the offering with status ARCHIVED."
        test_recipe:
          setup: ["Offering ARC @1000 created then archived."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "ARC", display_name: "To Archive", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { arc: '$.data.id' }
            - call: "POST /catalog/test-offerings/${arc}/archive"
              as: CatalogAdmin
          trigger:
            - call: "GET /catalog/test-offerings/${arc}"
              as: CatalogAdmin
              captures: { arc_status: '$.data.status' }
          assert: ["TestOffering.${arc}.status == ARCHIVED"]

      - name: register_patient_duplicate_email_returns_409
        claim_type: Type Constraints
        grounds: ["entities.Patient.fields.email", "validations[priority=22]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Second patient with an existing email returns 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["Patient dup@x.com exists."]
          setup_api_calls:
            - call: "POST /catalog/patients"
              payload: { email: "dup@x.com", full_name: "Dup A", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/patients"
              payload: { email: "dup@x.com", full_name: "Dup B", date_of_birth: "1991-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { err: '$.data.error_id' }
          assert: ["returns 409 ERR_DUPLICATE_CODE"]

      - name: patient_hsa_and_consent_defaults
        claim_type: Defaults
        grounds: [entities.Patient.fields.hsa_balance_cents, entities.Patient.fields.consent_share_results]
        distinguishing_aspect: "Omitting hsa_balance_cents defaults 0; omitting consent_share_results defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog/patients"
              payload: { email: "defaults@x.com", full_name: "Defaults", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pd: '$.data.id', pd_hsa: '$.data.hsa_balance_cents', pd_consent: '$.data.consent_share_results' }
          assert:
            - "Patient.${pd}.hsa_balance_cents == 0"
            - "Patient.${pd}.consent_share_results == false"

      - name: cart_id_is_system_minted_uuid_no_prefix
        claim_type: System Fields
        grounds: [entities.Cart.fields.line_count, endpoints]
        distinguishing_aspect: "New cart line_count defaults 0, subtotal_cents 0, status OPEN, version 1; id is a plain UUID."
        test_recipe:
          setup: ["Patient PC exists."]
          setup_api_calls:
            - call: "POST /catalog/patients"
              payload: { email: "pc@x.com", full_name: "PC", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pc: '$.data.id' }
          trigger:
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pc}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pc}"
              captures: { cartc: '$.data.id', cartc_lc: '$.data.line_count', cartc_sub: '$.data.subtotal_cents', cartc_status: '$.data.status' }
          assert:
            - "Cart.${cartc}.line_count == 0"
            - "Cart.${cartc}.subtotal_cents == 0"
            - "Cart.${cartc}.status == OPEN"

      - name: cart_fund_source_defaults_card
        claim_type: Defaults
        grounds: [entities.Cart.fields.fund_source]
        distinguishing_aspect: "Omitting fund_source on cart create defaults CARD."
        test_recipe:
          setup: ["Patient PFD exists."]
          setup_api_calls:
            - call: "POST /catalog/patients"
              payload: { email: "pfd@x.com", full_name: "PFD", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pfd: '$.data.id' }
          trigger:
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pfd}" }
              as: Patient
              as_user_id: "${pfd}"
              captures: { cartfd: '$.data.id', cartfd_fs: '$.data.fund_source' }
          assert: ["Cart.${cartfd}.fund_source == CARD"]

  # ===========================================================================
  - section: state_machines
    instances:
      - name: physician_order_decision_on_terminal_approved_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.PhysicianOrder.SUBMITTED_to_APPROVED", "errors[ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE]"]
        distinguishing_aspect: "A second decision on an already-APPROVED PhysicianOrder returns 409 ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE; terminal lockdown."
        test_recipe:
          setup: ["PWN-restricted offering TSTC, patient PCA (CA adult), order placed, PhysicianOrder APPROVED."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "TSTC", display_name: "Restricted C", list_price_cents: 5000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_tstc: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "pca@x.com", full_name: "PCA", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pca: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pca}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pca}"
              captures: { cartca: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartca}", test_offering_id: "${off_tstc}" }
              as: Patient
              as_user_id: "${pca}"
            - call: "GET /catalog/carts/${cartca}"
              as: Patient
              as_user_id: "${pca}"
              captures: { cartca_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartca}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartca_v}" }
              as: Patient
              as_user_id: "${pca}"
              captures: { orderca: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderca}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${pca}"
            - call: "GET /catalog/order-lines?order_id=${orderca}"
              as: CatalogAdmin
              captures: { olca: '$.data[0].id' }
            - call: "GET /catalog/physician-orders?order_line_id=${olca}"
              as: OrderingPhysician
              captures: { poca: '$.data[0].id' }
            - call: "POST /catalog/physician-orders/${poca}/decision"
              payload: { decision: "APPROVE" }
              as: OrderingPhysician
          trigger:
            - call: "POST /catalog/physician-orders/${poca}/decision"
              payload: { decision: "DECLINE" }
              as: OrderingPhysician
              captures: { err: '$.data.error_id' }
          assert: ["returns 409 ERR_PHYSICIAN_ORDER_NOT_REVIEWABLE"]

      - name: resubmit_on_submitted_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.PhysicianOrder.NEEDS_MORE_INFO_to_SUBMITTED", "errors[ERR_PHYSICIAN_ORDER_NOT_RESUBMITTABLE]"]
        distinguishing_aspect: "Resubmit on a SUBMITTED (never NEEDS_MORE_INFO) PhysicianOrder returns 409 ERR_PHYSICIAN_ORDER_NOT_RESUBMITTABLE."
        test_recipe:
          setup: ["PWN-restricted offering TSTD, patient PCD, order placed, PhysicianOrder still SUBMITTED."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "TSTD", display_name: "Restricted D", list_price_cents: 5000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_tstd: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "pcd@x.com", full_name: "PCD", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pcd: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pcd}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pcd}"
              captures: { cartcd: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartcd}", test_offering_id: "${off_tstd}" }
              as: Patient
              as_user_id: "${pcd}"
            - call: "GET /catalog/carts/${cartcd}"
              as: Patient
              as_user_id: "${pcd}"
              captures: { cartcd_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartcd}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartcd_v}" }
              as: Patient
              as_user_id: "${pcd}"
              captures: { ordercd: '$.data.id' }
            - call: "GET /catalog/order-lines?order_id=${ordercd}"
              as: CatalogAdmin
              captures: { olcd: '$.data[0].id' }
            - call: "GET /catalog/physician-orders?order_line_id=${olcd}"
              as: OrderingPhysician
              captures: { pocd: '$.data[0].id' }
          trigger:
            - call: "POST /catalog/physician-orders/${pocd}/resubmit"
              payload: { clinical_note: "nope" }
              as: Patient
              as_user_id: "${pcd}"
              captures: { err: '$.data.error_id' }
          assert: ["returns 409 ERR_PHYSICIAN_ORDER_NOT_RESUBMITTABLE"]

      - name: critical_result_parks_pending_callback_then_release_blocked
        claim_type: Side Effect Execution
        grounds: ["state_machines.LabResult.PROCESSING_to_PENDING_CRITICAL_CALLBACK", "calculations.result_provisional_flag", "errors[ERR_CRITICAL_CALLBACK_REQUIRED]"]
        distinguishing_aspect: "Processing analyzer_value 500 for a test with critical_high 400 parks LabResult in PENDING_CRITICAL_CALLBACK; release before acknowledge returns 409 ERR_CRITICAL_CALLBACK_REQUIRED; after acknowledge it releases."
        test_recipe:
          setup: ["Offering CRT ref 70-100 critical_high 400 (consent true). HOME_KIT order, collected, processed analyzer_value 500 (CRITICAL)."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "CRT", display_name: "Crit Test", list_price_cents: 4000, specimen_type: "BLOOD", ref_low: 70, ref_high: 100, critical_high: 400 }
              as: CatalogAdmin
              captures: { off_crt: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "pcrit@x.com", full_name: "P Crit", date_of_birth: "1990-01-01", state_code: "CA", consent_share_results: true }
              as: CatalogAdmin
              captures: { pcrit: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pcrit}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pcrit}"
              captures: { cartcrit: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartcrit}", test_offering_id: "${off_crt}" }
              as: Patient
              as_user_id: "${pcrit}"
            - call: "GET /catalog/carts/${cartcrit}"
              as: Patient
              as_user_id: "${pcrit}"
              captures: { cartcrit_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartcrit}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartcrit_v}" }
              as: Patient
              as_user_id: "${pcrit}"
              captures: { ordercrit: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${ordercrit}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${pcrit}"
            - call: "GET /catalog/order-lines?order_id=${ordercrit}"
              as: CatalogAdmin
              captures: { olcrit: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olcrit}/collect"
              as: PhlebotomyTech
              captures: { speccrit: '$.data.id' }
            - call: "POST /catalog/specimens/${speccrit}/process"
              payload: { analyzer_value: 500 }
              as: LabTech
              captures: { rescrit: '$.data.id', rescrit_prov: '$.data.provisional_flag', rescrit_status: '$.data.status' }
          trigger:
            - call: "POST /catalog/lab-results/${rescrit}/release"
              as: LabTech
              captures: { err: '$.data.error_id' }
            - call: "POST /catalog/lab-results/${rescrit}/acknowledge-critical"
              as: LabTech
            - call: "POST /catalog/lab-results/${rescrit}/release"
              as: LabTech
              captures: { rescrit_final: '$.data.final_flag', rescrit_status2: '$.data.status' }
          assert:
            - "LabResult.${rescrit}.provisional_flag == CRITICAL"
            - "release before acknowledge returns 409 ERR_CRITICAL_CALLBACK_REQUIRED"
            - "LabResult.${rescrit}.status == RELEASED after acknowledge+release"
            - "LabResult.${rescrit}.final_flag == CRITICAL"

      - name: specimen_reject_excludes_line_from_invoice
        claim_type: Side Effect Execution
        grounds: [state_machines.OrderLine.COLLECTED_to_REJECTED, calculations.order_final_invoiced_total, entities.Order.fields.invoiced_total_cents]
        distinguishing_aspect: "Rejecting a collected specimen marks the line REJECTED and excludes it from invoiced_total_cents (stays 0 for a single-line order)."
        test_recipe:
          setup: ["Offering RJ @4000. Patient PRJ. HOME_KIT order, collected, specimen still COLLECTED."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "RJ", display_name: "Reject Test", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_rj: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "prj@x.com", full_name: "PRJ", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { prj: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${prj}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${prj}"
              captures: { cartrj: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartrj}", test_offering_id: "${off_rj}" }
              as: Patient
              as_user_id: "${prj}"
            - call: "GET /catalog/carts/${cartrj}"
              as: Patient
              as_user_id: "${prj}"
              captures: { cartrj_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartrj}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartrj_v}" }
              as: Patient
              as_user_id: "${prj}"
              captures: { orderrj: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderrj}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${prj}"
            - call: "GET /catalog/order-lines?order_id=${orderrj}"
              as: CatalogAdmin
              captures: { olrj: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olrj}/collect"
              as: PhlebotomyTech
              captures: { specrj: '$.data.id' }
          trigger:
            - call: "POST /catalog/specimens/${specrj}/reject"
              as: LabTech
            - call: "GET /catalog/order-lines/${olrj}"
              as: CatalogAdmin
              captures: { olrj_status: '$.data.status' }
            - call: "GET /catalog/orders/${orderrj}"
              as: CatalogAdmin
              captures: { orderrj_inv: '$.data.invoiced_total_cents' }
          assert:
            - "OrderLine.${olrj}.status == REJECTED"
            - "Order.${orderrj}.invoiced_total_cents == 0"

      - name: amend_released_result_recomputes_flags
        claim_type: Valid Transition
        grounds: ["state_machines.LabResult.RELEASED_to_AMENDED", "calculations.result_final_flag", "errors[ERR_RESULT_NOT_AMENDABLE]"]
        distinguishing_aspect: "Amending a RELEASED result with a new analyzer_value transitions to AMENDED and recomputes provisional_flag; amend on a non-RELEASED result returns 409 ERR_RESULT_NOT_AMENDABLE."
        test_recipe:
          setup: ["Offering AM ref 70-100. Patient PAM consent true. HOME_KIT order collected/processed value 80 (NORMAL) released."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "AM", display_name: "Amend Test", list_price_cents: 4000, specimen_type: "BLOOD", ref_low: 70, ref_high: 100 }
              as: CatalogAdmin
              captures: { off_am: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "pam@x.com", full_name: "PAM", date_of_birth: "1990-01-01", state_code: "CA", consent_share_results: true }
              as: CatalogAdmin
              captures: { pam: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pam}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pam}"
              captures: { cartam: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartam}", test_offering_id: "${off_am}" }
              as: Patient
              as_user_id: "${pam}"
            - call: "GET /catalog/carts/${cartam}"
              as: Patient
              as_user_id: "${pam}"
              captures: { cartam_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartam}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartam_v}" }
              as: Patient
              as_user_id: "${pam}"
              captures: { orderam: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderam}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${pam}"
            - call: "GET /catalog/order-lines?order_id=${orderam}"
              as: CatalogAdmin
              captures: { olam: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olam}/collect"
              as: PhlebotomyTech
              captures: { specam: '$.data.id' }
            - call: "POST /catalog/specimens/${specam}/process"
              payload: { analyzer_value: 80 }
              as: LabTech
              captures: { resam: '$.data.id' }
            - call: "POST /catalog/lab-results/${resam}/release"
              as: LabTech
          trigger:
            - call: "POST /catalog/lab-results/${resam}/amend"
              payload: { analyzer_value: 120 }
              as: LabTech
              captures: { resam_status: '$.data.status', resam_prov2: '$.data.provisional_flag' }
          assert:
            - "LabResult.${resam}.status == AMENDED"
            - "LabResult.${resam}.provisional_flag == ABNORMAL"

      - name: cancel_order_with_resulted_line_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.fulfillment_status=PARTIALLY_RESULTED_to_fulfillment_status=COMPLETED", "errors[ERR_ORDER_HAS_RESULTED_LINES]"]
        distinguishing_aspect: "Cancelling an order that already has a RESULTED line returns 409 ERR_ORDER_HAS_RESULTED_LINES."
        test_recipe:
