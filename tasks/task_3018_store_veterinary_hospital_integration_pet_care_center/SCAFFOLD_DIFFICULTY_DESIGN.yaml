              as: VeterinaryStaff
              captures: { auth_j_id: $.data.id, auth_j_v: $.data.version }
            - call: "POST /stores/${store_j_id}/veterinary-encounters/${encounter_j_id}/check-in"
              payload: { expected_encounter_version: "${encounter_j_v}" }
              as: VeterinaryStaff
              captures: { encounter_j_v2: $.data.version }
            - call: "POST /stores/${store_j_id}/veterinary-encounters/${encounter_j_id}/start-exam"
