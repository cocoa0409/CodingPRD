  - name: endpoint_action_terminate_contract_cascades_listed_assignments
    claim_type: Action endpoint
    grounds:
    - state_machines.LeaseContract.ACTIVE_to_TERMINATED
    - state_machines.CarAssignment.ACTIVE_to_COMPLETED
    - entities.LeaseFleetCar.fields.status
    - POST /api/v1/lease-contracts/{id}/terminate
    distinguishing_aspect: 'POST /lease-contracts/{id}/terminate fires ACTIVE -> TERMINATED and its declared
      cascade lands only when the body enumerates the live placement: the same call with an empty body
      is rejected 409 ERR_INVALID_STATE with the contract left ACTIVE, while the call carrying cascade_assignment_ids
      closes the placement to COMPLETED and returns its car to HELD.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-C3 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-C3) with
        one WHEELSET WS-C3 row at qty_per_car 1; 100 units on hand via a received ComponentReceipt.
      - A RETAINED order of 1 car completes on 2026-09-12 into HELD car K; lessee "Cascade Rail Co" holds
        ACTIVE contract LC-C3 (FULL_SERVICE, per_diem_rate_cents 1000, liability_bearer LESSOR, term 2026-09-01..2027-09-01,
        fleet_car_cap 5).
      - Placement AS-C3 on car K is ACTIVE, so the contract has one live assignment that the terminate
        body must enumerate.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-C3
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-C3
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-C3
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/lessees
        payload:
          legal_name: Cascade Rail Co
          credit_tier: B
          utilization_threshold_pct: 0
          credit_ceiling_cents: 1000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 1000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2027-09-01'
          fleet_car_cap: 5
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_status: $.data.status
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/LINE-C3-1/changeover
        payload:
          production_order_id: ${po_id}
          scheduled_start_date: '2026-09-11'
          scheduled_end_date: '2026-09-12'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-12'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          car_id: $.data[0].id
          car_status: $.data[0].status
      - call: POST /api/v1/car-assignments
        payload:
          lease_fleet_car_id: ${car_id}
          lease_contract_id: ${lc_id}
          lessee_id: ${lessee_id}
          start_date: '2026-09-01'
          end_date: '2026-10-01'
          mileage_allowance: 1000
        as: LeaseAdministrator
        captures:
          asg_id: $.data.id
          asg_status: $.data.status
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/terminate
        payload: {}
        as: LeaseAdministrator
        captures:
          err_uncascaded: $.data.error_id
      - call: GET /api/v1/lease-contracts/${lc_id}
        payload: {}
        as: PlatformAdmin
        captures:
          lc_after_reject: $.data.status
      - call: POST /api/v1/lease-contracts/${lc_id}/terminate
        payload:
          cascade_assignment_ids:
          - ${asg_id}
        as: LeaseAdministrator
        captures:
          lc_final: $.data.status
          lc_version: $.data.version
      - call: GET /api/v1/car-assignments/${asg_id}
        payload: {}
        as: PlatformAdmin
        captures:
          asg_after: $.data.status
      - call: GET /api/v1/lease-fleet-cars/${car_id}
        payload: {}
        as: PlatformAdmin
        captures:
          car_after: $.data.status
      assert:
      - 'The contract was ACTIVE and the placement live before the call: data.status == ${lc_status} ==
        "ACTIVE", CarAssignment.${asg_id}.status == ${asg_status} == "ACTIVE", LeaseFleetCar.${car_id}.status
        == ${car_status} == "ASSIGNED"'
      - 'The un-enumerated terminate is rejected: HTTP 409 with data.error_id == ${err_uncascaded} ==
        "ERR_INVALID_STATE"'
      - 'The rejection is atomic: GET /lease-contracts/${lc_id} still reports status == ${lc_after_reject}
        == "ACTIVE"'
      - The enumerated terminate returns HTTP 200 with data.status == ${lc_final} == "TERMINATED"
      - 'The cascade side effect landed on the placement: CarAssignment.${asg_id}.status == ${asg_after}
        == "COMPLETED"'
      - 'The cascade side effect landed on the car: LeaseFleetCar.${car_id}.status == ${car_after} ==
        "HELD", i.e. the car was returned to the fleet'
      - data.version == ${lc_version} == 3 (create 1 -> activate 2 -> terminate 3)
  - name: endpoint_action_receive_books_stock_and_closes_purchase_order
    claim_type: Action endpoint
    grounds:
    - state_machines.ComponentPurchaseOrder.CONFIRMED_to_RECEIVED
    - entities.Component.fields.on_hand_qty
    - calculations.component_allocation
    - POST /api/v1/component-receipts/{id}/receive
    distinguishing_aspect: 'POST /component-receipts/{id}/receive fires the purchase order CONFIRMED ->
      RECEIVED and its declared side effect lands on the component: on_hand_qty rises from 0 to exactly
      500 == qty_received, whereas merely booking the receipt left it at 0.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - 'Component WS-R1 (WHEELSET, unit_cost_cents 100000, lead_time_days 20) starts at on_hand_qty 0
        because §1.1 makes the field source: system.'
      - Purchase order PO-R1 for 500 units is placed on 2026-09-01 with expected_receipt_date 2026-09-21
        and then CONFIRMED; the ComponentReceipt for the full 500 units is booked against it but not yet
        applied.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/components
        payload:
          part_number: WS-R1
          component_class: WHEELSET
          unit_cost_cents: 100000
          lead_time_days: 20
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
          ws_on_hand0: $.data.on_hand_qty
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 500
          unit_cost_cents: 100000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
        captures:
          po_id: $.data.id
          po_status0: $.data.status
          po_version0: $.data.version
      - call: POST /api/v1/component-purchase-orders/${po_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
        captures:
          po_confirmed: $.data.status
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_id}
          component_id: ${ws_id}
          qty_received: 500
          receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
        captures:
          rc_id: $.data.id
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          ws_on_hand_booked: $.data.on_hand_qty
      trigger:
      - call: POST /api/v1/component-receipts/${rc_id}/receive
        payload: {}
        as: SupplyChainCoordinator
        captures:
          rc_id_out: $.data.id
          rc_qty: $.data.qty_received
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          ws_on_hand_after: $.data.on_hand_qty
      - call: GET /api/v1/component-purchase-orders/${po_id}
        payload: {}
        as: PlatformAdmin
        captures:
          po_status_after: $.data.status
          po_version_after: $.data.version
      assert:
      - The purchase order started PLACED at version ${po_version0} == 1 and was confirmed to ${po_confirmed}
        == "CONFIRMED"
      - 'Booking the receipt moved no stock: Component.${ws_id}.on_hand_qty == ${ws_on_hand_booked} ==
        ${ws_on_hand0} == 0'
      - POST /api/v1/component-receipts/${rc_id}/receive returns HTTP 200 for the booked receipt, data.qty_received
        == ${rc_qty} == 500
      - 'The declared stock side effect landed: Component.${ws_id}.on_hand_qty == ${ws_on_hand_after}
        == 500, i.e. exactly qty_received'
      - 'The parent purchase order advanced on the same call: status == ${po_status_after} == "RECEIVED"
        with version == ${po_version_after} == 3 (create 1 -> confirm 2 -> receive 3)'
      - reserved_qty stays 0 for this component, since component_allocation counts only RELEASED production
        orders and no order references WS-R1
