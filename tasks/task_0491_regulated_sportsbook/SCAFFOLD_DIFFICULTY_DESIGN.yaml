  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_refund_conserves_total_account_value
        grounds:
          - state_machines.Bet.PLACED_to_VOIDED
          - state_machines.Event.SCHEDULED_to_VOIDED
          - entities.Account.fields.cash_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = cash_balance_cents: STAKE debit (-5000) on
          placement paired with the VOID_REFUND credit (+5000) on event void
          leaves cash_balance_cents EXACTLY equal to the pre-bet balance (100000),
          with the ledger summing to zero net across the pair.
        test_recipe:
          setup:
            - "Verified/active Bettor, cash 100000, eligible geo, market OPEN."
            - "SINGLE stake 5000 placed (cash now 95000), then event VOIDED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "ci1@x.com", full_name: "Void Refund", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 5000, legs: [{ selection_id: "${sel}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet: $.data.id }
          trigger:
            - call: "POST /events/${ev}/status"
              payload: { to: "VOIDED" }
              as: TradingOps
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { bal: $.data.cash_balance_cents }
            - call: "GET /bets/${bet}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { betst: $.data.status, payout: $.data.actual_payout_cents }
          assert:
            - "Account.${acct}.cash_balance_cents == 100000 (STAKE -5000 + VOID_REFUND +5000 conserves cash)"
            - "Bet.${bet}.status == VOIDED"
            - "Bet.${bet}.actual_payout_cents == 5000"

      - name: bonus_completion_conserves_total_bankroll_across_buckets
        grounds:
          - state_machines.BonusGrant.ACTIVE_to_COMPLETED
          - entities.Account.fields.bonus_balance_cents
          - entities.Account.fields.cash_balance_cents
          - calculations.wr_qualifying_contribution
        distinguishing_aspect: |
          Different conserved quantity = total bankroll (cash_balance_cents +
          bonus_balance_cents): on bonus completion the remaining BONUS balance
          is debited and an equal CASH credit posted, so the SUM of the two
          buckets is unchanged across the conversion (the BONUS→CASH transfer is
          value-preserving), unlike the cash-only conservation above.
        test_recipe:
          setup:
            - "Verified/active Bettor, deposited 100000 cash, claimed bonus 2000 (BC10 mult 5 → target 10000), eligible geo."
            - "A SINGLE stake 10000 @+200 bound to the grant placed then settled LOST so wagering_progress reaches 10000 and the grant COMPLETES."
          setup_api_calls:
            - call: "POST /promotions"
              payload: { code: "BC10", bonus_cents: 2000, wagering_multiplier: 5, min_odds_american: -200, max_claims: 10 }
              as: TradingOps
              captures: { promo: $.data.id }
            - call: "POST /accounts"
              payload: { email: "ci2@x.com", full_name: "Bonus Conv", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
