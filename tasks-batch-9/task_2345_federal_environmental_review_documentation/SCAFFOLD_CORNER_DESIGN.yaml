  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_adopt_with_stale_expected_action_version_is_rejected
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.pn-adopt-stale-action, errors.ERR_STALE_ACTION_VERSION]
        distinguishing_aspect: "The version observed before the first adoption is no longer valid after it: replaying that same expected_action_version on a second statement returns ERR_STALE_ACTION_VERSION (412), and the re-read version makes the identical call succeed."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED with an OPEN public scoping period."
            - "Statement v1 was adopted using the version read before the adoption; statement v2 is DRAFT."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - call: "POST /proposed-actions/${act_id}/purpose-need-statements"
              payload: { purpose_text: "Reduce hazardous fuel loading and restore stand structure", need_text: "Revised fire behaviour modelling widens the treatment need", goal_codes: ["ACCESS", "SAFETY"] }
              as: NepaCoordinator
              captures: { pn2b_id: $.data.id }
          trigger:
            - call: "POST /purpose-need-statements/${pn2b_id}/adopt"
              payload: { expected_action_version: "${act_v}" }
              as: ReviewingOfficial
            - call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { act_v_fresh: $.data.version }
            - call: "POST /purpose-need-statements/${pn2b_id}/adopt"
              payload: { expected_action_version: "${act_v_fresh}" }
              as: ReviewingOfficial
          assert:
            - "The stale adopt returns 412 with data.error_id == ERR_STALE_ACTION_VERSION"
            - "After the refused call PurposeNeedStatement.${pn2b_id}.status is still DRAFT and ${pn1_id} is still ADOPTED"
            - "${act_v_fresh} equals ${act_v} plus 1 because only the first adoption advanced the version"
            - "The retried adopt returns 200 with ${pn2b_id} ADOPTED and ${pn1_id} SUPERSEDED"
            - "ProposedAction.${act_id}.record_entry_count counts exactly two PN_ADOPTED entries"

