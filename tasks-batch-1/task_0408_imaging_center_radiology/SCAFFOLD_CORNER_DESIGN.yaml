# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Imaging Center & Radiology Workflow (RIS/PACS) — breadth probe
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_imaging_center_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.ImagingCenter, endpoints]
        distinguishing_aspect: "POST /imaging-centers with only name -> 201; posture OPEN, repeat_reject_rate_pct 0.0, critical_ack_sla_minutes 60, repeat_rate_threshold_pct 8.0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id, ver: $.data.version }
          assert:
            - "HTTP 201; ImagingCenter.${c_id}.posture == OPEN"
            - "ImagingCenter.${c_id}.critical_ack_sla_minutes == 60 AND repeat_rate_threshold_pct == 8.0"
            - "ImagingCenter.${c_id}.repeat_reject_rate_pct == 0.0 AND version == 1"

      - name: create_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ImagingOrder, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST imaging-orders without modality_id -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Center exists."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: create_order_defaults_priority_routine_requires_contrast_false
        claim_type: Defaults
        grounds: [entities.ImagingOrder.fields.priority, entities.ImagingOrder.fields.requires_contrast]
        distinguishing_aspect: "Omitting priority and requires_contrast -> priority ROUTINE, requires_contrast false."
        test_recipe:
          setup: ["Center with one XRAY modality."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0 }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
          trigger:
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
          assert:
            - "ImagingOrder.${ord_id}.priority == ROUTINE AND requires_contrast == false AND status == REQUESTED"

      - name: modality_requires_contrast_screening_computed_from_type
        claim_type: Computed Fields
        grounds: [entities.Modality.fields.requires_contrast_screening]
        distinguishing_aspect: "MRI/CT modalities compute requires_contrast_screening true; XRAY/US compute false; input value (if any) ignored."
        test_recipe:
          setup: ["Center exists."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "MRI", name: "MRI", base_rvu: 2.0 }
              as: CenterAdmin
              captures: { mri_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "US", name: "US", base_rvu: 1.0 }
              as: CenterAdmin
              captures: { us_id: $.data.id }
          assert:
            - "Modality.${mri_id}.requires_contrast_screening == true"
            - "Modality.${us_id}.requires_contrast_screening == false"

      - name: create_staff_empty_credentials_returns_error
        claim_type: Type Constraints
        grounds: [entities.Staff.fields.credentialed_modalities, "validations[priority=6]", "errors[ERR_EMPTY_CREDENTIALS]"]
        distinguishing_aspect: "POST staff with credentialed_modalities [] -> ERR_EMPTY_CREDENTIALS (422)."
        test_recipe:
          setup: ["Center exists."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: [] }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_EMPTY_CREDENTIALS"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ImagingOrder, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /imaging-orders/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /imaging-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"

      - name: create_order_unknown_modality_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.ImagingOrder.fields.modality_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST order with non-existent modality_id -> ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Center exists, no modality."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "00000000-0000-4000-8000-000000000001", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_REFERENCE_NOT_FOUND"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.ImagingCenter.fields.now_utc, entities.ImagingCenter.fields.posture]
        distinguishing_aspect: "Client-supplied id/posture/now_utc on POST /imaging-centers are ignored; server mints id, posture OPEN, now_utc 1970-01-01T00:00:00.000Z."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
          assert:
            - "ImagingCenter.${c_id}.now_utc == 1970-01-01T00:00:00.000Z AND posture == OPEN"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: benefit_check_from_screen_cleared_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ImagingOrder.REQUESTED_to_BENEFIT_CHECKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "benefit-check on an order already SCREEN_CLEARED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["XRAY order driven to SCREEN_CLEARED (requires_prior_auth false)."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "00000000-0000-4000-8000-000000000099"
          trigger:
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"

      - name: cancel_already_cancelled_order_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ImagingOrder.REQUESTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on a CANCELLED order -> ERR_INVALID_STATE (409); terminal state has no outgoing transitions."
        test_recipe:
          setup: ["An order cancelled from REQUESTED."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/cancel"
              payload: {}
              as: SchedulingClerk
          trigger:
            - call: "POST /imaging-orders/${ord_id}/cancel"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"

      - name: cancel_order_cascade_cancels_booked_exam
        claim_type: Cascade down
        grounds: [state_machines.ImagingOrder.REQUESTED_to_CANCELLED, state_machines.ImagingExam.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED order cascade-cancels its BOOKED exam (exam -> CANCELLED), releasing room+tech intervals."
        test_recipe:
          setup: ["XRAY order at SCHEDULED with a BOOKED exam."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T08:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${xr_id}", name: "XR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { ov: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ov}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id }
          trigger:
            - call: "POST /imaging-orders/${ord_id}/cancel"
              payload: {}
              as: SchedulingClerk
          assert:
            - "ImagingOrder.${ord_id}.status == CANCELLED"
            - "ImagingExam.${exam_id}.status == CANCELLED"

      - name: finish_acquisition_initial_state_and_bubble_up
        claim_type: Bubble up
        grounds: [state_machines.ImagingExam.ACQUIRING_to_ACQUIRED, state_machines.ImagingOrder.SCHEDULED_to_READ_PENDING]
        distinguishing_aspect: "finish-acquisition on an ACQUIRING exam with one ACCEPTED series bubbles the parent order SCHEDULED -> READ_PENDING and stamps acquired_at_utc."
        test_recipe:
          setup: ["XRAY exam ACQUIRING with one ACCEPTED series; center now 09:00."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${xr_id}", name: "XR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { ov: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ov}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "PA" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_id: $.data.id }
            - call: "POST /image-series/${ser_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /imaging-exams/${exam_id}/finish-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
          assert:
            - "ImagingExam.${exam_id}.status == ACQUIRED AND acquired_at_utc == 2026-06-01T09:00:00.000Z"
            - "ImagingOrder.${ord_id}.status == READ_PENDING"

      - name: finish_acquisition_no_accepted_series_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ImagingExam.ACQUIRING_to_ACQUIRED, "errors[ERR_NO_ACCEPTED_SERIES]"]
        distinguishing_aspect: "finish-acquisition with only a REJECTED series (zero ACCEPTED) -> ERR_NO_ACCEPTED_SERIES (409)."
        test_recipe:
          setup: ["XRAY exam ACQUIRING with one REJECTED series, no ACCEPTED, none CAPTURING."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 200.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${xr_id}", name: "XR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { ov: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ov}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "BAD" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_id: $.data.id }
            - call: "POST /image-series/${ser_id}/finalize"
              payload: { outcome: "REJECTED", reject_reason: "ARTIFACT" }
              as: Technologist
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /imaging-exams/${exam_id}/finish-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_NO_ACCEPTED_SERIES"

      - name: finish_acquisition_series_still_capturing_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ImagingExam.ACQUIRING_to_ACQUIRED, "errors[ERR_SERIES_STILL_CAPTURING]"]
        distinguishing_aspect: "finish-acquisition while one series is still CAPTURING (even with an ACCEPTED present) -> ERR_SERIES_STILL_CAPTURING (409)."
        test_recipe:
          setup: ["XRAY exam ACQUIRING with one ACCEPTED series and one still CAPTURING."]
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 200.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${xr_id}", name: "XR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1" }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { ov: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ov}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "OK" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_ok_id: $.data.id }
            - call: "POST /image-series/${ser_ok_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "PENDING" }
