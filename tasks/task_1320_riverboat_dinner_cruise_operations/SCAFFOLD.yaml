# =============================================================================
# Task 1320 — Riverboat & Dinner Cruise Operations — Scaffold Seed Tables
# =============================================================================

scenario: |
  Riverboat & Dinner Cruise Operations (riverboat dinner cruise line): cruise inventory (date/time/menu tier) & booking, boarding manifest & Coast Guard passenger count, galley provisioning to reservation counts, entertainment & private-charter conversion, weather cancellation policy & credit, dock scheduling & shore-side parking, alcohol service compliance & staff certification, seasonal pricing & holiday premium

domain_name: riverboat-dinner-cruise
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vessel display name" }
      - { name: coast_guard_capacity, type: integer, source: input, description: "Certified maximum passenger count per USCG Certificate of Inspection; hard upper bound for boarding" }
      - { name: home_dock_id, type: string, source: input, description: "FK -> Dock.id; vessel's home berth used for dock-slot conflict checks" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OUT_OF_SERVICE — OUT_OF_SERVICE vessels reject new cruise scheduling" }

  - name: Dock
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dock name" }
      - { name: parking_capacity, type: integer, source: input, description: "Shore-side parking stall count attached to this dock" }
      - { name: parking_in_use, type: integer, source: computed, default: 0, description: "Count of ParkingPass rows with status IN {RESERVED, REDEEMED} linked to this dock" }

  - name: MenuTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "STANDARD | PREMIUM | LUXE" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-person base ticket price before discounts, seasonal multiplier, holiday premium" }
      - { name: galley_load_per_cover, type: number, source: input, description: "Provisioning load units consumed per reserved cover for this tier" }
      - { name: bar_package_price_cents, type: integer, source: input, description: "Per-person beverage package price; subject to per-line rounding rule" }

  - name: CruiseInstance
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; the operating vessel" }
      - { name: menu_tier_id, type: string, source: input, description: "FK -> MenuTier.id; menu tier sold on this cruise" }
      - { name: depart_at, type: datetime, source: input, description: "Scheduled departure instant (UTC)" }
      - { name: return_at, type: datetime, source: input, description: "Scheduled return instant (UTC); must be > depart_at" }
      - { name: season, type: enum, source: computed, description: "Derived from depart_at month: PEAK for month IN {6,7,8}, SHOULDER for {5,9}, OFF otherwise" }
      - { name: is_holiday, type: boolean, source: computed, description: "True when depart_at calendar date (UTC) is in the fixed HOLIDAY_DATES constant set" }
      - { name: reserved_covers, type: integer, source: computed, default: 0, description: "Sum of party_size over Booking rows of this cruise with booking_status IN {RESERVED, CONFIRMED, BOARDED} and payment_status IN {PENDING, PAID, REFUND_PENDING}" }
      - { name: boarded_count, type: integer, source: computed, default: 0, description: "Count of BookingPassenger rows of this cruise with boarded_at non-null" }
      - { name: bar_service_enabled, type: boolean, source: computed, default: false, description: "True only while at least one CONFIRMED StaffAssignment on this cruise references a StaffMember whose alcohol_cert_expires_at > current logical clock" }
      - { name: charter_booking_id, type: string, source: system, description: "FK -> Booking.id; set when the cruise is converted to a private charter; null otherwise" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | BOARDING | UNDERWAY | COMPLETED | WEATHER_HOLD | CANCELLED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email; unique" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum over the customer's CruiseCredit rows: amount_cents when credit_status == ISSUED, final_amount_cents when credit_status == SETTLED, 0 when REDEEMED or EXPIRED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: cruise_id, type: string, source: input, description: "FK -> CruiseInstance.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the paying customer" }
      - { name: party_size, type: integer, source: input, description: "Number of passengers in this booking; must be >= 1" }
      - { name: booking_total_cents, type: integer, source: computed, description: "Ticket total per ticket_pricing calculation; frozen at payment" }
      - { name: bar_package_count, type: integer, source: input, default: 0, description: "Number of passengers purchasing the beverage package; must be <= party_size" }
      - { name: bar_package_total_cents, type: integer, source: computed, default: 0, description: "Beverage package total per bar_package_pricing calculation (per-line rounding)" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | REFUND_PENDING | REFUNDED | CREDITED — parallel dimension 1" }
      - { name: booking_status, type: enum, source: system, description: "RESERVED | CONFIRMED | BOARDED | NO_SHOW | CANCELLED | CONVERTED_TO_CHARTER — parallel dimension 2" }

  - name: BookingPassenger
    parent: Booking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: full_name, type: string, source: input, description: "Passenger full name as shown to Coast Guard" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date; used to derive is_minor for alcohol rules" }
      - { name: is_minor, type: boolean, source: computed, description: "True when age at cruise depart_at < 21 years (US alcohol rule benchmark); drives alcohol-service denial" }
      - { name: boarded_at, type: datetime, source: system, description: "Set by boarding check-in; null until boarded" }

  - name: BoardingManifest
    parent: CruiseInstance
    common_fields: true
    fields:
      - { name: cruise_id, type: string, source: system, description: "FK -> CruiseInstance.id; exactly one manifest per cruise" }
      - { name: passenger_count, type: integer, source: computed, default: 0, description: "Count of BookingPassenger rows with boarded_at non-null at freeze time; snapshot" }
      - { name: coast_guard_capacity, type: integer, source: computed, description: "Snapshot of Vessel.coast_guard_capacity at manifest creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | FROZEN | FILED — FROZEN is a hard gate for departure" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff display name" }
      - { name: role_code, type: enum, source: input, description: "SERVER | BARTENDER | GALLEY | ENTERTAINER | DECKHAND" }
      - { name: alcohol_cert_expires_at, type: datetime, source: input, description: "Expiry instant of state alcohol-server certification; null for non-alcohol roles" }

  - name: StaffAssignment
    parent: CruiseInstance
    common_fields: true
    fields:
      - { name: cruise_id, type: string, source: system, description: "FK -> CruiseInstance.id" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id" }
      - { name: assigned_role, type: enum, source: input, description: "SERVER | BARTENDER | GALLEY | ENTERTAINER | DECKHAND" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | RELEASED" }

  - name: GalleyProvisionOrder
    parent: CruiseInstance
    common_fields: true
    fields:
      - { name: cruise_id, type: string, source: system, description: "FK -> CruiseInstance.id; at most one non-cancelled order per cruise" }
      - { name: provisional_covers, type: integer, source: computed, description: "Forward-looking covers at order placement (see galley_provisioning calculation)" }
      - { name: final_covers, type: integer, source: computed, description: "Chronological boarded covers + confirmed crew covers at settlement (see galley_provisioning variants)" }
      - { name: provision_load_units, type: number, source: computed, description: "= provisional_covers * MenuTier.galley_load_per_cover at placement" }
      - { name: restocking_rebate_cents, type: integer, source: computed, default: 0, description: "Rebate applied to weather credits when this order was PLACED at cancellation: GALLEY_RESTOCK_REBATE_CENTS * provisional_covers" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLACED | RECEIVED | SETTLED | CANCELLED" }

  - name: CharterInquiry
    parent: null
    common_fields: true
    fields:
      - { name: cruise_id, type: string, source: input, description: "FK -> CruiseInstance.id; the cruise targeted for full private charter" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the charter client" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Current quote per charter_quote calculation; refreshed on each quote/counter round" }
      - { name: quote_round, type: integer, source: system, default: 0, description: "Monotone counter incremented on every QUOTED/COUNTERED transition; caps negotiation at MAX_QUOTE_ROUNDS" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | COUNTERED | ACCEPTED | CONVERTED | DECLINED | EXPIRED" }

  - name: WeatherEvent
    parent: null
    common_fields: true
    fields:
      - { name: declared_at, type: datetime, source: system, description: "Logical-clock instant when the event was declared" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | GALE_WARNING | CANCELLATION_REQUIRED" }
      - { name: window_start, type: datetime, source: input, description: "Start of affected window (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "End of affected window (UTC); must be > window_start" }
      - { name: status, type: enum, source: system, description: "DECLARED | CANCELLATION_ISSUED | CREDITS_SETTLED | CLOSED" }

  - name: CruiseCredit
    parent: Customer
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; credit holder" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; source booking" }
      - { name: amount_cents, type: integer, source: computed, description: "Provisional amount at issuance; replaced by final amount at settlement" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Final settled amount per weather_credit final variant" }
      - { name: credit_status, type: enum, source: system, description: "ISSUED | SETTLED | REDEEMED | EXPIRED" }

  - name: DockSlot
    parent: Dock
    common_fields: true
    fields:
      - { name: dock_id, type: string, source: system, description: "FK -> Dock.id" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id occupying the berth" }
      - { name: slot_start, type: datetime, source: input, description: "Berth occupation start (UTC), half-open" }
      - { name: slot_end, type: datetime, source: input, description: "Berth occupation end (UTC), half-open; must be > slot_start" }

  - name: ParkingPass
    parent: Dock
    common_fields: true
    fields:
      - { name: dock_id, type: string, source: system, description: "FK -> Dock.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this pass is attached to" }
      - { name: cruise_id, type: string, source: input, description: "FK -> CruiseInstance.id; the cruise date the pass is valid for" }
      - { name: status, type: enum, source: system, description: "RESERVED | REDEEMED | RELEASED | EXPIRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CruiseInstance
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BOARDING
        trigger: "POST /cruises/{cruiseId}/open-boarding"
        actor: OperationsManager
        preconditions:
          - "CruiseInstance.status == SCHEDULED (ERR_INVALID_STATE)"
          - "BoardingManifest exists for this cruise and status == FROZEN (ERR_MANIFEST_NOT_FROZEN)"
          - "reserved_covers <= Vessel.coast_guard_capacity (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "BoardingManifest.passenger_count snapshot recomputed"

      - from: BOARDING
        to: UNDERWAY
        trigger: "POST /cruises/{cruiseId}/depart"
        actor: Captain
        preconditions:
          - "CruiseInstance.status == BOARDING (ERR_INVALID_STATE)"
          - "boarded_count <= Vessel.coast_guard_capacity (ERR_CAPACITY_EXCEEDED)"
          - "BoardingManifest.status == FROZEN (ERR_MANIFEST_NOT_FROZEN)"
        side_effects:
          - "Bookings with payment_status == PAID and booking_status == CONFIRMED and all passengers unboarded -> booking_status = NO_SHOW"

      - from: UNDERWAY
        to: COMPLETED
        trigger: "POST /cruises/{cruiseId}/complete"
        actor: Captain
        preconditions:
          - "CruiseInstance.status == UNDERWAY (ERR_INVALID_STATE)"
        side_effects:
          - "BoardingManifest.status -> FILED"
          - "GalleyProvisionOrder in PLACED or RECEIVED -> SETTLED; final_covers computed (chronological variant)"
          - "Bookings with booking_status == BOARDED remain BOARDED; bookings with booking_status == CONFIRMED and no boarded passenger -> NO_SHOW"

      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "system (automatic when a WeatherEvent with severity CANCELLATION_REQUIRED has window covering this cruise's depart_at and status == DECLARED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /cruises/{cruiseId}/clear-weather-hold"
        actor: OperationsManager
        preconditions:
          - "CruiseInstance.status == WEATHER_HOLD (ERR_INVALID_STATE)"
          - "Covering WeatherEvent status IN {DECLARED, CLOSED} (operator may elect to sail despite a declared event; an event in CANCELLATION_ISSUED blocks clearing — ERR_WEATHER_EVENT_ACTIVE)"
        side_effects: []
        note: "Cycle SCHEDULED -> WEATHER_HOLD -> SCHEDULED may repeat across distinct weather events"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cruises/{cruiseId}/weather-cancel"
        actor: OperationsManager
        preconditions:
          - "CruiseInstance.status IN {SCHEDULED, WEATHER_HOLD} (ERR_INVALID_STATE)"
          - "A covering WeatherEvent with severity == CANCELLATION_REQUIRED exists with status IN {DECLARED, CANCELLATION_ISSUED} (ERR_NO_ACTIVE_WEATHER_EVENT)"
        side_effects:
          - "Every Booking of this cruise with payment_status IN {PENDING, PAID}: payment_status -> REFUND_PENDING; booking_status -> CANCELLED"
          - "A CruiseCredit with credit_status ISSUED is created per such Booking with provisional amount_cents (weather_credit provisional variant)"
          - "GalleyProvisionOrder with status IN {DRAFT, PLACED}: status -> CANCELLED; if it was PLACED, restocking_rebate_cents computed"
          - "WeatherEvent driving this cancellation -> CANCELLATION_ISSUED"
          - "ParkingPass rows with status == RESERVED for this cruise -> RELEASED; Dock.parking_in_use decremented per released pass"
          - "StaffAssignment rows with status IN {ASSIGNED, CONFIRMED} for this cruise -> RELEASED"

      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /cruises/{cruiseId}/weather-cancel"
        actor: OperationsManager
        preconditions:
          - "CruiseInstance.status IN {SCHEDULED, WEATHER_HOLD} (ERR_INVALID_STATE)"
          - "A covering WeatherEvent with severity == CANCELLATION_REQUIRED exists with status IN {DECLARED, CANCELLATION_ISSUED} (ERR_NO_ACTIVE_WEATHER_EVENT)"
        side_effects:
          - "Same cascade as SCHEDULED -> CANCELLED"

  - entity: Booking
    initial_state: "payment_status=PENDING, booking_status=RESERVED"
    terminal_states: ["payment_status IN {REFUNDED, CREDITED} OR booking_status IN {CANCELLED, CONVERTED_TO_CHARTER, NO_SHOW}"]
    transitions:
      - from: "payment_status=PENDING"
        to: "payment_status=PAID"
        trigger: "POST /bookings/{bookingId}/pay"
        actor: Customer
        preconditions:
          - "payment_status == PENDING (ERR_INVALID_STATE)"
          - "booking_status IN {RESERVED, CONFIRMED} (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
        side_effects:
          - "booking_total_cents frozen (ticket_pricing recomputed and stored)"
          - "bar_package_total_cents stored (bar_package_pricing)"
          - "CruiseInstance.reserved_covers recomputed"

      - from: "booking_status=RESERVED"
        to: "booking_status=CONFIRMED"
        trigger: "system (automatic on successful pay)"
        actor: system
        preconditions: []
        side_effects:
          - "CruiseInstance.reserved_covers recomputed"

      - from: "booking_status=CONFIRMED"
        to: "booking_status=BOARDED"
        trigger: "system (automatic when all BookingPassenger rows of the booking have boarded_at non-null)"
        actor: system
        preconditions: []
        side_effects:
          - "CruiseInstance.boarded_count recomputed"
          - "BoardingManifest.passenger_count recomputed when manifest in DRAFT"

      - from: "payment_status=PAID"
        to: "payment_status=REFUND_PENDING"
        trigger: "system (automatic on cruise weather-cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "CruiseCredit issued (provisional variant)"

      - from: "payment_status=PENDING"
        to: "payment_status=REFUND_PENDING"
        trigger: "system (automatic on cruise weather-cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "CruiseCredit issued (provisional variant)"

      - from: "payment_status=REFUND_PENDING"
        to: "payment_status=CREDITED"
        trigger: "POST /weather-events/{weatherEventId}/settle-credits"
        actor: OperationsManager
        preconditions:
          - "WeatherEvent.status == CANCELLATION_ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "CruiseCredit.final_amount_cents computed (final variant); credit_status -> SETTLED"
          - "Customer.credit_balance_cents recomputed"

      - from: "booking_status=RESERVED"
        to: "booking_status=CANCELLED"
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: Customer
        preconditions:
          - "booking_status IN {RESERVED, CONFIRMED} (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
        side_effects:
          - "payment_status -> REFUNDED if it was PAID"
          - "CruiseInstance.reserved_covers recomputed"

      - from: "booking_status=CONFIRMED"
        to: "booking_status=CANCELLED"
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: Customer
        preconditions:
          - "booking_status IN {RESERVED, CONFIRMED} (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
        side_effects:
          - "payment_status -> REFUNDED if it was PAID"
          - "CruiseInstance.reserved_covers recomputed"

      - from: "booking_status=RESERVED"
        to: "booking_status=CONVERTED_TO_CHARTER"
        trigger: "system (automatic on charter conversion)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status -> CREDITED if it was PAID; conversion CruiseCredit issued at (1 - CHARTER_CONVERSION_FEE_PCT) of booking_total_cents"

      - from: "booking_status=CONFIRMED"
        to: "booking_status=CONVERTED_TO_CHARTER"
        trigger: "system (automatic on charter conversion)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status -> CREDITED if it was PAID; conversion CruiseCredit issued at (1 - CHARTER_CONVERSION_FEE_PCT) of booking_total_cents"

  - entity: CharterInquiry
    initial_state: DRAFT
    terminal_states: [CONVERTED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /charter-inquiries/{inquiryId}/quote"
        actor: CharterSalesAgent
        preconditions:
          - "CharterInquiry.status == DRAFT (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
        side_effects:
          - "quoted_total_cents computed (charter_quote)"
          - "quote_round incremented"

      - from: QUOTED
        to: COUNTERED
        trigger: "POST /charter-inquiries/{inquiryId}/counter"
        actor: Customer
        preconditions:
          - "CharterInquiry.status == QUOTED (ERR_INVALID_STATE)"
          - "quote_round < MAX_QUOTE_ROUNDS (ERR_QUOTE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "quote_round incremented"

      - from: COUNTERED
        to: QUOTED
        trigger: "POST /charter-inquiries/{inquiryId}/quote"
        actor: CharterSalesAgent
        preconditions:
          - "CharterInquiry.status == COUNTERED (ERR_INVALID_STATE)"
          - "quote_round < MAX_QUOTE_ROUNDS (ERR_QUOTE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "quoted_total_cents recomputed (charter_quote)"
          - "quote_round incremented"

      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /charter-inquiries/{inquiryId}/accept"
        actor: Customer
        preconditions:
          - "CharterInquiry.status == QUOTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACCEPTED
        to: CONVERTED
        trigger: "POST /charter-inquiries/{inquiryId}/convert"
        actor: OperationsManager
        preconditions:
          - "CharterInquiry.status == ACCEPTED (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
          - "The accepting customer's X-User-ID differs from the converting OperationsManager's X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CruiseInstance.charter_booking_id set to a new system-created Booking for the charter client (booking_status CONFIRMED, payment_status PAID, party_size = Vessel.coast_guard_capacity)"
          - "Every pre-existing Booking of this cruise with booking_status IN {RESERVED, CONFIRMED}: booking_status -> CONVERTED_TO_CHARTER; payment_status -> CREDITED when it was PAID; conversion CruiseCredit issued at (1 - CHARTER_CONVERSION_FEE_PCT) * booking_total_cents"
          - "CruiseInstance.reserved_covers recomputed (= coast_guard_capacity)"

      - from: QUOTED
        to: DECLINED
        trigger: "POST /charter-inquiries/{inquiryId}/decline"
        actor: Customer
        preconditions:
          - "CharterInquiry.status IN {QUOTED, COUNTERED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /charter-inquiries/{inquiryId}/decline"
        actor: Customer
        preconditions:
          - "CharterInquiry.status IN {QUOTED, COUNTERED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: QUOTED
        to: EXPIRED
        trigger: "system (automatic when logical clock passes quoted_at + QUOTE_TTL_HOURS without acceptance)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BoardingManifest
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "POST /cruises/{cruiseId}/manifest/freeze"
        actor: Captain
        preconditions:
          - "BoardingManifest.status == DRAFT (ERR_INVALID_STATE)"
          - "passenger_count <= coast_guard_capacity snapshot (ERR_CAPACITY_EXCEEDED)"
        side_effects: []

      - from: FROZEN
        to: DRAFT
        trigger: "POST /cruises/{cruiseId}/manifest/amend"
        actor: Captain
        preconditions:
          - "BoardingManifest.status == FROZEN (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Amendment cycle DRAFT -> FROZEN -> DRAFT permits late corrections before boarding opens"

      - from: FROZEN
        to: FILED
        trigger: "system (automatic on cruise completion)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GalleyProvisionOrder
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /cruises/{cruiseId}/provision-orders/{orderId}/place"
        actor: GalleyManager
        preconditions:
          - "GalleyProvisionOrder.status == DRAFT (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
          - "provisional_covers >= 1 (ERR_NO_COVERS_TO_PROVISION)"
        side_effects:
          - "provision_load_units recomputed"

      - from: PLACED
        to: RECEIVED
        trigger: "POST /cruises/{cruiseId}/provision-orders/{orderId}/receive"
        actor: GalleyManager
        preconditions:
          - "GalleyProvisionOrder.status == PLACED (ERR_INVALID_STATE)"
        side_effects: []

      - from: PLACED
        to: SETTLED
        trigger: "system (automatic on cruise completion)"
        actor: system
        preconditions: []
        side_effects:
          - "final_covers computed (chronological variant)"

      - from: RECEIVED
        to: SETTLED
        trigger: "system (automatic on cruise completion)"
        actor: system
        preconditions: []
        side_effects:
          - "final_covers computed (chronological variant)"

      - from: DRAFT
        to: CANCELLED
        trigger: "system (automatic on cruise weather-cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PLACED
        to: CANCELLED
        trigger: "system (automatic on cruise weather-cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "restocking_rebate_cents computed = GALLEY_RESTOCK_REBATE_CENTS * provisional_covers"

  - entity: StaffAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /cruises/{cruiseId}/staff-assignments/{assignmentId}/confirm"
        actor: OperationsManager
        preconditions:
          - "StaffAssignment.status == ASSIGNED (ERR_INVALID_STATE)"
          - "CruiseInstance.status == SCHEDULED (ERR_CRUISE_NOT_BOOKABLE)"
          - "If assigned_role == BARTENDER: StaffMember.alcohol_cert_expires_at > logical clock (ERR_ALCOHOL_CERT_EXPIRED)"
        side_effects:
          - "CruiseInstance.bar_service_enabled recomputed"

      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /cruises/{cruiseId}/staff-assignments/{assignmentId}/release OR system (on cruise weather-cancel)"
        actor: OperationsManager
        preconditions:
          - "StaffAssignment.status IN {ASSIGNED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "CruiseInstance.bar_service_enabled recomputed"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /cruises/{cruiseId}/staff-assignments/{assignmentId}/release OR system (on cruise weather-cancel)"
        actor: OperationsManager
        preconditions:
          - "StaffAssignment.status IN {ASSIGNED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "CruiseInstance.bar_service_enabled recomputed"

  - entity: WeatherEvent
    initial_state: DECLARED
    terminal_states: [CREDITS_SETTLED, CLOSED]
    transitions:
      - from: DECLARED
        to: CANCELLATION_ISSUED
        trigger: "system (automatic on first weather-cancel of a covered cruise)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CANCELLATION_ISSUED
        to: CREDITS_SETTLED
        trigger: "POST /weather-events/{weatherEventId}/settle-credits"
        actor: OperationsManager
        preconditions:
          - "WeatherEvent.status == CANCELLATION_ISSUED (ERR_INVALID_STATE)"
          - "Every CruiseInstance cancelled under this event has all Booking payment_status == REFUND_PENDING (ERR_CREDITS_NOT_PENDING)"
        side_effects:
          - "Per REFUND_PENDING booking: CruiseCredit final_amount_cents computed (final variant); credit_status -> SETTLED; payment_status -> CREDITED"
          - "Customer.credit_balance_cents recomputed for each affected customer"

      - from: DECLARED
        to: CLOSED
        trigger: "POST /weather-events/{weatherEventId}/close"
        actor: OperationsManager
        preconditions:
          - "WeatherEvent.status == DECLARED (ERR_INVALID_STATE)"
          - "No covered CruiseInstance in WEATHER_HOLD (ERR_WEATHER_HOLDS_OUTSTANDING)"
        side_effects: []

  - entity: ParkingPass
    initial_state: RESERVED
    terminal_states: [REDEEMED, RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: REDEEMED
        trigger: "POST /parking-passes/{passId}/redeem"
        actor: DockAttendant
        preconditions:
          - "ParkingPass.status == RESERVED (ERR_INVALID_STATE)"
          - "CruiseInstance.status IN {SCHEDULED, BOARDING} (ERR_INVALID_STATE)"
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "POST /parking-passes/{passId}/release OR system (on cruise weather-cancel)"
        actor: DockAttendant
        preconditions:
          - "ParkingPass.status == RESERVED (ERR_INVALID_STATE)"
        side_effects:
          - "Dock.parking_in_use decremented"

      - from: RESERVED
        to: EXPIRED
        trigger: "system (automatic when cruise departs with pass still RESERVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Dock.parking_in_use decremented"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-cruise
    parent_entity: CruiseInstance
    write_endpoint: "POST /cruises/{cruiseId}/bookings"
    occ_field: "expected_cruise_version"
    description: |
      Creating a Booking against a CruiseInstance whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created or cancelled a booking (which
      legitimately changes reserved_covers and therefore capacity headroom)
      and the current writer's view of remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: charter-quote-stale-inquiry
    parent_entity: CharterInquiry
    write_endpoint: "POST /charter-inquiries/{inquiryId}/quote"
    occ_field: "expected_inquiry_version"
    description: |
      Posting a quote against a CharterInquiry whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the counterparty has just posted a counter (which legitimately
      advances quote_round) and the current writer's view of the negotiation
      round is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_pricing
    trigger: "booking creation and pay (booking_total_cents frozen at pay)"
    algorithm: tiered_pricing
    formula: |
      1. line = party_size * MenuTier.base_price_cents
      2. party discount (tiered): party_size >= 10 -> 15%; >= 6 -> 10%; >= 4 -> 5%; else 0%.
         discounted = round_half_up(line * (1 - discount_pct))          # rounding step 1
      3. seasonal multiplier from CruiseInstance.season:
         PEAK -> 1.25, SHOULDER -> 1.10, OFF -> 1.00.
         seasonal = round_half_up(discounted * season_mult)              # rounding step 2
      4. holiday premium (only when CruiseInstance.is_holiday):
         booking_total_cents = seasonal + party_size * HOLIDAY_PREMIUM_CENTS
         else booking_total_cents = seasonal
      Evaluation order is pinned: discount -> seasonal -> holiday premium.
    input_set: "Bookings on the target CruiseInstance with booking_status IN {RESERVED, CONFIRMED}"
    constants:
      HOLIDAY_PREMIUM_CENTS: 1500
      PEAK_MULT: 1.25
      SHOULDER_MULT: 1.10
      OFF_MULT: 1.00
      HOLIDAY_DATES: ["2026-07-04", "2026-09-07", "2026-12-25", "2026-12-31"]
    precision: "integer cents, round_half_up at each pinned rounding step"

  - name: bar_package_pricing
    trigger: "booking creation and pay (bar_package_total_cents stored at pay)"
    algorithm: aggregation
    formula: |
      Per-line rounding is PINNED: for each of bar_package_count packages,
      gratuity_line = round_half_up(MenuTier.bar_package_price_cents * GRATUITY_PCT)
      per_package   = MenuTier.bar_package_price_cents + gratuity_line
      bar_package_total_cents = per_package * bar_package_count
      Note: rounding per package line THEN multiplying differs from multiplying
      first then rounding the gratuity; the scaffold pins the per-line order.
    input_set: "Single booking under payment"
    constants:
      GRATUITY_PCT: 0.18
    precision: "integer cents, round_half_up per line"

  - name: weather_credit
    trigger: "cruise weather-cancel (provisional) and settle-credits (final)"
    algorithm: threshold
    formula: |
      Provisional variant (at cancellation):
        hours_notice = (CruiseInstance.depart_at - logical_clock_now) in whole hours
        pct = 1.00 if hours_notice >= 72; 0.75 if >= 24; 0.50 if >= 6; else 0.25
        amount_cents = round_half_up(Booking.booking_total_cents * pct)
      Final variant (at settle):
        base = round_half_up(Booking.booking_total_cents * pct)   # pct recomputed identically
        base += GALLEY_RESTOCK_REBATE_CENTS * GalleyProvisionOrder.provisional_covers
                if the cruise's provision order was PLACED at cancellation time
        final_amount_cents = base - CREDIT_PROCESSING_FEE_CENTS
      The two variants produce different results for identical booking data whenever
      the provision order was PLACED (rebate added, fee subtracted).
    input_set: "Bookings of the cancelled cruise with payment_status IN {PENDING, PAID} at cancellation; settlement re-reads the same bookings"
    constants:
      GALLEY_RESTOCK_REBATE_CENTS: 300
      CREDIT_PROCESSING_FEE_CENTS: 450
      TIER_1_HOURS: 72
      TIER_2_HOURS: 24
      TIER_3_HOURS: 6
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "issued at weather-cancel time"
        difference: "no restocking rebate, no processing fee"
      - name: final
        when: "computed at settle-credits"
        difference: "adds restocking rebate when provision order was PLACED; subtracts flat processing fee"

  - name: galley_provisioning
    trigger: "provision-order placement (provisional) and cruise completion (final)"
    algorithm: forward_looking
    formula: |
      Provisional variant (at placement, forward-looking):
        provisional_covers = sum of Booking.party_size over bookings of this cruise with
          booking_status IN {RESERVED, CONFIRMED} AND payment_status IN {PENDING, PAID}
        provision_load_units = provisional_covers * MenuTier.galley_load_per_cover
      Final variant (at completion, chronological):
        final_covers = count of BookingPassenger with boarded_at non-null
                     + count of StaffAssignment with status == CONFIRMED (crew meals)
      The variants disagree whenever reserved != boarded (no-shows, minors without
      bar packages are still covers; crew are added only in the final).
    input_set: "Provisional: forward-looking booking set at placement. Final: actual boarded passengers plus confirmed crew."
    precision: "covers integer; load units 2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "order placement"
        difference: "uses reservation counts, includes PENDING payments"
      - name: final
        when: "cruise completion settlement"
        difference: "uses actual boarded counts plus confirmed crew covers"

  - name: charter_quote
    trigger: "charter-inquiry quote transitions"
    algorithm: tiered_pricing
    formula: |
      capacity_tier: Vessel.coast_guard_capacity <= 49 -> SMALL; <= 99 -> MEDIUM; else LARGE
      base = CHARTER_PRICE[capacity_tier]
      quoted_total_cents = round_half_up(base * season_mult(CruiseInstance.season))
      Note: circular-looking dependency pinned — the quote depends on the cruise's
      season; the season derives from depart_at which conversion never mutates;
      conversion sets reserved_covers but never re-quotes. Evaluation order:
      capacity tier -> base -> seasonal multiplier -> round once.
    input_set: "Single CharterInquiry and its CruiseInstance"
    constants:
      CHARTER_PRICE_SMALL: 350000
      CHARTER_PRICE_MEDIUM: 620000
      CHARTER_PRICE_LARGE: 980000
      CHARTER_CONVERSION_FEE_PCT: 0.12
      MAX_QUOTE_ROUNDS: 6
      QUOTE_TTL_HOURS: 48
    precision: "integer cents, round_half_up once"

  - name: dock_slot_conflict
    trigger: "dock-slot creation"
    algorithm: interval_merge
    formula: |
      Two DockSlot rows for the SAME vessel conflict when:
        a.slot_start < b.slot_end + TURNAROUND_MIN and b.slot_start < a.slot_end + TURNAROUND_MIN
      Intervals are half-open [start, end) BUT the turnaround buffer is added to the
      end of the earlier slot; adjacency at exactly slot_end + TURNAROUND_MIN is allowed.
      This is an interval-with-buffer semantics (not pure half-open, not aggregate).
    input_set: "DockSlot rows with matching vessel_id"
    constants:
      TURNAROUND_MIN: 45
    precision: "minute granularity"

  - name: parking_capacity_check
    trigger: "parking-pass creation"
    algorithm: threshold
    formula: |
      parking_in_use = count of ParkingPass rows on this dock with status IN {RESERVED, REDEEMED}
      Creating a new pass is allowed iff parking_in_use < Dock.parking_capacity
      (boundary: allowed when parking_in_use == capacity - 1; rejected when == capacity).
      Aggregate-count semantics over a pool — deliberately NOT an interval overlap:
      passes for the same cruise date share the pool regardless of arrival hour.
    input_set: "ParkingPass rows with matching dock_id"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per RBAC matrix", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id exists, validated left-to-right", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: state, check: "Target entity in a state permitting the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "CruiseInstance.status permits booking-level mutations (SCHEDULED)", error_id: ERR_CRUISE_NOT_BOOKABLE, http_status: 409, applies_to: "POST /cruises/{cruiseId}/bookings, POST /bookings/{bookingId}/pay, POST /bookings/{bookingId}/cancel, POST /cruises/{cruiseId}/provision-orders/{orderId}/place, POST /cruises/{cruiseId}/staff-assignments/{assignmentId}/confirm, charter quote/convert" }
  - { priority: 6, category: business_safety, check: "Coast Guard capacity: resulting reserved_covers <= Vessel.coast_guard_capacity", error_id: ERR_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /cruises/{cruiseId}/bookings, passenger check-in, manifest freeze, open-boarding, depart" }
  - { priority: 7, category: business_safety, check: "Alcohol service: BARTENDER confirmations require unexpired alcohol cert (ERR_ALCOHOL_CERT_EXPIRED); paying with bar_package_count > 0 requires CruiseInstance.bar_service_enabled == true (ERR_BAR_SERVICE_UNAVAILABLE)", error_id: "ERR_ALCOHOL_CERT_EXPIRED | ERR_BAR_SERVICE_UNAVAILABLE", http_status: 409, applies_to: "staff-assignment confirm, POST /bookings/{bookingId}/pay when bar_package_count > 0" }
  - { priority: 8, category: business_temporal, check: "Dock-slot turnaround-buffer overlap for same vessel", error_id: ERR_DOCK_SLOT_CONFLICT, http_status: 409, applies_to: "POST /docks/{dockId}/dock-slots" }
  - { priority: 9, category: business_constraint, check: "Parking pool: dock.parking_in_use < dock.parking_capacity", error_id: ERR_PARKING_FULL, http_status: 409, applies_to: "POST /docks/{dockId}/parking-passes" }
  - { priority: 10, category: business_constraint, check: "Charter negotiation rounds < MAX_QUOTE_ROUNDS", error_id: ERR_QUOTE_ROUNDS_EXHAUSTED, http_status: 409, applies_to: "charter quote/counter" }
  - { priority: 11, category: business_referential, check: "Weather cancellation requires a covering CANCELLATION_REQUIRED WeatherEvent in DECLARED or CANCELLATION_ISSUED", error_id: ERR_NO_ACTIVE_WEATHER_EVENT, http_status: 409, applies_to: "POST /cruises/{cruiseId}/weather-cancel" }
  - { priority: 12, category: business_referential, check: "Settle-credits requires every cancelled cruise under the event to have all bookings REFUND_PENDING", error_id: ERR_CREDITS_NOT_PENDING, http_status: 409, applies_to: "POST /weather-events/{weatherEventId}/settle-credits" }
  - { priority: 13, category: business_fiscal, check: "Segregation of duties: charter converter != charter accepter; quote poster != counter poster", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "charter convert, charter quote/counter" }
  - { priority: 14, category: business_fiscal, check: "OCC: expected_*_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /cruises/{cruiseId}/bookings, POST /charter-inquiries/{inquiryId}/quote" }
  - { priority: 15, category: business_constraint, check: "Manifest freeze requires passenger_count <= coast_guard_capacity snapshot and status DRAFT", error_id: ERR_MANIFEST_NOT_FROZEN, http_status: 409, applies_to: "open-boarding, depart" }
  - { priority: 16, category: business_constraint, check: "Provision order requires >= 1 provisional cover", error_id: ERR_NO_COVERS_TO_PROVISION, http_status: 422, applies_to: "POST /cruises/{cruiseId}/provision-orders/{orderId}/place" }
  - { priority: 17, category: business_constraint, check: "Cruise scheduling requires Vessel.status == ACTIVE", error_id: ERR_VESSEL_OUT_OF_SERVICE, http_status: 409, applies_to: "POST /cruises" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default, never wall-clock)."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Auto-transitions evaluated against the new clock (charter quote expiry, parking pass expiry on depart)"]

  # --- Vessel ---
  - { method: POST, path: "/vessels", description: "Create a vessel", roles: [OperationsManager], code: 201, input: [name, coast_guard_capacity, home_dock_id], output: Vessel, side_effects: ["status = ACTIVE"] }
  - { method: POST, path: "/vessels/{id}/set-out-of-service", description: "Take a vessel out of service", roles: [OperationsManager], code: 200, input: [], output: Vessel, side_effects: ["status ACTIVE -> OUT_OF_SERVICE"] }
  - { method: GET, path: "/vessels", description: "List vessels", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "Vessel[]", side_effects: [] }
  - { method: GET, path: "/vessels/{id}", description: "Get a vessel", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: [], output: Vessel, side_effects: [] }

  # --- Dock ---
  - { method: POST, path: "/docks", description: "Create a dock", roles: [OperationsManager], code: 201, input: [name, parking_capacity], output: Dock, side_effects: ["parking_in_use = 0"] }
  - { method: GET, path: "/docks", description: "List docks", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "Dock[]", side_effects: [] }
  - { method: GET, path: "/docks/{id}", description: "Get a dock", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: [], output: Dock, side_effects: [] }
  - { method: GET, path: "/docks/{id}/vessels", description: "List vessels home-ported at a dock", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "Vessel[]", side_effects: [] }
  - { method: GET, path: "/docks/{id}/dock-slots", description: "List dock slots for a dock", roles: [OperationsManager, Captain, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "DockSlot[]", side_effects: [] }
  - { method: GET, path: "/docks/{id}/parking-passes", description: "List parking passes for a dock", roles: [OperationsManager, Captain, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "ParkingPass[]", side_effects: [] }

  # --- MenuTier ---
  - { method: POST, path: "/menu-tiers", description: "Create a menu tier", roles: [OperationsManager], code: 201, input: [code, base_price_cents, galley_load_per_cover, bar_package_price_cents], output: MenuTier, side_effects: [] }
  - { method: GET, path: "/menu-tiers", description: "List menu tiers", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "MenuTier[]", side_effects: [] }
  - { method: GET, path: "/menu-tiers/{id}", description: "Get a menu tier", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: [], output: MenuTier, side_effects: [] }

  # --- CruiseInstance ---
  - { method: POST, path: "/cruises", description: "Schedule a cruise", roles: [OperationsManager], code: 201, input: [vessel_id, menu_tier_id, depart_at, return_at], output: CruiseInstance, side_effects: ["season and is_holiday computed", "reserved_covers = 0", "status = SCHEDULED", "BoardingManifest auto-created in DRAFT with coast_guard_capacity snapshot"] }
  - { method: GET, path: "/cruises", description: "List cruises", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?", "status?", "vessel_id?"], output: "CruiseInstance[]", side_effects: [] }
  - { method: GET, path: "/cruises/{id}", description: "Get a cruise", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: [], output: CruiseInstance, side_effects: [] }
  - { method: POST, path: "/cruises/{id}/open-boarding", description: "Open boarding", roles: [OperationsManager], code: 200, input: [], output: CruiseInstance, side_effects: ["status -> BOARDING", "requires manifest FROZEN"] }
  - { method: POST, path: "/cruises/{id}/depart", description: "Depart", roles: [Captain], code: 200, input: [], output: CruiseInstance, side_effects: ["status -> UNDERWAY", "unboarded CONFIRMED bookings -> NO_SHOW", "RESERVED parking passes -> EXPIRED"] }
  - { method: POST, path: "/cruises/{id}/complete", description: "Complete cruise", roles: [Captain], code: 200, input: [], output: CruiseInstance, side_effects: ["status -> COMPLETED", "manifest -> FILED", "provision order -> SETTLED with final_covers", "increments CruiseInstance.version by 1"] }
  - { method: POST, path: "/cruises/{id}/clear-weather-hold", description: "Clear weather hold", roles: [OperationsManager], code: 200, input: [], output: CruiseInstance, side_effects: ["status WEATHER_HOLD -> SCHEDULED"] }
  - { method: POST, path: "/cruises/{id}/weather-cancel", description: "Weather-cancel a cruise", roles: [OperationsManager], code: 200, input: [], output: CruiseInstance, side_effects: ["status -> CANCELLED", "bookings -> CANCELLED/REFUND_PENDING", "CruiseCredits issued (provisional)", "provision order -> CANCELLED with rebate when PLACED", "parking passes RELEASED", "staff assignments RELEASED", "WeatherEvent -> CANCELLATION_ISSUED"] }

  # --- Booking ---
  - { method: POST, path: "/cruises/{id}/bookings", description: "Create a booking (OCC on cruise)", roles: [Customer], code: 201, input: [customer_id, party_size, expected_cruise_version, "bar_package_count?"], output: Booking, side_effects: ["booking_total_cents and bar_package_total_cents computed", "payment_status = PENDING, booking_status = RESERVED", "CruiseInstance.reserved_covers recomputed", "increments CruiseInstance.version by 1"] }
  - { method: GET, path: "/cruises/{id}/bookings", description: "List bookings for a cruise", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?", "booking_status?", "payment_status?", "customer_id?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}", description: "Get a booking", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/bookings/{id}/passengers", description: "List passengers of a booking", roles: [OperationsManager, Captain, Customer, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "BookingPassenger[]", side_effects: [] }
  - { method: POST, path: "/bookings/{id}/passengers", description: "Add passengers to a booking (one call per passenger)", roles: [Customer], code: 201, input: [full_name, date_of_birth], output: BookingPassenger, side_effects: ["is_minor computed against cruise depart_at"] }
  - { method: POST, path: "/bookings/{id}/pay", description: "Pay for a booking", roles: [Customer], code: 200, input: [], output: Booking, side_effects: ["payment_status -> PAID", "booking_status -> CONFIRMED", "totals frozen", "reserved_covers recomputed"] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "Cancel a booking", roles: [Customer], code: 200, input: [], output: Booking, side_effects: ["booking_status -> CANCELLED", "payment_status -> REFUNDED when PAID", "reserved_covers recomputed"] }
  - { method: POST, path: "/bookings/{id}/passengers/{id}/check-in", description: "Boarding check-in for one passenger", roles: [DockAttendant], code: 200, input: [], output: BookingPassenger, side_effects: ["boarded_at set to logical clock", "boarded_count recomputed", "booking -> BOARDED when all passengers boarded", "requires cruise status BOARDING"] }

  # --- BoardingManifest ---
  - { method: GET, path: "/cruises/{id}/manifest", description: "Get the cruise's boarding manifest (array of 0 or 1)", roles: [OperationsManager, Captain], code: 200, input: [], output: "BoardingManifest[]", side_effects: [] }
  - { method: POST, path: "/cruises/{id}/manifest/freeze", description: "Freeze manifest", roles: [Captain], code: 200, input: [], output: BoardingManifest, side_effects: ["status -> FROZEN", "passenger_count snapshot"] }
  - { method: POST, path: "/cruises/{id}/manifest/amend", description: "Amend (unfreeze) manifest", roles: [Captain], code: 200, input: [], output: BoardingManifest, side_effects: ["status -> DRAFT"] }

  # --- GalleyProvisionOrder ---
  - { method: POST, path: "/cruises/{id}/provision-orders", description: "Create a provision order (DRAFT)", roles: [GalleyManager], code: 201, input: [], output: GalleyProvisionOrder, side_effects: ["provisional_covers computed (forward-looking variant)", "provision_load_units computed"] }
  - { method: GET, path: "/cruises/{id}/provision-orders", description: "List provision orders for a cruise", roles: [OperationsManager, Captain, GalleyManager], code: 200, input: ["limit?", "offset?", "status?"], output: "GalleyProvisionOrder[]", side_effects: [] }
  - { method: POST, path: "/cruises/{id}/provision-orders/{id}/place", description: "Place the order", roles: [GalleyManager], code: 200, input: [], output: GalleyProvisionOrder, side_effects: ["status -> PLACED"] }
  - { method: POST, path: "/cruises/{id}/provision-orders/{id}/receive", description: "Receive the order", roles: [GalleyManager], code: 200, input: [], output: GalleyProvisionOrder, side_effects: ["status -> RECEIVED"] }

  # --- Staff ---
  - { method: POST, path: "/staff-members", description: "Create a staff member", roles: [OperationsManager], code: 201, input: [full_name, role_code, "alcohol_cert_expires_at?"], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/staff-members", description: "List staff members", roles: [OperationsManager, Captain, GalleyManager], code: 200, input: ["limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/staff-members/{id}", description: "Get a staff member", roles: [OperationsManager, Captain, GalleyManager], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/staff-members/{id}/assignments", description: "List assignments of a staff member", roles: [OperationsManager, Captain, GalleyManager], code: 200, input: ["limit?", "offset?"], output: "StaffAssignment[]", side_effects: [] }
  - { method: POST, path: "/cruises/{id}/staff-assignments", description: "Assign staff to a cruise", roles: [OperationsManager], code: 201, input: [staff_member_id, assigned_role], output: StaffAssignment, side_effects: ["status = ASSIGNED"] }
  - { method: GET, path: "/cruises/{id}/staff-assignments", description: "List staff assignments for a cruise", roles: [OperationsManager, Captain, GalleyManager], code: 200, input: ["limit?", "offset?", "status?"], output: "StaffAssignment[]", side_effects: [] }
  - { method: POST, path: "/cruises/{id}/staff-assignments/{id}/confirm", description: "Confirm an assignment", roles: [OperationsManager], code: 200, input: [], output: StaffAssignment, side_effects: ["status -> CONFIRMED", "bar_service_enabled recomputed", "alcohol cert check for BARTENDER"] }
  - { method: POST, path: "/cruises/{id}/staff-assignments/{id}/release", description: "Release an assignment", roles: [OperationsManager], code: 200, input: [], output: StaffAssignment, side_effects: ["status -> RELEASED", "bar_service_enabled recomputed"] }

  # --- Customer / Credit ---
  - { method: POST, path: "/customers", description: "Register a customer", roles: [OperationsManager], code: 201, input: [email, full_name], output: Customer, side_effects: ["credit_balance_cents = 0"] }
  - { method: GET, path: "/customers", description: "List customers", roles: [OperationsManager, CharterSalesAgent], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers/{id}/bookings", description: "List a customer's bookings", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/customers/{id}/credits", description: "List a customer's cruise credits", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: ["limit?", "offset?", "credit_status?"], output: "CruiseCredit[]", side_effects: [] }
  - { method: POST, path: "/credits/{id}/redeem", description: "Redeem a settled credit against the balance", roles: [Customer], code: 200, input: [], output: CruiseCredit, side_effects: ["credit_status SETTLED -> REDEEMED", "Customer.credit_balance_cents recomputed"] }

  # --- Charter ---
  - { method: POST, path: "/charter-inquiries", description: "Open a charter inquiry", roles: [CharterSalesAgent], code: 201, input: [cruise_id, customer_id], output: CharterInquiry, side_effects: ["status = DRAFT", "quote_round = 0"] }
  - { method: GET, path: "/charter-inquiries", description: "List charter inquiries", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: ["limit?", "offset?", "status?", "cruise_id?", "customer_id?"], output: "CharterInquiry[]", side_effects: [] }
  - { method: GET, path: "/charter-inquiries/{id}", description: "Get a charter inquiry", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: [], output: CharterInquiry, side_effects: [] }
  - { method: POST, path: "/charter-inquiries/{id}/quote", description: "Post a quote (OCC on inquiry)", roles: [CharterSalesAgent], code: 200, input: [expected_inquiry_version], output: CharterInquiry, side_effects: ["quoted_total_cents computed", "quote_round incremented", "increments CharterInquiry.version by 1"] }
  - { method: POST, path: "/charter-inquiries/{id}/counter", description: "Customer counters the quote", roles: [Customer], code: 200, input: [], output: CharterInquiry, side_effects: ["status -> COUNTERED", "quote_round incremented", "increments CharterInquiry.version by 1"] }
  - { method: POST, path: "/charter-inquiries/{id}/accept", description: "Customer accepts the quote", roles: [Customer], code: 200, input: [], output: CharterInquiry, side_effects: ["status -> ACCEPTED"] }
  - { method: POST, path: "/charter-inquiries/{id}/decline", description: "Customer declines", roles: [Customer], code: 200, input: [], output: CharterInquiry, side_effects: ["status -> DECLINED"] }
  - { method: POST, path: "/charter-inquiries/{id}/convert", description: "Convert cruise to private charter", roles: [OperationsManager], code: 200, input: [], output: CharterInquiry, side_effects: ["status -> CONVERTED", "system charter Booking created (party_size = coast_guard_capacity)", "pre-existing bookings -> CONVERTED_TO_CHARTER with conversion credits", "reserved_covers recomputed"] }

  # --- Weather ---
  - { method: POST, path: "/weather-events", description: "Declare a weather event", roles: [OperationsManager], code: 201, input: [severity, window_start, window_end], output: WeatherEvent, side_effects: ["declared_at = logical clock", "covered cruises in SCHEDULED -> WEATHER_HOLD when severity == CANCELLATION_REQUIRED"] }
  - { method: GET, path: "/weather-events", description: "List weather events", roles: [OperationsManager, Captain], code: 200, input: ["limit?", "offset?", "status?"], output: "WeatherEvent[]", side_effects: [] }
  - { method: GET, path: "/weather-events/{id}", description: "Get a weather event", roles: [OperationsManager, Captain], code: 200, input: [], output: WeatherEvent, side_effects: [] }
  - { method: POST, path: "/weather-events/{id}/settle-credits", description: "Settle all provisional credits for the event", roles: [OperationsManager], code: 200, input: [], output: WeatherEvent, side_effects: ["final credit amounts computed (final variant)", "credits -> SETTLED", "bookings payment_status -> CREDITED", "customer balances recomputed", "WeatherEvent -> CREDITS_SETTLED"] }
  - { method: POST, path: "/weather-events/{id}/close", description: "Close an event without cancellations", roles: [OperationsManager], code: 200, input: [], output: WeatherEvent, side_effects: ["status DECLARED -> CLOSED"] }

  # --- Dock slots & parking ---
  - { method: POST, path: "/docks/{id}/dock-slots", description: "Create a dock slot", roles: [OperationsManager], code: 201, input: [vessel_id, slot_start, slot_end], output: DockSlot, side_effects: ["turnaround-buffer overlap check"] }
  - { method: GET, path: "/dock-slots/{id}", description: "Get a dock slot", roles: [OperationsManager, Captain, DockAttendant], code: 200, input: [], output: DockSlot, side_effects: [] }
  - { method: GET, path: "/vessels/{id}/dock-slots", description: "List dock slots for a vessel", roles: [OperationsManager, Captain, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "DockSlot[]", side_effects: [] }
  - { method: POST, path: "/docks/{id}/parking-passes", description: "Create a parking pass", roles: [Customer, DockAttendant], code: 201, input: [booking_id, cruise_id], output: ParkingPass, side_effects: ["status = RESERVED", "Dock.parking_in_use incremented", "aggregate capacity check"] }
  - { method: GET, path: "/parking-passes/{id}", description: "Get a parking pass", roles: [OperationsManager, DockAttendant, Customer], code: 200, input: [], output: ParkingPass, side_effects: [] }
  - { method: GET, path: "/bookings/{id}/parking-passes", description: "List parking passes attached to a booking", roles: [OperationsManager, DockAttendant, Customer], code: 200, input: ["limit?", "offset?"], output: "ParkingPass[]", side_effects: [] }
  - { method: GET, path: "/cruises/{id}/parking-passes", description: "List parking passes for a cruise", roles: [OperationsManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "ParkingPass[]", side_effects: [] }
  - { method: POST, path: "/parking-passes/{id}/redeem", description: "Redeem a pass", roles: [DockAttendant], code: 200, input: [], output: ParkingPass, side_effects: ["status -> REDEEMED"] }
  - { method: POST, path: "/parking-passes/{id}/release", description: "Release a pass", roles: [DockAttendant], code: 200, input: [], output: ParkingPass, side_effects: ["status -> RELEASED", "Dock.parking_in_use decremented"] }

  # --- FK reverse-reachability reads ---
  - { method: GET, path: "/menu-tiers/{id}/cruises", description: "List cruises sold on a menu tier", roles: [OperationsManager, Captain, CharterSalesAgent, Customer, GalleyManager, DockAttendant], code: 200, input: ["limit?", "offset?"], output: "CruiseInstance[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}/charter-cruises", description: "List cruises chartered by a booking (array of 0 or 1)", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "CruiseInstance[]", side_effects: [] }
  - { method: GET, path: "/credits/{id}", description: "Get a cruise credit", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: [], output: CruiseCredit, side_effects: [] }
  - { method: GET, path: "/bookings/{id}/credits", description: "List credits issued for a booking", roles: [OperationsManager, CharterSalesAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "CruiseCredit[]", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, invalid enum value, missing required field, or return_at <= depart_at / slot_end <= slot_start / window_end <= window_start" }
  - { id: ERR_VESSEL_NOT_FOUND, http: 404, condition: "Vessel id not found" }
  - { id: ERR_DOCK_NOT_FOUND, http: 404, condition: "Dock id not found" }
  - { id: ERR_MENU_TIER_NOT_FOUND, http: 404, condition: "Menu tier id not found" }
  - { id: ERR_CRUISE_NOT_FOUND, http: 404, condition: "Cruise id not found" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id not found" }
  - { id: ERR_PASSENGER_NOT_FOUND, http: 404, condition: "Booking passenger id not found" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "Boarding manifest not found for cruise" }
  - { id: ERR_PROVISION_ORDER_NOT_FOUND, http: 404, condition: "Provision order id not found" }
  - { id: ERR_STAFF_MEMBER_NOT_FOUND, http: 404, condition: "Staff member id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Staff assignment id not found" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id not found" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "Cruise credit id not found" }
  - { id: ERR_INQUIRY_NOT_FOUND, http: 404, condition: "Charter inquiry id not found" }
  - { id: ERR_WEATHER_EVENT_NOT_FOUND, http: 404, condition: "Weather event id not found" }
  - { id: ERR_DOCK_SLOT_NOT_FOUND, http: 404, condition: "Dock slot id not found" }
  - { id: ERR_PARKING_PASS_NOT_FOUND, http: 404, condition: "Parking pass id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity in a state that does not permit the requested transition" }
  - { id: ERR_CRUISE_NOT_BOOKABLE, http: 409, condition: "Cruise not in SCHEDULED status for booking-level mutations" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Resulting reserved_covers or boarded_count would exceed Vessel.coast_guard_capacity" }
  - { id: ERR_MANIFEST_NOT_FROZEN, http: 409, condition: "Open-boarding or depart requires manifest FROZEN" }
  - { id: ERR_ALCOHOL_CERT_EXPIRED, http: 409, condition: "BARTENDER confirmation requires unexpired alcohol certification" }
  - { id: ERR_BAR_SERVICE_UNAVAILABLE, http: 409, condition: "Paying with bar_package_count > 0 requires CruiseInstance.bar_service_enabled == true" }
  - { id: ERR_DOCK_SLOT_CONFLICT, http: 409, condition: "Dock slot overlaps an existing slot for the same vessel within the turnaround buffer" }
  - { id: ERR_PARKING_FULL, http: 409, condition: "Dock parking pool at capacity" }
  - { id: ERR_QUOTE_ROUNDS_EXHAUSTED, http: 409, condition: "Charter negotiation reached MAX_QUOTE_ROUNDS" }
  - { id: ERR_NO_ACTIVE_WEATHER_EVENT, http: 409, condition: "Weather cancel requires a covering CANCELLATION_REQUIRED event in DECLARED or CANCELLATION_ISSUED" }
  - { id: ERR_WEATHER_EVENT_ACTIVE, http: 409, condition: "Clear-weather-hold requires the covering event to be CLOSED" }
  - { id: ERR_WEATHER_HOLDS_OUTSTANDING, http: 409, condition: "Closing an event with cruises still in WEATHER_HOLD" }
  - { id: ERR_CREDITS_NOT_PENDING, http: 409, condition: "Settle-credits requires all affected bookings to be REFUND_PENDING" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator may not perform both sides of a controlled step (charter accept vs convert)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_NO_COVERS_TO_PROVISION, http: 422, condition: "Provision order placement requires at least one provisional cover" }
  - { id: ERR_VESSEL_OUT_OF_SERVICE, http: 409, condition: "Cruise scheduling rejected for OUT_OF_SERVICE vessel" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Runs cruise inventory, scheduling, weather cancellation, charter conversion, staffing"
    identity: opaque
    exclusive_operations:
      - "POST /vessels, POST /docks, POST /menu-tiers, POST /cruises"
      - "POST /cruises/{id}/open-boarding, /clear-weather-hold, /weather-cancel"
      - "POST /cruises/{id}/staff-assignments(+confirm/release)"
      - "POST /customers, POST /weather-events(+settle-credits/close)"
      - "POST /docks/{id}/dock-slots, POST /charter-inquiries/{id}/convert"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Captain
    description: "Vessel master; owns manifest freeze/amend and departure/completion"
    identity: opaque
    exclusive_operations:
      - "POST /cruises/{id}/depart, /complete"
      - "POST /cruises/{id}/manifest/freeze, /manifest/amend"
    shared_operations:
      - "GET endpoints for cruises, manifests, weather events"
  - name: Customer
    description: "Paying guest; owns bookings, passengers, parking passes, charter acceptance"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /cruises/{id}/bookings, /bookings/{id}/pay, /bookings/{id}/cancel"
      - "POST /bookings/{id}/passengers, POST /credits/{id}/redeem"
      - "POST /charter-inquiries/{id}/counter, /accept, /decline"
    shared_operations:
      - "GET endpoints for own bookings, credits, cruises"
      - "POST /docks/{id}/parking-passes (shared with DockAttendant)"
  - name: CharterSalesAgent
    description: "Charter pipeline owner; posts quotes, opens inquiries — never converts (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /charter-inquiries, POST /charter-inquiries/{id}/quote"
    shared_operations:
      - "GET endpoints for cruises, customers, inquiries"
  - name: GalleyManager
    description: "Galley provisioning owner"
    identity: opaque
    exclusive_operations:
      - "POST /cruises/{id}/provision-orders(+place/receive)"
    shared_operations:
      - "GET endpoints for cruises, provision orders, staff"
  - name: DockAttendant
    description: "Shore-side operations: boarding check-in and parking"
    identity: opaque
    exclusive_operations:
      - "POST /bookings/{id}/passengers/{pid}/check-in"
      - "POST /parking-passes/{id}/redeem, /release"
    shared_operations:
      - "GET endpoints for docks, dock slots, parking passes"
      - "POST /docks/{id}/parking-passes (shared with Customer)"
