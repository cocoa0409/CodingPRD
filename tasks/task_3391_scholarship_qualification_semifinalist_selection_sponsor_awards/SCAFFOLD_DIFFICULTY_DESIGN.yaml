          - entities.StateAllocation.fields.selected_count
        distinguishing_aspect: |
          Metric: selection-index threshold, exercised via run-semifinalist-selection. The
          boundary is inclusive (>=): with slots_final == 2 and scores 220, 218, 218, 210 the
          threshold lands exactly on 218 and BOTH 218-scorers are selected, so selected_count
