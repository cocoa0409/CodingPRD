              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew G", daily_capacity_sqft: 2000 }
              as: OpsAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "21 Lawn Way" }
              as: SalesRep
              captures: { p1: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${p1}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m1: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${p1}", site_measure_id: "${m1}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d1: $.data.id }
            - call: "POST /design-layouts/${d1}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${p1}", design_layout_id: "${d1}", base_depth_in: 3 }
              as: SalesRep
              captures: { s1: $.data.id }
            - call: "POST /base-prep-scopes/${s1}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${p1}", design_layout_id: "${d1}", base_prep_scope_id: "${s1}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${p1}"
              payload: {}
              as: OpsAdmin
              captures: { v1: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${v1}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /payments"
              payload: { project_id: "${p1}", kind: "DEPOSIT", amount_cents: 129470 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dp1: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${dp1}" }
              as: OpsAdmin
            - call: "POST /install-jobs"
              payload: { project_id: "${p1}", crew_id: "${crew_id}", scheduled_start: "2026-04-25T09:00:00Z", scheduled_end: "2026-04-25T17:00:00Z" }
              as: Scheduler
              captures: { j1: $.data.id }
            - call: "POST /install-jobs/${j1}/abort"
              payload: {}
              as: Scheduler
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "22 Lawn Way" }
              as: SalesRep
