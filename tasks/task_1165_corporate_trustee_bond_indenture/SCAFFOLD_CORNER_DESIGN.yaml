  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: indenture_computed_read_and_envelope_shape
        claim_type: computed_read
        grounds: ["endpoints.GET /indentures/{id}", "response_envelope"]
        distinguishing_aspect: "GET returns the derived fields (outstanding_principal_cents 400000000 after one position, covenant_posture CURRENT, active_default_count 0) inside the fixed envelope with meta.api_request_id and response_type object."
        test_recipe:
          setup: ["active indenture with one tranche and one position 400000000"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /indentures/${ind}", payload: {}, as: PlatformAdmin }
          assert:
            - "response envelope: meta.api_request_id present, response_type == 'object', data holds the entity"
            - "data.outstanding_principal_cents == 400000000 (derived from tranche)"
            - "data.covenant_posture == CURRENT; data.active_default_count == 0; data.current_trustee_ref == trustee-alpha"

      - name: amend_draft_invoice_rejected_conditional_action
        claim_type: conditional_action
        grounds: ["endpoints.POST /fee-invoices/{id}/amend", "state_machines.FeeInvoice", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Amend is conditional on DISPUTED: amending a DRAFT invoice fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["active indenture; ANNUAL_ADMIN invoice in DRAFT"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "ANNUAL_ADMIN", service_period_start: "2026-01-01", service_period_end: "2026-12-31", description: "annual" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /fee-invoices/${inv}/amend", payload: { description: "premature" }, as: TrustOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (amend requires DISPUTED)"

