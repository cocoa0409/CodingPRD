              as: PlatformAdmin
              captures: { att: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Will Fourteen", attorney_review_addon: true }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/attorney-reviews"
              payload: { document_project_id: "${proj}", attorney_id: "${att}", window_start: "2026-03-09T10:00:00.000Z", window_end: "2026-03-09T12:00:00.000Z" }
              as: Customer
