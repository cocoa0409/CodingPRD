    side_effects: []

  - method: GET
    path: "/opaque/complaint-cases"
    description: "List complaint cases"
    roles: [PlatformAdmin, CustomerService, Customer]
    code: 200
    input: ["booking_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "ComplaintCase[]"
    side_effects: []

