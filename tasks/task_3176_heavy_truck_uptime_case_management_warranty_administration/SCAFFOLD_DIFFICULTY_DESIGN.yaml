              payload: { vin: "1FUJGBDV8CLBP0120", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 50000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /campaigns"
              payload: { campaign_code: "RCL-2026-WIN", campaign_kind: "RECALL", affected_model_codes: ["CASCADIA_126"], fault_code: "SPN3216_FMI4", opens_on: "2026-08-01T00:00:00Z", closes_on: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
              captures: { campaign_id: $.data.id }
            - call: "GET /campaigns/${campaign_id}/completions"
              payload: { truck_id: "${truck_id}" }
              as: UptimeCoordinator
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /_ops/run"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /campaigns/${campaign_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { overdue_at_exact: $.data.overdue_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: UptimeCoordinator
            - call: "POST /_ops/run"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /campaigns/${campaign_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { overdue_after: $.data.overdue_count }
          assert:
            - "overdue_at_exact == 0 (closes_on == now is NOT overdue; > not >=)"
            - "overdue_after == 1 (now > closes_on)"
            - "Fleet.${fleet_id}.reliability_score has been decremented by 5 (CAMPAIGN_OVERDUE_PENALTY) only once for this row across the second ops_run"
            - "CampaignCompletion.${cc_id}.completion_status == OPEN (unchanged by the sweep)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: case_open_close_conserves_open_case_count
        grounds:
          - state_machines.Case
          - entities.Fleet.fields.open_case_count
          - entities.Truck.fields.open_case_count
          - state_machines.Truck
        distinguishing_aspect: |
          Conserved quantity: open_case_count on Fleet and Truck. Forward
          action: case create increments both by 1. Compensating action: case
          close (or cancel) decrements both by 1. Invariant: open_case_count
          equals the count of non-terminal Case rows; after a full open→close
          cycle the count returns to its initial value (0). Differentiated from
          the parts-claim invariant by quantity type (count vs cents).
