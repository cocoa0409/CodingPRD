              as: FleetAdmin
            - call: "POST /fleet/software-releases"
              payload: { release_code: "1.1.0" }
              as: ReleaseEngineer
              captures: { r2: $.data.id }
            - call: "POST /fleet/software-releases/${r2}/validate"
