          - validations[priority=14]
          - errors[ERR_SMALL_CELL_DISCLOSURE]
        distinguishing_aspect: |
          A structural zero is RELEASED but is not a complementary-suppression candidate
          (candidates require raw_count > 0), so the lone primary in RACE_ETHNICITY cannot be
          masked: residual_disclosure_risk becomes true and the EXTERNAL release is refused with
          ERR_SMALL_CELL_DISCLOSURE while the request stays SCREENED.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with a CERTIFIED ENROLLMENT component; clock at 2026-11-01T00:00:00Z."
