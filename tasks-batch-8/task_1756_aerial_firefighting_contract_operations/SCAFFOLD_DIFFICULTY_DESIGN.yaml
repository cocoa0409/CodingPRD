            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 100.0, hobbs_stop: 107.9 }, as: Pilot, as_user_id: "${p_id}", captures: { l1: $.data.flight_hours_tenths } }
          trigger:
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 107.9, hobbs_stop: 108.0 }, as: Pilot, as_user_id: "${p_id}", captures: { l2: $.data.flight_hours_tenths } }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 108.0, hobbs_stop: 108.1 }, as: Pilot, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "GET /crew-members/${p_id}/duty-days", as: CarrierOps, captures: { dd_flown: "$.data[0].flown_tenths" } }
          assert:
            - "First log accepted with flight_hours_tenths == 79"
            - "Second log accepted with flight_hours_tenths == 1: cumulative exactly 80 tenths is allowed (boundary value itself is legal)"
            - "Third log rejected with ERR_FLIGHT_HOUR_LIMIT_EXCEEDED (80 + 1 > 80)"
            - "CrewDutyDay.flown_tenths == 80 after the rejection (no partial write from the rejected log)"

      - name: reload_sla_average_exactly_thirty
        grounds:
