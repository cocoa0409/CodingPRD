            - "issuing ${offer_one_cent_over} is rejected with ERR_GENRE_CAP_EXCEEDED (409) — projected LATIN share is 2000001 / 5000000 == 0.4000002, one cent of numerator past the cap"
            - "the rejected offer keeps status DRAFT and guarantee_ceiling_cents unset, and its 1-cent guarantee is far under its own ceiling of floor(2000000 * 0.85) == 1700000, so priority 73 is not what fired"
            - "issuing ${offer_other_genre} succeeds — the cap is per primary_genre, not per festival, so the POP act at 1 cent is unaffected by the exhausted LATIN share"

