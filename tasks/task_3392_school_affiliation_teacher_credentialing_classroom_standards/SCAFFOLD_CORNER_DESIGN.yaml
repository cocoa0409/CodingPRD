              payload: { findings: ["Fix work period"], verdict: "IMPROVEMENT_REQUIRED" }
              as: Consultant
              as_user_id: "con-ada"
            - call: "GET /society/improvement-plans"
              payload: { school_id: "${op_id}" }
              as: AccreditationReviewer
              captures: { opid: "$.data[0].id", opv: "$.data[0].version" }
          trigger:
            - call: "POST /society/improvement-plans/${opid}/respond"
              payload: { response_notes: "first response", expected_improvement_plan_version: "${opv}" }
              as: SchoolAdmin
              as_user_id: "${op_id}"
            - call: "POST /society/improvement-plans/${opid}/respond"
              payload: { response_notes: "replay with stale version", expected_improvement_plan_version: "${opv}" }
