  # ---- route listings (7) --------------------------------------------------

  - method: POST
    path: /route-listings
    description: "Open a route listing in DRAFT with the seller's advertised numbers and the broker's exclusive representation window."
    roles: [Broker]
    input: [seller_id, region_code, state_code, asking_price_cents, listed_mrr_cents, listed_account_count, exclusive_start_date, exclusive_end_date]
    output: RouteListing
    success_status: 201
    side_effects:
      - "status = DRAFT; every claimed_*, verified_* and introductions_completed_count roll-up starts at 0 and verification_posture at EMPTY"
      - "the [exclusive_start_date, exclusive_end_date) window must not overlap another non-WITHDRAWN listing of the same (seller_id, region_code) — §1.4 priority 45"

  - method: GET
    path: /route-listings/{id}
    description: "Read one listing with its live claimed/verified roll-ups and verification_posture."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: RouteListing
    success_status: 200
    side_effects: []

  - method: GET
    path: /route-listings
    description: "List listings, filterable by seller."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["seller_id?", "region_code?", "state_code?", "status?", "limit?", "offset?"]
    output: "RouteListing[]"
    success_status: 200
    side_effects: []

  - method: PATCH
    path: /route-listings/{id}
    description: "Amend a DRAFT or LISTED listing's commercial terms or exclusivity window."
    roles: [Broker]
    input: ["asking_price_cents?", "listed_mrr_cents?", "listed_account_count?", "exclusive_start_date?", "exclusive_end_date?"]
    output: RouteListing
    success_status: 200
    side_effects:
      - "an exclusivity edit is re-checked against §1.4 priority 45 as if the listing were new"
      - "UNDER_CONTRACT, CLOSED and WITHDRAWN listings refuse the edit (§1.4 priority 30)"

  - method: POST
    path: /route-listings/{id}/publish
    description: "Publish a DRAFT listing to the market. Requires at least one account and a fresh LISTED_BASIS valuation, and a state licensing profile for the listing's state."
    roles: [Broker]
    input: []
    output: RouteListing
    success_status: 200
    side_effects:
      - "status = DRAFT -> LISTED"
      - "refused with ERR_STATE_PROFILE_MISSING when no StateLicenseProfile exists for state_code (§1.4 priority 37), and with ERR_SELLER_SUSPENDED when the seller is not ACTIVE (§1.4 priority 65)"
      - "refused with ERR_LISTING_NOT_PUBLISHABLE when the listing has no accounts or no non-superseded LISTED_BASIS valuation (§1.4 priority 70)"

  - method: POST
    path: /route-listings/{id}/withdraw
    description: "Withdraw a DRAFT or LISTED listing from the market. An UNDER_CONTRACT listing must have its deal terminated first."
    roles: [Broker, Seller]
    input: [withdrawal_reason_code]
    output: RouteListing
    success_status: 200
    side_effects:
      - "status -> WITHDRAWN (terminal); withdrawal_reason_code stored"
      - "refused while any Deal on the listing is ACCEPTED, DILIGENCE_CLEARED, FINANCING_APPROVED or ESCROW_FUNDED"

  - method: POST
    path: /route-listings/{id}/valuations
    description: "Compute and store a RouteValuation snapshot for this listing on the requested basis. OCC site: expected_listing_version pins the roll-up generation the valuation was computed from (§1.2.1 valuation-supersede-stale-listing)."
    roles: [Broker]
    input: [basis, expected_listing_version]
    output: RouteValuation
    success_status: 201
    side_effects:
      - "runs calculations.route_valuation for the requested basis (LISTED_BASIS over every non-EXCLUDED account's claimed numbers, VERIFIED_BASIS over VERIFIED accounts' verified numbers)"
      - "every earlier RouteValuation of the same (listing_id, basis) gets is_superseded = true"
      - "increments RouteListing.version by 1, so the OCC parent generation advances on every accepted valuation and a second creation must re-read the version"
      - "a stale expected_listing_version is ERR_STALE_LISTING_VERSION (412) and nothing is written"
      - "an empty input set is ERR_NO_VALUATION_INPUTS (§1.4 priority 42) rather than a zero valuation"

  # ---- service accounts (8) ------------------------------------------------

  - method: POST
    path: /service-accounts
    description: "Add one customer stop to a listing's account list. claimed_recurring_mrr_cents and account_age_months are derived, never accepted from the client."
    roles: [Broker]
    input: [listing_id, customer_ref, service_start_date, route_day, monthly_service_fee_cents, avg_monthly_chemical_cents, avg_monthly_repair_cents, chemical_billing_method, billing_frequency]
    output: ServiceAccount
    success_status: 201
    side_effects:
      - "claimed_recurring_mrr_cents = calculations.account_claimed_recurring_mrr (chemical folded in only when chemical_billing_method == INCLUDED, and the fee normalised out of billing_frequency)"
      - "account_age_months = whole months between service_start_date and the logical clock (the day-of-month must be reached, so a partial month does not count)"
      - "verification_status = UNVERIFIED, transfer_status = PENDING"
      - "the parent RouteListing's claimed_* roll-ups and verification_posture are recomputed and RouteListing.version increments"

  - method: GET
    path: /service-accounts/{id}
    description: "Read one service account."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: ServiceAccount
    success_status: 200
    side_effects: []

  - method: GET
    path: /service-accounts
    description: "List service accounts, filterable by listing, by owning deal and by the account they replaced."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["listing_id?", "deal_id?", "replaced_account_id?", "verification_status?", "transfer_status?", "route_day?", "limit?", "offset?"]
    output: "ServiceAccount[]"
    success_status: 200
    side_effects: []

  - method: POST
    path: /service-accounts/{id}/verify
    description: "Re-derive the account's recurring and repair MRR from its BANK_VERIFIED billing history and set VERIFIED or DISPUTED from the variance against the seller's claim."
    roles: [Broker]
    input: []
    output: ServiceAccount
    success_status: 200
    side_effects:
      - "runs calculations.account_billing_verification: collection-rate-weighted recurring and repair means over the trailing window, then verification_variance against claimed_recurring_mrr_cents"
      - "verification_status = VERIFIED when variance <= VERIFY_TOLERANCE, otherwise DISPUTED; both directions are re-runnable"
      - "the parent RouteListing's verified_* roll-ups and verification_posture are recomputed and RouteListing.version increments"

  - method: POST
    path: /service-accounts/{id}/exclude
    description: "Drop a stop from the deal. This is the trigger of the deepest cascade in the domain (§1.2 ServiceAccount VERIFIED -> EXCLUDED, five hops)."
    roles: [Broker]
    input: [exclusion_reason_code]
    output: ServiceAccount
    success_status: 200
    side_effects:
      - "HOP 1: verification_status = EXCLUDED"
      - "HOP 2: the RouteListing roll-ups and verification_posture are recomputed"
      - "HOP 3: a fresh VERIFIED_BASIS RouteValuation is computed and the previous one superseded"
      - "HOP 4: any live Deal on the listing whose price now fails calculations.reprice_trigger_test moves to REPRICE_REQUIRED with repricing_reason_code = VERIFIED_VALUATION_BELOW_OFFER"
      - "HOP 5: that deal's OPEN EscrowAccount gets target_amount_cents = 0 and deposits_blocked = true"

  - method: POST
    path: /service-accounts/{id}/reinstate
    description: "Put an EXCLUDED stop back into the account list as UNVERIFIED."
    roles: [Broker]
    input: []
    output: ServiceAccount
    success_status: 200
    side_effects:
      - "verification_status = EXCLUDED -> UNVERIFIED and exclusion_reason_code = null; the account must be re-verified before it can count towards a VERIFIED_BASIS valuation"
      - "the RouteListing roll-ups and verification_posture are recomputed"

  - method: POST
    path: /service-accounts/{id}/introduce
    description: "Record the seller physically introducing the buyer to this customer. Introductions must follow the route-day queue order and fit the post-acceptance window and daily cap."
    roles: [Broker, Seller]
    input: [deal_id, introduction_date]
    output: ServiceAccount
    success_status: 200
    side_effects:
      - "transfer_status = PENDING -> INTRODUCED, deal_id set, introduced_on = introduction_date, introduction_sequence_no = the next sequence number on that deal"
      - "RouteListing.introductions_completed_count increments"
      - "out-of-queue is ERR_INTRODUCTION_OUT_OF_SEQUENCE (§1.4 priority 62), out-of-window is ERR_INTRODUCTION_WINDOW_CLOSED (47) and the third on one date is ERR_INTRODUCTION_LIMIT_REACHED (48)"

  - method: POST
    path: /service-accounts/{id}/replace
    description: "Substitute a LOST account with a new stop on the same route day, which is the seller's in-kind alternative to a cash purchase-price adjustment."
    roles: [Seller, Broker]
    input: [customer_ref, service_start_date, route_day, monthly_service_fee_cents, avg_monthly_chemical_cents, avg_monthly_repair_cents, chemical_billing_method, billing_frequency]
    output: ServiceAccount
    success_status: 201
    side_effects:
      - "the addressed LOST account moves to REPLACED (terminal)"
      - "the supplied route_day must equal the replaced account's route_day and the replacement's claimed_recurring_mrr_cents must be > 0 (§1.4 priority 44)"
      - "a new ServiceAccount is created on the same listing_id and deal_id, on the supplied route_day, with replaced_account_id = the addressed account, verification_status = VERIFIED and transfer_status = TRANSFERRED"
      - "the deal's attrition ledger is recomputed: replacement_mrr_cents grows, net_attrition_mrr_cents shrinks, and clawback_status can fall back from CLAWBACK_TRIGGERED to MONITORING"
      - "past Deal.replacement_deadline_utc this is ERR_REPLACEMENT_DEADLINE_PASSED (§1.4 priority 63)"

  # ---- billing history records (3) -----------------------------------------

  - method: POST
    path: /billing-history-records
    description: "Append one immutable month of billing and collections evidence for an account. BANK_VERIFIED rows are the only ones that count towards verification."
    roles: [Broker, Seller]
    input: [account_id, period_month, billed_service_cents, billed_chemical_cents, billed_repair_cents, collected_cents, source]
    output: BillingHistoryRecord
    success_status: 201
    side_effects:
      - "collection_rate, recurring_collected_cents and repair_collected_cents are derived on write and never updated afterwards (common_fields: false, no version, no PATCH)"
      - "the current month is refused by §1.4 priority 50 ERR_TEMPORAL_WINDOW_VIOLATION; a duplicate (account_id, period_month, source) is ERR_DUPLICATE_BILLING_PERIOD (59)"

  - method: GET
    path: /billing-history-records/{id}
    description: "Read one billing history record."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: BillingHistoryRecord
    success_status: 200
    side_effects: []

  - method: GET
    path: /billing-history-records
    description: "List billing history records, filterable by account."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["account_id?", "period_month?", "source?", "limit?", "offset?"]
    output: "BillingHistoryRecord[]"
    success_status: 200
    side_effects: []

  # ---- route valuations (2) ------------------------------------------------

  - method: GET
    path: /route-valuations/{id}
    description: "Read one valuation snapshot, including the tier multiple, the age adjustment and the separated recurring and repair components."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: RouteValuation
    success_status: 200
    side_effects: []

  - method: GET
    path: /route-valuations
    description: "List valuation snapshots, filterable by listing, basis and supersession."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["listing_id?", "basis?", "is_superseded?", "limit?", "offset?"]
    output: "RouteValuation[]"
    success_status: 200
    side_effects: []

  # ---- deals (10) ----------------------------------------------------------

  - method: POST
    path: /deals
    description: "Submit a buyer's opening offer on a LISTED route, with the financing structure split into cash down and carried seller note."
    roles: [Buyer, Broker]
    input: [listing_id, buyer_id, offer_price_cents, financing_type, down_payment_cents, note_principal_cents, retention_guarantee_days]
    output: Deal
    success_status: 201
    side_effects:
      - "status = OFFER_SUBMITTED, offer_round = 1, current_offer_price_cents = offer_price_cents, clawback_status = NOT_APPLICABLE"
      - "down_payment_cents + note_principal_cents must equal offer_price_cents (§1.4 priority 67) and offer_price_cents must not exceed Buyer.prequalified_amount_cents (53)"
      - "an unqualified buyer is ERR_BUYER_NOT_QUALIFIED (39)"

  - method: GET
    path: /deals/{id}
    description: "Read one deal with its closing arithmetic and its live attrition ledger."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: Deal
    success_status: 200
    side_effects: []

  - method: GET
    path: /deals
    description: "List deals, filterable by listing and by buyer."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["listing_id?", "buyer_id?", "status?", "clawback_status?", "financing_type?", "limit?", "offset?"]
    output: "Deal[]"
    success_status: 200
    side_effects: []

  - method: POST
    path: /deals/{id}/counter-offers
    description: "Seller counters upward. Half of the OFFER_SUBMITTED <-> COUNTERED cycle."
    roles: [Seller]
    input: [counter_price_cents]
    output: Deal
    success_status: 200
    side_effects:
      - "status = OFFER_SUBMITTED -> COUNTERED, current_offer_price_cents = counter_price_cents, offer_round increments"
      - "the counter must strictly improve for the seller (> the standing price) or it is ERR_COUNTER_NOT_IMPROVED (§1.4 priority 54), which is what terminates the negotiation cycle"

  - method: POST
    path: /deals/{id}/offers
    description: "Buyer re-offers. Closes the negotiation cycle from COUNTERED, and is also the only way out of REPRICE_REQUIRED after an account exclusion."
    roles: [Buyer]
    input: [offer_price_cents, down_payment_cents, note_principal_cents]
    output: Deal
    success_status: 200
    side_effects:
      - "status COUNTERED -> OFFER_SUBMITTED requires offer_price_cents < current_offer_price_cents; status REPRICE_REQUIRED -> OFFER_SUBMITTED does not (the buyer is re-pricing against a shrunken route, not haggling)"
      - "current_offer_price_cents, down_payment_cents and note_principal_cents are replaced and offer_round increments; repricing_reason_code is cleared"
      - "down_payment_cents + note_principal_cents must equal offer_price_cents (§1.4 priority 67)"

  - method: POST
    path: /deals/{id}/accept
    description: "Seller accepts the standing offer. This is the fan-out point of the domain: escrow and one licence transfer per required permit are created here."
    roles: [Seller]
    input: [retention_guarantee_days]
    output: Deal
    success_status: 200
    side_effects:
      - "status = OFFER_SUBMITTED -> ACCEPTED; accepted_on = the clock's date"
      - "commission_cents, holdback_cents, escrow_target_amount_cents and clawback_cap_cents are computed by calculations.deal_escrow_structure and calculations.broker_commission"
      - "non_solicitation_executed_on = accepted_on and non_solicitation_end_date = accepted_on + retention_guarantee_days"
      - "the parent RouteListing moves LISTED -> UNDER_CONTRACT"
      - "exactly one EscrowAccount is created (status OPEN, target_amount_cents = down_payment_cents + holdback_cents)"
      - "one LicenseTransfer in NOT_STARTED is created per entry of the listing state's required_permit_types"
      - "down_payment_cents must clear MIN_DOWN_PCT[financing_type] (§1.4 priority 52) and retention_guarantee_days must be 60..365 (43)"

  - method: POST
    path: /deals/{id}/clear-diligence
    description: "Broker signs off the account-list due diligence against a named fresh VERIFIED_BASIS valuation."
    roles: [Broker]
    input: [valuation_id]
    output: Deal
    success_status: 200
    side_effects:
      - "status = ACCEPTED -> DILIGENCE_CLEARED"
      - "requires RouteListing.verification_posture == COMPLETE and verified recurring MRR >= 70% of listed_mrr_cents (§1.4 priority 40)"
      - "the signing user may not be a user who verified any of the covered accounts (§1.4 priority 4 ERR_SEGREGATION_OF_DUTIES)"

  - method: POST
    path: /deals/{id}/approve-financing
    description: "Record the lender's approval of the carried note."
    roles: [Broker]
    input: [lender_name, approved_amount_cents]
    output: Deal
    success_status: 200
    side_effects:
      - "status = DILIGENCE_CLEARED -> FINANCING_APPROVED; lender_name and approved_amount_cents stored"
      - "approved_amount_cents must equal note_principal_cents and must not exceed Buyer.prequalified_amount_cents"

  - method: POST
    path: /deals/{id}/close
    description: "Close the sale. Disburses escrow through the commission waterfall, transfers every introduced stop and opens the retention guarantee period."
    roles: [Broker]
    input: []
    output: Deal
    success_status: 200
    side_effects:
      - "status = ESCROW_FUNDED -> CLOSED; closed_at_utc = guarantee_start_utc = the logical clock"
      - "guarantee_end_utc = holdback_release_utc = clock + retention_guarantee_days; replacement_deadline_utc = guarantee_end_utc + REPLACEMENT_GRACE_DAYS"
      - "effective_multiple_at_close and guaranteed_mrr_cents are frozen from the fresh VERIFIED_BASIS valuation; allowance_mrr_cents = 5% of guaranteed_mrr_cents; clawback_status = MONITORING"
      - "the EscrowAccount runs calculations.close_disbursement_waterfall (broker commission first, then seller, holdback retained) and becomes PARTIALLY_RELEASED with scheduled_holdback_release_utc set"
      - "every INTRODUCED ServiceAccount of the listing becomes TRANSFERRED; the RouteListing becomes CLOSED"
      - "requires every LicenseTransfer APPROVED or WAIVED (§1.4 priority 38) and every non-EXCLUDED account INTRODUCED (61)"

  - method: POST
    path: /deals/{id}/terminate
    description: "Abandon the deal from any live state. Compensating transition: every side effect of acceptance is unwound."
    roles: [Broker, Seller, Buyer]
    input: [termination_reason_code]
    output: Deal
    success_status: 200
    side_effects:
      - "status -> TERMINATED (terminal); termination_reason_code stored"
      - "the EscrowAccount goes to REFUNDED with disbursed_to_buyer_cents = funded_amount_cents and undisbursed_balance_cents, holdback_balance_cents and every other disbursement bucket left at 0"
      - "every non-terminal LicenseTransfer (NOT_STARTED, APPLIED, DENIED) goes to CANCELLED; APPROVED and WAIVED ones are left alone"
      - "the RouteListing returns UNDER_CONTRACT -> LISTED when no other live deal holds it"

  # ---- escrow accounts (4) -------------------------------------------------

  - method: GET
    path: /escrow-accounts/{id}
    description: "Read one escrow account with its funding progress and its four disbursement buckets."
    roles: [Broker, PlatformAdmin, Seller, Buyer, EscrowAgent]
    input: []
    output: EscrowAccount
    success_status: 200
    side_effects: []

  - method: GET
    path: /escrow-accounts
    description: "List escrow accounts, filterable by deal. There is no POST: escrow is created by the acceptance cascade only."
    roles: [Broker, PlatformAdmin, Seller, Buyer, EscrowAgent]
    input: ["deal_id?", "status?", "limit?", "offset?"]
    output: "EscrowAccount[]"
    success_status: 200
    side_effects: []

  - method: POST
    path: /escrow-accounts/{id}/deposits
    description: "Deposit buyer funds into escrow. Partial deposits are allowed; the deposit that lands exactly on target flips the escrow to FUNDED and the deal to ESCROW_FUNDED."
    roles: [EscrowAgent]
    input: [amount_cents]
    output: EscrowAccount
    success_status: 201
    side_effects:
      - "funded_amount_cents += amount_cents and undisbursed_balance_cents += amount_cents (escrow cash arrives unassigned); the first deposit stamps funded_by_user_id from X-User-ID"
      - "funded_amount_cents == target_amount_cents -> status = FUNDED and the Deal moves FINANCING_APPROVED -> ESCROW_FUNDED; below target the escrow stays OPEN"
      - "a deposit that would overshoot the target is ERR_ESCROW_OVERFUNDED (§1.4 priority 55); deposits_blocked (set by the reprice cascade) is ERR_ESCROW_NOT_OPEN (27)"

  - method: POST
    path: /escrow-accounts/{id}/holdback-releases
    description: "Release the retention holdback to the seller once the guarantee period has expired clean. Segregated: the agent who funded the escrow may not release it."
    roles: [EscrowAgent]
    input: []
    output: EscrowAccount
    success_status: 201
    side_effects:
      - "holdback_balance_cents -> 0, disbursed_to_seller_cents += the released amount, status = PARTIALLY_RELEASED -> RELEASED"
      - "the Deal moves CLOSED -> GUARANTEE_CLOSED because holdback_balance_cents reached 0"
      - "before scheduled_holdback_release_utc, or while holdback_release_blocked is true, this is ERR_HOLDBACK_NOT_RELEASABLE (§1.4 priority 58)"
      - "X-User-ID == funded_by_user_id is ERR_SEGREGATION_OF_DUTIES (4)"

  # ---- license transfers (5) -----------------------------------------------

  - method: GET
    path: /license-transfers/{id}
    description: "Read one permit transfer with its processing window and attempt count."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: LicenseTransfer
    success_status: 200
    side_effects: []

  - method: GET
    path: /license-transfers
    description: "List permit transfers, filterable by deal and by state profile. There is no POST: transfers are fanned out by the acceptance cascade, one per required permit type."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["deal_id?", "state_profile_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: "LicenseTransfer[]"
    success_status: 200
    side_effects: []

  - method: POST
    path: /license-transfers/{id}/apply
    description: "Buyer files the permit transfer application. Also the retry edge out of DENIED, once the state's cooling-off period has elapsed."
    roles: [Buyer]
    input: [applied_on]
    output: LicenseTransfer
    success_status: 200
    side_effects:
      - "status NOT_STARTED or DENIED -> APPLIED; applied_on stored, attempt_count increments, decided_on and denial_reason_code cleared"
      - "processing_window_end = applied_on + StateLicenseProfile.transfer_processing_days"
      - "the CLOSED window plus a cooling_off_days gap must not collide with another live application of the same (buyer, state, permit_type) — §1.4 priority 46 ERR_LICENSE_WINDOW_CONFLICT"

  - method: POST
    path: /license-transfers/{id}/decide
    description: "Regulator decision on an APPLIED permit transfer."
    roles: [PlatformAdmin]
    input: [decision, decided_on, "denial_reason_code?"]
    output: LicenseTransfer
    success_status: 200
    side_effects:
      - "APPROVE -> status = APPROVED (terminal); DENY -> status = DENIED with denial_reason_code required"
      - "decided_on must be >= applied_on"
      - "when the last outstanding transfer of a deal reaches APPROVED or WAIVED the deal becomes closable (fork-join)"

  - method: POST
    path: /license-transfers/{id}/waive
    description: "Waive a permit on reciprocity grounds: the buyer already holds a licence in a state the profile recognises."
    roles: [Broker]
    input: [waiver_basis]
    output: LicenseTransfer
    success_status: 200
    side_effects:
      - "status = NOT_STARTED -> WAIVED (terminal); waiver_basis stored"
      - "requires Buyer.license_status == LICENSED and Buyer.state_code inside StateLicenseProfile.reciprocity_states, otherwise ERR_RECIPROCITY_NOT_AVAILABLE"

  # ---- attrition events (3) ------------------------------------------------

  - method: POST
    path: /attrition-events
    description: "Append one immutable post-close attrition fact to a deal's ledger. OCC site: expected_deal_version pins the ledger generation the reporter read (§1.2.1 attrition-append-stale-deal)."
    roles: [Broker, Buyer]
    input: [deal_id, account_id, event_type, effective_date, mrr_delta_cents, attributed_to, expected_deal_version]
    output: AttritionEvent
    success_status: 201
    side_effects:
      - "recorded_by_role is stamped from X-Role and the row is immutable (common_fields: false, no version, no PATCH)"
      - "CANCELLED drives the account TRANSFERRED -> LOST, DOWNGRADED keeps it TRANSFERRED with a reduced current_mrr_cents, RECOVERED drives LOST -> TRANSFERRED"
      - "HOP 2: the Deal ledger is recomputed by calculations.deal_attrition_ledger (attrited, retained, replacement, net, attrition_pct)"
      - "increments Deal.version by 1 as part of HOP 2, so the OCC parent generation advances on every accepted append"
      - "HOP 3: net_attrition_mrr_cents > allowance_mrr_cents flips clawback_status to CLAWBACK_TRIGGERED and sets the escrow's holdback_release_blocked = true"
      - "HOP 4: holdback_release_blocked clears the escrow's scheduled_holdback_release_utc so the holdback can only leave through a settlement"
      - "a stale expected_deal_version is ERR_STALE_DEAL_VERSION (412) and nothing is appended"
      - "an effective_date outside [guarantee_start_utc, guarantee_end_utc) is ERR_ATTRITION_OUTSIDE_GUARANTEE (§1.4 priority 49)"

  - method: GET
    path: /attrition-events/{id}
    description: "Read one attrition event."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: []
    output: AttritionEvent
    success_status: 200
    side_effects: []

  - method: GET
    path: /attrition-events
    description: "List attrition events, filterable by deal and by account."
    roles: [Broker, PlatformAdmin, Seller, Buyer]
    input: ["deal_id?", "account_id?", "event_type?", "attributed_to?", "limit?", "offset?"]
    output: "AttritionEvent[]"
    success_status: 200
    side_effects: []

  # ---- clawback settlements (6) --------------------------------------------

  - method: POST
    path: /clawback-settlements
    description: "Open a clawback settlement on a triggered deal, choosing between the replacement-cost remedy and the purchase-price-adjustment remedy. The two remedies are the domain's dual-variant calculation."
    roles: [Broker]
    input: [deal_id, remedy_basis, "escrow_id?"]
    output: ClawbackSettlement
    success_status: 201
    side_effects:
      - "status = DRAFT; computed_from_clock_utc = the logical clock"
      - "runs calculations.clawback_settlement on the chosen remedy_basis and stores the whole derivation: the three loss buckets, the replacement credit and its cap, the free allowance, the two compensable buckets, raw_adjustment_cents and the capped adjustment_cents"
      - "runs the settlement waterfall inside calculations.clawback_settlement to split adjustment_cents into from_holdback_cents, from_note_principal_cents and seller_direct_due_cents, plus holdback_release_to_seller_cents"
      - "requires Deal.clawback_status == CLAWBACK_TRIGGERED (§1.4 priority 56) and at most one live settlement per deal (60)"
      - "escrow_id is optional; when supplied it must resolve to the deal's own EscrowAccount, otherwise ERR_ESCROW_DEAL_MISMATCH (§1.4 priority 35)"

  - method: GET
    path: /clawback-settlements/{id}
    description: "Read one settlement with its full derivation and funding split."
    roles: [Broker, PlatformAdmin, Seller, Buyer, EscrowAgent]
    input: []
    output: ClawbackSettlement
    success_status: 200
    side_effects: []

  - method: GET
    path: /clawback-settlements
    description: "List settlements, filterable by deal."
    roles: [Broker, PlatformAdmin, Seller, Buyer, EscrowAgent]
    input: ["deal_id?", "remedy_basis?", "status?", "limit?", "offset?"]
    output: "ClawbackSettlement[]"
    success_status: 200
    side_effects: []

  - method: POST
    path: /clawback-settlements/{id}/propose
    description: "Put a number to the seller. Also the re-proposal edge out of DISPUTED, which recomputes against the ledger as it stands now."
    roles: [Broker]
    input: [adjustment_cents]
    output: ClawbackSettlement
    success_status: 200
    side_effects:
      - "status DRAFT or DISPUTED -> PROPOSED; the whole derivation is recomputed at proposal time and computed_from_clock_utc refreshed"
      - "the submitted adjustment_cents must equal the recomputed capped figure (§1.4 priority 57 ERR_SETTLEMENT_AMOUNT_MISMATCH)"
      - "the proposing user may not be a user who recorded any AttritionEvent on the deal (§1.4 priority 4)"

  - method: POST
    path: /clawback-settlements/{id}/dispute
    description: "Seller rejects the proposed number, sending the settlement back for recomputation. This is the settlement cycle."
    roles: [Seller]
    input: [dispute_reason_code]
    output: ClawbackSettlement
    success_status: 200
    side_effects:
      - "status = PROPOSED -> DISPUTED; dispute_reason_code stored"
      - "the escrow holdback stays blocked while the dispute is open"

  - method: POST
    path: /clawback-settlements/{id}/settle
    description: "Execute the settlement out of escrow, note principal and seller cash, and release whatever holdback survives to the seller."
    roles: [EscrowAgent]
    input: [adjustment_cents]
    output: ClawbackSettlement
    success_status: 200
    side_effects:
      - "status = PROPOSED -> SETTLED (terminal); settled_at_utc = the logical clock"
      - "the escrow pays from_holdback_cents against the adjustment and holdback_release_to_seller_cents to the seller; holdback_balance_cents -> 0 and status -> RELEASED"
      - "from_note_principal_cents reduces Deal.note_principal_cents; seller_direct_due_cents is owed by the seller in cash"
      - "the Deal moves CLOSED -> GUARANTEE_CLOSED once holdback_balance_cents reaches 0"
      - "X-User-ID == EscrowAccount.funded_by_user_id is ERR_SEGREGATION_OF_DUTIES (§1.4 priority 4)"

# =============================================================================
# §1.6 Error Code Catalog
#
# One row per distinct error_id in §1.4, in priority order. `condition` restates
# the §1.4 check as its negation, i.e. the state in which the error fires.
# `applies_to` mirrors §1.4. Every entry is reachable from empty-DB through the
# §1.5 surface alone; §1.9 pins a triggering call chain for each one.
# =============================================================================

errors:

  - id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    validation_priority: 1
    condition: "fires when it is NOT true that The X-Role request header is present, non-empty, and equal to one of PlatformAdmin, Broker, Seller, Buyer, EscrowAgent"
    applies_to: "all"

  - id: ERR_UNAUTHORIZED
    http_status: 403
    category: auth
    validation_priority: 2
    condition: "fires when it is NOT true that X-Role is listed in the endpoint's authorized_roles"
    applies_to: "all"

  - id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    category: auth
    validation_priority: 3
    condition: "fires when it is NOT true that For the entity_backed roles: when X-Role == Seller the X-User-ID header must equal the Seller.id that owns the addressed listing/account/deal; when X-Role == Buyer it must equal the Buyer.id on the addressed deal"
    applies_to: "all Seller-authorized and Buyer-authorized endpoints"

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: auth
    validation_priority: 4
    condition: "fires when it is NOT true that Segregation of duties, three clauses: (a) the X-User-ID that recorded any AttritionEvent on a deal may not propose that deal's ClawbackSettlement; (b) the X-User-ID that verified a ServiceAccount may not clear diligence on a deal covering that account; (c) the X-User-ID equal to EscrowAccount.funded_by_user_id may not release the holdback or settle a clawback out of that escrow"
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /deals/{id}/clear-diligence", "POST /escrow-accounts/{id}/holdback-releases", "POST /clawback-settlements/{id}/settle"]

  - id: ERR_VALIDATION
    http_status: 400
    category: business_constraint
    validation_priority: [5, 6]
    condition: "fires when it is NOT true that The request body contains every required field, no field has the wrong JSON type, every enum value is a member of its declared set, every *_cents field is an integer >= 0 (the one declared exception is AttritionEvent.mrr_delta_cents, which is signed: != 0, < 0 for CANCELLED/DOWNGRADED, > 0 for RECOVERED), every date/datetime field parses as ISO-8601 (dates as YYYY-MM-DD, datetimes with a trailing Z), and every scalar field satisfies the numeric range, string-length and date-ordering bound declared in its §1.1 field constraints"
    applies_to: "all write endpoints"

  - id: ERR_LISTING_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 7
    condition: "fires when it is NOT true that Every RouteListing id in the path or body resolves to an existing listing"
    applies_to: ["GET /route-listings/{id}", "PATCH /route-listings/{id}", "POST /route-listings/{id}/publish", "POST /route-listings/{id}/valuations", "POST /route-listings/{id}/withdraw", "POST /service-accounts", "POST /deals"]

  - id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 8
    condition: "fires when it is NOT true that Every ServiceAccount id in the path or body resolves to an existing account"
    applies_to: ["GET /service-accounts/{id}", "POST /service-accounts/{id}/verify", "POST /service-accounts/{id}/exclude", "POST /service-accounts/{id}/reinstate", "POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace", "POST /billing-history-records", "POST /attrition-events"]

  - id: ERR_DEAL_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 9
    condition: "fires when it is NOT true that Every Deal id in the path or body resolves to an existing deal"
    applies_to: ["GET /deals/{id}", "POST /deals/{id}/counter-offers", "POST /deals/{id}/offers", "POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing", "POST /deals/{id}/close", "POST /deals/{id}/terminate", "POST /attrition-events", "POST /clawback-settlements", "POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace"]

  - id: ERR_ESCROW_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 10
    condition: "fires when it is NOT true that Every EscrowAccount id in the path resolves to an existing escrow account"
    applies_to: ["GET /escrow-accounts/{id}", "POST /escrow-accounts/{id}/deposits", "POST /escrow-accounts/{id}/holdback-releases"]

  - id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 11
    condition: "fires when it is NOT true that Every ClawbackSettlement id in the path resolves to an existing settlement"
    applies_to: ["GET /clawback-settlements/{id}", "POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/dispute", "POST /clawback-settlements/{id}/settle"]

  - id: ERR_PARTY_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 12
    condition: "fires when it is NOT true that Every Seller id and Buyer id in a path or body resolves to an existing party"
    applies_to: ["GET /sellers/{id}", "GET /buyers/{id}", "POST /buyers/{id}/qualify", "POST /route-listings", "POST /deals"]

  - id: ERR_LICENSE_PROFILE_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 13
    condition: "fires when it is NOT true that The StateLicenseProfile id in the path resolves to an existing profile"
    applies_to: ["GET /state-license-profiles/{id}"]

  - id: ERR_LICENSE_TRANSFER_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 14
    condition: "fires when it is NOT true that The LicenseTransfer id in the path resolves to an existing transfer"
    applies_to: ["GET /license-transfers/{id}", "POST /license-transfers/{id}/apply", "POST /license-transfers/{id}/decide", "POST /license-transfers/{id}/waive"]

  - id: ERR_VALUATION_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 15
    condition: "fires when it is NOT true that The RouteValuation id in the path resolves to an existing valuation"
    applies_to: ["GET /route-valuations/{id}"]

  - id: ERR_BILLING_RECORD_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 16
    condition: "fires when it is NOT true that The BillingHistoryRecord id in the path resolves to an existing record"
    applies_to: ["GET /billing-history-records/{id}"]

  - id: ERR_ATTRITION_EVENT_NOT_FOUND
    http_status: 404
    category: existence
    validation_priority: 17
    condition: "fires when it is NOT true that The AttritionEvent id in the path resolves to an existing event"
    applies_to: ["GET /attrition-events/{id}"]

  - id: ERR_STALE_LISTING_VERSION
    http_status: 412
    category: state
    validation_priority: 18
    condition: "fires when it is NOT true that expected_listing_version equals the addressed RouteListing's current version"
    applies_to: ["POST /route-listings/{id}/valuations"]

  - id: ERR_STALE_DEAL_VERSION
    http_status: 412
    category: state
    validation_priority: 19
    condition: "fires when it is NOT true that expected_deal_version equals the referenced Deal's current version"
    applies_to: ["POST /attrition-events"]

  - id: ERR_LISTING_NOT_LISTED
    http_status: 409
    category: state
    validation_priority: 20
    condition: "fires when it is NOT true that The RouteListing is in LISTED for offer submission, and in DRAFT or LISTED for account and valuation writes"
    applies_to: ["POST /service-accounts", "POST /route-listings/{id}/valuations", "POST /deals"]

  - id: ERR_ACCOUNT_EXCLUDED
    http_status: 409
    category: state
    validation_priority: 21
    condition: "fires when it is NOT true that The addressed ServiceAccount is not EXCLUDED"
    applies_to: ["POST /service-accounts/{id}/verify", "POST /service-accounts/{id}/introduce", "POST /billing-history-records"]

  - id: ERR_ACCOUNT_NOT_INTRODUCIBLE
    http_status: 409
    category: state
    validation_priority: 22
    condition: "fires when it is NOT true that The addressed ServiceAccount has transfer_status == PENDING for introduce and == LOST for replace"
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace"]

  - id: ERR_DEAL_NOT_FUNDED
    http_status: 409
    category: state
    validation_priority: 23
    condition: "fires when it is NOT true that The Deal is in ESCROW_FUNDED"
    applies_to: ["POST /deals/{id}/close"]

  - id: ERR_INVALID_DEAL_TRANSITION
    http_status: 409
    category: state
    validation_priority: 24
    condition: "fires when it is NOT true that The requested Deal transition exists in the Deal state machine for the deal's current status"
    applies_to: ["POST /deals/{id}/counter-offers", "POST /deals/{id}/offers", "POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing"]

  - id: ERR_DEAL_TERMINAL
    http_status: 409
    category: state
    validation_priority: 25
    condition: "fires when it is NOT true that The Deal is not in a terminal status (CLOSED for offer edits, GUARANTEE_CLOSED or TERMINATED for anything)"
    applies_to: ["POST /deals/{id}/terminate", "POST /attrition-events", "POST /clawback-settlements", "POST /escrow-accounts/{id}/deposits"]

  - id: ERR_REPRICE_REQUIRED
    http_status: 409
    category: state
    validation_priority: 26
    condition: "fires when it is NOT true that The Deal is in REPRICE_REQUIRED only for counter; every other progression endpoint refuses that status"
    applies_to: ["POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing", "POST /deals/{id}/close"]

  - id: ERR_ESCROW_NOT_OPEN
    http_status: 409
    category: state
    validation_priority: 27
    condition: "fires when it is NOT true that The EscrowAccount is OPEN with deposits_blocked == false for a deposit, and PARTIALLY_RELEASED for a holdback release"
    applies_to: ["POST /escrow-accounts/{id}/deposits", "POST /escrow-accounts/{id}/holdback-releases"]

  - id: ERR_SETTLEMENT_NOT_PROPOSED
    http_status: 409
    category: state
    validation_priority: 28
    condition: "fires when it is NOT true that The ClawbackSettlement is DRAFT or DISPUTED for propose (a disputed settlement is re-proposed through the same endpoint), PROPOSED for dispute, and PROPOSED for settle"
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/dispute", "POST /clawback-settlements/{id}/settle"]

  - id: ERR_LICENSE_TRANSFER_NOT_PENDING
    http_status: 409
    category: state
    validation_priority: 29
    condition: "fires when it is NOT true that The LicenseTransfer is NOT_STARTED or DENIED for apply, APPLIED for decide, and NOT_STARTED for waive"
    applies_to: ["POST /license-transfers/{id}/apply", "POST /license-transfers/{id}/decide", "POST /license-transfers/{id}/waive"]

  - id: ERR_INVALID_LISTING_TRANSITION
    http_status: 409
    category: state
    validation_priority: 30
    condition: "fires when it is NOT true that The requested RouteListing transition exists for the listing's current status: publish only from DRAFT, withdraw only from DRAFT or LISTED, PATCH only from DRAFT or LISTED"
    applies_to: ["POST /route-listings/{id}/publish", "POST /route-listings/{id}/withdraw", "PATCH /route-listings/{id}"]

  - id: ERR_INVALID_ACCOUNT_TRANSITION
    http_status: 409
    category: state
    validation_priority: 31
    condition: "fires when it is NOT true that The requested ServiceAccount verification transition exists: exclude only from UNVERIFIED, VERIFIED or DISPUTED, reinstate only from EXCLUDED"
    applies_to: ["POST /service-accounts/{id}/exclude", "POST /service-accounts/{id}/reinstate"]

  - id: ERR_GUARANTEE_NOT_STARTED
    http_status: 409
    category: state
    validation_priority: 32
    condition: "fires when it is NOT true that The Deal has reached CLOSED or GUARANTEE_CLOSED before any AttritionEvent, replacement or ClawbackSettlement is written"
    applies_to: ["POST /attrition-events", "POST /service-accounts/{id}/replace", "POST /clawback-settlements"]

  - id: ERR_VALUATION_SUPERSEDED
    http_status: 409
    category: state
    validation_priority: 33
    condition: "fires when it is NOT true that The addressed RouteValuation is the deal's frozen VERIFIED_BASIS snapshot and has not been superseded"
    applies_to: ["POST /deals/{id}/clear-diligence"]

  - id: ERR_ACCOUNT_LISTING_MISMATCH
    http_status: 422
    category: business_referential
    validation_priority: 34
    condition: "fires when it is NOT true that The ServiceAccount's listing_id equals the Deal's listing_id"
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /attrition-events", "POST /service-accounts/{id}/replace"]

  - id: ERR_ESCROW_DEAL_MISMATCH
    http_status: 422
    category: business_referential
    validation_priority: 35
    condition: "fires when it is NOT true that When escrow_id is supplied on POST /clawback-settlements it resolves to an EscrowAccount whose deal_id equals the addressed deal, and the escrow that a close, holdback release or settlement draw resolves belongs to the Deal being processed"
    applies_to: ["POST /clawback-settlements", "POST /escrow-accounts/{id}/holdback-releases", "POST /clawback-settlements/{id}/settle"]

  - id: ERR_VERIFIED_VALUATION_MISSING
    http_status: 422
    category: business_referential
    validation_priority: 36
    condition: "fires when it is NOT true that A RouteValuation with basis == VERIFIED_BASIS exists for the deal's listing and was computed at or after the deal's created_at"
    applies_to: ["POST /deals/{id}/clear-diligence"]

  - id: ERR_STATE_PROFILE_MISSING
    http_status: 422
    category: business_referential
    validation_priority: 37
    condition: "fires when it is NOT true that A StateLicenseProfile row exists for the listing's state_code, and the LicenseTransfer's permit_type is a member of that profile's required_permit_types"
    applies_to: ["POST /route-listings/{id}/publish"]

  - id: ERR_LICENSE_NOT_TRANSFERRED
    http_status: 422
    category: business_safety
    validation_priority: 38
    condition: "fires when it is NOT true that Every LicenseTransfer required for the deal (one per required_permit_types entry of the listing's state profile) is in APPROVED or WAIVED"
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /deals/{id}/close"]

  - id: ERR_BUYER_NOT_QUALIFIED
    http_status: 422
    category: business_safety
    validation_priority: 39
    condition: "fires when it is NOT true that The Deal's Buyer has qualification_status == APPROVED"
    applies_to: ["POST /deals", "POST /deals/{id}/accept"]

  - id: ERR_VERIFIED_MRR_SHORTFALL
    http_status: 422
    category: business_safety
    validation_priority: 40
    condition: "fires when it is NOT true that The listing's fresh VERIFIED_BASIS recurring_mrr_cents is >= round_half_up(MIN_VERIFIED_RATIO * RouteListing.listed_mrr_cents)"
    applies_to: ["POST /deals/{id}/clear-diligence"]

  - id: ERR_INSUFFICIENT_BILLING_HISTORY
    http_status: 422
    category: business_safety
    validation_priority: 41
    condition: "fires when it is NOT true that The account has at least VERIFICATION_TRAILING_MONTHS distinct BANK_VERIFIED BillingHistoryRecord months inside the trailing window"
    applies_to: ["POST /service-accounts/{id}/verify"]

  - id: ERR_NO_VALUATION_INPUTS
    http_status: 422
    category: business_safety
    validation_priority: 42
    condition: "fires when it is NOT true that The valuation input set is non-empty for the requested basis"
    applies_to: ["POST /route-listings/{id}/valuations"]

  - id: ERR_COVENANT_TERMS_INSUFFICIENT
    http_status: 422
    category: business_safety
    validation_priority: 43
    condition: "fires when it is NOT true that Deal.retention_guarantee_days is between 60 and 365 inclusive at acceptance, so the retention guarantee and the derived seller non-solicitation period are both long enough to be meaningful"
    applies_to: ["POST /deals/{id}/accept"]

  - id: ERR_REPLACEMENT_TARGET_INVALID
    http_status: 422
    category: business_safety
    validation_priority: 44
    condition: "fires when it is NOT true that The replacement account's claimed_recurring_mrr_cents is > 0 and its route_day equals the replaced account's route_day"
    applies_to: ["POST /service-accounts/{id}/replace"]

  - id: ERR_LISTING_EXCLUSIVITY_OVERLAP
    http_status: 409
    category: business_temporal
    validation_priority: 45
    condition: "fires when it is NOT true that The listing's [exclusive_start_date, exclusive_end_date) half-open interval does not overlap any other non-WITHDRAWN listing for the same (seller_id, region_code)"
    applies_to: ["POST /route-listings", "PATCH /route-listings/{id}", "POST /route-listings/{id}/publish"]

  - id: ERR_LICENSE_WINDOW_CONFLICT
    http_status: 409
    category: business_temporal
    validation_priority: 46
    condition: "fires when it is NOT true that The licence application's [applied_on, processing_window_end] CLOSED interval does not overlap, and does not sit within the state profile's cooling_off_days of, any other non-CANCELLED LicenseTransfer for the same (buyer, state_code, permit_type) triple"
    applies_to: ["POST /license-transfers/{id}/apply"]

  - id: ERR_INTRODUCTION_WINDOW_CLOSED
    http_status: 422
    category: business_temporal
    validation_priority: 47
    condition: "fires when it is NOT true that The logical clock is inside the half-open window [Deal.accepted_on 00:00:00Z, Deal.accepted_on 00:00:00Z + INTRO_WINDOW_DAYS)"
    applies_to: ["POST /service-accounts/{id}/introduce"]

  - id: ERR_INTRODUCTION_LIMIT_REACHED
    http_status: 422
    category: business_temporal
    validation_priority: 48
    condition: "fires when it is NOT true that At most MAX_INTRODUCTIONS_PER_DATE accounts of the same deal may be introduced with the same introduced_on date"
    applies_to: ["POST /service-accounts/{id}/introduce"]

  - id: ERR_ATTRITION_OUTSIDE_GUARANTEE
    http_status: 422
    category: business_temporal
    validation_priority: 49
    condition: "fires when it is NOT true that The AttritionEvent's effective_date falls inside the half-open window [Deal.guarantee_start_utc, Deal.guarantee_end_utc)"
    applies_to: ["POST /attrition-events"]

  - id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    category: business_temporal
    validation_priority: 50
    condition: "fires when it is NOT true that A BillingHistoryRecord's period_month is strictly before the logical clock's own month"
    applies_to: ["POST /billing-history-records"]

  - id: ERR_ESCROW_UNDERFUNDED
    http_status: 422
    category: business_fiscal
    validation_priority: 51
    condition: "fires when it is NOT true that EscrowAccount.funded_amount_cents >= EscrowAccount.target_amount_cents"
    applies_to: ["POST /deals/{id}/close"]

  - id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http_status: 422
    category: business_fiscal
    validation_priority: 52
    condition: "fires when it is NOT true that Deal.down_payment_cents >= round_half_up(current_offer_price_cents * MIN_DOWN_PCT[financing_type])"
    applies_to: ["POST /deals/{id}/accept"]

  - id: ERR_BUYER_PREQUAL_EXCEEDED
    http_status: 422
    category: business_fiscal
    validation_priority: 53
    condition: "fires when it is NOT true that Deal.current_offer_price_cents <= Buyer.prequalified_amount_cents"
    applies_to: ["POST /deals", "POST /deals/{id}/offers", "POST /deals/{id}/counter-offers"]

  - id: ERR_COUNTER_NOT_IMPROVED
    http_status: 422
    category: business_fiscal
    validation_priority: 54
    condition: "fires when it is NOT true that A COUNTERED offer strictly improves on the standing price in the counterparty's direction: a Seller counter must be > current_offer_price_cents, a Buyer counter must be < it"
    applies_to: ["POST /deals/{id}/counter-offers", "POST /deals/{id}/offers"]

  - id: ERR_ESCROW_OVERFUNDED
    http_status: 422
    category: business_fiscal
    validation_priority: 55
    condition: "fires when it is NOT true that deposit_amount_cents does not push funded_amount_cents above target_amount_cents"
    applies_to: ["POST /escrow-accounts/{id}/deposits"]

  - id: ERR_NO_CLAWBACK_DUE
    http_status: 422
    category: business_fiscal
    validation_priority: 56
    condition: "fires when it is NOT true that The deal's clawback_status is CLAWBACK_TRIGGERED"
    applies_to: ["POST /clawback-settlements"]

  - id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    category: business_fiscal
    validation_priority: 57
    condition: "fires when it is NOT true that The proposed adjustment_cents equals the recomputed capped adjustment for the settlement's remedy_basis and is <= Deal.clawback_cap_cents"
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/settle"]

  - id: ERR_HOLDBACK_NOT_RELEASABLE
    http_status: 422
    category: business_fiscal
    validation_priority: 58
    condition: "fires when it is NOT true that For a holdback release the logical clock is at or after EscrowAccount.scheduled_holdback_release_utc, and that field is non-null, and EscrowAccount.holdback_release_blocked == false"
    applies_to: ["POST /escrow-accounts/{id}/holdback-releases"]

  - id: ERR_DUPLICATE_BILLING_PERIOD
    http_status: 409
    category: business_constraint
    validation_priority: 59
    condition: "fires when it is NOT true that (account_id, period_month, source) is unique across BillingHistoryRecord"
    applies_to: ["POST /billing-history-records"]

  - id: ERR_DUPLICATE_ACTIVE_SETTLEMENT
    http_status: 409
    category: business_constraint
    validation_priority: 60
    condition: "fires when it is NOT true that At most one ClawbackSettlement per deal is in DRAFT, PROPOSED or DISPUTED"
    applies_to: ["POST /clawback-settlements"]

  - id: ERR_INTRODUCTIONS_INCOMPLETE
    http_status: 422
    category: business_constraint
    validation_priority: 61
    condition: "fires when it is NOT true that Every non-EXCLUDED ServiceAccount of the deal's listing has transfer_status == INTRODUCED or TRANSFERRED"
    applies_to: ["POST /deals/{id}/close"]

  - id: ERR_INTRODUCTION_OUT_OF_SEQUENCE
    http_status: 422
    category: business_constraint
    validation_priority: 62
    condition: "fires when it is NOT true that The account being introduced is the head of the introduction queue produced by calculations.introduction_sequence_selector"
    applies_to: ["POST /service-accounts/{id}/introduce"]

  - id: ERR_REPLACEMENT_DEADLINE_PASSED
    http_status: 422
    category: business_constraint
    validation_priority: 63
    condition: "fires when it is NOT true that The logical clock is at or before Deal.replacement_deadline_utc"
    applies_to: ["POST /service-accounts/{id}/replace"]

  - id: ERR_CLOCK_REWIND
    http_status: 422
    category: business_constraint
    validation_priority: 64
    condition: "fires when it is NOT true that The logical clock may only move forward: the requested current_utc is >= the current clock value"
    applies_to: ["POST /_clock/set_current_utc"]

  - id: ERR_SELLER_SUSPENDED
    http_status: 422
    category: business_referential
    validation_priority: 65
    condition: "fires when it is NOT true that The listing's Seller has status == ACTIVE"
    applies_to: ["POST /route-listings/{id}/publish", "POST /route-listings/{id}/valuations", "POST /deals/{id}/accept", "POST /service-accounts/{id}/introduce"]

  - id: ERR_INVALID_BUYER_TRANSITION
    http_status: 409
    category: business_referential
    validation_priority: 66
    condition: "fires when it is NOT true that The Buyer's qualification_status is PENDING when POST /buyers/{id}/qualify is called"
    applies_to: ["POST /buyers/{id}/qualify"]

  - id: ERR_FINANCING_SPLIT_MISMATCH
    http_status: 422
    category: business_fiscal
    validation_priority: 67
    condition: "fires when it is NOT true that down_payment_cents + note_principal_cents == the offer price the same request establishes (offer_price_cents on POST /deals and POST /deals/{id}/offers, current_offer_price_cents at acceptance)"
    applies_to: ["POST /deals", "POST /deals/{id}/offers", "POST /deals/{id}/accept"]

  - id: ERR_DUPLICATE_STATE_PROFILE
    http_status: 409
    category: business_constraint
    validation_priority: 68
    condition: "fires when it is NOT true that state_code is unique across StateLicenseProfile"
    applies_to: ["POST /state-license-profiles"]

  - id: ERR_RECIPROCITY_NOT_AVAILABLE
    http_status: 422
    category: business_referential
    validation_priority: 69
    condition: "fires when it is NOT true that For a reciprocity waiver the Buyer.license_status == LICENSED and Buyer.state_code is a member of the LicenseTransfer's StateLicenseProfile.reciprocity_states"
    applies_to: ["POST /license-transfers/{id}/waive"]

  - id: ERR_LISTING_NOT_PUBLISHABLE
    http_status: 422
    category: business_safety
    validation_priority: 70
    condition: "fires when it is NOT true that At publication the RouteListing has claimed_account_count >= 1 and at least one RouteValuation with basis == LISTED_BASIS and is_superseded == false"
    applies_to: ["POST /route-listings/{id}/publish"]

# =============================================================================
# §1.7 RBAC Permission Matrix
#
# role_model: segregation_of_duties layered over peer_roles.
#   * X-Role names the role, X-User-ID names the human.
#   * Seller and Buyer are peer roles: each is entity-backed and can only touch
#     the listings / deals its own X-User-ID owns (§1.4 priority 3).
#   * Broker and PlatformAdmin are opaque staff roles with no ownership scope.
#   * EscrowAgent is opaque but its *identity* is load-bearing: the agent who
#     funded an escrow may not release its holdback or settle a clawback out of
#     it, and the user who verified an account may not clear diligence on the
#     deal covering it, and the user who logged an attrition event may not
#     propose that deal's settlement (§1.4 priority 4).
#   * There is no hierarchical override: PlatformAdmin cannot accept a deal on
#     a seller's behalf, and Broker cannot deposit into escrow.
# =============================================================================

roles:

  - name: PlatformAdmin
    description: "Platform operator. Seeds the state licensing regimes, drives the deterministic clock, and stands in for the state regulator when deciding permit applications."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /state-license-profiles"
      - "POST /sellers/{id}/suspend"
      - "POST /license-transfers/{id}/decide"
    shared_operations:
      - "POST /sellers, POST /buyers, POST /buyers/{id}/qualify (with Broker)"
      - "every GET in the API"

  - name: Broker
    description: "The route brokerage. Owns the listing lifecycle, the account list, valuations, due diligence, closing and the clawback proposal."
    identity: opaque
    exclusive_operations:
      - "POST /route-listings"
      - "PATCH /route-listings/{id}"
      - "POST /route-listings/{id}/publish"
      - "POST /route-listings/{id}/valuations"
      - "POST /service-accounts"
      - "POST /service-accounts/{id}/verify"
      - "POST /service-accounts/{id}/exclude"
      - "POST /service-accounts/{id}/reinstate"
      - "POST /deals/{id}/clear-diligence"
      - "POST /deals/{id}/approve-financing"
      - "POST /deals/{id}/close"
      - "POST /license-transfers/{id}/waive"
      - "POST /clawback-settlements"
      - "POST /clawback-settlements/{id}/propose"
    shared_operations:
      - "POST /sellers, POST /buyers, POST /buyers/{id}/qualify (with PlatformAdmin)"
      - "POST /deals (with Buyer)"
      - "POST /route-listings/{id}/withdraw (with Seller)"
      - "POST /service-accounts/{id}/introduce, POST /service-accounts/{id}/replace (with Seller)"
      - "POST /attrition-events (with Buyer)"
      - "POST /deals/{id}/terminate (with Seller and Buyer)"
      - "every GET in the API"

  - name: Seller
    description: "The route owner. Negotiates upward, accepts, hands the customers over, and carries the retention guarantee."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /deals/{id}/counter-offers"
      - "POST /deals/{id}/accept"
      - "POST /clawback-settlements/{id}/dispute"
    shared_operations:
      - "POST /route-listings/{id}/withdraw (with Broker)"
      - "POST /service-accounts/{id}/introduce, POST /service-accounts/{id}/replace (with Broker)"
      - "POST /billing-history-records (with Broker)"
      - "POST /deals/{id}/terminate (with Broker and Buyer)"
      - "GET on its own sellers, listings, accounts, valuations, deals, escrow, licences, attrition events and settlements"

  - name: Buyer
    description: "The route purchaser. Negotiates downward, files the permit transfers, funds through the escrow agent, and reports post-close attrition."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /deals/{id}/offers"
      - "POST /license-transfers/{id}/apply"
    shared_operations:
      - "POST /deals (with Broker)"
      - "POST /attrition-events (with Broker)"
      - "POST /deals/{id}/terminate (with Broker and Seller)"
      - "GET on its own buyer record, deals, escrow, licences, attrition events and settlements, plus listing and account reads"

  - name: EscrowAgent
    description: "Neutral third party holding the buyer's funds. Deposits, holdback releases and settlement execution are its exclusive operations, and its identity is checked for segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /escrow-accounts/{id}/deposits"
      - "POST /escrow-accounts/{id}/holdback-releases"
      - "POST /clawback-settlements/{id}/settle"
    shared_operations:
      - "GET /escrow-accounts/{id}, GET /escrow-accounts, GET /clawback-settlements/{id}, GET /clawback-settlements, GET /_clock"
