        grounds:
          - state_machines.StaffingAssignment.ACTIVE_to_CANCELLED
          - state_machines.Clinic.OPEN_to_CLOSED
          - state_machines.QueueEntry.WAITING_to_DEFERRED_CLOSURE
          - state_machines.Visit.SCREENING_to_CANCELLED_CLOSURE
