# =============================================================================
# SCAFFOLD.yaml — task_1207_theatrical_rights_licensing
# Theatrical Rights Licensing (amateur & stock)
# =============================================================================

scenario: |
  1207. Theatrical Rights Licensing (amateur & stock): title catalog &
  availability by territory/restriction, application review & professional/
  amateur classification, royalty calculation per performance & house size,
  perusal & material rental (scripts/scores) with deposit, restricted material
  & alteration prohibition enforcement, cast recording/streaming rights add-on,
  license amendment & cancellation, overdue material & fine.

domain_name: theatrical-rights-licensing
api_prefix: /licensing

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate
  difficulty_tier: harder_than_expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Title of the play/musical" }
      - { name: author, type: string, source: input, description: "Playwright / composer" }
      - { name: title_kind, type: enum, source: input, description: "PLAY | MUSICAL | MUSICAL_WITH_SCORE", constraints: "enum" }
      - { name: royalty_basis, type: enum, source: input, description: "PER_PERFORMANCE | GROSS_PERCENT | HYBRID", constraints: "enum" }
      - { name: base_flat_fee_cents, type: integer, source: input, description: "Base flat fee per performance (PER_PERFORMANCE and HYBRID)" }
      - { name: gross_percent_bp, type: integer, source: input, description: "Royalty basis points of gross (GROSS_PERCENT and HYBRID); 1 bp = 0.01%" }
      - { name: restricted_material, type: boolean, source: input, description: "True when script/score is restricted and alterations are prohibited by default" }
      - { name: perusal_fee_cents, type: integer, source: input, description: "Fee for a perusal copy of script/score" }
      - { name: rental_deposit_cents, type: integer, source: input, description: "Refundable deposit per MaterialRental" }
      - { name: late_fee_per_day_cents, type: integer, source: input, description: "Standard overdue fee per day for this title's materials" }
      - { name: restricted_late_fee_per_day_cents, type: integer, source: input, description: "Overdue fee per day when restricted_material is true (supersedes late_fee_per_day_cents)" }
      - { name: recording_royalty_flat_cents, type: integer, source: input, description: "Flat royalty for a cast-recording grant on this title" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN", constraints: "enum; initial ACTIVE" }

  - name: TerritoryRestriction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; restricted title" }
      - { name: territory_code, type: string, source: input, description: "ISO-style territory code this restriction covers (e.g., US-CA, GB-LON)" }
      - { name: restriction_kind, type: enum, source: input, description: "BLACKOUT | EXCLUSIVE_RUN | PRO_TOUR_OVERLAP", constraints: "enum" }
      - { name: window_start, type: datetime, source: input, description: "Restriction window start (inclusive, closed interval)" }
      - { name: window_end, type: datetime, source: input, description: "Restriction window end (inclusive, closed interval)" }
      - { name: blocks_classification, type: enum, source: input, description: "AMATEUR | PROFESSIONAL | BOTH", constraints: "enum" }
      - { name: active, type: boolean, source: system, description: "True unless explicitly lifted" }

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; also X-User-ID for Applicant role" }
      - { name: legal_name, type: string, source: input, description: "Organization legal name" }
      - { name: org_kind, type: enum, source: input, description: "SCHOOL | COMMUNITY | SEMI_PRO | PROFESSIONAL_COMPANY", constraints: "enum" }
      - { name: home_territory_code, type: string, source: input, description: "Organization's home territory" }
      - { name: standing, type: enum, source: system, description: "GOOD | SUSPENDED", constraints: "enum; initial GOOD" }

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; requested title" }
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id; applicant" }
      - { name: requested_territory_code, type: string, source: input, description: "Territory where performances will occur" }
      - { name: requested_classification, type: enum, source: input, description: "AMATEUR | PROFESSIONAL — applicant's self-declaration", constraints: "enum" }
      - { name: venue_seating_capacity, type: integer, source: input, description: "Declared house size (seats)" }
      - { name: ticket_top_price_cents, type: integer, source: input, description: "Highest advertised single-ticket price" }
      - { name: performers_compensated, type: boolean, source: input, description: "True if any cast member is paid" }
      - { name: admission_charged, type: boolean, source: input, description: "True if any ticket is sold" }
      - { name: projected_gross_cents, type: integer, source: input, description: "Applicant-projected total box-office gross across all performances" }
      - { name: performance_count, type: integer, source: input, description: "Declared number of performances" }
      - { name: first_performance_date, type: datetime, source: input, description: "First requested performance date" }
      - { name: last_performance_date, type: datetime, source: input, description: "Last requested performance date" }
      - { name: determined_classification, type: enum, source: computed, description: "AMATEUR | PROFESSIONAL — computed by classification_rule at review time", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | RETURNED_FOR_INFO | APPROVED | REJECTED", constraints: "enum" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of latest submission" }
      - { name: review_round, type: integer, source: system, description: "Number of SUBMITTED->UNDER_REVIEW cycles completed; starts 0" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: application_id, type: string, source: system, description: "FK -> LicenseApplication.id; originating application" }
      - { name: title_id, type: string, source: system, description: "FK -> Title.id (copied from application)" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id (copied from application)" }
      - { name: territory_code, type: string, source: system, description: "Licensed territory (copied from application)" }
      - { name: classification, type: enum, source: system, description: "AMATEUR | PROFESSIONAL — copied from application.determined_classification at approval", constraints: "enum" }
      - { name: house_seating_capacity, type: integer, source: system, description: "House size licensed (copied from application)" }
      - { name: contracted_performance_count, type: integer, source: system, description: "Contracted performances" }
      - { name: window_start, type: datetime, source: system, description: "Licensed window start (copied)" }
      - { name: window_end, type: datetime, source: system, description: "Licensed window end (copied)" }
      - { name: royalty_mode, type: enum, source: system, description: "QUOTED | SETTLED — drives which royalty variant is applied", constraints: "enum; initial QUOTED" }
      - { name: quoted_royalty_total_cents, type: integer, source: computed, description: "Royalty total at issuance (QUOTED variant over projected figures)" }
      - { name: settled_royalty_total_cents, type: integer, source: computed, description: "Royalty total after all performance reports (SETTLED variant over actual figures); null until completion" }
      - { name: royalty_balance_cents, type: integer, source: computed, description: "Amount still owed; decremented by RoyaltyPayment" }
      - { name: license_status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | COMPLETED | CANCELLED | BREACHED", constraints: "enum" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIALLY_PAID | PAID_IN_FULL | REFUNDED", constraints: "enum; parallel dimension" }
      - { name: amendment_seq, type: integer, source: system, description: "Number of applied amendments; starts 0" }
      - { name: supersedes_agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id; set when this agreement supersedes a prior one via amendment-with-reissue; null otherwise" }

  - name: Performance
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: performance_at, type: datetime, source: input, description: "Scheduled performance datetime" }
      - { name: reported_attendance, type: integer, source: input, description: "Actual attendance reported after the fact; 0 until reported" }
      - { name: reported_gross_cents, type: integer, source: input, description: "Actual box-office gross reported; 0 until reported" }
      - { name: gross_reported, type: boolean, source: system, description: "True once a post-performance gross report has been filed" }
      - { name: royalty_cents, type: integer, source: computed, description: "Per-performance royalty computed for this performance" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED", constraints: "enum; initial SCHEDULED" }

  - name: MaterialRental
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; rental tied to an ACTIVE agreement" }
      - { name: scripts_qty, type: integer, source: input, description: "Number of script copies" }
      - { name: scores_qty, type: integer, source: input, description: "Number of score copies; must be 0 for title_kind=PLAY" }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit held = title.rental_deposit_cents (flat per rental)" }
      - { name: deposit_status, type: enum, source: system, description: "HELD | RETURNED | FORFEITED | PARTIALLY_FORFEITED", constraints: "enum; initial HELD" }
      - { name: due_date, type: datetime, source: input, description: "Return-by date" }
      - { name: returned_at, type: datetime, source: system, description: "Actual return timestamp; null until RETURNED" }
      - { name: accrued_late_fee_cents, type: integer, source: computed, description: "Late fee accrued (0 until overdue/return calculation runs)" }
      - { name: status, type: enum, source: system, description: "RESERVED | SHIPPED | RECEIVED | RETURN_IN_TRANSIT | RETURNED | OVERDUE | LOST", constraints: "enum; initial RESERVED" }

  - name: AlterationRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: alteration_kind, type: enum, source: input, description: "CUT | GENDER_SWAP | TEXT_CHANGE | STAGING_CHANGE | TRANSLATION", constraints: "enum" }
      - { name: description, type: string, source: input, description: "Free-text description of requested alteration" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED", constraints: "enum; initial SUBMITTED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding RightsAdmin" }

  - name: RecordingGrant
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: grant_kind, type: enum, source: input, description: "CAST_RECORDING_AUDIO | STREAMING_VIDEO | ARCHIVAL_VIDEO", constraints: "enum" }
      - { name: distribution_scope, type: enum, source: input, description: "CAST_CREW_ONLY | PAYWALL | PUBLIC_FREE", constraints: "enum" }
      - { name: recording_royalty_cents, type: integer, source: computed, description: "Royalty due for this grant per recording_royalty_rule" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | EXERCISED | REVOKED", constraints: "enum; initial REQUESTED" }

  - name: RoyaltyPayment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount applied to royalty balance" }
      - { name: paid_at, type: datetime, source: system, description: "Payment timestamp" }

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; fined organization" }
      - { name: rental_id, type: string, source: system, description: "FK -> MaterialRental.id; null for breach fines" }
      - { name: agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id; null when fine is purely rental-related" }
      - { name: fine_kind, type: enum, source: system, description: "OVERDUE_MATERIAL | UNAUTHORIZED_ALTERATION | UNAUTHORIZED_RECORDING | LOSS", constraints: "enum" }
      - { name: amount_cents, type: integer, source: computed, description: "Fine amount (computed by fine rule)" }
      - { name: status, type: enum, source: system, description: "ASSESSED | PAID | WAIVED | WRITTEN_OFF", constraints: "enum; initial ASSESSED" }

  - name: AvailabilitySnapshot
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: title_id, type: string, source: system, description: "FK -> Title.id" }
      - { name: territory_code, type: string, source: system, description: "Territory evaluated" }
      - { name: classification, type: enum, source: system, description: "AMATEUR | PROFESSIONAL", constraints: "enum" }
      - { name: window_start, type: datetime, source: system, description: "Requested window start" }
      - { name: window_end, type: datetime, source: system, description: "Requested window end" }
      - { name: available, type: boolean, source: computed, description: "Computed availability verdict" }
      - { name: blocking_restriction_ids, type: array, source: computed, description: "TerritoryRestriction ids that block; empty when available" }
      - { name: blocking_agreement_ids, type: array, source: computed, description: "Exclusive-run LicenseAgreement ids that block; empty when available" }
      - { name: computed_at, type: datetime, source: system, description: "When the snapshot was computed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LicenseApplication
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/applications/{application_id}/submit"
        actor: Applicant
        preconditions:
          - "Application.organization_id == X-User-ID"
          - "All required application fields present"
        side_effects:
          - "submitted_at set to current clock"
          - "AvailabilitySnapshot computed and persisted for (title, requested_territory, requested_classification, requested window)"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /licensing/applications/{application_id}/begin_review"
        actor: LicensingOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "review_round incremented by 1"

      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /licensing/applications/{application_id}/return_for_info"
        actor: LicensingOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects: []
        note: "cycle back — applicant edits and resubmits"

      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /licensing/applications/{application_id}/submit (resubmission)"
        actor: Applicant
        preconditions:
          - "status == RETURNED_FOR_INFO"
        side_effects:
          - "submitted_at refreshed"
          - "AvailabilitySnapshot recomputed"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /licensing/applications/{application_id}/approve"
        actor: LicensingOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "Latest AvailabilitySnapshot for this application has available == true (else ERR_TITLE_UNAVAILABLE)"
          - "No active TerritoryRestriction covers (requested_territory_code, requested window) with blocks_classification IN {determined_classification, BOTH} (else ERR_TERRITORY_RESTRICTED)"
          - "No other LicenseAgreement with license_status == ACTIVE on same title_id covering an overlapping window in the same territory where that agreement holds exclusive run rights (else ERR_EXCLUSIVE_RUN_CONFLICT)"
        side_effects:
          - "determined_classification persisted"
          - "LicenseAgreement created: license_status=PENDING_PAYMENT, payment_status=UNPAID, royalty_mode=QUOTED, quoted_royalty_total_cents computed via performance_royalty (QUOTED variant), royalty_balance_cents = quoted_royalty_total_cents"
          - "LicenseAgreement.version starts at 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /licensing/applications/{application_id}/reject"
        actor: LicensingOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects: []

  - entity: LicenseAgreement
    field: license_status
    initial_state: PENDING_PAYMENT
    terminal_states: [COMPLETED, CANCELLED, BREACHED]
    note: "Two parallel state dimensions: license_status × payment_status. They evolve independently except where transitions below pin them together."
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreement_id}/activate"
        actor: RightsAdmin
        preconditions:
          - "license_status == PENDING_PAYMENT"
          - "payment_status == PAID_IN_FULL OR a RoyaltyPayment exists covering >= 50% of quoted_royalty_total_cents (partial-payment activation rule: royalty_balance_cents <= ceil(quoted_royalty_total_cents / 2))"
        side_effects:
          - "license_status = ACTIVE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system — fires when every Performance with agreement_id == this id has status IN {HELD, CANCELLED} AND gross_reported == true for every HELD performance AND last Performance.performance_at < current clock"
        actor: system
        preconditions:
          - "All performances terminal (HELD or CANCELLED)"
          - "All HELD performances have gross_reported == true"
          - "Current clock > window_end"
        side_effects:
          - "royalty_mode switched to SETTLED"
          - "settled_royalty_total_cents computed via performance_royalty (SETTLED variant) over all HELD performances"
          - "royalty_balance_cents recomputed as settled_royalty_total_cents - sum(RoyaltyPayment.amount_cents)"
          - "If royalty_balance_cents < 0, overage is refunded and payment_status set to REFUNDED"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /licensing/agreements/{agreement_id}/cancel"
        actor: RightsAdmin
        preconditions:
          - "license_status == ACTIVE"
          - "No Performance with status == HELD exists for this agreement (else ERR_PERFORMANCE_ALREADY_HELD)"
        side_effects:
          - "All Performance rows for agreement -> CANCELLED"
          - "All MaterialRental rows with status IN {RESERVED, SHIPPED, RECEIVED, RETURN_IN_TRANSIT} -> OVERDUE handling skipped, deposit_status -> RETURNED if no late fee, else remains HELD pending fine settlement; rentals already OVERDUE stay OVERDUE"
          - "All RecordingGrant rows with status IN {REQUESTED, APPROVED} -> REVOKED"
          - "All AlterationRequest rows with status == SUBMITTED -> DENIED"
          - "Payment refunds per cancellation_refund_rule; payment_status -> REFUNDED when full royalty was returned"

      - from: ACTIVE
        to: BREACHED
        trigger: "POST /licensing/agreements/{agreement_id}/declare_breach"
        actor: RightsAdmin
        preconditions:
          - "license_status == ACTIVE"
          - "breach reason supplied (unauthorized alteration observed, unauthorized recording distributed, or performance outside licensed window)"
        side_effects:
          - "Fine created: fine_kind mapped from breach reason (UNAUTHORIZED_ALTERATION or UNAUTHORIZED_RECORDING), amount via breach_fine_rule, status=ASSESSED"
          - "Organization.standing -> SUSPENDED until fine resolved"
          - "All RecordingGrant rows -> REVOKED"
          - "Performances with status == SCHEDULED -> CANCELLED"

  - entity: LicenseAgreement_payment
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID_IN_FULL, REFUNDED]
    note: "Parallel dimension on LicenseAgreement; independent from license_status."
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /licensing/agreements/{agreement_id}/payments (when 0 < cumulative paid < royalty_balance_before_payment)"
        actor: FinanceOfficer
        preconditions:
          - "agreement.license_status NOT IN {CANCELLED, BREACHED}"
        side_effects:
          - "RoyaltyPayment row appended"
          - "royalty_balance_cents decremented by amount_cents"

      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /licensing/agreements/{agreement_id}/payments (further partial)"
        actor: FinanceOfficer
        preconditions:
          - "agreement.license_status NOT IN {CANCELLED, BREACHED}"
        side_effects:
          - "RoyaltyPayment row appended"
          - "royalty_balance_cents decremented by amount_cents"

      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID_IN_FULL
        trigger: "POST /licensing/agreements/{agreement_id}/payments (when cumulative paid >= royalty_balance_before_payment)"
        actor: FinanceOfficer
        preconditions:
          - "agreement.license_status NOT IN {CANCELLED, BREACHED}"
        side_effects:
          - "RoyaltyPayment row appended"
          - "royalty_balance_cents set to 0"

      - from: [UNPAID, PARTIALLY_PAID, PAID_IN_FULL]
        to: REFUNDED
        trigger: "system — on LicenseAgreement CANCELLED with refund_issued == true, or on COMPLETED with negative settled balance"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Performance
    field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /licensing/performances/{performance_id}/report"
        actor: Applicant
        preconditions:
          - "status == SCHEDULED"
          - "agreement.license_status == ACTIVE"
          - "current clock >= performance_at (report cannot precede the performance)"
          - "Organization.standing == GOOD"
        side_effects:
          - "gross_reported = true; reported_attendance and reported_gross_cents persisted"
          - "royalty_cents computed via performance_royalty (SETTLED variant for this single performance)"
          - "agreement.version incremented (cascade side effect)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /licensing/performances/{performance_id}/cancel"
        actor: Applicant
        preconditions:
          - "status == SCHEDULED"
          - "agreement.license_status == ACTIVE"
        side_effects:
          - "royalty_cents recomputed via performance_royalty with performance excluded from contracted count if agreement still QUOTED (no refund of already-quoted royalty until completion or cancellation)"

  - entity: MaterialRental
    field: status
    initial_state: RESERVED
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /licensing/rentals/{rental_id}/ship"
        actor: MaterialsClerk
        preconditions:
          - "status == RESERVED"
          - "agreement.license_status == ACTIVE"
          - "deposit_cents received (deposit_status == HELD)"
        side_effects: []

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /licensing/rentals/{rental_id}/mark_received"
        actor: Applicant
        preconditions:
          - "status == SHIPPED"
        side_effects: []

      - from: RECEIVED
        to: RETURN_IN_TRANSIT
        trigger: "POST /licensing/rentals/{rental_id}/ship_return"
        actor: Applicant
        preconditions:
          - "status == RECEIVED"
        side_effects: []

      - from: RETURN_IN_TRANSIT
        to: RETURNED
        trigger: "POST /licensing/rentals/{rental_id}/receive_return"
        actor: MaterialsClerk
        preconditions:
          - "status == RETURN_IN_TRANSIT"
        side_effects:
          - "returned_at set"
          - "accrued_late_fee_cents computed via overdue_fine_rule (ACTUAL variant)"
          - "If accrued_late_fee_cents > 0: Fine created (OVERDUE_MATERIAL, ASSESSED), deposit_status -> PARTIALLY_FORFEITED if fee < deposit_cents else FORFEITED; else deposit_status -> RETURNED"

      - from: [SHIPPED, RECEIVED, RETURN_IN_TRANSIT]
        to: OVERDUE
        trigger: "system — clock sweep at 00:00 UTC: any non-terminal rental with due_date < current clock and status != RETURNED transitions to OVERDUE"
        actor: system
        preconditions:
          - "due_date < current clock"
        side_effects:
          - "accrued_late_fee_cents recomputed via overdue_fine_rule (PROJECTED variant, projecting through current clock)"

      - from: OVERDUE
        to: RETURNED
        trigger: "POST /licensing/rentals/{rental_id}/receive_return (late return)"
        actor: MaterialsClerk
        preconditions:
          - "status == OVERDUE"
        side_effects:
          - "returned_at set"
          - "accrued_late_fee_cents finalized via overdue_fine_rule (ACTUAL variant)"
          - "Fine created (OVERDUE_MATERIAL) if accrued_late_fee_cents > 0; deposit_status -> PARTIALLY_FORFEITED or FORFEITED per overdue_settlement_rule"

      - from: OVERDUE
        to: LOST
        trigger: "POST /licensing/rentals/{rental_id}/declare_lost"
        actor: MaterialsClerk
        preconditions:
          - "status == OVERDUE"
          - "current clock >= due_date + 30 days"
        side_effects:
          - "deposit_status -> FORFEITED"
          - "Fine created (LOSS) with amount = replacement_cost_rule output"

  - entity: AlterationRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/alteration-requests/{request_id}/approve"
        actor: RightsAdmin
        preconditions:
          - "status == SUBMITTED"
          - "agreement.license_status == ACTIVE"
          - "If agreement.title.restricted_material == true, only alteration_kind IN {CUT, STAGING_CHANGE} may be approved (TEXT_CHANGE, GENDER_SWAP, TRANSLATION on restricted material -> ERR_ALTERATION_PROHIBITED)"
        side_effects:
          - "decided_by_user_id recorded"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /licensing/alteration-requests/{request_id}/deny"
        actor: RightsAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_by_user_id recorded"

  - entity: RecordingGrant
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, EXERCISED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /licensing/recording-grants/{grant_id}/approve"
        actor: RightsAdmin
        preconditions:
          - "status == REQUESTED"
          - "agreement.license_status == ACTIVE"
          - "If grant_kind == STREAMING_VIDEO, agreement.classification must be AMATEUR (professional streaming requires separate contract -> ERR_STREAMING_CLASSIFICATION_BLOCK)"
          - "If distribution_scope == PUBLIC_FREE and grant_kind == STREAMING_VIDEO, title.restricted_material must be false (else ERR_RECORDING_PROHIBITED)"
        side_effects:
          - "recording_royalty_cents computed via recording_royalty_rule"
          - "agreement.royalty_balance_cents incremented by recording_royalty_cents"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /licensing/recording-grants/{grant_id}/deny"
        actor: RightsAdmin
        preconditions:
          - "status == REQUESTED"
        side_effects: []

      - from: APPROVED
        to: EXERCISED
        trigger: "POST /licensing/recording-grants/{grant_id}/mark_exercised"
        actor: Applicant
        preconditions:
          - "status == APPROVED"
          - "agreement.license_status == ACTIVE"
          - "current clock within [agreement.window_start, agreement.window_end]"
        side_effects: []

      - from: APPROVED
        to: REVOKED
        trigger: "system — on agreement CANCELLED or BREACHED"
        actor: system
        preconditions: []
        side_effects:
          - "agreement.royalty_balance_cents decremented by recording_royalty_cents (reversal)"

  - entity: Fine
    field: status
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED, WRITTEN_OFF]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /licensing/fines/{fine_id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "If this fine is the last ASSESSED fine for the Organization, Organization.standing -> GOOD"

      - from: ASSESSED
        to: WAIVED
        trigger: "POST /licensing/fines/{fine_id}/waive"
        actor: FinanceOfficer
        preconditions:
          - "status == ASSESSED"
          - "fine_kind IN {OVERDUE_MATERIAL, LOSS} (breach fines UNAUTHORIZED_* are never waivable -> ERR_FINE_NOT_WAIVABLE)"
        side_effects:
          - "If this fine is the last ASSESSED fine for the Organization, Organization.standing -> GOOD"

      - from: ASSESSED
        to: WRITTEN_OFF
        trigger: "POST /licensing/fines/{fine_id}/write_off"
        actor: FinanceOfficer
        preconditions:
          - "status == ASSESSED"
          - "fine age >= 180 days (created_at <= current clock - 180d)"
        side_effects:
          - "Organization.standing remains SUSPENDED (write-off does not restore standing)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "POST /licensing/agreements/{agreement_id}/amendments"
    occ_field: expected_agreement_version
    description: |
      Applying an amendment to a LicenseAgreement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just applied an amendment (which legitimately
      supersedes the prior contracted terms under the amendment chain) and
      the current writer's view of the agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: application-approve-stale-version
    parent_entity: LicenseApplication
    write_endpoint: "POST /licensing/applications/{application_id}/approve"
    occ_field: expected_application_version
    description: |
      Approving a LicenseApplication whose version has advanced since the
      reviewing officer last observed it is rejected. A prior review action
      (return_for_info, applicant resubmission editing fields) legitimately
      supersedes the officer's stale snapshot, so the approval must be
      re-based on the latest version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: performance_royalty
    trigger: "LicenseApplication APPROVED (QUOTED variant over projected figures), Performance.report (SETTLED variant for the single performance), LicenseAgreement completion (SETTLED variant aggregated)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction
      # Inputs: house_seating_capacity, classification, royalty_basis,
      #         base_flat_fee_cents, gross_percent_bp, gross_cents (projected or actual),
      #         performance_count (contracted or HELD count)
      tier_mult =
        if house_seating_capacity <= 199 then 1.00
        elif house_seating_capacity <= 399 then 1.25
        elif house_seating_capacity <= 799 then 1.60
        else 2.00
      class_mult =
        if classification == AMATEUR then 1.00 else 1.50
      per_perf_flat =
        if royalty_basis in {PER_PERFORMANCE, HYBRID}
        then round_half_up(base_flat_fee_cents * tier_mult * class_mult)
        else 0
      per_perf_pct =
        if royalty_basis in {GROSS_PERCENT, HYBRID}
        then round_half_up(gross_cents * gross_percent_bp / 10000 / performance_count)
        else 0
      per_perf_royalty = per_perf_flat + per_perf_pct
      total_royalty = per_perf_royalty * performance_count
    input_set: "For QUOTED: uses application.projected_gross_cents and application.performance_count and application.venue_seating_capacity. For SETTLED single: uses performance.reported_gross_cents, agreement.house_seating_capacity, count of HELD performances so far as divisor is 1 for per-performance. For SETTLED aggregate: sum over HELD performances."
    constants:
      TIER1_MAX_SEATS: 199
      TIER2_MAX_SEATS: 399
      TIER3_MAX_SEATS: 799
      TIER1_MULT: 1.00
      TIER2_MULT: 1.25
      TIER3_MULT: 1.60
      TIER4_MULT: 2.00
      AMATEUR_MULT: 1.00
      PROFESSIONAL_MULT: 1.50
    precision: "integer cents; each multiplication rounded half-up to cents at the step shown"
    variants:
      - name: QUOTED
        when: "At license issuance (application APPROVED -> agreement created). Uses projected_gross_cents and declared performance_count."
        difference: "Gross input is application.projected_gross_cents; performance_count is the contracted count. Produces quoted_royalty_total_cents."
      - name: SETTLED
        when: "At per-performance report and at agreement completion. Uses reported_gross_cents and count of HELD performances."
        difference: "Gross input is actual reported gross; divisor and multiplier use HELD performance count (cancelled performances excluded). Produces royalty_cents per performance and settled_royalty_total_cents in aggregate. For identical headline numbers, QUOTED vs SETTLED differ whenever reported != projected or any performance cancelled."

  - name: overdue_fine_rule
    trigger: "MaterialRental -> OVERDUE sweep (PROJECTED), receive_return (ACTUAL)"
    algorithm: chronological
    formula: |
      # Mode (c): circular-looking dependency — late fee may be capped by deposit,
      # but deposit forfeiture status depends on the capped fee; evaluation order pinned below.
      days_overdue =
        max(0, floor((evaluation_clock - due_date) / 86400))
      daily_rate_cents =
        if title.restricted_material then title.restricted_late_fee_per_day_cents
        else title.late_fee_per_day_cents
      raw_fee_cents = days_overdue * daily_rate_cents
      # pinned order: compute raw fee FIRST, then cap against deposit
      capped_fee_cents = min(raw_fee_cents, deposit_cents * 2)
      accrued_late_fee_cents = capped_fee_cents
    input_set: "The MaterialRental under transition, its Title, current clock (or returned_at for ACTUAL)"
    constants:
      LATE_FEE_CAP_MULTIPLE_OF_DEPOSIT: 2
    precision: "integer cents; no rounding (all inputs integer cents and integer days)"
    variants:
      - name: PROJECTED
        when: "Clock sweep marking rental OVERDUE; evaluation_clock is current clock"
        difference: "Fee accrued through current clock; Fine not yet created, only accrued_late_fee_cents updated"
      - name: ACTUAL
        when: "receive_return; evaluation_clock is returned_at"
        difference: "Fee accrued through actual return; Fine row created with this amount"

  - name: deposit_settlement_rule
    trigger: "MaterialRental receive_return or declare_lost"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding — per-component deductions rounded per component
      # THEN summed (PINNED). Summing first then rounding would give different cents.
      damage_deductions_rounded = [round_half_up(d.amount_cents * d.damage_fraction) for d in damages]
      total_damage_cents = sum(damage_deductions_rounded)   # sum AFTER per-item rounding
      late_fee_cents = accrued_late_fee_cents               # already integer cents
      total_deduction_cents = total_damage_cents + late_fee_cents
      if total_deduction_cents == 0:
        deposit_status = RETURNED; refund_cents = deposit_cents
      elif total_deduction_cents < deposit_cents:
        deposit_status = PARTIALLY_FORFEITED; refund_cents = deposit_cents - total_deduction_cents
      else:
        deposit_status = FORFEITED; refund_cents = 0
    input_set: "MaterialRental, damage report lines (each with amount_cents and damage_fraction), accrued_late_fee_cents"
    constants: {}
    precision: "integer cents; each damage line rounded half-up BEFORE summation (pinned order)"

  - name: classification_rule
    trigger: "LicenseApplication begin_review (determined_classification recomputed)"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): conditional branch on entity state; >=3 inputs
      if org_kind == PROFESSIONAL_COMPANY: return PROFESSIONAL
      if performers_compensated == true: return PROFESSIONAL
      if admission_charged == false and org_kind == SCHOOL: return AMATEUR
      if ticket_top_price_cents >= PRO_PRICE_FLOOR_CENTS: return PROFESSIONAL
      if venue_seating_capacity >= PRO_CAPACITY_FLOOR: return PROFESSIONAL
      return AMATEUR
    input_set: "LicenseApplication + its Organization"
    constants:
      PRO_PRICE_FLOOR_CENTS: 4000
      PRO_CAPACITY_FLOOR: 500
    precision: "n/a (classification)"
    variants: []

  - name: recording_royalty_rule
    trigger: "RecordingGrant approve"
    algorithm: threshold
    formula: |
      base = title.recording_royalty_flat_cents
      if grant_kind == CAST_RECORDING_AUDIO: mult = 1.00
      elif grant_kind == ARCHIVAL_VIDEO: mult = 0.50
      else: mult = 2.00   # STREAMING_VIDEO
      if distribution_scope == PUBLIC_FREE: mult = mult * 1.50
      elif distribution_scope == PAYWALL: mult = mult * 1.25
      recording_royalty_cents = round_half_up(base * mult)
    input_set: "RecordingGrant + agreement.title"
    constants: {}
    precision: "integer cents, round_half_up at final step"
    variants: []

  - name: breach_fine_rule
    trigger: "LicenseAgreement declare_breach"
    algorithm: threshold
    formula: |
      if fine_kind == UNAUTHORIZED_ALTERATION:
        amount_cents = max(BREACH_FLOOR_CENTS, 2 * quoted_royalty_total_cents)
      elif fine_kind == UNAUTHORIZED_RECORDING:
        amount_cents = max(BREACH_FLOOR_CENTS, 3 * quoted_royalty_total_cents)
    input_set: "LicenseAgreement being breached"
    constants:
      BREACH_FLOOR_CENTS: 500000
    precision: "integer cents"
    variants: []

  - name: cancellation_refund_rule
    trigger: "LicenseAgreement cancel"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall over RoyaltyPayment rows in chronological order (oldest first, tie-break created_at ASC).
      days_until_window_start = floor((window_start - current_clock) / 86400)
      if days_until_window_start >= 30: refund_fraction = 1.00
      elif days_until_window_start >= 7: refund_fraction = 0.50
      else: refund_fraction = 0.00
      refundable_pool_cents = round_half_up(sum(payments) * refund_fraction)
      # allocate refund oldest-first; each payment's refunded portion capped by its amount
      for payment in payments_chronological:
        alloc = min(payment.amount_cents, remaining_pool)
        payment.refunded_cents = alloc; remaining_pool -= alloc
    input_set: "All RoyaltyPayment rows for the agreement, ordered by created_at ASC (ties broken by created_at then insertion order — never by id)"
    constants:
      FULL_REFUND_DAYS: 30
      PARTIAL_REFUND_DAYS: 7
    precision: "integer cents; pool rounded half-up once, then allocated"
    variants: []

  - name: availability_rule
    trigger: "LicenseApplication submit / resubmit"
    algorithm: interval_merge
    formula: |
      # closed interval [window_start, window_end] for TerritoryRestriction (both endpoints inclusive)
      # vs half-open [window_start, window_end) for competing exclusive-run LicenseAgreement
      blocking_restrictions = TerritoryRestriction where
        title_id == requested title AND
        territory_code == requested_territory_code AND
        active == true AND
        blocks_classification IN {determined_classification, BOTH} AND
        restriction.window_start <= requested.window_end AND restriction.window_end >= requested.window_start
      blocking_agreements = LicenseAgreement where
        title_id == requested title AND territory_code == requested_territory_code AND
        license_status == ACTIVE AND
        has_exclusive_run == true AND
        agreement.window_start < requested.window_end AND requested.window_start < agreement.window_end
      available = (len(blocking_restrictions) == 0) AND (len(blocking_agreements) == 0)
    input_set: "All TerritoryRestriction rows for the title+territory; all ACTIVE exclusive LicenseAgreement rows for the title+territory"
    constants: {}
    precision: "datetime comparisons in UTC, seconds granularity"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID matches the owning entity (e.g., Applicant acting on own Organization's applications)"
    error_id: ERR_FORBIDDEN_OWNER_MISMATCH
    http_status: 403
    applies_to: "Applicant-scoped endpoints"

  - priority: 4
    category: existence
    check: "Path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body-referenced FK targets exist (title_id, organization_id, agreement_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "creation endpoints with FK payload fields"

  - priority: 6
    category: business_constraint
    check: "Required payload fields present and well-typed; enum values valid; integers within domain range (e.g., scripts_qty >= 0, venue_seating_capacity >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_temporal
    check: "Datetime fields well-formed UTC; window_start < window_end on ranges; due_date in future on rental creation"
    error_id: ERR_INVALID_TEMPORAL
    http_status: 400
    applies_to: "endpoints accepting datetime ranges"

  - priority: 8
    category: state
    check: "Target resource in valid state for requested transition (state-machine from-state check)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "Organization.standing == GOOD before allowing new applications, performance reports, rental ship"
    error_id: ERR_ORG_SUSPENDED
    http_status: 409
    applies_to: "POST /licensing/applications, POST /licensing/performances/{id}/report, POST /licensing/rentals/{id}/ship"

  - priority: 10
    category: business_safety
    check: "Title.status == ACTIVE before new applications or rentals against it"
    error_id: ERR_TITLE_WITHDRAWN
    http_status: 409
    applies_to: "POST /licensing/applications, POST /licensing/rentals"

  - priority: 11
    category: business_safety
    check: "TerritoryRestriction and exclusive-run conflict (availability_rule): requested window/territory/classification not blocked"
    error_id: ERR_TITLE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /licensing/applications/{id}/approve"

  - priority: 12
    category: business_safety
    check: "Alteration approval on restricted-material title limited to CUT or STAGING_CHANGE"
    error_id: ERR_ALTERATION_PROHIBITED
    http_status: 409
    applies_to: "POST /licensing/alteration-requests/{id}/approve"

  - priority: 13
    category: business_safety
    check: "Recording grant streaming restricted to AMATEUR classification; PUBLIC_FREE streaming prohibited on restricted_material titles"
    error_id: ERR_RECORDING_PROHIBITED
    http_status: 409
    applies_to: "POST /licensing/recording-grants/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "MaterialRental scores_qty == 0 when title.title_kind == PLAY; scripts_qty + scores_qty >= 1"
    error_id: ERR_RENTAL_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /licensing/rentals"

  - priority: 15
    category: business_temporal
    check: "Performance.performance_at within agreement [window_start, window_end]; no two Performance rows for the same agreement share performance_at"
    error_id: ERR_PERFORMANCE_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /licensing/agreements/{id}/performances"

  - priority: 16
    category: business_fiscal
    check: "RoyaltyPayment amount_cents >= 1 and <= agreement.royalty_balance_cents at time of payment"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /licensing/agreements/{id}/payments"

  - priority: 17
    category: business_fiscal
    check: "Fine waiver permitted only for fine_kind IN {OVERDUE_MATERIAL, LOSS}"
    error_id: ERR_FINE_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /licensing/fines/{id}/waive"

  - priority: 18
    category: business_fiscal
    check: "Cancellation refused when any Performance already HELD"
    error_id: ERR_PERFORMANCE_ALREADY_HELD
    http_status: 409
    applies_to: "POST /licensing/agreements/{id}/cancel"

  - priority: 19
    category: business_temporal
    check: "Fine write-off permitted only when fine age >= 180 days"
    error_id: ERR_WRITE_OFF_TOO_EARLY
    http_status: 409
    applies_to: "POST /licensing/fines/{id}/write_off"

  - priority: 20
    category: business_temporal
    check: "Performance report only when current clock >= performance_at"
    error_id: ERR_REPORT_TOO_EARLY
    http_status: 409
    applies_to: "POST /licensing/performances/{id}/report"

  - priority: 21
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /licensing/agreements/{id}/amendments, POST /licensing/applications/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Titles & restrictions (catalog admin) ---
  - method: POST
    path: "/licensing/titles"
    description: "Create a Title catalog entry"
    roles: [RightsAdmin]
    code: 201
    input: [name, author, title_kind, royalty_basis, base_flat_fee_cents, gross_percent_bp, restricted_material, perusal_fee_cents, rental_deposit_cents, late_fee_per_day_cents, restricted_late_fee_per_day_cents, recording_royalty_flat_cents]
    output: Title
    side_effects: ["status = ACTIVE", "version = 1"]

  - method: GET
    path: "/licensing/titles/{title_id}"
    description: "Read a Title"
    roles: [RightsAdmin, LicensingOfficer, Applicant, MaterialsClerk, FinanceOfficer]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: GET
    path: "/licensing/titles"
    description: "List titles (filterable)"
    roles: [RightsAdmin, LicensingOfficer, Applicant, MaterialsClerk, FinanceOfficer]
    code: 200
    input: ["status?", "title_kind?", "restricted_material?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  - method: POST
    path: "/licensing/titles/{title_id}/withdraw"
    description: "Withdraw a title from the catalog"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: Title
    side_effects: ["status = WITHDRAWN"]

  - method: POST
    path: "/licensing/titles/{title_id}/restrictions"
    description: "Create a TerritoryRestriction on a title"
    roles: [RightsAdmin]
    code: 201
    input: [territory_code, restriction_kind, window_start, window_end, blocks_classification]
    output: TerritoryRestriction
    side_effects: ["active = true"]

  - method: GET
    path: "/licensing/titles/{title_id}/restrictions"
    description: "List restrictions for a title"
    roles: [RightsAdmin, LicensingOfficer, Applicant, MaterialsClerk, FinanceOfficer]
    code: 200
    input: ["territory_code?", "limit?", "offset?"]
    output: TerritoryRestriction[]
    side_effects: []

  - method: GET
    path: "/licensing/restrictions/{restriction_id}"
    description: "Read a TerritoryRestriction"
    roles: [RightsAdmin, LicensingOfficer]
    code: 200
    input: []
    output: TerritoryRestriction
    side_effects: []

  - method: GET
    path: "/licensing/restrictions"
    description: "List TerritoryRestrictions (filtered list form for FK reverse-reachability)"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: ["title_id?", "territory_code?", "active?", "limit?", "offset?"]
    output: TerritoryRestriction[]
    side_effects: []

  - method: POST
    path: "/licensing/restrictions/{restriction_id}/lift"
    description: "Lift (deactivate) a TerritoryRestriction"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: TerritoryRestriction
    side_effects: ["active = false"]

  # --- Organizations ---
  - method: POST
    path: "/licensing/organizations"
    description: "Register an Organization"
    roles: [RightsAdmin]
    code: 201
    input: [legal_name, org_kind, home_territory_code]
    output: Organization
    side_effects: ["standing = GOOD"]

  - method: GET
    path: "/licensing/organizations/{organization_id}"
    description: "Read an Organization"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/licensing/organizations"
    description: "List organizations"
    roles: [RightsAdmin, LicensingOfficer, FinanceOfficer]
    code: 200
    input: ["standing?", "org_kind?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/licensing/applications"
    description: "Create a LicenseApplication (DRAFT)"
    roles: [Applicant]
    code: 201
    input: [title_id, organization_id, requested_territory_code, requested_classification, venue_seating_capacity, ticket_top_price_cents, performers_compensated, admission_charged, projected_gross_cents, performance_count, first_performance_date, last_performance_date]
    output: LicenseApplication
    side_effects: ["status = DRAFT", "review_round = 0"]

  - method: GET
    path: "/licensing/applications/{application_id}"
    description: "Read a LicenseApplication"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  - method: GET
    path: "/licensing/applications"
    description: "List applications (filterable)"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: ["status?", "organization_id?", "title_id?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: PATCH
    path: "/licensing/applications/{application_id}"
    description: "Edit a DRAFT or RETURNED_FOR_INFO application"
    roles: [Applicant]
    code: 200
    input: ["requested_territory_code?", "requested_classification?", "venue_seating_capacity?", "ticket_top_price_cents?", "performers_compensated?", "admission_charged?", "projected_gross_cents?", "performance_count?", "first_performance_date?", "last_performance_date?"]
    output: LicenseApplication
    side_effects: ["version incremented"]

  - method: POST
    path: "/licensing/applications/{application_id}/submit"
    description: "Submit (or resubmit from RETURNED_FOR_INFO)"
    roles: [Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["status -> SUBMITTED", "AvailabilitySnapshot computed", "submitted_at set"]

  - method: POST
    path: "/licensing/applications/{application_id}/begin_review"
    description: "Move application to UNDER_REVIEW"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["status -> UNDER_REVIEW", "review_round += 1", "determined_classification recomputed"]

  - method: POST
    path: "/licensing/applications/{application_id}/return_for_info"
    description: "Return application to applicant for more info"
    roles: [LicensingOfficer]
    code: 200
    input: [notes]
    output: LicenseApplication
    side_effects: ["status -> RETURNED_FOR_INFO"]

  - method: POST
    path: "/licensing/applications/{application_id}/approve"
    description: "Approve application; creates LicenseAgreement (OCC-guarded)"
    roles: [LicensingOfficer]
    code: 201
    input: [expected_application_version]
    output: LicenseAgreement
    side_effects:
      - "application.status -> APPROVED"
      - "LicenseAgreement created (PENDING_PAYMENT, UNPAID, QUOTED)"
      - "quoted_royalty_total_cents computed via performance_royalty QUOTED"
      - "application.version incremented by 1"

  - method: POST
    path: "/licensing/applications/{application_id}/reject"
    description: "Reject an application"
    roles: [LicensingOfficer]
    code: 200
    input: [reason]
    output: LicenseApplication
    side_effects: ["status -> REJECTED"]

  # --- Agreements ---
  - method: GET
    path: "/licensing/agreements/{agreement_id}"
    description: "Read a LicenseAgreement"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer, MaterialsClerk]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: GET
    path: "/licensing/agreements"
    description: "List agreements"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: ["license_status?", "payment_status?", "organization_id?", "title_id?", "application_id?", "supersedes_agreement_id?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []

  - method: POST
    path: "/licensing/agreements/{agreement_id}/activate"
    description: "Activate agreement (moves PENDING_PAYMENT -> ACTIVE)"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["license_status -> ACTIVE"]

  - method: POST
    path: "/licensing/agreements/{agreement_id}/payments"
    description: "Record a RoyaltyPayment against the agreement"
    roles: [FinanceOfficer]
    code: 201
    input: [amount_cents]
    output: RoyaltyPayment
    side_effects: ["royalty_balance_cents decremented", "payment_status recomputed"]

  - method: GET
    path: "/licensing/agreements/{agreement_id}/payments"
    description: "List payments for an agreement"
    roles: [RightsAdmin, FinanceOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: RoyaltyPayment[]
    side_effects: []

  - method: GET
    path: "/licensing/payments"
    description: "List royalty payments (filtered list form for FK reverse-reachability)"
    roles: [RightsAdmin, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: RoyaltyPayment[]
    side_effects: []

  - method: GET
    path: "/licensing/payments/{payment_id}"
    description: "Read a RoyaltyPayment"
    roles: [RightsAdmin, FinanceOfficer, Applicant]
    code: 200
    input: []
    output: RoyaltyPayment
    side_effects: []

  - method: POST
    path: "/licensing/agreements/{agreement_id}/performances"
    description: "Declare a Performance under an ACTIVE agreement"
    roles: [Applicant]
    code: 201
    input: [performance_at]
    output: Performance
    side_effects: ["status = SCHEDULED", "gross_reported = false"]

  - method: GET
    path: "/licensing/agreements/{agreement_id}/performances"
    description: "List performances for an agreement"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Performance[]
    side_effects: []

  - method: POST
    path: "/licensing/agreements/{agreement_id}/amendments"
    description: "Apply an amendment (change contracted window/performance count). OCC-guarded."
    roles: [RightsAdmin]
    code: 200
    input: [expected_agreement_version, "new_window_end?", "additional_performances?", "amendment_note"]
    output: LicenseAgreement
    side_effects:
      - "amendment_seq += 1"
      - "agreement.version incremented by 1"
      - "If additional_performances > 0, contracted_performance_count incremented and quoted_royalty_total_cents recomputed via performance_royalty QUOTED; royalty_balance_cents adjusted by delta"

  - method: POST
    path: "/licensing/agreements/{agreement_id}/cancel"
    description: "Cancel an ACTIVE agreement; cascades"
    roles: [RightsAdmin]
    code: 200
    input: [reason]
    output: LicenseAgreement
    side_effects:
      - "license_status -> CANCELLED"
      - "Performances -> CANCELLED"
      - "Rentals deposit settlement per cancellation semantics"
      - "RecordingGrants -> REVOKED"
      - "AlterationRequests SUBMITTED -> DENIED"
      - "cancellation_refund_rule applied; payment_status may -> REFUNDED"

  - method: POST
    path: "/licensing/agreements/{agreement_id}/declare_breach"
    description: "Declare a breach (unauthorized alteration/recording/out-of-window performance)"
    roles: [RightsAdmin]
    code: 200
    input: [breach_reason]
    output: LicenseAgreement
    side_effects:
      - "license_status -> BREACHED"
      - "Fine created (UNAUTHORIZED_ALTERATION or UNAUTHORIZED_RECORDING)"
      - "Organization.standing -> SUSPENDED"
      - "RecordingGrants -> REVOKED"
      - "SCHEDULED Performances -> CANCELLED"

  # --- Performances ---
  - method: GET
    path: "/licensing/performances/{performance_id}"
    description: "Read a Performance"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: []
    output: Performance
    side_effects: []

  - method: GET
    path: "/licensing/performances"
    description: "List performances (filtered list form for FK reverse-reachability)"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: Performance[]
    side_effects: []

  - method: POST
    path: "/licensing/performances/{performance_id}/report"
    description: "File a post-performance gross report (marks HELD)"
    roles: [Applicant]
    code: 200
    input: [reported_attendance, reported_gross_cents]
    output: Performance
    side_effects:
      - "status -> HELD"
      - "gross_reported = true"
      - "royalty_cents computed via performance_royalty SETTLED for this performance"
      - "agreement.version incremented"

  - method: POST
    path: "/licensing/performances/{performance_id}/cancel"
    description: "Cancel a SCHEDULED performance"
    roles: [Applicant]
    code: 200
    input: []
    output: Performance
    side_effects: ["status -> CANCELLED"]

  # --- Rentals ---
  - method: POST
    path: "/licensing/rentals"
    description: "Create a MaterialRental under an ACTIVE agreement"
    roles: [MaterialsClerk]
    code: 201
    input: [agreement_id, scripts_qty, scores_qty, due_date]
    output: MaterialRental
    side_effects:
      - "status = RESERVED"
      - "deposit_cents = title.rental_deposit_cents"
      - "deposit_status = HELD"
      - "accrued_late_fee_cents = 0"

  - method: GET
    path: "/licensing/rentals/{rental_id}"
    description: "Read a MaterialRental"
    roles: [RightsAdmin, MaterialsClerk, Applicant, FinanceOfficer]
    code: 200
    input: []
    output: MaterialRental
    side_effects: []

  - method: GET
    path: "/licensing/rentals"
    description: "List rentals"
    roles: [RightsAdmin, MaterialsClerk, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "deposit_status?", "limit?", "offset?"]
    output: MaterialRental[]
    side_effects: []

  - method: POST
    path: "/licensing/rentals/{rental_id}/ship"
    description: "Ship rental to applicant"
    roles: [MaterialsClerk]
    code: 200
    input: []
    output: MaterialRental
    side_effects: ["status -> SHIPPED"]

  - method: POST
    path: "/licensing/rentals/{rental_id}/mark_received"
    description: "Applicant confirms receipt of materials"
    roles: [Applicant]
    code: 200
    input: []
    output: MaterialRental
    side_effects: ["status -> RECEIVED"]

  - method: POST
    path: "/licensing/rentals/{rental_id}/ship_return"
    description: "Applicant ships materials back"
    roles: [Applicant]
    code: 200
    input: []
    output: MaterialRental
    side_effects: ["status -> RETURN_IN_TRANSIT"]

  - method: POST
    path: "/licensing/rentals/{rental_id}/receive_return"
    description: "MaterialsClerk receives returned materials; settles deposit & late fee"
    roles: [MaterialsClerk]
    code: 200
    input: ["damage_lines?"]
    output: MaterialRental
    side_effects:
      - "status -> RETURNED"
      - "returned_at set"
      - "accrued_late_fee_cents finalized via overdue_fine_rule ACTUAL"
      - "deposit_settlement_rule applied; deposit_status updated"
      - "Fine created if accrued_late_fee_cents > 0"

  - method: POST
    path: "/licensing/rentals/{rental_id}/declare_lost"
    description: "Declare rental materials lost"
    roles: [MaterialsClerk]
    code: 200
    input: []
    output: MaterialRental
    side_effects:
      - "status -> LOST"
      - "deposit_status -> FORFEITED"
      - "Fine created (LOSS)"

  # --- Alteration Requests ---
  - method: POST
    path: "/licensing/alteration-requests"
    description: "Submit an AlterationRequest"
    roles: [Applicant]
    code: 201
    input: [agreement_id, alteration_kind, description]
    output: AlterationRequest
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/licensing/alteration-requests/{request_id}"
    description: "Read an AlterationRequest"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: []
    output: AlterationRequest
    side_effects: []

  - method: GET
    path: "/licensing/alteration-requests"
    description: "List alteration requests"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: AlterationRequest[]
    side_effects: []

  - method: POST
    path: "/licensing/alteration-requests/{request_id}/approve"
    description: "Approve an AlterationRequest (restricted-material constraints apply)"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: AlterationRequest
    side_effects: ["status -> APPROVED", "decided_by_user_id recorded"]

  - method: POST
    path: "/licensing/alteration-requests/{request_id}/deny"
    description: "Deny an AlterationRequest"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: AlterationRequest
    side_effects: ["status -> DENIED", "decided_by_user_id recorded"]

  # --- Recording Grants ---
  - method: POST
    path: "/licensing/recording-grants"
    description: "Request a RecordingGrant add-on"
    roles: [Applicant]
    code: 201
    input: [agreement_id, grant_kind, distribution_scope]
    output: RecordingGrant
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/licensing/recording-grants/{grant_id}"
    description: "Read a RecordingGrant"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: []
    output: RecordingGrant
    side_effects: []

  - method: GET
    path: "/licensing/recording-grants"
    description: "List recording grants"
    roles: [RightsAdmin, LicensingOfficer, Applicant, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RecordingGrant[]
    side_effects: []

  - method: POST
    path: "/licensing/recording-grants/{grant_id}/approve"
    description: "Approve a RecordingGrant (computes recording royalty, debits agreement balance)"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: RecordingGrant
    side_effects:
      - "status -> APPROVED"
      - "recording_royalty_cents computed via recording_royalty_rule"
      - "agreement.royalty_balance_cents incremented"

  - method: POST
    path: "/licensing/recording-grants/{grant_id}/deny"
    description: "Deny a RecordingGrant"
    roles: [RightsAdmin]
    code: 200
    input: []
    output: RecordingGrant
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/licensing/recording-grants/{grant_id}/mark_exercised"
    description: "Mark a RecordingGrant as exercised"
    roles: [Applicant]
    code: 200
    input: []
    output: RecordingGrant
    side_effects: ["status -> EXERCISED"]

  # --- Fines ---
  - method: GET
    path: "/licensing/fines/{fine_id}"
    description: "Read a Fine"
    roles: [RightsAdmin, FinanceOfficer, Applicant]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: GET
    path: "/licensing/fines"
    description: "List fines"
    roles: [RightsAdmin, FinanceOfficer, Applicant]
    code: 200
    input: ["organization_id?", "status?", "fine_kind?", "rental_id?", "agreement_id?", "limit?", "offset?"]
    output: Fine[]
    side_effects: []

  - method: POST
    path: "/licensing/fines/{fine_id}/pay"
    description: "Pay a fine"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Fine
    side_effects: ["status -> PAID", "Organization.standing -> GOOD if last ASSESSED"]

  - method: POST
    path: "/licensing/fines/{fine_id}/waive"
    description: "Waive an OVERDUE_MATERIAL or LOSS fine"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Fine
    side_effects: ["status -> WAIVED", "Organization.standing -> GOOD if last ASSESSED"]

  - method: POST
    path: "/licensing/fines/{fine_id}/write_off"
    description: "Write off a fine aged >= 180 days"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Fine
    side_effects: ["status -> WRITTEN_OFF"]

  # --- Availability snapshots ---
  - method: GET
    path: "/licensing/applications/{application_id}/availability"
    description: "Read latest AvailabilitySnapshot for an application"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: []
    output: AvailabilitySnapshot
    side_effects: []

  - method: GET
    path: "/licensing/availability-snapshots"
    description: "List AvailabilitySnapshots (filtered list form for FK reverse-reachability)"
    roles: [RightsAdmin, LicensingOfficer]
    code: 200
    input: ["title_id?", "territory_code?", "available?", "limit?", "offset?"]
    output: AvailabilitySnapshot[]
    side_effects: []

  - method: GET
    path: "/licensing/availability-snapshots/{snapshot_id}"
    description: "Read a single AvailabilitySnapshot"
    roles: [RightsAdmin, LicensingOfficer, Applicant]
    code: 200
    input: []
    output: AvailabilitySnapshot
    side_effects: []

  # --- Test-driving endpoint: logical clock ---
  - method: POST
    path: "/licensing/_clock/set_current_utc"
    description: "Set the server's logical clock to the given ISO8601 UTC timestamp. At server startup (before any set_current_utc call) the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time; this fixed default makes every deadline/expiry/window rule deterministic."
    roles: [RightsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; system sweeps for OVERDUE rentals and COMPLETED agreements fire"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header, or role undeclared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_FORBIDDEN_OWNER_MISMATCH, http: 403, condition: "Entity-backed role's X-User-ID does not match the resource's owning entity id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 422, condition: "Body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, invalid enum, or out-of-range integer" }
  - { id: ERR_INVALID_TEMPORAL, http: 400, condition: "Malformed datetime, window_start >= window_end, or due_date not in future" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in valid from-state for requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match current version" }
  - { id: ERR_ORG_SUSPENDED, http: 409, condition: "Organization.standing == SUSPENDED blocks the operation" }
  - { id: ERR_TITLE_WITHDRAWN, http: 409, condition: "Title.status == WITHDRAWN blocks applications/rentals" }
  - { id: ERR_TITLE_UNAVAILABLE, http: 409, condition: "Availability verdict false: active restriction or exclusive-run conflict" }
  - { id: ERR_TERRITORY_RESTRICTED, http: 409, condition: "A TerritoryRestriction with blocks_classification matching determined classification covers the requested window" }
  - { id: ERR_EXCLUSIVE_RUN_CONFLICT, http: 409, condition: "An ACTIVE exclusive-run LicenseAgreement overlaps the requested window in this territory" }
  - { id: ERR_ALTERATION_PROHIBITED, http: 409, condition: "Restricted-material title blocks the requested alteration_kind" }
  - { id: ERR_RECORDING_PROHIBITED, http: 409, condition: "PUBLIC_FREE streaming on restricted-material title" }
  - { id: ERR_STREAMING_CLASSIFICATION_BLOCK, http: 409, condition: "STREAMING_VIDEO grant requires AMATEUR classification" }
  - { id: ERR_RENTAL_KIND_MISMATCH, http: 422, condition: "scores_qty > 0 on a PLAY title, or scripts_qty + scores_qty == 0" }
  - { id: ERR_PERFORMANCE_OUTSIDE_WINDOW, http: 409, condition: "performance_at outside agreement window or duplicate performance_at for same agreement" }
  - { id: ERR_PERFORMANCE_ALREADY_HELD, http: 409, condition: "Cancellation refused: a HELD performance exists" }
  - { id: ERR_REPORT_TOO_EARLY, http: 409, condition: "Performance report attempted before performance_at" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "Payment amount_cents < 1 or exceeds royalty_balance_cents" }
  - { id: ERR_FINE_NOT_WAIVABLE, http: 409, condition: "Waiver attempted on UNAUTHORIZED_ALTERATION or UNAUTHORIZED_RECORDING fine" }
  - { id: ERR_WRITE_OFF_TOO_EARLY, http: 409, condition: "Write-off attempted on fine younger than 180 days" }
  - { id: ERR_RENTAL_NOT_DUE_LOST, http: 409, condition: "declare_lost attempted before due_date + 30 days" }
  - { id: ERR_DEPOSIT_NOT_HELD, http: 409, condition: "Ship attempted when deposit_status != HELD" }
  - { id: ERR_AMENDMENT_ON_TERMINAL, http: 409, condition: "Amendment attempted on COMPLETED/CANCELLED/BREACHED agreement" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightsAdmin
    description: "Licensor staff with full catalog and agreement authority"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/titles — create title"
      - "POST /licensing/titles/{id}/withdraw — withdraw title"
      - "POST /licensing/titles/{id}/restrictions — create restriction"
      - "POST /licensing/restrictions/{id}/lift — lift restriction"
      - "POST /licensing/organizations — register organization"
      - "POST /licensing/agreements/{id}/activate — activate agreement"
      - "POST /licensing/agreements/{id}/amendments — apply amendment"
      - "POST /licensing/agreements/{id}/cancel — cancel agreement"
      - "POST /licensing/agreements/{id}/declare_breach — declare breach"
      - "POST /licensing/alteration-requests/{id}/approve — approve alteration"
      - "POST /licensing/alteration-requests/{id}/deny — deny alteration"
      - "POST /licensing/recording-grants/{id}/approve — approve recording grant"
      - "POST /licensing/recording-grants/{id}/deny — deny recording grant"
      - "POST /licensing/_clock/set_current_utc — advance logical clock"
    shared_operations:
      - "GET reads across titles, applications, agreements, performances, rentals, grants, fines"

  - name: LicensingOfficer
    description: "Application reviewer; classifies and approves/rejects applications"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/applications/{id}/begin_review"
      - "POST /licensing/applications/{id}/return_for_info"
      - "POST /licensing/applications/{id}/approve"
      - "POST /licensing/applications/{id}/reject"
    shared_operations:
      - "GET reads across titles, applications, agreements, performances, rentals, grants, fines"

  - name: Applicant
    description: "Producing organization contact; submits applications, declares performances, manages rentals and add-ons"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /licensing/applications — create application"
      - "PATCH /licensing/applications/{id} — edit own application"
      - "POST /licensing/applications/{id}/submit — submit own application"
      - "POST /licensing/agreements/{id}/performances — declare performance under own agreement"
      - "POST /licensing/performances/{id}/report — file gross report"
      - "POST /licensing/performances/{id}/cancel — cancel own performance"
      - "POST /licensing/rentals/{id}/mark_received — confirm material receipt"
      - "POST /licensing/rentals/{id}/ship_return — ship materials back"
      - "POST /licensing/alteration-requests — submit alteration request"
      - "POST /licensing/recording-grants — request recording grant"
      - "POST /licensing/recording-grants/{id}/mark_exercised — mark grant exercised"
    shared_operations:
      - "GET reads on own organization's resources"

  - name: MaterialsClerk
    description: "Warehouse operator handling rental logistics"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/rentals — create rental"
      - "POST /licensing/rentals/{id}/ship — ship rental"
      - "POST /licensing/rentals/{id}/receive_return — receive returned materials"
      - "POST /licensing/rentals/{id}/declare_lost — declare lost"
    shared_operations:
      - "GET reads on titles, agreements, rentals"

  - name: FinanceOfficer
    description: "Finance role handling payments and fines"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/agreements/{id}/payments — record royalty payment"
      - "POST /licensing/fines/{id}/pay — pay fine"
      - "POST /licensing/fines/{id}/waive — waive fine"
      - "POST /licensing/fines/{id}/write_off — write off fine"
    shared_operations:
      - "GET reads on agreements, payments, fines, titles"
