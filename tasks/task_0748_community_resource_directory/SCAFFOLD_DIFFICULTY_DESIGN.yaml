  # =========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: outcome_report_create_then_reverse_leaves_funder_grant_remaining_unchanged
        grounds:
          - state_machines.OutcomeReport.ACTIVE_to_REVERSED
          - calculations.funder_grant_ledger
          - entities.Funder.fields.grant_cents_remaining
        distinguishing_aspect: |
          Conserved quantity: Funder.grant_cents_remaining (money, integer cents). The
          forward action POST /referrals/{id}/outcome-reports DEBITS by
          service_cost_final_cents; the compensating action
          POST /outcome-reports/{id}/reverse CREDITS by the same amount. After both,
          Funder.grant_cents_remaining is EXACTLY the pre-create value (invariant:
          post_create_reverse == pre_create).
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F17 (grant_cents_total = 100000000, grant_cents_remaining = 100000000)"
            - "Provider P17, Program PROG17 (unit_cost=10000, capacity=5)"
            - "Client C17, Intake I17 SCREENED, Consent CG17 GRANTED"
            - "Referral R17 in SERVICE_IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F17", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f17_id: $.data.id, f17_grant_pre: $.data.grant_cents_remaining }
            - call: "POST /providers"
              payload: { legal_name: "P17", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p17_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p17_id}", funder_id: "${f17_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog17_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "O", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c17_id: $.data.id }
            - call: "POST /clients/${c17_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i17_id: $.data.id }
            - call: "POST /intakes/${i17_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c17_id}/consent-grants"
              payload: { provider_id: "${p17_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c17_id}"
              captures: { cg17_id: $.data.id }
            - call: "POST /intakes/${i17_id}/referrals"
              payload: { program_id: "${prog17_id}", consent_grant_id: "${cg17_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r17_id: $.data.id }
            - call: "POST /referrals/${r17_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p17_id}"
            - call: "POST /referrals/${r17_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p17_id}"
          trigger:
            - call: "POST /referrals/${r17_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p17_id}"
              captures: { or17_id: $.data.id, or17_final: $.data.service_cost_final_cents }
            - call: "POST /outcome-reports/${or17_id}/reverse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Before create: Funder.${f17_id}.grant_cents_remaining == 100000000"
            - "After create-outcome (UNMET, 0 hrs → final = round_half_up(10000*0.50, 0) = 5000): Funder.${f17_id}.grant_cents_remaining == 99995000"
            - "After reverse: Funder.${f17_id}.grant_cents_remaining == 100000000 (invariant restored to exactly the pre-create integer)"
            - "OutcomeReport.${or17_id}.status == REVERSED"

      - name: referral_create_then_withdraw_leaves_program_capacity_slots_taken_unchanged
        grounds:
          - state_machines.Referral.PROPOSED_to_WITHDRAWN
          - calculations.program_utilization
          - entities.Program.fields.capacity_slots_taken
        distinguishing_aspect: |
          Conserved quantity: Program.capacity_slots_taken (slot count, integer — a
          DIFFERENT KIND of quantity from money). Forward action POST /intakes/{id}/referrals
          INCREMENTS capacity_slots_taken by 1; compensating action POST /referrals/{id}/withdraw
          DECREMENTS by 1. Net: exactly zero drift on the named quantity.
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F18, Provider P18, Program PROG18 (capacity=5, capacity_slots_taken=0)"
            - "Client C18, Intake I18 SCREENED, Consent CG18 GRANTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F18", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f18_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P18", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p18_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p18_id}", funder_id: "${f18_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog18_id: $.data.id, prog18_taken_pre: $.data.capacity_slots_taken }
            - call: "POST /clients"
              payload: { full_name: "P", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c18_id: $.data.id }
            - call: "POST /clients/${c18_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i18_id: $.data.id }
            - call: "POST /intakes/${i18_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c18_id}/consent-grants"
              payload: { provider_id: "${p18_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c18_id}"
              captures: { cg18_id: $.data.id }
          trigger:
            - call: "POST /intakes/${i18_id}/referrals"
              payload: { program_id: "${prog18_id}", consent_grant_id: "${cg18_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r18_id: $.data.id }
            - call: "POST /referrals/${r18_id}/withdraw"
              payload: {}
              as: Client
              as_user_id: "${c18_id}"
          assert:
            - "Before create: Program.${prog18_id}.capacity_slots_taken == 0"
            - "After create: Program.${prog18_id}.capacity_slots_taken == 1"
            - "After withdraw: Program.${prog18_id}.capacity_slots_taken == 0 (invariant restored)"
            - "Referral.${r18_id}.status == WITHDRAWN"
