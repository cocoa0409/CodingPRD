            - call: "GET /safety/summaries/${sum_id}"
              payload: {}
              as: RecordkeepingCoordinator
              captures: { sum_v_pre: $.data.version }
            - call: "POST /safety/summaries/${sum_id}/certify"
              payload: { expected_summary_version: "${sum_v_pre}" }
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
