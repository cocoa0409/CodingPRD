          setup:
            - "One BRACE_AND_BOLT cycle with total_pool_cents 1,000,000, so the tier caps are TIER_LOW 600,000 / TIER_MID 400,000 / TIER_ANY 250,000"
            - "Grant A: TIER_LOW, cost estimate 250,000 on a WOOD_FRAME_CRIPPLE_WALL dwelling, so the award is min(round(min(250000, 1000000) * 1.0), 300000) == 250,000"
            - "Grant B: TIER_MID, cost estimate 400,000 on a MOBILE_HOME dwelling, so the award is min(round(min(400000, 600000) * 0.75), 300000) == 300,000"
            - "Both grants are approved by reviewer rev-1; both reservations are made by admin-9, so no segregation-of-duties conflict arises"
