          assert:
            - "trigger[0] returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The same GET with X-User-Role SystemAdmin and X-User-ID admin-1 returns HTTP 200 with data.id == ${site_aut_id}"

      - name: error_segregation_of_duties_when_keyset_author_approves_it
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - state_machines.Keyset.PENDING_APPROVAL_to_ACTIVE
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties compares X-User-ID, not role: a keyset created under X-User-ID so-1 cannot be approved by X-User-ID so-1, returning HTTP 403 ERR_SEGREGATION_OF_DUTIES, while kc-1 approving it under the SecurityOfficer role succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; keyset KS-SOD-1 was created with X-User-ID so-1 acting as KeyCustodian."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-SOD-1", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-11-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "so-1"
              captures: { keyset_sod_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/keysets/${keyset_sod_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
              captures: { sod_error_id: "$.data.error_id" }
            - call: "POST /radio-system/keysets/${keyset_sod_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "kc-1"
          assert:
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "After trigger[0]: Keyset.${keyset_sod_id}.status == PENDING_APPROVAL and approved_by_user_id == null"
            - "trigger[1] returns HTTP 200 and Keyset.${keyset_sod_id}.status == ACTIVE with approved_by_user_id == \"kc-1\" and created_by_user_id == \"so-1\""

      - name: error_agency_scope_violation_on_another_agencys_unit
        claim_type: error_triggerable
        grounds:
          - validations[priority=9]
          - endpoints[POST /radio-system/units/{unit_id}/lifecycle]
          - errors.ERR_AGENCY_SCOPE_VIOLATION
        distinguishing_aspect: "An AgencyRadioManager whose X-User-ID is agency B is refused with HTTP 403 ERR_AGENCY_SCOPE_VIOLATION when acting on a unit owned by agency A, even though the role itself is allowed on the endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agencies SCA and SCB exist; SCA owns one INVENTORY unit."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Scope Agency A", agency_code: "SCA01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_sca_id: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Scope Agency B", agency_code: "SCB01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_scb_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_sca_id}", serial_number: "SCA0001", radio_id: 37001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_sca_id}"
              captures: { unit_sca_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/units/${unit_sca_id}/lifecycle"
              payload: { action: "ZEROIZE" }
              as: AgencyRadioManager
              as_user_id: "${agency_scb_id}"
              captures: { scope_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_AGENCY_SCOPE_VIOLATION"
            - "SubscriberUnit.${unit_sca_id}.key_status == KEYLESS (the rejected ZEROIZE changed nothing)"
            - "The identical call with as_user_id ${agency_sca_id} returns HTTP 200 and key_status == ZEROIZED"

      - name: error_unit_retired_blocks_further_lifecycle_actions
        claim_type: error_triggerable
