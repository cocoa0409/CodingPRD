  - rule_id: resource_temporal_overlap
    instances:
      - name: energy_rule_half_open_adjacency_and_selection
        grounds:
          - calculations.energy_code_rule_selection
          - errors[ERR_ENERGY_RULE_WINDOW_OVERLAP]
          - entities.EnergyCodeRule.fields.effective_to
        distinguishing_aspect: |
          Resource: EnergyCodeRule windows per state_code, HALF-OPEN semantics
          [effective_from, effective_to) — back-to-back windows are legal and an
          order dated exactly at the boundary selects the NEW rule; an interior
          overlap is rejected. Contrasts with the rack's closed+buffer semantics.
        test_recipe:
          setup:
            - "TX R1 [2024-01-01, 2026-01-01) max_u 0.35 / shgc 0.30 exists"
            - "V200, GP3 (catalog_u 0.31, shgc 0.23), dealer TX"
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "TX", max_u_factor: 0.35, max_shgc: 0.30, effective_from: "2024-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z" }, as: PlantEngineer, captures: { r1: $.data.id } }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-AZ", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 90, argon_min_pct: 85, catalog_u_factor: 0.31, catalog_shgc: 0.23, price_per_sqft_cents: 700, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp3: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "LoneStar", ship_to_state_code: "TX" }, as: PlantManager, captures: { dealer: $.data.id } }
          trigger:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "TX", max_u_factor: 0.30, max_shgc: 0.28, effective_from: "2026-01-01T00:00:00Z" }, as: PlantEngineer, captures: { r2: $.data.id } }
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "TX", max_u_factor: 0.33, max_shgc: 0.29, effective_from: "2025-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PlantEngineer, captures: { err: $.data.error_id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2025-12-31T00:00:00Z" }, as: PlantManager, captures: { o1: $.data.id } }
            - { call: "POST /fenestration/orders/${o1}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp3}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-01-01T00:00:00Z" }, as: PlantManager, captures: { o2: $.data.id } }
            - { call: "POST /fenestration/orders/${o2}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp3}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { l2: $.data.id } }
            - { call: "GET /fenestration/order-lines/${l1}/energy-label", as: PlantManager, captures: { c1: $.data.0.compliance, r1_applied: $.data.0.applied_energy_code_rule_id } }
            - { call: "GET /fenestration/order-lines/${l2}/energy-label", as: PlantManager, captures: { c2: $.data.0.compliance, r2_applied: $.data.0.applied_energy_code_rule_id } }
          assert:
            - "Adjacent rule R2 [2026-01-01, null) created successfully (half-open adjacency legal)"
            - "Overlapping R3 rejected with error_id == ERR_ENERGY_RULE_WINDOW_OVERLAP"
            - "Order dated 2025-12-31 selects R1 and compliance == PASS (0.31 <= 0.35)"
            - "Order dated exactly 2026-01-01T00:00:00Z selects R2 and compliance == FAIL (0.31 > 0.30) — boundary belongs to the new window"

      - name: rack_occupancy_buffer_semantics
        grounds:
          - calculations.rack_occupancy_overlap
          - errors[ERR_RACK_OCCUPANCY_CONFLICT]
          - entities.RackReservation.fields.ship_date
        distinguishing_aspect: |
          Resource: RackReservation occupancy on a ShippingRack, CLOSED interval
          + 1-day turnover buffer — semantics differ from the energy rule's
          half-open adjacency: load_date == prior ship_date + 1 day CONFLICTS,
          +2 days is allowed. Same-day turnover never allowed.
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; order IN_PROGRESS (assigned, wave locked+released); rack slot 5"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
