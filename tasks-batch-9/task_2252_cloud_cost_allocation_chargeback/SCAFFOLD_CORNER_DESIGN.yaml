                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { other_bu: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 5000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "PROPORTIONAL", proportional_basis: "HEADCOUNT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/publish"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/chargeback-invoices?allocation_run_id=${run_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { inv_id: "$.data[0].id" }
              - call: "POST /finops/chargeback-invoices/${inv_id}/issue"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
                payload: { payment_cents: 5000 }
                as: BusinessUnitOwner
                as_user_id: "${other_bu}"
              - call: "POST /finops/disputes"
                payload: { chargeback_invoice_id: "${inv_id}", reason_code: "UNTAGGED_ABSORPTION", claimed_credit_cents: 1000, narrative: "not ours" }
                as: BusinessUnitOwner
                as_user_id: "${other_bu}"
              - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
                payload: { payment_cents: 5000 }
                as: BusinessUnitOwner
                as_user_id: "${bu_id}"
            assert:
              - "Settle as Marketing: HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\"; the invoice stays ISSUED with paid_amount_cents 0."
              - "Dispute as Marketing: HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\"; the invoice's dispute_status stays \"NONE\"."
              - "Settle as Ops: HTTP 200 with data.settlement_status == \"SETTLED\"."
              - "Marketing's own chargeback_balance_cents is 0 throughout."

        - name: budget_create_and_revise_are_shared_but_the_analyst_cannot_activate
          claim_type: Shared Operation Allowed
          grounds: "§1.7 FinOpsAnalyst and FinOpsController share 'create and revise budgets, evaluate budgets'; FinOpsController exclusively 'activates and closes budgets'; §1.5 role lists on POST /finops/budgets, /revise and /activate."
          distinguishing_aspect: "One entity, three operations, two roles: the shared operations must succeed for the analyst while the adjacent exclusive one must not, which separates 'shared' from 'controller-only' on the very same aggregate."
          test_recipe:
            setup:
              - "One ACTIVE unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
            trigger:
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 10000, forecast_cents: 9000 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { bud_id: "$.data.id", bud_v: "$.data.version" }
              - call: "POST /finops/budgets/${bud_id}/revise"
                payload: { expected_budget_version: "${bud_v}", forecast_cents: 9500 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/budgets/${bud_id}/activate"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/budgets/${bud_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "Create as analyst: HTTP 201, data.status == \"DRAFT\", data.forecast_cents == 9000, data.revision_count == 0, data.forecast_history == []."
              - "Revise as analyst: HTTP 200, data.forecast_cents == 9500, data.forecast_history == [9000], data.revision_count == 1, data.version == ${bud_v} + 1."
              - "Activate as analyst: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\"; the budget stays DRAFT."
              - "Activate as controller: HTTP 200 with data.status == \"ACTIVE\"."

        - name: the_controller_who_drafted_a_policy_cannot_activate_it
          claim_type: Segregation of Duties
          grounds: "§1.7 role_model segregation_of_duties with X-User-ID tracked; §1.4 priority 50 ERR_SEGREGATION_OF_DUTIES (403) covers tagging-policy activation; §1.1 TaggingPolicy.drafted_by_user_id and activated_by_user_id."
          distinguishing_aspect: "Drafting is a shared operation, so a controller may legitimately draft; the refusal is keyed on the acting user id matching drafted_by_user_id, and a second controller with the identical role succeeds — which no role-level check could distinguish."
          test_recipe:
            setup:
              - "One DRAFT policy drafted by controller-1 (drafting is shared between the analyst and the controller)."
            setup_api_calls:
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"] }
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { pol_id: "$.data.id" }
            trigger:
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-2"
            assert:
              - "The draft recorded data.drafted_by_user_id == \"controller-1\", data.status == \"DRAFT\", data.activated_by_user_id null."
              - "Activate as controller-1: HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"; the policy stays DRAFT and its version is unchanged."
              - "Activate as controller-2: HTTP 200 with data.status == \"ACTIVE\" and data.activated_by_user_id == \"controller-2\"."

    - section: cross-cutting complexity layers
      instances:
        - name: stale_run_version_on_a_manual_adjustment_returns_412
          claim_type: optimistic_concurrency
          grounds: "§1.2.1 concurrency rule allocation-adjustment-stale-run: write_endpoint POST /finops/allocation-runs/{id}/manual-adjustments, occ_field expected_allocation_run_version, ERR_STALE_VERSION (412)."
          distinguishing_aspect: "The version the client holds is invalidated by its own earlier successful adjustment, not by an external actor: the first append bumps the run's version, so replaying the same expected version is the natural stale case."
          test_recipe:
            setup:
              - "A COMPUTED_FINAL showback run with a 4000-cent SHARED line for one unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 4000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_v: "$.data.version" }
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v}", business_unit_id: "${bu_id}", allocated_cents: 100, memo: "first true-up" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v}", business_unit_id: "${bu_id}", allocated_cents: 200, memo: "replayed true-up" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/allocation-runs/${run_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { run_v2: "$.data.version" }
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v2}", business_unit_id: "${bu_id}", allocated_cents: 200, memo: "retried true-up" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/allocation-lines?allocation_run_id=${run_id}&business_unit_id=${bu_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "First adjustment: HTTP 201; the run's version is now ${run_v} + 1."
              - "Replay with ${run_v}: HTTP 412 with data.error_id == \"ERR_STALE_VERSION\"; no line is appended."
              - "Re-read: ${run_v2} == ${run_v} + 1."
              - "Retry with ${run_v2}: HTTP 201 with data.allocated_cents == 200 and data.memo == \"retried true-up\"."
              - "Line listing: meta.total_count == 3 (one SHARED, two MANUAL_ADJUSTMENT) and the run's version is ${run_v} + 2."

        - name: stale_budget_version_on_revise_returns_412
          claim_type: optimistic_concurrency
          grounds: "§1.2.1 concurrency rule budget-revise-stale-budget: write_endpoint POST /finops/budgets/{id}/revise, occ_field expected_budget_version, ERR_STALE_VERSION (412); §1.5 revise appends to forecast_history and increments version."
          distinguishing_aspect: "The version is bumped by a different endpoint than the one under OCC — the variance narrative — so the rejected revise proves the guard reads the entity's live version rather than a revise-only counter."
          test_recipe:
            setup:
              - "One ACTIVE unit with one DRAFT budget."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 10000, forecast_cents: 9000 }
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { bud_id: "$.data.id", bud_v: "$.data.version" }
            trigger:
              - call: "POST /finops/budgets/${bud_id}/revise"
                payload: { expected_budget_version: "${bud_v}", forecast_cents: 9500 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets/${bud_id}/revise"
                payload: { expected_budget_version: "${bud_v}", forecast_cents: 9800 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/budgets/${bud_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { bud_v2: "$.data.version" }
              - call: "POST /finops/budgets/${bud_id}/revise"
                payload: { expected_budget_version: "${bud_v2}", forecast_cents: 9800 }
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "First revise: HTTP 200, data.forecast_cents == 9500, data.forecast_history == [9000], data.revision_count == 1, data.version == ${bud_v} + 1."
              - "Replay with ${bud_v}: HTTP 412 with data.error_id == \"ERR_STALE_VERSION\"; forecast_cents stays 9500 and revision_count stays 1."
              - "Re-read: ${bud_v2} == ${bud_v} + 1."
              - "Retry with ${bud_v2}: HTTP 200, data.forecast_cents == 9800, data.forecast_history == [9000, 9500], data.revision_count == 2."

        - name: stale_policy_version_on_amend_returns_412
          claim_type: optimistic_concurrency
          grounds: "§1.2.1 concurrency rule tagging-policy-amend-stale-policy: write_endpoint PUT /finops/tagging-policies/{id}, occ_field expected_tagging_policy_version, ERR_STALE_VERSION (412)."
          distinguishing_aspect: "The client's version is invalidated by the activation transition rather than by another amend, so a version captured at draft time is already stale by the time the policy is amendable at all."
          test_recipe:
            setup:
              - "One DRAFT policy, with its draft-time version captured before activation."
            setup_api_calls:
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pol_id: "$.data.id", pol_v_draft: "$.data.version" }
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { pol_v_active: "$.data.version" }
            trigger:
              - call: "PUT /finops/tagging-policies/${pol_id}"
                payload: { expected_tagging_policy_version: "${pol_v_draft}", mandatory_dimensions: ["team", "environment"], enforcement_mode: "BLOCKING" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "PUT /finops/tagging-policies/${pol_id}"
                payload: { expected_tagging_policy_version: "${pol_v_active}", mandatory_dimensions: ["team", "environment"], enforcement_mode: "BLOCKING" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/tagging-policies/${pol_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "${pol_v_active} == ${pol_v_draft} + 1 — activation is a versioned write."
              - "Amend with ${pol_v_draft}: HTTP 412 with data.error_id == \"ERR_STALE_VERSION\"; mandatory_dimensions still holds all three dimensions."
              - "Amend with ${pol_v_active}: HTTP 200, data.mandatory_dimensions == [\"team\", \"environment\"], data.enforcement_mode == \"BLOCKING\", data.version == ${pol_v_active} + 1."
              - "Final read confirms data.status is still \"ACTIVE\" — amending does not reset the lifecycle."

        - name: spend_spike_needs_both_the_ratio_and_the_delta_gate
          claim_type: rate_threshold_triggers
          grounds: "§1.3 anomaly_spike_detection constants SPIKE_RATIO_MIN 1.2 and SPIKE_DELTA_MIN_CENTS 50000, both of which an observation must clear; §1.5 POST /finops/anomaly-scans emits one alert per clearing observation."
          distinguishing_aspect: "Two units are scanned in a single sweep with baselines of exactly 250000 each: one observes 300000, which sits exactly on both gates, and the other observes 299999, one cent short of both. The instantaneous threshold is therefore probed at the boundary and at boundary-minus-one in the same response."
