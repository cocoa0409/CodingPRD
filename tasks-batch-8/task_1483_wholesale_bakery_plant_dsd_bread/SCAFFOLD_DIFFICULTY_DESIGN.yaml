# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1483_wholesale_bakery_plant_dsd_bread
# Test Targeting Index: 9 Difficulty Rules x instances, grounded in SCAFFOLD.yaml
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: stale_credit_provisional_vs_verified
        grounds:
          - calculations.stale_credit
          - state_machines.StaleReturn.PENDING_VERIFICATION_to_VERIFIED
          - entities.StaleReturn.fields.provisional_credit_cents
          - entities.StaleReturn.fields.final_credit_cents
        distinguishing_aspect: |
          Dual variant on the StaleReturn/Store-credit domain: the SAME pickup
          yields provisional_credit_cents computed from driver-declared
          quantities (448) and final_credit_cents computed from QA-verified
          quantities (398) — different results for the same physical event.
        test_recipe:
          setup:
            - "Plant with baseline indices 400/600; product A (NONE, 500g, 48h shelf, 199c) and product D (NONE, 200g, 48h, 99c)"
            - "Store S1 STANDARD tier; driver; line L1"
            - "Order 100xA for 2026-08-10 confirmed+locked; plan 2026-08-09 locked+released"
            - "Batch A (100u) completed bake at 2026-08-09T09:00:00Z, RELEASED; batch D (50u) completed 2026-08-09T10:10:00Z, RELEASED"
            - "Route 2026-08-10 dispatched; stop DELIVERED at clock 2026-08-10T09:00:00Z"
            - "Clock at 2026-08-10T15:00:00Z -> batch A age 30h (rate 0.50), batch D age 28h (rate 0.50)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Alpha", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-D", name: "Bun 200", allergen_class: "NONE", unit_weight_g: 200, shelf_life_hours: 48, base_price_cents: 99, flour_share_pct: 0.20, butter_share_pct: 0.05, batch_capacity_units: 200 }, as: PlantAdmin, captures: { pd: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "GET /bakery/production-plans/${pl}", as: Any, captures: { plv2: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pd}", qty_units: 50, scheduled_start_at: "2026-08-09T09:00:00Z", scheduled_end_at: "2026-08-09T10:00:00Z", expected_production_plan_version: "${plv2}" }, as: Planner, captures: { btd: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/batches/${btd}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T10:10:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${btd}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/route-stops/${stp}/deliver", payload: { delivered_units: 100, on_shelf_units_observed: 0 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: PlantAdmin }
          trigger:
            - call: "POST /bakery/stale-returns"
              payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 3 }, { batch_id: "${btd}", qty: 3 } ] }
              as: Driver
              as_user_id: "${drv}"
              captures: { sre: $.data.id, prov: $.data.provisional_credit_cents }
            - call: "POST /bakery/stale-returns/${sre}/verify"
              payload: { verified_lines: [ { batch_id: "${bt}", qty: 3 }, { batch_id: "${btd}", qty: 2 } ] }
              as: QALead
              as_user_id: "qa-1"
              captures: { fin: $.data.final_credit_cents }
          assert:
            - "StaleReturn.${sre}.provisional_credit_cents == 448  # per-line round_half_up(3*199*0.5)=299 + round_half_up(3*99*0.5)=149"
            - "StaleReturn.${sre}.final_credit_cents == 398  # 299 + round_half_up(2*99*0.5)=99"
            - "StaleReturn.${sre}.status == VERIFIED"
            - "provisional (448) != final (398) for the same physical pickup"

      - name: surcharge_provisional_vs_final
        grounds:
          - calculations.surcharge_passthrough
          - state_machines.SurchargeSchedule.PROVISIONAL_to_FINALIZED
          - entities.SurchargeSchedule.fields.provisional_surcharge_cents
          - entities.SurchargeSchedule.fields.final_surcharge_cents
        distinguishing_aspect: |
          Dual variant on the Product pricing domain (different domain from the
          stale-credit instance): the same schedule computes 7c from FORECAST
          indices at creation and 19c from PUBLISHED indices at finalization.
        test_recipe:
          setup:
            - "Plant baseline flour 400, butter 600; product C price 249c, flour_share 0.30, butter_share 0.10"
            - "FORECAST indices for 2026-08: FLOUR 440, BUTTER 600"
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant Beta", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-C", name: "Brioche 250", allergen_class: "NONE", unit_weight_g: 250, shelf_life_hours: 48, base_price_cents: 249, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 200 }, as: PlantAdmin, captures: { pc: $.data.id } }
            - { call: "POST /bakery/ingredient-indices", payload: { plant_id: "${p}", ingredient: "FLOUR", period: "2026-08", forecast_value: 440 }, as: PricingAnalyst, captures: { ifl: $.data.id } }
            - { call: "POST /bakery/ingredient-indices", payload: { plant_id: "${p}", ingredient: "BUTTER", period: "2026-08", forecast_value: 600 }, as: PricingAnalyst, captures: { ibt: $.data.id } }
          trigger:
            - call: "POST /bakery/surcharge-schedules"
              payload: { product_id: "${pc}", period: "2026-08" }
              as: PricingAnalyst
              captures: { sch: $.data.id, prov: $.data.provisional_surcharge_cents }
            - { call: "POST /bakery/ingredient-indices/${ifl}/publish", payload: { published_value: 500 }, as: PricingAnalyst }
            - call: "GET /bakery/surcharge-schedules/${sch}"
              as: Any
              captures: { mid_status: $.data.status }
            - { call: "POST /bakery/ingredient-indices/${ibt}/publish", payload: { published_value: 606 }, as: PricingAnalyst }
            - call: "GET /bakery/surcharge-schedules/${sch}"
              as: Any
              captures: { fin: $.data.final_surcharge_cents, fin_status: $.data.status }
            - call: "GET /bakery/products/${pc}"
              as: Any
              captures: { sur: $.data.current_surcharge_cents }
          assert:
            - "provisional == 7  # round_half_up(249 * (0.30*0.10 + 0.10*0.0)) = round_half_up(7.47)"
            - "mid_status == PROVISIONAL  # butter index not yet published -> no finalize"
            - "fin == 19  # round_half_up(249 * (0.30*0.25 + 0.10*0.01)) = round_half_up(18.924)"
            - "fin_status == FINALIZED"
            - "Product.${pc}.current_surcharge_cents == 19"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: production_requirement_chained_tier_order
        grounds:
          - calculations.production_requirement
          - state_machines.ProductionPlan.DRAFT_to_LOCKED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the buffer tier keys on GROSS
          units, never on planned units — the pinned evaluation order
          gross -> tier -> planned -> batches -> flour makes the value
          well-defined; gross 500 yields planned 550, batches 3, flour 216.0.
        test_recipe:
          setup:
            - "Plant; product A (500g, capacity 240/batch); store lead 48h"
            - "Order of 500 units of A for delivery 2026-08-10, CONFIRMED then LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Gamma", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 500 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-10", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
          trigger:
            - call: "POST /bakery/production-plans/${pl}/lock"
              payload: {}
              as: Planner
              captures: { planned: $.data.total_planned_units, flour: $.data.flour_required_kg }
          assert:
            - "ProductionPlan.${pl}.planned_units_by_product[${pa}] == 550  # ceil(500 * 1.10), tier keyed on gross"
            - "ProductionPlan.${pl}.batches_required_by_product[${pa}] == 3  # ceil(550/240)"
            - "ProductionPlan.${pl}.flour_required_kg == 216.0  # 3*240*500*0.60/1000"
            - "ProductionPlan.${pl}.total_planned_units == 550"

      - name: stale_credit_per_line_rounding_order
        grounds:
          - calculations.stale_credit
          - entities.StaleReturn.fields.provisional_credit_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-THEN-sum.
          Lines 3x199c@0.5 and 3x99c@0.5 give 299+149=448; the alternative
          sum-then-round order gives 447 — the pinned order is observable.
        test_recipe:
          setup:
            - "Same distribution baseline as stale_credit_provisional_vs_verified: batches A (baked 2026-08-09T09:00Z) and D (baked 2026-08-09T10:10Z) RELEASED; stop DELIVERED; clock 2026-08-10T15:00Z (both lines in the 25..48h -> 0.50 tier)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Delta", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-D", name: "Bun 200", allergen_class: "NONE", unit_weight_g: 200, shelf_life_hours: 48, base_price_cents: 99, flour_share_pct: 0.20, butter_share_pct: 0.05, batch_capacity_units: 200 }, as: PlantAdmin, captures: { pd: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "GET /bakery/production-plans/${pl}", as: Any, captures: { plv2: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pd}", qty_units: 50, scheduled_start_at: "2026-08-09T09:00:00Z", scheduled_end_at: "2026-08-09T10:00:00Z", expected_production_plan_version: "${plv2}" }, as: Planner, captures: { btd: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/batches/${btd}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T10:10:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${btd}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btd}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/route-stops/${stp}/deliver", payload: { delivered_units: 100, on_shelf_units_observed: 0 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: PlantAdmin }
          trigger:
            - call: "POST /bakery/stale-returns"
              payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 3 }, { batch_id: "${btd}", qty: 3 } ] }
              as: Driver
              as_user_id: "${drv}"
              captures: { sre: $.data.id, prov: $.data.provisional_credit_cents }
          assert:
            - "StaleReturn.${sre}.provisional_credit_cents == 448  # 299+149 per-line-rounded; sum-then-round would give 447"

      - name: stocking_allocation_nested_minmax
        grounds:
          - calculations.stocking_allocation
          - state_machines.RouteStop.PENDING_to_DELIVERED
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: stocked =
          min(delivered, max(0, shelf_capacity - on_shelf)) with a conditional
          refused>0 branch; delivered 90, on_shelf 30, capacity 100 ->
          stocked 70, refused 20 (refused branch active, zero credit).
        test_recipe:
          setup:
            - "Baseline distribution chain with product A only; order 100xA; batch A RELEASED; route DISPATCHED; stop PENDING; clock 2026-08-10T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Eps", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
