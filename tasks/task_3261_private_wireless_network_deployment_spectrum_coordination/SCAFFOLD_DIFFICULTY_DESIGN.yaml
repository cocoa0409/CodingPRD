          assert:
            - "SpectrumLease.${lease_id}.status == CANCELLED"
            - "CellSector.${cell_id}.status == DEGRADED (via assignment revocation cascade)"
            - "A new MonitoringAlert exists for Site.${site_id} with alert_class=OUTAGE"

  # ==========================================================================
  # Rule 5: priority_pair_validation_conflict (≥ 2 instances, different error pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_coordination_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INTERFERENCE_MARGIN_EXCEEDED]
        distinguishing_aspect: |
          Pair = state (priority 5) vs business_safety (priority 7). A
          SpectrumCoordinationRequest that is BOTH in the wrong state (DRAFT,
          not COORDINATING) AND would fail the interference check: the
          state error must win because priority 5 < priority 7.
        test_recipe:
          setup:
            - "SpectrumCoordinationRequest in DRAFT (never submitted); if it WERE in COORDINATING it would have worst_case_margin_db = -3"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "P1 Co", erp_account_code: "P1-001", industry_vertical: "VENUE", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "P1", address: "1 P", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests"
              payload: { requesting_coordinator_id: "sc-001", band_class: "SHARED_CBRS", requested_bandwidth_mhz: 20, requested_start_utc: "2026-10-01T00:00:00Z", requested_end_utc: "2027-10-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/approve"
              payload: { expected_request_version: "${req_v}" }
              as: SpectrumRegulator
          assert:
            - "HTTP 409 ERR_INVALID_STATE returned, NOT 422 ERR_INTERFERENCE_MARGIN_EXCEEDED"

      - name: business_safety_vs_business_temporal_on_lease_create
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_SPECTRUM_OVERLAP]
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: |
          Pair = business_safety (priority 10, spectrum overlap) vs
          business_temporal (priority 11, time window). A SHARED_CBRS+PAL
          lease that BOTH overlaps an existing PAL on the same band AND has
          lease_end_utc <= lease_start_utc: the safety error wins.
        test_recipe:
          setup:
            - "An ACTIVE SHARED_CBRS+PAL lease exists at center_frequency 3550 MHz, window [2026-09-01, 2027-09-01)"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "P2 Co", erp_account_code: "P2-001", industry_vertical: "LOGISTICS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 20, lease_start_utc: "2026-09-01T00:00:00Z", lease_end_utc: "2027-09-01T00:00:00Z", priority_access_tier: "PAL", monthly_cost_cents: 100000 }
              as: SpectrumCoordinator
              captures: { lease1: $.data.id }
            - call: "POST /private-wireless/spectrum-leases/${lease1}/activate"
              payload: {}
              as: SpectrumCoordinator
          trigger:
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3555, bandwidth_mhz: 10, lease_start_utc: "2026-12-01T00:00:00Z", lease_end_utc: "2026-06-01T00:00:00Z", priority_access_tier: "PAL", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
          assert:
            - "HTTP 409 ERR_SPECTRUM_OVERLAP returned, NOT 400 ERR_INVALID_TIME_WINDOW"

  # ==========================================================================
  # Rule 6: boundary_precision_check (≥ 2 instances, different metrics, different endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: survey_rsrp_threshold_negative_110
        grounds:
          - validations[priority=8]
          - entities.SiteSurvey.fields.measured_rsrp_dbm
          - errors[ERR_SURVEY_SIGNAL_TOO_WEAK]
        distinguishing_aspect: |
          Boundary metric = measured_rsrp_dbm on integer dBm. Approval passes
          at exactly -110 (>=), fails at -111. Endpoint: POST
          /sites/{id}/surveys/{id}/approve.
        test_recipe:
          setup:
            - "Two SiteSurveys: S1 with measured_rsrp_dbm=-110, S2 with measured_rsrp_dbm=-111, both SUBMITTED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "B1 Co", erp_account_code: "B1-001", industry_vertical: "FACTORY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "BND1", address: "2 Edge", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys"
              payload: { surveyor_id: "ft-1", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -110, measured_sinr_db: 20, floor_plan_area_sqm: 1000, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { s1: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${s1}/submit"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/surveys"
              payload: { surveyor_id: "ft-2", survey_date: "2026-09-01T11:00:00Z", measured_rsrp_dbm: -111, measured_sinr_db: 18, floor_plan_area_sqm: 1000, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { s2: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${s2}/submit"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/surveys/${s1}/approve"
              payload: {}
              as: RFEngineer
              captures: { approve1_status: $.data.status }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${s2}/approve"
              payload: {}
              as: RFEngineer
          assert:
            - "approve1_status == APPROVED"
            - "Second approve call returned 422 ERR_SURVEY_SIGNAL_TOO_WEAK"

      - name: slice_max_devices_empty_set_zero_count
        grounds:
          - validations[priority=18]
          - entities.NetworkSlice.fields.bound_device_count
          - entities.NetworkSlice.fields.max_devices
        distinguishing_aspect: |
          Boundary metric = bound_device_count vs max_devices (empty-set /
          zero-count edge). At exactly bound == max, a further bind is
          rejected. Different metric (count) and different endpoint
          (bind-device) from the RSRP instance.
        test_recipe:
          setup:
            - "Site OPERATIONAL; NetworkSlice ACTIVATED with max_devices=1; one ACTIVE Device D1 already bound (bound_device_count=1)"
            - "Second ACTIVE Device D2 ready to bind"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "B2 Co", erp_account_code: "B2-001", industry_vertical: "CAMPUS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "BND2", address: "3 Edge", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 1500, target_capacity_mbps: 800, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/slices"
              payload: { slice_name: "SL", slice_type: "EMBB", guaranteed_bandwidth_mbps: 100, max_latency_ms: 50, max_devices: 1 }
              as: NetworkArchitect
              captures: { slice_id: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/slices/${slice_id}/bind-device"
              payload: { device_id: "device-placeholder" }
              as: FieldTechnician
          assert:
            - "When slice.bound_device_count == max_devices, bind returns 422 ERR_SLICE_DEVICE_CAP_EXCEEDED"

  # ==========================================================================
  # Rule 7: cross_entity_state_dependency (≥ 2 instances, different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: design_approve_requires_survey_approved
        grounds:
          - state_machines.CoverageDesign.SUBMITTED_to_APPROVED
          - validations[priority=4]
          - entities.CoverageDesign.fields.based_on_survey_id
        distinguishing_aspect: |
          Pair = CoverageDesign → SiteSurvey. CoverageDesign.approve is only
          valid when its based_on_survey_id points to a SiteSurvey in
          APPROVED state. If the survey is REJECTED, design approval fails.
        test_recipe:
          setup:
            - "Site with a SiteSurvey in SUBMITTED (NOT yet APPROVED)"
            - "CoverageDesign referencing that survey, in SUBMITTED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "CE1 Co", erp_account_code: "CE1-001", industry_vertical: "VENUE", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "CE1", address: "1 X", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /private-wireless/sites/${site_id}/surveys"
              payload: { surveyor_id: "ft-9", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 20, floor_plan_area_sqm: 1000, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { surv_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${surv_id}/submit"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/designs"
              payload: { based_on_survey_id: "${surv_id}", edge_compute_required: false, edge_compute_placement: "NONE", expected_site_version: "${site_v}" }
              as: RFEngineer
          assert:
            - "Design creation rejected (survey not APPROVED) with 409 ERR_INVALID_STATE"

      - name: coordination_register_requires_lease_active
        grounds:
          - state_machines.SpectrumCoordinationRequest.APPROVED_to_REGISTERED
          - validations[priority=12]
          - errors[ERR_NO_ACTIVE_LEASE]
        distinguishing_aspect: |
          Pair = SpectrumCoordinationRequest → SpectrumLease. Different
          entity pair than CoverageDesign → SiteSurvey. Registration requires
          an ACTIVE SpectrumLease covering band_class and time window; with
          the lease in PENDING or EXPIRED, registration fails.
        test_recipe:
          setup:
            - "SpectrumCoordinationRequest APPROVED with band_class=SHARED_CBRS, window [2026-10-01, 2027-10-01)"
            - "SpectrumLease for SHARED_CBRS exists but is in PENDING (not ACTIVATED)"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "CE2 Co", erp_account_code: "CE2-001", industry_vertical: "ENERGY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "CE2", address: "2 X", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests"
              payload: { requesting_coordinator_id: "sc-1", band_class: "SHARED_CBRS", requested_bandwidth_mhz: 20, requested_start_utc: "2026-10-01T00:00:00Z", requested_end_utc: "2027-10-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/submit"
              payload: {}
              as: SpectrumCoordinator
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/begin-coordination"
              payload: {}
              as: SpectrumCoordinator
              captures: { req_v2: $.data.version }
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/approve"
              payload: { expected_request_version: "${req_v2}" }
              as: SpectrumRegulator
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 40, lease_start_utc: "2026-09-01T00:00:00Z", lease_end_utc: "2027-09-01T00:00:00Z", priority_access_tier: "GAA", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/register"
              payload: {}
              as: SpectrumCoordinator
          assert:
            - "Registration rejected with 422 ERR_NO_ACTIVE_LEASE"

  # ==========================================================================
  # Rule 8: resource_temporal_overlap (≥ 2 instances, different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cell_assignment_half_open_disjoint
        grounds:
          - validations[priority=13]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - entities.SpectrumAssignment
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on a single CellSector.
          Adjacent assignments where one ends exactly when the next begins
          are ALLOWED; overlapping by even 1 second is rejected. Test:
          existing assignment [T0, T1); new [T1, T2) succeeds; new [T0+1s,
          T1) fails.
        test_recipe:
          setup:
            - "CellSector with ACTIVE assignment A1 covering [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "OL1 Co", erp_account_code: "OL1-001", industry_vertical: "FACTORY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "OL1", address: "1 OL", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/cells"
              payload: { sector_label: "A", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell_id: $.data.id }
          trigger:
            - call: "POST /private-wireless/cells/${cell_id}/spectrum-assignments"
              payload: { coordination_request_id: "placeholder", spectrum_lease_id: "placeholder", assigned_bandwidth_mhz: 10, assignment_start_utc: "2026-10-01T00:00:00Z", assignment_end_utc: "2026-11-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { a1: $.data.id }
            - call: "POST /private-wireless/cells/${cell_id}/spectrum-assignments"
              payload: { coordination_request_id: "placeholder", spectrum_lease_id: "placeholder", assigned_bandwidth_mhz: 10, assignment_start_utc: "2026-11-01T00:00:00Z", assignment_end_utc: "2026-12-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { a2: $.data.id }
            - call: "POST /private-wireless/cells/${cell_id}/spectrum-assignments"
              payload: { coordination_request_id: "placeholder", spectrum_lease_id: "placeholder", assigned_bandwidth_mhz: 10, assignment_start_utc: "2026-10-01T00:00:01Z", assignment_end_utc: "2026-11-01T00:00:00Z" }
              as: SpectrumCoordinator
          assert:
            - "a2 created (adjacent half-open is allowed)"
            - "Third create rejected with 409 ERR_ASSIGNMENT_OVERLAP"

      - name: pal_lease_overlap_uses_frequency_bucket_and_closed_window
        grounds:
          - validations[priority=10]
          - errors[ERR_SPECTRUM_OVERLAP]
          - entities.SpectrumLease
        distinguishing_aspect: |
          Different interval semantics: PAL lease overlap uses a ±10 MHz
          frequency BUCKET (not point match) AND closed-window intersection
          (touching endpoints count as overlap). Distinct from the cell
          assignment half-open rule. Test: existing PAL at 3550 MHz window
          [T0, T1]; new PAL at 3559 MHz (within bucket) starting at exactly
          T1 is rejected (closed window overlap); new PAL at 3565 MHz
          (outside bucket) starting at T1 succeeds.
        test_recipe:
          setup:
            - "ACTIVE SHARED_CBRS+PAL lease at 3550 MHz, window [2026-09-01, 2027-09-01]"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "OL2 Co", erp_account_code: "OL2-001", industry_vertical: "CAMPUS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 20, lease_start_utc: "2026-09-01T00:00:00Z", lease_end_utc: "2027-09-01T00:00:00Z", priority_access_tier: "PAL", monthly_cost_cents: 100000 }
              as: SpectrumCoordinator
              captures: { lease1: $.data.id }
            - call: "POST /private-wireless/spectrum-leases/${lease1}/activate"
              payload: {}
              as: SpectrumCoordinator
          trigger:
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3559, bandwidth_mhz: 10, lease_start_utc: "2027-09-01T00:00:00Z", lease_end_utc: "2028-09-01T00:00:00Z", priority_access_tier: "PAL", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3565, bandwidth_mhz: 10, lease_start_utc: "2027-09-01T00:00:00Z", lease_end_utc: "2028-09-01T00:00:00Z", priority_access_tier: "PAL", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
              captures: { lease_outside: $.data.id }
          assert:
            - "First new lease rejected with 409 ERR_SPECTRUM_OVERLAP (within bucket, touching window)"
            - "Second new lease created (outside ±10 MHz bucket)"

  # ==========================================================================
  # Rule 9: compensating_invariant (≥ 2 instances, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: site_spectrum_utilization_add_release_conserves
        grounds:
          - calculations.site_spectrum_utilization
          - entities.Site.fields.spectrum_utilization_mhz
          - state_machines.SpectrumAssignment
        distinguishing_aspect: |
          Conserved quantity = Site.spectrum_utilization_mhz. Invariant:
          utilization_after(assign(b)) - utilization_before == b; then
          utilization_after(release) == utilization_before. Forward+compensate
          returns to original.
        test_recipe:
          setup:
            - "Site with one Cell, no assignments; initial spectrum_utilization_mhz == 0"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "CI1 Co", erp_account_code: "CI1-001", industry_vertical: "LOGISTICS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "CI1", address: "1 CI", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/cells"
              payload: { sector_label: "C1", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell_id: $.data.id }
          trigger:
            - call: "GET /private-wireless/sites/${site_id}"
              payload: {}
              as: NetworkArchitect
              captures: { before: $.data.spectrum_utilization_mhz }
            - call: "POST /private-wireless/cells/${cell_id}/spectrum-assignments"
              payload: { coordination_request_id: "placeholder", spectrum_lease_id: "placeholder", assigned_bandwidth_mhz: 20, assignment_start_utc: "2026-10-01T00:00:00Z", assignment_end_utc: "2026-11-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { a1: $.data.id }
            - call: "GET /private-wireless/sites/${site_id}"
              payload: {}
              as: NetworkArchitect
              captures: { after_add: $.data.spectrum_utilization_mhz }
            - call: "POST /private-wireless/cells/${cell_id}/spectrum-assignments/${a1}/release"
              payload: {}
