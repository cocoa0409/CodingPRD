      - instance_id: RT-2
        name: blackout_buffer_rejects_exactly_twenty_four_hour_gap
        grounds:
          - calculations.blackout_separation
          - validations[priority=50]
          - errors[ERR_BLACKOUT_SEPARATION_VIOLATION]
          - entities.BlackoutRule.fields.monthly_blackout_hours
        title: "BlackoutRule closed [start, end] plus a 24-hour buffer: a gap of exactly 24 hours is REJECTED"
        resource: "BlackoutRule separation on key (Distributor, territory_code) = (Northgate, US)"
        interval_semantics: "CLOSED [blackout_start, blackout_end] on both ends, expanded by BLACKOUT_MIN_SEPARATION_HOURS = 24 and compared with <=, so touching after expansion is a conflict."
        rationale: >-
          Blackouts require substitution programming and affiliate notice, so the
          network contractually forbids stacking them: consecutive blackouts on one
          operator and territory must be more than a full day apart. Encoding that
          as a buffer expansion with <= makes the boundary land on a gap of exactly
          24 hours — which is refused, the direct opposite of RT-1 where a gap of
          exactly zero is allowed.
        distinguishing_aspect: >-
          A first blackout occupies 2026-09-01T00:00:00Z..04:00:00Z. A second
          starting 2026-09-02T04:00:00Z — exactly 24 hours after the first ends — is
          rejected 409 ERR_BLACKOUT_SEPARATION_VIOLATION, while the same rule
          shifted by one second to 2026-09-02T04:00:01Z is created with
          monthly_blackout_hours == 8.00. Total monthly hours are 8 against a cap
          of 72, so the monthly-cap rule cannot be the cause. An implementation
          that reuses the RightsWindow comparator here accepts the 24-hour gap.
