# =============================================================================
# Task 0021: Flight Delay Claims — SCAFFOLD.yaml
# =============================================================================

scenario: |
  Flight delay claims system: flight status monitoring with multi-source data
  integration (airline/airport/aviation authority), real-time status update
  (delay/cancellation/diversion/return), historical record archiving, and
  delay-cause classification; passenger automatic matching with policy-holder
  ticket information binding, multi-passenger-per-policy handling, ticket change
  and refund detection, and matching-failure manual review; claim eligibility
  determination with delay duration calculation rules (vs. scheduled
  departure/arrival), delay-cause exclusion rules (weather/air traffic
  control/security/airline reasons), policy clause matching, and waiting period
  validation; payout amount calculation with tiered compensation by delay
  duration, multi-flight-segment combined calculation, fixed amount or actual
  loss reimbursement, deductible application, and policy limit cap; insurance
  system integration with policy validity verification, claim quota deduction,
  reinsurance allocation, and reserve adjustment; batch processing with
  same-flight passenger batch claim triggering, batch review and approval,
  batch payout execution, and exception case isolation; event-driven
  synchronization with payment, banking, airline, and policy administration
  systems; audit logging for claim status and payout records.

domain_name: flight-delay-claims
api_prefix: /insurers

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - bulk_operations
    - idempotency
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: branching         # Flight branches into LANDED/CANCELLED/DIVERTED/RETURNED;
                                         # Claim has revert loops; PayoutBatch has parallel dimensions.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic                        # AuditLog references multiple subject entity types
  role_model: segregation_of_duties      # Reviewer cannot also be Approver; Approver cannot also be PayoutOperator
  consistency_model: saga                # Payout pipeline: ledger debit → bank dispatch → settlement;
                                         # event-driven with compensation if dispatch fails

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurer display name" }
      - { name: currency, type: string, source: input, description: "ISO-4217 currency code; all monetary fields stored in this minor unit (cents)" }
      - { name: now_epoch_ms, type: integer, source: system, default: 0, description: "Test-clock counter in milliseconds; advances only via POST /_clock/advance" }
      - { name: total_outstanding_reserve_cents, type: integer, source: computed, default: 0, description: "Sum of (Policy.reserve_balance_cents) over all ACTIVE policies" }

  - name: Policy
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: policy_holder_name, type: string, source: input, description: "Named policy holder (matched against ticket passenger names)" }
      - { name: policy_holder_doc_id, type: string, source: input, description: "Travel document id used for ticket matching" }
      - { name: effective_from_epoch_ms, type: integer, source: input, description: "Coverage start (inclusive) in epoch ms" }
      - { name: effective_to_epoch_ms, type: integer, source: input, description: "Coverage end (exclusive) in epoch ms; must be > effective_from_epoch_ms" }
      - { name: waiting_period_ms, type: integer, source: input, default: 0, description: "Required interval between effective_from and ticket scheduled_departure for coverage to apply" }
      - { name: delay_basis, type: enum, source: input, description: "DEPARTURE | ARRIVAL — pins which delay variant gates eligibility and compensation tier" }
      - { name: payout_mode, type: enum, source: input, description: "FIXED | ACTUAL_LOSS — FIXED uses tier table; ACTUAL_LOSS uses reimbursement_rate_bps over claimed expenses" }
      - { name: reimbursement_rate_bps, type: integer, source: input, default: 0, description: "Basis points (e.g., 5000 = 50%); ignored when payout_mode=FIXED" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Applied once per claim (not per segment) after summed gross compensation" }
      - { name: policy_limit_cents, type: integer, source: input, description: "Hard ceiling on net claim payout (after deductible)" }
      - { name: claim_quota_total_cents, type: integer, source: input, description: "Lifetime aggregate quota for all approved-and-paid claims under this policy" }
      - { name: claim_quota_used_cents, type: integer, source: computed, default: 0, description: "Sum of Claim.final_payout_cents for claims in PAID status" }
      - { name: reserve_balance_cents, type: integer, source: computed, default: 0, description: "Sum of in-flight (non-paid, non-rejected) Claim.estimated_payout_cents; debited on claim approval, released on payout settle/reject" }
      - { name: excluded_delay_causes, type: array, source: input, description: "Subset of {WEATHER, ATC, SECURITY, AIRLINE, OTHER}; claim segments whose Flight.classified_cause ∈ this list are NOT eligible" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
    constraints: "claim_quota_used_cents <= claim_quota_total_cents at all times"

  - name: Ticket
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "Parent policy id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from policy" }
      - { name: passenger_name, type: string, source: input, description: "Passenger as printed on ticket" }
      - { name: passenger_doc_id, type: string, source: input, description: "Travel document id used to match against Policy.policy_holder_doc_id (unless explicitly bound as additional passenger)" }
      - { name: pnr_code, type: string, source: input, description: "Booking record locator; unique per insurer when status=ATTACHED" }
      - { name: flight_id, type: string, source: input, description: "Linked Flight.id (must exist in same insurer)" }
      - { name: scheduled_departure_epoch_ms, type: integer, source: system, description: "Snapshot from Flight at attach time" }
      - { name: scheduled_arrival_epoch_ms, type: integer, source: system, description: "Snapshot from Flight at attach time" }
      - { name: status, type: enum, source: system, description: "ATTACHED | CHANGED | REFUNDED | UNMATCHED" }
    constraints: "Unique (insurer_id, pnr_code) where status IN {ATTACHED, CHANGED}"

  - name: Flight
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: carrier_code, type: string, source: input, description: "IATA airline code (e.g., LH)" }
      - { name: flight_number, type: string, source: input, description: "Flight number (e.g., 441)" }
      - { name: origin_airport, type: string, source: input, description: "IATA origin (e.g., FRA)" }
      - { name: destination_airport, type: string, source: input, description: "IATA destination (e.g., JFK)" }
      - { name: scheduled_departure_epoch_ms, type: integer, source: input, description: "Original scheduled departure (immutable after creation)" }
      - { name: scheduled_arrival_epoch_ms, type: integer, source: input, description: "Original scheduled arrival (immutable after creation)" }
      - { name: actual_departure_epoch_ms, type: integer, source: computed, default: null, description: "Latest finalized actual departure across sources (null until LANDED/CANCELLED/DIVERTED/RETURNED)" }
      - { name: actual_arrival_epoch_ms, type: integer, source: computed, default: null, description: "Latest finalized actual arrival; for CANCELLED, equals null and treated as +∞ delay; for DIVERTED, equals diverted-airport arrival; for RETURNED, equals return-to-origin arrival" }
      - { name: classified_cause, type: enum, source: computed, default: null, description: "WEATHER | ATC | SECURITY | AIRLINE | OTHER; computed by majority-source vote at finalization (see calculations.flight_cause_classification)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | LANDED | CANCELLED | DIVERTED | RETURNED | ARCHIVED" }
      - { name: archived_at_epoch_ms, type: integer, source: system, default: null, description: "Set when status transitions to ARCHIVED" }
    constraints: "Unique (insurer_id, carrier_code, flight_number, scheduled_departure_epoch_ms)"

  - name: FlightStatusEvent
    parent: Flight
    common_fields: false                # append-only event log: only id + created_at
    fields:
      - { name: flight_id, type: string, source: system, description: "Parent flight id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from flight" }
      - { name: source, type: enum, source: input, description: "AIRLINE | AIRPORT | AVIATION_AUTHORITY" }
      - { name: source_event_id, type: string, source: input, description: "Idempotency key from the originating system" }
      - { name: reported_status, type: enum, source: input, description: "DELAYED | CANCELLED | DIVERTED | RETURNED | ON_TIME" }
      - { name: reported_actual_departure_epoch_ms, type: integer, source: input, default: null, description: "Source-reported actual departure (may be null for CANCELLED)" }
      - { name: reported_actual_arrival_epoch_ms, type: integer, source: input, default: null, description: "Source-reported actual arrival" }
      - { name: reported_cause, type: enum, source: input, default: null, description: "WEATHER | ATC | SECURITY | AIRLINE | OTHER (null permitted; null votes count as OTHER)" }
      - { name: report_epoch_ms, type: integer, source: input, description: "Source's wall-clock time of the report" }
      - { name: ingested_epoch_ms, type: integer, source: system, description: "Insurer.now_epoch_ms when ingested" }
    constraints: "Unique (insurer_id, source, source_event_id)"

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "Parent policy id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from policy" }
      - { name: ticket_ids, type: array, source: input, description: "Tickets covered by this claim (≥1, all under same policy)" }
      - { name: review_status, type: enum, source: system, description: "Independent review-axis state: PENDING_MATCH | MATCHED | UNDER_REVIEW | APPROVED | REJECTED" }
      - { name: payout_status, type: enum, source: system, description: "Independent payout-axis state: NOT_PAYABLE | PAYABLE | EXECUTING | PAID | REVERSED" }
      - { name: estimated_payout_cents, type: integer, source: computed, default: 0, description: "Reserve hold amount; computed when review_status=APPROVED, released on PAID/REJECTED/REVERSED" }
      - { name: final_payout_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimSegment.final_segment_payout_cents minus deductible, capped at policy_limit_cents; pinned at PAID transition" }
      - { name: rejection_reason, type: enum, source: system, default: null, description: "EXCLUDED_CAUSE | WAITING_PERIOD | DELAY_BELOW_THRESHOLD | QUOTA_EXHAUSTED | MATCHING_FAILED | MANUAL_DENY | DUPLICATE | null" }
      - { name: payout_batch_id, type: string, source: system, default: null, description: "Set when batched into a PayoutBatch" }
      - { name: assigned_reviewer_id, type: string, source: system, default: null, description: "Opaque user id of reviewer; SoD: cannot equal assigned_approver_id" }
      - { name: assigned_approver_id, type: string, source: system, default: null, description: "Opaque user id of approver; SoD: cannot equal assigned_reviewer_id or payout_operator_id" }
      - { name: payout_operator_id, type: string, source: system, default: null, description: "Opaque user id who triggered payout execution; SoD: cannot equal assigned_approver_id" }
    constraints: "ticket_ids has ≥1 entry, all referencing the same policy_id"

  - name: ClaimSegment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "Parent claim id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from claim" }
      - { name: ticket_id, type: string, source: input, description: "Ticket covered by this segment (must be in claim.ticket_ids)" }
      - { name: flight_id, type: string, source: system, description: "Pulled from ticket at segment creation" }
      - { name: claimed_actual_loss_cents, type: integer, source: input, default: 0, description: "Out-of-pocket expense the passenger claims; ignored when policy.payout_mode=FIXED" }
      - { name: delay_minutes_used, type: integer, source: computed, default: null, description: "Delay used for tier selection; computed at eligibility evaluation per policy.delay_basis" }
      - { name: tier_selected, type: enum, source: computed, default: null, description: "TIER_A | TIER_B | TIER_C | NONE — selected from delay_minutes_used per the tier table; NONE means below threshold (60 min)" }
      - { name: gross_segment_payout_cents, type: integer, source: computed, default: 0, description: "Per-segment payout BEFORE policy-wide deductible/cap (FIXED: tier amount; ACTUAL_LOSS: floor(claimed_actual_loss_cents * reimbursement_rate_bps / 10000))" }
      - { name: final_segment_payout_cents, type: integer, source: computed, default: 0, description: "Per-segment payout AFTER deductible+cap proration; pinned when parent claim transitions to PAID" }
      - { name: eligibility, type: enum, source: computed, description: "ELIGIBLE | EXCLUDED_CAUSE | WAITING_PERIOD | DELAY_BELOW_THRESHOLD | TICKET_NOT_BOUND" }
    constraints: "ticket_id must be in claim.ticket_ids"

  - name: PayoutBatch
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: flight_id, type: string, source: input, description: "Same-flight grouping key (every batched claim must reference at least one segment on this flight)" }
      - { name: claim_ids, type: array, source: system, description: "Claims included in this batch (frozen at STAGED transition)" }
      - { name: review_phase, type: enum, source: system, description: "STAGED | APPROVED | REJECTED — review-axis dimension" }
      - { name: execution_phase, type: enum, source: system, description: "PENDING | EXECUTING | SETTLED | EXCEPTIONS — payout-axis dimension; advances independently after review_phase=APPROVED" }
      - { name: total_planned_payout_cents, type: integer, source: computed, description: "Sum of Claim.estimated_payout_cents at STAGED time (frozen on transition to STAGED)" }
      - { name: total_settled_payout_cents, type: integer, source: computed, default: 0, description: "Running total of cleared dispatches" }
      - { name: exception_claim_ids, type: array, source: system, default: [], description: "Claims that failed dispatch and were isolated; remain in EXECUTING until manual resolution" }
      - { name: assigned_batch_approver_id, type: string, source: system, default: null, description: "Opaque user id; SoD: cannot equal assigned_batch_executor_id" }
      - { name: assigned_batch_executor_id, type: string, source: system, default: null, description: "Opaque user id" }

  - name: ManualReviewCase
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: ticket_id, type: string, source: input, description: "The ticket whose automatic matching failed" }
      - { name: failure_reason, type: enum, source: input, description: "DOC_ID_MISMATCH | NAME_MISMATCH | NO_POLICY_FOUND | POLICY_INACTIVE | DUPLICATE_BINDING" }
      - { name: candidate_policy_ids, type: array, source: input, default: [], description: "Policies that partially matched (for reviewer reference)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_BIND | RESOLVED_REJECT" }
      - { name: resolved_policy_id, type: string, source: system, default: null, description: "Set on RESOLVED_BIND" }
      - { name: assigned_reviewer_id, type: string, source: system, default: null, description: "Opaque user id" }

  - name: ReinsuranceAllocation
    parent: Claim
    common_fields: false                 # append-only allocation ledger
    fields:
      - { name: claim_id, type: string, source: system, description: "Parent claim id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from claim" }
      - { name: primary_share_cents, type: integer, source: computed, description: "Primary insurer absorption per the waterfall" }
      - { name: reinsurer_share_cents, type: integer, source: computed, description: "Reinsurer absorption per the waterfall" }
      - { name: pinned_total_cents, type: integer, source: computed, description: "= Claim.final_payout_cents at PAID time; allocation MUST satisfy primary_share_cents + reinsurer_share_cents == pinned_total_cents" }

  - name: ReserveAdjustment
    parent: Policy
    common_fields: false                 # append-only reserve ledger entry
    fields:
      - { name: policy_id, type: string, source: system, description: "Parent policy id" }
      - { name: insurer_id, type: string, source: system, description: "Inherited from policy" }
      - { name: claim_id, type: string, source: system, description: "Linked claim id" }
      - { name: delta_cents, type: integer, source: input, description: "Signed reserve delta: positive on debit (approval), negative on release (settle/reject/reverse)" }
      - { name: reason, type: enum, source: input, description: "APPROVE_DEBIT | SETTLE_RELEASE | REJECT_RELEASE | REVERSE_REBUILD" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Policy.reserve_balance_cents after this adjustment is applied" }

  - name: AuditLog
    parent: Insurer
    common_fields: false                 # append-only audit trail
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: subject_type, type: enum, source: system, description: "CLAIM | PAYOUT_BATCH | POLICY | FLIGHT — polymorphic subject" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity" }
      - { name: action, type: enum, source: system, description: "STATUS_CHANGE | PAYOUT_RECORDED | RESERVE_ADJUSTED | EXTERNAL_EVENT_EMITTED" }
      - { name: actor_role, type: string, source: system, description: "Role name from RBAC matrix or 'system'" }
      - { name: actor_id, type: string, source: system, description: "Opaque user id" }
      - { name: details, type: object, source: system, description: "Arbitrary JSON payload (from→to states, amounts, etc.)" }

  - name: OutboxEvent
    parent: Insurer
    common_fields: false                 # append-only event-driven sync record
    fields:
      - { name: insurer_id, type: string, source: system, description: "Parent insurer id" }
      - { name: target_system, type: enum, source: system, description: "PAYMENT | BANKING | AIRLINE | POLICY_ADMIN" }
      - { name: event_type, type: string, source: system, description: "e.g., CLAIM_PAID, BATCH_DISPATCHED, RESERVE_RELEASED" }
      - { name: subject_type, type: enum, source: system, description: "CLAIM | PAYOUT_BATCH | POLICY" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity" }
      - { name: payload, type: object, source: system, description: "Arbitrary JSON payload" }
      - { name: dispatch_status, type: enum, source: system, description: "PENDING | DELIVERED | FAILED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Flight
    initial_state: SCHEDULED
    terminal_states: [ARCHIVED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (automatic when Insurer.now_epoch_ms >= scheduled_departure_epoch_ms - 30*60*1000 AND no terminal status reported); evaluated by POST /_sweep/run"
        actor: system
        preconditions: ["Flight has not received a terminal-status FlightStatusEvent (CANCELLED/DIVERTED/RETURNED)"]
        side_effects: []

      - from: SCHEDULED
        to: LANDED
        trigger: "POST /flights/{flightId}/events with reported_status=ON_TIME or DELAYED for a flight whose actual_arrival_epoch_ms can be finalized (≥2 sources agree on actual_arrival within 5 min tolerance)"
        actor: system
        preconditions: ["Multi-source quorum reached (calculations.flight_status_quorum)"]
        side_effects:
          - "Compute classified_cause via calculations.flight_cause_classification"
          - "Trigger ClaimSegment eligibility recompute for every Ticket bound to this flight"
          - "If any matched Claim becomes APPROVABLE, append AuditLog entries"

      - from: ACTIVE
        to: LANDED
        trigger: "POST /flights/{flightId}/events with quorum reached (≥2 sources)"
        actor: system
        preconditions: ["Multi-source quorum reached"]
        side_effects:
          - "Compute classified_cause"
          - "Trigger ClaimSegment eligibility recompute"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flights/{flightId}/events with reported_status=CANCELLED and quorum reached"
        actor: system
        preconditions: ["Multi-source quorum reached"]
        side_effects:
          - "actual_departure_epoch_ms set to null; actual_arrival_epoch_ms set to null"
          - "Compute classified_cause"
          - "ClaimSegment.delay_minutes_used := +∞ sentinel (treated as TIER_C tier)"
          - "Trigger ClaimSegment eligibility recompute"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /flights/{flightId}/events with reported_status=CANCELLED and quorum reached"
        actor: system
        preconditions: ["Multi-source quorum reached"]
        side_effects:
          - "Compute classified_cause"
          - "Trigger ClaimSegment eligibility recompute"

      - from: ACTIVE
        to: DIVERTED
        trigger: "POST /flights/{flightId}/events with reported_status=DIVERTED and quorum reached"
        actor: system
        preconditions: ["Multi-source quorum reached"]
        side_effects:
          - "actual_arrival_epoch_ms set to diverted-airport arrival"
          - "Compute classified_cause"
          - "Trigger ClaimSegment eligibility recompute"

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /flights/{flightId}/events with reported_status=RETURNED and quorum reached"
        actor: system
        preconditions: ["Multi-source quorum reached"]
        side_effects:
          - "actual_arrival_epoch_ms set to return-to-origin arrival"
          - "Compute classified_cause"
          - "Trigger ClaimSegment eligibility recompute"

      - from: LANDED
        to: ARCHIVED
        trigger: "POST /flights/{flightId}/archive (manual) or system sweep when (Insurer.now_epoch_ms - scheduled_arrival_epoch_ms) > 90 days"
        actor: ClaimsAdmin | system
        preconditions: ["No Claim referencing this flight is in (PENDING_MATCH, MATCHED, UNDER_REVIEW, APPROVED) review_status"]
        side_effects: ["archived_at_epoch_ms = Insurer.now_epoch_ms"]

      - from: CANCELLED
        to: ARCHIVED
        trigger: "POST /flights/{flightId}/archive or system sweep"
        actor: ClaimsAdmin | system
        preconditions: ["No Claim in non-terminal review_status references this flight"]
        side_effects: ["archived_at_epoch_ms = Insurer.now_epoch_ms"]

      - from: DIVERTED
        to: ARCHIVED
        trigger: "POST /flights/{flightId}/archive or system sweep"
        actor: ClaimsAdmin | system
        preconditions: ["No Claim in non-terminal review_status references this flight"]
        side_effects: ["archived_at_epoch_ms = Insurer.now_epoch_ms"]

      - from: RETURNED
        to: ARCHIVED
        trigger: "POST /flights/{flightId}/archive or system sweep"
        actor: ClaimsAdmin | system
        preconditions: ["No Claim in non-terminal review_status references this flight"]
        side_effects: ["archived_at_epoch_ms = Insurer.now_epoch_ms"]
    note: "Branching shape: SCHEDULED/ACTIVE diverges into one of {LANDED, CANCELLED, DIVERTED, RETURNED} based on multi-source quorum, then converges at ARCHIVED. Each branch carries a different side-effect set (CANCELLED yields +∞ delay sentinel; DIVERTED/RETURNED set actual_arrival differently)."

  # ---------------------------------------------------------------------------
  - entity: Ticket
    initial_state: ATTACHED
    terminal_states: [REFUNDED, UNMATCHED]
    transitions:
      - from: ATTACHED
        to: CHANGED
        trigger: "POST /tickets/{ticketId}/change with new flight_id"
        actor: PolicyAdmin
        preconditions:
          - "New flight exists in same insurer (ERR_FLIGHT_NOT_FOUND)"
          - "No Claim in (UNDER_REVIEW, APPROVED) review_status references this ticket (ERR_TICKET_LOCKED_BY_CLAIM)"
        side_effects:
          - "scheduled_departure_epoch_ms / scheduled_arrival_epoch_ms re-snapshot from new flight"
          - "Any DRAFT Claim referencing this ticket has its segment recomputed"

      - from: CHANGED
        to: ATTACHED
        trigger: "POST /tickets/{ticketId}/confirm — operator confirms the change is complete"
        actor: PolicyAdmin
        preconditions: []
        side_effects: []
        note: "Cycle: ATTACHED → CHANGED → ATTACHED is the revision loop. Allows multiple change-confirm rounds."

      - from: ATTACHED
        to: REFUNDED
        trigger: "POST /tickets/{ticketId}/refund"
        actor: PolicyAdmin
        preconditions:
          - "No Claim referencing this ticket is in (APPROVED, EXECUTING, PAID) (ERR_TICKET_LOCKED_BY_CLAIM)"
        side_effects:
          - "Any DRAFT/MATCHED Claim referencing this ticket transitions Claim.review_status to REJECTED with rejection_reason=DUPLICATE if the refund implies coverage void"

      - from: CHANGED
        to: REFUNDED
        trigger: "POST /tickets/{ticketId}/refund"
        actor: PolicyAdmin
        preconditions: ["No Claim in (APPROVED, EXECUTING, PAID) references this ticket"]
        side_effects: []

      - from: ATTACHED
        to: UNMATCHED
        trigger: "system (automatic when Ticket fails matching against any Policy at ingest); also POST /tickets via auto-match endpoint with no candidate"
        actor: system
        preconditions: ["passenger_doc_id does not match Policy.policy_holder_doc_id of any ACTIVE policy in same insurer"]
        side_effects: ["Create ManualReviewCase(ticket_id=this, failure_reason=DOC_ID_MISMATCH or similar)"]

  # ---------------------------------------------------------------------------
  - entity: Claim
    initial_state: PENDING_MATCH        # initial value of review_status; payout_status starts NOT_PAYABLE
    terminal_states:
      review_axis: [REJECTED]
      payout_axis: [REVERSED]
    note: "Parallel dimensions: review_status (PENDING_MATCH→MATCHED→UNDER_REVIEW→APPROVED/REJECTED, with revert UNDER_REVIEW→MATCHED) and payout_status (NOT_PAYABLE→PAYABLE→EXECUTING→PAID/REVERSED) advance independently. payout_status MUST remain NOT_PAYABLE until review_status=APPROVED, at which point payout_status auto-flips to PAYABLE. Revert UNDER_REVIEW→MATCHED forms a cycle on the review axis."
    transitions:
      # --- Review axis ---
      - from: PENDING_MATCH
        to: MATCHED
        trigger: "POST /claims (creation) — successful auto-match (ticket.passenger_doc_id == policy.policy_holder_doc_id), or POST /manual_review/{caseId}/resolve_bind"
        actor: system | ClaimsReviewer
        preconditions:
          - "Every ticket_id resolves to a Ticket whose (passenger_doc_id, policy_id) pairs match Policy.policy_holder_doc_id, OR the ticket is bound to this policy via a resolved ManualReviewCase"
          - "Every referenced Ticket.status IN {ATTACHED, CHANGED}"
        side_effects:
          - "Append AuditLog(STATUS_CHANGE, PENDING_MATCH→MATCHED)"

      - from: PENDING_MATCH
        to: REJECTED
        trigger: "system (automatic when matching fails AND no manual review opened, or when a referenced ticket is REFUNDED)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_reason = MATCHING_FAILED"
          - "Append AuditLog"

      - from: MATCHED
        to: UNDER_REVIEW
        trigger: "POST /claims/{claimId}/submit_review"
        actor: ClaimsReviewer
        preconditions:
          - "Flight referenced by every segment is in {LANDED, CANCELLED, DIVERTED, RETURNED} (ERR_FLIGHT_NOT_FINALIZED)"
          - "Insurer.now_epoch_ms >= ticket.scheduled_departure_epoch_ms + policy.waiting_period_ms (ERR_WAITING_PERIOD_NOT_MET) — checked per segment"
          - "assigned_reviewer_id is set (request body)"
        side_effects:
          - "Compute ClaimSegment.delay_minutes_used (calculations.delay_duration)"
          - "Compute ClaimSegment.eligibility (ELIGIBLE / EXCLUDED_CAUSE / WAITING_PERIOD / DELAY_BELOW_THRESHOLD / TICKET_NOT_BOUND)"
          - "Compute ClaimSegment.gross_segment_payout_cents per calculations.tiered_compensation"

      - from: UNDER_REVIEW
        to: MATCHED
        trigger: "POST /claims/{claimId}/return_to_match — reviewer requests resubmission (e.g., new evidence)"
        actor: ClaimsReviewer
        preconditions: ["Claim has assigned_reviewer_id; the call's X-User-ID equals assigned_reviewer_id"]
        side_effects:
          - "Clear assigned_reviewer_id"
          - "Append AuditLog"
        note: "Cyclic transition: MATCHED → UNDER_REVIEW → MATCHED. Allows re-review rounds."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: ClaimsApprover
        preconditions:
          - "Every ClaimSegment.eligibility = ELIGIBLE (else ERR_CLAIM_NOT_ELIGIBLE with rejection_reason hint)"
          - "policy.claim_quota_used_cents + estimated_payout_cents <= policy.claim_quota_total_cents (ERR_QUOTA_EXHAUSTED)"
          - "X-User-ID != claim.assigned_reviewer_id (SoD: ERR_SOD_VIOLATION)"
          - "request body sets assigned_approver_id = X-User-ID"
        side_effects:
          - "estimated_payout_cents = sum(ClaimSegment.gross_segment_payout_cents) - policy.deductible_cents (floored at 0); capped at policy.policy_limit_cents"
          - "policy.reserve_balance_cents += estimated_payout_cents"
          - "Append ReserveAdjustment(reason=APPROVE_DEBIT, delta=+estimated_payout_cents)"
          - "payout_status auto-transitions NOT_PAYABLE→PAYABLE"
          - "Append AuditLog"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /claims/{claimId}/reject"
        actor: ClaimsReviewer | ClaimsApprover
        preconditions: ["request body provides rejection_reason ∈ {EXCLUDED_CAUSE, WAITING_PERIOD, DELAY_BELOW_THRESHOLD, MANUAL_DENY}"]
        side_effects:
          - "rejection_reason set"
          - "Append AuditLog"

      # --- Payout axis (parallel, gated by review_status=APPROVED) ---
      - from: PAYABLE
        to: EXECUTING
        trigger: "POST /payout_batches/{batchId}/execute (sets all child Claim payout_status to EXECUTING, skipping exceptions)"
        actor: PayoutOperator
        preconditions:
          - "Parent PayoutBatch.review_phase = APPROVED (ERR_BATCH_NOT_APPROVED)"
          - "claim.review_status = APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "X-User-ID = batch.assigned_batch_executor_id (and != batch.assigned_batch_approver_id, SoD)"
          - "X-User-ID != claim.assigned_approver_id (SoD)"
        side_effects:
          - "payout_operator_id = X-User-ID"
          - "Emit OutboxEvent(target=BANKING, event_type=BATCH_DISPATCHED, payload includes claim_id, amount)"

      - from: EXECUTING
        to: PAID
        trigger: "POST /claims/{claimId}/settle — banking system confirms successful dispatch"
        actor: PayoutOperator | system
        preconditions: ["claim.payout_status = EXECUTING"]
        side_effects:
          - "final_payout_cents = estimated_payout_cents (pinned)"
          - "Compute ClaimSegment.final_segment_payout_cents (pro-rated)"
          - "policy.reserve_balance_cents -= estimated_payout_cents"
          - "policy.claim_quota_used_cents += final_payout_cents"
          - "Append ReserveAdjustment(reason=SETTLE_RELEASE, delta=-estimated_payout_cents)"
          - "Compute ReinsuranceAllocation per calculations.reinsurance_waterfall; append one ReinsuranceAllocation row"
          - "Update parent PayoutBatch.total_settled_payout_cents"
          - "Emit OutboxEvent(target=PAYMENT, event_type=CLAIM_PAID); Emit OutboxEvent(target=POLICY_ADMIN, event_type=CLAIM_PAID); Emit OutboxEvent(target=AIRLINE, event_type=CLAIM_PAID)"
          - "Append AuditLog(action=PAYOUT_RECORDED)"
          - "If parent PayoutBatch has all claims in {PAID, REVERSED}: PayoutBatch.execution_phase → SETTLED"

      - from: EXECUTING
        to: PAYABLE
        trigger: "POST /claims/{claimId}/mark_exception — banking dispatch failed; isolate claim back to PAYABLE for retry"
        actor: PayoutOperator | system
        preconditions: ["claim.payout_status = EXECUTING"]
        side_effects:
          - "Add claim_id to PayoutBatch.exception_claim_ids"
          - "PayoutBatch.execution_phase → EXCEPTIONS if not already"
          - "Append AuditLog"

      - from: PAID
        to: REVERSED
        trigger: "POST /claims/{claimId}/reverse — funds clawed back (rare admin action)"
        actor: ClaimsAdmin
        preconditions: ["claim.payout_status = PAID", "X-User-Role = ClaimsAdmin"]
        side_effects:
          - "policy.reserve_balance_cents += final_payout_cents (reserve rebuilt)"
          - "policy.claim_quota_used_cents -= final_payout_cents"
          - "Append ReserveAdjustment(reason=REVERSE_REBUILD, delta=+final_payout_cents)"
          - "Emit OutboxEvent(target=BANKING, event_type=CLAIM_REVERSED)"
          - "Append AuditLog"

  # ---------------------------------------------------------------------------
  - entity: PayoutBatch
    initial_state: STAGED
    terminal_states:
      review_phase: [REJECTED]
      execution_phase: [SETTLED]
    note: "Parallel-dimension state: review_phase (STAGED→APPROVED/REJECTED) and execution_phase (PENDING→EXECUTING→SETTLED, with EXCEPTIONS branch). Execution can only start after review_phase=APPROVED. EXCEPTIONS isolates failed dispatches without halting the SETTLED transition for the rest."
    transitions:
      - from: STAGED                # review_phase
        to: APPROVED
        trigger: "POST /payout_batches/{batchId}/approve"
        actor: BatchApprover
        preconditions:
          - "Every claim in claim_ids has review_status=APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "X-User-ID set as assigned_batch_approver_id"
          - "X-User-ID NOT in {claim.assigned_approver_id : for each claim} (SoD: ERR_SOD_VIOLATION) — i.e., a claim's per-claim approver cannot be the batch approver for that same claim"
        side_effects:
          - "execution_phase remains PENDING (independent axis)"
          - "Append AuditLog"

      - from: STAGED
        to: REJECTED
        trigger: "POST /payout_batches/{batchId}/reject"
        actor: BatchApprover
        preconditions: []
        side_effects:
          - "Each claim's payout_status remains PAYABLE; reserves NOT released (claim is still APPROVED on review axis)"
          - "Append AuditLog"

      - from: PENDING               # execution_phase
        to: EXECUTING
        trigger: "POST /payout_batches/{batchId}/execute"
        actor: BatchExecutor
        preconditions:
          - "review_phase = APPROVED (ERR_BATCH_NOT_APPROVED)"
          - "X-User-ID = assigned_batch_executor_id (set in request body); X-User-ID != assigned_batch_approver_id (SoD)"
        side_effects:
          - "Each claim payout_status: PAYABLE → EXECUTING"
          - "Emit OutboxEvent for each claim"

      - from: EXECUTING
        to: SETTLED
        trigger: "system (automatic when every claim_id is in payout_status ∈ {PAID, REVERSED} AND no exception_claim_ids remain unresolved)"
        actor: system
        preconditions:
          - "exception_claim_ids is empty (else stays EXCEPTIONS)"
          - "All claim_ids in payout_status PAID or REVERSED"
        side_effects: ["Append AuditLog"]

      - from: EXECUTING
        to: EXCEPTIONS
        trigger: "system (automatic when at least one claim transitions EXECUTING→PAYABLE via mark_exception)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXCEPTIONS
        to: EXECUTING
        trigger: "POST /payout_batches/{batchId}/retry_exceptions — re-dispatch only exception_claim_ids"
        actor: BatchExecutor
        preconditions: []
        side_effects: ["exception_claim_ids cleared; each retried claim payout_status PAYABLE → EXECUTING"]

  # ---------------------------------------------------------------------------
  - entity: ManualReviewCase
    initial_state: OPEN
    terminal_states: [RESOLVED_BIND, RESOLVED_REJECT]
    transitions:
      - from: OPEN
        to: RESOLVED_BIND
        trigger: "POST /manual_review/{caseId}/resolve_bind"
        actor: ClaimsReviewer
        preconditions:
          - "request body provides resolved_policy_id; that policy is ACTIVE (ERR_POLICY_INACTIVE)"
          - "ticket.status IN {ATTACHED, CHANGED}"
        side_effects:
          - "Bind ticket to resolved_policy_id (Ticket.policy_id := resolved_policy_id)"
          - "Ticket.status remains ATTACHED"
          - "Auto-create or advance Claim.review_status to MATCHED for any pending claim referencing this ticket"

      - from: OPEN
        to: RESOLVED_REJECT
        trigger: "POST /manual_review/{caseId}/resolve_reject"
        actor: ClaimsReviewer
        preconditions: []
        side_effects:
          - "Ticket.status → UNMATCHED"
          - "Any pending Claim referencing this ticket: Claim.review_status → REJECTED, rejection_reason=MATCHING_FAILED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two reviewers approve the same claim simultaneously (or approve-and-reject race)"
    guarantee: "Exactly one transition succeeds; the loser observes the new state and is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.review_status"

  - scenario: "Two operators dispatch the same PayoutBatch simultaneously"
    guarantee: "At most one PayoutBatch enters EXECUTING; the loser is rejected"
    error_id: ERR_BATCH_ALREADY_DISPATCHED
    http_status: 409
    serialization: "First-writer-wins on PayoutBatch.execution_phase"

  - scenario: "Two FlightStatusEvent ingests with the same (source, source_event_id) arrive simultaneously"
    guarantee: "Exactly one event is persisted; the duplicate is rejected idempotently"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    serialization: "Unique constraint on (insurer_id, source, source_event_id)"

  - scenario: "Two operators settle the same claim in the same payout batch concurrently"
    guarantee: "Reserve is released exactly once; the second settle is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.payout_status (EXECUTING→PAID)"

  - scenario: "Approve claim while parent policy is being terminated"
    guarantee: "If policy reaches TERMINATED before approve commits, approve is rejected; otherwise approve wins"
    error_id: ERR_POLICY_INACTIVE
    http_status: 409
    serialization: "First-writer-wins on Policy.status"

  - scenario: "Two manual-review operators resolve the same case concurrently"
    guarantee: "Exactly one resolution applies; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ManualReviewCase.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --------------------------------------------------------------------- 1
  - name: delay_duration
    trigger: "Claim.review_status MATCHED→UNDER_REVIEW (per ClaimSegment); also recomputed when Flight reaches terminal state"
    algorithm: dual_variant_temporal_diff
    formula: |
      Let F = ClaimSegment.flight (after Flight is in {LANDED, CANCELLED, DIVERTED, RETURNED}).

      VARIANT A (DEPARTURE-based, used when policy.delay_basis = DEPARTURE):
        if F.status = CANCELLED: delay_minutes = +∞ (sentinel: 99_999_999)
        else: delay_minutes = floor((F.actual_departure_epoch_ms - F.scheduled_departure_epoch_ms) / 60000)

      VARIANT B (ARRIVAL-based, used when policy.delay_basis = ARRIVAL):
        if F.status = CANCELLED: delay_minutes = +∞ (sentinel: 99_999_999)
        elif F.status = RETURNED: delay_minutes = +∞ (return-to-origin treated as full cancellation for arrival)
        else: delay_minutes = floor((F.actual_arrival_epoch_ms - F.scheduled_arrival_epoch_ms) / 60000)

      ClaimSegment.delay_minutes_used := variant selected by policy.delay_basis
    input_set: "ClaimSegment.flight where flight.status ∈ {LANDED, CANCELLED, DIVERTED, RETURNED}"
    constants:
      INFINITY_SENTINEL: 99999999
    precision: "minute-precision via floor; ms granularity is dropped"
    variants:
      - name: departure_based
        when: "policy.delay_basis = DEPARTURE"
        difference: "Uses scheduled vs actual DEPARTURE; identical inputs to arrival-based produce different minute values when the flight made up time in air or lost time on arrival."
      - name: arrival_based
        when: "policy.delay_basis = ARRIVAL"
        difference: "Uses scheduled vs actual ARRIVAL; differs from departure variant by (delta_arrival_minutes - delta_departure_minutes). Same flight can be tier-A under one variant and tier-B under the other."

  # --------------------------------------------------------------------- 2
  - name: tiered_compensation
    trigger: "Claim.review_status MATCHED→UNDER_REVIEW (per ClaimSegment)"
    algorithm: tiered_pricing
    formula: |
      Inputs: delay_minutes_used (from delay_duration), policy.payout_mode,
              policy.reimbursement_rate_bps, ClaimSegment.claimed_actual_loss_cents.

      TIER selection (uses STRICT >= boundaries — boundary precision check):
        if delay_minutes_used >= 360 OR delay_minutes_used == INFINITY_SENTINEL:
          tier_selected = TIER_C; tier_amount_cents = 60000   # €600
        elif delay_minutes_used >= 180:
          tier_selected = TIER_B; tier_amount_cents = 25000   # €250
        elif delay_minutes_used >= 60:
          tier_selected = TIER_A; tier_amount_cents = 10000   # €100
        else:
          tier_selected = NONE; tier_amount_cents = 0
          ClaimSegment.eligibility = DELAY_BELOW_THRESHOLD

      Per-segment gross payout:
        if policy.payout_mode = FIXED:
          gross_segment_payout_cents = tier_amount_cents
        else:                                                 # ACTUAL_LOSS
          gross_segment_payout_cents = floor(claimed_actual_loss_cents * reimbursement_rate_bps / 10000)
                                       capped at tier_amount_cents
                                       (i.e. min(floor(...), tier_amount_cents))

      ClaimSegment.gross_segment_payout_cents := per above.
    input_set: "ClaimSegment rows of a Claim in UNDER_REVIEW review_status"
    constants:
      TIER_A_MIN_MINUTES: 60
      TIER_B_MIN_MINUTES: 180
      TIER_C_MIN_MINUTES: 360
      TIER_A_AMOUNT_CENTS: 10000
      TIER_B_AMOUNT_CENTS: 25000
      TIER_C_AMOUNT_CENTS: 60000
      BPS_DENOMINATOR: 10000
    precision: "Cents (integer); floor truncation on rate-bps math"

  # --------------------------------------------------------------------- 3
  - name: multi_segment_combined_payout
    trigger: "Claim.review_status UNDER_REVIEW→APPROVED (estimated_payout); Claim payout_status EXECUTING→PAID (final_payout)"
    algorithm: aggregation
    formula: |
      Inputs: ClaimSegment.gross_segment_payout_cents over all ELIGIBLE segments of the claim,
              policy.deductible_cents, policy.policy_limit_cents.

      Step 1 (PINNED rounding order — per-segment then sum):
        sum_gross_cents = sum(ClaimSegment.gross_segment_payout_cents
                              for seg in claim.segments
                              if seg.eligibility == ELIGIBLE)
        # Note: gross_segment_payout_cents is already floor-rounded per segment in calc 2.
        # The pinned order is "round per segment THEN sum"; do NOT recompute by
        # summing raw expenses then rate-multiplying. The computed sum_gross_cents
        # MAY differ in cents from sum-then-round under ACTUAL_LOSS mode.

      Step 2 (deductible — applied ONCE per claim, NOT per segment):
        net_cents = max(0, sum_gross_cents - policy.deductible_cents)

      Step 3 (cap):
        capped_cents = min(net_cents, policy.policy_limit_cents)

      Step 4 (per-segment final pro-ration, executed at PAID):
        for seg in eligible_segments:
          if sum_gross_cents == 0:
            seg.final_segment_payout_cents = 0
          else:
            seg.final_segment_payout_cents = floor(seg.gross_segment_payout_cents * capped_cents / sum_gross_cents)
        # Allocate any residue (capped_cents - sum(seg.final_segment_payout_cents))
        # to the segment with the largest gross_segment_payout_cents
        # (tie-break: smallest ClaimSegment.id lexicographically).

      OUTPUT: claim.estimated_payout_cents (at APPROVED) and claim.final_payout_cents (at PAID) := capped_cents.
    input_set: "ClaimSegments where eligibility = ELIGIBLE; non-eligible segments contribute 0"
    constants: {}
    precision: "Cents (integer); floor on pro-ration; explicit residue allocation"
    variants:
      - name: estimated
        when: "Claim.review_status transitions UNDER_REVIEW→APPROVED"
        difference: "Pins claim.estimated_payout_cents and debits Policy.reserve_balance_cents, but does NOT consume claim_quota_used_cents. Per-segment final amounts are NOT yet pinned."
      - name: final
        when: "Claim.payout_status transitions EXECUTING→PAID"
        difference: "Pins claim.final_payout_cents (= estimated_payout_cents), pro-rates to ClaimSegment.final_segment_payout_cents, and consumes claim_quota_used_cents. Reserve is released."

  # --------------------------------------------------------------------- 4
  - name: reinsurance_waterfall
    trigger: "Claim.payout_status EXECUTING→PAID"
    algorithm: waterfall_allocation
    formula: |
      # The waterfall has a circular look: primary insurer absorbs first PRIMARY_RETENTION_CENTS,
      # then reinsurer absorbs up to REINSURER_LAYER_CENTS, then primary absorbs the rest.
      # Pin evaluation order to break the loop:
      #   primary_first  = min(final_payout, PRIMARY_RETENTION_CENTS)
      #   reinsurer      = min(max(0, final_payout - primary_first), REINSURER_LAYER_CENTS)
      #   primary_excess = max(0, final_payout - primary_first - reinsurer)
      #   primary_share  = primary_first + primary_excess
      # Invariant: primary_share + reinsurer_share == final_payout (exact, no rounding).

      Append ReinsuranceAllocation(
        claim_id, primary_share_cents=primary_share,
        reinsurer_share_cents=reinsurer, pinned_total_cents=final_payout)
    input_set: "Claim.final_payout_cents at PAID"
    constants:
      PRIMARY_RETENTION_CENTS: 50000           # €500 retained by primary first
      REINSURER_LAYER_CENTS:   30000           # €300 reinsurer layer
    precision: "Exact cents; no rounding"

  # --------------------------------------------------------------------- 5
  - name: reserve_balance
    trigger: "Claim review_status=APPROVED, payout_status=PAID, payout_status=REVERSED, review_status=REJECTED"
    algorithm: dual_variant_aggregation
    formula: |
      VARIANT A (OPTIMISTIC — pinned, used for Policy.reserve_balance_cents):
        reserve_balance_cents = sum(claim.estimated_payout_cents
                                    for claim in policy.claims
                                    where claim.payout_status IN {PAYABLE, EXECUTING}
                                    AND claim.review_status = APPROVED)
        # Reverses also rebuild reserve: when payout_status flips PAID→REVERSED,
        # the reserve is rebuilt with delta = +final_payout_cents.

      VARIANT B (PESSIMISTIC — exposed via GET /policies/{id}/risk_view; NOT stored):
        pessimistic_reserve_cents = sum(claim.estimated_payout_cents
                                        for claim in policy.claims
                                        where claim.review_status IN {UNDER_REVIEW, APPROVED}
                                        AND claim.payout_status != PAID)
        # Includes UNDER_REVIEW claims that have computed gross payouts but are not yet APPROVED.
        # Differs from variant A whenever the policy has at least one UNDER_REVIEW claim.

      Append ReserveAdjustment(reason, delta) on every change to variant A.
    input_set: "Claims under a Policy"
    constants: {}
    precision: "Cents (integer)"
    variants:
      - name: optimistic
        when: "Stored as Policy.reserve_balance_cents; only counts APPROVED claims"
        difference: "Lower number; ignores UNDER_REVIEW exposure."
      - name: pessimistic
        when: "Returned by GET /policies/{policyId}/risk_view; counts UNDER_REVIEW + APPROVED"
        difference: "Higher number when at least one claim is UNDER_REVIEW; same number when all in-flight claims are APPROVED."

  # --------------------------------------------------------------------- 6
  - name: flight_status_quorum
    trigger: "POST /flights/{flightId}/events"
    algorithm: aggregation
    formula: |
      For each pending Flight (status ∈ {SCHEDULED, ACTIVE}) consider the FlightStatusEvent rows whose
      ingested_epoch_ms is within QUORUM_WINDOW_MS of the most recent event's ingested_epoch_ms,
      grouped by (reported_status). Quorum reached iff:
        - count of distinct sources reporting the same reported_status >= 2, AND
        - distinct sources include at least one of {AIRLINE, AVIATION_AUTHORITY}.
      Tie-break when two distinct reported_status values both have ≥2 sources:
        prefer the status with the most-recent quorum-completing event (max ingested_epoch_ms);
        on equal max, prefer order CANCELLED > DIVERTED > RETURNED > LANDED > ON_TIME (most-disruptive wins).
    input_set: "FlightStatusEvent rows for the flight within QUORUM_WINDOW_MS"
    constants:
      QUORUM_WINDOW_MS: 1800000           # 30 minutes
      MIN_SOURCES_FOR_QUORUM: 2

  # --------------------------------------------------------------------- 7
  - name: flight_cause_classification
    trigger: "Flight terminal-state transition (LANDED/CANCELLED/DIVERTED/RETURNED)"
    algorithm: aggregation
    formula: |
      Among the FlightStatusEvent rows that contributed to the quorum (per flight_status_quorum),
      tally reported_cause (treating null as OTHER):
        winner = mode(reported_cause) over the quorum events
      Tie-break:
        - first by source priority: AVIATION_AUTHORITY > AIRPORT > AIRLINE,
        - then by latest ingested_epoch_ms among the highest-priority sources.
      Flight.classified_cause := winner.

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except GET /_health"

  - priority: 2
    category: auth
    check: "Role must be permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path parameters must resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced resources (policy_id, ticket_id, flight_id, claim_id) must exist within the same insurer"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /tickets, POST /claims, POST /flights/{id}/events, POST /payout_batches"

  - priority: 5
    category: business_safety            # SoD comes BEFORE state — segregation of duties is a regulatory hard-stop
    check: "Segregation of duties: a claim's reviewer cannot also approve it; an approver cannot also be a payout operator; a per-claim approver cannot be the batch approver for any batch containing that claim"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /claims/{id}/approve, POST /payout_batches/{id}/approve, POST /payout_batches/{id}/execute, POST /claims/{id}/settle"

  - priority: 6
    category: state
    check: "Target resource is in a state where the requested transition is not allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-mutating endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity preconditions: Flight must be in {LANDED, CANCELLED, DIVERTED, RETURNED} before claim review; Policy must be ACTIVE during claim approval; PayoutBatch.review_phase=APPROVED before execution; every claim in batch must have review_status=APPROVED"
    error_id: ERR_FLIGHT_NOT_FINALIZED       # primary; ERR_POLICY_INACTIVE, ERR_BATCH_NOT_APPROVED, ERR_CLAIM_NOT_APPROVED also apply by context
    http_status: 409
    applies_to: "POST /claims/{id}/submit_review, POST /claims/{id}/approve, POST /payout_batches/{id}/execute"

  - priority: 8
    category: business_temporal
    check: "Waiting period: ticket.scheduled_departure_epoch_ms - policy.effective_from_epoch_ms must be ≥ policy.waiting_period_ms; checked at claim review submission"
    error_id: ERR_WAITING_PERIOD_NOT_MET
    http_status: 409
    applies_to: "POST /claims/{id}/submit_review"

  - priority: 9
    category: business_constraint
    check: "Delay-cause exclusion: if Flight.classified_cause ∈ policy.excluded_delay_causes for any segment, the segment's eligibility is EXCLUDED_CAUSE; claim cannot be approved with any non-ELIGIBLE segment"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "Delay below threshold: ClaimSegment.delay_minutes_used < 60 (TIER_A_MIN_MINUTES) makes that segment DELAY_BELOW_THRESHOLD"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Quota exhaustion: policy.claim_quota_used_cents + estimated_payout_cents > policy.claim_quota_total_cents"
    error_id: ERR_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "Ticket binding: claim.ticket_ids must all reference Ticket.status IN {ATTACHED, CHANGED}; REFUNDED or UNMATCHED tickets block claim review"
    error_id: ERR_TICKET_NOT_BOUND
    http_status: 409
    applies_to: "POST /claims/{id}/submit_review"

  - priority: 13
    category: business_constraint
    check: "Idempotency on event ingest: (insurer_id, source, source_event_id) must be unique"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    applies_to: "POST /flights/{id}/events"

  - priority: 14
    category: business_constraint
    check: "Same-flight batching: every claim in a PayoutBatch must reference at least one segment whose flight_id equals the batch's flight_id"
    error_id: ERR_BATCH_FLIGHT_MISMATCH
    http_status: 409
    applies_to: "POST /payout_batches"

  - priority: 15
    category: business_constraint
    check: "Reserve invariant: Policy.reserve_balance_cents MUST equal sum of claim.estimated_payout_cents over claims in (PAYABLE | EXECUTING) at all times; recompute endpoint exposes drift"
    error_id: ERR_RESERVE_DRIFT
    http_status: 409
    applies_to: "GET /policies/{id}/risk_view, POST /_invariant/check"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Insurer (root) ---
  - method: POST
    path: "/insurers"
    description: "Create an insurer (root tenant)"
    roles: [ClaimsAdmin]
    code: 201
    input: [name, currency]
    output: Insurer
    side_effects: ["now_epoch_ms=0, total_outstanding_reserve_cents=0"]

  - method: GET
    path: "/insurers/{insurerId}"
    description: "Get insurer"
    roles: [Any]
    code: 200
    input: []
    output: Insurer
    side_effects: []

  # --- Test driver endpoints ---
  - method: POST
    path: "/insurers/{insurerId}/_clock/advance"
    description: "Advance the test clock by delta_ms (or to absolute epoch_ms)"
    roles: [ClaimsAdmin]
    code: 200
    input: ["delta_ms? (integer >=0)", "to_epoch_ms? (integer)"]
    output: Insurer
    side_effects: ["Insurer.now_epoch_ms updated; pending Flight transitions evaluated by next /_sweep/run"]

  - method: POST
    path: "/insurers/{insurerId}/_sweep/run"
    description: "Trigger system sweep: SCHEDULED→ACTIVE, archive eligibility, batch SETTLED check"
    roles: [ClaimsAdmin, system]
    code: 200
    input: []
    output: "{ flights_advanced: N, batches_settled: N, claims_auto_rejected: N }"
    side_effects: ["Multiple state machines may advance; AuditLog entries appended"]

  - method: POST
    path: "/insurers/{insurerId}/_invariant/check"
    description: "Recompute and verify reserve_balance and claim_quota_used invariants"
    roles: [ClaimsAdmin, Auditor]
    code: 200
    input: []
    output: "{ ok: bool, drift: [{policy_id, expected, observed}] }"
    side_effects: ["ERR_RESERVE_DRIFT if any policy's stored reserve diverges from recomputed value"]

  # --- Policy ---
  - method: POST
    path: "/insurers/{insurerId}/policies"
    description: "Create a policy"
    roles: [PolicyAdmin, ClaimsAdmin]
    code: 201
    input: ["policy_holder_name", "policy_holder_doc_id", "effective_from_epoch_ms", "effective_to_epoch_ms", "waiting_period_ms?", "delay_basis", "payout_mode", "reimbursement_rate_bps?", "deductible_cents?", "policy_limit_cents", "claim_quota_total_cents", "excluded_delay_causes?"]
    output: Policy
    side_effects: ["status=ACTIVE; balances initialized to 0"]

  - method: GET
    path: "/insurers/{insurerId}/policies/{policyId}"
    description: "Get policy"
    roles: [Any]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/insurers/{insurerId}/policies/{policyId}/risk_view"
    description: "Pessimistic-reserve view; computes variant B of reserve_balance"
    roles: [PolicyAdmin, ClaimsAdmin, Auditor]
    code: 200
    input: []
    output: "{ optimistic_reserve_cents, pessimistic_reserve_cents, claim_quota_remaining_cents }"
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/policies/{policyId}/suspend"
    description: "Suspend a policy (no new claims)"
    roles: [PolicyAdmin]
    code: 200
    input: [reason]
    output: Policy
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/insurers/{insurerId}/policies/{policyId}/terminate"
    description: "Terminate a policy"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: ["status → TERMINATED"]

  # --- Ticket ---
  - method: POST
    path: "/insurers/{insurerId}/tickets"
    description: "Ingest a ticket; auto-match to a policy by passenger_doc_id"
    roles: [PolicyAdmin]
    code: 201
    input: ["policy_id?", "passenger_name", "passenger_doc_id", "pnr_code", "flight_id"]
    output: Ticket
    side_effects:
      - "If policy_id provided: bind directly (POLICY_ID guard wins)"
      - "Else auto-match: pick the unique ACTIVE Policy whose policy_holder_doc_id == passenger_doc_id; on >1 match, status=UNMATCHED + create ManualReviewCase(failure_reason=DUPLICATE_BINDING)"
      - "On no match: status=UNMATCHED + create ManualReviewCase(failure_reason=NO_POLICY_FOUND)"
      - "On match: status=ATTACHED; snapshot scheduled_departure/arrival from flight"

  - method: GET
    path: "/insurers/{insurerId}/tickets/{ticketId}"
    description: "Get ticket"
    roles: [Any]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/tickets/{ticketId}/change"
    description: "Mark ticket as CHANGED (rebooked to new flight)"
    roles: [PolicyAdmin]
    code: 200
    input: [flight_id]
    output: Ticket
    side_effects: ["Re-snapshot scheduled_*; status → CHANGED"]

  - method: POST
    path: "/insurers/{insurerId}/tickets/{ticketId}/confirm"
    description: "Confirm a CHANGED ticket back to ATTACHED"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status → ATTACHED"]

  - method: POST
    path: "/insurers/{insurerId}/tickets/{ticketId}/refund"
    description: "Mark ticket as REFUNDED"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status → REFUNDED; cascade to dependent claims"]

  # --- Flight ---
  - method: POST
    path: "/insurers/{insurerId}/flights"
    description: "Create a Flight"
    roles: [ClaimsAdmin, PolicyAdmin]
    code: 201
    input: [carrier_code, flight_number, origin_airport, destination_airport, scheduled_departure_epoch_ms, scheduled_arrival_epoch_ms]
    output: Flight
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/insurers/{insurerId}/flights/{flightId}"
    description: "Get a flight"
    roles: [Any]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: GET
    path: "/insurers/{insurerId}/flights"
    description: "List flights with filters"
    roles: [Any]
    code: 200
    input: ["carrier_code?", "flight_number?", "status?", "scheduled_departure_after_epoch_ms?"]
    output: "Flight[]"
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/flights/{flightId}/events"
    description: "Ingest a multi-source FlightStatusEvent; idempotent on (source, source_event_id)"
    roles: [ClaimsAdmin, system]
    code: 201
    input: ["source", "source_event_id", "reported_status", "reported_actual_departure_epoch_ms?", "reported_actual_arrival_epoch_ms?", "reported_cause?", "report_epoch_ms"]
    output: FlightStatusEvent
    side_effects:
      - "Apply flight_status_quorum and flight_cause_classification"
      - "If quorum reached: Flight transitions to terminal state and recomputes ClaimSegment eligibility for all bound tickets"

  - method: POST
    path: "/insurers/{insurerId}/flights/{flightId}/archive"
    description: "Manually archive a finalized flight"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Flight
    side_effects: ["status → ARCHIVED if no in-flight claim references it"]

  # --- Manual Review Case ---
  - method: GET
    path: "/insurers/{insurerId}/manual_review/{caseId}"
    description: "Get a manual review case"
    roles: [ClaimsReviewer, ClaimsAdmin]
    code: 200
    input: []
    output: ManualReviewCase
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/manual_review/{caseId}/resolve_bind"
    description: "Resolve a manual-review case by binding the ticket to a chosen policy"
    roles: [ClaimsReviewer]
    code: 200
    input: [resolved_policy_id]
    output: ManualReviewCase
    side_effects: ["Ticket.policy_id set; Ticket.status → ATTACHED; status → RESOLVED_BIND"]

  - method: POST
    path: "/insurers/{insurerId}/manual_review/{caseId}/resolve_reject"
    description: "Reject a manual-review case (no policy applies)"
    roles: [ClaimsReviewer]
    code: 200
    input: []
    output: ManualReviewCase
    side_effects: ["Ticket.status → UNMATCHED; status → RESOLVED_REJECT"]

  # --- Claim ---
  - method: POST
    path: "/insurers/{insurerId}/policies/{policyId}/claims"
    description: "Create a claim covering one or more tickets under the policy"
    roles: [ClaimsReviewer, PolicyAdmin]
    code: 201
    input: [ticket_ids]
    output: Claim
    side_effects:
      - "Auto-match: if every ticket is ATTACHED/CHANGED and bound to this policy, review_status=MATCHED; else PENDING_MATCH"
      - "Create one ClaimSegment per ticket"

  - method: GET
    path: "/insurers/{insurerId}/claims/{claimId}"
    description: "Get a claim (includes segments)"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/insurers/{insurerId}/claims"
    description: "List claims with filters"
    roles: [Any]
    code: 200
    input: ["policy_id?", "flight_id?", "review_status?", "payout_status?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/submit_review"
    description: "Reviewer submits the claim for review (MATCHED → UNDER_REVIEW)"
    roles: [ClaimsReviewer]
    code: 200
    input: [assigned_reviewer_id]
    output: Claim
    side_effects: ["Compute delay_duration & tiered_compensation per segment"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/return_to_match"
    description: "Reviewer returns the claim to MATCHED for resubmission (UNDER_REVIEW → MATCHED, cyclic)"
    roles: [ClaimsReviewer]
    code: 200
    input: []
    output: Claim
    side_effects: ["assigned_reviewer_id cleared"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/approve"
    description: "Approver approves the claim (UNDER_REVIEW → APPROVED); SoD-checked"
    roles: [ClaimsApprover]
    code: 200
    input: [assigned_approver_id]
    output: Claim
    side_effects: ["estimated_payout_cents set; reserve debit; payout_status NOT_PAYABLE→PAYABLE"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/reject"
    description: "Reject a claim under review"
    roles: [ClaimsReviewer, ClaimsApprover]
    code: 200
    input: [rejection_reason]
    output: Claim
    side_effects: ["No reserve change; AuditLog appended"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/settle"
    description: "Mark claim as PAID after banking confirmation (EXECUTING → PAID)"
    roles: [PayoutOperator, system]
    code: 200
    input: []
    output: Claim
    side_effects: ["final_payout_cents pinned; reserve released; quota debited; ReinsuranceAllocation appended; OutboxEvents emitted"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/mark_exception"
    description: "Mark in-flight payout as failed (EXECUTING → PAYABLE), isolate to batch.exception_claim_ids"
    roles: [PayoutOperator, system]
    code: 200
    input: ["reason?"]
    output: Claim
    side_effects: ["Batch.execution_phase → EXCEPTIONS"]

  - method: POST
    path: "/insurers/{insurerId}/claims/{claimId}/reverse"
    description: "Admin reverses a paid claim (PAID → REVERSED)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["Reserve rebuilt; quota refunded; OutboxEvent emitted"]

  # --- Payout Batch ---
  - method: POST
    path: "/insurers/{insurerId}/payout_batches"
    description: "Create a STAGED batch from PAYABLE same-flight claims"
    roles: [BatchApprover, ClaimsAdmin]
    code: 201
    input: [flight_id, claim_ids]
    output: PayoutBatch
    side_effects: ["claim.payout_batch_id set; batch.total_planned_payout_cents frozen at sum of estimated_payouts"]

  - method: GET
    path: "/insurers/{insurerId}/payout_batches/{batchId}"
    description: "Get payout batch"
    roles: [Any]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/payout_batches/{batchId}/approve"
    description: "Approve a staged batch (review_phase STAGED → APPROVED)"
    roles: [BatchApprover]
    code: 200
    input: [assigned_batch_approver_id]
    output: PayoutBatch
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/payout_batches/{batchId}/reject"
    description: "Reject a staged batch (review_phase STAGED → REJECTED)"
    roles: [BatchApprover]
    code: 200
    input: [reason]
    output: PayoutBatch
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/payout_batches/{batchId}/execute"
    description: "Begin execution: every PAYABLE claim → EXECUTING; emit BANKING events"
    roles: [BatchExecutor]
    code: 200
    input: [assigned_batch_executor_id]
    output: PayoutBatch
    side_effects: ["execution_phase PENDING → EXECUTING; per-claim events emitted"]

  - method: POST
    path: "/insurers/{insurerId}/payout_batches/{batchId}/retry_exceptions"
    description: "Retry only the exception claims (EXCEPTIONS → EXECUTING)"
    roles: [BatchExecutor]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["exception_claim_ids cleared; each claim payout_status PAYABLE → EXECUTING"]

  # --- Audit & Outbox ---
  - method: GET
    path: "/insurers/{insurerId}/audit_logs"
    description: "List audit log entries (with filters)"
    roles: [Auditor, ClaimsAdmin]
    code: 200
    input: ["subject_type?", "subject_id?", "action?"]
    output: "AuditLog[]"
    side_effects: []

  - method: GET
    path: "/insurers/{insurerId}/outbox_events"
    description: "List outbox events for downstream sync"
    roles: [ClaimsAdmin, Auditor]
    code: 200
    input: ["target_system?", "dispatch_status?", "subject_id?"]
    output: "OutboxEvent[]"
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/outbox_events/{eventId}/mark_delivered"
    description: "External system confirms delivery (idempotent)"
    roles: [ClaimsAdmin, system]
    code: 200
    input: []
    output: OutboxEvent
    side_effects: ["dispatch_status PENDING → DELIVERED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role missing/malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not permitted by RBAC for this endpoint"

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Caller would violate segregation of duties (reviewer/approver/operator overlap)"

  # --- Existence ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource id does not exist within insurer"

  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "Flight referenced by ticket creation does not exist within insurer"

  # --- Request validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, type errors, missing required fields, negative durations, etc."

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state that permits this transition"

  # --- Business referential ---
  - id: ERR_FLIGHT_NOT_FINALIZED
    http: 409
    condition: "Claim review submission attempted while Flight.status ∈ {SCHEDULED, ACTIVE}"

  - id: ERR_POLICY_INACTIVE
    http: 409
    condition: "Policy is SUSPENDED or TERMINATED at the time of operation"

  - id: ERR_BATCH_NOT_APPROVED
    http: 409
    condition: "PayoutBatch.execute called before review_phase=APPROVED"

  - id: ERR_CLAIM_NOT_APPROVED
    http: 409
    condition: "Claim referenced by batch action is not in review_status=APPROVED"

  - id: ERR_BATCH_FLIGHT_MISMATCH
    http: 409
    condition: "A claim being batched has no segment whose flight_id matches the batch's flight_id"

  - id: ERR_BATCH_ALREADY_DISPATCHED
    http: 409
    condition: "PayoutBatch is already in execution_phase ∈ {EXECUTING, EXCEPTIONS, SETTLED}"

  - id: ERR_TICKET_NOT_BOUND
    http: 409
    condition: "Claim references a ticket whose status ∈ {REFUNDED, UNMATCHED}"

  - id: ERR_TICKET_LOCKED_BY_CLAIM
    http: 409
    condition: "Ticket change/refund attempted while a claim referencing it is in non-terminal state"

  # --- Business temporal ---
  - id: ERR_WAITING_PERIOD_NOT_MET
    http: 409
    condition: "ticket.scheduled_departure_epoch_ms - policy.effective_from_epoch_ms < policy.waiting_period_ms"

  # --- Business constraint (eligibility) ---
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 409
    condition: "Claim has at least one segment whose eligibility ∈ {EXCLUDED_CAUSE, WAITING_PERIOD, DELAY_BELOW_THRESHOLD, TICKET_NOT_BOUND}"

  # --- Business fiscal ---
  - id: ERR_QUOTA_EXHAUSTED
    http: 409
    condition: "Approval would push policy.claim_quota_used_cents + estimated_payout_cents > policy.claim_quota_total_cents"

  - id: ERR_RESERVE_DRIFT
    http: 409
    condition: "Stored Policy.reserve_balance_cents diverges from recomputed value"

  # --- Idempotency ---
  - id: ERR_DUPLICATE_EVENT
    http: 409
    condition: "FlightStatusEvent (insurer_id, source, source_event_id) already ingested"

  - id: ERR_DUPLICATE_PNR
    http: 409
    condition: "Ticket (insurer_id, pnr_code) already exists with status ∈ {ATTACHED, CHANGED}"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClaimsAdmin
    description: "Insurer superuser: creates insurers/policies/flights, archives, reverses paid claims, advances clock, runs sweeps and invariants"
    identity: opaque
    exclusive_operations:
      - "POST /insurers"
      - "POST /insurers/{id}/_clock/advance"
      - "POST /insurers/{id}/_sweep/run"
      - "POST /insurers/{id}/_invariant/check"
      - "POST /insurers/{id}/flights/{id}/archive"
      - "POST /insurers/{id}/claims/{id}/reverse"
      - "POST /insurers/{id}/outbox_events/{id}/mark_delivered"
    shared_operations:
      - "POST /insurers/{id}/flights (with PolicyAdmin)"
      - "POST /insurers/{id}/policies (with PolicyAdmin)"
      - "POST /insurers/{id}/flights/{id}/events (with system)"
      - "POST /insurers/{id}/payout_batches (with BatchApprover)"

  - name: PolicyAdmin
    description: "Manages policies and tickets (creates, suspends, terminates policies; ingests/changes/refunds tickets)"
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/policies/{id}/suspend"
      - "POST /insurers/{id}/policies/{id}/terminate"
      - "POST /insurers/{id}/tickets"
      - "POST /insurers/{id}/tickets/{id}/change"
      - "POST /insurers/{id}/tickets/{id}/confirm"
      - "POST /insurers/{id}/tickets/{id}/refund"
    shared_operations:
      - "POST /insurers/{id}/flights (with ClaimsAdmin)"
      - "POST /insurers/{id}/policies (with ClaimsAdmin)"
      - "POST /insurers/{id}/policies/{id}/claims (with ClaimsReviewer)"

  - name: ClaimsReviewer
    description: "Reviews claims; submits for review; can return-to-match; resolves manual review cases. SoD: same user cannot also Approve a claim they reviewed."
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/claims/{id}/submit_review"
      - "POST /insurers/{id}/claims/{id}/return_to_match"
      - "POST /insurers/{id}/manual_review/{id}/resolve_bind"
      - "POST /insurers/{id}/manual_review/{id}/resolve_reject"
    shared_operations:
      - "POST /insurers/{id}/policies/{id}/claims (with PolicyAdmin)"
      - "POST /insurers/{id}/claims/{id}/reject (with ClaimsApprover)"

  - name: ClaimsApprover
    description: "Approves claims under review. SoD: cannot equal the claim's reviewer; cannot also be the PayoutOperator who settles the claim."
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/claims/{id}/approve"
    shared_operations:
      - "POST /insurers/{id}/claims/{id}/reject (with ClaimsReviewer)"

  - name: BatchApprover
    description: "Approves payout batches. SoD: a per-claim approver cannot also batch-approve that batch."
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/payout_batches/{id}/approve"
      - "POST /insurers/{id}/payout_batches/{id}/reject"
    shared_operations:
      - "POST /insurers/{id}/payout_batches (with ClaimsAdmin)"

  - name: BatchExecutor
    description: "Executes approved batches; retries exceptions. SoD: cannot equal the BatchApprover for the same batch."
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/payout_batches/{id}/execute"
      - "POST /insurers/{id}/payout_batches/{id}/retry_exceptions"
    shared_operations: []

  - name: PayoutOperator
    description: "Settles individual claims after banking confirmation; marks failed dispatches as exceptions. SoD: cannot equal the claim's approver."
    identity: opaque
    exclusive_operations:
      - "POST /insurers/{id}/claims/{id}/settle"
      - "POST /insurers/{id}/claims/{id}/mark_exception"
    shared_operations: []

  - name: Auditor
    description: "Read-only across audit logs, policy risk views, outbox; can run invariant checks."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /insurers/{id}/audit_logs"
      - "GET /insurers/{id}/outbox_events"
      - "GET /insurers/{id}/policies/{id}/risk_view"
      - "POST /insurers/{id}/_invariant/check (with ClaimsAdmin)"

  - name: system
    description: "Automated actor for sweeps, quorum-driven Flight transitions, batch SETTLED auto-transition."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /insurers/{id}/flights/{id}/events (with ClaimsAdmin)"
      - "POST /insurers/{id}/claims/{id}/settle (with PayoutOperator)"
      - "POST /insurers/{id}/claims/{id}/mark_exception (with PayoutOperator)"
      - "POST /insurers/{id}/_sweep/run (with ClaimsAdmin)"
      - "POST /insurers/{id}/outbox_events/{id}/mark_delivered (with ClaimsAdmin)"

  - name: Any
    description: "Authenticated read-only fallback (any of the above roles can use these GETs)"
    identity: opaque
    shared_operations:
      - "GET /insurers/{id}"
      - "GET /insurers/{id}/policies/{id}"
      - "GET /insurers/{id}/flights/{id}"
      - "GET /insurers/{id}/flights"
      - "GET /insurers/{id}/tickets/{id}"
      - "GET /insurers/{id}/claims/{id}"
      - "GET /insurers/{id}/claims"
      - "GET /insurers/{id}/payout_batches/{id}"
