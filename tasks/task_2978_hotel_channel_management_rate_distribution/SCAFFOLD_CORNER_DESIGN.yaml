      - name: health_score_is_null_until_a_job_resolves_and_a_retry_shrinks_the_denominator
        claim_type: input_set_filtering
        grounds:
          - calculations.connection_health_scoring
          - endpoints[GET /distribution/channels/{id}/performance]
          - endpoints[POST /distribution/distribution-jobs/{id}/retry]
        distinguishing_aspect: |
          health_score_bp counts only APPLIED and REJECTED jobs, so it is null while every job is
          still QUEUED, becomes round_half_up(1 * 10000 / 3) == 3333 once three jobs resolve, and
          RISES to 5000 when one REJECTED job is retried back to QUEUED - the retry leaves the
          numerator alone and removes a row from the denominator.
        test_recipe:
