            - "trigger capture err == ERR_INVALID_STATE (state priority 6 beats business_fiscal priority 35; the wrong amount 1 must NOT surface ERR_PAYMENT_AMOUNT_MISMATCH)"
            - "Booking.${booking_id}.status == EXPIRED (cascade result, unchanged by the failed confirm)"

      - name: assignment_safety_beats_turn_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=20]
          - errors[ERR_PILOT_FLIGHT_TIME_EXCEEDED]
          - errors[ERR_AIRCRAFT_TURN_CONFLICT]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — different from the
          (state, business_fiscal) pair: an assignment patch that would simultaneously overload
          the pilot's scheduled flight minutes AND collide with the aircraft's turn buffer must
          surface ERR_PILOT_FLIGHT_TIME_EXCEEDED (priority 9), never ERR_AIRCRAFT_TURN_CONFLICT
          (priority 20).
        test_recipe:
          setup:
            - "Route RD STANDARD 240 min (turn 25); aircraft A1, A2; pilots P1 (free) and P2 (already at 480 scheduled min via Fa 08:00-12:00 and Fb 13:00-17:00 on A1)"
            - "Target FT dep 2026-08-03T12:10:00Z cleanly created with P1 + A2"
            - "PATCHing FT to {pilot: P2, aircraft: A1} violates duty (480+240=720 > 480) AND A1 turn (12:10 < 12:00+25)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RD", tier: "STANDARD", duration_minutes: 240, base_seat_price_cents: 10000, fuel_required_lb: 400, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a1: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N2", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a2: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat Two", certificate_no: "C2" }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p2}", scheduled_departure_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p2}", scheduled_departure_utc: "2026-08-03T13:00:00Z" }
              as: Dispatcher
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a2}", pilot_id: "${p1}", scheduled_departure_utc: "2026-08-03T12:10:00Z" }
              as: Dispatcher
              captures: { ft: $.data.id }
            - call: "GET /flights/${ft}"
              as: Dispatcher
              captures: { ftv: $.data.version }
          trigger:
            - call: "PATCH /flights/${ft}/assignment"
              payload: { pilot_id: "${p2}", aircraft_id: "${a1}", expected_flight_version: "${ftv}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger capture err == ERR_PILOT_FLIGHT_TIME_EXCEEDED (business_safety priority 9 beats business_temporal priority 20; the A1 turn collision must NOT surface)"
            - "Flight.${ft}.pilot_id unchanged == ${p1} and Flight.${ft}.aircraft_id unchanged == ${a2}"

  - rule_id: boundary_precision_check
    instances:
      - name: duty_limit_exact_boundary_allows_and_exceeds_rejects
        grounds:
          - calculations.pilot_duty_minutes
          - validations[priority=9]
          - errors[ERR_PILOT_FLIGHT_TIME_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a minutes metric via POST /flights: projected flight minutes exactly ==
          480 is accepted (<= semantics), while 480 + 240 = 720 is rejected — the >= vs >
          placement is observable in whether the second create succeeds.
        test_recipe:
          setup:
            - "Route RD STANDARD 240 min; pilot P; two aircraft-free slots: F1 08:00, F2 13:00 same day"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RD", tier: "STANDARD", duration_minutes: 240, base_seat_price_cents: 10000, fuel_required_lb: 400, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T13:00:00Z" }
              as: Dispatcher
              captures: { f2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T18:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "F2 create succeeded (240 + 240 == 480 exactly; <= boundary is inclusive) — captured f2 is a UUID"
            - "trigger capture err == ERR_PILOT_FLIGHT_TIME_EXCEEDED (480 + 240 == 720 > 480)"
            - "GET /duty-days?pilot_id=${pilot_id} shows flight_minutes_scheduled == 480 (F3 not counted)"

      - name: seat_capacity_exact_fill_then_overflow
        grounds:
          - validations[priority=31]
          - entities.Flight.fields.seats_available
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a seat-count metric via POST /bookings (a different metric and endpoint
          from the duty-minutes boundary): a booking consuming exactly the remaining seats is
          accepted (seats_available == 0 afterwards), and the very next 1-seat booking is
          rejected.
        test_recipe:
          setup:
            - "Aircraft 4 seats; flight dep 2026-08-03T14:00:00Z; declared weights 100 lb keep the estimate gate green"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 100 }, { full_name: "P1", declared_weight_lb: 100 }, { full_name: "P2", declared_weight_lb: 100 } ] }
              as: BookingAgent
          trigger:
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "B", contact_email: "b@x.com", passengers: [ { full_name: "P3", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { b2: $.data.id }
            - call: "GET /flights/${flight_id}"
              as: BookingAgent
              captures: { avail: $.data.seats_available, booked: $.data.seats_booked }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "C", contact_email: "c@x.com", passengers: [ { full_name: "P4", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "B2 (the exact 4th seat) created successfully — captured b2 is a UUID"
            - "trigger capture booked == 4 and avail == 0 (exact fill allowed)"
            - "trigger capture err == ERR_SEAT_CAPACITY_EXCEEDED (1 > 0 remaining)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_gated_by_base_weather_posture
        grounds:
          - state_machines.Flight.MANIFEST_CLOSED_to_DISPATCHED
          - calculations.weather_posture
          - validations[priority=7]
          - errors[ERR_WEATHER_HOLD_ACTIVE]
        distinguishing_aspect: |
          Entity pair Flight -> Base: the DISPATCH transition's legality is a pure function of
          a DIFFERENT aggregate's computed state (Base.posture). The same flight, same pilot
          ack, same crew: dispatch at 14:00 (posture WEATHER_HOLD) is rejected, and the
          identical retry at 15:10 (observation expired, posture NORMAL) succeeds.
        test_recipe:
          setup:
            - "Flight dep 2026-08-03T15:30:00Z carried to MANIFEST_CLOSED with zero passengers; pilot acked; creator disp-1"
            - "Adverse observation at 13:55 (ceiling 800 < 1000) valid [13:55, 14:55) — the flight's 15:30 departure is OUTSIDE the window so it is never cancelled"
            - "logical clock 2026-08-03T14:00:00Z -> posture WEATHER_HOLD"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T15:30:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { flight_id: $.data.id }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { f_ver: $.data.version }
            - { call: "POST /flights/${flight_id}/close-manifest", payload: { expected_flight_version: "${f_ver}" }, as: Dispatcher, as_user_id: "disp-1" }
            - { call: "POST /weather-observations", payload: { base_id: "${base_id}", observed_at: "2026-08-03T13:55:00Z", ceiling_ft: 800, visibility_sm: 5, wind_kt: 10 }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { posture_hold: $.data.posture, f_status_hold: $.data.version }
          trigger:
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "DISPATCH" }
              as: Dispatcher
              as_user_id: "disp-2"
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:10:00Z" }, as: OpsAdmin }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { posture_ok: $.data.posture }
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "DISPATCH" }
              as: Dispatcher
              as_user_id: "disp-2"
              captures: { final_status: $.data.status, dep_utc: $.data.actual_departure_utc, disp_by: $.data.dispatched_by_user_id }
          assert:
            - "setup capture posture_hold == WEATHER_HOLD (latest valid observation adverse at 14:00)"
            - "Flight.${flight_id} remained MANIFEST_CLOSED while WEATHER_HOLD (15:30 departure outside the observation window [13:55, 14:55))"
            - "trigger capture err == ERR_WEATHER_HOLD_ACTIVE"
            - "trigger capture posture_ok == NORMAL (validity_until 14:55 passed at 15:10)"
            - "trigger capture final_status == DISPATCHED and dep_utc == 2026-08-03T15:10:00Z and disp_by == disp-2"

      - name: complaint_substantiate_requires_flown_flight
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - validations[priority=28]
          - errors[ERR_COMPLAINT_FLIGHT_MISMATCH]
        distinguishing_aspect: |
          Entity pair Complaint -> Flight (different pair from Flight -> Base): a matched
          complaint cannot be SUBSTANTIATED while its flight is still SCHEDULED — the
          complaint machine's valid transitions depend on the flight machine's state.
        test_recipe:
          setup:
            - "Route RC noise_zones [VILLAGE]; flight F dep 2026-08-06T14:00:00Z, never dispatched (stays SCHEDULED)"
            - "Complaint zone VILLAGE auto-UNMATCHED (no flown flights), then manually LINK_FLIGHT to F (zone covered), REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RC", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: ["VILLAGE"], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-06T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "VILLAGE", observed_at: "2026-08-05T10:00:00Z", description: "early noise", reporter_ref: "r1" }
              as: CommunityReporter
              captures: { c1: $.data.id, c1_match: $.data.match_status }
            - { call: "POST /complaints/${c1}/events", payload: { event_type: "LINK_FLIGHT", flight_id: "${flight_id}" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c1}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
          trigger:
            - call: "POST /complaints/${c1}/events"
              payload: { event_type: "SUBSTANTIATE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "setup capture c1_match == UNMATCHED (auto-match found no DISPATCHED/COMPLETED flight — empty pool fallback, not an error)"
            - "trigger capture err == ERR_COMPLAINT_FLIGHT_MISMATCH (matched flight SCHEDULED, not DISPATCHED/COMPLETED)"
            - "Complaint.${c1}.status == UNDER_REVIEW (failed substantiate leaves state unchanged)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: season_half_open_adjacency_and_end_exclusive_pricing
        grounds:
          - validations[priority=19]
          - calculations.seat_price_quote
          - errors[ERR_SEASON_OVERLAP]
        distinguishing_aspect: |
          Interval semantics on the Season resource: half-open [start_date, end_date) —
          a successor season starting exactly at the predecessor's end_date is legal, a one-day
          earler start collides; and a departure on 2026-09-01 prices under the SUCCESSOR
          season, proving the end boundary is exclusive.
        test_recipe:
          setup:
            - "S1 [2026-06-01, 2026-09-01) at 12000 bps; flight dep Tuesday 2026-09-01T14:30:00Z on route base 25000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /seasons"
              payload: { label: "S1", start_date: "2026-06-01", end_date: "2026-09-01", multiplier_bps: 12000 }
              as: OpsAdmin
