              as: ComplianceOfficer
              captures: { fk_agent: "$.data.id" }
          trigger:
            - call: "POST /agreements"
              payload: { insured_id: "00000000-0000-4000-8000-0000000009c1", producer_agent_id: "${fk_agent}", state_rule_id: "${fk_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
