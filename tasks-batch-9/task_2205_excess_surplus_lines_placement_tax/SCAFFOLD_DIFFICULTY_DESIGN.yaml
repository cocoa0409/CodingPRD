          - entities.Endorsement.fields.stamping_fee_adjustment_cents
          - state_machines.Endorsement.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (c) — a chain that looks circular unless the order is pinned: the
          endorsement's own tax_adjustment_cents is defined as the policy total
          AFTER minus the policy total BEFORE, while the policy total AFTER is
          itself a function of allocation rows redistributed from the new taxable
          premium. The scaffold pins recompute-from-the-full-ISSUED-set (never
          incremental) followed by after-minus-before, so a +200000 endorsement on
          the 38779-tax base policy yields tax_adjustment_cents 7567 exactly, not
          the 9700 an implementer gets by taxing the 200000 delta on its own.
