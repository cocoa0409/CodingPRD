  - rule_id: transitive_cascade
    instances:
      - name: annuity_grace_expiry_lapses_filing_then_strips_jurisdiction_then_revokes_sublicense_then_decrements_count
        grounds:
          - state_machines.ProtectionFiling.status.MAINTENANCE_DUE_to_LAPSED
          - calculations.variety_protection_posture
          - state_machines.SublicenseGrant.status.ACTIVE_to_REVOKED
          - entities.Variety.fields.protected_jurisdictions
          - entities.Variety.fields.active_sublicense_count
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Trigger is a pure clock advance - no business write at all - and the
          chain is four deep with each link CAUSED by the previous one: the grace
          boundary passing lapses the filing (1), the lapse re-derives
          protection_posture and strips US from protected_jurisdictions (2), the
