  - section: calculations
    instances:

      - name: county_quota_position_recomputed_on_each_license_create
        claim_type: correct_result
        grounds:
          - calculations.county_quota_position
          - entities.County.fields.quota_available
          - entities.County.fields.quota_utilization_bps
        distinguishing_aspect: "With quota_licenses_total 8 and three counted licences the county reports quota_licenses_counted 3, quota_available 5 and quota_utilization_bps exactly 3750, recomputed on every create rather than only on the first."
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 8 and one seller profile."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 8 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "Q-1", license_class: "CLASS_41_ONSALE_BEER_WINE", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "Q-2", license_class: "CLASS_41_ONSALE_BEER_WINE", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "Q-3", license_class: "CLASS_41_ONSALE_BEER_WINE", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { counted: $.data.quota_licenses_counted }
          assert:
            - "${counted} == 3"
            - "County.${c_id}.quota_available == 5"
            - "County.${c_id}.quota_utilization_bps == 3750"
            - "County.${c_id}.escrow_committed_count == 0"
            - "County.${c_id}.version == 4 (one bump per recompute)"

      - name: valuation_input_set_excludes_other_counties_and_unpriced_licenses
