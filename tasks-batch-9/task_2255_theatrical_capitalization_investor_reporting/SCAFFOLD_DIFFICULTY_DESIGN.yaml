      The wrap machine is neither linear nor acyclic: a certified wrap is reached only
      after a dispute/amend round trip, and the CERTIFIED state still has an exit that
      reverses every side effect. An implementation that treats CERTIFIED as terminal
      cannot void; one that treats DISPUTED as terminal cannot amend; one that re-runs
