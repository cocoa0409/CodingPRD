            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam SeventytwoA", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s72a_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam SeventytwoB", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s72b_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s72a_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s72a_v: $.data.version }
            - call: "GET /athletics/student-athletes/${s72b_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s72b_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s72a_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s72a_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert72a_id: $.data.id }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s72b_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s72b_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert72b_id: $.data.id }
          trigger:
            - call: "POST /athletics/certifications/${cert72a_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert72b_id}/status"
              payload: { action: "SUBMIT" }
              as: CertificationOfficer
              as_user_id: "co_submitter"
          assert:
            - "Both calls return HTTP 200 with data.status == SUBMITTED"
            - "EligibilityCertification.${cert72a_id}.status == SUBMITTED and EligibilityCertification.${cert72b_id}.status == SUBMITTED"
            - "Neither row has decided_by_user_id set - SUBMIT is not a decision"
            - "Both rows keep benchmark_result == FAIL with failure_reasons == [GPA_BELOW_MINIMUM] (null-program path, cumulative_gpa 0.00 below PROVISIONAL_MIN_GPA 1.8), which does not block SUBMIT"

  # ---------------------------------------------------------------------------
  # Guide section 8 - Cross-cutting complexity layers
  # (optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #  rate_threshold_triggers, ops_run_checkpoint)
  # ---------------------------------------------------------------------------
  - section: cross-cutting complexity layers
    instances:
      - name: certification_create_with_stale_student_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certification-create-stale-student]
          - errors[ERR_STALE_STUDENT_VERSION]
          - state_machines.Enrollment.transitions.ENROLLED_to_COMPLETED
        distinguishing_aspect: "Recording the grade increments StudentAthlete.version, so replaying the version observed before that write is refused with 412 ERR_STALE_STUDENT_VERSION while the very same payload carrying the refreshed version returns 201 - the check is a version comparison, not a timing rule."
        test_recipe:
          setup:
            - "Student S73 has no declared major and is ENROLLED in MATH-101 (3.00 credits) in 2026FA; the client captures the student's version before any recomputation."
            - "The Registrar then records grade B, which recomputes the student's aggregates and advances its version."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "101", title: "College Algebra", credit_hours: 3.00, instructor_user_id: "instr_math_1" }
              as: Registrar
              captures: { math101_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Seventythree", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s73_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s73_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s73_v_stale: $.data.version }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s73_id}", course_id: "${math101_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e73_id: $.data.id }
            - call: "POST /athletics/enrollments/${e73_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s73_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s73_v_stale}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
            - call: "GET /athletics/student-athletes/${s73_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s73_v_fresh: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s73_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s73_v_fresh}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert73_id: $.data.id }
          assert:
            - "The first call is HTTP 412 with data.error_id == ERR_STALE_STUDENT_VERSION"
            - "${s73_v_fresh} == ${s73_v_stale} + 1 - the grade recording performed exactly one write on the student"
            - "The third call is HTTP 201 with data.status == DRAFT and data.student_athlete_id == ${s73_id}"
            - "EligibilityCertification.${cert73_id}.benchmark_result == PASS with failure_reasons == [] - the null-program path compares cumulative_gpa 3.00 against PROVISIONAL_MIN_GPA 1.8"
            - "EligibilityCertification.${cert73_id}.progress_pct == 0.0000 and required_progress_pct == 0.0000"
            - "GET /athletics/certifications with student_athlete_id ${s73_id} returns total_count == 1 - the refused attempt created nothing"

      - name: tutor_stays_trained_at_two_penalty_points_and_suspends_at_three
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.tutor_compliance_penalty.constants.TUTOR_SUSPENSION_POINT_THRESHOLD
          - calculations.academic_risk_score.constants.INCIDENT_POINTS
          - state_machines.Tutor.transitions.TRAINED_to_SUSPENDED
        distinguishing_aspect: "The cumulative threshold is probed from below and at the line: a LEVEL_II incident leaves the tutor at exactly TUTOR_SUSPENSION_POINT_THRESHOLD - 1 == 2 points and TRAINED, and one further LEVEL_I point reaches 3 and suspends the tutor, cascading its ACTIVE assignment to TERMINATED."
        test_recipe:
          setup:
            - "Tutor T75 is TRAINED for MATH; assignment A75 (2.00 weekly hours) for student S75's MATH-101 enrollment is ACTIVE, so Tutor.assigned_weekly_hours == 2.00."
            - "Two incidents naming tutor T75 and student S75 are open and UNDER_INVESTIGATION: I75A and I75B."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "101", title: "College Algebra", credit_hours: 3.00, instructor_user_id: "instr_math_1" }
              as: Registrar
              captures: { math101_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Seventyfive", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s75_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s75_id}", course_id: "${math101_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e75_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tina Seventyfive", subject_codes: ["MATH"] }
              as: LearningSpecialist
              captures: { t75_id: $.data.id }
            - call: "POST /athletics/tutors/${t75_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t75_id}", enrollment_id: "${e75_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a75_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a75_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/compliance-incidents"
              payload: { student_athlete_id: "${s75_id}", tutor_id: "${t75_id}", incident_type: "EXCESSIVE_TUTOR_HOURS", narrative: "The tutor logged more hours than the assignment allows." }
              as: ComplianceOfficer
              captures: { i75a_id: $.data.id }
            - call: "POST /athletics/compliance-incidents/${i75a_id}/status"
              payload: { action: "OPEN_INVESTIGATION" }
              as: ComplianceOfficer
            - call: "POST /athletics/compliance-incidents"
              payload: { student_athlete_id: "${s75_id}", tutor_id: "${t75_id}", incident_type: "IMPERMISSIBLE_WORK_COMPLETION", narrative: "The tutor drafted part of an assignment for the student." }
              as: ComplianceOfficer
              captures: { i75b_id: $.data.id }
            - call: "POST /athletics/compliance-incidents/${i75b_id}/status"
              payload: { action: "OPEN_INVESTIGATION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/compliance-incidents/${i75a_id}/status"
              payload: { action: "SUBSTANTIATE", severity: "LEVEL_II" }
              as: ComplianceOfficer
            - call: "GET /athletics/tutors/${t75_id}"
              payload: {}
              as: LearningSpecialist
            - call: "POST /athletics/compliance-incidents/${i75b_id}/status"
              payload: { action: "SUBSTANTIATE", severity: "LEVEL_I" }
              as: ComplianceOfficer
          assert:
            - "After the first SUBSTANTIATE, ComplianceIncident.${i75a_id}.penalty_points_assessed == 2 and Tutor.${t75_id}.penalty_points == 2 with status == TRAINED - exactly one point below the threshold"
            - "The intermediate GET shows Tutor.${t75_id}.assigned_weekly_hours == 2.00 and TutorAssignment.${a75_id}.status == ACTIVE"
            - "StudentAthlete.${s75_id} at that point has risk_score == 47.50 (0.40*100.00 gpa + 0.15*50.00 incident), risk_tier == TIER_3, support_status == SUPPORT_MANDATED and required_study_hall_hours == 7.0 (gross 8.0 minus tutor credit min(2.0, 0.5*2.00) == 1.0)"
            - "After the second SUBSTANTIATE, Tutor.${t75_id}.penalty_points == 3 and status == SUSPENDED"
            - "TutorAssignment.${a75_id}.status == TERMINATED with terminated_reason == TUTOR_SUSPENDED and Tutor.${t75_id}.assigned_weekly_hours == 0.00"
            - "StudentAthlete.${s75_id}.required_study_hall_hours == 8.0 after the cascade (no ACTIVE assignment remains) and risk_score == 51.25"
            - "StudentAthlete.${s75_id}.substantiated_penalty_points == 3.00 and support_status is still SUPPORT_MANDATED - no LEVEL_III incident exists"

      - name: apr_close_checkpoint_publishes_squad_apr_and_freezes_the_term
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /athletics/terms/{term_id}/apr-close]
          - calculations.apr_points_award.formula
          - calculations.apr_points_award.variants
        distinguishing_aspect: "The checkpoint is the only writer of squad_apr: with a single CERTIFIED cohort student and no later Term row the OBSERVED variant awards the retention point by default, so possible 2 / earned 2 yields squad_apr exactly 1000 and the term freezes to CLOSED."
        test_recipe:
          setup:
            - "Student S76 declared DP76 (total_required_credits 60.00) and completed KINE-200 (12.00 credits, CORE for catalog 2026) with grade B, so the benchmark passes and the enrollment is full-time countable."
            - "An INITIAL certification for 2026FA was requested by co_requester, submitted by adv_1 and certified by co_decider; 2026FA is the only Term row and the clock is then moved past its end_date."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP76", name: "Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp76_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "200", title: "Exercise Physiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp76_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Seventysix", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s76_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s76_id}/major-declaration"
              payload: { declared_program_id: "${dp76_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s76_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e76_id: $.data.id }
            - call: "POST /athletics/enrollments/${e76_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "101", title: "College Algebra", credit_hours: 3.00, instructor_user_id: "instr_math_1" }
              as: Registrar
              captures: { math101_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s76_id}", course_id: "${math101_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e76b_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s76_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s76_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s76_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s76_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert76_id: $.data.id }
            - call: "POST /athletics/certifications/${cert76_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert76_id}/status"
              payload: { action: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-12-19T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/terms/${term1_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /athletics/enrollments/${e76b_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "C" }
              as: Registrar
          assert:
            - "The first response is HTTP 200 with data.apr_status == CLOSED"
            - "Term.${term1_id}.apr_points_possible == 2 and apr_points_earned == 2.0 (eligibility point for the CERTIFIED row, retention point by OBSERVED default with no later Term)"
            - "Term.${term1_id}.squad_apr == 1000 == round(2 / 2 * 1000, 0)"
            - "StudentAthlete.${s76_id}.apr_points_possible == 2, apr_points_earned == 2.0 and apr_points_forfeited == 0.00, so possible == earned + forfeited holds"
            - "StudentAthlete.${s76_id}.support_status == SUPPORT_NORMAL - 2 earned is not below APR_FORFEIT_ALERT_POINTS 1"
            - "EligibilityCertification.${cert76_id}.status is still CERTIFIED"
            - "The second call is HTTP 409 with data.error_id == ERR_APR_TERM_CLOSED - the frozen term rejects further enrollment outcomes - and Enrollment.${e76b_id}.status stays ENROLLED with grade null"

      - name: incident_cascade_reaches_four_levels
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_substantiation_cascade_depth_four
          rationale: "The named §1.8 instance verifies the incident -> tutor -> assignment -> study-hall chain end-to-end with per-level assertions."

      - name: degree_audit_variants_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: dual_variant_calc / catalog_variant_divergence_on_degree_audit
          rationale: "The named §1.8 instance drives CATALOG_AT_ENTRY and CATALOG_AT_CERTIFICATION over identical coursework and asserts the credit delta."

  # ---------------------------------------------------------------------------
  # Guide section 9 - Consistency model (immediate)
