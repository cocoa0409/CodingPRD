# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index) — Nail Salon & Spa
# Enumerative coverage of testable claims in §1.1–§1.7 beyond §1.8's nine rules.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# Names are unique across §1.8 ∪ §1.9.
# =============================================================================
scaffold_corner_design:

  # ===================== Entities =========================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints
        distinguishing_aspect: "POST /clients with full_name+email returns 201; loyalty_points_balance==0, active_no_show_strikes==0, deposit_required==false in the response."
        test_recipe:
          setup: ["Empty DB, clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ada Lovelace", email: "ada@x.com" }
              as: FrontDesk
              captures: { cid: $.data.id, bal: $.data.loyalty_points_balance }
          assert:
            - "response code == 201"
            - "Client.${cid}.loyalty_points_balance == 0"
            - "Client.${cid}.active_no_show_strikes == 0"
            - "Client.${cid}.deposit_required == false"

      - name: get_technician_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Technician
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /technicians/{id} with a random nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /technicians/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_menu_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ServiceMenuItem.fields.base_price_cents
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /menu-items missing base_price_cents (input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "Bad Item", category: "MANICURE", duration_minutes: 30 }
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_station_default_requires_autoclave_true
        claim_type: Defaults
        grounds:
          - entities.Station.fields.requires_autoclave
        distinguishing_aspect: "POST /stations omitting requires_autoclave yields requires_autoclave==true and sanitation_status==DIRTY by default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "Default Station" }
              as: SalonManager
              captures: { st: $.data.id, ra: $.data.requires_autoclave, ss: $.data.sanitation_status }
          assert:
            - "Station.${st}.requires_autoclave == true"
            - "Station.${st}.sanitation_status == DIRTY"

      - name: appointment_end_at_computed_from_duration_and_addons
        claim_type: Computed Fields
        grounds:
          - entities.Appointment.fields.end_at
          - entities.AppointmentAddOn.fields.extra_minutes_snapshot
        distinguishing_aspect: "end_at == start_at + (service.duration_minutes 45 + add-on extra_minutes 10) = 55 minutes after start; client-supplied end_at (if any) is ignored."
        test_recipe:
          setup: ["Clock 2026-07-01T12:00:00Z. Gel manicure duration 45, paraffin add-on extra_minutes 10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-EC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Mani EC", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Paraffin EC", price_cents: 1500, extra_minutes: 10 }
              as: SalonManager
              captures: { addon: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech EC", license_number: "LIC-EC1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client EC", email: "cec@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-07-01T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id, av: $.data.version }
            - call: "POST /appointments/${a}/add-ons"
              payload: { add_on_id: "${addon}", expected_appointment_version: "${av}" }
              as: FrontDesk
          trigger:
            - call: "GET /appointments/${a}"
              payload: {}
              as: FrontDesk
              captures: { end: $.data.end_at }
          assert:
            - "Appointment.${a}.end_at == 2026-07-01T13:55:00Z"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Client
        distinguishing_aspect: "POST /clients with client-supplied loyalty_points_balance is ignored; server forces 0 (system/computed field)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Spoofer", email: "spoof@x.com" }
              as: FrontDesk
              captures: { c: $.data.id, bal: $.data.loyalty_points_balance }
          assert:
            - "Client.${c}.loyalty_points_balance == 0"

      - name: create_technician_invalid_pay_model_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Technician.fields.pay_model
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /technicians with pay_model not in {COMMISSION,BOOTH_RENT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One station exists."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Mani-EnumTC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /technicians"
              payload: { full_name: "Bad Pay", license_number: "LIC-XX", license_expiry: "2027-01-01T00:00:00Z", pay_model: "SALARY", home_station_id: "${st}" }
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: duplicate_client_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.email
          - "validations[priority=5]"
          - "errors[ERR_DUPLICATE_RESOURCE]"
        distinguishing_aspect: "Second POST /clients with an email already used returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["A client with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "First", email: "dup@x.com" }
              as: FrontDesk
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_RESOURCE"

      - name: appointment_unknown_service_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Appointment.fields.service_item_id
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /appointments with a nonexistent service_item_id (other FKs valid) returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Valid station, technician, client exist; service_item_id is a random nonexistent UUID."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Mani-FK", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech FK", license_number: "LIC-FK1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client FK", email: "cfk@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "00000000-0000-4000-8000-000000000111", origin: "APPOINTMENT", start_at: "2026-07-02T13:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: list_appointments_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Appointment
          - endpoints
        distinguishing_aspect: "GET /appointments returns response_type array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["At least one appointment exists."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Mani-LP", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani LP", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech LP", license_number: "LIC-LP1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client LP", email: "clp@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id }
          trigger:
            - call: "GET /appointments"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array"
            - "meta pagination total_count >= 1 and has_more present"

  # ===================== State Machines ===================================
  - section: state_machines
    instances:
      - name: appointment_initial_status_is_requested_unpaid
        claim_type: Initial State
        grounds:
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - entities.Appointment.fields.booking_status
        distinguishing_aspect: "A freshly created appointment has booking_status==REQUESTED and payment_status==UNPAID."
        test_recipe:
          setup: ["Valid station/tech/menu/client; WALK_IN booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-IS", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani IS", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech IS", license_number: "LIC-IS1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client IS", email: "cis@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id, bs: $.data.booking_status, ps: $.data.payment_status }
          assert:
            - "Appointment.${a}.booking_status == REQUESTED"
            - "Appointment.${a}.payment_status == UNPAID"

      - name: confirm_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling confirm on an appointment already COMPLETED returns ERR_INVALID_STATE (409); no transition defined from COMPLETED."
        test_recipe:
          setup: ["An appointment driven all the way to COMPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-IV", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani IV", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech IV", license_number: "LIC-IV1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client IV", email: "civ@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { av: $.data.version }
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${av}" }
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancelled_appointment_is_terminal_for_booking
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After cancel, a second cancel (or any booking transition) on the CANCELLED appointment returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CONFIRMED appointment then CANCELLED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-TS", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani TS", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech TS", license_number: "LIC-TS1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client TS", email: "cts@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-07-05T15:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${a}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${a}.booking_status == CANCELLED"

      - name: start_service_occupies_station_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_IN_SERVICE
          - entities.Station.fields.in_service_appointment_id
        distinguishing_aspect: "start-service sets Station.in_service_appointment_id to the appointment id; checkout clears it back to null."
        test_recipe:
          setup: ["A CHECKED_IN appointment ready to start."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-OC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani OC", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech OC", license_number: "LIC-OC1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client OC", email: "coc@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { av: $.data.version }
            - call: "GET /stations/${st}"
              payload: {}
              as: FrontDesk
              captures: { occ: $.data.in_service_appointment_id }
          assert:
            - "Station.${st}.in_service_appointment_id == ${a}"

      - name: technician_reinstate_revert_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Technician.ACTIVE_to_SUSPENDED
          - state_machines.Technician.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Technician ACTIVE->SUSPENDED->ACTIVE revert cycle works; status returns to ACTIVE after reinstate."
        test_recipe:
          setup: ["An ACTIVE technician with valid license."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-07T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-RC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech RC", license_number: "LIC-RC1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /technicians/${t}/suspend"
              payload: {}
              as: SalonManager
          trigger:
            - call: "POST /technicians/${t}/reinstate"
              payload: {}
              as: SalonManager
              captures: { stt: $.data.status }
          assert:
            - "Technician.${t}.status == ACTIVE"

      - name: terminate_active_technician_rejected_invalid_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Technician.SUSPENDED_to_TERMINATED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "terminate from ACTIVE (not SUSPENDED) returns ERR_INVALID_STATE; terminate is only defined from SUSPENDED."
        test_recipe:
          setup: ["An ACTIVE technician (never suspended)."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Mani-TT", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech TT", license_number: "LIC-TT1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /technicians/${t}/terminate"
              payload: {}
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: idempotent_pay_deposit_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.UNPAID_to_DEPOSIT_HELD
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second pay-deposit on an appointment already DEPOSIT_HELD returns ERR_INVALID_STATE (payment_status no longer UNPAID)."
        test_recipe:
          setup: ["Deposit-required client, REQUESTED appointment with deposit_due 2000, already DEPOSIT_HELD."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-08T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-ID", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani ID", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech ID", license_number: "LIC-ID1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
