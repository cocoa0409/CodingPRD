  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open meeting rooms vs closed
  # reliance windows)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_room_half_open_adjacency
        grounds:
          - entities.BoardMeeting.fields.room_id
          - validations[priority=15]
          - errors[ERR_MEETING_ROOM_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the BoardMeeting room resource:
          occupation is [scheduled_at, scheduled_at+duration_minutes), so a
          meeting starting exactly when another ends (09:00+60min vs 10:00) is
          allowed, while a 30-minute skew into the window conflicts.
        test_recipe:
          setup:
            - "Meeting M1 occupies room R-HO over [2026-06-01T09:00:00Z, 2026-06-01T10:00:00Z)"
          setup_api_calls:
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-HO", scheduled_at: "2026-06-01T09:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-HO", scheduled_at: "2026-06-01T09:30:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-HO", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { m3: $.data.id }
          assert:
            - "09:30 create rejected with error_id ERR_MEETING_ROOM_CONFLICT (http 409)"
            - "10:00 create succeeds (adjacent end==start is free under half-open semantics): BoardMeeting.${m3}.status == SCHEDULED"
            - "BoardMeeting.${m1}.status == SCHEDULED (unaffected)"

      - name: reliance_window_closed_interval_touching
        grounds:
          - state_machines.RelianceAgreement.PROPOSED_to_EXECUTED
          - validations[priority=15]
          - errors[ERR_RELIANCE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on RelianceAgreement (different resource
          and different geometry than the half-open meeting room): the window
          [effective_start_date, effective_end_date] includes both endpoints,
          so a second agreement for the same (protocol, ceding institution)
          whose start equals the first's end (2026-12-31) DOES intersect and
          is rejected, while a start one day later executes cleanly.
        test_recipe:
          setup:
            - "Protocol P APPROVED via expedited track"
            - "Reliance R1 for (P, INST_A) EXECUTED over [2026-06-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Window", email: "window@univ.edu", department: "Medicine", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair W", email: "chairw@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev S", email: "revs@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev_s: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev T", email: "revt@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { rev_t: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Window Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/window-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_s}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { asg_s: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_t}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_t: $.data.id }
            - call: "POST /irb/review-assignments/${asg_s}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_s}"
            - call: "POST /irb/review-assignments/${asg_t}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_t}"
            - call: "POST /irb/review-assignments/${asg_s}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_s}"
            - call: "POST /irb/review-assignments/${asg_t}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_t}"
            - call: "POST /irb/protocols/${proto_id}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/reliance-agreements"
              payload: { protocol_id: "${proto_id}", ceding_institution_code: "INST_A", reviewing_institution_code: "UNIV", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: IrbAdmin
              captures: { rel1: $.data.id }
            - call: "POST /irb/reliance-agreements/${rel1}/execute"
              payload: {}
              as: IrbAdmin
            - call: "POST /irb/reliance-agreements"
              payload: { protocol_id: "${proto_id}", ceding_institution_code: "INST_A", reviewing_institution_code: "UNIV", effective_start_date: "2026-12-31T00:00:00Z", effective_end_date: "2027-06-30T00:00:00Z" }
              as: IrbAdmin
              captures: { rel2: $.data.id }
            - call: "POST /irb/reliance-agreements"
              payload: { protocol_id: "${proto_id}", ceding_institution_code: "INST_A", reviewing_institution_code: "UNIV", effective_start_date: "2027-01-01T00:00:00Z", effective_end_date: "2027-06-30T00:00:00Z" }
              as: IrbAdmin
              captures: { rel3: $.data.id }
          trigger:
            - call: "POST /irb/reliance-agreements/${rel2}/execute"
              payload: {}
              as: IrbAdmin
              captures: { err: $.data.error_id }
            - call: "POST /irb/reliance-agreements/${rel3}/execute"
              payload: {}
              as: IrbAdmin
          assert:
            - "rel2 execute rejected with error_id ERR_RELIANCE_WINDOW_OVERLAP (http 409): 2026-12-31 belongs to both closed windows"
            - "rel3 execute succeeds: RelianceAgreement.${rel3}.status == EXECUTED"
            - "RelianceAgreement.${rel2}.status stays PROPOSED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (approved-consent cardinality vs member
  # workload counter)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approved_consent_cardinality_conserved
        grounds:
          - state_machines.ConsentDocument.SUBMITTED_to_APPROVED
          - state_machines.ModificationRequest.SUBMITTED_to_APPROVED
          - entities.ConsentDocument.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of APPROVED ConsentDocuments per
          protocol: approving modification Mod with new_consent_document_id D2
          is the forward action (D2 SUBMITTED->APPROVED) and the atomic
          compensation (prior APPROVED D1 -> SUPERSEDED) keeps the count at
          exactly 1 before and after.
        test_recipe:
          setup:
            - "Protocol P APPROVED via expedited track; consent document D1 APPROVED (count(APPROVED docs) == 1)"
            - "D2 uploaded (SUBMITTED, version_seq == 2)"
            - "MINOR modification Mod referencing D2, created with the protocol's current version"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Consent", email: "consent@univ.edu", department: "Medicine", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair D", email: "chaird@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev U", email: "revu@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev_u: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev W", email: "revw@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { rev_w: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Consent Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/study-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { d1: $.data.id }
            - call: "POST /irb/consent-documents/${d1}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_u}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { asg_u: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_w}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_w: $.data.id }
            - call: "POST /irb/review-assignments/${asg_u}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_u}"
            - call: "POST /irb/review-assignments/${asg_w}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_w}"
            - call: "POST /irb/review-assignments/${asg_u}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_u}"
            - call: "POST /irb/review-assignments/${asg_w}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_w}"
            - call: "POST /irb/protocols/${proto_id}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/study-v2.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { d2: $.data.id }
            - call: "GET /irb/protocols/${proto_id}"
              as: IrbCoordinator
              captures: { proto_v: $.data.version }
            - call: "POST /irb/protocols/${proto_id}/modifications"
              payload: { scope: "MINOR", description: "update consent wording", new_consent_document_id: "${d2}", expected_protocol_version: "${proto_v}" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /irb/modifications/${mod_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
          assert:
            - "ModificationRequest.${mod_id}.status == APPROVED"
            - "ConsentDocument.${d2}.status == APPROVED (forward action)"
            - "ConsentDocument.${d1}.status == SUPERSEDED (compensating action)"
            - "GET /irb/protocols/${proto_id}/consent-documents?status=APPROVED returns exactly 1 document — cardinality conserved at 1"
            - "ConsentDocument.${d2}.version_seq == 2"

      - name: member_workload_counter_round_trip
        grounds:
          - entities.IrbMember.fields.active_assignment_count
          - state_machines.ReviewAssignment.OFFERED_to_ACCEPTED
          - state_machines.ReviewAssignment.ACCEPTED_to_SUBMITTED
          - state_machines.ReviewAssignment.OFFERED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity = per-member active_assignment_count (a different
          conserved quantity than document cardinality): create+submit is a
          forward/compensating pair (OFFERED +1, ACCEPTED net 0, SUBMITTED -1)
          returning the counter to baseline 0, and create+decline is a second
          pair (OFFERED +1, DECLINED -1) also returning to 0; at every step
          the counter equals the number of assignments in {OFFERED, ACCEPTED}.
        test_recipe:
          setup:
            - "Two protocols P1 and P2 both UNDER_EXPEDITED_REVIEW"
            - "Reviewer rev1 with active_assignment_count == 0"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Load", email: "load@univ.edu", department: "Medicine", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair X", email: "chairx@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev Load", email: "revload@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev1: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Load Study 1", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p1: $.data.id }
            - call: "POST /irb/protocols/${p1}/consent-documents"
              payload: { file_ref: "s3://consent/load1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p1}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p1}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols"
              payload: { title: "Load Study 2", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p2: $.data.id }
            - call: "POST /irb/protocols/${p2}/consent-documents"
              payload: { file_ref: "s3://consent/load2.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p2}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p2}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
          trigger:
            - call: "POST /irb/protocols/${p1}/review-assignments"
              payload: { reviewer_id: "${rev1}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { a1: $.data.id }
            - call: "POST /irb/review-assignments/${a1}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /irb/review-assignments/${a1}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /irb/protocols/${p2}/review-assignments"
              payload: { reviewer_id: "${rev1}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { a2: $.data.id }
            - call: "POST /irb/review-assignments/${a2}/respond"
              payload: { response: "DECLINE" }
              as: Reviewer
              as_user_id: "${rev1}"
          assert:
            - "After A1 create: IrbMember.${rev1}.active_assignment_count == 1"
            - "After A1 ACCEPT: count still == 1 (OFFERED and ACCEPTED both counted)"
            - "After A1 recommendation: count == 0 (round trip restored baseline)"
            - "After A2 create: count == 1"
            - "After A2 DECLINE: count == 0 (second round trip restored baseline)"
            - "ReviewAssignment.${a1}.status == SUBMITTED and ReviewAssignment.${a2}.status == DECLINED"
