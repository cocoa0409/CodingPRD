      - name: screening_interval_rejects_a_back_dated_observation
        claim_type: violation_to_error
        grounds:
          - validations[priority=80].ERR_SCREENING_INTERVAL_VIOLATION
        excluded_because:
          difficulty_instance: screening_interval_is_a_symmetric_fourteen_day_buffer_around_each_observation
          rationale: "That §1.8 instance walks the exactly-14-day acceptance and both directions of the 13 day 23 hour rejection on one outfall."

      - name: inspection_subject_mismatch_on_the_polymorphic_discriminator
        claim_type: violation_to_error
        grounds:
          - validations[priority=75].ERR_INSPECTION_SUBJECT_MISMATCH
        excluded_because:
          difficulty_instance: missing_site_fk_outranks_inspection_subject_mismatch
          rationale: "That §1.8 instance shows the priority 50 not-found answering for a dead site id and the priority 75 mismatch answering once the ids resolve."

      - name: inspection_coverage_intervals_may_not_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=80].ERR_INSPECTION_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: inspection_coverage_periods_are_closed_intervals_that_conflict_when_they_touch
          rationale: "That §1.8 instance proves the closed-closed semantics, including the same-day touch and the escape via a different inspection_type."

      - name: escalation_cooling_off_precedes_the_monotonic_penalty_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=80].ERR_ESCALATION_COOLING_OFF
        excluded_because:
          difficulty_instance: escalation_cooling_off_outranks_penalty_decrease_guard
          rationale: "That §1.8 instance violates both rules in one call and pins the 409 cooling-off answer ahead of the 422 penalty-decrease answer."

      - name: stale_parent_version_precedes_the_pending_sample_block
        claim_type: priority_ordering
        grounds:
          - validations[priority=60]
        excluded_because:
          difficulty_instance: stale_term_version_outranks_pending_sample_block_on_compile
          rationale: "That §1.8 instance compiles with a stale permit-term version while a PENDING sample sits in the window and pins the 412."

      - name: credit_approval_requires_an_eligible_substantiating_facility
        claim_type: violation_to_error
        grounds:
          - validations[priority=85].ERR_FACILITY_NOT_CREDIT_ELIGIBLE
        excluded_because:
          difficulty_instance: credit_approval_blocked_by_facility_agreement_state
          rationale: "That §1.8 instance flips credit_eligible by recording the maintenance agreement and shows the same review call failing then passing."

      - name: compile_is_blocked_while_a_sample_awaits_adjudication
        claim_type: violation_to_error
        grounds:
          - validations[priority=84].ERR_PENDING_SAMPLES_IN_WINDOW
        excluded_because:
          difficulty_instance: stale_term_version_outranks_pending_sample_block_on_compile
          rationale: "That §1.8 instance reaches the priority 84 rule with a fresh version and then clears it by validating the sample."

      - name: certification_is_blocked_by_a_non_compliant_posture
        claim_type: violation_to_error
        grounds:
          - validations[priority=86].ERR_POSTURE_NON_COMPLIANT
        excluded_because:
          difficulty_instance: report_certification_blocked_by_permit_term_posture
          rationale: "That §1.8 instance drives the posture to NON_COMPLIANT and pins the 422 on certify at the end of the cascade."

      - name: outfall_retirement_is_blocked_by_a_live_case
        claim_type: violation_to_error
        grounds:
          - validations[priority=77].ERR_OUTFALL_HAS_OPEN_CASES
        excluded_because:
          difficulty_instance: outfall_retirement_blocked_by_open_illicit_discharge_case
          rationale: "That §1.8 instance retires the outfall only after the cascade-created case is resolved, showing open_case_count driving the guard."

  - section: endpoints
    instances:

      - name: nested_listing_pages_and_filters_interact_and_total_count_follows_the_filter
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET /stormwater/permit-terms/{id}/outfalls
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count reports the size of the filtered set, not of the table, so a HIGH-tier filter with offset 2 returns one row and has_more false while an unfiltered offset 2 still has more."
        test_recipe:
          setup:
            - "ACTIVE term with five outfalls, one of them retired"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { pe_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
