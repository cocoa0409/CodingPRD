              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-LK1", guest_name: "Ras Oyelaran", room_number: "1401", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 2000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_id}", business_date_id: "${bd1_id}", requested_amount: 1500.00, reason_code: "SERVICE_RECOVERY", narrative: "Extended outage compensation." }
              as: RevenueManager
              as_user_id: "u_rm_1"
