  # ===========================================================================
  # Supplemental combinatorial_formula instances exercising mode (c): a
  # circular-looking dependency whose evaluation order is pinned. (The rule's
  # §0.5 minimum of 2 instances across different modes is already met above by
  # mode (a) + mode (b); these add the third mode for depth.)
  - rule_id: combinatorial_formula
    instances:
      - name: reinspection_fee_circular_discount_mode_c
        grounds:
          - calculations.reinspection_fee
          - calculations.inspection_fee
          - state_machines.InspectionOrder.DELIVERED_to_SCHEDULED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency made explicit: the re-inspection fee depends
          on the NEW order's quoted fee, but the discount fraction is selected by a band
          keyed on the PARENT order's final_fee_cents (50500 -> 50000<=x<100000 -> d=0.6).
          Evaluation order pinned: quote new order (BUYER 2500 no add-on = 43000) THEN pick
          d from parent band THEN reinspect_fee = round(43000*0.4) = 17200.
        test_recipe:
          setup:
            - "Parent BUYER order over a 2500-sqft property with RADON add-on, scheduled (quoted 52900), paid 52900, started, report measured 2200, one MAJOR + one CRITICAL defect, SUBMITTED, APPROVED (final_risk 466, band MAJOR), DELIVERED (final fee 50500)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
