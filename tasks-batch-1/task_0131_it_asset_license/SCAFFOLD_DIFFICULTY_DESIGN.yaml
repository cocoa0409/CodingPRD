              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/true-ups"
              payload: { software_product_id: "${pid}", variant: "LIVE", as_of: "2025-03-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { tu: $.data.id }
          trigger:
            - call: "POST /assets/true-ups/${tu}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { tc: $.data.total_consumed_units, pos: $.data.position_units, v: $.data.verdict }
          assert:
            - "TrueUpReconciliation.${tu}.total_consumed_units == 0"
            - "TrueUpReconciliation.${tu}.position_units == 5"
            - "TrueUpReconciliation.${tu}.verdict == COMPLIANT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: install_activate_requires_entitlement_active
        grounds:
          - state_machines.InstallationRecord.PENDING_to_ACTIVE
          - state_machines.LicenseEntitlement.ACTIVE_to_SUSPENDED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair Install→Entitlement: an InstallationRecord PENDING→ACTIVE is rejected with
          ERR_ENTITLEMENT_NOT_ACTIVE when its LicenseEntitlement.status == SUSPENDED, i.e. the install's
          valid transition depends on the entitlement's state.
        test_recipe:
          setup:
            - "Entitlement ACTIVE then SUSPENDED; one PENDING install charged to it."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-CE1", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ENTITLEMENT_NOT_ACTIVE   # Install transition gated by Entitlement.status"

      - name: checkout_requires_asset_in_stock
        grounds:
          - state_machines.HardwareAsset.IN_STOCK_to_ASSIGNED
          - validations[priority=11]
          - entities.HardwareAsset.fields.status
        distinguishing_aspect: |
          Different entity pair Checkout→HardwareAsset: a checkout is rejected with ERR_ASSET_NOT_AVAILABLE
          when HardwareAsset.status == IN_REPAIR (not IN_STOCK) — distinct cross-entity dependency from the
          Install→Entitlement pair.
        test_recipe:
          setup:
            - "ACTIVE employee; asset moved IN_STOCK→IN_REPAIR; attempt checkout."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/employees"
              payload: { full_name: "Bob", email: "bob@x.com", department: "ENG" }
              as: AssetManager
              captures: { emp: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-CE2", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/hardware/${aid}/transition"
              payload: { to_status: "IN_REPAIR" }
              as: AssetManager
          trigger:
            - call: "POST /assets/hardware/${aid}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSET_NOT_AVAILABLE   # checkout gated by HardwareAsset.status == IN_STOCK"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: checkout_half_open_interval_overlap
        grounds:
          - validations[priority=12]
          - state_machines.HardwareAsset.IN_STOCK_to_ASSIGNED
          - entities.AssignmentCheckout.fields.checkout_at
          - entities.AssignmentCheckout.fields.expected_return_at
        distinguishing_aspect: |
          Half-open [checkout_at, expected_return_at) interval semantics on the AssignmentCheckout/asset
          resource: a second OPEN checkout whose start equals the first's expected_return_at does NOT
          overlap (adjacency allowed), but a start strictly before it DOES overlap → ERR_CHECKOUT_OVERLAP.
          NOTE: the asset returns to IN_STOCK after the first checkout is RETURNED, so the overlap check
          (not the asset-status check) is what rejects the backdated second checkout.
        test_recipe:
          setup:
            - "Employee max_assigned_assets=5; asset checked out [02-01,02-10) then RETURNED; attempt new OPEN checkout [02-05,02-12) overlapping the historical window."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/employees"
              payload: { full_name: "Cara", email: "cara@x.com", department: "ENG", max_assigned_assets: 5 }
              as: AssetManager
              captures: { emp: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-OV1", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/hardware/${aid}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
              captures: { co1: $.data.id }
            - call: "POST /assets/checkouts/${co1}/return"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/hardware/${aid}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-05T00:00:00.000Z", expected_return_at: "2025-02-12T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHECKOUT_OVERLAP   # [02-05,02-12) overlaps historical [02-01,02-10)"

      - name: coverage_closed_interval_adjacency_allowed
        grounds:
          - validations[priority=13]
          - entities.WarrantyLease.fields.coverage_start
          - entities.WarrantyLease.fields.coverage_end
          - state_machines.WarrantyLease.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Different resource (WarrantyLease/asset) with DIFFERENT interval arithmetic: closed
          [coverage_start, coverage_end] intervals where zero-gap adjacency is allowed — a coverage
          starting the day AFTER the prior coverage_end is accepted, but one whose start falls ON/inside
          the prior closed window is rejected with ERR_COVERAGE_OVERLAP. Contrasts the half-open checkout rule.
        test_recipe:
          setup:
            - "Asset with ACTIVE coverage [2025-01-01,2025-06-30]; add adjacent coverage [2025-07-01,2025-12-31] (allowed); then add overlapping coverage [2025-06-30,2025-09-30] (rejected)."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "Cov Co", vendor_type: "HARDWARE", support_email: "s@cov.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-OV2", category: "SERVER", purchase_cost_cents: 500000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/coverage"
              payload: { hardware_asset_id: "${aid}", vendor_id: "${vid}", coverage_type: "WARRANTY", coverage_start: "2025-01-01T00:00:00.000Z", coverage_end: "2025-06-30T00:00:00.000Z" }
              as: AssetManager
              captures: { cov1: $.data.id }
            - call: "POST /assets/coverage"
              payload: { hardware_asset_id: "${aid}", vendor_id: "${vid}", coverage_type: "WARRANTY", coverage_start: "2025-07-01T00:00:00.000Z", coverage_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { cov2: $.data.id }
          trigger:
            - call: "POST /assets/coverage"
              payload: { hardware_asset_id: "${aid}", vendor_id: "${vid}", coverage_type: "WARRANTY", coverage_start: "2025-06-30T00:00:00.000Z", coverage_end: "2025-09-30T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "cov2 created successfully (adjacent [07-01,...] does not overlap [.., 06-30])"
            - "trigger response error_id == ERR_COVERAGE_OVERLAP   # start 06-30 lies on prior closed end"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: entitlement_consumed_units_conserved_install_uninstall
        grounds:
          - state_machines.InstallationRecord.PENDING_to_ACTIVE
          - state_machines.InstallationRecord.ACTIVE_to_UNINSTALLED
          - entities.LicenseEntitlement.fields.consumed_units
