  - section: calculations
    instances:

      - name: screening_outcome_classification_vision_boundaries_30_35_40
        claim_type: correct_result
        grounds:
          - calculations.screening_outcome_classification
          - state_machines.Screening.SCHEDULED_to_COMPLETED
          - state_machines.Screening.SCHEDULED_to_REFERRED
          - state_machines.Screening.SCHEDULED_to_RESCREEN_DUE
        distinguishing_aspect: "VISION thresholds are inclusive on the named edge: result_value 30 classifies PASS (<= 30), 35 classifies INCONCLUSIVE (strictly between 30 and 40) and 40 classifies REFER (>= 40), forking the same Screening machine three different ways."
        test_recipe:
          setup:
            - "School MERL41 with an RN on an ACTIVE Monday block and one ENROLLED student; clock at 2026-08-03T09:00:00Z."
            - "Three VISION Screenings for the same student, all SCHEDULED."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Merlin Elementary", building_code: "MRL41", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Mae Torres", grade_level: 3, date_of_birth: "2017-06-16T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", screening_type: "VISION", scheduled_for: "2026-08-03T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { scr_pass_id: $.data.id }
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", screening_type: "VISION", scheduled_for: "2026-08-03T11:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { scr_inc_id: $.data.id }
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", screening_type: "VISION", scheduled_for: "2026-08-03T12:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { scr_ref_id: $.data.id }
          trigger:
            - call: "POST /health-office/screenings/${scr_pass_id}/record-result"
              payload: { result_value: 30, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { o_pass: $.data.outcome }
            - call: "POST /health-office/screenings/${scr_inc_id}/record-result"
              payload: { result_value: 35, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { o_inc: $.data.outcome }
            - call: "POST /health-office/screenings/${scr_ref_id}/record-result"
              payload: { result_value: 40, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { o_ref: $.data.outcome }
          assert:
            - "Screening.${scr_pass_id}.outcome == PASS and status == COMPLETED and rescreen_due_at == null and referral_due_at == null"
            - "Screening.${scr_inc_id}.outcome == INCONCLUSIVE and status == RESCREEN_DUE"
            - "Screening.${scr_inc_id}.rescreen_due_at == 2026-08-17T09:00:00.000Z"
            - "Screening.${scr_ref_id}.outcome == REFER and status == REFERRED"
            - "Screening.${scr_ref_id}.referral_due_at == 2026-09-02T09:00:00.000Z"
            - "SCREENING_REFERRAL is a member of Student.${stu_id}.alert_flags"
            - "All three rows carry screened_by_nurse_id == ${rn_id}"

      - name: prn_interval_exactly_at_minimum_elapsed_is_allowed
        claim_type: precision
        grounds:
          - calculations.prn_dose_gate
          - validations[priority=32]
          - entities.MedicationAuthorization.fields.prn_min_interval_minutes
          - entities.MedicationAuthorization.fields.last_administered_at
        distinguishing_aspect: "elapsed_minutes is floored and compared with >=, so a PRN dose requested at exactly prn_min_interval_minutes (240) after last_administered_at is ACCEPTED with 201; the boundary is inclusive, not strict."
        test_recipe:
          setup:
            - "School NOVA42 with an RN on an ACTIVE Monday block, one ENROLLED student and one AVAILABLE student-specific ALBUTEROL lot of 10 units."
            - "One PRN ALBUTEROL order with prn_min_interval_minutes 240 and max_doses_per_day 3 at (CONSENT_GRANTED, VERIFIED)."
            - "Clock at 2026-08-03T09:00:00Z; the encounter is IN_ASSESSMENT and one dose has already been PREPARED then ADMINISTERED, stamping last_administered_at at 09:00."
            - "Clock then advanced to exactly 2026-08-03T13:00:00Z, 240 whole minutes later."
