# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2480 — Disaster Public Assistance Grant Administration
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric assert
# below was executed against the referenced calculations[].formula and its
# constants: before being written as a literal.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_eligible_cost_provisional_vs_final_divergence
        grounds:
          - calculations.project_eligible_cost
          - calculations.project_review_basis
          - calculations.mitigation_cap_allocation
          - entities.Project.fields.eligible_cost_provisional_cents
          - entities.Project.fields.eligible_cost_final_cents
          - state_machines.Project.DRAFT_to_UNDER_REVIEW
          - state_machines.Project.OBLIGATED_to_CLOSEOUT_REQUESTED
        distinguishing_aspect: |
          This instance is cost accounting on a Project: the PROVISIONAL variant
          bases repair on estimated_repair_cost_cents and offsets anticipated
          insurance, while the FINAL variant bases repair on the sum of reviewed
          CostLineItem.eligible_cents and offsets only actual settlement
          proceeds, so the two stored fields differ by exactly -1190000 cents on
          identical input data.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4901 (TX / FLOOD, incident period 2026-06-10T00:00:00Z through 2026-06-25T00:00:00Z, population 2000000, federal share 0.75, small-project threshold 4000000 cents) in status DECLARED."
            - "Applicant 'City of Harborview' (LOCAL_GOVERNMENT) with eligibility_status ELIGIBLE."
            - "Facility 'Riverside Pump Station' (WATER_CONTROL, PUBLIC, not in a flood zone) with eligibility_status ELIGIBLE."
            - "Project (category C, estimated_repair_cost_cents 5000000, mitigation_requested_cents 900000) submitted, so the PROVISIONAL variant is stored."
            - "Two MATERIALS cost line items claiming 3600000 and 200000 cents, both reviewed ALLOWED, so documented actuals total 3800000 cents."
            - "Project cost-reviewed VALIDATE (repair_eligible_cents 3800000, size_class SMALL, mitigation_approved_cents 760000) and then OBLIGATED at 3420000 cents."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4901", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC", in_active_use: true, legal_responsibility_documented: true, flood_zone: false, prior_disaster_flood_damage: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Pump station intake rebuild", scope_of_work: "Rebuild intake structure and control panel", estimated_repair_cost_cents: 5000000, mitigation_requested_cents: 900000 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "${project_id}", cost_type: "MATERIALS", claimed_cents: 3600000, work_start_at: "2026-06-12T08:00:00Z", work_end_at: "2026-06-12T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { line_a_id: $.data.id }
            - call: "POST /public-assistance/cost-line-items/${line_a_id}/review"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "${project_id}", cost_type: "MATERIALS", claimed_cents: 200000, work_start_at: "2026-06-13T08:00:00Z", work_end_at: "2026-06-13T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { line_b_id: $.data.id }
            - call: "POST /public-assistance/cost-line-items/${line_b_id}/review"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects/${project_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects/${project_id}/obligate"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /public-assistance/projects/${project_id}/closeout-request"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
          assert:
            - "Project.${project_id}.eligible_cost_provisional_cents == 5750000"
            - "Project.${project_id}.eligible_cost_final_cents == 4560000"
            - "Project.${project_id}.eligible_cost_final_cents - Project.${project_id}.eligible_cost_provisional_cents == -1190000"
            - "Project.${project_id}.mitigation_approved_cents == 760000 (frozen at cost review, NOT recomputed from the FINAL repair basis)"
            - "Project.${project_id}.repair_eligible_cents == 3800000"
            - "Project.${project_id}.status == CLOSEOUT_REQUESTED"

      - name: applicant_risk_score_screening_vs_monitoring_divergence
        grounds:
          - calculations.applicant_risk_score
          - entities.Applicant.fields.risk_score_screening
          - entities.Applicant.fields.risk_score_monitoring
          - entities.Applicant.fields.risk_tier
          - "state_machines.Applicant.ELIGIBILITY:PENDING_to_ELIGIBILITY:ELIGIBLE"
        distinguishing_aspect: |
          This instance is risk scoring on an Applicant, a different entity
          domain from the Project cost accounting instance: the SCREENING
          variant weights facility count and uninsured flood exposure and
          returns 55.00 (tier MEDIUM), while the MONITORING variant weights
          reporting delinquency and cash-to-obligation ratio on the very same
          row and returns 6.00 (tier LOW).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4902 (TX / SEVERE_STORM) in status DECLARED."
            - "Applicant 'Cedar County' (LOCAL_GOVERNMENT) still in eligibility_status PENDING with risk_score_screening 0 and risk_score_monitoring null."
            - "Exactly three facilities owned by that applicant, one of which sits in a flood zone and carries no FLOOD insurance policy."
            - "No projects, obligations, drawdowns or progress reports exist, so the applicant ledger is entirely zero."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4902", state_code: "TX", incident_type: "SEVERE_STORM", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 500000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "Cedar County", applicant_type: "LOCAL_GOVERNMENT", population_served: 80000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "County Road 12 Bridge", facility_type: "ROAD_BRIDGE", ownership: "PUBLIC", flood_zone: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "County Maintenance Barn", facility_type: "BUILDING_EQUIPMENT", ownership: "PUBLIC", flood_zone: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Cedar Creek Levee", facility_type: "WATER_CONTROL", ownership: "PUBLIC", flood_zone: true }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "County government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/applicants/${applicant_id}/reporting-sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after the first trigger call: Applicant.${applicant_id}.risk_score_screening == 55.00"
            - "after the first trigger call: Applicant.${applicant_id}.risk_score_monitoring == null and Applicant.${applicant_id}.monitoring_scored_at == null"
            - "after the first trigger call: Applicant.${applicant_id}.risk_tier == MEDIUM"
            - "after the second trigger call: Applicant.${applicant_id}.risk_score_monitoring == 6.00"
            - "after the second trigger call: Applicant.${applicant_id}.risk_score_screening == 55.00 (unchanged by the MONITORING pass)"
            - "after the second trigger call: Applicant.${applicant_id}.risk_tier == LOW (tier follows risk_score_monitoring once monitoring_scored_at is non-null)"
            - "after the second trigger call: Applicant.${applicant_id}.monitoring_scored_at == 2026-07-01T00:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: federal_share_obligation_per_component_rounding_order
        grounds:
          - calculations.federal_share_obligation
          - calculations.project_review_basis
          - entities.Project.fields.federal_share_obligated_cents
          - state_machines.Project.VALIDATED_to_OBLIGATED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the scaffold pins
          round_half_up per component (repair share and mitigation share rounded
          separately, then added) which yields 3000004 cents, whereas summing
          the two bases first and rounding once yields 3000003 cents, so the
          single-cent gap falsifies the wrong order.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4903 (TX / FLOOD, federal share 0.75, small-project threshold 4000000 cents) in status DECLARED."
            - "Applicant ELIGIBLE, facility ELIGIBLE and not in a flood zone."
            - "Project (category C, estimated_repair_cost_cents 3900000, mitigation_requested_cents 200002) submitted."
            - "One MATERIALS cost line item claiming 3800002 cents, reviewed ALLOWED."
            - "Project cost-reviewed VALIDATE, so repair_eligible_cents == 3800002, size_class == SMALL, mitigation_approved_cents == 200002 and insurance_reduction_cents == 0."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4903", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "Town of Alder", applicant_type: "LOCAL_GOVERNMENT", population_served: 40000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Town government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Alder Street Culvert", facility_type: "ROAD_BRIDGE", ownership: "PUBLIC", in_active_use: true, legal_responsibility_documented: true, flood_zone: false, prior_disaster_flood_damage: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Culvert replacement", scope_of_work: "Replace failed culvert and headwalls", estimated_repair_cost_cents: 3900000, mitigation_requested_cents: 200002 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "${project_id}", cost_type: "MATERIALS", claimed_cents: 3800002, work_start_at: "2026-06-14T08:00:00Z", work_end_at: "2026-06-14T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { line_id: $.data.id }
            - call: "POST /public-assistance/cost-line-items/${line_id}/review"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects/${project_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/projects/${project_id}/obligate"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
          assert:
            - "Project.${project_id}.repair_eligible_cents == 3800002"
            - "Project.${project_id}.mitigation_approved_cents == 200002"
            - "Project.${project_id}.federal_share_obligated_cents == 3000004"
            - "Project.${project_id}.federal_share_obligated_cents != 3000003 (the sum-then-round result is wrong)"
            - "Applicant.${applicant_id}.total_obligated_cents == 3000004"
            - "Project.${project_id}.status == OBLIGATED"

      - name: mitigation_cap_allocation_pinned_evaluation_order
        grounds:
          - calculations.mitigation_cap_allocation
          - calculations.project_review_basis
          - entities.Project.fields.size_class
          - entities.Project.fields.mitigation_approved_cents
          - state_machines.Project.UNDER_REVIEW_to_VALIDATED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: size_class is derived from repair_eligible_cents EXCLUDING
          mitigation (3800000 < 4000000 → SMALL → cap 0.20 → 760000), even
          though the resulting total project cost of 4560000 sits above the
          small-project threshold; re-deriving size_class from the total would
          give LARGE, cap 0.15 and 570000.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4904 (TX / FLOOD, small-project threshold 4000000 cents) in status DECLARED."
            - "Applicant ELIGIBLE, facility ELIGIBLE."
            - "Project (category C, estimated_repair_cost_cents 5000000, mitigation_requested_cents 900000) submitted, i.e. PROVISIONAL size_class LARGE with mitigation_approved_cents 750000."
            - "Two MATERIALS cost line items claiming 3600000 and 200000 cents, both reviewed ALLOWED, so the reviewed repair basis is 3800000 cents — below the threshold, unlike the estimate."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4904", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "City government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC", flood_zone: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Pump station intake rebuild", scope_of_work: "Rebuild intake structure and control panel", estimated_repair_cost_cents: 5000000, mitigation_requested_cents: 900000 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "${project_id}", cost_type: "MATERIALS", claimed_cents: 3600000, work_start_at: "2026-06-12T08:00:00Z", work_end_at: "2026-06-12T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { line_a_id: $.data.id }
            - call: "POST /public-assistance/cost-line-items/${line_a_id}/review"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "${project_id}", cost_type: "MATERIALS", claimed_cents: 200000, work_start_at: "2026-06-13T08:00:00Z", work_end_at: "2026-06-13T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { line_b_id: $.data.id }
            - call: "POST /public-assistance/cost-line-items/${line_b_id}/review"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/projects/${project_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          assert:
            - "Project.${project_id}.repair_eligible_cents == 3800000"
            - "Project.${project_id}.size_class == SMALL (derived from 3800000, mitigation excluded)"
            - "Project.${project_id}.mitigation_approved_cents == 760000"
            - "Project.${project_id}.mitigation_approved_cents != 570000 (the LARGE cap of 0.15 must not be selected)"
            - "Project.${project_id}.repair_eligible_cents + Project.${project_id}.mitigation_approved_cents == 4560000, which exceeds Disaster.${disaster_id}.small_project_threshold_cents while size_class stays SMALL"
            - "Project.${project_id}.status == VALIDATED"

      - name: cost_line_item_labor_branch_nonlinear_interaction
        grounds:
          - calculations.cost_line_item_eligible_cost
          - entities.CostLineItem.fields.eligible_cents
          - entities.CostLineItem.fields.disallowance_reason
          - entities.ForceAccountResource.fields.fringe_benefit_pct
          - state_machines.CostLineItem.SUBMITTED_to_PARTIALLY_ALLOWED
        distinguishing_aspect: |
          Mode (a) — four interacting inputs with non-linear interaction:
          project.work_type EMERGENCY crossed with employee_type PERMANENT
          zeroes the straight-time hours, the overtime multiplier 1.5 applies to
          the remaining hours, the fringe rate is clamped from 0.55 down to the
          0.40 cap, and the result is finally clamped by min(computed, claimed),
          producing 53386 cents instead of the 112704 cents the same hours would
          yield if straight time were eligible.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4905 (TX / HURRICANE, incident period 2026-06-10T00:00:00Z through 2026-06-25T00:00:00Z) in status DECLARED."
            - "Applicant ELIGIBLE, facility ELIGIBLE."
            - "Project of category B submitted, so work_type == EMERGENCY."
            - "ForceAccountResource of resource_kind LABOR, employee_type PERMANENT, base_hourly_rate_cents 4237, fringe_benefit_pct 0.55 (above the 0.40 cap)."
            - "One FORCE_ACCOUNT_LABOR cost line item on that resource claiming 100000 cents for 10 straight-time hours and 6 overtime hours, still in review_status SUBMITTED."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4905", state_code: "TX", incident_type: "HURRICANE", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "City government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Emergency Debris Corridor", facility_type: "EMERGENCY_PROTECTIVE", ownership: "PUBLIC", flood_zone: false }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "B", title: "Emergency protective measures", scope_of_work: "Sandbagging and road closure crews", estimated_repair_cost_cents: 500000, mitigation_requested_cents: 0 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/force-account-resources"
              payload: { applicant_id: "${applicant_id}", resource_kind: "LABOR", label: "Public Works Crew Lead", employee_type: "PERMANENT", base_hourly_rate_cents: 4237, fringe_benefit_pct: 0.55 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
