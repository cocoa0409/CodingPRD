              captures: { assign2: $.data.id }
          assert:
            - "the first assignment returns 201 with span_ru == 3 and the rack then reports occupied_ru == 3, available_ru == 39, power_draw_va == 1200 and version == 2"
            - "the stale second assignment returns 412 with data.error_id == \"ERR_STALE_RACK_VERSION\", even though rack units 36-37 are free and its power_va is 0"
            - "immediately after the 412 GET /cabling/racks/${rack} still returns occupied_ru == 3 and version == 2, and GET /cabling/telecom-rooms/${room} still returns power_load_va == 1200"
            - "the resubmission with version 2 returns 201 with span_ru == 2"
            - "GET /cabling/racks/${rack} finally returns occupied_ru == 5, available_ru == 37, power_draw_va == 1200 and version == 3"

