            - { call: "POST /finish-runs/${fr1}/buff", payload: {}, as: FinishTech }
            - { call: "POST /finish-runs/${fr1}/complete", payload: {}, as: FinishTech }
            - { call: "POST /build-orders/${bo1}/fretwork", payload: {}, as: Luthier }
            - { call: "POST /build-orders/${bo1}/setup", payload: {}, as: Luthier }
            - { call: "POST /build-orders/${bo1}/setup-inspections", payload: {}, as: Luthier, as_user_id: "lu-eve", captures: { insp1: "$.data.id" } }
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.75, action_mm_bass 2.10, relief_mm 0.20 and intonation_cents_max 4.8 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank"
          assert:
            measure_http_status: 200
            status_after_measure: "MEASURED"
            deviation_score: 13.00
            sign_http_status: 200
            status_after_sign: "FAILED"
            verdict: "FAIL"
            inspector_user_id: "qi-frank"
            round_number: 1
            build_order_build_stage_after: "SETUP"
            build_order_rework_round_count_after: 1
            build_order_commercial_status_after: "OPTIONS_LOCKED"
            build_order_promised_date_after: "2026-11-01T00:00:00Z"
            note: "13.00 = (15 hundredths over the 1.6 treble spec * 600 + 8 tenths of a cent over the 4.0 intonation spec * 500) / 1000; bass 2.10 and relief 0.20 are inside spec and contribute nothing. rework_round_count 1 < REWORK_ESCALATION_THRESHOLD 2, so no AT_RISK escalation and no 14-day slip yet."

      - name: lot_ledger_sync_on_a_cut_is_covered_by_the_i1_invariant_instance
        claim_type: ledger_sync
        grounds: ["calculations.lot_board_feet_ledger", "state_machines.Billet.transitions"]
        excluded_because:
          difficulty_instance: i1_board_feet_conserved_when_cancel_recovers_reserved_wood
          rationale: "That §1.8 instance already walks the full ancestor-ledger synchronisation: POST /billets moves board_feet_unassigned into board_feet_reserved on the owning TonewoodLot, POST /components re-buckets it again, and the six board_feet_* buckets are reconciled against board_feet_received after every write. A separate corner asserting only the forward half of the same ledger would test a strict subset of the same behaviour."

      - name: reservation_release_compensation_is_covered_by_the_i3_invariant_instance
        claim_type: compensation
        grounds: ["state_machines.StationReservation.transitions"]
        excluded_because:
          difficulty_instance: i3_station_minutes_conserved_when_a_hold_is_released
          rationale: "The compensation pattern here is the HELD -> RELEASED reversal moving duration_minutes out of Station.held_minutes and into released_minutes with no drift, which that §1.8 instance asserts through both the explicit release endpoint and the climate-cascade system release. Repeating it as a corner would add no distinguishing assertion."

  # ===========================================================================
  - section: calculations
    instances:

      - name: billet_cut_charges_actual_kerf_per_cut_and_moves_the_ledger
        claim_type: constants_applied
        grounds: ["calculations.lot_board_feet_ledger", "calculations.tonewood_lot_yield", "entities.Billet.kerf_loss_board_feet"]
        distinguishing_aspect: "A single 30.00 bf cut is charged ACTUAL_KERF_BP (300) — 0.90 bf — not the whole-lot NOMINAL_KERF_BP (30) that the receipt projection used, so board_feet_available lands on 69.10 and board_feet_kerf_loss on 0.90. actual_yield_board_feet becomes 30.00 because shrink_bp(7.0) is clamped to 0 by max(0, m - 8.0), while nominal_yield_board_feet stays frozen at the 97.90 computed from the 12.0% receipt reading."
        test_recipe:
          setup: "One RELEASED SITKA_SPRUCE lot: 100.00 bf received at 12.0%, latest moisture reading 7.0%."
          setup_api_calls: *lot_released
          trigger: "POST /billets with billet_code BLT-001, lot_id ${lot1}, board_feet 30.00, grade AAA and expected_tonewood_lot_version ${lot_v1} as Machinist"
          assert:
            http_status: 201
            billet_kerf_loss_board_feet: 0.90
            billet_status: "AVAILABLE"
            lot_board_feet_cut: 30.00
            lot_board_feet_unassigned: 30.00
            lot_board_feet_kerf_loss: 0.90
            lot_board_feet_available: 69.10
            lot_board_feet_reserved: 0.00
            lot_actual_yield_board_feet: 30.00
            lot_nominal_yield_board_feet: 97.90
            lot_status: "RELEASED"
            note: "kerf = round_half_up(30.00 * 300 / 10000, 2) = 0.90; available = 100.00 - 30.00 - 0.90 = 69.10; invariant I1 reads 69.10 + 30.00 + 0.00 + 0.00 + 0.00 + 0.90 = 100.00. board_feet_available 69.10 >= MIN_USABLE_BOARD_FEET 2.0, so the lot stays RELEASED instead of going DEPLETED."

      - name: provisional_quote_excludes_a_rejected_option_selection
        claim_type: input_set_filtering
        grounds: ["calculations.custom_shop_quote_total", "state_machines.OptionSelection.transitions", "endpoints.POST_/option-selections/{selection_id}/reject"]
        distinguishing_aspect: "The PROVISIONAL input set is OptionSelection rows in {PENDING_APPROVAL, SELECTED}. With both options outstanding the total is 345910; rejecting HW-GOLD drops its 29705 line out of the set and the total recomputes to 316205. The rejected row keeps its line_total_cents 29705 for audit, so an implementation that sums all rows on the order — or that zeroes the rejected row's line instead of excluding it from the input set — cannot land on both numbers."
        test_recipe:
          setup: "A standard OM45 order at base 300000 with two ARTISAN options selected, both still PENDING_APPROVAL."
          setup_api_calls: &order_two_options
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-DOT", option_group: "INLAY", upcharge_cents: 12004, complexity_class: "ARTISAN", lead_time_days: 10 }, as: PlantAdmin, captures: { optD: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "HW-GOLD", option_group: "HARDWARE", upcharge_cents: 22004, complexity_class: "ARTISAN", lead_time_days: 14 }, as: PlantAdmin, captures: { optG: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-STD", model_code: "OM45", base_price_cents: 300000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: false, artist_tier: "NONE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optD}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "cs-gwen", captures: { selD: "$.data.id" } }
            - { call: "GET /build-orders/${bo1}", payload: {}, as: CustomShopCoordinator, captures: { bo_v2: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optG}", quantity: 1, expected_build_order_version: "${bo_v2}" }, as: CustomShopCoordinator, as_user_id: "cs-gwen", captures: { selG: "$.data.id" } }
          trigger: "POST /option-selections/${selG}/reject with reason \"customer dropped the gold hardware\" as CustomShopCoordinator"
          assert:
            provisional_quote_total_cents_before: 345910
            http_status: 200
            selG_status_after: "REJECTED"
            selD_status_after: "PENDING_APPROVAL"
            selG_line_total_cents: 29705
            selD_line_total_cents: 16205
            provisional_quote_total_cents_after: 316205
            binding_quote_total_cents: null
            note: "Lines are rounded individually: round_half_up(12004 * 13500 / 10000) = 16205 and round_half_up(22004 * 13500 / 10000) = 29705. Before: 300000 + 16205 + 29705 = 345910 (no surcharge, is_custom_shop false; no discount, artist_tier NONE). After: 300000 + 16205 = 316205."

      - name: deviation_score_is_zero_when_every_measurement_is_inside_spec
        claim_type: precision
        grounds: ["calculations.playability_deviation_score", "state_machines.SetupInspection.transitions", "entities.SetupInspection.deviation_score"]
        distinguishing_aspect: "Measurements exactly AT each spec ceiling — 1.60 treble, 2.20 bass, 0.25 relief, 4.0 cents — contribute zero penalty each, so deviation_score is 0.00 and not a small positive number: every term is max(0, measured - spec) and all four bounds are inclusive. The score is a decimal(2) 0.00 (never null, never an integer 0), the inspection signs to SIGNED with verdict PASS, and build_stage stays INSPECTION."
        test_recipe:
          setup: "A standard NITRO OM45 order at build_stage INSPECTION with round 1 OPEN, opened by luthier lu-eve."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank"
          assert:
            measure_http_status: 200
            deviation_score: 0.00
            sign_http_status: 200
            status_after_sign: "SIGNED"
            verdict: "PASS"
            inspector_user_id: "qi-frank"
            build_order_build_stage_after: "INSPECTION"
            build_order_rework_round_count_after: 0
            build_order_commercial_status_after: "OPTIONS_LOCKED"
            note: "0.00 <= PASS_SCORE_MAX 10.00, so the MEASURED -> SIGNED branch is taken and the order becomes eligible for assign-serial without leaving INSPECTION."

      - name: serial_number_is_minted_per_model_and_year_and_applies_the_deposit
        claim_type: correct_result
        grounds: ["calculations.serial_number_assignment", "calculations.cancellation_deposit_disposition", "state_machines.BuildOrder.commercial_status.transitions"]
        distinguishing_aspect: "assign-serial mints OM45-2026-00001 — model_code, the 4-digit year of the LOGICAL clock (2026-08-16, not wall clock), and a 5-digit zero-padded sequence that starts at 1 for this model in this year — and in the same request drives commercial_status OPTIONS_LOCKED -> INVOICED, applying min(deposit_held_cents 100000, binding_quote_total_cents 300000) = 100000 out of held into applied."
        test_recipe:
          setup: "A standard NITRO OM45 order at build_stage INSPECTION, deposit 100000 held, binding quote 300000."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank, then POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator"
          assert:
            http_status: 200
            serial_number: "OM45-2026-00001"
            build_stage: "SERIALIZED"
            commercial_status: "INVOICED"
            binding_quote_total_cents: 300000
            deposit_paid_cents: 100000
            deposit_applied_cents: 100000
            deposit_held_cents: 0
            deposit_refunded_cents: 0
            deposit_forfeited_cents: 0
            note: "Invariant I2 after the write: 100000 paid = 100000 applied + 0 refunded + 0 forfeited + 0 held. A second assign-serial on this order returns ERR_SERIAL_ALREADY_ASSIGNED (409); the next OM45 serialized in 2026 would be OM45-2026-00002."

      - name: export_fees_use_the_tier_1_rate_with_no_cites_endorsement
        claim_type: constants_applied
        grounds: ["calculations.export_declared_value", "calculations.protected_species_requirement", "endpoints.POST_/export-shipments"]
        distinguishing_aspect: "Goods value 300000 is <= TIER_1_MAX_CENTS so the 150 bp rate applies: doc_fee 4500 (above DOC_FEE_MIN_CENTS 3000, so the floor does NOT bind), insurance 2741 charged on goods + doc_fee rather than goods alone, declared 307241. CITES_ENDORSEMENT_FEE_CENTS is NOT added because the only contributing lot is SITKA_SPRUCE with cites_appendix NONE — the empty-aggregate boundary — so attach-docs is accepted with no cites_permit_number at all."
        test_recipe:
          setup: "A standard NITRO OM45 order at build_stage INSPECTION, built from a single SITKA_SPRUCE component."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank, then POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator, then POST /export-shipments with build_order_id ${bo1} and destination_country_code JP as ComplianceOfficer, then POST /export-shipments/{that shipment}/attach-docs with no cites_permit_number as ComplianceOfficer"
          assert:
            create_http_status: 201
            status_at_creation: "DOCS_PENDING"
            cites_permit_required: false
            required_cites_appendix: "NONE"
            goods_value_cents: 300000
            doc_fee_cents: 4500
            insurance_cents: 2741
            declared_value_cents: 307241
            attach_docs_http_status: 200
            status_after_attach_docs: "DOCS_ATTACHED"
            note: "doc_fee = max(round_half_up(300000 * 150 / 10000) = 4500, 3000) + 0 = 4500; insurance = round_half_up((300000 + 4500) * 90 / 10000) = round_half_up(2740.5) = 2741; declared = 300000 + 4500 + 2741 = 307241. Both fee figures are recomputed at attach-docs and land on the same literals because nothing about the order changed between the two calls."

      - name: standard_build_warranty_covers_twenty_four_calendar_months
        claim_type: threshold
        grounds: ["calculations.warranty_coverage_window", "state_machines.RepairShop.transitions", "endpoints.POST_/warranty-registrations"]
        distinguishing_aspect: "is_custom_shop false selects COVERAGE_MONTHS_STANDARD (24), not the 60-month custom-shop branch, and coverage_ends_at is 2028-08-16T00:00:00Z — whole calendar-month arithmetic from purchase_date 2026-08-16, never a 730-day approximation. The registration also lifts the shop's warranty_claim_count to 1 because the row is created ACTIVE."
        test_recipe:
          setup: "A standard NITRO OM45 order at build_stage INSPECTION, plus a repair shop that will be authorized before registering."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank, then POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator, then POST /repair-shops with shop_code SHP-1, shop_name Kanto Fret Works and country_code JP as ServiceNetworkManager, then POST /repair-shops/{that shop}/authorize with authorization_level FULL_SERVICE as ServiceNetworkManager, then POST /warranty-registrations with build_order_id ${bo1}, registering_shop_id {that shop}, serial_number OM45-2026-00001, owner_email owner@example.com and purchase_date 2026-08-16T00:00:00Z as ServiceNetworkManager"
          assert:
            http_status: 201
            status: "ACTIVE"
            coverage_months: 24
            coverage_ends_at: "2028-08-16T00:00:00Z"
            serial_number: "OM45-2026-00001"
            repair_shop_warranty_claim_count_after: 1
            note: "The same purchase_date on a custom-shop order would give coverage_months 60 and 2031-08-16T00:00:00Z. A serial_number that does not match the order returns ERR_SERIAL_MISMATCH (422), and a second registration for the same order returns ERR_WARRANTY_ALREADY_REGISTERED (409)."

      - name: nominal_and_actual_yield_divergence_is_covered_by_the_dual_variant_instance
        claim_type: variant_divergence
        grounds: ["calculations.tonewood_lot_yield"]
        excluded_because:
          difficulty_instance: lot_yield_nominal_vs_actual_diverge_on_moisture_kerf_and_input_set
          rationale: "That §1.8 instance already pins both variants on the same lot and asserts the three-axis divergence (receipt vs current moisture, whole-lot vs per-cut kerf, projection vs Billet replay) with literal expected values on both fields."

      - name: provisional_versus_binding_variant_selection_is_covered_by_the_quote_instance
        claim_type: variant_selection
        grounds: ["calculations.custom_shop_quote_total"]
        excluded_because:
          difficulty_instance: quote_provisional_vs_binding_diverge_on_three_axes
          rationale: "That §1.8 instance asserts that PROVISIONAL is the variant read at creation / selection / approval / reject and that BINDING is written only at lock-options, including the force-rejection of a PENDING_APPROVAL row out of the binding set."

      - name: deposit_reconciliation_on_the_variant_switch_is_covered_by_the_i2_instance
        claim_type: reconciliation
        grounds: ["calculations.cancellation_deposit_disposition"]
        excluded_because:
          difficulty_instance: i2_deposit_conserved_when_the_forfeit_cap_binds
          rationale: "The provisional -> binding switch is observable exactly where money moves: the confirm threshold is taken against the provisional total while assign-serial applies the deposit against the binding total, and that §1.8 instance reconciles both against the four deposit buckets."

      - name: export_tier_boundary_selection_is_covered_by_the_tier_pin_instance
        claim_type: tiered_pricing
        grounds: ["calculations.export_declared_value"]
        excluded_because:
          difficulty_instance: export_declared_value_tier_pinned_to_goods_not_declared
          rationale: "That §1.8 instance walks the inclusive TIER_1/TIER_2 ceilings and the circular reading it forbids (re-deriving the tier from declared_value_cents), which is the whole content of the tiered_pricing row."

      - name: per_line_rounding_of_the_weighted_quote_is_covered_by_the_nested_rounding_instance
        claim_type: weighted_scoring
        grounds: ["calculations.custom_shop_quote_total"]
        excluded_because:
          difficulty_instance: quote_nested_rounding_round_each_line_then_sum
          rationale: "Rounding-accumulation drift across weighted lines is exactly what that §1.8 instance pins, with the one-cent difference between round-then-sum (389115) and sum-then-round (389116) asserted as literals."

      - name: board_feet_bucket_aggregation_is_covered_by_the_i1_instance
        claim_type: aggregation
        grounds: ["calculations.lot_board_feet_ledger"]
        excluded_because:
          difficulty_instance: i1_board_feet_conserved_when_cancel_recovers_reserved_wood
          rationale: "The running-total-after-add and running-total-after-reversal claims of the aggregation row are both asserted there, including the deliberate contrast between a cancel (wood recovered to unassigned) and a QC scrap (wood destroyed to scrapped)."

  # ===========================================================================
  - section: validations
    instances:

      - name: a_duplicate_lot_code_is_refused_even_for_a_different_species
        claim_type: violation_to_error
        grounds: ["validations.priority_45", "errors[ERR_DUPLICATE_CODE]", "entities.TonewoodLot.lot_code"]
        distinguishing_aspect: "lot_code is globally unique, so LOT-001 cannot be re-used for a HARD_MAPLE lot in the same room: 409 ERR_DUPLICATE_CODE, and the second row must not be persisted (the collection still holds exactly one lot). Uniqueness is checked at priority 45 — after schema (30) and path resolution (40) but before any state or business rule."
        test_recipe:
          setup: "One SITKA_SPRUCE lot with lot_code LOT-001."
          setup_api_calls: *lot_received
          trigger: "POST /tonewood-lots with lot_code LOT-001, species_code HARD_MAPLE, cites_appendix NONE, board_feet_received 55.00, moisture_content_pct 10.0 and storage_room_id ${dry1} as WoodBuyer"
          assert:
            http_status: 409
            error_id: "ERR_DUPLICATE_CODE"
            tonewood_lots_total_count_after: 1
            existing_lot_species_code: "SITKA_SPRUCE"
            note: "The same lot_code IS allowed to collide with a Billet.billet_code or a Station.station_code — uniqueness is per natural key per entity, not across the whole database."

      - name: a_reservation_window_that_does_not_advance_is_refused
        claim_type: violation_to_error
        grounds: ["validations.priority_32", "errors[ERR_INVALID_WINDOW]", "endpoints.POST_/station-reservations"]
        distinguishing_aspect: "starts_at must be STRICTLY before ends_at: a zero-length window (08:00 to 08:00) and an inverted window (09:00 to 08:00) both return 422 ERR_INVALID_WINDOW at priority 32, ahead of the priority-70 station overlap check, so neither is ever reported as ERR_STATION_WINDOW_CONFLICT and no held_minutes are booked on the station."
        test_recipe:
          setup: "One BUILD_ROOM with a CNC router station."
          setup_api_calls: &one_cnc_station
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
          trigger: "POST /station-reservations with station_id ${cnc1}, starts_at 2026-08-02T08:00:00Z and ends_at 2026-08-02T08:00:00Z as Machinist, then POST /station-reservations with station_id ${cnc1}, starts_at 2026-08-02T09:00:00Z and ends_at 2026-08-02T08:00:00Z as Machinist"
          assert:
            zero_length_http_status: 422
            zero_length_error_id: "ERR_INVALID_WINDOW"
            inverted_http_status: 422
            inverted_error_id: "ERR_INVALID_WINDOW"
            station_reservations_total_count_after: 0
            station_held_minutes: 0
            note: "A one-minute window 08:00 to 08:01 is accepted — the bound is strict inequality, not a minimum duration."

      - name: two_individually_legal_cuts_that_collectively_exceed_the_lot_are_refused
        claim_type: aggregate_validation
        grounds: ["validations.priority_80", "errors[ERR_INSUFFICIENT_BOARD_FEET]", "calculations.lot_board_feet_ledger"]
        distinguishing_aspect: "Each cut is individually smaller than board_feet_received, but the SECOND 30.00 bf cut needs 30.90 bf including its own 0.90 kerf against only 29.96 bf remaining, so it is refused with 409 ERR_INSUFFICIENT_BOARD_FEET — the guard compares board_feet PLUS kerf against board_feet_available, not board_feet alone (30.00 < 29.96 is false either way, but a 29.10 cut would pass on the naive reading and fail on the pinned one). A 29.00 bf cut then succeeds and drops the lot to DEPLETED."
        test_recipe:
          setup: "A RELEASED 100.00 bf lot from which one 68.00 bf billet has already been cut, leaving 29.96 bf available."
          setup_api_calls: &lot_after_big_cut
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 68.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "GET /tonewood-lots/${lot1}", payload: {}, as: Machinist, captures: { lot_v2: "$.data.version" } }
          trigger: "POST /billets with billet_code BLT-002, lot_id ${lot1}, board_feet 30.00, grade AAA and expected_tonewood_lot_version ${lot_v2} as Machinist, then POST /billets with billet_code BLT-003, lot_id ${lot1}, board_feet 29.00, grade AA and expected_tonewood_lot_version ${lot_v2} as Machinist"
          assert:
            available_before: 29.96
            oversized_http_status: 409
            oversized_error_id: "ERR_INSUFFICIENT_BOARD_FEET"
            billets_total_count_after_refusal: 1
            available_after_refusal: 29.96
            accepted_http_status: 201
            accepted_kerf_loss_board_feet: 0.87
            available_after_accepted: 0.09
            lot_status_after_accepted: "DEPLETED"
            lot_board_feet_kerf_loss_after: 2.91
            note: "First cut: kerf 2.04, available 100.00 - 68.00 - 2.04 = 29.96. Refused cut needs 30.00 + 0.90 = 30.90 > 29.96. Accepted cut needs 29.00 + 0.87 = 29.87 <= 29.96, leaving 0.09 < MIN_USABLE_BOARD_FEET 2.0 so the lot goes DEPLETED. Kerf total 2.04 + 0.87 = 2.91; I1 reads 0.09 + 97.00 + 0.00 + 0.00 + 0.00 + 2.91 = 100.00. The refused call left version untouched, which is why the same lot_v2 works on the retry."

      - name: a_custom_shop_order_cannot_confirm_without_a_selected_option
        claim_type: conditional_validation
        grounds: ["validations.priority_68", "errors[ERR_OPTIONS_NOT_SELECTED]", "state_machines.BuildOrder.commercial_status.transitions"]
        distinguishing_aspect: "The option requirement is conditional on is_custom_shop: with is_custom_shop true and zero OptionSelection rows, confirm is refused 409 ERR_OPTIONS_NOT_SELECTED even though the deposit 53760 exactly meets the threshold; the identical call on an is_custom_shop false order at the same base price confirms with 200. A default option is never fabricated for the customer."
        test_recipe:
          setup: "Two QUOTED orders at base 480000 / ENDORSER: ORD-CS with is_custom_shop true and ORD-STD with is_custom_shop false. Neither has any option selections."
          setup_api_calls: &two_orders_custom_and_standard
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /build-orders", payload: { order_code: "ORD-CS", model_code: "OM45", base_price_cents: 480000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { boCS: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-STD", model_code: "OM45", base_price_cents: 480000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: false, artist_tier: "ENDORSER", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { boSTD: "$.data.id" } }
          trigger: "POST /build-orders/${boCS}/confirm with deposit_cents 53760 as CustomShopCoordinator, then POST /build-orders/${boSTD}/confirm with deposit_cents 48000 as CustomShopCoordinator"
          assert:
            custom_provisional_quote_total_cents: 537600
            custom_http_status: 409
            custom_error_id: "ERR_OPTIONS_NOT_SELECTED"
            custom_commercial_status_after: "QUOTED"
            custom_deposit_paid_cents: 0
            standard_provisional_quote_total_cents: 480000
            standard_http_status: 200
            standard_commercial_status_after: "CONFIRMED"
            standard_deposit_held_cents: 48000
            note: "Custom: 480000 + surcharge round_half_up(480000 * 1200 / 10000) = 57600 - discount round_half_up(0 * 1000 / 10000) = 0 -> 537600, threshold round_half_up(537600 * 1000 / 10000) = 53760 (met exactly). Standard: no surcharge and no option content to discount -> 480000, threshold 48000 (met exactly)."

      - name: the_option_requirement_outranks_the_deposit_threshold_on_confirm
        claim_type: priority_ordering
        grounds: ["validations.priority_68", "validations.priority_85", "errors[ERR_DEPOSIT_INSUFFICIENT]"]
        distinguishing_aspect: "One call violates BOTH rules — a custom-shop order with no SELECTED option AND a deposit of 1 cent against a 53760 threshold — and the response must be the priority-68 ERR_OPTIONS_NOT_SELECTED (409), never the priority-85 ERR_DEPOSIT_INSUFFICIENT (402). The status code is the observable tell: 409 versus 402."
        test_recipe:
          setup: "The same two orders at base 480000; only ORD-CS is used here."
          setup_api_calls: *two_orders_custom_and_standard
          trigger: "POST /build-orders/${boCS}/confirm with deposit_cents 1 as CustomShopCoordinator"
          assert:
            http_status: 409
            error_id: "ERR_OPTIONS_NOT_SELECTED"
            commercial_status_after: "QUOTED"
            deposit_paid_cents: 0
            deposit_held_cents: 0
            note: "Reversing the priorities would return 402 ERR_DEPOSIT_INSUFFICIENT. With one SELECTED option present and the deposit still at 1 cent, the same call correctly returns 402 instead."

      - name: a_schema_violation_outranks_the_state_check_on_the_same_call
        claim_type: priority_conflict
        grounds: ["validations.priority_30", "validations.priority_50", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A reject call against an already-REJECTED lot with the REQUIRED reason field omitted violates priority 30 and priority 50 at once; the response is 422 ERR_INVALID_REQUEST, not 409 ERR_LOT_STATE_INVALID. Supplying the reason on the identical call then surfaces the state error — the two errors are distinguishable only if the ordering is respected."
        test_recipe:
          setup: "One SITKA_SPRUCE lot already rejected."
          setup_api_calls: &lot_rejected
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/reject", payload: { reason: "grain runout" }, as: ComplianceOfficer }
          trigger: "POST /tonewood-lots/${lot1}/reject with an empty body (no reason) as ComplianceOfficer, then POST /tonewood-lots/${lot1}/reject with reason \"second look\" as ComplianceOfficer"
          assert:
            missing_reason_http_status: 422
            missing_reason_error_id: "ERR_INVALID_REQUEST"
            with_reason_http_status: 409
            with_reason_error_id: "ERR_LOT_STATE_INVALID"
            status_throughout: "REJECTED"
            note: "Both calls are refused, but for different declared reasons, and neither mutates the row. A non-existent lot_id in the path would return 404 at priority 40 — between the two."

      - name: an_option_excluded_by_an_already_selected_option_is_refused
        claim_type: cross_entity_validation
        grounds: ["validations.priority_65", "errors[ERR_OPTION_INCOMPATIBLE]", "entities.OptionCatalog.incompatible_option_codes"]
        distinguishing_aspect: "Validity depends on a DIFFERENT entity's state: INL-DOT is refused 409 ERR_OPTION_INCOMPATIBLE only because a live INL-VINE selection lists INL-DOT in its incompatible_option_codes. Rejecting the INL-VINE selection first makes the identical INL-DOT call succeed, proving the check reads the current selection set and not the catalog alone."
        test_recipe:
          setup: "Catalog with INL-VINE (incompatible with INL-DOT) and INL-DOT; one QUOTED custom order carrying an INL-VINE selection."
          setup_api_calls: &order_with_vine
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optV: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "INL-DOT", option_group: "INLAY", upcharge_cents: 12004, complexity_class: "ARTISAN", lead_time_days: 10 }, as: PlantAdmin, captures: { optD: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-CS", model_code: "OM45", base_price_cents: 480000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { boCS: "$.data.id", boCS_v1: "$.data.version" } }
            - { call: "POST /build-orders/${boCS}/option-selections", payload: { option_id: "${optV}", quantity: 1, expected_build_order_version: "${boCS_v1}" }, as: CustomShopCoordinator, captures: { selV: "$.data.id" } }
            - { call: "GET /build-orders/${boCS}", payload: {}, as: CustomShopCoordinator, captures: { boCS_v2: "$.data.version" } }
          trigger: "POST /build-orders/${boCS}/option-selections with option_id ${optD}, quantity 1 and expected_build_order_version ${boCS_v2} as CustomShopCoordinator, then POST /option-selections/${selV}/reject with reason \"customer changed mind\" as CustomShopCoordinator, then POST /build-orders/${boCS}/option-selections with option_id ${optD}, quantity 1 and the order's then-current version as CustomShopCoordinator"
          assert:
            first_attempt_http_status: 409
            first_attempt_error_id: "ERR_OPTION_INCOMPATIBLE"
            option_selections_total_count_after_refusal: 1
            reject_http_status: 200
            second_attempt_http_status: 201
            second_attempt_status: "PENDING_APPROVAL"
            second_attempt_line_total_cents: 16205
            note: "The incompatibility is declared in one direction only (INL-VINE excludes INL-DOT); the check must treat the pair symmetrically for whichever option is already on the order. round_half_up(12004 * 13500 / 10000) = 16205."

      - name: an_option_requiring_nitro_is_refused_on_a_polyurethane_order
        claim_type: cross_entity_validation
        grounds: ["validations.priority_65", "errors[ERR_OPTION_FINISH_MISMATCH]", "entities.OptionCatalog.requires_finish_system"]
        distinguishing_aspect: "requires_finish_system NITRO on the option versus finish_system POLY on the order is a 422 ERR_OPTION_FINISH_MISMATCH, while an option left at the default requires_finish_system ANY attaches to the same POLY order with 201 — the check compares two entities' declared finish systems and treats ANY as a wildcard rather than as a third distinct system."
        test_recipe:
          setup: "Catalog with SB-NITRO (requires NITRO) and HW-GOLD (ANY); one QUOTED custom order with finish_system POLY."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "SB-NITRO", option_group: "FINISH", upcharge_cents: 60000, complexity_class: "MASTER", lead_time_days: 20, requires_finish_system: "NITRO" }, as: PlantAdmin, captures: { optN: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "HW-GOLD", option_group: "HARDWARE", upcharge_cents: 22004, complexity_class: "ARTISAN", lead_time_days: 14 }, as: PlantAdmin, captures: { optG: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-POLY", model_code: "D28", base_price_cents: 300000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: true, artist_tier: "NONE", finish_system: "POLY" }, as: CustomShopCoordinator, captures: { boP: "$.data.id", boP_v1: "$.data.version" } }
          trigger: "POST /build-orders/${boP}/option-selections with option_id ${optN}, quantity 1 and expected_build_order_version ${boP_v1} as CustomShopCoordinator, then POST /build-orders/${boP}/option-selections with option_id ${optG}, quantity 1 and expected_build_order_version ${boP_v1} as CustomShopCoordinator"
          assert:
            mismatch_http_status: 422
            mismatch_error_id: "ERR_OPTION_FINISH_MISMATCH"
            option_selections_total_count_after_refusal: 0
            wildcard_http_status: 201
            wildcard_status: "PENDING_APPROVAL"
            wildcard_line_total_cents: 29705
            order_provisional_quote_total_cents_after: 369270
            note: "The refused call did not bump the order's version, which is why the same boP_v1 is still current for the second call. Provisional after the ANY option: round_half_up(22004 * 13500 / 10000) = 29705 line total, 300000 + 29705 = 329705, custom-shop surcharge round_half_up(329705 * 1200 / 10000) = 39565, artist discount 0 because artist_tier is NONE, total 369270."

      - name: a_request_without_a_user_id_header_is_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations.priority_10", "errors[ERR_UNAUTHENTICATED]", "roles"]
        distinguishing_aspect: "Priority 10 requires BOTH headers: a request carrying X-User-Role PlantAdmin but no X-User-ID is 401 ERR_UNAUTHENTICATED, and so is a request with a valid X-User-ID but an X-User-Role that is not one of the ten declared roles — neither is a 403 ERR_ROLE_NOT_PERMITTED, because identity is resolved before permission."
        test_recipe:
          setup: "Empty database."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger: "POST /storage-rooms with room_code DRY-1, room_type DRY_STORE, target_rh_pct 45.0, target_temp_c 21.0 and capacity_slots 20 sent with header X-User-Role PlantAdmin and NO X-User-ID header, then the same request with X-User-ID pa-bob and X-User-Role FactoryManager (a role that is not declared in §1.7)"
          assert:
            missing_user_id_http_status: 401
            missing_user_id_error_id: "ERR_UNAUTHENTICATED"
            unknown_role_http_status: 401
            unknown_role_error_id: "ERR_UNAUTHENTICATED"
            storage_rooms_total_count_after: 0
            note: "A WELL-FORMED identity whose role is simply not on this endpoint's roles list is the different, 403 ERR_ROLE_NOT_PERMITTED case — see the rbac section."

      - name: a_lot_may_be_received_into_an_out_of_spec_room_but_not_a_quarantined_one
        claim_type: satisfaction_to_pass
        grounds: ["state_machines.TonewoodLot.transitions", "errors[ERR_ROOM_QUARANTINED]", "state_machines.StorageRoom.transitions"]
        distinguishing_aspect: "The creation guard names QUARANTINED specifically, not \"any room that is not IN_SPEC\": receiving a lot into an OUT_OF_SPEC DRY_STORE succeeds with 201, while the identical call once the room reaches QUARANTINED is refused 409 ERR_ROOM_QUARANTINED. An implementation that reuses the priority-60 IN_SPEC posture check here wrongly rejects the first call."
        test_recipe:
          setup: "DRY-1 driven OUT_OF_SPEC by a single 60.0% reading at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms/${dry1}/climate-readings", payload: { rh_pct: 60.0, temp_c: 21.0 }, as: FinishTech }
          trigger: "POST /tonewood-lots with lot_code LOT-001, species_code SITKA_SPRUCE, cites_appendix NONE, board_feet_received 100.00, moisture_content_pct 7.0 and storage_room_id ${dry1} as WoodBuyer, then POST /_clock/set_current_utc to 2026-08-02T00:00:00Z, then POST /storage-rooms/${dry1}/climate-readings with rh_pct 60.0 and temp_c 21.0 as FinishTech, then POST /tonewood-lots with lot_code LOT-002 and otherwise identical fields as WoodBuyer"
          assert:
            out_of_spec_creation_http_status: 201
            out_of_spec_creation_status: "RECEIVED"
            room_climate_status_after_second_reading: "QUARANTINED"
            quarantined_creation_http_status: 409
            quarantined_creation_error_id: "ERR_ROOM_QUARANTINED"
            tonewood_lots_total_count_after: 1
            note: "Conditioning LOT-001 would fail in BOTH windows — that guard does require IN_SPEC — so receipt and conditioning enforce deliberately different climate predicates."

      - name: an_authorized_shop_cannot_register_a_warranty_for_a_different_shop
        claim_type: violation_to_error
        grounds: ["validations.priority_25", "errors[ERR_SHOP_IDENTITY_MISMATCH]", "roles"]
        distinguishing_aspect: "The AuthorizedShop role is entity_backed: its X-User-ID must equal the RepairShop.id named by registering_shop_id. Shop B presenting its own id while registering for shop A is 403 ERR_SHOP_IDENTITY_MISMATCH at priority 25 — before schema validation and before the priority-68 authorization-state check — so a suspended shop A still yields the identity error, not ERR_SHOP_NOT_AUTHORIZED."
        test_recipe:
          setup: "Two AUTHORIZED repair shops, SHP-A and SHP-B."
          setup_api_calls: &two_authorized_shops
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-A", shop_name: "Kanto Fret Works", country_code: "JP" }, as: ServiceNetworkManager, captures: { shopA: "$.data.id" } }
            - { call: "POST /repair-shops/${shopA}/authorize", payload: { authorization_level: "FULL_SERVICE" }, as: ServiceNetworkManager }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-B", shop_name: "Bay Guitar Service", country_code: "US" }, as: ServiceNetworkManager, captures: { shopB: "$.data.id" } }
            - { call: "POST /repair-shops/${shopB}/authorize", payload: { authorization_level: "WARRANTY_ONLY" }, as: ServiceNetworkManager }
          trigger: "POST /warranty-registrations with build_order_id 00000000-0000-4000-8000-000000000000, registering_shop_id ${shopA}, serial_number OM45-2026-00001, owner_email owner@example.com and purchase_date 2026-08-16T00:00:00Z as AuthorizedShop with X-User-ID ${shopB}"
          assert:
            http_status: 403
            error_id: "ERR_SHOP_IDENTITY_MISMATCH"
            warranty_registrations_total_count_after: 0
            note: "The build_order_id in this request is deliberately non-existent: even the priority-42 FK resolution never runs, so the response cannot be 404 ERR_BUILD_ORDER_NOT_FOUND. The same call with X-User-ID ${shopA} would proceed to that 404."

      - name: build_stage_versus_booth_climate_ordering_is_covered_by_the_p1_instance
        claim_type: priority_conflict
        grounds: ["validations.priority_50", "validations.priority_60"]
        excluded_because:
          difficulty_instance: p1_build_stage_state_check_outranks_booth_climate_posture
          rationale: "That §1.8 instance constructs a single call violating both the priority-50 build_stage check and the priority-60 booth climate posture and asserts the priority-50 error, which is the whole content of this row."

      - name: cites_versus_deposit_ordering_is_covered_by_the_p2_instance
        claim_type: priority_ordering
        grounds: ["validations.priority_61", "validations.priority_85"]
        excluded_because:
          difficulty_instance: p2_cites_compliance_outranks_deposit_settlement
          rationale: "The compliance-before-money ordering on export release is asserted there with both violations live in one call."

      - name: booth_finish_versus_capacity_ordering_is_covered_by_the_p3_instance
        claim_type: priority_ordering
        grounds: ["validations.priority_72", "validations.priority_75"]
        excluded_because:
          difficulty_instance: p3_booth_finish_incompatibility_outranks_aggregate_capacity
          rationale: "That instance pins ERR_BOOTH_FINISH_INCOMPATIBLE over ERR_BOOTH_CAPACITY_EXCEEDED when a booth is both chemically incompatible and full."

      - name: protected_species_versus_grade_ordering_is_covered_by_the_p4_instance
        claim_type: cross_entity_validation
        grounds: ["validations.priority_61", "validations.priority_65"]
        excluded_because:
          difficulty_instance: p4_protected_species_safety_outranks_grade_compatibility
          rationale: "Both the cross-entity species/grade compatibility pair and its ordering against the compliance guard are asserted there."

      - name: moisture_band_upper_boundary_is_covered_by_the_inclusive_bound_instance
        claim_type: satisfaction_to_pass
        grounds: ["validations.priority_78"]
        excluded_because:
          difficulty_instance: moisture_band_upper_bound_is_inclusive
          rationale: "8.0 passing and 8.1 failing on the same endpoint is exactly that §1.8 boundary instance; the corner here would only restate it."

      - name: booth_hold_capacity_aggregate_is_covered_by_the_occupancy_instance
        claim_type: aggregate_validation
        grounds: ["validations.priority_75"]
        excluded_because:
          difficulty_instance: booth_closed_hold_capacity_counts_only_currently_occupying_non_terminal_runs
          rationale: "That instance asserts the aggregate count of overlapping non-terminal booth holds against capacity_slots, including which runs drop out of the count when they reach a terminal state."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: the_station_selector_ranks_by_priority_score_and_reports_the_pool_size
        claim_type: computed_read
        grounds: ["endpoints.GET_/stations/{station_id}/next-build-order", "calculations.build_priority_score", "entities.StationReservation.status"]
        distinguishing_aspect: "The selector returns the HIGHEST-scoring eligible order, not the earliest booking: BO-1 at 69.50 wins over BO-2 at 35.50 even though nothing about BO-2 is later in the queue, and eligible_count 2 reports the whole eligible pool rather than 1 (the returned row) or the station's total reservation count."
        test_recipe:
          setup: "CNC-1 with two CONFIRMED orders each holding one HELD reservation on it: BO-1 (SIGNATURE, custom shop, promised 2026-10-01) and BO-2 (NONE, standard, promised 2026-08-20)."
          setup_api_calls: &two_confirmed_orders_on_cnc1
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "INL-DOT", option_group: "INLAY", upcharge_cents: 12004, complexity_class: "ARTISAN", lead_time_days: 10 }, as: PlantAdmin, captures: { optD: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "BO-1", model_code: "OM45", base_price_cents: 300000, promised_date: "2026-10-01T00:00:00Z", is_custom_shop: true, artist_tier: "SIGNATURE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { bo1: "$.data.id", bo1_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optD}", quantity: 1, expected_build_order_version: "${bo1_v1}" }, as: CustomShopCoordinator, as_user_id: "cs-gwen", captures: { selD: "$.data.id" } }
            - { call: "POST /option-selections/${selD}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "cs-hana" }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 35010 }, as: CustomShopCoordinator }
            - { call: "POST /build-orders", payload: { order_code: "BO-2", model_code: "D28", base_price_cents: 300000, promised_date: "2026-08-20T00:00:00Z", is_custom_shop: false, artist_tier: "NONE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { bo2: "$.data.id" } }
            - { call: "POST /build-orders/${bo2}/confirm", payload: { deposit_cents: 30000 }, as: CustomShopCoordinator }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", build_order_id: "${bo1}", starts_at: "2026-08-03T08:00:00Z", ends_at: "2026-08-03T09:00:00Z" }, as: Machinist, captures: { resA: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", build_order_id: "${bo2}", starts_at: "2026-08-04T08:00:00Z", ends_at: "2026-08-04T09:00:00Z" }, as: Machinist, captures: { resB: "$.data.id" } }
          trigger: "GET /stations/${cnc1}/next-build-order as Machinist"
          assert:
            http_status: 200
            build_order_id: "${bo1}"
            order_code: "BO-1"
            priority_score: 69.50
            starts_at: "2026-08-03T08:00:00Z"
            eligible_count: 2
            note: "BO-1 = 40 (SIGNATURE) + 15 (custom shop) + 0 (CONFIRMED is not AT_RISK) + max(0, 90 - 61) * 0.5 = 69.50; BO-2 = 0 + 0 + 0 + max(0, 90 - 19) * 0.5 = 35.50. BO-1's confirm threshold was round_half_up(350099 * 1000 / 10000) = 35010 against a provisional of 300000 + 16205 + round_half_up(316205 * 1200 / 10000) 37945 - round_half_up(16205 * 2500 / 10000) 4051 = 350099."

      - name: releasing_the_reservations_shrinks_the_pool_and_then_empties_it
        claim_type: computed_read
        grounds: ["endpoints.GET_/stations/{station_id}/next-build-order", "state_machines.StationReservation.transitions", "errors[ERR_NO_ELIGIBLE_BUILD_ORDER]"]
        distinguishing_aspect: "Eligibility is driven by the reservation's CURRENT status, not by its existence: releasing BO-1's hold drops it out of the pool so the selector returns BO-2 at 35.50 with eligible_count 1, and releasing BO-2's hold too makes the endpoint return 409 ERR_NO_ELIGIBLE_BUILD_ORDER rather than 200 with a null data payload or an empty array."
        test_recipe:
          setup: "The same CNC-1 pool with BO-1 and BO-2 both holding reservations."
          setup_api_calls: *two_confirmed_orders_on_cnc1
          trigger: "POST /station-reservations/${resA}/release as Machinist, then GET /stations/${cnc1}/next-build-order as Machinist, then POST /station-reservations/${resB}/release as Machinist, then GET /stations/${cnc1}/next-build-order as Machinist"
          assert:
            after_first_release_http_status: 200
            after_first_release_build_order_id: "${bo2}"
            after_first_release_order_code: "BO-2"
            after_first_release_priority_score: 35.50
            after_first_release_eligible_count: 1
            after_second_release_http_status: 409
            after_second_release_error_id: "ERR_NO_ELIGIBLE_BUILD_ORDER"
            reservation_statuses_after: "RELEASED"
            note: "Both orders remain CONFIRMED throughout — only the reservation dimension changed, which is what proves the eligibility filter reads StationReservation.status and not BuildOrder.commercial_status alone."

      - name: advancing_the_clock_rescores_the_selector_without_writing_the_order
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/_clock/set_current_utc", "calculations.build_priority_score", "entities.StationReservation.priority_score"]
        distinguishing_aspect: "The clock endpoint is the only time source: moving it to 2026-08-11 raises BO-1's selector score from 69.50 to 74.50 because days_out fell from 61 to 51, yet the clock call is NOT a recompute trigger for the stored column — the reservation's booking-time snapshot stays 69.50, since StationReservation.priority_score is explicitly not re-synced."
        test_recipe:
          setup: "The same CNC-1 pool, scored at 2026-08-01."
          setup_api_calls: *two_confirmed_orders_on_cnc1
          trigger: "POST /_clock/set_current_utc with current_utc 2026-08-11T00:00:00Z as PlantAdmin, then GET /stations/${cnc1}/next-build-order as Machinist, then GET /station-reservations/${resA} as Machinist"
          assert:
            clock_http_status: 200
            clock_current_utc: "2026-08-11T00:00:00Z"
            selector_build_order_id: "${bo1}"
            selector_priority_score: 74.50
            selector_eligible_count: 2
            reservation_priority_score_snapshot: 69.50
            note: "BO-1 at the new clock: 40 + 15 + 0 + max(0, 90 - 51) * 0.5 = 74.50. BO-2 rises in lockstep to 40.50, so the ranking does not change — every score shifts by the same 0.5 per day while both promised dates are still in the future."

      - name: the_docs_rejected_cycle_reopens_release_and_exposes_the_next_guard
        claim_type: conditional_action
        grounds: ["state_machines.ExportShipment.transitions", "errors[ERR_SHIPMENT_STATE_INVALID]", "errors[ERR_BUILD_STAGE_INVALID]"]
        distinguishing_aspect: "release is conditional on the shipment's own status AND on the order's build_stage, and the two conditions surface different errors in a fixed order: from DOCS_REJECTED the call is 409 ERR_SHIPMENT_STATE_INVALID, and after re-attaching docs the very same call becomes 409 ERR_BUILD_STAGE_INVALID because the order is still DRAFT. A permit number supplied on the second attach must overwrite the first value rather than being refused as a duplicate."
        test_recipe:
          setup: "An OPTIONS_LOCKED, never-assembled order with a DOCS_PENDING export shipment to JP; no CITES-listed wood contributes, so cites_permit_required is false."
          setup_api_calls: &shipment_docs_pending
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-DOT", option_group: "INLAY", upcharge_cents: 12004, complexity_class: "ARTISAN", lead_time_days: 10 }, as: PlantAdmin, captures: { optD: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-EX", model_code: "D28", base_price_cents: 300000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: false, artist_tier: "NONE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { boX: "$.data.id", boX_v1: "$.data.version" } }
            - { call: "POST /build-orders/${boX}/option-selections", payload: { option_id: "${optD}", quantity: 1, expected_build_order_version: "${boX_v1}" }, as: CustomShopCoordinator, as_user_id: "cs-gwen", captures: { selX: "$.data.id" } }
            - { call: "POST /option-selections/${selX}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "cs-hana" }
            - { call: "POST /build-orders/${boX}/confirm", payload: { deposit_cents: 31621 }, as: CustomShopCoordinator }
            - { call: "POST /build-orders/${boX}/lock-options", payload: {}, as: CustomShopCoordinator }
            - { call: "POST /export-shipments", payload: { build_order_id: "${boX}", destination_country_code: "JP" }, as: ComplianceOfficer, captures: { shp1: "$.data.id" } }
          trigger: "POST /export-shipments/${shp1}/attach-docs with an empty body as ComplianceOfficer, then POST /export-shipments/${shp1}/reject-docs with reason \"origin query from the issuing authority\" as ComplianceOfficer, then POST /export-shipments/${shp1}/release as ComplianceOfficer, then POST /export-shipments/${shp1}/attach-docs with cites_permit_number JP-RE-2026-0001 as ComplianceOfficer, then POST /export-shipments/${shp1}/release as ComplianceOfficer"
          assert:
            cites_permit_required: false
            first_attach_http_status: 200
            first_attach_status: "DOCS_ATTACHED"
            first_attach_cites_permit_number: null
            reject_http_status: 200
            reject_status: "DOCS_REJECTED"
            release_from_rejected_http_status: 409
            release_from_rejected_error_id: "ERR_SHIPMENT_STATE_INVALID"
            second_attach_http_status: 200
            second_attach_status: "DOCS_ATTACHED"
            second_attach_cites_permit_number: "JP-RE-2026-0001"
            release_from_reattached_http_status: 409
            release_from_reattached_error_id: "ERR_BUILD_STAGE_INVALID"
            status_after_everything: "DOCS_ATTACHED"
            note: "The first attach is legal with no permit number precisely because the contributing-lot set is empty — the empty-collection boundary on calculations.protected_species_requirement. binding_quote_total_cents is 316205 (line 16205 with no surcharge and no discount) and the confirm threshold was round_half_up(316205 * 1000 / 10000) = 31621."

      - name: a_warranty_registration_needs_both_the_order_and_the_shop_to_resolve
        claim_type: cross_reference_link
        grounds: ["endpoints.POST_/warranty-registrations", "errors[ERR_BUILD_ORDER_NOT_FOUND]", "errors[ERR_REPAIR_SHOP_NOT_FOUND]"]
        distinguishing_aspect: "Both foreign keys are resolved before any business rule: an unknown build_order_id yields 404 ERR_BUILD_ORDER_NOT_FOUND and an unknown registering_shop_id yields 404 ERR_REPAIR_SHOP_NOT_FOUND — two distinct error ids from the same endpoint — and neither call is allowed to collapse into a generic 422 or into the priority-68 ERR_SHOP_NOT_AUTHORIZED."
        test_recipe:
          setup: "Two AUTHORIZED repair shops and no build orders at all."
          setup_api_calls: *two_authorized_shops
          trigger: "POST /warranty-registrations with build_order_id 00000000-0000-4000-8000-000000000000, registering_shop_id ${shopA}, serial_number OM45-2026-00001, owner_email owner@example.com and purchase_date 2026-08-16T00:00:00Z as ServiceNetworkManager, then the same call with registering_shop_id 11111111-1111-4111-8111-111111111111 and a build_order_id that is likewise unknown"
          assert:
            unknown_order_http_status: 404
            unknown_order_error_id: "ERR_BUILD_ORDER_NOT_FOUND"
            unknown_shop_http_status: 404
            unknown_shop_error_id: "ERR_REPAIR_SHOP_NOT_FOUND"
            warranty_registrations_total_count_after: 0
            shop_a_warranty_claim_count: 0
            note: "When BOTH ids are unknown the build_order_id is reported first, matching the field order the endpoint declares; the counter on the real shop must not move for a refused registration."

      - name: repair_shop_listing_filters_then_paginates
        claim_type: standard_crud
        grounds: ["endpoints.GET_/repair-shops", "entities.RepairShop.country_code", "response_envelope.pagination_fields"]
        distinguishing_aspect: "total_count reports the size of the FILTERED set (2 JP shops out of 3 rows), not the whole table, and has_more is computed against that filtered total: limit 1 / offset 0 gives has_more true while limit 1 / offset 1 gives has_more false. The US shop never appears under country_code=JP at any offset."
        test_recipe:
          setup: "Three shops: SHP-JP1 (JP), SHP-US1 (US), SHP-JP2 (JP)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-JP1", shop_name: "Kanto Fret Works", country_code: "JP" }, as: ServiceNetworkManager, captures: { jp1: "$.data.id" } }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-US1", shop_name: "Bay Guitar Service", country_code: "US" }, as: ServiceNetworkManager, captures: { us1: "$.data.id" } }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-JP2", shop_name: "Kansai Lutherie", country_code: "JP" }, as: ServiceNetworkManager, captures: { jp2: "$.data.id" } }
          trigger: "GET /repair-shops with country_code JP as ServiceNetworkManager, then GET /repair-shops with country_code JP, limit 1 and offset 0, then GET /repair-shops with country_code JP, limit 1 and offset 1, then GET /repair-shops with country_code JP, limit 1 and offset 5"
          assert:
            unfiltered_default_limit: 10
            filtered_total_count: 2
            filtered_returned_rows: 2
            filtered_has_more: false
            page_one_returned_rows: 1
            page_one_total_count: 2
            page_one_has_more: true
            page_two_returned_rows: 1
            page_two_total_count: 2
            page_two_has_more: false
            past_end_returned_rows: 0
            past_end_total_count: 2
            past_end_has_more: false
            response_type: "array"
            note: "An offset past the end is a 200 with an empty data array and the unchanged total_count of 2 — not a 404. Every JP page contains only JP rows; the two pages together cover both JP shops with no repeats."

      - name: the_assign_serial_action_gate_is_covered_by_the_inspection_signature_instance
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/build-orders/{build_order_id}/assign-serial", "validations.priority_68"]
        excluded_because:
          difficulty_instance: assign_serial_requires_the_latest_inspection_signed_and_passing
          rationale: "That §1.8 instance already drives assign-serial with a superseded PASS round and a newer unsigned round, which is the strongest available probe of this action endpoint's preconditions."

      - name: the_start_assembly_conditional_gate_is_covered_by_the_in_flight_instance
        claim_type: conditional_action
        grounds: ["endpoints.POST_/build-orders/{build_order_id}/start-assembly", "validations.priority_68"]
        excluded_because:
          difficulty_instance: start_assembly_requires_every_component_out_of_flight
          rationale: "The conditional admission of start-assembly — at least MIN_ACCEPTED_COMPONENTS accepted and zero components still in flight — is asserted there with both halves of the condition varied."

  # ===========================================================================
  - section: errors
    instances:

      - name: every_entity_family_reports_its_own_not_found_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_STORAGE_ROOM_NOT_FOUND]", "errors[ERR_BILLET_NOT_FOUND]", "errors[ERR_EXPORT_SHIPMENT_NOT_FOUND]", "validations.priority_40"]
        distinguishing_aspect: "Fifteen path-parameter families each carry a DISTINCT 404 code — a single generic ERR_NOT_FOUND fails this instance — and the code is chosen by the entity family of the path, not by whether the UUID exists somewhere else: GET /billets/{a station's id} is 404 ERR_BILLET_NOT_FOUND rather than 200."
        test_recipe:
          setup: "A routed BODY_TOP component with its lot, billet, rooms, stations and spec in place, so that real ids of other families are available."
          setup_api_calls: *comp_routed
          trigger: "GET each of /storage-rooms/{id}, /tonewood-lots/{id}, /billets/{id}, /component-specs/{id}, /components/{id}, /stations/{id}, /station-reservations/{id}, /option-catalog/{id}, /build-orders/{id}, /option-selections/{id}, /finish-runs/{id}, /setup-inspections/{id}, /repair-shops/{id}, /warranty-registrations/{id} and /export-shipments/{id} with the id 00000000-0000-4000-8000-000000000000 as PlantAdmin, then GET /billets/${cnc1} as PlantAdmin"
          assert:
            storage_room: { http_status: 404, error_id: "ERR_STORAGE_ROOM_NOT_FOUND" }
            tonewood_lot: { http_status: 404, error_id: "ERR_TONEWOOD_LOT_NOT_FOUND" }
            billet: { http_status: 404, error_id: "ERR_BILLET_NOT_FOUND" }
            component_spec: { http_status: 404, error_id: "ERR_COMPONENT_SPEC_NOT_FOUND" }
            component: { http_status: 404, error_id: "ERR_COMPONENT_NOT_FOUND" }
            station: { http_status: 404, error_id: "ERR_STATION_NOT_FOUND" }
            station_reservation: { http_status: 404, error_id: "ERR_STATION_RESERVATION_NOT_FOUND" }
            option_catalog: { http_status: 404, error_id: "ERR_OPTION_CATALOG_NOT_FOUND" }
            build_order: { http_status: 404, error_id: "ERR_BUILD_ORDER_NOT_FOUND" }
            option_selection: { http_status: 404, error_id: "ERR_OPTION_SELECTION_NOT_FOUND" }
            finish_run: { http_status: 404, error_id: "ERR_FINISH_RUN_NOT_FOUND" }
            setup_inspection: { http_status: 404, error_id: "ERR_SETUP_INSPECTION_NOT_FOUND" }
            repair_shop: { http_status: 404, error_id: "ERR_REPAIR_SHOP_NOT_FOUND" }
            warranty_registration: { http_status: 404, error_id: "ERR_WARRANTY_REGISTRATION_NOT_FOUND" }
            export_shipment: { http_status: 404, error_id: "ERR_EXPORT_SHIPMENT_NOT_FOUND" }
            station_id_on_the_billet_path: { http_status: 404, error_id: "ERR_BILLET_NOT_FOUND" }
            note: "Body fields resolve to the same codes as their path counterparts: a POST /billets with an unknown lot_id is ERR_TONEWOOD_LOT_NOT_FOUND, and a POST /components with an unknown spec_id is ERR_COMPONENT_SPEC_NOT_FOUND."

      - name: the_thickness_band_is_policed_only_by_the_qc_accept_verdict
        claim_type: error_triggerable
        grounds: ["errors[ERR_THICKNESS_OUT_OF_TOLERANCE]", "state_machines.Component.transitions", "entities.ComponentSpec.thickness_tolerance_mm"]
        distinguishing_aspect: "hand-shape STORES an out-of-tolerance thickness without complaint — 3.05 mm against a 2.90 +/- 0.10 spec is accepted as a measurement — and only qc with verdict ACCEPT refuses it, 409 ERR_THICKNESS_OUT_OF_TOLERANCE. The same qc call with verdict HOLD succeeds and parks the part at QC_HELD, so the tolerance guard belongs to one verdict and not to the endpoint."
        test_recipe:
          setup: "A CNC_ROUTED BODY_TOP against spec TOP-OM (target 2.90, tolerance 0.10) with HS-1 available."
          setup_api_calls: *comp_routed
          trigger: "POST /station-reservations with station_id ${hs1}, component_id ${cmp1}, starts_at 2026-08-03T14:00:00Z and ends_at 2026-08-03T15:00:00Z as Luthier, then POST /components/${cmp1}/hand-shape with that station_reservation_id and measured_thickness_mm 3.05 as Luthier, then POST /components/${cmp1}/qc with verdict ACCEPT as QualityInspector, then POST /components/${cmp1}/qc with verdict HOLD as QualityInspector"
          assert:
            hand_shape_http_status: 200
            status_after_hand_shape: "HAND_SHAPED"
            measured_thickness_mm_after_hand_shape: 3.05
            accept_http_status: 409
            accept_error_id: "ERR_THICKNESS_OUT_OF_TOLERANCE"
            status_after_refused_accept: "HAND_SHAPED"
            hold_http_status: 200
            status_after_hold: "QC_HELD"
            qc_hold_reason_after_hold: "DIMENSION"
            note: "abs(3.05 - 2.90) = 0.15 > 0.10. At exactly 3.00 the deviation is 0.10 and the bound is INCLUSIVE, so ACCEPT succeeds; 3.01 is the first refused value. hold_reason defaults to DIMENSION when omitted."

      - name: the_component_advance_verbs_police_status_station_type_and_reservation_ownership
        claim_type: error_triggerable
        grounds: ["errors[ERR_COMPONENT_STATE_INVALID]", "errors[ERR_STATION_TYPE_MISMATCH]", "errors[ERR_RESERVATION_COMPONENT_MISMATCH]"]
        distinguishing_aspect: "Three different refusals come out of the same two verbs and must not be collapsed: routing an already-CNC_ROUTED part is 409 ERR_COMPONENT_STATE_INVALID, hand-shaping against a CNC_ROUTER reservation is 422 ERR_STATION_TYPE_MISMATCH, and hand-shaping against a whole-instrument reservation whose component_id is null is 422 ERR_RESERVATION_COMPONENT_MISMATCH. None of the three consumes the cited reservation, so it stays HELD and the station's minute buckets do not move."
        test_recipe:
          setup: "A CNC_ROUTED BODY_TOP with CNC-1 and HS-1 both free."
          setup_api_calls: *comp_routed
          trigger: "POST /station-reservations on ${cnc1} for component ${cmp1} 2026-08-03T08:00:00Z..09:00:00Z as Machinist then POST /components/${cmp1}/route citing it with measured_thickness_mm 2.90, then POST /station-reservations on ${cnc1} for component ${cmp1} 2026-08-03T11:00:00Z..12:00:00Z as Machinist then POST /components/${cmp1}/hand-shape citing it with measured_thickness_mm 2.90 as Luthier, then POST /station-reservations on ${hs1} with NO component_id 2026-08-03T14:00:00Z..15:00:00Z as Luthier then POST /components/${cmp1}/hand-shape citing it with measured_thickness_mm 2.90 as Luthier"
          assert:
            re_route_http_status: 409
            re_route_error_id: "ERR_COMPONENT_STATE_INVALID"
            wrong_station_type_http_status: 422
            wrong_station_type_error_id: "ERR_STATION_TYPE_MISMATCH"
            unowned_reservation_http_status: 422
            unowned_reservation_error_id: "ERR_RESERVATION_COMPONENT_MISMATCH"
            component_status_after: "CNC_ROUTED"
            component_measured_thickness_mm_after: 2.90
            cnc1_held_minutes_after: 120
            cnc1_consumed_minutes_after: 60
            hs1_held_minutes_after: 60
            hs1_consumed_minutes_after: 0
            note: "CNC-1 already consumed 60 minutes for the original successful route in the setup; the two new one-hour holds add 120 held minutes that stay held because every advance was refused. All three windows are more than the 30-minute changeover apart, so none of them collides."

      - name: component_creation_policies_both_the_billet_status_and_the_spec_species_list
        claim_type: error_triggerable
        grounds: ["errors[ERR_BILLET_STATE_INVALID]", "errors[ERR_SPECIES_NOT_PERMITTED]", "entities.ComponentSpec.required_species_codes"]
        distinguishing_aspect: "POST /components refuses for two independent reasons with two different status codes: a billet that is already RESERVED is 409 ERR_BILLET_STATE_INVALID (priority 50) while an AVAILABLE billet whose lot species is not in required_species_codes is 422 ERR_SPECIES_NOT_PERMITTED (priority 65). Because 50 runs first, a RESERVED hard-maple billet reports the state error, not the species error."
        test_recipe:
          setup: "A SITKA_SPRUCE billet BLT-001 already RESERVED by the setup's component, against spec TOP-OM which permits only SITKA_SPRUCE and EAST_INDIAN_ROSEWOOD."
          setup_api_calls: *comp_routed
          trigger: "POST /components with spec_id ${spec1} and billet_id ${blt1} as Machinist, then POST /tonewood-lots with lot_code LOT-002, species_code HARD_MAPLE, cites_appendix NONE, board_feet_received 60.00, moisture_content_pct 7.0 and storage_room_id ${dry1} as WoodBuyer, then post a 7.0 moisture reading, condition and release that lot as WoodBuyer, then POST /billets with billet_code BLT-002, lot_id of LOT-002, board_feet 20.00, grade AAA and that lot's current version as Machinist, then POST /components with spec_id ${spec1} and billet_id of BLT-002 as Machinist"
          assert:
            reserved_billet_http_status: 409
            reserved_billet_error_id: "ERR_BILLET_STATE_INVALID"
            wrong_species_http_status: 422
            wrong_species_error_id: "ERR_SPECIES_NOT_PERMITTED"
            components_total_count_after: 1
            blt1_status_after: "RESERVED"
            blt2_status_after: "AVAILABLE"
            note: "BLT-002 is grade AAA, comfortably above the AA minimum, so the grade rule cannot be what refuses it — only the species list can. Both refusals leave the billet ledgers untouched: LOT-002 still shows its full board_feet_unassigned."

      - name: a_finish_run_must_be_sprayed_in_a_finish_booth
        claim_type: error_triggerable
        grounds: ["errors[ERR_BOOTH_ROOM_TYPE_INVALID]", "endpoints.POST_/finish-runs", "entities.StorageRoom.room_type"]
        distinguishing_aspect: "booth_id is a StorageRoom FK, so it resolves for a DRY_STORE and a BUILD_ROOM alike; the refusal is a 422 ERR_BOOTH_ROOM_TYPE_INVALID on room_type rather than a 404, and the order stays in IN_ASSEMBLY with the wrong room's occupied_slots untouched. The same call against FB-1 then creates the run and moves the order to IN_FINISH."
        test_recipe:
          setup: "A standard NITRO OM45 order in build_stage IN_ASSEMBLY, with DRY-1, BR-1 and FINISH_BOOTH FB-1 all existing and FB-1 holding a 50.0 / 21.0 climate reading."
          setup_api_calls: &order_in_assembly
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "FB-1", room_type: "FINISH_BOOTH", target_rh_pct: 50.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 4 }, as: PlantAdmin, captures: { fb1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "HS-1", station_type: "HAND_SHAPING", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { hs1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-STD", model_code: "OM45", base_price_cents: 300000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: false, artist_tier: "NONE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { bo1: "$.data.id" } }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 100000 }, as: CustomShopCoordinator }
            - { call: "POST /build-orders/${bo1}/lock-options", payload: {}, as: CustomShopCoordinator }
            - { call: "POST /build-orders/${bo1}/release-components", payload: {}, as: Machinist }
            - { call: "POST /components", payload: { spec_id: "${spec1}", billet_id: "${blt1}", build_order_id: "${bo1}" }, as: Machinist, captures: { cmp1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /components/${cmp1}/route", payload: { station_reservation_id: "${res1}", measured_thickness_mm: 2.90 }, as: Machinist }
            - { call: "POST /station-reservations", payload: { station_id: "${hs1}", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T11:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Luthier, captures: { res2: "$.data.id" } }
            - { call: "POST /components/${cmp1}/hand-shape", payload: { station_reservation_id: "${res2}", measured_thickness_mm: 2.90 }, as: Luthier }
            - { call: "POST /components/${cmp1}/qc", payload: { verdict: "ACCEPT" }, as: QualityInspector }
            - { call: "POST /build-orders/${bo1}/start-assembly", payload: {}, as: Luthier, captures: { bo_v3: "$.data.version" } }
