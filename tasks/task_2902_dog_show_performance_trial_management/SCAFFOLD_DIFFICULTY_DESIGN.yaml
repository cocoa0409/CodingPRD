  - rule_id: boundary_precision_check
    instances:
      - name: heat_index_exactly_at_red_threshold
        grounds:
          - calculations.heat_advisory_evaluation
          - entities.Show.fields.current_heat_index_c
          - entities.Show.fields.current_advisory_level
          - state_machines.Show.IN_PROGRESS_to_IN_PROGRESS
          - state_machines.Entry.CLEAR_to_HEAT_HOLD
        distinguishing_aspect: |
            Boundary on a ONE-DECIMAL NUMERIC THRESHOLD: the humidity adjustment for 65% is +3.0, so 28.9 C
            lands at 31.9 (one tenth below ADVISORY_RED_MIN_C, still AMBER and no welfare hold) and 29.0 C lands
            at exactly 32.0, which the >= comparison must classify as RED and which must move the performance
            entries into HEAT_HOLD. A single tenth of a degree separates the two readings, so an implementation
            that truncates instead of rounding half up, or that uses a strict > at the threshold, flips one of
            the two assertions.

