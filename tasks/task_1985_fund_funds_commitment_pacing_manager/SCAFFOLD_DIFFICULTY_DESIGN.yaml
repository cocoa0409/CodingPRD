  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_low_cash_band_exactly_at_110pct_is_normal
        grounds:
          - calculations.program_posture
          - entities.FoFProgram.fields.posture
        distinguishing_aspect: |
          Numeric-threshold metric (unrestricted_cash vs 1.10x buffer): the
          RESTRICTED band triggers STRICTLY below 1.10 * liquidity_buffer_min;
          cash == exactly 1,100,000.00 with buffer 1,000,000 yields posture
          NORMAL, while cash == 1,099,999.99 yields RESTRICTED — a >= vs >
          boundary exercised through the ledger-entries POST and observed on
          GET /fof/programs/{id}.
