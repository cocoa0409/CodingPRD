# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Commercial General Liability — Expert
# 9 rule_ids x >= 2 instances = 18 instances.
# Shared baseline chain (referenced narratively in setup:):
#   POST /insurers -> insurer; POST /insureds (PAYROLL) -> insured;
#   POST /policies (OCCURRENCE, eff 2026-01-01, exp 2027-01-01, each_occ $1M,
#     gen_agg $2M, prod_agg $1M, rate 300 c/$1k, min $1000, est_exposure $1,000,000);
#   POST /policies/{id}/bind ; POST /policies/{id}/activate.
#   Default insurer clock = 2026-01-01T00:00:00.000Z so activate's
#   current_date >= effective_date precondition holds.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_audited_premium_reconciliation
        grounds:
          - calculations.estimated_premium
          - calculations.audited_premium
          - entities.Policy.fields.estimated_premium_cents
          - entities.Policy.fields.audited_premium_cents
          - entities.PremiumAudit.fields.net_adjustment_cents
          - state_machines.PremiumAudit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Same rate (300 c/$1k) and minimum ($1000) applied to two different exposures on
          two different entity domains: estimated_premium on Policy ($1,000,000 -> 300000c)
          vs audited_premium on PremiumAudit ($1,500,000 -> 450000c); net_adjustment_cents
          == 150000 (signed additional premium), proving the two variants diverge.
        test_recipe:
          setup:
            - "Insurer with audit_waiver_threshold_cents=50000 (default); PAYROLL insured."
            - "OCCURRENCE policy bound (estimated_premium_cents=300000 from $1,000,000 @300c/$1k), activated IN_FORCE, then clock advanced past expiration so the policy is EXPIRED."
            - "Premium audit SCHEDULED then started; one ExposureRecord of $1,500,000 recorded; audit COMPLETED."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0001", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { est_prem: $.data.estimated_premium_cents }
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /audits"
              payload: { policy_id: "${pol_id}", audit_basis: "PAYROLL" }
              as: PremiumAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/start"
              payload: {}
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/exposure-records"
              payload: { class_code: "91560", basis_amount_units: 1500000 }
              as: PremiumAuditor
          trigger:
            - call: "POST /audits/${audit_id}/complete"
              payload: {}
              as: PremiumAuditor
              captures: { audited: $.data.computed_audited_premium_cents, net: $.data.net_adjustment_cents }
          assert:
            - "Policy.${pol_id}.estimated_premium_cents == 300000"
            - "PremiumAudit.${audit_id}.computed_audited_premium_cents == 450000"
            - "PremiumAudit.${audit_id}.net_adjustment_cents == 150000"

      - name: occurrence_vs_claims_made_coverage_divergence
        grounds:
          - calculations.coverage_test
          - entities.Policy.fields.coverage_trigger
          - entities.Policy.fields.retroactive_date
          - entities.Claim.fields.occurrence_date
          - entities.Claim.fields.reported_date
          - state_machines.Claim.OPEN_to_RESERVED
        distinguishing_aspect: |
          The SAME (occurrence_date=2025-08-01, reported_date=2026-06-01) pair is COVERED
          under a CLAIMS_MADE policy (retro 2025-07-01, reported in period) but REJECTED with
          ERR_OCCURRENCE_OUTSIDE_PERIOD under an OCCURRENCE policy (occurrence before effective_date),
          proving coverage_test diverges by coverage_trigger on the Claim domain.
        test_recipe:
          setup:
            - "Two IN_FORCE policies on the same insurer/insured: P_OCC (OCCURRENCE) and P_CM (CLAIMS_MADE, retroactive_date 2025-07-01)."
            - "Clock at 2026-06-01 (so reported_date 2026-06-01 is the current period)."
            - "A claim on each policy with occurrence_date 2025-08-01, reported_date 2026-06-01."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-OCC", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_occ: $.data.id }
            - call: "POST /policies/${pol_occ}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_occ}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-CM", coverage_trigger: "CLAIMS_MADE", retroactive_date: "2025-07-01T00:00:00.000Z", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_cm: $.data.id }
            - call: "POST /policies/${pol_cm}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_cm}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_occ}", claimant_name: "Pedestrian A", loss_type: "BODILY_INJURY", occurrence_date: "2025-08-01T00:00:00.000Z", reported_date: "2026-06-01T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_occ: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_cm}", claimant_name: "Pedestrian B", loss_type: "BODILY_INJURY", occurrence_date: "2025-08-01T00:00:00.000Z", reported_date: "2026-06-01T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_cm: $.data.id }
          trigger:
            - call: "POST /claims/${claim_cm}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 5000000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_occ}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 5000000 }
              as: ClaimsAdjuster
              captures: { occ_err: $.data.error_id }
          assert:
            - "First trigger (claims-made) succeeds: Claim.${claim_cm}.status == RESERVED"
            - "Second trigger (occurrence) fails with data.error_id == ERR_OCCURRENCE_OUTSIDE_PERIOD (409)"
            - "Claim.${claim_occ}.status == OPEN (unchanged)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aggregate_erosion_per_occurrence_then_aggregate_cap
        grounds:
          - calculations.aggregate_erosion
          - entities.Policy.fields.each_occurrence_limit_cents
          - entities.Policy.fields.general_aggregate_limit_cents
          - entities.Policy.fields.general_aggregate_remaining_cents
          - entities.Claim.fields.recognized_incurred_cents
        distinguishing_aspect: |
          Mode (a) non-linear interaction with >=3 inputs and nested min/max: recognized erosion
          = min(min(incurred, each_occurrence_limit), remaining_aggregate_room); a $1.5M GENERAL
          claim is per-occurrence-capped to 100000000c BEFORE the $2M aggregate is touched, so
          recognized_incurred_cents == 100000000 and general_aggregate_remaining_cents == 100000000
          (NOT 50000000 that a wrong aggregate-first order would yield).
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy (each_occ $1M, gen_agg $2M); clock 2026-06-01."
            - "One GENERAL (BODILY_INJURY) claim covered in period."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0002", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "Injured C", loss_type: "BODILY_INJURY", occurrence_date: "2026-03-01T00:00:00.000Z", reported_date: "2026-03-05T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 150000000 }
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_id}.incurred_cents == 150000000"
            - "Claim.${claim_id}.recognized_incurred_cents == 100000000"
            - "Policy.${pol_id}.general_aggregate_remaining_cents == 100000000"
            - "Policy.${pol_id}.products_aggregate_remaining_cents == 100000000"

      - name: premium_floor_per_unit_then_multiply_rounding_order
        grounds:
          - calculations.estimated_premium
          - entities.Policy.fields.estimated_exposure_units
          - entities.Policy.fields.rate_per_unit_cents
          - state_machines.Policy.DRAFT_to_BOUND
        distinguishing_aspect: |
          Mode (b) order-dependent rounding pinned: floor(basis/1000) BEFORE multiply by rate.
          With estimated_exposure_units=1000500 and rate 300, floor(1000.5)*300 = 300000, NOT
          1000.5*300 = 300150 that a multiply-then-floor order would produce; estimated_premium_cents
          == 300000.
        test_recipe:
          setup:
            - "DRAFT OCCURRENCE policy with estimated_exposure_units=1000500, rate 300 c/$1k, min $1000."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0003", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { est_prem: $.data.estimated_premium_cents }
          assert:
            - "Policy.${pol_id}.estimated_premium_cents == 300000"
            - "Policy.${pol_id}.status == BOUND"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: premium_audit_dispute_reopen_revision_cycle
        grounds:
          - state_machines.PremiumAudit.COMPLETED_to_DISPUTED
          - state_machines.PremiumAudit.DISPUTED_to_IN_PROGRESS
          - state_machines.PremiumAudit.IN_PROGRESS_to_COMPLETED
          - entities.PremiumAudit.fields.revision_round
        distinguishing_aspect: |
          PremiumAudit cycles COMPLETED -> DISPUTED -> IN_PROGRESS -> COMPLETED (a revision loop,
          not a linear pipeline); revision_round increments from 0 to 1 on the reopen, and a
          second ExposureRecord changes computed_audited_premium_cents on recompletion.
        test_recipe:
          setup:
            - "EXPIRED OCCURRENCE policy (est_premium 300000); audit started, one ExposureRecord $1,500,000, COMPLETED (computed 450000), then DISPUTED by admin."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0004", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /audits"
              payload: { policy_id: "${pol_id}", audit_basis: "PAYROLL" }
              as: PremiumAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/start"
              payload: {}
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/exposure-records"
              payload: { class_code: "91560", basis_amount_units: 1500000 }
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/complete"
              payload: {}
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/dispute"
              payload: {}
              as: InsurerAdmin
          trigger:
            - call: "POST /audits/${audit_id}/reopen"
              payload: {}
              as: PremiumAuditor
              captures: { rr: $.data.revision_round }
            - call: "POST /audits/${audit_id}/exposure-records"
              payload: { class_code: "91561", basis_amount_units: 500000 }
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/complete"
              payload: {}
              as: PremiumAuditor
              captures: { audited2: $.data.computed_audited_premium_cents }
          assert:
            - "After reopen PremiumAudit.${audit_id}.status == IN_PROGRESS and revision_round == 1"
            - "After re-complete PremiumAudit.${audit_id}.computed_audited_premium_cents == 600000 (audited exposure $2,000,000 @300c/$1k)"
            - "PremiumAudit.${audit_id}.status == COMPLETED"

      - name: claim_reopen_cycle_returns_to_reserved
        grounds:
          - state_machines.Claim.PAID_to_CLOSED
          - state_machines.Claim.CLOSED_to_REOPENED
          - state_machines.Claim.REOPENED_to_RESERVED
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Claim cycles CLOSED -> REOPENED -> RESERVED (a reopen loop on a different entity than
          PremiumAudit); after reopening and posting a fresh RESERVE_SET the claim is RESERVED again
          and its incurred_cents reflects the new reserve.
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy; clock 2026-06-01; a GENERAL claim reserved $50M then paid $50M (PAID), reserve released to 0, then CLOSED."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0005", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "Injured D", loss_type: "BODILY_INJURY", occurrence_date: "2026-02-01T00:00:00.000Z", reported_date: "2026-02-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 50000000 }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv1: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: 50000000, expected_policy_version: "${pv1}" }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv2: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_RELEASE", amount_cents: 50000000, expected_policy_version: "${pv2}" }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/close"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/reopen"
              payload: {}
              as: ClaimsAdjuster
              captures: { st_reopened: $.data.status }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv3: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 30000000, expected_policy_version: "${pv3}" }
              as: ClaimsAdjuster
          assert:
            - "After reopen Claim.${claim_id}.status == REOPENED"
            - "After RESERVE_SET Claim.${claim_id}.status == RESERVED"
            - "Claim.${claim_id}.incurred_cents == 80000000 (open reserve 30000000 + payments 50000000)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_txn_cascades_incurred_aggregate_posture
        grounds:
          - state_machines.Claim.OPEN_to_RESERVED
          - calculations.claim_incurred
          - calculations.aggregate_erosion
          - calculations.policy_posture
          - entities.Policy.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (RESERVE_SET): the transaction mutates
          Claim.incurred_cents, which causes aggregate_erosion to mutate
          Policy.general_aggregate_remaining_cents, which causes policy_posture to mutate
          Policy.posture to IMPAIRED — each hop caused by the previous, not by the transaction directly.
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy (gen_agg $2M, each_occ $1M); clock 2026-06-01; a GENERAL claim covered in period."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0006", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
