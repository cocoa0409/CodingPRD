      - name: energy_balance_computed_read_surfaces_both_invariants
        claim_type: computed_read
        grounds: ["endpoints", "calculations.energy_balance_invariant", "calculations.rin_ledger_invariant"]
        excluded_because:
          difficulty_instance: site_energy_mmbtu_conserved_across_divert_and_void
          rationale: "That §1.8 instance reads GET /sites/{id}/energy-balance twice and asserts every bucket plus balance_ok; the RIN half is asserted by rin_count_ledger_conserved_across_generation_and_reversal."

  - section: errors
    instances:
      - name: duplicate_compliance_report_for_same_site_type_and_period_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=120]", "errors[ERR_REPORT_PERIOD_DUPLICATE]"]
        distinguishing_aspect: "A second QUARTERLY_RIN_QAP report for site X and period 2026-Q3 while the first is still in a non-RETURNED status returns 409 ERR_REPORT_PERIOD_DUPLICATE."
        test_recipe:
          setup: ["One LandfillSite with one DRAFT QUARTERLY_RIN_QAP ComplianceReport for 2026-Q3."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
