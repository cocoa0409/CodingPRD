            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_1_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_1_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_1_id}/decision"
              payload: { license_determination: "LICENSE_REQUIRED", eccn: "3A001", denied_party_hits: 0 }
