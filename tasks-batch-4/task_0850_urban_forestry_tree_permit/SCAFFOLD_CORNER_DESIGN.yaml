scaffold_corner_design:
  # =========================================================================
  # From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:
      - name: get_tree_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_TREE_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent tree id returns ERR_TREE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /forestry/trees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_TREE_NOT_FOUND"

      - name: tree_create_missing_required_dbh_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Tree.fields.dbh_inches
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required dbh_inches on tree create returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Zone Z1 and Species Oak exist."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: tree_create_invalid_enum_condition_class
        claim_type: Type Constraints
        grounds:
          - entities.Tree.fields.condition_class
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "A condition_class value outside {GOOD,FAIR,POOR,DEAD} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Zone Z1 and Species Oak exist."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "EXCELLENT" }
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: tree_create_bad_zone_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Tree.fields.zone_id
          - errors[ERR_ZONE_NOT_FOUND]
        distinguishing_aspect: "FK integrity: a tree create with a non-existent zone_id returns ERR_ZONE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Species Oak exists; no zone with the referenced id."]
          setup_api_calls:
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "00000000-0000-4000-8000-000000000000", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ZONE_NOT_FOUND"

      - name: zone_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Zone.fields.name
        distinguishing_aspect: "Zone create mints id, created_at, and version=1 server-side (common_fields)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Zone.${z1}.version == 1"
            - "response.data.id is a non-empty UUID string"

      - name: contractor_status_defaults_active
        claim_type: Defaults
        grounds:
          - entities.Contractor.fields.status
        distinguishing_aspect: "Omitting status on contractor create applies the default ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /forestry/contractors"
              payload: { name: "Acme", license_number: "L-9", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true }
              as: ForestryAdmin
              captures: { c: $.data.id }
          assert:
            - "response.status == 201"
            - "Contractor.${c}.status == ACTIVE"

      - name: zone_canopy_recomputed_on_tree_create
        claim_type: Computed Fields
        grounds:
          - calculations.zone_canopy
          - entities.Zone.fields.current_canopy_pct
        distinguishing_aspect: "Adding one Oak (mature_canopy 50) to a 100-sqm zone recomputes current_canopy_pct to 50.00 and canopy_status to MEETS."
        test_recipe:
          setup: ["Zone Z1 (area 100, target 30), Species Oak (mature_canopy 50)."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t: $.data.id }
          assert:
            - "Zone.${z1}.current_canopy_pct == 50.00"
            - "Zone.${z1}.canopy_status == MEETS"

      - name: zone_canopy_pct_two_decimal_precision
        claim_type: Computed Fields
        grounds:
          - calculations.zone_canopy
          - entities.Zone.fields.current_canopy_pct
        distinguishing_aspect: "Precision: 50/300*100 = 16.666.. rounds_half_up to 16.67 (two decimals)."
        test_recipe:
          setup: ["Zone Z2 (area 300, target 10), Species Oak (mature_canopy 50), one tree."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z2", target_canopy_pct: 10.0, area_sqm: 300 }
              as: ForestryAdmin
              captures: { z2: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z2}", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t: $.data.id }
          assert:
            - "Zone.${z2}.current_canopy_pct == 16.67"

  # =========================================================================
  # From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: permit_initial_state_draft
        claim_type: Initial State
        grounds:
          - state_machines.Permit
          - entities.Permit.fields.status
        distinguishing_aspect: "A freshly created permit starts in DRAFT."
        test_recipe:
          setup: ["Zone Z1, Species Oak, protected Tree T20."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
          trigger:
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
          assert:
            - "Permit.${p}.status == DRAFT"

      - name: finalize_already_finalized_inspection_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Inspection.DRAFT_to_FINALIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Finalizing an Inspection already in FINALIZED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Zone Z1, Species Oak, Tree T20 with a finalized inspection."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 2, consequence_score: 2, target_rating: 2 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: submit_denied_permit_rejects_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DENIED permit is terminal: submit on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Zone Z1, Species Oak, protected Tree T20, a permit denied by the arborist."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "DENY", review_notes: "no" }
              as: Arborist
          trigger:
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: mark_valid_twice_rejects_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.DigTicket.REQUESTED_to_VALID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Marking a dig ticket VALID a second time returns ERR_INVALID_STATE (409) — the transition is not defined from VALID."
        test_recipe:
          setup: ["Zone/species/tree/storm/contractor and an EMERGENCY work order with a REQUESTED dig ticket already marked VALID once."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/storm-events"
              payload: { affected_zone_id: "${z1}", severity: "MAJOR", window_start: "2026-02-15T00:00:00Z", window_end: "2026-04-15T00:00:00Z" }
              as: ForestryAdmin
              captures: { st: $.data.id }
            - call: "POST /forestry/contractors"
              payload: { name: "Acme", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true, status: "ACTIVE" }
              as: ForestryAdmin
              captures: { c1: $.data.id }
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", contractor_id: "${c1}", work_type: "EMERGENCY_REMOVAL", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: ForestryStaff
              captures: { wo: $.data.id }
            - call: "POST /forestry/work-orders/${wo}/dig-tickets"
              payload: { ticket_number: "811-1", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-02T00:00:00Z" }
              as: Contractor
              as_user_id: "${c1}"
              captures: { dt: $.data.id }
            - call: "POST /forestry/dig-tickets/${dt}/mark-valid"
              payload: {}
              as: ForestryAdmin
          trigger:
            - call: "POST /forestry/dig-tickets/${dt}/mark-valid"
              payload: {}
              as: ForestryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: canopy_excludes_removed_trees_input_filter
        claim_type: Input Set Filtering
        grounds:
          - calculations.zone_canopy
        excluded_because:
          difficulty_instance: workorder_complete_removes_tree_flips_zone_deficit
          rationale: "The removal cascade there proves REMOVED trees leave the live_canopy_sqm input set (50 -> 0)."

  # =========================================================================
  # From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:
      - name: pay_fee_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: "pay-fee with amount_cents != mitigation_fee_cents returns ERR_FEE_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["An APPROVED REMOVAL permit on T20 with mitigation_fee_cents=40312 (REPLACEMENT_COST)."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "ok" }
              as: Arborist
          trigger:
            - call: "POST /forestry/permits/${p}/pay-fee"
              payload: { amount_cents: 40000 }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_FEE_AMOUNT_MISMATCH"

      - name: dig_ticket_window_invalid_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=16]
          - errors[ERR_DIG_WINDOW_INVALID]
        distinguishing_aspect: "Creating a dig ticket with valid_to <= valid_from returns ERR_DIG_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["Zone/species/tree/storm/contractor and one EMERGENCY work order."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/storm-events"
              payload: { affected_zone_id: "${z1}", severity: "MAJOR", window_start: "2026-02-15T00:00:00Z", window_end: "2026-04-15T00:00:00Z" }
              as: ForestryAdmin
              captures: { st: $.data.id }
            - call: "POST /forestry/contractors"
              payload: { name: "Acme", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true, status: "ACTIVE" }
              as: ForestryAdmin
              captures: { c1: $.data.id }
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", contractor_id: "${c1}", work_type: "EMERGENCY_REMOVAL", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: ForestryStaff
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /forestry/work-orders/${wo}/dig-tickets"
              payload: { ticket_number: "811-x", valid_from: "2026-03-02T00:00:00Z", valid_to: "2026-03-01T00:00:00Z" }
              as: Contractor
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DIG_WINDOW_INVALID"

      - name: work_order_on_unissued_permit_rejects_permit_not_issued
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=15]
          - errors[ERR_PERMIT_NOT_ISSUED]
        distinguishing_aspect: "Creating a REMOVAL work order against an APPROVED-but-not-ISSUED permit returns ERR_PERMIT_NOT_ISSUED (409)."
        test_recipe:
          setup: ["An APPROVED (not issued) REMOVAL permit on T20 and an ACTIVE contractor."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
