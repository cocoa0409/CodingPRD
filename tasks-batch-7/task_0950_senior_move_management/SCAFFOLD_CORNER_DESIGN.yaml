        grounds: ['validations[priority=24]', 'validations[priority=64]', 'errors[ERR_ENGAGEMENT_ON_HOLD]', 'errors[ERR_STALE_ENGAGEMENT_VERSION]', 'concurrency_rules[sort-plan-create-stale-engagement]', 'gate_precedence[11]']
        distinguishing_aspect: "The hold itself bumps Engagement.version, so a sort-plan create replaying the pre-hold version is both blocked by gate 3 and stale at gate 11; while the engagement is ON_HOLD the answer is 409 ERR_ENGAGEMENT_ON_HOLD, and only after resume does the same stale value surface 412 ERR_STALE_ENGAGEMENT_VERSION."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement whose version was observed before it was placed ON_HOLD."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id", engv0: "$.data.version" }
            - call: "POST /engagements/${eng}/hold"
              payload: { reason: "Awaiting the family conference" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /sort-plans"
              payload: { engagement_id: "${eng}", expected_engagement_version: "${engv0}" }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
            - call: "POST /engagements/${eng}/resume"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /sort-plans"
              payload: { engagement_id: "${eng}", expected_engagement_version: "${engv0}" }
              as: MOVE_MANAGER
              captures: { r2: "$.data.error_id" }
          assert:
            - "the first create responds 409 and ${r1} == ERR_ENGAGEMENT_ON_HOLD"
            - "the second create responds 412 and ${r2} == ERR_STALE_ENGAGEMENT_VERSION"
            - "Engagement.${eng}.status == ACTIVE and hold_count == 1"
            - "GET /sort-plans filtered by engagement_id returns total_count == 0"

      - name: required_field_rung_precedes_the_enum_membership_rung
        claim_type: violation_to_error
        grounds: ['validations[priority=5]', 'validations[priority=6]', 'errors[ERR_VALIDATION]', 'errors[ERR_INVALID_ENUM]', 'endpoints["POST /engagements"]']
        distinguishing_aspect: "A create that both omits the required home_tier and carries billing_mode WEEKLY returns 400 ERR_VALIDATION, because rung 5 is evaluated before rung 6; supplying home_tier while leaving billing_mode WEEKLY then returns 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "WEEKLY", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "WEEKLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { r2: "$.data.error_id" }
          assert:
            - "the first call responds 400 and ${r1} == ERR_VALIDATION"
            - "the second call responds 400 and ${r2} == ERR_INVALID_ENUM"
            - "Client.${cl}.engagement_count == 0"

      - name: crew_record_existence_rung_precedes_the_freeze_window_rung
        claim_type: violation_to_error
        grounds: ['validations[priority=17]', 'validations[priority=35]', 'errors[ERR_CREW_RECORD_NOT_FOUND]', 'errors[ERR_FREEZE_WINDOW_ENTERED]', 'gate_precedence[2]', 'gate_precedence[6]']
        distinguishing_aspect: "With the clock already at MoveDayPlan.freeze_at_utc, a crew-assignment create naming an unresolvable crew_member_id returns 404 ERR_CREW_RECORD_NOT_FOUND at gate 2, and the same create naming a real crew member then returns 409 ERR_FREEZE_WINDOW_ENTERED at gate 6."
        test_recipe:
          setup: ["A STUDIO engagement in phase PACK with a DRAFT move-day plan whose freeze_at_utc is 2026-06-12T14:00:00.000Z, one registered LEAD crew member, and the clock standing on the freeze instant."]
