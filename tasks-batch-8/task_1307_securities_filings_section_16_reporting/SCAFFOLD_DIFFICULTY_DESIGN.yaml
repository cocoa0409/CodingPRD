scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: short_swing_max_recovery_vs_fifo
        grounds:
          - calculations.short_swing_profit
          - entities.SecurityTransaction.fields.transaction_code
        distinguishing_aspect: |
          Same four transactions yield short_swing_profit == 1000.00 under the
          MAX_RECOVERY variant (highest sale matched to lowest purchase) but
          short_swing_profit_fifo == 700.00 under FIFO_CHRONOLOGICAL — a
          dual-variant divergence on the SecurityTransaction domain, whereas the
          sibling instance diverges on the BeneficialHolder domain.
        test_recipe:
          setup:
            - "Issuer I (no holidays); person P designated ACTIVE at the default clock 2026-08-01"
            - "Four CONFIRMED transactions for P: buy 100 @ 20.00 on 2026-02-02; buy 100 @ 8.00 on 2026-03-02; sell 100 @ 15.00 on 2026-04-01; sell 100 @ 18.00 on 2026-05-01"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-02-02", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 20.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t1: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-03-02", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 8.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t2: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-04-01", transaction_code: "S", security_type: "COMMON_STOCK", shares: 100, price_per_share: 15.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t3: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-05-01", transaction_code: "S", security_type: "COMMON_STOCK", shares: 100, price_per_share: 18.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t4: $.data.id }
            - call: "POST /transactions/${t1}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t2}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t3}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t4}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "GET /reporting-persons/${p_id}/short-swing-analysis"
              as: ComplianceOfficer
              captures: { profit_mr: $.data.short_swing_profit, profit_fifo: $.data.short_swing_profit_fifo, pair_count: $.data.matchable_pair_count }
          assert:
            - "short_swing_profit == 1000.00 (MAX_RECOVERY: sale 100@18.00 matched against purchase 100@8.00)"
            - "short_swing_profit_fifo == 700.00 (FIFO: sale 100@15.00 matched against earliest positive-spread purchase 100@8.00; sale 100@18.00 then finds no positive spread)"
            - "matchable_pair_count == 2"
            - "profit_mr != profit_fifo for identical input data"

      - name: beneficial_ownership_basic_vs_fully_diluted
        grounds:
          - calculations.beneficial_ownership_pct
          - entities.BeneficialHolder.fields.current_pct
          - entities.BeneficialHolder.fields.fully_diluted_pct
        distinguishing_aspect: |
          Same two position events yield current_pct == 5.00 under the BASIC
          variant but fully_diluted_pct == 7.32 under the FULLY_DILUTED variant —
          a dual-variant divergence on the BeneficialHolder domain, whereas the
          sibling instance diverges on the SecurityTransaction domain.
        test_recipe:
          setup:
            - "Issuer I with shares_outstanding 1,000,000 (default clock 2026-08-01)"
            - "BeneficialHolder H with two posted position events: +25,000 shares / +0 derivatives, then +25,000 shares / +25,000 derivatives, both effective 2026-08-01"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /beneficial-holders"
              payload: { issuer_id: "${i_id}", holder_name: "Big Fund LP" }
              as: ComplianceOfficer
              captures: { h_id: $.data.id }
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 25000, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 25000, derivative_shares_delta: 25000, effective_date: "2026-08-01" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /beneficial-holders/${h_id}"
              as: ComplianceOfficer
              captures: { pct_basic: $.data.current_pct, pct_fd: $.data.fully_diluted_pct, h_status: $.data.status, h_shares: $.data.shares_beneficially_owned }
          assert:
            - "current_pct == 5.00 (BASIC: 100 * 50,000 / 1,000,000)"
            - "fully_diluted_pct == 7.32 (FULLY_DILUTED: 100 * 75,000 / 1,025,000 = 7.3170... -> 7.32)"
            - "shares_beneficially_owned == 50000"
            - "status == FILING_REQUIRED (threshold uses the BASIC variant only)"
            - "pct_basic != pct_fd for identical input data"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: cooling_off_nested_min_max_with_cap
        grounds:
          - calculations.cooling_off_end_date
          - state_machines.TradingPlan10b5_1.PENDING_APPROVAL_to_ADOPTED
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (adoption_date, officer flag,
          next_earnings_filing_date) with nested min/max and a conditional branch;
          here the earnings extension (2026-12-17) exceeds the 120-day cap so the
          nested min() binds and cooling_off_end_date == 2026-12-01 — a different
          mode than the sibling instance's nested-rounding formula.
        test_recipe:
          setup:
            - "Issuer I with next_earnings_filing_date 2026-12-15 (Tuesday); logical clock 2026-08-03"
            - "Officer person O; plan window [2026-09-01, 2027-03-01) submitted for adoption"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345", next_earnings_filing_date: "2026-12-15" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-09-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              captures: { pl_status: $.data.status, ce: $.data.cooling_off_end_date, ad: $.data.adoption_date }
          assert:
            - "pl_status == ADOPTED"
            - "adoption_date == \"2026-08-03\""
            - "cooling_off_end_date == \"2026-12-01\" (base_end 2026-11-01; earnings_end = 2026-12-15 + 2 business days = 2026-12-17; max = 2026-12-17; min with cap 2026-08-03 + 120d = 2026-12-01 binds)"

      - name: short_swing_per_pair_rounding_order
        grounds:
          - calculations.short_swing_profit
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned as
          round-per-pair-then-sum, so two pairs each profiting 0.005 total 0.02;
          sum-then-round would produce 0.01 — a different mode than the sibling
          instance's min/max branching formula.
        test_recipe:
          setup:
            - "Issuer I; person P designated ACTIVE at the default clock 2026-08-01"
            - "Four CONFIRMED transactions for P: buy 1 @ 10.000 on 2026-03-02; buy 1 @ 10.000 on 2026-03-03; sell 1 @ 10.005 on 2026-04-01; sell 1 @ 10.005 on 2026-04-02"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-03-02", transaction_code: "P", security_type: "COMMON_STOCK", shares: 1, price_per_share: 10.000 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t1: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-03-03", transaction_code: "P", security_type: "COMMON_STOCK", shares: 1, price_per_share: 10.000 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t2: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-04-01", transaction_code: "S", security_type: "COMMON_STOCK", shares: 1, price_per_share: 10.005 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t3: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-04-02", transaction_code: "S", security_type: "COMMON_STOCK", shares: 1, price_per_share: 10.005 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t4: $.data.id }
            - call: "POST /transactions/${t1}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t2}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t3}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t4}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "GET /reporting-persons/${p_id}/short-swing-analysis"
              as: ComplianceOfficer
              captures: { profit_mr: $.data.short_swing_profit }
          assert:
            - "short_swing_profit == 0.02 (each pair profit 0.005 rounds HALF_UP to 0.01 per pair, then summed: 0.01 + 0.01)"
            - "short_swing_profit != 0.01 (sum-then-round of 0.010 is the forbidden order)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: filing_rejection_revision_loop
        grounds:
          - state_machines.SecuritiesFiling.REJECTED_to_DRAFT
          - state_machines.SecuritiesFiling.READY_to_SUBMITTED
        distinguishing_aspect: |
          SecuritiesFiling runs the cyclic loop DRAFT -> READY -> SUBMITTED ->
          REJECTED -> DRAFT -> READY -> SUBMITTED -> ACCEPTED; the sibling
          instance exercises a cycle on a different entity (TradingPlan10b5_1
          ACTIVE <-> SUSPENDED).
        test_recipe:
          setup:
            - "Issuer I with edgar_ccc CCC12345; filing agent agent_1 authorized for I"
            - "Person P designated ACTIVE (clock 2026-08-03); purchase 100 @ 10.00 dated 2026-08-06 confirmed at clock 2026-08-06 -> DRAFT Form 4 (deadline 2026-08-10)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-06", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
          trigger:
            - call: "POST /filings/${f_id}/record-edgar-result"
              payload: { outcome: "REJECTED", rejection_reason: "bad tag" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { st_rejected: $.data.status }
            - call: "POST /filings/${f_id}/reopen"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
              captures: { st_draft: $.data.status }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000001" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { st_final: $.data.status, late_final: $.data.is_late }
          assert:
            - "st_rejected == REJECTED (rejection branch of the cycle)"
            - "st_draft == DRAFT (reopen completes the REJECTED -> DRAFT loop)"
            - "st_final == ACCEPTED after the second circuit through READY -> SUBMITTED"
            - "late_final == false (accepted on deadline date 2026-08-10)"

      - name: trading_plan_suspend_reinstate_cycle
        grounds:
          - state_machines.TradingPlan10b5_1.ACTIVE_to_SUSPENDED
          - state_machines.TradingPlan10b5_1.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          TradingPlan10b5_1 runs the cyclic loop ACTIVE -> SUSPENDED -> ACTIVE
          (compliance hold and reinstatement); the sibling instance exercises a
          cycle on a different entity (SecuritiesFiling rejection loop).
        test_recipe:
          setup:
            - "Issuer I with next_earnings_filing_date 2026-10-30; officer person O"
            - "Plan approved at clock 2026-08-03 (cooling_off_end_date 2026-11-03) and activated at clock 2026-11-03"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345", next_earnings_filing_date: "2026-10-30" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-09-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              captures: { st_active: $.data.status }
          trigger:
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
              captures: { st_susp: $.data.status }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
              captures: { st_back: $.data.status }
          assert:
            - "st_active == ACTIVE"
            - "st_susp == SUSPENDED (first leg of the cycle)"
            - "st_back == ACTIVE (cycle closes back to ACTIVE)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: late_acceptance_delinquency_chain
        grounds:
          - state_machines.SecuritiesFiling.SUBMITTED_to_ACCEPTED
          - calculations.late_filing_delinquency
          - entities.ReportingPerson.fields.delinquent_flag
        distinguishing_aspect: |
          Depth-3 cascade from POST /filings/{id}/record-edgar-result: hop 1 sets
          filing.is_late = true, hop 2 (caused by hop 1) increments
          ReportingPerson.late_filing_count, hop 3 (caused by hop 2) flips
          delinquent_flag when the count reaches 2 — a different trigger than the
          sibling instance's confirm-driven cascade.
        test_recipe:
          setup:
            - "Issuer I with edgar_ccc CCC12345; agent_1 authorized; person P designated ACTIVE at clock 2026-08-03"
            - "Two purchases of P dated 2026-08-06, each confirmed, each with its auto Form 4 submitted and accepted LATE at clock 2026-08-11 (deadline 2026-08-10)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-06", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /transactions/${t1}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f1: "$.data[0].id" }
            - call: "POST /filings/${f1}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${f1}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T10:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /filings/${f1}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000002" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { late1: $.data.is_late }
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { lc_mid: $.data.late_filing_count, flag_mid: $.data.delinquent_flag }
            - call: "POST /transactions"
