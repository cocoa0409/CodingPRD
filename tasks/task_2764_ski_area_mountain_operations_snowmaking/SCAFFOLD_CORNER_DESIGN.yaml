      - name: wet_bulb_band_boundaries_fall_into_the_colder_band_and_are_frozen_at_start
        claim_type: constants_applied
        grounds:
          - calculations.snowmaking_wet_bulb_yield
          - entities.SnowmakingSession.fields.snow_yield_factor
          - entities.SnowmakingSession.fields.wet_bulb_f
        distinguishing_aspect: |
          Every band edge is a strict greater-than, so 24.0 must select YIELD_GOOD (0.85) rather than
          YIELD_MARGINAL, and 20.0 must select YIELD_IDEAL (1.00) rather than YIELD_GOOD. The second
          corner is that the factor is frozen when the row enters RUNNING: after the day plan cools to
          20.0 the already-running session must still report 24.0 / 0.85, because a retroactive
          re-read would silently re-price water that has already been made.
