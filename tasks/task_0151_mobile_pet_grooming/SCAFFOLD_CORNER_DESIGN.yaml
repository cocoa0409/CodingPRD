      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers to POST /breeds returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /breeds"
              payload: { name: "X", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 60 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_UNAUTHENTICATED, HTTP 401."

      - name: error_validation_expires_before_issued
        claim_type: violation_to_error
        grounds:
          - entities.VaccinationRecord.fields.expires_on
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Uploading a vaccination with expires_on not strictly after issued_on returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A pet exists."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Heeler", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce18@x.com", full_name: "CE Eighteen", service_zip: "10020" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Blue", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
          trigger:
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-06-01T00:00:00Z", expires_on: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION, HTTP 422."

  # =========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_quote_appointment
        claim_type: peer_roles
        grounds:
          - roles.Customer
          - roles.Dispatcher
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /appointments/{id}/quote is Dispatcher-exclusive; a Customer attempting it gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A REQUESTED appointment owned by the acting customer."]
          setup_api_calls:
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Kelpie", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce19@x.com", full_name: "CE Nineteen", service_zip: "10021" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Kel", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN, HTTP 403 (quote is Dispatcher-exclusive)."

      - name: customer_cannot_cancel_other_customers_appointment
        claim_type: peer_roles
        grounds:
          - roles.Customer
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Customer cancelling an appointment owned by a DIFFERENT customer (ownership mismatch) gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Customer A owns a REQUESTED appointment; Customer B acts."]
          setup_api_calls:
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Borzoi", coat_type: "CURLY", size_class: "LARGE", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "owner@x.com", full_name: "Owner", service_zip: "10022" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "intruder@x.com", full_name: "Intruder", service_zip: "10023" }
              as: PlatformAdmin
              captures: { intruder_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${owner_id}", breed_id: "${breed_id}", name: "Zoi", weight_lbs: 40 }
              as: Customer
              as_user_id: "${owner_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${owner_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${intruder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN, HTTP 403 (ownership mismatch)."

