  - section: cross_cutting_layers
    instances:
      - name: occ_modify_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-modify-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints.POST /bookings/{id}/modify"]
        distinguishing_aspect: "A modify carrying the pre-modify version is rejected 412 ERR_STALE_VERSION after a successful modify advanced Booking.version; the second request sees an otherwise-valid CONFIRMED booking."
        test_recipe:
          setup: ["STANDARD_44 vessel with SHOULDER rate (47000); qualified renter; booking 2026-09-01 -> 2026-09-05 CONFIRMED (version captured at confirm)"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { name: "Standard Occ", size_class: "STANDARD_44", berth_count: 6, home_marina: "Bullfrog", fuel_tank_capacity_gallons: 200 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /season-rates"
              payload: { size_class: "STANDARD_44", season: "SHOULDER", start_date: "2026-09-01", end_date: "2026-10-31", nightly_rate_cents: 47000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /renters"
              payload: { full_name: "Occ Mod", email: "occ@x.com", date_of_birth: "1990-02-06" }
              as: Renter
              captures: { r_id: $.data.id }
            - call: "POST /renters/${r_id}/certificates"
              payload: { cert_number: "C-1334", issuing_authority: "NASBLA", issued_on: "2026-01-15", expires_on: "2027-06-30" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { c_id: $.data.id }
            - call: "POST /certificates/${c_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-09-01", end_date: "2026-09-05", party_size: 2 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Renter
              as_user_id: "${r_id}"
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /bookings/${b_id}/modify"
              payload: { expected_booking_version: "${b_v}", start_date: "2026-09-01", end_date: "2026-09-04" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { q1: $.data.quoted_total_cents, v1: $.data.version }
