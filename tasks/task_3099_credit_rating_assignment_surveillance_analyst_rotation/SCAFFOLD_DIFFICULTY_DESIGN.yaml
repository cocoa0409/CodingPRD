              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 0, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng0_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: -1, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "the zero-fee create returns 201 with EngagementLetter.${eng0_id}.fee_amount_cents == 0"
            - "the negative-fee create returns 400 with error_id == ERR_FEE_AMOUNT_NEGATIVE"
            - "the boundary is inclusive at 0: 0 is valid, -1 is not"

