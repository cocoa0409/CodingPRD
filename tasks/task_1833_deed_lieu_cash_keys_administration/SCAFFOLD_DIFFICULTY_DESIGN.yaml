  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and >=2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recording_confirm_depth3_cascade
        grounds:
          - state_machines.DeedRecording.SUBMITTED_to_RECORDED
          - state_machines.WorkoutCase.RECORDING_PENDING_to_COMPLETED
          - state_machines.DeficiencyWaiver.DOCUMENTED_to_EXECUTED
          - state_machines.Loan.WORKOUT_IN_PROGRESS_to_DEED_IN_LIEU_COMPLETED
        distinguishing_aspect: |
          Depth-3 chain from POST .../deed-recordings/{id}/confirm: hop1 recording
          RECORDED -> hop2 case COMPLETED (caused by hop1) -> hop3 waiver EXECUTED
          AND loan status/sync flip (caused by hop2) -> hop4 loan deficiency zeroed
          and foreclosure referral WITHDRAWN (caused by hop3). Each hop is caused by
          the previous hop, not by the original request.
        test_recipe:
          setup:
            - "DIL case LN-TC1 (standard economics, foreclosure_referral_status REFERRED) driven to RECORDING_PENDING: clean on-time handover 2026-09-01, final assistance 550000 fully disbursed; waiver DOCUMENTED; recording SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
