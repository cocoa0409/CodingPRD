scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_park_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Park, endpoints.POST_/parks]
        distinguishing_aspect: "POST /parks with required fields returns 201, weather_status defaults CLEAR, open_window_count defaults 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "New Park", total_gate_capacity: 500 }
              as: ParkManager
              captures: { park_id: $.data.id, ws: $.data.weather_status, owc: $.data.open_window_count, v: $.data.version }
          assert:
            - "Park.weather_status == CLEAR"
            - "Park.open_window_count == 0"
            - "Park.version == 1"

      - name: get_park_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Park, "endpoints.GET_/parks/{id}"]
        distinguishing_aspect: "GET /parks/{id} returns the same total_gate_capacity that was created."
        test_recipe:
          setup: ["one park with total_gate_capacity 777"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Get Park", total_gate_capacity: 777 }
              as: ParkManager
              captures: { park_id: $.data.id }
          trigger:
            - call: "GET /parks/${park_id}"
              payload: {}
              as: Guest
              captures: { cap: $.data.total_gate_capacity }
          assert:
            - "Park.${park_id}.total_gate_capacity == 777"

      - name: list_parks_paginated_envelope
        claim_type: Listing
        grounds: [entities.Park, endpoints.GET_/parks]
        distinguishing_aspect: "GET /parks returns array envelope with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["two parks created"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P1", total_gate_capacity: 100 }
              as: ParkManager
            - call: "POST /parks"
              payload: { name: "P2", total_gate_capacity: 100 }
              as: ParkManager
          trigger:
            - call: "GET /parks"
              payload: { limit: 1, offset: 0 }
              as: ParkManager
          assert:
            - "response_type == array; total_count >= 2; has_more == true with limit 1"

      - name: get_park_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/parks/{id}"]
        distinguishing_aspect: "GET /parks/{non-existent uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /parks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ParkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_park_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", endpoints.POST_/parks]
        distinguishing_aspect: "POST /parks omitting total_gate_capacity returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "No Cap" }
              as: ParkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_food_combo_default_false
        claim_type: Defaults
        grounds: [entities.Order.fields.food_beverage_combo, endpoints.POST_/orders]
        distinguishing_aspect: "POST /orders omitting food_beverage_combo defaults it to false."
        test_recipe:
          setup: ["a park and a guest"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Def Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", email: "g@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { combo: $.data.food_beverage_combo }
          assert:
            - "Order.food_beverage_combo == false"

      - name: order_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Order, endpoints.POST_/orders]
        distinguishing_aspect: "Server mints id/created_at/version; subtotal_cents stays 0 (computed) at create regardless of any client-supplied value."
        test_recipe:
          setup: ["a park and a guest"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Sys Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G2", email: "g2@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 3 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { sub: $.data.subtotal_cents, v: $.data.version }
          assert:
            - "Order.subtotal_cents == 0 before pay; Order.version == 1; id is a server UUID"

      - name: order_invalid_product_type_enum_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Order.fields.product_type]
        distinguishing_aspect: "POST /orders with product_type 'GOLD_PASS' (not in enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a park and a guest"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Enum Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G3", email: "g3@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "GOLD_PASS", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: locker_rental_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.LockerRental]
        distinguishing_aspect: "LockerRental has common_fields:false — response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["a paid order, a locker"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "LImm Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/lockers"
              payload: { bank_code: "B", hourly_rate_cents: 300 }
              as: ParkManager
              captures: { locker_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G4", email: "g4@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /locker-rentals"
              payload: { locker_id: "${locker_id}", order_id: "${order_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T12:30:00Z" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { lr_id: $.data.id, hb: $.data.hours_billed }
          assert:
            - "LockerRental.hours_billed == 3 (ceil 2.5h); response has id + created_at, no version key"

      - name: entry_window_requires_existing_parent_park
        claim_type: Parent Relationships
        grounds: [entities.EntryWindow, "errors[ERR_NOT_FOUND]", "endpoints.POST_/parks/{id}/entry-windows"]
        distinguishing_aspect: "POST /parks/{bad-id}/entry-windows returns ERR_NOT_FOUND because the parent park does not exist."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parks/00000000-0000-0000-0000-000000000000/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 10 }
              as: ParkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: fk_integrity_order_unknown_guest_rejected
        claim_type: Creation
        grounds: [entities.Order.fields.guest_id, "errors[ERR_NOT_FOUND]", endpoints.POST_/orders]
        distinguishing_aspect: "POST /orders with a guest_id that resolves to no Guest returns ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["one park, no matching guest"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "FK Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "00000000-0000-0000-0000-000000000000", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_pending_unfulfilled
        claim_type: Initial State
        grounds: [state_machines.Order, entities.Order.fields.payment_status]
        distinguishing_aspect: "Freshly created Order is payment_status PENDING and fulfillment_status UNFULFILLED."
        test_recipe:
          setup: ["a park and guest"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Init Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Gi", email: "gi@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { ps: $.data.payment_status, fs: $.data.fulfillment_status }
          assert:
            - "Order.payment_status == PENDING and fulfillment_status == UNFULFILLED"

      - name: fulfill_unpaid_order_returns_order_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.payment_status=PAID_&_fulfillment_status=UNFULFILLED_to_fulfillment_status=FULFILLED, "errors[ERR_ORDER_NOT_PAID]"]
        distinguishing_aspect: "POST /orders/{id}/fulfill on a PENDING (unpaid) order returns ERR_ORDER_NOT_PAID."
        test_recipe:
          setup: ["a PENDING order"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "NP Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Gn", email: "gn@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_PAID"

      - name: cancel_paid_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.payment_status=PENDING_to_payment_status=VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/cancel on a PAID order is not a defined transition (cancel only from PENDING) → ERR_INVALID_STATE."
        test_recipe:
          setup: ["a PAID order"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "CP Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Gp", email: "gp@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: pay_already_paid_order_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Order.payment_status=PENDING_to_payment_status=PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/pay twice — the second pay fails ERR_INVALID_STATE (already PAID), no double wallet debit."
        test_recipe:
          setup: ["a PAID order"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Idem Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Gd", email: "gd@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: terminal_void_order_cannot_pay
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After cancel (payment_status VOID, terminal), POST /orders/{id}/pay returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a VOID (cancelled) order"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Term Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Gt", email: "gt@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: window_restrict_blocks_new_assignment_keeps_reservation
        claim_type: guarded transitions
        grounds: [state_machines.EntryWindow.OPEN_to_RESTRICTED, entities.EntryWindow.fields.status]
        distinguishing_aspect: "After restrict, a previously CONFIRMED admission keeps its reservation but a fresh assignment is blocked; restrict is a defined OPEN->RESTRICTED transition."
        test_recipe:
          setup: ["an OPEN window with one CONFIRMED admission"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Rstr Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id }
          trigger:
            - call: "POST /entry-windows/${window_id}/restrict"
              payload: {}
              as: ParkManager
              captures: { st: $.data.status }
          assert:
            - "EntryWindow.${window_id}.status == RESTRICTED"

      - name: close_window_with_force_flag
        claim_type: Valid Transition
        grounds: [state_machines.EntryWindow.OPEN_to_CLOSED, "endpoints.POST_/entry-windows/{id}/close"]
        distinguishing_aspect: "POST /entry-windows/{id}/close with force true closes an OPEN window even if it has reservations."
        test_recipe:
          setup: ["an OPEN window"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Close Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id }
          trigger:
            - call: "POST /entry-windows/${window_id}/close"
              payload: { force: true }
              as: ParkManager
              captures: { st: $.data.status }
          assert:
            - "EntryWindow.${window_id}.status == CLOSED"

      - name: open_window_count_reconciled_on_restrict
        claim_type: Bubble up
        grounds: [entities.Park.fields.open_window_count, state_machines.EntryWindow.OPEN_to_RESTRICTED]
        distinguishing_aspect: "Park.open_window_count decrements from 1 to 0 when its only OPEN window is restricted (derived-field reconciliation)."
        test_recipe:
          setup: ["a park with one OPEN window (open_window_count 1)"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Owc Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id }
          trigger:
            - call: "POST /entry-windows/${window_id}/restrict"
              payload: {}
              as: ParkManager
            - call: "GET /parks/${park_id}"
              payload: {}
              as: ParkManager
              captures: { owc: $.data.open_window_count }
          assert:
            - "Park.${park_id}.open_window_count == 0 after restricting its only OPEN window"

      - name: cabana_rental_confirmed_on_order_fulfill
        claim_type: Cross-entity
        grounds: [state_machines.CabanaRental.HELD_to_CONFIRMED, state_machines.Order.payment_status=PAID_&_fulfillment_status=UNFULFILLED_to_fulfillment_status=FULFILLED]
        distinguishing_aspect: "Fulfilling a PAID order promotes its HELD CabanaRental to CONFIRMED (cross-entity side effect)."
        test_recipe:
          setup: ["a PAID order with one HELD cabana rental"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "CRf Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T20:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /parks/${park_id}/cabanas"
              payload: { label: "C-2", tier: "STANDARD", daily_rate_cents: 9000 }
              as: ParkManager
              captures: { cabana_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Gcr", email: "gcr@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /cabana-rentals"
              payload: { cabana_id: "${cabana_id}", order_id: "${order_id}", entry_window_id: "${window_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T14:00:00Z", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /cabana-rentals/${rental_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { st: $.data.status }
          assert:
