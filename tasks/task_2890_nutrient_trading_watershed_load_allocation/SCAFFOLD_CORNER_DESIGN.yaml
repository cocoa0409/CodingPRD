# ===========================================================================
# §1.9 Scaffold Corner Design (Breadth Claim Index)
#   Task 2890 — Nutrient Trading & Watershed Load Allocation
#   Walks references/claim-extraction-guide.md section by section against
#   SCAFFOLD.yaml §1.1-§1.7. `section:` values and `claim_type:` values come
#   only from that guide. Corners already asserted by a §1.8 instance are
#   emitted as `excluded_because:` stubs naming that instance exactly.
#   Every numeric literal in an `assert:` line was computed with Python
#   Decimal / ROUND_HALF_UP against the §1.3 formula it grounds in.
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: watershed_creation_returns_every_declared_field_and_program_defaults
        claim_type: creation
        grounds:
          - entities.Watershed
          - endpoints[POST /watersheds]
          - response_envelope.success
        distinguishing_aspect: "POST /watersheds with all required inputs returns 201, echoes every input field, and stamps the derived program fields (program_status PROVISIONAL, trading_enabled false, reserve_pool_lbs 0.00, serial_counter 0)."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          assert:
            - "response status is 201 and response_type == \"object\""
            - "meta.api_request_id is present and meta.api_request_timestamp is present"
            - "data.name == \"Scioto Headwaters\", data.state_code == \"OH\", data.watershed_code == \"SCR\", data.pollutant == \"TOTAL_PHOSPHORUS\""
            - "data.baseline_year == 2020 and data.baseline_load_lbs_yr == 120000.00"
            - "data.program_status == \"PROVISIONAL\" and data.trading_enabled == false"
            - "data.reserve_pool_lbs == 0.00, data.serial_counter == 0, data.allocated_wla_total_lbs_yr == 0.00, data.allocated_la_total_lbs_yr == 0.00"
            - "data.id is a UUID, data.version == 1, data.created_at == 2026-06-15T00:00:00Z, data.updated_at == 2026-06-15T00:00:00Z"

      - name: reach_retrieval_returns_the_stored_row_including_its_downstream_link
        claim_type: retrieval
        grounds:
          - entities.Reach
          - endpoints[GET /reaches/{reach_id}]
        distinguishing_aspect: "GET /reaches/{reach_id} returns exactly the row written by POST /reaches, including downstream_reach_id and delivery_factor at 4 decimal places."
        test_recipe:
          setup:
            - "Watershed SCR exists with outlet reach R_OUT and a mainstem reach R_MID pointing downstream at R_OUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
          trigger:
            - call: "GET /reaches/${r_mid_id}"
              as: TmdlAnalyst
          assert:
            - "response status is 200 and response_type == \"object\""
            - "data.id == ${r_mid_id} and data.watershed_id == ${w_id}"
            - "data.reach_code == \"R_MID\", data.trading_zone_code == \"Z2\", data.reach_class == \"MAINSTEM\""
            - "data.delivery_factor == 0.9000 and data.downstream_reach_id == ${r_out_id}"
            - "data.version == 1"

      - name: practice_project_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /practice-projects]
          - pagination_defaults
          - pagination_fields
        distinguishing_aspect: "With three projects on one producer, GET /practice-projects?producer_id=...&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Watershed SCR with reach R_UP in eligible zone Z1."
            - "Producer Bluegrass Farms LLC owns three REGISTERED projects on tracts T-101, T-102 and T-103, all COVER_CROP with non-overlapping tract keys."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-101", practice_type: "COVER_CROP", enrolled_acres: 100.00, baseline_met: true, pre_load_lbs_yr: 950.50, post_load_lbs_yr: 300.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_1_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-102", practice_type: "COVER_CROP", enrolled_acres: 60.00, baseline_met: true, pre_load_lbs_yr: 600.00, post_load_lbs_yr: 200.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_2_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-103", practice_type: "COVER_CROP", enrolled_acres: 30.00, baseline_met: true, pre_load_lbs_yr: 300.00, post_load_lbs_yr: 100.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_3_id: $.data.id }
          trigger:
            - call: "GET /practice-projects"
              payload: { producer_id: "${prod_id}", limit: 2, offset: 0 }
              as: RegistryAdministrator
            - call: "GET /practice-projects"
              payload: { producer_id: "${prod_id}", limit: 2, offset: 2 }
              as: RegistryAdministrator
            - call: "GET /practice-projects"
              payload: { producer_id: "${prod_id}" }
              as: RegistryAdministrator
          assert:
            - "trigger call 1: response_type == \"array\", len(data) == 2, meta.total_count == 3, meta.has_more == true, meta.limit == 2, meta.offset == 0"
            - "trigger call 2: len(data) == 1, meta.total_count == 3, meta.has_more == false, meta.offset == 2"
            - "trigger call 3 omits limit: meta.limit == 10 (pagination_defaults.limit), meta.offset == 0, len(data) == 3, meta.has_more == false"

      - name: watershed_get_with_unknown_uuid_returns_watershed_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /watersheds/{watershed_id}]
          - validations[priority=3]
          - errors[ERR_WATERSHED_NOT_FOUND]
        distinguishing_aspect: "GET /watersheds/{watershed_id} with a syntactically valid but unused UUID returns 404 ERR_WATERSHED_NOT_FOUND, and the error envelope carries response_type \"error\"."
        test_recipe:
          setup:
            - "One watershed exists so the table is non-empty and the 404 cannot be an artefact of an empty collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /watersheds/00000000-0000-4000-8000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404"
            - "response_type == \"error\" and data.error_id == \"ERR_WATERSHED_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "GET /watersheds/${w_id} still responds 200 (the real row is untouched)"

      - name: tmdl_assessment_missing_required_loading_capacity_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /tmdl-assessments]
          - entities.TmdlAssessment.fields.loading_capacity_lbs_yr
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /tmdl-assessments without loading_capacity_lbs_yr — an input field with no default — returns 422 ERR_INVALID_REQUEST and writes no row."
        test_recipe:
          setup:
            - "Watershed SCR exists so the body-referenced watershed_id resolves and the failure can only be the missing field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /tmdl-assessments?watershed_id=${w_id} returns meta.total_count == 0"

      - name: watershed_optional_ratio_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Watershed.fields.interim_target_pct
          - entities.Watershed.fields.uncertainty_ratio
          - entities.Watershed.fields.retirement_ratio
          - entities.Watershed.fields.equivalence_ratio
          - endpoints[POST /watersheds]
        distinguishing_aspect: "Omitting the four optional program-rule ratios yields interim_target_pct 25.00, uncertainty_ratio 2.0000, retirement_ratio 0.1000 and equivalence_ratio 1.0000 — the §1.1 defaults, not nulls or zeros."
        test_recipe:
          setup:
            - "Empty database with the clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /watersheds"
              payload: { name: "Default Creek", state_code: "OH", watershed_code: "DEF", pollutant: "TOTAL_NITROGEN", baseline_year: 2021, baseline_load_lbs_yr: 80000.00, eligible_zone_codes: ["Z1"] }
              as: ProgramAdministrator
              captures: { w_def_id: $.data.id }
          assert:
            - "response status is 201"
            - "data.interim_target_pct == 25.00"
            - "data.uncertainty_ratio == 2.0000"
            - "data.retirement_ratio == 0.1000"
            - "data.equivalence_ratio == 1.0000"
            - "data.eligible_zone_codes == [\"Z1\"]"

      - name: monitoring_sample_computed_load_is_derived_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.monitoring_sample_load
          - entities.MonitoringSample.fields.computed_load_lbs_yr
          - endpoints[POST /monitoring-samples]
        distinguishing_aspect: "computed_load_lbs_yr is `source: computed`: a sample of 0.0500 mg/L at 1000.00 cfs stores exactly 98422.25 lbs/yr from the LB_PER_DAY_FACTOR 5.393 x DAYS_PER_YEAR 365 formula, and a computed_load_lbs_yr sent in the body is not accepted as an input field at all."
        test_recipe:
          setup:
            - "Watershed SCR with compliance-point reach R_OUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
          trigger:
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_out_id}", sample_datetime: "2026-07-01T12:00:00Z", measured_conc_mg_l: 0.0500, flow_cfs: 1000.00 }
              as: TmdlAnalyst
              captures: { ms_id: $.data.id }
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_out_id}", sample_datetime: "2026-07-02T12:00:00Z", measured_conc_mg_l: 0.0250, flow_cfs: 100.00, qa_status: "REJECTED" }
              as: TmdlAnalyst
              captures: { ms_rej_id: $.data.id }
          assert:
            - "trigger call 1: data.computed_load_lbs_yr == 98422.25"
            - "trigger call 1: data.qa_status == \"ACCEPTED\" (the §1.1 default)"
            - "trigger call 2: data.computed_load_lbs_yr == 4921.11 (the load is computed even for a REJECTED sample; qa_status only affects downstream input sets)"
            - "GET /monitoring-samples/${ms_id} returns data.computed_load_lbs_yr == 98422.25"

      - name: producer_system_fields_are_server_generated_and_client_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Producer
          - endpoints[POST /producers]
        distinguishing_aspect: "id, created_at, updated_at and version are `source: system`: the server mints its own UUID and stamps both timestamps from the logical clock, so a client-supplied id in the body is not an accepted input key."
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-06-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
          assert:
            - "response status is 201"
            - "data.id is a server-minted UUID"
            - "data.version == 1"
            - "data.created_at == 2026-06-15T00:00:00Z and data.updated_at == 2026-06-15T00:00:00Z"
            - "GET /producers/${prod_id} returns the same id, created_at and version"

      - name: reach_class_outside_the_declared_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Reach.fields.reach_class
          - endpoints[POST /reaches]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "reach_class is constrained to HEADWATER | MAINSTEM | COMPLIANCE_POINT | BACKGROUND, so \"TRIBUTARY\" returns 422 ERR_INVALID_REQUEST and no Reach row is created."
        test_recipe:
          setup:
            - "Watershed SCR exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_BAD", trading_zone_code: "Z2", reach_class: "TRIBUTARY", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /reaches?watershed_id=${w_id} returns meta.total_count == 0"

      - name: verification_event_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.VerificationEvent
          - endpoints[POST /verification-events]
          - endpoints[GET /verification-events/{verification_event_id}]
        distinguishing_aspect: "VerificationEvent declares common_fields: false, so its response carries id and created_at but no version and no updated_at, and §1.5 exposes no endpoint that mutates an existing event — a superseding fact is recorded as a new event row."
        test_recipe:
          setup:
            - "Watershed SCR with reach R_UP, producer Bluegrass Farms LLC and REGISTERED project PP-A on tract T-101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-101", practice_type: "COVER_CROP", enrolled_acres: 100.00, baseline_met: true, pre_load_lbs_yr: 950.50, post_load_lbs_yr: 300.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_a_id: $.data.id }
          trigger:
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "BASELINE", outcome: "PASS", narrative: "Baseline soil sampling complete on tract T-101." }
              as: PracticeVerifier
              as_user_id: "verifier-1"
              captures: { ve_id: $.data.id }
            - call: "GET /verification-events/${ve_id}"
              as: PracticeVerifier
              as_user_id: "verifier-1"
          assert:
            - "trigger call 1 responds 201 with data.resulting_project_status == \"BASELINE_VERIFIED\" and data.verifier_user_id == \"verifier-1\""
            - "trigger call 1: data.created_at == 2026-06-15T00:00:00Z"
            - "trigger call 1: the response body contains no `version` key and no `updated_at` key"
            - "trigger call 2 returns the identical body (the event row is append-only)"
            - "§1.5 declares no PATCH/PUT/DELETE endpoint under /verification-events"

      - name: source_assessment_with_unknown_parent_assessment_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SourceAssessment.parent
          - entities.SourceAssessment.fields.tmdl_assessment_id
          - validations[priority=7]
          - errors[ERR_TMDL_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "SourceAssessment declares parent TmdlAssessment; a body-referenced tmdl_assessment_id that does not exist returns 404 ERR_TMDL_ASSESSMENT_NOT_FOUND, which outranks the same request's watershed-mismatch and shape concerns."
        test_recipe:
          setup:
            - "Watershed SCR with reach R_MID exists; no TmdlAssessment has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000 }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
          trigger:
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "00000000-0000-4000-8000-0000000000aa", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000 }
              as: TmdlAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and data.error_id == \"ERR_TMDL_ASSESSMENT_NOT_FOUND\""
            - "GET /source-assessments?reach_id=${r_mid_id} returns meta.total_count == 0"

      - name: credit_transaction_links_batch_and_permit_across_two_aggregates
        claim_type: graph_topology
        grounds:
