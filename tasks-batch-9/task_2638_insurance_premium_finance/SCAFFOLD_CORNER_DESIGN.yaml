            - "${tl_count} == 0 — voiding from PENDING_VERIFICATION decrements the counter the submit incremented"
            - "${tl_e1} == ${tl_e2} == ${tl_e3} == 'ERR_AGREEMENT_STATE_INVALID', each with HTTP 409"
            - "${tl_e4} == 'ERR_AGREEMENT_STATE_INVALID' with HTTP 409 — no Payment row may be attached to a terminal note, and GET /agreements/${tl_agr}/payments returns total_count == 0"
            - "${tl_final_status} == 'VOID' and ${tl_final_ver} == 3 — four refusals produced zero version bumps, so no side effect leaked"

      - name: idempotency_second_reverse_and_second_waive_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - state_machines.LateFeeAssessment.OUTSTANDING_to_WAIVED
          - errors[ERR_PAYMENT_ALREADY_REVERSED]
          - errors[ERR_LATE_FEE_NOT_OUTSTANDING]
          - validations.priority_18_ERR_PAYMENT_ALREADY_REVERSED
          - validations.priority_19_ERR_LATE_FEE_NOT_OUTSTANDING
        distinguishing_aspect: |
          Replaying a compensating action must fail rather than compensate twice. The same reverse and
          the same waive are each issued a second time and must return their own 409 codes —
          ERR_PAYMENT_ALREADY_REVERSED and ERR_LATE_FEE_NOT_OUTSTANDING, not a shared conflict — and,
          critically, the ledger must be UNCHANGED by the replay: a double reversal would inflate
          principal_balance_cents by the same 83666 twice, which is the exact failure this pins.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License and the 600k note ACTIVE"
            - "clock moved to 2026-10-12, one servicing run performed, so installment 1 is PAST_DUE with one OUTSTANDING 4497 late fee"
