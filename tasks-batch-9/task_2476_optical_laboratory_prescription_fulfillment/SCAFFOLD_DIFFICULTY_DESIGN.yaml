      - name: remake_on_a_settled_order_cascades_four_hops_into_refund_due
        grounds:
          - state_machines.RxOrder.fulfillment_status.LAB_COMPLETE_to_REMAKE_PENDING
          - state_machines.RxOrder.billing_status.PATIENT_SETTLED_to_REFUND_DUE
          - calculations.remake_writeoff_and_chargeback
          - calculations.warranty_coverage_window
          - endpoints.POST_/remake-cases
        distinguishing_aspect: |
          Depth-4 chain fired by POST /remake-cases on a fully settled order: HOP 1 scraps the
          released LabJob, HOP 2 flips fulfillment_status to REMAKE_PENDING and increments
          remake_count, HOP 3 (caused only by HOP 2's counter change plus warranty coverage) writes a
          10494-cent lab writeoff and drops patient_portion_cents to 31483, and HOP 4 (caused only by
          HOP 3 leaving patient_paid_cents above patient_portion_cents) flips billing_status
          PATIENT_SETTLED -> REFUND_DUE. Removing any single hop leaves the next one unexplained.
