            - call: "POST /behavioral-health/hearings/${hr3}/record-outcome"
              payload: { outcome: "CONTINUED", findings_note: "Third continuance requested." }
              as: ComplianceOfficer
              captures: { cont_err: $.data.error_id }
          assert:
            - "after the first outcome: HoldPetition.${pet_cy}.status == \"CONTINUED\", continuance_count == 1, CourtHearing.${hr1}.status == \"CONTINUED\""
            - "after scheduling hr2: HoldPetition.${pet_cy}.status == \"HEARING_SCHEDULED\" (the cycle re-enters a previously occupied state)"
            - "after the second outcome: HoldPetition.${pet_cy}.status == \"CONTINUED\", continuance_count == 2"
            - "after scheduling hr3: HoldPetition.${pet_cy}.status == \"HEARING_SCHEDULED\" and Clinician.${c_adv}.booked_docket_minutes == 30"
            - "the third outcome call is HTTP 409 with ${cont_err} == \"ERR_CONTINUANCE_LIMIT_REACHED\""
            - "CourtHearing.${hr3}.status == \"SCHEDULED\" and CourtHearing.${hr3}.outcome == \"PENDING\" (no side effects fired)"
            - "HoldPetition.${pet_cy}.continuance_count == 2 (unchanged) and HoldOrder.${h_cy}.status == \"ACTIVE\""

