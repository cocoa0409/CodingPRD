  - section: validations
    instances:
      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent with neither an X-User-Role nor an X-User-ID header (the `as: NONE` marker below means both headers are omitted) returns 401 ERR_UNAUTHENTICATED before any other check runs."
        test_recipe:
          setup:
            - "One engagement exists so the endpoint would otherwise return data."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Guarded", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "GET /soc/engagements"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "response_type == error"

      - name: corner_unknown_role_header_returns_unknown_role
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_UNKNOWN_ROLE]", "roles.PlatformAdmin"]
        distinguishing_aspect: "An X-User-Role value outside the seven declared roles (here the literal string SuperUser) returns 401 ERR_UNKNOWN_ROLE, distinct from the 403 ERR_ROLE_NOT_PERMITTED returned for a declared but disallowed role."
        test_recipe:
          setup:
            - "One engagement exists."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Guarded", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "GET /soc/engagements/${eng}"
              payload: {}
              as: SuperUser
              as_user_id: "who-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNKNOWN_ROLE"

      - name: corner_pagination_limit_zero_and_over_max_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=80]", "errors[ERR_INVALID_PAGINATION]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit must sit in the closed range [1, 100]: limit=0 and limit=101 are both rejected with 422 ERR_INVALID_PAGINATION, while limit=100 succeeds — the boundary is inclusive at both ends."
        test_recipe:
          setup:
            - "One engagement exists."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Paginate", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
