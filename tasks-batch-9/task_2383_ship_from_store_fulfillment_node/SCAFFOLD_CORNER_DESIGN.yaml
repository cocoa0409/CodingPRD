            - "${e_noscope} is a 401 and not a 403 ERR_STORE_SCOPE_VIOLATION: StoreAssociate identity is entity_backed on Store, so a missing X-User-ID fails authentication at priority 1 long before the priority-6 scope comparison"
            - "${e_ladder} is a 401 and not a 400 even though the body omits the required order_code and carries an out-of-range destination_zone 99 plus the unknown service_level TELEPORT, proving priority 1 outranks priority 3"
            - "nothing is written by any of the five calls: GET /stores as NetworkPlanner returns total_count 1, GET /orders returns total_count 1 and FulfillmentAssignment.${a1}.status == ASSIGNED with version 1"

      - name: a_store_associate_cannot_write_another_nodes_rows_while_reads_stay_network_wide
        claim_type: peer_roles
        grounds:
