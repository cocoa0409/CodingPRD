          assert:
            - "captured err_state == 'ERR_BOND_ISSUE_STATE_INVALID' with HTTP 409; BondIssue.${bond_id}.closing_date is still '2026-09-15T00:00:00Z', so the replayed payload changed nothing"
            - "captured err_negarb == 'ERR_NEGATIVE_ARBITRAGE_ALLOWANCE_EXCEEDED' with HTTP 422 (8,044,444 projected against an allowance of 4,000,000)"
            - "the refused funding leaves DrawRequest.${long_id}.status == APPROVED, funding_date null and negative_arbitrage_accrual_cents 0"
            - "after the refusal BondIssue.${bond_id}.cumulative_funded_cents == 0, undrawn_cents == 200000000 and negative_arbitrage_cents == 0"
            - "Project.${proj_id}.development_status is still FINANCED after the refused funding - no first-funding side effect fired"
            - "captured short_accrual == 1333333 (200,000,000 * 800 bps * 30/360) and the 30-day draw funds successfully"
            - "after the successful funding Project.${proj_id}.development_status == UNDER_CONSTRUCTION and BondIssue.${bond_id}.negative_arbitrage_cents == 1333333"
            - "captured err_occ == 'ERR_OCCUPANCY_BELOW_STABILIZATION' with HTTP 422: T3 coverage is 12000 bps and passes, but the weakest month is 7500 bps against the 9000 bps floor"
            - "after the refused conversion BondIssue.${bond_id}.status == ISSUED with dscr_bps null, min_occupancy_bps null and conversion_date null, and Project.${proj_id}.development_status == PLACED_IN_SERVICE"

      - name: credit_and_delivery_replays_and_the_one_live_allocation_rule
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREDIT_ALLOCATION_STATE_INVALID]
          - errors[ERR_DELIVERY_STATE_INVALID]
          - errors[ERR_ALLOCATION_ALREADY_EXISTS]
          - validations[priority=81]
          - validations[priority=135]
          - state_machines.CreditAllocation.PENDING_to_ISSUED
          - state_machines.InvestorDelivery.DELIVERED_to_ACCEPTED
        distinguishing_aspect: |
          Both replay probes are refused for the same structural reason - the
          trigger has no outgoing transition from the row's current state - yet they
          must return two different entity-specific codes rather than one generic
          409, and the payloads of the refused calls must not leak (form_8609_number
          stays on the original number). The third probe exercises both halves of
          the one-live-allocation rule from the same fixture: a second CreditAllocation
          while one is ISSUED and a second VolumeCapAllocation while one is COMMITTED
          both return ERR_ALLOCATION_ALREADY_EXISTS.
