      - name: sm_injury_analysis_reposting_voids_the_prior_draft
        claim_type: side_effect_execution
        grounds:
          - state_machines.InjuryAnalysis.DRAFT_to_VOIDED
          - calculations.injury_net_analysis
        distinguishing_aspect: >-
          At most one DRAFT analysis exists per application: re-posting VOIDS the
          previous DRAFT (terminal) instead of editing it, the two rows keep their
          own frozen figures, and pending_review_count nets to zero because one
          DRAFT replaced another.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A with a DRAFT CHANGE_OF_USE application for 100.00 AF and one INSTANTANEOUS_DEPLETION analysis over 4.00 river miles."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: INSTANTANEOUS_DEPLETION, pod_move_miles: 4.00}, as: WaterRightsAnalyst, captures: {ia1: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {pending_before: "$.data.pending_review_count"}}
          trigger:
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 4.00, return_flow_credit_af: 10.00}, as: WaterRightsAnalyst, captures: {ia2: "$.data.id"}}
            - {call: "GET /injury-analyses/${ia1}", as: WaterRightsAnalyst}
            - {call: "GET /transfer-applications/${app}/injury-analyses", payload: {status: DRAFT}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst}
          assert:
            - "The new analysis is DRAFT with gross_depletion_af 78.00 (SEASONAL_AVERAGE ignores pod_move_miles entirely), offset_af 0.00 and net_injury_af 68.00."
            - "The first analysis is VOIDED (terminal) and still carries its own frozen figures: distance_factor 0.9400, gross_depletion_af 86.48, net_injury_af 86.48."
            - "The DRAFT listing returns exactly 1 row (the new analysis); the listing without a status filter returns 2 rows ordered by created_at ASC."
            - "pending_review_count is unchanged from ${pending_before} — a DRAFT replacing a DRAFT is a net-zero move — while the right's version was still bumped."

      - name: sm_condition_violation_cascade_suspends_right_and_freezes_account
        claim_type: side_effect_execution
        grounds:
