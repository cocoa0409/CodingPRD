# =============================================================================
# PRD Benchmark Scaffold — Utility Rate Case & Cost-of-Service Filing
# =============================================================================

scenario: |
  2005. Utility Rate Case & Cost-of-Service Filing (state public utility commission filing): test-year data assembly & adjustments, cost allocation by class & rate design proposal, revenue requirement calculation & rate base, discovery/data-request response tracking, intervenor settlement negotiation, approved-rate implementation & bill impact, deferred/regulatory asset amortization, compliance filing & true-up

domain_name: utility-rate-case
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain   # with segregation-of-duties on Adjustment verify
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# List ordering (global, deterministic; id is NEVER a sort key)
# =============================================================================
list_ordering: |
  Every list endpoint returns rows ordered by created_at ASC. Rows minted in a
  single cascade share one created_at timestamp; their relative order is the
  cascade's generation order, pinned per collection:
    - AmortizationEntry: period_index ASC
    - SettlementSignatory: generating loop order = Intervenor.created_at ASC,
      tie-break Intervenor.party_name ASC
  For all other collections, recipes capture ids at creation time, so equal
  created_at timestamps never affect observable results. The random/UUID id
  field is never used as a sort key or tie-break anywhere.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RateCase
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Unique docket number, e.g. 'UR-2026-104'", constraints: "unique across all RateCase" }
      - { name: utility_name, type: string, source: input, description: "Utility company name" }
      - { name: test_year_start, type: datetime, source: input, description: "First day of the test year (closed interval start)" }
      - { name: test_year_end, type: datetime, source: input, description: "Last day of the test year (closed interval end; must be > test_year_start)" }
      - { name: return_on_rate_base_bp, type: integer, source: input, description: "Authorized return on rate base in basis points, e.g. 750 = 7.50%", constraints: "1..3000" }
      - { name: proposed_revenue_requirement_cents, type: integer, source: input, description: "Utility's as-filed revenue requirement claim; validated against the computed as-filed figure at submit-filing" }
      - { name: allocation_method, type: enum, source: input, description: "Demand-cost allocation method: COINCIDENT_PEAK | ENERGY_AVERAGE", constraints: "COINCIDENT_PEAK | ENERGY_AVERAGE" }
      - { name: discovery_close_at, type: datetime, source: system, description: "Set at open-discovery = current clock + 120 days; data requests may not be issued after this instant" }
      - { name: authorized_revenue_requirement_cents, type: integer, source: system, description: "Copied from the ADOPTED settlement proposal's proposed_revenue_requirement_cents at issue-order" }
      - { name: present_revenue_total_cents, type: integer, source: computed, description: "Sum of present_revenue_cents over all CustomerClass of this case" }
      - { name: revenue_requirement_as_filed_cents, type: integer, source: computed, description: "Revenue requirement with rate-base input set = RateBaseItem in {SUBMITTED, AUDITED}" }
      - { name: revenue_requirement_as_audited_cents, type: integer, source: computed, description: "Revenue requirement with rate-base input set = RateBaseItem in {AUDITED} only" }
      - { name: revenue_at_approved_rates_cents, type: integer, source: computed, description: "Sum of CustomerClass.approved_revenue_cents over all classes of this case" }
      - { name: overdue_data_request_count, type: integer, source: computed, description: "Count of this case's DataRequest currently in OVERDUE; maintained incrementally by sweeps, responses, rulings, withdrawals" }
      - { name: assented_proposal_count, type: integer, source: computed, description: "Count of this case's SettlementProposal currently in ASSENTED or RECOMMENDED or ADOPTED that reached ASSENTED via full signature; incremented on bubble-up, decremented on rescind-from-ASSENTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | DEFICIENT | ACCEPTED | DISCOVERY | HEARING | SETTLEMENT | ORDER_PENDING | DECIDED | RATES_IMPLEMENTED | COMPLIANCE_MONITORING | CLOSED" }

  - name: Intervenor
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id; case this party intervenes in" }
      - { name: party_name, type: string, source: input, description: "Party name, e.g. 'Industrial Energy Consumers Group'" }
      - { name: representative_name, type: string, source: input, description: "Lead representative full name" }
      - { name: contact_email, type: string, source: input, description: "Service-list email" }
      - { name: status, type: enum, source: system, description: "PARTY | WITHDRAWN" }

  - name: TestYearEntry
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: account_code, type: string, source: input, description: "FERC-style account code" }
      - { name: category, type: enum, source: input, description: "O_AND_M | DEPRECIATION | TAXES", constraints: "O_AND_M | DEPRECIATION | TAXES" }
      - { name: booked_amount_cents, type: integer, source: input, description: "Per-books test-year amount in cents; must be >= 0" }
      - { name: adjusted_amount_cents, type: integer, source: computed, description: "= booked_amount_cents + sum of amount_cents over this entry's Adjustment in {PROPOSED, VERIFIED, DISPUTED, ACCEPTED}; WITHDRAWN and REJECTED excluded" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED" }

  - name: Adjustment
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: test_year_entry_id, type: string, source: input, description: "FK -> TestYearEntry.id; must reference an entry of the same RateCase" }
      - { name: amount_cents, type: integer, source: input, description: "Signed adjustment amount in cents; must be != 0" }
      - { name: reason, type: string, source: input, description: "Known-and-measurable justification text" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the UtilityFiler who created the adjustment" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the UtilityFiler who last verified the adjustment; must differ from proposed_by_user_id" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VERIFIED | DISPUTED | ACCEPTED | REJECTED | WITHDRAWN" }

  - name: RateBaseItem
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: label, type: string, source: input, description: "Item label, e.g. 'Generation plant in service'" }
      - { name: plant_in_service_cents, type: integer, source: input, description: "Gross plant in service; >= 0" }
      - { name: accumulated_depreciation_cents, type: integer, source: input, description: "Accumulated depreciation reserve; >= 0" }
      - { name: working_capital_cents, type: integer, source: input, description: "Cash working capital allowance; >= 0" }
      - { name: accumulated_deferred_taxes_cents, type: integer, source: input, description: "Accumulated deferred income taxes (deduction); >= 0" }
      - { name: net_rate_base_cents, type: integer, source: computed, description: "= plant_in_service_cents - accumulated_depreciation_cents + working_capital_cents - accumulated_deferred_taxes_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AUDITED | EXCEPTION" }

  - name: CustomerClass
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: class_code, type: string, source: input, description: "Class code, e.g. RESIDENTIAL | COMMERCIAL; unique within the case" }
      - { name: customer_count, type: integer, source: input, description: "Average number of customers in the test year; > 0" }
      - { name: monthly_kwh_per_customer, type: integer, source: input, description: "Average monthly kWh per customer; > 0" }
      - { name: annual_kwh, type: integer, source: input, description: "Class annual energy, informational consistency anchor; > 0" }
      - { name: coincident_peak_kw, type: integer, source: input, description: "Class contribution to system coincident peak; > 0" }
      - { name: average_demand_kw, type: integer, source: input, description: "Class average demand; > 0" }
      - { name: present_customer_charge_cents, type: integer, source: input, description: "Present monthly customer charge per customer; >= 0" }
      - { name: present_tiers, type: array, source: input, description: "Present marginal energy tiers, ascending: [{up_to_kwh: integer|null, rate_mills: integer}]; exactly one terminal tier has up_to_kwh null; rate_mills = thousandths of a dollar per kWh" }
      - { name: present_revenue_cents, type: integer, source: computed, description: "Annual present-rate revenue = 12 * customer_count * (present_customer_charge_cents + tiered_marginal(monthly_kwh_per_customer, present_tiers))" }
      - { name: allocated_cost_cents, type: integer, source: computed, description: "Class allocated cost of service under the case's allocation_method, after residual assignment" }
      - { name: approved_revenue_cents, type: integer, source: computed, description: "Set at issue-order = proposed_revenue_cents of this class's APPROVED TariffRate; null until then" }

  - name: DataRequest
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: issuer_kind, type: enum, source: system, description: "INTERVENOR | STAFF; derived from the caller's role" }
      - { name: issuing_intervenor_id, type: string, source: input, description: "FK -> Intervenor.id; required when caller is IntervenorRep and must equal X-User-ID; must be absent when caller is CommissionStaff; nullable" }
      - { name: subject, type: string, source: input, description: "Short subject line" }
      - { name: body, type: string, source: input, description: "Full question text" }
      - { name: referenced_adjustment_id, type: string, source: input, description: "FK -> Adjustment.id; optional targeted-discovery reference; must belong to the same RateCase; nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: response_due_at, type: datetime, source: system, description: "= issued_at + 10 days" }
      - { name: extended_due_at, type: datetime, source: system, description: "Set when ALJ overrules an objection = ruling clock time + 5 days; null otherwise" }
      - { name: response_text, type: string, source: system, description: "Utility's response body; null until responded" }
      - { name: objection_reason, type: string, source: system, description: "Utility's objection basis; null unless objected" }
      - { name: ruling, type: enum, source: system, description: "SUSTAINED | OVERRULED | null" }
      - { name: status, type: enum, source: system, description: "ISSUED | OBJECTED | RESPOND_REQUIRED | OVERDUE | RESPONDED | CLOSED | WITHDRAWN" }

  - name: SettlementProposal
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: round_number, type: integer, source: system, description: "Per-case monotone sequence: 1 for the first proposal, else max(existing round_number) + 1" }
      - { name: proposed_revenue_requirement_cents, type: integer, source: input, description: "Settlement revenue requirement; must be <= case.proposed_revenue_requirement_cents" }
      - { name: terms, type: string, source: input, description: "Settlement terms text" }
      - { name: signature_count, type: integer, source: computed, description: "Count of this proposal's SettlementSignatory in SIGNED" }
      - { name: required_signature_count, type: integer, source: computed, description: "Count of this proposal's SettlementSignatory generated at circulate (status PARTY intervenors at that instant)" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_NEGOTIATION | ASSENTED | RECOMMENDED | ADOPTED | REMANDED | SUPERSEDED" }

  - name: SettlementSignatory
    parent: null
    common_fields: true
    fields:
      - { name: settlement_proposal_id, type: string, source: system, description: "FK -> SettlementProposal.id" }
      - { name: intervenor_id, type: string, source: system, description: "FK -> Intervenor.id" }
      - { name: signed_at, type: datetime, source: system, description: "Clock time of signature; null until SIGNED" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | DECLINED | RESCINDED | VOID" }

  - name: RegulatoryAsset
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: asset_name, type: string, source: input, description: "Asset label, e.g. 'Storm restoration deferral'" }
      - { name: principal_cents, type: integer, source: input, description: "Deferred principal; > 0" }
      - { name: incurrence_start, type: datetime, source: input, description: "First day of the incurrence window (closed interval)" }
      - { name: incurrence_end, type: datetime, source: input, description: "Last day of the incurrence window (closed interval); >= incurrence_start; window must not intersect the case test year" }
      - { name: amortization_months, type: integer, source: input, description: "Number of monthly installments; > 0" }
      - { name: monthly_base_cents, type: integer, source: computed, description: "= floor(principal_cents / amortization_months)" }
      - { name: final_month_cents, type: integer, source: computed, description: "= principal_cents - monthly_base_cents * (amortization_months - 1); absorbs the rounding remainder" }
      - { name: amortized_to_date_cents, type: integer, source: computed, description: "Sum of amount_cents over this asset's AmortizationEntry in POSTED" }
      - { name: status, type: enum, source: system, description: "DEFERRED | APPROVED_FOR_AMORTIZATION | AMORTIZING | FULLY_AMORTIZED | DISALLOWED" }

  - name: AmortizationEntry
    parent: null
    common_fields: true
    fields:
      - { name: regulatory_asset_id, type: string, source: system, description: "FK -> RegulatoryAsset.id" }
      - { name: rate_case_id, type: string, source: system, description: "FK -> RateCase.id; denormalized from the owning asset for filtering" }
      - { name: period_index, type: integer, source: system, description: "1-based installment index within the asset's schedule" }
      - { name: amount_cents, type: integer, source: system, description: "= monthly_base_cents for period_index < amortization_months; = final_month_cents for the last period" }
      - { name: posted_at, type: datetime, source: system, description: "Clock time of posting; null until POSTED" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | REVERSED" }

  - name: TariffRate
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: customer_class_id, type: string, source: input, description: "FK -> CustomerClass.id; must reference a class of the same RateCase" }
      - { name: label, type: string, source: input, description: "Tariff schedule label" }
      - { name: proposed_customer_charge_cents, type: integer, source: input, description: "Proposed monthly customer charge; >= 0" }
      - { name: proposed_tiers, type: array, source: input, description: "Proposed marginal energy tiers, ascending: [{up_to_kwh: integer|null, rate_mills: integer}]; exactly one terminal tier has up_to_kwh null" }
      - { name: effective_start, type: datetime, source: input, description: "Effective window start (half-open, inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Effective window end (half-open, exclusive); null = open-ended; must be > effective_start when present; nullable" }
      - { name: proposed_revenue_cents, type: integer, source: computed, description: "Annual revenue under this tariff = 12 * customer_count * (proposed_customer_charge_cents + tiered_marginal(monthly_kwh_per_customer, proposed_tiers)) over the referenced class" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | EFFECTIVE | SUPERSEDED" }

  - name: ComplianceFiling
    parent: null
    common_fields: true
    fields:
      - { name: rate_case_id, type: string, source: input, description: "FK -> RateCase.id" }
      - { name: period_label, type: string, source: input, description: "Compliance period label, e.g. 'RATE_YEAR_1'" }
      - { name: actual_revenue_by_class, type: array, source: input, description: "[{class_code: string, actual_revenue_cents: integer}]; must cover every CustomerClass of the case exactly once" }
      - { name: actual_total_revenue_cents, type: integer, source: computed, description: "Sum of actual_revenue_cents over actual_revenue_by_class" }
      - { name: true_up_delta_cents, type: integer, source: computed, description: "= actual_total_revenue_cents - authorized_revenue_requirement_cents; computed at submit" }
      - { name: true_up_action, type: enum, source: computed, description: "NONE | SURCHARGE | REFUND; NONE iff abs(true_up_delta_cents) <= true-up threshold; delta > 0 -> REFUND (over-collection), delta < 0 -> SURCHARGE", constraints: "NONE | SURCHARGE | REFUND" }
      - { name: class_true_up_lines, type: array, source: computed, description: "[{class_code, line_cents}]; per-class allocation of true_up_delta_cents by actual-revenue share, round_half_away_from_zero per line, residual assigned to the class with the largest actual_revenue_cents (tie: class_code ASC)" }
      - { name: supersedes_filing_id, type: string, source: system, description: "FK -> ComplianceFiling.id of the filing this one supersedes; null for the first filing of a case; nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REMANDED | SUPERSEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RateCase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: POST /api/v1/rate-cases/{caseId}/submit-filing
        actor: UtilityFiler
        preconditions:
          - "Case in {DRAFT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
          - "Case-level guards are evaluated in this pinned order: (1) at least one TestYearEntry exists (ERR_NO_TEST_YEAR_ENTRIES); (2) every TestYearEntry of the case is LOCKED (ERR_ENTRIES_NOT_LOCKED); (3) zero Adjustment of the case in {PROPOSED, DISPUTED} (ERR_UNRESOLVED_ADJUSTMENTS); (4) at least one RateBaseItem in {SUBMITTED, AUDITED} (ERR_NO_RATE_BASE_ITEMS)"
          - "Fiscal guards, evaluated after all case-level guards and in this order: (1) computed as-filed revenue requirement > 0 (ERR_NONPOSITIVE_REVENUE_REQUIREMENT); (2) abs(proposed_revenue_requirement_cents - computed as-filed revenue requirement) <= 100 cents (ERR_RR_MISMATCH)"
        side_effects:
          - "All VERIFIED Adjustment of the case -> ACCEPTED"
          - "status -> FILED"

      - from: DEFICIENT
        to: FILED
        trigger: POST /api/v1/rate-cases/{caseId}/submit-filing
        actor: UtilityFiler
        preconditions: ["Same as DRAFT -> FILED"]
        side_effects: ["Same as DRAFT -> FILED"]

      - from: FILED
        to: ACCEPTED
        trigger: POST /api/v1/rate-cases/{caseId}/deficiency-review with outcome=ACCEPTED
        actor: CommissionStaff
        preconditions:
          - "Case in FILED (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> ACCEPTED"]

      - from: FILED
        to: DEFICIENT
        trigger: POST /api/v1/rate-cases/{caseId}/deficiency-review with outcome=DEFICIENT
        actor: CommissionStaff
        preconditions:
          - "Case in FILED (ERR_INVALID_CASE_STATE)"
          - "deficiency_notes present and non-empty (ERR_DEFICIENCY_NOTES_REQUIRED)"
        side_effects: ["status -> DEFICIENT"]

      - from: ACCEPTED
        to: DISCOVERY
        trigger: POST /api/v1/rate-cases/{caseId}/open-discovery
        actor: CommissionStaff
        preconditions:
          - "Case in ACCEPTED (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "discovery_close_at = current clock + 120 days"
          - "status -> DISCOVERY"

      - from: DISCOVERY
        to: HEARING
        trigger: POST /api/v1/rate-cases/{caseId}/advance-to-hearing
        actor: ALJ
        preconditions:
          - "Case in DISCOVERY (ERR_INVALID_CASE_STATE)"
          - "overdue_data_request_count == 0 (ERR_OVERDUE_DATA_REQUESTS_EXIST)"
        side_effects: ["status -> HEARING"]

      - from: HEARING
        to: SETTLEMENT
        trigger: POST /api/v1/rate-cases/{caseId}/open-settlement-window
        actor: ALJ
        preconditions:
          - "Case in HEARING (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> SETTLEMENT"]

      - from: SETTLEMENT
        to: ORDER_PENDING
        trigger: POST /api/v1/rate-cases/{caseId}/advance-to-order-pending
        actor: ALJ
        preconditions:
          - "Case in SETTLEMENT (ERR_INVALID_CASE_STATE)"
          - "At least one SettlementProposal of the case in RECOMMENDED (ERR_NO_RECOMMENDED_SETTLEMENT)"
        side_effects: ["status -> ORDER_PENDING"]

      - from: ORDER_PENDING
        to: DECIDED
        trigger: POST /api/v1/rate-cases/{caseId}/issue-order
        actor: ALJ
        preconditions:
          - "Case in ORDER_PENDING (ERR_INVALID_CASE_STATE)"
          - "Every id in approved_tariff_ids references a TariffRate of this case in PROPOSED (ERR_INVALID_TARIFF_STATE); tariff ids are validated BEFORE asset ids"
          - "Every id in approved_asset_ids references a RegulatoryAsset of this case in DEFERRED (ERR_INVALID_ASSET_STATE)"
        side_effects:
          - "authorized_revenue_requirement_cents := the RECOMMENDED proposal's proposed_revenue_requirement_cents (if several RECOMMENDED, the one with the largest round_number; tie impossible)"
          - "That RECOMMENDED SettlementProposal -> ADOPTED"
          - "Hop 1: each listed TariffRate PROPOSED -> APPROVED; each unlisted PROPOSED TariffRate -> REJECTED"
          - "Hop 2 (caused by each tariff approval): CustomerClass.approved_revenue_cents := the approved tariff's proposed_revenue_cents"
          - "Hop 3 (caused by each class recompute): RateCase.revenue_at_approved_rates_cents := sum of approved_revenue_cents over all classes"
          - "Each listed RegulatoryAsset DEFERRED -> APPROVED_FOR_AMORTIZATION and its AmortizationEntry rows are generated (period_index 1..amortization_months, amounts per amortization_schedule, status PENDING)"
          - "Each unlisted DEFERRED RegulatoryAsset -> DISALLOWED"
          - "status -> DECIDED"

      - from: DECIDED
        to: RATES_IMPLEMENTED
        trigger: POST /api/v1/rate-cases/{caseId}/implement-rates
        actor: UtilityFiler
        preconditions:
          - "Case in DECIDED (ERR_INVALID_CASE_STATE)"
          - "Every CustomerClass of the case has at least one TariffRate in APPROVED (ERR_CLASS_TARIFF_MISSING)"
        side_effects:
          - "Every TariffRate in APPROVED -> EFFECTIVE"
          - "Every RegulatoryAsset in APPROVED_FOR_AMORTIZATION -> AMORTIZING"
          - "status -> RATES_IMPLEMENTED"

      - from: RATES_IMPLEMENTED
        to: COMPLIANCE_MONITORING
        trigger: POST /api/v1/rate-cases/{caseId}/begin-compliance-monitoring
        actor: CommissionStaff
        preconditions:
          - "Case in RATES_IMPLEMENTED (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> COMPLIANCE_MONITORING"]

      - from: COMPLIANCE_MONITORING
        to: CLOSED
        trigger: POST /api/v1/rate-cases/{caseId}/close
        actor: ALJ
        preconditions:
          - "Case in COMPLIANCE_MONITORING (ERR_INVALID_CASE_STATE)"
          - "At least one ComplianceFiling of the case in ACCEPTED (ERR_NO_ACCEPTED_FILING)"
        side_effects: ["status -> CLOSED"]

  - entity: Intervenor
    initial_state: PARTY
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PARTY
        to: WITHDRAWN
        trigger: POST /api/v1/intervenors/{intervenorId}/withdraw
        actor: IntervenorRep | CommissionStaff
        preconditions:
          - "Intervenor in PARTY (ERR_INVALID_INTERVENOR_STATE)"
          - "If caller is IntervenorRep, X-User-ID must equal this Intervenor.id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Hop 1: this Intervenor -> WITHDRAWN"
          - "Hop 2 (caused by hop 1): every DataRequest with issuing_intervenor_id = this id in {ISSUED, OBJECTED, RESPOND_REQUIRED, OVERDUE} -> WITHDRAWN"
          - "Hop 3 (caused by each hop-2 withdrawal out of OVERDUE): RateCase.overdue_data_request_count recomputed"
          - "Every SettlementSignatory with intervenor_id = this id in PENDING -> VOID; affected proposals recompute signature_count/required_signature_count (VOID rows excluded from both)"

  - entity: TestYearEntry
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/v1/test-year-entries/{entryId}/submit
        actor: UtilityFiler
        preconditions:
          - "Entry in DRAFT (ERR_INVALID_ENTRY_STATE)"
          - "Owning RateCase in {DRAFT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> SUBMITTED"]

      - from: SUBMITTED
        to: DRAFT
        trigger: POST /api/v1/test-year-entries/{entryId}/reopen
        actor: UtilityFiler
        preconditions:
          - "Entry in SUBMITTED (ERR_INVALID_ENTRY_STATE)"
          - "Owning RateCase in {DRAFT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> DRAFT"]

      - from: SUBMITTED
        to: LOCKED
        trigger: POST /api/v1/test-year-entries/{entryId}/lock
        actor: UtilityFiler
        preconditions:
          - "Entry in SUBMITTED (ERR_INVALID_ENTRY_STATE)"
          - "Owning RateCase in {DRAFT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
          - "Zero Adjustment with test_year_entry_id = this entry in DISPUTED (ERR_UNRESOLVED_ENTRY_ADJUSTMENTS); PROPOSED adjustments do NOT block entry lock (they block case filing instead)"
        side_effects: ["status -> LOCKED"]

  - entity: Adjustment
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: VERIFIED
        trigger: POST /api/v1/adjustments/{adjustmentId}/verify
        actor: UtilityFiler
        preconditions:
          - "Adjustment in PROPOSED (ERR_INVALID_ADJUSTMENT_STATE)"
          - "X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Owning TestYearEntry not LOCKED (ERR_INVALID_ENTRY_STATE)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "status -> VERIFIED"
          - "TestYearEntry.adjusted_amount_cents recomputed (VERIFIED counts)"

      - from: DISPUTED
        to: VERIFIED
        trigger: POST /api/v1/adjustments/{adjustmentId}/verify
        actor: UtilityFiler
        preconditions: ["Same as PROPOSED -> VERIFIED"]
        side_effects: ["Same as PROPOSED -> VERIFIED"]

      - from: VERIFIED
        to: DISPUTED
        trigger: POST /api/v1/adjustments/{adjustmentId}/dispute
        actor: CommissionStaff | IntervenorRep
        preconditions:
          - "Adjustment in VERIFIED (ERR_INVALID_ADJUSTMENT_STATE)"
        side_effects: ["status -> DISPUTED"]

      - from: VERIFIED
        to: REJECTED
        trigger: POST /api/v1/adjustments/{adjustmentId}/reject
        actor: CommissionStaff
        preconditions:
          - "Adjustment in VERIFIED (ERR_INVALID_ADJUSTMENT_STATE)"
        side_effects:
          - "status -> REJECTED"
          - "TestYearEntry.adjusted_amount_cents recomputed (REJECTED excluded)"

      - from: DISPUTED
        to: REJECTED
        trigger: POST /api/v1/adjustments/{adjustmentId}/reject
        actor: CommissionStaff
        preconditions: ["Adjustment in DISPUTED (ERR_INVALID_ADJUSTMENT_STATE)"]
        side_effects: ["status -> REJECTED", "TestYearEntry.adjusted_amount_cents recomputed"]

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /api/v1/adjustments/{adjustmentId}/withdraw
        actor: UtilityFiler
        preconditions:
          - "Adjustment in {PROPOSED, DISPUTED} (ERR_INVALID_ADJUSTMENT_STATE)"
          - "X-User-ID == proposed_by_user_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "status -> WITHDRAWN"
          - "TestYearEntry.adjusted_amount_cents recomputed (WITHDRAWN excluded)"

      - from: DISPUTED
        to: WITHDRAWN
        trigger: POST /api/v1/adjustments/{adjustmentId}/withdraw
        actor: UtilityFiler
        preconditions: ["Same as PROPOSED -> WITHDRAWN"]
        side_effects: ["Same as PROPOSED -> WITHDRAWN"]

      - from: VERIFIED
        to: ACCEPTED
        trigger: "system (cascade of RateCase submit-filing)"
        actor: system
        preconditions: []
        side_effects: ["status -> ACCEPTED"]

  - entity: RateBaseItem
    initial_state: DRAFT
    terminal_states: [AUDITED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/v1/rate-base-items/{itemId}/submit
        actor: UtilityFiler
        preconditions:
          - "Item in DRAFT (ERR_INVALID_ITEM_STATE)"
          - "Owning RateCase in {DRAFT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> SUBMITTED"]

      - from: SUBMITTED
        to: AUDITED
        trigger: POST /api/v1/rate-base-items/{itemId}/audit with outcome=AUDIT_PASS
        actor: CommissionStaff
        preconditions:
          - "Item in SUBMITTED (ERR_INVALID_ITEM_STATE)"
          - "Owning RateCase in {FILED, ACCEPTED, DISCOVERY, HEARING, SETTLEMENT} (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> AUDITED"]

      - from: SUBMITTED
        to: EXCEPTION
        trigger: POST /api/v1/rate-base-items/{itemId}/audit with outcome=AUDIT_EXCEPTION
        actor: CommissionStaff
        preconditions:
          - "Item in SUBMITTED (ERR_INVALID_ITEM_STATE)"
          - "Owning RateCase in {FILED, ACCEPTED, DISCOVERY, HEARING, SETTLEMENT} (ERR_INVALID_CASE_STATE)"
        side_effects: ["status -> EXCEPTION"]

      - from: EXCEPTION
        to: SUBMITTED
        trigger: POST /api/v1/rate-base-items/{itemId}/revise
        actor: UtilityFiler
        preconditions:
          - "Item in EXCEPTION (ERR_INVALID_ITEM_STATE)"
          - "Owning RateCase in {FILED, ACCEPTED, DISCOVERY, HEARING, SETTLEMENT, DEFICIENT} (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "Amount fields replaced with the request values; net_rate_base_cents recomputed"
          - "status -> SUBMITTED"

  - entity: DataRequest
    initial_state: ISSUED
    terminal_states: [RESPONDED, CLOSED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: RESPONDED
        trigger: POST /api/v1/data-requests/{requestId}/respond
        actor: UtilityFiler
        preconditions:
          - "Request in {ISSUED, OVERDUE, RESPOND_REQUIRED} (ERR_INVALID_REQUEST_STATE)"
        side_effects: ["status -> RESPONDED", "response_text := request value"]

      - from: OVERDUE
        to: RESPONDED
        trigger: POST /api/v1/data-requests/{requestId}/respond
        actor: UtilityFiler
        preconditions: ["Request in {ISSUED, OVERDUE, RESPOND_REQUIRED} (ERR_INVALID_REQUEST_STATE)"]
        side_effects:
          - "status -> RESPONDED"
          - "RateCase.overdue_data_request_count -= 1 (leaves OVERDUE)"

      - from: RESPOND_REQUIRED
        to: RESPONDED
        trigger: POST /api/v1/data-requests/{requestId}/respond
        actor: UtilityFiler
        preconditions: ["Request in {ISSUED, OVERDUE, RESPOND_REQUIRED} (ERR_INVALID_REQUEST_STATE)"]
        side_effects: ["status -> RESPONDED", "response_text := request value"]

      - from: ISSUED
        to: OBJECTED
        trigger: POST /api/v1/data-requests/{requestId}/object
        actor: UtilityFiler
        preconditions:
          - "Request in ISSUED (ERR_INVALID_REQUEST_STATE)"
        side_effects: ["status -> OBJECTED", "objection_reason := request value"]

      - from: OBJECTED
        to: CLOSED
        trigger: POST /api/v1/data-requests/{requestId}/rule with ruling=SUSTAINED
        actor: ALJ
        preconditions:
          - "Request in OBJECTED (ERR_INVALID_REQUEST_STATE)"
        side_effects: ["status -> CLOSED", "ruling := SUSTAINED"]

      - from: OBJECTED
        to: RESPOND_REQUIRED
        trigger: POST /api/v1/data-requests/{requestId}/rule with ruling=OVERRULED
        actor: ALJ
        preconditions:
          - "Request in OBJECTED (ERR_INVALID_REQUEST_STATE)"
        side_effects:
          - "status -> RESPOND_REQUIRED"
          - "ruling := OVERRULED"
          - "extended_due_at := current clock + 5 days"

      - from: ISSUED
        to: OVERDUE
        trigger: "system (sweep on POST /_clock/set_current_utc when current clock > response_due_at; equal is NOT overdue)"
        actor: system
        preconditions: []
        side_effects: ["status -> OVERDUE", "RateCase.overdue_data_request_count += 1"]

      - from: RESPOND_REQUIRED
        to: OVERDUE
        trigger: "system (sweep on POST /_clock/set_current_utc when current clock > extended_due_at; equal is NOT overdue)"
        actor: system
        preconditions: []
        side_effects: ["status -> OVERDUE", "RateCase.overdue_data_request_count += 1"]

      - from: ISSUED
        to: WITHDRAWN
        trigger: POST /api/v1/data-requests/{requestId}/withdraw
        actor: IntervenorRep | CommissionStaff
        preconditions:
          - "Request in {ISSUED, OBJECTED, OVERDUE, RESPOND_REQUIRED} (ERR_INVALID_REQUEST_STATE)"
          - "If issuer_kind=INTERVENOR, caller must be IntervenorRep with X-User-ID == issuing_intervenor_id (ERR_FORBIDDEN_OWNERSHIP); if issuer_kind=STAFF, caller must be CommissionStaff"
        side_effects: ["status -> WITHDRAWN"]

      - from: OBJECTED
        to: WITHDRAWN
        trigger: POST /api/v1/data-requests/{requestId}/withdraw
        actor: IntervenorRep | CommissionStaff
        preconditions: ["Same as ISSUED -> WITHDRAWN"]
        side_effects: ["status -> WITHDRAWN"]

      - from: OVERDUE
        to: WITHDRAWN
        trigger: POST /api/v1/data-requests/{requestId}/withdraw
        actor: IntervenorRep | CommissionStaff
        preconditions: ["Same as ISSUED -> WITHDRAWN"]
        side_effects: ["status -> WITHDRAWN", "RateCase.overdue_data_request_count -= 1 (leaves OVERDUE)"]

      - from: RESPOND_REQUIRED
        to: WITHDRAWN
        trigger: POST /api/v1/data-requests/{requestId}/withdraw
        actor: IntervenorRep | CommissionStaff
        preconditions: ["Same as ISSUED -> WITHDRAWN"]
        side_effects: ["status -> WITHDRAWN"]

  - entity: SettlementProposal
    initial_state: DRAFT
    terminal_states: [ADOPTED, REMANDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_NEGOTIATION
        trigger: POST /api/v1/settlement-proposals/{proposalId}/circulate
        actor: UtilityFiler
        preconditions:
          - "Proposal in DRAFT (ERR_INVALID_PROPOSAL_STATE)"
          - "Owning RateCase in SETTLEMENT (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "Generate one SettlementSignatory (PENDING) per Intervenor of the case in PARTY, ordered by Intervenor.created_at ASC for deterministic list order"
          - "required_signature_count := number of generated signatories"
          - "status -> UNDER_NEGOTIATION"

      - from: UNDER_NEGOTIATION
        to: ASSENTED
        trigger: "system (bubble-up when signature_count == required_signature_count and required_signature_count > 0 after a sign)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ASSENTED"
          - "RateCase.assented_proposal_count += 1"

      - from: ASSENTED
        to: UNDER_NEGOTIATION
        trigger: "system (cascade of a SettlementSignatory rescind on this proposal while ASSENTED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> UNDER_NEGOTIATION"
          - "RateCase.assented_proposal_count -= 1"

      - from: ASSENTED
        to: RECOMMENDED
        trigger: POST /api/v1/settlement-proposals/{proposalId}/recommend
        actor: ALJ
        preconditions:
          - "Proposal in ASSENTED (ERR_INVALID_PROPOSAL_STATE)"
        side_effects: ["status -> RECOMMENDED"]

      - from: ASSENTED
        to: REMANDED
        trigger: POST /api/v1/settlement-proposals/{proposalId}/remand
        actor: ALJ
        preconditions:
          - "Proposal in ASSENTED (ERR_INVALID_PROPOSAL_STATE)"
        side_effects: ["status -> REMANDED (terminal; a new round may supersede prior rounds only from DRAFT/UNDER_NEGOTIATION)"]

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade of POST /api/v1/settlement-proposals creating a newer round for the same case)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED"
          - "This proposal's SettlementSignatory in {PENDING, SIGNED} -> VOID"

      - from: UNDER_NEGOTIATION
        to: SUPERSEDED
        trigger: "system (cascade of POST /api/v1/settlement-proposals creating a newer round for the same case)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> SUPERSEDED"]

      - from: RECOMMENDED
        to: ADOPTED
        trigger: "system (cascade of RateCase issue-order)"
        actor: system
        preconditions: []
        side_effects: ["status -> ADOPTED"]

  - entity: SettlementSignatory
    initial_state: PENDING
    terminal_states: [DECLINED, RESCINDED, VOID]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: POST /api/v1/settlement-signatories/{signatoryId}/sign
        actor: IntervenorRep
        preconditions:
          - "Signatory in PENDING (ERR_INVALID_SIGNATORY_STATE)"
          - "X-User-ID == this signatory's intervenor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Owning SettlementProposal in UNDER_NEGOTIATION (ERR_INVALID_PROPOSAL_STATE)"
        side_effects:
          - "status -> SIGNED; signed_at := current clock"
          - "SettlementProposal.signature_count recomputed; if signature_count == required_signature_count (> 0) proposal -> ASSENTED bubble-up"

      - from: PENDING
        to: DECLINED
        trigger: POST /api/v1/settlement-signatories/{signatoryId}/decline
        actor: IntervenorRep
        preconditions:
          - "Signatory in PENDING (ERR_INVALID_SIGNATORY_STATE)"
          - "X-User-ID == this signatory's intervenor_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["status -> DECLINED (proposal can no longer reach ASSENTED; a superseding round is the remedy)"]

      - from: SIGNED
        to: RESCINDED
        trigger: POST /api/v1/settlement-signatories/{signatoryId}/rescind
        actor: IntervenorRep
        preconditions:
          - "Signatory in SIGNED (ERR_INVALID_SIGNATORY_STATE)"
          - "X-User-ID == this signatory's intervenor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Owning SettlementProposal in {UNDER_NEGOTIATION, ASSENTED} (ERR_INVALID_PROPOSAL_STATE)"
        side_effects:
          - "status -> RESCINDED"
          - "SettlementProposal.signature_count recomputed"
          - "If proposal was ASSENTED -> proposal back to UNDER_NEGOTIATION and RateCase.assented_proposal_count -= 1"

      - from: PENDING
        to: VOID
        trigger: "system (cascade: owning proposal superseded, or the party intervenor withdraws)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> VOID"
          - "Owning SettlementProposal recomputes signature_count/required_signature_count (VOID rows excluded from both)"

      - from: SIGNED
        to: VOID
        trigger: "system (cascade: owning proposal superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> VOID"
          - "Owning SettlementProposal recomputes signature_count (VOID rows excluded)"

  - entity: RegulatoryAsset
    initial_state: DEFERRED
    terminal_states: [FULLY_AMORTIZED, DISALLOWED]
    transitions:
      - from: DEFERRED
        to: APPROVED_FOR_AMORTIZATION
        trigger: "system (cascade of RateCase issue-order listing this asset in approved_asset_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> APPROVED_FOR_AMORTIZATION"
          - "AmortizationEntry rows generated: period_index 1..amortization_months; amount = monthly_base_cents for index < amortization_months, final_month_cents for the last; status PENDING"

      - from: DEFERRED
        to: DISALLOWED
        trigger: "system (cascade of RateCase issue-order NOT listing this asset)"
        actor: system
        preconditions: []
        side_effects: ["status -> DISALLOWED"]

      - from: APPROVED_FOR_AMORTIZATION
        to: AMORTIZING
        trigger: "system (cascade of RateCase implement-rates)"
        actor: system
        preconditions: []
        side_effects: ["status -> AMORTIZING"]

      - from: AMORTIZING
        to: FULLY_AMORTIZED
        trigger: "system (bubble-up when the last PENDING AmortizationEntry of this asset is posted)"
        actor: system
        preconditions: []
        side_effects: ["status -> FULLY_AMORTIZED"]

      - from: FULLY_AMORTIZED
        to: AMORTIZING
        trigger: "system (compensation cascade when the latest POSTED entry is reversed)"
        actor: system
        preconditions: []
        side_effects: ["status -> AMORTIZING"]

  - entity: AmortizationEntry
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: POST /api/v1/amortization-entries/{entryId}/post
        actor: UtilityFiler
        preconditions:
          - "Entry in PENDING (ERR_INVALID_AMORT_ENTRY_STATE)"
          - "Owning RegulatoryAsset in AMORTIZING (ERR_INVALID_ASSET_STATE)"
          - "This entry's period_index is the minimum period_index among the asset's PENDING entries (ERR_AMORTIZATION_OUT_OF_ORDER)"
        side_effects:
          - "status -> POSTED; posted_at := current clock"
          - "RegulatoryAsset.amortized_to_date_cents += amount_cents"
          - "If no PENDING entries remain on the asset: asset -> FULLY_AMORTIZED"

      - from: POSTED
        to: REVERSED
        trigger: POST /api/v1/amortization-entries/{entryId}/reverse
        actor: UtilityFiler
        preconditions:
          - "Entry in POSTED (ERR_INVALID_AMORT_ENTRY_STATE)"
          - "Owning RegulatoryAsset in {AMORTIZING, FULLY_AMORTIZED} (ERR_INVALID_ASSET_STATE)"
          - "This entry's period_index is the maximum period_index among the asset's POSTED entries (ERR_REVERSAL_NOT_LATEST)"
        side_effects:
          - "status -> REVERSED"
          - "RegulatoryAsset.amortized_to_date_cents -= amount_cents"
          - "If asset was FULLY_AMORTIZED -> AMORTIZING"

  - entity: TariffRate
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "system (cascade of RateCase issue-order listing this tariff in approved_tariff_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> APPROVED"
          - "CustomerClass.approved_revenue_cents := this tariff's proposed_revenue_cents"
          - "RateCase.revenue_at_approved_rates_cents recomputed over all classes"

      - from: PROPOSED
        to: REJECTED
        trigger: "system (cascade of RateCase issue-order NOT listing this tariff)"
        actor: system
        preconditions: []
        side_effects: ["status -> REJECTED"]

      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (cascade of RateCase implement-rates)"
        actor: system
        preconditions: []
        side_effects: ["status -> EFFECTIVE"]

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (sweep on POST /_clock/set_current_utc: an EFFECTIVE tariff is superseded when current clock >= effective_start of another EFFECTIVE tariff of the same CustomerClass with a strictly later effective_start)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]

  - entity: ComplianceFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/v1/compliance-filings/{filingId}/submit
        actor: UtilityFiler
        preconditions:
          - "Filing in DRAFT (ERR_INVALID_FILING_STATE)"
          - "Owning RateCase in COMPLIANCE_MONITORING (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "true_up_delta_cents, true_up_action, class_true_up_lines computed and frozen (see true_up_reconciliation)"
          - "status -> SUBMITTED"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /api/v1/compliance-filings/{filingId}/review with outcome=ACCEPT
        actor: CommissionStaff
        preconditions:
          - "Filing in SUBMITTED (ERR_INVALID_FILING_STATE)"
        side_effects: ["status -> ACCEPTED"]

      - from: SUBMITTED
        to: REMANDED
        trigger: POST /api/v1/compliance-filings/{filingId}/review with outcome=REMAND
        actor: CommissionStaff
        preconditions:
          - "Filing in SUBMITTED (ERR_INVALID_FILING_STATE)"
          - "remand_notes present and non-empty (ERR_REMAND_NOTES_REQUIRED)"
        side_effects: ["status -> REMANDED"]

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade of POST /api/v1/compliance-filings creating a newer filing for the same case)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED; new filing's supersedes_filing_id := this filing's id"]

      - from: REMANDED
        to: SUPERSEDED
        trigger: "system (cascade of POST /api/v1/compliance-filings creating a newer filing for the same case)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED; new filing's supersedes_filing_id := this filing's id"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-case
    parent_entity: RateCase
    write_endpoint: "POST /api/v1/settlement-proposals"
    occ_field: "expected_rate_case_version"
    description: |
      Creating a SettlementProposal against a RateCase whose version has
      advanced since the client last observed it is rejected. Creating a new
      round legitimately supersedes the case's prior DRAFT or
      UNDER_NEGOTIATION proposal, so a writer whose view of the case predates
      the latest mutation (e.g. a round created or a sign/rescind cascade)
      holds a stale version and must re-read the case before composing a round.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: compliance-filing-create-stale-case
    parent_entity: RateCase
    write_endpoint: "POST /api/v1/compliance-filings"
    occ_field: "expected_rate_case_version"
    description: |
      Creating a ComplianceFiling against a RateCase whose version has
      advanced since the client last observed it is rejected. A new filing
      legitimately supersedes the case's prior DRAFT or REMANDED filing, so a
      writer holding a pre-mutation view of the case carries a stale version
      and must re-read before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: adjusted_test_year_amount
    trigger: "Adjustment create, verify, dispute, reject, withdraw, and the submit-filing accept cascade"
    algorithm: aggregation
    formula: |
      adjusted_amount_cents(entry) =
        entry.booked_amount_cents
        + sum(adj.amount_cents for adj in Adjustment
              where adj.test_year_entry_id == entry.id
              and adj.status in {PROPOSED, VERIFIED, DISPUTED, ACCEPTED})
      WITHDRAWN and REJECTED adjustments are excluded.
    input_set: "Adjustment rows of the entry filtered by status in {PROPOSED, VERIFIED, DISPUTED, ACCEPTED}"
    precision: "integer cents; no rounding"

  - name: rate_base_total
    trigger: "revenue_requirement computation; recomputed on RateBaseItem submit/audit/revise"
    algorithm: aggregation
    formula: |
      rate_base_total(case, input_set) =
        sum(item.net_rate_base_cents for item in RateBaseItem
            where item.rate_case_id == case.id
            and item.status in input_set)
      net_rate_base_cents = plant_in_service_cents - accumulated_depreciation_cents
        + working_capital_cents - accumulated_deferred_taxes_cents
    input_set: "RateBaseItem of the case; variant as_filed: status in {SUBMITTED, AUDITED}; variant as_audited: status in {AUDITED}"
    precision: "integer cents"
    variants:
      - name: as_filed
        when: "Filing-time view: the utility's claimed rate base"
        difference: "Includes RateBaseItem in {SUBMITTED, AUDITED}"
      - name: as_audited
        when: "Post-audit view used at order drafting"
        difference: "Includes RateBaseItem in {AUDITED} only; SUBMITTED and EXCEPTION items excluded"

  - name: cost_of_service_total
    trigger: "revenue_requirement computation; recomputed on entry lock and adjustment cascade"
    algorithm: aggregation
    formula: |
      cost_of_service_total(case) =
        sum(entry.adjusted_amount_cents for entry in TestYearEntry
            where entry.rate_case_id == case.id
            and entry.status == LOCKED
            and entry.category in {O_AND_M, DEPRECIATION, TAXES})
    input_set: "TestYearEntry of the case in LOCKED status only; DRAFT and SUBMITTED entries excluded"
    precision: "integer cents"

  - name: revenue_requirement
    trigger: "GET /api/v1/rate-cases/{caseId}/revenue-requirement; submit-filing validation (as_filed); issue-order reference (as_audited)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (breaks the apparent circularity that the
      return component is a percentage of a base that audit status changes):
      1. cost_of_service = cost_of_service_total(case)          [LOCKED entries]
      2. rate_base       = rate_base_total(case, input_set)     [variant input set]
      3. return_cents    = round_half_up(rate_base * return_on_rate_base_bp / 10000)
                           -- return component rounded to integer cents FIRST
      4. revenue_requirement_cents = cost_of_service + return_cents
      Both steps 1 and 2 must be evaluated before step 3; no term feeds back.
    input_set: "Per variant; see rate_base_total"
    constants:
      RR_MATCH_TOLERANCE_CENTS: 100
    precision: "integer cents; return component round_half_up before addition"
    variants:
      - name: as_filed
        when: "submit-filing validation and filing-time reporting"
        difference: "rate_base input set = {SUBMITTED, AUDITED}"
      - name: as_audited
        when: "order-drafting reporting"
        difference: "rate_base input set = {AUDITED}"

  - name: present_revenue_by_class
    trigger: "CustomerClass create; GET bill-impact (present leg); gradualism_cap_check"
    algorithm: tiered_pricing
    formula: |
      tiered_marginal(kwh, tiers):
        cents = 0; floor_kwh = 0
        for tier in tiers sorted by up_to_kwh ASC (null up_to_kwh last, width infinite):
          width = (tier.up_to_kwh == null) ? (kwh - floor_kwh)
                : max(0, min(kwh, tier.up_to_kwh) - floor_kwh)
          cents += width * tier.rate_mills / 100       # mills -> cents per kWh; division exact-integer only when width*rate_mills divisible by 100, else round_half_up per tier
          floor_kwh = tier.up_to_kwh (skip when null)
          stop when floor_kwh >= kwh
        return cents
      present_revenue_cents(class) =
        12 * class.customer_count *
          (class.present_customer_charge_cents
           + tiered_marginal(class.monthly_kwh_per_customer, class.present_tiers))
      Per-tier products are rounded round_half_up to integer cents BEFORE
      summation across tiers (pinned rounding order); the outer expression is
      then exact integer arithmetic.
    input_set: "The single CustomerClass being priced"
    precision: "integer cents; per-tier round_half_up then sum"

  - name: class_cost_allocation
    trigger: "CustomerClass create; RateCase allocation_method reporting; GET /api/v1/rate-cases/{caseId}/cost-allocation"
    algorithm: weighted_scoring
    formula: |
      Let COS = cost_of_service_total(case).
      demand_share(class):
        variant COINCIDENT_PEAK: class.coincident_peak_kw / sum(coincident_peak_kw over all classes of the case)
        variant ENERGY_AVERAGE:  class.annual_kwh          / sum(annual_kwh over all classes of the case)
      energy_share(class)   = class.annual_kwh     / sum(annual_kwh over all classes)
      customer_share(class) = class.customer_count / sum(customer_count over all classes)
      demand_component_cents(class)   = round_half_up(COS * DEMAND_PCT   * demand_share(class))
      energy_component_cents(class)   = round_half_up(COS * ENERGY_PCT   * energy_share(class))
      customer_component_cents(class) = round_half_up(COS * CUSTOMER_PCT * customer_share(class))
      Pinned rounding order: each of the three components is rounded
      round_half_up to integer cents FIRST, then summed:
        allocated_pre_residual(class) = demand_component + energy_component + customer_component
      residual_cents = COS - sum(allocated_pre_residual over all classes)
      residual assignment: the residual (which may be positive or negative) is
      added to the class with the largest allocated_pre_residual; tie-break:
      larger customer_count; then CustomerClass.created_at ASC.
      allocated_cost_cents(class) = allocated_pre_residual(class) (+ residual for the chosen class)
    input_set: "All CustomerClass of the case; COS over LOCKED entries"
    constants:
      DEMAND_PCT: 0.60
      ENERGY_PCT: 0.25
      CUSTOMER_PCT: 0.15
    precision: "integer cents; per-component round_half_up then sum"
    variants:
      - name: coincident_peak
        when: "RateCase.allocation_method == COINCIDENT_PEAK"
        difference: "Demand component allocated by coincident-peak-kw share"
      - name: energy_average
        when: "RateCase.allocation_method == ENERGY_AVERAGE or method=ENERGY_AVERAGE override on the read endpoint"
        difference: "Demand component allocated by annual-kwh share"

  - name: amortization_schedule
    trigger: "RegulatoryAsset create (components); issue-order cascade (entry generation)"
    algorithm: chronological
    formula: |
      monthly_base_cents = floor(principal_cents / amortization_months)
      final_month_cents  = principal_cents - monthly_base_cents * (amortization_months - 1)
      Entry generation order: period_index 1 .. amortization_months ascending.
      amount(period_index) = monthly_base_cents            for period_index < amortization_months
                           = final_month_cents             for period_index == amortization_months
      The rounding remainder is absorbed entirely by the LAST installment
      (nested rounding where order matters: floor each installment and push
      the remainder to the tail, NOT round-each-independently).
      Invariant: sum of all generated amount_cents == principal_cents exactly.
    input_set: "The single RegulatoryAsset"
    precision: "integer cents; floor for base installments; remainder to final installment"

  - name: bill_impact
    trigger: "GET /api/v1/rate-cases/{caseId}/bill-impact"
    algorithm: tiered_pricing
    formula: |
      present_bill_cents  = class.present_customer_charge_cents
                            + tiered_marginal(monthly_kwh, class.present_tiers)
      Tariff selection when tariff_id is omitted: the class's TariffRate in
      EFFECTIVE; if several, the one with the latest effective_start; if none,
      the most recently created PROPOSED tariff of the class
      (TariffRate.created_at DESC); if none, ERR_TARIFF_NOT_FOUND.
      proposed_bill_cents = tariff.proposed_customer_charge_cents
                            + tiered_marginal(monthly_kwh, tariff.proposed_tiers)
      impact_pct_bp = round_half_up(10000 * (proposed_bill_cents - present_bill_cents) / present_bill_cents)
      Requires present_bill_cents > 0 (else ERR_INVALID_REQUEST).
    input_set: "One CustomerClass, one TariffRate (explicit or selected), monthly_kwh query input"
    precision: "integer cents; impact in basis points round_half_up"

  - name: gradualism_cap_check
    trigger: "TariffRate create"
    algorithm: threshold
    formula: |
      present_total = sum(present_revenue_cents over all CustomerClass of the case)
      system_avg_increase_bp =
        round_half_up(10000 * (case.proposed_revenue_requirement_cents - present_total) / present_total)
      If system_avg_increase_bp <= 0 (a revenue-decreasing case), the cap
      check is skipped entirely: gradualism constrains only rate increases in
      an increasing-revenue case.
      Otherwise:
        cap_bp = round_half_up(GRADUALISM_FACTOR * system_avg_increase_bp)
        class_increase_bp =
          round_half_up(10000 * (tariff.proposed_revenue_cents - class.present_revenue_cents) / class.present_revenue_cents)
        Reject with ERR_GRADUALISM_CAP_EXCEEDED iff class_increase_bp > cap_bp
        (strictly greater; equal to the cap passes).
    input_set: "The case's CustomerClass set (present_total) and the new tariff's class"
    constants:
      GRADUALISM_FACTOR: 1.5
    precision: "basis points, round_half_up at each of the two rounding steps in pinned order (system avg first, then cap)"

  - name: true_up_reconciliation
    trigger: "ComplianceFiling submit"
    algorithm: threshold
    formula: |
      Apparent circularity is broken by pinned evaluation order: prior-period
      rider effects NEVER feed the current delta; the current delta is computed
      from raw actuals only.
      1. actual_total = sum(actual_revenue_cents over actual_revenue_by_class)
      2. delta_cents = actual_total - case.authorized_revenue_requirement_cents
         (positive delta = over-collection = REFUND owed to customers;
          negative delta = under-collection = SURCHARGE owed to utility)
      3. threshold_cents = max(DE_MINIMIS_ABS_CENTS,
                               round_half_up(authorized_revenue_requirement_cents * DE_MINIMIS_PCT))
      4. action = NONE iff abs(delta_cents) <= threshold_cents (equal to the
         threshold is NONE; the trigger is strictly-greater)
         else (delta_cents > 0 ? REFUND : SURCHARGE)
      5. Per-class lines (computed even when action == NONE for transparency):
         line_c = round_half_away_from_zero(delta_cents * actual_c / actual_total)
         per line, THEN residual = delta_cents - sum(lines) assigned to the
         class with the largest actual_revenue_cents (tie: class_code ASC).
    input_set: "The filing's actual_revenue_by_class (must cover every class exactly once); case.authorized_revenue_requirement_cents"
    constants:
      DE_MINIMIS_ABS_CENTS: 100000
      DE_MINIMIS_PCT: 0.005
    precision: "integer cents; threshold round_half_up; per-line round_half_away_from_zero then residual"

  - name: discovery_overdue_sweep
    trigger: "POST /_clock/set_current_utc (after the clock advances)"
    algorithm: threshold
    formula: |
      For every DataRequest in ISSUED with response_due_at < new_clock:
        -> OVERDUE; RateCase.overdue_data_request_count += 1
      For every DataRequest in RESPOND_REQUIRED with extended_due_at < new_clock:
        -> OVERDUE; RateCase.overdue_data_request_count += 1
      Boundary: due exactly equal to the new clock is NOT overdue (strict <).
      Processing order: DataRequest.created_at ASC; the count is order-
      independent because each flip contributes exactly +1.
    input_set: "All DataRequest in {ISSUED, RESPOND_REQUIRED} across all cases"
    precision: "instant comparison on ISO8601 UTC"

  - name: tariff_supersede_sweep
    trigger: "POST /_clock/set_current_utc (after the clock advances)"
    algorithm: chronological
    formula: |
      For each CustomerClass, consider its TariffRate in EFFECTIVE.
      The current tariff is the one with the latest effective_start that is
      <= new_clock (tie impossible: overlapping windows for the same class are
      rejected at create). Every other EFFECTIVE tariff of the class whose
      effective_start < that latest effective_start -> SUPERSEDED.
      A tariff whose window has simply ended (effective_end <= new_clock) with
      no successor stays EFFECTIVE (billing continues on expired-window terms
      until displaced); supersession is driven ONLY by a later-starting
      EFFECTIVE successor.
    input_set: "All TariffRate in EFFECTIVE, grouped by CustomerClass"
    precision: "instant comparison on ISO8601 UTC"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: business_constraint
    check: "Request shape: required fields present, no unknown fields, enum members valid, integers in range (amounts non-negative where specified, amount_cents != 0 on Adjustment, amortization_months > 0, principal_cents > 0), tier arrays ascending with exactly one null up_to_kwh terminal"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints with a body"

  - priority: 0
    category: business_constraint
    check: "Date ranges internally consistent: test_year_end > test_year_start; incurrence_end >= incurrence_start; effective_end > effective_start when present"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /api/v1/rate-cases; POST /api/v1/regulatory-assets; POST /api/v1/tariff-rates"

  - priority: 0
    category: business_constraint
    check: "deficiency-review with outcome=DEFICIENT requires non-empty deficiency_notes"
    error_id: ERR_DEFICIENCY_NOTES_REQUIRED
    http_status: 400
    applies_to: "POST /api/v1/rate-cases/{caseId}/deficiency-review"

  - priority: 0
    category: business_constraint
    check: "filing review with outcome=REMAND requires non-empty remand_notes"
    error_id: ERR_REMAND_NOTES_REQUIRED
    http_status: 400
    applies_to: "POST /api/v1/compliance-filings/{filingId}/review"

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller's role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership scope: IntervenorRep X-User-ID must equal the owning Intervenor id (data-request withdraw/issuing_intervenor_id, signatory sign/decline/rescind, intervenor withdraw); Adjustment withdraw requires X-User-ID == proposed_by_user_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 4
    category: auth
    check: "Segregation of duties: Adjustment verify requires X-User-ID != proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/v1/adjustments/{adjustmentId}/verify"

  - priority: 5
    category: existence
    check: "Path ids exist, validated left-to-right; body-supplied FK ids (rate_case_id, test_year_entry_id, customer_class_id, issuing_intervenor_id, referenced_adjustment_id, ids inside approved_tariff_ids/approved_asset_ids) reference existing resources"
    error_id: "ERR_RATE_CASE_NOT_FOUND | ERR_INTERVENOR_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_DATA_REQUEST_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_SIGNATORY_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_AMORT_ENTRY_NOT_FOUND | ERR_TARIFF_NOT_FOUND | ERR_FILING_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: "all endpoints with ids in path or body"

  - priority: 6
    category: state
    check: "Target entity in a state that permits the operation (per state machine); includes RateCase phase guards: submit-filing preconditions (ERR_ENTRIES_NOT_LOCKED, ERR_UNRESOLVED_ADJUSTMENTS, ERR_NO_TEST_YEAR_ENTRIES, ERR_NO_RATE_BASE_ITEMS), advance-to-hearing zero-overdue guard (ERR_OVERDUE_DATA_REQUESTS_EXIST), advance-to-order-pending (ERR_NO_RECOMMENDED_SETTLEMENT), implement-rates (ERR_CLASS_TARIFF_MISSING), close (ERR_NO_ACCEPTED_FILING), supersede guards (ERR_PROPOSAL_NOT_SUPERSEDABLE, ERR_FILING_NOT_SUPERSEDABLE), and all per-entity ERR_INVALID_*_STATE"
    error_id: "ERR_INVALID_CASE_STATE | ERR_INVALID_ENTRY_STATE | ERR_INVALID_ADJUSTMENT_STATE | ERR_INVALID_ITEM_STATE | ERR_INVALID_REQUEST_STATE | ERR_INVALID_PROPOSAL_STATE | ERR_INVALID_SIGNATORY_STATE | ERR_INVALID_ASSET_STATE | ERR_INVALID_AMORT_ENTRY_STATE | ERR_INVALID_TARIFF_STATE | ERR_INVALID_FILING_STATE | ERR_INVALID_INTERVENOR_STATE | ERR_ENTRIES_NOT_LOCKED | ERR_UNRESOLVED_ADJUSTMENTS | ERR_NO_TEST_YEAR_ENTRIES | ERR_NO_RATE_BASE_ITEMS | ERR_OVERDUE_DATA_REQUESTS_EXIST | ERR_NO_RECOMMENDED_SETTLEMENT | ERR_CLASS_TARIFF_MISSING | ERR_NO_ACCEPTED_FILING | ERR_PROPOSAL_NOT_SUPERSEDABLE | ERR_FILING_NOT_SUPERSEDABLE"
    http_status: 409
    applies_to: "all state-transition and guarded endpoints"

  - priority: 7
    category: business_safety
    check: "Anti-subsidy floor: tariff.proposed_revenue_cents must be >= the class's customer-cost component round_half_up(COS * 0.15 * customer_share) computed at tariff-create time"
    error_id: ERR_BELOW_CUSTOMER_COST_FLOOR
    http_status: 422
    applies_to: "POST /api/v1/tariff-rates"

  - priority: 8
    category: business_temporal
    check: "Temporal windows: DataRequest issue requires current clock <= case.discovery_close_at (ERR_DISCOVERY_WINDOW_CLOSED); tariff effective window must not overlap another non-REJECTED tariff of the same class under half-open [start, end) semantics where adjacency is allowed and null end is infinity (ERR_TARIFF_WINDOW_OVERLAP); RegulatoryAsset closed incurrence window must not intersect the case test year, with a single shared day counting as intersection (ERR_DEFERRAL_OVERLAPS_TEST_YEAR); clock may only move forward (ERR_CLOCK_REGRESSION)"
    error_id: "ERR_DISCOVERY_WINDOW_CLOSED | ERR_TARIFF_WINDOW_OVERLAP | ERR_DEFERRAL_OVERLAPS_TEST_YEAR | ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: "POST /api/v1/data-requests; POST /api/v1/tariff-rates; POST /api/v1/regulatory-assets; POST /_clock/set_current_utc"

  - priority: 9
    category: business_referential
    check: "Cross-case references forbidden: DataRequest.referenced_adjustment_id must belong to the same RateCase (ERR_ADJUSTMENT_NOT_IN_CASE); TariffRate.customer_class_id must belong to the same RateCase (ERR_CLASS_NOT_IN_CASE); DataRequest.issuing_intervenor_id must belong to the same RateCase (ERR_PARTY_NOT_IN_CASE); ComplianceFiling.actual_revenue_by_class must cover exactly the case's classes (ERR_INCOMPLETE_CLASS_REVENUE)"
    error_id: "ERR_ADJUSTMENT_NOT_IN_CASE | ERR_CLASS_NOT_IN_CASE | ERR_PARTY_NOT_IN_CASE | ERR_INCOMPLETE_CLASS_REVENUE"
    http_status: 422
    applies_to: "POST /api/v1/data-requests; POST /api/v1/tariff-rates; POST /api/v1/compliance-filings; GET /api/v1/rate-cases/{caseId}/bill-impact"

  - priority: 10
    category: business_constraint
    check: "Structural constraints: case_number unique (ERR_CASE_NUMBER_NOT_UNIQUE); class_code unique within case (ERR_CLASS_CODE_NOT_UNIQUE); amortization posting strictly in period_index order (ERR_AMORTIZATION_OUT_OF_ORDER); reversal strictly LIFO (ERR_REVERSAL_NOT_LATEST); gradualism cap class_increase_bp <= cap_bp (ERR_GRADUALISM_CAP_EXCEEDED)"
    error_id: "ERR_CASE_NUMBER_NOT_UNIQUE | ERR_CLASS_CODE_NOT_UNIQUE | ERR_AMORTIZATION_OUT_OF_ORDER | ERR_REVERSAL_NOT_LATEST | ERR_GRADUALISM_CAP_EXCEEDED"
    http_status: 422
    applies_to: "POST /api/v1/rate-cases; POST /api/v1/customer-classes; POST /api/v1/amortization-entries/{entryId}/post; POST /api/v1/amortization-entries/{entryId}/reverse; POST /api/v1/tariff-rates"

  - priority: 11
    category: business_fiscal
    check: "Fiscal integrity: |proposed_revenue_requirement_cents - computed as-filed revenue requirement| <= 100 at submit-filing (ERR_RR_MISMATCH); computed as-filed revenue requirement > 0 at submit-filing (ERR_NONPOSITIVE_REVENUE_REQUIREMENT); SettlementProposal.proposed_revenue_requirement_cents <= case.proposed_revenue_requirement_cents (ERR_SETTLEMENT_ABOVE_FILED)"
    error_id: "ERR_RR_MISMATCH | ERR_NONPOSITIVE_REVENUE_REQUIREMENT | ERR_SETTLEMENT_ABOVE_FILED"
    http_status: 422
    applies_to: "POST /api/v1/rate-cases/{caseId}/submit-filing; POST /api/v1/settlement-proposals"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_rate_case_version must equal the case's current version on create-with-supersede endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/settlement-proposals; POST /api/v1/compliance-filings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RateCase ---
  - method: POST
    path: "/api/v1/rate-cases"
    description: "Open a new rate case docket (status DRAFT)"
    roles: [UtilityFiler]
    code: 201
    input: [case_number, utility_name, test_year_start, test_year_end, return_on_rate_base_bp, proposed_revenue_requirement_cents, allocation_method]
    output: RateCase
    side_effects: ["status = DRAFT", "overdue_data_request_count = 0", "assented_proposal_count = 0"]

  - method: GET
    path: "/api/v1/rate-cases"
    description: "List rate cases, paginated"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["limit?", "offset?"]
    output: "RateCase[]"
    side_effects: []

  - method: GET
    path: "/api/v1/rate-cases/{caseId}"
    description: "Read one rate case"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: RateCase
    side_effects: []

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/submit-filing"
    description: "Submit the filing (DRAFT or DEFICIENT -> FILED); cascades VERIFIED adjustments to ACCEPTED"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: RateCase
    side_effects:
      - "All VERIFIED Adjustment of the case -> ACCEPTED"
      - "status -> FILED"
      - "increments RateCase.version by 1"

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/deficiency-review"
    description: "Commission staff sufficiency review: outcome ACCEPTED -> ACCEPTED, DEFICIENT -> DEFICIENT (notes required)"
    roles: [CommissionStaff]
    code: 200
    input: [outcome, "deficiency_notes?"]
    output: RateCase
    side_effects: ["status -> ACCEPTED or DEFICIENT", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/open-discovery"
    description: "Open the discovery window; sets discovery_close_at = clock + 120 days"
    roles: [CommissionStaff]
    code: 200
    input: []
    output: RateCase
    side_effects: ["discovery_close_at := current clock + 120 days", "status -> DISCOVERY", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/advance-to-hearing"
    description: "Close discovery and move to hearing; requires zero OVERDUE data requests"
    roles: [ALJ]
    code: 200
    input: []
    output: RateCase
    side_effects: ["status -> HEARING", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/open-settlement-window"
    description: "Open the settlement negotiation window"
    roles: [ALJ]
    code: 200
    input: []
    output: RateCase
    side_effects: ["status -> SETTLEMENT", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/advance-to-order-pending"
    description: "Certify the record; requires at least one RECOMMENDED settlement proposal"
    roles: [ALJ]
    code: 200
    input: []
    output: RateCase
    side_effects: ["status -> ORDER_PENDING", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/issue-order"
    description: "Issue the final order: adopts the RECOMMENDED proposal, approves/rejects tariffs, approves/disallows regulatory assets and generates amortization schedules"
    roles: [ALJ]
    code: 200
    input: [approved_tariff_ids, approved_asset_ids]
    output: RateCase
    side_effects:
      - "authorized_revenue_requirement_cents := RECOMMENDED proposal's proposed_revenue_requirement_cents (largest round_number if several)"
      - "RECOMMENDED proposal -> ADOPTED"
      - "Listed tariffs PROPOSED -> APPROVED (each recomputes its class approved_revenue_cents, which recomputes case revenue_at_approved_rates_cents); unlisted PROPOSED tariffs -> REJECTED"
      - "Listed assets DEFERRED -> APPROVED_FOR_AMORTIZATION with AmortizationEntry generation; unlisted DEFERRED assets -> DISALLOWED"
      - "status -> DECIDED"
      - "increments RateCase.version by 1"

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/implement-rates"
    description: "Put approved rates into effect and start amortization"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: RateCase
    side_effects:
      - "Every APPROVED TariffRate -> EFFECTIVE"
      - "Every APPROVED_FOR_AMORTIZATION RegulatoryAsset -> AMORTIZING"
      - "status -> RATES_IMPLEMENTED"
      - "increments RateCase.version by 1"

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/begin-compliance-monitoring"
    description: "Enter compliance monitoring phase"
    roles: [CommissionStaff]
    code: 200
    input: []
    output: RateCase
    side_effects: ["status -> COMPLIANCE_MONITORING", "increments RateCase.version by 1"]

  - method: POST
    path: "/api/v1/rate-cases/{caseId}/close"
    description: "Close the docket; requires at least one ACCEPTED compliance filing"
    roles: [ALJ]
    code: 200
    input: []
    output: RateCase
    side_effects: ["status -> CLOSED", "increments RateCase.version by 1"]

  - method: GET
    path: "/api/v1/rate-cases/{caseId}/revenue-requirement"
    description: "Computed read: revenue requirement breakdown under the requested variant (default as_filed)"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["variant?"]
    output: { variant: string, rate_base_cents: integer, cost_of_service_cents: integer, return_cents: integer, revenue_requirement_cents: integer }
    side_effects: []

  - method: GET
    path: "/api/v1/rate-cases/{caseId}/cost-allocation"
    description: "Computed read: class cost-of-service allocation under the requested method (default case.allocation_method); lines carry per-class components and final allocated cost after residual assignment"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["method?"]
    output: { method: string, cost_of_service_cents: integer, residual_cents: integer, lines: array }
    side_effects: []

  - method: GET
    path: "/api/v1/rate-cases/{caseId}/bill-impact"
    description: "Computed read: monthly bill for a class under present rates vs a selected tariff (explicit tariff_id or per bill_impact selection rule)"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: [customer_class_id, monthly_kwh, "tariff_id?"]
    output: { present_bill_cents: integer, proposed_bill_cents: integer, impact_pct_bp: integer }
    side_effects: []

  # --- Intervenor ---
  - method: POST
    path: "/api/v1/intervenors"
    description: "Register an intervenor party on a case; the response id is the party's IntervenorRep identity"
    roles: [IntervenorRep]
    code: 201
    input: [rate_case_id, party_name, representative_name, contact_email]
    output: Intervenor
    side_effects: ["status = PARTY"]

  - method: GET
    path: "/api/v1/intervenors"
    description: "List intervenors; filterable by rate_case_id"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "limit?", "offset?"]
    output: "Intervenor[]"
    side_effects: []

  - method: GET
    path: "/api/v1/intervenors/{intervenorId}"
    description: "Read one intervenor"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: Intervenor
    side_effects: []

  - method: POST
    path: "/api/v1/intervenors/{intervenorId}/withdraw"
    description: "Withdraw a party; cascades its open data requests to WITHDRAWN and its PENDING signatories to VOID"
    roles: [IntervenorRep, CommissionStaff]
    code: 200
    input: []
    output: Intervenor
    side_effects:
      - "status -> WITHDRAWN"
      - "Its DataRequest in {ISSUED, OBJECTED, RESPOND_REQUIRED, OVERDUE} -> WITHDRAWN (each leaving OVERDUE decrements RateCase.overdue_data_request_count)"
      - "Its SettlementSignatory in PENDING -> VOID; affected proposals recompute signature counts"

  # --- TestYearEntry ---
  - method: POST
    path: "/api/v1/test-year-entries"
    description: "Add a booked test-year line (case must be DRAFT or DEFICIENT)"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, account_code, category, booked_amount_cents]
    output: TestYearEntry
    side_effects: ["status = DRAFT", "adjusted_amount_cents = booked_amount_cents"]

  - method: GET
    path: "/api/v1/test-year-entries"
    description: "List test-year entries; filterable by rate_case_id and status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "limit?", "offset?"]
    output: "TestYearEntry[]"
    side_effects: []

  - method: GET
    path: "/api/v1/test-year-entries/{entryId}"
    description: "Read one test-year entry"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: TestYearEntry
    side_effects: []

  - method: POST
    path: "/api/v1/test-year-entries/{entryId}/submit"
    description: "Submit an entry for review (DRAFT -> SUBMITTED)"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: TestYearEntry
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/api/v1/test-year-entries/{entryId}/reopen"
    description: "Reopen a submitted entry (SUBMITTED -> DRAFT) while the case is editable"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: TestYearEntry
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/api/v1/test-year-entries/{entryId}/lock"
    description: "Lock an entry (SUBMITTED -> LOCKED); requires no PROPOSED or DISPUTED adjustments on the entry"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: TestYearEntry
    side_effects: ["status -> LOCKED"]

  # --- Adjustment ---
  - method: POST
    path: "/api/v1/adjustments"
    description: "Propose a known-and-measurable adjustment against an entry in DRAFT or SUBMITTED"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, test_year_entry_id, amount_cents, reason]
    output: Adjustment
    side_effects:
      - "proposed_by_user_id := X-User-ID"
      - "status = PROPOSED"
      - "TestYearEntry.adjusted_amount_cents recomputed (PROPOSED counts)"

  - method: GET
    path: "/api/v1/adjustments"
    description: "List adjustments; filterable by rate_case_id, test_year_entry_id, status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "test_year_entry_id?", "status?", "limit?", "offset?"]
    output: "Adjustment[]"
    side_effects: []

  - method: GET
    path: "/api/v1/adjustments/{adjustmentId}"
    description: "Read one adjustment"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: Adjustment
    side_effects: []

  - method: POST
    path: "/api/v1/adjustments/{adjustmentId}/verify"
    description: "Verify a PROPOSED or DISPUTED adjustment; verifier must differ from proposer"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["verified_by_user_id := X-User-ID", "status -> VERIFIED", "TestYearEntry.adjusted_amount_cents recomputed"]

  - method: POST
    path: "/api/v1/adjustments/{adjustmentId}/withdraw"
    description: "Withdraw a PROPOSED or DISPUTED adjustment (proposer only)"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["status -> WITHDRAWN", "TestYearEntry.adjusted_amount_cents recomputed (WITHDRAWN excluded)"]

  - method: POST
    path: "/api/v1/adjustments/{adjustmentId}/dispute"
    description: "Dispute a VERIFIED adjustment (staff or any intervenor party)"
    roles: [CommissionStaff, IntervenorRep]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/api/v1/adjustments/{adjustmentId}/reject"
    description: "Reject a VERIFIED or DISPUTED adjustment"
    roles: [CommissionStaff]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["status -> REJECTED", "TestYearEntry.adjusted_amount_cents recomputed (REJECTED excluded)"]

  # --- RateBaseItem ---
  - method: POST
    path: "/api/v1/rate-base-items"
    description: "Add a rate-base item (case DRAFT or DEFICIENT)"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, label, plant_in_service_cents, accumulated_depreciation_cents, working_capital_cents, accumulated_deferred_taxes_cents]
    output: RateBaseItem
    side_effects: ["net_rate_base_cents computed", "status = DRAFT"]

  - method: GET
    path: "/api/v1/rate-base-items"
    description: "List rate-base items; filterable by rate_case_id and status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "limit?", "offset?"]
    output: "RateBaseItem[]"
    side_effects: []

  - method: GET
    path: "/api/v1/rate-base-items/{itemId}"
    description: "Read one rate-base item"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: RateBaseItem
    side_effects: []

  - method: POST
    path: "/api/v1/rate-base-items/{itemId}/submit"
    description: "Submit a DRAFT item for audit"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: RateBaseItem
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/api/v1/rate-base-items/{itemId}/audit"
    description: "Staff audit: outcome AUDIT_PASS -> AUDITED, AUDIT_EXCEPTION -> EXCEPTION"
    roles: [CommissionStaff]
    code: 200
    input: [outcome, "exception_notes?"]
    output: RateBaseItem
    side_effects: ["status -> AUDITED or EXCEPTION"]

  - method: POST
    path: "/api/v1/rate-base-items/{itemId}/revise"
    description: "Revise an EXCEPTION item's amounts (EXCEPTION -> SUBMITTED)"
    roles: [UtilityFiler]
    code: 200
    input: [plant_in_service_cents, accumulated_depreciation_cents, working_capital_cents, accumulated_deferred_taxes_cents]
    output: RateBaseItem
    side_effects: ["Amount fields replaced; net_rate_base_cents recomputed", "status -> SUBMITTED"]

  # --- CustomerClass ---
  - method: POST
    path: "/api/v1/customer-classes"
    description: "Define a customer class with billing determinants and present rate structure (case DRAFT or DEFICIENT)"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, class_code, customer_count, monthly_kwh_per_customer, annual_kwh, coincident_peak_kw, average_demand_kw, present_customer_charge_cents, present_tiers]
    output: CustomerClass
    side_effects: ["present_revenue_cents computed", "allocated_cost_cents computed under case allocation_method", "RateCase.present_revenue_total_cents recomputed"]

  - method: GET
    path: "/api/v1/customer-classes"
    description: "List customer classes; filterable by rate_case_id"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "limit?", "offset?"]
    output: "CustomerClass[]"
    side_effects: []

  - method: GET
    path: "/api/v1/customer-classes/{classId}"
    description: "Read one customer class"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: CustomerClass
    side_effects: []

  # --- DataRequest ---
  - method: POST
    path: "/api/v1/data-requests"
    description: "Issue a data request (case in DISCOVERY, within the discovery window); IntervenorRep callers must pass issuing_intervenor_id equal to their X-User-ID; CommissionStaff callers must omit it (staff-issued)"
    roles: [IntervenorRep, CommissionStaff]
    code: 201
    input: [rate_case_id, subject, body, "issuing_intervenor_id?", "referenced_adjustment_id?"]
    output: DataRequest
    side_effects:
      - "issuer_kind derived from caller role; issued_at := current clock; response_due_at := issued_at + 10 days"
      - "status = ISSUED"

  - method: GET
    path: "/api/v1/data-requests"
    description: "List data requests; filterable by rate_case_id, issuing_intervenor_id, referenced_adjustment_id, status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "issuing_intervenor_id?", "referenced_adjustment_id?", "status?", "limit?", "offset?"]
    output: "DataRequest[]"
    side_effects: []

  - method: GET
    path: "/api/v1/data-requests/{requestId}"
    description: "Read one data request"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: DataRequest
    side_effects: []

  - method: POST
    path: "/api/v1/data-requests/{requestId}/respond"
    description: "Utility responds (from ISSUED, OVERDUE, or RESPOND_REQUIRED)"
    roles: [UtilityFiler]
    code: 200
    input: [response_text]
    output: DataRequest
    side_effects: ["status -> RESPONDED", "If leaving OVERDUE: RateCase.overdue_data_request_count -= 1"]

  - method: POST
    path: "/api/v1/data-requests/{requestId}/object"
    description: "Utility objects instead of responding (from ISSUED only)"
    roles: [UtilityFiler]
    code: 200
    input: [objection_reason]
    output: DataRequest
    side_effects: ["status -> OBJECTED"]

  - method: POST
    path: "/api/v1/data-requests/{requestId}/rule"
    description: "ALJ rules on an objection: SUSTAINED -> CLOSED; OVERRULED -> RESPOND_REQUIRED with extended_due_at = clock + 5 days"
    roles: [ALJ]
    code: 200
    input: [ruling]
    output: DataRequest
    side_effects: ["status -> CLOSED or RESPOND_REQUIRED", "On OVERRULED: extended_due_at := current clock + 5 days"]

  - method: POST
    path: "/api/v1/data-requests/{requestId}/withdraw"
    description: "Issuing party withdraws an open request"
    roles: [IntervenorRep, CommissionStaff]
    code: 200
    input: []
    output: DataRequest
    side_effects: ["status -> WITHDRAWN", "If leaving OVERDUE: RateCase.overdue_data_request_count -= 1"]

  # --- SettlementProposal ---
  - method: POST
    path: "/api/v1/settlement-proposals"
    description: "Open a new settlement round (case must be in SETTLEMENT); supersedes the case's existing DRAFT or UNDER_NEGOTIATION proposal; OCC-guarded on the case version"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, proposed_revenue_requirement_cents, terms, expected_rate_case_version]
    output: SettlementProposal
    side_effects:
      - "round_number := max(existing round_number of the case) + 1 (1 if none); status = DRAFT"
      - "Existing proposal of the case in {DRAFT, UNDER_NEGOTIATION} -> SUPERSEDED and its {PENDING, SIGNED} signatories -> VOID; existing in {ASSENTED, RECOMMENDED, ADOPTED} -> request rejected ERR_PROPOSAL_NOT_SUPERSEDABLE"
      - "increments RateCase.version by 1"

  - method: GET
    path: "/api/v1/settlement-proposals"
    description: "List settlement proposals; filterable by rate_case_id and status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "limit?", "offset?"]
    output: "SettlementProposal[]"
    side_effects: []

  - method: GET
    path: "/api/v1/settlement-proposals/{proposalId}"
    description: "Read one settlement proposal"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: SettlementProposal
    side_effects: []

  - method: POST
    path: "/api/v1/settlement-proposals/{proposalId}/circulate"
    description: "Circulate a DRAFT proposal to all PARTY intervenors; generates PENDING signatory rows"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: SettlementProposal
    side_effects: ["Generate PENDING SettlementSignatory per PARTY Intervenor (ordered created_at ASC)", "required_signature_count set", "status -> UNDER_NEGOTIATION"]

  - method: POST
    path: "/api/v1/settlement-proposals/{proposalId}/recommend"
    description: "ALJ recommends an ASSENTED proposal to the commission"
    roles: [ALJ]
    code: 200
    input: []
    output: SettlementProposal
    side_effects: ["status -> RECOMMENDED"]

  - method: POST
    path: "/api/v1/settlement-proposals/{proposalId}/remand"
    description: "ALJ remands an ASSENTED proposal (terminal; remedy is a new round)"
    roles: [ALJ]
    code: 200
    input: [remand_reason]
    output: SettlementProposal
    side_effects: ["status -> REMANDED"]

  # --- SettlementSignatory (rows are system-generated at circulate) ---
  - method: GET
    path: "/api/v1/settlement-signatories"
    description: "List signatory rows; filterable by settlement_proposal_id, intervenor_id, status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["settlement_proposal_id?", "intervenor_id?", "status?", "limit?", "offset?"]
    output: "SettlementSignatory[]"
    side_effects: []

  - method: GET
    path: "/api/v1/settlement-signatories/{signatoryId}"
    description: "Read one signatory row"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: SettlementSignatory
    side_effects: []

  - method: POST
    path: "/api/v1/settlement-signatories/{signatoryId}/sign"
    description: "Sign a PENDING signatory row (owning intervenor's rep only); bubbles the proposal to ASSENTED on unanimity"
    roles: [IntervenorRep]
    code: 200
    input: []
    output: SettlementSignatory
    side_effects: ["status -> SIGNED; signed_at set", "Proposal signature_count recomputed; on unanimity proposal -> ASSENTED and RateCase.assented_proposal_count += 1"]

  - method: POST
    path: "/api/v1/settlement-signatories/{signatoryId}/decline"
    description: "Decline a PENDING signatory row (owning intervenor's rep only); terminal"
    roles: [IntervenorRep]
    code: 200
    input: []
    output: SettlementSignatory
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/api/v1/settlement-signatories/{signatoryId}/rescind"
    description: "Rescind a SIGNED row while the proposal is UNDER_NEGOTIATION or ASSENTED; drops an ASSENTED proposal back to UNDER_NEGOTIATION"
    roles: [IntervenorRep]
    code: 200
    input: []
    output: SettlementSignatory
    side_effects: ["status -> RESCINDED", "Proposal signature_count recomputed; if proposal was ASSENTED -> UNDER_NEGOTIATION and RateCase.assented_proposal_count -= 1"]

  # --- RegulatoryAsset ---
  - method: POST
    path: "/api/v1/regulatory-assets"
    description: "Register a deferred regulatory asset (case DRAFT or DEFICIENT); closed incurrence window must not intersect the test year"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, asset_name, principal_cents, incurrence_start, incurrence_end, amortization_months]
    output: RegulatoryAsset
    side_effects: ["monthly_base_cents and final_month_cents computed", "amortized_to_date_cents = 0", "status = DEFERRED"]

  - method: GET
    path: "/api/v1/regulatory-assets"
    description: "List regulatory assets; filterable by rate_case_id and status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "limit?", "offset?"]
    output: "RegulatoryAsset[]"
    side_effects: []

  - method: GET
    path: "/api/v1/regulatory-assets/{assetId}"
    description: "Read one regulatory asset"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: RegulatoryAsset
    side_effects: []

  # --- AmortizationEntry (rows are system-generated at issue-order) ---
  - method: GET
    path: "/api/v1/amortization-entries"
    description: "List amortization entries; filterable by regulatory_asset_id, rate_case_id, status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["regulatory_asset_id?", "rate_case_id?", "status?", "limit?", "offset?"]
    output: "AmortizationEntry[]"
    side_effects: []

  - method: GET
    path: "/api/v1/amortization-entries/{entryId}"
    description: "Read one amortization entry"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: AmortizationEntry
    side_effects: []

  - method: POST
    path: "/api/v1/amortization-entries/{entryId}/post"
    description: "Post the earliest PENDING installment of an AMORTIZING asset"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: AmortizationEntry
    side_effects: ["status -> POSTED; posted_at set", "RegulatoryAsset.amortized_to_date_cents += amount_cents", "If no PENDING remain: asset -> FULLY_AMORTIZED"]

  - method: POST
    path: "/api/v1/amortization-entries/{entryId}/reverse"
    description: "Reverse the latest POSTED installment (LIFO) of an AMORTIZING or FULLY_AMORTIZED asset"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: AmortizationEntry
    side_effects: ["status -> REVERSED", "RegulatoryAsset.amortized_to_date_cents -= amount_cents", "If asset was FULLY_AMORTIZED -> AMORTIZING"]

  # --- TariffRate ---
  - method: POST
    path: "/api/v1/tariff-rates"
    description: "Propose a tariff schedule for a class (case in DISCOVERY, HEARING, or SETTLEMENT); half-open effective window must not overlap a same-class non-REJECTED tariff; anti-subsidy floor and gradualism cap enforced"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, customer_class_id, label, proposed_customer_charge_cents, proposed_tiers, effective_start, "effective_end?"]
    output: TariffRate
    side_effects: ["proposed_revenue_cents computed", "status = PROPOSED"]

  - method: GET
    path: "/api/v1/tariff-rates"
    description: "List tariff rates; filterable by rate_case_id, customer_class_id, status"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "customer_class_id?", "status?", "limit?", "offset?"]
    output: "TariffRate[]"
    side_effects: []

  - method: GET
    path: "/api/v1/tariff-rates/{tariffId}"
    description: "Read one tariff rate"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: TariffRate
    side_effects: []

  # --- ComplianceFiling ---
  - method: POST
    path: "/api/v1/compliance-filings"
    description: "Open a compliance filing (case in COMPLIANCE_MONITORING); supersedes the case's existing DRAFT or REMANDED filing; OCC-guarded on the case version"
    roles: [UtilityFiler]
    code: 201
    input: [rate_case_id, period_label, actual_revenue_by_class, expected_rate_case_version]
    output: ComplianceFiling
    side_effects:
      - "actual_total_revenue_cents computed; status = DRAFT"
      - "Existing filing of the case in {DRAFT, REMANDED} -> SUPERSEDED (supersedes_filing_id set on the new filing); existing in {SUBMITTED, ACCEPTED} -> request rejected ERR_FILING_NOT_SUPERSEDABLE"
      - "increments RateCase.version by 1"

  - method: GET
    path: "/api/v1/compliance-filings"
    description: "List compliance filings; filterable by rate_case_id, status, and supersedes_filing_id (reverse-reachability for the self-FK)"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: ["rate_case_id?", "status?", "supersedes_filing_id?", "limit?", "offset?"]
    output: "ComplianceFiling[]"
    side_effects: []

  - method: GET
    path: "/api/v1/compliance-filings/{filingId}"
    description: "Read one compliance filing"
    roles: [UtilityFiler, CommissionStaff, IntervenorRep, ALJ]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []

  - method: POST
    path: "/api/v1/compliance-filings/{filingId}/submit"
    description: "Submit a DRAFT filing; freezes the true-up computation"
    roles: [UtilityFiler]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["true_up_delta_cents, true_up_action, class_true_up_lines computed and frozen", "status -> SUBMITTED"]

  - method: POST
    path: "/api/v1/compliance-filings/{filingId}/review"
    description: "Staff review: outcome ACCEPT -> ACCEPTED, REMAND -> REMANDED (notes required)"
    roles: [CommissionStaff]
    code: 200
    input: [outcome, "remand_notes?"]
    output: ComplianceFiling
    side_effects: ["status -> ACCEPTED or REMANDED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Only forward moves are accepted (ERR_CLOCK_REGRESSION). After advancing, runs discovery_overdue_sweep and tariff_supersede_sweep."
    roles: [CommissionStaff]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Logical clock := to_iso8601", "discovery_overdue_sweep", "tariff_supersede_sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_INVALID_REQUEST
