        distinguishing_aspect: "The same schedule-claims payload is sent twice: once at a batch id that does not exist and once at the real batch with a claim id that does not exist. Priority 5 must win in the first case (ERR_BATCH_NOT_FOUND) even though the body is also unresolvable, which is only observable because the two checks return DIFFERENT 404 error ids."
