            - { call: "GET /claims/${cl}/beneficiary-claims", payload: {}, as: ClaimsApprover }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
