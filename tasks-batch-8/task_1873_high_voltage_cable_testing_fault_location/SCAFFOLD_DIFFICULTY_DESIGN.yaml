          PRE-surcharge subtotal; length 1000 m with [VLF_TAN_DELTA] gives subtotal exactly
          400000, which is NOT > 400000, so STANDARD rate 6% applies -> 424000; a
          post-surcharge tier test would wrongly produce 448000.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 1000); window APPROVED; job DRAFT with budget exactly 424000."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-CF3", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
