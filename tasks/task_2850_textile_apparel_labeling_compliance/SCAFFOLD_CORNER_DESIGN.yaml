              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { e_both: $.data.error_id }
            - call: "GET /labeling/label-specs/${l1_id}"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { ver_mid: $.data.version }
            - call: "POST /labeling/label-specs/${l1_id}/hangtags"
              payload: { market_codes: ["US"], languages: ["en"], marketing_claims: ["WRINKLE_FREE"], fiber_content_text: "100.0% COTTON", origin_text: "Made in VN", expected_parent_label_spec_version: "${l1_ver}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { ok_hangtag: $.data.id, ok_cons: $.data.consistency_state }
          assert:
            - "Setup sanity: ${det_country} == \"VN\" and ${c1_shrink} == 2.0"
            - "First trigger: HTTP 422 and ${e_claim} == \"ERR_HANGTAG_CLAIM_UNSUPPORTED\" at priority 59 - the texts match, so only the claim can explain it"
            - "Second trigger: HTTP 422 and ${e_text} == \"ERR_HANGTAG_INCONSISTENT\" at priority 82"
            - "Third trigger: HTTP 422 and ${e_both} == \"ERR_HANGTAG_CLAIM_UNSUPPORTED\" - 59 answers before 82 when both are breached"
            - "${ver_mid} == ${l1_ver} - none of the three refusals bumped the parent, which is why the same expected version still works"
            - "Fourth trigger: HTTP 201 with a non-null ${ok_hangtag} and ${ok_cons} == \"CONSISTENT\" - shrinkage of exactly 2.0 satisfies the inclusive WRINKLE_FREE ceiling of 2.0"

