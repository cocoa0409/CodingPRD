  - section: calculations
    instances:
      - name: turnaround_recoupment_compounds_interest_and_adds_the_middle_handling_tier
        claim_type: correct_result
        grounds:
          - "calculations.turnaround_recoupment"
          - "constants.TURNAROUND_INTEREST_BPS_PER_YEAR"
          - "calculations.turnaround_recoupment.constants.HANDLING_FEE_TIER2_CENTS"
        distinguishing_aspect: "A 37375000 write-off carried three months earns 900 bps pro-rated to 840937 of interest and, because 37375000 falls in the 10000000..50000000 band, a 750000 handling fee - total 38965937, well under the 13500 bps cap of 50456250."
        test_recipe:
          setup:
            - "project \"Fault Lines\" was abandoned on 2026-09-26 with writeoff_cents 37375000 and offered for turnaround the same day; the clock now reads 2026-12-26, exactly 3 months later"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
