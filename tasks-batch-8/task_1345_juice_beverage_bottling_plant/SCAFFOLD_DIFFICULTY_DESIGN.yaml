          assert:
            - "res_before == 1050 (ceil(1000 * 1.05)) and res_after == 0 with avail_after == 5000 (hop: reservation fully released)"
            - "ProductionRun.${run1_id}.production_status == BLOCKED_SUPPLY (hop: batch condemn demoted the run)"
            - "Batch.${batch1}.status == CONDEMNED"
            - "run2_status == SCHEDULED (hop: the freed line window 2026-08-11T08:00-12:00Z is immediately rebookable — no ERR_LINE_WINDOW_CONFLICT)"

      - name: label_reject_cascade_demotes_confirmed_runs
        grounds:
          - state_machines.LabelClaimReview.PENDING_to_REJECTED
          - state_machines.Formula.LABEL_REVIEW_to_REVISION_REQUIRED
          - state_machines.ProductionRun.CONFIRMED_to_BLOCKED_LABEL
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (label-reviews/{id}/reject, not
          batch condemn): review REJECTED -> Formula LABEL_REVIEW ->
          REVISION_REQUIRED (hop 1) -> the formula's CONFIRMED runs ->
          BLOCKED_LABEL (hop 2); the later approve reverses hop 2 automatically.
        test_recipe:
          setup:
            - "ACTIVE customer; formula APPROVED (label_version 1); run R1 CONFIRMED (not yet scheduled)"
            - "Formula re-submitted (APPROVED -> LABEL_REVIEW); second review PENDING"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "LabelCascade Ltd", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "LC-473", name: "Label Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev1: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev1}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run1_id: $.data.id } }
            - { call: "POST /v1/production-runs/${run1_id}/confirm", payload: {}, as: ProductionPlanner }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev2: $.data.id, rev1_id_after: $.data.formula_id } }
          trigger:
            - { call: "POST /v1/label-reviews/${rev2}/reject", payload: { review_note: "vitamin claim unsubstantiated" }, as: LabelComplianceReviewer, as_user_id: "rev-2" }
            - { call: "GET /v1/production-runs/${run1_id}", payload: {}, as: Any, captures: { run1_mid: $.data.production_status } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { form_mid: $.data.status, fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev3: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev3}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "GET /v1/production-runs/${run1_id}", payload: {}, as: Any, captures: { run1_end: $.data.production_status } }
            - { call: "GET /v1/label-reviews/${rev2}", payload: {}, as: Any, captures: { rev2_status: $.data.status } }
          assert:
            - "run1_mid == BLOCKED_LABEL (cascade hop 2: reject demoted the CONFIRMED run)"
            - "form_mid == REVISION_REQUIRED (cascade hop 1)"
            - "rev2_status == REJECTED"
            - "run1_end == CONFIRMED (approve auto-restores BLOCKED_LABEL runs — reverse cascade)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_business_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
          - errors[ERR_MINIMUM_RUN_NOT_MET]
        distinguishing_aspect: |
          Category pair (state, business_constraint): the confirm call violates
          both ERR_CUSTOMER_NOT_ACTIVE (customer SUSPENDED, p5) and
          ERR_MINIMUM_RUN_NOT_MET (planned 499 < 500, p8); the state error wins.
        test_recipe:
          setup:
            - "Customer SUSPENDED; APPROVED formula; run QUOTED with planned_units 499"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "PrioOne", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "P1-473", name: "Prio One", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 499, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/suspend", payload: {}, as: FinanceClerk }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_ACTIVE (state p5), NOT ERR_MINIMUM_RUN_NOT_MET (business_constraint p8)"
            - "HTTP status == 409"
            - "ProductionRun.${run_id}.production_status remains QUOTED"

