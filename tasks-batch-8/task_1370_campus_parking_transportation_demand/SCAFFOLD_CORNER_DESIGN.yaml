      - name: shuttle_coverage_equality_boundary
        claim_type: constants_applied
        grounds: ["calculations.shuttle_coverage_calculation", "errors[ERR_INSUFFICIENT_SHUTTLE_CAPACITY]"]
        distinguishing_aspect: "daily_capacity == projected_daily_ridership (exactly 400 == 400) ACTIVATES (>= is sufficient); 401 projected is rejected."
        test_recipe:
          setup: ["fund with 84000 revenue; route R1 (window 480-960, headway 30 -> 16 runs * 25 seats = 400 capacity, projected 400); route R2 same geometry, projected 401, different fleet group"]
