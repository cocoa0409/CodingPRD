      - name: issuance_charges_minimum_commission_floor_applies
        claim_type: constants_applied
        grounds:
          - calculations.issuance_charges.constants.MIN_COMMISSION_CENTS
          - calculations.issuance_charges.constants.COMMISSION_TIER_1_BPS
          - endpoints.POST_/credits/{id}/issue
        distinguishing_aspect: |
          MIN_COMMISSION_CENTS is a floor, not an alternative: a 3000000 credit
          for one quarter prices at 15 bps to 4500 cents, so the stored
          base_commission_cents is the 25000 floor while commission_bps_applied is
          still 15. A 20000000 credit over two quarters prices to 40000, above the
          floor, and keeps its computed value - so the same constant is decisive
          in one case and inert in the other.
