      - name: forward_shipment_cancel_restores_custody_cardinality
        grounds:
          - conservation_invariants[mail_custody_cardinality]
          - state_machines.ForwardShipment.PRICED_to_CANCELLED
          - entities.MailItem.fields.forward_shipment_id
        distinguishing_aspect: |
          Conserved quantity 3 — CUSTODY CARDINALITY, distinct from money and from quota units.
          Creating a consolidation and then cancelling it is a forward action plus its compensating
          action, and every piece must end back in exactly one custody bucket with
          in_custody + released + destroyed still equal to the box's piece count of 3.
        test_recipe:
          setup:
            - "An ACTIVE box with a RELEASABLE recipient and three matched 3.0 lb FLAT pieces, each carrying a PENDING FORWARD disposition."
            - "One PRICED EXPRESS ForwardShipment holding all three."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "W-2301", plan_tier_id: "${plan_id}", holder_name: "Zoe Undo", holder_email: "zoe@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Zoe Undo", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Zoe Undo", item_class: "FLAT", signature_required: false, actual_weight_lb: 3.0, length_in: 12.0, width_in: 9.0, height_in: 1.0, interior_scan_consent: false }
              as: CmraOperator
              captures: { mi_a: "$.data.id" }
            - call: "POST /mail-items/${mi_a}/match"
              payload: { recipient_id: "${rec_id}" }
              as: CmraOperator
              captures: { mi_a_v: "$.data.version" }
            - call: "POST /mail-items/${mi_a}/dispositions"
              payload: { disposition_type: "FORWARD", expected_mail_item_version: "${mi_a_v}" }
              as: BoxHolder
              as_user_id: "${box_id}"
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Zoe Undo", item_class: "FLAT", signature_required: false, actual_weight_lb: 3.0, length_in: 12.0, width_in: 9.0, height_in: 1.0, interior_scan_consent: false }
              as: CmraOperator
              captures: { mi_b: "$.data.id" }
            - call: "POST /mail-items/${mi_b}/match"
              payload: { recipient_id: "${rec_id}" }
              as: CmraOperator
              captures: { mi_b_v: "$.data.version" }
            - call: "POST /mail-items/${mi_b}/dispositions"
              payload: { disposition_type: "FORWARD", expected_mail_item_version: "${mi_b_v}" }
              as: BoxHolder
              as_user_id: "${box_id}"
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Zoe Undo", item_class: "FLAT", signature_required: false, actual_weight_lb: 3.0, length_in: 12.0, width_in: 9.0, height_in: 1.0, interior_scan_consent: false }
              as: CmraOperator
              captures: { mi_c: "$.data.id" }
