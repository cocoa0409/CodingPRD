              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-702", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9201" }
              as: AirportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /wildlife/take-permits"
              payload: { airport_id: "${ap_id}", species_id: "${sp_id}", issued_by_regulator_id: "${r_id}", permit_number: "MB0002-00", authorized_take_total: 10, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { tp_id: $.data.id }
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
            # Two LOGGED dispersals referencing P
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-15T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 2, take_permit_id: "${tp_id}" }
