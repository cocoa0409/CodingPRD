            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/warranty-claims", payload: { po_line_id: "${l1}", parts_cost_cents: 5000, description: "premature claim" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
