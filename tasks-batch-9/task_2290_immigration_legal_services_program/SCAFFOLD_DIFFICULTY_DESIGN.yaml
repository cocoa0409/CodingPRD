              payload: { matter_id: "${m_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-10-15T14:00:00.000Z", ends_at_utc: "2026-10-15T15:00:00.000Z", location_code: "USCISPHX", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { ce_far_id: "$.data.id" }
          trigger:
            - call: "POST /case-assignments/${asg_a_id}/transition"
              payload: { action: "SUSPEND", release_reason_code: "CASELOAD_REBALANCE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${asg_a_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "RESUME_DRAFT", word_count: 950 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /declarations/${dec_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW", word_count: 950 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${asg_a_id}/transition"
              payload: { action: "SUSPEND", release_reason_code: "CASELOAD_REBALANCE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${asg_a_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
          assert:
            - "step 1 returns HTTP 200; CaseAssignment ${asg_a_id}.status == 'SUSPENDED', CaseMatter ${m_id}.representation_status == 'COVERAGE_GAP', coverage_gap_flag == true, and Representative ${atty_a_id}.active_case_load == 0."
            - "After step 1: Declaration ${dec_id}.status == 'REVISION_REQUESTED', revision_round == 1, revision_reason_code == 'SUPERVISION_REQUIRED'."
            - "After step 1: CalendarEvent ${ce_near_id}.coverage_gap_flag == true (2026-09-10 is 9 days after the clock, inside the 14-day lookahead) while CalendarEvent ${ce_far_id}.coverage_gap_flag == false (44 days out)."
            - "step 2 returns HTTP 200; CaseAssignment ${asg_a_id}.status == 'ACTIVE', release_reason_code == null, CaseMatter ${m_id}.representation_status == 'STAFFED', coverage_gap_flag == false, and CalendarEvent ${ce_near_id}.coverage_gap_flag == false."
            - "After step 2: Declaration ${dec_id}.status is STILL 'REVISION_REQUESTED' with revision_round == 1 - re-activation compensates flags only, never the declaration."
            - "steps 3 and 4 return HTTP 200; Declaration ${dec_id} walks REVISION_REQUESTED -> DRAFT -> IN_REVIEW with word_count == 950 and revision_reason_code == null after step 3."
            - "step 5 returns HTTP 200; CaseMatter ${m_id}.representation_status == 'COVERAGE_GAP' for the SECOND time and Declaration ${dec_id}.revision_round == 2 (the cycle re-fires the collateral hop)."
            - "step 6 returns HTTP 200; CaseMatter ${m_id}.representation_status == 'STAFFED' again and Representative ${atty_a_id}.active_case_load == 1."
            - "CaseMatter ${m_id}.filing_status == 'EVIDENCE_GATHERING' after every one of steps 1-6, and readiness_gate_applied remains null: the representation dimension never touches the filing dimension."
            - "CaseMatter ${m_id}.version is strictly greater after each of steps 1, 2, 5 and 6 (each representation move increments it)."

      - name: accreditation_renewal_cycle_reenters_approved_with_partial_forum_ceiling
        grounds:
          - state_machines.Accreditation.PENDING_to_APPROVED
          - state_machines.Accreditation.APPROVED_to_EXPIRING
          - state_machines.Accreditation.EXPIRING_to_RENEWAL_PENDING
          - state_machines.Accreditation.RENEWAL_PENDING_to_APPROVED
          - calculations.accreditation_forum_grant
          - calculations.representative_authorization_status
          - concurrency_rules[accreditation-renew-stale-recognition]
        distinguishing_aspect: |
          One Accreditation row walks the full APPROVED -> EXPIRING -> RENEWAL_PENDING ->
          APPROVED cycle where EXPIRING is reachable ONLY through the cycle checkpoint
          inside the 90-day window (clock 2029-08-21 against expiry 2029-08-31) and the
          re-entry into APPROVED must recompute rather than copy: renewal_round 0 -> 1,
          effective_date 2026-09-01 -> 2029-08-21, expiry_date 2029-08-31 -> 2032-08-20
          (+1095 days across the 2032 leap year), and authorized_forums stays exactly
          ['USCIS'] even though the renew request asks for USCIS + EOIR_IMMIGRATION_COURT +
          BIA, because the PARTIAL type ceiling intersects the request down to USCIS - a
          linear machine that treats renewal as a fresh grant would widen the forums.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "One long-lived cycle used purely as the checkpoint driver (no intakes)."
            - "OrganizationRecognition ACTIVE 2026-01-01..2033-12-31 authorizing USCIS, ASYLUM_OFFICE and EOIR_IMMIGRATION_COURT."
            - "One ACCREDITED_REP with a PENDING PARTIAL accreditation requesting USCIS + EOIR_IMMIGRATION_COURT."
            - "One STAFF_ATTORNEY (AUTHORIZED_ATTORNEY) acts as the non-self approver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
