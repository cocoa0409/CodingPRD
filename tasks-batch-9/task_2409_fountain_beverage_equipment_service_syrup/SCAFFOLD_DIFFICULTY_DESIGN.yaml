scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: forecast_variant_divergence_trailing_actual_vs_throughput_projected
        grounds:
          - calculations.outlet_supply_forecast
          - entities.OutletSupplyPosition.fields.forecast_units
          - entities.OutletSupplyPosition.fields.requested_units
          - entities.OutletSupplyPosition.fields.forecast_variant
          - entities.OutletSupplyPosition.fields.alert_level
        distinguishing_aspect: |
          Supply-planning domain: identical telemetry (7000 oz over a 7-day window) and identical
          on-hand stock yield forecast_units 34.00 under TRAILING_ACTUAL and 46.00 under
          THROUGHPUT_PROJECTED because only the second variant multiplies by TIER_FACTOR[LARGE]=1.3,
          so the two runs on the same row differ by exactly 12.00 units.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-15T00:00:00Z."
            - "Outlet R1 with throughput_tier LARGE and water_hardness_gpg 8 (no filter derate involved)."
            - "One ACTIVE placement agreement with one IN_SERVICE dispenser unit at that outlet."
            - "SupplyItem COKE_CART: 350 ounces_per_unit, case_pack_units 4, non-promotional, national pool 1000."
            - "Exactly one TelemetryReading for that SKU: 7000 dispensed_ounces at 2026-08-10T00:00:00Z (inside the half-open window [2026-08-08, 2026-08-15))."
            - "OutletSupplyPosition for (outlet, SKU) holding on_hand_units 6, alert_level NONE, version 1, no forecast run yet."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Stadium Concourse 12", account_code: "ACCT-DVC-A", region_code: "R1", throughput_tier: "LARGE", water_hardness_gpg: 8 }
              as: NetworkAdmin
              captures: { o1: $.data.id, o1v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o1}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, free_on_loan: true, shortfall_fee_cents_per_gallon: 50, expected_outlet_version: "${o1v}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o1}", agreement_id: "${ag1}", serial_number: "SN-DVC-A-01", model_code: "FREESTYLE_9100", installed_at: "2026-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du1: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag1}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "COKE_CART", brand_name: "Coca-Cola", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 350, promotional: false, national_allocation_units: 1000 }
              as: NetworkAdmin
              captures: { si1: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du1}", supply_item_id: "${si1}", dispensed_ounces: 7000, reading_at: "2026-08-10T00:00:00Z", window_days: 7, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o1}", supply_item_id: "${si1}", on_hand_units: 6 }
              as: SupplyPlanner
              captures: { sp1: $.data.id }
          trigger:
            - call: "POST /fountain-network/supply-positions/${sp1}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
              captures: { f_trailing: $.data.forecast_units, r_trailing: $.data.requested_units }
            - call: "POST /fountain-network/supply-positions/${sp1}/forecast"
              payload: { variant: "THROUGHPUT_PROJECTED", window_days: 7 }
              as: SupplyPlanner
              captures: { f_projected: $.data.forecast_units, r_projected: $.data.requested_units }
          assert:
            - "After trigger[0]: OutletSupplyPosition.${sp1}.forecast_units == 34.00"
            - "After trigger[0]: OutletSupplyPosition.${sp1}.requested_units == 34"
            - "After trigger[0]: OutletSupplyPosition.${sp1}.forecast_variant == TRAILING_ACTUAL"
            - "After trigger[1]: OutletSupplyPosition.${sp1}.forecast_units == 46.00"
            - "After trigger[1]: OutletSupplyPosition.${sp1}.requested_units == 46"
            - "After trigger[1]: OutletSupplyPosition.${sp1}.forecast_variant == THROUGHPUT_PROJECTED"
            - "${f_projected} - ${f_trailing} == 12.00 and ${r_projected} - ${r_trailing} == 12"
            - "OutletSupplyPosition.${sp1}.alert_level == CRITICAL after both runs (coverage_days == 2.1 < 3)"
            - "OutletSupplyPosition.${sp1}.promo_suppressed == false after both runs"
            - "OutletSupplyPosition.${sp1}.version == 3 (1 at creation, +1 per forecast run)"
            - "DispenserUnit.${du1}.lifetime_dispensed_gallons == 54.69 (7000 / 128, unchanged by either forecast)"

      - name: recall_exposure_variant_divergence_book_value_vs_replacement_risk
        grounds:
          - calculations.equipment_recall_exposure
          - calculations.agreement_shortfall_fee
          - entities.PlacementAgreement.fields.recall_exposure_cents
          - entities.PlacementAgreement.fields.exposure_variant
          - validations[priority=36]
          - state_machines.PlacementAgreement.SHORTFALL_REVIEW_to_ACTIVE
          - state_machines.PlacementAgreement.SHORTFALL_REVIEW_to_RECALL_PENDING
        distinguishing_aspect: |
          Equipment-risk domain (different calculation and different entity from the forecast instance):
          the same single unit installed 2026-01-01 with equipment_value_cents 480000 and 9 whole
          months in service produces 436800 cents under BOOK_VALUE — below the 450000 recall floor, so
          RECALL is refused — and 501600 cents under REPLACEMENT_RISK, which clears the floor and lets
          the identical fleet be recalled.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-10-01T00:00:00Z, i.e. 273 days = 9 whole 30-day months after installation."
            - "Outlet R2, one ACTIVE agreement: annual_commitment_gallons 8000, shortfall_fee_cents_per_gallon 50, equipment_value_cents 480000, free_on_loan true."
            - "Exactly one IN_SERVICE dispenser unit installed_at 2026-01-01T00:00:00Z."
            - "Three telemetry readings placing 1000.99 / 1500.99 / 1800.99 gallons into Q1 / Q2 / Q3 of 2026."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Cinema Lobby 4", account_code: "ACCT-DVC-B", region_code: "R2", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o2: $.data.id, o2v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o2}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, free_on_loan: true, shortfall_fee_cents_per_gallon: 50, expected_outlet_version: "${o2v}" }
              as: NetworkAdmin
              captures: { ag2: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o2}", agreement_id: "${ag2}", serial_number: "SN-DVC-B-01", model_code: "FREESTYLE_9100", installed_at: "2026-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du2: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag2}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "DIET_CART", brand_name: "Diet Coke", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 350, promotional: false, national_allocation_units: 1000 }
              as: NetworkAdmin
              captures: { si2: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du2}", supply_item_id: "${si2}", dispensed_ounces: 128126.72, reading_at: "2026-02-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du2}", supply_item_id: "${si2}", dispensed_ounces: 192126.72, reading_at: "2026-05-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du2}", supply_item_id: "${si2}", dispensed_ounces: 230526.72, reading_at: "2026-08-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
          trigger:
            - call: "POST /fountain-network/placement-agreements/${ag2}/assess-shortfall"
              payload: { period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z", exposure_variant: "BOOK_VALUE" }
              as: NetworkAdmin
              as_user_id: "admin-001"
              captures: { exp_book: $.data.recall_exposure_cents }
            - call: "POST /fountain-network/placement-agreements/${ag2}/recall-decision"
              payload: { outcome: "RECALL" }
              as: ComplianceOfficer
              as_user_id: "officer-001"
              captures: { err_floor: $.data.error_id }
            - call: "POST /fountain-network/placement-agreements/${ag2}/recall-decision"
              payload: { outcome: "FEE_ONLY" }
              as: ComplianceOfficer
              as_user_id: "officer-001"
            - call: "POST /fountain-network/placement-agreements/${ag2}/assess-shortfall"
              payload: { period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z", exposure_variant: "REPLACEMENT_RISK" }
              as: NetworkAdmin
              as_user_id: "admin-001"
              captures: { exp_repl: $.data.recall_exposure_cents }
            - call: "POST /fountain-network/placement-agreements/${ag2}/recall-decision"
              payload: { outcome: "RECALL" }
              as: ComplianceOfficer
              as_user_id: "officer-001"
          assert:
            - "After trigger[0]: PlacementAgreement.${ag2}.recall_exposure_cents == 436800 and exposure_variant == BOOK_VALUE"
            - "After trigger[0]: PlacementAgreement.${ag2}.assessed_fee_cents == 84853 (the fee is variant-independent)"
            - "After trigger[0]: PlacementAgreement.${ag2}.status == SHORTFALL_REVIEW"
            - "trigger[1] returns HTTP 409 with ${err_floor} == ERR_RECALL_EXPOSURE_BELOW_FLOOR (436800 < 450000)"
            - "After trigger[1]: PlacementAgreement.${ag2}.status == SHORTFALL_REVIEW (unchanged) and DispenserUnit.${du2}.status == IN_SERVICE"
            - "After trigger[2]: PlacementAgreement.${ag2}.status == ACTIVE"
            - "After trigger[3]: PlacementAgreement.${ag2}.recall_exposure_cents == 501600 and exposure_variant == REPLACEMENT_RISK"
            - "${exp_repl} - ${exp_book} == 64800"
            - "After trigger[3]: PlacementAgreement.${ag2}.assessed_fee_cents == 84853 (identical under both variants)"
            - "After trigger[4]: PlacementAgreement.${ag2}.status == RECALL_PENDING and DispenserUnit.${du2}.status == RECALL_STAGED"

  - rule_id: combinatorial_formula
    instances:

      - name: quarterly_shortfall_fee_round_then_sum_order_dependence
        grounds:
          - calculations.agreement_shortfall_fee
          - entities.PlacementAgreement.fields.assessed_fee_cents
          - entities.PlacementAgreement.fields.assessed_shortfall_gallons
          - entities.PlacementAgreement.fields.assessment_period_start
          - validations[priority=34]
        distinguishing_aspect: |
          Mode (b) — rounding order: the fee is rounded per calendar quarter and only then summed, so
          three quarters each carrying a half-cent remainder produce assessed_fee_cents 84853, whereas
          summing the shortfall gallons first (1697.03 x 50 = 84851.5 -> 84852) is off by one cent.
          Only quarters whose start instant lies inside the half-open request period are assessed, so
          Q4 (start 2026-10-01) is excluded by the period_end_date.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-10-01T00:00:00Z."
            - "Outlet R3 with one ACTIVE agreement: annual_commitment_gallons 8000 (2000 per quarter, never rounded), shortfall_fee_cents_per_gallon 50, equipment_value_cents 480000, free_on_loan true."
            - "One IN_SERVICE unit installed_at 2026-01-01T00:00:00Z."
            - "Telemetry: 128126.72 oz in Q1, 192126.72 oz in Q2, 230526.72 oz in Q3 — i.e. 1000.99 / 1500.99 / 1800.99 gallons, each leaving a shortfall whose fee ends in .5 cents."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Food Court North", account_code: "ACCT-CF-A", region_code: "R3", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o3: $.data.id, o3v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o3}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, free_on_loan: true, shortfall_fee_cents_per_gallon: 50, expected_outlet_version: "${o3v}" }
              as: NetworkAdmin
              captures: { ag3: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o3}", agreement_id: "${ag3}", serial_number: "SN-CF-A-01", model_code: "FREESTYLE_9100", installed_at: "2026-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du3: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag3}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SPRITE_BIB", brand_name: "Sprite", supply_form: "BAG_IN_BOX", case_pack_units: 2, ounces_per_unit: 640, promotional: false, national_allocation_units: 800 }
              as: NetworkAdmin
              captures: { si3: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du3}", supply_item_id: "${si3}", dispensed_ounces: 128126.72, reading_at: "2026-02-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du3}", supply_item_id: "${si3}", dispensed_ounces: 192126.72, reading_at: "2026-05-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du3}", supply_item_id: "${si3}", dispensed_ounces: 230526.72, reading_at: "2026-08-15T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
          trigger:
            - call: "POST /fountain-network/placement-agreements/${ag3}/assess-shortfall"
              payload: { period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "admin-002"
              captures: { fee3: $.data.assessed_fee_cents }
          assert:
            - "PlacementAgreement.${ag3}.assessed_fee_cents == 84853 (49951 + 24951 + 9951, each quarter rounded half-up before summing)"
            - "PlacementAgreement.${ag3}.assessed_fee_cents != 84852 (the sum-then-round answer)"
            - "PlacementAgreement.${ag3}.assessed_shortfall_gallons == 1697.03"
            - "PlacementAgreement.${ag3}.exposure_variant == BOOK_VALUE (default applied when exposure_variant is omitted)"
            - "PlacementAgreement.${ag3}.recall_exposure_cents == 436800"
            - "PlacementAgreement.${ag3}.assessment_period_start == 2026-01-01T00:00:00Z and assessment_period_end == 2026-10-01T00:00:00Z"
            - "PlacementAgreement.${ag3}.shortfall_assessed_by_user_id == admin-002"
            - "PlacementAgreement.${ag3}.status == SHORTFALL_REVIEW and version == 3"

      - name: service_call_severity_multi_factor_score_with_capped_overdue_term
        grounds:
          - calculations.service_call_severity
          - calculations.outlet_service_posture
          - entities.ServiceCall.fields.severity_score
          - entities.ServiceCall.fields.severity
          - entities.Outlet.fields.overdue_task_count
        distinguishing_aspect: |
          Mode (a) — a single score combines four independent inputs (symptom weight, posture add,
          min-capped overdue term, calibration add) so the band is not a function of the symptom
          alone: with the same outlet state (RESTRICTED, 2 overdue tasks) NO_POUR scores 85 = CRITICAL
          while CO2_LOW scores 55 = ROUTINE, two bands apart from a 30-point base difference.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-10T00:00:00Z, past the 72-hour grace of both tasks."
            - "Outlet R4 with one ACTIVE agreement and one IN_SERVICE unit whose calibration_status is still UNVERIFIED (calib_add 0)."
            - "Two MaintenanceTask rows (PREVENTIVE and SANITATION) due 2026-08-02T00:00:00Z, both evaluated into OVERDUE."
            - "Outlet.overdue_task_count == 2 and service_posture == RESTRICTED (>= RESTRICTED_OVERDUE_AT 1, below FROZEN_OVERDUE_AT 3)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Airport Gate B7", account_code: "ACCT-CF-B", region_code: "R4", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o4: $.data.id, o4v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o4}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 4000, equipment_value_cents: 300000, free_on_loan: true, shortfall_fee_cents_per_gallon: 40, expected_outlet_version: "${o4v}" }
              as: NetworkAdmin
              captures: { ag4: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o4}", agreement_id: "${ag4}", serial_number: "SN-CF-B-01", model_code: "FREESTYLE_9100", installed_at: "2026-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du4: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag4}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/maintenance-tasks"
              payload: { dispenser_unit_id: "${du4}", task_type: "PREVENTIVE", due_at: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-010"
              captures: { mt_prev: $.data.id }
            - call: "POST /fountain-network/maintenance-tasks"
              payload: { dispenser_unit_id: "${du4}", task_type: "SANITATION", due_at: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-010"
              captures: { mt_san: $.data.id }
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/maintenance-tasks/${mt_prev}/evaluate-due"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-010"
            - call: "POST /fountain-network/maintenance-tasks/${mt_san}/evaluate-due"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-010"
          trigger:
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du4}", reported_at: "2026-08-10T00:00:00Z", symptom_code: "NO_POUR" }
              as: NetworkAdmin
              captures: { sc_hi: $.data.id, score_hi: $.data.severity_score }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du4}", reported_at: "2026-08-10T00:00:00Z", symptom_code: "CO2_LOW" }
              as: NetworkAdmin
              captures: { sc_lo: $.data.id, score_lo: $.data.severity_score }
          assert:
            - "MaintenanceTask.${mt_prev}.status == OVERDUE with breach_kind == DATE"
            - "MaintenanceTask.${mt_san}.status == OVERDUE with breach_kind == DATE"
            - "Outlet.${o4}.overdue_task_count == 2 and Outlet.${o4}.service_posture == RESTRICTED"
            - "ServiceCall.${sc_hi}.severity_score == 85 (60 + 15 + min(20, 5*2) + 0) and severity == CRITICAL"
            - "ServiceCall.${sc_lo}.severity_score == 55 (30 + 15 + 10 + 0) and severity == ROUTINE"
            - "${score_hi} - ${score_lo} == 30"
            - "ServiceCall.${sc_hi}.status == OPEN and version == 1"
            - "DispenserUnit.${du4}.calibration_status == UNVERIFIED (no CALIBRATION_ADD applied to either score)"

  - rule_id: non_linear_state_machine
    instances:

      - name: outlet_suspend_reinstate_suspend_cycle_preserves_version_monotonicity
        grounds:
          - state_machines.Outlet.ACTIVE_to_SUSPENDED
          - state_machines.Outlet.SUSPENDED_to_ACTIVE
          - entities.Outlet.fields.status
          - entities.Outlet.fields.version
          - validations[priority=9]
        distinguishing_aspect: |
          Outlet.status carries a true ACTIVE <-> SUSPENDED cycle: the same row is suspended,
          reinstated and suspended again, ending in SUSPENDED with version 5 (never reset), and the
          second SUSPEND is accepted only because REINSTATE genuinely returned the row to ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R5 in status ACTIVE with version 2 (1 at creation, +1 from the agreement write)."
            - "One DRAFT agreement plus one IN_SERVICE unit so the outlet holds equipment while it cycles."
            - "open_compliance_hold_count == 0, so REINSTATE's precondition is satisfied."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Campus Union Deli", account_code: "ACCT-NL-A", region_code: "R5", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o5: $.data.id, o5v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o5}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 4000, equipment_value_cents: 300000, free_on_loan: true, shortfall_fee_cents_per_gallon: 40, expected_outlet_version: "${o5v}" }
              as: NetworkAdmin
              captures: { ag5: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o5}", agreement_id: "${ag5}", serial_number: "SN-NL-A-01", model_code: "FREESTYLE_9100", installed_at: "2026-02-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du5: $.data.id }
          trigger:
            - call: "POST /fountain-network/outlets/${o5}/status-change"
              payload: { action: "SUSPEND", reason_code: "VOLUME_REVIEW" }
              as: NetworkAdmin
              captures: { st_after_first: $.data.status }
            - call: "POST /fountain-network/outlets/${o5}/status-change"
              payload: { action: "REINSTATE" }
              as: NetworkAdmin
              captures: { st_after_reinstate: $.data.status }
            - call: "POST /fountain-network/outlets/${o5}/status-change"
              payload: { action: "SUSPEND", reason_code: "VOLUME_REVIEW" }
              as: NetworkAdmin
              captures: { st_after_second: $.data.status, v_final: $.data.version }
          assert:
            - "${st_after_first} == SUSPENDED"
            - "${st_after_reinstate} == ACTIVE"
            - "${st_after_second} == SUSPENDED"
            - "Outlet.${o5}.version == 5 (2 before the trigger chain, +1 per accepted transition; ${v_final} == 5)"
            - "Outlet.${o5}.service_posture == OPEN throughout (both counters stay 0)"
            - "PlacementAgreement.${ag5}.status == DRAFT (the status cycle never touches the agreement)"
            - "DispenserUnit.${du5}.status == IN_SERVICE"

      - name: service_call_on_site_escalated_dispatched_loop_reindexes_parts
        grounds:
          - state_machines.ServiceCall.ON_SITE_to_ESCALATED
          - state_machines.ServiceCall.ESCALATED_to_DISPATCHED
          - entities.ServiceCall.fields.escalation_count
          - entities.VanPartStock.fields.reserved_units
          - calculations.van_parts_ledger
          - validations[priority=12]
        distinguishing_aspect: |
          ServiceCall.status re-enters DISPATCHED from ESCALATED, so the loop is exercised on a
          different entity from the Outlet cycle: escalation_count increments to 1, the van
          reservation is fully unwound and then re-taken at a different size (2 units released, 3
          re-reserved), and the second dispatch legitimately assigns a different technician.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R6 with one ACTIVE agreement and one IN_SERVICE unit."
            - "VanPartStock (van V-77, part PUMP_ASSY_12) created with on_van_units 5, so initial_units == 5."
            - "One OPEN service call on that unit reported at 2026-08-01T00:00:00Z with symptom NO_POUR (posture OPEN, 0 overdue, calibration UNVERIFIED)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Turnpike Plaza 3", account_code: "ACCT-NL-B", region_code: "R6", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o6: $.data.id, o6v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o6}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 4000, equipment_value_cents: 300000, free_on_loan: true, shortfall_fee_cents_per_gallon: 40, expected_outlet_version: "${o6v}" }
              as: NetworkAdmin
              captures: { ag6: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o6}", agreement_id: "${ag6}", serial_number: "SN-NL-B-01", model_code: "FREESTYLE_9100", installed_at: "2026-02-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du6: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag6}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/van-part-stocks"
              payload: { van_code: "V-77", part_sku: "PUMP_ASSY_12", on_van_units: 5 }
              as: NetworkAdmin
              captures: { vp6: $.data.id }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du6}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "NO_POUR" }
              as: NetworkAdmin
              captures: { sc6: $.data.id }
          trigger:
            - call: "POST /fountain-network/service-calls/${sc6}/dispatch"
              payload: { van_code: "V-77", scheduled_window_start: "2026-08-01T09:00:00Z", scheduled_window_end: "2026-08-01T11:00:00Z", part_sku: "PUMP_ASSY_12", part_units: 2 }
              as: ServiceTechnician
              as_user_id: "tech-001"
            - call: "POST /fountain-network/service-calls/${sc6}/arrive-on-site"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-001"
            - call: "POST /fountain-network/service-calls/${sc6}/escalate"
              payload: { escalation_reason_code: "PART_MISMATCH" }
              as: ServiceTechnician
              as_user_id: "tech-001"
              captures: { esc_count: $.data.escalation_count }
            - call: "POST /fountain-network/service-calls/${sc6}/dispatch"
              payload: { van_code: "V-77", scheduled_window_start: "2026-08-01T13:00:00Z", scheduled_window_end: "2026-08-01T15:00:00Z", part_sku: "PUMP_ASSY_12", part_units: 3 }
              as: ServiceTechnician
              as_user_id: "tech-002"
              captures: { st_final: $.data.status }
          assert:
            - "After trigger[2]: ServiceCall.${sc6}.status == ESCALATED, escalation_count == 1 (${esc_count} == 1), van_code == null, assigned_tech_user_id == null, reserved_part_units == 0"
            - "After trigger[2]: VanPartStock.${vp6}.on_van_units == 5 and reserved_units == 0 (the 2-unit reservation was fully reversed)"
            - "After trigger[3]: ${st_final} == DISPATCHED and ServiceCall.${sc6}.assigned_tech_user_id == tech-002"
            - "After trigger[3]: ServiceCall.${sc6}.reserved_part_units == 3 and reserved_part_stock_id == ${vp6}"
            - "After trigger[3]: VanPartStock.${vp6}.on_van_units == 2, reserved_units == 3, consumed_units == 0"
            - "VanPartStock.${vp6}: on_van_units + reserved_units + consumed_units == initial_units + restocked_units == 5"
            - "ServiceCall.${sc6}.escalation_count == 1 is still below the escalation limit of 2 (validations[priority=12] not yet triggerable)"
            - "ServiceCall.${sc6}.severity_score == 60 and severity == URGENT (unchanged by the loop)"
            - "ServiceCall.${sc6}.version == 5 (1 at creation, +1 per dispatch/arrive/escalate/dispatch)"

  - rule_id: transitive_cascade
    instances:

      - name: telemetry_gallon_breach_cascades_to_frozen_posture_and_released_allocation
        grounds:
          - calculations.maintenance_due_evaluation
          - calculations.outlet_service_posture
          - calculations.supply_pool_ledger
          - state_machines.MaintenanceTask.SCHEDULED_to_OVERDUE
          - state_machines.RouteStop.PENDING_to_SKIPPED
          - entities.DispenserUnit.fields.lifetime_dispensed_gallons
          - entities.Outlet.fields.overdue_task_count
          - entities.OutletSupplyPosition.fields.allocated_units
          - entities.SupplyItem.fields.reserved_pool_units
        distinguishing_aspect: |
          Depth-5 chain from a single immutable telemetry write: reading -> DispenserUnit gallon
          counter -> FILTER_CHANGE task OVERDUE (breach_kind GALLON) -> Outlet.overdue_task_count 3
          and service_posture FROZEN -> RouteStop SKIPPED (POSTURE_FROZEN) -> allocation released from
          the SKU pool and the route commitment. Trigger is POST /telemetry-readings.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-10T00:00:00Z."
            - "Outlet R7, water_hardness_gpg 25, one ACTIVE agreement, one IN_SERVICE unit installed 2026-01-01."
            - "PREVENTIVE and SANITATION tasks due 2026-08-02 already evaluated into OVERDUE, so overdue_task_count == 2 and service_posture == RESTRICTED (one short of FROZEN_OVERDUE_AT)."
            - "A SCHEDULED FILTER_CHANGE task with gallon_interval 4000, derated to effective_gallon_interval 2800.00 by the 25 gpg feed water."
            - "One 7000 oz reading at 2026-08-09 leaves lifetime_dispensed_gallons 54.69, far below the interval."
            - "A CRITICAL position (on_hand 6, requested_units 34) holds a 32-unit allocation on a PENDING stop of a PLANNED route, so SupplyItem.reserved_pool_units == 32 and ReplenishmentRoute.committed_units == 32."
