            - "trigger call 2 returns HTTP 403 and ${e_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "ScreeningCheck.${chk_id}.result == HIT_PENDING_REVIEW and reviewed_by_user_id is null and reviewed_at is null after trigger call 2"
            - "trigger call 3 succeeds: ScreeningCheck.${chk_id}.result == RELEASED and reviewed_by_user_id == cmp_2"
