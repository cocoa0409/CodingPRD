  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — BallotVote gated by Ballot state vs
  # PetitionSignature gated by TrafficCalmingRequest state. Different pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: vote_rejected_once_ballot_tallied
        grounds:
          - state_machines.Ballot.OPEN_to_TALLIED
          - validations[priority=5]
          - errors[ERR_BALLOT_INVALID_STATE]
        distinguishing_aspect: |
          Pair = BallotVote x Ballot: creating a BallotVote is a valid operation
          only while the PARENT ballot entity is OPEN. Once the sweep tallies the
          ballot, the same vote call fails with ERR_BALLOT_INVALID_STATE and the
          ballot's counters do not move.
        test_recipe:
          setup:
            - "4-household segment; request driven to BALLOT_OPEN (close_date 2026-08-10); one FOR vote by r1"
            - "Clock swept to 2026-08-11 -> ballot TALLIED with outcome CONSENT_GRANTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Juniper St", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL", emergency_route: false, crash_count_3yr: 0, pedestrian_generator_count: 0 }
              as: CityAdmin
              captures: { seg: $.data.id }
