          assert:
            - "${e_min} == ERR_BELOW_VENDOR_MINIMUM (422) at 99 units: one unit under min_order_units 100"
            - "${planned} == 18200000 and ${rc_cost} == 260000 at 100 units - the boundary value itself is accepted, so the comparison is units < min_order_units and not units <= it"
            - "${ship_fulfil} == SHIPPED, then ${p_recv} == 60 with ${p_fulfil} == PARTIALLY_RECEIVED, ${p_open_cost} == 104000 (40 * 2600) and ${p_recv_cost} == 156000 (60 * 2600)"
            - "${e_over} == ERR_RECEIPT_OVER_COMMITMENT (422) for a delta of 41: 60 + 41 == 101 > 100"
            - "${mid_recv} == 60 and ${mid_fulfil} == PARTIALLY_RECEIVED: the rejected receipt neither clamped received_units to 100 nor advanced the fulfillment dimension"
            - "${f_recv} == 100 with ${f_fulfil} == RECEIVED and ${f_commit} == CLOSED for a delta of exactly 40: the boundary delta is accepted, and closing the balance drives the OTHER state dimension too"
            - "${f_open_cost} == 0 and ${f_recv_cost} == 260000; on the month ${m_committed} == 0, ${m_received} == 260000 and ${m_open} == 17940000 - the cost moved between two subtracted buckets, so otb_open_cents is unchanged from its post-commit value"

      - name: cycle_close_blocked_while_a_decision_is_still_proposed
        claim_type: violation_to_error
        grounds:
