# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3238_volunteer_editor_dispute_resolution_donation_campaigns
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. §1.8-covered corners appear as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: editor_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.VolunteerEditor
          - endpoints."POST /wiki/editors"
        distinguishing_aspect: "Registering an editor with only username+email returns 201 with account_status ACTIVE, coi_disclosed false, edit_count 0, and server-minted id/created_at/updated_at/version=1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/editors"
              payload: { username: "fresh", email: "fresh@x.com" }
              as: Anonymous
              captures: { fe_id: $.data.id }
          assert:
            - "status 201, response_type object"
            - "VolunteerEditor.${fe_id}.account_status == ACTIVE"
            - "VolunteerEditor.${fe_id}.coi_disclosed == false"
            - "VolunteerEditor.${fe_id}.edit_count == 0"
            - "VolunteerEditor.${fe_id}.version == 1 and id/created_at/updated_at non-null"

      - name: page_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.WikiPage
          - endpoints."GET /wiki/pages/{pageId}"
        distinguishing_aspect: "A page created with title/topic_area round-trips exactly through GET, with computed protection_level NONE and dispute_level NONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One editor, one page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "pg", email: "pg@x.com" }
              as: Anonymous
              captures: { pge_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Round Trip", topic_area: "HEALTH" }
              as: VolunteerEditor
              as_user_id: "${pge_id}"
              captures: { pgp_id: $.data.id }
          trigger:
            - call: "GET /wiki/pages/${pgp_id}"
              payload: {}
              as: VolunteerEditor
              as_user_id: "${pge_id}"
          assert:
            - "status 200"
            - "WikiPage.${pgp_id}.title == \"Round Trip\" and topic_area == HEALTH"
            - "WikiPage.${pgp_id}.protection_level == NONE and dispute_level == NONE"
            - "WikiPage.${pgp_id}.content_score == 0"

      - name: revisions_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints."GET /wiki/revisions"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 3 revisions on a page, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; defaults are limit=10, offset=0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One editor, one page, three PENDING revisions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "lst", email: "lst@x.com" }
              as: Anonymous
              captures: { le_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "List Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${le_id}"
              captures: { lp_id: $.data.id }
            - call: "POST /wiki/pages/${lp_id}/revisions"
              payload: { content_text: "r1", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${le_id}"
            - call: "POST /wiki/pages/${lp_id}/revisions"
              payload: { content_text: "r2", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${le_id}"
            - call: "POST /wiki/pages/${lp_id}/revisions"
              payload: { content_text: "r3", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${le_id}"
          trigger:
            - call: "GET /wiki/revisions"
              payload: { page_id: "${lp_id}", limit: 2, offset: 0 }
              as: VolunteerEditor
              as_user_id: "${le_id}"
          assert:
            - "response_type array with exactly 2 rows, total_count == 3, has_more == true"
            - "GET /wiki/revisions?page_id=${lp_id}&limit=2&offset=2 returns 1 row, total_count == 3, has_more == false"
            - "GET /wiki/revisions?page_id=${lp_id} with no params uses limit=10 offset=0 and returns 3 rows"

      - name: dispute_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints."GET /wiki/disputes/{disputeId}"
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated dispute id returns 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No disputes exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /wiki/disputes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Administrator
              captures: { nerr: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

      - name: campaign_create_missing_target_amount_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.DonationCampaign.fields.target_amount_cents
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "target_amount_cents is required input with no default; omitting it yields 400 ERR_INVALID_REQUEST and no campaign row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/campaigns"
              payload: { name: "No Target", start_at: "2026-09-01T00:00:00Z", end_at: "2026-10-01T00:00:00Z" }
              as: FundraisingManager
              captures: { rerr: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /wiki/campaigns returns 0 rows"

      - name: banner_create_omitting_priority_weight_defaults_to_1
        claim_type: Defaults
        grounds:
          - entities.CampaignBanner.fields.priority_weight
        distinguishing_aspect: "priority_weight declares default 1; omitting it stores 1, not null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT campaign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Def Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 1000 }
              as: FundraisingManager
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /wiki/campaigns/${dc_id}/banners"
              payload: { message_variant: "D", geo_target: "GLOBAL", frequency_cap: 3 }
              as: FundraisingManager
              captures: { db_id: $.data.id }
          assert:
            - "CampaignBanner.${db_id}.priority_weight == 1"
            - "CampaignBanner.${db_id}.status == ACTIVE and impression_count == 0"

      - name: page_content_score_computed_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.WikiPage.fields.content_score
          - calculations.page_content_score
        distinguishing_aspect: "content_score is source:computed — a client-supplied content_score on page creation is ignored and the stored value is 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One editor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "cf", email: "cf@x.com" }
              as: Anonymous
              captures: { cfe_id: $.data.id }
          trigger:
            - call: "POST /wiki/pages"
              payload: { title: "Computed", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${cfe_id}"
              captures: { cfp_id: $.data.id }
          assert:
            - "WikiPage.${cfp_id}.content_score == 0 (computed field initialized by the server, never client-supplied)"

      - name: page_create_invalid_topic_area_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.WikiPage.fields.topic_area
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "topic_area outside {GENERAL, POLITICS, HEALTH, BIOGRAPHY, HISTORY} is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One editor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "en", email: "en@x.com" }
              as: Anonymous
              captures: { ene_id: $.data.id }
          trigger:
            - call: "POST /wiki/pages"
              payload: { title: "Bad Enum", topic_area: "SPORTS" }
              as: VolunteerEditor
              as_user_id: "${ene_id}"
              captures: { eerr: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispute_resolve_from_resolved_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DisputeCase
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A RESOLVED dispute is terminal; a second resolve attempt fails with ERR_INVALID_STATE and resolution_notes are unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two editors, page with accepted revision, OPEN dispute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "rs1", email: "rs1@x.com" }
              as: Anonymous
              captures: { rs1_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "rs2", email: "rs2@x.com" }
              as: Anonymous
              captures: { rs2_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "RS Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${rs1_id}"
              captures: { rsp_id: $.data.id, rsp_v: $.data.version }
            - call: "POST /wiki/pages/${rsp_id}/revisions"
              payload: { content_text: "x", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${rs1_id}"
              captures: { rsr_id: $.data.id }
            - call: "POST /wiki/revisions/${rsr_id}/accept"
              payload: { expected_page_version: "${rsp_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${rsp_id}/disputes"
              payload: { respondent_id: "${rs2_id}", subject_revision_id: "${rsr_id}", dispute_type: "CONTENT" }
              as: VolunteerEditor
              as_user_id: "${rs1_id}"
              captures: { rsd_id: $.data.id }
            - call: "POST /wiki/disputes/${rsd_id}/resolve"
              payload: { resolution_notes: "settled" }
              as: Administrator
          trigger:
            - call: "POST /wiki/disputes/${rsd_id}/resolve"
              payload: { resolution_notes: "again" }
              as: Administrator
              captures: { serr: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DisputeCase.${rsd_id}.resolution_notes == \"settled\" (unchanged)"

      - name: newly_created_revision_starts_pending
        claim_type: initial_state
        grounds:
          - state_machines.Revision
        distinguishing_aspect: "Every newly created revision starts in PENDING regardless of editor standing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One editor, one page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "is", email: "is@x.com" }
              as: Anonymous
              captures: { ise_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Init State", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${ise_id}"
              captures: { isp_id: $.data.id }
          trigger:
            - call: "POST /wiki/pages/${isp_id}/revisions"
              payload: { content_text: "new", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${ise_id}"
              captures: { isr_id: $.data.id }
          assert:
            - "Revision.${isr_id}.status == PENDING"

      - name: editor_block_from_blocked_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.VolunteerEditor
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "BLOCKED is terminal for VolunteerEditor; suspend/reinstate/block from BLOCKED all fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor already BLOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "tl", email: "tl@x.com" }
              as: Anonymous
              captures: { tle_id: $.data.id }
            - call: "POST /wiki/editors/${tle_id}/block"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /wiki/editors/${tle_id}/suspend"
              payload: {}
              as: Administrator
              captures: { tlerr: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "VolunteerEditor.${tle_id}.account_status == BLOCKED"

      - name: dispute_escalate_before_72_hours_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DisputeCase.OPEN_to_ESCALATED
          - errors.ERR_ESCALATION_TOO_SOON
        distinguishing_aspect: "Escalating 24 hours after opening fails with ERR_ESCALATION_TOO_SOON; the level stays TALK."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. OPEN TALK dispute; clock advanced only 24 hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "es1", email: "es1@x.com" }
              as: Anonymous
              captures: { es1_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "es2", email: "es2@x.com" }
              as: Anonymous
              captures: { es2_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "ES Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${es1_id}"
              captures: { esp_id: $.data.id, esp_v: $.data.version }
            - call: "POST /wiki/pages/${esp_id}/revisions"
              payload: { content_text: "x", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${es1_id}"
              captures: { esr_id: $.data.id }
            - call: "POST /wiki/revisions/${esr_id}/accept"
              payload: { expected_page_version: "${esp_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${esp_id}/disputes"
              payload: { respondent_id: "${es2_id}", subject_revision_id: "${esr_id}", dispute_type: "SOURCING" }
              as: VolunteerEditor
              as_user_id: "${es1_id}"
              captures: { esd_id: $.data.id, esd_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/disputes/${esd_id}/escalate"
              payload: { expected_dispute_version: "${esd_v}" }
              as: VolunteerEditor
              as_user_id: "${es1_id}"
              captures: { eserr: $.data.error_id }
          assert:
            - "error_id == ERR_ESCALATION_TOO_SOON"
            - "DisputeCase.${esd_id}.level == TALK"

      - name: arbitration_escalation_auto_protects_page_full
        claim_type: side_effect_execution
        grounds:
          - state_machines.DisputeCase.OPEN_to_ESCALATED
          - entities.WikiPage.fields.protection_level
        distinguishing_aspect: "Escalating a dispute from NOTICE to ARBITRATION sets the page dispute_level to ARB AND auto-protects the page FULL as a chained side effect."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Dispute already at NOTICE level (escalated once after 72h); clock advanced another 72h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "ar1", email: "ar1@x.com" }
              as: Anonymous
              captures: { ar1_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "ar2", email: "ar2@x.com" }
              as: Anonymous
              captures: { ar2_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "ARB Page", topic_area: "POLITICS" }
              as: VolunteerEditor
              as_user_id: "${ar1_id}"
              captures: { arp_id: $.data.id, arp_v: $.data.version }
            - call: "POST /wiki/pages/${arp_id}/revisions"
              payload: { content_text: "x", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${ar1_id}"
              captures: { arr_id: $.data.id }
            - call: "POST /wiki/revisions/${arr_id}/accept"
              payload: { expected_page_version: "${arp_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${arp_id}/disputes"
              payload: { respondent_id: "${ar2_id}", subject_revision_id: "${arr_id}", dispute_type: "CONTENT" }
              as: VolunteerEditor
              as_user_id: "${ar1_id}"
              captures: { ard_id: $.data.id, ard_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/disputes/${ard_id}/escalate"
              payload: { expected_dispute_version: "${ard_v}" }
              as: VolunteerEditor
              as_user_id: "${ar1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/disputes/${ard_id}/escalate"
              payload: { expected_dispute_version: "${ard_v} + 1" }
              as: VolunteerEditor
              as_user_id: "${ar1_id}"
          assert:
            - "DisputeCase.${ard_id}.level == ARBITRATION"
            - "WikiPage.${arp_id}.dispute_level == ARB"
            - "WikiPage.${arp_id}.protection_level == FULL (auto-protection side effect)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: page_content_score_weighted_formula
        claim_type: correct_result
        grounds:
          - calculations.page_content_score
        distinguishing_aspect: "With source_quality 80, neutrality 60 and no disputes in 30 days (stability 100): content_score = round_half_up(0.4*80 + 0.4*60 + 0.2*100) = round_half_up(76.0) = 76."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor, page, one revision whose computed source_quality_score=80, neutrality_score=60, vandalism_score=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "cs", email: "cs@x.com" }
              as: Anonymous
              captures: { cse_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Score Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${cse_id}"
              captures: { csp_id: $.data.id, csp_v: $.data.version }
            - call: "POST /wiki/pages/${csp_id}/revisions"
              payload: { content_text: "well sourced neutral text", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${cse_id}"
              captures: { csr_id: $.data.id }
          trigger:
            - call: "POST /wiki/revisions/${csr_id}/accept"
              payload: { expected_page_version: "${csp_v}" }
              as: Administrator
          assert:
            - "WikiPage.${csp_id}.content_score == 76 (given the pinned revision scores and stability 100)"
            - "VolunteerEditor.${cse_id}.edit_count == 1"

      - name: rollback_eligibility_threshold_zero_confirmed
        claim_type: constants_applied
        grounds:
          - calculations.editor_rollback_eligibility
        distinguishing_aspect: "rollback_eligible flips false exactly when confirmed_reports_90d reaches 1 (threshold == 0 eligible, >= 1 ineligible); the 90-day window constant is honored — a report confirmed 91 days ago does not count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor with one vandalism report CONFIRMED at 2026-09-01; clock then advanced to 2026-12-01 (91 days later)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "rb", email: "rb@x.com" }
              as: Anonymous
              captures: { rbe_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "RB Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${rbe_id}"
              captures: { rbp_id: $.data.id }
            - call: "POST /wiki/pages/${rbp_id}/revisions"
              payload: { content_text: "bad", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${rbe_id}"
              captures: { rbr_id: $.data.id }
            - call: "POST /wiki/revisions/${rbr_id}/flag"
              payload: { report_type: "VANDALISM" }
              as: Administrator
              captures: { rbreport: $.data.id }
            - call: "POST /wiki/vandalism-reports/${rbreport}/confirm"
