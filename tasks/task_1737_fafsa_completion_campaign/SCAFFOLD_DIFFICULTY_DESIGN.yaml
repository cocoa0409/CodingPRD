          setup:
            - "Campaign OPEN with max_caseload=1; school ENROLLED; one specialist (CASE_SPECIALIST, languages [en])"
            - "Seniors A and B each AUTO_CONFIRMED-matched (score 1.00) to aid records initially SUBMITTED; both hold GRANTED STATUS_DETAIL consent"
