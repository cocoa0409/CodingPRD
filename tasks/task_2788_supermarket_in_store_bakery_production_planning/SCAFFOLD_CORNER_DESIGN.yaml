            - "GET /bakery/products/${crois_id} is byte-identical to its creation response — the link added no field to the Product"
            - "after generation the filtered run listing returns at least one run whose bake_day_id is ${bd_id} and product_id is ${crois_id}, with origin PLAN_GENERATED"
            - "BakeDay.${bd_id}.plan_posture == PLANNED and planned_units_total is greater than zero"

  # ===========================================================================
  - section: errors
    instances:

      - name: cake_order_ready_call_from_intake_or_confirmed_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_CAKE_ORDER_STATE
          - validations.priority_24
          - state_machines.CustomCakeOrder
        distinguishing_aspect: "ERR_INVALID_CAKE_ORDER_STATE (409) is raised for the ready trigger from INTAKE and again from CONFIRMED — only IN_DECORATION accepts it — and neither rejection consumes the slot's decorator capacity beyond the confirm reservation of 8 units."
        test_recipe:
          setup:
            - "INTAKE STANDARD 2-tier cake order on an OPEN 14:00-16:00Z slot with capacity 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T08:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "CAKE-8", name: "8 inch Cake Round", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 1800, shelf_life_hours: 48, is_custom_cake_base: true }
              as: RegionalAdmin
              captures: { cake_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 10 }
              as: CakeDesk
              captures: { slot_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders"
              payload: { bake_day_id: "${bd_id}", product_id: "${cake_id}", pickup_slot_id: "${slot_id}", customer_name: "Reyes", decoration_complexity: "STANDARD", tier_count: 2 }
              as: CakeDesk
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /bakery/custom-cake-orders/${order_id}/ready"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
              captures: { e_from_intake: $.data.error_id }
            - call: "POST /bakery/custom-cake-orders/${order_id}/confirm"
              payload: {}
              as: CakeDesk
            - call: "POST /bakery/custom-cake-orders/${order_id}/ready"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
              captures: { e_from_confirmed: $.data.error_id }
            - call: "POST /bakery/custom-cake-orders/${order_id}/start-decoration"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
            - call: "POST /bakery/custom-cake-orders/${order_id}/ready"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
          assert:
            - "${e_from_intake} == ERR_INVALID_CAKE_ORDER_STATE with HTTP 409 and order_status remains INTAKE"
            - "${e_from_confirmed} == ERR_INVALID_CAKE_ORDER_STATE with HTTP 409 and order_status remains CONFIRMED"
            - "the final ready call returns 200 with order_status READY"
            - "PickupSlot.${slot_id}.reserved_decoration_units == 8 throughout — set once by confirm and never doubled by the rejected calls"

      - name: submitting_an_ingredient_order_twice_is_rejected_on_the_second_call
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_INGREDIENT_ORDER_STATE
          - validations.priority_25
          - state_machines.IngredientOrder
        distinguishing_aspect: "The second submit is ERR_INVALID_INGREDIENT_ORDER_STATE (409) rather than a silent no-op, submitted_at_utc keeps its first value, and after a cancel the submit trigger is refused with the same code from CANCELLED."
        test_recipe:
          setup:
            - "SUBMITTED manual ingredient order for 90 units of Bread Flour (2 cases of 45)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v: $.data.version }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v}", lines: [{ ingredient_id: "${flour_id}", required_units: 90 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery/ingredient-orders/${order_id}/submit"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /bakery/ingredient-orders/${order_id}/submit"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_double_submit: $.data.error_id }
            - call: "POST /bakery/ingredient-orders/${order_id}/cancel"
              payload: { cancel_reason: "supplier outage" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/ingredient-orders/${order_id}/submit"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_submit_after_cancel: $.data.error_id }
          assert:
            - "${e_double_submit} == ERR_INVALID_INGREDIENT_ORDER_STATE with HTTP 409 and order_status is still SUBMITTED"
            - "IngredientOrder.${order_id}.submitted_at_utc is still 2026-08-10T04:00:00Z — the rejected call re-stamped nothing"
            - "the cancel returns 200 with order_status CANCELLED and cancel_reason 'supplier outage'"
            - "${e_submit_after_cancel} == ERR_INVALID_INGREDIENT_ORDER_STATE with HTTP 409 — CANCELLED is terminal for the submit trigger"
            - "Ingredient.${flour_id}.replenishment_state returns to OK (on_hand 2000 above reorder_point 120) and BakeryDepartment.${dept_id}.open_purchase_commitment_cents == 0"

      - name: error_oven_slot_conflict_on_run_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OVEN_SLOT_CONFLICT
          - validations.priority_34
        excluded_because:
          difficulty_instance: oven_deck_rejects_run_inside_the_changeover_buffer
          rationale: >-
            That §1.8 instance posts a second run whose bake window starts inside
            the first run's bake-plus-changeover interval and asserts
            ERR_OVEN_SLOT_CONFLICT, plus the accepted case one minute past the
            buffer. Nothing about the code is left untriggered.

      - name: error_allergen_segregation_violation_on_shared_deck
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ALLERGEN_SEGREGATION_VIOLATION
          - validations.priority_28
        excluded_because:
          difficulty_instance: allergen_safety_check_outranks_labor_budget_check
          rationale: >-
            Triggered as the returned error of that §1.8 precedence instance, where
            a MILK-tagged run is placed on a deck holding a WHEAT-only run.

      - name: error_labor_budget_exceeded_on_run_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LABOR_BUDGET_EXCEEDED
          - validations.priority_48
        excluded_because:
          difficulty_instance: allergen_safety_check_outranks_labor_budget_check
          rationale: >-
            The second half of that §1.8 instance removes the allergen violation
            and keeps the over-budget rack count, so ERR_LABOR_BUDGET_EXCEEDED is
            the asserted response there.

      - name: error_markdown_authorization_required_after_shrink_breach
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MARKDOWN_AUTHORIZATION_REQUIRED
          - validations.priority_46
        excluded_because:
          difficulty_instance: waste_attestation_cascades_shrink_breach_into_markdown_lockdown
          rationale: >-
            That §1.8 cascade drives the cost-basis shrink ratio past the budget,
            flips markdown_authorization to MANAGER_REQUIRED and asserts a Baker's
            markdown attempt returns ERR_MARKDOWN_AUTHORIZATION_REQUIRED.

      - name: error_empty_production_plan_on_zero_forecast
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EMPTY_PRODUCTION_PLAN
          - validations.priority_42
        excluded_because:
          difficulty_instance: forecast_of_zero_units_yields_empty_plan_rejection
          rationale: >-
            The boundary instance already generates a plan from a forecast that
            rounds to zero racks and asserts ERR_EMPTY_PRODUCTION_PLAN with the
            bake day left in DRAFT.

      - name: error_pickup_slot_overlap_on_slot_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PICKUP_SLOT_OVERLAP
          - validations.priority_35
        excluded_because:
          difficulty_instance: pickup_slots_may_abut_but_not_overlap
          rationale: >-
            That instance accepts the abutting slot at the shared endpoint and
            rejects the one-minute overlap with ERR_PICKUP_SLOT_OVERLAP.

      - name: error_oven_rack_capacity_exceeded_on_deck
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OVEN_RACK_CAPACITY_EXCEEDED
          - validations.priority_47
        excluded_because:
          difficulty_instance: rack_count_exactly_at_deck_capacity_is_accepted
          rationale: >-
            The equality-boundary instance accepts rack_count 4 on a 4-rack deck
            and rejects rack_count 5 with ERR_OVEN_RACK_CAPACITY_EXCEEDED.

      - name: error_oven_unavailable_at_start_bake
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OVEN_UNAVAILABLE
          - validations.priority_26
        excluded_because:
          difficulty_instance: run_cannot_start_bake_while_its_oven_is_in_maintenance
          rationale: >-
            That §1.8 instance takes the oven down under an already-SCHEDULED run
            and asserts start-bake returns ERR_OVEN_UNAVAILABLE.

      - name: error_pickup_slot_closed_at_confirm
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PICKUP_SLOT_CLOSED
          - validations.priority_27
        excluded_because:
          difficulty_instance: cake_order_cannot_confirm_against_a_closed_pickup_slot
          rationale: >-
            Asserted directly as the failure path of that §1.8 guarded-transition
            instance.

      - name: error_bake_day_plan_locked_on_plan_shaping_write
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BAKE_DAY_PLAN_LOCKED
          - validations.priority_18
        excluded_because:
          difficulty_instance: locked_plan_state_check_outranks_allergen_safety_check
          rationale: >-
            The precedence instance posts a run against a LOCKED bake day and
            asserts ERR_BAKE_DAY_PLAN_LOCKED is the single returned error.

  # ===========================================================================
  - section: rbac
    instances:

      - name: create_bake_day_missing_x_user_header_returns_unauthenticated
        claim_type: denied_operation
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - roles.DepartmentManager.identity
        distinguishing_aspect: "Authentication is checked at priority 1, ahead of role and scope: the identical bake-day payload is ERR_UNAUTHENTICATED (401) when the request carries no X-User-ID header and 201 when the header names the department, so the 401 cannot be confused with ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "One department; the first trigger call is issued with the X-User-ID header omitted entirely."
          setup_api_calls:
