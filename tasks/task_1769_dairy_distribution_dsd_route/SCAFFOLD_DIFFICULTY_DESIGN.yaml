  - rule_id: boundary_precision_check
    instances:
      - name: excursion_45_minutes_breach_boundary
        grounds:
          - calculations.temperature_excursion
          - entities.TruckTrip.fields.excursion_minutes
          - entities.TruckTrip.fields.cold_chain_breach
        distinguishing_aspect: |
          Metric = cumulative excursion minutes on the temperature-reading /
          trip-complete endpoints: 44.9 minutes (44min54s above 40.0F) leaves
          cold_chain_breach false, while exactly 45.0 minutes breaches
          (threshold INCLUSIVE). Companion instance uses a different metric
          (days-to-expiry) on a different endpoint (returns).
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store, driver DR1; no orders needed (complete with zero orders is legal)"
            - "Trip T1 2026-08-10 and trip T2 2026-08-11, both DEPARTED after pre-cool readings"
