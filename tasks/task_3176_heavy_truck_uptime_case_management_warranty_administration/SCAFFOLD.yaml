  - method: GET
    path: "/reliability-reports"
    description: "List reliability snapshots across fleets; FK filter on fleet_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "fleet_id?"]
    output: "ReliabilityReport[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # Auth & RBAC
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE,                http: 403, condition: "Role is not authorized for this endpoint" }
  - { id: ERR_ACTOR_NOT_FOUND,                   http: 404, condition: "entity_backed X-User-ID does not resolve" }

  # Existence
  - { id: ERR_FLEET_NOT_FOUND,                   http: 404, condition: "Fleet id does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND,                   http: 404, condition: "Truck id does not exist within the fleet" }
  - { id: ERR_CASE_NOT_FOUND,                    http: 404, condition: "Case id does not exist within the truck" }
  - { id: ERR_DEALER_NOT_FOUND,                  http: 404, condition: "Dealer id does not exist" }
  - { id: ERR_BAY_NOT_FOUND,                     http: 404, condition: "ServiceBay id does not exist within the dealer" }
  - { id: ERR_CLAIM_NOT_FOUND,                   http: 404, condition: "WarrantyClaim id does not exist within the case" }
  - { id: ERR_WORK_ORDER_NOT_FOUND,              http: 404, condition: "WorkOrder id does not exist within the case" }
  - { id: ERR_PART_ORDER_NOT_FOUND,              http: 404, condition: "PartOrder id does not exist within the case" }
  - { id: ERR_PART_RETURN_NOT_FOUND,             http: 404, condition: "PartReturn id does not exist within the claim" }
  - { id: ERR_RECOVERY_NOT_FOUND,                http: 404, condition: "SupplierRecovery id does not exist within the claim" }
  - { id: ERR_CAMPAIGN_NOT_FOUND,                http: 404, condition: "Campaign id does not exist" }
  - { id: ERR_FAULT_EVENT_NOT_FOUND,             http: 404, condition: "FaultEvent id does not exist within the truck" }
  - { id: ERR_COVERAGE_CONTRACT_NOT_FOUND,       http: 404, condition: "CoverageContract id does not exist within the truck" }
  - { id: ERR_CAMPAIGN_COMPLETION_NOT_FOUND,     http: 404, condition: "CampaignCompletion id does not exist within the campaign" }

  # State
  - { id: ERR_FLEET_NOT_ACTIVE,                  http: 409, condition: "Fleet is not ACTIVE for mutating operation" }
  - { id: ERR_TRUCK_DECOMMISSIONED,              http: 409, condition: "Truck is DECOMMISSIONED; no new cases/coverage" }
  - { id: ERR_INVALID_STATE_TRANSITION,          http: 409, condition: "Resource not in a state that permits this transition" }
  - { id: ERR_CASE_HAS_OPEN_CLAIM,               http: 409, condition: "Case close blocked by claim in SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_BAY_TIME_CONFLICT,                 http: 409, condition: "ServiceBay already has an AUTHORIZED/IN_PROGRESS WorkOrder overlapping the requested [start, end) interval" }
  - { id: ERR_DEALER_NOT_AVAILABLE,              http: 409, condition: "Dealer SUSPENDED or region mismatch without allow_cross_region=true" }

  # Business rules
  - { id: ERR_CRITICAL_FAULT_WINDOW_LAPSED,      http: 422, condition: "CRITICAL/STOP_IMMEDIATELY fault event older than 30 minutes at case-open time" }
  - { id: ERR_RETURN_WINDOW_LAPSED,              http: 422, condition: "PartReturn ship attempt beyond return_window_days" }
  - { id: ERR_INVALID_COVERAGE_WINDOW,           http: 422, condition: "CoverageContract window invalid (starts_on >= ends_on, or before in_service_on)" }
  - { id: ERR_LABOR_MINUTES_EXCEED_STANDARD,     http: 422, condition: "labor_minutes_claimed > labor_hours_allowed * 60 per labor_time_standard" }
  - { id: ERR_RECOVERY_CLAIM_EXCEEDS_ALLOWANCE,  http: 422, condition: "SupplierRecovery.claimed_amount_cents > WarrantyClaim.parts_amount_allowed_cents OR PartReturn not INSPECTED_OK" }
  - { id: ERR_RECOVERY_OVERPAID,                 http: 422, condition: "paid_amount_cents > claimed_amount_cents" }
  - { id: ERR_INVALID_WORK_ORDER_WINDOW,         http: 422, condition: "WorkOrder scheduled_end_at <= scheduled_start_at OR duration < 30 minutes" }
  - { id: ERR_DUPLICATE_IDENTIFIER,              http: 409, condition: "VIN or campaign_code uniqueness violation" }
  - { id: ERR_ODOMETER_REGRESSION,               http: 422, condition: "odometer_miles lower than current value" }
  - { id: ERR_INVALID_CAMPAIGN_WINDOW,           http: 422, condition: "Campaign window invalid (closes_on <= opens_on, or empty affected_model_codes)" }
  - { id: ERR_STALE_VERSION,                     http: 412, condition: "OCC: expected_*_version does not match current parent version" }
  - { id: ERR_INVALID_REQUEST,                   http: 400, condition: "Generic request validation failure (bad type, missing required field, out-of-enum value)" }
  - { id: ERR_CAMPAIGN_NOT_CLOSABLE,             http: 409, condition: "Campaign close attempted before completion_pct >= 95.00 AND before closes_on + 90 days" }
  - { id: ERR_CASE_NOT_AWAITING_PART,            http: 409, condition: "PartOrder creation requires Case in IN_SERVICE state" }
  - { id: ERR_CAMPAIGN_COMPLETION_MISMATCH,      http: 409, condition: "CampaignCompletion schedule attempt with case_id whose truck or fault_code does not match the row" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: FleetManager
    description: "Fleet-side owner. Manages trucks, coverage contracts, decommissions trucks, suspends/reactivates fleet."
    identity: "entity_backed:Fleet"
    exclusive_operations:
      - "POST /fleets"
      - "PUT /fleets/{id}"
      - "POST /fleets/{id}/suspend"
      - "POST /fleets/{id}/reactivate"
      - "POST /fleets/{id}/trucks"
      - "PUT /fleets/{id}/trucks/{tid}"
      - "POST /fleets/{id}/trucks/{tid}/decommission"
      - "POST /fleets/{id}/trucks/{tid}/coverage-contracts"
      - "POST /fleets/{id}/trucks/{tid}/coverage-contracts/{ccid}/cancel"
      - "POST /dealers"
    shared_operations:
      - "GET on fleets, trucks, cases, dealers, claims, campaigns, reliability-reports"

  - name: UptimeCoordinator
    description: "Daimler uptime-center coordinator. Triages cases, schedules bays, opens campaigns, manages completion rows, runs ops."
    identity: "opaque"
    exclusive_operations:
      - "POST /_ops/run"
      - "POST /fleets/{id}/trucks/{tid}/fault-events"
      - "POST /fleets/{id}/trucks/{tid}/fault-events/{feId}/dismiss"
      - "POST /fleets/{id}/trucks/{tid}/cases"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/triage"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/schedule"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/close"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/cancel"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/reopen-service"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/work-orders/{woid}/authorize"
      - "POST /fleets/{id}/trucks/{tid}/cases/{cid}/work-orders/{woid}/cancel"
      - "POST /campaigns"
      - "POST /campaigns/{cid}/close"
      - "POST /campaigns/{cid}/completions/{ccid}/schedule"
      - "POST /campaigns/{cid}/completions/{ccid}/exempt"
    shared_operations:
      - "GET on fleets, trucks, cases, claims, dealers, bays, campaigns, part-orders, reliability-reports"

  - name: DealerAdvisor
    description: "Dealer-side service advisor. Manages bays, starts/completes work orders, marks parts received/installed, ships failed parts back."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealers/{did}/bays"
