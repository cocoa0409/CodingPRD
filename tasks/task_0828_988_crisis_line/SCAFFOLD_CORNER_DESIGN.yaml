# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. excluded_because stubs point at §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ---- Entities -------------------------------------------------------------
  - section: entities
    instances:
      - name: contact_create_returns_201_with_intake_status
        claim_type: Creation
        grounds: ["entities.Contact.fields.status"]
        distinguishing_aspect: "POST /contacts with channel+caller_key returns 201 and a Contact in status INTAKE with a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "cr-01", caller_name: "Jordan"}
              as: CrisisCounselor
              captures: {c_id: "$.data.id"}
          assert:
            - "trigger response status == 201"
            - "Contact.${c_id}.status == INTAKE"
            - "Contact.${c_id}.emergency_status == NONE"

      - name: contact_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CONTACT_NOT_FOUND]"]
        distinguishing_aspect: "GET /contacts/{unknown uuid} returns 404 ERR_CONTACT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contacts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 404"
            - "trigger response data.error_id == ERR_CONTACT_NOT_FOUND"

      - name: contact_create_missing_channel_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Contact.fields.channel", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /contacts omitting the required channel field returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contacts"
              payload: {caller_key: "mc-01"}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 422"
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: risk_screening_invalid_type_enum_returns_error
        claim_type: Type Constraints
        grounds: ["entities.RiskScreening.fields.screening_type", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /risk-screenings with screening_type='BOGUS' returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["One INTAKE contact."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "CHAT", caller_key: "ie-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
          trigger:
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "BOGUS", suicidal_ideation: 1, plan_specificity: 1, means_access: false, prior_attempts: 0}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 422"
            - "trigger response data.error_id == ERR_INVALID_ENUM"

      - name: center_available_beds_computed_on_create
        claim_type: Computed Fields
        grounds: ["entities.CrisisCenter.fields.available_beds", "calculations.center_bed_ledger"]
        distinguishing_aspect: "A newly created center with bed_capacity 3 reports available_beds 3, held_beds 0, occupied_beds 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /crisis-centers"
              payload: {name: "Center X", bed_capacity: 3, accepted_acuities: ["LOW", "MODERATE", "HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id"}
          assert:
            - "CrisisCenter.${center_id}.available_beds == 3"
            - "CrisisCenter.${center_id}.held_beds == 0"
            - "CrisisCenter.${center_id}.occupied_beds == 0"

      - name: repeat_caller_registered_and_counted_on_intake
        claim_type: Computed Fields
        grounds: ["entities.RepeatCaller.fields.contact_count", "calculations.repeat_caller_high_risk"]
        distinguishing_aspect: "Two contacts sharing caller_key 'rc-9' produce a single RepeatCaller row with contact_count 2 and high_risk_flag false (unscreened, count < 3)."
        test_recipe:
          setup: ["Two contacts created with the same caller_key."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "rc-9"}
              as: ClinicalSupervisor
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "rc-9"}
              as: ClinicalSupervisor
          trigger:
            - call: "GET /repeat-callers"
              payload: {caller_key: "rc-9"}
              as: ClinicalSupervisor
              captures: {rc_id: "$.data[0].id"}
          assert:
            - "GET /repeat-callers?caller_key=rc-9 returns exactly 1 record"
            - "RepeatCaller.${rc_id}.contact_count == 2"
            - "RepeatCaller.${rc_id}.high_risk_flag == false"

  # ---- State Machines -------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_dispatch_from_completed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.MobileDispatch.ON_SCENE_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) dispatch returns 409 ERR_INVALID_STATE; no team slot is released twice."
        test_recipe:
          setup: ["A dispatch driven to COMPLETED for a HIGH contact."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "sm-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team SM", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {d_id: "$.data.id"}
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "EN_ROUTE"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "ON_SCENE", on_scene_acuity: "HIGH"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "COMPLETED"}
              as: CrisisDispatcher
          trigger:
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "CANCELLED"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: safety_plan_activate_from_archived_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SafetyPlan.DRAFT_to_ARCHIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a SafetyPlan already in ARCHIVED returns 409 ERR_INVALID_STATE (no ARCHIVED->ACTIVE edge exists)."
        test_recipe:
          setup: ["A SafetyPlan created then archived from DRAFT."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "sm-b-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /safety-plans"
              payload: {contact_id: "${c_id}", coping_strategies: ["walk"], warning_signs: ["anger"]}
              as: CrisisCounselor
              captures: {sp_id: "$.data.id"}
            - call: "POST /safety-plans/${sp_id}/state"
              payload: {to_status: "ARCHIVED"}
              as: CrisisCounselor
          trigger:
            - call: "POST /safety-plans/${sp_id}/state"
              payload: {to_status: "ACTIVE"}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: close_contact_from_intake_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Contact.RESOLVED_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a fresh INTAKE contact (CLOSED requires from RESOLVED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["One fresh INTAKE contact."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "sm-c-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "CLOSED"}
              as: ClinicalSupervisor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: admit_referral_from_voided_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.BedReferral.HELD_to_VOIDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Admitting a VOIDED (terminal) referral returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A HELD referral that was then voided."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "sm-d-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /crisis-centers"
              payload: {name: "Center SM", bed_capacity: 1, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {r_id: "$.data.id"}
            - call: "POST /bed-referrals/${r_id}/state"
              payload: {to_status: "VOIDED"}
              as: CrisisDispatcher
          trigger:
            - call: "POST /bed-referrals/${r_id}/state"
              payload: {to_status: "ADMITTED"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

  # ---- Validations / Errors -------------------------------------------------
  - section: validations
    instances:
      - name: disposition_de_escalation_on_high_band_returns_not_allowed
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_DISPOSITION_NOT_ALLOWED]"]
        distinguishing_aspect: "A SCREENED HIGH-band contact requesting DE_ESCALATION (allowed only for LOW/MODERATE) returns 409 ERR_DISPOSITION_NOT_ALLOWED — the safety check fires in isolation (state is valid)."
        test_recipe:
          setup: ["A HIGH-band contact in SCREENED."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_DISPOSITION_NOT_ALLOWED"

      - name: resolve_de_escalation_without_active_safety_plan_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_NO_ACTIVE_SAFETY_PLAN]", "state_machines.Contact.DE_ESCALATION_to_RESOLVED"]
        distinguishing_aspect: "Resolving a DE_ESCALATION contact with no ACTIVE safety plan returns 409 ERR_NO_ACTIVE_SAFETY_PLAN."
        test_recipe:
          setup: ["A MODERATE contact disposed DE_ESCALATION with no safety plan."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-b-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "RESOLVED"}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_NO_ACTIVE_SAFETY_PLAN"

      - name: dispatch_off_shift_team_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_TEAM_OFF_SHIFT]"]
        distinguishing_aspect: "Dispatching an OFF_SHIFT team returns 409 ERR_TEAM_OFF_SHIFT."
        test_recipe:
          setup: ["A HIGH contact in DISPATCH_PENDING and an OFF_SHIFT team."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-c-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team Off", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z", status: "OFF_SHIFT"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_TEAM_OFF_SHIFT"

      - name: dispatch_team_at_capacity_returns_error
        claim_type: Aggregate validation
        grounds: ["validations[priority=10]", "errors[ERR_TEAM_AT_CAPACITY]", "calculations.team_slot_ledger"]
        distinguishing_aspect: "With one active REQUESTED dispatch on a capacity-1 team, a second dispatch on a non-conflicting far window returns 409 ERR_TEAM_AT_CAPACITY (capacity, not temporal)."
        test_recipe:
          setup: ["Capacity-1 team with one active dispatch; a second HIGH contact in DISPATCH_PENDING."]
          setup_api_calls:
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team Cap", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-d-1"}
              as: ClinicalSupervisor
              captures: {c1: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c1}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c1}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c1}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-d-2"}
              as: ClinicalSupervisor
              captures: {c2: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c2}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c2}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "GET /mobile-crisis-teams/${team_id}"
              payload: {}
              as: CrisisDispatcher
              captures: {team_v2: "$.data.version"}
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c2}", team_id: "${team_id}", window_start: "2026-03-01T05:00:00Z", window_end: "2026-03-01T05:30:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v2}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_TEAM_AT_CAPACITY"

      - name: bed_referral_window_invalid_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_WINDOW_INVALID]", "entities.BedReferral.fields.window_end"]
        distinguishing_aspect: "A bed referral with window_end <= window_start returns 422 ERR_WINDOW_INVALID before any OCC or capacity check."
        test_recipe:
          setup: ["A HIGH contact in DISPATCH_PENDING and an ONLINE center."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "vd-e-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /crisis-centers"
              payload: {name: "Center W", bed_capacity: 2, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
          trigger:
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T06:00:00Z", window_end: "2026-03-01T02:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 422"
            - "trigger response data.error_id == ERR_WINDOW_INVALID"

      - name: dispatch_create_unknown_contact_returns_not_found
        claim_type: Cross-entity validation
        grounds: ["validations[priority=3]", "errors[ERR_CONTACT_NOT_FOUND]"]
        distinguishing_aspect: "POST /mobile-dispatches with a non-existent contact_id returns 404 ERR_CONTACT_NOT_FOUND (existence beats OCC)."
        test_recipe:
          setup: ["An on-shift team; no such contact."]
          setup_api_calls:
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team NF", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "00000000-0000-0000-0000-000000000000", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 404"
            - "trigger response data.error_id == ERR_CONTACT_NOT_FOUND"

  # ---- Endpoints ------------------------------------------------------------
  - section: endpoints
    instances:
      - name: contacts_list_returns_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /contacts returns response_type=array with pagination fields total_count and has_more populated."
        test_recipe:
          setup: ["Two contacts exist."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "pg-1"}
              as: ClinicalSupervisor
            - call: "POST /contacts"
              payload: {channel: "CHAT", caller_key: "pg-2"}
              as: ClinicalSupervisor
          trigger:
            - call: "GET /contacts"
              payload: {limit: 1, offset: 0}
              as: ClinicalSupervisor
          assert:
            - "trigger response.response_type == array"
            - "trigger response.data length == 1"
            - "trigger response.total_count == 2"
            - "trigger response.has_more == true"

  # ---- RBAC -----------------------------------------------------------------
  - section: rbac
    instances:
      - name: counselor_cannot_create_team_returns_unauthorized
        claim_type: Cannot perform other roles' operations
        grounds: ["roles", "endpoints", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CrisisCounselor calling POST /mobile-crisis-teams (ClinicalSupervisor-exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team U", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 403"
            - "trigger response data.error_id == ERR_UNAUTHORIZED"

      - name: dispatcher_cannot_submit_screening_returns_unauthorized
        claim_type: Cannot perform other roles' operations
        grounds: ["roles", "endpoints", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CrisisDispatcher calling POST /risk-screenings (CrisisCounselor-exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["One INTAKE contact."]
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "rb-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
          trigger:
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 1, means_access: false, prior_attempts: 0}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 403"
            - "trigger response data.error_id == ERR_UNAUTHORIZED"

      - name: counselor_cannot_view_operations_report_returns_unauthorized
        claim_type: Cannot perform other roles' operations
        grounds: ["roles", "endpoints", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CrisisCounselor calling GET /reports/operations (ClinicalSupervisor-exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
