# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Default logical clock at server startup: 2026-04-01T00:00:00Z.
# Conventions:
#   - cdl_class CLASS_B throughout (single-truck class) unless noted.
#   - Programs use small ELDT hour requirements so TEST_READY is reachable in few calls.
#   - All session starts_at are in the past relative to the default clock so /complete is allowed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: eldt_projected_vs_logged_road_hours_diverge
        grounds:
          - calculations.eldt_logged_hours
          - calculations.eldt_projected_hours
          - entities.Enrollment.fields.logged_road_hours
          - entities.Enrollment.fields.projected_road_hours
        distinguishing_aspect: |
          For the same ROAD session, the chronological logged_road_hours counts only COMPLETED sessions
          while the forward-looking projected_road_hours counts BOOKED+COMPLETED — so a single BOOKED 30-min
          road session yields projected_road_hours == 0.5 but logged_road_hours == 0.0 on the SAME Enrollment.
        test_recipe:
          setup:
            - "Program P (CLASS_B, classroom_required 1, range_required 1, road_required 0.5)."
            - "Enrollment E in TRAINING (both prereqs approved)."
            - "One BOOKED ROAD ClockSession of 30 minutes; not yet completed."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 0.5, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-15T09:00:00Z", duration_minutes: 30 }
              as: Registrar
              captures: { road_sess_id: $.data.id }
          trigger:
            - call: "GET /enrollments/${enr_id}"
              as: Registrar
              captures: { proj: $.data.projected_road_hours, logged: $.data.logged_road_hours }
          assert:
            - "Enrollment.${enr_id}.projected_road_hours == 0.5"
            - "Enrollment.${enr_id}.logged_road_hours == 0.0"

      - name: reimbursement_clawback_vs_finance_schedule_distinct_domains
        grounds:
          - calculations.reimbursement_clawback
          - calculations.finance_schedule
          - entities.SponsorshipOffer.fields.clawback_cents
          - entities.FinancePlan.fields.total_interest_cents
        distinguishing_aspect: |
          The two dual-variant computations operate on DIFFERENT entity domains: reimbursement_clawback is a
          decay computation on SponsorshipOffer (carrier ledger), whereas finance_schedule is a tiered-pricing
          computation on FinancePlan (student tuition) — clawback_cents == 350000 here is unrelated to any
          finance-plan field.
        test_recipe:
          setup:
            - "Program P (CLASS_B, tuition 700000)."
            - "Carrier C with commitment_months 12, reimbursement_cents 600000."
            - "Enrollment E in TRAINING with an ACCEPTED SponsorshipOffer from C and months_served advanced to 5."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /carriers"
              payload: { name: "BigHaul", commitment_months: 12, reimbursement_cents: 600000 }
              as: SchoolAdmin
              captures: { car_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/sponsorship-offers"
              payload: { carrier_id: "${car_id}" }
              as: Registrar
              captures: { off_id: $.data.id }
            - call: "POST /sponsorship-offers/${off_id}/accept"
              payload: {}
              as: Registrar
            - call: "POST /_clock/advance_service_months"
              payload: { offer_id: "${off_id}", months: 5 }
              as: SchoolAdmin
          trigger:
            - call: "POST /sponsorship-offers/${off_id}/forfeit"
              payload: {}
              as: SchoolAdmin
              captures: { cb: $.data.clawback_cents }
          assert:
            - "SponsorshipOffer.${off_id}.status == FORFEITED"
            - "SponsorshipOffer.${off_id}.clawback_cents == 350000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: skills_weighted_score_three_input_threshold_branch
        grounds:
          - calculations.skills_weighted_score
          - entities.SkillsTest.fields.weighted_score
          - entities.SkillsTest.fields.outcome
        distinguishing_aspect: |
          Mode (a): a 3-input non-linear formula — weighted_score = 0.30*pre_trip + 0.30*basic_control +
          0.40*road, and the PASS/FAIL branch hinges on a >= threshold comparison; with 80/75/84 the score is
          80.10 and outcome == PASS, a result no single input determines.
        test_recipe:
          setup:
            - "Program P (CLASS_B, skills_pass_threshold 80, classroom/range/road all required 1)."
            - "Enrollment E driven to TEST_READY (one COMPLETED session per phase)."
            - "A SCHEDULED SkillsTest with an examiner who never instructed E."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000, skills_pass_threshold: 80 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Examiner Ed", cdl_class: "CLASS_B", examiner_certified: true }
              as: SchoolAdmin
              captures: { exam_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${instr_id}", starts_at: "2026-03-10T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_class: $.data.id }
            - call: "POST /clock-sessions/${cs_class}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-11T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_range: $.data.id }
            - call: "POST /clock-sessions/${cs_range}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_road: $.data.id }
            - call: "POST /clock-sessions/${cs_road}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/skills-tests"
              payload: { examiner_id: "${exam_id}" }
              as: Registrar
              captures: { test_id: $.data.id }
          trigger:
            - call: "POST /skills-tests/${test_id}/grade"
              payload: { pre_trip_score: 80, basic_control_score: 75, road_score: 84 }
              as: ThirdPartyExaminer
              as_user_id: "${exam_id}"
              captures: { ws: $.data.weighted_score }
          assert:
            - "SkillsTest.${test_id}.weighted_score == 80.1"
            - "SkillsTest.${test_id}.outcome == PASS"
            - "SkillsTest.${test_id}.status == GRADED"

      - name: finance_schedule_floor_installment_remainder_to_final
        grounds:
          - calculations.finance_schedule
          - entities.FinancePlan.fields.installment_cents
          - entities.FinancePlan.fields.final_installment_cents
        distinguishing_aspect: |
          Mode (b): rounding-order matters — the equal installment is floor(total_repay/term) and the FINAL
          installment absorbs the leftover cents, so for total_repay 593600 over 6 months the first five are
          98933 and the last is 98935; "round each then sum" would not pin the remainder to the last line.
        test_recipe:
          setup:
            - "Program P with tuition_cents 700000 (>= 600000 -> 20% down tier)."
            - "Enrollment E (APPLIED is fine; finance plans do not require a status)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id, enr_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/finance-plans"
              payload: { term_months: 6, expected_enrollment_version: "${enr_v}" }
              as: Registrar
              captures: { plan_id: $.data.id }
          assert:
            - "FinancePlan.${plan_id}.down_payment_cents == 140000"
            - "FinancePlan.${plan_id}.financed_cents == 560000"
            - "FinancePlan.${plan_id}.total_interest_cents == 33600"
            - "FinancePlan.${plan_id}.installment_cents == 98933"
            - "FinancePlan.${plan_id}.final_installment_cents == 98935"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: skills_test_fail_retake_cycle_supersedes
        grounds:
          - state_machines.SkillsTest.SCHEDULED_to_GRADED
          - entities.SkillsTest.fields.supersedes_test_id
          - entities.SkillsTest.fields.outcome
        distinguishing_aspect: |
          Cyclic shape on SkillsTest: a GRADED FAIL test leaves the Enrollment in TEST_READY, and a NEW
          SkillsTest is scheduled with supersedes_test_id pointing back to the failed test — a revision loop,
          not a linear pipeline.
        test_recipe:
          setup:
            - "Enrollment E at TEST_READY with examiner Ed."
            - "First SkillsTest graded 70/70/70 -> FAIL (Enrollment stays TEST_READY)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000, skills_pass_threshold: 80 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Examiner Ed", cdl_class: "CLASS_B", examiner_certified: true }
              as: SchoolAdmin
              captures: { exam_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${instr_id}", starts_at: "2026-03-10T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_class: $.data.id }
            - call: "POST /clock-sessions/${cs_class}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-11T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_range: $.data.id }
            - call: "POST /clock-sessions/${cs_range}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_road: $.data.id }
            - call: "POST /clock-sessions/${cs_road}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/skills-tests"
              payload: { examiner_id: "${exam_id}" }
              as: Registrar
              captures: { test1_id: $.data.id }
            - call: "POST /skills-tests/${test1_id}/grade"
              payload: { pre_trip_score: 70, basic_control_score: 70, road_score: 70 }
              as: ThirdPartyExaminer
              as_user_id: "${exam_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/skills-tests"
              payload: { examiner_id: "${exam_id}", supersedes_test_id: "${test1_id}" }
              as: Registrar
              captures: { test2_id: $.data.id }
          assert:
            - "SkillsTest.${test1_id}.outcome == FAIL"
            - "SkillsTest.${test2_id}.supersedes_test_id == ${test1_id}"
            - "SkillsTest.${test2_id}.status == SCHEDULED"
            - "Enrollment.${enr_id}.status == TEST_READY"

      - name: enrollment_training_prereq_revert_branch
        grounds:
          - state_machines.Enrollment.TRAINING_to_PREREQ_PENDING
          - state_machines.Enrollment.PREREQ_PENDING_to_TRAINING
          - state_machines.PrereqDocument.APPROVED_to_EXPIRED
        distinguishing_aspect: |
          Branching-with-revert shape on Enrollment (different entity than SkillsTest): expiring an APPROVED
          DOT-medical document reverts the Enrollment TRAINING -> PREREQ_PENDING (a backward edge), the inverse
          of the forward PREREQ_PENDING -> TRAINING edge.
        test_recipe:
          setup:
            - "Enrollment E in TRAINING with both prereqs APPROVED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /prereq-documents/${med_id}/expire"
              payload: {}
              as: SchoolAdmin
          assert:
            - "PrereqDocument.${med_id}.status == EXPIRED"
            - "Enrollment.${enr_id}.dot_medical_verified == false"
            - "Enrollment.${enr_id}.status == PREREQ_PENDING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cancels_sessions_releases_truck_minutes_depth3
        grounds:
          - state_machines.Enrollment.TRAINING_to_WITHDRAWN
          - state_machines.ClockSession.BOOKED_to_CANCELLED
          - calculations.truck_reserved_minutes
          - entities.Truck.fields.reserved_minutes
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger: withdraw (A) -> each BOOKED ClockSession transitions to
          CANCELLED (B, caused by A) -> the CANCELLED session releases truck.reserved_minutes back to 0
          (C, caused by B's cancel side-effect, not directly by withdraw).
        test_recipe:
          setup:
            - "Enrollment E in TRAINING with one BOOKED 120-min RANGE session on Truck T1 (truck.reserved_minutes == 120)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-20T09:00:00Z", duration_minutes: 120 }
              as: Registrar
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "ClockSession.${sess_id}.status == CANCELLED"
            - "Truck.${truck_id}.reserved_minutes == 0"

      - name: withdraw_forfeits_sponsorship_computes_clawback_depth2
        grounds:
          - state_machines.Enrollment.TRAINING_to_WITHDRAWN
          - state_machines.SponsorshipOffer.ACCEPTED_to_FORFEITED
          - calculations.reimbursement_clawback
          - entities.SponsorshipOffer.fields.clawback_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger than the truck-minutes cascade: withdraw (A) -> the ACCEPTED
          SponsorshipOffer transitions to FORFEITED (B, caused by A), and B's transition computes
          clawback_cents == 600000 (full clawback, months_served == 0).
        test_recipe:
          setup:
            - "Enrollment E in TRAINING with an ACCEPTED SponsorshipOffer (Carrier reimbursement 600000, commitment 12, months_served 0)."
          setup_api_calls:
            - call: "POST /programs"
