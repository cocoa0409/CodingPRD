          rationale: "The §1.8 cross-entity-state instance already walks the decon order through ORDERED, TREATED and VERIFIED and asserts at each point whether the quarantine release may be approved."

  - section: endpoints
    instances:
      - name: standard_crud_reciprocity_agreement_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/reciprocity-agreements
          - endpoints.GET_/reciprocity-agreements/{id}
          - endpoints.GET_/reciprocity-agreements
          - entities.ReciprocityAgreement
        distinguishing_aspect: "The interstate-coordination registry is the one entity whose whole surface is plain CRUD: create returns 201 with status defaulted to ACTIVE, the single read returns byte-identical field values, and the filtered list finds it by partner_state_code while a non-matching filter returns an empty page rather than 404."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
