# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Round-Up Micro-Investing & Robo-Advisor. 9 rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls
# chain drives empty-DB -> precondition via §1.5 endpoints only. Asserts are
# literals pre-computed from §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: withdraw_fifo_vs_hifo_realized_gain_divergence
        grounds:
          - calculations.withdraw_settlement
          - state_machines.Order.SUBMITTED_to_SETTLED
          - entities.Order.fields.realized_gain_cents
          - entities.Order.fields.lot_selection_method
        distinguishing_aspect: >
          On identical two-lot inventory (lot A basis 5000 @+1000bps mv 5500 acquired earlier,
          lot B basis 5000 @+4000bps mv 7000 acquired later), a WITHDRAW of 6000 settled FIFO
          yields realized_gain_cents == 643 while the same withdraw settled HIFO yields
          realized_gain_cents == 1715 — divergent results on the Order domain (not the Account domain).
        test_recipe:
          setup:
            - "PERSONAL plan (mgmt 0bps), risk-3 portfolio; verified account with TAXABLE bucket."
            - "Two settled INVEST orders open two OPEN TaxLots: lot A (basis 5000, +1000bps, acquired 2026-02-01), lot B (basis 5000, +4000bps, acquired 2026-02-02)."
            - "A FIFO and a HIFO WITHDRAW order each target 6000 against the same inventory snapshot (run on two sibling accounts/buckets to keep inventory identical)."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "fifo@x.com", full_name: "F Hifo", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /found-money-offers"
              payload: { brand_name: "FifoSeed", rebate_mode: "FLAT", rebate_flat_cents: 10000, max_rebate_cents: 10000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_a_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_va: $.data.version }
            - call: "POST /orders/${o_a_id}/submit"
              payload: { expected_bucket_version: "${bkt_va}" }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /orders/${o_a_id}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tax-lots"
              payload: { open_order_id: "${o_a_id}" }
              as: PlatformAdmin
              captures: { lot_a_id: "$.data[0].id" }
            - call: "POST /_lots/${lot_a_id}/set_valuation"
              payload: { unit_gain_ratio_bps: 1000 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_b_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_vb: $.data.version }
            - call: "POST /orders/${o_b_id}/submit"
              payload: { expected_bucket_version: "${bkt_vb}" }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /orders/${o_b_id}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tax-lots"
              payload: { open_order_id: "${o_b_id}" }
              as: PlatformAdmin
              captures: { lot_b_id: "$.data[0].id" }
            - call: "POST /_lots/${lot_b_id}/set_valuation"
              payload: { unit_gain_ratio_bps: 4000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "WITHDRAW", source: "MANUAL", requested_amount_cents: 6000, lot_selection_method: "FIFO" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { w_fifo_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_vw1: $.data.version }
            - call: "POST /orders/${w_fifo_id}/submit"
              payload: { expected_bucket_version: "${bkt_vw1}" }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /orders/${w_fifo_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { fifo_gain: $.data.realized_gain_cents }
          assert:
            - "Order.${w_fifo_id}.realized_gain_cents == 643"
            - "Order.${w_fifo_id}.settled_amount_cents == 6000"
            - "A HIFO WITHDRAW of 6000 on the same fresh A+B inventory yields Order.realized_gain_cents == 1715 (!= 643)"

      - name: subscription_first_cycle_vs_steady_state_fee
        grounds:
          - calculations.subscription_fee_charge
          - state_machines.Account.TRIAL_to_ACTIVE
          - entities.Account.fields.months_billed
          - entities.SubscriptionPlan.fields.monthly_fee_cents
        distinguishing_aspect: >
          On an Account with plan.monthly_fee_cents == 600, the FIRST charge (leaving TRIAL,
          months_billed==0) debits ceil(600/2) == 300, whereas the second charge (months_billed==1)
          debits the full 600 — dual-variant logic on the Account domain (distinct from the Order-domain
          withdraw dual-variant above).
        test_recipe:
          setup:
            - "PERSONAL plan monthly_fee_cents=600; verified account with cash_balance_cents=2000 funded via a confirmed found-money credit, billing_status=TRIAL, months_billed=0."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "FundBrand", rebate_mode: "FLAT", rebate_flat_cents: 2000, max_rebate_cents: 2000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "sub@x.com", full_name: "S Ub", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/billing/charge-subscription"
              payload: {}
              as: PlatformAdmin
              captures: { cash_after_first: $.data.cash_balance_cents }
            - call: "POST /accounts/${acc_id}/billing/charge-subscription"
              payload: {}
              as: PlatformAdmin
              captures: { cash_after_second: $.data.cash_balance_cents }
          assert:
            - "After first charge: Account.${acc_id}.cash_balance_cents == 1700 (2000 - 300 first-cycle prorated)"
            - "After first charge: Account.${acc_id}.months_billed == 1 and billing_status == ACTIVE"
            - "After second charge: Account.${acc_id}.cash_balance_cents == 1100 (1700 - 600 full fee)"
            - "After second charge: Account.${acc_id}.months_billed == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sweep_round_per_accrual_then_sum_pinned_order
        grounds:
          - calculations.sweep_and_threshold_invest
          - calculations.roundup_effective_amount
          - state_machines.RoundUpAccrual.PENDING_to_SWEPT
          - entities.RoundUpAccrual.fields.effective_amount_cents
        distinguishing_aspect: >
          Mode (b) nested-rounding-order: the sweep total is the SUM of each accrual's already-frozen
          effective_amount_cents (round-per-accrual at accrual time, THEN sum), NOT a single rounding of
          summed raw purchases. Three accruals of 1799@x3, 1850@x2, 437@x1 give frozen effective values
          3 + 100 + 63 and the swept total is 166 (not a re-derivation from raw amounts).
        test_recipe:
          setup:
            - "Verified account, threshold 100000 (so no auto-invest), one LinkedCard per multiplier; three PENDING accruals with frozen effective amounts 3, 100, 63."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "swp@x.com", full_name: "Sw Eep", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "1111", roundup_multiplier: 3 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card3_id: $.data.id }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "2222", roundup_multiplier: 2 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card2_id: $.data.id }
            - call: "POST /linked-cards"
              payload: { account_id: "${acc_id}", last_four: "3333", roundup_multiplier: 1 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { card1_id: $.data.id }
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card3_id}", purchase_amount_cents: 1799 }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card2_id}", purchase_amount_cents: 1850 }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /roundup-accruals"
              payload: { account_id: "${acc_id}", linked_card_id: "${card1_id}", purchase_amount_cents: 437 }
              as: Investor
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /accounts/${acc_id}/sweep"
              payload: { expected_account_version: "${acc_v1}" }
              as: PlatformAdmin
              as_user_id: "${acc_id}"
              captures: { cash_after: $.data.cash_balance_cents }
          assert:
            - "Account.${acc_id}.cash_balance_cents == 166 (3 + 100 + 63, round-per-accrual then sum)"
            - "Account.${acc_id}.pending_roundup_cents == 0 after sweep"
            - "All three RoundUpAccrual rows have status == SWEPT"

      - name: invest_settlement_pinned_eval_order_fee_then_lot
        grounds:
          - calculations.invest_settlement
          - state_machines.Order.SUBMITTED_to_SETTLED
          - entities.Order.fields.management_fee_cents
          - entities.TaxLot.fields.cost_basis_cents
        distinguishing_aspect: >
          Mode (c) pinned evaluation order: management_fee_cents = floor(gross*25/10000), then
          net_principal = gross - fee opens the TaxLot, then cash is debited by the FULL gross.
          With gross 10000 @25bps: fee 25, net 9975, lot cost_basis 9975, cash debited 10000 — the
          order (fee-keyed-on-gross, lot-on-net, debit-on-gross) is load-bearing and well-defined.
        test_recipe:
          setup:
            - "PERSONAL plan mgmt 25bps; verified account with cash_balance_cents=10000 (from confirmed found-money 10000), TAXABLE bucket OPEN."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 25 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "Seed", rebate_mode: "FLAT", rebate_flat_cents: 10000, max_rebate_cents: 10000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "inv@x.com", full_name: "In Vest", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 10000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { o_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_v: $.data.version }
            - call: "POST /orders/${o_id}/submit"
              payload: { expected_bucket_version: "${bkt_v}" }
              as: Investor
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /orders/${o_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { fee: $.data.management_fee_cents, settled: $.data.settled_amount_cents }
          assert:
            - "Order.${o_id}.management_fee_cents == 25 (floor(10000*25/10000))"
            - "Order.${o_id}.settled_amount_cents == 9975 (net principal)"
            - "The opened TaxLot has cost_basis_cents == 9975"
            - "Account.${acc_id}.cash_balance_cents == 0 (full gross 10000 debited)"
            - "Account.${acc_id}.lifetime_invested_cents == 9975"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: referral_cycle_redeemed_back_to_issued
        grounds:
          - state_machines.Referral.ISSUED_to_REDEEMED
          - state_machines.Referral.REDEEMED_to_ISSUED
          - entities.Referral.fields.referred_account_id
        distinguishing_aspect: >
          Referral exhibits a cycle: ISSUED -> REDEEMED -> ISSUED. After release-redemption the status
          returns to ISSUED and referred_account_id is cleared to null, enabling re-redemption by a
          different account — a genuine A->B->A loop on the Referral entity.
        test_recipe:
          setup:
            - "Referrer account R with an ISSUED referral; two other accounts B1 and B2 verified."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "ref@x.com", full_name: "Re Ferrer", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "b1@x.com", full_name: "B One", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_account_id: "${r_id}", code: "CYCLE1", bonus_cents: 1000 }
              as: Investor
              as_user_id: "${r_id}"
              captures: { rf_id: $.data.id }
            - call: "POST /referrals/${rf_id}/redeem"
              payload: { referred_account_id: "${b1_id}" }
              as: Investor
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /referrals/${rf_id}/release-redemption"
              payload: {}
              as: Investor
              as_user_id: "${b1_id}"
              captures: { st: $.data.status }
          assert:
            - "Referral.${rf_id}.status == ISSUED after release-redemption (cycle back)"
            - "Referral.${rf_id}.referred_account_id == null after release"

      - name: order_branching_invest_vs_withdraw_distinct_side_effects
        grounds:
          - state_machines.Order.SUBMITTED_to_SETTLED
          - calculations.invest_settlement
          - calculations.withdraw_settlement
          - entities.Order.fields.order_kind
        distinguishing_aspect: >
          Order branches at settle: an INVEST settle opens a TaxLot, withholds management_fee_cents, and
          debits cash; a WITHDRAW settle consumes TaxLots, computes realized_gain_cents, and credits
          proceeds — two divergent side-effect sets out of the same SUBMITTED->SETTLED edge on the Order entity
          (a different entity from the Referral cycle above).
        test_recipe:
          setup:
            - "Verified account, mgmt 0bps, TAXABLE bucket; cash 5000 (confirmed found-money). One INVEST then one WITHDRAW."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "Seed", rebate_mode: "FLAT", rebate_flat_cents: 5000, max_rebate_cents: 5000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "br@x.com", full_name: "Br Anch", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${acc_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 5000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { inv_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_v1: $.data.version }
            - call: "POST /orders/${inv_id}/submit"
              payload: { expected_bucket_version: "${bkt_v1}" }
              as: Investor
              as_user_id: "${acc_id}"
            - call: "POST /orders/${inv_id}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_id}", bucket_id: "${bkt_id}", order_kind: "WITHDRAW", source: "MANUAL", requested_amount_cents: 5000, lot_selection_method: "FIFO" }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { wd_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${acc_id}"
              captures: { bkt_v2: $.data.version }
            - call: "POST /orders/${wd_id}/submit"
              payload: { expected_bucket_version: "${bkt_v2}" }
              as: Investor
              as_user_id: "${acc_id}"
