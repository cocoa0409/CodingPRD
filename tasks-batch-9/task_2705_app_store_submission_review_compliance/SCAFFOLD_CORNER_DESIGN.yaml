            - "CommerceItem.${item_id}.subscriber_retention_months == 0"
            - "CommerceItem.${item_id}.reported_gross_cents == 0"
            - "CommerceItem.${item_id}.commission_cents == 0"
            - "CommerceItem.${item_id}.commission_rate_applied is null"
            - "CommerceItem.${item_id}.reported_period_label is null"
            - "CommerceItem.${item_id}.external_link_url is null and rejection_note is null"

      - name: two_app_records_share_one_guideline_rule_through_independent_junction_rows
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.FeatureMapping
          - endpoints.GET_/feature-mappings
          - calculations.feature_compliance_index
        distinguishing_aspect: "FeatureMapping is a many-to-many junction: the same EFFECTIVE rule 5.1.1 carries one mapping for Northwind Wallet (PASSED, index 100.00) and one for a second app (NOT_STARTED, index 0.00), and GET /feature-mappings?guideline_rule_id= returns both while each app's index reflects only its own row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with ACTIVE cert and profile."
            - "AppRecord Northwind Wallet with a PASSED mapping to EFFECTIVE rule 5.1.1, feature_compliance_index 100.00, posture OPEN."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
