# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (Task 1927)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per §0.5 rule.
# Common fixture notes: logical clock default 2026-08-01T00:00:00Z; budgets
# 2026-01-01..2027-01-01 cover every trade_date used; plan creators use
# X-User-ID "trader-1", approvers "co-1" (segregation of duties satisfied).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: avg_price_provisional_vs_final_batch
        grounds:
          - calculations.block_average_price
          - entities.BlockOrder.fields.avg_fill_price_cents
          - entities.AllocationPlan.fields.batch_avg_price_cents
        distinguishing_aspect: |
          Same block and same fills: the PROVISIONAL variant (all fills) yields
          1800 while the FINAL_BATCH variant (only the second plan's batch)
          yields 2200 and the first plan's batch yields 1667 — one calculation,
          two input-set variants, three observably different values on the
          BlockOrder/AllocationPlan domain.
        test_recipe:
          setup:
            - "Accounts A1, A2 ACTIVE with OPEN budgets 100000 covering 2026-08-01; EQUITY security lot 1; broker 50bp ACTIVE"
            - "Block BUY total 400 (orders 100 A1, 300 A2) routed; fills 100@1000 (seq 1), 200@2000 (seq 2) -> PARTIALLY_FILLED"
            - "Plan1 PRO_RATA proposed (batch 300, avg 1667, lines 75/225), approved, posted -> allocated_through_seq 2"
            - "Fill 100@2200 (seq 3) -> FILLED; plan2 created (covered_from_seq 2) and proposed (batch 100, avg 2200)"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY, FIXED_INCOME] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/accounts/${a2}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 300, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 200, fill_price_cents: 2000, executed_at: "2026-08-01T09:05:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { p1: $.data.id } }
            - { call: "POST /trading/allocation-plans/${p1}/propose", as: Trader, captures: { p1_avg: $.data.batch_avg_price_cents } }
            - { call: "POST /trading/allocation-plans/${p1}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${p1}/post", as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 2200, executed_at: "2026-08-01T09:10:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v2: $.data.version, blk_avg: $.data.avg_fill_price_cents } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v2}" }, as: Trader, as_user_id: "trader-1", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /trading/allocation-plans/${p2}/propose", as: Trader, captures: { p2_avg: $.data.batch_avg_price_cents, p2_qty: $.data.batch_qty } }
          assert:
            - "AllocationPlan.${p1}.batch_avg_price_cents == 1667 (FINAL_BATCH over fill_seq 1-2: 500000/300 round_half_up)"
            - "AllocationPlan.${p2}.batch_avg_price_cents == 2200 and batch_qty == 100 (FINAL_BATCH over fill_seq 3 only)"
            - "BlockOrder.${blk}.avg_fill_price_cents == 1800 (PROVISIONAL over all fills: 720000/400)"
            - "1800 != 2200 != 1667 — identical fills, variant-dependent results"

      - name: allocation_method_pro_rata_vs_equal_split
        grounds:
          - calculations.allocation_quantity_split
          - entities.AllocationPlan.fields.method
          - entities.Allocation.fields.alloc_qty
        distinguishing_aspect: |
          Two identical blocks (same orders, same fill) allocated once with
          PRO_RATA and once with EQUAL_SPLIT: per-account alloc_qty differs
          ([100,300] vs [200,200]) and only EQUAL_SPLIT breaches the fairness
          tolerance (max_deviation_bp 10000 > 200) — the Allocation-domain
          variant pair, distinct from the BlockOrder average-price domain.
        test_recipe:
          setup:
            - "Accounts A1, A2; EQUITY security lot 1; broker ACTIVE"
            - "Block P with orders 100 (A1) then 300 (A2), routed, one fill 400@1500; block Q identical"
            - "Plan on P created PRO_RATA and proposed; plan on Q created EQUAL_SPLIT and proposed"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { op1: $.data.id } }
            - { call: "POST /trading/orders/${op1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 300, order_type: MARKET }, as: Trader, captures: { op2: $.data.id } }
            - { call: "POST /trading/orders/${op2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blkp: $.data.id } }
            - { call: "POST /trading/blocks/${blkp}/orders", payload: { order_id: "${op1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkp}/orders", payload: { order_id: "${op2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkp}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkp}/fills", payload: { fill_qty: 400, fill_price_cents: 1500, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blkp}", as: Trader, captures: { blkp_v: $.data.version } }
            - { call: "POST /trading/blocks/${blkp}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blkp_v}" }, as: Trader, as_user_id: "trader-1", captures: { planp: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { oq1: $.data.id } }
            - { call: "POST /trading/orders/${oq1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 300, order_type: MARKET }, as: Trader, captures: { oq2: $.data.id } }
            - { call: "POST /trading/orders/${oq2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blkq: $.data.id } }
            - { call: "POST /trading/blocks/${blkq}/orders", payload: { order_id: "${oq1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkq}/orders", payload: { order_id: "${oq2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkq}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkq}/fills", payload: { fill_qty: 400, fill_price_cents: 1500, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blkq}", as: Trader, captures: { blkq_v: $.data.version } }
            - { call: "POST /trading/blocks/${blkq}/allocation-plans", payload: { method: EQUAL_SPLIT, expected_block_version: "${blkq_v}" }, as: Trader, as_user_id: "trader-1", captures: { planq: $.data.id } }
            - { call: "POST /trading/allocation-plans/${planp}/propose", as: Trader }
          trigger:
            - { call: "POST /trading/allocation-plans/${planq}/propose", as: Trader, captures: { q_dev: $.data.max_deviation_bp } }
            - { call: "GET /trading/allocations?plan_id=${planp}", as: Trader, captures: { p_l1: "$.data[0].alloc_qty", p_l2: "$.data[1].alloc_qty" } }
            - { call: "GET /trading/allocations?plan_id=${planq}", as: Trader, captures: { q_l1: "$.data[0].alloc_qty", q_l2: "$.data[1].alloc_qty" } }
          assert:
            - "PRO_RATA lines for ${planp} (created_at order: A1 order first): alloc_qty == [100, 300], max_deviation_bp == 0"
            - "EQUAL_SPLIT lines for ${planq}: alloc_qty == [200, 200], max_deviation_bp == 10000 (|200-100|/100*10000)"
            - "Identical batch 400 @1500, method variant alone changes per-account quantities"

  - rule_id: combinatorial_formula
    instances:
      - name: remainder_distribution_largest_fraction
        grounds:
          - calculations.allocation_quantity_split
          - entities.AllocationPlan.fields.max_deviation_bp
        distinguishing_aspect: |
          Mode (a) combinatorial: a formula with >= 3 inputs (batch_qty, three
          order_qtys, method) and non-linear interaction — floor per member plus
          largest-remainder redistribution ranked by (fractional part DESC,
          order_qty DESC, created_at ASC); the tie between the two 4-unit orders
          is broken by created_at, and the fairness deviation then feeds back as
          an approval gate.
        test_recipe:
          setup:
            - "Accounts A1, A2, A3; EQUITY security lot 1; broker ACTIVE"
            - "Block BUY with orders 4 (A1, created first), 4 (A2), 2 (A3) -> total_qty 10; routed; one fill 7@1000 -> PARTIALLY_FILLED"
            - "Plan PRO_RATA created and proposed over batch 7"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A3", display_name: "A3", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a3: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 4, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 4, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a3}", security_id: "${sec}", side: BUY, order_qty: 2, order_type: MARKET }, as: Trader, captures: { o3: $.data.id } }
            - { call: "POST /trading/orders/${o3}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o3}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 7, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader, captures: { dev: $.data.max_deviation_bp } }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: Trader, captures: { l1: "$.data[0].alloc_qty", l2: "$.data[1].alloc_qty", l3: "$.data[2].alloc_qty" } }
          assert:
            - "Lines (member created_at order o1,o2,o3): alloc_qty == [3, 3, 1] (ideals 2.8/2.8/1.4 -> base 2/2/1, remainder 2 distributed to the two 0.8-fraction members, tie on fraction and qty broken by created_at ASC)"
            - "AllocationPlan.${plan}.max_deviation_bp == 2857 (max of 714/714/2857, round_half_up)"
            - "sum(alloc_qty) == 7 == batch_qty"

      - name: commission_per_line_rounding_order
        grounds:
          - calculations.commission_per_line
          - entities.Allocation.fields.commission_cents
          - entities.CommissionBudget.fields.accrued_commission_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round_half_up then
          sum — two 3-unit lines at 155c and 33bp round to 2c each (budget
          accrual 2 per account), whereas rounding the summed notional would give
          3c total; different rounding order, different cents.
        test_recipe:
          setup:
            - "Accounts A1, A2 with OPEN budgets 100000; EQUITY security lot 1; broker 33bp"
            - "Block BUY orders 3 (A1), 3 (A3?) no — 3 (A1), 3 (A2); routed; fill 6@155 -> FILLED; plan PRO_RATA proposed/approved/posted"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK33", display_name: "B33", commission_rate_bp: 33, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /trading/accounts/${a2}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b2: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 3, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 3, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 6, fill_price_cents: 155, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: Trader, captures: { c1: "$.data[0].commission_cents", c2: "$.data[1].commission_cents" } }
            - { call: "GET /trading/commission-budgets/${b1}", as: Trader, captures: { acc1: $.data.accrued_commission_cents } }
            - { call: "GET /trading/commission-budgets/${b2}", as: Trader, captures: { acc2: $.data.accrued_commission_cents } }
          assert:
            - "Allocation lines commission_cents == [2, 2] (round_half_up(3*155*33/10000) = round_half_up(1.5345) = 2 per line)"
            - "CommissionBudget.${b1}.accrued_commission_cents == 2 and .${b2} == 2 (per-line-then-sum; sum-then-round would total 3)"

  - rule_id: non_linear_state_machine
    instances:
      - name: order_compliance_recheck_and_block_membership_cycles
        grounds:
          - state_machines.Order.COMPLIANCE_REJECTED_to_APPROVED
          - state_machines.Order.APPROVED_to_BLOCKED
          - state_machines.Order.BLOCKED_to_APPROVED
        distinguishing_aspect: |
          The Order machine contains two independent cycles on one entity:
          PENDING_COMPLIANCE -> COMPLIANCE_REJECTED -> APPROVED (compliance
          re-check loop driven by restriction state) and APPROVED -> BLOCKED ->
          APPROVED (block membership loop); a purely linear pipeline cannot
          express either.
        test_recipe:
          setup:
            - "Account A1 ACTIVE; security ACTIVE; ACTIVE PROHIBITED restriction on (A1, sec, BUY) covering 2026-08-01; then restriction retired before re-check"
            - "Order 100 BUY created; first compliance-check rejects; after retire, re-check approves; block created; attach; detach"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/restrictions", payload: { account_id: "${a1}", security_id: "${sec}", rule_type: PROHIBITED, side: BUY, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: ComplianceOfficer, captures: { rst: $.data.id } }
            - { call: "POST /trading/restrictions/${rst}/activate", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer, captures: { st1: $.data.status, note1: $.data.compliance_note } }
            - { call: "POST /trading/restrictions/${rst}/retire", as: ComplianceOfficer }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer, captures: { st2: $.data.status } }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader, captures: { st3: $.data.status } }
          trigger:
