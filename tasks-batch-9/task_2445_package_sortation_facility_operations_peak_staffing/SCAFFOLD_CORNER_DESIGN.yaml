            - "ChuteAssignment.${ca1_id}.status stays ACTIVE"
            - "DestinationLane.${lane_id}.assigned_capacity_pph == 3000 (1200 + 1800), NOT 4800: the SUPERSEDED row contributes nothing"
            - "DestinationLane.${lane_id}.lane_pressure_ratio == 0.0000 with backlog_package_count == 0"

