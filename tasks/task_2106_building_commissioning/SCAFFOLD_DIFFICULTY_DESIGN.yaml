          setup:
            - "Project P (contract_value_cents 100000000, certification_target STANDARD) with APPROVED OwnerRequirement R1 (target 10000, tolerance 5) pinned by an APPROVED CxPlan."
            - "EquipmentUnit E1 (FIRE_ALARM, LIFE_SAFETY, contract_value_cents 1000005, weight_units 10) is STARTED_UP and PREFUNCTIONAL_VERIFIED."
            - "Two ACCEPTED closeout deliverables D1 (SYSTEMS_MANUAL_SECTION) and D2 (TRAINING_SESSION, 5 of 5 attendees)."
            - "CertificationCredit C1 (required_evidence_count 4, max_points 6.0) carries four FRESH evidence rows and has already been SUBMITTED, so completeness_ratio is 1.0 and final_tier is GOLD."
