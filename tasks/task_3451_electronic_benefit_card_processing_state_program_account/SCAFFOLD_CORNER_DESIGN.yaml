  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: stale_case_version_rejected_on_status_change
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[case-status-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CaseAccount.version: after a successful suspend moves version 1 -> 2, a second status call still carrying expected_case_account_version 1 is rejected with 412 ERR_STALE_VERSION even though SUSPENDED -> OPEN is a legal transition."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; case 0000000000 OPEN at version 1 (captured), then suspended (version 2)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H K4" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { v1: $.data.version } }
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "SUSPENDED", expected_case_account_version: "${v1}" }, as: StateAdmin, captures: { st1: $.data.account_status } }
          trigger:
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "OPEN", expected_case_account_version: "${v1}" }, as: StateAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { st2: $.data.account_status } }
          assert:
            - "first call succeeded with the then-current version (st1 == 'SUSPENDED')"
            - "second call with the stale version: err == 'ERR_STALE_VERSION' (HTTP 412)"
            - "account_status remains 'SUSPENDED' (st2) — the rejected call changed nothing"

