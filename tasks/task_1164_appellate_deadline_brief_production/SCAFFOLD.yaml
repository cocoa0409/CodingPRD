# =============================================================================
# SCAFFOLD — Appellate Deadline & Brief Production Management
# =============================================================================
# Scenario 1164: appellate practice group management — notice of appeal
# deadline computation & jurisdiction rules, record on appeal designation &
# transcript ordering, briefing schedule & extension motions, page/word limit
# & formatting compliance, table of authorities generation & citation
# verification, e-filing & service requirements, oral argument scheduling &
# moot preparation, decision monitoring & further review petitions.
# =============================================================================

scenario: |
  1164. Appellate Deadline & Brief Production Management (appellate practice
  group): notice of appeal deadline computation & jurisdiction rules, record
  on appeal designation & transcript ordering, briefing schedule & extension
  motions, page/word limit & formatting compliance, table of authorities
  generation & citation verification, filing method (e-filing) & service
  requirements, oral argument scheduling & moot preparation, decision
  monitoring & further review petitions.

domain_name: appellate-practice
api_prefix: /appellate

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Optimistic concurrency"
    - "Rate / threshold triggers"
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Court
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Court code (e.g. CA9, SCOTUS, NY-AD1)", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Court display name" }
      - { name: jurisdiction_type, type: enum, source: input, description: "FEDERAL | STATE | TRIBAL — controls deadline basis" }
      - { name: appeal_deadline_days, type: integer, source: input, description: "Default days from triggering event to notice-of-appeal deadline" }
      - { name: reply_brief_window_days, type: integer, source: input, description: "Days between appellee brief and reply brief" }
      - { name: uses_word_count, type: boolean, source: input, description: "If true, briefs are limited by word_count; else by page_count" }
      - { name: max_words_opening, type: integer, source: input, description: "Word limit for opening brief when uses_word_count=true" }
      - { name: max_pages_opening, type: integer, source: input, description: "Page limit for opening brief when uses_word_count=false" }
      - { name: max_words_reply, type: integer, source: input, description: "Word limit for reply brief when uses_word_count=true" }
      - { name: max_pages_reply, type: integer, source: input, description: "Page limit for reply brief when uses_word_count=false" }
      - { name: efiling_required, type: boolean, source: input, description: "Court mandates electronic filing" }
      - { name: weekend_holiday_rollforward, type: boolean, source: input, description: "If true, deadlines landing on weekend/holiday roll to next business day" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; appellate court handling the case" }
      - { name: docket_number, type: string, source: input, description: "Court docket number; unique within court" }
      - { name: caption, type: string, source: input, description: "Case caption" }
      - { name: lead_attorney_id, type: string, source: input, description: "FK -> Attorney.id; attorney of record responsible for the appeal" }
      - { name: appellant_side, type: enum, source: input, description: "APPELLANT | APPELLEE | CROSS_APPELLANT — which side this firm represents" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RECORD_PENDING | BRIEFING | ARGUMENT_PENDING | DECIDED | CLOSED — derived from child entity states" }
      - { name: notice_filed_at, type: datetime, source: system, description: "Timestamp when notice of appeal was filed; null until filed" }
      - { name: judgment_entered_at, type: datetime, source: input, description: "Date the lower-court judgment was entered — the canonical trigger for deadline computation" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - { name: bar_number, type: string, source: input, description: "State bar number; unique" }
      - { name: full_name, type: string, source: input, description: "Attorney full name" }
      - { name: email, type: string, source: input, description: "Attorney email for service" }
      - { name: admitted_court_ids, type: array, source: input, description: "Array of Court.id values the attorney is admitted to" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: AppealEvent
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; parent case" }
      - { name: event_type, type: enum, source: input, description: "JUDGMENT_ENTERED | NOTICE_FILED | POST_JUDGMENT_MOTION_FILED | POST_JUDGMENT_MOTION_DECIDED | RECORD_COMPLETE | BRIEF_FILED | DECISION_ISSUED" }
      - { name: occurred_at, type: datetime, source: input, description: "Timestamp the event occurred in the court of record" }
      - { name: notes, type: string, source: input, description: "Free-text annotation", default: "" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Deadline
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: kind, type: enum, source: input, description: "NOTICE_OF_APPEAL | RECORD_DESIGNATION | TRANSCRIPT_ORDER | OPENING_BRIEF | RESPONSE_BRIEF | REPLY_BRIEF | REHEARING_PETITION | CERT_PETITION" }
      - { name: basis_event_id, type: string, source: input, description: "FK -> AppealEvent.id; the event from which this deadline is computed" }
      - { name: provisional_due_at, type: datetime, source: computed, description: "Provisional deadline computed from basis event + court rules, before tolling/extensions" }
      - { name: final_due_at, type: datetime, source: computed, description: "Final deadline after tolling events and granted extensions; equals provisional until adjusted" }
      - { name: tolled, type: boolean, source: computed, description: "True if a pending tolling event currently suspends this deadline" }
      - { name: met, type: boolean, source: computed, description: "True once the corresponding act is filed/performed" }
      - { name: met_at, type: datetime, source: system, description: "Timestamp deadline was satisfied; null while unmet" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Record
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; 1:1 with case (only one record per appeal)" }
      - { name: designation_due_at, type: datetime, source: computed, description: "Date by which appellant must designate record contents" }
      - { name: designated_at, type: datetime, source: system, description: "Timestamp designation was filed; null until designation" }
      - { name: status, type: enum, source: system, description: "PENDING_DESIGNATION → DESIGNATED → ASSEMBLING → COMPLETE → FILED" }
      - { name: completeness_pct, type: integer, source: computed, description: "Percent of designated items with transcripts delivered (0–100)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TranscriptOrder
    parent: Record
    common_fields: true
    fields:
      - { name: record_id, type: string, source: system, description: "FK -> Record.id" }
      - { name: hearing_date, type: datetime, source: input, description: "Date of the hearing to be transcribed" }
      - { name: court_reporter, type: string, source: input, description: "Reporter name or firm" }
      - { name: estimated_pages, type: integer, source: input, description: "Estimated transcript length" }
      - { name: actual_pages, type: integer, source: input, description: "Delivered page count; set on DELIVERED transition", default: 0 }
      - { name: ordered_at, type: datetime, source: system, description: "Timestamp the order was placed" }
      - { name: due_at, type: datetime, source: computed, description: "Transcript delivery deadline = ordered_at + court.transcript_delivery_days (30 default)" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp transcript delivered; null until delivery" }
      - { name: status, type: enum, source: system, description: "ORDERED → IN_PREPARATION → DELIVERED → FILED / CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: BriefingSchedule
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; 1:1 with case" }
      - { name: opening_due_at, type: datetime, source: computed, description: "Opening brief due date" }
      - { name: response_due_at, type: datetime, source: computed, description: "Response brief due date" }
      - { name: reply_due_at, type: datetime, source: computed, description: "Reply brief due date" }
      - { name: extensions_granted_count, type: integer, source: computed, description: "Total granted extension motions on this schedule" }
      - { name: status, type: enum, source: system, description: "PENDING → ACTIVE → COMPLETE | VACATED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Brief
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: schedule_id, type: string, source: input, description: "FK -> BriefingSchedule.id; the governing schedule" }
      - { name: brief_type, type: enum, source: input, description: "OPENING | RESPONSE | REPLY | AMICUS" }
      - { name: author_attorney_id, type: string, source: input, description: "FK -> Attorney.id; drafting attorney" }
      - { name: due_at, type: datetime, source: computed, description: "Inherited from schedule at creation; re-derived on schedule shift" }
      - { name: page_count, type: integer, source: input, description: "Length in pages (used when court uses page limits)" }
      - { name: word_count, type: integer, source: input, description: "Length in words (used when court uses word limits)" }
      - { name: over_limit, type: boolean, source: computed, description: "True when current length exceeds the court limit for brief_type" }
      - { name: status, type: enum, source: system, description: "DRAFT → IN_REVIEW → READY → EFILED → ACCEPTED | REJECTED | STRICKEN" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TableOfAuthorities
    parent: Brief
    common_fields: true
    fields:
      - { name: brief_id, type: string, source: system, description: "FK -> Brief.id; 1:1 with brief" }
      - { name: citation_count, type: integer, source: computed, description: "Number of citations extracted" }
      - { name: verified_count, type: integer, source: computed, description: "Number of citations verified against authority source" }
      - { name: unverified_count, type: integer, source: computed, description: "= citation_count - verified_count" }
      - { name: generated_at, type: datetime, source: system, description: "Timestamp of last TOA generation; null until generated" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Citation
    parent: TableOfAuthorities
    common_fields: true
    fields:
      - { name: toa_id, type: string, source: system, description: "FK -> TableOfAuthorities.id" }
      - { name: raw_text, type: string, source: input, description: "Citation as it appears in the brief" }
      - { name: normalized, type: string, source: computed, description: "Normalized citation form" }
      - { name: authority_type, type: enum, source: input, description: "CASE | STATUTE | RULE | SECONDARY" }
      - { name: verified, type: boolean, source: computed, description: "True once citation is verified against authority source" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp of verification; null while unverified" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ExtensionMotion
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: schedule_id, type: string, source: input, description: "FK -> BriefingSchedule.id the motion targets" }
      - { name: target, type: enum, source: input, description: "OPENING | RESPONSE | REPLY — which deadline the motion seeks to move" }
      - { name: requested_days, type: integer, source: input, description: "Number of days requested (>0)" }
      - { name: reason, type: string, source: input, description: "Good-cause statement" }
      - { name: granted_days, type: integer, source: system, description: "Days actually granted on ruling; 0 when denied", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING → GRANTED | DENIED | WITHDRAWN" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of ruling; null while PENDING" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Filing
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: brief_id, type: string, source: input, description: "FK -> Brief.id when filing_type=BRIEF; null otherwise" }
      - { name: filing_type, type: enum, source: input, description: "NOTICE_OF_APPEAL | RECORD | BRIEF | EXTENSION_MOTION | REHEARING_PETITION | CERT_PETITION" }
      - { name: method, type: enum, source: input, description: "EFILE | PAPER | HAND" }
      - { name: served_party_emails, type: array, source: input, description: "Email addresses served with this filing" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp filing was accepted by the system" }
      - { name: confirmation_number, type: string, source: system, description: "E-filing confirmation; null for PAPER/HAND until clerk stamps" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → ACCEPTED | REJECTED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: OralArgument
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Argument start (UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Allocated minutes; must be >0" }
      - { name: panel_judges, type: array, source: input, description: "Array of judge names on the panel" }
      - { name: moot_completed, type: boolean, source: computed, description: "True once a moot session has been logged", default: false }
      - { name: status, type: enum, source: system, description: "REQUESTED → SCHEDULED → HELD | WAIVED | CONTINUED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Decision
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: outcome, type: enum, source: input, description: "AFFIRMED | REVERSED | REMANDED | DISMISSED | MIXED" }
      - { name: issued_at, type: datetime, source: input, description: "Date the decision was issued" }
      - { name: mandate_at, type: datetime, source: computed, description: "Date the mandate issues; computed from court rules after rehearing window closes" }
      - { name: rehearing_deadline_at, type: datetime, source: computed, description: "Last day to petition for rehearing" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: FurtherReviewPetition
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: petition_type, type: enum, source: input, description: "REHEARING | REHEARING_EN_BANC | CERTIORARI" }
      - { name: basis_decision_id, type: string, source: input, description: "FK -> Decision.id this petition challenges" }
      - { name: due_at, type: datetime, source: computed, description: "Computed from decision.issued_at + court petition window" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp the petition was filed; null until filed" }
      - { name: status, type: enum, source: system, description: "DRAFT → FILED → GRANTED | DENIED | WITHDRAWN" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Record
    initial_state: PENDING_DESIGNATION
    terminal_states: [FILED]
    transitions:
      - from: PENDING_DESIGNATION
        to: DESIGNATED
        trigger: "POST /appellate/records/{id}/designate"
        actor: Attorney
        preconditions:
          - "record.completeness_pct is undefined-or-zero (no transcripts yet required)"
          - "case.posture == RECORD_PENDING"
        side_effects:
          - "record.designated_at = now()"
          - "case.posture recomputed (may remain RECORD_PENDING until transcripts arrive)"

      - from: DESIGNATED
        to: ASSEMBLING
        trigger: "system: first TranscriptOrder under this record transitions to IN_PREPARATION"
        actor: system
        preconditions:
          - "at least one TranscriptOrder with status IN_PREPARATION"
        side_effects:
          - "recompute record.completeness_pct"

      - from: ASSEMBLING
        to: COMPLETE
        trigger: "system: all non-CANCELLED TranscriptOrders under the record are DELIVERED or FILED"
        actor: system
        preconditions:
          - "count(TranscriptOrder where record_id=this and status IN {ORDERED, IN_PREPARATION}) == 0"
          - "at least one TranscriptOrder exists with status IN {DELIVERED, FILED}"
        side_effects:
          - "record.completeness_pct = 100"
          - "case.posture recomputed (RECORD_PENDING → BRIEFING when briefing schedule exists)"
          - "briefing_schedule.status: PENDING → ACTIVE when case has schedule"

      - from: COMPLETE
        to: FILED
        trigger: "POST /appellate/records/{id}/file"
        actor: Attorney
        preconditions:
          - "record.status == COMPLETE"
          - "filing accepted (Filing record created with filing_type=RECORD, status=ACCEPTED)"
        side_effects:
          - "creates a Filing row with filing_type=RECORD"

      - from: DESIGNATED
        to: PENDING_DESIGNATION
        trigger: "POST /appellate/records/{id}/revoke-designation"
        actor: Attorney
        preconditions:
          - "no TranscriptOrder under this record has status IN {DELIVERED, FILED}"
        side_effects:
          - "record.designated_at = null"
          - "all TranscriptOrders with status IN {ORDERED, IN_PREPARATION} → CANCELLED"

  - entity: TranscriptOrder
    initial_state: ORDERED
    terminal_states: [FILED, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_PREPARATION
        trigger: "POST /appellate/transcript-orders/{id}/begin-preparation"
        actor: CourtClerk
        preconditions:
          - "record.status IN {DESIGNATED, ASSEMBLING}"
        side_effects:
          - "if record.status == DESIGNATED: record → ASSEMBLING (bubble-up)"

      - from: IN_PREPARATION
        to: DELIVERED
        trigger: "POST /appellate/transcript-orders/{id}/deliver"
        actor: CourtClerk
        preconditions:
          - "payload.actual_pages > 0"
        side_effects:
          - "transcript.delivered_at = now()"
          - "recompute record.completeness_pct"
          - "if all sibling transcripts delivered/filed: record → COMPLETE (bubble-up)"

      - from: DELIVERED
        to: FILED
        trigger: "POST /appellate/transcript-orders/{id}/file"
        actor: Attorney
        preconditions:
          - "record.status IN {ASSEMBLING, COMPLETE}"
        side_effects: []

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /appellate/transcript-orders/{id}/cancel"
        actor: Attorney
        preconditions:
          - "transcript.status == ORDERED"
        side_effects:
          - "recompute record.completeness_pct"

      - from: IN_PREPARATION
        to: CANCELLED
        trigger: "POST /appellate/transcript-orders/{id}/cancel"
        actor: Attorney
        preconditions:
          - "no deliveries recorded"
        side_effects:
          - "recompute record.completeness_pct"

  - entity: Brief
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, STRICKEN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /appellate/briefs/{id}/submit-review"
        actor: Attorney
        preconditions:
          - "brief.author_attorney_id == X-User-ID (drafter submits own draft)"
          - "case.posture IN {BRIEFING, RECORD_PENDING}"
        side_effects: []

      - from: IN_REVIEW
        to: READY
        trigger: "POST /appellate/briefs/{id}/approve"
        actor: Attorney
        preconditions:
          - "approving attorney X-User-ID != brief.author_attorney_id (segregation of duties)"
          - "approving attorney is admitted to case.court_id"
          - "brief.over_limit == false"
          - "if court.efiling_required: TOA exists and TOA.unverified_count == 0"
        side_effects:
          - "brief.status = READY"

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /appellate/briefs/{id}/return-draft"
        actor: Attorney
        preconditions:
          - "approving attorney X-User-ID != brief.author_attorney_id"
        side_effects:
          - "cycles back for revision (cyclic loop DRAFT ↔ IN_REVIEW)"

      - from: READY
        to: EFILED
        trigger: "POST /appellate/briefs/{id}/efile"
        actor: Attorney
        preconditions:
          - "court.efiling_required == true OR payload.method explicitly EFILE"
          - "record.status IN {COMPLETE, FILED}"
          - "briefing_schedule.status == ACTIVE"
          - "now() <= brief.due_at (late filings rejected)"
        side_effects:
          - "creates Filing row with filing_type=BRIEF, status=SUBMITTED"
          - "marks Deadline for this brief_type as met when Filing accepted"

      - from: EFILED
        to: ACCEPTED
        trigger: "POST /appellate/filings/{id}/accept (system or clerk)"
        actor: CourtClerk
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects:
          - "brief.status = ACCEPTED"
          - "corresponding Deadline.met = true, Deadline.met_at = now()"
          - "if this was the response brief: schedule opening of reply window"

      - from: EFILED
        to: REJECTED
        trigger: "POST /appellate/filings/{id}/reject"
        actor: CourtClerk
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects:
          - "brief returns to DRAFT (compensation: filing rejected → brief must be redrafted)"

      - from: ACCEPTED
        to: STRICKEN
        trigger: "POST /appellate/briefs/{id}/strike"
        actor: CourtClerk
        preconditions:
          - "brief.status == ACCEPTED"
          - "court order cited in payload.reason"
        side_effects:
          - "Deadline.met reset to false (compensating reversal)"
          - "case.posture recomputed"

  - entity: BriefingSchedule
    initial_state: PENDING
    terminal_states: [COMPLETE, VACATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: record becomes COMPLETE"
        actor: system
        preconditions:
          - "record.status == COMPLETE"
        side_effects:
          - "recompute opening_due_at, response_due_at, reply_due_at from court rules"

      - from: ACTIVE
        to: COMPLETE
        trigger: "system: all required briefs ACCEPTED (or reply window expired)"
        actor: system
        preconditions:
          - "count(Brief where schedule_id=this and brief_type IN {OPENING, RESPONSE} and status == ACCEPTED) >= 2"
          - "either a REPLY brief is ACCEPTED, or now() > reply_due_at"
        side_effects:
          - "case.posture: BRIEFING → ARGUMENT_PENDING"

      - from: ACTIVE
        to: VACATED
        trigger: "POST /appellate/briefing-schedules/{id}/vacate"
        actor: CourtClerk
        preconditions:
          - "no Brief under this schedule has status IN {EFILED, ACCEPTED}"
        side_effects:
          - "all Briefs under schedule → DRAFT (compensation)"
          - "all Deadline rows for brief types unmet"

      - from: PENDING
        to: VACATED
        trigger: "POST /appellate/briefing-schedules/{id}/vacate"
        actor: CourtClerk
        preconditions: []
        side_effects: []

  - entity: ExtensionMotion
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /appellate/extension-motions/{id}/grant"
        actor: CourtClerk
        preconditions:
          - "motion.status == PENDING"
          - "payload.granted_days > 0"
          - "payload.granted_days <= motion.requested_days"
          - "schedule.status == ACTIVE"
        side_effects:
          - "motion.granted_days = payload.granted_days"
          - "motion.decided_at = now()"
          - "shift briefing_schedule.<target>_due_at forward by granted_days"
          - "if target==OPENING: shift response_due_at and reply_due_at by the same delta (cascade depth 2)"
          - "if target==RESPONSE: shift reply_due_at by the same delta"
          - "recompute Brief.due_at for all Briefs whose brief_type matches target or any cascaded target"
          - "schedule.extensions_granted_count += 1"
          - "Deadline rows of kind matching target: recompute final_due_at = provisional_due_at + sum(granted_days)"

      - from: PENDING
        to: DENIED
        trigger: "POST /appellate/extension-motions/{id}/deny"
        actor: CourtClerk
        preconditions:
          - "motion.status == PENDING"
        side_effects:
          - "motion.granted_days = 0"
          - "motion.decided_at = now()"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /appellate/extension-motions/{id}/withdraw"
        actor: Attorney
        preconditions:
          - "motion.status == PENDING"
          - "withdrawing attorney belongs to the case (case.lead_attorney_id == X-User-ID)"
        side_effects:
          - "motion.decided_at = now()"

  - entity: Filing
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /appellate/filings/{id}/accept"
        actor: CourtClerk
        preconditions:
          - "filing.status == SUBMITTED"
          - "if filing.filing_type == BRIEF: brief.over_limit == false"
          - "if filing.method == EFILE: served_party_emails non-empty"
        side_effects:
          - "if filing_type == BRIEF: brief → ACCEPTED"
          - "if filing_type == NOTICE_OF_APPEAL: case.notice_filed_at = filing.filed_at; case.posture OPEN → RECORD_PENDING"
          - "if filing_type == RECORD: record → FILED"
          - "if filing_type == REHEARING_PETITION or CERT_PETITION: petition → FILED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /appellate/filings/{id}/reject"
        actor: CourtClerk
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects:
          - "if filing_type == BRIEF: brief → DRAFT (compensation)"

  - entity: OralArgument
    initial_state: REQUESTED
    terminal_states: [HELD, WAIVED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /appellate/oral-arguments/{id}/schedule"
        actor: CourtClerk
        preconditions:
          - "case.posture == ARGUMENT_PENDING"
          - "no other OralArgument for same court overlaps [scheduled_start, scheduled_start + duration_minutes) (court-room temporal overlap rule)"
          - "scheduled_start >= now() + court.argument_notice_days (default 14) — notice window"
        side_effects: []

      - from: SCHEDULED
        to: HELD
        trigger: "POST /appellate/oral-arguments/{id}/mark-held"
        actor: CourtClerk
        preconditions:
          - "now() >= scheduled_start"
        side_effects:
          - "case.posture ARGUMENT_PENDING → DECIDED after Decision row created"

      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /appellate/oral-arguments/{id}/continue"
        actor: CourtClerk
        preconditions:
          - "now() < scheduled_start"
        side_effects:
          - "status becomes REQUESTED again (cycle)"
          - "scheduled_start cleared"

      - from: REQUESTED
        to: WAIVED
        trigger: "POST /appellate/oral-arguments/{id}/waive"
        actor: Attorney
        preconditions:
          - "case.lead_attorney_id == X-User-ID"
        side_effects:
          - "case proceeds to decision without argument"

  - entity: FurtherReviewPetition
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /appellate/petitions/{id}/file"
        actor: Attorney
        preconditions:
          - "now() <= petition.due_at"
          - "case.posture == DECIDED"
        side_effects:
          - "creates Filing row with filing_type=REHEARING_PETITION or CERT_PETITION"

      - from: FILED
        to: GRANTED
        trigger: "POST /appellate/petitions/{id}/grant"
        actor: CourtClerk
        preconditions:
          - "petition.status == FILED"
        side_effects:
          - "if petition_type IN {REHEARING, REHEARING_EN_BANC}: case reopens — posture DECIDED → BRIEFING; new BriefingSchedule created"
          - "if petition_type == CERTIORARI: case closed (GRANTED cert transfers jurisdiction out)"

      - from: FILED
        to: DENIED
        trigger: "POST /appellate/petitions/{id}/deny"
        actor: CourtClerk
        preconditions:
          - "petition.status == FILED"
        side_effects:
          - "decision.mandate_at recomputed = now() + court.mandate_delay_days"
          - "case.posture → CLOSED when no other petitions pending"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /appellate/petitions/{id}/withdraw"
        actor: Attorney
        preconditions:
          - "petition.status == DRAFT"
        side_effects: []

  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECORD_PENDING
        trigger: "system: notice of appeal Filing ACCEPTED"
        actor: system
        preconditions:
          - "Filing with filing_type=NOTICE_OF_APPEAL, case_id=this, status=ACCEPTED exists"
        side_effects:
          - "case.notice_filed_at = filing.filed_at"
          - "auto-create Record row in PENDING_DESIGNATION"
          - "auto-create BriefingSchedule row in PENDING"
          - "auto-create Deadline rows for RECORD_DESIGNATION, TRANSCRIPT_ORDER"

      - from: RECORD_PENDING
        to: BRIEFING
        trigger: "system: record transitions to COMPLETE"
        actor: system
        preconditions:
          - "record.status == COMPLETE"
        side_effects:
          - "briefing_schedule PENDING → ACTIVE"
          - "auto-create Deadline rows for OPENING_BRIEF, RESPONSE_BRIEF, REPLY_BRIEF"

      - from: BRIEFING
        to: ARGUMENT_PENDING
        trigger: "system: briefing_schedule transitions to COMPLETE"
        actor: system
        preconditions:
          - "briefing_schedule.status == COMPLETE"
        side_effects:
          - "auto-create OralArgument in REQUESTED"

      - from: ARGUMENT_PENDING
        to: DECIDED
        trigger: "system: Decision row created"
        actor: CourtClerk
        preconditions:
          - "Decision.case_id == this"
          - "oral_argument.status IN {HELD, WAIVED}"
        side_effects:
          - "auto-create Deadline rows for REHEARING_PETITION and CERT_PETITION"

      - from: DECIDED
        to: BRIEFING
        trigger: "system: rehearing petition GRANTED (reopening)"
        actor: system
        preconditions:
          - "petition.petition_type IN {REHEARING, REHEARING_EN_BANC}"
          - "petition.status == GRANTED"
        side_effects:
          - "new BriefingSchedule row created PENDING"
          - "cyclic: DECIDED → BRIEFING loop"

      - from: DECIDED
        to: CLOSED
        trigger: "system: mandate issues and no pending petitions"
        actor: system
        preconditions:
          - "now() >= decision.mandate_at"
          - "no FurtherReviewPetition with status IN {DRAFT, FILED}"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-vacate-stale-case
    parent_entity: Case
    write_endpoint: "POST /appellate/briefing-schedules/{id}/vacate"
    occ_field: expected_case_version
    description: |
      Vacating a BriefingSchedule against a Case whose version has advanced since
      the clerk last observed it is rejected: between read and vacate, another
      writer may have filed a brief or granted a petition, legitimately advancing
      the case into a state where vacating would silently undo fresh work.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: extension-grant-stale-schedule
    parent_entity: BriefingSchedule
    write_endpoint: "POST /appellate/extension-motions/{id}/grant"
    occ_field: expected_schedule_version
    description: |
      Granting an ExtensionMotion against a BriefingSchedule whose version has
      advanced since the clerk last observed it is rejected: a previously-granted
      motion may already have shifted the same target deadline, so a second grant
      computed from a stale view would double-apply deltas.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: notice_of_appeal_deadline
    trigger: "AppealEvent created with event_type=JUDGMENT_ENTERED"
    algorithm: chronological
    formula: |
      base = judgment_event.occurred_at
      days = court.appeal_deadline_days
      provisional_due_at = add_calendar_days(base, days)
      if court.weekend_holiday_rollforward:
          while is_weekend(provisional_due_at) or is_court_holiday(provisional_due_at):
              provisional_due_at = add_calendar_days(provisional_due_at, 1)
      final_due_at = provisional_due_at   # before tolling/extensions
    input_set: "single AppealEvent row of event_type=JUDGMENT_ENTERED; court row by case.court_id"
    constants:
      DEFAULT_APPEAL_DAYS_FEDERAL: 30
      DEFAULT_APPEAL_DAYS_STATE: 60
    precision: "timestamp precision to second; no rounding"
    variants:
      - name: provisional
        when: "computed immediately from judgment event, before any tolling"
        difference: "ignores pending post-judgment motions; uses base formula"
      - name: final
        when: "recomputed when POST_JUDGMENT_MOTION_DECIDED event lands"
        difference: "tolls the period: final = provisional + (motion_decided_at - motion_filed_at); the tolling delta can push the deadline substantially later, so provisional != final"

  - name: briefing_schedule_dates
    trigger: "BriefingSchedule transitions PENDING → ACTIVE, or any ExtensionMotion GRANTED on this schedule"
    algorithm: forward_looking
    formula: |
      anchor = record.completed_at
      opening_due_at  = add_calendar_days(anchor, court.opening_brief_days)   # default 40
      response_due_at = add_calendar_days(opening_due_at, court.response_brief_days)  # default 30
      reply_due_at    = add_calendar_days(response_due_at, court.reply_brief_window_days)
      # apply granted extensions per target with cascade:
      for each granted motion m ordered by m.decided_at ASC (chronological; tie-break by created_at ASC):
          delta = m.granted_days
          if m.target == OPENING:
              opening_due_at  += delta
              response_due_at += delta   # cascade: response anchored to opening
              reply_due_at    += delta   # cascade: reply anchored to response
          elif m.target == RESPONSE:
              response_due_at += delta
              reply_due_at    += delta
          elif m.target == REPLY:
              reply_due_at    += delta
    input_set: "record row; all ExtensionMotion rows with schedule_id=this and status=GRANTED"
    constants:
      DEFAULT_OPENING_DAYS: 40
      DEFAULT_RESPONSE_DAYS: 30
    precision: "timestamp precision to second; add_calendar_days preserves time-of-day"
    variants:
      - name: forward_anchored
        when: "initial activation"
        difference: "anchors on record completion"
      - name: extension_shifted
        when: "any motion granted"
        difference: "applies cascade shifts; same anchor but different outputs — order-sensitive across multiple motions"

  - name: brief_limit_check
    trigger: "Brief PATCH updating page_count/word_count, or brief approval, or court limit change"
    algorithm: threshold
    formula: |
      if court.uses_word_count:
          limit = (brief.brief_type == REPLY) ? court.max_words_reply : court.max_words_opening
          used  = brief.word_count
      else:
          limit = (brief.brief_type == REPLY) ? court.max_pages_reply : court.max_pages_opening
          used  = brief.page_count
      over_limit = (used > limit)   # strictly greater; exactly-at-limit is allowed
    input_set: "brief row; court row"
    constants: {}
    precision: "integer compare; no rounding"
    variants:
      - name: word_count_variant
        when: "court.uses_word_count == true"
        difference: "compares word_count against max_words_*"
      - name: page_count_variant
        when: "court.uses_word_count == false"
        difference: "compares page_count against max_pages_*; a brief can be over-limit in one variant and within-limit in the other for identical input"

  - name: toa_unverified_count
    trigger: "TOA generation, citation verify, citation add/remove"
    algorithm: aggregation
    formula: |
      citation_count  = count(Citation where toa_id = this.id)
      verified_count  = count(Citation where toa_id = this.id and verified == true)
      unverified_count = citation_count - verified_count
    input_set: "Citation children of this TOA, all statuses"
    constants: {}
    precision: "integer arithmetic"
    variants:
      - name: provisional
        when: "during drafting — citations added but not yet verified"
        difference: "unverified_count > 0 blocks approve when court.efiling_required"
      - name: finalized
        when: "after explicit verify run"
        difference: "verified_count is authoritative for compliance check"

  - name: record_completeness_pct
    trigger: "any TranscriptOrder state change under the record"
    algorithm: aggregation
    formula: |
      designated = count(TranscriptOrder where record_id=this and status != CANCELLED)
      delivered  = count(TranscriptOrder where record_id=this and status IN {DELIVERED, FILED})
      completeness_pct = (designated == 0) ? 0 : floor(100 * delivered / designated)
    input_set: "TranscriptOrder children of the record, excluding CANCELLED"
    constants: {}
    precision: "integer floor division; no rounding"
    variants: []

  - name: rehearing_deadline
    trigger: "Decision row created"
    algorithm: chronological
    formula: |
      base = decision.issued_at
      window = (court.jurisdiction_type == FEDERAL) ? 14 : 30   # days
      rehearing_deadline_at = add_calendar_days(base, window)
      cert_deadline_at      = add_calendar_days(base, 90)      # SCOTUS-style 90-day window
    input_set: "single Decision row; court"
    constants:
      FEDERAL_REHEARING_WINDOW_DAYS: 14
      STATE_REHEARING_WINDOW_DAYS: 30
      CERT_WINDOW_DAYS: 90
    precision: "timestamp precision to second"
    variants:
      - name: federal
        when: "court.jurisdiction_type == FEDERAL"
        difference: "14-day rehearing window"
      - name: state
        when: "court.jurisdiction_type == STATE"
        difference: "30-day rehearing window — same issued_at yields different deadline"

  - name: oral_argument_conflict_check
    trigger: "POST /appellate/oral-arguments/{id}/schedule"
    algorithm: interval_merge
    formula: |
      new_interval = [scheduled_start, scheduled_start + duration_minutes)   # half-open
      for each existing OralArgument oa on same court with status IN {SCHEDULED, HELD}:
          existing = [oa.scheduled_start, oa.scheduled_start + oa.duration_minutes)
          if new_interval.start < existing.end and existing.start < new_interval.end:
              reject ERR_ARGUMENT_OVERLAP
      # adjacency IS allowed: back-to-back arguments (end == start) do not overlap
    input_set: "OralArgument rows on same court in non-terminal states"
    constants: {}
    precision: "half-open interval arithmetic; strictly-less comparison"
    variants: []

  - name: extension_cascade_delta
    trigger: "ExtensionMotion PENDING → GRANTED"
    algorithm: constraint_propagation
    formula: |
      delta = motion.granted_days
      if target == OPENING:
          opening_due_at += delta
          response_due_at += delta    # depth-2 cascade
          reply_due_at += delta       # depth-3 cascade
      elif target == RESPONSE:
          response_due_at += delta
          reply_due_at += delta
      elif target == REPLY:
          reply_due_at += delta
      # invariant: opening_due_at <= response_due_at <= reply_due_at must hold after shift
    input_set: "single ExtensionMotion row; BriefingSchedule row"
    constants: {}
    precision: "timestamp precision to second"
    variants: []

  - name: deadline_tolling_delta
    trigger: "AppealEvent created with event_type=POST_JUDGMENT_MOTION_DECIDED"
    algorithm: chronological
    formula: |
      motion_filed = AppealEvent(event_type=POST_JUDGMENT_MOTION_FILED, latest by occurred_at before decided event)
      decided      = AppealEvent(event_type=POST_JUDGMENT_MOTION_DECIDED)
      toll_delta   = decided.occurred_at - motion_filed.occurred_at
      for each Deadline where case_id=case and kind=NOTICE_OF_APPEAL and met=false:
          final_due_at = provisional_due_at + toll_delta
          tolled = false   # toll resolved
    input_set: "all AppealEvents for case; NOTICE_OF_APPEAL Deadline"
    constants: {}
    precision: "timestamp precision to second"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template ids exist (court, case, record, brief, motion, filing, etc.), resolved left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Body-supplied FK references exist (court_id, schedule_id, author_attorney_id, brief_id, basis_decision_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK inputs"

  - priority: 5
    category: state
    check: "Target resource in correct state for requested transition (e.g., brief DRAFT→IN_REVIEW only when status==DRAFT)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties — brief approver must differ from author; same user cannot draft and approve"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /appellate/briefs/{id}/approve, POST /appellate/briefs/{id}/return-draft"

  - priority: 7
    category: business_safety
    check: "Attorney must be admitted to the court of the case (admitted_court_ids contains case.court_id)"
    error_id: ERR_NOT_ADMITTED
    http_status: 403
    applies_to: "POST /appellate/briefs, POST /appellate/briefs/{id}/approve, POST /appellate/briefs/{id}/efile, POST /appellate/petitions"

  - priority: 8
    category: business_temporal
    check: "Action not past deadline — brief efile requires now() <= brief.due_at; petition file requires now() <= petition.due_at"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /appellate/briefs/{id}/efile, POST /appellate/petitions/{id}/file"

  - priority: 9
    category: business_constraint
    check: "Brief length within court limit (over_limit == false)"
    error_id: ERR_BRIEF_OVER_LIMIT
    http_status: 422
    applies_to: "POST /appellate/briefs/{id}/approve, POST /appellate/briefs/{id}/efile, POST /appellate/filings/{id}/accept"

  - priority: 10
    category: business_constraint
    check: "TOA verification — when court.efiling_required, unverified_count must be 0 before approve"
    error_id: ERR_TOA_UNVERIFIED
    http_status: 422
    applies_to: "POST /appellate/briefs/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "Record must be COMPLETE or FILED before brief efile; briefing_schedule must be ACTIVE"
    error_id: ERR_RECORD_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /appellate/briefs/{id}/efile"

  - priority: 12
    category: business_temporal
    check: "Oral argument interval must not overlap another non-terminal argument on same court (half-open intervals; adjacency allowed)"
    error_id: ERR_ARGUMENT_OVERLAP
    http_status: 409
    applies_to: "POST /appellate/oral-arguments/{id}/schedule"

  - priority: 13
    category: business_temporal
    check: "Oral argument requires minimum notice — scheduled_start >= now() + court.argument_notice_days"
    error_id: ERR_ARGUMENT_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /appellate/oral-arguments/{id}/schedule"

  - priority: 14
    category: business_constraint
    check: "Extension grant: 0 < granted_days <= requested_days"
    error_id: ERR_GRANT_DAYS_INVALID
    http_status: 422
    applies_to: "POST /appellate/extension-motions/{id}/grant"

  - priority: 15
    category: business_fiscal
    check: "OCC — expected_<parent>_version in request must match current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appellate/extension-motions/{id}/grant, POST /appellate/briefing-schedules/{id}/vacate"

  - priority: 16
    category: business_referential
    check: "E-filed brief must serve at least one party email; NOTICE_OF_APPEAL filing must serve all adverse parties"
    error_id: ERR_SERVICE_INCOMPLETE
    http_status: 422
    applies_to: "POST /appellate/filings, POST /appellate/briefs/{id}/efile"

  - priority: 17
    category: business_temporal
    check: "Cannot file rehearing petition before decision issued (case.posture must be DECIDED)"
    error_id: ERR_DECISION_NOT_ISSUED
    http_status: 409
    applies_to: "POST /appellate/petitions/{id}/file"

  - priority: 18
    category: business_constraint
    check: "Unique constraints — Court.code unique, Attorney.bar_number unique, Record 1:1 per case, BriefingSchedule 1:1 per case, TOA 1:1 per brief"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /appellate/courts, POST /appellate/attorneys, system auto-create of Record/BriefingSchedule/TableOfAuthorities"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Court ---
  - method: POST
    path: "/appellate/courts"
    description: "Register a court with jurisdiction rules and brief limits"
    roles: [CourtAdmin]
    code: 201
    input: [code, name, jurisdiction_type, appeal_deadline_days, reply_brief_window_days, uses_word_count, max_words_opening, max_pages_opening, max_words_reply, max_pages_reply, efiling_required, weekend_holiday_rollforward]
    output: Court
    side_effects: ["version=1"]

  - method: GET
    path: "/appellate/courts/{id}"
    description: "Fetch a court"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: []
    output: Court
    side_effects: []

  - method: GET
    path: "/appellate/courts"
    description: "List courts (paginated)"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: ["limit?", "offset?", "jurisdiction_type?"]
    output: Court[]
    side_effects: []

  # --- Attorney ---
  - method: POST
    path: "/appellate/attorneys"
    description: "Register an attorney"
    roles: [CourtAdmin]
    code: 201
    input: [bar_number, full_name, email, admitted_court_ids]
    output: Attorney
    side_effects: []

  - method: GET
    path: "/appellate/attorneys/{id}"
    description: "Fetch an attorney"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: []
    output: Attorney
    side_effects: []

  - method: GET
    path: "/appellate/attorneys"
    description: "List attorneys (paginated)"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: ["limit?", "offset?", "bar_number?"]
    output: Attorney[]
    side_effects: []

  # --- Case ---
  - method: POST
    path: "/appellate/cases"
    description: "Open a new appellate case"
    roles: [Attorney, CourtAdmin]
    code: 201
    input: [court_id, docket_number, caption, lead_attorney_id, appellant_side, judgment_entered_at]
    output: Case
    side_effects:
      - "posture=OPEN"
      - "auto-create AppealEvent(event_type=JUDGMENT_ENTERED, occurred_at=judgment_entered_at)"
      - "auto-create Deadline(kind=NOTICE_OF_APPEAL, provisional_due_at per notice_of_appeal_deadline calc)"

  - method: GET
    path: "/appellate/cases/{id}"
    description: "Fetch a case with computed posture"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/appellate/cases"
    description: "List cases (paginated, filterable)"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: ["limit?", "offset?", "court_id?", "lead_attorney_id?", "posture?"]
    output: Case[]
    side_effects: []

  # --- AppealEvent ---
  - method: POST
    path: "/appellate/cases/{id}/events"
