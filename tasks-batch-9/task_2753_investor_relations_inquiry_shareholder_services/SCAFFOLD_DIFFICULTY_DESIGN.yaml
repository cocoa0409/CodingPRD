  - rule_id: boundary_precision_check
    instances:
      - name: ownership_pct_exactly_one_percent_lands_in_tier_two
        grounds:
          - calculations.ownership_pct_and_target_tier
          - entities.Contact.fields.ownership_pct
          - endpoints[PATCH /contacts/{id}/position]
          - concurrency_rules[position-update-stale-company]
        distinguishing_aspect: |
          The TIER_2_MIN_PCT boundary is inclusive on the rounded value: 9,999 shares of 1,000,000
          gives ownership_pct 0.9999 and target_tier TIER_3, while exactly 10,000 shares gives
          1.0000 and TIER_2 — a numeric threshold metric reached through PATCH /contacts/{id}/position.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer BND with exactly 1,000,000 shares outstanding (Company.version 1)."
            - "One INSTITUTIONAL_HOLDER contact created with 5,000 shares (ownership_pct 0.5000, TIER_3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "BND", legal_name: "Boundary Numerics Inc", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
