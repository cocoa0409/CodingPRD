            - { call: "POST /charters/${c1}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1", captures: { c1_st: $.data.status } }
            - { call: "POST /charters/${c2}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
