            - call: "POST /orders/${oa_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "GET /orders/${oa_id}"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { oa_v: "$.data.version" }
            - call: "POST /adjustments"
              payload: { order_id: "${oa_id}", adjustment_type: "REFUND", amount_cents: 1000, reason_code: "MISSING_ITEM", expected_order_version: "${oa_v}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { ad1_id: "$.data.id" }
            - call: "POST /adjustments/${ad1_id}/submit"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
            - call: "GET /orders/${oa_id}"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { oa_v2: "$.data.version" }
          trigger:
            - call: "POST /adjustments"
              payload: { order_id: "${oa_id}", adjustment_type: "REFUND", amount_cents: 600, reason_code: "LATE_DELIVERY", expected_order_version: "${oa_v2}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /adjustments"
              payload: { order_id: "${oa_id}", adjustment_type: "REFUND", amount_cents: 440, reason_code: "LATE_DELIVERY", expected_order_version: "${oa_v2}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { ad2_id: "$.data.id" }
          assert:
            - "Order.${oa_id}.channel_collected_cents == 1440 and refunded_total_cents == 1000 after the first refund is auto-accepted"
            - "The 600 refund returns 422 ERR_REFUND_EXCEEDS_COLLECTED because 1000 + 600 > 1440, even though 600 alone is far below the collected total"
            - "The 440 refund is accepted at exactly the ceiling (1000 + 440 == 1440): Adjustment.${ad2_id}.state == DRAFT and no error is raised"
            - "The rejected attempt did not bump Order.${oa_id}.version, so the very same ${oa_v2} was still valid for the 440 request"

      - name: error_capacity_bucket_full_already_covered
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CAPACITY_BUCKET_FULL]
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_bucket_full_at_inclusive_threshold
          rationale: "The named §1.8 instance orders at bucket_load == capacity - 1 (accepted) and at bucket_load == capacity (ERR_CAPACITY_BUCKET_FULL), which is the only interesting way to trigger this error."

      - name: error_revision_limit_reached_already_covered
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVISION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / adjustment_revision_cycle_bounded_at_two_rounds
          rationale: "The named §1.8 instance drives the review loop to revision_round 2 and then asserts ERR_REVISION_LIMIT_REACHED on the third request-revision."

      - name: error_store_closed_already_covered
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STORE_CLOSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_menu_not_published_outranks_store_closed
          rationale: "The named §1.8 instance exposes ERR_STORE_CLOSED once the higher-priority ERR_STORE_MENU_NOT_PUBLISHED is satisfied, covering the closed-hours trigger."

      - name: error_no_eligible_courier_occupancy_variant_already_covered
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_COURIER_NETWORK]
          - calculations.courier_network_selection
        excluded_because:
          difficulty_instance: resource_temporal_overlap / courier_network_closed_occupancy_interval_with_buffer
          rationale: "The named §1.8 instance covers the occupancy-driven exhaustion of the candidate set at the closed interval boundary; the instance above covers the structural (network_type) exhaustion instead."

  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_channel_partner_cannot_publish_or_inject
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles[StoreOperator].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The store-side lifecycle is closed to the channel even though the channel owns the order: publish-menu and inject both reject ChannelPartner with 403 before any business rule runs, and the identical calls succeed for StoreOperator."
        test_recipe:
          setup:
            - "BASE: MARKETMAX, a finalized BURGER menu version, Store S24 with a Monday window, menu not yet published"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store Twentyfour", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-3001", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/inject"
              payload: { pos_result_code: "OK" }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
            - call: "POST /orders/${ord_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
          assert:
            - "The ChannelPartner publish attempt returns 403 with data.error_id == ERR_UNAUTHORIZED and Store.${store_id}.active_menu_version_id stays null"
            - "The StoreOperator publish with the same body and the same ${store_v} succeeds, proving only the role differed"
            - "The ChannelPartner inject attempt returns 403 ERR_UNAUTHORIZED and Order.${ord_id}.injection_status stays PENDING with injection_attempt_count 0"
            - "The StoreOperator inject then returns 200 with injection_status ACCEPTED"

      - name: rbac_store_operator_cannot_run_money_operations
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles[SettlementAnalyst].exclusive_operations
          - roles[ChannelPartner].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Peer-role isolation in the money lane: the store can neither propose an adjustment nor open a statement nor place an order, and each rejection precedes the OCC check so the stale version in the payload is never even evaluated."
        test_recipe:
          setup:
            - "BASE with PICKUP order OM injected ACCEPTED on MARKETMAX"
