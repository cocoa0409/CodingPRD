    path: "/treatment-plans/{id}/propose"
    description: "DRAFT -> PROPOSED"
    roles: [Orthodontist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/treatment-plans/{id}/revise"
    description: "PROPOSED -> DRAFT (revision loop)"
    roles: [Orthodontist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/treatment-plans/{id}/activate"
    description: "PROPOSED -> ACTIVE; pins all computed fees and the family discount"
    roles: [Guardian]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "Pin gross_fee_cents, discount_pct_applied, net_fee_cents, estimated_insurance_benefit_cents, estimated_patient_responsibility_cents"
      - "Recompute FamilyAccount.active_plan_count and discount_tier_pct"
      - "increments TreatmentPlan.version by 1"
  - method: POST
    path: "/treatment-plans/{id}/debond"
    description: "ACTIVE -> RETENTION; issues a Retainer"
    roles: [Orthodontist]
    code: 200
    input: ["retainer_type?"]
    output: TreatmentPlan
    side_effects: ["Create Retainer (ISSUED)", "Recompute family discount", "increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/treatment-plans/{id}/complete"
    description: "RETENTION -> COMPLETED; closes owning Contract"
    roles: [Orthodontist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["Owning Contract lifecycle_status -> CLOSED", "Recompute family discount", "increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/treatment-plans/{id}/cancel"
    description: "DRAFT/PROPOSED -> CANCELLED"
    roles: [Orthodontist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["increments TreatmentPlan.version by 1"]

  # ---- TreatmentPhase ----
  - method: POST
    path: "/treatment-phases"
    description: "Add a phase to a DRAFT plan"
    roles: [Orthodontist, ClinicAdmin]
    code: 201
    input: [plan_id, sequence_no, label, phase_fee_cents]
    output: TreatmentPhase
    side_effects: []
  - method: GET
    path: "/treatment-phases/{id}"
    description: "Get a treatment phase"
    roles: [Orthodontist, ClinicAdmin, BillingSpecialist]
    code: 200
    input: []
    output: TreatmentPhase
    side_effects: []
  - method: GET
    path: "/treatment-phases"
    description: "List phases, filterable by plan"
    roles: [Orthodontist, ClinicAdmin, BillingSpecialist]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: TreatmentPhase[]
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/contracts"
    description: "Create a monthly auto-pay contract for a plan; builds the installment schedule. OCC-guarded on the plan version."
    roles: [BillingSpecialist, Guardian]
    code: 201
    input: [plan_id, expected_plan_version, down_payment_cents, term_months, "autopay_enabled?"]
    output: Contract
    side_effects:
      - "Build Installment schedule (calc installment_schedule)"
      - "Set financed_amount_cents, balance_remaining_cents; billing_status=CURRENT, lifecycle_status=ACTIVE"
      - "increments TreatmentPlan.version by 1"
  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts, filterable by plan"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  # ---- Installment ----
  - method: GET
    path: "/installments/{id}"
    description: "Get an installment"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: []
    output: Installment
    side_effects: []
  - method: GET
    path: "/installments"
    description: "List installments, filterable by contract"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: POST
    path: "/installments/{id}/charge"
    description: "Attempt the autopay charge for an installment; outcome SUCCEEDED posts a payment, FAILED (only when due) sets MISSED"
    roles: [BillingSpecialist]
    code: 200
    input: [outcome]
    output: Installment
    side_effects:
      - "SUCCEEDED: create a POSTED Payment of amount_cents, installment -> PAID, balance decreases"
      - "FAILED & due: installment -> MISSED, owning Contract -> DELINQUENT, plan ACTIVE -> SUSPENDED, future SCHEDULED appts -> CANCELLED"

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Record a payment against a contract/installment"
    roles: [BillingSpecialist, Guardian]
    code: 201
    input: [contract_id, "installment_id?", amount_cents, method]
    output: Payment
    side_effects:
      - "status=POSTED, balance_remaining_cents decreases"
      - "If installment covered: installment -> PAID; if it was the last MISSED installment, Contract -> CURRENT and plan SUSPENDED -> ACTIVE"
      - "If balance_remaining_cents reaches 0: Contract lifecycle_status -> CLOSED"
  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments, filterable by contract or installment"
    roles: [BillingSpecialist, ClinicAdmin, Guardian]
    code: 200
    input: ["contract_id?", "installment_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/reverse"
    description: "POSTED -> REVERSED; restores balance and may re-trigger delinquency"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "balance_remaining_cents increases by amount_cents"
      - "If covered Installment was PAID and now past due: installment -> MISSED, cascade may re-fire"

  # ---- InsuranceClaim ----
  - method: POST
    path: "/insurance-claims"
    description: "Submit a claim against a policy for a plan's treatment"
    roles: [BillingSpecialist]
    code: 201
    input: [policy_id, plan_id, billed_amount_cents]
    output: InsuranceClaim
    side_effects: ["status=SUBMITTED, benefit_cents=0"]
  - method: GET
    path: "/insurance-claims/{id}"
    description: "Get a claim"
    roles: [BillingSpecialist, ClinicAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: GET
    path: "/insurance-claims"
    description: "List claims, filterable by policy or plan"
    roles: [BillingSpecialist, ClinicAdmin]
    code: 200
    input: ["policy_id?", "plan_id?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []
  - method: POST
    path: "/insurance-claims/{id}/approve"
    description: "SUBMITTED -> APPROVED; awards benefit and draws down lifetime-max"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["Compute benefit_cents (calc actual_benefit_drawdown)", "policy.remaining_max_cents decreases by benefit_cents"]
  - method: POST
    path: "/insurance-claims/{id}/deny"
    description: "SUBMITTED -> DENIED"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: POST
    path: "/insurance-claims/{id}/mark-paid"
    description: "APPROVED -> PAID"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: POST
    path: "/insurance-claims/{id}/void"
    description: "APPROVED -> VOID; compensating reversal restores remaining_max"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["policy.remaining_max_cents increases by benefit_cents", "benefit_cents reset to 0"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Schedule an appointment occupying a provider + chair time interval"
    roles: [FrontDesk, ClinicAdmin]
    code: 201
    input: [patient_id, provider_id, chair_id, "plan_id?", visit_type, starts_at, ends_at]
    output: Appointment
    side_effects: ["status=SCHEDULED after chair + provider overlap and cross-entity plan-state checks pass"]
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [FrontDesk, ClinicAdmin, Orthodontist, Guardian]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments, filterable by patient, provider, chair, or plan"
    roles: [FrontDesk, ClinicAdmin, Orthodontist, Guardian]
    code: 200
    input: ["patient_id?", "provider_id?", "chair_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/check-in"
    description: "SCHEDULED -> CHECKED_IN"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/complete"
    description: "CHECKED_IN -> COMPLETED"
    roles: [Orthodontist]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "SCHEDULED/CHECKED_IN -> NO_SHOW"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  # ---- Retainer ----
  - method: GET
    path: "/retainers/{id}"
    description: "Get a retainer"
    roles: [Orthodontist, ClinicAdmin, Guardian]
    code: 200
    input: []
    output: Retainer
    side_effects: []
  - method: GET
    path: "/retainers"
    description: "List retainers, filterable by plan"
    roles: [Orthodontist, ClinicAdmin, Guardian]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: Retainer[]
    side_effects: []
  - method: POST
    path: "/retainers/{id}/replace"
    description: "ISSUED -> REPLACED; issues a fresh Retainer for the same plan"
    roles: [Orthodontist]
    code: 200
    input: ["retainer_type?"]
    output: Retainer
    side_effects: ["Old retainer -> REPLACED", "New Retainer (ISSUED) created"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed role does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, ends_at<=starts_at, term_months<1, negative amount" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "Contract create — expected_plan_version does not match current TreatmentPlan.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_CROSS_ENTITY_STATE, http: 409, condition: "A referenced entity is not in the state this operation requires (plan not ACTIVE for adjustment appt; policy not ACTIVE for claim approval)" }
  - { id: ERR_NO_PHASES, http: 409, condition: "Plan cannot be PROPOSED without at least one TreatmentPhase" }
  - { id: ERR_RECORDS_INCOMPLETE, http: 409, condition: "Plan cannot activate before patient has FINALIZED PANO + CEPH growth records" }
  - { id: ERR_NO_ORTHO_RIDER, http: 409, condition: "Claim approval rejected: policy carries no ortho rider" }
  - { id: ERR_POLICY_TERMINATED, http: 409, condition: "Claim approval rejected: policy is TERMINATED" }
  - { id: ERR_POLICY_HAS_OPEN_CLAIMS, http: 409, condition: "Policy cannot terminate while a claim is APPROVED (unpaid in-flight benefit)" }
  - { id: ERR_CHAIR_CONFLICT, http: 409, condition: "Appointment chair interval (with turnover buffer) overlaps another appointment in the same chair" }
  - { id: ERR_PROVIDER_CONFLICT, http: 409, condition: "Appointment provider interval (half-open) overlaps another appointment for the same provider" }
  - { id: ERR_NOT_YET_DUE, http: 409, condition: "Installment charge-FAILED cannot set MISSED before clock-now >= due_at" }
  - { id: ERR_TOO_EARLY_CHECKIN, http: 409, condition: "Check-in attempted more than 60 minutes before starts_at" }
  - { id: ERR_TOO_EARLY_NOSHOW, http: 409, condition: "No-show marked before starts_at" }
  - { id: ERR_DOWN_PAYMENT_EXCEEDS, http: 409, condition: "Contract down_payment_cents exceeds plan estimated_patient_responsibility_cents (financed would be negative)" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment amount exceeds contract balance_remaining_cents" }
  - { id: ERR_CONTRACT_CLOSED, http: 409, condition: "Mutation rejected because the contract lifecycle_status is CLOSED" }
  - { id: ERR_VALIDATION, http: 422, condition: "Semantically invalid value that passes shape checks (e.g. ortho_coverage_pct outside [0,1])" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FrontDesk
    description: "Front-desk staff: family accounts, patients, and appointment scheduling/check-in/cancel/no-show."
    identity: opaque
    exclusive_operations:
      - "POST /family-accounts"
      - "POST /patients"
      - "POST /appointments"
      - "POST /appointments/{id}/check-in"
      - "POST /appointments/{id}/cancel"
      - "POST /appointments/{id}/no-show"
    shared_operations:
      - "GET /family-accounts/{id}, /patients, /patients/{id}, /providers/{id}, /chairs/{id}"
      - "GET /growth-records, /growth-records/{id}, /appointments, /appointments/{id}"

  - name: Orthodontist
    description: "Clinician: growth records, treatment plans (propose/revise/debond/complete/cancel), phases, appointment completion, retainers."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /growth-records, POST /growth-records/{id}/finalize"
      - "POST /treatment-plans, POST /treatment-phases"
      - "POST /treatment-plans/{id}/propose, /revise, /debond, /complete, /cancel"
      - "POST /appointments/{id}/complete"
      - "POST /retainers/{id}/replace"
    shared_operations:
      - "GET /treatment-plans, /treatment-plans/{id}, /treatment-phases, /treatment-phases/{id}"
      - "GET /appointments, /retainers, /patients/{id}, /providers/{id}, /chairs/{id}"

  - name: BillingSpecialist
    description: "Billing: insurance policies & claims, contracts, installments charge, payments & reversals."
    identity: opaque
    exclusive_operations:
      - "POST /insurance-policies, /insurance-policies/{id}/terminate"
      - "POST /insurance-claims and all claim transitions (approve/deny/mark-paid/void)"
      - "POST /installments/{id}/charge"
      - "POST /payments/{id}/reverse"
    shared_operations:
      - "POST /contracts, POST /payments (shared with Guardian)"
      - "GET /insurance-policies, /insurance-claims, /contracts, /installments, /payments and their /{id} reads"

  - name: Guardian
    description: "Parent/guardian who owns a FamilyAccount: approves (activates) plans, signs contracts, makes payments, reads own records."
    identity: "entity_backed:FamilyAccount"
    exclusive_operations:
      - "POST /treatment-plans/{id}/activate"
    shared_operations:
      - "POST /contracts, POST /payments (shared with BillingSpecialist)"
      - "GET /family-accounts/{id}, /patients, /treatment-plans, /contracts, /installments, /payments, /appointments, /retainers (scoped to own family)"

  - name: ClinicAdmin
    description: "Operational admin: providers, chairs, logical clock, and broad create/read access; superset operational role."
    identity: opaque
    exclusive_operations:
      - "POST /providers, POST /chairs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /family-accounts, /patients, /growth-records, /treatment-plans, /treatment-phases, /insurance-policies, /appointments"
      - "GET on all collections and resources"
