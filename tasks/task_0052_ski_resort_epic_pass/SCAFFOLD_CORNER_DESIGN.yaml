            - "total_count == 2"
            - "has_more == true"
            - "length(data) == 1"

      - name: list_passes_filter_by_pass_product_id
        claim_type: filtered_list
        grounds:
          - endpoints.GET_/passes
          - entities.Pass.fields.pass_product_id
        distinguishing_aspect: "GET /passes?pass_product_id=X returns only passes issued under product X."
