              captures: { offer1_status: $.data.status }
            - call: "GET /networks/${net_id}/stations/${st_id}/agreements/${ag_id}"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { new_reverse: $.data.reverse_comp_pct, new_status: $.data.status }
          assert:
            - "offer2_status == ACCEPTED"
            - "offer1_status == SUPERSEDED  # divergent branch: prior PROPOSED offer flipped on acceptance of successor"
            - "new_reverse == 0.35  # agreement adopted the STATION_GROUP_OWNER offer's rate"
            - "new_status == ACTIVE  # agreement exits RENEWAL_NEGOTIATION on acceptance"

  # ==========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: outage_confirm_to_network_posture_chain
        grounds:
          - state_machines.OutageEvent.REPORTED_to_CONFIRMED
          - state_machines.Station.CLEARANCE_OK_to_DARK
          - calculations.station_posture_derivation
          - state_machines.AffiliationAgreement.DRAFT_to_PENDING_ACTIVATION
        distinguishing_aspect: |
          Depth-3 cascade: OutageEvent.confirm -> Station.monthly_outage_minutes_current_period
          increases (link 1) -> Station.posture flips to DARK (link 2, caused by link 1
          crossing threshold) -> AffiliationAgreement submission on that station is
          now blocked by posture precondition (link 3, observed as ERR_INVALID_STATE).
          Trigger: outage-event confirm.
        test_recipe:
          setup:
            - "Network, StationGroup, Station S1 with agreement A1 ACTIVE (for clearance)"
            - "Second station S2 with no agreement yet (so DRAFT agreement can be created)"
            - "Two OutageEvents on S1: 130 min each, both REPORTED (total 260 min > 240 threshold after both confirmed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
