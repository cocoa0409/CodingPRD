      - name: get_syndication_job_with_unknown_id_returns_job_not_found
        claim_type: not_found
        grounds:
          - validations[priority=16]
          - errors[ERR_SYNDICATION_JOB_NOT_FOUND]
          - endpoints["GET /digital-shelf/syndication-jobs/{id}"]
        distinguishing_aspect: "Each entity family has its own 404 code, so an unknown job id returns ERR_SYNDICATION_JOB_NOT_FOUND rather than the generic listing or product code."
        test_recipe:
          setup:
            - "no SyndicationJob exists"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "GET /digital-shelf/syndication-jobs/00000000-0000-4000-8000-0000000000bb"
              payload: {}
              as: SyndicationOperator
              captures: { e_jnf: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${e_jnf} == \"ERR_SYNDICATION_JOB_NOT_FOUND\""

      - name: attribute_definition_create_then_list_filtered_by_taxonomy_group
        claim_type: creation
        grounds:
          - entities.AttributeDefinition.fields.taxonomy_group
          - entities.AttributeDefinition.fields.base_weight
          - endpoints["POST /digital-shelf/attribute-definitions"]
          - endpoints["GET /digital-shelf/attribute-definitions"]
        distinguishing_aspect: "The taxonomy is a flat keyed registry: two definitions in different taxonomy_groups are both stored with their exact base_weight and separated by the taxonomy_group filter."
        test_recipe:
          setup:
            - "empty taxonomy"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
              captures: { ad1_id: $.data.id }
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00 }
              as: ShelfAdmin
              captures: { ad2_id: $.data.id }
            - call: "GET /digital-shelf/attribute-definitions?taxonomy_group=CORE"
              payload: { taxonomy_group: "CORE" }
              as: ContentAuthor
              captures: { core_key: "$.data[0].attribute_key" }
          assert:
            - "AttributeDefinition.${ad1_id}.base_weight == 40.00"
            - "AttributeDefinition.${ad1_id}.is_global_required == true"
            - "AttributeDefinition.${ad2_id}.max_chars == 500"
            - "AttributeDefinition.${ad2_id}.is_global_required == false   # declared default"
            - "third response: meta.total_count == 1 and ${core_key} == \"title\""

      - name: change_requests_list_filters_by_target_content_version_id
        claim_type: retrieval
        grounds:
          - entities.ChangeRequest.fields.target_content_version_id
          - entities.ChangeRequest.fields.state
          - endpoints["GET /digital-shelf/change-requests"]
        distinguishing_aspect: "Two DRAFT change requests on the same product but different target revisions are separated by the target_content_version_id filter, and each carries state DRAFT with both tracks PENDING."
        test_recipe:
          setup:
            - "Retailer RETS, product SKU-G-4 with revisions 1 and 2, one listing, and one DRAFT ChangeRequest per revision authored by author_1"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS" }
              as: ShelfAdmin
              captures: { rcr_id: $.data.id }
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-G-4", gtin: "00012345678998", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pcr_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pcr_id}", retailer_id: "${rcr_id}" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pcr_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vc1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pcr_id}", supersedes_content_version_id: "${vc1_id}", image_count: 2 }
              as: ContentAuthor
              captures: { vc2_id: $.data.id }
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pcr_id}", retailer_id: "${rcr_id}", target_content_version_id: "${vc1_id}", rationale: "pin revision 1" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { cr1_id: $.data.id }
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pcr_id}", retailer_id: "${rcr_id}", target_content_version_id: "${vc2_id}", rationale: "pin revision 2" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { cr2_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/change-requests?target_content_version_id=${vc2_id}"
              payload: { target_content_version_id: "${vc2_id}" }
              as: ContentAuthor
              captures: { hit_id: "$.data[0].id", hit_state: "$.data[0].state" }
            - call: "GET /digital-shelf/change-requests?product_id=${pcr_id}&state=DRAFT"
              payload: { product_id: "${pcr_id}", state: "DRAFT" }
