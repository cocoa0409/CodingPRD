  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: ov_plan_overlap_strict
        grounds:
          - validations[priority=11]
          - entities.PaymentPlan.fields.final_due_date
          - errors[ERR_PLAN_OVERLAP]
          - concurrency_rules[plan-create-stale-account]
        distinguishing_aspect: "Two-sided strict interval overlap on the Account's plan timeline: plan1 [2026-06-01, 2026-07-31] vs plan2 first_due 2026-07-01 (final 2026-07-01); 07-01 < 07-31 and 06-01 < 07-01 -> ERR_PLAN_OVERLAP (adjacency at a shared endpoint would be allowed)."
        test_recipe:
          setup:
            - "Account DELINQUENT (REGULAR 90000 due 2026-01-01). Plan1 first_due 2026-06-01 num 3 (final 2026-07-31) created DRAFT. Second plan first_due 2026-07-01 num 1."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Cove HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "30", owner_name: "Bea Todd" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 90000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v1: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v1}" }
              as: CollectionsAgent
              captures: { plan1_id: $.data.id, plan1_final: $.data.final_due_date }
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 30000, installment_cents: 30000, num_installments: 1, first_due_date: "2026-07-01T00:00:00Z", expected_account_version: "${acct_v2}" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "plan1 data.final_due_date == 2026-07-31T00:00:00Z"
            - "trigger response data.error_id == ERR_PLAN_OVERLAP"
            - "trigger response HTTP status == 409"

      - name: ov_notice_cooldown_halfopen
        grounds:
          - validations[priority=11]
          - state_machines.Notice.DRAFT_to_SENT
          - errors[ERR_NOTICE_COOLDOWN]
        distinguishing_aspect: "A different interval semantics and resource: a Notice cooldown is a half-open point-in-window test [sent_date, sent_date+30). A first DEMAND sent 2026-05-01 makes the window [2026-05-01, 2026-05-31); sending a second DEMAND at 2026-05-20 falls inside -> ERR_NOTICE_COOLDOWN."
        test_recipe:
          setup:
            - "Account with DEMAND notice1 SENT 2026-05-01 (window [05-01,05-31)). Second DEMAND notice2 created DRAFT; attempt SEND at 2026-05-20."
          setup_api_calls:
