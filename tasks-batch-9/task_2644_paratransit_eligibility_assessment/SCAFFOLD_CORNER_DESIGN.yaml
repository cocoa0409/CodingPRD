            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /suspension-proceedings/${proc_id}/send-notice"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { notice_status: $.data.status, deadline: $.data.response_deadline_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T23:59:59Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { lapsed_on_deadline: $.data.proceedings_advanced_count }
            - call: "GET /suspension-proceedings/${proc_id}"
              payload: {}
              as: ConductOfficer
              captures: { status_on_deadline: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { lapsed_after: $.data.proceedings_advanced_count }
            - call: "GET /suspension-proceedings/${proc_id}"
              payload: {}
              as: ConductOfficer
              captures: { status_after: $.data.status, resp_at_after: $.data.rider_response_at }
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { lapsed_repeat: $.data.proceedings_advanced_count }
            - call: "POST /suspension-proceedings/${proc_id}/respond"
              payload: { rider_response_note: "after the lapse" }
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { late_respond_err: $.data.error_id }
          assert:
            - "${notice_status} == \"NOTICE_SENT\" and ${deadline} == \"2026-08-19\""
            - "${lapsed_on_deadline} == 0 and ${status_on_deadline} == \"NOTICE_SENT\" — the deadline day is still inside the window even at 23:59:59"
            - "${lapsed_after} == 1, ${status_after} == \"RESPONSE_LAPSED\" and ${resp_at_after} == null (the rider never responded)"
            - "${lapsed_repeat} == 0 with the status unchanged — the sweep is idempotent at a fixed clock"
            - "the post-lapse response returns HTTP 409 with data.error_id == \"ERR_PROCEEDING_STATE_INVALID\" (state, not window: RESPONSE_LAPSED is not a state respond is declared from)"
            - "Applicant.${rider_id}.service_status is still \"ACTIVE\" — a lapse alone never suspends service"

      - name: the_auto_proposal_needs_all_three_conditions_and_fires_exactly_at_six_points
        claim_type: rate_threshold_triggers
        grounds:
          - endpoints.POST_/trip-events
          - calculations.no_show_points_balance
          - calculations.no_show_ratio_pct
        distinguishing_aspect: "The auto-proposal is a conjunction of three thresholds evaluated after every conduct write: at 5 points / 3 misses / 100.0 percent nothing is proposed even though two of the three conditions are met, the very next LATE_CANCEL reaches exactly 6 points and fires one AUTO_THRESHOLD proposal with proposed_by_user_id null, and a fifth event while that proposal is open does NOT create a second one."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; a fresh applicant with no conduct history"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Halima Yusuf", date_of_birth: "1992-12-12", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-06", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-13", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-20", event_type: "LATE_CANCEL" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { pts_5: $.data.no_show_points_event_basis, misses_3: $.data.chargeable_miss_count_90d, ratio_100: $.data.no_show_ratio_pct }
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: {}
              as: ConductOfficer
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-27", event_type: "LATE_CANCEL" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { fourth_points: $.data.points_assessed }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { pts_6: $.data.no_show_points_event_basis, misses_4: $.data.chargeable_miss_count_90d, ratio_after: $.data.no_show_ratio_pct }
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: { status: "PROPOSED" }
              as: ConductOfficer
              captures: { auto_id: "$.data[0].id", auto_origin: "$.data[0].origin", auto_proposer: "$.data[0].proposed_by_user_id", auto_points: "$.data[0].points_at_proposal" }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-28", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: {}
              as: ConductOfficer
          assert:
            - "after three events ${pts_5} == 5, ${misses_3} == 3 and ${ratio_100} == 100.0, yet GET /applicants/${rider_id}/suspension-proceedings returns total_count == 0 — the points clause alone blocks the trigger"
            - "${fourth_points} == 1 and ${pts_6} == 6, ${misses_4} == 4, ${ratio_after} == 100.0"
            - "the PROPOSED filter returns total_count == 1 with ${auto_origin} == \"AUTO_THRESHOLD\", ${auto_proposer} == null and ${auto_points} == 6"
            - "the fifth event raises the points to 8 but the proceedings list still returns total_count == 1 — no second proposal while ${auto_id} is open"

      - name: the_slot_booked_count_mirror_reconciles_after_create_and_after_release
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AssessmentSlot.fields.booked_count
          - entities.AssessmentSlot.fields.status
          - state_machines.Application.ASSESSMENT_REQUIRED_to_ASSESSMENT_SCHEDULED
        distinguishing_aspect: "booked_count is a derived counter on a capacity-2 slot shared by two applicants: it is 1 with status OPEN after the first booking, 2 with status FULL after the second (which is also what makes a third booking ERR_SLOT_FULL), and back to 1 with status OPEN after one assessment is marked NO_SHOW — the release path re-derives both fields together rather than leaving FULL behind."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one capacity-2 slot at 2026-08-05T09:00:00Z and three applications in ASSESSMENT_REQUIRED"
