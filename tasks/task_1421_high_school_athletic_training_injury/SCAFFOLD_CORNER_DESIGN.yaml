          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (requester cannot approve)"
            - "ord_s == APPROVED and ord_appr == ${ad2}"
            - "committed == 2000 (side effect of the successful approval only)"

      - name: physician_complete_ownership_rejected
