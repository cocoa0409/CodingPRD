      - name: revise_cycles_proposed_back_to_draft_and_reproposes_a_different_spread
        claim_type: cyclic
        grounds:
          - state_machines[AllocationRun].transitions[PROPOSED->DRAFT]
          - state_machines[AllocationRun].transitions[DRAFT->PROPOSED]
          - calculations.receipt_proration
          - calculations.store_need_units
          - endpoints.POST /allocation/allocation-runs/{runId}/revise
        distinguishing_aspect: |
          The declared shape is cyclic and AllocationRun is where the loop lives: PROPOSED -> DRAFT ->
          PROPOSED can be traversed any number of times, and each traversal must fully DEMOLISH the previous
          proposal rather than patch it. revise must delete every line and reset units_proposed,
          unallocated_remainder_units and eligible_store_count to 0 while leaving the receipt ledger alone;
          the re-propose must then recompute needs from current data. A PATCH between the two passes raises
          0101's weekly forecast from 9 to 12, so need goes 26 -> 38 and total need 44 -> 56 exceeds the
          44-unit pool - the second spread is prorated where the first was exact.
