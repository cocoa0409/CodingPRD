              payload: { room: "MAIN_SHOWROOM", title: "Recital B", start_at: "2026-06-05T20:00:00Z", end_at: "2026-06-05T22:00:00Z", capacity: 40, artist_guarantee_cents: 100000, split_pct: 0.60 }
