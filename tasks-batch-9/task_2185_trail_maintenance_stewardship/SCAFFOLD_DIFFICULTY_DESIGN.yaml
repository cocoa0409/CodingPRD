  - rule_id: transitive_cascade
    instances:
      - name: severe_incident_cascades_segment_then_agreement_then_party_then_shift
        grounds:
          - state_machines.IncidentReport.OPEN_to_UNDER_REVIEW
          - state_machines.TrailSegment.ANY_to_INCIDENT_CLOSED
          - state_machines.AdoptionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.WorkParty.CONFIRMED_to_SUSPENDED
          - state_machines.VolunteerShift.REGISTERED_to_WITHDRAWN
          - entities.TrailSegment.fields.open_severe_incident_count
          - entities.AdoptionAgreement.fields.suspension_reason
        distinguishing_aspect: |
          Trigger is POST /stewardship/incidents. Depth 4, each link caused by the previous one:
          the incident raises TrailSegment.open_severe_incident_count (link 1), that count forces
          posture INCIDENT_CLOSED which suspends the AdoptionAgreement (link 2), that suspension
          moves the CONFIRMED work party P2 to SUSPENDED/BLOCKED (link 3), and that suspension
          withdraws P2's REGISTERED shift (link 4). No link is a direct effect of the incident.
        test_recipe:
