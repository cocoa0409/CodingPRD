          assert:
            - "StewardshipAgreement.${agr_id}.approved_by_user_id == ro-2 and submitted_by_user_id == ro-1"
            - "the suspend by ro-2 -> 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES and the agreement stays APPROVED"
            - "the suspend by ro-1 -> 200 with status == SUSPENDED, suspension_reason stored, and BreedingLine.${line_id}.stewardship_status == SUSPENDED"
            - "the third suspend, from a different role entirely -> 409 with data.error_id == ERR_AGREEMENT_INVALID_STATE: SUSPENDED is terminal, so the state rung now outranks the duties rung"
            - "BreedingProgram.${prog_id}.pre_commercial_units_bags == 0 - the suspend cascade found no lots to hold"

