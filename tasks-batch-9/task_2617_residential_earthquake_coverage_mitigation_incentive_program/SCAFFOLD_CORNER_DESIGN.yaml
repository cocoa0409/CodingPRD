      - name: fourth_return_for_information_is_rejected_when_review_rounds_are_exhausted
        claim_type: violation_to_error
        grounds:
          - validations.ERR_GRANT_REVIEW_ROUNDS_EXHAUSTED
          - state_machines.RetrofitGrant.transitions.begin_review
          - state_machines.RetrofitGrant.transitions.review
        distinguishing_aspect: "review_round is incremented by begin-review, not by the decision, so after three begin-review / RETURN cycles the counter reads 3 and only the RETURN decision is refused - APPROVE on the very same UNDER_REVIEW grant still succeeds."
        test_recipe:
          setup:
            - "One policyholder, one CRIPPLE_WALL dwelling, one OPEN cycle, one SUBMITTED grant with a 200,000-cent estimate at TIER_LOW"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Yosef Almeida", email: "yosef@example.com", county_code: "06085" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "100 Round Road", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1962, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "2026 Rounds", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 1000000 }
              as: ProgramAdmin
              captures: { gc_id: $.data.id }
            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_LOW", project_cost_estimate_cents: 200000, requested_scope: "CRIPPLE_WALL_BRACING" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_id: $.data.id, r0: $.data.review_round }
          trigger:
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { r1: $.data.review_round }
            - call: "POST /eqp/retrofit-grants/${gr_id}/review"
              payload: { decision: "RETURN", info_request: "Send the engineer's plan set." }
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { s1: $.data.status }
            - call: "POST /eqp/retrofit-grants/${gr_id}/resubmit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { r2: $.data.review_round }
            - call: "POST /eqp/retrofit-grants/${gr_id}/review"
              payload: { decision: "RETURN", info_request: "The plan set is unsigned." }
              as: GrantReviewer
              as_user_id: "rev-1"
            - call: "POST /eqp/retrofit-grants/${gr_id}/resubmit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { r3: $.data.review_round }
            - call: "POST /eqp/retrofit-grants/${gr_id}/review"
              payload: { decision: "RETURN", info_request: "Third time unlucky." }
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { round_err: $.data.error_id }
            - call: "POST /eqp/retrofit-grants/${gr_id}/review"
              payload: { decision: "APPROVE" }
              as: GrantReviewer
              as_user_id: "rev-1"
              captures: { s_final: $.data.status, a_final: $.data.approved_amount_cents, rr: $.data.review_round }
          assert:
            - "${r0} == 0, ${r1} == 1, ${r2} == 2, ${r3} == 3 - each begin-review consumes one round"
            - "${s1} == \"RETURNED_FOR_INFO\" after the first RETURN"
            - "${round_err} == \"ERR_GRANT_REVIEW_ROUNDS_EXHAUSTED\" with HTTP 409 - review_round 3 is not < MAX_REVIEW_ROUNDS 3"
            - "${s_final} == \"APPROVED\" with ${a_final} == 200000 and ${rr} == 3 - the rule gates only the RETURN decision, and the refused RETURN consumed nothing"

