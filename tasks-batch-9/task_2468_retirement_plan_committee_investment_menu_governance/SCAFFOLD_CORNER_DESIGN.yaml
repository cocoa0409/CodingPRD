      - name: an_abstention_dilutes_the_votes_cast_denominator_while_a_recusal_shrinks_the_body
        claim_type: Variant Divergence
        grounds:
          - calculations.motion_tally
          - state_machines.Motion.OPEN_to_CARRIED
          - endpoints.POST_/governance/motions/{motionId}/votes
        distinguishing_aspect: "Two motions on one meeting with the identical FOR pair and one differing third vote: ABSTAIN lands in the VOTES_CAST denominator (2/3 = 66.6667) while RECUSE is struck from it entirely (2/2 = 100.0000). The third vote is first cast as AGAINST and then re-cast as RECUSE by the same member, so the replace-not-append rule and the counter recomputation are exercised on the way to the divergence."
        test_recipe:
          setup:
