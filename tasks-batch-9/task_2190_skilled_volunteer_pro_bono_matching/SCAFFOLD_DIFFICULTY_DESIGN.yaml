  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_execution_gates_engagement_start
        grounds:
          - state_machines.EngagementAgreement
          - state_machines.Engagement.work_status.NOT_STARTED_to_IN_PROGRESS
          - validations.priority_36.ERR_AGREEMENT_NOT_EXECUTED
        distinguishing_aspect: |
          The baseline of the rule: the write target is the Engagement row itself
          (work_status NOT_STARTED -> IN_PROGRESS) but the gate lives entirely on the
          child EngagementAgreement. Engagement.work_status is NOT_STARTED, which is
          exactly the from-state that POST /engagements/{id}/start requires, so the
          priority 23 work-state check PASSES; the volunteer is ACTIVE so priority 33
          passes; the caller is the engagement's own volunteer so priority 15 passes.
          The only failing predicate is EngagementAgreement.status == SENT instead of
          EXECUTED, which is priority 36. This instance is the only one that shows the
          gate opening: the same trigger call is replayed after both counterparties
          execute the agreement and then succeeds with an unchanged Engagement row,
          proving the rejection was never about the target entity's own state.
