      - name: pay_from_under_review_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.InvoiceSubmission.APPROVED_to_PAID", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "pay requires APPROVED; calling it on an UNDER_REVIEW invoice fails ERR_INVALID_STATE_TRANSITION and moves no money."
        test_recipe:
          setup: ["FY2027; committed C1 line (share 25000); started request; BEAR invoice 10000/10000 UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
