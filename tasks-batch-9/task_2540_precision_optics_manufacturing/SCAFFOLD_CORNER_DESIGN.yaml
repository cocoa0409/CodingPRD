              payload: { work_order_id: "${w1}", coating_chamber_id: "${ch1}", coating_recipe_code: "AR-VIS-01", window_start_utc: "2026-08-02T08:00:00Z", window_end_utc: "2026-08-02T12:00:00Z" }
              as: ProcessTechnician
