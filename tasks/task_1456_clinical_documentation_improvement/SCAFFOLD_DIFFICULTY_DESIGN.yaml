- rule_id: resource_temporal_overlap
  instances:
  - name: single_active_review_per_case_overlap
    grounds:
    - validations[priority=8]
    - state_machines.CDIReview.DRAFT_to_ACTIVE
    distinguishing_aspect: 'Resource: PatientCase (one "active review slot"). Interval semantics:

      half-open [activate, close) — a second review may be created in DRAFT

      at any time but cannot transition to ACTIVE while another is ACTIVE.

      The exclusion is on state, not on explicit time range.

      '
    test_recipe:
      setup:
      - Two DRAFT reviews R1 and R2 on the same case; R1 activates OK; R2 activate must fail
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          r1: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          r2: $.data.id
      - call: POST /api/cdi-reviews/${r1}/activate
        payload: {}
        as: CDISpecialist
      trigger:
      - call: POST /api/cdi-reviews/${r2}/activate
        payload: {}
        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_REVIEW_ALREADY_ACTIVE
      - http_status == 409
  - name: denial_target_active_window_inclusive_boundaries
    grounds:
    - entities.DenialRiskTarget.fields.active_from_period
    - entities.DenialRiskTarget.fields.active_to_period
    - state_machines.PatientCase.OPEN_to_FINAL_CODED
    distinguishing_aspect: 'Resource: DenialRiskTarget. Interval semantics: CLOSED interval

      [active_from_period, active_to_period] — both endpoints inclusive.

      A case finalized at active_from_period OR active_to_period IS

      checked; one finalized at active_from_period - 1 is NOT. Different

      semantics (closed time window) from instance 1 (state-exclusion).

      '
    test_recipe:
      setup:
      - Program at period 0
      - DenialRiskTarget on DRG 'A' with active_from=5, active_to=7, required_evidence_tags=['NEEDED_TAG'], severity_floor=1
      - 'Case with discharge_period=3 (finalize at period 4 < 5: not subject to target) AND another with discharge_period=5 (finalize at period 5 == active_from: subject to target)'
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/denial-risk-targets
        payload:
          cdi_program_id: ${prog}
          drg_code: A
          required_evidence_tags:
          - NEEDED_TAG
          severity_floor: 1
          active_from_period: 5
          active_to_period: 7
        as: CDIManager
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M1
          admission_period: 0
          discharge_period: 3
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          c1: $.data.id
          c1v: $.data.version
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M2
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          c2: $.data.id
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 4
        as: CDIManager
      - call: POST /api/patient-cases/${c1}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${c1v}
        as: HIMCoder
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 1
        as: CDIManager
      trigger:
      - call: GET /api/patient-cases/${c2}
        payload: {}
        as: HIMCoder
        captures:
          c2v: $.data.version
      - call: POST /api/patient-cases/${c2}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${c2v}
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DENIAL_TARGET_UNMET
      - http_status == 422
- rule_id: compensating_invariant
  instances:
  - name: agree_then_coder_prevails_reconciliation_preserves_drift
    grounds:
    - state_machines.CDIQuery.SENT_to_RESPONDED
    - state_machines.ReconciliationEvent.OPEN_to_RESOLVED_CODER_PREVAILS
    - calculations.review_opportunity_deltas
    distinguishing_aspect: 'Conserved quantity: case.working_drg_weight. Forward: AGREE response

      moves working_drg_weight from initial (1.0) to proposed (2.0).

      Compensating: ReconciliationEvent resolved CODER_PREVAILS sets

      working_drg_weight = coder_drg_weight (= original 1.0). After both

      actions, working_drg_weight MUST equal the original initial

      (no drift). The CDIReview opportunity_weight_delta, however,

      remains +1.0 (cumulative record, NOT rolled back).

      '
    test_recipe:
      setup:
      - Case initial=1.0, AGREE query moves working to 2.0, review closed, finalize with coder_drg=1.0 creates ReconciliationEvent (case becomes UNDER_REVIEW again, reconciliation_status=PENDING)
      - Then resolve as CODER_PREVAILS
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 10
          escalation_stage_periods: 10
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: AGREE
          response_text: ok
        as: Provider
        as_user_id: ${prov}
      - call: GET /api/cdi-reviews/${rev}
        payload: {}
        as: CDISpecialist
        captures:
          rev_v: $.data.version
      - call: POST /api/cdi-reviews/${rev}/close
        payload:
          closed_reason: OPPORTUNITY_CAPTURED
          expected_review_version: ${rev_v}
        as: CDISpecialist
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      - call: GET /api/patient-cases/${case}
        payload: {}
        as: HIMCoder
        captures:
          case_v: $.data.version
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${case_v}
        as: HIMCoder
      - call: GET /api/patient-cases/${case}/reconciliations
        payload: {}
        as: CDIManager
        captures:
          rec: $.data[0].id
      trigger:
      - call: POST /api/reconciliation-events/${rec}/resolve
        payload:
          outcome: CODER_PREVAILS
          resolution_note: coder correct
        as: CDIManager
      - call: GET /api/patient-cases/${case}
        payload: {}
        as: CDIManager
      - call: GET /api/cdi-reviews/${rev}
        payload: {}
        as: CDISpecialist
      assert:
      - PatientCase.${case}.working_drg_code == 'A'
      - PatientCase.${case}.working_drg_weight == 1.0
      - PatientCase.${case}.reconciliation_status == RESOLVED_CODER_PREVAILS
      - CDIReview.${rev}.opportunity_weight_delta == 1.0
  - name: education_score_compensating_events_conserve_at_zero_floor
    grounds:
    - calculations.provider_education_band
    - entities.Provider.fields.education_score
    distinguishing_aspect: 'Conserved quantity: provider.education_score is floored at 0.

      Forward: a sequence of deductions totalling more than 100 (e.g.,

      60 + 50) drives the score below zero; the invariant is the floor

      clamps at 0, NOT -10. education_flag must be INTENSIVE_REVIEW.

      Different conserved quantity (score vs DRG weight) and different

      clamping invariant (floor vs equality) from instance 1.

      '
    test_recipe:
      setup:
      - Provider at score=100
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
      trigger:
      - call: POST /api/provider-education-events
        payload:
          provider_id: ${prov}
          pattern_tag: LEADING_LANGUAGE
          points_deducted: 25
          source_query_id: ${q}
          note: n1
        as: CDIManager
      - call: POST /api/provider-education-events
        payload:
          provider_id: ${prov}
          pattern_tag: LEADING_LANGUAGE
          points_deducted: 25
          source_query_id: ${q}
          note: n2
        as: CDIManager
      - call: POST /api/provider-education-events
        payload:
          provider_id: ${prov}
          pattern_tag: NO_RESPONSE_PATTERN
          points_deducted: 25
          source_query_id: ${q}
          note: n3
        as: CDIManager
      - call: POST /api/provider-education-events
        payload:
          provider_id: ${prov}
          pattern_tag: CLINICALLY_UNSUPPORTED_PATTERN
          points_deducted: 25
          source_query_id: ${q}
          note: n4
        as: CDIManager
      - call: POST /api/provider-education-events
        payload:
          provider_id: ${prov}
          pattern_tag: OVERDUE_PATTERN
          points_deducted: 25
          source_query_id: ${q}
          note: n5 (would push below zero)
        as: CDIManager
      - call: GET /api/providers/${prov}
        payload: {}
        as: CDIManager
      assert:
      - Provider.${prov}.education_score == 0
      - Provider.${prov}.education_flag == INTENSIVE_REVIEW
