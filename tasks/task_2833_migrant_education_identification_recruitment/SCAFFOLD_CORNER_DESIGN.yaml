        distinguishing_aspect: "The move-band input set is restricted to QualifyingMoves in status VERIFIED inside the 365-day recency window: with one RECORDED and one REJECTED move on file recent_verified_moves is still 0 and the score stays at its no-move value 41, and verifying a third move lifts recent_verified_moves to 1, move_band_points to 18 and the score to 59."
