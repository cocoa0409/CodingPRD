            - call: "POST /accounts"
              payload: { email: "own_b@x.com", full_name: "Own B", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acctB: $.data.id, vb0: $.data.version }
            - call: "POST /accounts/${acctB}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${vb0}" }
