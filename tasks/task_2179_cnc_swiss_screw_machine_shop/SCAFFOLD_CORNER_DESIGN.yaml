  - name: machine_restore_blocked_while_a_tool_station_is_held
    claim_type: guarded_transition
    grounds:
    - state_machines.Machine.DOWN_to_AVAILABLE
    - validations[priority=65]
    - errors[ERR_TOOL_LIFE_EXPIRED]
    distinguishing_aspect: |
      The DOWN -> AVAILABLE edge is guarded by a sibling entity: while station 5 sits in OFFSET_HOLD the restore is refused with 409 ERR_TOOL_LIFE_EXPIRED, and it succeeds only after the station is indexed back to IN_SERVICE.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Machine SW-01 is DOWN and its station 5 is OFFSET_HOLD with cumulative_drift_um 8.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
          - LIGHTS_OUT
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${mach}
          station: 5
          tool_code: T05-OD
          expected_life_pieces: 1500
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          tool: $.data.id
      - call: POST /swiss-shop/tool-assignments/${tool}/offset-logs
        payload:
          pieces_produced: 40
          measured_drift_um: 3
        as: Machinist
        as_user_id: ${op_mach}
      - call: POST /swiss-shop/tool-assignments/${tool}/offset-logs
        payload:
          pieces_produced: 40
          measured_drift_um: 5
        as: Machinist
        as_user_id: ${op_mach}
      trigger:
      - call: POST /swiss-shop/machines/${mach}/restore
        payload: {}
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          err: $.data.error_id
      - call: POST /swiss-shop/tool-assignments/${tool}/index
        payload:
          new_tool_code: T05-OD-B
        as: Machinist
        as_user_id: ${op_mach}
      - call: POST /swiss-shop/machines/${mach}/restore
        payload: {}
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          st: $.data.status
      assert:
      - ${err} == ERR_TOOL_LIFE_EXPIRED
      - the first restore returns HTTP status 409
      - ${st} == AVAILABLE
      - ToolAssignment.${tool}.status == IN_SERVICE
      - Machine.${mach}.status == AVAILABLE
