scenario: "167. Public Transit Fare Capping: single ride/daily cap/weekly cap, transfer discount, low-income discount, mobile payment integration, employer commuter benefit (Transit FSA), Reduced Fare Card."
domain_name: "transit-fare-capping"
api_prefix: "/transit"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Cascading side effects"
    - "Idempotency"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# §1.1 Entity-Relationship Table
entities:
  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Rider's legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Riders."
        constraints: "unique"
      - name: low_income_verified
        type: boolean
        source: system
        description: "Set true when an active LowIncomeVerification exists; false otherwise. Recomputed as a side effect of LowIncomeVerification transitions."
        default: false
      - name: employer_id
        type: string
        source: system
        description: "FK to Employer.id; null if rider is not enrolled in a Transit FSA. Set by FSA enrollment endpoint."
        default: null

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Employer legal name."
      - name: enrollment_status
        type: enum
        source: system
        description: "ACTIVE allows new FSA contributions; SUSPENDED blocks new contributions but allows refunds; TERMINATED blocks everything."
        constraints: "values: ACTIVE, SUSPENDED, TERMINATED"
        default: "ACTIVE"
      - name: monthly_contribution_cap_cents
        type: integer
        source: input
        description: "Maximum total FSA contributions per Employer per calendar month, in cents."
        constraints: ">= 0; default 31500 (US IRS Transit FSA monthly limit reference)"

  - name: FareCard
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id; cardholder."
      - name: discount_class
        type: enum
        source: input
        description: "STANDARD = no discount; REDUCED_FARE = 50% off base fare (issued via Reduced Fare Card program); LOW_INCOME = 40% off base fare (requires active LowIncomeVerification on the Rider)."
        constraints: "values: STANDARD, REDUCED_FARE, LOW_INCOME"
        default: "STANDARD"
      - name: status
        type: enum
        source: system
        description: "ACTIVE accepts tap-ins; SUSPENDED rejects tap-ins but permits read; CLOSED is terminal."
        constraints: "values: ACTIVE, SUSPENDED, CLOSED"
        default: "ACTIVE"
      - name: valid_from
        type: datetime
        source: input
        description: "Earliest tap-in time accepted; ISO 8601 UTC."
      - name: valid_until
        type: datetime
        source: input
        description: "Latest tap-in time accepted; ISO 8601 UTC. Must be strictly greater than valid_from."
      - name: wallet_balance_cents
        type: integer
        source: system
        description: "Stored-value balance attached to the card, in cents. Mutated only by top-ups, trip charges, refunds, and FSA disbursements. Never negative."
        default: 0
      - name: mobile_token_id
        type: string
        source: system
        description: "FK to MobilePaymentToken.id when the card is bound to a mobile wallet; null otherwise."
        default: null

  - name: ReducedFareCertificate
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id whose certificate this is."
      - name: program_type
        type: enum
        source: input
        description: "SENIOR (age 65+), DISABILITY, STUDENT — categorical eligibility for the Reduced Fare Card program."
        constraints: "values: SENIOR, DISABILITY, STUDENT"
      - name: valid_from
        type: datetime
        source: input
        description: "Earliest moment this certificate authorizes a REDUCED_FARE FareCard."
      - name: valid_until
        type: datetime
        source: input
        description: "Latest moment this certificate authorizes a REDUCED_FARE FareCard. Strictly greater than valid_from. Two certificates of the same program_type on the same rider may not have overlapping [valid_from, valid_until] windows."
      - name: status
        type: enum
        source: system
        description: "PENDING after creation; ACTIVE after agency approval; REVOKED is terminal."
        constraints: "values: PENDING, ACTIVE, REVOKED"
        default: "PENDING"

  - name: LowIncomeVerification
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id."
      - name: declared_annual_income_cents
        type: integer
        source: input
        description: "Rider-declared annual income at application time, in cents."
      - name: verified_annual_income_cents
        type: integer
        source: input
        description: "Agency-verified annual income, in cents. Set when status moves PENDING→ACTIVE. Null while PENDING."
        default: null
      - name: status
        type: enum
        source: system
        description: "PENDING after creation; ACTIVE after agency approval (verified income < eligibility threshold); REJECTED if verified income exceeds threshold; EXPIRED automatically twelve months after approval."
        constraints: "values: PENDING, ACTIVE, REJECTED, EXPIRED"
        default: "PENDING"
      - name: approved_at
        type: datetime
        source: system
        description: "Server clock at PENDING→ACTIVE transition; null otherwise."
        default: null

  - name: MobilePaymentToken
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id who owns the mobile wallet."
      - name: wallet_provider
        type: enum
        source: input
        description: "APPLE_PAY, GOOGLE_PAY, SAMSUNG_PAY."
        constraints: "values: APPLE_PAY, GOOGLE_PAY, SAMSUNG_PAY"
      - name: device_fingerprint
        type: string
        source: input
        description: "Provider-supplied device identifier; (rider_id, device_fingerprint) is unique."
        constraints: "unique together with rider_id"
      - name: status
        type: enum
        source: system
        description: "ACTIVE accepts new tap-ins; REVOKED is terminal."
        constraints: "values: ACTIVE, REVOKED"
        default: "ACTIVE"
      - name: bound_card_id
        type: string
        source: system
        description: "FK to FareCard.id when bound; null otherwise."
        default: null

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: "FK to FareCard.id used to tap in."
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied tap-in key; (card_id, idempotency_key) is unique to dedupe repeated taps."
        constraints: "unique together with card_id; length 1..64"
      - name: tap_in_at
        type: datetime
        source: input
        description: "Tap-in timestamp in ISO 8601 UTC; must be within [card.valid_from, card.valid_until]."
      - name: tap_out_at
        type: datetime
        source: system
        description: "Tap-out timestamp; null until completion. Must be strictly after tap_in_at."
        default: null
      - name: fare_status
        type: enum
        source: system
        description: "Independent dimension. PROVISIONAL = charged at tap-in based on forward-looking forecast; SETTLED = recomputed at sweep against chronological order; DISPUTED = under review."
        constraints: "values: PROVISIONAL, SETTLED, DISPUTED"
        default: "PROVISIONAL"
      - name: travel_status
        type: enum
        source: system
        description: "Independent dimension. TAPPED_IN after tap; COMPLETED on tap-out; INCOMPLETE_FORCED if tap-out is missing 180 minutes after tap-in (closed by the timeout sweep, billed as max base fare)."
        constraints: "values: TAPPED_IN, COMPLETED, INCOMPLETE_FORCED"
        default: "TAPPED_IN"
      - name: provisional_fare_cents
        type: integer
        source: computed
        description: "Charge applied at tap-in using forward-looking rule (see calc trip_provisional_fare)."
        default: 0
      - name: settled_fare_cents
        type: integer
        source: computed
        description: "Final charge after chronological sweep (see calc trip_settled_fare). Null until SETTLED. Difference from provisional_fare_cents is refunded or back-charged."
        default: null
      - name: transfer_link_id
        type: string
        source: system
        description: "FK to TransferLink.id when this trip is the SECOND leg consuming a transfer; null otherwise."
        default: null
      - name: cap_period_id
        type: string
        source: system
        description: "FK to FareCapPeriod.id (the DAILY cap period this trip belongs to). Pinned at tap-in."
      - name: paid_from_fsa_cents
        type: integer
        source: computed
        description: "Portion of provisional_fare_cents drawn from CommuterBenefitAccount at tap-in; remainder drawn from FareCard.wallet_balance_cents."
        default: 0

  - name: TransferLink
    parent: null
    common_fields: false
    fields:
      - name: first_trip_id
        type: string
        source: input
        description: "FK to Trip.id of the first leg; unique."
        constraints: "unique"
      - name: second_trip_id
        type: string
        source: input
        description: "FK to Trip.id of the second leg; unique."
        constraints: "unique"
      - name: window_minutes
        type: integer
        source: system
        description: "Elapsed minutes between first.tap_in_at and second.tap_in_at at link creation; must satisfy 0 < window_minutes <= 120."

  - name: FareCapPeriod
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: "FK to FareCard.id."
      - name: scope
        type: enum
        source: input
        description: "DAILY = a calendar day (UTC); WEEKLY = ISO week (Monday-start, UTC). One DAILY and one WEEKLY period at most per (card, date) and per (card, iso_week)."
        constraints: "values: DAILY, WEEKLY; unique on (card_id, scope, window_start)"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive lower bound of the window in UTC."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive upper bound of the window in UTC. DAILY = window_start + 24h; WEEKLY = window_start + 7d."
      - name: accumulated_cents
        type: integer
        source: computed
        description: "Running sum of provisional_fare_cents of trips with tap_in_at in [window_start, window_end). Updated as a side effect of every Trip CREATE and Trip SETTLE."
        default: 0
      - name: cap_cents
        type: integer
        source: system
        description: "Configured cap for this scope at window_start; DAILY default 600, WEEKLY default 3300. Pinned at creation."
      - name: cap_reached_at
        type: datetime
        source: system
        description: "First moment accumulated_cents reaches cap_cents; null while below."
        default: null

  - name: CommuterBenefitAccount
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id; unique — at most one FSA account per rider."
        constraints: "unique"
      - name: employer_id
        type: string
        source: input
        description: "FK to Employer.id sponsoring this account."
      - name: balance_cents
        type: integer
        source: computed
        description: "Current FSA balance, in cents. Equal to sum(FSAContribution.amount_cents where status=APPLIED) − sum(applied_from_fsa_cents over all Trips charged from this account) + sum(FSARefund.amount_cents back to this account)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE accepts disbursements; FROZEN blocks disbursements and contributions (typically when Employer SUSPENDED)."
        constraints: "values: ACTIVE, FROZEN"
        default: "ACTIVE"

  - name: FSAContribution
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to CommuterBenefitAccount.id."
      - name: amount_cents
        type: integer
        source: input
        description: "Contribution amount in cents; > 0."
      - name: contribution_month
        type: string
        source: input
        description: "Calendar month tag YYYY-MM used for monthly_contribution_cap_cents enforcement."
      - name: status
        type: enum
        source: system
        description: "APPLIED on successful contribution; REVERSED when refunded. Append-only — a reversal creates a new FSAContribution with negated amount."
        constraints: "values: APPLIED, REVERSED"
        default: "APPLIED"

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK to Trip.id under dispute."
      - name: rider_id
        type: string
        source: input
        description: "FK to Rider.id who filed the dispute; must equal Trip.card.rider_id."
      - name: status
        type: enum
        source: system
        description: "OPEN after filing; INVESTIGATING after agency claims it; RESOLVED_REFUNDED if accepted (refund to wallet + FSA proportional); RESOLVED_REJECTED if denied; can cycle OPEN→INVESTIGATING→OPEN when more evidence is requested."
        constraints: "values: OPEN, INVESTIGATING, RESOLVED_REFUNDED, RESOLVED_REJECTED"
        default: "OPEN"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Total cents refunded when RESOLVED_REFUNDED; equals provisional_fare_cents of the disputed Trip. Null until resolved."
        default: null

# §1.2 State Machine Table
state_machines:
  - entity: Trip
    initial_state: "TAPPED_IN/PROVISIONAL"
    terminal_states: ["COMPLETED/SETTLED", "INCOMPLETE_FORCED/SETTLED"]
    note: |
      Trip carries TWO parallel state dimensions evolving independently:
        travel_status: TAPPED_IN → {COMPLETED, INCOMPLETE_FORCED}
        fare_status:   PROVISIONAL → {SETTLED, DISPUTED} ; DISPUTED → SETTLED
      Transitions below name the dimension being moved.
    transitions:
      - from: "travel_status=null"
        to: "travel_status=TAPPED_IN; fare_status=PROVISIONAL"
        trigger: "POST /transit/trips (tap-in)"
        actor: Rider
        preconditions:
          - "FareCard.status == ACTIVE"
          - "MobilePaymentToken.status == ACTIVE if tap is mobile"
          - "tap_in_at within [card.valid_from, card.valid_until]"
          - "no other Trip on card_id with travel_status=TAPPED_IN"
        side_effects:
          - "FareCapPeriod (DAILY) created if absent for (card, day-of-tap_in_at); WEEKLY likewise"
          - "calculations.trip_provisional_fare runs and writes provisional_fare_cents"
          - "FareCapPeriod.accumulated_cents incremented by provisional_fare_cents (DAILY and WEEKLY)"
          - "If accumulated_cents >= cap_cents on either period, set that period's cap_reached_at"
          - "paid_from_fsa_cents debited from CommuterBenefitAccount.balance_cents (if account present and ACTIVE)"
          - "Remaining (provisional_fare_cents − paid_from_fsa_cents) debited from FareCard.wallet_balance_cents"
          - "If prior Trip on same card with COMPLETED travel_status exists and tap_in_at − prior.tap_in_at <= 120 minutes, a TransferLink is created and transfer_link_id set; transfer discount already applied in fare formula"
      - from: "travel_status=TAPPED_IN"
        to: "travel_status=COMPLETED"
        trigger: "POST /transit/trips/{id}/tap-out"
        actor: Rider
        preconditions:
          - "Trip.travel_status == TAPPED_IN"
          - "tap_out_at strictly > tap_in_at"
          - "FareCard.id of caller matches Trip.card_id"
        side_effects:
          - "tap_out_at set; updated_at refreshed"
      - from: "travel_status=TAPPED_IN"
        to: "travel_status=INCOMPLETE_FORCED"
        trigger: "POST /transit/_sweep/incomplete-trips (system)"
        actor: system
        preconditions:
          - "now() >= tap_in_at + 180 minutes"
          - "Trip.travel_status == TAPPED_IN"
        side_effects:
          - "tap_out_at = tap_in_at + 180 minutes"
          - "If provisional_fare_cents was less than the max base fare (e.g., due to transfer discount), additional cents are charged against wallet to bring this trip's contribution to the post-discount base fare. The difference cascades: FareCapPeriod.accumulated_cents increases, may flip subsequent same-window trips' settled_fare from charged to capped-free"
      - from: "fare_status=PROVISIONAL"
        to: "fare_status=SETTLED"
        trigger: "POST /transit/_sweep/settle"
        actor: system
        preconditions:
          - "Trip.travel_status in {COMPLETED, INCOMPLETE_FORCED}"
          - "now() >= window_end of Trip.cap_period_id"
        side_effects:
          - "calculations.trip_settled_fare runs"
          - "If settled_fare_cents < provisional_fare_cents, refund = provisional − settled credited proportionally back to FSA then Wallet (compensating invariant 9)"
          - "If settled_fare_cents > provisional_fare_cents, additional charge debited from Wallet then FSA"
      - from: "fare_status=PROVISIONAL"
        to: "fare_status=DISPUTED"
        trigger: "POST /transit/disputes (DisputeCase created)"
        actor: Rider
        preconditions:
          - "Trip.fare_status == PROVISIONAL"
          - "Trip belongs to caller's rider"
        side_effects:
          - "DisputeCase created in OPEN"
      - from: "fare_status=DISPUTED"
        to: "fare_status=SETTLED"
        trigger: "DisputeCase resolved (RESOLVED_REFUNDED or RESOLVED_REJECTED)"
        actor: AgencyOfficer
        preconditions:
          - "DisputeCase.status in {RESOLVED_REFUNDED, RESOLVED_REJECTED}"
        side_effects:
          - "If REFUNDED: settled_fare_cents = 0; provisional charge fully refunded to wallet + FSA in original proportions (compensating invariant 9)"
          - "If REJECTED: settled_fare_cents = provisional_fare_cents (no change)"

  - entity: ReducedFareCertificate
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /transit/reduced-fare-certificates/{id}/approve"
        actor: AgencyOfficer
        preconditions:
          - "ReducedFareCertificate.status == PENDING"
          - "valid_until strictly > now()"
        side_effects:
          - "If a FareCard exists with rider_id == this.rider_id and discount_class==REDUCED_FARE, it remains active; otherwise no card-level effect at approval"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /transit/reduced-fare-certificates/{id}/revoke"
        actor: AgencyOfficer
        preconditions:
          - "ReducedFareCertificate.status == ACTIVE"
        side_effects:
          - "All FareCards with discount_class==REDUCED_FARE for this rider with no other ACTIVE certificate of any program_type are downgraded: discount_class flips to STANDARD; in-flight TAPPED_IN trips are unaffected; future tap-ins use STANDARD"

  - entity: LowIncomeVerification
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /transit/low-income-verifications/{id}/approve"
        actor: AgencyOfficer
        preconditions:
          - "verified_annual_income_cents <= LOW_INCOME_THRESHOLD_CENTS (3000000 = $30,000)"
          - "LowIncomeVerification.status == PENDING"
        side_effects:
          - "approved_at = now()"
          - "Rider.low_income_verified = true"
          - "Cascade: any FareCard for this rider with discount_class==LOW_INCOME that was blocked from charging the discount falls back to using it"
      - from: PENDING
        to: REJECTED
        trigger: "POST /transit/low-income-verifications/{id}/approve when income exceeds threshold"
        actor: AgencyOfficer
        preconditions:
          - "verified_annual_income_cents > LOW_INCOME_THRESHOLD_CENTS"
        side_effects:
          - "Rider.low_income_verified unchanged (false)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /transit/_sweep/low-income-expiry (system)"
        actor: system
        preconditions:
          - "now() >= approved_at + 365 days"
        side_effects:
          - "Rider.low_income_verified set to false if no other ACTIVE LowIncomeVerification remains for this rider"
          - "Cascade: any FareCard for this rider with discount_class==LOW_INCOME is downgraded to STANDARD; future tap-ins charge STANDARD fare"

  - entity: DisputeCase
    initial_state: OPEN
    terminal_states: [RESOLVED_REFUNDED, RESOLVED_REJECTED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /transit/disputes/{id}/claim"
        actor: AgencyOfficer
        preconditions:
          - "DisputeCase.status == OPEN"
        side_effects: []
      - from: INVESTIGATING
        to: OPEN
        trigger: "POST /transit/disputes/{id}/request-evidence"
        actor: AgencyOfficer
        preconditions:
          - "DisputeCase.status == INVESTIGATING"
        side_effects:
          - "Cycle: state returns to OPEN awaiting rider response"
      - from: INVESTIGATING
        to: RESOLVED_REFUNDED
        trigger: "POST /transit/disputes/{id}/resolve {decision: REFUND}"
        actor: AgencyOfficer
        preconditions:
          - "DisputeCase.status == INVESTIGATING"
        side_effects:
          - "refund_amount_cents set to Trip.provisional_fare_cents"
          - "Trip.fare_status moves DISPUTED → SETTLED; settled_fare_cents = 0"
          - "Refund split: paid_from_fsa_cents back to CommuterBenefitAccount.balance_cents; remainder back to FareCard.wallet_balance_cents"
          - "FareCapPeriod.accumulated_cents decremented by provisional_fare_cents on both DAILY and WEEKLY"
      - from: INVESTIGATING
        to: RESOLVED_REJECTED
        trigger: "POST /transit/disputes/{id}/resolve {decision: REJECT}"
        actor: AgencyOfficer
        preconditions:
          - "DisputeCase.status == INVESTIGATING"
        side_effects:
          - "Trip.fare_status moves DISPUTED → SETTLED; settled_fare_cents = provisional_fare_cents"

  - entity: FareCard
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /transit/cards/{id}/suspend"
        actor: AgencyOfficer
        preconditions:
          - "FareCard.status == ACTIVE"
        side_effects:
          - "Any in-flight TAPPED_IN Trip on this card is force-closed via INCOMPLETE_FORCED sweep semantics in the next sweep run; new tap-ins are rejected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /transit/cards/{id}/reactivate"
        actor: AgencyOfficer
        preconditions:
          - "FareCard.status == SUSPENDED"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /transit/cards/{id}/close"
        actor: Rider
        preconditions:
          - "no Trip on this card with travel_status==TAPPED_IN"
          - "wallet_balance_cents refunded to rider out-of-band; field zeroed"
        side_effects:
          - "wallet_balance_cents := 0"
          - "If bound to MobilePaymentToken, the token.bound_card_id is cleared"

# §1.2.1 Concurrency Rules
concurrency_rules:
  - scenario: "Two simultaneous tap-ins with the same (card_id, idempotency_key)"
    guarantee: "Exactly one Trip is created; the duplicate returns the same Trip resource without side effects"
    error_id: ERR_DUPLICATE_TAP
    http_status: 409
    serialization: "First-writer-wins on (card_id, idempotency_key); subsequent requests return 200 with the original Trip and no new debit"

  - scenario: "Two tap-ins on the same card while one Trip is still TAPPED_IN"
    guarantee: "At most one Trip per card may be TAPPED_IN; the second tap is rejected"
    error_id: ERR_TRIP_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on Trip.travel_status==TAPPED_IN; the second tap-in observes the open trip and rejects"

  - scenario: "Dispute resolution and DisputeCase.cancel race"
    guarantee: "Exactly one terminal transition succeeds"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DisputeCase.status; loser sees status != INVESTIGATING and is rejected"

  - scenario: "Concurrent FSA contributions in the same calendar month at the cap"
    guarantee: "Sum of APPLIED contributions per (employer, contribution_month) never exceeds monthly_contribution_cap_cents"
    error_id: ERR_FSA_MONTHLY_CAP_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on the contribution that pushes the running sum past the cap"

  - scenario: "Two ReducedFareCertificate approvals creating overlapping validity windows for one rider+program_type"
    guarantee: "No two ACTIVE certificates with the same program_type may overlap on a single rider"
    error_id: ERR_CERTIFICATE_WINDOW_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on PENDING→ACTIVE for a given (rider_id, program_type) overlapping window"

# §1.3 Calculation Rules Table
calculations:
  - name: trip_provisional_fare
    trigger: "On Trip create (tap-in), before persistence."
    algorithm: forward_looking
    formula: |
      # Step 1: pick the post-discount per-leg base fare; round_half_up to nearest cent AT THIS STEP.
      if card.discount_class == STANDARD:
          base_after_discount = BASE_FARE_CENTS                           # 275
      elif card.discount_class == REDUCED_FARE:
          base_after_discount = round_half_up(BASE_FARE_CENTS * 0.50)     # 275 * 0.50 = 137.5 → 138
      elif card.discount_class == LOW_INCOME:
          # only if Rider.low_income_verified == true; else fall back to STANDARD
          base_after_discount = round_half_up(BASE_FARE_CENTS * 0.60) if rider.low_income_verified else BASE_FARE_CENTS  # 275*0.60=165
      # Step 2: transfer discount — does a prior Trip on same card with travel_status==COMPLETED exist
      # whose tap_in_at falls in (this.tap_in_at - 120 minutes, this.tap_in_at]?
      # Boundary is half-open at the lower end; exactly 120 minutes counts as a transfer.
      eligible_prior = max{ T : T.card_id==this.card_id, T.travel_status==COMPLETED,
                            0 < (this.tap_in_at - T.tap_in_at) <= 120 minutes,
                            T has NOT already been the first_trip_id of any TransferLink }
      if eligible_prior is not null:
          pre_cap_fare = 0
      else:
          pre_cap_fare = base_after_discount
      # Step 3: cap allocation — both DAILY and WEEKLY periods compete; the binding remainder wins.
      remaining_daily  = max(0, daily_period.cap_cents  - daily_period.accumulated_cents)
      remaining_weekly = max(0, weekly_period.cap_cents - weekly_period.accumulated_cents)
      provisional_fare_cents = min(pre_cap_fare, remaining_daily, remaining_weekly)
    input_set: |
      For the transfer search: Trips on the same FareCard with travel_status==COMPLETED whose tap_in_at falls in the half-open interval (this.tap_in_at - 120 minutes, this.tap_in_at), excluding any prior Trip that already appears as first_trip_id on an existing TransferLink. Tie-break for "eligible_prior": maximum tap_in_at (the most recent qualifying prior trip). If still tied (identical tap_in_at), use the lexicographically largest Trip.id.
    constants:
      BASE_FARE_CENTS: 275
      DAILY_CAP_CENTS: 600
      WEEKLY_CAP_CENTS: 3300
      TRANSFER_WINDOW_MINUTES: 120
      LOW_INCOME_DISCOUNT_RATE: 0.60
      REDUCED_FARE_DISCOUNT_RATE: 0.50
      LOW_INCOME_THRESHOLD_CENTS: 3000000
    precision: "round_half_up at Step 1 only; Steps 2 and 3 are integer cents."
    variants:
      - name: chronological_forecast
        when: "default at tap-in"
        difference: "Uses the current accumulated_cents on the cap period; ignores any Trip with tap_in_at > this trip whose later settlement could change the picture."

  - name: trip_settled_fare
    trigger: "On Trip settle (system sweep after cap_period.window_end)."
    algorithm: chronological
    formula: |
      # Step 1: gather ALL Trips on this card with tap_in_at in [cap_period.window_start, cap_period.window_end),
      # ordered ASC by tap_in_at, then ASC by Trip.id for tie-break.
      ordered = sort_by(tap_in_at ASC, id ASC) of Trips in window
      running = 0
      for T in ordered:
          # Recompute T.base_after_discount with the same formula as trip_provisional_fare Step 1.
          # Recompute T.transfer_eligibility against ordered chronological history (not the live view at T's tap-in).
          # Reapply cap: settled_T = max(0, min(pre_cap_T, DAILY_CAP_CENTS - running, WEEKLY_remaining_at_T))
          settled_T = max(0, min(pre_cap_T, cap_period.cap_cents - running, weekly_remaining_at_T))
          T.settled_fare_cents = settled_T
          running += settled_T
      # Step 2: compute delta = provisional - settled per trip; apply refunds/charges in compensating-invariant order.
    input_set: "All Trips on this card with tap_in_at in [window_start, window_end), excluding Trips currently in fare_status=DISPUTED. Ordering: tap_in_at ASC, then Trip.id ASC."
    constants:
      BASE_FARE_CENTS: 275
      DAILY_CAP_CENTS: 600
      WEEKLY_CAP_CENTS: 3300
      TRANSFER_WINDOW_MINUTES: 120
    precision: "round_half_up at Step 1 only; running accumulator is integer cents."
    variants:
      - name: provisional_view
        when: "tap-in"
        difference: "Provisional uses the live state at the moment of tap-in; settled re-runs chronologically. For a sequence where Trip A taps in then is force-closed (INCOMPLETE_FORCED) after Trip B taps in, the provisional fare on Trip B assumed A was charged at transfer-discount $0 (B was within 120 min of A) but settled finds A's force-close charged the full base, which retroactively changes B's cap-remainder math. Net result: provisional and settled diverge for the same {tap_in_at, card, discount_class} inputs."

  - name: fsa_split_at_charge
    trigger: "On Trip create (tap-in), after trip_provisional_fare and before wallet debit."
    algorithm: waterfall_allocation
    formula: |
      # Bucket order: 1) CommuterBenefitAccount.balance_cents (if rider.employer_id != null and account.status==ACTIVE)
      #               2) FareCard.wallet_balance_cents
      if rider.employer_id is null or account is null or account.status != ACTIVE:
          paid_from_fsa_cents = 0
      else:
          paid_from_fsa_cents = min(provisional_fare_cents, account.balance_cents)
      remainder = provisional_fare_cents - paid_from_fsa_cents
      if remainder > card.wallet_balance_cents:
          REJECT with ERR_INSUFFICIENT_FUNDS  # nothing has been written yet
      account.balance_cents -= paid_from_fsa_cents
      card.wallet_balance_cents -= remainder
    input_set: "Per Trip create. The account.balance_cents read at this step is the value AFTER any concurrent FSAContribution commits — first-writer-wins on the contribution side."
    constants: {}
    precision: "integer cents."

  - name: refund_split_on_dispute_or_overcharge
    trigger: "On DisputeCase RESOLVED_REFUNDED, on trip_settled_fare when settled < provisional, and on cap_period.accumulated_cents underflow."
    algorithm: waterfall_allocation
    formula: |
      # Refund proportionally restores the original split.
      refund_total = max(0, provisional_fare_cents - effective_settled_fare_cents)
      if provisional_fare_cents > 0:
          refund_to_fsa = round_half_up(refund_total * paid_from_fsa_cents / provisional_fare_cents)
      else:
          refund_to_fsa = 0
      refund_to_wallet = refund_total - refund_to_fsa  # remainder absorbs all rounding drift
      account.balance_cents += refund_to_fsa
      card.wallet_balance_cents += refund_to_wallet
    input_set: "All refunds; the wallet bucket absorbs the rounding remainder so that account.balance + card.wallet_balance stays exactly conserved against the original debit."
    constants: {}
    precision: "round_half_up on the FSA share only; wallet share is the difference (no second rounding). This pins the rounding ORDER and prevents drift in the conserved quantity (compensating invariant 9)."

  - name: low_income_eligibility
    trigger: "On LowIncomeVerification create (declared income, provisional) and on LowIncomeVerification approve (verified income, final)."
    algorithm: threshold
    formula: |
      # Forward-looking (at create):
      provisional_eligible = (declared_annual_income_cents <= LOW_INCOME_THRESHOLD_CENTS)
      # Final (at approval):
      final_eligible = (verified_annual_income_cents <= LOW_INCOME_THRESHOLD_CENTS)
    input_set: "Declared income at create; verified income at approve. Boundary: '<=' is inclusive — exactly LOW_INCOME_THRESHOLD_CENTS (3000000 cents = $30,000.00) qualifies."
    constants:
      LOW_INCOME_THRESHOLD_CENTS: 3000000
    precision: "integer cents."
    variants:
      - name: provisional_declared
        when: "Verification create"
        difference: "Uses rider-declared income; can differ from verified."
      - name: final_verified
        when: "Verification approval"
        difference: "Uses agency-verified income. A rider whose declared income passed but whose verified income exceeds threshold is REJECTED, not granted ACTIVE."

# §1.4 Validation Rules Table (Ordered by Priority)
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Rider, AgencyOfficer, EmployerAdmin, Auditor}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path resource exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body-referenced FK resources exist (card_id, rider_id, account_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all writes with body FKs"

  - priority: 6
    category: state
    check: "Resource is in a state that permits this operation (e.g., approving a non-PENDING certificate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions and resolutions"

  - priority: 7
    category: state
    check: "FareCard.status == ACTIVE on tap-in"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /transit/trips"

  - priority: 8
    category: state
    check: "No other Trip on this card has travel_status==TAPPED_IN"
    error_id: ERR_TRIP_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /transit/trips"

  - priority: 9
    category: business_referential
    check: "ReducedFareCertificate.valid_until strictly greater than valid_from; non-overlapping with other certificates of the same program_type on the same rider"
    error_id: ERR_CERTIFICATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /transit/reduced-fare-certificates, /approve"

  - priority: 10
    category: business_referential
    check: "FareCard.discount_class==REDUCED_FARE requires an ACTIVE ReducedFareCertificate on the rider whose [valid_from, valid_until] contains the current server time at card create"
    error_id: ERR_MISSING_REDUCED_FARE_CERTIFICATE
    http_status: 409
    applies_to: "POST /transit/cards (when discount_class==REDUCED_FARE)"

  - priority: 11
    category: business_referential
    check: "FareCard.discount_class==LOW_INCOME requires Rider.low_income_verified==true at card create"
    error_id: ERR_MISSING_LOW_INCOME_VERIFICATION
    http_status: 409
    applies_to: "POST /transit/cards (when discount_class==LOW_INCOME)"

  - priority: 12
    category: business_temporal
    check: "tap_in_at within [FareCard.valid_from, FareCard.valid_until]"
    error_id: ERR_CARD_OUTSIDE_VALIDITY
    http_status: 422
    applies_to: "POST /transit/trips"

  - priority: 13
    category: business_temporal
    check: "tap_out_at strictly greater than tap_in_at"
    error_id: ERR_TAP_OUT_NOT_AFTER_TAP_IN
    http_status: 422
    applies_to: "POST /transit/trips/{id}/tap-out"

  - priority: 14
    category: business_constraint
    check: "MobilePaymentToken (rider_id, device_fingerprint) uniqueness"
    error_id: ERR_DEVICE_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /transit/mobile-tokens"

  - priority: 15
    category: business_constraint
    check: "(card_id, idempotency_key) uniqueness on tap-in; duplicate returns existing Trip"
    error_id: ERR_DUPLICATE_TAP
    http_status: 409
    applies_to: "POST /transit/trips"

  - priority: 16
    category: business_constraint
    check: "FSAContribution amount_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /transit/fsa-contributions"

  - priority: 17
    category: business_fiscal
    check: "Sum of APPLIED FSAContributions for (employer, contribution_month) + new amount <= Employer.monthly_contribution_cap_cents"
    error_id: ERR_FSA_MONTHLY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /transit/fsa-contributions"

  - priority: 18
    category: business_fiscal
    check: "card.wallet_balance_cents + account.balance_cents (if account ACTIVE) >= provisional_fare_cents at tap-in"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /transit/trips"

  - priority: 19
    category: business_constraint
    check: "Pagination params within bounds (1 <= limit <= 100, 0 <= offset)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

# §1.5 API Endpoint Table
endpoints:
  - method: POST
    path: "/transit/riders"
    description: "Create a rider"
    roles: [AgencyOfficer]
    code: 201
    input: [full_name, email]
    output: Rider

  - method: GET
    path: "/transit/riders/{rider_id}"
    description: "Fetch a rider"
    roles: [Rider, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: Rider

  - method: POST
    path: "/transit/employers"
    description: "Create an employer"
    roles: [AgencyOfficer]
    code: 201
    input: [legal_name, monthly_contribution_cap_cents]
    output: Employer

  - method: POST
    path: "/transit/employers/{employer_id}/suspend"
    description: "Suspend an employer (freezes all FSA accounts)"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: Employer
    side_effects: ["All CommuterBenefitAccount with this employer_id move ACTIVE→FROZEN"]

  - method: POST
    path: "/transit/cards"
    description: "Issue a fare card to a rider with chosen discount_class"
    roles: [AgencyOfficer, Rider]
    code: 201
    input: [rider_id, discount_class, valid_from, valid_until]
    output: FareCard

  - method: GET
    path: "/transit/cards/{card_id}"
    description: "Read a fare card"
    roles: [Rider, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: FareCard

  - method: POST
    path: "/transit/cards/{card_id}/top-up"
    description: "Add stored value to the card's wallet"
    roles: [Rider, AgencyOfficer]
    code: 200
    input: [amount_cents, "version?"]
    output: FareCard
    side_effects: ["wallet_balance_cents incremented"]

  - method: POST
    path: "/transit/cards/{card_id}/suspend"
    description: "Suspend the card; blocks new tap-ins"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: FareCard

  - method: POST
    path: "/transit/cards/{card_id}/reactivate"
    description: "Re-enable a suspended card"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: FareCard

  - method: POST
    path: "/transit/cards/{card_id}/close"
    description: "Close a card; zeros wallet"
    roles: [Rider]
    code: 200
    input: ["version?"]
    output: FareCard

  - method: POST
    path: "/transit/reduced-fare-certificates"
    description: "Create a Reduced Fare Card certificate (PENDING)"
    roles: [AgencyOfficer]
    code: 201
    input: [rider_id, program_type, valid_from, valid_until]
    output: ReducedFareCertificate

  - method: POST
    path: "/transit/reduced-fare-certificates/{cert_id}/approve"
    description: "Approve a certificate (PENDING→ACTIVE)"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: ReducedFareCertificate

  - method: POST
    path: "/transit/reduced-fare-certificates/{cert_id}/revoke"
    description: "Revoke a certificate (ACTIVE→REVOKED) and cascade discount downgrade"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: ReducedFareCertificate

  - method: POST
    path: "/transit/low-income-verifications"
    description: "Create a low-income verification (PENDING)"
    roles: [Rider, AgencyOfficer]
    code: 201
    input: [rider_id, declared_annual_income_cents]
    output: LowIncomeVerification

  - method: POST
    path: "/transit/low-income-verifications/{verif_id}/approve"
    description: "Set verified income; resolves to ACTIVE or REJECTED based on threshold"
    roles: [AgencyOfficer]
    code: 200
    input: [verified_annual_income_cents, "version?"]
    output: LowIncomeVerification

  - method: POST
    path: "/transit/mobile-tokens"
    description: "Register a mobile wallet token (Apple/Google/Samsung Pay)"
    roles: [Rider]
    code: 201
    input: [rider_id, wallet_provider, device_fingerprint, "bound_card_id?"]
    output: MobilePaymentToken

  - method: POST
    path: "/transit/mobile-tokens/{token_id}/revoke"
    description: "Revoke a mobile token"
    roles: [Rider, AgencyOfficer]
    code: 200
    input: ["version?"]
    output: MobilePaymentToken

  - method: POST
    path: "/transit/trips"
    description: "Tap in. Idempotent on (card_id, idempotency_key). Computes provisional_fare_cents, debits FSA then wallet, may create TransferLink."
    roles: [Rider]
    code: 201
    input: [card_id, idempotency_key, tap_in_at, "mobile_token_id?"]
    output: Trip
    side_effects:
      - "trip_provisional_fare computed"
      - "fsa_split_at_charge computed"
      - "FareCapPeriod (DAILY, WEEKLY) created if absent; accumulated_cents updated"
      - "TransferLink created if eligible prior trip exists"

  - method: GET
    path: "/transit/trips/{trip_id}"
    description: "Read a trip"
    roles: [Rider, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: Trip

  - method: GET
    path: "/transit/trips"
    description: "List trips with filters (card_id, rider_id, date_from, date_to, fare_status, travel_status)"
    roles: [Rider, AgencyOfficer, Auditor]
    code: 200
    input: ["card_id?", "rider_id?", "date_from?", "date_to?", "fare_status?", "travel_status?", "limit?", "offset?"]
    output: "Trip[]"

  - method: POST
    path: "/transit/trips/{trip_id}/tap-out"
    description: "Tap out (TAPPED_IN→COMPLETED)"
    roles: [Rider]
    code: 200
    input: [tap_out_at, "version?"]
    output: Trip

  - method: GET
    path: "/transit/cap-periods"
    description: "List cap periods with filters (card_id, scope, window_from, window_to)"
    roles: [Rider, AgencyOfficer, Auditor]
    code: 200
    input: ["card_id?", "scope?", "window_from?", "window_to?", "limit?", "offset?"]
    output: "FareCapPeriod[]"

  - method: POST
    path: "/transit/fsa-accounts"
    description: "Open a CommuterBenefitAccount for a rider sponsored by an employer"
    roles: [EmployerAdmin]
    code: 201
    input: [rider_id, employer_id]
    output: CommuterBenefitAccount

  - method: POST
    path: "/transit/fsa-contributions"
    description: "Employer adds a contribution to a CommuterBenefitAccount; idempotent caps applied"
    roles: [EmployerAdmin]
    code: 201
    input: [account_id, amount_cents, contribution_month]
    output: FSAContribution
    side_effects: ["account.balance_cents incremented"]

  - method: POST
    path: "/transit/fsa-contributions/{contrib_id}/reverse"
    description: "Reverse a contribution (creates a negated FSAContribution)"
    roles: [EmployerAdmin]
    code: 201
    input: ["version?"]
    output: FSAContribution

  - method: POST
    path: "/transit/disputes"
    description: "File a dispute on a trip"
    roles: [Rider]
    code: 201
    input: [trip_id]
    output: DisputeCase

  - method: POST
    path: "/transit/disputes/{dispute_id}/claim"
    description: "AgencyOfficer claims a dispute (OPEN→INVESTIGATING)"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: DisputeCase

  - method: POST
    path: "/transit/disputes/{dispute_id}/request-evidence"
    description: "Cycle back to OPEN to await rider evidence (INVESTIGATING→OPEN)"
    roles: [AgencyOfficer]
    code: 200
    input: ["version?"]
    output: DisputeCase

  - method: POST
    path: "/transit/disputes/{dispute_id}/resolve"
    description: "Resolve a dispute (INVESTIGATING→RESOLVED_REFUNDED or RESOLVED_REJECTED)"
    roles: [AgencyOfficer]
    code: 200
    input: [decision, "version?"]
    output: DisputeCase

  - method: POST
    path: "/transit/_clock/advance"
    description: "Test-only: advance the server's logical clock to a given ISO 8601 UTC moment"
    roles: [AgencyOfficer, Auditor]
    code: 200
    input: [to]
    output: object

  - method: POST
    path: "/transit/_sweep/incomplete-trips"
    description: "Sweep: close any TAPPED_IN Trip whose tap_in_at + 180min <= now()"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: object

  - method: POST
    path: "/transit/_sweep/settle"
    description: "Sweep: for any cap_period whose window_end <= now(), recompute settled fares chronologically and apply refunds/back-charges"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: object

  - method: POST
    path: "/transit/_sweep/low-income-expiry"
    description: "Sweep: any LowIncomeVerification whose approved_at + 365d <= now() moves ACTIVE→EXPIRED"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: object

# §1.6 Error Code Catalog
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role not one of the declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign-key resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state that permits this operation"
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "FareCard.status != ACTIVE on tap-in"
  - id: ERR_TRIP_ALREADY_OPEN
    http: 409
    condition: "Another Trip on this card is already TAPPED_IN"
  - id: ERR_DUPLICATE_TAP
    http: 409
    condition: "Duplicate (card_id, idempotency_key) detected; original Trip returned with no new debit"
  - id: ERR_CARD_OUTSIDE_VALIDITY
    http: 422
    condition: "tap_in_at is outside [card.valid_from, card.valid_until]"
  - id: ERR_TAP_OUT_NOT_AFTER_TAP_IN
    http: 422
    condition: "tap_out_at is not strictly after tap_in_at"
  - id: ERR_MISSING_REDUCED_FARE_CERTIFICATE
    http: 409
    condition: "REDUCED_FARE card requested without an ACTIVE ReducedFareCertificate covering now()"
  - id: ERR_MISSING_LOW_INCOME_VERIFICATION
    http: 409
    condition: "LOW_INCOME card requested while Rider.low_income_verified is false"
  - id: ERR_CERTIFICATE_WINDOW_OVERLAP
    http: 409
    condition: "Two ReducedFareCertificates of the same program_type overlap on one rider"
  - id: ERR_DEVICE_ALREADY_BOUND
    http: 409
    condition: "(rider_id, device_fingerprint) uniqueness violation on MobilePaymentToken"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Amount is not strictly positive when required, or non-integer cents"
  - id: ERR_FSA_MONTHLY_CAP_EXCEEDED
    http: 409
    condition: "FSA monthly contribution sum would exceed Employer.monthly_contribution_cap_cents"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "Wallet + FSA together cannot cover provisional fare"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied version does not match current resource version"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit or offset outside allowed range"

# §1.7 RBAC Matrix
roles:
  - name: Rider
    description: "End user holding a FareCard; taps in/out, tops up, files disputes."
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /transit/trips (tap-in on a card whose rider_id == X-User-ID)"
      - "POST /transit/trips/{id}/tap-out (on own Trip)"
      - "POST /transit/disputes (on own Trip)"
      - "POST /transit/cards/{id}/close (on own card)"
      - "POST /transit/mobile-tokens (on own rider_id)"
    shared_operations:
      - "POST /transit/cards (Rider may issue own STANDARD or LOW_INCOME cards; AgencyOfficer may issue any)"
      - "POST /transit/cards/{id}/top-up (on own card)"
      - "POST /transit/mobile-tokens/{id}/revoke (on own token)"
      - "GET /transit/riders/{id} (own only)"
      - "GET /transit/cards/{id} (own only)"
      - "GET /transit/trips, GET /transit/trips/{id} (own only)"
      - "GET /transit/cap-periods (own card only)"
      - "POST /transit/low-income-verifications (on own rider_id)"

  - name: AgencyOfficer
    description: "Transit-agency staff who issue cards, approve certificates and low-income verifications, resolve disputes, and run sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /transit/riders"
      - "POST /transit/employers, /suspend"
      - "POST /transit/cards/{id}/suspend, /reactivate"
      - "POST /transit/reduced-fare-certificates, /approve, /revoke"
      - "POST /transit/low-income-verifications/{id}/approve"
      - "POST /transit/disputes/{id}/claim, /request-evidence, /resolve"
      - "POST /transit/_clock/advance, /_sweep/incomplete-trips, /_sweep/settle, /_sweep/low-income-expiry"
    shared_operations:
      - "POST /transit/cards (any rider, any class)"
      - "POST /transit/cards/{id}/top-up (any card)"
      - "POST /transit/mobile-tokens/{id}/revoke (any token)"
      - "GET endpoints with no rider restriction"
      - "POST /transit/low-income-verifications (on any rider)"

  - name: EmployerAdmin
    description: "Employer staff who manage CommuterBenefitAccount and FSAContribution. Scoped to a single employer_id."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /transit/fsa-accounts (employer_id must equal X-User-ID)"
      - "POST /transit/fsa-contributions (account.employer_id must equal X-User-ID)"
      - "POST /transit/fsa-contributions/{id}/reverse (same constraint)"
    shared_operations:
      - "GET /transit/employers/{id} (own employer only)"

  - name: Auditor
    description: "Read-only role for audit/oversight; sees all resources but mutates none."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints across all resources without rider/employer restriction"
