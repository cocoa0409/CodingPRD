scaffold_corner_design:
  # =====================================================================
  # Section 1: entities — creation, required fields, defaults, computed
  # fields, type constraints, immutability, FK integrity, not-found.
  # =====================================================================
  - section: entities
    instances:
      - name: permit_create_ignores_system_and_computed_fields
        claim_type: computed_fields
        grounds:
          - entities.Permit.fields.status
          - entities.Permit.fields.compliance_posture
          - entities.Permit.fields.open_corrective_action_count
          - entities.Permit.fields.open_exceedance_count
        distinguishing_aspect: |
          On POST /npdes/permits the server initializes status DRAFT, posture GOOD_STANDING, both
          counters 0, and version 1 regardless of any caller intent; the four common fields are
          server-minted.
        test_recipe:
          setup:
            - "Empty DB; logical clock at startup default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT1", facility_name: "System Fields Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "GET /npdes/permits/${p_id}", as: Any }
          assert:
            - "Permit.${p_id}.status == DRAFT"
            - "Permit.${p_id}.compliance_posture == GOOD_STANDING"
            - "Permit.${p_id}.open_corrective_action_count == 0 and .open_exceedance_count == 0"
            - "Permit.${p_id}.version == 1 and id / created_at / updated_at are server-minted"

      - name: outfall_create_applies_status_default
        claim_type: defaults
        grounds:
          - entities.Outfall.fields.status
        distinguishing_aspect: |
          POST /npdes/outfalls omits status; the default ACTIVE is applied and the outfall is
          retrievable via the permit-filtered list (FK reverse reachability).
        test_recipe:
          setup:
            - "Permit NPDES-ENT2 exists in DRAFT"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT2", facility_name: "Defaults Plant", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id } }
            - { call: "GET /npdes/outfalls", as: Any, captures: { first_id: "$.data[0].id"} }
          assert:
            - "Outfall.${o_id}.status == ACTIVE (default applied)"
            - "GET /npdes/outfalls?permit_id=${p_id} returns exactly 1 row whose id == ${first_id} == ${o_id}"

      - name: sampling_event_create_applies_defaults
        claim_type: defaults
        grounds:
          - entities.SamplingEvent.fields.collection_window_hours
          - entities.SamplingEvent.fields.schedule_status
          - entities.SamplingEvent.fields.custody_status
        distinguishing_aspect: |
          Omitting collection_window_hours applies default 24; the two parallel state dimensions
          initialize independently to SCHEDULED and NOT_SEALED.
        test_recipe:
          setup:
            - "ACTIVE permit with outfall 001 holding a TSS DAILY_MAX limit covering 2026-08-10"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT3", facility_name: "Defaults Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-10T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
          assert:
            - "SamplingEvent.${s_id}.collection_window_hours == 24 (default applied)"
            - "SamplingEvent.${s_id}.schedule_status == SCHEDULED and .custody_status == NOT_SEALED"
            - "SamplingEvent.${s_id}.collected_at is null and .collected_by_user_id is null"

      - name: limit_create_rejects_zero_limit_value_and_inverted_range
        claim_type: type_constraints
        grounds:
          - entities.EffluentLimit.fields.limit_value
          - entities.EffluentLimit.fields.effective_to
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two distinct ERR_INVALID_REQUEST shapes on POST /npdes/effluent-limits: limit_value == 0
          violates strictly > 0; effective_to == effective_from violates the strict ordering.
        test_recipe:
          setup:
            - "Permit in DRAFT with outfall 001 (version captured)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT4", facility_name: "Constraints Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { e1: $.data.error_id } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { e2: $.data.error_id } }
          assert:
            - "First call rejected: ${e1} == ERR_INVALID_REQUEST (http 400), no limit created"
            - "Second call rejected: ${e2} == ERR_INVALID_REQUEST (http 400), no limit created"
            - "Outfall.${o_id}.version still == ${o_v} (no side effects on rejected input)"

      - name: permit_create_rejects_expiration_not_after_effective
        claim_type: type_constraints
        grounds:
          - entities.Permit.fields.expiration_date
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /npdes/permits with expiration_date equal to effective_date violates the strict
          ordering and is rejected before any permit is persisted.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT5", facility_name: "Bad Dates Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-01-01T00:00:00Z" }, as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"
            - "GET /npdes/permits afterwards returns an empty list (no permit persisted)"

      - name: dmr_create_rejects_period_end_before_start
        claim_type: type_constraints
        grounds:
          - entities.DischargeMonitoringReport.fields.period_end
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /npdes/dmrs with period_end strictly before period_start is rejected with
          ERR_INVALID_REQUEST; no DMR row is created.
        test_recipe:
          setup:
            - "ACTIVE permit with one outfall"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT6", facility_name: "DMR Dates Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/dmrs", payload: { outfall_id: "${o_id}", period_start: "2026-08-31T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"

      - name: custody_record_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.ChainOfCustodyRecord
          - entities.ChainOfCustodyRecord.fields.sequence_index
        distinguishing_aspect: |
          ChainOfCustodyRecord has common_fields false: the response carries no version field,
          and the append-only chain orders by the monotonic 1-based sequence_index per sample.
        test_recipe:
          setup:
            - "ACTIVE permit; sample collected (SEAL record auto-appended) then TRANSFER appended"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT7", facility_name: "Custody Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-10T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler }
          trigger:
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-10T09:00:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler, captures: { rec2: $.data.sequence_index } }
            - { call: "GET /npdes/sampling-events/${s_id}/custody-events", as: Any, captures: { first_seq: "$.data[0].sequence_index", first_type: "$.data[0].event_type"} }
          assert:
            - "Auto-appended SEAL record: ${first_seq} == 1 and ${first_type} == SEAL; the TRANSFER record has ${rec2} == 2"
            - "The custody list contains exactly 2 records, ordered by sequence_index ascending"
            - "Each ChainOfCustodyRecord response carries no version field (common_fields false) and recorded_by_user_id echoes the caller's X-User-ID"

      - name: penalty_payment_immutable_ledger_line
        claim_type: immutability
        grounds:
          - entities.PenaltyPayment
          - entities.PenaltyPayment.fields.status
        distinguishing_aspect: |
          PenaltyPayment has common_fields false and a single POSTED status; there is no update or
          delete endpoint, so a posted ledger line can never be mutated.
        test_recipe:
          setup:
            - "FINAL consent order with outstanding_cents 1000 (setup via exceedance chain)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT8", facility_name: "Ledger Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", limit_type: "DAILY_MAX", limit_value: 1.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T09:10:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T09:20:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s_id}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-05T09:30:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s_id}", parameter_code: "COPPER", reported_value: 1.5, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 2.0, analyzed_at: "2026-08-05T09:45:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r_id}/validate", as: LabValidator, as_user_id: "validator-1", captures: { ex_id: $.data.exceedance_id } }
            - { call: "POST /npdes/consent-orders", payload: { exceedance_id: "${ex_id}", assessment_variant: "PER_DAY", base_penalty_cents: 1000, daily_accrual_cents: 0, statutory_cap_cents: 5000000 }, as: Regulator, captures: { co_id: $.data.id } }
            - { call: "POST /npdes/consent-orders/${co_id}/issue", as: Regulator }
            - { call: "POST /npdes/consent-orders/${co_id}/finalize", as: Regulator }
          trigger:
            - { call: "POST /npdes/consent-orders/${co_id}/payments", payload: { direction: "PAYMENT", amount_cents: 1000 }, as: ComplianceOfficer, captures: { pay_id: $.data.id } }
            - { call: "GET /npdes/consent-orders/${co_id}/payments", as: Any, captures: { first_pay: "$.data[0].id"} }
          assert:
            - "PenaltyPayment.${pay_id}.status == POSTED with direction PAYMENT, amount_cents 1000, posted_at == logical clock 2026-08-05T10:00:00Z"
            - "The payment ledger contains exactly 1 row and ${first_pay} == ${pay_id}; the entry carries no version field"
            - "ConsentOrder.${co_id}.paid_cents == 1000 and .outstanding_cents == 0"

      - name: outfall_create_rejected_when_permit_terminated
        claim_type: parent_relationships
        grounds:
          - entities.Outfall.fields.permit_id
          - validations[priority=27]
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: |
          Outfall creation is permitted only while the parent permit is DRAFT or ACTIVE; against a
          TERMINATED permit the same payload fails with ERR_PERMIT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Permit issued then terminated (status TERMINATED)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT9", facility_name: "Terminated Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/terminate", as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "002" }, as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NOT_ACTIVE (http 409)"

      - name: lab_result_create_rejected_with_unknown_sampling_event
        claim_type: parent_relationships
        grounds:
          - entities.LabResult.fields.sampling_event_id
          - validations[priority=3]
          - errors[ERR_SAMPLE_NOT_FOUND]
        distinguishing_aspect: |
          POST /npdes/lab-results referencing a non-existent sampling_event_id is rejected at the
          existence step before any custody or business check runs.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "00000000-0000-0000-0000-000000000000", parameter_code: "TSS", reported_value: 1.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 1.0, analyzed_at: "2026-08-05T09:00:00Z" }, as: LabAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SAMPLE_NOT_FOUND (http 404)"

      - name: get_permit_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_PERMIT_NOT_FOUND]
        distinguishing_aspect: "GET /npdes/permits/{id} with an unknown UUID returns the resource-specific 404."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /npdes/permits/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NOT_FOUND (http 404)"

      - name: get_outfall_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_OUTFALL_NOT_FOUND]
        distinguishing_aspect: "GET /npdes/outfalls/{id} with an unknown UUID returns ERR_OUTFALL_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /npdes/outfalls/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OUTFALL_NOT_FOUND (http 404)"

      - name: get_lab_result_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_RESULT_NOT_FOUND]
        distinguishing_aspect: "GET /npdes/lab-results/{id} with an unknown UUID returns ERR_RESULT_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /npdes/lab-results/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RESULT_NOT_FOUND (http 404)"

      - name: get_dmr_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_DMR_NOT_FOUND]
        distinguishing_aspect: "GET /npdes/dmrs/{id} with an unknown UUID returns ERR_DMR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /npdes/dmrs/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DMR_NOT_FOUND (http 404)"

      - name: get_consent_order_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_CONSENT_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /npdes/consent-orders/{id} with an unknown UUID returns ERR_CONSENT_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /npdes/consent-orders/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CONSENT_ORDER_NOT_FOUND (http 404)"

      - name: list_permits_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Permit
        distinguishing_aspect: |
          GET /npdes/permits?limit=2&offset=0 over three permits returns the fixed envelope with
          limit/offset/total_count/has_more populated and exactly 2 data rows.
        test_recipe:
          setup:
            - "Three permits created"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-PAG1", facility_name: "P1", receiving_water_body: "R", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-PAG2", facility_name: "P2", receiving_water_body: "R", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-PAG3", facility_name: "P3", receiving_water_body: "R", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager }
          trigger:
            - { call: "GET /npdes/permits?limit=2&offset=0", as: Any, captures: { first: "$.data[0].permit_number"} }
          assert:
            - "Response envelope carries meta.api_request_id and meta.api_request_timestamp"
            - "The page contains exactly 2 data rows; total_count == 3 and has_more == true"
            - "${first} == 'NPDES-PAG1'"

      - name: limit_create_rejects_bad_parameter_code_enum
        claim_type: type_constraints
        grounds:
          - entities.EffluentLimit.fields.parameter_code
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          parameter_code outside {BOD5, TSS, PH, AMMONIA_N, COPPER, FECAL_COLIFORM} is rejected with
          ERR_INVALID_REQUEST before any state or overlap check.
        test_recipe:
          setup:
            - "Permit DRAFT with outfall 001"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-ENT10", facility_name: "Enum Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "LEAD", limit_type: "DAILY_MAX", limit_value: 1.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"

  # =====================================================================
  # Section 2: state_machines — valid transitions, invalid-from rejections,
  # initial states, terminal lockdown, side effects, guarded transitions.
  # =====================================================================
  - section: state_machines
    instances:
      - name: permit_issue_success_from_draft
        claim_type: valid_transition
        grounds:
          - state_machines.Permit.DRAFT_to_ACTIVE
        distinguishing_aspect: "All four issue preconditions satisfied: DRAFT -> ACTIVE and version bumps from 1 to 2."
        test_recipe:
          setup:
            - "DRAFT permit (version 1) whose clock is inside [effective_date, expiration_date); one ACTIVE outfall holding one ACTIVE limit"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM1", facility_name: "Issue Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
          assert:
            - "Permit.${p_id}.status == ACTIVE"
            - "Permit.${p_id}.version == 2"

      - name: permit_issue_rejected_when_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.Permit.DRAFT_to_ACTIVE
          - errors[ERR_PERMIT_NOT_IN_DRAFT]
        distinguishing_aspect: "Second issue call on an already ACTIVE permit fails with ERR_PERMIT_NOT_IN_DRAFT."
        test_recipe:
          setup:
            - "Permit already issued (ACTIVE)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM2", facility_name: "Reissue Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NOT_IN_DRAFT (http 409)"

      - name: permit_issue_rejected_without_outfall
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Permit.DRAFT_to_ACTIVE
          - errors[ERR_PERMIT_NO_OUTFALL]
        distinguishing_aspect: "Issue on a DRAFT permit with zero outfalls fails with ERR_PERMIT_NO_OUTFALL."
        test_recipe:
          setup:
            - "DRAFT permit with no outfalls"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM3", facility_name: "No Outfall Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NO_OUTFALL (http 409)"
            - "Permit.${p_id}.status remains DRAFT"

      - name: permit_issue_rejected_when_outfall_lacks_active_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Permit.DRAFT_to_ACTIVE
          - errors[ERR_OUTFALL_NO_ACTIVE_LIMIT]
        distinguishing_aspect: "Issue with an ACTIVE outfall that has no ACTIVE limit fails with ERR_OUTFALL_NO_ACTIVE_LIMIT."
        test_recipe:
          setup:
            - "DRAFT permit with one ACTIVE outfall and no effluent limits"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM4", facility_name: "No Limit Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OUTFALL_NO_ACTIVE_LIMIT (http 409)"

      - name: permit_issue_rejected_before_effective_date
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Permit.DRAFT_to_ACTIVE
          - errors[ERR_PERMIT_NOT_ISSUABLE]
        distinguishing_aspect: "Logical clock before effective_date at issue fails with ERR_PERMIT_NOT_ISSUABLE."
        test_recipe:
          setup:
            - "DRAFT permit effective 2027-01-01 with outfall+limit; logical clock still 2026-08-01 (startup default)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM5", facility_name: "Future Mill", receiving_water_body: "Mill River", effective_date: "2027-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NOT_ISSUABLE (http 409)"

      - name: permit_terminate_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Permit.ACTIVE_to_TERMINATED
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: "Terminate on a DRAFT permit fails with ERR_PERMIT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "DRAFT permit"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM6", facility_name: "Draft Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/permits/${p_id}/terminate", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERMIT_NOT_ACTIVE (http 409)"

      - name: outfall_deactivate_success_cancels_scheduled_samples
        claim_type: side_effect_execution
        grounds:
          - state_machines.Outfall.ACTIVE_to_INACTIVE
        distinguishing_aspect: "Deactivation flips the outfall to INACTIVE and cascades the outfall's SCHEDULED sample to CANCELLED."
        test_recipe:
          setup:
            - "ACTIVE permit, outfall, limit; one SCHEDULED sampling event"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM7", facility_name: "Deactivate Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-20T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/outfalls/${o_id}/deactivate", as: EnvironmentalManager }
          assert:
            - "Outfall.${o_id}.status == INACTIVE and Outfall.version increments by 1"
            - "SamplingEvent.${s_id}.schedule_status == CANCELLED (cascade)"

      - name: outfall_reactivate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Outfall.INACTIVE_to_ACTIVE
          - errors[ERR_OUTFALL_NOT_INACTIVE]
        distinguishing_aspect: "Reactivate on an ACTIVE outfall fails with ERR_OUTFALL_NOT_INACTIVE."
        test_recipe:
          setup:
            - "Permit DRAFT with one ACTIVE outfall"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM8", facility_name: "Reactivate Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/outfalls/${o_id}/reactivate", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OUTFALL_NOT_INACTIVE (http 409)"

      - name: outfall_reactivate_blocked_when_permit_not_active
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Outfall.INACTIVE_to_ACTIVE
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: "Reactivate of an INACTIVE outfall whose parent permit is TERMINATED fails with ERR_PERMIT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Permit issued then terminated (its outfall cascaded to INACTIVE)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM9", facility_name: "Guard Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/terminate", as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/outfalls/${o_id}/reactivate", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "Outfall.${o_id}.status == INACTIVE before the call (terminated cascade)"
            - "${err} == ERR_PERMIT_NOT_ACTIVE (http 409)"

      - name: limit_rescind_compensates_predecessor
        claim_type: valid_transition
        grounds:
          - state_machines.EffluentLimit.ACTIVE_to_RESCINDED
          - state_machines.EffluentLimit.SUPERSEDED_to_ACTIVE
        distinguishing_aspect: "Rescinding the successor limit flips it to RESCINDED and restores its SUPERSEDED predecessor to ACTIVE (compensation, no drift)."
        test_recipe:
          setup:
            - "DRAFT permit; outfall with limit L1 (ACTIVE) and successor L2 created with supersedes_limit_id = L1 (L1 SUPERSEDED)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM10", facility_name: "Rescind Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { l1_id: $.data.id } }
            - { call: "GET /npdes/outfalls/${o_id}", as: Any, captures: { o_v2: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 8.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", supersedes_limit_id: "${l1_id}", expected_outfall_version: "${o_v2}" }, as: EnvironmentalManager, captures: { l2_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/effluent-limits/${l2_id}/rescind", as: EnvironmentalManager }
            - { call: "GET /npdes/effluent-limits/${l1_id}", as: Any, captures: { l1_status: $.data.status } }
          assert:
            - "EffluentLimit.${l2_id}.status == RESCINDED"
            - "${l1_status} == ACTIVE (predecessor restored)"
            - "Outfall.${o_id}.version incremented by the rescind"

      - name: limit_rescind_rejected_for_original_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EffluentLimit.ACTIVE_to_RESCINDED
          - errors[ERR_LIMIT_NOT_A_SUCCESSOR]
        distinguishing_aspect: "Rescind on an ACTIVE limit created without supersedes_limit_id fails with ERR_LIMIT_NOT_A_SUCCESSOR."
        test_recipe:
          setup:
            - "DRAFT permit; outfall with a single original ACTIVE limit"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM11", facility_name: "Original Limit Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { l1_id: $.data.id } }
          trigger:
            - { call: "POST /npdes/effluent-limits/${l1_id}/rescind", as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_LIMIT_NOT_A_SUCCESSOR (http 409)"

      - name: sample_collect_success_seals_custody
        claim_type: side_effect_execution
        grounds:
          - state_machines.SamplingEvent.SCHEDULED_to_COLLECTED
        distinguishing_aspect: "Collect flips schedule to COLLECTED, seals custody, stamps collected_at/collected_by_user_id, and auto-appends the SEAL custody record at sequence_index 1."
        test_recipe:
          setup:
            - "ACTIVE permit/outfall/limit; SCHEDULED sample whose window covers the logical clock"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM12", facility_name: "Collect Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-10T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler, as_user_id: "sampler-1" }
            - { call: "GET /npdes/sampling-events/${s_id}/custody-events", as: Any, captures: { first_seq: "$.data[0].sequence_index", first_type: "$.data[0].event_type"} }
          assert:
            - "SamplingEvent.${s_id}.schedule_status == COLLECTED and .custody_status == SEALED"
            - "SamplingEvent.${s_id}.collected_at == 2026-08-10T09:00:00Z and .collected_by_user_id == 'sampler-1'"
            - "Custody chain contains exactly 1 record: ${first_type} == SEAL at ${first_seq} == 1"

      - name: sample_collect_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SamplingEvent.SCHEDULED_to_COLLECTED
          - validations[priority=21]
          - errors[ERR_COLLECTION_WINDOW_CLOSED]
        distinguishing_aspect: "Collect one second after scheduled_for + collection_window_hours fails with ERR_COLLECTION_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "ACTIVE setup; sample scheduled 2026-08-10T08:00:00Z with default 24h window; clock at 2026-08-11T08:00:01Z"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM13", facility_name: "Late Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-10T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T08:00:01Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_COLLECTION_WINDOW_CLOSED (http 422)"

      - name: sample_cancel_after_collect_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SamplingEvent.SCHEDULED_to_CANCELLED
          - errors[ERR_SAMPLE_NOT_SCHEDULED]
        distinguishing_aspect: "Cancel on a COLLECTED sample fails with ERR_SAMPLE_NOT_SCHEDULED."
        test_recipe:
          setup:
            - "Sample already collected"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-SM14", facility_name: "Cancel Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-10T08:00:00Z" }, as: FieldSampler, captures: { s_id: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s_id}/collect", as: FieldSampler }
          trigger:
            - { call: "POST /npdes/sampling-events/${s_id}/cancel", as: FieldSampler, captures: { err: $.data.error_id } }
          assert:
