- rule_id: combinatorial_formula
  instances:
  - name: tiered_portfolio_pricing_straddles_tiers_with_org_factor
    grounds:
    - calculations.portfolio_price_quote
    - entities.Portfolio.fields.quoted_price_cents
    distinguishing_aspect: 'Mode (a): the quote combines 3+ inputs (eligible face value, tier schedule, org-type factor) with non-linear tier
      interaction: face 250000000 straddles tiers 1 and 2, giving 2500000 + 2250000 = 4750000 for a HOSPITAL seller - not the 6250000 a flat 2.5%
      rate would give.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - HOSPITAL org; ACTIVE policy; portfolio with two eligible accounts (balances 150000000 and 100000000, incomes 1000000, size 1, not reported).
      - Portfolio submitted, screened.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      - call: POST /api/eligibility-policies/${pol_id}/activate
        payload: {}
        as: EligibilityOfficer
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Big bundle
          face_value_cents: 250000000
          asking_price_cents: 5000000
        as: PortfolioAnalyst
        captures:
          pf2_id: $.data.id
      - call: POST /api/portfolios/${pf2_id}/accounts
        payload:
          accounts:
          - external_ref: T1
            debtor_household_key: HT1
            debtor_zip: '75010'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 150000000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 10 A St
          - external_ref: T2
            debtor_household_key: HT2
            debtor_zip: '75011'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 100000000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 11 B St
        as: PortfolioAnalyst
        captures:
          t1: $.data[0].id
          t2: $.data[1].id
      - call: POST /api/portfolios/${pf2_id}/submit
        payload: {}
        as: PortfolioAnalyst
      - call: POST /api/portfolios/${pf2_id}/screening-runs
        payload:
          policy_id: ${pol_id}
        as: EligibilityOfficer
        captures:
          run2_id: $.data.id
      - call: POST /api/screening-runs/${run2_id}/execute
        payload: {}
        as: EligibilityOfficer
      trigger:
      - call: POST /api/portfolios/${pf2_id}/price-quote
        payload: {}
        as: PortfolioAnalyst
      assert:
      - Portfolio.${pf2_id}.eligible_face_value_cents == 250000000
      - Portfolio.${pf2_id}.quoted_price_cents == 4750000 (100000000*0.025 + 150000000*0.015, HOSPITAL factor 1.0)
      - Portfolio.${pf2_id}.quoted_price_cents != 6250000 (the flat-rate 2.5% value the tiered formula must NOT produce)
      - Portfolio.${pf2_id}.status == PRICED
  - name: donation_fee_rounded_per_item_then_summed
    grounds:
    - calculations.donation_netting
    - entities.Donation.fields.fee_cents
    - entities.DonorCampaign.fields.raised_cents
    distinguishing_aspect: 'Mode (b) nested rounding (different mode than the tiered pricing instance): fee_cents is rounded per donation THEN
      nets are summed - two 3333-cent gifts raise 6472, whereas the forbidden sum-then-round order would produce 6473.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One GENERAL campaign with goal 10000000.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/donor-campaigns
        payload:
          name: Rounding Fund
          earmark_type: GENERAL
          goal_cents: 10000000
        as: DonorRelationsOfficer
        captures:
          rcamp: $.data.id
      trigger:
      - call: POST /api/donor-campaigns/${rcamp}/donations
        payload:
          donor_name: R1
          donor_email: r1@x.com
          gross_cents: 3333
        as: DonorRelationsOfficer
        captures:
          rd1: $.data.id
      - call: POST /api/donations/${rd1}/receive
        payload: {}
        as: FinanceOfficer
      - call: POST /api/donor-campaigns/${rcamp}/donations
        payload:
          donor_name: R2
          donor_email: r2@x.com
          gross_cents: 3333
        as: DonorRelationsOfficer
        captures:
          rd2: $.data.id
      - call: POST /api/donations/${rd2}/receive
        payload: {}
        as: FinanceOfficer
      - call: GET /api/donor-campaigns/${rcamp}
        payload: {}
        as: FinanceOfficer
      assert:
      - Donation.${rd1}.fee_cents == 97 and Donation.${rd1}.net_cents == 3236 (round_half_up(3333*0.029) = 97)
      - Donation.${rd2}.fee_cents == 97 and Donation.${rd2}.net_cents == 3236
      - DonorCampaign.${rcamp}.raised_cents == 6472 (per-item rounding)
      - DonorCampaign.${rcamp}.raised_cents != 6473 (the sum-then-round value that is forbidden)
- rule_id: non_linear_state_machine
  instances:
  - name: notification_letter_bounce_requeue_cycle_to_undeliverable
    grounds:
    - state_machines.NotificationLetter
    - entities.NotificationLetter.fields.attempt_count
    distinguishing_aspect: 'NotificationLetter entity: QUEUED -> SENT -> BOUNCED -> QUEUED is a cycle (different entity than the CreditDeletionRequest
      cycle instance); the third bounce forces the terminal UNDELIVERABLE at attempt_count == 3.'
    test_recipe:
      setup:
      - Finalized batch over A1 (reported) and A2 from the standard chain; A1's letter located via GET /api/notification-letters?batch_id.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - call: GET /api/notification-letters
        payload:
          batch_id: ${batch_id}
        as: DonorRelationsOfficer
        captures:
          letter_a1: $.data[0].id
      trigger:
      - call: POST /api/notification-letters/${letter_a1}/send
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/mark-bounced
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/requeue
        payload:
          corrected_address: 5 Fixed Ln
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/send
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/mark-bounced
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/requeue
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/send
        payload: {}
        as: DonorRelationsOfficer
      - call: POST /api/notification-letters/${letter_a1}/mark-bounced
        payload: {}
        as: DonorRelationsOfficer
      - call: GET /api/notification-letters/${letter_a1}
        payload: {}
        as: DonorRelationsOfficer
      assert:
      - 'After bounce 1: status BOUNCED, attempt_count == 1, then requeue -> QUEUED with mailing_address == ''5 Fixed Ln'''
      - 'After bounce 2: status BOUNCED, attempt_count == 2'
      - 'After bounce 3: NotificationLetter.${letter_a1}.status == UNDELIVERABLE and attempt_count == 3 (terminal, no further requeue)'
  - name: credit_deletion_reject_resubmit_cycle_to_failed
    grounds:
    - state_machines.CreditDeletionRequest
    - entities.CreditDeletionRequest.fields.resubmission_count
    - entities.DebtAccount.fields.bureau_status
    distinguishing_aspect: 'CreditDeletionRequest entity: SUBMITTED -> REJECTED -> SUBMITTED is a cycle (different entity than the letter cycle);
      rejection at resubmission_count == 2 forces terminal FAILED and flips the account bureau dimension to DELETION_FAILED.'
    test_recipe:
      setup:
      - Finalized batch over A1 (reported EQUIFAX); the auto-created CDR located via GET /api/credit-deletion-requests?account_id.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - call: GET /api/credit-deletion-requests
        payload:
          account_id: ${a1}
        as: ComplianceAuditor
        captures:
          cdr1: $.data[0].id
      trigger:
      - call: POST /api/credit-deletion-requests/${cdr1}/reject
        payload:
          rejection_reason: tradeline mismatch
        as: ComplianceAuditor
      - call: POST /api/credit-deletion-requests/${cdr1}/resubmit
        payload: {}
        as: ComplianceAuditor
      - call: POST /api/credit-deletion-requests/${cdr1}/reject
        payload:
          rejection_reason: still mismatch
        as: ComplianceAuditor
      - call: POST /api/credit-deletion-requests/${cdr1}/resubmit
        payload: {}
        as: ComplianceAuditor
