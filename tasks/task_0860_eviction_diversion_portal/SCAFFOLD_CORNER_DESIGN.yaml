              payload: { case_id: "${case_id}", basis: "DISMISSAL" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { seal_id: $.data.id }
            - call: "POST /sealing-requests/${seal_id}/transition"
              payload: { to_status: "GRANTED" }
              as: Judge
              as_user_id: "judge-1"
          trigger:
            - call: "GET /cases?tenant_id=${tn_id}"
              as: Clerk
            - call: "GET /cases?tenant_id=${tn_id}&include_sealed=true"
              as: Clerk
          assert:
            - "GET /cases?tenant_id=${tn_id} data does NOT contain case ${case_id}"
            - "GET /cases?tenant_id=${tn_id}&include_sealed=true data CONTAINS case ${case_id}"

