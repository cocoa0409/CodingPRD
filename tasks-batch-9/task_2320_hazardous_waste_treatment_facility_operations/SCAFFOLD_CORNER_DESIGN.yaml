        grounds:
          - state_machines.facility_permit_lifecycle.terminal_states
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          TERMINATED is terminal: once the inspector terminates an expired permit, no later GRANT can
          resurrect the facility, so the permit-decision endpoint must refuse every action rather
          than re-open an entity whose units have already been cascaded into closure.
        test_recipe:
          setup:
            - "Facility whose permit expires 2026-08-15; clock moved to 2026-08-16 so it is EXPIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
