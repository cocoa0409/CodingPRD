              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/cycle-01-v1.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 9, caption_languages: [], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/remediation-request"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/resubmit"
              payload: { source_uri: "s3://mez/cycle-01-v2.mxf", artifact_defect_count: 9, caption_languages: [] }
              as: ContentOps
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/remediation-request"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/resubmit"
              payload: { source_uri: "s3://mez/cycle-01-v3.mxf", artifact_defect_count: 9, caption_languages: [] }
              as: ContentOps
          trigger:
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
          assert:
            - "the first trigger call returns 201 and MezzanineAsset.${a_id}.qc_state == QC_REJECTED"
            - "MezzanineAsset.${a_id}.qc_attempt_count == 3"
            - "MezzanineAsset.${a_id}.blocking_defect_code == MULTI_DEFECT"
            - "MezzanineAsset.${a_id}.latest_severity_index == 66.00"
            - "the qc-reports list contains exactly 3 reports with attempt_number 1, 2 and 3 in ascending order"
            - "every returned QualityControlReport has verdict == FAIL, severity_index == 66.00, artifact_penalty == 36.00, caption_coverage_pct == 0.00, loudness_deviation_db == 0.00 and blocking_defect_code == MULTI_DEFECT"
            - "the third trigger call returns 409 with error_id ERR_ASSET_STATE_INVALID"
            - "Title.${t_id}.readiness_score_provisional == 0.00"
            - "Title.${t_id}.readiness_score_certified == 0.00"

