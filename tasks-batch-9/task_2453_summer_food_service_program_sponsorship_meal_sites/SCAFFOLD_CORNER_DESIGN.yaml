# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2453_summer_food_service_program_sponsorship_meal_sites
#
# Walked row-by-row against references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are that section's table rows. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no test_recipe.
scaffold_corner_design:
  - section: entities
    instances:
      - name: sponsor_creation_returns_201_with_initial_derived_fields
        claim_type: creation
        grounds:
          - entities.Sponsor
          - endpoints[POST /sfsp/sponsors]
          - state_machines.Sponsor.initial_state
        distinguishing_aspect: "POST /sfsp/sponsors with all required fields returns 201 with application_status DRAFT, advance_outstanding_cents 0, site_count 0 and a server-minted id."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Sponsor.${sp_id}.application_status == DRAFT"
            - "Sponsor.${sp_id}.advance_outstanding_cents == 0"
            - "Sponsor.${sp_id}.site_count == 0"
            - "Sponsor.${sp_id}.version == 1 and created_at == 2026-06-01T00:00:00Z"

      - name: sponsor_retrieval_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /sfsp/sponsors/{sponsor_id}]
          - entities.Sponsor
        distinguishing_aspect: "GET /sfsp/sponsors/{sponsor_id} echoes exactly the stored legal_name, sponsor_type, experience_status and program_year that POST persisted."
        test_recipe:
          setup:
            - "One Sponsor created at clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
          trigger:
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { name_read: $.data.legal_name }
          assert:
            - "HTTP status == 200"
            - "${name_read} == Riverbend Community Alliance"
            - "Response body data.sponsor_type == NONPROFIT and data.experience_status == EXPERIENCED and data.program_year == 2026"

      - name: site_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /sfsp/sites]
          - response_envelope.list
        distinguishing_aspect: "GET /sfsp/sites?sponsor_id=&limit=2&offset=0 returns exactly 2 items with total_count 3 and has_more true, and offset=2 returns 1 item with has_more false, ordered by created_at ASC."
        test_recipe:
          setup:
            - "Sponsor APPROVED; one AreaEligibilityRecord; three sites created in the order Alpha, Bravo, Charlie."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Alpha Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_a: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Bravo Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_b: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Charlie Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_c: $.data.id }
          trigger:
            - call: "GET /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", limit: 2, offset: 0 }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "Response total_count == 3, has_more == true, len(data) == 2"
            - "${first_id} == ${site_a} (created_at ASC ordering)"
            - "data[1].id == ${site_b}"
            - "GET /sfsp/sites?sponsor_id=${sp_id}&limit=2&offset=2 returns len(data) == 1, data[0].id == ${site_c}, has_more == false, total_count == 3"

      - name: get_sponsor_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /sfsp/sponsors/{sponsor_id}]
          - validations[priority=4]
          - errors[ERR_SPONSOR_NOT_FOUND]
        distinguishing_aspect: "GET /sfsp/sponsors/sp_does_not_exist returns 404 ERR_SPONSOR_NOT_FOUND and no entity is created as a side effect."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "GET /sfsp/sponsors/sp_does_not_exist"
              payload: {}
              as: StateAgencyReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_SPONSOR_NOT_FOUND"

      - name: site_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Site.fields.site_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sfsp/sites omitting the required site_type returns 400 ERR_INVALID_REQUEST and Sponsor.site_count stays 0."
        test_recipe:
          setup:
            - "Sponsor APPROVED with one AreaEligibilityRecord and zero sites."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
          trigger:
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "No Type Park", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "Sponsor.${sp_id}.site_count == 0"
            - "GET /sfsp/sites?sponsor_id=${sp_id} returns total_count == 0"

      - name: site_creation_omitting_optional_flags_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Site.fields.is_open_air
          - entities.Site.fields.is_rural
          - entities.Site.fields.claim_hold
          - entities.Site.fields.voided_day_count
        distinguishing_aspect: "POST /sfsp/sites omitting the optional is_open_air and is_rural flags stores false for both, and the site starts with claim_hold false, voided_day_count 0, operating_status NOT_STARTED."
        test_recipe:
          setup:
            - "Sponsor APPROVED with one AreaEligibilityRecord."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
          trigger:
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Defaults Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Site.${site_id}.is_open_air == false and Site.${site_id}.is_rural == false"
            - "Site.${site_id}.approval_status == PENDING_REVIEW and Site.${site_id}.operating_status == NOT_STARTED"
            - "Site.${site_id}.claim_hold == false and Site.${site_id}.voided_day_count == 0 and Site.${site_id}.eligibility_basis == UNDETERMINED"
            - "Sponsor.${sp_id}.site_count == 1"

      - name: site_creation_client_supplied_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Site.fields.eligibility_basis
          - entities.Site.fields.voided_day_count
          - entities.Site.fields.id
          - entities.Site.fields.created_at
        distinguishing_aspect: "POST /sfsp/sites is accepted while silently ignoring client-sent id, created_at, eligibility_basis and voided_day_count: the response carries a server-minted id, created_at 2026-06-01T00:00:00Z, eligibility_basis UNDETERMINED and voided_day_count 0."
        test_recipe:
          setup:
            - "Sponsor APPROVED with one AreaEligibilityRecord; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
          trigger:
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Injected Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true, id: "site_client_chosen", created_at: "2020-01-01T00:00:00Z", eligibility_basis: "AREA_ELIGIBLE", voided_day_count: 99 }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${site_id} != site_client_chosen"
            - "Site.${site_id}.created_at == 2026-06-01T00:00:00Z"
            - "Site.${site_id}.eligibility_basis == UNDETERMINED (not the injected AREA_ELIGIBLE)"
            - "Site.${site_id}.voided_day_count == 0 (not the injected 99)"
            - "GET /sfsp/sites/site_client_chosen returns 404 ERR_SITE_NOT_FOUND"

      - name: area_record_invalid_enum_data_source_rejected
        claim_type: type_constraints
        grounds:
          - entities.AreaEligibilityRecord.fields.data_source
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sfsp/area-eligibility-records with data_source GUESSWORK — outside the declared enum {SCHOOL_DATA, CENSUS_ACS} — returns 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "GUESSWORK", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"

      - name: meal_count_entry_is_immutable_append_only_with_no_version
        claim_type: immutability
        grounds:
          - entities.MealCountEntry
          - endpoints[GET /sfsp/meal-count-entries/{entry_id}]
          - endpoints[GET /sfsp/meal-count-entries]
        distinguishing_aspect: "MealCountEntry is declared common_fields: false, so its GET response carries id and created_at but no updated_at and no version, and §1.5 exposes no update or delete endpoint for it — corrections happen only by appending a REVERSAL row."
        test_recipe:
          setup:
            - "Sponsor APPROVED; one rural SELF_PREP site APPROVED and OPERATING; MealServiceDay 2026-06-08 OPEN with one ORIGINAL count entry of 30 LUNCH first meals."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Riverbend Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
            - call: "POST /sfsp/sites/${site_id}/eligibility-determination"
              payload: {}
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/meal-service-days"
              payload: { site_id: "${site_id}", service_date: "2026-06-08", meal_services: [{ meal_type: "LUNCH", planned_meals: 150, service_start: "11:30", service_end: "12:30" }] }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /sfsp/meal-service-days/${d1_id}/open"
              payload: { production_counts: { LUNCH: 150 }, food_received_at: "2026-06-08T10:30:00Z" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${d1_id}/meal-counts"
              payload: { meal_type: "LUNCH", first_meals: 30, second_meals: 0, adult_meals: 0 }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { mc_id: $.data.id }
          trigger:
            - call: "GET /sfsp/meal-count-entries/${mc_id}"
              payload: {}
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { entry_kind_read: $.data.entry_kind }
          assert:
            - "HTTP status == 200"
            - "${entry_kind_read} == ORIGINAL"
            - "Response data contains id and created_at (== 2026-06-08T08:00:00Z) but no updated_at key and no version key"
            - "MealCountEntry.${mc_id}.reimbursable_first_meals == 30 and MealServiceDay.${d1_id}.counted_first_meals == 30"

      - name: site_creation_with_unknown_area_record_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Site.fields.area_eligibility_record_id
          - validations[priority=5]
          - errors[ERR_AREA_RECORD_NOT_FOUND]
        distinguishing_aspect: "POST /sfsp/sites naming area_eligibility_record_id aer_missing returns 404 ERR_AREA_RECORD_NOT_FOUND rather than creating an orphan site."
        test_recipe:
          setup:
            - "Sponsor APPROVED; no AreaEligibilityRecord rows exist."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Orphan Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "aer_missing", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_AREA_RECORD_NOT_FOUND"
            - "Sponsor.${sp_id}.site_count == 0"

      - name: claim_line_item_requires_matching_sponsor_site_hybrid_topology
        claim_type: parent_relationships
        grounds:
          - validations[priority=38]
          - errors[ERR_SITE_SPONSOR_MISMATCH]
          - entities.ClaimLineItem.fields.site_id
        distinguishing_aspect: "The graph topology cross_aggregate reference is integrity-checked: POST /sfsp/meal-claims/{claim_id}/line-items with a site belonging to a different sponsor returns 422 ERR_SITE_SPONSOR_MISMATCH."
        test_recipe:
          setup:
            - "Sponsor A APPROVED with a DRAFT June claim; Sponsor B APPROVED with its own APPROVED, OPERATING site that has a FINALIZED 2026-06-08 day."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
