# =============================================================================
# SCAFFOLD — Interfacility Transfer & Bed Placement (hospital transfer center)
# =============================================================================

scenario: "Interfacility Transfer & Bed Placement (hospital transfer center): EMTALA obligation determination & documentation, sending/receiving physician communication & acceptance, transport mode selection (ground/air) & crew capability, insurance notification vs emergency exception, clinical packet transfer & imaging exchange, bed hold & arrival tracking, refusal/diversion documentation, transfer outcome & quality review"

domain_name: interfacility-transfer-bed-placement
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation      # sending vs receiving physician accept/refuse negotiation rounds
  secondary_archetype: compliance_audit           # EMTALA documentation, refusal records, quality review trail
  complexity_layers:
    - optimistic_concurrency                      # OCC on TransferCase.version (bed-hold supersede) and ClinicalPacket.version (document upload)
    - cascading_side_effects                      # arrive/refuse/cancel trigger multi-entity mutation chains
    - dual_variant_calculation                    # optimistic vs conservative ETT; clinical-intent vs operational duration
    - selector_policy                             # server-side bed selection: eligibility filter + ranking + tie-break + empty-pool error
  entity_topology: flat                           # peer entities joined by foreign keys; no URL nesting except sub-resource reads
  state_machine_shape: cyclic                     # TransferCase refusal/re-request loop + dispatch revert; EmtalaScreening certify/amend loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties               # quality reviewer must not be a case physician; facility managers scoped to own facility
  consistency_model: immediate                    # all side effects atomic within the triggering request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: facility_code, type: string, source: input, description: "Unique facility code", constraints: "unique across all facilities" }
      - { name: trauma_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 | COMMUNITY | CRITICAL_ACCESS" }
      - { name: capabilities, type: array, source: input, description: "Array of capability strings, e.g. CARDIAC_CATH, NICU, BURN, STROKE, TRAUMA" }
      - { name: diversion_status, type: enum, source: computed, description: "OPEN | SOFT_DIVERSION | HARD_DIVERSION — HARD_DIVERSION when any DiversionEvent of this facility has effective_status ACTIVE with scope ALL_UNITS; SOFT_DIVERSION when any ACTIVE event has scope SPECIFIC_UNIT (and none ALL_UNITS); else OPEN" }
      - { name: operational_bed_count, type: integer, source: computed, description: "Count of this facility's Bed rows with status != OUT_OF_SERVICE" }
      - { name: unavailable_bed_count, type: integer, source: computed, description: "Count of this facility's Bed rows with status IN (HELD, OCCUPIED)" }
      - { name: occupancy_pct, type: number, source: computed, description: "round_half_up(unavailable_bed_count / operational_bed_count * 100, 2dp); 100.0 when operational_bed_count == 0" }

  - name: Bed
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: bed_code, type: string, source: input, description: "Facility-local bed code, e.g. ICU-04; used as final selector tie-break (ASC)" }
      - { name: unit_type, type: enum, source: input, description: "ICU | CVICU | NICU | PICU | TELEMETRY | MED_SURG | BURN | ED_HOLD" }
      - { name: isolation_capable, type: boolean, source: input, default: false, description: "Whether the bed supports isolation precautions" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | HELD | OCCUPIED | OUT_OF_SERVICE — HELD only via BedHold lifecycle, never via PUT /beds/{id}" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician display name" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; home facility of the physician" }
      - { name: specialty, type: enum, source: input, description: "EMERGENCY | CARDIOLOGY | NEUROLOGY | SURGERY | INTENSIVIST | PEDIATRICS | GENERAL" }
      - { name: is_on_call, type: boolean, source: input, default: true, description: "Whether the physician is currently on call" }

  - name: TransferCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_ref, type: string, source: input, description: "De-identified patient reference token (no PHI)" }
      - { name: sending_facility_id, type: string, source: input, description: "FK -> Facility.id; facility transferring the patient out" }
      - { name: sending_physician_id, type: string, source: input, description: "FK -> Physician.id; physician at the sending facility responsible for the case" }
      - { name: receiving_facility_id, type: string, source: system, description: "FK -> Facility.id; set by request-acceptance / re-request; null until first request" , default: null }
      - { name: receiving_physician_id, type: string, source: system, description: "FK -> Physician.id; set by request-acceptance / re-request; null until first request", default: null }
      - { name: acuity_level, type: enum, source: input, description: "CRITICAL | EMERGENT | URGENT | STABLE" }
      - { name: required_unit_type, type: enum, source: input, description: "ICU | CVICU | NICU | PICU | TELEMETRY | MED_SURG | BURN | ED_HOLD — unit the receiving bed must have" }
      - { name: requires_isolation, type: boolean, source: input, default: false, description: "Whether the receiving bed must be isolation_capable" }
      - { name: required_capability, type: string, source: input, description: "Capability string the receiving facility must list in capabilities" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | EMTALA_DETERMINED | AWAITING_ACCEPTANCE | ACCEPTED | TRANSPORT_ARRANGED | EN_ROUTE | ARRIVED | COMPLETED | REFUSED | CANCELLED" }
      - { name: emtala_obligation, type: enum, source: computed, default: UNDETERMINED, description: "UNDETERMINED | EMTALA_APPLIES | EMTALA_NOT_APPLIES | EMERGENCY_EXCEPTION — mirrored from the certified EmtalaScreening.determination; reset to UNDETERMINED when the screening is amended" }
      - { name: emtala_determined_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the screening certification that moved the case INTAKE -> EMTALA_DETERMINED" }
      - { name: active_bed_hold_id, type: string, source: system, default: null, description: "id of the currently ACTIVE BedHold for this case, or null" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Increments by 1 on each request-acceptance and each re-request" }
      - { name: refusal_count, type: integer, source: computed, default: 0, description: "Count of RefusalRecord rows for this case" }

  - name: EmtalaScreening
    parent: null
    common_fields: true
    fields:
      - { name: transfer_case_id, type: string, source: input, description: "FK -> TransferCase.id; exactly one screening per case (singleton)" }
      - { name: has_emergency_medical_condition, type: boolean, source: input, description: "Whether an emergency medical condition (EMC) exists" }
      - { name: is_stabilized, type: boolean, source: input, description: "Whether the EMC is stabilized within the sending facility's capability" }
      - { name: benefits_outweigh_risks, type: boolean, source: input, default: false, description: "Physician certification that transfer benefits outweigh risks; required true when unstable" }
      - { name: physician_certification, type: string, source: input, default: "", description: "Certification narrative; must be >= 30 characters when the patient is unstable" }
      - { name: determination, type: enum, source: computed, description: "EMTALA_NOT_APPLIES when has_emergency_medical_condition == false; EMTALA_APPLIES when EMC && is_stabilized; EMERGENCY_EXCEPTION when EMC && !is_stabilized" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CERTIFIED | AMENDED" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent certification" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Increments by 1 on each amend" }

  - name: PhysicianCommunication
    parent: null
    common_fields: false
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id" }
      - { name: from_physician_id, type: string, source: system, description: "FK -> Physician.id; the case's sending_physician_id at creation" }
      - { name: to_physician_id, type: string, source: system, description: "FK -> Physician.id; the receiving physician addressed this round" }
      - { name: round, type: integer, source: system, description: "TransferCase.negotiation_round value this communication belongs to" }
      - { name: contact_method, type: enum, source: input, description: "PHONE | SECURE_MESSAGE | TELEMEDICINE" }
      - { name: notes, type: string, source: input, default: "", description: "Optional call notes" }
      - { name: outcome, type: enum, source: system, default: PENDING, description: "PENDING | ACCEPTED | REFUSED | VOIDED — VOIDED when the case is cancelled while PENDING" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of accept/refuse response" }

  - name: BedHold
    parent: null
    common_fields: true
    fields:
      - { name: bed_id, type: string, source: system, description: "FK -> Bed.id; the held bed (selector-chosen on accept, client-chosen on manual create)" }
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CONFIRMED | RELEASED | EXPIRED" }
      - { name: hold_started_at, type: datetime, source: system, description: "Logical-clock timestamp at hold creation" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "hold_started_at + HOLD_MINUTES[case.acuity_level]; CRITICAL=60, EMERGENT=120, URGENT=240, STABLE=480" }
      - { name: release_reason, type: enum, source: system, default: null, description: "MANUAL | SUPERSEDED | CASE_CANCELLED | ARRIVAL_CONFIRMED | EXPIRED" }

  - name: TransportDispatch
    parent: null
    common_fields: true
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id" }
      - { name: mode, type: enum, source: input, description: "GROUND_BLS | GROUND_ALS | AIR_ROTOR | AIR_FIXED_WING" }
      - { name: crew_capability, type: enum, source: input, description: "BLS | ALS | CCT | CRITICAL_CARE (ordered BLS < ALS < CCT < CRITICAL_CARE)" }
      - { name: distance_miles, type: number, source: input, description: "Road/great-circle distance in miles; must be > 0" }
      - { name: estimated_minutes_optimistic, type: integer, source: computed, description: "transport_ett_estimate variant optimistic" }
      - { name: estimated_minutes_conservative, type: integer, source: computed, description: "transport_ett_estimate variant conservative" }
      - { name: actual_duration_minutes, type: integer, source: computed, default: null, description: "floor((arrived_at - departed_at) in seconds / 60); set at arrival" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "DISPATCHED | EN_ROUTE | ARRIVED | CANCELLED" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp of dispatch creation" }
      - { name: departed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of departure" }
      - { name: arrived_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of arrival" }

  - name: InsuranceNotification
    parent: null
    common_fields: true
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id; at most one non-VOIDED notification per case" }
      - { name: payer_id, type: string, source: input, description: "Payer identifier" }
      - { name: channel, type: enum, source: input, description: "PORTAL | PHONE | FAX" }
      - { name: sla_due_at, type: datetime, source: computed, description: "case.emtala_determined_at + SLA_MINUTES[case.emtala_obligation]: EMTALA_APPLIES=60, EMERGENCY_EXCEPTION=60, EMTALA_NOT_APPLIES=240" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the payer was notified" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | NOTIFIED | EXCEPTION_CLAIMED | VOIDED" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "true iff status == NOTIFIED and notified_at > sla_due_at (strictly greater; notification exactly at sla_due_at is on time); false for all other statuses" }
      - { name: exception_reason, type: enum, source: input, default: null, description: "UNSTABLE_EMC | NO_PAYER_IDENTIFIABLE | CLINICAL_URGENCY — set by claim-exception" }

  - name: ClinicalPacket
    parent: null
    common_fields: true
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id; exactly one packet per case (singleton)" }
      - { name: required_documents, type: array, source: input, description: "Non-empty array of document codes from H_AND_P | LABS | MED_RECONCILIATION | CODE_STATUS | CONSENT | TRANSFER_CERT" }
      - { name: received_documents, type: array, source: system, default: [], description: "Accumulated document codes; union-only, duplicates ignored" }
      - { name: imaging_studies, type: array, source: input, default: [], description: "Array of {study_ref, modality} objects the receiving facility requires" }
      - { name: exchanged_study_refs, type: array, source: system, default: [], description: "study_ref values confirmed exchanged via imaging-exchange; union-only" }
      - { name: document_status, type: enum, source: computed, description: "DOCUMENTS_COMPLETE when required_documents ⊆ received_documents, else INCOMPLETE" }
      - { name: imaging_status, type: enum, source: computed, description: "IMAGING_COMPLETE when every imaging_studies[].study_ref is in exchanged_study_refs (vacuously true when imaging_studies is empty), else IMAGING_PENDING" }
      - { name: overall_status, type: enum, source: computed, description: "READY when document_status == DOCUMENTS_COMPLETE and imaging_status == IMAGING_COMPLETE, else INCOMPLETE" }

  - name: RefusalRecord
    parent: null
    common_fields: false
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; the refusing (receiving) facility" }
      - { name: refusing_physician_id, type: string, source: system, description: "FK -> Physician.id; the receiving physician who refused" }
      - { name: refusal_category, type: enum, source: input, description: "NO_BED_AVAILABLE | CAPABILITY_UNAVAILABLE | DIVERSION_ACTIVE | UNSTABLE_FOR_TRANSFER | CAPACITY_EXCEEDED" }
      - { name: narrative, type: string, source: input, description: "Refusal narrative; must be >= 50 characters" }
      - { name: emtala_risk_score, type: integer, source: computed, description: "refusal_emtala_risk score at creation" }
      - { name: emtala_risk_flag, type: enum, source: computed, description: "HIGH when emtala_risk_score >= 70; ELEVATED when 40 <= score < 70; LOW when score < 40" }
      - { name: round, type: integer, source: system, description: "Negotiation round in which the refusal occurred" }

  - name: TransferOutcome
    parent: null
    common_fields: false
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id; exactly one outcome per case (singleton, created at arrival)" }
      - { name: arrival_condition, type: enum, source: input, description: "STABLE | DETERIORATED | CRITICAL_DECLINE" }
      - { name: deterioration_en_route, type: boolean, source: input, description: "Whether the patient deteriorated during transport" }
      - { name: receiving_physician_confirmed, type: boolean, source: input, description: "Whether the receiving physician confirmed arrival condition" }
      - { name: door_to_arrival_minutes, type: integer, source: computed, description: "floor((arrived_at - case.emtala_determined_at) in seconds / 60) — clinical-intent variant of transfer_duration_measurement" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of arrival recording" }

  - name: QualityReview
    parent: null
    common_fields: true
    fields:
      - { name: transfer_case_id, type: string, source: system, description: "FK -> TransferCase.id" }
      - { name: trigger, type: enum, source: system, description: "ROUTINE (on complete) | REFUSAL_RISK (on refuse of EMTALA_APPLIES case) | DETERIORATION (on arrive with deterioration_en_route)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | CLOSED" }
      - { name: reviewer_physician_id, type: string, source: system, default: null, description: "FK -> Physician.id; set from X-User-ID at begin; must differ from the case's sending and receiving physicians" }
      - { name: timeliness_score, type: number, source: computed, default: null, description: "max(0, 100 - max(0, door_to_arrival_minutes - 240) * 0.25); 0 when the case never arrived; stored rounded to 0dp round_half_up per quality_composite_score" }
      - { name: documentation_score, type: number, source: computed, default: null, description: "100 * |received ∩ required| / |required_documents| of the case's ClinicalPacket; 100 when required_documents empty; 0 when no packet exists; stored rounded to 0dp round_half_up" }
      - { name: protocol_score, type: number, source: computed, default: null, description: "max(0, 100 - 20*refusal_count - 30*(any is_late notification) - 40*(any EXPIRED hold)); stored rounded to 0dp round_half_up" }
      - { name: composite_score, type: number, source: computed, default: null, description: "quality_composite_score: per-dimension integer rounding then weighted sum (see calculations)" }
      - { name: outcome, type: enum, source: input, default: null, description: "CONCURRENCE | MINOR_VARIANCE | MAJOR_VARIANCE | SENTINEL_EVENT — set at close" }
      - { name: findings, type: string, source: input, default: null, description: "Review findings narrative; must be >= 30 characters at close" }

  - name: DiversionEvent
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; the diverting facility" }
      - { name: scope, type: enum, source: input, description: "ALL_UNITS | SPECIFIC_UNIT" }
      - { name: unit_type, type: enum, source: input, default: null, description: "ICU | CVICU | NICU | PICU | TELEMETRY | MED_SURG | BURN | ED_HOLD — required iff scope == SPECIFIC_UNIT, forbidden otherwise" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive window start (closed-interval semantics)" }
      - { name: ends_at, type: datetime, source: input, description: "Inclusive window end; must be strictly greater than starts_at" }
      - { name: reason, type: string, source: input, description: "Diversion reason narrative" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "true when created by the occupancy-saturation rule (reason AUTO_OCCUPANCY_SATURATION)" }
      - { name: lifted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of manual lift or saturation auto-lift" }
      - { name: effective_status, type: enum, source: computed, description: "LIFTED when lifted_at set; else EXPIRED when clock >= ends_at; else ACTIVE when clock >= starts_at; else SCHEDULED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TransferCase
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: EMTALA_DETERMINED
        trigger: "POST /transfer-cases/{id}/emtala-screening/certify"
        actor: SendingPhysician
        preconditions:
          - "case.status == INTAKE (ERR_INVALID_STATE)"
          - "screening exists for the case (ERR_SCREENING_NOT_FOUND)"
          - "screening.status IN (DRAFT, AMENDED) (ERR_INVALID_STATE)"
          - "X-User-ID == case.sending_physician_id (ERR_NOT_CASE_PHYSICIAN)"
          - "when determination would be EMERGENCY_EXCEPTION: benefits_outweigh_risks == true AND length(physician_certification) >= 30 (ERR_CERTIFICATION_INSUFFICIENT)"
        side_effects:
          - "screening.status -> CERTIFIED; screening.certified_at := clock"
          - "case.emtala_obligation := screening.determination"
          - "case.emtala_determined_at := clock"
          - "case.version += 1"
      - from: EMTALA_DETERMINED
        to: INTAKE
        trigger: "POST /transfer-cases/{id}/emtala-screening/amend"
        actor: SendingPhysician
        preconditions:
          - "case.status == EMTALA_DETERMINED (ERR_SCREENING_LOCKED when the case has advanced past EMTALA_DETERMINED; ERR_INVALID_STATE when INTAKE)"
          - "screening.status == CERTIFIED (ERR_INVALID_STATE)"
          - "X-User-ID == case.sending_physician_id (ERR_NOT_CASE_PHYSICIAN)"
        side_effects:
          - "screening.status -> AMENDED; screening.amendment_count += 1; amended field values applied"
          - "case.emtala_obligation := UNDETERMINED; case.emtala_determined_at := null"
          - "case.version += 1"
        note: "Re-certification replays INTAKE -> EMTALA_DETERMINED with the amended values."
      - from: EMTALA_DETERMINED
        to: AWAITING_ACCEPTANCE
        trigger: "POST /transfer-cases/{id}/request-acceptance"
        actor: TransferCoordinator
        preconditions:
          - "case.status == EMTALA_DETERMINED (ERR_INVALID_STATE)"
          - "receiving_facility_id != case.sending_facility_id (ERR_SAME_FACILITY_TRANSFER)"
          - "receiving facility exists (ERR_FACILITY_NOT_FOUND) and lists case.required_capability in capabilities (ERR_CAPABILITY_MISMATCH)"
          - "receiving physician exists (ERR_PHYSICIAN_NOT_FOUND) and physician.facility_id == receiving_facility_id (ERR_PHYSICIAN_FACILITY_MISMATCH)"
        side_effects:
          - "PhysicianCommunication created: outcome PENDING, round := case.negotiation_round + 1, from := sending_physician_id, to := receiving_physician_id"
          - "case.receiving_facility_id / receiving_physician_id := request values"
          - "case.negotiation_round += 1; case.version += 1"
      - from: REFUSED
        to: AWAITING_ACCEPTANCE
        trigger: "POST /transfer-cases/{id}/re-request"
        actor: TransferCoordinator
        preconditions:
          - "case.status == REFUSED (ERR_INVALID_STATE)"
          - "same facility/capability/physician checks as request-acceptance, evaluated against the NEW receiving_facility_id / receiving_physician_id"
        side_effects:
          - "new PhysicianCommunication created (outcome PENDING, round := negotiation_round + 1)"
          - "case.receiving_facility_id / receiving_physician_id := new request values"
          - "case.negotiation_round += 1; case.version += 1"
        note: "Cyclic negotiation: a refused case may be re-shopped to a different receiving facility any number of times."
      - from: AWAITING_ACCEPTANCE
        to: ACCEPTED
        trigger: "POST /transfer-cases/{id}/accept"
        actor: ReceivingPhysician
        preconditions:
          - "case.status == AWAITING_ACCEPTANCE (ERR_INVALID_STATE)"
          - "X-User-ID == case.receiving_physician_id (ERR_NOT_CASE_PHYSICIAN)"
          - "no DiversionEvent of case.receiving_facility_id with effective_status == ACTIVE and (scope == ALL_UNITS or (scope == SPECIFIC_UNIT and unit_type == case.required_unit_type)) (ERR_FACILITY_ON_DIVERSION)"
          - "bed_selector finds an eligible bed (ERR_NO_ELIGIBLE_BED)"
        side_effects:
          - "current-round PhysicianCommunication.outcome -> ACCEPTED; responded_at := clock"
          - "bed_selector runs on the receiving facility; selected Bed.status AVAILABLE -> HELD"
          - "BedHold created: status ACTIVE, hold_started_at := clock, hold_expires_at per hold_expiry_minutes"
          - "case.active_bed_hold_id := new hold id; case.version += 1"
          - "receiving Facility occupancy fields recomputed; occupancy_saturation_rule evaluated (may auto-create DiversionEvent)"
      - from: AWAITING_ACCEPTANCE
        to: REFUSED
        trigger: "POST /transfer-cases/{id}/refuse"
        actor: ReceivingPhysician
        preconditions:
          - "case.status == AWAITING_ACCEPTANCE (ERR_INVALID_STATE)"
          - "X-User-ID == case.receiving_physician_id (ERR_NOT_CASE_PHYSICIAN)"
          - "length(narrative) >= 50 (ERR_NARRATIVE_TOO_SHORT)"
        side_effects:
          - "current-round PhysicianCommunication.outcome -> REFUSED; responded_at := clock"
          - "RefusalRecord created with emtala_risk_score / emtala_risk_flag per refusal_emtala_risk; round := case.negotiation_round"
          - "case.refusal_count recomputed; case.version += 1"
          - "when case.emtala_obligation == EMTALA_APPLIES and no QualityReview with status IN (OPEN, UNDER_REVIEW) exists for the case: QualityReview created (trigger REFUSAL_RISK, status OPEN)"
      - from: ACCEPTED
        to: TRANSPORT_ARRANGED
        trigger: "POST /transfer-cases/{id}/dispatch"
        actor: TransferCoordinator
        preconditions:
          - "case.status == ACCEPTED (ERR_INVALID_STATE)"
          - "crew_capability >= CREW_REQUIRED[case.acuity_level] (CRITICAL->CCT, EMERGENT->ALS, URGENT->BLS, STABLE->BLS) (ERR_CREW_CAPABILITY_INSUFFICIENT)"
          - "mode AIR_ROTOR requires distance_miles >= 30; mode AIR_FIXED_WING requires distance_miles >= 100 (ERR_AIR_DISTANCE_BELOW_MINIMUM)"
          - "case ClinicalPacket exists and overall_status == READY (ERR_PACKET_INCOMPLETE)"
          - "case.active_bed_hold_id references a hold that is ACTIVE with hold_expires_at > clock — a hold whose hold_expires_at <= clock flips to EXPIRED and this check fails (ERR_BED_HOLD_EXPIRED)"
          - "an InsuranceNotification for the case exists with status IN (NOTIFIED, EXCEPTION_CLAIMED) (ERR_INSURANCE_NOT_CLEARED)"
        side_effects:
          - "TransportDispatch created: status DISPATCHED, dispatched_at := clock, both ETT estimate variants computed"
          - "case.version += 1"
      - from: TRANSPORT_ARRANGED
        to: EN_ROUTE
        trigger: "POST /transfer-cases/{id}/depart"
        actor: TransferCoordinator
        preconditions:
          - "case.status == TRANSPORT_ARRANGED (ERR_INVALID_STATE)"
          - "latest dispatch for the case has status DISPATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "dispatch.status -> EN_ROUTE; dispatch.departed_at := clock"
          - "case.version += 1"
      - from: TRANSPORT_ARRANGED
        to: ACCEPTED
        trigger: "POST /transport-dispatches/{id}/cancel"
        actor: TransferCoordinator
        preconditions:
          - "dispatch.status == DISPATCHED (ERR_DISPATCH_NOT_CANCELLABLE)"
          - "case.status == TRANSPORT_ARRANGED (ERR_INVALID_STATE)"
        side_effects:
          - "dispatch.status -> CANCELLED"
          - "case reverts to ACCEPTED so a different mode/crew can be dispatched; case.version += 1"
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /transfer-cases/{id}/arrive"
        actor: TransferCoordinator
        preconditions:
          - "case.status == EN_ROUTE (ERR_INVALID_STATE)"
          - "active dispatch status == EN_ROUTE (ERR_INVALID_STATE)"
        side_effects:
          - "dispatch.status -> ARRIVED; arrived_at := clock; actual_duration_minutes computed"
          - "BedHold ACTIVE -> CONFIRMED (release_reason ARRIVAL_CONFIRMED); its mutation flips Bed HELD -> OCCUPIED"
          - "receiving Facility occupancy fields recomputed from the bed flip; occupancy_saturation_rule evaluated (may auto-create DiversionEvent)"
          - "TransferOutcome created; door_to_arrival_minutes computed from case.emtala_determined_at"
          - "when deterioration_en_route == true and no QualityReview with status IN (OPEN, UNDER_REVIEW) exists: QualityReview created (trigger DETERIORATION, status OPEN)"
          - "case.active_bed_hold_id retained for audit; case.version += 1"
      - from: ARRIVED
        to: COMPLETED
        trigger: "POST /transfer-cases/{id}/complete"
        actor: TransferCoordinator
        preconditions:
          - "case.status == ARRIVED (ERR_INVALID_STATE)"
        side_effects:
          - "when no QualityReview with status IN (OPEN, UNDER_REVIEW) exists for the case: QualityReview created (trigger ROUTINE, status OPEN)"
          - "case.version += 1"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["case.status IN (INTAKE, EMTALA_DETERMINED, AWAITING_ACCEPTANCE, REFUSED, ACCEPTED, TRANSPORT_ARRANGED) (ERR_INVALID_STATE)"]
        side_effects:
          - "ACTIVE BedHold -> RELEASED (release_reason CASE_CANCELLED); its mutation flips Bed HELD -> AVAILABLE; receiving Facility occupancy recomputed; occupancy_saturation_rule evaluated (may auto-lift auto-created diversions)"
          - "InsuranceNotification with status IN (PENDING, NOTIFIED, EXCEPTION_CLAIMED) -> VOIDED"
          - "DISPATCHED TransportDispatch -> CANCELLED"
          - "PENDING PhysicianCommunication -> VOIDED"
          - "case.version += 1"
      - from: EMTALA_DETERMINED
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["same cancellable-set check (ERR_INVALID_STATE)"]
        side_effects: ["same compensation set as INTAKE -> CANCELLED (only entities that exist are affected)"]
      - from: AWAITING_ACCEPTANCE
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["same cancellable-set check (ERR_INVALID_STATE)"]
        side_effects: ["same compensation set as INTAKE -> CANCELLED"]
      - from: REFUSED
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["same cancellable-set check (ERR_INVALID_STATE)"]
        side_effects: ["same compensation set as INTAKE -> CANCELLED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["same cancellable-set check (ERR_INVALID_STATE)"]
        side_effects: ["same compensation set as INTAKE -> CANCELLED"]
      - from: TRANSPORT_ARRANGED
        to: CANCELLED
        trigger: "POST /transfer-cases/{id}/cancel"
        actor: TransferCoordinator
        preconditions: ["same cancellable-set check (ERR_INVALID_STATE)"]
        side_effects: ["same compensation set as INTAKE -> CANCELLED"]

  - entity: EmtalaScreening
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /transfer-cases/{id}/emtala-screening/certify"
        actor: SendingPhysician
        preconditions: ["screening.status IN (DRAFT, AMENDED) (ERR_INVALID_STATE)", "EMERGENCY_EXCEPTION certification completeness (ERR_CERTIFICATION_INSUFFICIENT)"]
        side_effects: ["screening.certified_at := clock", "cascades into TransferCase INTAKE -> EMTALA_DETERMINED"]
      - from: AMENDED
        to: CERTIFIED
        trigger: "POST /transfer-cases/{id}/emtala-screening/certify"
        actor: SendingPhysician
        preconditions: ["same as DRAFT -> CERTIFIED"]
        side_effects: ["same as DRAFT -> CERTIFIED"]
      - from: CERTIFIED
        to: AMENDED
        trigger: "POST /transfer-cases/{id}/emtala-screening/amend"
        actor: SendingPhysician
        preconditions: ["case.status == EMTALA_DETERMINED (ERR_SCREENING_LOCKED once the case advanced; ERR_INVALID_STATE when INTAKE)"]
        side_effects: ["amendment_count += 1", "cascades into TransferCase EMTALA_DETERMINED -> INTAKE"]

  - entity: BedHold
    initial_state: ACTIVE
    terminal_states: [CONFIRMED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONFIRMED
        trigger: "system (TransferCase EN_ROUTE -> ARRIVED)"
        actor: system
        preconditions: []
        side_effects: ["release_reason := ARRIVAL_CONFIRMED", "Bed HELD -> OCCUPIED", "occupancy recompute + saturation evaluation"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /bed-holds/{id}/release, or supersede by a new hold, or case cancellation"
        actor: BedManager | system
        preconditions:
          - "manual release: hold.status == ACTIVE (ERR_HOLD_NOT_ACTIVE) and case.status == ACCEPTED (ERR_INVALID_STATE) and X-User-ID == hold.bed.facility_id (ERR_NOT_FACILITY_MANAGER)"
        side_effects: ["release_reason := MANUAL | SUPERSEDED | CASE_CANCELLED", "Bed HELD -> AVAILABLE", "case.active_bed_hold_id := null when it referenced this hold", "occupancy recompute + saturation evaluation"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: any read or write that touches the hold while clock >= hold_expires_at AND the case is still in ACCEPTED status)"
        actor: system
        preconditions: ["clock >= hold_expires_at", "case.status == ACCEPTED (holds of dispatched cases never expire)"]
        side_effects: ["release_reason := EXPIRED", "Bed HELD -> AVAILABLE", "case.active_bed_hold_id := null; case.version += 1", "occupancy recompute + saturation evaluation"]
        note: "Half-open occupation: the hold occupies [hold_started_at, hold_expires_at); at clock == hold_expires_at the hold no longer blocks the bed."

  - entity: TransportDispatch
    initial_state: DISPATCHED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "POST /transfer-cases/{id}/depart"
        actor: TransferCoordinator
        preconditions: ["dispatch.status == DISPATCHED (ERR_INVALID_STATE)"]
        side_effects: ["departed_at := clock"]
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /transfer-cases/{id}/arrive"
        actor: TransferCoordinator
        preconditions: ["dispatch.status == EN_ROUTE (ERR_INVALID_STATE)"]
        side_effects: ["arrived_at := clock", "actual_duration_minutes := floor((arrived_at - departed_at) seconds / 60)"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /transport-dispatches/{id}/cancel or case cancellation"
        actor: TransferCoordinator | system
        preconditions: ["dispatch.status == DISPATCHED (ERR_DISPATCH_NOT_CANCELLABLE)"]
        side_effects: ["case TRANSPORT_ARRANGED -> ACCEPTED when cancelled directly"]

  - entity: PhysicianCommunication
    initial_state: PENDING
    terminal_states: [ACCEPTED, REFUSED, VOIDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /transfer-cases/{id}/accept"
        actor: ReceivingPhysician
        preconditions: []
        side_effects: ["responded_at := clock"]
      - from: PENDING
        to: REFUSED
        trigger: "POST /transfer-cases/{id}/refuse"
        actor: ReceivingPhysician
        preconditions: []
        side_effects: ["responded_at := clock"]
      - from: PENDING
        to: VOIDED
        trigger: "system (case cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsuranceNotification
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /insurance-notifications/{id}/notify"
        actor: TransferCoordinator
        preconditions: ["status == PENDING (ERR_INVALID_STATE)"]
        side_effects: ["notified_at := clock", "is_late recomputed"]
      - from: PENDING
        to: EXCEPTION_CLAIMED
        trigger: "POST /insurance-notifications/{id}/claim-exception"
        actor: TransferCoordinator
        preconditions: ["status == PENDING (ERR_INVALID_STATE)"]
        side_effects: ["exception_reason := request value", "is_late := false"]
      - from: PENDING
        to: VOIDED
        trigger: "system (case cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTIFIED
        to: VOIDED
        trigger: "system (case cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCEPTION_CLAIMED
        to: VOIDED
        trigger: "system (case cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QualityReview
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /quality-reviews/{id}/begin"
        actor: QualityReviewer
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "X-User-ID != case.sending_physician_id AND X-User-ID != case.receiving_physician_id (ERR_REVIEWER_CONFLICT_OF_INTEREST)"
        side_effects: ["reviewer_physician_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /quality-reviews/{id}/close"
        actor: QualityReviewer
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID == reviewer_physician_id (ERR_NOT_REVIEWER)"
          - "length(findings) >= 30 (ERR_FINDINGS_TOO_SHORT)"
        side_effects: ["timeliness_score / documentation_score / protocol_score / composite_score computed per quality_composite_score", "outcome := request value"]

  - entity: DiversionEvent
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, LIFTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (clock reaches starts_at; effective_status is computed from the logical clock on every read)"
        actor: system
        preconditions: []
        side_effects: ["Facility.diversion_status recomputed"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock reaches ends_at)"
        actor: system
        preconditions: []
        side_effects: ["Facility.diversion_status recomputed"]
      - from: SCHEDULED
        to: LIFTED
        trigger: "POST /diversion-events/{id}/lift or saturation auto-lift"
        actor: BedManager | system
        preconditions: ["effective_status IN (SCHEDULED, ACTIVE) (ERR_INVALID_STATE)", "manual lift: X-User-ID == event.facility_id (ERR_NOT_FACILITY_MANAGER)"]
        side_effects: ["lifted_at := clock", "Facility.diversion_status recomputed"]
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /diversion-events/{id}/lift or saturation auto-lift (occupancy_pct < 90.0 lifts auto_created events)"
        actor: BedManager | system
        preconditions: ["effective_status IN (SCHEDULED, ACTIVE) (ERR_INVALID_STATE)"]
        side_effects: ["lifted_at := clock", "Facility.diversion_status recomputed"]

  - entity: Bed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "system (BedHold creation)"
        actor: system
        preconditions: []
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: HELD
        to: AVAILABLE
        trigger: "system (hold RELEASED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: HELD
        to: OCCUPIED
        trigger: "system (hold CONFIRMED at arrival)"
        actor: system
        preconditions: []
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "PUT /beds/{id}"
        actor: BedManager
        preconditions: ["X-User-ID == bed.facility_id (ERR_NOT_FACILITY_MANAGER)", "status transition AVAILABLE <-> OCCUPIED <-> OUT_OF_SERVICE only; HELD is never set via PUT and a HELD bed rejects PUT (ERR_INVALID_STATE)"]
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "PUT /beds/{id}"
        actor: BedManager
        preconditions: ["same as above"]
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "PUT /beds/{id}"
        actor: BedManager
        preconditions: ["same as above"]
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: OCCUPIED
        to: OUT_OF_SERVICE
        trigger: "PUT /beds/{id}"
        actor: BedManager
        preconditions: ["same as above"]
        side_effects: ["occupancy recompute + saturation evaluation"]
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "PUT /beds/{id}"
        actor: BedManager
        preconditions: ["same as above"]
        side_effects: ["occupancy recompute + saturation evaluation"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: bedhold-create-stale-case
    parent_entity: TransferCase
    write_endpoint: "POST /transfer-cases/{id}/bed-holds"
    occ_field: expected_transfer_case_version
    description: |
      Creating a BedHold against a TransferCase whose version has advanced
      since the client last observed it is rejected. A successful hold creation
      supersedes (auto-releases) any prior ACTIVE hold and bumps the case
      version, so a client holding a pre-supersede version is writing against
      a stale case view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: packet-docs-stale-packet
    parent_entity: ClinicalPacket
    write_endpoint: "POST /clinical-packets/{id}/documents"
    occ_field: expected_clinical_packet_version
    description: |
      Appending documents to a ClinicalPacket whose version has advanced since
      the client last observed it is rejected. Each successful document upload
      bumps the packet version, so a stale expected version means the client
      merged against an outdated document set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: facility_occupancy
    trigger: "any Bed status change (hold create/confirm/release/expire, PUT /beds/{id})"
    algorithm: aggregation
    formula: |
      operational_bed_count = count(Bed of facility with status != OUT_OF_SERVICE)
      unavailable_bed_count = count(Bed of facility with status IN (HELD, OCCUPIED))
      occupancy_pct = round_half_up(unavailable_bed_count / operational_bed_count * 100, 2)
      when operational_bed_count == 0: occupancy_pct = 100.0
    input_set: "all Bed rows of the facility, any status"
    precision: "2 decimal places, round_half_up"

  - name: occupancy_saturation_rule
    trigger: "immediately after every facility_occupancy recompute"
    algorithm: threshold
    formula: |
      if occupancy_pct >= SATURATION_ENTER_PCT and no DiversionEvent of the facility
        with effective_status == ACTIVE and scope == ALL_UNITS exists:
        create DiversionEvent(scope=ALL_UNITS, starts_at=clock, ends_at=clock+4h,
                              reason="AUTO_OCCUPANCY_SATURATION", auto_created=true)
      if occupancy_pct < SATURATION_EXIT_PCT:
        for each DiversionEvent of the facility with auto_created == true,
            scope == ALL_UNITS, effective_status == ACTIVE: lifted_at := clock
      hysteresis band [90.0, 95.0): no automatic change in either direction
    constants:
      SATURATION_ENTER_PCT: 95.0    # >= boundary: exactly 95.00 triggers
      SATURATION_EXIT_PCT: 90.0     # < boundary: exactly 90.00 does NOT lift
      AUTO_DIVERSION_HOURS: 4

  - name: hold_expiry_minutes
    trigger: "BedHold creation"
    algorithm: threshold
    formula: |
      hold_expires_at = hold_started_at + HOLD_MINUTES[case.acuity_level]
      the hold blocks its bed over the half-open interval [hold_started_at, hold_expires_at):
      at clock == hold_expires_at the hold is EXPIRED (no longer blocks)
    constants:
      HOLD_MINUTES: { CRITICAL: 60, EMERGENT: 120, URGENT: 240, STABLE: 480 }

  - name: transport_ett_estimate
    trigger: "TransportDispatch creation"
    algorithm: tiered_pricing
    formula: |
      base_minutes  = ceil(distance_miles / SPEED_MPH[mode] * 60)
      optimistic    = base_minutes + MODE_OVERHEAD[mode]
      conservative  = ceil(base_minutes * 1.25) + MODE_OVERHEAD[mode]
                      + CREW_BUFFER[crew_capability]
                      + (10 if case.acuity_level == CRITICAL else 0)
    constants:
      SPEED_MPH: { GROUND_BLS: 40, GROUND_ALS: 45, AIR_ROTOR: 120, AIR_FIXED_WING: 160 }
      MODE_OVERHEAD: { GROUND_BLS: 10, GROUND_ALS: 10, AIR_ROTOR: 25, AIR_FIXED_WING: 45 }
      CREW_BUFFER: { BLS: 0, ALS: 0, CCT: 10, CRITICAL_CARE: 15 }
    precision: "integer minutes; ceil applied exactly where stated"
    variants:
      - name: optimistic
        when: "stored on estimated_minutes_optimistic"
        difference: "no crew buffer, no acuity surcharge, no 1.25 inflation"
      - name: conservative
        when: "stored on estimated_minutes_conservative"
        difference: "ceil(base*1.25) plus crew buffer plus CRITICAL surcharge — always >= optimistic and strictly greater whenever any buffer applies"

  - name: transfer_duration_measurement
    trigger: "TransferOutcome creation (clinical_intent) and dispatch arrival (operational)"
    algorithm: chronological
    formula: |
      clinical_intent_minutes = floor((arrived_at - case.emtala_determined_at).seconds / 60)
      operational_minutes     = floor((arrived_at - departed_at).seconds / 60)
    input_set: "the case's emtala_determined_at, the active dispatch's departed_at and arrived_at"
    precision: "integer minutes, floor"
    variants:
      - name: clinical_intent
        when: "stored on TransferOutcome.door_to_arrival_minutes; feeds QualityReview.timeliness_score"
        difference: "measures from EMTALA determination (decision to transfer) to arrival"
      - name: operational
        when: "stored on TransportDispatch.actual_duration_minutes"
        difference: "measures wheels-rolling departure to arrival — always strictly smaller than clinical_intent when departures lag determination"

  - name: bed_selector
    trigger: "POST /transfer-cases/{id}/accept (automatic) — manual hold creation takes an explicit bed_id instead"
    algorithm: constraint_propagation
    formula: |
      eligibility: bed.facility_id == case.receiving_facility_id
                   AND bed.status == AVAILABLE
                   AND bed.unit_type == case.required_unit_type
                   AND (case.requires_isolation == false OR bed.isolation_capable == true)
      ranking:     (1) isolation preservation — when case.requires_isolation == false,
                       beds with isolation_capable == false rank before isolation_capable == true;
                   (2) created_at ASC (oldest bed first);
                   (3) tie-break: bed_code ASC (lexicographic)
      empty pool:  reject the accept with ERR_NO_ELIGIBLE_BED
    input_set: "all Bed rows of the receiving facility"

  - name: insurance_notification_sla
    trigger: "InsuranceNotification creation (sla_due_at) and notify (is_late)"
    algorithm: threshold
    formula: |
      sla_due_at = case.emtala_determined_at + SLA_MINUTES[case.emtala_obligation]
      is_late = (status == NOTIFIED) AND (notified_at > sla_due_at)
      — strictly greater: a notification exactly at sla_due_at is on time
    constants:
      SLA_MINUTES: { EMTALA_APPLIES: 60, EMERGENCY_EXCEPTION: 60, EMTALA_NOT_APPLIES: 240 }

  - name: refusal_emtala_risk
    trigger: "RefusalRecord creation"
    algorithm: weighted_scoring
    formula: |
      score = CATEGORY_BASE[refusal_category]
            + OBLIGATION_ADD[case.emtala_obligation]
            + 10 * min(prior_refusal_count_for_this_case, 3)
      emtala_risk_flag = HIGH when score >= 70; ELEVATED when 40 <= score < 70; LOW when score < 40
    constants:
      CATEGORY_BASE: { NO_BED_AVAILABLE: 30, CAPABILITY_UNAVAILABLE: 25, DIVERSION_ACTIVE: 40, UNSTABLE_FOR_TRANSFER: 10, CAPACITY_EXCEEDED: 20 }
      OBLIGATION_ADD: { EMTALA_APPLIES: 50, EMERGENCY_EXCEPTION: 20, EMTALA_NOT_APPLIES: 0, UNDETERMINED: 0 }
    precision: "integer score; >= 70 boundary: exactly 70 is HIGH"

  - name: quality_composite_score
    trigger: "POST /quality-reviews/{id}/close"
    algorithm: weighted_scoring
    formula: |
      timeliness_score    = max(0, 100 - max(0, door_to_arrival_minutes - TARGET_MINUTES) * PENALTY_PER_MINUTE)
                            (0 when the case never produced a TransferOutcome)
      documentation_score = 100 * |received_documents ∩ required_documents| / |required_documents|
                            (100 when required_documents is empty; 0 when no ClinicalPacket exists)
      protocol_score      = max(0, 100 - 20*case.refusal_count
                            - 30*(1 if any case notification has is_late == true else 0)
                            - 40*(1 if any case BedHold has status == EXPIRED else 0))
      ROUNDING ORDER IS PINNED (nested rounding, order matters):
        1. round each dimension score to 0 decimal places, round_half_up, and STORE
           the rounded integer on the review (T_r, D_r, P_r = stored timeliness_score,
           documentation_score, protocol_score)
        2. composite_score = round_half_up(0.40*T_r + 0.35*D_r + 0.25*P_r, 2)
      (weighted sum of the unrounded dimensions, rounded once, yields different values
       and is NOT the specified behavior)
    constants:
      TARGET_MINUTES: 240
      PENALTY_PER_MINUTE: 0.25
      W_TIMELINESS: 0.40
      W_DOCUMENTATION: 0.35
      W_PROTOCOL: 0.25
    precision: "dimensions: 0dp round_half_up; composite: 2dp round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 2.5
    category: auth
    check: "Request body schema: required fields present, types correct, enum members valid, minimum lengths met (refusal narrative >= 50 chars, review findings >= 30 chars), ends_at > starts_at, distance_miles > 0, required_documents non-empty, unit_type present iff scope == SPECIFIC_UNIT"
    error_id: "ERR_INVALID_REQUEST / ERR_NARRATIVE_TOO_SHORT / ERR_FINDINGS_TOO_SHORT"
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 3
    category: existence
    check: "Path-template ids must exist, validated left-to-right; body foreign keys (bed_id, receiving_facility_id, receiving_physician_id, sending_physician_id, sending_facility_id) must exist"
    error_id: "ERR_FACILITY_NOT_FOUND / ERR_PHYSICIAN_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_BED_NOT_FOUND / ERR_SCREENING_NOT_FOUND / ERR_COMMUNICATION_NOT_FOUND / ERR_HOLD_NOT_FOUND / ERR_DISPATCH_NOT_FOUND / ERR_NOTIFICATION_NOT_FOUND / ERR_PACKET_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_DIVERSION_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.25
    category: auth
    check: "Entity-backed identity: SendingPhysician endpoints require X-User-ID == case.sending_physician_id; ReceivingPhysician accept/refuse require X-User-ID == case.receiving_physician_id; BedManager endpoints require X-User-ID == target facility id; QualityReview begin rejects a reviewer who is a case physician; close requires X-User-ID == reviewer_physician_id"
    error_id: "ERR_NOT_CASE_PHYSICIAN / ERR_NOT_FACILITY_MANAGER / ERR_REVIEWER_CONFLICT_OF_INTEREST / ERR_NOT_REVIEWER"
    http_status: 403
    applies_to: "identity-checked endpoints"
  - priority: 3.5
    category: existence
    check: "OCC: expected_transfer_case_version must equal TransferCase.version on bed-hold creation; expected_clinical_packet_version must equal ClinicalPacket.version on document upload"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /transfer-cases/{id}/bed-holds, POST /clinical-packets/{id}/documents"
  - priority: 4
    category: state
    check: "State-machine preconditions: correct from-state for every transition; singleton guards (one screening per case, one packet per case, one non-VOIDED notification per case); bed AVAILABLE for manual hold; hold ACTIVE for release; dispatch DISPATCHED for cancel"
    error_id: "ERR_INVALID_STATE / ERR_SCREENING_LOCKED / ERR_DUPLICATE_SCREENING / ERR_DUPLICATE_PACKET / ERR_DUPLICATE_NOTIFICATION / ERR_BED_NOT_AVAILABLE / ERR_HOLD_NOT_ACTIVE / ERR_DISPATCH_NOT_CANCELLABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Clinical/regulatory safety: receiving facility not on applicable diversion at accept; receiving facility capability covers required_capability at request-acceptance; crew_capability >= CREW_REQUIRED[acuity] at dispatch; air-mode minimum distances; EMERGENCY_EXCEPTION certification completeness at certify; isolation-capable bed when requires_isolation on manual hold"
    error_id: "ERR_FACILITY_ON_DIVERSION (403) / ERR_CAPABILITY_MISMATCH (422) / ERR_CREW_CAPABILITY_INSUFFICIENT (422) / ERR_AIR_DISTANCE_BELOW_MINIMUM (422) / ERR_CERTIFICATION_INSUFFICIENT (422) / ERR_ISOLATION_REQUIRED (422)"
    http_status: 422
    applies_to: "accept, request-acceptance, re-request, dispatch, certify, bed-hold creation"
  - priority: 5.5
    category: business_constraint
    check: "Selector empty-pool: bed_selector finds no eligible bed at accept"
    error_id: ERR_NO_ELIGIBLE_BED
    http_status: 409
    applies_to: "POST /transfer-cases/{id}/accept"
  - priority: 6
    category: business_referential
    check: "Cross-referential integrity: same-facility transfer forbidden; receiving physician must belong to receiving facility; manual-hold bed must belong to the case's receiving facility; manual-hold bed unit_type must equal case.required_unit_type; dispatch requires ClinicalPacket.overall_status == READY"
    error_id: "ERR_SAME_FACILITY_TRANSFER (400) / ERR_PHYSICIAN_FACILITY_MISMATCH (422) / ERR_BED_FACILITY_MISMATCH (422) / ERR_BED_UNIT_MISMATCH (422) / ERR_PACKET_INCOMPLETE (409)"
    http_status: 422
    applies_to: "request-acceptance, re-request, case create, bed-hold creation, dispatch"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: dispatch requires active hold with hold_expires_at > clock; new DiversionEvent windows must be strictly disjoint (closed-interval semantics: touching endpoints count as overlap) from existing SCHEDULED/ACTIVE events of the same facility"
    error_id: "ERR_BED_HOLD_EXPIRED / ERR_DIVERSION_OVERLAP"
    http_status: 409
    applies_to: "dispatch, diversion-event creation"
  - priority: 8
    category: business_fiscal
    check: "Payer clearance: dispatch requires a case InsuranceNotification with status IN (NOTIFIED, EXCEPTION_CLAIMED)"
    error_id: ERR_INSURANCE_NOT_CLEARED
    http_status: 402
    applies_to: "POST /transfer-cases/{id}/dispatch"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All system timestamps, expiries, SLAs and effective_status derivations read this clock."
    roles: [TransferCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy BedHold expiries and DiversionEvent effective_status re-derive from the new clock position on subsequent reads/writes"]

  # --- facilities ---
  - method: POST
    path: "/facilities"
    description: "Register a facility"
    roles: [TransferCoordinator]
    code: 201
    input: [name, facility_code, trauma_level, capabilities]
    output: Facility
    side_effects: ["computed fields initialized: diversion_status OPEN, bed counts 0, occupancy_pct 100.0 only when zero beds — with zero Bed rows operational_bed_count is 0 so occupancy_pct = 100.0"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get a facility including computed occupancy fields"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/facilities/{id}/beds"
    description: "List beds of a facility"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["status?", "unit_type?", "limit?", "offset?"]
    output: "Bed[]"
    side_effects: []

  - method: GET
    path: "/facilities/{id}/physicians"
    description: "List physicians whose home facility is this facility"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Physician[]"
    side_effects: []

  - method: GET
    path: "/facilities/{id}/diversion-events"
    description: "List diversion events of a facility"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DiversionEvent[]"
    side_effects: []

  - method: POST
    path: "/facilities/{id}/beds"
    description: "Register a bed at a facility"
    roles: [BedManager]
    code: 201
    input: [bed_code, unit_type, "isolation_capable?"]
    output: Bed
    side_effects: ["Bed.status := AVAILABLE", "identity: X-User-ID must equal {id} (ERR_NOT_FACILITY_MANAGER)", "occupancy recompute + saturation evaluation"]

  - method: PUT
    path: "/beds/{id}"
    description: "BedManager housekeeping status change among AVAILABLE / OCCUPIED / OUT_OF_SERVICE"
    roles: [BedManager]
    code: 200
    input: [status]
    output: Bed
    side_effects: ["identity: X-User-ID must equal bed.facility_id", "HELD beds reject PUT (ERR_INVALID_STATE); HELD is never a legal input", "occupancy recompute + saturation evaluation"]

  # --- physicians ---
  - method: POST
    path: "/physicians"
    description: "Register a physician"
    roles: [TransferCoordinator]
    code: 201
    input: [full_name, facility_id, specialty, "is_on_call?"]
    output: Physician
    side_effects: []

  # --- diversion events ---
  - method: POST
    path: "/facilities/{id}/diversion-events"
    description: "Declare a diversion window (closed-interval overlap rule)"
    roles: [BedManager]
    code: 201
    input: [scope, "unit_type?", starts_at, ends_at, reason]
    output: DiversionEvent
    side_effects: ["identity: X-User-ID must equal {id}", "overlap check vs existing SCHEDULED/ACTIVE events (ERR_DIVERSION_OVERLAP)", "Facility.diversion_status recomputed"]

  - method: POST
    path: "/diversion-events/{id}/lift"
    description: "Manually lift a SCHEDULED or ACTIVE diversion"
    roles: [BedManager]
    code: 200
    input: []
    output: DiversionEvent
    side_effects: ["lifted_at := clock", "Facility.diversion_status recomputed"]

  # --- transfer cases ---
  - method: POST
    path: "/transfer-cases"
    description: "Open a transfer case (INTAKE)"
    roles: [TransferCoordinator]
    code: 201
    input: [patient_ref, sending_facility_id, sending_physician_id, acuity_level, required_unit_type, "requires_isolation?", required_capability]
    output: TransferCase
    side_effects: ["status INTAKE, negotiation_round 0, emtala_obligation UNDETERMINED", "sending physician must belong to sending facility (ERR_PHYSICIAN_FACILITY_MISMATCH)"]

  - method: GET
    path: "/transfer-cases"
    description: "List/filter transfer cases"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["status?", "sending_facility_id?", "receiving_facility_id?", "sending_physician_id?", "receiving_physician_id?", "limit?", "offset?"]
    output: "TransferCase[]"
    side_effects: []

  - method: GET
    path: "/transfer-cases/{id}"
    description: "Get a transfer case"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: TransferCase
    side_effects: []

  # --- EMTALA screening ---
  - method: POST
    path: "/transfer-cases/{id}/emtala-screening"
    description: "Create the case's EMTALA screening (DRAFT; singleton)"
    roles: [SendingPhysician]
    code: 201
    input: [has_emergency_medical_condition, is_stabilized, "benefits_outweigh_risks?", "physician_certification?"]
    output: EmtalaScreening
    side_effects: ["identity: X-User-ID == case.sending_physician_id", "second screening -> ERR_DUPLICATE_SCREENING", "determination computed"]

  - method: GET
    path: "/transfer-cases/{id}/emtala-screening"
    description: "Get the case's screening (array of length 0 or 1)"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: "EmtalaScreening[]"
    side_effects: []

  - method: POST
    path: "/transfer-cases/{id}/emtala-screening/certify"
    description: "Certify the screening; advances case INTAKE -> EMTALA_DETERMINED"
    roles: [SendingPhysician]
    code: 200
    input: []
    output: EmtalaScreening
    side_effects: ["case transition INTAKE -> EMTALA_DETERMINED with emtala_obligation mirror and emtala_determined_at"]

  - method: POST
    path: "/transfer-cases/{id}/emtala-screening/amend"
    description: "Amend a certified screening; reverts case EMTALA_DETERMINED -> INTAKE"
    roles: [SendingPhysician]
    code: 200
    input: ["has_emergency_medical_condition?", "is_stabilized?", "benefits_outweigh_risks?", "physician_certification?"]
    output: EmtalaScreening
    side_effects: ["amendment_count += 1", "determination recomputed at next certify", "case reverted to INTAKE, emtala_obligation UNDETERMINED"]

  # --- negotiation ---
  - method: POST
    path: "/transfer-cases/{id}/request-acceptance"
    description: "Address the case to a receiving facility/physician; opens a negotiation round"
    roles: [TransferCoordinator]
    code: 200
    input: [receiving_facility_id, receiving_physician_id, contact_method, "notes?"]
    output: TransferCase
    side_effects: ["PhysicianCommunication created (PENDING)", "negotiation_round += 1", "receiving ids set"]

  - method: POST
    path: "/transfer-cases/{id}/re-request"
    description: "After refusal, address a NEW receiving facility/physician (REFUSED -> AWAITING_ACCEPTANCE)"
    roles: [TransferCoordinator]
    code: 200
    input: [receiving_facility_id, receiving_physician_id, contact_method, "notes?"]
    output: TransferCase
    side_effects: ["new PhysicianCommunication (PENDING)", "negotiation_round += 1", "receiving ids overwritten"]

  - method: POST
    path: "/transfer-cases/{id}/accept"
    description: "Receiving physician accepts; bed selector runs and a BedHold is placed"
    roles: [ReceivingPhysician]
    code: 200
    input: ["notes?"]
    output: TransferCase
    side_effects: ["communication ACCEPTED", "bed_selector; Bed -> HELD; BedHold ACTIVE created", "occupancy recompute + saturation evaluation", "case -> ACCEPTED"]

  - method: POST
    path: "/transfer-cases/{id}/refuse"
    description: "Receiving physician refuses with documented category and narrative"
    roles: [ReceivingPhysician]
    code: 200
    input: [refusal_category, narrative]
    output: TransferCase
    side_effects: ["communication REFUSED", "RefusalRecord created with risk score/flag", "EMTALA_APPLIES cases auto-open a REFUSAL_RISK QualityReview", "case -> REFUSED"]

  - method: GET
    path: "/communications"
    description: "List physician communications"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "from_physician_id?", "to_physician_id?", "limit?", "offset?"]
    output: "PhysicianCommunication[]"
    side_effects: []

  - method: GET
    path: "/communications/{id}"
    description: "Get a physician communication"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: PhysicianCommunication
    side_effects: []

  # --- bed holds ---
  - method: POST
    path: "/transfer-cases/{id}/bed-holds"
    description: "Manually place a hold on a specific bed (re-placement after expiry or selector override); supersedes any ACTIVE hold; OCC-guarded"
    roles: [BedManager]
    code: 201
    input: [bed_id, expected_transfer_case_version]
    output: BedHold
    side_effects: ["identity: X-User-ID == case.receiving_facility_id", "case must be ACCEPTED", "prior ACTIVE hold -> RELEASED (SUPERSEDED), its bed -> AVAILABLE", "new bed -> HELD", "increments TransferCase.version by 1", "occupancy recompute + saturation evaluation"]

  - method: GET
    path: "/bed-holds"
    description: "List bed holds"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["bed_id?", "transfer_case_id?", "status?", "limit?", "offset?"]
    output: "BedHold[]"
    side_effects: []

  - method: GET
    path: "/bed-holds/{id}"
    description: "Get a bed hold (lazy expiry applied on read)"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: BedHold
    side_effects: ["if ACTIVE and clock >= hold_expires_at and case ACCEPTED: flips to EXPIRED with side effects"]

  - method: POST
    path: "/bed-holds/{id}/release"
    description: "Manually release an ACTIVE hold (case still ACCEPTED)"
    roles: [BedManager]
    code: 200
    input: []
    output: BedHold
    side_effects: ["identity: X-User-ID == hold.bed.facility_id", "hold -> RELEASED (MANUAL)", "bed -> AVAILABLE", "case.active_bed_hold_id := null", "occupancy recompute + saturation evaluation"]

  # --- transport ---
  - method: POST
    path: "/transfer-cases/{id}/dispatch"
    description: "Arrange transport (mode/crew/distance); computes both ETT variants"
    roles: [TransferCoordinator]
    code: 201
    input: [mode, crew_capability, distance_miles]
    output: TransportDispatch
    side_effects: ["TransportDispatch DISPATCHED created", "case ACCEPTED -> TRANSPORT_ARRANGED"]

  - method: GET
    path: "/transport-dispatches"
    description: "List transport dispatches"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "status?", "limit?", "offset?"]
    output: "TransportDispatch[]"
    side_effects: []

  - method: GET
    path: "/transport-dispatches/{id}"
    description: "Get a transport dispatch"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: TransportDispatch
    side_effects: []

  - method: POST
    path: "/transport-dispatches/{id}/cancel"
    description: "Cancel a DISPATCHED transport; case reverts TRANSPORT_ARRANGED -> ACCEPTED"
    roles: [TransferCoordinator]
    code: 200
    input: []
    output: TransportDispatch
    side_effects: ["dispatch -> CANCELLED", "case -> ACCEPTED"]

  # --- case lifecycle ---
  - method: POST
    path: "/transfer-cases/{id}/depart"
    description: "Patient departs the sending facility"
    roles: [TransferCoordinator]
    code: 200
    input: []
    output: TransferCase
    side_effects: ["dispatch -> EN_ROUTE, departed_at := clock", "case TRANSPORT_ARRANGED -> EN_ROUTE"]

  - method: POST
    path: "/transfer-cases/{id}/arrive"
    description: "Patient arrives; confirms the hold into occupancy and records the outcome"
    roles: [TransferCoordinator]
    code: 200
    input: [arrival_condition, deterioration_en_route, receiving_physician_confirmed]
    output: TransferCase
    side_effects: ["dispatch -> ARRIVED, actual_duration_minutes computed", "hold CONFIRMED -> bed OCCUPIED -> occupancy recompute + saturation evaluation", "TransferOutcome created", "deterioration auto-opens DETERIORATION QualityReview", "case -> ARRIVED"]

  - method: POST
    path: "/transfer-cases/{id}/complete"
    description: "Close the transfer administratively; ensures a ROUTINE QualityReview exists"
    roles: [TransferCoordinator]
    code: 200
    input: []
    output: TransferCase
    side_effects: ["ROUTINE QualityReview auto-created when none open", "case -> COMPLETED"]

  - method: POST
    path: "/transfer-cases/{id}/cancel"
    description: "Cancel the case with full compensation (hold release, notification void, dispatch cancel)"
    roles: [TransferCoordinator]
    code: 200
    input: [cancel_reason]
    output: TransferCase
    side_effects: ["hold RELEASED (CASE_CANCELLED) -> bed AVAILABLE -> occupancy recompute + saturation evaluation", "notification VOIDED", "dispatch CANCELLED", "pending communication VOIDED", "case -> CANCELLED"]

  - method: GET
    path: "/transfer-cases/{id}/outcome"
    description: "Get the case's TransferOutcome (array of length 0 or 1)"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: "TransferOutcome[]"
    side_effects: []

  # --- insurance ---
  - method: POST
    path: "/transfer-cases/{id}/insurance-notifications"
    description: "Create the case's insurance notification (one non-VOIDED per case)"
    roles: [TransferCoordinator]
    code: 201
    input: [payer_id, channel]
    output: InsuranceNotification
    side_effects: ["case.status must be past INTAKE and non-terminal (ERR_INVALID_STATE)", "second non-VOIDED notification -> ERR_DUPLICATE_NOTIFICATION", "sla_due_at computed from emtala_obligation"]

  - method: GET
    path: "/insurance-notifications"
    description: "List insurance notifications"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "status?", "limit?", "offset?"]
    output: "InsuranceNotification[]"
    side_effects: []

  - method: GET
    path: "/insurance-notifications/{id}"
    description: "Get an insurance notification"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: InsuranceNotification
    side_effects: []

  - method: POST
    path: "/insurance-notifications/{id}/notify"
    description: "Mark the payer notified at the current logical time"
    roles: [TransferCoordinator]
    code: 200
    input: []
    output: InsuranceNotification
    side_effects: ["status PENDING -> NOTIFIED", "notified_at := clock", "is_late recomputed (strict > sla_due_at)"]

  - method: POST
    path: "/insurance-notifications/{id}/claim-exception"
    description: "Claim the emergency exception instead of prior notification"
    roles: [TransferCoordinator]
    code: 200
    input: [exception_reason]
    output: InsuranceNotification
    side_effects: ["status PENDING -> EXCEPTION_CLAIMED", "exception_reason recorded", "is_late := false"]

  # --- clinical packet ---
  - method: POST
    path: "/transfer-cases/{id}/clinical-packet"
    description: "Create the case's clinical packet (singleton)"
    roles: [SendingPhysician]
    code: 201
    input: [required_documents, "imaging_studies?"]
    output: ClinicalPacket
    side_effects: ["identity: X-User-ID == case.sending_physician_id", "second packet -> ERR_DUPLICATE_PACKET", "statuses computed"]

  - method: GET
    path: "/clinical-packets"
    description: "List clinical packets"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "limit?", "offset?"]
    output: "ClinicalPacket[]"
    side_effects: []

  - method: GET
    path: "/clinical-packets/{id}"
    description: "Get a clinical packet"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: ClinicalPacket
    side_effects: []

  - method: POST
    path: "/clinical-packets/{id}/documents"
    description: "Append received documents (union-only); OCC-guarded"
    roles: [SendingPhysician]
    code: 200
    input: [documents, expected_clinical_packet_version]
    output: ClinicalPacket
    side_effects: ["identity: X-User-ID == packet case's sending_physician_id", "received_documents unioned", "document_status/overall_status recomputed", "increments ClinicalPacket.version by 1"]

  - method: POST
    path: "/clinical-packets/{id}/imaging-exchange"
    description: "Confirm imaging studies exchanged with the receiving facility"
    roles: [SendingPhysician]
    code: 200
    input: [exchanged_study_refs]
    output: ClinicalPacket
    side_effects: ["identity: X-User-ID == packet case's sending_physician_id", "exchanged_study_refs unioned", "imaging_status/overall_status recomputed", "version += 1"]

  # --- refusal records ---
  - method: GET
    path: "/refusal-records"
    description: "List refusal records"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "facility_id?", "refusing_physician_id?", "limit?", "offset?"]
    output: "RefusalRecord[]"
    side_effects: []

  - method: GET
    path: "/refusal-records/{id}"
    description: "Get a refusal record"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: RefusalRecord
    side_effects: []

  # --- quality reviews ---
  - method: GET
    path: "/quality-reviews"
    description: "List quality reviews"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: ["transfer_case_id?", "reviewer_physician_id?", "status?", "limit?", "offset?"]
    output: "QualityReview[]"
    side_effects: []

  - method: GET
    path: "/quality-reviews/{id}"
    description: "Get a quality review"
    roles: [Any, TransferCoordinator, SendingPhysician, ReceivingPhysician, BedManager, QualityReviewer]
    code: 200
    input: []
    output: QualityReview
    side_effects: []

  - method: POST
    path: "/quality-reviews/{id}/begin"
    description: "Assign the review to the calling QualityReviewer (segregation of duties enforced)"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: QualityReview
    side_effects: ["reviewer_physician_id := X-User-ID", "status OPEN -> UNDER_REVIEW"]

  - method: POST
    path: "/quality-reviews/{id}/close"
    description: "Close the review with outcome and findings; computes all scores"
    roles: [QualityReviewer]
    code: 200
    input: [outcome, findings]
    output: QualityReview
    side_effects: ["scores computed per quality_composite_score", "status UNDER_REVIEW -> CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, ends_at <= starts_at, distance_miles <= 0, empty required_documents, unit_type scope rule violated" }
  - { id: ERR_NARRATIVE_TOO_SHORT, http: 400, condition: "Refusal narrative shorter than 50 characters" }
  - { id: ERR_FINDINGS_TOO_SHORT, http: 400, condition: "Review findings shorter than 30 characters" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_PHYSICIAN_NOT_FOUND, http: 404, condition: "Physician id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "TransferCase id does not exist" }
  - { id: ERR_BED_NOT_FOUND, http: 404, condition: "Bed id does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "No EmtalaScreening exists for the case (certify/amend before create)" }
  - { id: ERR_COMMUNICATION_NOT_FOUND, http: 404, condition: "PhysicianCommunication id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "BedHold id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "TransportDispatch id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "InsuranceNotification id does not exist" }
  - { id: ERR_PACKET_NOT_FOUND, http: 404, condition: "ClinicalPacket id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "QualityReview id does not exist" }
  - { id: ERR_DIVERSION_NOT_FOUND, http: 404, condition: "DiversionEvent id does not exist" }
  - { id: ERR_REFUSAL_RECORD_NOT_FOUND, http: 404, condition: "RefusalRecord id does not exist" }
  - { id: ERR_NOT_CASE_PHYSICIAN, http: 403, condition: "X-User-ID is not the physician responsible for this case (sending physician for screening/packet endpoints, receiving physician for accept/refuse)" }
  - { id: ERR_NOT_FACILITY_MANAGER, http: 403, condition: "BedManager X-User-ID does not equal the target facility's id" }
  - { id: ERR_NOT_REVIEWER, http: 403, condition: "X-User-ID is not the assigned reviewer of this QualityReview" }
  - { id: ERR_REVIEWER_CONFLICT_OF_INTEREST, http: 403, condition: "Reviewer is the case's sending or receiving physician (segregation of duties)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a from-state that permits this transition" }
  - { id: ERR_SCREENING_LOCKED, http: 409, condition: "Screening amendment attempted after the case advanced past EMTALA_DETERMINED" }
  - { id: ERR_DUPLICATE_SCREENING, http: 409, condition: "The case already has an EmtalaScreening" }
  - { id: ERR_DUPLICATE_PACKET, http: 409, condition: "The case already has a ClinicalPacket" }
  - { id: ERR_DUPLICATE_NOTIFICATION, http: 409, condition: "The case already has a non-VOIDED InsuranceNotification" }
  - { id: ERR_BED_NOT_AVAILABLE, http: 409, condition: "Bed status is not AVAILABLE (includes bed blocked by a non-expired ACTIVE hold)" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "BedHold is not ACTIVE (release/expire on a terminal hold)" }
  - { id: ERR_DISPATCH_NOT_CANCELLABLE, http: 409, condition: "Only a DISPATCHED transport can be cancelled" }
  - { id: ERR_FACILITY_ON_DIVERSION, http: 403, condition: "Receiving facility has an ACTIVE diversion covering the required unit (ALL_UNITS or matching SPECIFIC_UNIT) at accept time" }
  - { id: ERR_CAPABILITY_MISMATCH, http: 422, condition: "Receiving facility capabilities do not include the case's required_capability" }
  - { id: ERR_CREW_CAPABILITY_INSUFFICIENT, http: 422, condition: "crew_capability below CREW_REQUIRED[acuity_level] (CRITICAL->CCT, EMERGENT->ALS, URGENT/STABLE->BLS)" }
  - { id: ERR_AIR_DISTANCE_BELOW_MINIMUM, http: 422, condition: "AIR_ROTOR requires distance_miles >= 30; AIR_FIXED_WING requires >= 100" }
  - { id: ERR_CERTIFICATION_INSUFFICIENT, http: 422, condition: "EMERGENCY_EXCEPTION determination requires benefits_outweigh_risks == true and physician_certification >= 30 characters" }
  - { id: ERR_ISOLATION_REQUIRED, http: 422, condition: "Manual hold on a non-isolation bed for a case with requires_isolation == true" }
  - { id: ERR_NO_ELIGIBLE_BED, http: 409, condition: "bed_selector found no eligible bed at accept" }
  - { id: ERR_SAME_FACILITY_TRANSFER, http: 400, condition: "receiving_facility_id equals the case's sending_facility_id" }
  - { id: ERR_PHYSICIAN_FACILITY_MISMATCH, http: 422, condition: "Physician's home facility does not match the facility role required by the operation" }
  - { id: ERR_BED_FACILITY_MISMATCH, http: 422, condition: "Manual-hold bed does not belong to the case's receiving facility" }
  - { id: ERR_BED_UNIT_MISMATCH, http: 422, condition: "Manual-hold bed unit_type differs from case.required_unit_type" }
  - { id: ERR_PACKET_INCOMPLETE, http: 409, condition: "Dispatch requires ClinicalPacket.overall_status == READY (documents complete and imaging exchanged); also fires when no packet exists" }
  - { id: ERR_BED_HOLD_EXPIRED, http: 409, condition: "Dispatch attempted at or after the active hold's hold_expires_at" }
  - { id: ERR_DIVERSION_OVERLAP, http: 409, condition: "New diversion window touches or overlaps an existing SCHEDULED/ACTIVE diversion of the same facility (closed-interval semantics: new.starts_at == existing.ends_at or new.ends_at == existing.starts_at is an overlap)" }
  - { id: ERR_INSURANCE_NOT_CLEARED, http: 402, condition: "Dispatch requires a case notification in NOTIFIED or EXCEPTION_CLAIMED status" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: TransferCoordinator
    description: "Transfer center operator; orchestrates the case lifecycle, transport, insurance, and reference data"
    identity: opaque
    exclusive_operations:
      - "POST /facilities, POST /physicians — reference data"
      - "POST /transfer-cases — open case"
      - "POST /transfer-cases/{id}/request-acceptance, /re-request — negotiation rounds"
      - "POST /transfer-cases/{id}/dispatch, /depart, /arrive, /complete, /cancel — lifecycle"
      - "POST /transport-dispatches/{id}/cancel"
      - "POST /transfer-cases/{id}/insurance-notifications, POST /insurance-notifications/{id}/notify, /claim-exception"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: SendingPhysician
    description: "Physician at the sending facility who owns the case's EMTALA screening and clinical packet"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /transfer-cases/{id}/emtala-screening, /emtala-screening/certify, /emtala-screening/amend"
      - "POST /transfer-cases/{id}/clinical-packet, POST /clinical-packets/{id}/documents, /imaging-exchange"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: ReceivingPhysician
    description: "Physician at the receiving facility who accepts or refuses transfer requests"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /transfer-cases/{id}/accept"
      - "POST /transfer-cases/{id}/refuse"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: BedManager
    description: "Bed/housekeeping manager of one facility; X-User-ID equals the managed Facility's id"
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /facilities/{id}/beds, PUT /beds/{id}"
      - "POST /facilities/{id}/diversion-events, POST /diversion-events/{id}/lift"
      - "POST /transfer-cases/{id}/bed-holds, POST /bed-holds/{id}/release"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: QualityReviewer
    description: "Reviewing physician; barred from reviewing cases where they were the sending or receiving physician"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /quality-reviews/{id}/begin"
      - "POST /quality-reviews/{id}/close"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Any
    description: "Every declared role may read; GET endpoints list roles [Any]"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
