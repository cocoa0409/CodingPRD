              payload: { status: "CANCELLED", cancellation_reason: "STAFF_DECISION" }
              as: AffiliateStaff
              captures: { proj_v: $.data.version }
          trigger:
            - call: "POST /rebuild/projects/${proj}/scope-amendments"
              payload: { expected_project_version: "${proj_v}", add_items: [{ category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 500000, est_high_cents: 500000, description: "room addition" }] }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (project is CANCELLED; the state check at priority 6 precedes the fiscal check at priority 11)"
            - "the amendment's +575000-cent envelope delta would have exceeded available_cents 200000, so ERR_ENVELOPE_EXCEEDED was also reachable — and must lose"

