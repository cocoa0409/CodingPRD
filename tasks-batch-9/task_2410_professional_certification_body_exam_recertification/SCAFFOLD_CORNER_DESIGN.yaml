      - name: electing_reexamination_zeroes_the_credit_path_and_only_a_passing_sitting_satisfies_the_cycle
        claim_type: conditional_cascade
        grounds:
          - endpoints.POST_/recertification-cycles/{id}/elect-reexam
          - state_machines.RecertificationCycle.OPEN_to_OPEN
          - state_machines.RecertificationCycle.OPEN_or_LAPSED_to_SATISFIED
          - endpoints.POST_/exam-registrations/{id}/report-score
          - entities.RecertificationCycle.fields.path
          - entities.RecertificationCycle.fields.reexam_registration_id
          - entities.RecertificationCycle.fields.required_credits
          - entities.CEUActivity.computed_fields.counted
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Electing re-examination is a one-way switch that REVERSES accrual: path CEU -> RE_EXAM
          sets required_credits to 0 and decounts the already-approved 4.00 credits, yet the
          cycle stays OPEN — credits_applied 0.00 >= required_credits 0 must NOT satisfy it,
          because a RE_EXAM cycle is satisfiable only by the report-score cascade. A second
