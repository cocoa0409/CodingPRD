        claim_type: violation_to_error
        grounds:
          - validations[priority=75]
          - calculations.compliance_posture
          - errors[ERR_POSTURE_RESTRICTED]
          - errors[ERR_POSTURE_FROZEN]
          - endpoints["POST /online-services/{id}/posture"]
        distinguishing_aspect: "With zero exposure points and zero open audits the computed posture would be OPEN, so every effect here comes from clause 1 of the ladder: RESTRICTED blocks only non-PARTICIPATION_CORE collection, FROZEN blocks all collection AND new consent intake, and clearing the override to null restores OPEN and re-admits the previously blocked CONTESTS collection."
