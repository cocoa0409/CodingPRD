            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001027", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: false, has_digital: false, initial_new_stock_qty: 1, initial_used_stock_qty: 1 }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 12000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 1, qty_used_requested: 1, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 12000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado1: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado1}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado1}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado1}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/orders", payload: { term_id: "${t1}", lines: [ { adoption_id: "${ado1}", format: "NEW", qty: 1 }, { adoption_id: "${ado1}", format: "USED", qty: 1 } ] }, as: Student, as_user_id: "${stu}", captures: { ord_total: $.data.total_cents, ord_aid: $.data.aid_tendered_cents, ord_card: $.data.card_tendered_cents, ord_status: $.data.status } }
          assert:
