              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Ow Law", email: "ow@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "1 St", service_lat: 36.0, service_lng: -119.0 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
