              as: Investigator
              captures: { err: $.data.error_id }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-11T00:00:00Z", planned_end: "2026-05-15T00:00:00Z", preservation_notice_id: "${n1}" }
              as: Investigator
              captures: { s3: $.data.id }
          assert:
            - "touching window [05-10, 05-15] is rejected with ERR_SCOPE_OVERLAP (closed intervals share the 05-10 endpoint)"
            - "disjoint window [05-11, 05-15] is created (201) with status PROPOSED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: evidence_exclude_restore_bytes_invariant
        grounds:
          - calculations.collection_custody_totals
          - state_machines.EvidenceItem.ADMITTED_to_EXCLUDED
          - state_machines.EvidenceItem.EXCLUDED_to_ADMITTED
          - entities.CollectionScope.fields.collected_bytes
        distinguishing_aspect: |
          Conserved quantity = custody bytes/count: the forward action ADMITTED ->
          EXCLUDED (drops the item from the sums) paired with its compensating
          EXCLUDED -> ADMITTED restore leaves CollectionScope.collected_bytes and
          collected_item_count exactly unchanged (1500000/2 before and after).
        test_recipe:
          setup:
            - "Case FIELDWORK; scope IN_PROGRESS with e1 (1000000 bytes, ADMITTED) and e2 (500000 bytes, LOGGED): collected_bytes == 1500000, collected_item_count == 2"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case CI-1", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: HIGH, department: "Finance" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { n1: $.data.id }
            - { call: "POST /api/preservation-notices/${n1}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${n1}" }
              as: Investigator
              captures: { s1: $.data.id }
            - { call: "POST /api/collection-scopes/${s1}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${s1}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/collection-scopes/${s1}/evidence-items"
              payload: { custodian_ref: "EMP-100", hash_value: "h1", size_bytes: 1000000, captured_at: "2026-05-06T00:00:00Z" }
              as: Investigator
              captures: { e1: $.data.id }
            - call: "POST /api/collection-scopes/${s1}/evidence-items"
              payload: { custodian_ref: "EMP-100", hash_value: "h2", size_bytes: 500000, captured_at: "2026-05-06T01:00:00Z" }
              as: Investigator
              captures: { e2: $.data.id }
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: UNDER_REVIEW }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
            - call: "GET /api/collection-scopes/${s1}"
              as: Investigator
              captures: { bytes0: $.data.collected_bytes, count0: $.data.collected_item_count }
          trigger:
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: EXCLUDED }, as: Investigator, as_user_id: "inv-1" }
            - call: "GET /api/collection-scopes/${s1}"
              as: Investigator
              captures: { bytes_mid: $.data.collected_bytes }
            - { call: "POST /api/evidence-items/${e1}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
            - call: "GET /api/collection-scopes/${s1}"
              as: Investigator
              captures: { bytes_end: $.data.collected_bytes, count_end: $.data.collected_item_count }
          assert:
            - "baseline collected_bytes == 1500000 and collected_item_count == 2"
            - "after EXCLUDED: collected_bytes == 500000 (e1 drops out of the conserved sum)"
            - "after restore ADMITTED: collected_bytes == 1500000 and collected_item_count == 2 — exclude+restore leaves the conserved quantity unchanged"

      - name: privilege_designate_waive_count_invariant
        grounds:
          - state_machines.PrivilegeDesignation.DESIGNATED_to_CONFIRMED
          - state_machines.PrivilegeDesignation.CONFIRMED_to_WAIVED
          - entities.Case.fields.active_privileged_artifact_count
        distinguishing_aspect: |
          Conserved quantity = active privileged artifact COUNT (different quantity
          type from custody bytes): designation (+1) paired with its compensating
          waiver (-1) leaves Case.active_privileged_artifact_count at its original
          value; the intermediate CONFIRMED state does not change the count.
        test_recipe:
          setup:
            - "Case FIELDWORK with one scheduled interview I; Case.active_privileged_artifact_count == 0"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case CI-2", allegation_category: HARASSMENT, severity: MEDIUM, department: "Ops", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "Ops" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-1", interviewer_id: "inv-9", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: Investigator
              captures: { i1: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: GeneralCounsel
              captures: { cnt0: $.data.active_privileged_artifact_count }
          trigger:
            - call: "POST /api/cases/${case_id}/privilege-designations"
              payload: { target_type: INTERVIEW, target_id: "${i1}", privilege_type: ACP, rationale: "counsel-directed interview" }
              as: GeneralCounsel
              captures: { pd: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: GeneralCounsel
              captures: { cnt1: $.data.active_privileged_artifact_count }
            - { call: "POST /api/privilege-designations/${pd}/transition", payload: { to_status: CONFIRMED }, as: GeneralCounsel }
            - call: "GET /api/cases/${case_id}"
              as: GeneralCounsel
              captures: { cnt2: $.data.active_privileged_artifact_count }
            - { call: "POST /api/privilege-designations/${pd}/transition", payload: { to_status: WAIVED }, as: GeneralCounsel }
            - call: "GET /api/cases/${case_id}"
              as: GeneralCounsel
              captures: { cnt3: $.data.active_privileged_artifact_count }
          assert:
            - "baseline active_privileged_artifact_count == 0"
            - "after DESIGNATED: count == 1; after CONFIRMED: count still == 1 (status change within the active set)"
            - "after WAIVED (compensating action): count == 0 — designate+waive leaves the conserved count unchanged"
