              payload: { monthly_fee_cents: 29900, included_files_quota: 2, overage_fee_cents: 34900 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /tc/files"
              payload: { billing_model: "SUBSCRIPTION", subscription_id: "${sub_id}", expected_subscription_version: "${sub_v}", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-31", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
