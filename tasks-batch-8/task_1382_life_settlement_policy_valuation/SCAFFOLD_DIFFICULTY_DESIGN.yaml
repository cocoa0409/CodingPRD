  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle_rounds
        grounds:
          - state_machines.Offer.PENDING_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_PENDING
          - state_machines.Offer.COUNTERED_to_ACCEPTED
          - validations[priority=10]
        distinguishing_aspect: |
          Cyclic machine on Offer: PENDING -> COUNTERED -> PENDING -> COUNTERED ->
          ACCEPTED loops with round_number incrementing 1 -> 2 -> 3 -> 4; the cycle
          is bounded (RE_OFFER at round 4 is rejected) and terminates via
          ACCEPT_COUNTER at the counter price 6110500.
        test_recipe:
          setup:
            - "Canonical TX chain to MARKETED (single tier-A LE, blended 86), disclosures delivered"
            - "Offer O of 6000000 PENDING (round_number 1, version 1)"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "Pat Doe", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "NON_TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id", ov1: "$.data.version" } }
          trigger:
            - { call: "POST /api/offers/${o1}/counter", payload: { counter_amount_cents: 6100000, expected_offer_version: "${ov1}" }, as: Broker, as_user_id: "${b_id}", captures: { ov2: "$.data.version" } }
            - { call: "POST /api/offers/${o1}/respond", payload: { action: "RE_OFFER", amount_cents: 6050000 }, as: Underwriter, captures: { ov3: "$.data.version" } }
            - { call: "POST /api/offers/${o1}/counter", payload: { counter_amount_cents: 6110500, expected_offer_version: "${ov3}" }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/offers/${o1}/respond", payload: { action: "RE_OFFER", amount_cents: 6060000 }, as: Underwriter, captures: { err_max: "$.data.error_id" } }
            - { call: "POST /api/offers/${o1}/respond", payload: { action: "ACCEPT_COUNTER" }, as: Underwriter, captures: { final_price: "$.data.effective_price_cents", final_round: "$.data.round_number" } }
          assert:
            - "After first counter: status COUNTERED, round_number == 2"
            - "After RE_OFFER 6050000: status PENDING, round_number == 3, amount_cents == 6050000, counter_amount_cents == null"
            - "Second counter 6110500 == round_half_up(6050000*101/100) passes exactly: status COUNTERED, round_number == 4"
            - "captured err_max == ERR_MAX_NEGOTIATION_ROUNDS_REACHED (RE_OFFER blocked at round 4)"
            - "captured final_price == 6110500 and final_round == 4; GET /api/cases/${c1}: status == IN_CLOSING"

