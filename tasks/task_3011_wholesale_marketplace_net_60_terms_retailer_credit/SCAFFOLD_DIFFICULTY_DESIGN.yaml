              captures: { err: $.data.error_id }
          assert:
            - "first trigger grant succeeds (201): touching endpoints [2027-08-01, ...) vs [..., 2027-08-01) do not overlap under half-open semantics"
            - "second trigger grant is rejected with error_id == ERR_GRANT_OVERLAP (HTTP 422): 2027-07-31T23:59:59Z < 2027-08-01T00:00:00Z overlaps G2 by one second"
      - name: territory_time_window_conflict
        grounds:
          - calculations.territory_conflict_check
          - state_machines.ExclusivityGrant.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Different interval semantics from grant-pair overlap: here the conflict
