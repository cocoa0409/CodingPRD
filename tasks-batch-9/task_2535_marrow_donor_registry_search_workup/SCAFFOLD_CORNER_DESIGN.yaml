# =============================================================================
# 1.9 Scaffold Corner Design — breadth coverage index for the
#     marrow-donor-registry-search-workup scaffold.
#
# Every instance below is a claim the scaffold's §1.1-§1.7 surface already
# declares and that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does NOT already
# assert; corners that §1.8 owns appear as `excluded_because:` stubs naming the
# covering §1.8 instance.
#
# Fixture conventions (identical to §1.8, so the two files compose):
#   * the logical clock starts at 2026-08-01T00:00:00Z and only ever moves
#     through POST /_clock/set_current_utc.
#   * opaque role ids: TransplantCoordinator "tc-1"/"tc-2",
#     MedicalDirector "md-1"/"md-2", RegistryOperations "ops-1".
#   * entity-backed roles pass the entity id itself as X-User-ID:
#     DonorRegistryLiaison -> Registry.id, CollectionCenterOps ->
#     CollectionCenter.id.
#   * the donor/patient HLA fixtures D1 (94.75 / 98.25 / rank 97.113),
#     D2 (86.58 / 90.08 / rank 76.869), D3 (69.17 / rank 65.544) and
#     D5 (64.92 / rank 78.831) are the same rows §1.8 uses; every numeric
#     literal in an `assert:` was produced by executing the §1.3 formulas.
#   * 00000000-0000-0000-0000-000000000000 is the canonical absent id.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: registry_creation_echoes_every_input_and_seeds_its_system_fields
        claim_type: Creation
        grounds:
          - entities.Registry
          - endpoints.POST_registry_registries
          - response_envelope.success
        distinguishing_aspect: |
          POST /registry/registries with the full required input set returns 201, echoes all nine
          declared input fields unchanged, seeds the computed donor_count at 0, defaults
          cooperation_status to ACTIVE and wraps the row in the declared success envelope
          (meta.api_request_id, meta.api_request_timestamp, response_type "object", data).
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /registry/registries"
              payload: { code: "DKMS-DE", name: "DKMS Germany", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_id: "$.data.id", reg_created: "$.data.created_at", reg_version: "$.data.version" }
          assert:
            - "HTTP 201 with response_type \"object\" and a data object carrying exactly the Registry fields declared in §1.1 plus id, created_at, updated_at and version"
            - "data.code == \"DKMS-DE\", data.name == \"DKMS Germany\", data.country_code == \"DE\", data.currency_code == \"EUR\", data.fx_rate_to_usd == 1.0850, data.is_domestic == false, data.cooperation_tier == 2, data.ct_response_deadline_hours == 120"
            - "data.cooperation_status == \"ACTIVE\" (default applied because the optional input was omitted)"
            - "data.donor_count == 0 (computed field, no donors exist)"
            - "data.created_at == data.updated_at == \"2026-08-01T00:00:00Z\" and data.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"
            - "GET /registry/registries/${reg_id} returns the identical row"

      - name: patient_read_returns_the_stored_typing_and_zeroed_case_ledger
        claim_type: Retrieval
        grounds:
          - entities.Patient
          - endpoints.GET_registry_patients_id
        distinguishing_aspect: |
          A GET by id returns the stored five-locus hla_typing object verbatim (not a normalised or
          re-sorted copy), the coordinating_user_id stamped from X-User-ID at creation, and the
          untouched lifecycle fields conditioning_status NOT_SCHEDULED / conditioning_start_date null
          / committed_cost_cents 0.
        test_recipe:
          setup:
            - "one patient registered by TransplantCoordinator tc-1 at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_status: "$.data.conditioning_status", p_committed: "$.data.committed_cost_cents" }
          assert:
            - "HTTP 200 and data.hla_typing equals the submitted object at all five loci, both alleles per locus, in the submitted order"
            - "data.coordinating_user_id == \"tc-1\" (system field stamped from X-User-ID, never accepted as input)"
            - "data.conditioning_status == \"NOT_SCHEDULED\", data.conditioning_start_date == null, data.conditioning_aborted_reason == null"
            - "data.committed_cost_cents == 0 and data.case_budget_cents == 5000000"
            - "data.weight_kg == 70.0, data.urgency_tier == \"HIGH\", data.version == 1"

      - name: donor_listing_orders_by_created_at_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_registry_donors
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The donor list is ordered created_at ASC, carries limit/offset/total_count/has_more, and the
          registry_id and availability_status filters narrow total_count itself rather than only the
          returned page - a page of 2 out of 3 rows reports has_more true, the next page has_more
          false, and a filtered call reports the filtered cardinality.
        test_recipe:
          setup:
            - "two registries; three donors created in a known order: D1 and D3 under the domestic registry, D2 under the international one"
            - "D2 is created with availability_status WITHDRAWN so the availability filter has a discriminating row"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "DKMS-DE", name: "DKMS Germany", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_intl_id}", donor_code: "D-0002", age_years: 41, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "11:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06", "02"] }, consented_methods: ["PBSC"], ambiguous_loci: ["DQB1"], prior_donation_count: 1, availability_status: "WITHDRAWN" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_intl_id}"
              captures: { d2_id: "$.data.id" }
          trigger:
            - call: "GET /registry/donors"
              payload: { limit: 2, offset: 0 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /registry/donors"
              payload: { limit: 2, offset: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /registry/donors"
              payload: { registry_id: "${reg_dom_id}", availability_status: "AVAILABLE" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { filtered_first: "$.data[0].id" }
          assert:
            - "the first page returns response_type \"array\" with 2 rows, limit 2, offset 0, total_count 3, has_more true, and data[0].id == ${d1_id} / data[1].id == ${d3_id} (created_at ASC)"
            - "the second page returns 1 row, offset 2, total_count 3, has_more false, and data[0].id == ${d2_id}"
            - "the filtered call returns 2 rows with total_count 2 and has_more false: the WITHDRAWN international donor ${d2_id} is excluded by BOTH filters, and total_count reflects the filter, not the table"
            - "omitting limit and offset entirely applies the declared defaults limit 10 / offset 0 and returns all 3 rows with has_more false"
            - "Registry.${reg_dom_id}.donor_count == 2 and Registry.${reg_intl_id}.donor_count == 1 - the derived counter agrees with the filtered list cardinality"

      - name: absent_path_ids_return_the_entity_specific_not_found_error
        claim_type: Not Found
        grounds:
          - validations.priority_5_path_id_not_found_ladder
          - errors[ERR_REGISTRY_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_DONOR_NOT_FOUND]
          - errors[ERR_MATCH_CANDIDATE_NOT_FOUND]
          - errors[ERR_WORKUP_CASE_NOT_FOUND]
          - errors[ERR_CLEARANCE_ITEM_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_SEARCH_REQUEST_NOT_FOUND]
          - errors[ERR_TYPING_REQUEST_NOT_FOUND]
          - errors[ERR_COLLECTION_CENTER_NOT_FOUND]
        distinguishing_aspect: |
          Priority 5 resolves path ids left-to-right and each collection maps to its OWN 404 code, so
          the same absent uuid produces twelve different error_ids depending on which collection it
          was addressed under. Every call also proves the error envelope shape (response_type
          "error", data.error_id, data.message) on a read endpoint.
        test_recipe:
          setup:
            - "empty database; no row of any kind exists"
          setup_api_calls: []
          trigger:
            - call: "GET /registry/registries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { e_registry: "$.data.error_id" }
            - call: "GET /registry/collection-centers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { e_center: "$.data.error_id" }
            - call: "GET /registry/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_patient: "$.data.error_id" }
            - call: "GET /registry/search-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_search: "$.data.error_id" }
            - call: "GET /registry/donors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { e_donor: "$.data.error_id" }
            - call: "GET /registry/match-candidates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_candidate: "$.data.error_id" }
            - call: "GET /registry/match-candidates/00000000-0000-0000-0000-000000000000/typing-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_candidate_sub: "$.data.error_id" }
            - call: "POST /registry/typing-requests/00000000-0000-0000-0000-000000000000/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_typing: "$.data.error_id" }
            - call: "GET /registry/workup-cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { e_workup: "$.data.error_id" }
            - call: "GET /registry/clearance-items/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { e_clearance: "$.data.error_id" }
            - call: "GET /registry/collection-bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_booking: "$.data.error_id" }
            - call: "GET /registry/shipments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { e_shipment: "$.data.error_id" }
            - call: "GET /registry/reimbursement-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { e_claim: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type \"error\" and a data object carrying error_id and a non-empty message"
            - "error_ids in order: ERR_REGISTRY_NOT_FOUND, ERR_COLLECTION_CENTER_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_SEARCH_REQUEST_NOT_FOUND, ERR_DONOR_NOT_FOUND, ERR_MATCH_CANDIDATE_NOT_FOUND, ERR_MATCH_CANDIDATE_NOT_FOUND, ERR_TYPING_REQUEST_NOT_FOUND, ERR_WORKUP_CASE_NOT_FOUND, ERR_CLEARANCE_ITEM_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "the sub-resource list call resolves the PARENT id first and therefore returns ERR_MATCH_CANDIDATE_NOT_FOUND rather than an empty array"
            - "the typing-response call returns ERR_TYPING_REQUEST_NOT_FOUND (priority 5) rather than ERR_REGISTRY_SCOPE_VIOLATION (priority 8), because path resolution precedes scope enforcement"
            - "no row is created and no error is written to any entity by any of the calls"

      - name: patient_creation_missing_required_fields_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - endpoints.POST_registry_patients
          - entities.Patient.fields.hla_typing
        distinguishing_aspect: |
          Every POST /registry/patients input is declared required (no optional marker), so omitting
          any one of them - here hla_typing, then case_budget_cents - fails at priority 3 before any
          uniqueness or ownership rule runs, and a typing object missing a locus is rejected by the
          same rule because the schema pins all five loci.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_missing_typing: "$.data.error_id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"] } }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_missing_budget: "$.data.error_id" }
          assert:
            - "both calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the first fails on the absent hla_typing field; the second fails on the absent case_budget_cents AND the four-locus hla_typing object - priority 3 rejects the request as a whole"
            - "no Patient row exists after either call: GET /registry/patients/{any-id} still 404s and a subsequent valid POST with mrn \"MRN-0001\" succeeds with 201, proving the failed calls consumed no uniqueness slot"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.SearchRequest.fields.min_preliminary_score
          - entities.DonorProfile.fields.ambiguous_loci
          - entities.DonorProfile.fields.prior_donation_count
          - entities.DonorProfile.fields.availability_status
          - entities.Registry.fields.cooperation_status
          - calculations.candidate_pool_materialization
        distinguishing_aspect: |
          Four independent defaults are asserted in one chain and one of them is proven to be
          load-bearing rather than cosmetic: with min_preliminary_score defaulted to 60.00 the 69.17
          preliminary score of D3 clears the floor and D3 enters the pool, so the default value is
          observable in match_pool_size, not just in the echoed field.
        test_recipe:
          setup:
            - "a domestic registry created without cooperation_status; donors D1 and D3 created without ambiguous_loci / prior_donation_count / availability_status where possible"
            - "a search request created without min_preliminary_score"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id", reg_coop: "$.data.cooperation_status" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id", d3_ambig: "$.data.ambiguous_loci", d3_prior: "$.data.prior_donation_count", d3_avail: "$.data.availability_status" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id", sr_floor: "$.data.min_preliminary_score", sr_pool: "$.data.match_pool_size" }
          assert:
            - "Registry.${reg_dom_id}.cooperation_status == \"ACTIVE\" (default)"
            - "DonorProfile.${d3_id}.ambiguous_loci == [] , prior_donation_count == 0 and availability_status == \"AVAILABLE\" (all three defaults)"
            - "SearchRequest.${sr_id}.min_preliminary_score == 60.00 (default MIN_PRELIM_SCORE_DEFAULT)"
            - "SearchRequest.${sr_id}.match_pool_size == 1 and status == \"SEARCHING\": D3's preliminary_score 69.17 clears the defaulted 60.00 floor, so the default is observable in the materialised pool"
            - "the single MatchCandidate carries preliminary_score 69.17, rank_position 1, candidate_role \"PRIMARY\" and status \"IDENTIFIED\""

      - name: typing_request_fields_are_computed_from_the_registry_deadline_policy
        claim_type: Computed Fields
        grounds:
          - entities.ConfirmatoryTypingRequest.fields.attempt_number
          - entities.ConfirmatoryTypingRequest.fields.requested_at
          - entities.ConfirmatoryTypingRequest.fields.deadline_at
          - calculations.ct_deadline_and_expiry_sweep
        distinguishing_aspect: |
          POST /registry/match-candidates/{id}/typing-requests accepts only priority_flag, so every
          other ConfirmatoryTypingRequest field is computed or system-sourced: attempt_number from the
          candidate's ct_attempt_count, requested_at from the logical clock, and deadline_at from the
          DONOR's registry policy (168h domestic, no international grace) - the client cannot influence
          any of them.
        test_recipe:
          setup:
            - "domestic registry (ct_response_deadline_hours 168), donor D1, patient, search with D1 as PRIMARY"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id", mc1_attempts: "$.data[0].ct_attempt_count" }
          trigger:
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id", ct1_deadline: "$.data.deadline_at", ct1_attempt: "$.data.attempt_number" }
          assert:
            - "HTTP 201 with data.attempt_number == 1, data.status == \"REQUESTED\", data.priority_flag == false (default), data.requested_at == \"2026-08-01T00:00:00Z\""
            - "data.deadline_at == \"2026-08-08T00:00:00Z\" == requested_at + 168h, with no INTERNATIONAL_GRACE_HOURS and no PRIORITY_DEADLINE_REDUCTION_HOURS applied"
            - "data.responded_at, data.reported_hla_typing, data.reported_match_grade, data.donor_available_flag and data.expired_by_sweep_at are all null on creation"
            - "MatchCandidate.${mc1_id}.ct_attempt_count moved 0 -> 1 and status moved IDENTIFIED -> TYPING_REQUESTED; SearchRequest.${sr_id}.status == \"PRIMARY_ENGAGED\""

      - name: system_fields_are_stamped_from_the_logical_clock_not_from_input
        claim_type: System Fields
        grounds:
          - entities.Registry
          - entities.CollectionCenter
          - endpoints.POST__clock_set_current_utc
          - response_envelope.success
        distinguishing_aspect: |
          id / created_at / updated_at / version are server-assigned: two rows created on either side
          of a clock move carry different created_at values taken from the logical clock rather than
          wall time, both start at version 1 with created_at == updated_at, and their ids differ even
          though the payloads are structurally identical.
        test_recipe:
          setup:
            - "logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/collection-centers"
              payload: { name: "Metro Apheresis Center", country_code: "US", concurrent_collection_capacity: 1 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_a_id: "$.data.id", ctr_a_created: "$.data.created_at", ctr_a_updated: "$.data.updated_at", ctr_a_version: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:34:56Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /registry/collection-centers"
              payload: { name: "Metro Apheresis Center", country_code: "US", concurrent_collection_capacity: 1 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_b_id: "$.data.id", ctr_b_created: "$.data.created_at" }
          assert:
            - "the first row has created_at == updated_at == \"2026-08-01T00:00:00Z\" and version == 1"
            - "the second row has created_at == updated_at == \"2026-08-15T12:34:56Z\" and version == 1 - the timestamp comes from the logical clock, not from wall-clock time"
            - "${ctr_a_id} != ${ctr_b_id} even though the two payloads are byte-identical: name is not an identity and no uniqueness rule exists for CollectionCenter.name"
            - "both rows report committed_slot_minutes == 0, the computed field seeded by creation"
            - "the clock call itself returns { current_utc: \"2026-08-15T12:34:56Z\", previous_utc: \"2026-08-01T00:00:00Z\" }"

      - name: donor_creation_rejects_out_of_range_numbers_and_unknown_enum_values
        claim_type: Type Constraints
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.DonorProfile.fields.age_years
          - entities.DonorProfile.fields.sex
          - entities.DonorProfile.fields.consented_methods
          - calculations.candidate_pool_materialization.constants.DONOR_MIN_AGE
        distinguishing_aspect: |
          The donor input schema pins a numeric range (DONOR_MIN_AGE 18 .. DONOR_MAX_AGE 60) and three
          enums (sex, cmv_status, consented_methods). Age 17 and age 61 are rejected while 18 and 60
          are accepted, which proves the bound is inclusive at both ends and lives in the schema rather
          than in the pool filter.
        test_recipe:
          setup:
            - "one domestic registry"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
          trigger:
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-AGE-17", age_years: 17, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { e_age_low: "$.data.error_id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-AGE-61", age_years: 61, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { e_age_high: "$.data.error_id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-ENUM", age_years: 30, sex: "X", weight_kg: 68.0, cmv_status: "UNKNOWN_STATUS", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["CORD_BLOOD"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-AGE-18", age_years: 18, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d18_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-AGE-60", age_years: 60, sex: "M", weight_kg: 84.0, cmv_status: "NEGATIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"] }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d60_id: "$.data.id" }
          assert:
            - "the age-17 and age-61 calls both return HTTP 400 ERR_INVALID_REQUEST: DONOR_MIN_AGE 18 and DONOR_MAX_AGE 60 are enforced as an inclusive schema range"
            - "the third call returns HTTP 400 ERR_INVALID_REQUEST for all three enum defects at once (sex \"X\", cmv_status \"UNKNOWN_STATUS\", consented_methods [\"CORD_BLOOD\"])"
            - "the age-18 and age-60 calls both return HTTP 201, so the rejected values sit exactly one step outside an accepted boundary"
            - "Registry.${reg_dom_id}.donor_count == 2 - the three rejected calls created nothing"

      - name: follow_up_rows_are_immutable_and_expose_no_version
        claim_type: Immutability
        grounds:
          - entities.DonorFollowUp
          - endpoints.POST_registry_donors_id_follow_ups
          - endpoints.GET_registry_donors_id_follow_ups
        distinguishing_aspect: |
          DonorFollowUp is the scaffold's only common_fields:false entity: an append-only clinical log.
          §1.5 declares no PATCH and no DELETE for it, the created row carries no version field, and a
          second filing does not overwrite the first - it appends, raising adverse_event_count while
          leaving the earlier row byte-identical.
        test_recipe:
          setup:
            - "domestic registry and donor D1, clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "DAY_7_CONTACT", severity_grade: 0, description: "Routine day-7 call" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { fu1_id: "$.data.id", fu1_reported: "$.data.reported_at", fu1_flag: "$.data.triggered_permanent_deferral" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T09:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "ADVERSE_EVENT", severity_grade: 2, description: "Transient bone pain" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { fu2_id: "$.data.id", fu2_flag: "$.data.triggered_permanent_deferral" }
            - call: "GET /registry/donors/${d1_id}/follow-ups"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { list_first: "$.data[0].id" }
          assert:
            - "both created rows carry id, reported_at and the business fields but NO version field and NO updated_at, because DonorFollowUp declares common_fields: false"
            - "DonorFollowUp.${fu1_id}.reported_at == \"2026-08-01T00:00:00Z\" and DonorFollowUp.${fu2_id}.reported_at == \"2026-08-30T09:00:00Z\""
            - "the list returns 2 rows in created_at ASC order with data[0].id == ${fu1_id}; the first row's event_type is still \"DAY_7_CONTACT\" with severity_grade 0 and description \"Routine day-7 call\""
            - "triggered_permanent_deferral == false on both rows (grade 2 < ADVERSE_EVENT_DEFERRAL_GRADE 4) and DonorProfile.${d1_id}.availability_status is still \"AVAILABLE\""
            - "DonorProfile.${d1_id}.adverse_event_count == 1 and last_followup_at == \"2026-08-30T09:00:00Z\""
            - "§1.5 declares no PATCH, PUT or DELETE route for follow-ups, so the row is unreachable for mutation by construction"

      - name: body_foreign_keys_are_resolved_before_any_state_rule_runs
        claim_type: Parent Relationships
        grounds:
          - validations.priority_6_body_fk_not_found_ladder
          - endpoints.POST_registry_collection_bookings
          - endpoints.POST_registry_search_requests
        distinguishing_aspect: |
          Priority 6 resolves body FKs in the order the endpoint's input list declares them, and it
          runs BEFORE every state and OCC rule: a booking whose workup_case_id is absent returns
          ERR_WORKUP_CASE_NOT_FOUND even though the request also carries a meaningless
          expected_workup_case_version, and a booking with a real case but an absent
          collection_center_id returns ERR_COLLECTION_CENTER_NOT_FOUND.
        test_recipe:
          setup:
            - "one collection center exists; no workup case exists yet"
          setup_api_calls:
            - call: "POST /registry/collection-centers"
              payload: { name: "Metro Apheresis Center", country_code: "US", concurrent_collection_capacity: 1 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ctr_id: "$.data.id", ctr_ver: "$.data.version" }
          trigger:
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "00000000-0000-0000-0000-000000000000", collection_center_id: "${ctr_id}", start_at: "2026-10-11T08:00:00Z", expected_workup_case_version: "${ctr_ver}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { e_case: "$.data.error_id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { e_patient_fk: "$.data.error_id" }
          assert:
            - "the booking call returns HTTP 404 ERR_WORKUP_CASE_NOT_FOUND - priority 6 outranks priority 33 (ERR_STALE_WORKUP_VERSION), so the supplied expected_workup_case_version (a real version value read from the center row, deliberately belonging to no workup case) is never compared at all"
            - "the search-request call returns HTTP 404 ERR_PATIENT_NOT_FOUND rather than ERR_PATIENT_NOT_OWNED (priority 7), because a row that does not exist cannot be owned"
            - "no CollectionBooking and no SearchRequest row is created; CollectionCenter.${ctr_id}.committed_slot_minutes is still 0"

      - name: every_child_entity_is_reachable_from_its_parent_through_a_declared_read
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - endpoints.GET_registry_patients_id_search_requests
          - endpoints.GET_registry_match_candidates
          - endpoints.GET_registry_workup_cases_id_clearance_items
          - endpoints.GET_registry_reimbursement_claims
          - endpoints.GET_registry_match_candidates_id_typing_requests
        distinguishing_aspect: |
          The topology is flat: identity is carried by body FKs, and nested GETs exist purely as
          reverse-reachability channels. One cascade (search -> candidate -> typing request ->
          workup case -> clearance items + claim) is walked through those channels only, proving every
          cascade-created child is discoverable without knowing its id in advance.
        test_recipe:
          setup:
            - "domestic registry, donor D1, patient, search, typing request answered, screening PASS and an OPEN workup case"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc_id: "$.data.id" }
          trigger:
            - call: "GET /registry/patients/${p_id}/search-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { walk_sr_id: "$.data[0].id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${walk_sr_id}", candidate_role: "PRIMARY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { walk_mc_id: "$.data[0].id" }
            - call: "GET /registry/match-candidates/${walk_mc_id}/typing-requests"
              payload: { status: "RESPONDED" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { walk_ct_id: "$.data[0].id" }
            - call: "GET /registry/match-candidates/${walk_mc_id}/workup-cases"
              payload: { case_status: "OPEN" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { walk_wc_id: "$.data[0].id" }
            - call: "GET /registry/workup-cases/${walk_wc_id}/clearance-items"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { walk_ci_id: "$.data[0].id" }
            - call: "GET /registry/reimbursement-claims"
              payload: { workup_case_id: "${walk_wc_id}" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { walk_claim_id: "$.data[0].id" }
          assert:
            - "each hop returns exactly one row and the walked ids equal the ids captured during setup: ${walk_sr_id} == ${sr_id}, ${walk_mc_id} == ${mc1_id}, ${walk_ct_id} == ${ct1_id}, ${walk_wc_id} == ${wc_id}"
            - "the clearance-items hop returns 3 rows in created_at ASC order with item_type PHYSICAL_EXAM, IDM_PANEL, CONSENT and result PENDING on all three"
            - "the claims hop returns 1 row with status PROVISIONAL and workup_case_id == ${walk_wc_id}"
            - "every FK declared in §1.1 is therefore reachable in reverse: SearchRequest.patient_id, MatchCandidate.search_request_id, ConfirmatoryTypingRequest.match_candidate_id, WorkupCase.match_candidate_id, ClearanceItem.workup_case_id and ReimbursementClaim.workup_case_id"
            - "no filter returns a row from a foreign parent: the candidate_role PRIMARY and case_status OPEN filters narrow within the parent, they never widen across parents"

  - section: state_machines
