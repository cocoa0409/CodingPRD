      - name: municipal_corridor_aggregate_and_adjacent_window
        grounds:
          - calculations.closure_corridor_utilization
          - validations.priority_17_ERR_CLOSURE_CAPACITY_EXCEEDED
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - entities.Municipality.fields.max_concurrent_closure_linear_feet
          - entities.Municipality.fields.committed_closure_linear_feet
        distinguishing_aspect: |
          Every one of the five permits is individually under the 800-foot corridor
          cap; only the overlapping collective breaches it. 600 ft over
          [08-15, 08-25) is refused against an APPROVED 300 ft over [08-10, 08-20)
          because 900 > 800, the same 600 ft over the ADJACENT [08-20, 08-30) is
          admitted because a window starting exactly when another ends does not
          intersect, a further 500 ft is refused at 1100, and a 200 ft request
          landing on exactly 800 is admitted because equality passes. Municipality
          .committed_closure_linear_feet then reads exactly 800 at clock 2026-08-22.
