scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: voucher_reimbursement_municipal_vs_donation
    grounds:
    - calculations.voucher_reimbursement_amount
    - entities.Voucher.fields.funding_source
    distinguishing_aspect: 'Same face value and same clinic cap produce different reimbursement

      splits depending on voucher.funding_source: MUNICIPAL_GRANT pays the

      full capped base while DONATION_FUND pays floor(base * 0.80) and

      bills the caretaker the remainder. Entity domain: Voucher/fiscal.

      '
    test_recipe:
      setup:
      - Clinic with voucher_reimbursement_cents = 25000
      - Caretaker owns a colony with two AT_LARGE adult cats
      - Two clinic days on the same clinic, each with base_capacity 1, surge 0, service_date 2026-08-10
      - 'Two vouchers of face_value_cents 20000: one MUNICIPAL_GRANT, one DONATION_FUND'
      - Both cats driven through appointment -> trapped -> check-in -> surgery (outcome STERILIZED)
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Pat Care
          phone: 555-1
          email: pat@x.com
          certified_tnr: true
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Pier Nine
          address: Pier 9
          caretaker_id: ${ct_id}
          estimated_population: 5
        as: ProgramCoordinator
        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: A1
          sex: MALE
          approximate_age_months: 24
        as: ProgramCoordinator
        captures:
          cat_a: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: A2
          sex: FEMALE
          approximate_age_months: 30
        as: ProgramCoordinator
        captures:
          cat_b: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: SeaClinic
          voucher_reimbursement_cents: 25000
          accepts_vouchers: true
        as: ProgramCoordinator
        captures:
          clin_id: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2026-08-10T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day1: $.data.id
      - call: GET /tnr/clinic-days/${day1}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot1: $.data[0].id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2026-08-11T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day2: $.data.id
      - call: GET /tnr/clinic-days/${day2}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot2: $.data[0].id
      - call: POST /tnr/vouchers
        payload:
          caretaker_id: ${ct_id}
          face_value_cents: 20000
          funding_source: MUNICIPAL_GRANT
        as: ProgramCoordinator
        captures:
          v_mun: $.data.id
      - call: POST /tnr/vouchers
        payload:
          caretaker_id: ${ct_id}
          face_value_cents: 20000
          funding_source: DONATION_FUND
        as: ProgramCoordinator
        captures:
          v_don: $.data.id
      - call: GET /tnr/clinic-days/${day1}
        payload: {}
        as: ClinicStaff
        captures:
          day1_v0: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat_a}
          clinic_slot_id: ${slot1}
          trap_date: '2026-08-09T00:00:00Z'
          voucher_id: ${v_mun}
          expected_clinic_day_version: ${day1_v0}
        as: Caretaker
        as_user_id: ${ct_id}
        captures:
          appt_a: $.data.id
      - call: POST /tnr/appointments/${appt_a}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct_id}
      - call: POST /tnr/appointments/${appt_a}/check-in
        payload: {}
        as: ClinicStaff
      - call: GET /tnr/clinic-days/${day2}
        payload: {}
        as: ClinicStaff
        captures:
          day2_v1: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat_b}
          clinic_slot_id: ${slot2}
          trap_date: '2026-08-10T00:00:00Z'
          voucher_id: ${v_don}
          expected_clinic_day_version: ${day2_v1}
        as: Caretaker
        as_user_id: ${ct_id}
        captures:
          appt_b: $.data.id
      - call: POST /tnr/appointments/${appt_b}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct_id}
      - call: POST /tnr/appointments/${appt_b}/check-in
        payload: {}
        as: ClinicStaff
      trigger:
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt_a}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt_b}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      - call: GET /tnr/vouchers/${v_mun}
        payload: {}
        as: ProgramCoordinator
        captures:
          vm_status: $.data.status
      - call: GET /tnr/vouchers/${v_don}
        payload: {}
        as: ProgramCoordinator
        captures:
          vd_status: $.data.status
      assert:
      - Voucher.${v_mun}.status == REDEEMED and its reimbursement_cents == 20000 and caretaker_share_cents == 0
      - Voucher.${v_don}.status == REDEEMED and its reimbursement_cents == 16000 and caretaker_share_cents == 4000
  - name: colony_sterilization_resident_basis_excludes_adopted
    grounds:
    - calculations.colony_sterilization_rate
    - entities.Colony.fields.sterilized_pct
    distinguishing_aspect: 'The sterilization rate''s resident basis excludes ADOPTED cats from

      the denominator while IN_FOSTER kittens stay in it; the same colony

      yields a different sterilized_pct depending on which status set is

      counted. Entity domain: Colony/aggregate population — distinct from

      the Voucher fiscal domain of the sibling instance.

      '
    test_recipe:
      setup:
      - Colony with 4 cats; 2 returned (sterilized), 1 kitten in foster, 1 adopted
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Sam Shore
          phone: 555-2
          email: sam@x.com
