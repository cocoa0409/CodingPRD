        distinguishing_aspect: "MAX_REWORK_COUNT is a lifetime cap on the lot, not a per-excursion allowance: after two completed rework loops through seq 10 the lot sits on SPC_HOLD with rework_count 2 and a fresh REWORK disposition, and the third rework returns ERR_REWORK_LIMIT_EXCEEDED 409 with the counter frozen at 2, the hold still in place and current_step_seq still 20."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with step seq 10 LITHO 2.0h, step seq 20 LITHO 3.0h (metrology_required, rework_target_step_id = the seq 10 step) and step seq 30 LITHO 2.0h, so total_standard_hours is 7.0."
            - "SpcChart CD-20 on step seq 20 (target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00)."
            - "CH_L1 QUALIFIED on LITHO-1; operator OP-001 GOWNED and LITHO-certified; PLAN-A COMMITTED (committed_hours 70.00 against a 200.0 budget); LOT-001 (3 wafers) RELEASED."
            - "The clock is never advanced, so every run books actual_hours 0.00 and the tool's ledger returns to 720.00 after each track-out; only the rework counter moves."
            - "Two full rework loops are executed: seq 10 in/out, seq 20 in, a 112.00 measurement, SPC_CHART containment by u_qm_1, seq 20 track-out, REWORK disposition by u_ye_1, rework by u_pe_1 — leaving rework_count 2 and current_step_seq 9."
            - "A third loop is staged up to the REWORK disposition, so the lot is again on SPC_HOLD at current_step_seq 20."
