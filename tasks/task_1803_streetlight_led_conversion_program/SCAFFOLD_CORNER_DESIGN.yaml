        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: DP-1
