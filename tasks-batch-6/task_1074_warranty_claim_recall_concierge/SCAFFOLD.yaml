scenario: "Warranty-Claim & Recall Concierge: product registry & recall-match, claim filing & documentation, replacement/refund tracking, subscription, manufacturer coordination, safety alert, family/household, reporting"
domain_name: warranty-claim-recall-concierge
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: graph
  # graph: Product is a junction between Household and Manufacturer; RecallMatch is a
  # many-to-many junction between RecallNotice and Product; Claim/Resolution cross
  # aggregate boundaries (Product, Member, RecallMatch, Manufacturer).
  state_machine_shape: cyclic
  # Claim carries a revision cycle (UNDER_REVIEW -> NEEDS_DOCS -> SUBMITTED) plus a
  # branch (APPROVED vs REJECTED); RecallMatch is a branching fork (ACKNOWLEDGED vs
  # DISMISSED) with divergent side-effect sets.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # SoD: the ConciergeAgent who moves a Claim to UNDER_REVIEW cannot be the one who
  # APPROVES it (reviewer != approver, tracked on X-User-ID). Peer roles otherwise:
  # ManufacturerAgent owns recalls/RMA, Household roles own products/claims.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: primary_email
        type: string
        source: input
        description: contact email for the household account
      - name: display_name
        type: string
        source: input
        description: household display name (e.g., "The Ramirez Family")
      - name: exposure_scoring_mode
        type: enum
        source: input
        description: which recall-exposure algorithm this household uses
        default: WEIGHTED
        constraints: "one of {WEIGHTED, COUNT}"
      - name: recall_exposure_score
        type: integer
        source: computed
        description: derived from open RecallMatches on this household's products; see calculations.recall_exposure_score
        default: 0
      - name: active_claim_count
        type: integer
        source: computed
        description: count of this household's Claims in non-terminal states; see calculations.active_claim_count
        default: 0
      - name: status
        type: enum
        source: system
        description: account status
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this member belongs to"
      - name: full_name
        type: string
        source: input
        description: member full name
      - name: email
        type: string
        source: input
        description: member email
      - name: role
        type: enum
        source: input
        description: household role; exactly one OWNER exists per household (the creator)
        constraints: "one of {OWNER, ADULT, MINOR}"
      - name: status
        type: enum
        source: system
        description: membership status
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household holding this subscription"
      - name: tier
        type: enum
        source: input
        description: plan tier; drives claim allowance, extended-warranty bonus, refund proration, shipping reimbursement, concierge fee (see calculations.constants TIER_CONFIG)
        constraints: "one of {BASIC, PLUS, PREMIUM}"
      - name: status
        type: enum
        source: system
        description: subscription lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, PAST_DUE, CANCELLED}"
      - name: period_start
        type: datetime
        source: input
        description: coverage period start (inclusive)
      - name: period_end
        type: datetime
        source: input
        description: coverage period end (exclusive); interval is half-open [period_start, period_end)
      - name: claims_used
        type: integer
        source: computed
        description: claims consumed this period; incremented on Claim SUBMIT, decremented on pre-approval WITHDRAW; see calculations.claims_used_ledger
        default: 0
      - name: auto_renew
        type: boolean
        source: input
        description: whether the subscription auto-renews
        default: true

  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: manufacturer legal name
      - name: contact_email
        type: string
        source: input
        description: manufacturer coordination contact
      - name: coordination_enabled
        type: boolean
        source: input
        description: whether this manufacturer participates in RMA coordination; gates Resolution.request-rma
        default: true
      - name: rma_required
        type: boolean
        source: input
        description: whether REPLACEMENT resolutions require an authorized RMA before dispatch
        default: true

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; owning household"
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the product's manufacturer"
      - name: model_number
        type: string
        source: input
        description: model number, matched against RecallNotice.affected_model_number
      - name: serial_number
        type: integer
        source: input
        description: numeric serial; matched against RecallNotice serial range (inclusive both ends)
      - name: purchase_date
        type: datetime
        source: input
        description: date of purchase; warranty clock origin
      - name: purchase_price_cents
        type: integer
        source: input
        description: purchase price in integer cents; refund basis
      - name: warranty_months
        type: integer
        source: input
        description: base manufacturer warranty length in calendar months
      - name: registration_status
        type: enum
        source: system
        description: registry lifecycle
        default: REGISTERED
        constraints: "one of {REGISTERED, ARCHIVED}"
      - name: recall_status
        type: enum
        source: system
        description: rolled up from RecallMatch side-effects
        default: NONE
        constraints: "one of {NONE, RECALLED, REMEDIED}"
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: purchase_date + effective warranty months; see calculations.warranty_coverage
      - name: coverage_status
        type: enum
        source: computed
        description: UNDER_WARRANTY | EXPIRED | COVERED_BY_RECALL; see calculations.warranty_coverage
        constraints: "one of {UNDER_WARRANTY, EXPIRED, COVERED_BY_RECALL}"

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; issuing manufacturer"
      - name: affected_model_number
        type: string
        source: input
        description: model number targeted by this recall
      - name: serial_range_start
        type: integer
        source: input
        description: inclusive lower bound of affected serials
      - name: serial_range_end
        type: integer
        source: input
        description: inclusive upper bound of affected serials
      - name: severity
        type: enum
        source: input
        description: recall severity; drives exposure weight (LOW=1, HIGH=3, CRITICAL=5)
        constraints: "one of {LOW, HIGH, CRITICAL}"
      - name: remedy_type
        type: enum
        source: input
        description: manufacturer's prescribed remedy
        constraints: "one of {REPAIR, REPLACE, REFUND}"
      - name: effective_from
        type: datetime
        source: input
        description: recall effective window start (inclusive)
      - name: effective_to
        type: datetime
        source: input
        description: recall effective window end (inclusive); interval is CLOSED [effective_from, effective_to]
      - name: status
        type: enum
        source: system
        description: recall lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CLOSED}"
      - name: matched_product_count
        type: integer
        source: computed
        description: number of RecallMatches created at publish time
        default: 0

  - name: RecallMatch
    parent: null
    common_fields: true
    fields:
      - name: recall_notice_id
        type: string
        source: input
        description: "FK -> RecallNotice.id; the recall that produced this match"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the matched product"
      - name: severity_weight
        type: integer
        source: system
        description: snapshot of the recall severity weight (LOW=1, HIGH=3, CRITICAL=5) at match time
      - name: status
        type: enum
        source: system
        description: match lifecycle; MATCHED and ACKNOWLEDGED are "open" (count toward exposure)
        default: MATCHED
        constraints: "one of {MATCHED, ACKNOWLEDGED, REMEDIED, DISMISSED}"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product the claim is filed against"
      - name: filed_by_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member who created the claim"
      - name: recall_match_id
        type: string
        source: input
        description: "FK -> RecallMatch.id; nullable, set only for RECALL claims"
        default: null
      - name: claim_type
        type: enum
        source: input
        description: WARRANTY (standard) or RECALL (tied to a RecallMatch)
        constraints: "one of {WARRANTY, RECALL}"
      - name: resolution_preference
        type: enum
        source: input
        description: requested outcome
        constraints: "one of {REPLACEMENT, REFUND}"
      - name: issue_description
        type: string
        source: input
        description: free-text description of the fault
      - name: shipping_cost_cents
        type: integer
        source: input
        description: claimant-incurred return-shipping cost; copied to the Resolution and reimbursed per tier at settlement
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConciergeAgent who moved the claim to UNDER_REVIEW; used for SoD on approve
        default: null
      - name: status
        type: enum
        source: system
        description: claim lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_DOCS, APPROVED, REJECTED, RESOLVED, WITHDRAWN}"
      - name: settlement_total_cents
        type: integer
        source: computed
        description: mirror of the linked Resolution.settlement_total_cents once resolved; null before resolution
        default: null

  - name: ClaimDocument
    parent: null
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this document supports"
      - name: doc_type
        type: enum
        source: input
        description: kind of supporting document
        constraints: "one of {RECEIPT, PHOTO, SERIAL_PROOF, OTHER}"
      - name: file_uri
        type: string
        source: input
        description: storage URI of the uploaded document

  - name: Resolution
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the approved claim being resolved"
      - name: replacement_product_id
        type: string
        source: input
        description: "FK -> Product.id; nullable, the newly registered replacement unit when mode=REPLACEMENT"
        default: null
      - name: mode
        type: enum
        source: system
        description: copied from Claim.resolution_preference at creation
        constraints: "one of {REPLACEMENT, REFUND}"
      - name: refund_variant
        type: enum
        source: computed
        description: FULL or PRORATED, selected by subscription tier; see calculations.refund_amount
        constraints: "one of {FULL, PRORATED}"
        default: null
      - name: refund_amount_cents
        type: integer
        source: computed
        description: computed refund basis in cents; see calculations.refund_amount; null when mode=REPLACEMENT
        default: null
      - name: shipping_cost_cents
        type: integer
        source: system
        description: copied from the linked Claim.shipping_cost_cents at Resolution creation; basis for reimbursement
        default: 0
      - name: shipping_reimbursement_cents
        type: integer
        source: computed
        description: shipping_cost_cents * tier shipping_reimbursement_pct, rounded; see calculations.settlement_total
        default: 0
      - name: concierge_fee_cents
        type: integer
        source: computed
        description: refund_amount_cents * tier concierge_fee_pct, rounded; deducted from settlement; see calculations.settlement_total
        default: 0
      - name: settlement_total_cents
        type: integer
        source: computed
        description: refund_amount_cents + shipping_reimbursement_cents - concierge_fee_cents; see calculations.settlement_total
        default: 0
      - name: rma_status
        type: enum
        source: system
        description: manufacturer RMA coordination status for REPLACEMENT resolutions
        default: NONE
        constraints: "one of {NONE, REQUESTED, AUTHORIZED}"
      - name: status
        type: enum
        source: system
        description: resolution lifecycle
        default: PENDING
        constraints: "one of {PENDING, DISPATCHED, COMPLETED, FAILED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due"
        actor: PlatformAdmin
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["set subscription.status = PAST_DUE"]
        note: "billing lapse; blocks new claim submissions for the household (cross-entity, see Claim.SUBMITTED preconditions)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/reinstate"
        actor: HouseholdOwner
        preconditions: ["subscription.status == PAST_DUE"]
        side_effects: ["set subscription.status = ACTIVE"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: HouseholdOwner
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["set subscription.status = CANCELLED"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: HouseholdOwner
        preconditions: ["subscription.status == PAST_DUE"]
        side_effects: ["set subscription.status = CANCELLED"]

  - entity: Product
    initial_state: REGISTERED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REGISTERED
        to: ARCHIVED
        trigger: "POST /products/{id}/archive"
        actor: HouseholdOwner
        preconditions:
          - "product.registration_status == REGISTERED"
          - "no Claim on this product is in a non-terminal state {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_DOCS, APPROVED}"
        side_effects: ["set product.registration_status = ARCHIVED"]
        note: "recall_status is an independent system field set by RecallMatch side-effects, not a lifecycle state"

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /recall-notices/{id}/publish"
        actor: ManufacturerAgent
        preconditions:
          - "recall.status == DRAFT"
          - "no other PUBLISHED RecallNotice from the same manufacturer_id with the same affected_model_number has a CLOSED-interval [effective_from, effective_to] overlapping this recall's window (touching endpoints overlap)"
        side_effects:
          - "CASCADE L1: for every Product with registration_status=REGISTERED where product.manufacturer_id == recall.manufacturer_id AND product.model_number == recall.affected_model_number AND recall.serial_range_start <= product.serial_number <= recall.serial_range_end, create a RecallMatch{status=MATCHED, severity_weight=weight(recall.severity)}"
          - "set recall.matched_product_count = number of RecallMatches created"
          - "CASCADE L2 (per created RecallMatch): set the matched Product.recall_status = RECALLED"
          - "CASCADE L3 (per affected Product's household): recompute Household.recall_exposure_score (calculations.recall_exposure_score)"
        note: "depth>=3 transitive cascade: publish -> RecallMatch created -> Product.recall_status -> Household.recall_exposure_score"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /recall-notices/{id}/close"
        actor: ManufacturerAgent
        preconditions: ["recall.status == PUBLISHED"]
        side_effects: ["set recall.status = CLOSED"]
        note: "closing frees the manufacturer+model interval so a superseding recall may publish"

  - entity: RecallMatch
    initial_state: MATCHED
    terminal_states: [REMEDIED, DISMISSED]
    transitions:
      - from: MATCHED
        to: ACKNOWLEDGED
        trigger: "POST /recall-matches/{id}/acknowledge"
        actor: HouseholdOwner | HouseholdMember
        preconditions:
          - "match.status == MATCHED"
          - "the parent RecallNotice.status == PUBLISHED (cross-entity)"
        side_effects: ["set match.status = ACKNOWLEDGED"]
        note: "ACKNOWLEDGED still counts toward exposure (open set = {MATCHED, ACKNOWLEDGED}); no score change"
      - from: MATCHED
        to: DISMISSED
        trigger: "POST /recall-matches/{id}/dismiss"
        actor: HouseholdOwner
        preconditions: ["match.status == MATCHED"]
        side_effects:
          - "set match.status = DISMISSED"
          - "recompute Household.recall_exposure_score (this match leaves the open set)"
        note: "branch A of the fork; divergent side-effect set from acknowledge"
      - from: ACKNOWLEDGED
        to: REMEDIED
        trigger: "POST /recall-matches/{id}/remedy"
        actor: ManufacturerAgent | ConciergeAgent
        preconditions: ["match.status == ACKNOWLEDGED"]
        side_effects:
          - "set match.status = REMEDIED"
          - "set the matched Product.recall_status = REMEDIED"
          - "recompute Household.recall_exposure_score (this match leaves the open set)"
        note: "branch B terminal; compensating side-effect that removes the severity weight added at match time"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [REJECTED, RESOLVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: HouseholdOwner | HouseholdMember
        preconditions:
          - "claim.status == DRAFT"
          - "product.registration_status == REGISTERED (cross-entity)"
          - "the household's Subscription.status == ACTIVE (cross-entity)"
          - "subscription.claims_used < TIER_CONFIG[tier].included_claims_per_year (fiscal, boundary >=)"
          - "at least one ClaimDocument exists for this claim"
        side_effects:
          - "set claim.status = SUBMITTED"
          - "increment subscription.claims_used by 1 (calculations.claims_used_ledger)"
          - "recompute Household.active_claim_count"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: ConciergeAgent
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["set claim.status = UNDER_REVIEW", "set claim.reviewed_by_user_id = acting X-User-ID"]
      - from: UNDER_REVIEW
        to: NEEDS_DOCS
        trigger: "POST /claims/{id}/request-docs"
        actor: ConciergeAgent
        preconditions: ["claim.status == UNDER_REVIEW"]
        side_effects: ["set claim.status = NEEDS_DOCS"]
        note: "opens the revision cycle"
      - from: NEEDS_DOCS
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: HouseholdOwner | HouseholdMember
        preconditions:
          - "claim.status == NEEDS_DOCS"
          - "a ClaimDocument was added after the claim entered NEEDS_DOCS (created_at > the transition time)"
        side_effects: ["set claim.status = SUBMITTED"]
        note: "cycle back; does NOT re-increment claims_used (allowance already consumed on first submit)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ConciergeAgent
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "acting X-User-ID != claim.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "set claim.status = APPROVED"
          - "CASCADE L1: create a Resolution{claim_id, mode=claim.resolution_preference, status=PENDING}"
          - "CASCADE L2: if mode=REFUND, compute Resolution.refund_amount_cents + settlement_total_cents (calculations.refund_amount, calculations.settlement_total)"
          - "recompute Household.active_claim_count"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /claims/{id}/reject"
        actor: ConciergeAgent
        preconditions: ["claim.status == UNDER_REVIEW", "acting X-User-ID != claim.reviewed_by_user_id (segregation of duties)"]
        side_effects: ["set claim.status = REJECTED", "recompute Household.active_claim_count"]
        note: "REJECTED still counts against claims_used (the allowance was consumed)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: HouseholdOwner | HouseholdMember
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "set claim.status = WITHDRAWN"
          - "decrement subscription.claims_used by 1 (compensating; calculations.claims_used_ledger)"
          - "recompute Household.active_claim_count"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: HouseholdOwner | HouseholdMember
        preconditions: ["claim.status == UNDER_REVIEW"]
        side_effects:
          - "set claim.status = WITHDRAWN"
          - "decrement subscription.claims_used by 1 (compensating; calculations.claims_used_ledger)"
          - "recompute Household.active_claim_count"
      - from: NEEDS_DOCS
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: HouseholdOwner | HouseholdMember
        preconditions: ["claim.status == NEEDS_DOCS"]
        side_effects:
          - "set claim.status = WITHDRAWN"
          - "decrement subscription.claims_used by 1 (compensating; calculations.claims_used_ledger)"
          - "recompute Household.active_claim_count"

  - entity: Resolution
    initial_state: PENDING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /resolutions/{id}/dispatch"
        actor: ConciergeAgent
        preconditions:
          - "resolution.status == PENDING"
          - "if mode == REPLACEMENT AND the product's Manufacturer.rma_required == true, then resolution.rma_status == AUTHORIZED (cross-entity)"
        side_effects: ["set resolution.status = DISPATCHED"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /resolutions/{id}/complete"
        actor: ConciergeAgent
        preconditions: ["resolution.status == DISPATCHED"]
        side_effects:
          - "set resolution.status = COMPLETED"
          - "CASCADE L1: set the linked Claim.status = RESOLVED and Claim.settlement_total_cents = resolution.settlement_total_cents"
          - "CASCADE L2: if the Claim is a RECALL claim, set the linked RecallMatch.status = REMEDIED and recompute Household.recall_exposure_score; set matched Product.recall_status = REMEDIED"
          - "recompute Household.active_claim_count"
        note: "depth>=3 cascade from a different trigger than publish: complete -> Claim RESOLVED -> RecallMatch REMEDIED -> Household.recall_exposure_score"
      - from: PENDING
        to: FAILED
        trigger: "POST /resolutions/{id}/fail"
        actor: ConciergeAgent
        preconditions: ["resolution.status == PENDING"]
        side_effects: ["set resolution.status = FAILED"]
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /resolutions/{id}/fail"
        actor: ConciergeAgent
        preconditions: ["resolution.status == DISPATCHED"]
        side_effects: ["set resolution.status = FAILED"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: subscription-change-plan-stale
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's tier against a Subscription whose version has
      advanced since the client last observed it is rejected. A plan change
      legitimately supersedes the prior tier configuration, so a second change
      carrying a stale expected_subscription_version reflects a view that a prior
      change already superseded; the system rejects the stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: warranty_coverage
    trigger: "read/derive whenever a Product is fetched or evaluated (claim submit, resolution refund); recomputed against the current logical clock"
    algorithm: threshold
    formula: |
      # --- effective warranty length (>=3 inputs; nested conditionals) ---
      active_sub = the household's Subscription with status == ACTIVE (else none)
      bonus = TIER_CONFIG[active_sub.tier].extended_warranty_bonus_months if active_sub exists else 0
      effective_months = warranty_months + bonus
      warranty_expires_at = add_calendar_months(purchase_date, effective_months)
        # add_calendar_months clamps overflow to the last day of the target month
      # --- coverage status (recall override wins) ---
      if EXISTS RecallMatch on this product with status IN {MATCHED, ACKNOWLEDGED}:
          coverage_status = COVERED_BY_RECALL
      elif current_clock <= warranty_expires_at:
          coverage_status = UNDER_WARRANTY      # boundary: equality is still covered
      else:
          coverage_status = EXPIRED
    input_set: "single Product; the household's ACTIVE Subscription (if any); open RecallMatches on the product; the logical clock. The household's ACTIVE Subscription is uniquely resolved as the Subscription with status==ACTIVE whose half-open [period_start, period_end) contains current_clock; periods are non-overlapping (validation 11) so at most one qualifies; if none, treat as no active subscription (bonus=0)."
    constants:
      TIER_CONFIG:
        BASIC:   { included_claims_per_year: 2,  extended_warranty_bonus_months: 0,  prorate_refunds: true,  shipping_reimbursement_pct: 0.0, concierge_fee_pct: 0.10 }
        PLUS:    { included_claims_per_year: 5,  extended_warranty_bonus_months: 6,  prorate_refunds: false, shipping_reimbursement_pct: 0.5, concierge_fee_pct: 0.05 }
        PREMIUM: { included_claims_per_year: 20, extended_warranty_bonus_months: 12, prorate_refunds: false, shipping_reimbursement_pct: 1.0, concierge_fee_pct: 0.0 }
    precision: "whole days for the comparison; datetimes in UTC"
    note: "combinatorial mode (a): >=3 inputs (warranty_months, tier bonus, purchase_date, clock, recall state) with nested conditional branches and a recall override."

  - name: refund_amount
    trigger: "on Claim UNDER_REVIEW->APPROVED when resolution_preference == REFUND (Resolution.refund_amount_cents)"
    algorithm: threshold
    formula: |
      prorate = TIER_CONFIG[active_sub.tier].prorate_refunds
      if prorate == false:
          refund_variant = FULL
          refund_amount_cents = product.purchase_price_cents
      else:
          refund_variant = PRORATED
          total_days = day_diff(purchase_date, warranty_expires_at)   # effective warranty span in days
          elapsed_days = day_diff(purchase_date, current_clock)
          remaining_days = max(0, total_days - elapsed_days)
          # remaining fraction of the warranty, applied to price; round_half_up to cents
          refund_amount_cents = round_half_up(product.purchase_price_cents * remaining_days / total_days)
    input_set: "the claim's Product; the household's ACTIVE Subscription tier; the logical clock; warranty_expires_at from warranty_coverage"
    constants:
      TIER_CONFIG: "see warranty_coverage.constants.TIER_CONFIG"
    precision: "2 decimal places (integer cents), round_half_up"
    variants:
      - name: FULL
        when: "subscription tier has prorate_refunds == false (PLUS, PREMIUM)"
        difference: "refund equals full purchase_price_cents regardless of elapsed warranty"
      - name: PRORATED
        when: "subscription tier has prorate_refunds == true (BASIC)"
        difference: "refund equals purchase_price_cents * remaining_warranty_days / total_warranty_days, rounded"
    note: "dual-variant calc on the FINANCIAL (Resolution/Claim) domain; distinct entity domain from recall_exposure_score."

  - name: recall_exposure_score
    trigger: "recomputed on RecallMatch create (publish cascade), acknowledge (no delta), dismiss, remedy, and resolution complete for RECALL claims (Household.recall_exposure_score)"
    algorithm: aggregation
    formula: |
      open_matches = [ m for m in RecallMatch
                       where m.product.household_id == household.id
                       and m.status IN {MATCHED, ACKNOWLEDGED} ]
      if household.exposure_scoring_mode == WEIGHTED:
          recall_exposure_score = sum(m.severity_weight for m in open_matches)   # LOW=1,HIGH=3,CRITICAL=5
      else:  # COUNT
          recall_exposure_score = len(open_matches)
    input_set: "all RecallMatch rows whose product belongs to the household and whose status is in the open set {MATCHED, ACKNOWLEDGED}"
    constants:
      SEVERITY_WEIGHT: { LOW: 1, HIGH: 3, CRITICAL: 5 }
    precision: "integer"
    variants:
      - name: WEIGHTED
        when: "household.exposure_scoring_mode == WEIGHTED (default)"
        difference: "sums severity_weight over open matches"
      - name: COUNT
        when: "household.exposure_scoring_mode == COUNT"
        difference: "counts open matches, ignoring severity"
    note: "dual-variant calc on the RISK (Household) domain; distinct entity domain from refund_amount."

  - name: settlement_total
    trigger: "on Claim APPROVED with mode==REFUND, and mirrored to Claim.settlement_total_cents on Resolution complete (Resolution.settlement_total_cents)"
    algorithm: aggregation
    formula: |
      # PIN: each component is rounded to whole cents INDEPENDENTLY (round_half_up),
      # THEN combined. (Round-per-component-then-sum, NOT sum-then-round.)
      refund_component   = refund_amount_cents                                   # already whole cents
      shipping_component = round_half_up(shipping_cost_cents * TIER_CONFIG[tier].shipping_reimbursement_pct)
      concierge_fee      = round_half_up(refund_amount_cents * TIER_CONFIG[tier].concierge_fee_pct)
      settlement_total_cents = refund_component + shipping_component - concierge_fee
    input_set: "the Resolution's refund_amount_cents, its shipping_cost_cents, and the household ACTIVE subscription tier config"
    constants:
      TIER_CONFIG: "see warranty_coverage.constants.TIER_CONFIG"
    precision: "each component round_half_up to integer cents before combining"
    note: "combinatorial mode (b): the pinned per-component rounding order differs from sum-then-round when shipping_component and concierge_fee carry half-cent remainders."

  - name: claims_used_ledger
    trigger: "Claim DRAFT->SUBMITTED increments; pre-approval WITHDRAW (from SUBMITTED/UNDER_REVIEW/NEEDS_DOCS) decrements (Subscription.claims_used)"
    algorithm: aggregation
    formula: |
      # invariant maintained by the two compensating transitions:
      claims_used == COUNT( Claim c
                            where c.product.household_id == subscription.household_id
                            and c.status IN {SUBMITTED, UNDER_REVIEW, NEEDS_DOCS, APPROVED, RESOLVED, REJECTED} )
      # SUBMIT: claims_used += 1 ; WITHDRAW(pre-approval): claims_used -= 1
      # NEEDS_DOCS->SUBMITTED (re-submit in the cycle) does NOT re-increment.
    input_set: "Claims whose product belongs to the subscription's household, in the consumed set"
    constants: {}
    precision: "integer, floor 0"
    note: "conserved quantity for compensating-invariant rule 9a (allowance usage)."

  - name: active_claim_count
    trigger: "recomputed on every Claim transition (Household.active_claim_count)"
    algorithm: aggregation
    formula: |
      active_claim_count = COUNT( Claim c
                                  where c.product.household_id == household.id
                                  and c.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_DOCS, APPROVED} )
    input_set: "Claims whose product belongs to the household in a non-terminal state"
    constants: {}
    precision: "integer"
    note: "derived-field reconciliation; distinct from claims_used (which retains REJECTED/RESOLVED)."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /households and GET endpoints that permit Anonymous"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles acting on a household-owned resource, X-User-ID must be a Member of the resource's household"
    error_id: ERR_NOT_HOUSEHOLD_MEMBER
    http_status: 403
    applies_to: "product/claim/subscription/recall-match member operations"
  - priority: 4
    category: existence
    check: "every path/body id references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "on Claim submit: the product.registration_status == REGISTERED"
    error_id: ERR_PRODUCT_ARCHIVED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"
  - priority: 7
    category: business_safety
    check: "on RecallMatch acknowledge: parent RecallNotice.status == PUBLISHED (safety notice still live)"
    error_id: ERR_RECALL_NOT_LIVE
    http_status: 409
    applies_to: "POST /recall-matches/{id}/acknowledge"
  - priority: 8
    category: business_constraint
    check: "on Claim approve/reject: acting X-User-ID != claim.reviewed_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /claims/{id}/approve, POST /claims/{id}/reject"
  - priority: 9
    category: business_referential
    check: "on Resolution request-rma: the product's Manufacturer.coordination_enabled == true"
    error_id: ERR_COORDINATION_DISABLED
    http_status: 409
    applies_to: "POST /resolutions/{id}/request-rma"
  - priority: 10
    category: business_temporal
    check: "on RecallNotice publish: no PUBLISHED recall from same manufacturer+model has a CLOSED-interval overlap (touching endpoints overlap)"
    error_id: ERR_RECALL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /recall-notices/{id}/publish"
  - priority: 11
    category: business_temporal
    check: "on Subscription create: the household has no other non-CANCELLED Subscription whose half-open [period_start, period_end) overlaps the new one (touching endpoints do NOT overlap)"
    error_id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /households/{id}/subscriptions"
  - priority: 12
    category: business_constraint
    check: "on Claim submit: at least one ClaimDocument exists for the claim (and, when re-submitting from NEEDS_DOCS, a document added after entering NEEDS_DOCS)"
    error_id: ERR_MISSING_DOCUMENTATION
    http_status: 409
    applies_to: "POST /claims/{id}/submit"
  - priority: 13
    category: business_constraint
    check: "on Claim submit: the household's Subscription.status == ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /claims/{id}/submit"
  - priority: 14
    category: business_fiscal
    check: "on Claim submit: subscription.claims_used < TIER_CONFIG[tier].included_claims_per_year (boundary >=)"
    error_id: ERR_CLAIM_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_subscription_version matches current Subscription.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/change-plan"
  - priority: 16
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, integers non-negative, serial_range_start <= serial_range_end, period_start < period_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Household & Members ----
  - method: POST
    path: "/households"
    description: "self-service: create a household account (open, no auth)"
    roles: [Anonymous]
    code: 201
    input: [primary_email, display_name, "exposure_scoring_mode?"]
    output: Household
    side_effects: ["Household created with status=ACTIVE, recall_exposure_score=0, active_claim_count=0"]
  - method: POST
    path: "/households/{id}/members"
    description: "add a member; Anonymous may create the first OWNER when the household has none, HouseholdOwner adds ADULT/MINOR"
    roles: [Anonymous, HouseholdOwner]
    code: 201
    input: [full_name, email, role]
    output: Member
    side_effects: ["Member created with status=ACTIVE"]
  - method: GET
    path: "/households/{id}"
    description: "read a household including computed recall_exposure_score and active_claim_count"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "read a member"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "list members, filterable by household (reverse-reachability for Member.household_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  # ---- Subscriptions ----
  - method: POST
    path: "/households/{id}/subscriptions"
    description: "create a subscription for a household (half-open coverage period)"
    roles: [HouseholdOwner]
    code: 201
    input: [tier, period_start, period_end, "auto_renew?"]
    output: Subscription
    side_effects: ["Subscription created with status=ACTIVE, claims_used=0; rejects if period overlaps a non-CANCELLED subscription"]
  - method: POST
    path: "/subscriptions/{id}/change-plan"
    description: "change subscription tier (OCC-guarded; supersedes prior tier)"
    roles: [HouseholdOwner]
    code: 200
    input: [tier, expected_subscription_version]
    output: Subscription
    side_effects: ["set subscription.tier", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/mark-past-due"
    description: "mark a subscription PAST_DUE (billing lapse)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["set subscription.status = PAST_DUE"]
  - method: POST
    path: "/subscriptions/{id}/reinstate"
    description: "reinstate a PAST_DUE subscription to ACTIVE"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Subscription
    side_effects: ["set subscription.status = ACTIVE"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "cancel a subscription"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Subscription
    side_effects: ["set subscription.status = CANCELLED"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "read a subscription"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "list subscriptions, filterable by household (reverse-reachability for Subscription.household_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  # ---- Manufacturers ----
  - method: POST
    path: "/manufacturers"
    description: "register a manufacturer (platform operation)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email, "coordination_enabled?", "rma_required?"]
    output: Manufacturer
    side_effects: ["Manufacturer created"]
  - method: GET
    path: "/manufacturers/{id}"
    description: "read a manufacturer"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  # ---- Products (registry) ----
  - method: POST
    path: "/products"
    description: "register a product in a household's registry"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [household_id, manufacturer_id, model_number, serial_number, purchase_date, purchase_price_cents, warranty_months]
    output: Product
    side_effects: ["Product created with registration_status=REGISTERED, recall_status=NONE; warranty_expires_at/coverage_status computed"]
  - method: POST
    path: "/products/{id}/archive"
    description: "archive a product (soft-remove from registry)"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Product
    side_effects: ["set product.registration_status = ARCHIVED; rejects if a non-terminal Claim exists on the product"]
  - method: GET
    path: "/products/{id}"
    description: "read a product with computed warranty_expires_at and coverage_status"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "list products, filterable by household or manufacturer (reverse-reachability for Product.household_id and Product.manufacturer_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: ["household_id?", "manufacturer_id?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- Recall Notices ----
  - method: POST
    path: "/recall-notices"
    description: "manufacturer drafts a recall notice"
    roles: [ManufacturerAgent]
    code: 201
    input: [manufacturer_id, affected_model_number, serial_range_start, serial_range_end, severity, remedy_type, effective_from, effective_to]
    output: RecallNotice
    side_effects: ["RecallNotice created with status=DRAFT, matched_product_count=0"]
  - method: POST
    path: "/recall-notices/{id}/publish"
    description: "publish a recall; matches products and cascades safety exposure"
    roles: [ManufacturerAgent]
    code: 200
    input: []
    output: RecallNotice
    side_effects:
      - "create a RecallMatch for every REGISTERED matching product (model + inclusive serial range)"
      - "set matched_product_count"
      - "set each matched Product.recall_status = RECALLED"
      - "recompute each affected Household.recall_exposure_score"
      - "rejects with ERR_RECALL_WINDOW_OVERLAP on closed-interval overlap with another PUBLISHED recall for same manufacturer+model"
  - method: POST
    path: "/recall-notices/{id}/close"
    description: "close a published recall (frees its manufacturer+model interval)"
    roles: [ManufacturerAgent]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["set recall.status = CLOSED"]
  - method: GET
    path: "/recall-notices/{id}"
    description: "read a recall notice"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: GET
    path: "/recall-notices"
    description: "list recall notices, filterable by manufacturer (reverse-reachability for RecallNotice.manufacturer_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: ["manufacturer_id?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []

  # ---- Recall Matches (safety alerts) ----
  - method: POST
    path: "/recall-matches/{id}/acknowledge"
    description: "household acknowledges a safety-alert match"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: RecallMatch
    side_effects: ["set match.status = ACKNOWLEDGED (no exposure delta; still open)"]
  - method: POST
    path: "/recall-matches/{id}/dismiss"
    description: "household dismisses a match (removes it from exposure)"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: RecallMatch
    side_effects: ["set match.status = DISMISSED", "recompute Household.recall_exposure_score"]
  - method: POST
    path: "/recall-matches/{id}/remedy"
    description: "mark an acknowledged match remedied (manufacturer/concierge)"
    roles: [ManufacturerAgent, ConciergeAgent]
    code: 200
    input: []
    output: RecallMatch
    side_effects: ["set match.status = REMEDIED", "set matched Product.recall_status = REMEDIED", "recompute Household.recall_exposure_score"]
  - method: GET
    path: "/recall-matches/{id}"
    description: "read a recall match"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: RecallMatch
    side_effects: []
  - method: GET
    path: "/recall-matches"
    description: "list recall matches, filterable by recall notice or product (reverse-reachability for RecallMatch.recall_notice_id and RecallMatch.product_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: ["recall_notice_id?", "product_id?", "limit?", "offset?"]
    output: RecallMatch[]
    side_effects: []

  # ---- Claims ----
  - method: POST
    path: "/claims"
    description: "create a claim in DRAFT"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [product_id, filed_by_member_id, claim_type, resolution_preference, issue_description, "recall_match_id?", "shipping_cost_cents?"]
    output: Claim
    side_effects: ["Claim created status=DRAFT", "recompute Household.active_claim_count"]
  - method: POST
    path: "/claims/{id}/submit"
    description: "submit a claim for review (from DRAFT or NEEDS_DOCS)"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: Claim
    side_effects: ["set claim.status = SUBMITTED", "on first submit: increment subscription.claims_used", "recompute Household.active_claim_count"]
  - method: POST
    path: "/claims/{id}/documents"
    description: "attach a supporting document to a claim"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [doc_type, file_uri]
    output: ClaimDocument
    side_effects: ["ClaimDocument created"]
  - method: POST
    path: "/claims/{id}/review"
    description: "concierge begins review (records reviewer for SoD)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Claim
    side_effects: ["set claim.status = UNDER_REVIEW", "set claim.reviewed_by_user_id = acting X-User-ID"]
  - method: POST
    path: "/claims/{id}/request-docs"
    description: "concierge requests more documentation (revision cycle)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Claim
    side_effects: ["set claim.status = NEEDS_DOCS"]
  - method: POST
    path: "/claims/{id}/approve"
    description: "concierge approves a claim; creates its Resolution"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "reject with ERR_SEGREGATION_OF_DUTIES if acting X-User-ID == claim.reviewed_by_user_id"
      - "set claim.status = APPROVED"
      - "create Resolution{mode=resolution_preference, status=PENDING}; if REFUND compute refund_amount_cents + settlement_total_cents"
      - "recompute Household.active_claim_count"
  - method: POST
    path: "/claims/{id}/reject"
    description: "concierge rejects a claim"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Claim
    side_effects: ["reject with ERR_SEGREGATION_OF_DUTIES if acting X-User-ID == claim.reviewed_by_user_id", "set claim.status = REJECTED", "recompute Household.active_claim_count"]
  - method: POST
    path: "/claims/{id}/withdraw"
    description: "claimant withdraws a claim before resolution"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: Claim
    side_effects: ["set claim.status = WITHDRAWN", "decrement subscription.claims_used (compensating)", "recompute Household.active_claim_count"]
  - method: GET
    path: "/claims/{id}"
    description: "read a claim"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "list claims, filterable by product, filer, or recall match (reverse-reachability for Claim.product_id, Claim.filed_by_member_id, Claim.recall_match_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: ["product_id?", "filed_by_member_id?", "recall_match_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claim-documents/{id}"
    description: "read a claim document"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []
  - method: GET
    path: "/claim-documents"
    description: "list claim documents, filterable by claim (reverse-reachability for ClaimDocument.claim_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, PlatformAdmin]
    code: 200
    input: ["claim_id?", "limit?", "offset?"]
    output: ClaimDocument[]
    side_effects: []

  # ---- Resolutions (replacement / refund tracking, manufacturer coordination) ----
  - method: POST
    path: "/resolutions/{id}/request-rma"
    description: "concierge requests a manufacturer RMA for a replacement resolution"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Resolution
    side_effects: ["reject with ERR_COORDINATION_DISABLED if the product's Manufacturer.coordination_enabled == false", "set resolution.rma_status = REQUESTED"]
  - method: POST
    path: "/resolutions/{id}/authorize-rma"
    description: "manufacturer authorizes the RMA"
    roles: [ManufacturerAgent]
    code: 200
    input: []
    output: Resolution
    side_effects: ["set resolution.rma_status = AUTHORIZED", "set resolution.rma_number"]
  - method: POST
    path: "/resolutions/{id}/dispatch"
    description: "dispatch the resolution (ship replacement or issue refund)"
    roles: [ConciergeAgent]
    code: 200
    input: ["replacement_product_id?"]
    output: Resolution
    side_effects: ["set resolution.status = DISPATCHED", "for REPLACEMENT set replacement_product_id; reject with ERR_RMA_NOT_AUTHORIZED if rma required and rma_status != AUTHORIZED"]
  - method: POST
    path: "/resolutions/{id}/complete"
    description: "mark the resolution completed; cascades claim + recall closure"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Resolution
    side_effects:
      - "set resolution.status = COMPLETED"
      - "set linked Claim.status = RESOLVED and Claim.settlement_total_cents = settlement_total_cents"
      - "if RECALL claim: set linked RecallMatch.status = REMEDIED, matched Product.recall_status = REMEDIED, recompute Household.recall_exposure_score"
      - "recompute Household.active_claim_count"
  - method: POST
    path: "/resolutions/{id}/fail"
    description: "mark the resolution failed"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: Resolution
    side_effects: ["set resolution.status = FAILED"]
  - method: GET
    path: "/resolutions/{id}"
    description: "read a resolution with computed refund/settlement fields"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: []
    output: Resolution
    side_effects: []
  - method: GET
    path: "/resolutions"
    description: "list resolutions, filterable by claim or replacement product (reverse-reachability for Resolution.claim_id and Resolution.replacement_product_id)"
    roles: [HouseholdOwner, HouseholdMember, ConciergeAgent, ManufacturerAgent, PlatformAdmin]
    code: 200
    input: ["claim_id?", "replacement_product_id?", "limit?", "offset?"]
    output: Resolution[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601 for all subsequent warranty/period/recall-window evaluations"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID on an authenticated endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation per §1.7"
  - id: ERR_NOT_HOUSEHOLD_MEMBER
    http: 403
    condition: "entity_backed household role whose X-User-ID is not a Member of the target resource's household"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id (path or body) does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, out-of-range enum, negative amount, serial_range_start > serial_range_end, period_start >= period_end, or REPLACEMENT dispatch without replacement_product_id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_PRODUCT_ARCHIVED
    http: 409
    condition: "claim submit against a product whose registration_status == ARCHIVED"
  - id: ERR_PRODUCT_HAS_ACTIVE_CLAIM
    http: 409
    condition: "archive attempted while a non-terminal Claim exists on the product"
  - id: ERR_RECALL_NOT_LIVE
    http: 409
    condition: "recall-match acknowledge when the parent RecallNotice.status != PUBLISHED"
  - id: ERR_RECALL_WINDOW_OVERLAP
    http: 409
    condition: "recall publish whose closed [effective_from, effective_to] overlaps a PUBLISHED recall for the same manufacturer+model (touching endpoints overlap)"
  - id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http: 409
    condition: "subscription create whose half-open [period_start, period_end) overlaps an existing non-CANCELLED subscription for the household (touching endpoints do NOT overlap)"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "claim submit while the household's Subscription.status != ACTIVE"
  - id: ERR_MISSING_DOCUMENTATION
    http: 409
    condition: "claim submit with no qualifying ClaimDocument (none at all, or none added after entering NEEDS_DOCS on re-submit)"
  - id: ERR_CLAIM_ALLOWANCE_EXCEEDED
    http: 409
    condition: "claim submit when subscription.claims_used >= TIER_CONFIG[tier].included_claims_per_year"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "claim approve/reject where acting X-User-ID equals claim.reviewed_by_user_id"
  - id: ERR_COORDINATION_DISABLED
    http: 409
    condition: "resolution request-rma when the product's Manufacturer.coordination_enabled == false"
  - id: ERR_RMA_NOT_AUTHORIZED
    http: 409
    condition: "resolution dispatch for a REPLACEMENT whose Manufacturer.rma_required == true and rma_status != AUTHORIZED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "change-plan whose expected_subscription_version != current Subscription.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "unauthenticated self-service caller"
    identity: opaque
    exclusive_operations:
      - "POST /households"
      - "POST /households/{id}/members (only to create the first OWNER when the household has no members)"
    shared_operations: []
  - name: HouseholdOwner
    description: "the OWNER-role member of a household; manages subscription, membership, registry"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /households/{id}/members (add ADULT/MINOR)"
      - "POST /households/{id}/subscriptions"
      - "POST /subscriptions/{id}/change-plan"
      - "POST /subscriptions/{id}/reinstate"
      - "POST /subscriptions/{id}/cancel"
      - "POST /products/{id}/archive"
      - "POST /recall-matches/{id}/dismiss"
    shared_operations:
      - "POST /products"
      - "POST /claims, /claims/{id}/submit, /claims/{id}/documents, /claims/{id}/withdraw"
      - "POST /recall-matches/{id}/acknowledge"
      - "GET reads"
  - name: HouseholdMember
    description: "a non-owner (ADULT/MINOR) member; files claims and acknowledges alerts"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /products"
      - "POST /claims, /claims/{id}/submit, /claims/{id}/documents, /claims/{id}/withdraw"
      - "POST /recall-matches/{id}/acknowledge"
      - "GET reads"
  - name: ConciergeAgent
    description: "platform concierge who triages, reviews, approves/rejects claims and drives resolutions; SoD: reviewer != approver"
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/review"
      - "POST /claims/{id}/request-docs"
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/reject"
      - "POST /resolutions/{id}/request-rma"
      - "POST /resolutions/{id}/dispatch"
      - "POST /resolutions/{id}/complete"
      - "POST /resolutions/{id}/fail"
    shared_operations:
      - "POST /recall-matches/{id}/remedy"
      - "GET reads"
  - name: ManufacturerAgent
    description: "acts as a Manufacturer; issues recalls and authorizes RMAs"
    identity: "entity_backed:Manufacturer"
    exclusive_operations:
      - "POST /recall-notices"
      - "POST /recall-notices/{id}/publish"
      - "POST /recall-notices/{id}/close"
      - "POST /resolutions/{id}/authorize-rma"
    shared_operations:
      - "POST /recall-matches/{id}/remedy"
      - "GET reads"
  - name: PlatformAdmin
    description: "platform operator; provisions manufacturers, handles billing lapse, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /manufacturers"
      - "POST /subscriptions/{id}/mark-past-due"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"
