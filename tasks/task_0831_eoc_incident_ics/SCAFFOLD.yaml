# =============================================================================
# SCAFFOLD — Emergency Operations Center & Incident Management (ICS)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  Emergency Operations Center & Incident Management (ICS): incident activation &
  level, resource request (ICS-213RR) & tracking, task/objective & IAP, shelter &
  mutual-aid coordination, damage assessment & declaration, FEMA-PA cost-recovery
  documentation, situation report, demobilization

domain_name: eoc-incident-ics
api_prefix: /eoc

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Incident.version for child creates that grow incident aggregates
    - cascading_side_effects        # demobilization + declaration cascades span 3+ entities
    - dual_variant_calculation      # estimated-vs-actual FEMA-PA cost share; strict-vs-projected shelter capacity
    - rate_threshold_triggers       # declaration $ threshold, pool unit boundary, enhanced federal-share tier
  entity_topology: flat             # peer top-level collections under /eoc linked by FK fields
  state_machine_shape: cyclic       # ResourceRequest (NEEDS_INFO revision loop) + MutualAidRequest (offer/counter rounds)
  relationship_patterns:
    - one_to_many                   # Incident -> requests / iaps / shelters / assessments / cost records
    - self_referential              # Task.parent_task_id -> Task
    - cross_aggregate               # ResourceRequest -> ResourcePool (jurisdiction pool); CostRecord -> ResourceRequest
  role_model: peer_roles            # each ICS section owns a distinct resource type; one entity_backed liaison role
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable incident name" }
      - { name: hazard_type, type: enum, source: input, description: "Primary hazard", constraints: "FLOOD | WILDFIRE | HURRICANE | EARTHQUAKE | HAZMAT | PUBLIC_HEALTH" }
      - { name: declaration_category, type: enum, source: input, description: "Anticipated federal declaration category driving cost share", default: "EMERGENCY", constraints: "EMERGENCY | MAJOR_DISASTER" }
      - { name: cost_ceiling, type: number, source: input, description: "Maximum cumulative committed cost permitted for this incident", default: 100000000 }
      - { name: op_status, type: enum, source: system, description: "Operational lifecycle state", default: "MONITORING", constraints: "MONITORING | ACTIVATED | DEMOBILIZING | CLOSED" }
      - { name: activation_level, type: enum, source: system, description: "ICS activation level (parallel dimension to op_status; LEVEL_1 = full activation)", default: "LEVEL_3", constraints: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: total_committed_cost, type: number, source: computed, description: "Sum over CostRecords in {ESTIMATED, ACTUAL} of amount (actual_cost if ACTUAL else estimated_cost)" }
      - { name: total_actual_cost, type: number, source: computed, description: "Sum of actual_cost over CostRecords in status ACTUAL" }
      - { name: federal_share_estimated, type: number, source: computed, description: "Rollup of round(estimated_cost*pct,2) over eligible ESTIMATED CostRecords (see incident_cost_rollup)" }
      - { name: federal_share_actual, type: number, source: computed, description: "Rollup of round(actual_cost*pct,2) over eligible ACTUAL CostRecords (see incident_cost_rollup)" }
      - { name: total_verified_damage, type: number, source: computed, description: "Sum of estimated_loss over DamageAssessments in status VALIDATED" }
      - { name: declaration_status, type: enum, source: computed, description: "ELIGIBLE when total_verified_damage >= DECLARATION_THRESHOLD, else INELIGIBLE", default: "INELIGIBLE", constraints: "INELIGIBLE | ELIGIBLE" }
      - { name: current_iap_id, type: string, source: computed, description: "id of the most recently PUBLISHED IncidentActionPlan for this incident (null if none)" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp op_status entered ACTIVATED (null before)" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp op_status entered CLOSED (null before)" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Jurisdiction / mutual-aid partner name" }
      - { name: contact_email, type: string, source: input, description: "Point-of-contact email", default: null }

  - name: ResourcePool
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; owning jurisdiction that supplies this pool" }
      - { name: resource_type, type: enum, source: input, description: "Kind of resource in this pool", constraints: "PERSONNEL | VEHICLE | EQUIPMENT | SUPPLY" }
      - { name: total_units, type: integer, source: input, description: "Total units the pool owns (conserved quantity)", constraints: ">= 1" }
      - { name: units_reserved, type: integer, source: computed, description: "Units reserved by ResourceRequests in status SOURCED", default: 0 }
      - { name: units_committed, type: integer, source: computed, description: "Units committed by ResourceRequests in status FILLED", default: 0 }
      - { name: units_available, type: integer, source: computed, description: "= total_units - units_reserved - units_committed" }
      - { name: surge_cap, type: integer, source: input, description: "Max units that may be deployed within any single overlapping time window (staging/off-site limit); defaults to total_units. Must be <= total_units.", default: null }
      - { name: turnaround_hours, type: integer, source: input, description: "Buffer hours required between overlapping deployments of the same pool", default: 0 }

  - name: ResourceRequest
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this ICS-213RR belongs to" }
      - { name: resource_type, type: enum, source: input, description: "Requested resource kind", constraints: "PERSONNEL | VEHICLE | EQUIPMENT | SUPPLY" }
      - { name: requested_quantity, type: integer, source: input, description: "Units requested (must be >= 1)" }
      - { name: priority, type: enum, source: input, description: "Request priority", default: "MEDIUM", constraints: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "ICS-213RR lifecycle", default: "DRAFT", constraints: "DRAFT | SUBMITTED | NEEDS_INFO | SOURCED | FILLED | DENIED | DEMOBILIZED" }
      - { name: source_pool_id, type: string, source: computed, description: "FK -> ResourcePool.id; pool selected at SOURCED (null before)", default: null }
      - { name: committed_units, type: integer, source: computed, description: "Units reserved/committed against source_pool_id (= requested_quantity once SOURCED)", default: 0 }
      - { name: deploy_start, type: datetime, source: computed, description: "Deployment window start, set on FILLED (null before)", default: null }
      - { name: deploy_end, type: datetime, source: computed, description: "Deployment window end, set on FILLED (null before)", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp entered SUBMITTED", default: null }
      - { name: sourced_at, type: datetime, source: system, description: "Timestamp entered SOURCED", default: null }
      - { name: demobilized_at, type: datetime, source: system, description: "Timestamp entered DEMOBILIZED", default: null }

  - name: IncidentActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this IAP plans for" }
      - { name: operational_period_start, type: datetime, source: input, description: "Operational period start (inclusive)" }
      - { name: operational_period_end, type: datetime, source: input, description: "Operational period end (exclusive; half-open interval [start,end))" }
      - { name: status, type: enum, source: system, description: "IAP lifecycle", default: "DRAFT", constraints: "DRAFT | PUBLISHED | CLOSED" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp entered PUBLISHED", default: null }

  - name: Task
    parent: null
    common_fields: true
    fields:
      - { name: iap_id, type: string, source: input, description: "FK -> IncidentActionPlan.id; owning operational plan" }
      - { name: title, type: string, source: input, description: "ICS-204 assignment title" }
      - { name: parent_task_id, type: string, source: input, description: "FK -> Task.id; parent objective/task (null for a top-level objective)", default: null }
      - { name: resource_request_id, type: string, source: input, description: "FK -> ResourceRequest.id; resource assignment backing this task (nullable)", default: null }
      - { name: status, type: enum, source: system, description: "Task lifecycle", default: "PLANNED", constraints: "PLANNED | ASSIGNED | COMPLETED | CANCELLED" }
      - { name: assigned_at, type: datetime, source: system, description: "Timestamp entered ASSIGNED", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp entered COMPLETED", default: null }

  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this shelter serves" }
      - { name: name, type: string, source: input, description: "Shelter name" }
      - { name: capacity, type: integer, source: input, description: "Maximum occupancy at one time (>= 1)" }
      - { name: current_occupancy, type: integer, source: computed, description: "Occupants currently checked in", default: 0 }
      - { name: reserved_occupancy, type: integer, source: computed, description: "Beds reserved but not yet occupied", default: 0 }
      - { name: status, type: enum, source: system, description: "Shelter lifecycle", default: "PLANNED", constraints: "PLANNED | OPEN | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp entered OPEN", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp entered CLOSED", default: null }

  - name: MutualAidRequest
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; requesting incident" }
      - { name: to_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction asked to supply mutual aid" }
      - { name: resource_type, type: enum, source: input, description: "Requested resource kind", constraints: "PERSONNEL | VEHICLE | EQUIPMENT | SUPPLY" }
      - { name: requested_units, type: integer, source: input, description: "Units requested (>= 1)" }
      - { name: offered_units, type: integer, source: computed, description: "Units the partner most recently offered", default: 0 }
      - { name: countered_units, type: integer, source: computed, description: "Units the requester most recently counter-proposed", default: 0 }
      - { name: accepted_units, type: integer, source: computed, description: "Units finally accepted (set on ACCEPTED)", default: 0 }
      - { name: status, type: enum, source: system, description: "EMAC negotiation lifecycle", default: "REQUESTED", constraints: "REQUESTED | OFFERED | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp reached a terminal state", default: null }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident being assessed" }
      - { name: site_name, type: string, source: input, description: "Assessed site / facility name" }
      - { name: estimated_loss, type: number, source: input, description: "Estimated dollar loss for this site (>= 0)" }
      - { name: infrastructure_category, type: enum, source: input, description: "FEMA-PA category of work", constraints: "CAT_A_DEBRIS | CAT_B_PROTECTIVE | CAT_C_ROADS | CAT_E_BUILDINGS | CAT_G_PARKS" }
      - { name: status, type: enum, source: system, description: "Assessment lifecycle", default: "DRAFT", constraints: "DRAFT | VALIDATED | REJECTED" }
      - { name: validated_at, type: datetime, source: system, description: "Timestamp entered VALIDATED", default: null }

  - name: CostRecord
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this FEMA-PA cost documents" }
      - { name: resource_request_id, type: string, source: input, description: "FK -> ResourceRequest.id; resource this cost is attributed to (nullable)", default: null }
      - { name: category, type: enum, source: input, description: "FEMA-PA cost category", constraints: "LABOR | EQUIPMENT | MATERIALS | CONTRACT" }
      - { name: estimated_cost, type: number, source: input, description: "Estimated cost (>= 0)" }
      - { name: actual_cost, type: number, source: computed, description: "Actual documented cost, set on ACTUAL (null before)", default: null }
      - { name: eligible, type: boolean, source: input, description: "Whether this cost is FEMA-PA eligible for federal share", default: true }
      - { name: status, type: enum, source: system, description: "Cost documentation lifecycle", default: "ESTIMATED", constraints: "ESTIMATED | ACTUAL | VOID" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp entered ACTUAL", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Incident
    initial_state: MONITORING           # op_status dimension; activation_level is an independent parallel dimension
    terminal_states: [CLOSED]
    transitions:
      - from: MONITORING
        to: ACTIVATED
        trigger: "POST /eoc/incidents/{id}/transition (to_status=ACTIVATED)"
        actor: EOCManager
        preconditions: []
        side_effects:
          - "Set activated_at = request timestamp"
        note: "activation_level may be changed independently while op_status=ACTIVATED via to_activation_level on the same endpoint (parallel dimension)."

      - from: ACTIVATED
        to: DEMOBILIZING
        trigger: "POST /eoc/incidents/{id}/transition (to_status=DEMOBILIZING)"
        actor: EOCManager
        preconditions: []
        side_effects:
          - "CASCADE hop 1 (A->B): every Task under this incident's IAPs whose status is in {PLANNED, ASSIGNED} transitions to CANCELLED (drives the Task CANCELLED side effects below)."

      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /eoc/incidents/{id}/transition (to_status=CLOSED)"
        actor: EOCManager
        preconditions:
          - "No ResourceRequest for this incident is in {SUBMITTED, NEEDS_INFO, SOURCED, FILLED} (ERR_INCIDENT_NOT_READY_TO_CLOSE)"
          - "No Shelter for this incident is in {PLANNED, OPEN} (ERR_INCIDENT_NOT_READY_TO_CLOSE)"
          - "No CostRecord for this incident is in status ESTIMATED (ERR_INCIDENT_NOT_READY_TO_CLOSE)"
        side_effects:
          - "Set closed_at = request timestamp"

  - entity: ResourceRequest
    initial_state: DRAFT
    terminal_states: [DENIED, DEMOBILIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=SUBMITTED)"
        actor: OperationsChief
        preconditions:
          - "Incident.op_status == ACTIVATED (cross-entity; ERR_INCIDENT_NOT_ACTIVE)"
          - "requested_quantity >= 1 (ERR_INVALID_QUANTITY)"
        side_effects:
          - "Set submitted_at = request timestamp"

      - from: SUBMITTED
        to: NEEDS_INFO
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=NEEDS_INFO)"
        actor: LogisticsChief
        preconditions: []
        side_effects: []
        note: "Revision-loop entry (cyclic)."

      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=SUBMITTED)"
        actor: OperationsChief
        preconditions:
          - "Incident.op_status == ACTIVATED (cross-entity; ERR_INCIDENT_NOT_ACTIVE)"
        side_effects:
          - "Refresh submitted_at = request timestamp"
        note: "Revision-loop return (cyclic A->B->A on ResourceRequest)."

      - from: SUBMITTED
        to: SOURCED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=SOURCED, pool_id)"
        actor: LogisticsChief
        preconditions:
          - "pool_id present and ResourcePool exists (ERR_RESOURCE_POOL_NOT_FOUND)"
          - "ResourcePool.resource_type == ResourceRequest.resource_type (ERR_INSUFFICIENT_RESOURCES)"
          - "ResourcePool.units_available >= requested_quantity (boundary >=; ERR_INSUFFICIENT_RESOURCES)"
        side_effects:
          - "Set source_pool_id = pool_id, committed_units = requested_quantity, sourced_at = request timestamp"
          - "ResourcePool.units_reserved += requested_quantity (units_available recomputed = total_units - units_reserved - units_committed)"

      - from: SOURCED
        to: FILLED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=FILLED, deploy_start, deploy_end)"
        actor: LogisticsChief
        preconditions:
          - "deploy_start and deploy_end present and deploy_start < deploy_end (ERR_VALIDATION)"
          - "For source_pool_id: sum of requested_quantity over already-FILLED requests on that pool whose [deploy_start,deploy_end] (each expanded by turnaround_hours) overlaps the new window, plus this requested_quantity, must be <= surge_cap (effective surge_cap = surge_cap if set else total_units; aggregate concurrent-window capacity + buffer; ERR_DEPLOYMENT_WINDOW_CONFLICT)"
        side_effects:
          - "Set deploy_start, deploy_end, committed_units unchanged"
          - "ResourcePool.units_reserved -= requested_quantity; ResourcePool.units_committed += requested_quantity"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=DENIED)"
        actor: LogisticsChief
        preconditions: []
        side_effects: []

      - from: NEEDS_INFO
        to: DENIED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=DENIED)"
        actor: LogisticsChief
        preconditions: []
        side_effects: []

      - from: SOURCED
        to: DEMOBILIZED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=DEMOBILIZED) or cascaded from Task CANCELLED"
        actor: LogisticsChief
        preconditions: []
        side_effects:
          - "ResourcePool.units_reserved -= requested_quantity (release reservation; units_available restored)"
          - "Set demobilized_at = request timestamp"

      - from: FILLED
        to: DEMOBILIZED
        trigger: "POST /eoc/resource-requests/{id}/transition (to_status=DEMOBILIZED) or cascaded from Task CANCELLED"
        actor: LogisticsChief
        preconditions: []
        side_effects:
          - "CASCADE hop 3 (C->D): ResourcePool.units_committed -= requested_quantity (release commitment; units_available restored to conserve total_units)"
          - "Set demobilized_at = request timestamp"

  - entity: MutualAidRequest
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: OFFERED
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=OFFERED, offered_units)"
        actor: JurisdictionLiaison
        preconditions:
          - "X-User-ID == to_jurisdiction_id (ownership; ERR_NOT_RESOURCE_OWNER)"
          - "offered_units >= 1 (ERR_INVALID_QUANTITY)"
        side_effects:
          - "Set offered_units"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=COUNTERED, countered_units)"
        actor: LogisticsChief
        preconditions:
          - "countered_units >= 1 (ERR_INVALID_QUANTITY)"
        side_effects:
          - "Set countered_units"
        note: "Negotiation-round entry (cyclic)."

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=OFFERED, offered_units)"
        actor: JurisdictionLiaison
        preconditions:
          - "X-User-ID == to_jurisdiction_id (ownership; ERR_NOT_RESOURCE_OWNER)"
          - "offered_units >= 1 (ERR_INVALID_QUANTITY)"
        side_effects:
          - "Set offered_units"
        note: "Negotiation-round return (cyclic OFFERED->COUNTERED->OFFERED on MutualAidRequest)."

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=ACCEPTED)"
        actor: LogisticsChief
        preconditions:
          - "Incident.op_status == ACTIVATED (cross-entity; ERR_INCIDENT_NOT_ACTIVE)"
        side_effects:
          - "Set accepted_units = offered_units, resolved_at = request timestamp"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=DECLINED)"
        actor: LogisticsChief
        preconditions: []
        side_effects:
          - "Set resolved_at = request timestamp"

      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /eoc/mutual-aid-requests/{id}/transition (to_status=WITHDRAWN)"
        actor: LogisticsChief
        preconditions: []
        side_effects:
          - "Set resolved_at = request timestamp"

  - entity: IncidentActionPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /eoc/incident-action-plans/{id}/transition (to_status=PUBLISHED)"
        actor: PlanningChief
        preconditions:
          - "No other PUBLISHED IAP for the same incident has an operational period [start,end) that overlaps this one; adjacency (prev.end == this.start) is allowed (half-open; ERR_OPERATIONAL_PERIOD_OVERLAP)"
        side_effects:
          - "Set published_at = request timestamp"
          - "Incident.current_iap_id = this.id"

      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /eoc/incident-action-plans/{id}/transition (to_status=CLOSED)"
        actor: PlanningChief
        preconditions:
          - "No Task with this iap_id is in {PLANNED, ASSIGNED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Task
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "POST /eoc/tasks/{id}/transition (to_status=ASSIGNED)"
        actor: OperationsChief
        preconditions:
          - "IncidentActionPlan(iap_id).status == PUBLISHED (cross-entity; ERR_IAP_NOT_PUBLISHED)"
          - "If resource_request_id set: that ResourceRequest belongs to the same incident as the IAP (ERR_CROSS_INCIDENT_REFERENCE)"
          - "If resource_request_id set: ResourceRequest.deploy_end must be >= IncidentActionPlan.operational_period_start (ERR_RESOURCE_WINDOW_MISMATCH)"
          - "If resource_request_id set: ResourceRequest.status == FILLED (ERR_REQUEST_NOT_FILLED)"
        side_effects:
          - "Set assigned_at = request timestamp"

      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /eoc/tasks/{id}/transition (to_status=COMPLETED)"
        actor: OperationsChief
        preconditions: []
        side_effects:
          - "Set completed_at = request timestamp"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /eoc/tasks/{id}/transition (to_status=CANCELLED) or cascaded from Incident DEMOBILIZING"
        actor: OperationsChief
        preconditions: []
        side_effects:
          - "CASCADE hop 2 (B->C): if resource_request_id set and that ResourceRequest.status in {SOURCED, FILLED}, transition it to DEMOBILIZED (which drives ResourceRequest's own release side effects, hop 3)"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /eoc/tasks/{id}/transition (to_status=CANCELLED) or cascaded from Incident DEMOBILIZING"
        actor: OperationsChief
        preconditions: []
        side_effects:
          - "CASCADE hop 2 (B->C): if resource_request_id set and that ResourceRequest.status in {SOURCED, FILLED}, transition it to DEMOBILIZED (which drives ResourceRequest's own release side effects, hop 3)"

  - entity: Shelter
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /eoc/shelters/{id}/transition (to_status=OPEN)"
        actor: OperationsChief
        preconditions:
          - "Incident.op_status == ACTIVATED (cross-entity; ERR_INCIDENT_NOT_ACTIVE)"
          - "capacity >= 1 (ERR_VALIDATION)"
        side_effects:
          - "Set opened_at = request timestamp"

      - from: OPEN
        to: CLOSED
        trigger: "POST /eoc/shelters/{id}/transition (to_status=CLOSED)"
        actor: OperationsChief
        preconditions:
          - "current_occupancy == 0 AND reserved_occupancy == 0 (zero-count boundary; ERR_SHELTER_OCCUPIED)"
        side_effects:
          - "Set closed_at = request timestamp"

  - entity: DamageAssessment
    initial_state: DRAFT
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /eoc/damage-assessments/{id}/transition (to_status=VALIDATED)"
        actor: PlanningChief
        preconditions: []
        side_effects:
          - "CASCADE hop 1 (A->B): Incident.total_verified_damage += estimated_loss (recompute)"
          - "CASCADE hop 2 (B->C): recompute Incident.declaration_status — if total_verified_damage >= DECLARATION_THRESHOLD it flips INELIGIBLE -> ELIGIBLE (boundary >=)"
          - "Set validated_at = request timestamp"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /eoc/damage-assessments/{id}/transition (to_status=REJECTED)"
        actor: PlanningChief
        preconditions: []
        side_effects: []

  - entity: CostRecord
    initial_state: ESTIMATED
    terminal_states: [ACTUAL, VOID]
    transitions:
      - from: ESTIMATED
        to: ACTUAL
        trigger: "POST /eoc/cost-records/{id}/transition (to_status=ACTUAL, actual_cost)"
        actor: FinanceChief
        preconditions:
          - "actual_cost present and >= 0 (ERR_VALIDATION)"
        side_effects:
          - "Set actual_cost, finalized_at = request timestamp"
          - "Recompute Incident.total_committed_cost, total_actual_cost, federal_share_estimated, federal_share_actual"

      - from: ESTIMATED
        to: VOID
        trigger: "POST /eoc/cost-records/{id}/transition (to_status=VOID)"
        actor: FinanceChief
        preconditions: []
        side_effects:
          - "Recompute Incident.total_committed_cost (this record's estimated_cost leaves the sum — compensating action conserving the ledger)"

      - from: ACTUAL
        to: VOID
        trigger: "POST /eoc/cost-records/{id}/transition (to_status=VOID)"
        actor: FinanceChief
        preconditions: []
        side_effects:
          - "Recompute Incident.total_committed_cost and total_actual_cost (this record's actual_cost leaves the sums — compensating action conserving the ledger)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent Incident.version)
# =============================================================================
concurrency_rules:
  - rule_id: iap-create-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /eoc/incident-action-plans"
    occ_field: "expected_incident_version"
    description: |
      Creating a new IncidentActionPlan against an Incident whose version has
      advanced since the client last observed it is rejected on a stale version.
      A newly created plan legitimately supersedes the incident's prior current
      operational plan (it advances current_iap_id and the incident version), so
      a creator working from a stale incident view is rejected rather than
      silently clobbering the newer plan.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cost-record-create-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /eoc/cost-records"
    occ_field: "expected_incident_version"
    description: |
      Creating a CostRecord grows the incident's committed-cost ledger and
      advances the incident version. A creator whose expected_incident_version
      no longer matches the incident's current version (because another cost
      record already landed) is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: resource_pool_availability
    trigger: "any ResourceRequest transition touching a pool (SOURCED, FILLED, DEMOBILIZED)"
    algorithm: aggregation
    formula: |
      units_available = total_units - units_reserved - units_committed
      units_reserved  = sum(requested_quantity for ResourceRequests with source_pool_id == pool.id AND status == SOURCED)
      units_committed = sum(requested_quantity for ResourceRequests with source_pool_id == pool.id AND status == FILLED)
      INVARIANT (conserved quantity = pool units): total_units == units_available + units_reserved + units_committed at all times.
      SOURCED requires units_available >= requested_quantity (boundary: exactly-equal is allowed; strictly-greater not required).
    input_set: "ResourceRequests with source_pool_id == pool.id, filtered by status SOURCED (reserved) or FILLED (committed)"
    constants: {}
    precision: "integer units, no rounding"

  - name: deployment_window_capacity
    trigger: "ResourceRequest SOURCED -> FILLED"
    algorithm: interval_merge
    formula: |
      effective_surge_cap = P.surge_cap if P.surge_cap is not null else P.total_units
      For the target ResourcePool P and a new deployment window [s, e]:
        overlapping = [ r for r in FILLED requests with source_pool_id == P.id
                        if intervals_overlap([r.deploy_start - P.turnaround_hours, r.deploy_end + P.turnaround_hours], [s, e]) ]
        used = sum(r.requested_quantity for r in overlapping)
        FILL allowed iff used + this.requested_quantity <= effective_surge_cap
        else ERR_DEPLOYMENT_WINDOW_CONFLICT.
      Interval semantics: CLOSED intervals, each existing window inflated by turnaround_hours on BOTH ends (buffer), aggregate concurrent-window capacity (not pairwise) test against surge_cap — distinct from the instantaneous units_available check governing SOURCED.
    input_set: "FILLED ResourceRequests on the same pool with a deploy window overlapping the buffered candidate window"
    constants: {}
    precision: "integer units"

  - name: shelter_capacity
    trigger: "Shelter occupancy change (check_in / check_out / reserve / release_reserve) and shelter close"
    algorithm: threshold
    formula: |
      After applying the occupancy delta:
        current_occupancy  >= 0 and reserved_occupancy >= 0 (else ERR_VALIDATION)
        current_occupancy + reserved_occupancy <= capacity (boundary: exactly-equal allowed) else ERR_SHELTER_CAPACITY_EXCEEDED
      Close requires current_occupancy == 0 AND reserved_occupancy == 0 (empty-set / zero-count boundary).
    input_set: "single shelter's occupancy counters"
    constants: {}
    precision: "integer occupants"
    variants:
      - name: strict_available
        when: "reporting beds physically free right now (situation report 'open beds')"
        difference: "strict_available = capacity - current_occupancy (ignores reservations)"
      - name: projected_available
        when: "gating a new check-in or reservation"
        difference: "projected_available = capacity - current_occupancy - reserved_occupancy (counts reservations against capacity); differs from strict_available whenever reserved_occupancy > 0"

  - name: declaration_threshold
    trigger: "DamageAssessment DRAFT -> VALIDATED (recompute of Incident.total_verified_damage)"
    algorithm: threshold
    formula: |
      total_verified_damage = sum(estimated_loss for DamageAssessments on incident with status == VALIDATED)
      declaration_status = ELIGIBLE if total_verified_damage >= DECLARATION_THRESHOLD else INELIGIBLE
      Boundary: total_verified_damage exactly == DECLARATION_THRESHOLD is ELIGIBLE (>=, not >).
    input_set: "DamageAssessments on the incident with status == VALIDATED"
    constants:
      DECLARATION_THRESHOLD: 5000000

  - name: federal_share_percentage
    trigger: "CostRecord create / ACTUAL / VOID, or Incident.declaration_status change"
    algorithm: threshold
    formula: |
      Selects the cost-share percentage (>=3 inputs, non-linear conditional branch):
        if Incident.declaration_status != ELIGIBLE: pct = 0.0
        elif Incident.declaration_category == MAJOR_DISASTER
             and Incident.total_verified_damage >= ENHANCED_DAMAGE_THRESHOLD: pct = ENHANCED_SHARE_PCT
        else: pct = BASE_SHARE_PCT
      pct depends jointly on declaration_status, declaration_category, and total_verified_damage.
    input_set: "Incident fields declaration_status, declaration_category, total_verified_damage"
    constants:
      BASE_SHARE_PCT: 0.75
      ENHANCED_SHARE_PCT: 0.90
      ENHANCED_DAMAGE_THRESHOLD: 10000000
    variants:
      - name: estimated_share_basis
        when: "computing federal_share_estimated"
        difference: "eligible cost basis = each ESTIMATED CostRecord's estimated_cost (eligible == true)"
      - name: actual_share_basis
        when: "computing federal_share_actual"
        difference: "eligible cost basis = each ACTUAL CostRecord's actual_cost (eligible == true); diverges from estimated basis once actual_cost != estimated_cost"

  - name: incident_cost_rollup
    trigger: "CostRecord create / ACTUAL / VOID"
    algorithm: aggregation
    formula: |
      pct = federal_share_percentage (above)
      federal_share_estimated = SUM over eligible ESTIMATED CostRecords of round(estimated_cost * pct, 2)
      federal_share_actual    = SUM over eligible ACTUAL   CostRecords of round(actual_cost   * pct, 2)
      ROUNDING ORDER IS PINNED: round EACH record's share to 2 decimals (round_half_up), THEN sum.
      ("sum then round" is explicitly NOT used and would yield a different cent total.)
      total_committed_cost = SUM over CostRecords in {ESTIMATED, ACTUAL} of (actual_cost if ACTUAL else estimated_cost)
      INVARIANT (conserved quantity = committed dollars): total_committed_cost == that sum at all times; VOID removes a record's contribution.
    input_set: "CostRecords on the incident; ESTIMATED and ACTUAL contribute, VOID excluded"
    constants: {}
    precision: "2 decimal places, round_half_up, applied per-record before summation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint/operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist (validated left-to-right); FK targets resolve"
    error_id: "ERR_INCIDENT_NOT_FOUND / ERR_JURISDICTION_NOT_FOUND / ERR_RESOURCE_POOL_NOT_FOUND / ERR_RESOURCE_REQUEST_NOT_FOUND / ERR_IAP_NOT_FOUND / ERR_TASK_NOT_FOUND / ERR_SHELTER_NOT_FOUND / ERR_MUTUAL_AID_NOT_FOUND / ERR_DAMAGE_ASSESSMENT_NOT_FOUND / ERR_COST_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "MutualAidRequest OFFERED/COUNTERED->OFFERED ownership: X-User-ID (JurisdictionLiaison) == MutualAidRequest.to_jurisdiction_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /eoc/mutual-aid-requests/{id}/transition"

  - priority: 5
    category: state
    check: "Target resource is in a valid 'from' state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all */transition and */occupancy endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_incident_version equals the incident's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /eoc/incident-action-plans, POST /eoc/cost-records"

  - priority: 7
    category: business_referential
    check: "Cross-aggregate reference integrity: a Task's resource_request_id must belong to the same incident as the Task's IAP"
    error_id: ERR_CROSS_INCIDENT_REFERENCE
    http_status: 409
    applies_to: "POST /eoc/tasks/{id}/transition (ASSIGNED)"

  - priority: 8
    category: business_temporal
    check: "Temporal windows: IAP operational periods must not overlap (half-open, adjacency allowed); pool deployment windows must fit aggregate capacity within turnaround buffers; a task's backing resource deploy_end must not precede the IAP operational_period_start"
    error_id: "ERR_OPERATIONAL_PERIOD_OVERLAP / ERR_DEPLOYMENT_WINDOW_CONFLICT / ERR_RESOURCE_WINDOW_MISMATCH"
    http_status: 409
    applies_to: "IAP publish, ResourceRequest FILLED, Task ASSIGNED"

  - priority: 9
    category: business_safety
    check: "Safety/readiness gates: a Shelter with occupants cannot close; an Incident with in-flight requests/open shelters/estimated costs cannot close"
    error_id: "ERR_SHELTER_OCCUPIED / ERR_INCIDENT_NOT_READY_TO_CLOSE"
    http_status: 409
    applies_to: "Shelter close, Incident close"

  - priority: 10
    category: business_constraint
    check: "Cross-entity state gates and quantity/capacity constraints: incident must be ACTIVATED; IAP must be PUBLISHED; backing request must be FILLED; quantity >= 1; pool has enough units; shelter within capacity; activation_level valid; a transition target must be provided"
    error_id: "ERR_INCIDENT_NOT_ACTIVE / ERR_IAP_NOT_PUBLISHED / ERR_REQUEST_NOT_FILLED / ERR_INVALID_QUANTITY / ERR_INSUFFICIENT_RESOURCES / ERR_SHELTER_CAPACITY_EXCEEDED / ERR_INVALID_ACTIVATION_LEVEL / ERR_MISSING_TRANSITION_TARGET"
    http_status: 409
    applies_to: "resource-request submit/source, task assign, shelter open/occupancy, incident transition"

  - priority: 11
    category: business_fiscal
    check: "Creating a CostRecord must not push Incident.total_committed_cost above Incident.cost_ceiling (boundary: exactly-equal allowed)"
    error_id: ERR_COST_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /eoc/cost-records"

