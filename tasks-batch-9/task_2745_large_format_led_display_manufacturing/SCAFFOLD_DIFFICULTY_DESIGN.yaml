            - "second trigger call -> 422 ERR_DATA_LOAD_EXCEEDS_CAPACITY (data_load_pct would be 100.43)"

      - name: contract_amount_round_per_cabinet_then_sum
        grounds:
          - calculations.project_contract_amount_cents
          - entities.DisplayProject.fields.contract_amount_cents
          - endpoints.POST_projects
        distinguishing_aspect: |
          Combinatorial mode (b) — order of operations: the per-cabinet base
          price must be rounded to whole cents, then surcharged and rounded
          again, and only then multiplied by cabinet_count. Summing the
          unrounded lines first yields 6637032 instead of the correct 6637025
          on a 25-cabinet RETAIL job, a 7-cent divergence that no single-cabinet
          fixture can expose. Different mode from the nested ceil/min of
          project_data_load_pct_nested_min_ceil_floor.
        test_recipe:
          setup:
            - "FP25-OUT display model exists (cabinet_area_sqm 0.2048, price_per_sqm_cents 1234567)."
            - "ENV_SURCHARGE_PCT[RETAIL] = 0.05 and REDUNDANCY_SURCHARGE_PCT[NONE] = 0.00, so the only multiplier is 1.05."
          setup_api_calls:
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Concourse Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 5, cabinet_grid_rows: 5, min_viewing_distance_m: 2.5, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 2, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          assert:
            - "DisplayProject.${pj}.cabinet_count == 25"
            - "DisplayProject.${pj}.total_area_sqm == 5.1200"
            - "DisplayProject.${pj}.contract_amount_cents == 6637025"
            - "DisplayProject.${pj}.contract_amount_cents != 6637032   # sum-then-round is wrong"
            - "DisplayProject.${pj}.required_data_mbps == 1475"
            - "DisplayProject.${pj}.effective_capacity_mbps == 2000"
            - "DisplayProject.${pj}.data_load_pct == 73.75"

      - name: service_contract_fee_discount_tier_from_subtotal_only
        grounds:
          - calculations.service_contract_annual_fee_cents
          - calculations.service_contract_spare_requirement
          - entities.ServiceContract.fields.subtotal_fee_cents
          - entities.ServiceContract.fields.volume_discount_pct
          - entities.ServiceContract.fields.annual_fee_cents
        distinguishing_aspect: |
          Combinatorial mode (c) — threshold read off an intermediate: the
          volume discount tier is selected from subtotal_fee_cents (2002910,
          just over the 2000000 break -> 0.04) and must NOT be re-evaluated
          against the post-discount annual_fee_cents (1922794, which falls back
          below the break). The spare carry fee, itself a ceil() over
          module_count x spare_pct_bp, is what pushes the subtotal across the
          break at all: gross 1975910 alone would have earned 0.00. Different
          mode from (a) nested rounding and (b) round-then-sum.
        test_recipe:
          setup:
            - "FP25-OUT display model exists."
            - "A 6x6 RETAIL project on it: cabinet_count 36, module_count 144, total_area_sqm 7.3728, data_load_pct 84.96."
            - "TIER_RATE_CENTS_PER_SQM[GOLD] = 268000; SPARE_CARRY_FEE_CENTS = 4500; discount breaks at 2000000 / 5000000 / 10000000."
