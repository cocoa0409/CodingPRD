        distinguishing_aspect: "A FLAT 3000-cent promo over two eligible lines (2398 DOMAIN_REGISTRATION then 1998 PRIVACY_FEE) fills the first line to its full 2398 and spills the remaining 602 into the second, in created_at ASC order — producing line taxes 0 and 115 and a total of 1511."
