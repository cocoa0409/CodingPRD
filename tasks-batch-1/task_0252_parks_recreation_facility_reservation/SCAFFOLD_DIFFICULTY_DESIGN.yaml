# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Parks & Recreation Facility Reservation — Expert band
# 9 rule_ids x >=2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_provisional_vs_final_rounding_order_permit
        grounds:
          - calculations.provisional_quote_fee
          - calculations.final_grant_fee
          - entities.Permit.fields.quoted_fee_cents
          - entities.Permit.fields.final_fee_cents
        distinguishing_aspect: |
          On the SAME Permit, the forward-looking provisional fee (round-per-component-then-sum)
          yields quoted_fee_cents=5500 while the chronological final fee (sum-then-round) yields
          final_fee_cents=5499 for identical hours and residency — the divergence comes purely
          from rounding order, on the Permit domain.
        test_recipe:
          setup:
            - "Clock at 2026-07-01T00:00:00Z."
            - "Facility F_div: hourly_rate_cents=3333, resident_discount_pct=0.40, prime_multiplier=1.5, prime window [18,22), deposit_cents=4000, buffer_minutes=0, requires_coi=false."
            - "Patron P RESIDENT and residency_verified=true at BOTH apply and grant."
            - "Permit on 2026-08-02T17:30Z..19:30Z (0.5h non-prime + 1.5h prime)."
            - "A CAPTURED Payment covering final_fee+deposit exists before grant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Div Court", facility_type: "COURT", hourly_rate_cents: 3333, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 4000, buffer_minutes: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_div_id: $.data.id, fac_div_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "Res P", email: "resp@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /patrons/${p_id}/verify-residency"
              payload: {}
              as: RecCoordinator
            - call: "POST /facilities/${fac_div_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-02T17:30:00Z", end_at: "2026-08-02T19:30:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id, quoted: $.data.quoted_fee_cents }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 5499, deposit_component_cents: 4000 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_div_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_div_v}" }
              as: RecCoordinator
              captures: { final_fee: $.data.final_fee_cents }
          assert:
            - "Permit.${perm_id}.quoted_fee_cents == 5500"
            - "Permit.${perm_id}.final_fee_cents == 5499"
            - "Permit.${perm_id}.quoted_fee_cents != Permit.${perm_id}.final_fee_cents"

      - name: dvc_lottery_priority_weight_vs_permit_fee
        grounds:
          - calculations.lottery_selection
          - calculations.final_grant_fee
          - entities.LotteryEntry.fields.priority_weight
          - entities.LotteryEntry.fields.status
        distinguishing_aspect: |
          A second dual-variant subject on a DIFFERENT entity domain: lottery winner selection
          (weighted_scoring on LotteryEntry — verified resident weight 2 beats unverified weight 1)
          is computed independently of the fee calculation on Permit, so the scaffold exhibits
          dual-variant logic across two distinct entity domains (LotteryEntry vs Permit).
        test_recipe:
          setup:
            - "Clock at 2026-07-15T00:00:00Z (>= closes_at)."
            - "Facility F_lot, prime slot 2026-08-03T18:00Z..20:00Z, deposit_cents=5000, hourly base whole-cent."
            - "LotteryRound R closed; two entries: P_res (RESIDENT verified, weight 2) entered AFTER P_non (NON_RESIDENT, weight 1)."
            - "Despite later entry_seq, P_res wins on weight; a GRANTED permit is synthesized for P_res."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Lot Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 5000, buffer_minutes: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_lot_id: $.data.id, fac_lot_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "Non Res", email: "nonres@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_non_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Res Win", email: "reswin@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_res_id: $.data.id }
            - call: "POST /patrons/${p_res_id}/verify-residency"
              payload: {}
              as: RecCoordinator
            - call: "POST /lottery-rounds"
              payload: { facility_id: "${fac_lot_id}", slot_start_at: "2026-08-03T18:00:00Z", slot_end_at: "2026-08-03T20:00:00Z", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-15T00:00:00Z" }
              as: RecCoordinator
              captures: { round_id: $.data.id }
            - call: "POST /lottery-rounds/${round_id}/entries"
              payload: { patron_id: "${p_non_id}" }
              as: Patron
              as_user_id: "${p_non_id}"
              captures: { entry_non_id: $.data.id }
            - call: "POST /lottery-rounds/${round_id}/entries"
              payload: { patron_id: "${p_res_id}" }
              as: Patron
              as_user_id: "${p_res_id}"
              captures: { entry_res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: RecCoordinator
          trigger:
            - call: "POST /lottery-rounds/${round_id}/draw"
              payload: { expected_facility_version: "${fac_lot_v}" }
              as: RecCoordinator
              captures: { winning_entry: $.data.winning_entry_id }
          assert:
            - "LotteryRound.${round_id}.winning_entry_id == ${entry_res_id}"
            - "LotteryEntry.${entry_res_id}.status == WON"
            - "LotteryEntry.${entry_non_id}.status == LOST"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_rounding_order_pinned_provisional
        grounds:
          - calculations.provisional_quote_fee
          - calculations.prime_overlap_hours
          - entities.Permit.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: provisional pins round-per-component-then-sum
          (1000 + 4500 = 5500), whereas naive sum-then-round of the same components gives 5499. The
          scaffold pins per-component rounding for the provisional quote explicitly.
        test_recipe:
          setup:
            - "Same F_div facility (hourly 3333, disc 0.40, mult 1.5, prime [18,22)) and RESIDENT verified patron."
            - "Permit window 2026-08-02T17:30Z..19:30Z -> non-prime 0.5h, prime 1.5h; eff rate 1999.8 cents/hr."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Div2", facility_type: "COURT", hourly_rate_cents: 3333, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "RP", email: "rp2@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /patrons/${p_id}/verify-residency"
              payload: {}
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-02T17:30:00Z", end_at: "2026-08-02T19:30:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
          assert:
            - "Permit.${perm_id}.quoted_fee_cents == 5500"
            - "Permit.${perm_id}.is_prime_requested == true"
            - "Permit.${perm_id}.pricing_residency == RESIDENT"

      - name: cf_nonlinear_refund_two_factor_tier
        grounds:
          - calculations.cancellation_refund
          - entities.Refund.fields.fee_refund_cents
          - entities.Refund.fields.deposit_refund_cents
          - entities.Refund.fields.total_refund_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula with conditional branches: refund is a function of
          (lead time tier, final_fee_cents, deposit_held_cents) with two independent conditional
          breakpoints — fee tier (full/half/zero) AND a separate deposit-forfeit cutoff — so at
          lead=30h the fee branch yields 0 while the deposit branch still pays out 5000.
        test_recipe:
          setup:
            - "Granted permit on F_flip with final_fee_cents=24000, deposit_held_cents=5000, start_at 2026-08-01T17:00Z."
            - "Cancel at clock 2026-07-31T11:00Z (lead exactly 30h): fee tier 0% (lead<48), deposit kept (lead>=24)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Flip Pool", facility_type: "POOL", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 5000, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "RV", email: "rv@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /patrons/${p_id}/verify-residency"
              payload: {}
              as: RecCoordinator
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-01T17:00:00Z", end_at: "2026-08-01T20:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 24000, deposit_component_cents: 5000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T11:00:00Z" }
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_status: $.data.status }
          assert:
            - "Permit.${perm_id}.status == CANCELLED"
            - "Permit.${perm_id}.cancelled_lead_hours == 30"
            - "Refund for ${perm_id}: fee_refund_cents == 0"
            - "Refund for ${perm_id}: deposit_refund_cents == 5000"
            - "Refund for ${perm_id}: total_refund_cents == 5000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_permit_branching_grant_waitlist_deny
        grounds:
          - state_machines.Permit.APPLIED_to_GRANTED
          - state_machines.Permit.APPLIED_to_WAITLISTED
          - state_machines.Permit.WAITLISTED_to_GRANTED
        distinguishing_aspect: |
          Permit is a branching fork machine: APPLIED forks to GRANTED / WAITLISTED / DENIED with
          divergent side-effect sets (GRANTED holds deposit + bumps facility count; WAITLISTED holds
          nothing), and WAITLISTED can rejoin to GRANTED — a non-linear shape on the Permit entity.
        test_recipe:
          setup:
            - "Facility F with buffer 0; two overlapping permits P1 and P2 on the same window."
            - "P1 granted first (consumes the slot); P2 grant with on_conflict=WAITLIST -> WAITLISTED."
            - "Cancel P1 (frees slot); re-grant P2 -> GRANTED (rejoin)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Branch Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 0, buffer_minutes: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "A", email: "a@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "B", email: "b@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { pb_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${pa_id}", start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T12:00:00Z" }
              as: Patron
              as_user_id: "${pa_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${pb_id}", start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T12:00:00Z" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /permits/${p1_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${p1_id}/grant"
              payload: { expected_facility_version: "${fac_v0}" }
              as: RecCoordinator
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { fac_v_after1: $.data.version }
            - call: "POST /facilities/${fac_id}/permits/${p2_id}/grant"
              payload: { on_conflict: "WAITLIST", expected_facility_version: "${fac_v_after1}" }
              as: RecCoordinator
              captures: { p2_status: $.data.status }
            - call: "POST /facilities/${fac_id}/permits/${p1_id}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: RecCoordinator
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { fac_v_after_cancel: $.data.version }
            - call: "POST /permits/${p2_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${p2_id}/grant"
              payload: { expected_facility_version: "${fac_v_after_cancel}" }
              as: RecCoordinator
              captures: { p2_final_status: $.data.status }
          assert:
            - "Permit.${p2_id}.status == WAITLISTED after the on_conflict=WAITLIST grant"
            - "Permit.${p2_id}.status == GRANTED after re-grant on the freed slot"
            - "Permit.${p1_id}.status == CANCELLED"

      - name: nlsm_lottery_round_branch_drawn_vs_cancelled
        grounds:
          - state_machines.LotteryRound.OPEN_to_DRAWN
          - state_machines.LotteryRound.OPEN_to_CANCELLED
          - state_machines.LotteryEntry.ENTERED_to_WON
          - state_machines.LotteryEntry.ENTERED_to_LOST
        distinguishing_aspect: |
          A second non-linear machine on a DIFFERENT entity (LotteryRound): OPEN forks to DRAWN
          (winner WON, losers LOST, permit synthesized) vs CANCELLED (all entries WITHDRAWN, no
          permit) — divergent side-effect sets per branch, distinct from the Permit machine.
        test_recipe:
          setup:
            - "LotteryRound R2 OPEN with two ENTERED entries; coordinator cancels the round before drawing."
            - "All entries become WITHDRAWN; no permit synthesized; round CANCELLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "CancelRound Court", facility_type: "COURT", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "E1", email: "e1@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "E2", email: "e2@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /lottery-rounds"
              payload: { facility_id: "${fac_id}", slot_start_at: "2026-08-03T18:00:00Z", slot_end_at: "2026-08-03T20:00:00Z", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-15T00:00:00Z" }
              as: RecCoordinator
              captures: { round_id: $.data.id }
            - call: "POST /lottery-rounds/${round_id}/entries"
              payload: { patron_id: "${p1_id}" }
              as: Patron
              as_user_id: "${p1_id}"
              captures: { entry1_id: $.data.id }
            - call: "POST /lottery-rounds/${round_id}/entries"
              payload: { patron_id: "${p2_id}" }
              as: Patron
              as_user_id: "${p2_id}"
              captures: { entry2_id: $.data.id }
          trigger:
            - call: "POST /lottery-rounds/${round_id}/cancel"
              payload: {}
              as: RecCoordinator
              captures: { round_status: $.data.status }
          assert:
            - "LotteryRound.${round_id}.status == CANCELLED"
            - "LotteryEntry.${entry1_id}.status == WITHDRAWN"
            - "LotteryEntry.${entry2_id}.status == WITHDRAWN"
            - "LotteryRound.${round_id}.winning_entry_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_league_cancel_to_permit_to_refund_depth3
        grounds:
          - state_machines.LeagueSeries.transitions
          - state_machines.Permit.GRANTED_to_CANCELLED
          - calculations.cancellation_refund
          - entities.Refund.fields.total_refund_cents
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: POST /leagues/{id}/cancel sets LeagueSeries -> CANCELLED
          (hop 1) which cancels a GRANTED child Permit -> CANCELLED (hop 2 caused by hop 1) which itself
          creates a Refund and decrements Facility.granted_permit_count (hop 3 caused by hop 2). Each
          link is caused by the previous link, not by the original cancel call.
        test_recipe:
          setup:
            - "League L on F_flip (deposit 5000) with 2 occurrences; one child P_g granted, one child P_a still APPLIED."
            - "Cancel the league at lead well over 168h -> full fee + deposit refund on the granted child."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "League Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 5000, buffer_minutes: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Org", email: "org@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /leagues"
              payload: { facility_id: "${fac_id}", patron_id: "${p_id}", weekday: 1, start_hour: 10, duration_minutes: 120, first_date: "2026-08-04T00:00:00Z", occurrences: 2 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { league_id: $.data.id }
            - call: "GET /leagues/${league_id}/permits"
              payload: {}
              as: RecCoordinator
              captures: { child0_id: "$.data[0].id" }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { fac_v: $.data.version }
            - call: "POST /permits/${child0_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 5000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${child0_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
          trigger:
            - call: "POST /leagues/${league_id}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { league_status: $.data.status }
          assert:
            - "LeagueSeries.${league_id}.status == CANCELLED"
            - "Permit.${child0_id}.status == CANCELLED"
            - "Refund for ${child0_id}: total_refund_cents == 25000"
            - "Facility.${fac_id}.granted_permit_count == 0"

      - name: tc_no_show_to_standing_to_barred_block_depth2
        grounds:
          - state_machines.Permit.GRANTED_to_NO_SHOW
          - calculations.patron_standing
          - validations[priority=7]
          - entities.Patron.fields.standing
        distinguishing_aspect: |
          A depth-2 cascade from a DIFFERENT trigger (no-show, not league cancel): NO_SHOW on the
          4th granted permit increments no_show_strikes to 4 (hop 1) which recomputes Patron.standing
          to BARRED (hop 2 caused by hop 1), which then blocks the next apply with ERR_PATRON_BARRED.
        test_recipe:
          setup:
            - "Patron P with 3 prior NO_SHOW strikes already at PROBATION; a 4th granted permit whose end_at has passed."
            - "Mark the 4th permit NO_SHOW -> strikes=4 -> standing BARRED -> next apply blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "NS Court", facility_type: "COURT", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 1000, buffer_minutes: 0, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "NS", email: "ns@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /_inject/no_show_strikes"
              payload: { patron_id: "${p_id}", strikes: 3 }
              as: RecCoordinator
