  # ----------------------------------------------------------------- rbac ----
  - section: rbac
    instances:
      - name: create_supplier_unknown_role_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "An X-User-Role value outside the nine declared roles is an authentication failure (401), not an authorization failure."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/suppliers", payload: { name: "X", origin_region: "Y" }, as: UnknownRole, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and ${err} == ERR_UNAUTHENTICATED"

      - name: sensory_grader_cannot_create_supplier
        claim_type: rbac_denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
          - "roles.SensoryGrader"
        distinguishing_aspect: "SensoryGrader is a valid role but lacks supplier-registry rights: 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/suppliers", payload: { name: "X", origin_region: "Y" }, as: SensoryGrader, as_user_id: "gr-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and ${err} == ERR_FORBIDDEN"

      - name: blend_master_cannot_set_clock
        claim_type: rbac_denial
        grounds:
          - "roles.PlatformAdmin"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "The test-driving clock endpoint is PlatformAdmin-exclusive; BlendMaster gets 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "clock unchanged (subsequent reads still see the previous value)"

      - name: planner_cannot_release_lot
        claim_type: rbac_denial
        grounds:
          - "roles.QAManager"
