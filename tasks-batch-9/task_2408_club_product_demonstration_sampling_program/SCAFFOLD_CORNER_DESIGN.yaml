            - "GET /demo-events?manufacturer_id=${mfr_id} -> data has exactly 0 rows and total_count 0"

      - name: demo_event_event_type_computed_from_product_food_handling_flag
        claim_type: computed_fields
        grounds:
          - entities.DemoEvent.fields.event_type
          - entities.Product.fields.requires_food_handling
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / restricted_club_status_blocks_food_approval_while_admitting_non_food
          rationale: "That instance asserts DemoEvent.event_type == FOOD_SAMPLING and == NON_FOOD_DEMO on two events built from products differing only in requires_food_handling, which is exactly this claim."

  # ===========================================================================
  # SECTION 2 — State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: demo_event_starts_in_draft_unstaffed_and_unbilled
        claim_type: initial_state
        grounds:
          - state_machines.DemoEvent.transitions.DRAFT_to_SUBMITTED
          - entities.DemoEvent.fields.booking_status
          - entities.DemoEvent.fields.staffing_status
          - entities.DemoEvent.fields.settlement_status
        distinguishing_aspect: "A freshly created DemoEvent occupies the initial state of all three independent status dimensions at once — booking_status DRAFT, staffing_status UNSTAFFED, settlement_status UNBILLED — with no_show_recovery_open false and cancellation_reason null."
        test_recipe:
          setup:
            - "A manufacturer, club and NON_FOOD product exist; nothing else has happened."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Jarrowmill Home", billing_email: "ap@jarrowmill.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6009", name: "Jarrowmill Club 6009", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "JH-RUG-009", name: "Woven Runner Rug", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 3100, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
          trigger:
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "AFTERNOON", requested_sample_cases: 3, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id", booking: "$.data.booking_status", staffing: "$.data.staffing_status", settlement: "$.data.settlement_status" }
          assert:
            - "${booking} == DRAFT"
            - "${staffing} == UNSTAFFED"
            - "${settlement} == UNBILLED"
            - "DemoEvent.${event_id}.no_show_recovery_open == false"
            - "DemoEvent.${event_id}.cancellation_reason == null"
            - "DemoEvent.${event_id}.event_window_start_utc == 2026-09-14T15:00:00Z"
            - "DemoEvent.${event_id}.event_window_end_utc == 2026-09-14T19:00:00Z"

      - name: submit_before_minimum_lead_time_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DemoEvent.transitions.DRAFT_to_SUBMITTED
          - validations[priority=24]
          - calculations.event_window_and_shift_derivation
          - errors[ERR_BOOKING_LEAD_TIME_TOO_SHORT]
        distinguishing_aspect: "With the clock at 2026-08-01, earliest_bookable_date is 2026-08-08; SUBMIT on an event dated 2026-08-07 returns ERR_BOOKING_LEAD_TIME_TOO_SHORT 422 and leaves booking_status DRAFT, while an event dated exactly 2026-08-08 submits successfully — the bound is inclusive."
        test_recipe:
          setup:
            - "Clock left at its startup default 2026-08-01T00:00:00Z."
            - "Two DRAFT events at the same club on adjacent dates: E_early 2026-08-07 (6 days out) and E_edge 2026-08-08 (exactly 7 days out)."
            - "Both use a NON_FOOD product so no certification or station rule can pre-empt the lead-time check."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kelbrook Wares", billing_email: "ap@kelbrook.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6010", name: "Kelbrook Club 6010", region_code: "W", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "KW-TRY-010", name: "Serving Tray Set", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1500, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-08-07", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { early_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-08-08", day_part: "MIDDAY", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { edge_id: "$.data.id" }
          trigger:
            - call: "POST /demo-events/${early_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_lead: "$.data.error_id" }
            - call: "POST /demo-events/${edge_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { edge_state: "$.data.booking_status" }
          assert:
            - "${err_lead} == ERR_BOOKING_LEAD_TIME_TOO_SHORT"
            - "the 2026-08-07 SUBMIT responds with HTTP 422"
            - "DemoEvent.${early_id}.booking_status == DRAFT"
            - "DemoEvent.${early_id}.submitted_at == null"
            - "${edge_state} == SUBMITTED"
            - "the 2026-08-08 SUBMIT responds with HTTP 200"

      - name: approve_executes_its_declared_allocation_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.DemoEvent.transitions.SUBMITTED_to_CONFIRMED
          - calculations.sample_allocation_waterfall
          - entities.DemoEvent.fields.pool_cases_used
          - entities.DemoEvent.fields.required_support_count
          - entities.DemoEvent.fields.approved_at
        distinguishing_aspect: "One APPROVE fires every side effect the transition declares: allocated_sample_cases 8 and pool_cases_used 8 from the waterfall, reserve_cases_used 0 for a non-PLATINUM manufacturer, required_support_count 1 because 8 exceeds SUPPORT_REQUIRED_CASE_THRESHOLD 6, approved_at stamped, and version incremented — with staffing_status still UNSTAFFED."
        test_recipe:
          setup:
            - "GOLD manufacturer (not PLATINUM, so bucket 2 stays at capacity 0) with a NON_FOOD product whose weekly_sample_case_pool is 20 and emergency_reserve_cases is 4."
            - "One SUBMITTED event dated 2026-09-14 with requested_sample_cases 8."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Lomberg Living", billing_email: "ap@lomberg.example", program_tier: "GOLD", credit_limit_cents: 900000, credit_terms_days: 45 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6011", name: "Lomberg Club 6011", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "LL-LMP-011", name: "Arc Floor Lamp", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 5900, samples_per_case: 2, weekly_sample_case_pool: 20, emergency_reserve_cases: 4 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 8, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { v_submitted: "$.data.version" }
          trigger:
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { state: "$.data.booking_status", alloc: "$.data.allocated_sample_cases", pool_used: "$.data.pool_cases_used", reserve_used: "$.data.reserve_cases_used", support_needed: "$.data.required_support_count", v_confirmed: "$.data.version" }
          assert:
            - "${state} == CONFIRMED"
            - "${alloc} == 8"
            - "${pool_used} == 8"
            - "${reserve_used} == 0"
            - "${support_needed} == 1"
            - "${v_confirmed} == ${v_submitted} + 1"
            - "DemoEvent.${event_id}.approved_at is not null"
            - "DemoEvent.${event_id}.staffing_status == UNSTAFFED"
            - "GET /clubs/${club_id}/capacity?event_date=2026-09-14&product_id=${product_id} -> pool_remaining == 12 and reserve_remaining == 4"

      - name: close_out_from_confirmed_without_execution_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DemoEvent.transitions.CONFIRMED_to_COMPLETED
          - validations[priority=11]
          - errors[ERR_EVENT_NOT_EXECUTED]
        distinguishing_aspect: "CLOSE_OUT on a CONFIRMED event whose staffing_status is still UNSTAFFED returns ERR_EVENT_NOT_EXECUTED 409 — not ERR_INVALID_STATE, because the booking dimension's from-state is legal and only the staffing dimension is unsatisfied — and both status fields are unchanged afterwards."
        test_recipe:
          setup:
            - "A CONFIRMED NON_FOOD event dated 2026-09-14 with no assignments at all, so staffing_status is UNSTAFFED."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Mistleford Supply", billing_email: "ap@mistleford.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6012", name: "Mistleford Club 6012", region_code: "SW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "MS-CUP-012", name: "Insulated Cup Pack", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1800, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { v_confirmed: "$.data.version" }
          trigger:
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CLOSE_OUT" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /demo-events/${event_id}"
              payload: {}
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { v_after: "$.data.version", booking_after: "$.data.booking_status", staffing_after: "$.data.staffing_status" }
          assert:
            - "${err_id} == ERR_EVENT_NOT_EXECUTED"
            - "the CLOSE_OUT responds with HTTP 409"
            - "${err_id} != ERR_INVALID_STATE"
            - "${booking_after} == CONFIRMED"
            - "${staffing_after} == UNSTAFFED"
            - "${v_after} == ${v_confirmed}"
            - "DemoEvent.${event_id}.settlement_status == UNBILLED"

      - name: cancelled_event_is_locked_against_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DemoEvent.transitions.DRAFT_to_CANCELLED
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is declared terminal for the booking dimension, so after CANCEL from DRAFT each of SUBMIT, APPROVE and CANCEL returns ERR_INVALID_STATE 409 and the row's version stops advancing."
        test_recipe:
          setup:
            - "One DRAFT NON_FOOD event dated 2026-09-14, cancelled by its manufacturer before submission."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Norvale Kitchenware", billing_email: "ap@norvale.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6013", name: "Norvale Club 6013", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "NK-PAN-013", name: "Nonstick Pan", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 2600, samples_per_case: 2, weekly_sample_case_pool: 12 }
