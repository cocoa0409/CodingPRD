            - "Advance.${a1_id}.effective_advance_rate == 0.975 = 0.98 - ceil((35 - 30) / 15) * 0.005"
            - "Advance.${a1_id}.eligible_collateral_value_cents == 1950000000 and required_paydown_cents == 10000000"
            - "the single new MarginCall has trigger_reason == DWELL_EXCEEDED, status == ISSUED, call_amount_cents == 10000000, cure_deadline_at == 2026-09-07T00:00:00Z"
            - "BaileeLetter.${bl1_id}.status == EXPIRED"
            - "RepurchaseDemand.${rd1_id}.status == OPEN, reason == BAILEE_EXPIRED, demand_amount_cents == 1960000000, deadline_at == 2026-09-15T00:00:00Z"
            - "WarehouseFacility.${fac_id}.status == RESTRICTED and open_margin_call_count == 1 — caused by the margin call; the OPEN demand alone would have left it ACTIVE"
            - "WarehouseFacility.${fac_id}.aged_outstanding_cents == 1960000000"
            - "Advance.${a1_id}.funding_status is still SHIPPED — expiry of the bailee letter does not unwind the shipment"

