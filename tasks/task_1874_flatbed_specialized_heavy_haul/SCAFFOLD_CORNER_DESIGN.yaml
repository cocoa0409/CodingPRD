            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Pass case", gross_weight_lbs: 40000, width_in: 100, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_a: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_a}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "F. Ip", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Fail case", gross_weight_lbs: 40000, width_in: 100, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_b: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_b}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "F. Ip", driver_oversize_endorsed: false }, as: Dispatcher }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_a}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 166, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { res_a: "$.data.survey_result", st_a: "$.data.status" } }
            - { call: "POST /heavy-haul/loads/${load_b}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 165, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { res_b: "$.data.survey_result", st_b: "$.data.status" } }
          assert:
            - "res_a == PASSED and st_a == SURVEYED (160 + 6 == 166 meets <= exactly)"
            - "res_b == FAILED and st_b == PLANNED (165 is one inch short; FAILED survey leaves load PLANNED)"

      - name: credit_boundary_equality_passes
        claim_type: correct_result
        grounds: [calculations.credit_availability, entities.Customer.fields.status]
        distinguishing_aspect: "Both credit boundaries are pinned: estimate == remaining credit PASSES the depart gate (<=), and outstanding == credit_limit does NOT suspend (strict >). Verified with a 37800-cent load against a 37800-cent limit."
        test_recipe:
          setup: ["Customer credit_limit exactly 37800; STANDARD load whose provisional estimate is exactly 37800 (100 mi FLATBED linehaul 35000 + fuel 2800)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Exact Credit Co", credit_limit_cents: 37800 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "G. Ro", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver, captures: { st_dep: "$.data.status" } }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_total: "$.data.total_cents" } }
            - { call: "GET /heavy-haul/customers/${cust_id}", as: BillingClerk, captures: { out: "$.data.outstanding_balance_cents", cust_st: "$.data.status" } }
          assert:
            - "st_dep == IN_TRANSIT (37800 <= 37800 passes the depart credit gate)"
            - "inv_total == 37800 and out == 37800"
            - "cust_st == ACTIVE (suspension requires strictly greater than the limit)"

      - name: estimate_input_set_excludes_denied
        claim_type: input_set_filtering
        grounds: [calculations.cost_estimate, state_machines.Permit.FILED_to_DENIED]
        distinguishing_aspect: "The provisional variant counts permits in {FILED, GRANTED} only: denying the FILED permit drops its 9500-cent fee from the estimate, moving total from 48060 to 37800 without any other change."
        test_recipe:
          setup: ["Load 40000 lbs width 150 (oversize only), states [NV], 100 route miles FLATBED; NV OVERSIZE permit FILED at 9500"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Filter Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide skid", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "H. Su", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["NV"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "NV", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk, captures: { fee: "$.data.fee_cents" } }
          trigger:
            - { call: "GET /heavy-haul/loads/${load_id}/cost-estimate", as: Dispatcher, captures: { est1: "$.data.total_cents", est1_permits: "$.data.permits_cents" } }
            - { call: "POST /heavy-haul/permits/${p_os}/deny", payload: { denial_reason: "route study required" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}/cost-estimate", as: Dispatcher, captures: { est2: "$.data.total_cents", est2_permits: "$.data.permits_cents" } }
          assert:
            - "fee == 9500 (NV OVERSIZE 7000 + width 150 bracket 2500)"
            - "est1_permits == 9500 and est1 == 48060 (subtotal 44500 = 35000 + 9500; fuel 8% = 3560)"
            - "est2_permits == 0 and est2 == 37800 (DENIED permit leaves the provisional input set)"

  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or business logic runs; the test omits both headers on the wire."
        test_recipe:
          setup: ["One customer exists"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Header Co", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "GET /heavy-haul/customers/${cust_id}", as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400 (headers stripped by the test client; priority 1 precedes everything else)"

      - name: role_denial_beats_existence_at_depart
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role authorization (priority 2) is evaluated before existence (priority 3): BillingClerk calling depart on a load id that does not exist receives ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["System initialized with one customer"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Order Co", credit_limit_cents: 500000 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /heavy-haul/loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/depart", payload: {}, as: BillingClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (403) even though the load id does not exist - proving priority 2 fires before priority 3"

      - name: invalid_enum_and_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Field sanity covers both enum membership (trailer_type MAGIC_CARPET) and datetime range sanity (crane window_end not after window_start); both are ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Customer + DRAFT load"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Sanity Co", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "MAGIC_CARPET", trailer_axle_count: 2, driver_name: "I. Jo", driver_oversize_endorsed: false }, as: Dispatcher, captures: { err1: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T08:00:00Z", window_end: "2026-08-12T06:00:00Z" }, as: Dispatcher, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (trailer_type not in the declared enum)"
            - "err2 == ERR_INVALID_REQUEST (window_end <= window_start); note the crane call also fails load-state later, but field sanity at priority 6 fires first from DRAFT anyway since DRAFT fails the crane state gate too - the single pinned winner is ERR_INVALID_REQUEST"

      - name: tarping_conditional_validation
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_TARPING_REQUIRED]", entities.Load.fields.cargo_requires_tarp]
        distinguishing_aspect: "The tarping rule is conditional on the load's cargo_requires_tarp flag: method CHAINS is rejected at approval only when the flag is true, and CHAINS_AND_TARPS approves cleanly on the same load."
        test_recipe:
          setup: ["Load 40000 lbs with cargo_requires_tarp true, PLANNED"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Tarp Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Lumber packs", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y", cargo_requires_tarp: true }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "J. Vu", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp1: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/securement-plans/${sp1}/approve", payload: {}, as: SafetyManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS_AND_TARPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp2: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp2}/approve", payload: {}, as: SafetyManager, captures: { st2: "$.data.status" } }
          assert:
            - "err == ERR_TARPING_REQUIRED (flag true + method CHAINS)"
            - "st2 == APPROVED (same load, compliant method - the conditional rule passes)"

      - name: permit_type_not_required_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PERMIT_TYPE_NOT_REQUIRED]"]
        distinguishing_aspect: "A permit whose type does not match the load's computed flags is refused: OVERWEIGHT for a 40000-lb STANDARD load, and SUPERLOAD for a non-superload, both yield ERR_PERMIT_TYPE_NOT_REQUIRED."
        test_recipe:
          setup: ["STANDARD load 40000 lbs, 100x50x400 in, states [OR], SURVEYED"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Permit Match Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "K. Han", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "OR", permit_type: "OVERWEIGHT", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { err1: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "OR", permit_type: "SUPERLOAD", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_PERMIT_TYPE_NOT_REQUIRED (is_overweight is false)"
            - "err2 == ERR_PERMIT_TYPE_NOT_REQUIRED (is_superload is false); both rejected before any permit row is created, load version unchanged at ${lv3}"

      - name: duplicate_permit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_PERMIT]"]
        distinguishing_aspect: "A second CA OVERSIZE permit for the same load is rejected while the first is in a non-terminal status (DRAFT); terminal sibling states (DENIED etc.) would not block, but DRAFT does."
        test_recipe:
          setup: ["Load 40000 lbs width 150 (oversize only), states [CA], SURVEYED; one CA OVERSIZE permit already in DRAFT"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Dupe Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide pallet", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "L. Qi", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p1: "$.data.id" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv4}" }, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUPLICATE_PERMIT (same state_code + permit_type already DRAFT on this load)"

      - name: overweight_fine_manual_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FINE_KIND_NOT_MANUAL]", entities.Fine.fields.kind]
        distinguishing_aspect: "OVERWEIGHT fines are system-created only via the scale-ticket cascade; a manual POST with kind OVERWEIGHT is refused with ERR_FINE_KIND_NOT_MANUAL even with a plausible amount."
        test_recipe:
          setup: ["STANDARD load CLEARED (fines may be reported in CLEARED)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Fine Kind Co", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "M. Ito", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/fines", payload: { kind: "OVERWEIGHT", amount_cents: 5000, description: "manual entry attempt" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FINE_KIND_NOT_MANUAL (system-owned fine kind)"

      - name: trailer_capacity_checked_before_axles
        claim_type: violation_to_error
        grounds: [calculations.trailer_selection_check, "errors[ERR_TRAILER_CAPACITY_EXCEEDED]", "errors[ERR_AXLE_COUNT_INSUFFICIENT]"]
        distinguishing_aspect: "The selection check pins its internal order capacity -> axles -> endorsement: FLATBED with 4 axles under a 96000-lb load fails both capacity and axles, and the pinned winner is ERR_TRAILER_CAPACITY_EXCEEDED; EXTENDABLE with 4 axles isolates ERR_AXLE_COUNT_INSUFFICIENT."
        test_recipe:
          setup: ["Customer + DRAFT load 96000 lbs, 100x50x400 in (required_axles = max(2, ceil(96000/20000)) = 5)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Order Check Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Heavy skid", gross_weight_lbs: 96000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 4, driver_name: "N. Oz", driver_oversize_endorsed: true }, as: Dispatcher, captures: { err1: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 4, driver_name: "N. Oz", driver_oversize_endorsed: true }, as: Dispatcher, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_TRAILER_CAPACITY_EXCEEDED (48000 < 96000; capacity precedes axles even though 4 < 5 also fails)"
            - "err2 == ERR_AXLE_COUNT_INSUFFICIENT (capacity 150000 passes; 4 < required 5)"
            - "load remains DRAFT after both failed plans (no partial mutation)"

      - name: driver_endorsement_required
        claim_type: violation_to_error
        grounds: [calculations.trailer_selection_check, "errors[ERR_DRIVER_NOT_ENDORSED]"]
        distinguishing_aspect: "Endorsement is required exactly when is_oversize OR is_overweight: a 96000-lb load with driver_oversize_endorsed false fails with ERR_DRIVER_NOT_ENDORSED, while the same flag on a STANDARD load plans cleanly."
        test_recipe:
          setup: ["Customer; DRAFT load 96000 lbs, 100x50x400 in"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Endorse Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Heavy skid", gross_weight_lbs: 96000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "O. Py", driver_oversize_endorsed: false }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DRIVER_NOT_ENDORSED (is_overweight true requires the endorsement; capacity and axles both pass, isolating the third check)"

      - name: securement_wll_insufficient
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SECUREMENT_WLL_INSUFFICIENT]", entities.SecurementPlan.fields.aggregate_wll_lbs]
        distinguishing_aspect: "The 50% working-load-limit rule is enforced at approval, not creation: 2 x 10000 = 20000 aggregate WLL is below ceil(96000/2) = 48000, so approve fails with ERR_SECUREMENT_WLL_INSUFFICIENT while the plan stays SUBMITTED."
        test_recipe:
          setup: ["Load 96000 lbs PLANNED (EXTENDABLE, 6 axles, endorsed driver); SUBMITTED plan with aggregate 20000"]
          setup_api_calls:
