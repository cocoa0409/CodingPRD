# =============================================================================
# PRD Benchmark Seed Tables — Industrial Gearbox Remanufacturing
# =============================================================================

scenario: |
  Industrial Gearbox Remanufacturing (gear-drive service center): unit registry
  & serial history, teardown findings & scope-change approval, gear
  cutting/regrind vs replace, assembly clearance & backlash record, run-in test
  & oil analysis baseline, freight of heavy unit & rigging, loaner unit
  program, warranty by service hours.

domain_name: industrial-gearbox-remanufacturing
api_prefix: /reman

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hierarchical          # Customer → GearUnit → RemanOrder → children; peer LoanerUnit/FreightShipment with FK links
  state_machine_shape: branching         # RemanOrder has a scope-change revision loop; GearUnit has parallel physical/commercial dimensions

  relationship_patterns:
    - one_to_many          # Customer→GearUnit, GearUnit→RemanOrder, RemanOrder→TeardownFinding/ComponentDecision/AssemblyRecord/RunInTest
    - cross_aggregate      # LoanerAssignment references LoanerUnit + RemanOrder; WarrantyClaim references RunInTest

  role_model: approval_chain             # IntakeCoordinator → RemanEngineer → QualityInspector → ServiceManager; Customer approves scope changes
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding approved scope (cents) the customer may carry" }
      - { name: outstanding_approved_cents, type: integer, source: computed, default: 0, description: "Sum of approved_scope_cents over that customer's orders whose status is in {APPROVED, IN_BUILD, ASSEMBLY, RUN_IN, READY_TO_SHIP, SHIPPED}" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "Set true when outstanding_approved_cents > credit_limit_cents; cleared when back at or below" }

  - name: GearUnit
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across registry" }
      - { name: model, type: string, source: input, description: "Gearbox model designation" }
      - { name: rated_torque_nm, type: integer, source: input, description: "Nameplate rated torque" }
      - { name: cumulative_service_hours, type: integer, source: computed, default: 0, description: "Running service-hour odometer; advanced by record_service_hours and on order completion" }
      - { name: physical_status, type: enum, source: system, description: "IN_SERVICE | AT_SHOP | SCRAPPED — independent dimension 1" }
      - { name: commercial_status, type: enum, source: system, description: "STANDARD | UNDER_WARRANTY_REVIEW | WARRANTY_FLAGGED — independent dimension 2" }

  - name: RemanOrder
    parent: GearUnit
    common_fields: true
    fields:
      - { name: gear_unit_id, type: string, source: system, description: "FK -> GearUnit.id; unit being remanufactured" }
      - { name: intake_hours, type: integer, source: input, description: "Unit's service hours reported at intake; must equal GearUnit.cumulative_service_hours at creation" }
      - { name: quoted_estimate_cents, type: integer, source: input, description: "Provisional estimate quoted at intake (pre-teardown)" }
      - { name: approved_scope_cents, type: integer, source: computed, default: 0, description: "Sum of approved component line totals (rounded per line then summed); 0 until teardown priced" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Final invoice computed at RUN_IN pass: sum of executed component line totals (rounded per line then summed) + freight and rigging surcharges" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush job flag; applies RUSH_MULTIPLIER to labor component of each line" }
      - { name: status, type: enum, source: system, description: "INTAKE → TEARDOWN → SCOPE_APPROVAL → APPROVED → IN_BUILD → ASSEMBLY → RUN_IN → READY_TO_SHIP → SHIPPED → COMPLETED / CANCELLED" }
      - { name: completed_at_hours, type: integer, source: system, description: "GearUnit.cumulative_service_hours snapshot taken when the order reaches COMPLETED; basis for warranty hour-meter claims. Null until completion" }
      - { name: completed_at_utc, type: datetime, source: system, description: "Logical-clock timestamp when the order reaches COMPLETED; basis for warranty calendar claims. Null until completion" }

  - name: TeardownFinding
    parent: RemanOrder
    common_fields: false          # append-only findings log
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id" }
      - { name: component_code, type: string, source: input, description: "Component identifier, e.g. PINION_1, GEAR_2, BEARING_3" }
      - { name: condition, type: enum, source: input, description: "REUSABLE | REGRINDABLE | CUT_ONLY | BEYOND_REPAIR" }
      - { name: severity, type: integer, source: input, description: "1 (cosmetic) to 5 (safety-critical)" }
      - { name: notes, type: string, source: input, description: "Free-text finding notes" }

  - name: ComponentDecision
    parent: RemanOrder
    common_fields: true
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id" }
      - { name: component_code, type: string, source: input, description: "Component identifier matching a TeardownFinding" }
      - { name: action, type: enum, source: input, description: "REGRIND | CUT_NEW | REPLACE_OEM | REUSE_AS_IS" }
      - { name: labor_hours, type: number, source: input, description: "Labor hours planned for the action" }
      - { name: material_cents, type: integer, source: input, description: "Material/part cost in cents" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-line total: labor billed at action-tier rate (rush-adjusted) + material; rounded per line (round_half_up)" }
      - { name: approval_status, type: enum, source: system, description: "PENDING | APPROVED | SUPERSEDED" }

  - name: AssemblyRecord
    parent: RemanOrder
    common_fields: true
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id" }
      - { name: backlash_mm, type: number, source: input, description: "Measured gear backlash in mm; must satisfy tolerance band" }
      - { name: radial_clearance_mm, type: number, source: input, description: "Measured bearing radial clearance in mm" }
      - { name: axial_clearance_mm, type: number, source: input, description: "Measured shaft axial clearance in mm" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the QualityInspector who recorded it" }
      - { name: within_tolerance, type: boolean, source: computed, description: "True iff backlash_mm in [BACKLASH_MIN, BACKLASH_MAX] and both clearances <= CLEARANCE_MAX" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INVALIDATED — invalidated when order is sent back to IN_BUILD" }

  - name: RunInTest
    parent: RemanOrder
    common_fields: true
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id" }
      - { name: duration_minutes, type: integer, source: input, description: "Run-in duration; must equal RUN_IN_REQUIRED_MINUTES" }
      - { name: max_temp_c, type: number, source: input, description: "Peak oil temperature during run-in" }
      - { name: vibration_mm_s, type: number, source: input, description: "Peak vibration velocity" }
      - { name: oil_particle_count, type: integer, source: input, description: "Oil analysis particle count per ml (ISO 4406 basis)" }
      - { name: oil_baseline_established, type: boolean, source: computed, description: "True when test recorded and result == PASS; this row becomes the warranty oil baseline" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — PASS iff max_temp_c <= TEMP_MAX and vibration_mm_s <= VIB_MAX and oil_particle_count <= PARTICLE_MAX" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED" }

  - name: LoanerUnit
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Loaner serial; unique" }
      - { name: model, type: string, source: input, description: "Gearbox model this loaner can substitute for" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT" }

  - name: LoanerAssignment
    parent: LoanerUnit
    common_fields: true
    fields:
      - { name: loaner_unit_id, type: string, source: system, description: "FK -> LoanerUnit.id" }
      - { name: reman_order_id, type: string, source: input, description: "FK -> RemanOrder.id; the order this loaner covers" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO date, exclusive (half-open interval [start_date, end_date))" }
      - { name: status, type: enum, source: system, description: "RESERVED → CHECKED_OUT → RETURNED / CANCELLED" }

  - name: FreightShipment
    parent: RemanOrder
    common_fields: true
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id" }
      - { name: direction, type: enum, source: input, description: "INBOUND (customer→shop) | OUTBOUND (shop→customer)" }
      - { name: weight_kg, type: integer, source: input, description: "Gross shipping weight" }
      - { name: rigging_bay_date, type: string, source: input, description: "ISO date the rigging bay is booked" }
      - { name: rigging_bay_hours, type: integer, source: input, description: "Booked bay duration; bay occupancy interval is [date, date + hours + RIGGING_BUFFER_HOURS)" }
      - { name: freight_charge_cents, type: integer, source: computed, description: "Tiered freight charge by weight class + rigging hours at RIGGING_HOURLY_CENTS" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | DELIVERED | CANCELLED" }

  - name: WarrantyClaim
    parent: RemanOrder
    common_fields: true
    fields:
      - { name: reman_order_id, type: string, source: system, description: "FK -> RemanOrder.id; order under which the unit was remanufactured" }
      - { name: reported_hours, type: integer, source: input, description: "Unit cumulative service hours at time of claim" }
      - { name: claim_reason, type: string, source: input, description: "Failure description" }
      - { name: hours_since_reman, type: integer, source: computed, description: "= reported_hours - reman_order.completed_at_hours (order's completion-hour snapshot)" }
      - { name: warranty_clock_start_hours, type: integer, source: system, description: "Copied from RemanOrder.completed_at_hours at claim creation" }
      - { name: eligibility, type: enum, source: computed, description: "COVERED | EXPIRED_HOURS | EXPIRED_CALENDAR — dual-variant verdict; computed only once the order is COMPLETED (null while order is non-terminal)" }
      - { name: status, type: enum, source: system, description: "OPEN → UNDER_REVIEW → APPROVED / DENIED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RemanOrder
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: TEARDOWN
        trigger: "POST /reman/orders/{orderId}/start-teardown"
        actor: RemanEngineer
        preconditions:
          - "GearUnit.physical_status == AT_SHOP (ERR_UNIT_NOT_AT_SHOP)"
          - "No other RemanOrder for same gear_unit_id in a non-terminal state (ERR_UNIT_BUSY)"
        side_effects: []

      - from: TEARDOWN
        to: SCOPE_APPROVAL
        trigger: "POST /reman/orders/{orderId}/submit-scope"
        actor: RemanEngineer
        preconditions:
          - "At least one TeardownFinding exists for the order (ERR_NO_FINDINGS)"
          - "Every TeardownFinding.component_code has a ComponentDecision in PENDING (ERR_DECISIONS_INCOMPLETE)"
        side_effects:
          - "Compute each ComponentDecision.line_total_cents (per-line rounding)"
          - "Recompute RemanOrder.approved_scope_cents = sum(line_total_cents of PENDING decisions)"
          - "If approved_scope_cents > quoted_estimate_cents: order lands in SCOPE_APPROVAL awaiting customer approval"
          - "Else (scope within estimate): order auto-advances TEARDOWN → APPROVED (system transition), all PENDING ComponentDecisions → APPROVED, and Customer.outstanding_approved_cents += approved_scope_cents with credit_hold recomputed — identical fiscal effects to a customer approval"

      - from: SCOPE_APPROVAL
        to: APPROVED
        trigger: "POST /reman/orders/{orderId}/approve-scope"
        actor: Customer
        preconditions:
          - "Caller must be the customer who owns the GearUnit (ERR_FORBIDDEN)"
          - "Customer.credit_hold == false AND Customer.outstanding_approved_cents + approved_scope_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "All PENDING ComponentDecisions → APPROVED"
          - "Customer.outstanding_approved_cents += approved_scope_cents; recompute credit_hold"
          - "GearUnit.physical_status stays AT_SHOP"

      - from: SCOPE_APPROVAL
        to: SCOPE_APPROVAL
        trigger: "POST /reman/orders/{orderId}/revise-scope (revision loop: engineer re-presents the amended decision set after posting replacement ComponentDecisions)"
        actor: RemanEngineer
        preconditions:
          - "Every TeardownFinding.component_code has a PENDING ComponentDecision (ERR_DECISIONS_INCOMPLETE)"
        side_effects:
          - "Recompute approved_scope_cents from the current PENDING decision set (per-component supersede already applied at POST /decisions time)"
          - "Increments RemanOrder.version by 1"
        note: "Self-loop revision cycle; loop count unbounded but each revision increments RemanOrder.version"

      - from: APPROVED
        to: IN_BUILD
        trigger: "POST /reman/orders/{orderId}/start-build"
        actor: RemanEngineer
        preconditions:
          - "All ComponentDecisions APPROVED (ERR_DECISIONS_INCOMPLETE)"
        side_effects: []

      - from: IN_BUILD
        to: ASSEMBLY
        trigger: "POST /reman/orders/{orderId}/start-assembly"
        actor: RemanEngineer
        preconditions: []
        side_effects: []

      - from: ASSEMBLY
        to: RUN_IN
        trigger: "POST /reman/orders/{orderId}/submit-assembly"
        actor: QualityInspector
        preconditions:
          - "An ACTIVE AssemblyRecord exists for the order (ERR_NO_ASSEMBLY_RECORD)"
          - "Latest ACTIVE AssemblyRecord.within_tolerance == true (ERR_TOLERANCE_EXCEEDED)"
        side_effects: []

      - from: RUN_IN
        to: READY_TO_SHIP
        trigger: "POST /reman/orders/{orderId}/run-in-tests (computed result == PASS)"
        actor: QualityInspector
        preconditions:
          - "Recorded RunInTest.result == PASS (the endpoint always creates the record; a PASS result drives this branch)"
        side_effects:
          - "RunInTest.oil_baseline_established = true"
          - "Compute final_invoice_cents (per-line sum + freight/rigging surcharges)"

      - from: RUN_IN
        to: IN_BUILD
        trigger: "POST /reman/orders/{orderId}/run-in-tests (computed result == FAIL) — automatic return to build"
        actor: system
        preconditions:
          - "Recorded RunInTest.result == FAIL"
        side_effects:
          - "RunInTest.status → SUPERSEDED"
          - "ACTIVE AssemblyRecord → INVALIDATED (forces fresh assembly measurements on rebuild)"
          - "Note: this mutation on AssemblyRecord itself triggers no further cascade"

      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /reman/orders/{orderId}/ship"
        actor: ServiceManager
        preconditions:
          - "An OUTBOUND FreightShipment for the order exists and its status == BOOKED (ERR_FREIGHT_NOT_READY)"
          - "No LoanerAssignment for the order is in CHECKED_OUT (ERR_LOANER_OUTSTANDING)"
        side_effects:
          - "OUTBOUND FreightShipment.status → IN_TRANSIT"

      - from: SHIPPED
        to: COMPLETED
        trigger: "POST /reman/orders/{orderId}/complete"
        actor: ServiceManager
        preconditions:
          - "OUTBOUND FreightShipment.status == DELIVERED (ERR_FREIGHT_NOT_READY)"
        side_effects:
          - "GearUnit.physical_status → IN_SERVICE"
          - "GearUnit.commercial_status → STANDARD"
          - "Customer.outstanding_approved_cents -= approved_scope_cents; recompute credit_hold"
          - "RemanOrder.completed_at_hours = GearUnit.cumulative_service_hours; completed_at_utc = logical clock"

      - from: SCOPE_APPROVAL
        to: CANCELLED
        trigger: "POST /reman/orders/{orderId}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "PENDING ComponentDecisions → SUPERSEDED"
          - "RESERVED LoanerAssignments for this order → CANCELLED (frees the loaner window)"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /reman/orders/{orderId}/cancel"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: GearUnit
    initial_state: "physical: IN_SERVICE, commercial: STANDARD"
    terminal_states: ["physical: SCRAPPED"]
    note: "Parallel dimensions: physical_status and commercial_status evolve independently on the same row"
    transitions:
      - from: "physical IN_SERVICE"
        to: "physical AT_SHOP"
        trigger: "POST /reman/units/{unitId}/check-in"
        actor: IntakeCoordinator
        preconditions:
          - "commercial_status != WARRANTY_FLAGGED (ERR_UNIT_FLAGGED)"
        side_effects: []

      - from: "physical AT_SHOP"
        to: "physical IN_SERVICE"
        trigger: "system (order COMPLETED side effect)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "physical AT_SHOP"
        to: "physical SCRAPPED"
        trigger: "POST /reman/units/{unitId}/scrap"
        actor: ServiceManager
        preconditions:
          - "No RemanOrder for the unit in a non-terminal state (ERR_UNIT_BUSY)"
        side_effects:
          - "commercial_status → STANDARD (reset)"

      - from: "commercial STANDARD"
        to: "commercial UNDER_WARRANTY_REVIEW"
        trigger: "system (WarrantyClaim opened on a COMPLETED order for this unit)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "commercial UNDER_WARRANTY_REVIEW"
        to: "commercial WARRANTY_FLAGGED"
        trigger: "system (WarrantyClaim APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "commercial UNDER_WARRANTY_REVIEW"
        to: "commercial STANDARD"
        trigger: "system (WarrantyClaim DENIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoanerAssignment
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /reman/loaner-assignments/{assignmentId}/checkout"
        actor: IntakeCoordinator
        preconditions:
          - "LoanerUnit.status == AVAILABLE (ERR_LOANER_UNAVAILABLE)"
          - "Current date >= start_date (ERR_LOANER_WINDOW_FUTURE)"
        side_effects:
          - "LoanerUnit.status → CHECKED_OUT"

      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /reman/loaner-assignments/{assignmentId}/return"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "LoanerUnit.status → AVAILABLE"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /reman/loaner-assignments/{assignmentId}/cancel OR system cascade from order cancel"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: FreightShipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /reman/shipments/{shipmentId}/dispatch"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /reman/shipments/{shipmentId}/deliver"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "OUTBOUND delivery on an order in SHIPPED: no further cascade (order completion is a separate explicit step)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reman/shipments/{shipmentId}/cancel"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /reman/warranty-claims/{claimId}/review"
        actor: QualityInspector
        preconditions:
          - "Linked order status == COMPLETED (ERR_ORDER_NOT_COMPLETED)"
        side_effects:
          - "GearUnit.commercial_status → UNDER_WARRANTY_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reman/warranty-claims/{claimId}/approve"
        actor: ServiceManager
        preconditions:
          - "eligibility == COVERED (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "GearUnit.commercial_status → WARRANTY_FLAGGED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /reman/warranty-claims/{claimId}/deny"
        actor: ServiceManager
        preconditions: []
        side_effects:
          - "GearUnit.commercial_status → STANDARD"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: scope-revision-stale-order
    parent_entity: RemanOrder
    write_endpoint: "POST /reman/orders/{orderId}/revise-scope"
    occ_field: "expected_order_version"
    description: |
      Revising the scope of a RemanOrder whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just submitted a revision (which legitimately supersedes the
      prior PENDING decision set) and the current writer's view of the order
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: loaner-return-stale-assignment
    parent_entity: LoanerAssignment
    write_endpoint: "POST /reman/loaner-assignments/{assignmentId}/return"
    occ_field: "expected_assignment_version"
    description: |
      Returning a LoanerAssignment whose version has advanced since the client
      last observed it (e.g. a window extension mutation landed in between) is
      rejected as a stale-version conflict; the client must re-read the
      assignment before returning it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: component_line_total
    trigger: "submit-scope and revise-scope (per ComponentDecision)"
    algorithm: tiered_pricing
    formula: |
      rate_cents_per_hour =
        REGRIND:     8500
        CUT_NEW:    14200
        REPLACE_OEM: 6000      # labor only; material carries the part cost
        REUSE_AS_IS: 2500
      labor_cents = round_half_up(labor_hours * rate_cents_per_hour * (RUSH_MULTIPLIER if order.rush else 1.0))
      line_total_cents = round_half_up(labor_cents + material_cents)   # per-line rounding, THEN sum
    constants:
      RUSH_MULTIPLIER: 1.25
    precision: "integer cents, round_half_up per line; summation over lines uses already-rounded values"
    note: "Pins rounding order: round per line, then sum. Sum-then-round produces different cents and is non-conformant."

  - name: approved_scope_total
    trigger: "submit-scope / revise-scope"
    algorithm: aggregation
    formula: |
      approved_scope_cents = sum(line_total_cents for ComponentDecision where approval_status == PENDING and reman_order_id == order.id)
    precision: "integer cents"

  - name: final_invoice_total
    trigger: "RUN_IN pass (record-run-in with result PASS)"
    algorithm: aggregation
    formula: |
      executed = ComponentDecision where approval_status == APPROVED and reman_order_id == order.id
      final_invoice_cents = sum(line_total_cents over executed)
                          + sum(freight_charge_cents over FreightShipment where reman_order_id == order.id and status != CANCELLED)
    precision: "integer cents"
    variants:
      - name: provisional_estimate
        when: "At INTAKE — quoted_estimate_cents is the forward-looking estimate before teardown findings"
        difference: "Quoted at intake from flat inspection book rate; deliberately diverges from final_invoice_cents once teardown actuals, rush multiplier, and freight surcharges are known"

  - name: freight_charge
    trigger: "FreightShipment creation"
    algorithm: tiered_pricing
    formula: |
      base_cents =
        weight_kg <= 500:    45000
        weight_kg <= 2000:  120000
        weight_kg > 2000:   120000 + ceil((weight_kg - 2000) / 500) * 18000
      freight_charge_cents = base_cents + rigging_bay_hours * RIGGING_HOURLY_CENTS
    constants:
      RIGGING_HOURLY_CENTS: 9500
      RIGGING_BUFFER_HOURS: 2
    precision: "integer cents; ceil for the overweight tier"

  - name: warranty_eligibility
    trigger: "WarrantyClaim creation and review"
    algorithm: threshold
    formula: |
      hours_since_reman = reported_hours - warranty_clock_start_hours
      calendar_days_since_reman = (claim.created_at - order.completed_at_utc) in whole days
      if hours_since_reman <= WARRANTY_HOURS_LIMIT: verdict_hours = COVERED
      else: verdict_hours = EXPIRED_HOURS
      if calendar_days_since_reman <= WARRANTY_CALENDAR_DAYS: verdict_cal = COVERED
      else: verdict_cal = EXPIRED_CALENDAR
      eligibility = COVERED iff both verdicts are COVERED;
                    else EXPIRED_HOURS if verdict_hours failed first (hours basis evaluated before calendar basis)
                    else EXPIRED_CALENDAR
    constants:
      WARRANTY_HOURS_LIMIT: 2000          # boundary: covered AT exactly 2000 (<=)
      WARRANTY_CALENDAR_DAYS: 365
    precision: "integer hours; whole calendar days"
    variants:
      - name: hours_basis
        when: "Fleet customers meter by service hours"
        difference: "Uses hours_since_reman vs WARRANTY_HOURS_LIMIT (<= 2000 covered, 2001 expired)"
      - name: calendar_basis
        when: "Same claim evaluated on calendar age"
        difference: "Uses calendar days vs WARRANTY_CALENDAR_DAYS; a claim can be covered on hours yet expired on calendar — dual verdicts differ for identical claim data"

  - name: run_in_result
    trigger: "record-run-in"
    algorithm: threshold
    formula: |
      result = PASS iff max_temp_c <= TEMP_MAX
                 and vibration_mm_s <= VIB_MAX
                 and oil_particle_count <= PARTICLE_MAX
                 and duration_minutes == RUN_IN_REQUIRED_MINUTES
    constants:
      TEMP_MAX: 95.0
      VIB_MAX: 4.5
      PARTICLE_MAX: 3200
      RUN_IN_REQUIRED_MINUTES: 120

  - name: assembly_tolerance
    trigger: "AssemblyRecord creation"
    algorithm: threshold
    formula: |
      within_tolerance = (BACKLASH_MIN <= backlash_mm <= BACKLASH_MAX)
                         and radial_clearance_mm <= CLEARANCE_MAX
                         and axial_clearance_mm <= CLEARANCE_MAX
    constants:
      BACKLASH_MIN: 0.08          # inclusive both ends
      BACKLASH_MAX: 0.18          # exactly 0.18 is WITHIN tolerance (<=)
      CLEARANCE_MAX: 0.05

  - name: customer_credit_hold
    trigger: "scope approval and order completion/cancellation"
    algorithm: aggregation
    formula: |
      outstanding_approved_cents = sum(approved_scope_cents over RemanOrder
                                       where gear_unit.customer_id == customer.id
                                       and status in {APPROVED, IN_BUILD, ASSEMBLY, RUN_IN, READY_TO_SHIP, SHIPPED})
      credit_hold = outstanding_approved_cents > credit_limit_cents   # strictly greater; equal is NOT a hold
      # Order completion (SHIPPED → COMPLETED) removes the order from the sum — the only debit point.
      # Cancellation from SCOPE_APPROVAL never entered the sum, so no compensating debit is needed there.
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; entity-backed ownership where declared (Customer may act only on own units' orders)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (customer, unit, order, child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource in a state from which the requested transition exists (incl. terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Assembly tolerance safety gate (within_tolerance) before progression to RUN_IN"
    error_id: ERR_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: "submit-assembly"

  - priority: 6
    category: business_referential
    check: "Referential completeness: findings exist, every finding has a decision, assembly record exists, oil baseline exists"
    error_id: "ERR_NO_FINDINGS / ERR_DECISIONS_INCOMPLETE / ERR_NO_ASSEMBLY_RECORD"
    http_status: 422
    applies_to: "submit-scope, revise-scope, submit-assembly, warranty review"

  - priority: 7
    category: business_constraint
    check: "Uniqueness and exclusivity: serial_number unique; at most one non-terminal order per unit; loaner window overlap rules; rigging bay overlap rules"
    error_id: "ERR_SERIAL_EXISTS / ERR_UNIT_BUSY / ERR_LOANER_OVERLAP / ERR_RIGGING_BAY_CONFLICT"
    http_status: 409
    applies_to: "unit create, order create, loaner-assignment create, shipment create"

  - priority: 8
    category: business_temporal
    check: "Temporal windows: assignment end_date > start_date; checkout not before start_date; warranty calendar basis"
    error_id: "ERR_INVALID_WINDOW / ERR_LOANER_WINDOW_FUTURE / ERR_WARRANTY_EXPIRED"
    http_status: 422
    applies_to: "loaner-assignment create/checkout, warranty approve"

  - priority: 9
    category: business_fiscal
    check: "Fiscal gates: credit limit at scope approval (credit_hold false and projected outstanding <= credit_limit_cents)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "approve-scope"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Customer ---
  - method: POST
    path: "/reman/customers"
    description: "Register a customer"
    roles: [IntakeCoordinator]
    code: 201
    input: [legal_name, credit_limit_cents]
    output: Customer
    side_effects: ["outstanding_approved_cents=0, credit_hold=false"]

  - method: GET
    path: "/reman/customers/{customerId}"
    description: "Get a customer"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/reman/customers/{id}/units"
    description: "List gear units of a customer"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "GearUnit[]"
    side_effects: []

  # --- GearUnit ---
  - method: POST
    path: "/reman/customers/{id}/units"
    description: "Register a serialized gear unit"
    roles: [IntakeCoordinator]
    code: 201
    input: [serial_number, model, rated_torque_nm]
    output: GearUnit
    side_effects: ["physical_status=IN_SERVICE, commercial_status=STANDARD, cumulative_service_hours=0"]

  - method: GET
    path: "/reman/units/{unitId}"
    description: "Get a gear unit"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: GearUnit
    side_effects: []

  - method: POST
    path: "/reman/units/{unitId}/record-service-hours"
    description: "Advance the unit's service-hour odometer (forward only)"
    roles: [IntakeCoordinator]
    code: 200
    input: [hours]
    output: GearUnit
    side_effects: ["cumulative_service_hours = max(cumulative_service_hours, hours)"]

  - method: POST
    path: "/reman/units/{unitId}/check-in"
    description: "Check unit into the shop"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: GearUnit
    side_effects: ["physical_status → AT_SHOP"]

  - method: POST
    path: "/reman/units/{unitId}/scrap"
    description: "Scrap a unit (terminal)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: GearUnit
    side_effects: ["physical_status → SCRAPPED, commercial_status → STANDARD"]

  # --- RemanOrder ---
  - method: POST
    path: "/reman/units/{id}/orders"
    description: "Open a remanufacturing order at intake"
    roles: [IntakeCoordinator]
    code: 201
    input: [intake_hours, quoted_estimate_cents, "rush?"]
    output: RemanOrder
    side_effects:
      - "status=INTAKE"
      - "intake_hours must equal GearUnit.cumulative_service_hours (ERR_INTAKE_HOURS_MISMATCH)"
      - "unit must be physical_status == AT_SHOP (ERR_UNIT_NOT_AT_SHOP)"

  - method: GET
    path: "/reman/orders/{orderId}"
    description: "Get an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: RemanOrder
    side_effects: []

  - method: GET
    path: "/reman/units/{id}/orders"
    description: "List orders for a unit"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "RemanOrder[]"
    side_effects: []

  - method: POST
    path: "/reman/orders/{orderId}/start-teardown"
    description: "Begin teardown"
    roles: [RemanEngineer]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → TEARDOWN"]

  - method: POST
    path: "/reman/orders/{id}/findings"
    description: "Append a teardown finding"
    roles: [RemanEngineer]
    code: 201
    input: [component_code, condition, severity, notes]
    output: TeardownFinding
    side_effects: []

  - method: GET
    path: "/reman/orders/{id}/findings"
    description: "List findings for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "TeardownFinding[]"
    side_effects: []

  - method: POST
    path: "/reman/orders/{id}/decisions"
    description: "Add a component decision (cut/regrind/replace/reuse). Posting a decision for a component_code that already has a PENDING decision supersedes the older one (per-component replacement)"
    roles: [RemanEngineer]
    code: 201
    input: [component_code, action, labor_hours, material_cents]
    output: ComponentDecision
    side_effects:
      - "approval_status=PENDING; line_total_cents computed per component_line_total"
      - "Any prior PENDING ComponentDecision on the same order with the same component_code → SUPERSEDED"
      - "Only allowed while order is in TEARDOWN or SCOPE_APPROVAL (ERR_INVALID_STATE otherwise); does NOT recompute approved_scope_cents (that happens on submit-scope/revise-scope)"

  - method: GET
    path: "/reman/orders/{id}/decisions"
    description: "List component decisions for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "ComponentDecision[]"
    side_effects: []

  - method: POST
    path: "/reman/orders/{orderId}/submit-scope"
    description: "Submit teardown scope for approval; auto-approves (TEARDOWN → APPROVED) when approved_scope_cents <= quoted_estimate_cents"
    roles: [RemanEngineer]
    code: 200
    input: []
    output: RemanOrder
    side_effects:
      - "status → SCOPE_APPROVAL, or APPROVED when scope within estimate"
      - "Recompute approved_scope_cents from PENDING decisions"
      - "On auto-approval: PENDING decisions → APPROVED; Customer.outstanding_approved_cents += approved_scope_cents; credit_hold recomputed"

  - method: POST
    path: "/reman/orders/{orderId}/revise-scope"
    description: "Revise the pending scope (revision loop within SCOPE_APPROVAL)"
    roles: [RemanEngineer]
    code: 200
    input: [expected_order_version]
    output: RemanOrder
    side_effects:
      - "Recompute approved_scope_cents from current PENDING decisions"
      - "Increments RemanOrder.version by 1"

  - method: POST
    path: "/reman/orders/{orderId}/approve-scope"
    description: "Customer approves the scope"
    roles: [Customer]
    code: 200
    input: []
    output: RemanOrder
    side_effects:
      - "status → APPROVED; PENDING decisions → APPROVED"
      - "Customer.outstanding_approved_cents += approved_scope_cents; recompute credit_hold"

  - method: POST
    path: "/reman/orders/{orderId}/start-build"
    description: "Begin build"
    roles: [RemanEngineer]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → IN_BUILD"]

  - method: POST
    path: "/reman/orders/{orderId}/start-assembly"
    description: "Begin assembly"
    roles: [RemanEngineer]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → ASSEMBLY"]

  - method: POST
    path: "/reman/orders/{id}/assembly-records"
    description: "Record clearance & backlash measurements"
    roles: [QualityInspector]
    code: 201
    input: [backlash_mm, radial_clearance_mm, axial_clearance_mm]
    output: AssemblyRecord
    side_effects: ["within_tolerance computed per assembly_tolerance; status=ACTIVE; recorded_by = X-User-ID"]

  - method: GET
    path: "/reman/orders/{id}/assembly-records"
    description: "List assembly records for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "AssemblyRecord[]"
    side_effects: []

  - method: POST
    path: "/reman/orders/{orderId}/submit-assembly"
    description: "Submit assembly for run-in"
    roles: [QualityInspector]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → RUN_IN"]

  - method: POST
    path: "/reman/orders/{id}/run-in-tests"
    description: "Record a run-in test with oil analysis"
    roles: [QualityInspector]
    code: 201
    input: [duration_minutes, max_temp_c, vibration_mm_s, oil_particle_count]
    output: RunInTest
    side_effects:
      - "result computed per run_in_result"
      - "PASS: status=RECORDED, oil_baseline_established=true, order → READY_TO_SHIP, final_invoice_cents computed"
      - "FAIL: status=SUPERSEDED, order → IN_BUILD, ACTIVE AssemblyRecord → INVALIDATED"

  - method: GET
    path: "/reman/orders/{id}/run-in-tests"
    description: "List run-in tests for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "RunInTest[]"
    side_effects: []

  - method: POST
    path: "/reman/orders/{orderId}/ship"
    description: "Mark order shipped (outbound freight must be booked and unit ready)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → SHIPPED; OUTBOUND shipment → IN_TRANSIT"]

  - method: POST
    path: "/reman/orders/{orderId}/complete"
    description: "Complete the order after outbound delivery"
    roles: [ServiceManager]
    code: 200
    input: []
    output: RemanOrder
    side_effects:
      - "status → COMPLETED"
      - "GearUnit.physical_status → IN_SERVICE"
      - "Customer.outstanding_approved_cents -= approved_scope_cents; recompute credit_hold"
      - "Store warranty clock basis (current cumulative_service_hours) for future claims"

  - method: POST
    path: "/reman/orders/{orderId}/cancel"
    description: "Cancel an order in INTAKE or SCOPE_APPROVAL"
    roles: [IntakeCoordinator, Customer]
    code: 200
    input: []
    output: RemanOrder
    side_effects: ["status → CANCELLED; PENDING decisions → SUPERSEDED; RESERVED loaner assignments → CANCELLED"]

  # --- LoanerUnit / LoanerAssignment ---
  - method: POST
    path: "/reman/loaner-units"
    description: "Register a loaner unit (serial_number unique across loaners)"
    roles: [ServiceManager]
    code: 201
    input: [serial_number, model]
    output: LoanerUnit
    side_effects: ["status=AVAILABLE", "duplicate serial_number → ERR_SERIAL_EXISTS"]

  - method: GET
    path: "/reman/loaner-units/{loanerId}"
    description: "Get a loaner unit"
    roles: [IntakeCoordinator, RemanEngineer, ServiceManager]
    code: 200
    input: []
    output: LoanerUnit
    side_effects: []

  - method: GET
    path: "/reman/loaner-units/{id}/assignments"
    description: "List assignments for a loaner"
    roles: [IntakeCoordinator, RemanEngineer, ServiceManager]
    code: 200
    input: []
    output: "LoanerAssignment[]"
    side_effects: []

  - method: POST
    path: "/reman/loaner-units/{id}/assignments"
    description: "Reserve a loaner window for an order (half-open [start_date, end_date); adjacency allowed, true overlap rejected)"
    roles: [IntakeCoordinator]
    code: 201
    input: [reman_order_id, start_date, end_date]
    output: LoanerAssignment
    side_effects:
      - "status=RESERVED"
      - "Reject when existing non-cancelled assignment a on same loaner has a.start_date < end_date and start_date < a.end_date (ERR_LOANER_OVERLAP)"

  - method: GET
    path: "/reman/loaner-assignments"
    description: "List loaner assignments, optionally filtered by order"
    roles: [IntakeCoordinator, RemanEngineer, ServiceManager]
    code: 200
    input: ["reman_order_id?"]
    output: "LoanerAssignment[]"
    side_effects: []

  - method: GET
    path: "/reman/loaner-assignments/{assignmentId}"
    description: "Get a loaner assignment"
    roles: [IntakeCoordinator, RemanEngineer, ServiceManager]
    code: 200
    input: []
    output: LoanerAssignment
    side_effects: []

  - method: POST
    path: "/reman/loaner-assignments/{assignmentId}/checkout"
    description: "Check out the loaner at window start"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: LoanerAssignment
    side_effects: ["status → CHECKED_OUT; LoanerUnit.status → CHECKED_OUT"]

  - method: POST
    path: "/reman/loaner-assignments/{assignmentId}/return"
    description: "Return the loaner (OCC-guarded)"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_assignment_version]
    output: LoanerAssignment
    side_effects:
      - "status → RETURNED; LoanerUnit.status → AVAILABLE"
      - "Increments LoanerAssignment.version by 1"

  - method: POST
    path: "/reman/loaner-assignments/{assignmentId}/extend"
    description: "Extend the end_date of a RESERVED or CHECKED_OUT assignment (re-validates overlap)"
    roles: [IntakeCoordinator]
    code: 200
    input: [new_end_date]
    output: LoanerAssignment
    side_effects: ["end_date = new_end_date after overlap re-check; increments version"]

  # --- FreightShipment ---
  - method: POST
    path: "/reman/orders/{id}/shipments"
    description: "Book freight + rigging bay for a heavy unit move"
    roles: [IntakeCoordinator]
    code: 201
    input: [direction, weight_kg, rigging_bay_date, rigging_bay_hours]
    output: FreightShipment
    side_effects:
      - "status=BOOKED; freight_charge_cents computed per freight_charge"
      - "Rigging bay conflict: reject when another non-cancelled shipment's bay occupancy [date, date+hours+RIGGING_BUFFER_HOURS) intersects this booking's occupancy (ERR_RIGGING_BAY_CONFLICT)"

  - method: GET
    path: "/reman/orders/{id}/shipments"
    description: "List shipments for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "FreightShipment[]"
    side_effects: []

  - method: GET
    path: "/reman/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager]
    code: 200
    input: []
    output: FreightShipment
    side_effects: []

  - method: POST
    path: "/reman/shipments/{shipmentId}/dispatch"
    description: "Dispatch a booked shipment"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: FreightShipment
    side_effects: ["status → IN_TRANSIT"]

  - method: POST
    path: "/reman/shipments/{shipmentId}/deliver"
    description: "Mark shipment delivered"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: FreightShipment
    side_effects: ["status → DELIVERED"]

  - method: POST
    path: "/reman/shipments/{shipmentId}/cancel"
    description: "Cancel a booked shipment"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: FreightShipment
    side_effects: ["status → CANCELLED"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/reman/orders/{id}/warranty-claims"
    description: "Open a warranty claim against an order (order need not be COMPLETED yet; eligibility resolves once it is)"
    roles: [Customer]
    code: 201
    input: [reported_hours, claim_reason]
    output: WarrantyClaim
    side_effects:
      - "status=OPEN"
      - "If order COMPLETED: warranty_clock_start_hours = order.completed_at_hours; eligibility computed per warranty_eligibility (calendar leg reads order.completed_at_utc)"
      - "reported_hours must be >= GearUnit.cumulative_service_hours (ERR_HOURS_REGRESSION)"

  - method: GET
    path: "/reman/orders/{id}/warranty-claims"
    description: "List warranty claims for an order"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/reman/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [IntakeCoordinator, RemanEngineer, QualityInspector, ServiceManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/reman/warranty-claims/{claimId}/review"
    description: "Move claim to review (requires oil baseline)"
    roles: [QualityInspector]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → UNDER_REVIEW; GearUnit.commercial_status → UNDER_WARRANTY_REVIEW"]

  - method: POST
    path: "/reman/warranty-claims/{claimId}/approve"
    description: "Approve a covered claim"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → APPROVED; GearUnit.commercial_status → WARRANTY_FLAGGED"]

  - method: POST
    path: "/reman/warranty-claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → DENIED; GearUnit.commercial_status → STANDARD"]

  # --- Test-driving clock (deterministic date-dependence) ---
  - method: POST
    path: "/reman/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Default at server startup is exactly 2026-08-01T00:00:00Z; an unset clock reads this default, never wall-clock time."
    roles: [ServiceManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Advances the logical clock used by date-window and warranty-calendar checks"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed (Customer acting on another customer's order)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (left-to-right path validation)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or malformed value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition exists (includes terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_UNIT_NOT_AT_SHOP, http: 409, condition: "GearUnit.physical_status != AT_SHOP for order creation or teardown start" }
  - { id: ERR_UNIT_BUSY, http: 409, condition: "Unit already has a non-terminal RemanOrder, or scrap requested with active order" }
  - { id: ERR_UNIT_FLAGGED, http: 409, condition: "Unit commercial_status == WARRANTY_FLAGGED blocks check-in" }
  - { id: ERR_SERIAL_EXISTS, http: 409, condition: "serial_number already registered (GearUnit or LoanerUnit)" }
  - { id: ERR_INTAKE_HOURS_MISMATCH, http: 422, condition: "intake_hours does not equal GearUnit.cumulative_service_hours at order creation" }
  - { id: ERR_NO_FINDINGS, http: 422, condition: "submit-scope with zero TeardownFindings" }
  - { id: ERR_DECISIONS_INCOMPLETE, http: 422, condition: "A finding lacks a PENDING ComponentDecision, or start-build with non-APPROVED decisions" }
  - { id: ERR_NO_ASSEMBLY_RECORD, http: 422, condition: "submit-assembly with no ACTIVE AssemblyRecord" }
  - { id: ERR_TOLERANCE_EXCEEDED, http: 422, condition: "Latest ACTIVE AssemblyRecord.within_tolerance == false" }
  - { id: ERR_ORDER_NOT_COMPLETED, http: 422, condition: "Warranty review against an order not yet COMPLETED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Approve attempted when eligibility != COVERED (hours or calendar basis)" }
  - { id: ERR_HOURS_REGRESSION, http: 422, condition: "reported_hours below the unit's current cumulative_service_hours" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Scope approval would push outstanding_approved_cents above credit_limit_cents, or customer on credit_hold" }
  - { id: ERR_LOANER_OVERLAP, http: 409, condition: "Requested assignment window overlaps an existing non-cancelled assignment on the same loaner (half-open adjacency allowed)" }
  - { id: ERR_LOANER_UNAVAILABLE, http: 409, condition: "Checkout when LoanerUnit.status != AVAILABLE" }
  - { id: ERR_LOANER_WINDOW_FUTURE, http: 422, condition: "Checkout before start_date" }
  - { id: ERR_LOANER_OUTSTANDING, http: 409, condition: "Ship order while a CHECKED_OUT assignment for it is unreturned" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "end_date <= start_date on a loaner assignment" }
  - { id: ERR_RIGGING_BAY_CONFLICT, http: 409, condition: "Rigging bay occupancy intervals (including RIGGING_BUFFER_HOURS tail) intersect across non-cancelled shipments" }
  - { id: ERR_FREIGHT_NOT_READY, http: 409, condition: "ship without DELIVERED outbound shipment, or complete before delivery" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-desk service advisor: registers customers/units, opens orders, books freight and loaners, records service hours"
    identity: opaque
    exclusive_operations:
      - "POST /reman/customers"
      - "POST /reman/customers/{customerId}/units"
      - "POST /reman/units/{unitId}/record-service-hours"
      - "POST /reman/units/{unitId}/check-in"
      - "POST /reman/units/{unitId}/orders"
      - "POST /reman/loaner-units/{loanerId}/assignments"
      - "POST /reman/loaner-assignments/{assignmentId}/checkout"
      - "POST /reman/loaner-assignments/{assignmentId}/return"
      - "POST /reman/loaner-assignments/{assignmentId}/extend"
      - "POST /reman/orders/{orderId}/shipments"
      - "POST /reman/shipments/{shipmentId}/dispatch"
      - "POST /reman/shipments/{shipmentId}/deliver"
      - "POST /reman/shipments/{shipmentId}/cancel"
    shared_operations:
      - "GET reads across all resources"
      - "POST /reman/orders/{orderId}/cancel (from INTAKE)"

  - name: RemanEngineer
    description: "Shop engineer: runs teardown, logs findings, decides cut/regrind/replace, submits and revises scope, drives build"
    identity: opaque
    exclusive_operations:
      - "POST /reman/orders/{orderId}/start-teardown"
      - "POST /reman/orders/{orderId}/findings"
      - "POST /reman/orders/{orderId}/decisions"
      - "POST /reman/orders/{orderId}/submit-scope"
      - "POST /reman/orders/{orderId}/revise-scope"
      - "POST /reman/orders/{orderId}/start-build"
      - "POST /reman/orders/{orderId}/start-assembly"
    shared_operations:
      - "GET reads across all resources"

  - name: QualityInspector
    description: "Quality authority: records assembly measurements and run-in tests, reviews warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /reman/orders/{orderId}/assembly-records"
      - "POST /reman/orders/{orderId}/submit-assembly"
      - "POST /reman/orders/{orderId}/run-in-tests"
      - "POST /reman/warranty-claims/{claimId}/review"
    shared_operations:
      - "GET reads across all resources"

  - name: ServiceManager
    description: "Service manager: ships and completes orders, manages loaner fleet, approves/denies warranty claims, scraps units, controls the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /reman/orders/{orderId}/ship"
      - "POST /reman/orders/{orderId}/complete"
      - "POST /reman/units/{unitId}/scrap"
      - "POST /reman/loaner-units"
      - "POST /reman/warranty-claims/{claimId}/approve"
      - "POST /reman/warranty-claims/{claimId}/deny"
      - "POST /reman/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"

  - name: Customer
    description: "Entity-backed customer: approves or rejects scope changes and files warranty claims on own units"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /reman/orders/{orderId}/approve-scope"
      - "POST /reman/orders/{orderId}/warranty-claims"
    shared_operations:
      - "GET reads restricted to own customer record and its units/orders"
      - "POST /reman/orders/{orderId}/cancel (from SCOPE_APPROVAL, own orders only)"
