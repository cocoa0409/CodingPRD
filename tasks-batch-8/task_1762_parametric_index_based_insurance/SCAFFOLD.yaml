    side_effects: []

  - method: POST
    path: "/programs/{programId}/claims/{claimId}/disputes/{disputeId}/request-info"
    description: "Adjuster requests more info (OPEN -> AWAITING_CUSTOMER)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["status -> AWAITING_CUSTOMER"]

  - method: POST
    path: "/programs/{programId}/claims/{claimId}/disputes/{disputeId}/submit-info"
    description: "Customer submits info (AWAITING_CUSTOMER -> OPEN)"
    roles: [ServicingAgent]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/programs/{programId}/claims/{claimId}/disputes/{disputeId}/resolve"
    description: "Resolve dispute; signed adjustment applies to claim and program aggregates"
    roles: [ClaimsAdjuster]
    code: 200
    input: [resolution]
    output: DisputeCase
    side_effects: ["status -> RESOLVED; adjustment_delta_cents computed; claim.final_payout_cents and program.incurred_claims_cents adjusted; DENIED + DATA_SOURCE_ERROR -> fraud_score += 10"]

  - method: POST
    path: "/programs/{programId}/claims/{claimId}/disputes/{disputeId}/withdraw"
    description: "Withdraw dispute"
    roles: [ServicingAgent]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["status -> WITHDRAWN"]

  - method: GET
    path: "/programs/disputes"
    description: "Filtered list of disputes across claims (reverse reachability for claim_id FK)"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: "DisputeCase[]"
    side_effects: []

  - method: GET
    path: "/programs/disputes/{disputeId}"
    description: "Get one dispute by id (flat)"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []

  # --- ReinsuranceTreaty ---
  - method: POST
    path: "/programs/{programId}/treaties"
    description: "Create a quota-share treaty proposal"
    roles: [ProgramManager]
    code: 201
    input: [treaty_name, ceded_percentage, attachment_point_cents, treaty_limit_cents]
    output: ReinsuranceTreaty
    side_effects: ["status = PROPOSED"]

  - method: GET
    path: "/programs/{programId}/treaties"
    description: "List treaties"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "ReinsuranceTreaty[]"
    side_effects: []

  - method: GET
    path: "/programs/{programId}/treaties/{treatyId}"
    description: "Get one treaty"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: []

  - method: POST
    path: "/programs/{programId}/treaties/{treatyId}/bind-treaty"
    description: "Bind treaty (OCC on expected_program_version)"
    roles: [ProgramManager]
    code: 200
    input: [expected_program_version]
    output: ReinsuranceTreaty
    side_effects: ["status -> ACTIVE; increments InsuranceProgram.version by 1; net_retained_exposure recomputed"]

  - method: GET
    path: "/programs/treaties"
    description: "Filtered list of treaties across programs (reverse reachability for program_id FK)"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "ReinsuranceTreaty[]"
    side_effects: []

  - method: GET
    path: "/programs/treaties/{treatyId}"
    description: "Get one treaty by id (flat)"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: []

  # --- Computed reporting read ---
  - method: GET
    path: "/programs/{programId}/financial-summary"
    description: "Computed read: program P&L snapshot (gross written premium, incurred claims, ceded recovery, net exposure, fraud alerts, epoch)"
    roles: [ProgramManager, Actuary, Underwriter, ClaimsAdjuster, TreasuryOfficer, FraudAnalyst, DataOperations, ServicingAgent]
    code: 200
    input: []
    output: InsuranceProgram
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, or invalid enum value" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id does not exist" }
  - { id: ERR_INDEX_NOT_FOUND, http: 404, condition: "Index definition id does not exist within the program" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "Station id does not exist within the program" }
  - { id: ERR_HOLDER_NOT_FOUND, http: 404, condition: "Policyholder id does not exist within the program" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Policy id does not exist within the policyholder" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist within the program" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Trigger event id does not exist within the index" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist within the program" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist within the claim" }
  - { id: ERR_TREATY_NOT_FOUND, http: 404, condition: "Treaty id does not exist within the program" }
  - { id: ERR_OBSERVATION_NOT_FOUND, http: 404, condition: "supersedes_observation_id does not reference an existing observation" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires program status ACTIVE" }
  - { id: ERR_PROGRAM_NOT_SUSPENDED, http: 409, condition: "Resume requires program status SUSPENDED" }
  - { id: ERR_PROGRAM_NO_ACTIVE_INDEX, http: 409, condition: "Program activation requires at least one ACTIVE index definition" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Program close blocked by open claims or disputes" }
  - { id: ERR_INDEX_NOT_PENDING, http: 409, condition: "Index activation requires PENDING_AGREEMENT" }
  - { id: ERR_INDEX_NOT_ACTIVE, http: 409, condition: "Operation requires index status ACTIVE" }
  - { id: ERR_INDEX_NOT_SUSPENDED, http: 409, condition: "Index resume requires SUSPENDED" }
  - { id: ERR_INDEX_IN_USE, http: 409, condition: "Index decommission blocked by BOUND policies or open trigger events" }
  - { id: ERR_NO_COMMISSIONED_STATION, http: 409, condition: "Index activation requires at least one COMMISSIONED station in the program" }
  - { id: ERR_STATION_NOT_COMMISSIONED, http: 409, condition: "Operation requires station COMMISSIONED" }
  - { id: ERR_STATION_NOT_OFFLINE, http: 409, condition: "Operation requires station OFFLINE" }
  - { id: ERR_STATION_OFFLINE, http: 409, condition: "Observation rejected: station is OFFLINE or DECOMMISSIONED" }
  - { id: ERR_INDEX_SUSPENDED, http: 409, condition: "Observation rejected: index is SUSPENDED or DECOMMISSIONED" }
  - { id: ERR_DUPLICATE_OBSERVATION, http: 409, condition: "Observation for (station_id, window_end_date) already exists and supersedes_observation_id not provided" }
  - { id: ERR_SUPERSESSION_CHAIN_BROKEN, http: 409, condition: "supersedes_observation_id does not point at the currently-effective observation for (station_id, window_end_date)" }
  - { id: ERR_BASIS_RISK_NOT_ACKNOWLEDGED, http: 409, condition: "Policyholder activation requires basis-risk disclosure acknowledgment" }
  - { id: ERR_HOLDER_NOT_ACTIVE, http: 409, condition: "Operation requires policyholder ACTIVE (or PROSPECT for blacklist)" }
  - { id: ERR_HOLDER_NOT_ACTIVE_FOR_BIND, http: 409, condition: "Policy bind requires policyholder status ACTIVE" }
  - { id: ERR_HOLDER_BLACKLISTED, http: 403, condition: "Claim approval blocked: policyholder is BLACKLISTED" }
  - { id: ERR_POLICY_NOT_QUOTED, http: 409, condition: "Bind requires lifecycle_status QUOTED" }
  - { id: ERR_POLICY_NOT_BOUND, http: 409, condition: "Operation requires lifecycle_status BOUND" }
  - { id: ERR_POLICY_HAS_CLAIMS, http: 409, condition: "Cancel blocked: policy has claims in non-terminal states or PAID" }
  - { id: ERR_POLICY_PAYMENT_IN_FLIGHT, http: 409, condition: "Cancel blocked: settlement_posture PAYMENT_PENDING" }
  - { id: ERR_PREMIUM_NOT_PAID, http: 402, condition: "Bind requires the policy's PremiumInvoice to be PAID" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Payment requires invoice ISSUED or PARTIALLY_PAID" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would exceed invoice_amount_cents" }
  - { id: ERR_EXPOSURE_LIMIT_EXCEEDED, http: 402, condition: "Binding would push net_retained_exposure_cents above exposure_limit_cents" }
  - { id: ERR_EVENT_NOT_DETECTED, http: 409, condition: "Open-review requires event DETECTED" }
  - { id: ERR_EVENT_NOT_UNDER_REVIEW, http: 409, condition: "Verify/reject requires event UNDER_REVIEW" }
  - { id: ERR_EVENT_NOT_VERIFIED, http: 409, condition: "Claim operation requires trigger event VERIFIED" }
  - { id: ERR_EVENT_NO_LONGER_BREACHING, http: 409, condition: "Recomputed blend no longer breaches any tier (late revision or empty effective set)" }
  - { id: ERR_WINDOW_OUT_OF_COVERAGE, http: 422, condition: "Observation window in the future, or claim generation window outside policy coverage" }
  - { id: ERR_CLAIM_NOT_ADJUSTABLE, http: 409, condition: "Adjust/decline requires claim GENERATED or ADJUSTED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Release-payment requires claim APPROVED" }
  - { id: ERR_CLAIM_NOT_IN_FRAUD_HOLD, http: 409, condition: "Clear-fraud-hold requires claim FRAUD_HOLD" }
  - { id: ERR_CLAIM_NOT_SETTLED, http: 409, condition: "Dispute open requires claim PAID, RECOVERY_CEDED, or DECLINED" }
  - { id: ERR_TIER_EXCEEDS_BREACH, http: 422, condition: "Claimed tier above event max_tier_breached, below 1, or equal to current tier_applied" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: payment releaser must differ from approving adjuster" }
  - { id: ERR_DISPUTE_NOT_OPEN, http: 409, condition: "Operation requires dispute OPEN or AWAITING_CUSTOMER" }
  - { id: ERR_DISPUTE_NOT_AWAITING, http: 409, condition: "Submit-info requires dispute AWAITING_CUSTOMER" }
  - { id: ERR_TREATY_NOT_PROPOSED, http: 409, condition: "Bind-treaty requires treaty PROPOSED" }
  - { id: ERR_TREATY_CAPACITY_INVALID, http: 422, condition: "ceded_percentage outside (0,100] or limits invalid" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_program_version does not match current program.version" }
  - { id: ERR_CROSS_REFERENCE_INVALID, http: 422, condition: "Referenced entity belongs to a different program/holder (cross-aggregate integrity)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for transitions" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Owns program lifecycle, treaties, reporting epochs, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/activate | suspend | resume | close | advance-reporting-epoch"
      - "POST /programs/{id}/treaties and .../bind-treaty"
      - "POST /programs/{id}/index-definitions/{id}/suspend | resume"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Actuary
    description: "Defines indexes, pricing parameters, regulatory classification inputs; activates/decommissions indexes"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/index-definitions"
      - "POST /programs/{id}/index-definitions/{id}/activate | decommission"
    shared_operations:
      - "All GET endpoints"

  - name: Underwriter
    description: "Quotes and binds policies"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/policyholders/{id}/policies"
      - "POST .../policies/{id}/bind | cancel"
    shared_operations:
      - "All GET endpoints"

  - name: ClaimsAdjuster
    description: "Verifies trigger events, adjusts/approves/declines claims, adjudicates disputes"
    identity: opaque
    exclusive_operations:
      - "POST .../trigger-events/{id}/open-review | verify | reject"
      - "POST /programs/{id}/claims/{id}/adjust | approve | decline"
      - "POST .../disputes/{id}/request-info | resolve"
    shared_operations:
      - "All GET endpoints"

  - name: TreasuryOfficer
    description: "Releases claim payments (segregated from approval)"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/claims/{id}/release-payment"
    shared_operations:
      - "All GET endpoints"

  - name: FraudAnalyst
    description: "Manages fraud signals, blacklists, clears fraud holds"
    identity: opaque
    exclusive_operations:
      - "POST .../policyholders/{id}/blacklist | flag-fraud"
      - "POST /programs/{id}/claims/{id}/clear-fraud-hold"
    shared_operations:
      - "All GET endpoints"

  - name: DataOperations
    description: "Operates measurement stations and ingests index observations"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/stations and station lifecycle actions"
      - "POST /programs/{id}/index-definitions/{id}/observations"
    shared_operations:
      - "All GET endpoints"

  - name: ServicingAgent
    description: "Services policyholders: registration, disclosure acknowledgment, premium collection, dispute intake"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /programs/{id}/policyholders"
      - "POST /programs/{id}/invoices/{id}/payments"
      - "POST .../claims/{id}/disputes and .../submit-info | withdraw"
    shared_operations:
      - "All GET endpoints"
