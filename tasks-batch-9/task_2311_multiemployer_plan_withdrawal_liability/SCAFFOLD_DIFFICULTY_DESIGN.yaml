            - call: "POST /plans"
              payload: { name: "Lakefront Hospitality Pension Plan", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
