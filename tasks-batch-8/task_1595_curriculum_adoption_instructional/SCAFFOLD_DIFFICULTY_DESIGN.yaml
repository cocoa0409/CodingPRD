  - rule_id: combinatorial_formula
    instances:
      - name: quote_line_rounding_order
        grounds:
          - calculations.bundled_pricing_total
        distinguishing_aspect: |
          Mode (b) nested rounding: the formula pins round-per-line-then-sum, so a quote with
          print 10.125 x 1 and digital 10.125 x 1 evaluates to 20.26 (10.13 + 10.13); the
          alternative sum-then-round order would produce 20.25. Distinct mode from
          best_value_zero_min_pool (mode a) and forecast_contingency_tier_order (mode c).
        test_recipe:
          setup:
            - "Cycle in PILOT_OPEN with a VETTED material (coverage gate passed with 1 FULL mapping of 1 required standard)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
