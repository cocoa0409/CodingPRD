            - "trigger step 2 shows $.data.status == 'DRAFT', $.data.published_at == null, $.data.version == 1"
            - "$.data.is_guidance == true (the flag is derived from type and metric even while the row cannot be published)"

      - name: disclosure_publish_twice_rejected
