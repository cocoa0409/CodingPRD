# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Meat & Protein Wholesale Trading (protein trading desk)
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_supplier_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Supplier.fields.contact_email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required contact_email is rejected with ERR_INVALID_REQUEST (400); the full-field create succeeds and defaults status to ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/suppliers", payload: { name: "NoContact", establishment_number: "EST-NC" }, as: DeskAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/suppliers", payload: { name: "Full", establishment_number: "EST-FULL", contact_email: "ops@full.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id", sup_status: "$.data.status" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"
            - "Second call: 201, Supplier.${sup_id}.status == ACTIVE (system default), version == 1"

      - name: warehouse_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Warehouse.fields.occupied_lbs]
        distinguishing_aspect: "Client-supplied occupied_lbs (a computed field) is ignored: the created warehouse reports occupied_lbs == 0 and version == 1 with system-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/warehouses", payload: { name: "WH-X", zone: "FROZEN", capacity_lbs: 5000, occupied_lbs: 555 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
          assert:
            - "Warehouse.${wh_id}.occupied_lbs == 0 (client input 555 ignored)"
            - "Warehouse.${wh_id} exposes system id, created_at, updated_at and version == 1"

      - name: product_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Product]
        distinguishing_aspect: "Product has common_fields false: its GET response carries id and created_at but NO version or updated_at, and no PUT/PATCH/DELETE product endpoint exists."
        test_recipe:
          setup: ["One product exists"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-IM", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/products/${prod_id}", payload: {}, as: DeskAdmin }
          assert:
            - "Response data has id and created_at but no version key and no updated_at key"

      - name: product_invalid_kind_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Product.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "kind outside {CARCASS, PRIMAL, SUBPRIMAL} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { product_code: "BAD-1", kind: "PRIME", species: "BEEF", shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"

      - name: suppliers_list_pagination_and_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /api/suppliers honors limit/offset with envelope pagination fields: total_count reflects all rows, has_more flips correctly, meta carries api_request_id."
        test_recipe:
          setup: ["Three suppliers exist"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { name: "S1", establishment_number: "EST-P1", contact_email: "a@x.example" }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "S2", establishment_number: "EST-P2", contact_email: "b@x.example" }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "S3", establishment_number: "EST-P3", contact_email: "c@x.example" }, as: DeskAdmin }
          trigger:
            - { call: "GET /api/suppliers?limit=2&offset=0", payload: {}, as: DeskAdmin, captures: { page1: "$.data" } }
            - { call: "GET /api/suppliers?limit=2&offset=2", payload: {}, as: DeskAdmin }
          assert:
            - "Page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "Page 2: data length == 1, has_more == false"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: lots_reverse_reachable_from_po
        claim_type: parent_relationships
        grounds: [entities.InventoryLot.fields.po_id]
        distinguishing_aspect: "FK reverse-reachability: GET /api/inventory-lots?po_id=<id> returns a 0/1-length array; after receiving it contains exactly the created lot with po_id set."
        test_recipe:
          setup:
            - "PO-100 for 800 lbs RIBEYE-RR BOOKED; supplier ACTIVE; warehouse exists; clock at 2026-08-03"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-RR", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-RR", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-100", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 800, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 800, warehouse_id: "${wh_id}", lot_code: "LOT-RR", production_date: "2026-08-01" }, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
          assert:
            - "Array length == 1 and InventoryLot.${lot_id}.po_id == ${po_id}"
            - "InventoryLot.${lot_id}.status == IN_INSPECTION and current_weight_lbs == 800"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.PurchaseOrder, state_machines.PriceSheet, state_machines.ForwardContract, state_machines.Allocation]
        distinguishing_aspect: "New entities start in their declared initial states: PO BOOKED, PriceSheet DRAFT, ForwardContract OPEN, Allocation REQUESTED."
        test_recipe:
          setup: ["Supplier, customer, product, and a PUBLISHED sheet with a line exist"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-IS", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-IS", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer IS", customer_code: "CUST-IS", credit_limit_cents: 100000000, allocation_tier: "TIER_2" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id", s1_status: "$.data.status" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-IS", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_status: "$.data.status" } }
            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-IS", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 100, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-08-03" }, as: Trader, captures: { fc_status: "$.data.status" } }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 50 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { al_status: "$.data.status" } }
          assert:
            - "${s1_status} == DRAFT (initial before publish)"
            - "${po_status} == BOOKED; ${fc_status} == OPEN; ${al_status} == REQUESTED"

      - name: cancel_po_twice_returns_po_not_booked
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseOrder.BOOKED_to_CANCELLED, "errors[ERR_PO_NOT_BOOKED]"]
        distinguishing_aspect: "Idempotency guard: the second cancel hits the from-state precondition and fails with ERR_PO_NOT_BOOKED; no side effects fire twice."
        test_recipe:
          setup: ["PO-C2 BOOKED (supplier ACTIVE, product exists)"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-C2", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-C2", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-C2", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: Trader }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PO_NOT_BOOKED (http 409); PurchaseOrder.${po_id}.status stays CANCELLED"

      - name: terminal_lockdown_delivered_shipment
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Shipment, "errors[ERR_SHIPMENT_NOT_STAGING]", "errors[ERR_SHIPMENT_NOT_IN_TRANSIT]"]
        distinguishing_aspect: "From terminal DELIVERED, every action endpoint fails: depart -> ERR_SHIPMENT_NOT_STAGING, deliver -> ERR_SHIPMENT_NOT_IN_TRANSIT, reject -> ERR_SHIPMENT_NOT_IN_TRANSIT."
        test_recipe:
          setup: ["Full pipeline: 100 lbs RIBEYE-TL DELIVERED shipment"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-TL", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-TL", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer TL", customer_code: "CUST-TL", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-TL", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-TL", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 100 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-03T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator, captures: { err1: "$.data.error_id" } }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}", captures: { err2: "$.data.error_id" } }
            - { call: "POST /api/shipments/${ship_id}/reject", payload: { rejection_reason: "late" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err3: "$.data.error_id" } }
          assert:
            - "${err1} == ERR_SHIPMENT_NOT_STAGING; ${err2} == ERR_SHIPMENT_NOT_IN_TRANSIT; ${err3} == ERR_SHIPMENT_NOT_IN_TRANSIT"
            - "Shipment.${ship_id}.status stays DELIVERED"

      - name: inspect_requires_in_inspection
        claim_type: precondition_enforcement
        grounds: [state_machines.InventoryLot.IN_INSPECTION_to_AVAILABLE, "errors[ERR_LOT_NOT_IN_INSPECTION]"]
        distinguishing_aspect: "Inspecting an already-AVAILABLE lot fails with ERR_LOT_NOT_IN_INSPECTION (the from-state is enforced, not silently re-applied)."
        test_recipe:
          setup: ["LOT-II AVAILABLE (received 2026-08-01, inspected fat 10.0)"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-II", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-II", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-II", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 100, warehouse_id: "${wh_id}", lot_code: "LOT-II", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
          trigger:
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 11.0 }, as: QualityGrader, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_LOT_NOT_IN_INSPECTION (http 409); measured_fat_pct stays 10.0"

      - name: auto_expiry_at_shelf_life_boundary
        claim_type: valid_transition
        grounds: [state_machines.InventoryLot.AVAILABLE_to_EXPIRED, "errors[ERR_LOT_EXPIRED]"]
        distinguishing_aspect: "Clock sweep auto-expires only when age_days > shelf_life_days: at age 21 (== shelf) the lot stays AVAILABLE; at age 22 it flips to EXPIRED."
        test_recipe:
          setup: ["LOT-EX AVAILABLE, product shelf_life_days 21, production_date 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-EX", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-EX", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-EX", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 100, warehouse_id: "${wh_id}", lot_code: "LOT-EX", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: DeskAdmin, captures: { sweep1: "$.data.expired_lot_ids" } }
            - { call: "GET /api/inventory-lots/${lot_id}", payload: {}, as: DeskAdmin, captures: { st21: "$.data.status" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-23T00:00:00Z" }, as: DeskAdmin, captures: { sweep2: "$.data.expired_lot_ids" } }
          assert:
            - "At age 21 (2026-08-22): ${st21} == AVAILABLE and ${sweep1} does not contain ${lot_id}"
            - "At age 22 (2026-08-23): InventoryLot.${lot_id}.status == EXPIRED and ${sweep2} contains ${lot_id}"

      - name: contract_default_on_clock_and_amend_rejected
        claim_type: valid_transition
        grounds: [state_machines.ForwardContract.OPEN_to_DEFAULTED, "errors[ERR_CONTRACT_NOT_OPEN]"]
        distinguishing_aspect: "OPEN contract whose delivery week has fully elapsed auto-defaults on the clock sweep; any later amend fails with ERR_CONTRACT_NOT_OPEN."
        test_recipe:
          setup: ["Customer, product; FC-DEF OPEN with delivery_week_start 2026-08-03, committed 100, delivered 0"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-DF", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer DF", customer_code: "CUST-DF", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-DEF", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 100, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-08-03" }, as: Trader, captures: { fc_id: "$.data.id", fc_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: DeskAdmin, captures: { sweep: "$.data.defaulted_contract_ids" } }
            - { call: "POST /api/forward-contracts/${fc_id}/amend", payload: { committed_lbs: 200, fixed_price_per_lb_cents: 660, delivery_week_start: "2026-08-17", expected_contract_version: "${fc_v}" }, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "${sweep} contains ${fc_id}; ForwardContract.${fc_id}.status == DEFAULTED"
            - "Amend on DEFAULTED: ${err} == ERR_CONTRACT_NOT_OPEN (http 409)"

      - name: receive_side_effect_creates_lot_and_occupancy
        claim_type: side_effect_execution
        grounds: [state_machines.PurchaseOrder.BOOKED_to_RECEIVED, calculations.warehouse_occupancy]
        distinguishing_aspect: "Receiving creates exactly one IN_INSPECTION lot with the payload weight and moves warehouse occupied_lbs from 0 to 800 atomically."
        test_recipe:
          setup: ["PO-SE BOOKED 800 lbs; WH-SE empty (occupied 0)"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-SE", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-SE", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
