            - "SubsidyReport.${rep_id}.subsidy_per_trip_cents == -325"
            - "SubsidyReport.${rep_id}.amendment_count == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_half_open_adjacency_allowed_one_minute_overlap_rejected
        grounds:
          - validations.priority_32.ERR_VEHICLE_BLOCK_OVERLAP
          - entities.VehicleBlock.fields.start_utc
          - entities.VehicleBlock.fields.end_utc
        distinguishing_aspect: |
          Pins the HALF-OPEN convention on the vehicle axis with three probes against the same
          06:00-10:00 block: exact adjacency at 10:00 must be ACCEPTED (no buffer on this axis), a
          one-minute overlap [09:59, 10:00) must be REJECTED, and a window fully inside the original
          span must be ACCEPTED once the original block is CANCELLED, proving the occupation filter is
          state IN {SCHEDULED, OPEN} rather than "any row". Every candidate block uses a DIFFERENT
          driver, so the buffered driver rule at priority 34 can never be the one answering.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; a single vehicle V1; four distinct drivers D1, D2, D3 and D4 so the driver rest buffer is never in play."
            - "Block B1 (V1/D1) is created for [06:00, 10:00) and left SCHEDULED."
            - "No DemandForecast exists, so nothing is opened and priority 56 never applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D2", wav_certified: true }
              as: ZoneAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D3", wav_certified: true }
              as: ZoneAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D4", wav_certified: true }
              as: ZoneAdmin
              captures: { d4_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d2_id}", block_type: "BASE", start_utc: "2026-08-03T10:00:00Z", end_utc: "2026-08-03T12:00:00Z" }
              as: Dispatcher
              captures: { b2_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d3_id}", block_type: "BASE", start_utc: "2026-08-03T09:59:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/cancel"
              payload: { note: "reassigning the morning run" }
              as: Dispatcher
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d4_id}", block_type: "BASE", start_utc: "2026-08-03T07:00:00Z", end_utc: "2026-08-03T09:00:00Z" }
              as: Dispatcher
              captures: { b4_id: $.data.id }
          assert:
            - "the adjacent block [10:00, 12:00) returns HTTP 201; VehicleBlock.${b2_id}.state == SCHEDULED"
            - "the one-minute overlap [09:59, 10:00) returns HTTP 409 with error_id == ERR_VEHICLE_BLOCK_OVERLAP"
            - "VehicleBlock.${b1_id}.state == CANCELLED after the cancel"
            - "the block [07:00, 09:00) nested inside the cancelled span returns HTTP 201; VehicleBlock.${b4_id}.state == SCHEDULED"
            - "VehicleBlock.${b2_id}.scheduled_revenue_hours == 2.00 and VehicleBlock.${b4_id}.scheduled_revenue_hours == 2.00"
            - "GET /vehicle-blocks?vehicle_id=${v1_id} returns total_count == 3 (the rejected candidate was never persisted)"
            - "GET /vehicle-blocks?vehicle_id=${v1_id}&state=SCHEDULED returns total_count == 2"
            - "GET /vehicle-blocks?driver_id=${d3_id} returns total_count == 0"

      - name: driver_rest_buffer_rejects_adjacency_and_allows_exactly_thirty_minutes
        grounds:
          - validations.priority_34.ERR_DRIVER_REST_BUFFER
          - calculations.constants.DRIVER_REST_BUFFER_MINUTES
        distinguishing_aspect: |
          The same clock geometry that the vehicle axis ACCEPTS the driver axis must REJECT, because
          this rule inflates both endpoints by DRIVER_REST_BUFFER_MINUTES (30) and compares closed:
          [10:00, 12:00) adjacent to [06:00, 10:00) is rejected, a gap of exactly 30 minutes
          ([10:30, 12:30)) is accepted, and a gap of 29 minutes ([10:29, 10:30)) is rejected again.
          Every candidate uses a DIFFERENT vehicle, so the half-open vehicle rule at priority 32
          (which would answer first) is structurally excluded and only the buffered comparison can
          produce the observed errors.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; a single driver D1; four distinct vehicles V1, V2, V3 and V4 so the vehicle-occupation rule can never fire."
            - "Block B1 (V1/D1) is created for [06:00, 10:00) and left SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V2", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V3", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v3_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V4", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v4_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v2_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T10:00:00Z", end_utc: "2026-08-03T12:00:00Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v3_id}", driver_id: "${d1_id}", block_type: "SURGE", start_utc: "2026-08-03T10:30:00Z", end_utc: "2026-08-03T12:30:00Z" }
              as: Dispatcher
