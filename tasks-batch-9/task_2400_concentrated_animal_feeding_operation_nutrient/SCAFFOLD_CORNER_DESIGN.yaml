              payload: {}
              as: Hauler
              as_user_id: "${h1_id}"
              captures: { ack_status: $.data.transfer_status }
          assert:
            - "${e_noauth} == ERR_UNAUTHENTICATED with status 401 when neither X-User-Role nor X-User-ID is sent, even though the resource exists and Operator may read it"
            - "${e_badrole} == ERR_UNAUTHENTICATED with status 401, not ERR_UNAUTHORIZED, because an undeclared role value fails priority 1 before priority 2 can compare it against the endpoint's role list"
            - "${e_role} == ERR_UNAUTHORIZED with status 403, since POST /cafo/operations is a ComplianceAdmin exclusive operation"
            - "${e_list} == ERR_UNAUTHORIZED with status 403 for GET /cafo/operations, even though the same planner may call GET /cafo/operations/{id}"
            - "${e_own_op} == ERR_OWNERSHIP_VIOLATION with status 403, and Operation.${op_b}.head_count is still 400, animal_units is still 160.00 (400 head x the SWINE_FINISHING factor 0.4) and version is unchanged from the value returned at creation"
            - "${e_own_hauler} == ERR_OWNERSHIP_VIOLATION with status 403, not ERR_HAULER_LICENSE_LAPSED or any transfer-state error, and ManureTransfer.${tr_id}.transfer_status is still INITIATED with recipient_ack_signed_at null"
            - "the final acknowledge returns 200 with ${ack_status} == ACKNOWLEDGED and recipient_ack_signed_at == 2026-08-01T00:00:00Z"
            - "ManureStorage.${st_id}.committed_outflow_gallons == 0.00, cumulative_outflow_gallons == 200000.00 and current_volume_gallons == 800000.00, so only the owning hauler could release the commitment"
      - name: each_role_exercises_its_own_exclusive_operations_end_to_end
        claim_type: exclusive_operations
        grounds:
          - roles.Operator.exclusive_operations
          - roles.CertifiedPlanner.exclusive_operations
          - roles.StateReviewer.exclusive_operations
          - roles.Hauler.exclusive_operations
          - roles.ComplianceAdmin.exclusive_operations
