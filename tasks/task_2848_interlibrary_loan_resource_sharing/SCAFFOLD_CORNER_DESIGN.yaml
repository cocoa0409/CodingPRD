              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { r3: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-25T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { r4: $.data.id }
            - call: "POST /ill/requests"
