  - section: consistency_model
    instances:
      - name: completion_certificate_visible_same_session
        claim_type: immediate
        grounds: [state_machines.Enrollment.ACTIVE_to_COMPLETED, entities.Certificate]
        distinguishing_aspect: "Immediate consistency: the auto-issued Certificate is retrievable via GET /enrollments/{id}/certificate right after the completing lesson-completion call."
        test_recipe:
          setup: ["PUBLISHED single-lesson non-graded course, threshold 1.00; ACTIVE enrollment."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I34", email: "i34@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln34", email: "ln34@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Cert", list_price_cents: 0, ceu_credits: 1.5, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${lesson_id}" }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/certificate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
              captures: { ceu: "$.data[0].ceu_credits" }
          assert:
            - "the certificate array has length 1 with ceu_credits == 1.5"
            - "Enrollment.${enr_id}.status == COMPLETED and ceu_awarded == 1.5"
