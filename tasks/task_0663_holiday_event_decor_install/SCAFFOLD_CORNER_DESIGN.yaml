scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Client.fields.legal_name, entities.Client.fields.status]
        distinguishing_aspect: "POST /clients with all required fields → 201; status defaults ACTIVE, id/created_at/version system-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Tango Co", account_type: "COMMERCIAL", contact_email: "t@tango.test", site_address: "21 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
          assert:
            - "response status == 201"
            - "Client.${client_id}.status == ACTIVE"
            - "Client.${client_id}.version == 1"

      - name: get_contract_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Contract.fields.status]
        distinguishing_aspect: "GET /contracts/{random-uuid} → ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_contract_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Contract.fields.contract_type, "validations[priority=6]"]
        distinguishing_aspect: "POST /clients/{id}/contracts omitting contract_type → ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["a Client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Uniform Co", account_type: "COMMERCIAL", contact_email: "u@uni.test", site_address: "22 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/contracts"
              payload: { season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_contract_default_surcharge_zero_applied
        claim_type: Defaults
        grounds: [entities.Contract.fields.custom_design_surcharge_cents]
        distinguishing_aspect: "Omitting custom_design_surcharge_cents on contract create → default 0."
        test_recipe:
          setup: ["a Client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Victor Co", account_type: "COMMERCIAL", contact_email: "v@victor.test", site_address: "23 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
          assert:
            - "response status == 201"
            - "Contract.${contract_id}.custom_design_surcharge_cents == 0"

      - name: create_contract_bad_enum_account_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Client.fields.account_type, "validations[priority=6]"]
        distinguishing_aspect: "POST /clients with account_type='LUXURY' (not in enum) → ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Whiskey Co", account_type: "LUXURY", contact_email: "w@whk.test", site_address: "24 St" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: storage_lot_released_on_not_after_stored_from_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.StorageLot.fields.stored_from, entities.StorageLot.fields.released_on, "validations[priority=6]"]
        distinguishing_aspect: "released_on == stored_from violates released_on>stored_from → ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["a Client+Contract and a StorageBay exist"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Xray Co", account_type: "COMMERCIAL", contact_email: "x@xray.test", site_address: "25 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /storage-bays"
              payload: { bay_code: "BAY-X", capacity_units: 50 }
              as: FieldSupervisor
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /storage-lots"
              payload: { contract_id: "${contract_id}", storage_bay_id: "${bay_id}", unit_count: 10, stored_from: "2027-01-01T00:00:00Z", released_on: "2027-01-01T00:00:00Z" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: line_item_reverse_reachable_by_inventory_item
        claim_type: Parent Relationships
        grounds: [entities.ProposalLineItem.fields.inventory_item_id]
        distinguishing_aspect: "GET /inventory-items/{id}/proposal-line-items returns the lines referencing that SKU."
        test_recipe:
          setup: ["a DRAFT proposal with one line referencing a SKU"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Yankee Co", account_type: "COMMERCIAL", contact_email: "y@yank.test", site_address: "26 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-Y", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 3, unit_install_cents: 5000 }
              as: AccountManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /inventory-items/${sku_id}/proposal-line-items"
              payload: {}
              as: AccountManager
          assert:
            - "response status == 200"
            - "data contains exactly 1 ProposalLineItem whose id == ${line_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: contract_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Contract.initial_state, entities.Contract.fields.status]
        distinguishing_aspect: "Newly created Contract starts in DRAFT."
        test_recipe:
          setup: ["a Client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Zulu Co", account_type: "COMMERCIAL", contact_email: "z@zulu.test", site_address: "27 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
          assert:
            - "Contract.${contract_id}.status == DRAFT"

      - name: propose_contract_without_submitted_proposal_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Contract.DRAFT_to_PROPOSED, "validations[priority=8]"]
        distinguishing_aspect: "DRAFT→PROPOSED with no SUBMITTED proposal under the contract → ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["a DRAFT contract with no submitted proposal"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Alpha2 Co", account_type: "COMMERCIAL", contact_email: "a2@x.test", site_address: "28 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_contract_cascades_workorders_and_storage
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Contract.ACTIVE_to_CANCELLED
          - entities.WorkOrder.fields.schedule_status
          - entities.StorageLot.fields.status
        distinguishing_aspect: "ACTIVE→CANCELLED sets an UNSCHEDULED WorkOrder to CANCELLED and a STORED StorageLot to RELEASED."
        test_recipe:
          setup: ["ACTIVE contract with one UNSCHEDULED WorkOrder and one STORED StorageLot (bay capacity 100)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Bravo2 Co", account_type: "COMMERCIAL", contact_email: "b2@x.test", site_address: "29 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-B2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /storage-bays"
              payload: { bay_code: "BAY-B2", capacity_units: 100 }
              as: FieldSupervisor
              captures: { bay_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /storage-lots"
              payload: { contract_id: "${contract_id}", storage_bay_id: "${bay_id}", unit_count: 10, stored_from: "2027-01-01T00:00:00Z", released_on: "2027-03-01T00:00:00Z" }
              as: FieldSupervisor
              captures: { lot_id: $.data.id }
            - call: "POST /storage-lots/${lot_id}/check-in"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /clients/${client_id}/contracts/${contract_id}/cancel"
              payload: {}
              as: AccountManager
          assert:
            - "Contract.${contract_id}.status == CANCELLED"
            - "WorkOrder.${wo_id}.schedule_status == CANCELLED"
            - "StorageLot.${lot_id}.status == RELEASED"

      - name: cancel_workorder_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.WorkOrder.SCHEDULED_to_CANCELLED, "validations[priority=8]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED WorkOrder → ERR_INVALID_STATE 409; no further side effects."
        test_recipe:
          setup: ["an UNSCHEDULED WorkOrder already cancelled"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Charlie2 Co", account_type: "COMMERCIAL", contact_email: "c2@x.test", site_address: "30 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_workorder_with_planned_visit_returns_visits_not_complete
        claim_type: Precondition Enforcement
        grounds: [state_machines.WorkOrder.DISPATCHED_to_COMPLETED, "errors[ERR_VISITS_NOT_COMPLETE]"]
        distinguishing_aspect: "Completing a DISPATCHED WorkOrder while a Visit is still PLANNED → ERR_VISITS_NOT_COMPLETE 409."
        test_recipe:
          setup: ["a DISPATCHED INSTALL WorkOrder with one still-PLANNED visit"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Delta2 Co", account_type: "COMMERCIAL", contact_email: "d2@x.test", site_address: "31 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-D2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /crews"
              payload: { crew_name: "D2 Crew", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 1, leg_distance_km: 5.0, on_site_minutes: 60 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_date: "2026-11-10T00:00:00Z" }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_VISITS_NOT_COMPLETE"

      - name: invoice_before_completion_returns_workorder_not_completed
        claim_type: Precondition Enforcement
        grounds: [state_machines.WorkOrderBilling.PENDING_to_INVOICED, "errors[ERR_WORKORDER_NOT_COMPLETED]"]
        distinguishing_aspect: "Billing PENDING→INVOICED while schedule_status != COMPLETED → ERR_WORKORDER_NOT_COMPLETED 409 (parallel-dimension guard)."
        test_recipe:
          setup: ["a SCHEDULED (not COMPLETED) WorkOrder, billing still PENDING"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Echo2 Co", account_type: "COMMERCIAL", contact_email: "e2@x.test", site_address: "32 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-E2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /crews"
              payload: { crew_name: "E2 Crew", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 1, leg_distance_km: 5.0, on_site_minutes: 60 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_date: "2026-11-10T00:00:00Z" }
              as: FieldSupervisor
          trigger:
            - call: "POST /work-orders/${wo_id}/invoice"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_WORKORDER_NOT_COMPLETED"

      - name: renewal_offer_accept_after_expiry_returns_offer_expired
        claim_type: guarded transitions
        grounds: [state_machines.RenewalOffer.SENT_to_ACCEPTED, "validations[priority=15]", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Accepting a SENT RenewalOffer after the clock passes expires_at → ERR_OFFER_EXPIRED 409 (clock-driven)."
        test_recipe:
          setup: ["ACTIVE contract with a SENT RenewalOffer expiring 2026-12-01; clock advanced to 2026-12-02"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Foxtrot2 Co", account_type: "COMMERCIAL", contact_email: "f2@x.test", site_address: "33 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-F2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
              captures: { contract_v_active: $.data.version }
            - call: "POST /contracts/${contract_id}/renewal-offers"
              payload: { expires_at: "2026-12-01T00:00:00Z", expected_contract_version: "${contract_v_active}" }
              as: AccountManager
              captures: { offer_id: $.data.id }
            - call: "POST /renewal-offers/${offer_id}/send"
              payload: {}
              as: AccountManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /renewal-offers/${offer_id}/accept"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
