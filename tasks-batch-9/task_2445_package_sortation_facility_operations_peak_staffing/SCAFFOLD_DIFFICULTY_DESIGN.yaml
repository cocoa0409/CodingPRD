              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 30, planned_seasonal_headcount: 0, labor_budget_cents: 1000 }
