  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: drill_completion_requires_roster_resolved
        grounds:
          - state_machines.DrillEvent.IN_PROGRESS_to_COMPLETED
          - errors[ERR_ROSTER_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair DrillEvent x RosterEntry: the drill's
          IN_PROGRESS -> COMPLETED transition is gated on the states of its
          child roster entries; one UNACCOUNTED entry blocks completion with
          ERR_ROSTER_INCOMPLETE until that entry transitions.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP; FIRE drill IN_PROGRESS on 2026-09-15 with roster entry stu-1 still UNACCOUNTED"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-1", accommodation_required: false }
              as: SchoolSafetyOfficer
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /roster-entries/${entry_id}/account"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
          assert:
            - "first complete attempt: error_id == ERR_ROSTER_INCOMPLETE, drill remains IN_PROGRESS"
            - "after accounting the entry, second complete succeeds: DrillEvent.${drill_id}.status == COMPLETED"
            - "DrillEvent.${drill_id}.accounted_count == 1 and unaccounted_count == 0"

      - name: eop_submit_requires_current_site_plan
        grounds:
          - state_machines.EmergencyOperationsPlan.DRAFT_to_SUBMITTED
          - errors[ERR_SITE_PLAN_REQUIRED]
        distinguishing_aspect: |
          Entity pair EmergencyOperationsPlan x SitePlanDocument (different
          pair than the other Rule-7 instance): plan submission is gated on a
          DIFFERENT aggregate holding a currency state; without any CURRENT
          SitePlanDocument the submit fails with ERR_SITE_PLAN_REQUIRED even
          when the walkthrough window is satisfied.
        test_recipe:
          setup:
            - "Site with a COMPLETED walkthrough inside the 365-day window but no SitePlanDocument; one EOP in DRAFT"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: POLICE, scheduled_date: "2026-07-22" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-22", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
          trigger:
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
          assert:
            - "first submit: error_id == ERR_SITE_PLAN_REQUIRED, plan remains DRAFT"
            - "after publishing a CURRENT site plan, resubmit succeeds: EmergencyOperationsPlan.${eop_id}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: drill_half_open_overlap_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_DRILL_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the site drill schedule resource:
          [09:00, 09:30) and [09:30, 10:00) touch but do NOT overlap (allowed),
          while [09:29, 09:59) intersects the first (rejected) — adjacency is
          permitted, one minute of intersection is not.
        test_recipe:
          setup:
            - "Site with FIRE and LOCKDOWN requirements; drill A SCHEDULED 2026-09-15 09:00 for 30 minutes"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 0, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: LOCKDOWN, required_per_year: 2, min_spacing_days: 0, target_evac_seconds: 240 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { da: $.data.id }
          trigger:
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: LOCKDOWN, scheduled_date: "2026-09-15", scheduled_start_time: "09:30", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { db: $.data.id }
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: LOCKDOWN, scheduled_date: "2026-09-15", scheduled_start_time: "09:29", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "adjacent drill B created: DrillEvent.${db}.status == SCHEDULED"
            - "intersecting drill C rejected: error_id == ERR_DRILL_OVERLAP"
            - "site drills_scheduled_count == 2"

      - name: report_period_closed_interval_touch
        grounds:
          - validations[priority=9]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the compliance-report period resource
          (different interval semantics than the drill half-open rule): report
          B's period_start equal to report A's period_end DOES overlap (shared
          boundary date counts), so B is rejected while a gap-starting report
          C is accepted.
        test_recipe:
          setup:
            - "Site with one FIRE requirement; report A DRAFT covering 2026-08-01..2026-12-31"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-12-31" }
              as: DistrictSafetyCoordinator
              captures: { rep_a: $.data.id }
          trigger:
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-12-31", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2027-01-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_c: $.data.id }
          assert:
            - "touching-endpoint report B rejected: error_id == ERR_REPORT_PERIOD_OVERLAP"
            - "gap-starting report C created: ComplianceReport.${rep_c}.status == DRAFT"
            - "ComplianceReport.${rep_a}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: roster_headcount_conservation
        grounds:
          - calculations.roster_reconciliation
          - state_machines.RosterEntry.ACCOUNTED_to_UNACCOUNTED
        distinguishing_aspect: |
          Conserved quantity = roster headcount partition: account paired with
          its compensating unaccount returns every bucket to its prior value;
          at every step unaccounted_count + accounted_count + released_count
          == roster_total with zero drift.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP; FIRE drill IN_PROGRESS on 2026-09-15 with roster entries stu-1 and stu-2"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-1", accommodation_required: false }
              as: SchoolSafetyOfficer
              captures: { e1: $.data.id }
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-2", accommodation_required: false }
              as: SchoolSafetyOfficer
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /roster-entries/${e1}/account"
              as: SchoolSafetyOfficer
            - call: "POST /roster-entries/${e2}/account"
              as: SchoolSafetyOfficer
            - call: "POST /roster-entries/${e1}/release"
              payload: { guardian_name: "Jane Doe", released_to_verified: true }
              as: SchoolSafetyOfficer
            - call: "POST /roster-entries/${e2}/unaccount"
              as: SchoolSafetyOfficer
          assert:
            - "DrillEvent.${drill_id}.roster_total == 2"
            - "DrillEvent.${drill_id}.unaccounted_count == 1 (stu-2 compensated back)"
            - "DrillEvent.${drill_id}.accounted_count == 0"
            - "DrillEvent.${drill_id}.released_count == 1 (stu-1)"
            - "unaccounted_count + accounted_count + released_count == roster_total (1+0+1 == 2)"
            - "RosterEntry.${e2}.accounted_at is null/empty after the compensating unaccount"

      - name: drill_status_bucket_conservation
        grounds:
          - calculations.drill_counter_reconciliation
          - state_machines.DrillEvent.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = per-academic-year drill-event total (different
          quantity than roster headcount): scheduling then cancelling moves one
          unit from the scheduled bucket to the cancelled bucket, and the four
          site counters still sum to the number of drills ever created.
        test_recipe:
          setup:
            - "Site with FIRE requirement; two drills scheduled (2026-09-15 and 2026-09-16)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { da: $.data.id }
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-16", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { db: $.data.id }
          trigger:
            - call: "POST /drill-events/${db}/cancel"
              payload: { reason: "Weather closure" }
              as: SchoolSafetyOfficer
          assert:
            - "DrillEvent.${db}.status == CANCELLED"
            - "SchoolSite.${site_id}.drills_scheduled_count == 1"
            - "SchoolSite.${site_id}.drills_cancelled_count == 1"
            - "SchoolSite.${site_id}.drills_completed_count == 0 and drills_missed_count == 0"
            - "scheduled + completed + missed + cancelled == 2 == number of drills created (invariant holds)"
