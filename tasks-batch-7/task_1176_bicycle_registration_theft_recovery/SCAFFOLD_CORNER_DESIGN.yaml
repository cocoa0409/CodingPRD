# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1176 bicycle-theft-recovery. Breadth probe across the claim-extraction
# taxonomy; every instance's chain replays cleanly against §1.2/§1.4/§1.6.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_registration_required_fields_created_201
        claim_type: creation
        grounds: [entities.Owner]
        distinguishing_aspect: "POST /registry/owners/register with email/password/full_name -> 201; server mints id, created_at, version=1; bikes_registered_count == 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registry/owners/register", payload: { email: "new@x.com", password: "pw", full_name: "New Owner" }, as: Anonymous, captures: { o_id: $.data.id, o_ver: $.data.version, o_bikes: $.data.bikes_registered_count } }
          assert:
            - "201; Owner.version == 1 (observed ${o_ver}); bikes_registered_count == 0 (observed ${o_bikes}); id is a UUID (observed ${o_id})"

      - name: owner_registration_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Owner, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field email -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registry/owners/register", payload: { password: "pw", full_name: "No Email" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (observed ${err})"

      - name: bicycle_computed_fields_and_serial_normalization
        claim_type: computed_fields
        grounds: [entities.Bicycle.fields.serial_normalized, entities.Bicycle.fields.registration_fee_cents, calculations.serial_normalization]
        distinguishing_aspect: "Serial 'ab c-123o' normalizes to 'ABC1230' (uppercase, strip non-alphanumerics, O->0); registration_fee_cents computed server-side (declared 40000 -> base 1000 + processing 30 == 1030); current_owner_id forced to the acting owner."
        test_recipe:
          setup: ["Owner o1 registered"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "ab c-123o", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b_serial: $.data.serial_normalized, b_fee: $.data.registration_fee_cents, b_owner: $.data.current_owner_id } }
          assert:
            - "Bicycle.serial_normalized == 'ABC1230' (observed ${b_serial})"
            - "Bicycle.registration_fee_cents == 1030 (observed ${b_fee})"
            - "Bicycle.current_owner_id == ${o1_id} (observed ${b_owner})"

      - name: owner_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Owner, "errors[ERR_OWNER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID -> 404 ERR_OWNER_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /registry/owners/00000000-0000-0000-0000-000000000000", as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OWNER_NOT_FOUND (observed ${err}); http 404"

      - name: bicycle_list_pagination_defaults
        claim_type: listing
        grounds: [entities.Bicycle, response_envelope]
        distinguishing_aspect: "12 bicycles registered; default limit 10 -> first page len(data)==10, total_count==12, has_more==true; offset=10 -> len 2, has_more==false."
        test_recipe:
          setup: ["Owner o1 with 12 bicycles (serials PG0001..PG0012)"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0001", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/1.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0002", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/2.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0003", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/3.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0004", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/4.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0005", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/5.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0006", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/6.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0007", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/7.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0008", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/8.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0009", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/9.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0010", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/10.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0011", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/11.jpg" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/bicycles", payload: { serial_number: "PG0012", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/12.jpg" }, as: Owner, as_user_id: "${o1_id}" }
          trigger:
            - { call: "GET /registry/bicycles?current_owner_id=${o1_id}", as: Registrar }
            - { call: "GET /registry/bicycles?current_owner_id=${o1_id}&offset=10", as: Registrar }
          assert:
            - "Page 1: len(data) == 10, total_count == 12, has_more == true (pagination defaults limit=10, offset=0)"
            - "Page 2 (offset=10): len(data) == 2, has_more == false"

      - name: ledger_entry_immutable_shape
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields: false — rows expose id and created_at but no version / updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Owner o1 with one registered bicycle (fee pair posted)"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "IMM100", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
          trigger:
            - { call: "GET /registry/ledger-entries?bicycle_id=${b1_id}", as: Registrar, captures: { le_id: "$.data[0].id", le_dir: "$.data[0].direction" } }
          assert:
            - "Entries carry id and created_at (observed ${le_id}) and NO version/updated_at keys"
            - "Exactly 2 entries (DEBIT/OWNER + CREDIT/PROGRAM REGISTRATION_FEE, 1030 each); first direction observed ${le_dir}"

      - name: event_registration_defaults_and_waiver_minting
        claim_type: defaults
        grounds: [entities.EventRegistration.fields.waiver_code, entities.EventRegistration.fields.waiver_used, entities.EventRegistration.fields.status]
        distinguishing_aspect: "Booking mints a server waiver_code, defaults waiver_used == false and status == BOOKED."
        test_recipe:
          setup: ["ACTIVE CAMPUS org; event e1 PUBLISHED window 2026-06-01; Owner o1; clock 2026-05-15"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "State Univ", org_type: "CAMPUS", jurisdiction_code: "SU-1", contact_email: "su@x.edu" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E1", venue: "Quad", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T12:00:00Z", capacity: 5 }, as: Admin, captures: { e1_id: $.data.id } }
            - { call: "POST /registry/events/${e1_id}/publish", payload: {}, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/events/${e1_id}/registrations", payload: {}, as: Owner, as_user_id: "${o1_id}", captures: { er_waiver: $.data.waiver_code, er_used: $.data.waiver_used, er_status: $.data.status } }
          assert:
            - "waiver_code is a non-empty server-minted string (observed ${er_waiver})"
            - "waiver_used == false (observed ${er_used}); status == BOOKED (observed ${er_status})"

  - section: state_machines
    instances:
      - name: bicycle_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Bicycle.registry_status, state_machines.Bicycle.integrity_status]
        distinguishing_aspect: "Fresh bicycle with no near-duplicates starts registry_status == REGISTERED and integrity_status == CLEAR."
        test_recipe:
          setup: ["Owner o1"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "INIT10", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b_reg: $.data.registry_status, b_integ: $.data.integrity_status } }
          assert:
            - "registry_status == REGISTERED (observed ${b_reg}); integrity_status == CLEAR (observed ${b_integ})"

      - name: transfer_accept_from_completed_returns_not_pending
        claim_type: invalid_transition
        grounds: [state_machines.OwnershipTransfer.transitions, "errors[ERR_TRANSFER_NOT_PENDING]"]
        distinguishing_aspect: "Second accept on an already-COMPLETED transfer -> ERR_TRANSFER_NOT_PENDING; no side effects fire (no second fee pair, owner unchanged)."
        test_recipe:
          setup: ["Owner o1 with bicycle b1; Owner o2; transfer t1 COMPLETED"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "TRM100", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${b1_id}", to_owner_email: "o2@x.com", sale_price_cents: 30000 }, as: Owner, as_user_id: "${o1_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /registry/transfers/${t1_id}/accept", payload: {}, as: Owner, as_user_id: "${o2_id}" }
          trigger:
            - { call: "POST /registry/transfers/${t1_id}/accept", payload: {}, as: Owner, as_user_id: "${o2_id}", captures: { err: $.data.error_id } }
            - { call: "GET /registry/ledger-entries?bicycle_id=${b1_id}&entry_type=TRANSFER_FEE", as: Registrar }
          assert:
            - "error_id == ERR_TRANSFER_NOT_PENDING (observed ${err})"
            - "Exactly 2 TRANSFER_FEE ledger entries exist (one balanced pair) — no double-charge"

      - name: settled_auction_terminal_lockdown_open_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Auction.transitions, "errors[ERR_AUCTION_NOT_OPEN]"]
        distinguishing_aspect: "Terminal states lock down: open on a CANCELLED auction fails ERR_AUCTION_NOT_OPEN; settle on CANCELLED fails ERR_AUCTION_NOT_SETTLABLE."
        test_recipe:
          setup: ["ACTIVE LAW_ENFORCEMENT org; intake i1 created 2026-05-01, UNCLAIMED at 2026-06-01; auction a1 SCHEDULED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "TLK100", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 50000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/auctions/${a1_id}/cancel", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { err1: $.data.error_id } }
            - { call: "POST /registry/auctions/${a1_id}/settle", payload: {}, as: Registrar, captures: { err2: $.data.error_id } }
            - { call: "GET /registry/recovery-intakes/${i1_id}", as: Registrar, captures: { i_status: $.data.status } }
          assert:
            - "open on CANCELLED -> ERR_AUCTION_NOT_OPEN (observed ${err1})"
            - "settle on CANCELLED -> ERR_AUCTION_NOT_SETTLABLE (observed ${err2})"
            - "Intake reverted to UNCLAIMED after cancel (observed ${i_status})"

      - name: withdraw_flagged_report_reverts_bicycle_and_expires_matches
        claim_type: side_effect_execution
        grounds: [state_machines.TheftReport.FLAGGED_to_WITHDRAWN, state_machines.Bicycle.registry_status, state_machines.MatchCandidate.transitions]
        distinguishing_aspect: "Withdraw from FLAGGED reverts the bicycle STOLEN -> REGISTERED and expires the NOTIFIED match — the registry cycle closes cleanly."
        test_recipe:
          setup:
            - "Owner o1, Bicycle b1 (serial WDR100, mfr Giant, color Red, declared 60000); report r1 occurred 2026-05-10, FLAGGED"
            - "ACTIVE org; intake i1 (serial WDR100, mfr Giant, color Red, found 2026-05-12, appraised 40000); scan produced NOTIFIED match m1"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "WDR100", manufacturer: "Giant", model: "Defy", primary_color: "Red", declared_value_cents: 60000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "WDR100", primary_color: "Red", found_at: "2026-05-12T00:00:00Z", found_location: "Lot", appraised_value_cents: 40000, manufacturer: "Giant" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}", as: Registrar, captures: { m1_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /registry/theft-reports/${r1_id}/withdraw", payload: {}, as: Owner, as_user_id: "${o1_id}", captures: { r_status: $.data.status } }
            - { call: "GET /registry/bicycles/${b1_id}", as: Registrar, captures: { b_reg: $.data.registry_status } }
            - { call: "GET /registry/matches/${m1_id}", as: Registrar, captures: { m_status: $.data.status } }
          assert:
            - "TheftReport.status == WITHDRAWN (observed ${r_status})"
            - "Bicycle.registry_status == REGISTERED (observed ${b_reg}) — cycle STOLEN -> REGISTERED"
            - "MatchCandidate.status == EXPIRED (observed ${m_status})"

      - name: mark_unclaimed_blocked_by_active_match
        claim_type: precondition_enforcement
        grounds: [state_machines.RecoveryIntake.transitions, "errors[ERR_INTAKE_HAS_ACTIVE_MATCH]"]
        distinguishing_aspect: "mark-unclaimed with a PROPOSED match present (below threshold, never notified) still fails ERR_INTAKE_HAS_ACTIVE_MATCH — the guard covers PROPOSED as well as NOTIFIED."
        test_recipe:
          setup:
            - "Owner o1, Bicycle b1 (serial NOM100, mfr Trek, color Black); report r1 FLAGGED"
            - "ACTIVE org; intake i1 (serial ZZZ000 unrelated -> screening far below 7000, PROPOSED), created 2026-05-01; clock at 2026-06-01 (31 days)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "NOM100", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 60000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ZZZ000", primary_color: "Pink", found_at: "2026-04-30T00:00:00Z", found_location: "Lot", appraised_value_cents: 30000, manufacturer: "Huffy" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INTAKE_HAS_ACTIVE_MATCH (observed ${err}) — the PROPOSED match blocks disposition"

      - name: flag_twice_rejected_idempotency
        claim_type: idempotency
        grounds: [state_machines.TheftReport.transitions, "errors[ERR_THEFT_REPORT_NOT_ACTIONABLE]"]
        distinguishing_aspect: "Repeating the flag trigger on an already-FLAGGED report fails ERR_THEFT_REPORT_NOT_ACTIONABLE; bicycle remains STOLEN with exactly one STOLEN flip."
        test_recipe:
          setup: ["Owner o1, Bicycle b1; report r1 already FLAGGED"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "IDM100", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 60000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id, b1_ver: $.data.version } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
            - { call: "GET /registry/bicycles/${b1_id}", as: Registrar, captures: { b_ver: $.data.version } }
          assert:
            - "error_id == ERR_THEFT_REPORT_NOT_ACTIONABLE (observed ${err})"
            - "Bicycle.version == ${b1_ver} + 1 (observed ${b_ver}) — exactly one mutation from the first flag"

  - section: calculations
    instances:
      - name: registration_fee_tier_boundaries
        claim_type: constants_applied
        grounds: [calculations.registration_fee]
        distinguishing_aspect: "Tier boundaries are inclusive at the lower edge: declared 49999 -> fee 1030; 50000 -> 2060; 200000 -> 2060; 200001 -> 3605 (3500 + round(0.03*3500)=105)."
        test_recipe:
          setup: ["Owner o1"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "TIER01", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 49999, photo_url: "https://x/1.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { f1: $.data.registration_fee_cents } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "TIER02", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 50000, photo_url: "https://x/2.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { f2: $.data.registration_fee_cents } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "TIER03", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 200000, photo_url: "https://x/3.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { f3: $.data.registration_fee_cents } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "TIER04", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 200001, photo_url: "https://x/4.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { f4: $.data.registration_fee_cents } }
          assert:
            - "49999 -> 1030 (observed ${f1}); 50000 -> 2060 (observed ${f2}); 200000 -> 2060 (observed ${f3}); 200001 -> 3605 (observed ${f4})"

      - name: storage_free_days_boundary_via_estimate
        claim_type: correct_result
        grounds: [calculations.storage_fee_accrual, entities.Auction.fields.estimated_storage_fee_cents]
        distinguishing_aspect: "Day boundary exact: auction ends_at exactly 5 days after intake creation -> estimated_storage_fee_cents == 0; at 6 days -> 150 (floor of whole days, free days are days 0..4)."
        test_recipe:
          setup:
            - "ACTIVE orgs orgA/orgB; intakes iA (orgA) and iB (orgB) both created at 2026-05-01T00:00:00Z, appraised 100000; both UNCLAIMED at 2026-06-01"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "PD A", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "A", contact_email: "a@x.gov" }, as: Admin, captures: { orga_id: $.data.id } }
            - { call: "POST /registry/partner-orgs", payload: { name: "PD B", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "B", contact_email: "b@x.gov" }, as: Admin, captures: { orgb_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${orga_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/partner-orgs/${orgb_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "STG001", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${orga_id}", captures: { ia_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "STG002", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${orgb_id}", captures: { ib_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${ia_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/recovery-intakes/${ib_id}/mark-unclaimed", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${ia_id}", starts_at: "2026-05-02T00:00:00Z", ends_at: "2026-05-06T00:00:00Z" }, as: Registrar, captures: { sa: $.data.estimated_storage_fee_cents } }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${ib_id}", starts_at: "2026-05-02T00:00:00Z", ends_at: "2026-05-07T00:00:00Z" }, as: Registrar, captures: { sb: $.data.estimated_storage_fee_cents } }
          assert:
            - "iA ends exactly 5 days after intake creation: estimated_storage_fee_cents == 0 (observed ${sa})"
            - "iB ends 6 days after: estimated_storage_fee_cents == 150 (observed ${sb}) — first chargeable day"

      - name: match_scan_input_set_excludes_non_flagged
        claim_type: input_set_filtering
        grounds: [calculations.match_score]
        distinguishing_aspect: "Scan candidate set is TheftReport.status == FLAGGED only: with one UNDER_REVIEW report present, scanned_report_count == 0 and no match rows are created."
        test_recipe:
          setup: ["Owner o1, Bicycle b1 (serial FLT100, mfr Trek, color Black); report r1 left UNDER_REVIEW (never flagged); ACTIVE org; intake i1 with matching serial"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "FLT100", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 60000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "FLT100", primary_color: "Black", found_at: "2026-05-04T00:00:00Z", found_location: "Lot", appraised_value_cents: 40000, manufacturer: "Trek" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}", captures: { scanned: $.data.scanned_report_count, created: $.data.created_match_ids } }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}", as: Registrar }
          assert:
            - "scanned_report_count == 0 (observed ${scanned}); created_match_ids == [] (observed ${created})"
            - "GET /registry/matches?recovery_intake_id=... returns total_count == 0 — UNDER_REVIEW reports are excluded from the input set"

      - name: next_minimum_bid_increment_rule
        claim_type: correct_result
        grounds: [calculations.next_minimum_bid, "errors[ERR_BID_BELOW_MINIMUM]"]
        distinguishing_aspect: "With a leading bid of 20000, increment == max(500, round_half_up(0.05*20000)) == 1000, so minimum == 21000: 20999 rejected, 21000 accepted."
        test_recipe:
          setup: ["ACTIVE org; intake i1 created 2026-05-01 appraised 100000, UNCLAIMED 2026-06-01; auction a1 [06-05, 06-10] OPENed; owners o1 (leading 20000) and o2"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "INC100", primary_color: "Blue", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { a1_ver: $.data.version } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 20000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "GET /registry/auctions/${a1_id}", as: Registrar, captures: { a1_ver2: $.data.version } }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 20999, expected_auction_version: "${a1_ver2}" }, as: Owner, as_user_id: "${o2_id}", captures: { err: $.data.error_id } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 21000, expected_auction_version: "${a1_ver2}" }, as: Owner, as_user_id: "${o2_id}", captures: { b2_amount: $.data.amount_cents, b2_status: $.data.status } }
          assert:
            - "20999 rejected ERR_BID_BELOW_MINIMUM (observed ${err})"
            - "21000 accepted: amount_cents == 21000 (observed ${b2_amount}), status == ACTIVE (observed ${b2_status}); prior 20000 bid also remains ACTIVE until close"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request sent without X-User-Role / X-User-ID headers -> 401 ERR_UNAUTHENTICATED, before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "NOAUTH1", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 10000, photo_url: "https://x/p.jpg" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (observed ${err}); http 401 — the call is dispatched with auth headers stripped by the test harness"

      - name: flag_nonexistent_report_returns_not_found_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=10]", "errors[ERR_THEFT_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "Existence (p5) beats state (p10): flag on a nonexistent report id returns 404 ERR_THEFT_REPORT_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registry/theft-reports/00000000-0000-0000-0000-000000000000/flag", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_THEFT_REPORT_NOT_FOUND (observed ${err}); http 404"

      - name: waiver_code_single_use_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_WAIVER_CODE_INVALID]"]
        distinguishing_aspect: "A waiver code consumed by one registration cannot be reused: second use fails 422 ERR_WAIVER_CODE_INVALID; first use yields registration_fee_cents == 0 and waiver_used flips true."
        test_recipe:
          setup: ["ACTIVE CAMPUS org; event e1 PUBLISHED window 2026-06-01; Owner o1 with BOOKED registration (waiver code w1); clock 2026-05-15"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "State Univ", org_type: "CAMPUS", jurisdiction_code: "SU-1", contact_email: "su@x.edu" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E1", venue: "Quad", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T12:00:00Z", capacity: 5 }, as: Admin, captures: { e1_id: $.data.id } }
            - { call: "POST /registry/events/${e1_id}/publish", payload: {}, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/events/${e1_id}/registrations", payload: {}, as: Owner, as_user_id: "${o1_id}", captures: { er1_id: $.data.id, w1: $.data.waiver_code } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "WVR001", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 100000, photo_url: "https://x/1.jpg", waiver_code: "${w1}" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_fee: $.data.registration_fee_cents, b1_waiver: $.data.waiver_code_used } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "WVR002", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 100000, photo_url: "https://x/2.jpg", waiver_code: "${w1}" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
            - { call: "GET /registry/event-registrations/${er1_id}", as: Registrar, captures: { er_used: $.data.waiver_used } }
          assert:
            - "First registration: registration_fee_cents == 0 (observed ${b1_fee}); waiver_code_used == ${w1} (observed ${b1_waiver})"
            - "Second registration with same code: error_id == ERR_WAIVER_CODE_INVALID (observed ${err})"
            - "EventRegistration.waiver_used == true (observed ${er_used})"

      - name: transfer_expired_lazy_transition
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_TRANSFER_EXPIRED]", state_machines.OwnershipTransfer.transitions]
        distinguishing_aspect: "Expiry boundary inclusive: accept at exactly expires_at succeeds (COMPLETED); accept one second later fails ERR_TRANSFER_EXPIRED and the transfer lazily transitions to EXPIRED."
        test_recipe:
          setup: ["Owner o1 with bicycles b1 and b2; Owner o2; transfers t1 (on b1) and t2 (on b2) both created at 2026-05-01T00:00:00Z (expires_at 2026-05-08T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "EXP001", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/1.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "EXP002", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/2.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b2_id: $.data.id } }
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${b1_id}", to_owner_email: "o2@x.com", sale_price_cents: 30000 }, as: Owner, as_user_id: "${o1_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${b2_id}", to_owner_email: "o2@x.com", sale_price_cents: 30000 }, as: Owner, as_user_id: "${o1_id}", captures: { t2_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /registry/transfers/${t1_id}/accept", payload: {}, as: Owner, as_user_id: "${o2_id}", captures: { t1_status: $.data.status } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:01Z" }, as: Admin }
            - { call: "POST /registry/transfers/${t2_id}/accept", payload: {}, as: Owner, as_user_id: "${o2_id}", captures: { err: $.data.error_id } }
            - { call: "GET /registry/transfers/${t2_id}", as: Registrar, captures: { t2_status: $.data.status } }
          assert:
            - "t1 accepted at exactly expires_at: status == COMPLETED (observed ${t1_status}) — now <= expires_at is inclusive"
            - "t2 one second later: error_id == ERR_TRANSFER_EXPIRED (observed ${err}); transfer status == EXPIRED (observed ${t2_status})"

      - name: event_host_not_campus_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_EVENT_HOST_NOT_CAMPUS]"]
        distinguishing_aspect: "Event creation with an ACTIVE LAW_ENFORCEMENT host fails 422 ERR_EVENT_HOST_NOT_CAMPUS — host org_type must be CAMPUS."
        test_recipe:
          setup: ["ACTIVE LAW_ENFORCEMENT org"]
          setup_api_calls:
