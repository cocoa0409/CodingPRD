          DRUG_RESULT_POSITIVE, gate 4) -> two CONFIRMED Assignments SUSPENDED. Notably
          drug_test_current_until stays 2027-01-02 (a POSITIVE does not extend currency);
          the block comes from the latest-result gate, not the currency gate.
        test_recipe:
          setup:
            - "M activated CLEAR; vessel ACTIVE with TWO slots (AB critical, OS non-critical); rotation plan"
            - "A1 CONFIRMED [2026-08-10, 2026-11-10) on slot1; A2 CONFIRMED [2026-11-10, 2027-02-10) on slot2 (touching half-open, no overlap)"
            - "A PERIODIC drug test PENDING for M"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Cascade Two", mariner_reference_number: "MRN-TC2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
