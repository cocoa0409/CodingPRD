  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_placement
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - state_machines.Submission.OFFER_EXTENDED_to_PLACED
        distinguishing_aspect: |
          error-category pair {state (p5) vs business_fiscal (p14)}: a placement whose submission is
          NOT OFFER_EXTENDED AND whose client credit would be exceeded must return the higher-priority
          ERR_SUBMISSION_NOT_OFFER_EXTENDED (409), NOT ERR_CREDIT_LIMIT_EXCEEDED (402).
        test_recipe:
          setup:
            - "Client with credit_limit_cents=1 (any placement would exceed); submission still at SUBMITTED (not OFFER_EXTENDED)."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Tight", credit_limit_cents: 1 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_SUBMISSION_NOT_OFFER_EXTENDED (state p5 wins over fiscal p14)"

      - name: skill_referential_beats_temporal_on_submission_vs_placement
        grounds:
          - validations[priority=7]
          - validations[priority=4]
          - errors[ERR_SKILL_MISMATCH]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Different error-category pair {business_constraint body-validation (p4) vs business_referential
          skill-match (p7)}: a submission with a malformed body (negative submitted_pay_rate_cents) AND a
          skill-mismatched candidate must return the higher-priority ERR_VALIDATION (422), proving body
          validation (p4) precedes the referential skill check (p7).
        test_recipe:
          setup:
            - "OPEN TEMP order requiring JAVA; candidate holds only FORKLIFT (skill mismatch)."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/skills"
              payload: { code: "FORKLIFT", category: "INDUSTRIAL" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
            - call: "POST /staffing/candidates"
              payload: { full_name: "Wrong Skill", skill_codes: ["FORKLIFT"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: -5 }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_VALIDATION (body-validation p4 wins over skill-match p7)"

