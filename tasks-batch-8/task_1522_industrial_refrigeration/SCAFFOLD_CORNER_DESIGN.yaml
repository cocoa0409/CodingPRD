          assert:
            - "Equipment.next_due_at == '2026-09-09T00:00:00Z' (completed 2026-08-10 + FAIL_RECHECK_DAYS 30)"
            - "Equipment.integrity_status == 'FAILED' and last_result == 'FAIL'"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: charge_remove_exceeding_total_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_CHARGE_NEGATIVE]"
        distinguishing_aspect: "Ledger solvency: REMOVE 150.0 against a 100.0 balance is rejected; the facility total is unchanged afterwards."
        test_recipe:
          setup: ["Facility with 100.0 lbs book charge; operator employee"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 100.0, reason: "seed charge", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "REMOVE", quantity_lbs: 150.0, reason: "overdraw attempt", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_CHARGE_NEGATIVE' with http 422"
            - "Facility.total_charge_lbs remains 100.0 and Facility.version unchanged (rejected write does not bump version)"

      - name: charge_zero_quantity_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_QUANTITY_NOT_POSITIVE]"
        distinguishing_aspect: "Zero is the exact boundary: quantity_lbs == 0 fails (> 0 required); the smallest positive quantity 0.05 rounds to 0.1 and succeeds."
        test_recipe:
          setup: ["Facility; operator employee"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 0, reason: "zero add", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { err: $.data.error_id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 0.05, reason: "smallest positive", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { rb: $.data.rounded_lbs }
          assert:
            - "Zero quantity: error_id == 'ERR_QUANTITY_NOT_POSITIVE' with http 422 (version not consumed)"
            - "0.05 succeeds and stores rounded_lbs == 0.1 (round_half_up at 0.1) — and because the zero-quantity call was rejected first, expected_facility_version ${fac_v} is still current"

      - name: permit_cross_facility_system_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CROSS_FACILITY_REFERENCE]"
        distinguishing_aspect: "Referential integrity across aggregates: a permit naming facility A but a system of facility B is rejected even though both ids exist."
        test_recipe:
          setup: ["Facilities A and B; system SB under facility B; contractor"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "Plant A" }
              as: FacilityAdmin
              captures: { fac_a: $.data.id }
            - call: "POST /psm/facilities"
              payload: { name: "Plant B" }
              as: FacilityAdmin
              captures: { fac_b: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac_b}", name: "ER-B1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys_b: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac_a}", system_id: "${sys_b}", contractor_id: "${ctr}", work_description: "cross-plant confusion", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_CROSS_FACILITY_REFERENCE' with http 422"

      - name: investigator_equals_reporter_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_INVESTIGATOR_IS_REPORTER]"
        distinguishing_aspect: "Segregation of duties: the reporter of an incident cannot be assigned as its own investigator."
        test_recipe:
          setup: ["Facility; employee R; incident reported by R"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "NEAR_MISS", description: "odor near valve", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
              captures: { inc: $.data.id }
          trigger:
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_r}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVESTIGATOR_IS_REPORTER' with http 422"
            - "Incident remains status == 'REPORTED' with investigator_employee_id == null"

      - name: verifier_equals_completer_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_VERIFIER_IS_COMPLETER]"
          - "state_machines.CorrectiveAction.COMPLETED_to_VERIFIED"
        distinguishing_aspect: "Segregation of duties on verification: when the investigator is also the action assignee, self-verify is rejected with ERR_VERIFIER_IS_COMPLETER."
        test_recipe:
          setup: ["Facility; employees R and I; incident under investigation by I; action assigned to I (the investigator); I completes it"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Ivan Investigator" }
              as: FacilityAdmin
              captures: { emp_i: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "gasket leak", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
              captures: { inc: $.data.id }
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_i}" }
              as: ComplianceOfficer
            - call: "POST /psm/corrective-actions"
              payload: { incident_id: "${inc}", description: "replace gasket", assignee_employee_id: "${emp_i}", due_at: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ca: $.data.id }
            - call: "POST /psm/corrective-actions/${ca}/complete"
              as: Operator
              as_user_id: "${emp_i}"
          trigger:
            - call: "POST /psm/corrective-actions/${ca}/verify"
              as: Operator
              as_user_id: "${emp_i}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_VERIFIER_IS_COMPLETER' with http 422"
            - "CorrectiveAction remains status == 'COMPLETED' (not VERIFIED)"

      - name: drill_conduct_cross_facility_attendee_rejected
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CROSS_FACILITY_REFERENCE]"
          - "state_machines.DrillEvent.PLANNED_to_CONDUCTED"
        distinguishing_aspect: "Conduct with an attendee roster that satisfies the training quorum but includes an employee of another facility fails the referential check."
        test_recipe:
