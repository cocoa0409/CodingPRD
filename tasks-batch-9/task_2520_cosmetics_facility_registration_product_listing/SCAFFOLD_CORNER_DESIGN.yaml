          assert:
            - "${oc_deadline} == \"2026-09-30T23:59:59.999Z\" (change_effective_date + 60 days at end of day) and ${oc_late} == false"
            - "${oc_status} == \"ACCEPTED\" and OwnershipChangeUpdate.decided_by_user_id == \"RVW-1\""
            - "${owner_after} == \"Meridian Personal Care Holdings\" — the facility row itself was renamed"
            - "${elig_after} == false — the abbreviated renewal path is now closed for this period"
            - "${v_after} == ${fac_v} + 2 (one increment for the filing, one for the acceptance)"
