  - section: complexity_layers
    instances:
      - name: occ_slot_revision_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slot-revision-stale-slot]", "errors[ERR_STALE_VERSION]", entities.ManningSlot.fields.version]
        distinguishing_aspect: "OCC on ManningSlot.version: a revision carrying the version observed before another successful revision (create v1 -> first PUT ok v2) is rejected 412 ERR_STALE_VERSION; the loser's intended change (min_rank_grade 7) is not applied."
        test_recipe:
          setup: ["vessel REGISTERED with slot (version 1)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "SS OCC1", imo_number: "IMO-CL1", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id, s_v: $.data.version } }
          trigger:
            - { call: "PUT /vessels/${v_id}/manning-slots/${s_id}", payload: { min_rank_grade: 5, expected_manning_slot_version: "${s_v}" }, as: PortCaptain, captures: { s_v2: $.data.version, s_grade: $.data.min_rank_grade } }
            - { call: "PUT /vessels/${v_id}/manning-slots/${s_id}", payload: { min_rank_grade: 7, expected_manning_slot_version: "${s_v}" }, as: PortCaptain, captures: { err: $.data.error_id } }
            - { call: "GET /vessels/${v_id}/manning-slots/${s_id}", as: PortCaptain, captures: { s_grade_final: $.data.min_rank_grade, s_v_final: $.data.version } }
          assert:
            - "s_v2 == 2 and s_grade == 5 (first revision wins)"
            - "err == ERR_STALE_VERSION (412: the second writer's expected version 1 no longer matches)"
            - "s_grade_final == 5 and s_v_final == 2 (stale write had no effect)"
      - name: occ_rotation_plan_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rotation-plan-create-stale-vessel]", "errors[ERR_STALE_VERSION]", entities.Vessel.fields.version]
        distinguishing_aspect: "OCC on Vessel.version for the create-with-supersede write: after plan P1 is created (which legitimately supersedes any prior plan and bumps the vessel version), a second create carrying the pre-P1 vessel version is rejected 412 — the second planner's view of the rotation state is stale."
        test_recipe:
          setup: ["vessel ACTIVE with slot; vessel version captured after activation (vN)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "SS OCC2", imo_number: "IMO-CL2", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager, captures: { p1_id: $.data.id, p1_status: $.data.status } }
          trigger:
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", standard_tour_days: 60, max_handover_overlap_days: 2, expected_vessel_version: "${v_ver}" }, as: CrewingManager, captures: { err: $.data.error_id } }
            - { call: "GET /vessels/${v_id}/rotation-plans", as: CrewingManager, captures: { plans: $.data } }
          assert:
            - "p1_status == ACTIVE"
            - "err == ERR_STALE_VERSION (412: vessel version advanced by the P1 create)"
            - "plan list contains exactly 1 plan (${p1_id}, ACTIVE) — no supersede chain was created by the stale write"
      - name: occ_mariner_profile_update_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[mariner-profile-update-stale-mariner]", "errors[ERR_STALE_VERSION]", entities.Mariner.fields.version]
        distinguishing_aspect: "OCC on Mariner.version for profile edits: two sequential PUTs carrying the same observed version — the first succeeds (version bumps), the second is rejected 412. Cascaded posture recomputes from child mutations also advance the version, so any literal would silently drift."
        test_recipe:
          setup: ["mariner activated; current version captured via GET"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "OCC Three", mariner_reference_number: "MRN-CL3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "GET /mariners/${m_id}", as: FleetAdmin, captures: { m_v: $.data.version } }
          trigger:
            - { call: "PUT /mariners/${m_id}", payload: { home_port_code: "OAK", expected_mariner_version: "${m_v}" }, as: FleetAdmin, captures: { m_v2: $.data.version, m_port: $.data.home_port_code } }
            - { call: "PUT /mariners/${m_id}", payload: { home_port_code: "SEA", expected_mariner_version: "${m_v}" }, as: FleetAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /mariners/${m_id}", as: FleetAdmin, captures: { m_port_final: $.data.home_port_code } }
          assert:
            - "m_v2 == ${m_v} + 1 and m_port == OAK"
            - "err == ERR_STALE_VERSION (412)"
            - "m_port_final == OAK (stale write dropped)"
      - name: immediate_posture_recompute_on_medical_suspend
        claim_type: derived_field_reconciliation
        grounds: [calculations.mariner_readiness_posture, state_machines.MedicalCertificate, entities.Mariner.fields.readiness_posture]
        distinguishing_aspect: "Derived-field reconciliation is immediate (no clock, no lag): suspending the only VALID medical certificate flips the mariner's computed posture to BLOCKED (NO_VALID_MEDICAL) visible in the very next read; reinstate restores CLEAR in the same fashion (VALID <-> SUSPENDED cycle exercised)."
        test_recipe:
          setup: ["M activated CLEAR (medical 2027-06-01, credential 2030, drug until 2027-01-02)"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Reconcile", mariner_reference_number: "MRN-CL4-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer, captures: { mc_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin, captures: { m_p0: $.data.readiness_posture } }
          trigger:
            - { call: "POST /mariners/${m_id}/medical-certificates/${mc_id}/suspend", payload: {}, as: CredentialingOfficer, captures: { mc_s: $.data.status } }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_p1: $.data.readiness_posture, m_r1: $.data.readiness_reasons } }
            - { call: "POST /mariners/${m_id}/medical-certificates/${mc_id}/reinstate", payload: {}, as: CredentialingOfficer, captures: { mc_r: $.data.status } }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_p2: $.data.readiness_posture } }
          assert:
            - "m_p0 == CLEAR"
            - "mc_s == SUSPENDED and m_p1 == BLOCKED and m_r1 contains NO_VALID_MEDICAL (same-request-sequence recompute)"
            - "mc_r == VALID and m_p2 == CLEAR"

