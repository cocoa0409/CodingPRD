            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1051, avg_fill_ml: 473, warehouse_zone_id: "${zone_a}" }, as: ProductionPlanner, captures: { err_over: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_f}" }, as: ProductionPlanner, captures: { err_zone: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_a}" }, as: ProductionPlanner, captures: { ok_status: $.data.production_status } }
            - { call: "GET /v1/production-runs/${run_id}/finished-good-lots", payload: {}, as: Any, captures: { lots: $.data } }
          assert:
            - "err_zero == ERR_FILL_COUNT_EXCEEDS_THEORETICAL, HTTP 422 (0 < 1 lower bound)"
            - "err_over == ERR_FILL_COUNT_EXCEEDS_THEORETICAL, HTTP 422 (1051 > min(4143, ceil(1000 * 1.05)) == 1050 — the reserved cap binds, not the theoretical one)"
            - "err_zone == ERR_ZONE_TEMPERATURE_MISMATCH, HTTP 422 (FROZEN rejected for any process type)"
            - "ok_status == COMPLETED (failed attempts left the run IN_PRODUCTION)"
            - "lots has exactly 1 element (no lot created by the failed completes)"

      - name: hpp_zone_temperature_rule
        claim_type: conditional_action
        grounds:
          - state_machines.ProductionRun.IN_PRODUCTION_to_COMPLETED
          - errors[ERR_ZONE_TEMPERATURE_MISMATCH]
        distinguishing_aspect: |
          HPP goods require a CHILLED zone: completing an HPP run into an
          AMBIENT zone is ERR_ZONE_TEMPERATURE_MISMATCH (where PASTEURIZATION
          would be allowed); retry into a CHILLED zone succeeds.
        test_recipe:
          setup:
            - "Full HPP pipeline; run IN_PRODUCTION (planned 1000); zones Z-HA AMBIENT and Z-HC CHILLED; clock inside the window"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "HppZone", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
