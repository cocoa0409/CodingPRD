  - section: consistency_model
    instances:

      - name: immediate_consistency_seat_counters_visible_in_the_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Cohort.fields.seats_held, entities.Enrollment.fields.held_until]
        distinguishing_aspect: "Consistency is immediate, not eventual: the enrollment create response already carries held_until 2026-09-04T00:00:00.000Z, and an immediately following cohort read shows seats_held 1 and seats_open 3 with no sweep, retry or delay in between."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "An OPEN_ENROLLMENT Cohort with seats_total 4, seats_held 0 and seats_open 4."
            - "One accepted ANTICIPATED_ILLNESS Participant with a NEEDS Assessment."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
