            - "the second trigger is HTTP 409 with ${err_b} == ERR_INVALID_CREW_STATE"
            - "Crew.${crew_r}.status == RELEASED and Crew.${crew_r}.accrued_wage_cents == 0"
            - "Crew.${crew_c}.status == CERTIFIED and Crew.${crew_c}.housing_unit_code == H-V17C and Crew.${crew_c}.beds_confirmed == 1 and Crew.${crew_c}.vehicle_seats == 1"
            - "GET /berry-ops/harvest-windows with crew_id ${crew_r} returns total_count == 0"

      - name: open_a_window_with_fewer_pickers_than_required_returns_insufficient_pickers
        claim_type: aggregate_validation
        grounds:
          - validations[priority=60]
          - errors[ERR_INSUFFICIENT_PICKERS]
          - calculations.window_crew_requirement
        distinguishing_aspect: |
          The staffing gate compares the crew's live picker_count against the
          required_picker_count that confirmation computed, not against
          planned_head_count: 400.00 planned pounds over 8.00 hours at the
          unadjusted STRAWBERRY rate of 22.00 lbs per picker-hour needs
          ceil(400.00 / 176.00) = 3 pickers, so opening with one registered
          picker is 422 ERR_INSUFFICIENT_PICKERS and the window stays CONFIRMED
          while the crew stays CERTIFIED rather than becoming ACTIVE.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one crew with exactly ONE trained picker, support plan complete, CERTIFIED."
            - "One window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z with planned_volume_lbs 400.00 and forecast_brix 8.5, CONFIRMED so required_picker_count is 3."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V18", variety: "STRAWBERRY", acres: 20.00, planting_year: 2021, irrigation_source_code: "WELL-V18" }
              as: HarvestManager
              as_user_id: "hm-1"
