  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finish_install_consumes_part_decrements_stock_depth3
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_AWAITING_RECALIBRATION
          - state_machines.PartOrder.RESERVED_to_CONSUMED
          - entities.GlassPart.fields.reserved_qty
        distinguishing_aspect: |
          Depth-3 chain from finish-install: (A) WorkOrder IN_SERVICE->AWAITING_RECALIBRATION
          (B) that transition drives its RESERVED PartOrder->CONSUMED (C) the CONSUMED
          PartOrder decrements GlassPart.reserved_qty by 1. Each link is caused by the
          prior link, not directly by finish-install.
