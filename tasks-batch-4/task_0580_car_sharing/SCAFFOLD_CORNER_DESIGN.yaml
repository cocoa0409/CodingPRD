          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host FA", email: "hfa@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest FA", email: "gfa@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
          trigger:
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Guest, as_user_id: "${guest_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: host_cannot_verify_guest
        claim_type: unauthorized_role
        grounds: ["roles.Host", "roles.PlatformAdmin", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Host calling POST /guests/{id}/verify (PlatformAdmin-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A host and a PENDING_REVIEW guest."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host FB", email: "hfb@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest FB", email: "gfb@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-35", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
          trigger:
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: missing_auth_header_rejected
        claim_type: unauthorized_role
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADER]"]
        distinguishing_aspect: "A request to GET /vehicles with no X-User-ID/X-User-Role headers returns ERR_MISSING_AUTH_HEADER (400) before any resource lookup."
        test_recipe:
          setup: ["Empty DB; the call is dispatched with auth headers omitted entirely."]
          setup_api_calls: []
          trigger:
            - { call: "GET /vehicles", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_MISSING_AUTH_HEADER"
            - "http status == 400"

  # ------------------------------------------------------- Cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_vehicle_version_booking_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-stale-vehicle]", "errors[ERR_STALE_VEHICLE_VERSION]"]
        distinguishing_aspect: "After the host edits the vehicle (version 2 -> 3), a booking carrying the stale expected_vehicle_version=2 is rejected with ERR_STALE_VEHICLE_VERSION (412), even though the vehicle is LISTED and the guest is VERIFIED."
        test_recipe:
          setup: ["LISTED vehicle (version 2 after listing) observed by guest; host then edits pricing bumping version to 3."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host GA", email: "hga@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest GA", email: "gga@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-36", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "PUT /vehicles/${vehicle_id}", payload: { base_daily_price_cents: 12000 }, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VEHICLE_VERSION"
            - "http status == 412"

      - name: occ_stale_host_version_payout_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-stale-host]", "errors[ERR_STALE_HOST_VERSION]"]
        distinguishing_aspect: "After the host is suspended then reinstated (version 1 -> 3), a payout carrying stale expected_host_version=1 is rejected with ERR_STALE_HOST_VERSION (412) ahead of any balance check."
        test_recipe:
          setup: ["A host observed at version 1, then suspended (2) and reinstated (3, ACTIVE)."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host GB", email: "hgb@x.com" }, as: Anonymous, captures: { host_id: "$.data.id", host_v: "$.data.version" } }
            - { call: "POST /hosts/${host_id}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "POST /hosts/${host_id}/reinstate", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /payouts", payload: { host_id: "${host_id}", amount_cents: 6000, expected_host_version: "${host_v}" }, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_HOST_VERSION"
            - "http status == 412"

      - name: vehicle_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Vehicle.fields.version", "endpoints.\"POST /vehicles/{id}/list\""]
        distinguishing_aspect: "Vehicle.version starts at 1 on create and increments by exactly 1 on list (2) and again on a PUT edit (3)."
        test_recipe:
          setup: ["A newly created vehicle."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host GC", email: "hgc@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "PUT /vehicles/${vehicle_id}", payload: { base_daily_price_cents: 11000 }, as: Host, as_user_id: "${host_id}" }
          assert:
            - "Vehicle.${vehicle_id}.version == 3"
            - "Vehicle.${vehicle_id}.base_daily_price_cents == 11000"

  # --------------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: booking_immediately_readable
        claim_type: immediate
        grounds: ["endpoints.\"POST /trips\"", "endpoints.\"GET /trips/{id}\""]
        distinguishing_aspect: "Immediately after POST /trips, GET /trips/{id} returns the trip in REQUESTED with its computed estimated_total_cents already present (immediate consistency)."
        test_recipe:
          setup: ["Verified guest, LISTED vehicle; a booking just created."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host HA", email: "hha@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest HA", email: "gha@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-37", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          trigger:
            - { call: "GET /trips/${trip_id}", payload: {}, as: Guest, as_user_id: "${guest_id}" }
          assert:
            - "Trip.${trip_id}.status == REQUESTED"
            - "Trip.${trip_id}.estimated_total_cents == 80500"

