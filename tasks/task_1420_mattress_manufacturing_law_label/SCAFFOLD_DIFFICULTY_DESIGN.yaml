            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1, captures: { err: $.data.error_id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1, captures: { o_st: $.data.production_status } }
          assert:
            - "${err} == ERR_BATCH_NOT_CURED"
            - "${o_st} == MATERIAL_ALLOCATED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: quilt_machine_half_open_overlap
        grounds:
          - calculations.quilt_machine_conflict_check
          - errors[ERR_MACHINE_TIME_CONFLICT]
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: |
          Semantics: pairwise half-open exclusion on the QuiltRun machine resource.
          [08:00,10:00) then [10:00,12:00) is ALLOWED (adjacent, zero gap), while
          [09:59,11:00) is rejected — the boundary treatment of touching endpoints is
          the load-bearing distinction.
        test_recipe:
          setup:
            - "Order exists (any state) to hang runs on; machine M1 free"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-OV1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 4, unit_price_cents: 200000, foam_mass_required_kg: 40, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/quilt-runs", payload: { order_id: "${o_id}", machine_id: "M1", size: "QUEEN", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T10:00:00Z" }, as: LineSupervisor, as_user_id: ls-1, captures: { run_a: $.data.id } }
          trigger:
            - { call: "POST /plant/quilt-runs", payload: { order_id: "${o_id}", machine_id: "M1", size: "KING", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: LineSupervisor, as_user_id: ls-1, captures: { run_b: $.data.id } }
            - { call: "POST /plant/quilt-runs", payload: { order_id: "${o_id}", machine_id: "M1", size: "TWIN", start_at: "2026-08-03T09:59:00Z", end_at: "2026-08-03T11:00:00Z" }, as: LineSupervisor, as_user_id: ls-1, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /plant/quilt-runs", payload: { order_id: "${o_id}", machine_id: "M1", size: "TWIN", start_at: "2026-08-03T14:00:00Z", end_at: "2026-08-03T14:00:00Z" }, as: LineSupervisor, as_user_id: ls-1, captures: { err_range: $.data.error_id } }
          assert:
            - "QuiltRun.${run_b}.status == SCHEDULED"
            - "${err_overlap} == ERR_MACHINE_TIME_CONFLICT"
            - "${err_range} == ERR_INVALID_TIME_RANGE"

      - name: cure_chamber_aggregate_capacity
        grounds:
          - calculations.chamber_capacity_check
          - errors[ERR_CHAMBER_CAPACITY_EXCEEDED]
          - entities.FoamBatch.fields.chamber_id
        distinguishing_aspect: |
          Semantics: aggregate capacity, not pairwise exclusion — a chamber admits
          overlapping CURING windows up to capacity 3, so the 3rd overlapping batch is
          accepted and only the 4th is rejected. This differs from the quilt machine's
          pairwise half-open rule both in resource (chamber vs machine) and in interval
          semantics (counted capacity vs mutual exclusion).
        test_recipe:
          setup:
            - "Four STANDARD batches poured into chamber CH-CAP at the same default clock; all cure windows are [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-CAP" }, as: LineSupervisor, as_user_id: ls-1, captures: { b1: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-CAP" }, as: LineSupervisor, as_user_id: ls-1, captures: { b2: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-CAP" }, as: LineSupervisor, as_user_id: ls-1, captures: { b3: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-CAP" }, as: LineSupervisor, as_user_id: ls-1, captures: { b4: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-OTHER" }, as: LineSupervisor, as_user_id: ls-1, captures: { b5: $.data.id } }
          trigger:
            - { call: "POST /plant/foam-batches/${b1}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { s1: $.data.status } }
            - { call: "POST /plant/foam-batches/${b2}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { s2: $.data.status } }
            - { call: "POST /plant/foam-batches/${b3}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { s3: $.data.status } }
            - { call: "POST /plant/foam-batches/${b4}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { err: $.data.error_id } }
            - { call: "POST /plant/foam-batches/${b5}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { s5: $.data.status } }
          assert:
            - "${s1} == CURING"
            - "${s2} == CURING"
            - "${s3} == CURING"
            - "${err} == ERR_CHAMBER_CAPACITY_EXCEEDED"
            - "${s5} == CURING"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: foam_mass_conservation
        grounds:
          - state_machines.ProductionOrder.PLANNED_to_MATERIAL_ALLOCATED
          - state_machines.ProductionOrder.MATERIAL_ALLOCATED_to_CANCELLED
          - state_machines.ProductionOrder.MATERIAL_ALLOCATED_to_IN_PRODUCTION
          - entities.FoamBatch.fields.available_mass_kg
        distinguishing_aspect: |
          Conserved quantity: foam mass in kg. At every step
          poured_mass_kg == available + reserved + consumed + scrapped must hold.
          Allocate (30 kg) then cancel releases the reservation exactly (100 == 100+0+0+0);
          re-allocate (25 kg) then start-production converts reserved to consumed
          (100 == 75+0+25+0) — forward action and compensating action leave zero drift.
        test_recipe:
          setup:
            - "CURED batch poured 100 kg; ACTIVE model with ACTIVE NV label; orders o1 (30 kg) and o2 (25 kg) PLANNED"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-IV1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "NV", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "NV", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 3, unit_price_cents: 200000, foam_mass_required_kg: 30, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o1: $.data.id } }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 2, unit_price_cents: 200000, foam_mass_required_kg: 25, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /plant/production-orders/${o1}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "GET /plant/foam-batches/${b_id}", payload: {}, as: PlantManager, captures: { av1: $.data.available_mass_kg, rs1: $.data.reserved_mass_kg } }
            - { call: "POST /plant/production-orders/${o1}/cancel", payload: {}, as: PlantManager }
            - { call: "GET /plant/foam-batches/${b_id}", payload: {}, as: PlantManager, captures: { av2: $.data.available_mass_kg, rs2: $.data.reserved_mass_kg } }
            - { call: "POST /plant/production-orders/${o2}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o2}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "GET /plant/foam-batches/${b_id}", payload: {}, as: PlantManager, captures: { av3: $.data.available_mass_kg, rs3: $.data.reserved_mass_kg, cs3: $.data.consumed_mass_kg, sc3: $.data.scrapped_mass_kg } }
          assert:
            - "${av1} == 70 and ${rs1} == 30"
            - "${av2} == 100 and ${rs2} == 0"
            - "${av3} + ${rs3} + ${cs3} + ${sc3} == 100"
            - "${av3} == 75 and ${cs3} == 25"

      - name: retailer_ledger_invariant
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_PAID
          - entities.Retailer.fields.credit_balance_cents
          - entities.CreditAdjustment.fields.amount_cents
          - concurrency_rules[credit-adjustment-stale-retailer]
        distinguishing_aspect: |
          Conserved quantity: the retailer credit ledger (different conserved quantity
          than foam mass). credit_balance_cents must always equal the exact sum of
          CreditAdjustment.amount_cents; a warranty payout (+200000) followed by a
          manual clawback (-50000) leaves balance 150000 == 200000 - 50000 with no drift.
        test_recipe:
          setup:
            - "Retailer balance 0; APPROVED claim with credit_cents 200000 (WORKMANSHIP, age 0)"
