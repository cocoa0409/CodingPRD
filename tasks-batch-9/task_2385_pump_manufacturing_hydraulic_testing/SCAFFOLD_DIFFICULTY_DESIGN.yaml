            - "PatternAsset.${p1_id}.status == WORN"
            - "PumpModel.${m1_id}.status == PATTERN_CONSTRAINED"
            - "the POST /selections call returns 409 with error_id ERR_MODEL_NOT_ORDERABLE"
            - "count(Selection WHERE duty_application_id == ${d1_id}) == 0 and DutyApplication.${d1_id}.status == OPEN"

  # =====================================================================
  # Rule 5 - priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_with_retired_pattern_and_thin_npsh_margin_returns_pattern_error_first
        grounds:
          - validations[priority=35]
          - validations[priority=58]
          - endpoints["POST /selections/{id}/approve"]
          - calculations.npsh_certification_margin
        distinguishing_aspect: |
          Category pair state (35) vs business_safety (58) on the approve endpoint. Both checks
          fail on the same request: the model has no QUALIFIED pattern left AND npsh_margin_m is
          0.40 against the 0.60 floor. Only priority order decides the answer, and the thin
          margin is baked into the Selection at creation time so it cannot be avoided by
          re-ordering the setup. An implementation that evaluates the safety floor first returns
          ERR_NPSH_MARGIN_INSUFFICIENT (422) and fails.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH, PumpModel HSC-14, MaterialSealConfig MSC-CI-P11 as in rule 1 instance 1, and PatternAsset PAT-HSC14-A (wear_threshold 20) as the model's only pattern."
            - "DutyApplication APP-1003 identical to APP-1001 except npsha_available_m 4.80, which yields npshr_catalog_m 3.52, provisional margin 1.28, safety factor 1.25, npshr_certified_m 4.40 and npsh_margin_m 0.40."
            - "Selection created and PROPOSED by eng-101 while the pattern was still QUALIFIED."
            - "PAT-HSC14-A then RETIRED (no lots were ever poured from it), which also drove HSC-14 to PATTERN_CONSTRAINED."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
