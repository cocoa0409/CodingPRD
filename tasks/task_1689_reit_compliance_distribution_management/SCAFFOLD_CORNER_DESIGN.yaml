scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed/system fields, not-found,
  # required fields, type constraints, immutability-by-omission
  # ===========================================================================
  - section: entities
    instances:
      - name: create_reit_applies_computed_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Reit, endpoints.POST_/reit-compliance/reits]
        distinguishing_aspect: "POST /reits with valid input returns 201 and system/computed defaults: status ACTIVE, current_ep_balance_cents 0, dividend_distribution_deficit_cents 0, five_fifty_blocked false, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "Corner REIT", ticker: "CRNR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, status: $.data.status, ep: $.data.current_ep_balance_cents, blocked: $.data.five_fifty_blocked, ver: $.data.version }
          assert:
            - "status == ACTIVE, current_ep_balance_cents == 0, dividend_distribution_deficit_cents == 0, five_fifty_blocked == false, version == 1"
            - "id is a server-minted UUID; created_at/updated_at present in ISO 8601 with three fractional digits"

      - name: create_reit_missing_ticker_returns_validation
        claim_type: required_fields
        grounds: [entities.Reit.fields.ticker, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field ticker on POST /reits yields ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "No Ticker", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 422)"

      - name: create_reit_charter_limit_out_of_range_returns_validation
        claim_type: type_constraints
        grounds: [entities.Reit.fields.charter_ownership_limit_pct, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "charter_ownership_limit_pct must be strictly below 50.0; 50.0 exactly is rejected (boundary of the field constraint)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "BadCap", ticker: "BADC", charter_ownership_limit_pct: 50.0, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 422) for charter_ownership_limit_pct == 50.0"

      - name: get_missing_reit_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/reit-compliance/reits/{id}"]
        distinguishing_aspect: "GET /reits/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /reit-compliance/reits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: asset_holding_held_status_on_create_and_enum_rejection
        claim_type: creation_and_defaults
        grounds: [entities.AssetHolding.fields.asset_class, entities.AssetHolding.fields.status]
        distinguishing_aspect: "Valid create sets status HELD; an asset_class outside {REAL_ESTATE, QUALIFYING_SECURITY, NON_QUALIFYING} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Reit R1 exists"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "Asset REIT", ticker: "ASST", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Depot", asset_class: "QUALIFYING_SECURITY", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2025-05-01", value_cents: 123456 }
              as: ComplianceOfficer
              captures: { a_id: $.data.id, a_status: $.data.status }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Mystery", asset_class: "CRYPTO", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2025-05-01", value_cents: 1 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "valid create: status == HELD, version == 1"
            - "invalid enum asset_class CRYPTO: error_id == ERR_VALIDATION (422)"

      - name: cross_reit_fk_reference_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=9]", entities.IncomeItem.fields.quarter_id]
        distinguishing_aspect: "IncomeItem whose quarter_id belongs to a different reit than reit_id is rejected with ERR_CROSS_REIT_REFERENCE (422)."
        test_recipe:
          setup: ["Two reits R1 and R2; quarter Q2 belongs to R2"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "RA", ticker: "RAAA", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { r1: $.data.id }
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "RB", ticker: "RBBB", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { r2: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${r2}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q_r2: $.data.id }
          trigger:
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${r1}", quarter_id: "${q_r2}", income_class: "RENTS", amount_cents: 100, source_is_trs: false, accrued_at: "2026-01-15" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_REIT_REFERENCE (http 422)"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown,
  # initial state, side effects not already covered by §1.8
  # ===========================================================================
  - section: state_machines
    instances:
      - name: lock_locked_asset_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AssetTestReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second lock on an already-LOCKED report fails with ERR_INVALID_STATE; no side effects fire (quarter stays LOCKED, reit ACTIVE)."
        test_recipe:
          setup: ["Reit R1 ACTIVE; quarter 2026-Q1 with one REAL_ESTATE asset 100000000; AssetTestReport already LOCKED"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM1 REIT", ticker: "SM1R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "HQ", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 100000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { atr_id: $.data.id }
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Reit.${reit_id}.status remains ACTIVE (no repeat side effects)"

      - name: breached_report_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssetTestReport.DRAFT_to_BREACHED]
        distinguishing_aspect: "A BREACHED report is terminal: any further lock attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Reit R1 with failing assets (REAL_ESTATE 10000000, NON_QUALIFYING 90000000) -> report BREACHED on first lock"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM2 REIT", ticker: "SM2R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Small lot", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 10000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Bullion", asset_class: "NON_QUALIFYING", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 90000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { atr_id: $.data.id }
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "first lock produced status BREACHED; second lock returns error_id == ERR_INVALID_STATE (409)"

      - name: pay_pending_approval_dividend_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DividendDeclaration, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /dividend-declarations/{id}/pay from PENDING_APPROVAL is rejected; only DECLARED -> PAID is legal."
        test_recipe:
          setup: ["Reit R1 ACTIVE; dividend D1 created but not approved"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM3 REIT", ticker: "SM3R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 10000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${reit_v}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/pay"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"

      - name: paid_dividend_cannot_be_voided
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DividendDeclaration.DECLARED_to_PAID, state_machines.DividendDeclaration.APPROVED_to_VOID]
        distinguishing_aspect: "PAID is terminal: void after pay returns ERR_INVALID_STATE and E&P is NOT restored."
        test_recipe:
          setup: ["Reit R1 ACTIVE, E&P 300000; requirement POSTED (ti 500000, ncg 0 -> required 450000); dividend 100000 approved, declared (E&P 200000), paid"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM4 REIT", ticker: "SM4R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 300000, effective_date: "2026-01-10", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 500000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 100000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/pay"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/void"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_after: $.data.current_ep_balance_cents }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Reit.current_ep_balance_cents == 200000 (E&P debit of the declared dividend is NOT rolled back)"

      - name: analyze_sale_requires_holding_held
        claim_type: precondition_enforcement
        grounds: [state_machines.AssetSale.DRAFT_to_ANALYZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Analyzing a sale whose asset is already SOLD (confirmed by an earlier sale) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Reit R1 ACTIVE; asset A1 confirmed SOLD via sale S1; second draft sale S2 references the same asset"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM5 REIT", ticker: "SM5R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Warehouse", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2020-01-01", value_cents: 5000000 }
              as: ComplianceOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a1_id}", sale_price_cents: 6000000, basis_cents: 5000000, sale_date: "2026-06-01" }
              as: ComplianceOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales/${s1_id}/analyze"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-sales/${s1_id}/confirm"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a1_id}", sale_price_cents: 6500000, basis_cents: 5000000, sale_date: "2026-07-01" }
              as: ComplianceOfficer
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-sales/${s2_id}/analyze"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409): asset_holding.status == SOLD blocks analysis of a second sale"
            - "AssetHolding.${a1_id}.status remains SOLD"

      - name: confirm_sale_flips_holding_to_sold
        claim_type: side_effect_execution
        grounds: [state_machines.AssetSale.ANALYZED_to_CONFIRMED, entities.AssetHolding.fields.status]
        distinguishing_aspect: "Confirm cascades: AssetHolding.status becomes SOLD and the asset is excluded from later asset tests."
        test_recipe:
          setup: ["Reit R1 ACTIVE; non-dealer asset A1 (acquired 2020-01-01, value 5000000) with sale S1 analyzed"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM6 REIT", ticker: "SM6R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Plaza", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2020-01-01", value_cents: 5000000 }
              as: ComplianceOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a1_id}", sale_price_cents: 5500000, basis_cents: 5000000, sale_date: "2026-06-01" }
              as: ComplianceOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales/${s1_id}/analyze"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/asset-sales/${s1_id}/confirm"
              payload: {}
              as: TaxDirector
              captures: { s_status: $.data.status }
            - call: "GET /reit-compliance/asset-holdings/${a1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { a_status: $.data.status }
          assert:
            - "AssetSale.${s1_id}.status == CONFIRMED"
            - "AssetHolding.${a1_id}.status == SOLD"

      - name: ep_adjustment_initial_state_draft_and_post_transition
        claim_type: initial_state
        grounds: [state_machines.EpAdjustment.DRAFT_to_POSTED, entities.EpAdjustment.fields.status]
        distinguishing_aspect: "New EpAdjustment starts DRAFT and does NOT affect E&P until posted; post flips to POSTED and refreshes the balance."
        test_recipe:
          setup: ["Reit R1 ACTIVE with OPEN quarter; one DRAFT adjustment of 42000 created (not posted)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SM7 REIT", ticker: "SM7R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 42000, effective_date: "2026-02-01", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id, adj_status: $.data.status }
          trigger:
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { ep_before: $.data.current_ep_balance_cents }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
              captures: { adj_status2: $.data.status }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { ep_after: $.data.current_ep_balance_cents }
          assert:
            - "created adjustment status == DRAFT and E&P before post == 0"
            - "after post: adjustment status == POSTED and E&P == 42000"

  # ===========================================================================
  # Section: calculations — correct results, input-set filtering, constants,
  # boundary straddling not covered by §1.8
  # ===========================================================================
  - section: calculations
    instances:
      - name: income_test_dual_ratios_at_boundaries
        claim_type: correct_result
        grounds: [calculations.calc_income_test]
        distinguishing_aspect: "Input mix RENTS 750000 / MORTGAGE_INTEREST 200000 / NON_QUALIFYING 50000 yields exactly 75.0000% and 95.0000%; both booleans true at the inclusive boundary; report locks LOCKED."
        test_recipe:
          setup: ["Reit R1 ACTIVE; quarter 2026-Q1 OPEN with the three income items posted"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "C1 REIT", ticker: "C1RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "RENTS", amount_cents: 750000, source_is_trs: false, accrued_at: "2026-01-15" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "MORTGAGE_INTEREST", amount_cents: 200000, source_is_trs: false, accrued_at: "2026-02-15" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "NON_QUALIFYING", amount_cents: 50000, source_is_trs: false, accrued_at: "2026-03-15" }
              as: ComplianceOfficer
