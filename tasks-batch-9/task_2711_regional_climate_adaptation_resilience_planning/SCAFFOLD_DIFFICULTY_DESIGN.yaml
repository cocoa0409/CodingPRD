            - "hop 1: AdaptationProject.${p_a_id}.program_status == WITHDRAWN and allocated_cents == 0"
            - "hop 2: CapitalProgram.${program_id}.committed_cents == 30000000 and available_cents == 30000000, satisfying committed_cents + available_cents == authorized_cents == 60000000"
            - "hop 3: CapitalProgram.${program_id}.funding_posture == OPEN, because floor(10000 * 30000000 / 60000000) is 5000 bps of headroom, which is not below OVERSUBSCRIBED_BPS_FLOOR 1000"
            - "hop 3: CapitalProgram.${program_id}.equity_achieved_bps == 10000 (the one surviving PROGRAMMED project still reaches disadvantaged populations)"
            - "hop 4: AdaptationProject.${p_b_id}.grant_hold_flag == false while program_status is still PROGRAMMED and allocated_cents is still 30000000"
            - "AdaptationProject.${p_a_id}.grant_hold_flag == true is unchanged, because hop 4 clears the flag only on projects still in program_status PROGRAMMED or GRANT_SUBMITTED"
            - "CapitalProgram.${program_id}.version == 4 (two allocations plus the withdraw decrement each bump the version)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocation_state_error_precedes_funds_exceeded
        grounds:
          - validations.priority_17_ERR_PROJECT_ALREADY_PROGRAMMED
          - validations.priority_50_ERR_PROGRAM_FUNDS_EXCEEDED
          - endpoints.post_capital_program_allocations
          - calculations.program_funding_ledger
        distinguishing_aspect: |
          One request violates priority 17 (project already programmed, a lifecycle-state check) and
          priority 50 (allocation exceeds the program's available_cents, a business-fiscal check) at
          once, and only the priority-17 code may surface. A control call that violates priority 50
          alone returns ERR_PROGRAM_FUNDS_EXCEEDED, so an implementation that evaluates the fiscal
          check first is caught by the first call and an implementation that never reaches the fiscal
          check is caught by the second.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle, one PUBLISHED HazardProfile and one RANKED LifelineAsset."
            - "Two SCREENED_IN AdaptationProjects with total_program_cost_cents 35316000 each, each with one disadvantaged-reaching ProjectAssetLink and a CERTIFIED BenefitCostAnalysis."
            - "One CapitalProgram with authorized_cents 40000000 and equity_target_bps 4000."
            - "The first project has already been allocated 30000000, leaving committed_cents 30000000 and available_cents 10000000 with funding_posture OPEN."
