        grounds:
          - state_machines.DeviceOrder.INTAKE_to_AUTH_PENDING
          - state_machines.DeviceOrder.AUTH_PENDING_to_CANCELLED
          - state_machines.PriorAuth.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          DIFFERENT conserved quantity (a count, not money): the number of non-terminal PriorAuths on
          the order. submit-auth raises the open-auth count to 1; cancel compensates by denying that
