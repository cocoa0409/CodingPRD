        grounds: [entities.UseAuthorization.fields.conditions_breached, entities.Easement.fields.posture]
        distinguishing_aspect: "Opening a violation against a DISCRETIONARY cell that has an APPROVED_WITH_CONDITIONS authorization flips that authorization's conditions_breached to true and pushes the easement posture to VIOLATION_OPEN in the same request."
        test_recipe:
