          assert:
            - "RoomBooking ${rb2} created (201): adjacency at 09:30 is allowed under closed-interval semantics"
            - "A booking 09:15-09:45 on the same room would instead return ERR_ROOM_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capture_then_refund_money_conserved
        grounds:
          - state_machines.CopayPayment.AUTHORIZED_to_CAPTURED
          - state_machines.CopayPayment.CAPTURED_to_REFUNDED
          - entities.Clinic.fields.collected_copay_cents
        distinguishing_aspect: |
          Conserved quantity = money: clinic.collected_copay_cents after capture(+9100) then
          refund(-9100) returns to its pre-capture value 0; the compensating refund leaves the
          named ledger unchanged (net zero).
        test_recipe:
          setup:
            - "Session COPAY_DUE final 9100; CopayPayment authorized 9100 then captured (clinic.collected_copay_cents == 9100)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C17", copay_rounding: "PER_LINE_THEN_SUM", facility_fee_cents: 500 }
              as: ClinicAdmin
              captures: { c17: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c17}", full_name: "Dr Q", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provQ: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c17}", legal_name: "Pat Q", date_of_birth: "1948-05-17", phone: "555-1700" }
              as: FrontDeskStaff
              captures: { patQ: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c17}", provider_id: "${provQ}", patient_id: "${patQ}", start_utc: "2026-06-26T10:00:00.000Z", end_utc: "2026-06-26T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptQ: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptQ}" }
              as: FrontDeskStaff
              captures: { sessQ: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessQ}", payer_name: "Acme", member_id: "M17", plan_copay_cents: 3000, plan_coinsurance_pct: 20, facility_coinsurance_pct: 0, remaining_deductible_cents: 5000, visit_allowed_amount_cents: 8000 }
              as: FrontDeskStaff
              captures: { cardQ: $.data.id }
            - call: "POST /insurance-cards/${cardQ}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cardQ}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
            - call: "GET /intake-sessions/${sessQ}"
              payload: {}
              as: BillingClerk
              captures: { sessQ_v: $.data.version }
            - call: "POST /copay-payments"
              payload: { intake_session_id: "${sessQ}", amount_cents: 9100, expected_intake_session_version: "${sessQ_v}" }
              as: BillingClerk
              captures: { payQ: $.data.id }
            - call: "POST /copay-payments/${payQ}/capture"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /copay-payments/${payQ}/refund"
              payload: {}
              as: BillingClerk
          assert:
            - "Clinic.${c17}.collected_copay_cents == 0"
            - "CopayPayment.${payQ}.status == REFUNDED"
            - "CopayPayment.${payQ}.refunded_cents == 9100"
            - "IntakeSession.${sessQ}.financial_status == COPAY_DUE"

      - name: enqueue_then_cancel_queue_count_conserved
        grounds:
          - state_machines.IntakeSession.IN_PROGRESS_to_READY_FOR_VISIT
          - state_machines.IntakeSession.READY_FOR_VISIT_to_CANCELLED
          - entities.Clinic.fields.active_queue_count
        distinguishing_aspect: |
          Conserved quantity = queue count (DIFFERENT from money): reaching READY enqueues one entry
          (active_queue_count 0->1); cancelling the session NO_SHOWs that entry (1->0), so the
          forward enqueue paired with the compensating cancel leaves clinic.active_queue_count at 0.
        test_recipe:
          setup:
            - "Session reaches READY_FOR_VISIT (no required forms, INSURED) so active_queue_count == 1 and a WAITING entry exists."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C18", form_expiration_hours: 72, facility_fee_cents: 0 }
              as: ClinicAdmin
              captures: { c18: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c18}", full_name: "Dr R", required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provR: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c18}", legal_name: "Pat R", date_of_birth: "1946-06-18", phone: "555-1800" }
              as: FrontDeskStaff
              captures: { patR: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c18}", provider_id: "${provR}", patient_id: "${patR}", start_utc: "2026-06-27T10:00:00.000Z", end_utc: "2026-06-27T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptR: $.data.id }
            - call: "POST /intake-sessions"
              payload: { appointment_id: "${apptR}" }
              as: FrontDeskStaff
              captures: { sessR: $.data.id }
            - call: "POST /insurance-cards"
              payload: { intake_session_id: "${sessR}", payer_name: "Acme", member_id: "M18", plan_copay_cents: 0, plan_coinsurance_pct: 0, facility_coinsurance_pct: 0, remaining_deductible_cents: 0, visit_allowed_amount_cents: 0 }
              as: FrontDeskStaff
              captures: { cardR: $.data.id }
            - call: "POST /insurance-cards/${cardR}/verify"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /insurance-cards/${cardR}/resolve-eligibility"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /intake-sessions/${sessR}/cancel"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "Clinic.${c18}.active_queue_count == 0"
            - "IntakeSession.${sessR}.workflow_status == CANCELLED"
            - "The session's KioskQueueEntry status == NO_SHOW"
