              payload: { outcome: "DIVERSION_CONFIRMED", findings_ref: "FND-1" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
          assert:
            - "before the conclusion MonitoredListing.${listing_id}.match_score == 0.8620 with violation_type COUNTERFEIT"
            - "the conclude call returns HTTP 200 with status DIVERSION_CONFIRMED and concluded_at == 2026-08-05T08:00:00Z"
            - "Seller.${seller_id}.standalone_strike_points == 25.15, cluster_strike_points == 25.15 and status == UNDER_INVESTIGATION"
            - "exactly one EnforcementCase exists for (${brand_id}, ${seller_id}) with originating_takedown_id == null and case_status OPEN"
            - "the re-screen returns match_score == 0.8920 (0.8620 + the 0.03 striked-seller boost) with monitor_status FLAGGED and violation_type COUNTERFEIT"
            - "MonitoredListing.${listing_id}.price_deviation_factor == 0.7000 in both screens"

