        grounds: [endpoints, entities.Athlete]
        distinguishing_aspect: "GET /v1/athletes/{id}/export returns the ten declared sections (profile, activities, efforts, segments, memberships, participations, rsvps, privacy_zones, safety_contacts, subscriptions) with the uploaded activity present in activities."
