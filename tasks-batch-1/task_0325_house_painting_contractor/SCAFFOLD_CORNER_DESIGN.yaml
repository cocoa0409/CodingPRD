            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { v1: $.data.version }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v1}", reason: "add study", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co1: $.data.id }
            - call: "POST /painting/change-orders/${co1}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /painting/change-orders/${co1}/approve"
              payload: {}
              as: Customer
            - call: "GET /painting/projects/${proj}"
              payload: {}
              as: Estimator
              captures: { bal: $.data.balance_due_cents, dep: $.data.deposit_due_cents }
          assert:
            - "Project.${proj}.revised_total_cents == 56213"
            - "Project.${proj}.balance_due_cents == 53539"
            - "Project.${proj}.deposit_due_cents == 2674 (frozen)"

