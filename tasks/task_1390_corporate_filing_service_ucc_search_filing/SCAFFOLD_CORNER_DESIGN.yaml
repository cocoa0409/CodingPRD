            - { call: "POST /client-accounts", payload: { name: "Client B" }, as: PlatformAdmin, captures: { cb: $.data.id } }
          trigger:
            - { call: "POST /client-accounts/${cb}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Intruder Corp", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${ca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLIENT_OWNERSHIP_MISMATCH and http status 403"
            - "GET /client-accounts/${cb}/debtors shows 0 debtors (nothing created)"

      - name: segregation_of_duties_same_user_approve
        claim_type: role_exclusive_denied
        grounds: ["roles", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.FilingRequest.fields.intake_submitted_by_user_id"]
        distinguishing_aspect: "FilingReviewer rev-1 who submitted intake cannot approve the same request (403 ERR_SEGREGATION_OF_DUTIES), while a different reviewer rev-2 can — person-level, not role-level, separation."
        test_recipe:
          setup: ["request whose intake was submitted by FilingReviewer rev-1"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-2", captures: { ok: $.data.status } }
          assert:
            - "rev-1 approve: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "rev-2 approve: succeeds, FilingRequest.${rid}.status == READY"
            - "FilingRequest.${rid}.intake_submitted_by_user_id == rev-1"

      - name: missing_auth_header_returns_400
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID / X-User-Role headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /client-accounts", payload: { name: "No Headers Inc" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status 400 (headers X-User-ID and X-User-Role absent)"

  # ============================================================ cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: occ_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[patch-request-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH carries expected_request_version: the first PATCH (version 1) succeeds and bumps to 2; a second PATCH still carrying version 1 is rejected with ERR_STALE_VERSION (412) and changes nothing."
        test_recipe:
          setup: ["DRAFT_INTAKE request at version 1"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id, v: $.data.version } }
          trigger:
            - { call: "PATCH /filing-requests/${rid}", payload: { fee_authorization_cents: 90000, expected_request_version: "${v}" }, as: FilingSpecialist, captures: { v2: $.data.version } }
            - { call: "PATCH /filing-requests/${rid}", payload: { fee_authorization_cents: 80000, expected_request_version: "${v}" }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeded: version == ${v} + 1 (i.e. 2)"
            - "second PATCH with the stale version: error_id == ERR_STALE_VERSION, http 412"
            - "FilingRequest.${rid}.fee_authorization_cents == 90000 (second write did not land)"

      - name: occ_ucc3_create_stale_target_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ucc3-create-stale-target]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one AMENDMENT request opens against the root (bumping its version), a second creation carrying the pre-bump version is rejected with ERR_STALE_VERSION (412) — OCC fires before the in-flight constraint, which the fresh-version corner instance proves separately."
        test_recipe:
          setup: ["root ACTIVE; version v0 observed; one AMENDMENT request created with v0 (root version advances)"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { v0: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "AMENDMENT", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${v0}" }, as: FilingSpecialist, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "CONTINUATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${v0}" }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION and http status 412 (not ERR_UCC3_IN_FLIGHT — OCC is evaluated first)"
            - "UCCFiling.${fid}.open_ucc3_request_count == 1 (the stale creation did not register)"

      - name: lapse_sweep_on_clock_set
        claim_type: scheduled_actions
        grounds: ["calculations.lapse_sweep"]
        distinguishing_aspect: "Advancing the logical clock lapses overdue ACTIVE filings."
        excluded_because:
          difficulty_instance: "transitive_cascade / lapse_sweep_cascade_depth3"
          rationale: "That instance asserts the sweep itself (ACTIVE -> LAPSED at expiration) plus its two downstream hops."

      - name: discrepancy_then_reflected_dimension_flip
        claim_type: derived_field_reconciliation
        grounds: ["entities.UCCFiling.fields.reflection_status"]
        distinguishing_aspect: "reflection_status reconciles with subsequent verification searches (DISCREPANCY -> REFLECTED)."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / filing_parallel_effectiveness_and_reflection_dimensions"
          rationale: "That instance drives exactly the UNVERIFIED -> DISCREPANCY -> REFLECTED path and asserts effectiveness is untouched."

      - name: open_ucc3_count_decrement_on_fulfill
        claim_type: derived_field_reconciliation
        grounds: ["entities.UCCFiling.fields.open_ucc3_request_count"]
        distinguishing_aspect: "Fulfillment of a UCC-3 request decrements the root's open count."
        excluded_because:
          difficulty_instance: "transitive_cascade / termination_acceptance_cascade_depth3"
          rationale: "That instance's termination fulfillment plus cascade cancellation drive the count from 2 back to 0 and assert it."

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_acceptance
        claim_type: immediate
        grounds: ["complexity_profile", "endpoints[POST /filings/{id}/record-acceptance]"]
        distinguishing_aspect: "Immediate consistency: the record-acceptance RESPONSE ITSELF carries effectiveness_status ACTIVE, filing_number, and computed expiration_at — no re-read or delay needed."
        test_recipe:
          setup: ["READY request with DRAFT attempt submitted"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer, captures: { st: $.data.effectiveness_status, num: $.data.filing_number, exp: $.data.expiration_at } }
          assert:
            - "acceptance response: effectiveness_status == ACTIVE, filing_number == CA-2026-0001, expiration_at == 2031-08-01T00:00:00Z"
            - "parent request is FULFILLED in the same instant (GET /filing-requests/${rid})"
