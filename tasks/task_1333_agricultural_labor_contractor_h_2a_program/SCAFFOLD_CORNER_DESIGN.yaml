        claim_type: role_exclusive_operation_denied
        grounds: ["roles", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Segregation of duties: ContractorAdmin cannot certify (ProgramReviewer), cannot inspect its own housing (HousingInspector), cannot drive the test clock (SystemAdmin); role check (priority 2) fires before any state check."
        test_recipe:
          setup: ["G1; WD1; J1 SUBMITTED; housing unit U1"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/housing-units", payload: { grower_id: "${g1}", name: "U1", capacity: 4 }, as: ContractorAdmin, captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ContractorAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /h2a/housing-units/${u1}/inspections", payload: { inspected_on: "2026-08-01", result: "PASS" }, as: ContractorAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ContractorAdmin, captures: { e3: $.data.error_id } }
            - { call: "POST /h2a/job-orders/${jo1}/flag-deficiency", payload: { note: "housing addendum missing" }, as: ProgramReviewer, captures: { ok_status: $.data.status } }
          assert:
            - "e1 == ERR_UNAUTHORIZED_ROLE (403; ContractorAdmin may not certify)"
            - "e2 == ERR_UNAUTHORIZED_ROLE (403; the contractor cannot inspect its own housing — segregation of duties)"
            - "e3 == ERR_UNAUTHORIZED_ROLE (403; clock is SystemAdmin-only)"
            - "ok_status == DEFICIENCY (ProgramReviewer positive control: the same class of action succeeds for the right role)"

      - name: request_without_auth_headers_unauthenticated
        claim_type: role_exclusive_operation_denied
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-ID / X-User-Role headers are rejected 400 at priority 1 before role, existence, or state checks — even on a read-only endpoint."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /h2a/growers"
              captures: { e1: $.data.error_id }
          assert:
            - "400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (no X-User-ID / X-User-Role headers sent)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: job_order_patch_occ_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[job-order-patch-stale-version]", "errors[ERR_STALE_JOB_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on JobOrder.version: a PATCH carrying the pre-mutation version succeeds (version 1 -> 2, floor recomputed to 1900); replaying the same expected version is rejected 412; after submit, PATCH is blocked by state (409) regardless of version."
        test_recipe:
          setup: ["G1; WD1; J1 DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id, jo1_v: $.data.version } }
          trigger:
            - { call: "PATCH /h2a/job-orders/${jo1}", payload: { expected_job_order_version: "${jo1_v}", offered_hourly_cents: 1900 }, as: ContractorAdmin, captures: { jo1_v2: $.data.version, floor2: $.data.required_hourly_floor_cents } }
            - { call: "PATCH /h2a/job-orders/${jo1}", payload: { expected_job_order_version: "${jo1_v}", offered_hourly_cents: 2000 }, as: ContractorAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "PATCH /h2a/job-orders/${jo1}", payload: { expected_job_order_version: "${jo1_v2}" }, as: ContractorAdmin, captures: { e2: $.data.error_id } }
          assert:
            - "First PATCH: 200, version == 2, required_hourly_floor_cents == 1900 (recomputed from live determination with the new offer)"
            - "e1 == ERR_STALE_JOB_ORDER_VERSION (412): expected_job_order_version 1 is stale after the first patch"
            - "e2 == ERR_JOB_ORDER_INVALID_STATE (409): PATCH allowed only while DRAFT or DEFICIENCY, even with the current version"
            - "JobOrder offered_hourly_cents remains 1900 (rejected patches change nothing)"

      - name: layer_cascading_side_effects_covered
        claim_type: cascade_chain
        grounds: ["state_machines.TransferRequest.GROWER_APPROVED_to_APPROVED", "state_machines.AuditCase.FINDINGS_ISSUED_to_RESOLVED_DEBARMENT"]
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_finalize_three_hop_cascade
          rationale: "N-level cascade chains verified end-to-end in the two §1.8 transitive_cascade instances."

      - name: layer_dual_variant_calculation_covered
        claim_type: variant_divergence
        grounds: ["calculations.weekly_wage_reconciliation", "calculations.audit_penalty_assessment"]
        excluded_because:
          difficulty_instance: dual_variant_calc / wage_reconciliation_provisional_vs_final_divergence
          rationale: "Both dual-variant calculations and their deltas asserted in the two §1.8 dual_variant_calc instances."

      - name: layer_rate_threshold_triggers_covered
        claim_type: threshold_boundary
        grounds: ["calculations.consular_capacity_check", "calculations.three_quarters_guarantee", "calculations.transportation_reimbursement"]
        excluded_because:
          difficulty_instance: boundary_precision_check / consular_daily_quota_sixth_ok_seventh_rejected
          rationale: "Cumulative count threshold at exact boundary asserted in §1.8; guarantee/transport thresholds asserted in corner instances wage_recon_per_day_rounding_order_pinned and inbound_transport_owed_exactly_at_threshold."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_and_list
        claim_type: immediate_visibility
        grounds: ["complexity_profile"]
        distinguishing_aspect: "Immediate consistency: a created grower is visible in the very next GET list and GET-by-filter with all stored fields; no read-your-writes lag."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
          trigger:
            - { call: "GET /h2a/growers?status=ACTIVE", as: GrowerRep, as_user_id: "${g1}", captures: { found: "$.data[0].id" } }
          assert:
            - "GET /h2a/growers?status=ACTIVE immediately returns total_count == 1 with id == ${g1}, legal_name Green Acres LLC, debarment_ends_on == null"
