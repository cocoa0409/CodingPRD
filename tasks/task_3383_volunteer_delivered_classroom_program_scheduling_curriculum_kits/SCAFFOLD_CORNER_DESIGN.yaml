# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3383_volunteer_delivered_classroom_program_scheduling_curriculum_kits
# Breadth probe over §1.1-§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Anchors for the shared base chain are redefined in this file's first recipe.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_district_create_returns_declared_fields_and_starts_prospect
        claim_type: Creation
        grounds:
          - entities.SchoolDistrict
          - endpoints.POST_/ja-programs/districts
        distinguishing_aspect: "A district created with area_office_id and name returns 201 with relationship_status PROSPECT, version 1, and system-stamped id/created_at/updated_at — the status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z (explicitly set). One area office."
          setup_api_calls:
            - &clk
              call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &office
              call: "POST /ja-programs/area-offices"
              payload: { name: "Metro Area Office", region_code: "METRO", max_districts: 5 }
              as: PlatformAdmin
              captures: { office_id: $.data.id }
          trigger:
            - &dist
              call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office_id}", name: "Riverview Unified" }
              as: AreaDirector
              captures: { dist_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "SchoolDistrict.${dist_id}.relationship_status == PROSPECT and version == 1"
            - "SchoolDistrict.${dist_id}.name == \"Riverview Unified\" and area_office_id == ${office_id}"
            - "the response data carries non-null id, created_at and updated_at; meta.api_request_id is present"

      - name: corner_volunteer_create_applies_system_defaults
        claim_type: Defaults
        grounds:
          - entities.Volunteer
          - endpoints.POST_/ja-programs/volunteers
        distinguishing_aspect: "A freshly recruited volunteer starts with screening INITIATED, training NOT_STARTED, engagement ACTIVE, hours_contributed 0, null expiry fields, and eligible == false — all computed/system fields, none client-settable."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One corporate partner (PROSPECT)."
          setup_api_calls:
            - *clk
            - &partner1
              call: "POST /ja-programs/corporate-partners"
              payload: { name: "Acme Corp", industry: "Logistics" }
              as: PartnershipManager
              captures: { partner1_id: $.data.id }
          trigger:
            - &vol1
              call: "POST /ja-programs/volunteers"
              payload: { corporate_partner_id: "${partner1_id}", full_name: "Vol One", email: "vol1@acme.example" }
              as: PartnershipManager
              captures: { vol1_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Volunteer.${vol1_id}.screening_status == INITIATED and training_status == NOT_STARTED and engagement_status == ACTIVE"
            - "Volunteer.${vol1_id}.hours_contributed == 0 and eligible == false"
            - "screening_expires_on and training_expires_on are null"

      - name: corner_school_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.School
          - endpoints.GET_/ja-programs/schools/{school_id}
        distinguishing_aspect: "Every stored field of a school — including the instructional_days array — round-trips through GET exactly as posted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office and district exist."
          setup_api_calls:
            - *clk
            - *office
            - *dist
          trigger:
            - &school
              call: "POST /ja-programs/schools"
              payload: { district_id: "${dist_id}", name: "Riverview Elementary", grade_band_low: 1, grade_band_high: 5, instructional_days: ["MON", "TUE", "WED", "THU", "FRI"] }
              as: AreaDirector
              captures: { school_id: $.data.id }
            - call: "GET /ja-programs/schools/${school_id}"
              payload: {}
              as: Funder
          assert:
            - "the response status is 200"
            - "School.${school_id}.grade_band_low == 1 and grade_band_high == 5"
            - "School.${school_id}.instructional_days == [\"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\"]"
            - "School.${school_id}.district_id == ${dist_id}"

      - name: corner_students_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/ja-programs/students
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With a 3-student roster, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain: PARTNER district, school, ACTIVE partner1 with eligible vol1, program JA-BIZ (4 sessions), ACTIVE agreement (pledge 175000)."
            - "Delivery (DRAFT, enrolled 4) with a 3-student roster."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - &dist_act
              call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
            - *school
            - *partner1
            - &partner1_act
              call: "POST /ja-programs/corporate-partners/${partner1_id}/transition"
              payload: { action: "ACTIVATE" }
              as: PartnershipManager
            - *vol1
            - &vol1_clear
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "SCREENING", event: "CLEAR" }
              as: PartnershipManager
            - &vol1_begin
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "BEGIN" }
              as: PartnershipManager
            - &vol1_complete
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "COMPLETE" }
              as: PartnershipManager
            - &prog4
              call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-BIZ", title: "Biz Basics", grade_band_low: 3, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: false, capstone_facility: "NONE", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { prog4_id: $.data.id }
            - &agr4
              call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${prog4_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 175000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
            - &agr4_propose
              call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - &agr4_activate
              call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { agr_v: $.data.version }
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room P", teacher_email: "tp@rv.example", enrolled_count: 4, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/students"
              payload: { delivery_id: "${del_id}", students: [{ full_name: "Stu A", external_ref: "A1" }, { full_name: "Stu B", external_ref: "B1" }, { full_name: "Stu C", external_ref: "C1" }] }
              as: ProgramCoordinator
          trigger:
            - call: "GET /ja-programs/students"
              payload: { delivery_id: "${del_id}", limit: 2, offset: 0 }
              as: ProgramCoordinator
            - call: "GET /ja-programs/students"
              payload: { delivery_id: "${del_id}", limit: 2, offset: 2 }
              as: ProgramCoordinator
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "GET /ja-programs/students?delivery_id=... with no parameters returns all 3 rows with limit defaulting to 10 and offset to 0"

      - name: corner_session_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/ja-programs/sessions/{session_id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated session id yields 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Empty database besides the clock."
          setup_api_calls:
            - *clk
          trigger:
            - call: "GET /ja-programs/sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 404 and data.error_id == ERR_NOT_FOUND"
            - "response_type == error and data carries both error_id and message"

      - name: corner_delivery_create_missing_required_enrolled_count_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.ClassroomDelivery.fields.enrolled_count
          - validations[priority=3]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "enrolled_count is a required input with no default; omitting it is a 400 ERR_VALIDATION from the body-shape check, before any state or business rule runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain through an ACTIVE agreement (pledge 175000) with eligible vol1."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
          trigger:
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room Q", teacher_email: "tq@rv.example", expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 400 and data.error_id == ERR_VALIDATION"
            - "no ClassroomDelivery is created (GET /ja-programs/deliveries?agreement_id=${agr_id} returns 0 rows)"

      - name: corner_program_create_invalid_capstone_facility_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ProgramCatalog.fields.capstone_facility
          - validations[priority=3]
        distinguishing_aspect: "capstone_facility is a closed enum (SIMULATED_TOWN | FINANCE_PARK | NONE); the value CASTLE is a 400 ERR_VALIDATION, and so is the inconsistent pair capstone_required=true with capstone_facility=NONE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01."
          setup_api_calls:
            - *clk
          trigger:
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-BAD", title: "Bad Program", grade_band_low: 3, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: true, capstone_facility: "CASTLE", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { err1: $.data }
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-BAD2", title: "Bad Program II", grade_band_low: 3, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: true, capstone_facility: "NONE", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { err2: $.data }
          assert:
            - "unknown enum member: 400 ERR_VALIDATION"
            - "capstone_required true with facility NONE (inconsistent pair): 400 ERR_VALIDATION"

      - name: corner_delivery_create_extra_computed_field_rejected
        claim_type: Computed Fields
        grounds:
          - entities.ClassroomDelivery.fields.required_kits
          - validations[priority=3]
        distinguishing_aspect: "required_kits is computed-only: supplying it in the create body is an undeclared-field 400 ERR_VALIDATION — the client cannot smuggle in a computed value, and the server computes it from enrolled_count and the program."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain through an ACTIVE agreement (pledge 175000) with eligible vol1."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
          trigger:
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room R", teacher_email: "tr@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}", required_kits: 1 }
              as: ProgramCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 400 and data.error_id == ERR_VALIDATION (undeclared field required_kits)"
            - "no delivery is created with a client-supplied required_kits"

      - name: corner_area_office_district_quota_enforced_at_cap
        claim_type: Type Constraints
        grounds:
          - entities.AreaOffice.fields.max_districts
          - errors.ERR_TERRITORY_LIMIT_REACHED
        distinguishing_aspect: "Territory capacity: with max_districts 2, the first two districts are created and the third fails 422 ERR_TERRITORY_LIMIT_REACHED (non-CHURNED districts count against the cap)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One area office with max_districts 2."
          setup_api_calls:
            - *clk
            - call: "POST /ja-programs/area-offices"
              payload: { name: "Small Office", region_code: "RURAL", max_districts: 2 }
              as: PlatformAdmin
              captures: { office2_id: $.data.id }
            - call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office2_id}", name: "District One" }
              as: AreaDirector
            - call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office2_id}", name: "District Two" }
              as: AreaDirector
          trigger:
            - call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office2_id}", name: "District Three" }
              as: AreaDirector
              captures: { err: $.data }
          assert:
            - "the response status is 422 and data.error_id == ERR_TERRITORY_LIMIT_REACHED"
            - "GET /ja-programs/districts?area_office_id=${office2_id} still returns exactly 2 rows"

      - name: corner_kit_inventory_create_zeroes_counters
        claim_type: System Fields
        grounds:
          - entities.KitInventory
          - endpoints.POST_/ja-programs/kit-inventories
        distinguishing_aspect: "A new kit inventory row starts with every counter (assembled/available/reserved/distributed/written_off/consumed) at 0 and version 1 — counters are system-managed, never client-seeded."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office and program JA-BIZ exist."
          setup_api_calls:
            - *clk
            - *office
            - *prog4
          trigger:
            - call: "POST /ja-programs/kit-inventories"
              payload: { area_office_id: "${office_id}", program_catalog_id: "${prog4_id}" }
              as: LogisticsCoordinator
              captures: { inv: $.data }
          assert:
            - "the response status is 201 with version == 1"
            - "assembled_count == 0, available_count == 0, reserved_count == 0, distributed_count == 0, written_off_count == 0, consumed_count == 0"

  - section: state_machines
    instances:
      - name: corner_district_churned_terminal_lockdown_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SchoolDistrict
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CHURNED is terminal: FLAG_RISK on a churned district is rejected 409 ERR_INVALID_STATE and no cascade re-fires."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; district already PARTNER then CHURNED."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "CHURN" }
              as: AreaDirector
          trigger:
            - call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "FLAG_RISK" }
              as: AreaDirector
              captures: { err: $.data }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "SchoolDistrict.${dist_id}.relationship_status remains CHURNED"

      - name: corner_session_delivered_terminal_no_reconfirm
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DeliverySession
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DELIVERED is terminal: a CONFIRM against a delivered session is rejected 409 ERR_INVALID_STATE, and hours are not double-credited."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain; program JA-BIZ; agreement ACTIVE; inventory assembled 20."
            - "Delivery (enrolled 10, required_kits 11) SCHEDULED with 4 confirmed sessions (09-08..09-29, 60min)."
            - "Clock at 2026-09-08; session s1 RECORD_DELIVERY succeeded (delivery now IN_PROGRESS)."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
            - &inv4
              call: "POST /ja-programs/kit-inventories"
              payload: { area_office_id: "${office_id}", program_catalog_id: "${prog4_id}" }
              as: LogisticsCoordinator
              captures: { inv4_id: $.data.id }
            - &inv4_assemble20
              call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "ASSEMBLE", quantity: 20 }
              as: LogisticsCoordinator
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room S", teacher_email: "ts@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-15", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /ja-programs/sessions/${s2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-22", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s3: $.data.id }
            - call: "POST /ja-programs/sessions/${s3}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-29", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s4: $.data.id }
            - call: "POST /ja-programs/sessions/${s4}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "CONFIRM_TEACHER" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "RESERVE_KITS" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "SCHEDULE" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
              captures: { err: $.data }
            - call: "GET /ja-programs/volunteers/${vol1_id}"
              payload: {}
              as: PartnershipManager
              captures: { v1: $.data }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE (DELIVERED is terminal for CONFIRM)"
            - "Volunteer.${vol1_id}.hours_contributed == 1.0 — the delivered 60-minute session was not double-credited"
            - "DeliverySession.${s1}.status remains DELIVERED"

      - name: corner_delivery_first_record_delivery_bubbles_to_in_progress
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ClassroomDelivery
          - state_machines.DeliverySession.SCHEDULED_to_DELIVERED
        distinguishing_aspect: "Bubble-up: the delivery is SCHEDULED until the first session RECORD_DELIVERY, which auto-advances the delivery to IN_PROGRESS and recomputes sessions_delivered_count."
        test_recipe:
          setup:
            - "Identical scheduling chain as the sibling corner: delivery SCHEDULED with 4 confirmed sessions; clock 2026-09-08."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
            - *inv4
            - *inv4_assemble20
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room T", teacher_email: "tt@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-15", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /ja-programs/sessions/${s2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-22", start_minutes: 540, end_minutes: 600 }
