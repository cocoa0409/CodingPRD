              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_805: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T09:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { visit_1: "$.data.id" }
            - call: "GET /park-days/${day_805}"
              as: ProgramAdmin
              captures: { day_v: "$.data.version" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_805}", expected_park_day_version: "${day_v}" }
              as: ProgramAdmin
              captures: { blk_1: "$.data.id" }
          trigger:
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T10:30:00Z", gate_code: "SOUTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { err_90: "$.data.error_id" }
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T10:31:00Z", gate_code: "SOUTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { err_91: "$.data.error_id" }
          assert:
            - "first trigger (exactly +90 minutes, a closed buffer) returns HTTP 422 with data.error_id == 'ERR_ANTIPASSBACK_VIOLATION' — priority 62 beats priority 74"
            - "the first trigger is NOT ERR_BLOCKOUT_DATE even though an ACTIVE BlockoutAssignment covers (${bronze}, ${day_805})"
            - "second trigger (+91 minutes) returns HTTP 422 with data.error_id == 'ERR_BLOCKOUT_DATE' — the temporal rule surfaces once the safety rule is disarmed"
            - "GET /visits?season_pass_id=${pass_a} → data.total_count == 1 (neither rejected entry was recorded)"
            - "GET /season-passes/${pass_a} → data.visit_count == 1"
            - "GET /blockout-assignments/${blk_1} → data.status == 'ACTIVE' and data.source == 'MANUAL'"

  - rule_id: boundary_precision_check
    instances:
      - name: park_day_peak_threshold_at_exactly_85_percent
        grounds:
          - calculations.park_day_capacity_posture
          - entities.ParkDay.fields.forecast_utilization_pct
          - entities.PassProgram.fields.capacity_peak_threshold_pct
          - endpoints[POST /park-days/{park_day_id}/forecast]
        distinguishing_aspect: |
          Boundary metric = the 4-decimal utilisation ratio against capacity_peak_threshold_pct 0.85 on
          POST /park-days/{park_day_id}/forecast. 849/1000 == 0.8490 is STANDARD, 850/1000 == 0.8500 is
          PEAK (the threshold is inclusive), and re-forecasting back to 849 returns the day to STANDARD.
          A metric and endpoint disjoint from the currency-rounding instance.
        test_recipe:
          setup:
            - "Program in SALES_OPEN (capacity_peak_threshold_pct 0.85, capacity_lock_threshold_pct 0.97)."
            - "ParkDay 2026-09-12 created with capacity_total 1000 and forecast_attendance 849 → 0.8490, one unit below the peak boundary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-12", capacity_total: 1000, forecast_attendance: 849 }
              as: ProgramAdmin
              captures: { day_912: "$.data.id", day_912_class: "$.data.day_class" }
          trigger:
            - call: "POST /park-days/${day_912}/forecast"
              payload: { forecast_attendance: 850 }
              as: ProgramAdmin
            - call: "POST /park-days/${day_912}/forecast"
              payload: { forecast_attendance: 849 }
              as: ProgramAdmin
          assert:
            - "before the trigger, GET /park-days/${day_912} → data.forecast_utilization_pct == 0.8490 and data.day_class == 'STANDARD' (threshold - 1 unit)"
            - "first trigger response data.forecast_utilization_pct == 0.8500 and data.day_class == 'PEAK' — the 0.85 threshold is inclusive"
            - "first trigger response data.reservation_slot_capacity == 100 (min(floor(1000 * 0.10) == 100, 1000 - 850 == 150)) and data.window_slot_capacity == 50 (max(1, floor(100 / 2)))"
            - "first trigger response data.remaining_slot_count == 100 and data.reserved_count == 0"
            - "first trigger response data.day_class != 'CAPACITY_LOCKED' (0.8500 < 0.9700)"
            - "second trigger response data.forecast_utilization_pct == 0.8490 and data.day_class == 'STANDARD' — the posture is recomputed from scratch, not latched"
            - "the ratio is carried at exactly 4 decimal places: 0.8490 and 0.8500, never 0.849 rounded to 0.85"

      - name: plan_installment_rounds_half_up_at_exact_half_cent
        grounds:
          - calculations.payment_plan_amortization
          - entities.PaymentPlan.fields.monthly_amount_cents
          - entities.Installment.fields.amount_cents
          - endpoints[POST /season-passes/{pass_id}/payment-plans]
        distinguishing_aspect: |
          Boundary metric = currency rounding mode on POST /season-passes/{pass_id}/payment-plans, a
          different metric and a different endpoint from the utilisation-threshold instance. The
          financed principal 10503 over 6 installments lands exactly on a half cent (1750.5), so
          round_half_up must produce 1751 and the residual must absorb the difference as 1748 —
          round-half-even or truncation would give 1750 and a residual of 1753.
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE tier at 12000; minimum down payment is round_half_up(12000 * 0.20) == 2400."
            - "Processed ACTIVE BRONZE pass with payment_mode PAYMENT_PLAN, billing_status UNBILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
          trigger:
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 2997, installment_count: 6, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
          assert:
            - "trigger response data.financed_amount_cents == 10503 (12000 - 2997 + 1500)"
            - "trigger response data.monthly_amount_cents == 1751 — round_half_up(10503 / 6) where the quotient is exactly 1750.5, NOT 1750"
            - "trigger response data.final_installment_cents == 1748 (10503 - 5 * 1751)"
            - "GET /installments?payment_plan_id=${plan_a} → data.total_count == 6, data[0].amount_cents == 1751, data[4].amount_cents == 1751, data[5].amount_cents == 1748"
            - "5 * 1751 + 1748 == 10503 exactly — no cent is created or lost by the rounding"
            - "GET /season-passes/${pass_a} → data.billed_total_cents == 13500, data.paid_to_date_cents == 2997, data.outstanding_balance_cents == 10503, data.billing_status == 'PLAN_CURRENT'"
            - "the down payment 2997 clears the priority-91 floor of 2400, so ERR_DOWN_PAYMENT_TOO_LOW is not raised"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: blockout_lift_blocked_when_park_day_capacity_locked
        grounds:
          - state_machines.BlockoutAssignment.ACTIVE_to_LIFTED
          - entities.ParkDay.fields.day_class
          - entities.PassProgram.fields.capacity_lock_blockout_max_rank
          - validations[priority=57]
          - endpoints[POST /blockout-assignments/{assignment_id}/lift]
        distinguishing_aspect: |
          Entity pair (BlockoutAssignment, ParkDay): the lift transition's legality is decided by a
          field on a *different* entity — ParkDay.day_class — and nothing about the assignment itself.
          The same ACTIVE assignment is unliftable while the day is CAPACITY_LOCKED and liftable the
          moment a forecast update releases the lock, and the auto-lift on release touches only
          CAPACITY_ADJUSTED assignments, leaving the MANUAL one for the operator.
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE (tier_rank 1) and GOLD (tier_rank 3); capacity_lock_blockout_max_rank is 2, so only BRONZE is auto-blocked on a lock."
            - "ParkDay 2026-09-25 with capacity_total 1000 and forecast_attendance 100 → 0.1000, STANDARD."
            - "A MANUAL BlockoutAssignment is created for (GOLD, 2026-09-25) against the day's current version while the day is still STANDARD."
            - "A forecast update to 975 then drives utilisation to 0.9750 >= 0.97, locking the day and auto-creating a CAPACITY_ADJUSTED blockout for BRONZE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-25", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_925: "$.data.id", day_925_v: "$.data.version" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${gold}", park_day_id: "${day_925}", expected_park_day_version: "${day_925_v}" }
              as: ProgramAdmin
              captures: { blk_gold: "$.data.id" }
            - call: "POST /park-days/${day_925}/forecast"
              payload: { forecast_attendance: 975 }
              as: ProgramAdmin
          trigger:
            - call: "POST /blockout-assignments/${blk_gold}/lift"
              payload: { reason: "Marketing wants gold holders back on this date" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /park-days/${day_925} → data.forecast_utilization_pct == 0.9750 and data.day_class == 'CAPACITY_LOCKED'"
            - "GET /blockout-assignments?park_day_id=${day_925} → data.total_count == 2, with one source == 'MANUAL' (GOLD) and one source == 'CAPACITY_ADJUSTED' (BRONZE, tier_rank 1 <= 2)"
            - "GET /blockout-assignments?park_day_id=${day_925}&source=CAPACITY_ADJUSTED → data.total_count == 1 — GOLD's tier_rank 3 exceeds capacity_lock_blockout_max_rank 2 so it was not auto-blocked"
            - "trigger returns HTTP 409 with data.error_id == 'ERR_PARK_DAY_CAPACITY_LOCKED' — the assignment is ACTIVE and otherwise liftable; only the other entity's state forbids it"
            - "GET /blockout-assignments/${blk_gold} → data.status == 'ACTIVE' and data.lift_reason == null"
            - "CONTROL — POST /park-days/${day_925}/forecast with forecast_attendance 800 → data.day_class == 'STANDARD'; the CAPACITY_ADJUSTED assignment is now LIFTED with lift_reason == 'CAPACITY_RELEASED' while ${blk_gold} is still ACTIVE (MANUAL survives the release)"
            - "CONTROL — repeating the identical lift on ${blk_gold} now returns 200 with data.status == 'LIFTED' and data.lift_reason == 'Marketing wants gold holders back on this date'"

      - name: reservation_blocked_by_pass_billing_delinquent
        grounds:
          - validations[priority=48]
          - entities.SeasonPass.fields.billing_status
          - state_machines.SeasonPass.PLAN_CURRENT_to_DELINQUENT
