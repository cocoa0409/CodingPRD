              as: PricingAnalyst
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /ltl/customers/${cust1}"
              payload: {}
              as: PricingAnalyst
              captures: { cust1_v1: "$.data.version" }
            - call: "POST /ltl/customers/${cust1}/posture"
              payload: { billing_posture: "NORMAL", expected_customer_version: "${cust1_v1}" }
              as: PricingAnalyst
              captures: { posture2: "$.data.billing_posture" }
          assert:
            - "trigger[1] returns 200 with billing_posture CREDIT_HOLD"
            - "trigger[2] returns 412 ERR_STALE_CUSTOMER_VERSION"
            - "after trigger[2] Customer.${cust1}.billing_posture is still CREDIT_HOLD"
            - "trigger[3] returns a version strictly greater than ${cust1_v0}"
            - "trigger[4] returns 200 with billing_posture NORMAL"
            - "Customer.${cust1}.offender_strike_count == 0 and education_status == NONE throughout"

