            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 1000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 300000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 25.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
