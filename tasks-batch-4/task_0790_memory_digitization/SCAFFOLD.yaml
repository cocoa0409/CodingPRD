scenario: "790. Memory-Preservation & Media Digitization (Legacybox style): order & media-type (tape/film/photo/audio) inventory, barcode & batch tracking, digitization pipeline & QC, cloud/USB/DVD output & download, turnaround & rush, lost/damage policy, gift, reorder/restore"
domain_name: memory-digitization
api_prefix: /

# ===========================================================================
# Complexity Profile
# ===========================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (Order, MediaItem, Batch, Machine,
  # StorageBin, OutputArtifact, DamageClaim). URL paths are mostly flat with a
  # handful of sub-resource GETs used only as FK reverse-reachability channels.

  state_machine_shape: parallel
  # Order carries two independent axes (fulfillment_status x payment_status).
  # MediaItem carries a QC revision cycle (QC_FAIL -> SCANNING). Batch/DamageClaim
  # add branching and revert shapes.

  relationship_patterns:
    - one_to_many          # Order -> MediaItem, Order -> OutputArtifact, Order -> DamageClaim
    - cross_aggregate      # DamageClaim references both Order and MediaItem; Batch references Machine

  role_model: peer_roles
  # IntakeTech, LabTech, ClaimsAdjuster each own a distinct pipeline stage;
  # Admin is a superset operator; Customer is entity-backed.

  consistency_model: immediate

# Named constants referenced by state machines (§1.2) and validations (§1.4).
system_constants:
  MAX_QC_ATTEMPTS: 3            # a MediaItem may be reviewed at most 3 times; the 3rd FAIL writes it off
  RETENTION_DAYS: 30           # bin occupancy window length; end (exclusive) = stored_at + 30d
  DOWNLOAD_EXPIRY_DAYS: 30     # CLOUD artifact download window; expires_at = created_at + 30d
  MAX_DOWNLOADS_PER_ARTIFACT: 3  # CLOUD download allowed while download_count < 3
  CLAIM_WINDOW_DAYS: 90        # a claim must be filed within 90 days of order READY

# ===========================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email; unique
        constraints: unique, non-empty
      - name: full_name
        type: string
        source: input
        description: customer display name
      - name: state_code
        type: string
        source: input
        description: two-letter US state code
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: refundable store credit balance in cents; increased by claim payouts
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: derived 0-100 risk score; see calculations.customer_risk_score (settled variant persisted here)
        default: 0
      - name: approved_claim_count
        type: integer
        source: computed
        description: number of DamageClaims for this customer in status APPROVED
        default: 0
      - name: pending_claim_count
        type: integer
        source: computed
        description: number of DamageClaims for this customer in status SUBMITTED or UNDER_REVIEW
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ordering customer"
      - name: plan_tier
        type: enum
        source: input
        description: service plan tier
        constraints: one of [STANDARD_KIT, FAMILY_KIT, CLOSET_KIT]
      - name: turnaround
        type: enum
        source: input
        description: processing turnaround selection
        constraints: one of [STANDARD, RUSH]
      - name: output_option
        type: enum
        source: input
        description: default delivery medium for generated output
        constraints: one of [CLOUD, USB, DVD]
      - name: lost_damage_protection
        type: boolean
        source: input
        description: whether the paid lost/damage protection add-on was purchased
        default: false
      - name: is_gift
        type: boolean
        source: input
        description: whether this order is placed as a gift
        default: false
      - name: gift_recipient_email
        type: string
        source: input
        description: recipient email when is_gift is true; null otherwise
        default: null
      - name: promo_code
        type: string
        source: input
        description: optional promotional code; only SAVE5 is recognized
        default: null
      - name: declared_tape_count
        type: integer
        source: input
        description: customer-declared count of tape items
        default: 0
      - name: declared_film_count
        type: integer
        source: input
        description: customer-declared count of film items
        default: 0
      - name: declared_photo_count
        type: integer
        source: input
        description: customer-declared count of photo items
        default: 0
      - name: declared_audio_count
        type: integer
        source: input
        description: customer-declared count of audio items
        default: 0
      - name: fulfillment_status
        type: enum
        source: computed
        description: fulfillment dimension of the order lifecycle
        default: QUOTED
        constraints: one of [QUOTED, AWAITING_MEDIA, RECEIVED, PROCESSING, READY]
      - name: payment_status
        type: enum
        source: computed
        description: payment dimension of the order lifecycle; evolves independently of fulfillment_status
        default: UNPAID
        constraints: one of [UNPAID, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED]
      - name: estimate_total_cents
        type: integer
        source: computed
        description: estimate variant of order_total computed from declared_*_count at creation
      - name: final_total_cents
        type: integer
        source: computed
        description: final variant of order_total recomputed from non-written-off MediaItems; null until first recompute
        default: null
      - name: captured_total_cents
        type: integer
        source: computed
        description: amount captured at capture-payment (equals estimate_total_cents at capture time)
        default: 0
      - name: refunded_total_cents
        type: integer
        source: computed
        description: cumulative refunded cents; increased by approved claim payouts
        default: 0
      - name: received_item_count
        type: integer
        source: computed
        description: number of MediaItems ever logged against this order at intake
        default: 0
      - name: written_off_count
        type: integer
        source: computed
        description: number of this order's MediaItems currently in status WRITTEN_OFF
        default: 0

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: digitization station name
      - name: kind
        type: enum
        source: input
        description: station capability
        constraints: one of [TAPE_DECK, FILM_SCANNER, PHOTO_SCANNER, AUDIO_DECK]
      - name: capacity
        type: integer
        source: input
        description: informational max media items per batch on this machine
        default: 50

  - name: StorageBin
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: physical bin label
      - name: capacity
        type: integer
        source: input
        description: maximum number of MediaItems whose retention windows may overlap in this bin
        constraints: integer >= 1

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; the station this batch is scheduled on"
      - name: scheduled_start
        type: datetime
        source: input
        description: reservation window start (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: reservation window end (exclusive); must be strictly after scheduled_start
      - name: capacity
        type: integer
        source: input
        description: max media items this batch may hold
        default: 50
      - name: status
        type: enum
        source: computed
        description: batch lifecycle state
        default: OPEN
        constraints: one of [OPEN, LOADED, RUNNING, COMPLETED, FAILED]
      - name: loaded_count
        type: integer
        source: computed
        description: number of MediaItems currently loaded into this batch
        default: 0

  - name: MediaItem
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; owning order"
      - name: batch_id
        type: string
        source: input
        description: "FK -> Batch.id; assigned digitization batch; null until loaded"
        default: null
      - name: bin_id
        type: string
        source: input
        description: "FK -> StorageBin.id; physical storage bin assigned at intake"
      - name: media_type
        type: enum
        source: input
        description: physical media type
        constraints: one of [TAPE, FILM, PHOTO, AUDIO]
      - name: barcode
        type: string
        source: input
        description: barcode assigned at intake; unique when provided
        default: null
      - name: status
        type: enum
        source: computed
        description: digitization pipeline state
        default: LOGGED
        constraints: one of [LOGGED, PREPPED, SCANNING, QC_PENDING, QC_FAIL, OUTPUT_READY, WRITTEN_OFF]
      - name: qc_attempts
        type: integer
        source: computed
        description: number of QC review decisions rendered on this item (pass or fail)
        default: 0
      - name: digitized_minutes
        type: number
        source: input
        description: runtime captured for tape/film/audio at scan completion
        default: null
      - name: page_count
        type: integer
        source: input
        description: page/frame count captured for photo at scan completion
        default: null
      - name: stored_at
        type: datetime
        source: system
        description: logical-clock timestamp when the item was assigned to its bin
      - name: retention_until
        type: datetime
        source: computed
        description: stored_at + RETENTION_DAYS; end (exclusive) of the bin occupancy window

  - name: QCReview
    parent: MediaItem
    common_fields: false
    fields:
      - name: media_item_id
        type: string
        source: input
        description: "FK -> MediaItem.id; the reviewed item"
      - name: decision
        type: enum
        source: input
        description: QC outcome
        constraints: one of [PASS, FAIL]
      - name: attempt_number
        type: integer
        source: computed
        description: which QC attempt this review records (1-based)
      - name: notes
        type: string
        source: input
        description: reviewer notes
        default: null

  - name: OutputArtifact
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this deliverable belongs to"
      - name: output_type
        type: enum
        source: input
        description: deliverable medium
        constraints: one of [CLOUD, USB, DVD]
      - name: status
        type: enum
        source: computed
        description: artifact lifecycle state
        default: AVAILABLE
        constraints: one of [AVAILABLE, REVOKED, EXPIRED]
      - name: download_token
        type: string
        source: system
        description: opaque token minted for CLOUD downloads
      - name: download_count
        type: integer
        source: computed
        description: number of successful downloads recorded against this artifact
        default: 0
      - name: expires_at
        type: datetime
        source: computed
        description: created_at + DOWNLOAD_EXPIRY_DAYS; CLOUD download rejected at/after this instant
      - name: item_count_snapshot
        type: integer
        source: computed
        description: number of OUTPUT_READY MediaItems included at generation time

  - name: DownloadEvent
    parent: OutputArtifact
    common_fields: false
    fields:
      - name: output_artifact_id
        type: string
        source: input
        description: "FK -> OutputArtifact.id; the artifact downloaded"
      - name: sequence_number
        type: integer
        source: computed
        description: 1-based ordinal of this download against the artifact
      - name: downloaded_at
        type: datetime
        source: system
        description: logical-clock timestamp of the download

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; order the claim is filed against"
      - name: media_item_id
        type: string
        source: input
        description: "FK -> MediaItem.id; the lost/damaged item; must belong to order_id"
      - name: claim_type
        type: enum
        source: input
        description: nature of the claim
        constraints: one of [LOST, DAMAGED]
      - name: declared_value_cents
        type: integer
        source: input
        description: customer-declared sentimental/replacement value in cents; capped by policy
        default: null
      - name: status
        type: enum
        source: computed
        description: claim adjudication state
        default: SUBMITTED
        constraints: one of [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
      - name: payout_cents
        type: integer
        source: computed
        description: policy payout computed at approval; see calculations.damage_payout
        default: 0

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Order
    initial_state: "QUOTED (fulfillment_status) / UNPAID (payment_status)"
    terminal_states: [READY]
    note: |
      Order carries TWO independent (parallel) state dimensions. fulfillment_status
      advances QUOTED -> AWAITING_MEDIA -> RECEIVED -> PROCESSING -> READY.
      payment_status advances UNPAID -> AUTHORIZED -> CAPTURED and may branch to
      PARTIALLY_REFUNDED. The two axes evolve on different endpoints and never
      block each other except where output generation reads both.
    transitions:
      - from: "fulfillment=QUOTED, payment=UNPAID"
        to: "fulfillment=AWAITING_MEDIA, payment=AUTHORIZED"
        trigger: "POST /orders/{id}/authorize-payment"
        actor: Customer
        preconditions: ["fulfillment_status == QUOTED", "payment_status == UNPAID"]
        side_effects:
          - "payment_status = AUTHORIZED"
          - "fulfillment_status = AWAITING_MEDIA"
        note: "authorizing payment also releases the kit; both axes move on this one call"
      - from: "payment=AUTHORIZED"
        to: "payment=CAPTURED"
        trigger: "POST /orders/{id}/capture-payment"
        actor: Admin
        preconditions: ["payment_status == AUTHORIZED"]
        side_effects:
          - "payment_status = CAPTURED"
          - "captured_total_cents = estimate_total_cents"
        note: "pure payment-dimension move; does not touch fulfillment_status"
      - from: "fulfillment=AWAITING_MEDIA"
        to: "fulfillment=RECEIVED"
        trigger: "POST /orders/{id}/receive"
        actor: IntakeTech
        preconditions: ["fulfillment_status == AWAITING_MEDIA", "payment_status IN {AUTHORIZED, CAPTURED}"]
        side_effects: ["fulfillment_status = RECEIVED"]
      - from: "fulfillment=RECEIVED"
        to: "fulfillment=PROCESSING"
        trigger: "system: first MediaItem of this order enters SCANNING (see MediaItem PREPPED->SCANNING cascade)"
        actor: system
        preconditions: ["fulfillment_status == RECEIVED"]
        side_effects: ["fulfillment_status = PROCESSING"]
        note: "CASCADE-2 link 2 — bubbled up from the MediaItem scan-start"
      - from: "fulfillment=PROCESSING"
        to: "fulfillment=READY"
        trigger: "system: every MediaItem of this order is in {OUTPUT_READY, WRITTEN_OFF} and at least one is OUTPUT_READY"
        actor: system
        preconditions:
          - "fulfillment_status == PROCESSING"
          - "for all MediaItem m where m.order_id == this.id: m.status IN {OUTPUT_READY, WRITTEN_OFF}"
          - "count(MediaItem m: m.order_id == this.id AND m.status == OUTPUT_READY) >= 1"
        side_effects: ["fulfillment_status = READY"]
        note: "bubble-up compound transition; gates output generation (cross-entity dependency on MediaItem)"
      - from: "payment=CAPTURED"
        to: "payment=PARTIALLY_REFUNDED"
        trigger: "system: a DamageClaim on this order is APPROVED (see DamageClaim review-approve)"
        actor: system
        preconditions: ["payment_status == CAPTURED"]
        side_effects:
          - "refunded_total_cents += DamageClaim.payout_cents"
          - "payment_status = PARTIALLY_REFUNDED"
          - "final_total_cents recomputed (final variant of order_total)"
        note: "CASCADE-1 link 3 origin on Order; compensating money invariant lives here"

  - entity: MediaItem
    initial_state: LOGGED
    terminal_states: [WRITTEN_OFF]
    note: "Cyclic QC loop: QC_FAIL -> SCANNING (rescan) may repeat until qc_attempts == MAX_QC_ATTEMPTS."
    transitions:
      - from: LOGGED
        to: PREPPED
        trigger: "POST /batches/{id}/load"
        actor: LabTech
        preconditions: ["status == LOGGED", "loading batch.status IN {OPEN, LOADED}", "batch.loaded_count < batch.capacity"]
        side_effects: ["batch_id = batch.id", "batch.loaded_count += 1", "batch.status = LOADED"]
      - from: PREPPED
        to: SCANNING
        trigger: "POST /batches/{id}/run"
        actor: LabTech
        preconditions:
          - "status == PREPPED"
          - "batch.status == LOADED"
          - "Order(order_id).fulfillment_status IN {RECEIVED, PROCESSING}"
        side_effects:
          - "batch.status = RUNNING"
          - "if Order(order_id).fulfillment_status == RECEIVED then Order.fulfillment_status = PROCESSING"
        note: "CROSS-ENTITY GATE (Rule 7): a MediaItem may start scanning only if its Order is RECEIVED/PROCESSING. CASCADE-2 origin: batch run -> item SCANNING -> order PROCESSING."
      - from: SCANNING
        to: QC_PENDING
        trigger: "POST /media-items/{id}/complete-scan"
        actor: LabTech
        preconditions: ["status == SCANNING"]
        side_effects: ["digitized_minutes/page_count recorded from input"]
      - from: QC_PENDING
        to: OUTPUT_READY
        trigger: "POST /media-items/{id}/qc-review (decision=PASS)"
        actor: LabTech
        preconditions: ["status == QC_PENDING"]
        side_effects:
          - "qc_attempts += 1"
          - "create QCReview(decision=PASS, attempt_number=qc_attempts)"
          - "bubble-up: re-evaluate Order fulfillment READY"
      - from: QC_PENDING
        to: QC_FAIL
        trigger: "POST /media-items/{id}/qc-review (decision=FAIL)"
        actor: LabTech
        preconditions: ["status == QC_PENDING"]
        side_effects:
          - "qc_attempts += 1"
          - "create QCReview(decision=FAIL, attempt_number=qc_attempts)"
        note: "a FAIL always lands in QC_FAIL; the rescan cap (not auto-write-off) enforces the attempt limit"
      - from: QC_FAIL
        to: SCANNING
        trigger: "POST /media-items/{id}/rescan"
        actor: LabTech
        preconditions: ["status == QC_FAIL", "qc_attempts < MAX_QC_ATTEMPTS"]
        side_effects: []
        note: "CYCLE (Rule 3): revision loop back into SCANNING. BOUNDARY: at qc_attempts == MAX_QC_ATTEMPTS the rescan is rejected with ERR_QC_ATTEMPTS_EXCEEDED and the item stays QC_FAIL (resolved later via a lost/damage claim write-off)."
      - from: OUTPUT_READY
        to: WRITTEN_OFF
        trigger: "system: DamageClaim(media_item_id=this) is APPROVED"
        actor: system
        preconditions: ["status IN {LOGGED, PREPPED, SCANNING, QC_PENDING, QC_FAIL, OUTPUT_READY}"]
        side_effects:
          - "Order(order_id).written_off_count += 1"
        note: "CASCADE-1 link 1: claim approval writes off the item"

  - entity: Batch
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: LOADED
        trigger: "POST /batches/{id}/load"
        actor: LabTech
        preconditions: ["status == OPEN", "loaded_count < capacity"]
        side_effects: ["loaded_count += 1"]
      - from: LOADED
        to: RUNNING
        trigger: "POST /batches/{id}/run"
        actor: LabTech
        preconditions: ["status == LOADED", "loaded_count >= 1"]
        side_effects: ["each loaded MediaItem: PREPPED -> SCANNING"]
      - from: RUNNING
        to: COMPLETED
        trigger: "system: every loaded MediaItem has left SCANNING (reached QC_PENDING or beyond)"
        actor: system
        preconditions: ["status == RUNNING"]
        side_effects: []
      - from: RUNNING
        to: FAILED
        trigger: "system: run aborted (not exercised by public endpoints in this scaffold)"
        actor: system
        preconditions: ["status == RUNNING"]
        side_effects: []
      - from: FAILED
        to: OPEN
        trigger: "system: batch reopened for reload"
        actor: system
        preconditions: ["status == FAILED"]
        side_effects: []

  - entity: DamageClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    note: "Branching adjudication: SUBMITTED -> APPROVED or REJECTED via a single review call (UNDER_REVIEW is a transient reserved state, not exposed as a separate endpoint)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /damage-claims/{id}/review (decision=APPROVE)"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SUBMITTED"
          - "Order(order_id).payment_status == CAPTURED"
        side_effects:
          - "payout_cents = damage_payout(this)"
          - "MediaItem(media_item_id): -> WRITTEN_OFF   [CASCADE-1 link 1]"
          - "Order(order_id): refunded_total_cents += payout_cents; payment_status = PARTIALLY_REFUNDED; final_total_cents recomputed   [CASCADE-1 link 2]"
          - "Customer(Order.customer_id): wallet_credit_cents += payout_cents; approved_claim_count += 1; risk_score recomputed (settled variant)   [CASCADE-1 link 3]"
        note: "CROSS-ENTITY DEPENDENCY (Rule 7): approval requires the order's payment CAPTURED. Depth-3 cascade origin (Rule 4) and both compensating invariants (Rule 9)."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /damage-claims/{id}/review (decision=REJECT)"
        actor: ClaimsAdjuster
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "Customer(Order.customer_id): pending_claim_count -= 1; risk_score recomputed"

  - entity: OutputArtifact
    initial_state: AVAILABLE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: REVOKED
        trigger: "system: a newer OutputArtifact is generated for the same order (supersede)"
        actor: system
        preconditions: ["status == AVAILABLE"]
        side_effects: []
        note: "regeneration (restore) supersedes the prior artifact"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /output-artifacts/{id}/download when logical clock >= expires_at"
        actor: Customer
        preconditions: ["status == AVAILABLE", "clock >= expires_at"]
        side_effects: ["status = EXPIRED"]
        note: "lazy expiry on download attempt"

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: output-generate-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/output-artifacts"
    occ_field: "expected_order_version"
    description: |
      Generating an OutputArtifact against an Order whose version has advanced
      since the client last observed it is rejected. A prior generation (or
      restore/regeneration, which legitimately supersedes the earlier artifact)
      has already bumped the order's version, so the current caller's observed
      version is stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: order_subtotal
    trigger: "on POST /orders (estimate variant) and on final recompute after write-off (final variant)"
    algorithm: tiered_pricing
    formula: |
      # per-media-type line items (integer cents), then volume discount tier
      subtotal_raw = RATE_TAPE*tape + RATE_FILM*film + RATE_PHOTO*photo + RATE_AUDIO*audio
      item_count   = tape + film + photo + audio
      vol_pct      = 0.20 if item_count >= 40 else (0.10 if item_count >= 20 else 0.00)
      vol_discount = round_half_up(subtotal_raw * vol_pct)
      discounted_subtotal = subtotal_raw - vol_discount
      # returns discounted_subtotal (feeds order_total)
    input_set: |
      estimate variant: tape/film/photo/audio = declared_*_count from the Order.
      final variant: counts = number of this order's MediaItems per media_type
      whose status != WRITTEN_OFF.
    constants:
      RATE_TAPE: 1200
      RATE_FILM: 1500
      RATE_PHOTO: 50
      RATE_AUDIO: 1000
      VOL_TIER_1_MIN_ITEMS: 20
      VOL_TIER_1_PCT: 0.10
      VOL_TIER_2_MIN_ITEMS: 40
      VOL_TIER_2_PCT: 0.20
    precision: "integer cents; round_half_up on the discount multiplication"
    variants:
      - name: estimate
        when: "at order creation, from declared_*_count"
        difference: "uses customer-declared counts; persisted to estimate_total_cents"
      - name: final
        when: "after a MediaItem is written off (claim approval), recomputed from surviving MediaItems"
        difference: "counts exclude WRITTEN_OFF items; persisted to final_total_cents; differs from estimate whenever surviving counts != declared counts"

  - name: order_total
    trigger: "immediately after order_subtotal, on the same events"
    algorithm: aggregation
    formula: |
      discounted_subtotal = order_subtotal(...)                    # step 1
      rush_fee   = round_half_up(discounted_subtotal * RUSH_PCT) if turnaround == RUSH else 0   # step 2
      protection = (PROTECTION_BASE + round_half_up(discounted_subtotal * PROTECTION_PCT)) if lost_damage_protection else 0  # step 3
      pre_discount_total = discounted_subtotal + rush_fee + protection            # step 4  (MUST be computed before promo)
      # step 5: promo band is selected from pre_discount_total, NOT from subtotal
      if promo_code == "SAVE5":
          promo = 1000 if pre_discount_total >= 13000 else (500 if pre_discount_total >= 10000 else 0)
      else:
          promo = 0
      total = pre_discount_total - promo                            # step 6
    input_set: "single Order; reads discounted_subtotal from order_subtotal of the matching variant"
    constants:
      RUSH_PCT: 0.30
      PROTECTION_BASE: 1500
      PROTECTION_PCT: 0.02
      PROMO_BAND_HI_MIN: 13000
      PROMO_BAND_HI_AMT: 1000
      PROMO_BAND_LO_MIN: 10000
      PROMO_BAND_LO_AMT: 500
      SAVE5_CODE: "SAVE5"
    precision: "integer cents; round_half_up on rush and protection multiplications"
    variants:
      - name: estimate
        when: "order creation"
        difference: "uses estimate order_subtotal; persisted to estimate_total_cents"
      - name: final
        when: "final recompute after write-off"
        difference: "uses final order_subtotal; persisted to final_total_cents"

  - name: customer_risk_score
    trigger: "on DamageClaim create (provisional read) and on DamageClaim APPROVED/REJECTED (settled persist)"
    algorithm: weighted_scoring
    formula: |
      raw = W_APPROVED * approved_claim_count + W_PENDING * pending_claim_count
      score = min(100, raw)
    input_set: |
      approved_claim_count = count of this customer's DamageClaims in status APPROVED.
      pending_claim_count  = count in status SUBMITTED or UNDER_REVIEW.
    constants:
      W_APPROVED: 20
      W_PENDING: 5
      SCORE_CAP: 100
    precision: "integer 0..100"
    variants:
      - name: provisional
        when: "read at claim submission time to gauge risk"
        difference: "includes pending (SUBMITTED/UNDER_REVIEW) claims via W_PENDING"
      - name: settled
        when: "persisted to Customer.risk_score after a claim reaches APPROVED/REJECTED"
        difference: "counts only APPROVED claims (W_APPROVED); pending term is 0 for a customer with no open claims — diverges from provisional whenever open claims exist"

  - name: damage_payout
    trigger: "on DamageClaim review APPROVE"
    algorithm: threshold
    formula: |
      base = BASE_VALUE[media_type]              # per-type base replacement value
      declared = declared_value_cents if provided else base
      if Order.lost_damage_protection:
          payout = min(declared, PROTECTION_CAP)  # protection honors declared value up to the cap
      else:
          payout = min(base, NO_PROTECTION_CAP)   # limited liability; declared value ignored
    input_set: "single DamageClaim + its MediaItem.media_type + owning Order.lost_damage_protection"
    constants:
      BASE_VALUE: { TAPE: 4000, FILM: 6000, PHOTO: 200, AUDIO: 3000 }
      PROTECTION_CAP: 10000
      NO_PROTECTION_CAP: 1000
    precision: "integer cents"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path resource id exists (left-to-right in the path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "body foreign-key references (customer_id, machine_id, bin_id, media_item_id, order_id) resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/media-items, POST /batches, POST /batches/{id}/load, POST /damage-claims"
  - priority: 5
    category: auth
    check: "Customer acting on an Order/OutputArtifact must own it (Order.customer_id == X-User-ID)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "Customer-role calls that target an order or its artifacts"
  - priority: 10
    category: state
    check: "target entity is in the required state for the requested transition (generic guard)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 11
    category: state
    check: "output generation requires Order.fulfillment_status == READY"
    error_id: ERR_ORDER_NOT_READY
    http_status: 409
    applies_to: "POST /orders/{id}/output-artifacts"
  - priority: 12
    category: state
    check: "media intake requires Order.fulfillment_status == RECEIVED"
    error_id: ERR_ORDER_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /orders/{id}/media-items"
  - priority: 13
    category: state
    check: "starting a scan requires the item's Order.fulfillment_status IN {RECEIVED, PROCESSING} (cross-entity gate)"
    error_id: ERR_ORDER_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /batches/{id}/run"
  - priority: 20
    category: business_referential
    check: "DamageClaim.media_item_id must belong to DamageClaim.order_id (MediaItem.order_id == order_id)"
    error_id: ERR_MEDIA_NOT_IN_ORDER
    http_status: 422
    applies_to: "POST /damage-claims"
  - priority: 25
    category: business_constraint
    check: "batch reservation window [scheduled_start, scheduled_end) must not overlap another batch on the same machine (half-open; adjacency allowed)"
    error_id: ERR_MACHINE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /batches"
  - priority: 26
    category: business_constraint
    check: "assigning a MediaItem to a bin must not push the count of overlapping retention windows above StorageBin.capacity"
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/media-items"
  - priority: 27
    category: business_constraint
    check: "rescan requires qc_attempts < MAX_QC_ATTEMPTS"
    error_id: ERR_QC_ATTEMPTS_EXCEEDED
    http_status: 409
    applies_to: "POST /media-items/{id}/rescan"
  - priority: 30
    category: business_temporal
    check: "a DamageClaim must be filed within CLAIM_WINDOW_DAYS of the order's READY transition (clock <= ready_at + CLAIM_WINDOW_DAYS)"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /damage-claims"
  - priority: 35
    category: business_constraint
    check: "download requires output_type == CLOUD"
    error_id: ERR_NOT_DOWNLOADABLE
    http_status: 409
    applies_to: "POST /output-artifacts/{id}/download"
  - priority: 36
    category: business_temporal
    check: "CLOUD download requires logical clock < expires_at"
    error_id: ERR_DOWNLOAD_EXPIRED
    http_status: 409
    applies_to: "POST /output-artifacts/{id}/download"
  - priority: 40
    category: business_fiscal
    check: "output generation requires Order.payment_status == CAPTURED"
    error_id: ERR_PAYMENT_NOT_CAPTURED
    http_status: 402
    applies_to: "POST /orders/{id}/output-artifacts"
  - priority: 41
    category: business_fiscal
    check: "CLOUD download requires download_count < MAX_DOWNLOADS_PER_ARTIFACT"
    error_id: ERR_DOWNLOAD_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /output-artifacts/{id}/download"
  - priority: 42
    category: business_referential
    check: "DamageClaim approval requires Order.payment_status == CAPTURED"
    error_id: ERR_PAYMENT_NOT_CAPTURED
    http_status: 402
    applies_to: "POST /damage-claims/{id}/review"
  - priority: 45
    category: state
    check: "OCC: expected_order_version must equal Order.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/output-artifacts"
  - priority: 50
    category: business_constraint
    check: "required body fields present and enums/types valid; promo_code if present must be SAVE5"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 51
    category: business_constraint
    check: "promo_code present but not equal to SAVE5"
    error_id: ERR_INVALID_PROMO
    http_status: 422
    applies_to: "POST /orders"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/machines"
    description: "Create a digitization station."
    roles: [Admin]
    code: 201
    input: [name, kind, "capacity?"]
    output: Machine
    side_effects: []

  - method: POST
    path: "/storage-bins"
    description: "Create a storage bin with an overlap capacity."
    roles: [Admin]
    code: 201
    input: [label, capacity]
    output: StorageBin
    side_effects: []

  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [Admin]
    code: 201
    input: [email, full_name, state_code]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Read a customer (wallet, risk score, claim counters)."
    roles: [Admin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/orders"
    description: "Create an order; computes estimate order_total from declared counts."
    roles: [Customer, Admin]
    code: 201
    input: [customer_id, plan_tier, turnaround, output_option, "lost_damage_protection?", "is_gift?", "gift_recipient_email?", "promo_code?", "declared_tape_count?", "declared_film_count?", "declared_photo_count?", "declared_audio_count?"]
    output: Order
    side_effects: ["estimate_total_cents = order_total(estimate)", "fulfillment_status = QUOTED", "payment_status = UNPAID"]

  - method: GET
    path: "/orders/{id}"
    description: "Read an order."
    roles: [Admin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List/filter orders."
    roles: [Admin, Customer]
    code: 200
    input: ["customer_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/authorize-payment"
    description: "Authorize payment and release the media kit."
    roles: [Customer, Admin]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status = AUTHORIZED", "fulfillment_status = AWAITING_MEDIA", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/capture-payment"
    description: "Capture the authorized payment."
    roles: [Admin]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status = CAPTURED", "captured_total_cents = estimate_total_cents", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/receive"
    description: "Mark the customer's media as received at the facility."
    roles: [IntakeTech, Admin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status = RECEIVED", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/media-items"
    description: "Log a physical media item at intake into a storage bin (bin overlap capacity enforced)."
    roles: [IntakeTech, Admin]
    code: 201
    input: [media_type, bin_id, "barcode?"]
    output: MediaItem
    side_effects: ["status = LOGGED", "stored_at = clock", "retention_until = clock + RETENTION_DAYS", "Order.received_item_count += 1", "increments Order.version by 1"]

  - method: GET
    path: "/media-items/{id}"
    description: "Read a media item."
    roles: [Admin, LabTech, IntakeTech, Customer]
    code: 200
    input: []
    output: MediaItem
    side_effects: []

  - method: GET
    path: "/media-items"
    description: "List/filter media items (reverse-reachability for order_id, batch_id, bin_id)."
    roles: [Admin, LabTech, IntakeTech, Customer]
    code: 200
    input: ["order_id?", "batch_id?", "bin_id?", "status?", "limit?", "offset?"]
    output: MediaItem[]
    side_effects: []

  - method: POST
    path: "/batches"
    description: "Create a digitization batch reserving a machine time window (half-open overlap check)."
    roles: [LabTech, Admin]
    code: 201
    input: [machine_id, scheduled_start, scheduled_end, "capacity?"]
    output: Batch
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/batches/{id}"
    description: "Read a batch."
    roles: [Admin, LabTech]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List/filter batches (reverse-reachability for machine_id)."
    roles: [Admin, LabTech]
    code: 200
    input: ["machine_id?", "status?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/load"
    description: "Load a PREPPED-eligible (LOGGED) media item into the batch."
    roles: [LabTech, Admin]
    code: 200
    input: [media_item_id]
    output: Batch
    side_effects: ["MediaItem.status = PREPPED", "MediaItem.batch_id = batch.id", "batch.loaded_count += 1", "batch.status = LOADED"]

  - method: POST
    path: "/batches/{id}/run"
    description: "Start the batch; each loaded item begins scanning (cross-entity gate on the item's Order)."
    roles: [LabTech, Admin]
    code: 200
    input: []
    output: Batch
    side_effects: ["batch.status = RUNNING", "each loaded MediaItem: PREPPED -> SCANNING", "each affected Order RECEIVED -> PROCESSING"]

  - method: POST
    path: "/media-items/{id}/complete-scan"
    description: "Finish scanning; move item to QC_PENDING."
    roles: [LabTech, Admin]
    code: 200
    input: ["digitized_minutes?", "page_count?"]
    output: MediaItem
    side_effects: ["status = QC_PENDING", "records digitized_minutes/page_count"]

  - method: POST
    path: "/media-items/{id}/qc-review"
    description: "Render a QC decision (PASS/FAIL); FAIL at the last allowed attempt writes off the item."
    roles: [LabTech, Admin]
    code: 201
    input: [decision, "notes?"]
    output: MediaItem
    side_effects: ["qc_attempts += 1", "create QCReview", "PASS -> OUTPUT_READY", "FAIL -> QC_FAIL", "bubble-up Order READY on PASS"]

  - method: GET
    path: "/media-items/{id}/qc-reviews"
    description: "List QC reviews for a media item (reverse-reachability for QCReview)."
    roles: [Admin, LabTech]
    code: 200
    input: []
    output: QCReview[]
    side_effects: []

  - method: POST
    path: "/media-items/{id}/rescan"
    description: "Send a QC_FAIL item back to SCANNING (revision loop)."
    roles: [LabTech, Admin]
    code: 200
    input: []
    output: MediaItem
    side_effects: ["status = SCANNING"]

  - method: POST
    path: "/orders/{id}/output-artifacts"
    description: "Generate a deliverable for a READY, CAPTURED order (OCC on Order.version; regeneration supersedes prior artifact)."
    roles: [Customer, LabTech, Admin]
    code: 201
    input: [output_type, expected_order_version]
    output: OutputArtifact
    side_effects: ["status = AVAILABLE", "download_token minted", "expires_at = created_at + DOWNLOAD_EXPIRY_DAYS", "prior AVAILABLE artifact of this order -> REVOKED", "increments Order.version by 1"]

  - method: GET
    path: "/orders/{id}/output-artifacts"
    description: "List an order's output artifacts (reverse-reachability for OutputArtifact.order_id)."
    roles: [Admin, Customer, LabTech]
    code: 200
    input: []
    output: OutputArtifact[]
    side_effects: []

  - method: GET
    path: "/output-artifacts/{id}"
    description: "Read an output artifact."
    roles: [Admin, Customer, LabTech]
    code: 200
    input: []
    output: OutputArtifact
    side_effects: []

  - method: POST
    path: "/output-artifacts/{id}/download"
    description: "Record a CLOUD download (limit and expiry enforced)."
    roles: [Customer, Admin]
    code: 201
    input: []
    output: DownloadEvent
    side_effects: ["download_count += 1", "create DownloadEvent(sequence_number = new count)", "lazy: -> EXPIRED if clock >= expires_at"]

  - method: GET
    path: "/output-artifacts/{id}/downloads"
    description: "List download events for an artifact (reverse-reachability for DownloadEvent)."
    roles: [Admin, Customer, LabTech]
    code: 200
    input: []
    output: DownloadEvent[]
    side_effects: []

  - method: POST
    path: "/damage-claims"
    description: "File a lost/damage claim on a media item (referential + claim-window checks)."
    roles: [Customer, Admin]
    code: 201
    input: [order_id, media_item_id, claim_type, "declared_value_cents?"]
    output: DamageClaim
    side_effects: ["status = SUBMITTED", "Customer.pending_claim_count += 1", "Customer.risk_score recomputed"]

  - method: GET
    path: "/orders/{id}/damage-claims"
    description: "List an order's damage claims (reverse-reachability for DamageClaim.order_id)."
    roles: [Admin, Customer, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim[]
    side_effects: []

  - method: GET
    path: "/media-items/{id}/damage-claims"
    description: "List damage claims on a media item (reverse-reachability for DamageClaim.media_item_id)."
    roles: [Admin, Customer, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim[]
    side_effects: []

  - method: POST
    path: "/damage-claims/{id}/review"
    description: "Adjudicate a claim (APPROVE triggers the depth-3 write-off/refund cascade; REJECT closes it)."
    roles: [ClaimsAdjuster, Admin]
    code: 200
    input: [decision, "notes?"]
    output: DamageClaim
    side_effects: ["APPROVE: payout, MediaItem WRITTEN_OFF, Order refund + PARTIALLY_REFUNDED + final recompute, Customer wallet + risk", "REJECT: Customer pending_claim_count/risk recompute"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for endpoint"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Customer acting on an order/artifact they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or referenced FK does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity not in the required state for the requested transition"
  - id: ERR_ORDER_NOT_READY
    http: 409
    condition: "output generation attempted while Order.fulfillment_status != READY"
  - id: ERR_ORDER_NOT_RECEIVED
    http: 409
    condition: "intake or scan-start attempted while Order not RECEIVED/PROCESSING"
  - id: ERR_MEDIA_NOT_IN_ORDER
    http: 422
    condition: "claim media_item_id does not belong to claim order_id"
  - id: ERR_MACHINE_DOUBLE_BOOKED
    http: 409
    condition: "batch window overlaps another batch on the same machine"
  - id: ERR_BIN_CAPACITY_EXCEEDED
    http: 409
    condition: "bin overlapping-retention occupancy would exceed capacity"
  - id: ERR_QC_ATTEMPTS_EXCEEDED
    http: 409
    condition: "rescan attempted at qc_attempts >= MAX_QC_ATTEMPTS"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "claim filed after CLAIM_WINDOW_DAYS past order READY"
  - id: ERR_NOT_DOWNLOADABLE
    http: 409
    condition: "download attempted on a non-CLOUD artifact"
  - id: ERR_DOWNLOAD_EXPIRED
    http: 409
    condition: "CLOUD download attempted at/after expires_at"
  - id: ERR_DOWNLOAD_LIMIT_REACHED
    http: 409
    condition: "CLOUD download attempted at download_count >= MAX_DOWNLOADS_PER_ARTIFACT"
  - id: ERR_PAYMENT_NOT_CAPTURED
    http: 402
    condition: "output generation or claim approval while Order.payment_status != CAPTURED"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version != Order.version on output generation"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad enum, or bad type"
  - id: ERR_INVALID_PROMO
    http: 422
    condition: "promo_code present but not SAVE5"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Customer
    description: "End customer who places orders, pays, downloads deliverables, and files claims."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders (as self)"
      - "POST /orders/{id}/authorize-payment"
      - "POST /damage-claims"
      - "POST /output-artifacts/{id}/download"
    shared_operations:
      - "GET /orders, GET /orders/{id}, GET /customers/{id}"
      - "GET /media-items, GET /orders/{id}/output-artifacts, GET /output-artifacts/{id}"
      - "POST /orders/{id}/output-artifacts"

  - name: IntakeTech
    description: "Receiving-dock operator: marks orders received and logs media items into bins."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/receive"
      - "POST /orders/{id}/media-items"
    shared_operations:
      - "GET /media-items, GET /media-items/{id}"

  - name: LabTech
    description: "Lab operator: builds batches, runs digitization, performs QC and rescans, generates output."
    identity: opaque
    exclusive_operations:
      - "POST /batches, POST /batches/{id}/load, POST /batches/{id}/run"
      - "POST /media-items/{id}/complete-scan, POST /media-items/{id}/qc-review, POST /media-items/{id}/rescan"
    shared_operations:
      - "POST /orders/{id}/output-artifacts"
      - "GET /batches, GET /batches/{id}, GET /media-items"

  - name: ClaimsAdjuster
    description: "Adjudicates lost/damage claims."
    identity: opaque
    exclusive_operations:
      - "POST /damage-claims/{id}/review"
    shared_operations:
      - "GET /orders/{id}/damage-claims, GET /media-items/{id}/damage-claims"

  - name: Admin
    description: "Superset operator; may perform any operation and configure machines/bins/clock."
    identity: opaque
    exclusive_operations:
      - "POST /machines, POST /storage-bins, POST /customers"
      - "POST /_clock/set_current_utc"
      - "POST /orders/{id}/capture-payment"
    shared_operations:
      - "all business operations of the other roles"
