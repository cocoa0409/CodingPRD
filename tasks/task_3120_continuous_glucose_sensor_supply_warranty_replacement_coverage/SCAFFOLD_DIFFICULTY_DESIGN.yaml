      - name: business_safety_vs_business_referential_on_order_create
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PAYER_NOT_ACTIVE]
          - errors[ERR_COVERAGE_NOT_APPROVED]
        distinguishing_aspect: |
          Pair = business_safety (priority 7, payer not active) vs
          business_referential (priority 9, coverage verification not APPROVED
          for this prescription). When an order references a verification that
          is still PENDING (referential violation) — priority 9 fires.
          When verification is APPROVED but payer became TERMINATED —
          priority 7 fires. Distinct pair from state-vs-safety instance.
        test_recipe:
          setup:
            - "Two scenarios: (i) order placed against a still-PENDING verification; (ii) verification APPROVED, then payer manually TERMINATED via admin (modeled via separate payer entity terminated prior to a fresh verification on a fresh prescription), order placement attempted against the second verification"
