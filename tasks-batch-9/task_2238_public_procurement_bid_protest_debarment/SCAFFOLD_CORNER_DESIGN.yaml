              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { c_d97_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${c_d97_id}/hearing"
              payload: { hearing_summary: "no response filed" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /procurement/debarment-proceedings/${c_d97_id}/decision"
              payload: { outcome: "DEBARRED", rationale: "repeated nonperformance established" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "GET /procurement/debarment-proceedings/${c_d97_id}"
              payload: {}
              as: Vendor
              as_user_id: "${c_v97_id}"
              captures: { c_d97_v_stale: $.data.version }
            - call: "POST /procurement/debarment-proceedings/${c_d97_id}/reinstatement-petitions"
              payload: { remediation_evidence_codes: ["TRAINING_COMPLETED"], narrative: "crew retraining completed", expected_proceeding_version: "${c_d97_v_stale}" }
              as: Vendor
              as_user_id: "${c_v97_id}"
              captures: { c_rp97_id: $.data.id }
            - call: "POST /procurement/reinstatement-petitions/${c_rp97_id}/decision"
              payload: { outcome: "DENIED", decision_rationale: "remediation insufficient" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "GET /procurement/debarment-proceedings/${c_d97_id}"
              payload: {}
              as: Vendor
              as_user_id: "${c_v97_id}"
              captures: { c_d97_v_fresh: $.data.version }
          trigger:
            - call: "POST /procurement/debarment-proceedings/${c_d97_id}/reinstatement-petitions"
              payload: { remediation_evidence_codes: ["TRAINING_COMPLETED", "COMPLIANCE_AUDIT_PASSED"], narrative: "audit now passed as well", expected_proceeding_version: "${c_d97_v_stale}" }
              as: Vendor
              as_user_id: "${c_v97_id}"
          assert:
            - "HTTP 412 with $.data.error_id == ERR_STALE_PROCEEDING_VERSION"
            - "$.data.error_id != ERR_PETITION_ALREADY_PENDING: ReinstatementPetition.${c_rp97_id}.status is DENIED, not FILED"
            - "${c_d97_v_fresh} == ${c_d97_v_stale} + 1: the first petition create advanced the proceeding version and the petition decision did not"
            - "GET /procurement/debarment-proceedings/${c_d97_id}/reinstatement-petitions returns total_count 1"
            - "the identical body with expected_proceeding_version ${c_d97_v_fresh} returns HTTP 201 with status FILED and months_served_at_filing 6"

