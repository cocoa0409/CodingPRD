      - name: forfeit_cascade_runs_four_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.DraftPick.PENDING_to_FORFEITED.side_effects
        distinguishing_aspect: "One FORFEIT must drop the pick value, recompute club capital, flip the tier to SUSPENDED, void the open trade and void its conditional dimension, in that order."
        excluded_because:
          difficulty_instance: forfeit_drops_capital_then_suspends_tier_then_voids_trade_then_kills_conditional
          rationale: "The §1.8 transitive-cascade instance already asserts all four levels plus the cycle inventory in one trigger; the breadth pass keeps only the SUSPENDED-club proposal refusal, which is a different endpoint."
      - name: consent_revocation_cascade_runs_five_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Prospect.GRANTED_to_REVOKED.side_effects
        distinguishing_aspect: "Revoking consent must revoke the share, seal the evaluation, unverify the clearance and lapse the outstanding contract in one call."
        excluded_because:
          difficulty_instance: consent_revocation_revokes_share_seals_evaluation_unverifies_clearance_lapses_contract
          rationale: "The §1.8 transitive-cascade instance walks the whole medical and contract chain and asserts each level, so a breadth duplicate would be the identical recipe."
      - name: both_calculation_variants_are_produced_per_write
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.pick_trade_value_balance.variants
        distinguishing_aspect: "Every trade write must persist the authoritative chart variant and the advisory surplus variant together, with only the former enforced."
        excluded_because:
          difficulty_instance: trade_chart_variant_and_market_surplus_variant_carry_opposite_signs
          rationale: "The §1.8 dual-variant instance stores and asserts both variants on the same trade write, which is exactly this layer claim."
