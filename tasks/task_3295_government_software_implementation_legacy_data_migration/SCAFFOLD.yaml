  code: 200
  input:
  - result
  - waiver_reason?
  output: AcceptanceCriterion
  side_effects: []
- method: POST
  path: /programs/milestones/{id}/submit
  description: PLANNED -> READY_FOR_REVIEW; records submitter id
  roles:
  - VendorProjectManager
  code: 200
  input: []
  output: Milestone
  side_effects:
  - records last_submitted_by
  - increments Milestone.version by 1
- method: POST
  path: /programs/milestones/{id}/accept
  description: READY_FOR_REVIEW -> ACCEPTED (SoD); cascades phase completion and next-phase activation; readiness recompute
  roles:
  - AgencyProjectManager
  code: 200
  input: []
  output: Milestone
  side_effects:
  - milestone_payment calculation
  - phase completion cascade
  - readiness_score recompute
  - increments Milestone.version by 1
  - append AuditLogEntry
- method: POST
  path: /programs/milestones/{id}/reject
  description: READY_FOR_REVIEW -> REJECTED
  roles:
  - AgencyProjectManager
  code: 200
  input:
  - rejection_note
  output: Milestone
  side_effects:
  - increment rejection_count
  - increments Milestone.version by 1
- method: POST
  path: /programs/milestones/{id}/resubmit
  description: REJECTED -> READY_FOR_REVIEW (max 3 rejections)
  roles:
  - VendorProjectManager
  code: 200
  input: []
  output: Milestone
  side_effects:
  - increments Milestone.version by 1
- method: POST
  path: /programs/milestones/{id}/invoice
  description: ACCEPTED -> INVOICED
  roles:
  - VendorProjectManager
  code: 200
  input: []
  output: Milestone
  side_effects:
  - contract value cap check
  - increments Milestone.version by 1
- method: POST
  path: /programs/milestones/{id}/mark-paid
  description: INVOICED -> PAID; retainage release if go-live executed
  roles:
  - FinanceOfficer
  code: 200
  input: []
  output: Milestone
  side_effects:
  - retainage release
  - increments Milestone.version by 1
  - append AuditLogEntry
- method: POST
  path: /programs/contracts/{id}/workflow-processes
