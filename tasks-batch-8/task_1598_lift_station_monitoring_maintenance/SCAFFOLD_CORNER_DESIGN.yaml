            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0302", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_POSITION"

      - name: fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /pumps with non-existent station_id returns 422 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "00000000-0000-0000-0000-000000000000", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REFERENCE_NOT_FOUND"

      - name: zone_mismatch_on_spare_reserve
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_ZONE_MISMATCH]"]
        distinguishing_aspect: "Reserving a SparePump whose compatible_zone != station.service_zone returns ERR_ZONE_MISMATCH."
        test_recipe:
          setup: ["Station in Z1, spare in Z9"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0303", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/spare-pumps"
              payload: { asset_tag: "SP-0001", rated_gpm: 200, compatible_zone: "Z9" }
              as: UtilityAdmin
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/spare-pumps/${sp_id}/reserve"
              payload: { station_id: "${st_id}" }
              as: MaintenancePlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ZONE_MISMATCH"

      - name: runtime_reading_out_of_order_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_READING_OUT_OF_ORDER]"]
        distinguishing_aspect: "RuntimeReading with recorded_at < prior reading's recorded_at returns ERR_READING_OUT_OF_ORDER."
        test_recipe:
          setup: ["Pump with a reading at 2026-08-01T05:00:00Z"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0304", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T05:00:00Z", run_hours_delta: 1.0, starts_count: 1, source: "SCADA" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T04:00:00Z", run_hours_delta: 1.0, starts_count: 1, source: "SCADA" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_READING_OUT_OF_ORDER"

      - name: grease_depth_post_must_be_less_than_pre
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_GREASE_DEPTH_INVALID]"]
        distinguishing_aspect: "Completing a cleaning with grease_depth_inches_post >= grease_depth_inches_pre returns ERR_GREASE_DEPTH_INVALID."
        test_recipe:
          setup: ["IN_PROGRESS cleaning with grease_depth_inches_pre=5.0"]
          setup_api_calls:
