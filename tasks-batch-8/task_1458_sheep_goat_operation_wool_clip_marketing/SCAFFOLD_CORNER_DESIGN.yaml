# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sheep & Goat Operation & Wool Clip Marketing
# Breadth sweep over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_flock_applies_defaults
        claim_type: creation_defaults_system_fields
        grounds: [entities.Flock]
        distinguishing_aspect: "POST /api/flocks with minimal fields returns 201 with system id/created_at/version==1, default guardian_dog_count==0, flock_status==ACTIVE, current_headcount==baseline_headcount."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/flocks", payload: { flock_name: "Default Ranch", species: "GOAT", baseline_headcount: 120 }, as: RanchManager, captures: { fl: $.data.id } }
          assert:
            - "Flock.${fl}: id is a UUID, created_at/updated_at present, version == 1"
            - "guardian_dog_count == 0 (default), flock_status == ACTIVE (initial state)"
            - "current_headcount == 120 (initialized from baseline_headcount), withdrawal_until == null"

      - name: create_flock_missing_required_species_returns_400
        claim_type: required_fields
        grounds: [entities.Flock.fields.species, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required enum field species is rejected with ERR_VALIDATION before any state or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/flocks", payload: { flock_name: "No Species Ranch", baseline_headcount: 100 }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, http status == 400; no Flock row created"

      - name: create_flock_invalid_enum_species_returns_400
        claim_type: type_constraints
        grounds: [entities.Flock.fields.species, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "species must be SHEEP or GOAT; LLAMA is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/flocks", payload: { flock_name: "Llama Ranch", species: "LLAMA", baseline_headcount: 100 }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, http status == 400"

      - name: get_flock_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent flock id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/flocks/00000000-0000-0000-0000-000000000000", payload: {}, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http status == 404"

      - name: list_flocks_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope, endpoints.GET /api/flocks]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed pagination envelope."
        test_recipe:
          setup: ["three flocks exist"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "P1", species: "SHEEP", baseline_headcount: 100 }, as: RanchManager }
            - { call: "POST /api/flocks", payload: { flock_name: "P2", species: "SHEEP", baseline_headcount: 100 }, as: RanchManager }
            - { call: "POST /api/flocks", payload: { flock_name: "P3", species: "GOAT", baseline_headcount: 100 }, as: RanchManager }
          trigger:
            - { call: "GET /api/flocks", payload: { limit: 2, offset: 0 }, as: RanchManager }
            - { call: "GET /api/flocks", payload: { limit: 2, offset: 2, species: "GOAT" }, as: RanchManager }
          assert:
            - "Page 1: data length == 2, total_count == 3, has_more == true"
            - "Filtered page (species=GOAT, offset 2 is clamped to the single GOAT row): data length == 1, total_count == 1, has_more == false"

      - name: birth_record_immutable_event_entity
        claim_type: immutability
        grounds: [entities.BirthRecord]
        distinguishing_aspect: "BirthRecord has common_fields: false — its create response exposes id and created_at but no version/updated_at, and the scaffold declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); season walked to LAMBING (clock at expected_lambing_start 2026-12-30)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Event Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "LAMBING" }, as: RanchManager }
          trigger:
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2026-12-30T06:00:00Z", births_reported: 12, born_alive: 11, born_dead: 1 }, as: RangeHand, captures: { br: $.data.id } }
          assert:
            - "BirthRecord.${br} response contains id and created_at and contains no version field"
            - "POST /api/birth-records is the only write surface: no PATCH/PUT/DELETE /api/birth-records endpoint exists in §1.5"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: breeding_season_full_chain_with_clock_gates
        claim_type: valid_transition_and_computed_fields
        grounds: [state_machines.BreedingSeason, calculations.lambing_rate, "errors[ERR_BIRTH_OUTSIDE_WINDOW]", "errors[ERR_BIRTH_COUNT_MISMATCH]"]
        distinguishing_aspect: "The six-state season chain PLANNED->BREEDING->GESTATION->LAMBING->WEANING->CLOSED is walked with clock gates at each step; births outside the lambing window and mismatched counts are rejected mid-chain; final totals and lambing rate reconcile."
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); season ewes_bred 200, breeding 2026-08-05..2026-09-19 (expected_lambing_start 2026-12-30 = +147 days)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Chain Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
          trigger:
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "LAMBING" }, as: RanchManager }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2026-12-29T00:00:00Z", births_reported: 5, born_alive: 5, born_dead: 0 }, as: RangeHand, captures: { err1: $.data.error_id } }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2027-01-02T00:00:00Z", births_reported: 10, born_alive: 9, born_dead: 0 }, as: RangeHand, captures: { err2: $.data.error_id } }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2026-12-30T06:00:00Z", births_reported: 100, born_alive: 90, born_dead: 10 }, as: RangeHand }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2027-01-05T06:00:00Z", births_reported: 50, born_alive: 48, born_dead: 2 }, as: RangeHand }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-13T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "WEANING" }, as: RanchManager }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "CLOSED" }, as: RanchManager }
          assert:
            - "Out-of-window birth (2026-12-29 < expected_lambing_start): err1 == ERR_BIRTH_OUTSIDE_WINDOW (422)"
            - "Mismatched birth (10 != 9 + 0): err2 == ERR_BIRTH_COUNT_MISMATCH (422)"
            - "Season reached CLOSED via BREEDING(09-19 gate) -> GESTATION -> LAMBING(12-30 gate) -> WEANING(02-13 gate) -> CLOSED"
            - "BreedingSeason.${sn}: total_born == 150, total_born_alive == 138, lambing_rate_pct == 69.0"
            - "Flock.${fl}.current_headcount == 638 (500 + 138 live births)"

      - name: season_gestation_too_early_returns_422
        claim_type: precondition_enforcement
        grounds: [state_machines.BreedingSeason.BREEDING_to_GESTATION, "errors[ERR_SEASON_TOO_EARLY]"]
        distinguishing_aspect: "GESTATION before the clock reaches breeding_end_date is rejected with the temporal error, not a state error."
        test_recipe:
          setup: ["Flock (SHEEP, 500); season in BREEDING; clock still 2026-08-01 (default, before breeding_end 2026-09-19)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Early Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
          trigger:
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEASON_TOO_EARLY (422); season stays BREEDING"

      - name: season_cancel_from_gestation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BreedingSeason, "errors[ERR_SEASON_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is reachable only from PLANNED or BREEDING; from GESTATION (lambs on the way) cancel is rejected, and birth recording in GESTATION is rejected with the same state error."
        test_recipe:
          setup: ["Flock (SHEEP, 500); season in GESTATION (clock 2026-09-19)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "NoCancel Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager }
          trigger:
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "CANCELLED" }, as: RanchManager, captures: { err1: $.data.error_id } }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2026-12-30T06:00:00Z", births_reported: 4, born_alive: 4, born_dead: 0 }, as: RangeHand, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SEASON_INVALID_STATE (409) — no GESTATION -> CANCELLED transition"
            - "err2 == ERR_SEASON_INVALID_STATE (409) — births recordable only while LAMBING"

      - name: season_terminal_closed_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BreedingSeason, "errors[ERR_SEASON_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED season accepts no further transitions."
        test_recipe:
          setup: ["Flock (SHEEP, 500); season walked PLANNED->BREEDING->GESTATION->LAMBING->WEANING->CLOSED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Terminal Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "LAMBING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-13T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "WEANING" }, as: RanchManager }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "CLOSED" }, as: RanchManager }
          trigger:
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEASON_INVALID_STATE (409); season remains CLOSED"

      - name: open_season_uniqueness_rejected
        claim_type: constraint_validation
        grounds: ["validations[priority=15]", "errors[ERR_OPEN_SEASON_EXISTS]"]
        distinguishing_aspect: "A flock may have only one open season; creating a second while the first is BREEDING is rejected."
        test_recipe:
          setup: ["Flock (SHEEP, 500) with a season in BREEDING"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "OneSeason Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
          trigger:
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-winter", ewes_bred: 100, breeding_start_date: "2026-10-01T00:00:00Z", breeding_end_date: "2026-11-15T00:00:00Z" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_SEASON_EXISTS (409); only one season exists for flock ${fl}"

      - name: move_complete_from_planned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GrazingMove, "errors[ERR_MOVE_INVALID_STATE]"]
        distinguishing_aspect: "A PLANNED move cannot be COMPLETED directly; it must pass through ACTIVE."
        test_recipe:
          setup: ["Flock (SHEEP, 400); Pasture P; PLANNED move"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Move Ranch", species: "SHEEP", baseline_headcount: 400 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "North Pivot", acres: 200.0, carrying_capacity_head: 400 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 100 }, as: RangeHand, captures: { mv: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "COMPLETED" }, as: RangeHand, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MOVE_INVALID_STATE (409); move stays PLANNED and Pasture.${pas}.occupied_head_count == 0"

      - name: shearing_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShearingEvent, "errors[ERR_SHEARING_INVALID_STATE]"]
        distinguishing_aspect: "Complete is valid only from IN_PROGRESS; from SCHEDULED it is rejected and no WoolClip is created."
        test_recipe:
          setup: ["Flock (SHEEP, 500); crew; SCHEDULED event (never started)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Shear Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew S", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand, captures: { err: $.data.error_id } }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager }
          assert:
            - "error_id == ERR_SHEARING_INVALID_STATE (409); event stays SCHEDULED"
            - "GET /api/wool-clips?shearing_event_id=${ev} returns total_count == 0 (no clip created)"

      - name: consignment_sell_from_tendered_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Consignment, "errors[ERR_CONSIGNMENT_INVALID_STATE]"]
        distinguishing_aspect: "sell is valid only from ADVANCED; from TENDERED it is rejected."
        test_recipe:
          setup: ["Flock; clip; lot 100.0 lbs GRADED; consignment TENDERED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Sell Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew SE", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "S1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-S" }, as: RanchManager, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /api/consignments/${con}/sell", payload: { sale_gross_cents: 50000 }, as: WoolPoolOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSIGNMENT_INVALID_STATE (409); consignment stays TENDERED with sale_gross_cents == null"

      - name: core_test_lock_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CoreTest, "errors[ERR_CORE_TEST_INVALID_STATE]"]
        distinguishing_aspect: "LOCKED is reachable only from RESULTED; locking a SUBMITTED test (no lab results yet) is rejected."
        test_recipe:
          setup: ["Flock; clip; lot GRADED; CoreTest SUBMITTED by wpo-1"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Test Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew CT", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "T1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-CT1" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct: $.data.id } }
          trigger:
            - { call: "POST /api/core-tests/${ct}/transitions", payload: { to: "LOCKED" }, as: RanchManager, as_user_id: "rm-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CORE_TEST_INVALID_STATE (409); test stays SUBMITTED; lot certified fields remain null"

      - name: loss_report_verify_from_reported_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LossReport, "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is reachable only from UNDER_REVIEW; verifying a fresh REPORTED report is rejected and headcount is unchanged."
        test_recipe:
          setup: ["Flock (SHEEP, 500); LossReport of 6 head in REPORTED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Report Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/loss-reports", payload: { flock_id: "${fl}", loss_date: "2026-08-10T00:00:00Z", head_lost: 6, predator_type: "MOUNTAIN_LION", guardian_on_duty: false }, as: RangeHand, captures: { lr: $.data.id } }
          trigger:
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "VERIFIED" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_INVALID_STATE (409); report stays REPORTED"
            - "Flock.${fl}.current_headcount == 500 (no cascade fired)"

      - name: sale_cancel_after_load_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LivestockSale, "errors[ERR_SALE_INVALID_STATE]"]
        distinguishing_aspect: "Cancel exists only on delivery PENDING; a LOADED sale cannot be cancelled."
        test_recipe:
          setup: ["Flock (SHEEP, 500); MEAT DIRECT sale paid and LOADED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Cancel Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 10, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-09-20T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 200000 }, as: RanchManager }
            - { call: "POST /api/livestock-sales/${sale}/load", payload: {}, as: RangeHand }
          trigger:
            - { call: "POST /api/livestock-sales/${sale}/cancel", payload: {}, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SALE_INVALID_STATE (409); delivery_status stays LOADED, payment_status stays PAID"

      - name: sale_cancel_paid_refunds_compensation
        claim_type: side_effect_compensation
        grounds: [state_machines.LivestockSale]
        distinguishing_aspect: "Cancelling a PAID sale from PENDING compensates: payment flips to REFUNDED and flock headcount is untouched because the sale never delivered."
        test_recipe:
          setup: ["Flock (GOAT, 500); BREEDING sale 10 head at 45000, PAID, still PENDING"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Refund Ranch", species: "GOAT", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "BREEDING", channel: "DIRECT", head_count: 10, per_head_price_cents: 45000, scheduled_date: "2026-09-20T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 450000 }, as: RanchManager }
          trigger:
            - { call: "POST /api/livestock-sales/${sale}/cancel", payload: {}, as: RanchManager }
          assert:
            - "LivestockSale.${sale}: delivery_status == CANCELLED and payment_status == REFUNDED (compensation fired)"
            - "Flock.${fl}.current_headcount == 500 (no decrement — sale never DELIVERED)"

      - name: consignment_reject_returns_lot_to_graded
        claim_type: side_effect_cross_entity
        grounds: [state_machines.Consignment.TENDERED_to_REJECTED, state_machines.WoolLot]
        distinguishing_aspect: "Pool rejection cascades cross-entity: the consignment goes REJECTED and the lot returns CONSIGNED -> GRADED, making it consignable again."
        test_recipe:
          setup: ["Flock; clip; lot GRADED 100.0 lbs; consignment TENDERED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Reject Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew RJ", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "R1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-RJ" }, as: RanchManager, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "REJECTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-RJ2" }, as: RanchManager, captures: { con2: $.data.id } }
          assert:
            - "Consignment.${con}.consignment_status == REJECTED and WoolLot.${lot}.lot_status == GRADED"
            - "Re-consignment succeeds: Consignment.${con2}.consignment_status == TENDERED (lot is consignable again)"

      - name: flock_retire_while_busy_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Flock.ACTIVE_to_RETIRED, "errors[ERR_FLOCK_BUSY]"]
        distinguishing_aspect: "Retire is guarded by five child-aggregate checks; a flock with merely a PLANNED season is busy and cannot be retired."
        test_recipe:
          setup: ["Flock (SHEEP, 500) with a PLANNED season"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Busy Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager }
          trigger:
            - { call: "POST /api/flocks/${fl}/retire", payload: {}, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FLOCK_BUSY (409); flock_status stays ACTIVE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: treatment_efficacy_and_resistance_threshold
        claim_type: correct_result_and_threshold
        grounds: [calculations.treatment_efficacy]
        distinguishing_aspect: "Efficacy rounds half-up to 1 decimal and the resistance threshold is strict: 88.0 clears, 75.0 flags resistance (efficacy < 80.0)."
        test_recipe:
          setup: ["Flock (SHEEP, 500) with two treatments"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Epg Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Moxidectin", treatment_date: "2026-08-05T00:00:00Z", withdrawal_days: 7, fecal_egg_count_before: 500 }, as: RangeHand, captures: { trA: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Levamisole", treatment_date: "2026-08-06T00:00:00Z", withdrawal_days: 10, fecal_egg_count_before: 200 }, as: RangeHand, captures: { trB: $.data.id } }
          trigger:
            - { call: "POST /api/parasite-treatments/${trA}/follow-up", payload: { fecal_egg_count_after: 60 }, as: RangeHand }
            - { call: "POST /api/parasite-treatments/${trB}/follow-up", payload: { fecal_egg_count_after: 50 }, as: RangeHand }
          assert:
            - "ParasiteTreatment.${trA}: efficacy_pct == 88.0 and resistance_flag == false"
            - "ParasiteTreatment.${trB}: efficacy_pct == 75.0 and resistance_flag == true"
            - "Flock.${fl}.withdrawal_until == 2026-08-16T00:00:00Z (max of 08-05+7d and 08-06+10d)"

      - name: treatment_efficacy_zero_baseline_null
        claim_type: boundary_edge
        grounds: [calculations.treatment_efficacy]
        distinguishing_aspect: "Division guard: fecal_egg_count_before == 0 yields efficacy_pct null (not an error, not 0) and resistance_flag false."
        test_recipe:
          setup: ["Flock (SHEEP, 500); one treatment with before == 0"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "ZeroEpg Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Moxidectin", treatment_date: "2026-08-05T00:00:00Z", withdrawal_days: 7, fecal_egg_count_before: 0 }, as: RangeHand, captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /api/parasite-treatments/${tr}/follow-up", payload: { fecal_egg_count_after: 0 }, as: RangeHand }
          assert:
            - "ParasiteTreatment.${tr}: efficacy_pct == null and resistance_flag == false"

      - name: grazing_invoice_window_clamp_bonus_and_move_cascade
        claim_type: correct_result_with_clamping
        grounds: [calculations.grazing_invoice, state_machines.GrazingContract.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "Head-days clamp to the service-window intersection: a move running 09-25..10-05 against a window ending 09-30 contributes only 5 days (400 head * 5 = 2000 head-days); completion auto-completes the ACTIVE move."
        test_recipe:
          setup:
            - "Flock (SHEEP, 800); contract ACTIVE (window 2026-09-01..2026-09-30, rate 100, min 50, max 600, target 70)"
            - "Contract move of 400 head, 2026-09-25..2026-10-05, ACTIVATED on 09-25"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Clamp Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Vineyard Co", parcel_name: "Block A", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 100, min_head: 50, max_head: 600, target_cover_reduction_pct: 70.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-25T00:00:00Z", move_end: "2026-10-05T00:00:00Z", head_count: 400 }, as: RangeHand, captures: { mv: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-25T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "ACTIVE" }, as: RangeHand }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-contracts/${gc}/complete", payload: { achieved_cover_reduction_pct: 72.0 }, as: RanchManager }
          assert:
            - "GrazingMove.${mv}.move_status == COMPLETED (completion cascade)"
            - "GrazingContract.${gc}: head_days == 2000 (clamped to 5 in-window days), breach_flag == false"
            - "GrazingContract.${gc}.invoice_cents == 220000 (gross 200000 + bonus 20000, bonus under the 250000 cap)"

      - name: grazing_invoice_breach_penalty
        claim_type: correct_result_with_flag
        grounds: [calculations.grazing_invoice, entities.GrazingContract.fields.breach_flag]
        distinguishing_aspect: "A breached contract still earns the vegetation bonus but also takes the 20% penalty: 800000 gross + 80000 bonus - 160000 penalty = 720000."
        test_recipe:
          setup:
            - "Flock (SHEEP, 800); contract ACTIVE (min_head 100, max 600, rate 100, target 70, window 2026-09-01..09-30)"
            - "Contract move 400 head 09-05..09-25 ACTIVATED; then a VERIFIED loss of 750 head drops the flock to 50 (< min_head 100) -> breach"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Breach Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Orchard Co", parcel_name: "Rows 1-9", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 100, min_head: 100, max_head: 600, target_cover_reduction_pct: 70.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-05T00:00:00Z", move_end: "2026-09-25T00:00:00Z", head_count: 400 }, as: RangeHand, captures: { mv: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "ACTIVE" }, as: RangeHand }
            - { call: "POST /api/loss-reports", payload: { flock_id: "${fl}", loss_date: "2026-09-10T00:00:00Z", head_lost: 750, predator_type: "MOUNTAIN_LION", guardian_on_duty: false }, as: RangeHand, captures: { lr: $.data.id } }
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "UNDER_REVIEW" }, as: RanchManager }
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "VERIFIED" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-contracts/${gc}/complete", payload: { achieved_cover_reduction_pct: 72.0 }, as: RanchManager }
          assert:
            - "GrazingContract.${gc}.breach_flag == true (set by the loss cascade while ACTIVE)"
            - "GrazingContract.${gc}: head_days == 8000 (400 head * 20 in-window days)"
            - "GrazingContract.${gc}.invoice_cents == 720000 (800000 + 80000 - 160000)"

      - name: holiday_premium_selection_and_volume_gate
        claim_type: correct_result_with_selector
        grounds: [calculations.holiday_premium_selection, calculations.sale_price]
        distinguishing_aspect: "Two overlapping windows: the selector picks the highest premium_pct (ORTHODOX_EASTER 26 over EASTER 20); the min_head volume gate halves the premium for a 150-head sale (13%) but not for a 250-head sale (26%)."
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); EASTER window 2026-03-20..2026-04-05 (20%, min 100); ORTHODOX_EASTER window 2026-04-01..2026-04-12 (26%, min 200)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Holiday Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/holiday-windows", payload: { holiday_name: "EASTER", window_start: "2026-03-20T00:00:00Z", window_end: "2026-04-05T00:00:00Z", premium_pct: 20.0, min_head: 100 }, as: RanchManager }
            - { call: "POST /api/holiday-windows", payload: { holiday_name: "ORTHODOX_EASTER", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-12T00:00:00Z", premium_pct: 26.0, min_head: 200 }, as: RanchManager }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "ETHNIC_MARKET", head_count: 250, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-04-03T00:00:00Z" }, as: RanchManager, captures: { s1: $.data.id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "ETHNIC_MARKET", head_count: 150, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-04-03T00:00:00Z" }, as: RanchManager, captures: { s2: $.data.id } }
          assert:
            - "LivestockSale.${s1}: applied_holiday_name == ORTHODOX_EASTER, premium_pct_applied == 26.0, booked_price_cents == 6300000 (5000000 + 1300000)"
            - "LivestockSale.${s2}: applied_holiday_name == ORTHODOX_EASTER, premium_pct_applied == 13.0 (volume gate halves it), booked_price_cents == 3390000 (3000000 + 390000)"

      - name: holiday_premium_empty_fallback
        claim_type: empty_set_fallback
        grounds: [calculations.holiday_premium_selection]
        distinguishing_aspect: "When no window covers the scheduled date the selector falls back cleanly: premium_pct_applied == 0, applied_holiday_name == null, price == gross."
        test_recipe:
          setup: ["Flock (SHEEP, 500); no holiday windows exist"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "NoWindow Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "ETHNIC_MARKET", head_count: 50, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-06-01T00:00:00Z" }, as: RanchManager, captures: { s: $.data.id } }
          assert:
            - "LivestockSale.${s}: booked_price_cents == 1000000 (50 * 100 * 200), premium_pct_applied == 0, applied_holiday_name == null"

      - name: headcount_reconciliation_chronological
        claim_type: correct_result
        grounds: [calculations.flock_headcount_reconciliation]
        distinguishing_aspect: "The derived headcount reconciles four event sources in order: baseline 500 + 138 live births - 6 verified losses - 40 delivered meat head = 592."
        test_recipe:
          setup: ["Flock (SHEEP, 500); season in LAMBING; two birth records; one verified loss; one delivered MEAT sale"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Ledger Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { flock_id: "${fl}", season_label: "2026-fall", ewes_bred: 200, breeding_start_date: "2026-08-05T00:00:00Z", breeding_end_date: "2026-09-19T00:00:00Z" }, as: RanchManager, captures: { sn: $.data.id } }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "BREEDING" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "GESTATION" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/breeding-seasons/${sn}/transitions", payload: { to: "LAMBING" }, as: RanchManager }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2026-12-30T06:00:00Z", births_reported: 100, born_alive: 90, born_dead: 10 }, as: RangeHand }
            - { call: "POST /api/birth-records", payload: { season_id: "${sn}", birth_date: "2027-01-05T06:00:00Z", births_reported: 50, born_alive: 48, born_dead: 2 }, as: RangeHand }
            - { call: "POST /api/loss-reports", payload: { flock_id: "${fl}", loss_date: "2027-01-10T00:00:00Z", head_lost: 6, predator_type: "EAGLE", guardian_on_duty: true }, as: RangeHand, captures: { lr: $.data.id } }
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "UNDER_REVIEW" }, as: RanchManager }
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "VERIFIED" }, as: RanchManager }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 40, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2027-01-15T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 800000 }, as: RanchManager }
            - { call: "POST /api/livestock-sales/${sale}/load", payload: {}, as: RangeHand }
          trigger:
            - { call: "POST /api/loss-reports", payload: { flock_id: "${fl}", loss_date: "2027-01-12T00:00:00Z", head_lost: 4, predator_type: "DOG", guardian_on_duty: true }, as: RangeHand, captures: { lr2: $.data.id } }
            - { call: "POST /api/loss-reports/${lr2}/transitions", payload: { to: "DISMISSED" }, as: RanchManager }
            - { call: "POST /api/livestock-sales/${sale}/deliver", payload: { actual_total_weight_lbs: 3900.0 }, as: RangeHand }
          assert:
            - "Flock.${fl}.current_headcount == 638 after births (500 + 138)"
            - "Flock.${fl}.current_headcount == 632 after the verified loss (638 - 6)"
            - "Flock.${fl}.current_headcount == 592 after the DISMISSED report (no decrement) and after delivery (632 - 40)"
            - "LivestockSale.${sale}.settled_price_cents == 780000 (3900 lbs * 200 cents/lb, no shrink on the sale)"
            - "LossReport.${lr2}.report_status == DISMISSED (dismissal is not a headcount event)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: sale_missing_required_shape_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "Request-shape validation (priority 3) runs before FK existence (priority 4): a sale missing sale_type AND pointing at a nonexistent flock returns ERR_VALIDATION, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB (the flock id does not exist)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "00000000-0000-0000-0000-000000000000", channel: "DIRECT", head_count: 5, scheduled_date: "2026-09-20T00:00:00Z" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400), NOT ERR_NOT_FOUND"

      - name: lot_weight_over_allocation_rejected
        claim_type: violation_to_error_with_boundary
        grounds: ["validations[priority=18]", "errors[ERR_WEIGHT_OVER_ALLOCATED]", calculations.clip_weight_reconciliation]
        distinguishing_aspect: "Allocation boundary: a lot of exactly the remaining net weight (100.0 lbs) is accepted (<=), and the next lot of 0.01 lbs is rejected."
        test_recipe:
          setup: ["Flock; clip greasy 120.0 / skirtings 20.0 (net 100.0)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Alloc Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew A", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 120.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "FULL", weight_lbs: 100.0 }, as: RanchManager, captures: { lot1: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "OVER", weight_lbs: 0.01 }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "WoolLot.${lot1} created with weight_lbs == 100.0 (exact net-weight equality allowed); clip unallocated_weight_lbs == 0.0"
            - "Second lot: error_id == ERR_WEIGHT_OVER_ALLOCATED (422)"

      - name: pasture_capacity_exceeded_standalone_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "With no overlapping move, a move of 101 head onto a 100-head pasture fails purely on capacity — isolating ERR_CAPACITY_EXCEEDED from ERR_PASTURE_OVERLAP."
        test_recipe:
          setup: ["Flock (SHEEP, 500); empty Pasture P capacity 100"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Cap Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "Small Trap", acres: 30.0, carrying_capacity_head: 100 }, as: RanchManager, captures: { pas: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 101 }, as: RangeHand, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CAPACITY_EXCEEDED (422); no move created on ${pas}"

      - name: contract_move_head_range_at_activation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_HEAD_OUT_OF_CONTRACT_RANGE]"]
        distinguishing_aspect: "The contract head range is enforced at ACTIVATION, not creation: the PLANNED move with 40 head (< min_head 50) is created fine but cannot be started."
        test_recipe:
          setup: ["Flock (SHEEP, 800); contract ACTIVE (min 50, max 600, window 2026-09-01..09-30); contract move of 40 head PLANNED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Range Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Utility ROW", parcel_name: "Segment 4", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 50, max_head: 600, target_cover_reduction_pct: 60.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-05T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 40 }, as: RangeHand, captures: { mv: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "ACTIVE" }, as: RangeHand, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HEAD_OUT_OF_CONTRACT_RANGE (422); move stays PLANNED"

      - name: duplicate_active_core_test_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_ACTIVE_TEST]"]
        distinguishing_aspect: "A lot with a SUBMITTED test refuses a second test; after the first is REJECTED a fresh test is allowed (REJECTED is terminal, not active)."
        test_recipe:
          setup: ["Flock; clip; lot GRADED; CoreTest t1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Dup Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew D", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "D1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-D1" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct1: $.data.id } }
          trigger:
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-D2" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/core-tests/${ct1}/transitions", payload: { to: "REJECTED" }, as: RanchManager, as_user_id: "rm-1" }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-D3" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct3: $.data.id } }
          assert:
            - "Second test while SUBMITTED: error_id == ERR_DUPLICATE_ACTIVE_TEST (409)"
            - "After rejecting t1: CoreTest.${ct3} created with test_status == SUBMITTED"

      - name: duplicate_open_consignment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_CONSIGNMENT_ALREADY_OPEN]"]
        distinguishing_aspect: "A lot with a TENDERED consignment refuses a second consignment until the first reaches a terminal state."
        test_recipe:
          setup: ["Flock; clip; lot GRADED; consignment TENDERED"]
          setup_api_calls:
