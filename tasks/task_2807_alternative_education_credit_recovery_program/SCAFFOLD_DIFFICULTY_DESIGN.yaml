            - "GET /proctor-sessions?course_enrollment_id=${enr_id}&status=SCHEDULED returns exactly 2 rows"

      - name: support_provider_aggregate_concurrency_closed_interval
        resource_entity: SupportProvider
        interval_semantics: "closed [start, end] comparison against an aggregate capacity of max_concurrent_students intersecting sessions (touching endpoints DO intersect)"
        grounds:
          - validations[priority=14]
          - errors[ERR_PROVIDER_CAPACITY_EXCEEDED]
          - entities.SupportProvider.fields.max_concurrent_students
          - endpoints[POST /support-sessions]
        distinguishing_aspect: |
          A different resource entity under the opposite interval convention: the provider tolerates
          two intersecting sessions, and 14:00-15:00 is rejected only because closed-interval
          comparison makes it touch the 13:00-14:00 session at 14:00 while also overlapping
          13:30-14:30 -- three intersecting sessions against max_concurrent_students 2. Under
