          difficulty_instance: dual_variant_calc / risk_score_screen_counts_future_exclusion_audit_does_not
          rationale: "The named §1.8 instance runs both variants of a dual-variant calculation over one dataset and pins the divergence to the variant's reference instant rather than to the inputs."

