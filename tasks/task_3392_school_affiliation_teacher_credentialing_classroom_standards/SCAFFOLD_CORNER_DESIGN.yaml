      - name: transfer_rejects_overdraft_and_cross_school
        claim_type: Action endpoint
        grounds:
          - errors.ERR_TRANSFER_EXCEEDS_ENROLLMENT
          - errors.ERR_TRANSFER_CROSS_SCHOOL
          - calculations.transfer_conservation
        distinguishing_aspect: "transfer-students with student_count 41 against a 40-student source fails 422 ERR_TRANSFER_EXCEEDS_ENROLLMENT, and a transfer toward another school's classroom fails 422 ERR_TRANSFER_CROSS_SCHOOL — both leave both classrooms' enrollment untouched."
        test_recipe:
          setup:
            - "School T with classroom CA (40 students); school U with classroom CU (5 students), same age_level."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "T School", display_name: "T2 Schoolhouse", uses_method_name: false, contact_email: "t2@x.org" }
