        claim_type: "immediate"
        grounds:
          - complexity_profile.consistency_model
          - calculations.claim_net_payable
          - calculations.builder_loss_ratio
          - calculations.claim_incurred_conservation
        distinguishing_aspect: "Under immediate consistency no follow-up read may disagree with the mutating response and no read may repair it: the routing response already carries the deductible, betterment and net payable, the payment response already carries the new paid and reserve balances, and the builder read taken straight afterwards reports the same incurred, ratio and posture that the payment computed - with no intervening write."
        test_recipe:
          setup:
            - "the canonical policy ACTIVE and PAID with a 2187500 STRUCTURAL claim investigated at 0.80"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
