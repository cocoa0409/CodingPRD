          Priority 38 has three shape legs, and each must fire on its own error: SINGLE_PARTICIPANT with a
          null scoped_participant_id, ALL_PARTICIPANTS with a non-null scoped_participant_id, and
          SENSITIVE_CATEGORY_RESTRICTION with an empty restricted_categories list. All three carry the
          correct expected_cluster_version, so none of them can be satisfied by the OCC check, and the
