  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_aoi_creation
        grounds:
          - validations.priority_8
          - validations.priority_30
          - errors.ERR_PERMIT_STATE_INVALID
          - errors.ERR_ALLOTMENT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          One POST /annual-operating-instructions request violates priority 8
          (category state: the permit is still PENDING_REVIEW, not ISSUED) AND priority 30
          (category business_fiscal: authorized_aums 1500 > Allotment.open_aums 1200). Only
          ERR_PERMIT_STATE_INVALID (409) may be returned. The paired control issues the permit
          and replays the identical body, at which point the previously masked
          ERR_ALLOTMENT_CAPACITY_EXCEEDED (422) surfaces — proving the fiscal check really was
          violated all along and was suppressed purely by priority order.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, one pasture and required_pasture_rotation_count 1"
            - "A permittee with a 1500-AUM LAND base property (qualified_aums 1500) and a permit in PENDING_REVIEW for 1200 AUMs — deliberately NOT issued"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Priority Pair Allotment", admin_unit_code: "NV-049", acres: 30000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a9_id: "$.data.id" }
            - call: "POST /allotments/${a9_id}/pastures"
              payload: { name: "Single Pasture", pasture_aum_capacity: 1200, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p12_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Masked Error Livestock", contact_email: "masked@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m9_id: "$.data.id" }
            - call: "POST /permittees/${m9_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T29N R56E Sec 04 NW", carrying_capacity_aums: 1500, controlled_since_date: "2013-02-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp9_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a9_id}", permittee_id: "${m9_id}", base_property_id: "${bp9_id}", requested_aums: 1200, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g9_id: "$.data.id" }
          trigger:
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g9_id}", grazing_year: 2026, authorized_aums: 1500, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { pp1_error_id: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_PERMIT_STATE_INVALID"
            - "the trigger does NOT return ERR_ALLOTMENT_CAPACITY_EXCEEDED even though authorized_aums 1500 > open_aums 1200"
            - "GrazingPermit.${g9_id}.permit_status == PENDING_REVIEW (unchanged)"
            - "Allotment.${a9_id}.allocated_aums == 0 and open_aums == 1200"
            - "paired control: POST /grazing-permits/${g9_id}/issue as u_officer_1 succeeds, then replaying the identical AOI body returns HTTP 422 with error_id ERR_ALLOTMENT_CAPACITY_EXCEEDED"
            - "paired control: with authorized_aums 1200 instead of 1500 the same request returns 201"

      - name: safety_beats_referential_on_permit_transfer
        grounds:
          - validations.priority_9
          - validations.priority_13
          - errors.ERR_ALLOTMENT_CLOSED
          - errors.ERR_BASE_PROPERTY_NOT_OWNED
        distinguishing_aspect: |
          A different error-category pair on a different endpoint: POST
          /grazing-permits/{permitId}/transfer violates priority 9 (category business_safety:
          the allotment is CLOSED under a FULL_CLOSURE order) AND priority 13 (category
          business_referential: the transfer reuses the TRANSFEROR's base property, which the
          transferee does not own). ERR_ALLOTMENT_CLOSED (409) must win over
          ERR_BASE_PROPERTY_NOT_OWNED (422); lifting the closure then re-running the same body
          reveals the referential error underneath, and only after both are fixed does the
          transfer return 201.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and one pasture, OPEN at permit issuance"
            - "Transferor permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
            - "Transferee permittee with their own 400-AUM LAND base property"
            - "A FULL_CLOSURE closure order issued on the allotment after the permit was issued, driving the allotment to CLOSED"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Closed Gate Allotment", admin_unit_code: "NV-050", acres: 30000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a10_id: "$.data.id" }
            - call: "POST /allotments/${a10_id}/pastures"
              payload: { name: "Gate Pasture", pasture_aum_capacity: 1200, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p13_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Transferor Cattle", contact_email: "transferor@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m10_id: "$.data.id" }
            - call: "POST /permittees/${m10_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T31N R58E Sec 08 SE", carrying_capacity_aums: 400, controlled_since_date: "2010-03-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp10_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Transferee Cattle", contact_email: "transferee@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m11_id: "$.data.id" }
            - call: "POST /permittees/${m11_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T31N R58E Sec 09 SW", carrying_capacity_aums: 400, controlled_since_date: "2015-05-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp11_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a10_id}", permittee_id: "${m10_id}", base_property_id: "${bp10_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g10_id: "$.data.id" }
            - call: "POST /grazing-permits/${g10_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /closure-orders"
              payload: { allotment_id: "${a10_id}", order_type: "FULL_CLOSURE", effective_start_date: "2026-08-15", effective_end_date: "2026-12-31", justification: "Rangeland fire rehabilitation requires complete rest of the allotment." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { co10_id: "$.data.id" }
          trigger:
            - call: "POST /grazing-permits/${g10_id}/transfer"
              payload: { transferee_permittee_id: "${m11_id}", base_property_id: "${bp10_id}", term_start_date: "2026-01-01", term_end_date: "2030-12-31", requested_aums: 300 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { pp2_error_id: "$.data.error_id" }
          assert:
            - "ClosureOrder.${co10_id}.reduction_pct == 1.0"
            - "Allotment.${a10_id}.allotment_status == CLOSED"
            - "the trigger returns HTTP 409 with error_id ERR_ALLOTMENT_CLOSED"
            - "the trigger does NOT return ERR_BASE_PROPERTY_NOT_OWNED"
            - "GrazingPermit.${g10_id}.permit_status == ISSUED (no TRANSFERRED side effect applied)"
            - "no successor permit exists with predecessor_permit_id == ${g10_id}"
            - "paired control: POST /closure-orders/${co10_id}/lift as u_officer_1 returns Allotment.allotment_status OPEN, then replaying the identical transfer body returns HTTP 422 with error_id ERR_BASE_PROPERTY_NOT_OWNED"
            - "paired control: after the lift, the same transfer with base_property_id ${bp11_id} returns 201 and sets GrazingPermit.${g10_id}.permit_status == TRANSFERRED"

  - rule_id: boundary_precision_check
    instances:
      - name: nonuse_run_ceiling_boundary_on_renewal
        grounds:
          - calculations.consecutive_nonuse_years
          - validations.priority_21
          - domain_constants.MAX_CONSECUTIVE_NONUSE_YEARS
          - errors.ERR_NONUSE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          The measured quantity is an integer RUN LENGTH (consecutive_nonuse_years) compared
          against MAX_CONSECUTIVE_NONUSE_YEARS = 3 at POST
          /grazing-permits/{permitId}/renew. Two permits are built identically except for the
          length of their permittee-elected non-use run: at exactly 2 (ceiling - 1) the renewal
          returns 201, at exactly 3 (the ceiling) it returns 409 — the comparison is `>=`, not
          `>`. Off-by-one either way flips one of the two assertions.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, one 300-AUM pasture and required_pasture_rotation_count 1"
            - "Permit A (150 AUMs, ISSUED) with fully-non-used ISSUED AOIs for 2026 and 2027, reason PERSONAL_CONVENIENCE => consecutive_nonuse_years 2"
