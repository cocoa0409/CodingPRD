# =============================================================================
# PRD Benchmark Scaffold — Excess & Surplus Lines Placement & Tax Filing
# Difficulty target: beyond Expert (§0.4 Expert band, pushed on coupling density)
# =============================================================================

scenario: |
  2205. Excess and Surplus Lines Placement & Tax Filing (surplus lines broker):
  diligent search documentation proving admitted market declinations by state,
  eligible surplus lines insurer verification against state white lists, home
  state determination for multi-state risks and single-state taxation rules,
  policy issuance with required surplus lines notices and stamping office
  submission, premium tax and stamping fee calculation, filing calendar and
  remittance, endorsement, cancellation and return-premium tax adjustments,
  broker licensing and affidavit requirements, market security review of
  non-admitted carriers

domain_name: "surplus-lines-placement-tax"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: flat
  # Fifteen peer entities linked by explicit foreign keys. No business entity is
  # nested inside another's URL path for identity purposes; nested GETs exist only
  # as reverse-reachability read channels. Chosen deliberately over `hybrid`.

  state_machine_shape: branching
  # Placement is cyclic (revision loop), MarketSecurityReview is branching with
  # divergent per-branch side-effect sets, and Policy carries four independent
  # parallel state dimensions (status x compliance_status x tax_status x
  # stamping_status).

  relationship_patterns:
    - one_to_many
    - many_to_many          # CarrierEligibility joins Carrier x StateProgram
    - self_referential      # Endorsement.supersedes_endorsement_id -> Endorsement.id
    - polymorphic           # TaxFilingLine.source_* points at Endorsement OR Cancellation
    - cross_aggregate       # FilingBatch aggregates lines across Policy aggregates

  role_model: segregation_of_duties
  # Two enforced separations: (1) the ComplianceOfficer who approved a carrier's
  # market security review may not sign an affidavit on a policy placed with that
  # carrier; (2) the TaxFiler who prepared a filing batch may not remit it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Broker & licensing ----------------------------------------------------
  - name: Broker
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: "Legal name of the surplus lines brokerage firm."
        constraints: "non-empty, max 200 chars"
      - name: home_state
        type: string
        source: input
        description: "Two-letter code of the state where the brokerage is resident-licensed."
        constraints: "exactly 2 uppercase ASCII letters"
      - name: status
        type: enum
        source: system
        description: "Operational status of the brokerage."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; set to ACTIVE at creation, SUSPENDED by POST /brokers/{id}/suspend"

  - name: BrokerLicense
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: "FK -> Broker.id; the brokerage holding this license."
      - name: state_code
        type: string
        source: input
        description: "Two-letter code of the licensing state."
        constraints: "exactly 2 uppercase ASCII letters"
      - name: license_number
        type: string
        source: input
        description: "License number issued by the state."
        constraints: "non-empty"
      - name: license_type
        type: enum
        source: input
        description: "Kind of license held."
        constraints: "one of {SURPLUS_LINES, RESIDENT_PRODUCER}"
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the license ceases to be effective."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while the logical clock is strictly before expires_on, LAPSED once the clock reaches or passes it."
        constraints: "one of {ACTIVE, LAPSED}; recomputed on every read, never stored as input"

  # --- Regulator configuration ----------------------------------------------
  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter code of the state this program configures."
        constraints: "exactly 2 uppercase ASCII letters; globally unique across StateProgram"
      - name: premium_tax_rate
        type: number
        source: input
        description: "Surplus lines premium tax rate applied to allocated taxable premium."
        constraints: "0 <= premium_tax_rate <= 0.15, at most 6 decimal places"
      - name: stamping_fee_rate
        type: number
        source: input
        description: "Stamping office fee rate applied to allocated taxable premium."
        constraints: "0 <= stamping_fee_rate <= 0.05, at most 6 decimal places"
      - name: stamping_fee_cap_cents
        type: integer
        source: input
        description: "Per-allocation ceiling on the stamping fee in cents; null means uncapped."
        default: null
        constraints: "null or >= 0"
      - name: stamping_office_required
        type: boolean
        source: input
        description: "True when policies whose home state is this state must be submitted to a stamping office."
      - name: allocation_method
        type: enum
        source: input
        description: "Which taxation variant this state applies to multi-state risks whose home state it is."
        constraints: "one of {HOME_STATE_SINGLE, ALLOCATED_MULTI}"
      - name: diligent_search_min_declinations
        type: integer
        source: input
        description: "Minimum count of valid admitted-market declinations required before a search may be completed."
        constraints: ">= 0"
      - name: export_list_exempts_search
        type: boolean
        source: input
        description: "True when a placement flagged as an export-list risk is exempt from the declination count requirement."
      - name: filing_frequency
        type: enum
        source: input
        description: "Cadence of the state's premium tax filing calendar."
        constraints: "one of {MONTHLY, QUARTERLY}"
      - name: filing_deadline_days
        type: integer
        source: input
        description: "Number of calendar days after the close of a filing period by which the batch is due."
        constraints: ">= 0"
      - name: return_premium_tax_refundable
        type: boolean
        source: input
        description: "True when return premium generates a negative premium tax line; false when premium tax already paid is non-refundable."
      - name: return_premium_stamping_refundable
        type: boolean
        source: input
        description: "True when return premium generates a negative stamping fee line; false when the stamping fee is non-refundable."
      - name: min_carrier_capital_surplus_cents
        type: integer
        source: input
        description: "Minimum carrier capital and surplus, in cents, for a carrier to be listable in this state."
        constraints: ">= 0"
      - name: required_notice_codes
        type: array
        source: input
        description: "Array of surplus lines notice codes that must be affixed to any policy whose home state is this state."
        constraints: "array of non-empty uppercase strings; may be empty"

  # --- Non-admitted carriers -------------------------------------------------
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: naic_number
        type: string
        source: input
        description: "NAIC company number of the non-admitted insurer."
        constraints: "non-empty; globally unique across Carrier"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the non-admitted insurer."
        constraints: "non-empty"
      - name: domicile_type
        type: enum
        source: input
        description: "Whether the insurer is domiciled in a US state or is an alien surplus lines insurer."
        constraints: "one of {US_STATE, ALIEN}"
      - name: capital_surplus_cents
        type: integer
        source: input
        description: "Policyholder capital and surplus in cents."
        constraints: ">= 0"
      - name: am_best_rating
        type: enum
        source: input
        description: "Financial strength rating used by the market security score."
        constraints: "one of {A_PLUS_PLUS, A_PLUS, A, A_MINUS, B_PLUS_PLUS, B_PLUS, NR}"
      - name: trust_fund_cents
        type: integer
        source: input
        description: "US trust fund balance in cents; relevant only to ALIEN insurers."
        default: 0
        constraints: ">= 0"
      - name: naic_quarterly_listing
        type: boolean
        source: input
        description: "True when the insurer appears on the NAIC quarterly listing of alien surplus lines insurers."
        default: false
      - name: security_status
        type: enum
        source: computed
        description: "Market security standing, written only by MarketSecurityReview decision side effects."
        default: UNREVIEWED
        constraints: "one of {UNREVIEWED, APPROVED, CONDITIONAL, DECLINED}"

  - name: CarrierEligibility
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the non-admitted insurer being listed."
      - name: state_program_id
        type: string
        source: input
        description: "FK -> StateProgram.id; the state whose white list this entry belongs to."
      - name: listing_status
        type: enum
        source: system
        description: "Whether the carrier currently sits on this state's white list."
        default: WHITE_LISTED
        constraints: "one of {WHITE_LISTED, REMOVED}"
      - name: listed_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which the white-list entry is effective."
      - name: removed_on
        type: datetime
        source: system
        description: "ISO 8601 UTC instant at which the entry was removed; null while WHITE_LISTED."
        default: null

  - name: MarketSecurityReview
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the insurer under market security review."
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, APPROVED, CONDITIONAL, DECLINED}"
      - name: score
        type: number
        source: computed
        description: "Market security score in [0, 100], computed when the review starts."
        default: null
      - name: variant_applied
        type: enum
        source: computed
        description: "Which market_security_score variant produced `score`."
        default: null
        constraints: "one of {INITIAL_REVIEW, RECERTIFICATION}; null before the review starts"
      - name: capital_surplus_at_review_cents
        type: integer
        source: system
        description: "Carrier.capital_surplus_cents pinned at the instant the review was decided."
        default: null
      - name: rating_at_review
        type: enum
        source: system
        description: "Carrier.am_best_rating pinned at the instant the review was decided."
        default: null
        constraints: "one of {A_PLUS_PLUS, A_PLUS, A, A_MINUS, B_PLUS_PLUS, B_PLUS, NR}; null until decided"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who decided the review; null until decided."
        default: null
      - name: conditions_note
        type: string
        source: input
        description: "Free-text conditions attached to a CONDITIONAL decision; null otherwise."
        default: null

  # --- Placement & diligent search ------------------------------------------
  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: system
        description: "FK -> Broker.id; taken from the X-User-ID of the PlacementBroker who created the placement."
      - name: insured_name
        type: string
        source: input
        description: "Name of the prospective insured."
        constraints: "non-empty"
      - name: principal_place_of_business_state
        type: string
        source: input
        description: "Two-letter code of the insured's principal place of business."
        constraints: "exactly 2 uppercase ASCII letters"
      - name: coverage_class
        type: enum
        source: input
        description: "Coverage class being placed."
        constraints: "one of {PROPERTY, GENERAL_LIABILITY, PROFESSIONAL_LIABILITY, EXCESS_CASUALTY, INLAND_MARINE}"
      - name: is_export_list_risk
        type: boolean
        source: input
        description: "True when the coverage appears on the home state's export list."
        default: false
      - name: state_exposures
        type: array
        source: input
        description: "Array of {state_code, insured_value_cents} objects describing per-state insured value for a multi-state risk."
        constraints: "non-empty; each state_code exactly 2 uppercase ASCII letters and unique within the array; each insured_value_cents an integer >= 0"
      - name: home_state
        type: string
        source: computed
        description: "Two-letter code of the home state, resolved by the home_state_determination waterfall at creation and never recomputed thereafter."
      - name: total_insured_value_cents
        type: integer
        source: computed
        description: "Sum of insured_value_cents across every entry in state_exposures."
      - name: declination_count
        type: integer
        source: computed
        description: "Count of valid declinations pinned at the instant the diligent search was last completed; 0 before that."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Placement lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SEARCH_IN_PROGRESS, SEARCH_COMPLETE, CHANGES_REQUESTED, BOUND}"

  - name: Declination
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; the placement this declination documents."
      - name: admitted_insurer_name
        type: string
        source: input
        description: "Name of the admitted insurer that declined the risk."
        constraints: "non-empty"
      - name: naic_number
        type: string
        source: input
        description: "NAIC company number of the declining admitted insurer."
        constraints: "non-empty"
      - name: state_code
        type: string
        source: input
        description: "Two-letter code of the state in which the admitted insurer declined."
        constraints: "exactly 2 uppercase ASCII letters"
      - name: declined_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the admitted insurer declined."
      - name: reason_code
        type: enum
        source: input
        description: "Reason the admitted insurer gave for declining."
        constraints: "one of {NO_APPETITE, CAPACITY, UNDERWRITING, RATE, NOT_LICENSED_FOR_CLASS}"
      - name: status
        type: enum
        source: system
        description: "Whether the declination still counts toward diligent search."
        default: RECORDED
        constraints: "one of {RECORDED, INVALIDATED}"

  # --- Policy & taxation -----------------------------------------------------
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; the placement this policy binds."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the non-admitted insurer writing the policy."
      - name: broker_id
        type: string
        source: system
        description: "FK -> Broker.id; copied from Placement.broker_id at issuance."
      - name: policy_number
        type: string
        source: input
        description: "Carrier-assigned policy number."
        constraints: "non-empty; globally unique across Policy"
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which coverage attaches."
      - name: expiration_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which coverage ends; must be strictly after effective_date."
      - name: original_gross_premium_cents
        type: integer
        source: input
        description: "Gross premium in cents as issued, before any endorsement; supplied at issuance and immutable thereafter."
        constraints: "> 0"
      - name: gross_premium_cents
        type: integer
        source: computed
        description: "original_gross_premium_cents plus the sum of premium_delta_cents across every ISSUED endorsement on this policy."
      - name: policy_fee_cents
        type: integer
        source: input
        description: "Carrier policy fee in cents; part of taxable premium."
        default: 0
        constraints: ">= 0"
      - name: broker_fee_cents
        type: integer
        source: input
        description: "Surplus lines broker fee in cents; explicitly excluded from taxable premium."
        default: 0
        constraints: ">= 0"
      - name: min_earned_premium_pct
        type: number
        source: input
        description: "Fraction of taxable premium the carrier retains as minimum earned premium on cancellation."
        default: 0
        constraints: "0 <= min_earned_premium_pct <= 1, at most 4 decimal places"
      - name: home_state
        type: string
        source: system
        description: "Two-letter home state code copied from Placement.home_state at issuance and never recomputed."
      - name: allocation_method_applied
        type: enum
        source: system
        description: "The home state's allocation_method pinned at issuance; governs every later tax computation on this policy."
        constraints: "one of {HOME_STATE_SINGLE, ALLOCATED_MULTI}"
      - name: taxable_premium_cents
        type: integer
        source: computed
        description: "gross_premium_cents plus policy_fee_cents; broker_fee_cents is never included."
      - name: total_tax_cents
        type: integer
        source: computed
        description: "Sum of tax_cents across this policy's PolicyStateAllocation rows; 0 while tax_status is UNCALCULATED."
        default: 0
      - name: total_stamping_fee_cents
        type: integer
        source: computed
        description: "Sum of stamping_fee_cents across this policy's PolicyStateAllocation rows; 0 while tax_status is UNCALCULATED."
        default: 0
      - name: notice_codes_affixed
        type: array
        source: system
        description: "Array of surplus lines notice codes recorded by POST /policies/{id}/affix-notices; empty at issuance."
        default: []
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle dimension."
        default: ISSUED
        constraints: "one of {ISSUED, CANCELLED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Notice and affidavit compliance dimension, independent of status, tax_status and stamping_status."
        default: PENDING_NOTICES
        constraints: "one of {PENDING_NOTICES, NOTICES_AFFIXED, COMPLIANT, DEFICIENT}"
      - name: tax_status
        type: enum
        source: system
        description: "Premium tax dimension, independent of status, compliance_status and stamping_status."
        default: UNCALCULATED
        constraints: "one of {UNCALCULATED, CALCULATED, ADJUSTED, FILED, REMITTED}"
      - name: stamping_status
        type: enum
        source: system
        description: "Stamping office dimension, independent of the other three dimensions; initialised from the home state's stamping_office_required at issuance."
        constraints: "one of {NOT_REQUIRED, PENDING, SUBMITTED, ACCEPTED, REJECTED}"
      - name: stamping_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the policy was submitted to the stamping office; null before submission."
        default: null

  - name: PolicyStateAllocation
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy whose taxable premium this row allocates."
      - name: state_code
        type: string
        source: computed
        description: "Two-letter code of the state receiving this slice of taxable premium."
      - name: allocation_pct
        type: number
        source: computed
        description: "Share of taxable premium allocated to state_code, rounded to 4 decimal places, round_half_up."
      - name: allocated_premium_cents
        type: integer
        source: computed
        description: "Integer cents of taxable premium allocated to state_code by the largest-remainder distribution."
      - name: premium_tax_rate_applied
        type: number
        source: system
        description: "StateProgram.premium_tax_rate pinned for state_code at the instant this row was first created."
      - name: stamping_fee_rate_applied
        type: number
        source: system
        description: "StateProgram.stamping_fee_rate pinned for state_code at the instant this row was first created."
      - name: tax_cents
        type: integer
        source: computed
        description: "allocated_premium_cents times premium_tax_rate_applied, rounded to whole cents, round_half_up."
      - name: stamping_fee_cents
        type: integer
        source: computed
        description: "Stamping fee in cents for this allocation, 0 when the state does not require a stamping office."
      - name: allocation_basis
        type: enum
        source: computed
        description: "Which premium_tax_and_stamping_fee variant produced this row."
        constraints: "one of {HOME_STATE_SINGLE, ALLOCATED_MULTI}"

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy being endorsed."
      - name: supersedes_endorsement_id
        type: string
        source: input
        description: "FK -> Endorsement.id; an earlier ISSUED endorsement on the same policy that this one replaces, or null."
        default: null
      - name: sequence_number
        type: integer
        source: system
        description: "1-based ordinal of this endorsement within its policy, assigned in creation order."
      - name: endorsement_type
        type: enum
        source: input
        description: "Nature of the endorsement."
        constraints: "one of {PREMIUM_INCREASE, PREMIUM_DECREASE, EXPOSURE_CHANGE, ADMINISTRATIVE}"
      - name: premium_delta_cents
        type: integer
        source: input
        description: "Signed change to gross premium in cents; must be 0 for ADMINISTRATIVE, > 0 for PREMIUM_INCREASE, < 0 for PREMIUM_DECREASE."
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the endorsement attaches; must fall within the policy term."
      - name: status
        type: enum
        source: system
        description: "Endorsement lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, VOIDED}"
      - name: tax_adjustment_cents
        type: integer
        source: computed
        description: "Policy total_tax_cents after this endorsement issued minus total_tax_cents immediately before; null while DRAFT."
        default: null
      - name: stamping_fee_adjustment_cents
        type: integer
        source: computed
        description: "Policy total_stamping_fee_cents after this endorsement issued minus the value immediately before; null while DRAFT."
        default: null

  - name: Cancellation
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy being cancelled."
      - name: cancellation_type
        type: enum
        source: input
        description: "Basis on which unearned premium is computed."
        constraints: "one of {FLAT, PRO_RATA, SHORT_RATE}"
      - name: cancellation_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which coverage ceases; must fall within the policy term."
      - name: status
        type: enum
        source: system
        description: "Cancellation lifecycle state."
        default: REQUESTED
        constraints: "one of {REQUESTED, PROCESSED}"
      - name: earned_premium_cents
        type: integer
        source: computed
        description: "Taxable premium retained by the carrier; null while REQUESTED."
        default: null
      - name: return_premium_cents
        type: integer
        source: computed
        description: "Taxable premium returned to the insured; null while REQUESTED."
        default: null
      - name: tax_refund_cents
        type: integer
        source: computed
        description: "Premium tax refunded across all allocations, expressed as a non-negative magnitude; null while REQUESTED."
        default: null
      - name: stamping_fee_refund_cents
        type: integer
        source: computed
        description: "Stamping fee refunded across all allocations, expressed as a non-negative magnitude; null while REQUESTED."
        default: null

  # --- Filing & remittance ---------------------------------------------------
  - name: TaxFilingLine
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> Policy.id; the policy this filing line reports."
      - name: state_program_id
        type: string
        source: system
        description: "FK -> StateProgram.id; the state this line is filed with."
      - name: filing_batch_id
        type: string
        source: system
        description: "FK -> FilingBatch.id; the batch that swept this line, or null while OPEN."
        default: null
      - name: source_endorsement_id
        type: string
        source: system
        description: "FK -> Endorsement.id; set when line_type is ENDORSEMENT, null otherwise."
        default: null
      - name: source_cancellation_id
        type: string
        source: system
        description: "FK -> Cancellation.id; set when line_type is CANCELLATION_RETURN, null otherwise."
        default: null
      - name: line_type
        type: enum
        source: system
        description: "What generated this line."
        constraints: "one of {NEW_BUSINESS, ENDORSEMENT, CANCELLATION_RETURN}"
      - name: period_key
        type: string
        source: system
        description: "Filing period this line falls into, derived from the current logical clock at the moment the line is created and formatted per the state's filing_frequency."
        constraints: "`YYYY-MM` when filing_frequency is MONTHLY, `YYYY-Qn` when QUARTERLY"
      - name: taxable_premium_cents
        type: integer
        source: system
        description: "Signed taxable premium reported by this line; negative on CANCELLATION_RETURN and on premium-decreasing endorsements."
      - name: tax_cents
        type: integer
        source: system
        description: "Signed premium tax reported by this line; negative when it reverses previously reported tax."
      - name: stamping_fee_cents
        type: integer
        source: system
        description: "Signed stamping fee reported by this line; negative when it reverses previously reported fee."
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle state of this line."
        default: OPEN
        constraints: "one of {OPEN, BATCHED, FILED, REMITTED, VOIDED}"

  - name: FilingBatch
    parent: null
    common_fields: true
    fields:
      - name: state_program_id
        type: string
        source: input
        description: "FK -> StateProgram.id; the state this batch is filed with."
      - name: broker_id
        type: string
        source: input
        description: "FK -> Broker.id; the brokerage on whose behalf the batch is filed."
      - name: period_key
        type: string
        source: input
        description: "Filing period covered by this batch."
        constraints: "`YYYY-MM` when the state's filing_frequency is MONTHLY, `YYYY-Qn` when QUARTERLY"
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle state."
        default: OPEN
        constraints: "one of {OPEN, PREPARED, SUBMITTED, REMITTED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TaxFiler who prepared the batch; null while OPEN."
        default: null
      - name: remitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TaxFiler who remitted the batch; null until REMITTED."
        default: null
      - name: line_count
        type: integer
        source: computed
        description: "Count of TaxFilingLine rows swept into this batch; 0 while OPEN."
        default: 0
      - name: total_tax_cents
        type: integer
        source: computed
        description: "Signed sum of tax_cents across the batch's lines; 0 while OPEN."
        default: 0
      - name: total_stamping_fee_cents
        type: integer
        source: computed
        description: "Signed sum of stamping_fee_cents across the batch's lines; 0 while OPEN."
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "Late filing penalty in cents; 0 while OPEN and 0 whenever the batch is not late."
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: "total_tax_cents plus total_stamping_fee_cents plus penalty_cents; may be negative when net return premium exceeds new business."
        default: 0
      - name: due_date
        type: datetime
        source: computed
        description: "Last instant by which the batch may be submitted without penalty; null while OPEN."
        default: null
      - name: late
        type: boolean
        source: computed
        description: "True when the logical clock at preparation was strictly after due_date."
        default: false

  - name: Affidavit
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy this affidavit attests to."
      - name: affidavit_type
        type: enum
        source: input
        description: "Which statutory affidavit this record represents."
        constraints: "one of {DILIGENT_SEARCH, PREMIUM_TAX}"
      - name: declination_count_attested
        type: integer
        source: input
        description: "Number of admitted-market declinations the broker swears to."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Affidavit lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SIGNED}"
      - name: signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the principal who signed; null while DRAFT."
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the affidavit was signed; null while DRAFT."
        default: null

# =============================================================================
# §1.2 State Machine Table
#
# Non-linear shapes, by entity:
#   Placement              — CYCLIC (SEARCH_COMPLETE -> CHANGES_REQUESTED ->
#                            SEARCH_IN_PROGRESS -> SEARCH_COMPLETE revision loop)
#   MarketSecurityReview   — BRANCHING (UNDER_REVIEW -> {APPROVED, CONDITIONAL,
#                            DECLINED}, divergent side-effect sets per branch)
#   Policy                 — PARALLEL, four independent dimensions on one row
#                            (status x compliance_status x tax_status x
#                            stamping_status), one state_machines entry each
# =============================================================================
state_machines:

  # --- Placement: cyclic revision loop --------------------------------------
  - entity: Placement
    state_field: status
    initial_state: DRAFT
    terminal_states: [BOUND]
    transitions:
      - from: DRAFT
        to: SEARCH_IN_PROGRESS
        trigger: "POST /placements/{id}/begin-search"
        actor: PlacementBroker
        preconditions:
          - "Placement.broker_id equals the acting X-User-ID"
          - "Broker.status of Placement.broker_id is ACTIVE"
        side_effects:
          - "Placement.status -> SEARCH_IN_PROGRESS"
          - "increments Placement.version by 1"

      - from: SEARCH_IN_PROGRESS
        to: SEARCH_COMPLETE
        trigger: "POST /placements/{id}/complete-search"
        actor: PlacementBroker
        preconditions:
          - "Placement.broker_id equals the acting X-User-ID"
          - "a StateProgram whose state_code equals Placement.home_state exists"
          - "diligent_search_sufficiency evaluates to true for this Placement, else ERR_DILIGENT_SEARCH_INSUFFICIENT"
        side_effects:
          - "Placement.declination_count -> the valid_declination_count computed by diligent_search_sufficiency"
          - "Placement.status -> SEARCH_COMPLETE"
          - "increments Placement.version by 1"

      - from: SEARCH_COMPLETE
        to: CHANGES_REQUESTED
        trigger: "POST /placements/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions:
          - "no Policy exists whose placement_id equals this Placement.id, else ERR_PLACEMENT_ALREADY_BOUND"
        side_effects:
          - "Placement.declination_count -> 0"
          - "Placement.status -> CHANGES_REQUESTED"
          - "increments Placement.version by 1"

      - from: CHANGES_REQUESTED
        to: SEARCH_IN_PROGRESS
        trigger: "POST /placements/{id}/begin-search"
        actor: PlacementBroker
        note: "Closes the revision cycle: SEARCH_COMPLETE -> CHANGES_REQUESTED -> SEARCH_IN_PROGRESS -> SEARCH_COMPLETE, traversable any number of times."
        preconditions:
          - "Placement.broker_id equals the acting X-User-ID"
          - "Broker.status of Placement.broker_id is ACTIVE"
        side_effects:
          - "Placement.status -> SEARCH_IN_PROGRESS"
          - "increments Placement.version by 1"

      - from: SEARCH_COMPLETE
        to: BOUND
        trigger: "POST /policies"
        actor: PlacementBroker
        note: "BOUND is terminal in the sense that no further status change occurs, but the placement remains BINDABLE: a risk file legitimately carries successive terms and layered policies, so further POST /policies calls on a BOUND placement succeed and leave the status at BOUND. This is what makes the policy-term overlap rule and the stale-placement-version rule reachable."
        preconditions:
          - "Placement.status is SEARCH_COMPLETE or BOUND, else ERR_PLACEMENT_NOT_BINDABLE"
          - "every other precondition of the Policy issuance validation chain passes"
        side_effects:
          - "Placement.status -> BOUND"
          - "increments Placement.version by 1 on every issuance, including issuances that leave the status at BOUND"

  # --- MarketSecurityReview: branching with divergent side effects ----------
  - entity: MarketSecurityReview
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, CONDITIONAL, DECLINED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /market-security-reviews/{id}/start"
        actor: ComplianceOfficer
        preconditions:
          - "no other MarketSecurityReview for the same carrier_id is in status UNDER_REVIEW, else ERR_REVIEW_ALREADY_OPEN"
          - "Carrier.capital_surplus_cents is not null"
        side_effects:
          - "MarketSecurityReview.variant_applied -> RECERTIFICATION when at least one earlier MarketSecurityReview for the same carrier_id has status APPROVED, else INITIAL_REVIEW"
          - "MarketSecurityReview.score -> the market_security_score result under the selected variant"
          - "MarketSecurityReview.status -> UNDER_REVIEW"
          - "increments MarketSecurityReview.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /market-security-reviews/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "expected_carrier_version equals Carrier.version, else ERR_STALE_CARRIER_VERSION"
          - "MarketSecurityReview.score >= 70, else ERR_DECISION_SCORE_MISMATCH"
        side_effects:
          - "MarketSecurityReview.reviewer_user_id -> acting X-User-ID"
          - "MarketSecurityReview.capital_surplus_at_review_cents -> Carrier.capital_surplus_cents"
          - "MarketSecurityReview.rating_at_review -> Carrier.am_best_rating"
          - "MarketSecurityReview.status -> APPROVED"
          - "Carrier.security_status -> APPROVED"
          - "increments Carrier.version by 1"

      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /market-security-reviews/{id}/decide with decision=CONDITION"
        actor: ComplianceOfficer
        preconditions:
          - "expected_carrier_version equals Carrier.version, else ERR_STALE_CARRIER_VERSION"
          - "50 <= MarketSecurityReview.score < 70, else ERR_DECISION_SCORE_MISMATCH"
          - "conditions_note is a non-empty string, else ERR_CONDITIONS_NOTE_REQUIRED"
        side_effects:
          - "MarketSecurityReview.reviewer_user_id -> acting X-User-ID"
          - "MarketSecurityReview.capital_surplus_at_review_cents -> Carrier.capital_surplus_cents"
          - "MarketSecurityReview.rating_at_review -> Carrier.am_best_rating"
          - "MarketSecurityReview.conditions_note -> the supplied note"
          - "MarketSecurityReview.status -> CONDITIONAL"
          - "Carrier.security_status -> CONDITIONAL"
          - "increments Carrier.version by 1"

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /market-security-reviews/{id}/decide with decision=DECLINE"
        actor: ComplianceOfficer
        note: "Depth-3 transitive cascade origin: review DECLINED -> that write sets Carrier.security_status=DECLINED -> that carrier-level write removes every WHITE_LISTED CarrierEligibility row of the carrier."
        preconditions:
          - "expected_carrier_version equals Carrier.version, else ERR_STALE_CARRIER_VERSION"
          - "MarketSecurityReview.score < 50, else ERR_DECISION_SCORE_MISMATCH"
        side_effects:
          - "MarketSecurityReview.reviewer_user_id -> acting X-User-ID"
          - "MarketSecurityReview.capital_surplus_at_review_cents -> Carrier.capital_surplus_cents"
          - "MarketSecurityReview.rating_at_review -> Carrier.am_best_rating"
          - "MarketSecurityReview.status -> DECLINED"
          - "hop 2: Carrier.security_status -> DECLINED; increments Carrier.version by 1"
          - "hop 3: caused by hop 2, every CarrierEligibility row whose carrier_id is this carrier and whose listing_status is WHITE_LISTED gets listing_status -> REMOVED, removed_on -> current logical clock, version incremented by 1; rows processed in state_program_id-of-state_code ASC order"

  # --- Policy dimension 1 of 4: lifecycle ----------------------------------
  - entity: Policy
    state_field: status
    initial_state: ISSUED
    terminal_states: [CANCELLED]
    transitions:
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /cancellations/{id}/process"
        actor: PlacementBroker
        preconditions:
          - "the Cancellation is in status REQUESTED"
        side_effects:
          - "Policy.status -> CANCELLED"
          - "Policy.tax_status -> ADJUSTED (independent dimension advanced by the same request)"
          - "increments Policy.version by 1"

  # --- Policy dimension 2 of 4: notice & affidavit compliance --------------
  - entity: Policy
    state_field: compliance_status
    initial_state: PENDING_NOTICES
    terminal_states: [DEFICIENT]
    note: "Evolves independently of status, tax_status and stamping_status; a policy may be COMPLIANT while UNCALCULATED, or REMITTED while still PENDING_NOTICES."
    transitions:
      - from: PENDING_NOTICES
        to: NOTICES_AFFIXED
        trigger: "POST /policies/{id}/affix-notices"
        actor: PlacementBroker
        preconditions:
          - "Policy.broker_id equals the acting X-User-ID"
          - "the supplied notice_codes array contains every code in required_notice_codes of the StateProgram whose state_code equals Policy.home_state, else ERR_NOTICES_INCOMPLETE"
        side_effects:
          - "Policy.notice_codes_affixed -> the supplied notice_codes array, de-duplicated, sorted ASCII ascending"
          - "Policy.compliance_status -> NOTICES_AFFIXED"
          - "increments Policy.version by 1"

      - from: NOTICES_AFFIXED
        to: COMPLIANT
        trigger: "POST /affidavits/{id}/sign on a DILIGENT_SEARCH affidavit (system side effect)"
        actor: system
        preconditions:
          - "the signed Affidavit has affidavit_type DILIGENT_SEARCH"
        side_effects:
          - "Policy.compliance_status -> COMPLIANT"
          - "increments Policy.version by 1"

      - from: NOTICES_AFFIXED
        to: DEFICIENT
        trigger: "POST /policies/{id}/stamping-decision with decision=REJECT (system side effect)"
        actor: system
        preconditions:
          - "Policy.stamping_status is SUBMITTED"
        side_effects:
          - "Policy.compliance_status -> DEFICIENT"
          - "increments Policy.version by 1"

      - from: COMPLIANT
        to: DEFICIENT
        trigger: "POST /policies/{id}/stamping-decision with decision=REJECT (system side effect)"
        actor: system
        preconditions:
          - "Policy.stamping_status is SUBMITTED"
        side_effects:
          - "Policy.compliance_status -> DEFICIENT"
          - "increments Policy.version by 1"

  # --- Policy dimension 3 of 4: premium tax --------------------------------
  - entity: Policy
    state_field: tax_status
    initial_state: UNCALCULATED
    terminal_states: []
    note: "Cyclic within itself: REMITTED -> ADJUSTED -> FILED -> REMITTED is traversable when an endorsement is issued after remittance."
    transitions:
      - from: UNCALCULATED
        to: CALCULATED
        trigger: "POST /policies/{id}/calculate-tax"
        actor: TaxFiler
        preconditions:
          - "Policy.status is ISSUED"
          - "a StateProgram exists for Policy.home_state and for every state_code the selected variant allocates to, else ERR_ALLOCATION_STATE_PROGRAM_MISSING"
        side_effects:
          - "premium_tax_and_stamping_fee runs under the variant named by Policy.allocation_method_applied"
          - "one PolicyStateAllocation row is created per allocated state, in state_code ASC order"
          - "Policy.total_tax_cents and Policy.total_stamping_fee_cents -> the summed allocation values"
          - "one TaxFilingLine with line_type NEW_BUSINESS is created per allocated state, in state_code ASC order, status OPEN"
          - "Policy.tax_status -> CALCULATED"
          - "increments Policy.version by 1"

      - from: CALCULATED
        to: ADJUSTED
        trigger: "POST /endorsements/{id}/issue, POST /endorsements/{id}/void, or POST /cancellations/{id}/process (system side effect)"
        actor: system
        preconditions:
          - "Policy.tax_status is not UNCALCULATED"
        side_effects:
          - "PolicyStateAllocation rows are recomputed in place using their pinned rates"
          - "an adjusting TaxFilingLine is created per affected state"
          - "Policy.tax_status -> ADJUSTED"
          - "increments Policy.version by 1"

      - from: CALCULATED
        to: FILED
        trigger: "POST /filing-batches/{id}/submit (system side effect)"
        actor: system
        preconditions:
          - "at least one TaxFilingLine of this Policy was swept into the submitted batch"
        side_effects:
          - "Policy.tax_status -> FILED"
          - "increments Policy.version by 1"

      - from: ADJUSTED
        to: FILED
        trigger: "POST /filing-batches/{id}/submit (system side effect)"
        actor: system
        preconditions:
          - "every TaxFilingLine of this Policy has status FILED or VOIDED after the sweep"
        side_effects:
          - "Policy.tax_status -> FILED"
          - "increments Policy.version by 1"

      - from: FILED
        to: REMITTED
        trigger: "POST /filing-batches/{id}/remit (system side effect)"
        actor: system
        preconditions:
          - "every TaxFilingLine of this Policy has status REMITTED or VOIDED after remittance"
        side_effects:
          - "Policy.tax_status -> REMITTED"
          - "increments Policy.version by 1"

      - from: REMITTED
        to: ADJUSTED
        trigger: "POST /endorsements/{id}/issue or POST /cancellations/{id}/process (system side effect)"
        actor: system
        note: "Post-remittance adjustment closes the tax dimension's cycle."
        preconditions:
          - "the adjusting event produces a non-zero tax or stamping fee delta"
        side_effects:
          - "an adjusting TaxFilingLine with status OPEN is created per affected state"
          - "Policy.tax_status -> ADJUSTED"
          - "increments Policy.version by 1"

  # --- Policy dimension 4 of 4: stamping office ----------------------------
  - entity: Policy
    state_field: stamping_status
    initial_state: "PENDING when the home state's stamping_office_required is true, otherwise NOT_REQUIRED"
    terminal_states: [NOT_REQUIRED, ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /policies/{id}/submit-stamping"
        actor: TaxFiler
        preconditions:
          - "Policy.compliance_status is NOTICES_AFFIXED or COMPLIANT, else ERR_NOTICES_NOT_AFFIXED"
          - "Policy.tax_status is not UNCALCULATED, else ERR_TAX_NOT_CALCULATED"
        side_effects:
          - "Policy.stamping_submitted_at -> current logical clock"
          - "Policy.stamping_status -> SUBMITTED"
          - "increments Policy.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /policies/{id}/stamping-decision with decision=ACCEPT"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "Policy.stamping_status -> ACCEPTED"
          - "increments Policy.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /policies/{id}/stamping-decision with decision=REJECT"
        actor: StateRegulator
        preconditions:
          - "rejection_reason is a non-empty string, else ERR_REJECTION_REASON_REQUIRED"
        side_effects:
          - "Policy.stamping_status -> REJECTED"
          - "Policy.compliance_status -> DEFICIENT (independent dimension advanced by the same request)"
          - "increments Policy.version by 1"

  # --- Endorsement: depth-4 cascade origin ---------------------------------
  - entity: Endorsement
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /endorsements/{id}/issue"
        actor: PlacementBroker
        note: "Depth-4 transitive cascade origin. hop1 endorsement status -> hop2 policy premium recompute -> hop3 allocation rows recompute -> hop4 adjusting TaxFilingLine emission."
        preconditions:
          - "Policy.status is ISSUED, else ERR_POLICY_NOT_ISSUED"
          - "Policy.tax_status is not UNCALCULATED, else ERR_TAX_NOT_CALCULATED"
          - "when supersedes_endorsement_id is non-null, that Endorsement has status ISSUED and belongs to the same policy, else ERR_SUPERSEDE_TARGET_INVALID"
          - "the resulting Policy.gross_premium_cents remains strictly greater than 0, else ERR_PREMIUM_WOULD_BE_NON_POSITIVE"
        side_effects:
          - "hop 1: Endorsement.status -> ISSUED"
          - "hop 2: caused by hop 1, Policy.gross_premium_cents and Policy.taxable_premium_cents are recomputed from the ISSUED endorsement set"
          - "hop 3: caused by hop 2, every PolicyStateAllocation row of the policy is recomputed in place (allocated_premium_cents redistributed by largest remainder over the pinned allocation_pct set, tax_cents and stamping_fee_cents re-derived from the pinned rates); Policy.total_tax_cents and Policy.total_stamping_fee_cents refreshed"
          - "hop 4: caused by hop 3, one TaxFilingLine with line_type ENDORSEMENT, source_endorsement_id set, and status OPEN is created per state whose tax_cents or stamping_fee_cents changed, in state_code ASC order"
          - "Endorsement.tax_adjustment_cents -> Policy.total_tax_cents after minus before"
          - "Endorsement.stamping_fee_adjustment_cents -> Policy.total_stamping_fee_cents after minus before"
          - "when supersedes_endorsement_id is non-null, that endorsement's status -> VOIDED and its own compensating lines are emitted first"
          - "Policy.tax_status -> ADJUSTED"
          - "increments Endorsement.version and Policy.version by 1 each"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /endorsements/{id}/void"
        actor: PlacementBroker
        preconditions:
          - "no TaxFilingLine whose source_endorsement_id is this Endorsement has status REMITTED, else ERR_ENDORSEMENT_ALREADY_REMITTED"
        side_effects:
          - "Endorsement.status -> VOIDED"
          - "Policy premium, allocation rows and totals are recomputed from the remaining ISSUED endorsement set"
          - "one compensating TaxFilingLine with line_type ENDORSEMENT and status OPEN is created per affected state, carrying the exact negation of the voided endorsement's per-state tax and stamping deltas"
          - "Policy.tax_status -> ADJUSTED"
          - "increments Endorsement.version and Policy.version by 1 each"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /endorsements/{id}/void"
        actor: PlacementBroker
        preconditions: []
        side_effects:
          - "Endorsement.status -> VOIDED"
          - "no TaxFilingLine is created and no Policy field changes, because a DRAFT endorsement never entered the premium base"
          - "increments Endorsement.version by 1"

  # --- Cancellation --------------------------------------------------------
  - entity: Cancellation
    state_field: status
    initial_state: REQUESTED
    terminal_states: [PROCESSED]
    transitions:
      - from: REQUESTED
        to: PROCESSED
        trigger: "POST /cancellations/{id}/process"
        actor: PlacementBroker
        preconditions:
          - "Policy.status is ISSUED, else ERR_POLICY_NOT_ISSUED"
          - "Policy.tax_status is not UNCALCULATED, else ERR_TAX_NOT_CALCULATED"
        side_effects:
          - "return_premium_and_tax_adjustment runs; Cancellation.earned_premium_cents, return_premium_cents, tax_refund_cents and stamping_fee_refund_cents are written"
          - "Cancellation.status -> PROCESSED"
          - "one TaxFilingLine with line_type CANCELLATION_RETURN, source_cancellation_id set, negative taxable_premium_cents/tax_cents/stamping_fee_cents, and status OPEN is created per allocated state in state_code ASC order"
          - "Policy.status -> CANCELLED and Policy.tax_status -> ADJUSTED"
          - "increments Cancellation.version and Policy.version by 1 each"

  # --- FilingBatch ---------------------------------------------------------
  - entity: FilingBatch
    state_field: status
    initial_state: OPEN
    terminal_states: [REMITTED]
    transitions:
      - from: OPEN
        to: PREPARED
        trigger: "POST /filing-batches/{id}/prepare"
        actor: TaxFiler
        preconditions:
          - "period_key matches the state's filing_frequency format, else ERR_PERIOD_KEY_MALFORMED"
        side_effects:
          - "every TaxFilingLine with status OPEN whose state_program_id equals the batch's, whose period_key equals the batch's, and whose policy's broker_id equals the batch's broker_id is swept: filing_batch_id -> this batch, status -> BATCHED, processed in created_at ASC order"
          - "FilingBatch.line_count, total_tax_cents, total_stamping_fee_cents -> filing_batch_totals_and_penalty outputs"
          - "FilingBatch.due_date, late and penalty_cents -> filing_batch_totals_and_penalty outputs"
          - "FilingBatch.total_due_cents -> total_tax_cents + total_stamping_fee_cents + penalty_cents"
          - "FilingBatch.prepared_by_user_id -> acting X-User-ID"
          - "FilingBatch.status -> PREPARED"
          - "increments FilingBatch.version by 1"

      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /filing-batches/{id}/submit"
        actor: TaxFiler
        preconditions:
          - "FilingBatch.line_count > 0, else ERR_BATCH_EMPTY"
          - "the batch's broker holds a BrokerLicense of license_type SURPLUS_LINES whose state_code equals the batch state's state_code and whose computed status is ACTIVE, else ERR_BROKER_LICENSE_NOT_ACTIVE"
        side_effects:
          - "every BATCHED line of the batch gets status -> FILED"
          - "each affected Policy advances its tax_status dimension to FILED once all of its lines are FILED, VOIDED or REMITTED"
          - "FilingBatch.status -> SUBMITTED"
          - "increments FilingBatch.version by 1"

      - from: SUBMITTED
        to: REMITTED
        trigger: "POST /filing-batches/{id}/remit"
        actor: TaxFiler
        preconditions:
          - "the acting X-User-ID differs from FilingBatch.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "remitted_amount_cents equals FilingBatch.total_due_cents, else ERR_REMITTANCE_AMOUNT_MISMATCH"
        side_effects:
          - "every FILED line of the batch gets status -> REMITTED"
          - "each affected Policy advances its tax_status dimension to REMITTED once all of its lines are REMITTED or VOIDED"
          - "FilingBatch.remitted_by_user_id -> acting X-User-ID"
          - "FilingBatch.status -> REMITTED"
          - "increments FilingBatch.version by 1"

  # --- Affidavit -----------------------------------------------------------
  - entity: Affidavit
    state_field: status
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /affidavits/{id}/sign"
        actor: "PlacementBroker or ComplianceOfficer"
        preconditions:
          - "Policy.broker_id equals the acting X-User-ID when the acting role is PlacementBroker"
          - "the acting X-User-ID differs from the reviewer_user_id of every APPROVED or CONDITIONAL MarketSecurityReview whose carrier_id equals Policy.carrier_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Affidavit.declination_count_attested equals Placement.declination_count of the policy's placement, else ERR_AFFIDAVIT_COUNT_MISMATCH"
        side_effects:
          - "Affidavit.signed_by_user_id -> acting X-User-ID"
          - "Affidavit.signed_at -> current logical clock"
          - "Affidavit.status -> SIGNED"
          - "when affidavit_type is DILIGENT_SEARCH and Policy.compliance_status is NOTICES_AFFIXED, Policy.compliance_status -> COMPLIANT and Policy.version increments by 1"
          - "increments Affidavit.version by 1"

  # --- Declination ---------------------------------------------------------
  - entity: Declination
    state_field: status
    initial_state: RECORDED
    terminal_states: [INVALIDATED]
    transitions:
      - from: RECORDED
        to: INVALIDATED
        trigger: "POST /declinations/{id}/invalidate"
        actor: ComplianceOfficer
        preconditions:
          - "the parent Placement.status is not BOUND, else ERR_PLACEMENT_ALREADY_BOUND"
        side_effects:
          - "Declination.status -> INVALIDATED"
          - "increments Declination.version by 1"

  # --- CarrierEligibility --------------------------------------------------
  - entity: CarrierEligibility
    state_field: listing_status
    initial_state: WHITE_LISTED
    terminal_states: [REMOVED]
    transitions:
      - from: WHITE_LISTED
        to: REMOVED
        trigger: "POST /carrier-eligibilities/{id}/remove, or the depth-3 cascade from a DECLINED MarketSecurityReview"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "CarrierEligibility.listing_status -> REMOVED"
          - "CarrierEligibility.removed_on -> the supplied removed_on when called directly, or the current logical clock when reached by cascade"
          - "increments CarrierEligibility.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: policy-create-stale-placement
    parent_entity: Placement
    write_endpoint: "POST /policies"
    occ_field: "expected_placement_version"
    description: |
      Issuing a Policy against a Placement whose version has advanced since the
      client last observed it is rejected. A single Placement may legitimately
      carry more than one Policy (successive terms on the same risk), so a
      second sequential issuance is not itself barred by any state precondition
      once the placement is BOUND-eligible; the stale-version check is what
      distinguishes a client working from a current view of the placement from
      one whose view predates another writer's policy, declination invalidation
      or change request.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412

  - rule_id: endorsement-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/endorsements"
    occ_field: "expected_policy_version"
    description: |
      Creating an Endorsement against a Policy whose version has advanced since
      the client last observed it is rejected. A Policy legitimately carries an
      unbounded number of endorsements, so a second sequential create observes
      no state field that bars it; the stale-version check is what catches a
      client whose premium base predates another writer's endorsement issuance,
      tax calculation or notice affixing.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: review-decide-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /market-security-reviews/{id}/decide"
    occ_field: "expected_carrier_version"
    description: |
      Deciding a MarketSecurityReview pins the carrier's capital, surplus and
      rating into the review record. When the carrier's financials have been
      amended since the reviewer loaded them, the decision would pin values the
      reviewer never evaluated, so it is rejected. Deciding a different review
      of the same carrier is legitimate, so no state precondition covers this.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Money is always integer cents. `round_half_up(x)` means: round the exact
# rational value x to the nearest integer, ties away from zero.
# `clock_now` is the current logical clock (see POST /_clock/set_current_utc;
# default 2026-08-01T00:00:00Z).
# =============================================================================
calculations:

  # -------------------------------------------------------------------------
  - name: home_state_determination
    description: |
      Determines the single home state of a multi-state risk. Under the
      Nonadmitted and Reinsurance Reform Act model the home state is the
      insured's principal place of business when the insured has any exposure
      there; otherwise it is the state holding the greatest insured value.
      The home state is fixed at placement creation and is never recomputed,
      because every downstream tax, notice and stamping obligation is pinned
      to it.
    trigger: "POST /placements (once, at creation)"
    inputs:
      - "Placement.principal_place_of_business_state"
      - "Placement.state_exposures (array of {state_code, insured_value_cents})"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — reject an empty exposure schedule outright.
      if len(state_exposures) == 0:
          raise ERR_HOME_STATE_INDETERMINATE

      # Step 2 — principal place of business wins IF it carries real exposure.
      #          The test is STRICTLY greater than zero: an exposure row for the
      #          PPB state with insured_value_cents == 0 does NOT qualify.
      ppb_rows = [r for r in state_exposures
                  if r.state_code == principal_place_of_business_state
                  and r.insured_value_cents > 0]
      if len(ppb_rows) > 0:
          home_state = principal_place_of_business_state

      # Step 3 — otherwise the greatest insured value wins; ties break on the
      #          alphabetically smallest state_code.
      else:
          positive = [r for r in state_exposures if r.insured_value_cents > 0]
          if len(positive) == 0:
              raise ERR_HOME_STATE_INDETERMINATE
          best = max(r.insured_value_cents for r in positive)
          home_state = min(r.state_code for r in positive
                           if r.insured_value_cents == best)

      total_insured_value_cents = sum(r.insured_value_cents
                                      for r in state_exposures)
    constants: {}
    precision: "integer cents; no rounding, values are summed exactly"

  # -------------------------------------------------------------------------
  - name: diligent_search_sufficiency
    description: |
      Decides whether the broker has documented enough admitted-market
      declinations to complete the search and bind surplus lines coverage.
      Only declinations from the home state count, only recent ones count, and
      a declination whose reason is that the admitted carrier is not licensed
      for the coverage class does not count as evidence of the market's
      unwillingness to write the risk. An export-list risk bypasses the count
      entirely, but only in states whose program grants that exemption.
    trigger: "POST /placements/{id}/complete-search"
    inputs:
      - "Declination rows whose placement_id is this placement"
      - "Placement.home_state"
      - "Placement.is_export_list_risk"
      - "StateProgram.diligent_search_min_declinations of the home state"
      - "StateProgram.export_list_exempts_search of the home state"
      - "clock_now"
    algorithm: threshold
    formula: |
      program = StateProgram where state_code == Placement.home_state

      cutoff = clock_now - DILIGENT_SEARCH_LOOKBACK_DAYS days

      valid = [d for d in declinations_of(placement)
               if d.status == "RECORDED"
               and d.reason_code != "NOT_LICENSED_FOR_CLASS"
               and d.state_code == Placement.home_state
               and d.declined_on >= cutoff]        # inclusive at the cutoff
      valid_declination_count = len(valid)

      if Placement.is_export_list_risk and program.export_list_exempts_search:
          sufficient = True                        # waived regardless of count
      else:
          sufficient = (valid_declination_count
                        >= program.diligent_search_min_declinations)

      if not sufficient:
          raise ERR_DILIGENT_SEARCH_INSUFFICIENT
    constants:
      DILIGENT_SEARCH_LOOKBACK_DAYS: 90
    precision: "integer count; the lookback comparison is inclusive (>=), the exposure comparison in home_state_determination is exclusive (>)"

  # -------------------------------------------------------------------------
  - name: premium_tax_and_stamping_fee
    description: |
      Computes the taxable premium, its allocation across states, the surplus
      lines premium tax and the stamping office fee for a newly issued policy.
      Two variants exist because states disagree about whether a multi-state
      risk is taxed wholly by the home state or apportioned by insured value;
      the home state's program selects the variant, and the selection is
      pinned onto the policy at issuance so later endorsements cannot silently
      switch regimes.
    trigger: "POST /policies/{id}/calculate-tax; re-run on endorsement issue, endorsement void and cancellation processing using the pinned allocation percentages"
    inputs:
      - "Policy.gross_premium_cents"
      - "Policy.policy_fee_cents"
      - "Policy.broker_fee_cents"
      - "Policy.home_state"
      - "Policy.allocation_method_applied"
      - "Placement.state_exposures of the policy's placement"
      - "StateProgram.premium_tax_rate, stamping_fee_rate, stamping_fee_cap_cents, stamping_office_required per allocated state"
    algorithm: tiered_pricing
    formula: |
      # ---- Taxable base -----------------------------------------------------
      # The policy fee is part of the consideration for the insurance and is
      # taxable. The broker fee is compensation to the broker and is NEVER
      # included in the taxable premium.
      taxable_premium_cents = gross_premium_cents + policy_fee_cents

      # ---- Variant selection ------------------------------------------------
      # allocation_method_applied was pinned from the home state's program at
      # issuance.

      if allocation_method_applied == "HOME_STATE_SINGLE":
          # Exactly one allocation row, for the home state, carrying 100% of
          # the taxable premium — even when the risk has exposure in other
          # states.
          rows = [ { state_code: home_state,
                     allocation_pct: 1.0000,
                     allocated_premium_cents: taxable_premium_cents,
                     allocation_basis: "HOME_STATE_SINGLE" } ]

      elif allocation_method_applied == "ALLOCATED_MULTI":
          # Pro-rata by insured value across every state with positive
          # exposure, emitted in state_code ASC order.
          states = sorted([r for r in state_exposures
                           if r.insured_value_cents > 0],
                          key=lambda r: r.state_code)
          total_iv = sum(r.insured_value_cents for r in states)

          # Displayed percentage, 4 decimal places, round_half_up.
          for r in states:
              r.allocation_pct = round_half_up_4dp(r.insured_value_cents
                                                   / total_iv)

          # Cents are distributed by LARGEST REMAINDER against the EXACT
          # rational share — never by multiplying the rounded 4dp percentage.
          # This guarantees the allocated cents sum exactly to the taxable
          # premium (see compensating invariant allocated_premium_conservation).
          for r in states:
              r.raw = taxable_premium_cents * r.insured_value_cents / total_iv
              r.base = floor(r.raw)
          remainder_pool = taxable_premium_cents - sum(r.base for r in states)
          # Hand out the remaining cents one at a time, largest fractional
          # part first, ties broken by state_code ASC.
          order = sorted(states,
                         key=lambda r: (-(r.raw - r.base), r.state_code))
          for i in range(remainder_pool):
              order[i].base += 1
          for r in states:
              r.allocated_premium_cents = r.base
              r.allocation_basis = "INSURED_VALUE_PRO_RATA"
          rows = states

      # ---- Per-row tax and stamping fee -------------------------------------
      # ROUNDING ORDER IS PINNED: round PER ALLOCATION ROW, THEN SUM.
      # Summing the exact per-row products first and rounding once at the end
      # is a DIFFERENT and WRONG answer in this scaffold.
      for r in rows:
          program = StateProgram where state_code == r.state_code
          if program is None:
              raise ERR_ALLOCATION_STATE_PROGRAM_MISSING

          # Rates are PINNED onto the allocation row at this moment. Every
          # later adjustment reuses these pinned values, never the state's
          # current rate.
          r.premium_tax_rate_applied  = program.premium_tax_rate
          r.stamping_fee_rate_applied = program.stamping_fee_rate

          r.tax_cents = round_half_up(r.allocated_premium_cents
                                      * r.premium_tax_rate_applied)

          if not program.stamping_office_required:
              r.stamping_fee_cents = 0
          else:
              uncapped = round_half_up(r.allocated_premium_cents
                                       * r.stamping_fee_rate_applied)
              if program.stamping_fee_cap_cents is None:
                  r.stamping_fee_cents = uncapped
              else:
                  r.stamping_fee_cents = min(uncapped,
                                             program.stamping_fee_cap_cents)

      total_tax_cents          = sum(r.tax_cents for r in rows)
      total_stamping_fee_cents = sum(r.stamping_fee_cents for r in rows)
    constants: {}
    precision: "allocation_pct: 4 decimal places, round_half_up. Money: integer cents, round_half_up, rounded per allocation row and only then summed."
    variants:
      - name: HOME_STATE_SINGLE
        when: "the home state's StateProgram.allocation_method is HOME_STATE_SINGLE"
        difference: "One allocation row for the home state at allocation_pct 1.0000 taking the entire taxable premium and taxed at the home state's rate, regardless of how many states hold exposure."
      - name: ALLOCATED_MULTI
        when: "the home state's StateProgram.allocation_method is ALLOCATED_MULTI"
        difference: "One allocation row per positive-exposure state, cents apportioned by largest remainder on insured value, each row taxed at its OWN state's premium_tax_rate and subject to its OWN stamping fee rate and cap. For identical policy inputs the two variants produce different total_tax_cents whenever any non-home state's rate differs from the home state's."

  # -------------------------------------------------------------------------
  - name: market_security_score
    description: |
      Scores a non-admitted carrier's financial security so the compliance
      function can decide whether the carrier may be used. The score combines
      the carrier's rating, its capital and surplus tier, its trust-fund
      posture and whether it appears on the NAIC quarterly listing. A
      recertification of a carrier that was previously approved is scored more
      harshly than a first review: deterioration since the last approval is
      penalised, because a carrier sliding downhill is a worse risk than a
      carrier that has always sat at the lower level.
    trigger: "POST /market-security-reviews/{id}/start"
    inputs:
      - "Carrier.am_best_rating"
      - "Carrier.capital_surplus_cents"
      - "Carrier.domicile_type"
      - "Carrier.trust_fund_cents"
      - "Carrier.naic_quarterly_listing"
      - "the most recent APPROVED MarketSecurityReview of the same carrier, when one exists"
    algorithm: weighted_scoring
    formula: |
      rating_points = RATING_POINTS[Carrier.am_best_rating]

      # Capital and surplus tier — the comparisons are all >=, so a carrier
      # sitting exactly on a tier floor earns that tier's points.
      if   Carrier.capital_surplus_cents >= CAPITAL_TIER_1_CENTS: capital_points = 40
      elif Carrier.capital_surplus_cents >= CAPITAL_TIER_2_CENTS: capital_points = 30
      elif Carrier.capital_surplus_cents >= CAPITAL_TIER_3_CENTS: capital_points = 20
      else:                                                       capital_points = 5

      # Alien insurers must fund a US trust to earn trust points; US-domiciled
      # insurers earn them by virtue of their domiciliary regulator.
      if Carrier.domicile_type == "ALIEN":
          trust_points = 15 if (Carrier.trust_fund_cents or 0) >= ALIEN_TRUST_MIN_CENTS else 0
      else:
          trust_points = 15

      listing_points = 5 if Carrier.naic_quarterly_listing else 0

      base = rating_points + capital_points + trust_points + listing_points

      prior = the MarketSecurityReview of this carrier with status APPROVED and
              the greatest created_at, or None

      if prior is None:
          variant_applied = "INITIAL_REVIEW"
          score = base
      else:
          variant_applied = "RECERTIFICATION"
          prior_subscore   = RATING_POINTS[prior.rating_at_review] + capital_tier_points(prior.capital_surplus_at_review_cents)
          current_subscore = rating_points + capital_points
          drift_penalty    = max(0, prior_subscore - current_subscore) * DRIFT_MULTIPLIER
          score            = max(0, base - drift_penalty)

      # Decision bands. The reviewer supplies the decision explicitly and the
      # server rejects a decision the score does not support.
      #   score >= 70            -> APPROVE only
      #   50 <= score < 70       -> CONDITION only
      #   score < 50             -> DECLINE only
      # Any other pairing raises ERR_DECISION_SCORE_MISMATCH.
    constants:
      RATING_POINTS:
        A_PLUS_PLUS: 40
        A_PLUS: 35
        A: 30
        A_MINUS: 25
        B_PLUS_PLUS: 15
        B_PLUS: 10
        NR: 0
      CAPITAL_TIER_1_CENTS: 5000000000     # $50,000,000 -> 40 points
      CAPITAL_TIER_2_CENTS: 1500000000     # $15,000,000 -> 30 points
      CAPITAL_TIER_3_CENTS: 500000000      # $5,000,000  -> 20 points
      CAPITAL_TIER_FLOOR_POINTS: 5
      ALIEN_TRUST_MIN_CENTS: 540000000     # $5,400,000 US trust minimum
      DRIFT_MULTIPLIER: 2
      APPROVE_MIN_SCORE: 70
      CONDITION_MIN_SCORE: 50
    precision: "integer points; no rounding; score floored at 0"
    variants:
      - name: INITIAL_REVIEW
        when: "the carrier has no earlier MarketSecurityReview in status APPROVED"
        difference: "score is the plain sum of rating, capital-tier, trust and listing points; no history is consulted."
      - name: RECERTIFICATION
        when: "the carrier has at least one earlier MarketSecurityReview in status APPROVED"
        difference: "the rating+capital subscore is compared against the pinned rating_at_review and capital_surplus_at_review_cents of the latest APPROVED review, and twice the deterioration is subtracted. Identical carrier financials therefore score strictly lower under RECERTIFICATION than under INITIAL_REVIEW whenever the carrier has slipped, which can move the same carrier from APPROVED into CONDITIONAL or DECLINED."

  # -------------------------------------------------------------------------
  - name: return_premium_and_tax_adjustment
    description: |
      Computes the return premium owed to the insured on cancellation and the
      corresponding premium tax and stamping fee refunds. Three cancellation
      types earn premium differently, a minimum earned premium floor can
      override the earned figure entirely, and each state decides
      independently whether its premium tax and its stamping fee are
      refundable at all. Refunds are computed from the rates PINNED on the
      policy's allocation rows, never from the state's current rates.
    trigger: "POST /cancellations/{id}/process"
    inputs:
      - "Cancellation.cancellation_type"
      - "Cancellation.cancellation_date"
      - "Policy.effective_date, Policy.expiration_date"
      - "Policy.taxable_premium_cents"
      - "Policy.min_earned_premium_pct"
      - "PolicyStateAllocation rows of the policy (allocation_pct, premium_tax_rate_applied, stamping_fee_rate_applied)"
      - "StateProgram.return_premium_tax_refundable, return_premium_stamping_refundable per allocated state"
    algorithm: chronological
    formula: |
      term_days    = days_between(Policy.effective_date, Policy.expiration_date)
      elapsed_days = days_between(Policy.effective_date, Cancellation.cancellation_date)
      if elapsed_days < 0 or elapsed_days > term_days:
          raise ERR_CANCELLATION_DATE_OUT_OF_TERM
      unearned_days = term_days - elapsed_days

      taxable = Policy.taxable_premium_cents

      # ---- Step 1: unearned premium by cancellation type --------------------
      if Cancellation.cancellation_type == "FLAT":
          # A flat cancellation is only available on the effective date itself.
          if elapsed_days != 0:
              raise ERR_FLAT_CANCELLATION_NOT_AVAILABLE
          unearned = taxable
      elif Cancellation.cancellation_type == "PRO_RATA":
          unearned = round_half_up(taxable * unearned_days / term_days)
      elif Cancellation.cancellation_type == "SHORT_RATE":
          # The carrier retains a penalty share when the insured cancels.
          unearned = round_half_up(taxable * unearned_days / term_days
                                   * SHORT_RATE_FACTOR)

      # ---- Step 2: minimum earned premium floor -----------------------------
      # Evaluated AFTER the type calculation and capable of overriding it.
      min_earned = round_half_up(taxable * Policy.min_earned_premium_pct)
      if taxable - unearned < min_earned:
          unearned = max(0, taxable - min_earned)

      return_premium_cents = unearned
      earned_premium_cents = taxable - unearned

      # ---- Step 3: per-state tax and stamping refunds -----------------------
      # The refunded taxable premium is apportioned across the SAME allocation
      # rows the policy already carries, using the PINNED allocation_pct set,
      # again by largest remainder so the parts sum exactly to `unearned`.
      # The pinned 4-decimal percentages need not sum to exactly 1 (three equal
      # thirds pin as 0.3333 each), so they are NORMALISED BY THEIR OWN SUM
      # before the split. This keeps the parts summing exactly to `unearned`.
      per_state_return = largest_remainder(
          unearned,
          [(r.state_code, r.allocation_pct / sum_of_pinned_pcts)
           for r in allocation_rows],
          order_by="state_code ASC")

      tax_refund_cents = 0
      stamping_fee_refund_cents = 0
      for r in allocation_rows:
          program = StateProgram where state_code == r.state_code
          part = per_state_return[r.state_code]

          if program.return_premium_tax_refundable:
              t = round_half_up(part * r.premium_tax_rate_applied)
          else:
              t = 0

          if program.return_premium_stamping_refundable and r.stamping_fee_cents > 0:
              s = round_half_up(part * r.stamping_fee_rate_applied)
              # A refund can never exceed what was charged for that state.
              s = min(s, r.stamping_fee_cents)
          else:
              s = 0

          tax_refund_cents          += t
          stamping_fee_refund_cents += s

      # Both refunds are reported as POSITIVE amounts on the Cancellation and
      # emitted as NEGATIVE amounts on the resulting TaxFilingLine rows.
    constants:
      SHORT_RATE_FACTOR: 0.90
    precision: "integer cents, round_half_up, rounded per state and then summed; day counts are whole calendar days"

  # -------------------------------------------------------------------------
  - name: endorsement_tax_adjustment
    description: |
      Recomputes a policy's premium tax and stamping fee after an endorsement
      is issued or voided, and expresses the difference as a signed
      adjustment. The evaluation order is pinned because the taxable premium
      feeds the allocation, the allocation feeds the per-state tax, and the
      per-state tax feeds the adjustment — reversing any two steps yields a
      different number.
    trigger: "POST /endorsements/{id}/issue and POST /endorsements/{id}/void"
    inputs:
      - "Policy.original_gross_premium_cents"
      - "the set of Endorsement rows of the policy in status ISSUED"
      - "Policy.policy_fee_cents"
      - "PolicyStateAllocation rows of the policy (allocation_pct and the pinned rates)"
    algorithm: projection
    formula: |
      # Snapshot the before-picture BEFORE touching anything.
      tax_before      = Policy.total_tax_cents
      stamping_before = Policy.total_stamping_fee_cents

      # ---- Step 1: premium base from the ISSUED endorsement set -------------
      # Always recomputed from the full ISSUED set, never by incrementally
      # adding a delta to the stored value; that is what makes void exactly
      # reversible.
      gross_premium_cents = Policy.original_gross_premium_cents \
                            + sum(e.premium_delta_cents
                                  for e in endorsements_of(policy)
                                  if e.status == "ISSUED")
      if gross_premium_cents <= 0:
          raise ERR_PREMIUM_WOULD_BE_NON_POSITIVE

      # ---- Step 2: taxable base --------------------------------------------
      taxable_premium_cents = gross_premium_cents + Policy.policy_fee_cents

      # ---- Step 3: redistribute over the PINNED allocation percentages -----
      # The percentage set is frozen at issuance. An EXPOSURE_CHANGE
      # endorsement does NOT re-apportion the policy; it only moves premium.
      # Normalised by the sum of the pinned percentages, exactly as in
      # return_premium_and_tax_adjustment, because 4-decimal percentages need
      # not sum to 1.
      parts = largest_remainder(
          taxable_premium_cents,
          [(r.state_code, r.allocation_pct / sum_of_pinned_pcts)
           for r in allocation_rows],
          order_by="state_code ASC")

      # ---- Step 4: per-state tax from the PINNED rates ---------------------
      for r in allocation_rows:
          old_tax      = r.tax_cents
          old_stamping = r.stamping_fee_cents
          r.allocated_premium_cents = parts[r.state_code]
          r.tax_cents = round_half_up(r.allocated_premium_cents
                                      * r.premium_tax_rate_applied)
          if old_stamping == 0 and r.stamping_fee_rate_applied == 0:
              r.stamping_fee_cents = 0
          else:
              program = StateProgram where state_code == r.state_code
              uncapped = round_half_up(r.allocated_premium_cents
                                       * r.stamping_fee_rate_applied)
              r.stamping_fee_cents = uncapped if program.stamping_fee_cap_cents is None \
                                     else min(uncapped, program.stamping_fee_cap_cents)
          r.tax_delta      = r.tax_cents - old_tax
          r.stamping_delta = r.stamping_fee_cents - old_stamping

      Policy.total_tax_cents          = sum(r.tax_cents for r in allocation_rows)
      Policy.total_stamping_fee_cents = sum(r.stamping_fee_cents for r in allocation_rows)

      # ---- Step 5: signed adjustment and ledger lines ----------------------
      tax_adjustment_cents          = Policy.total_tax_cents - tax_before
      stamping_fee_adjustment_cents = Policy.total_stamping_fee_cents - stamping_before

      # One TaxFilingLine per state whose tax OR stamping fee moved, in
      # state_code ASC order, carrying the signed deltas.
      for r in allocation_rows in state_code ASC order:
          if r.tax_delta != 0 or r.stamping_delta != 0:
              emit TaxFilingLine(line_type="ENDORSEMENT",
                                 source_endorsement_id=endorsement.id,
                                 taxable_premium_cents=r.allocated_premium_cents - old_allocated,
                                 tax_cents=r.tax_delta,
                                 stamping_fee_cents=r.stamping_delta,
                                 status="OPEN")
    constants: {}
    precision: "integer cents, round_half_up; recomputed from the full ISSUED endorsement set, never incrementally accumulated"

  # -------------------------------------------------------------------------
  - name: filing_batch_totals_and_penalty
    description: |
      Sweeps a broker's open filing lines for one state and one filing period
      into a batch, totals them, derives the statutory due date from the
      state's filing calendar, and applies a late-filing penalty when the
      batch is prepared after that date. Because return-premium lines are
      negative, a batch total can be negative; the penalty is computed only on
      a positive tax balance but is never less than the statutory floor once
      the batch is late.
    trigger: "POST /filing-batches/{id}/prepare"
    inputs:
      - "FilingBatch.state_program_id, FilingBatch.broker_id, FilingBatch.period_key"
      - "TaxFilingLine rows in status OPEN"
      - "StateProgram.filing_frequency, StateProgram.filing_deadline_days"
      - "clock_now"
    algorithm: aggregation
    formula: |
      program = StateProgram of FilingBatch.state_program_id

      # ---- Period key format, by the state's own calendar -------------------
      if program.filing_frequency == "MONTHLY":
          period_key must match "YYYY-MM"      # e.g. 2026-07
      elif program.filing_frequency == "QUARTERLY":
          period_key must match "YYYY-Qn", n in 1..4
      else:
          raise ERR_PERIOD_KEY_MALFORMED

      # ---- Sweep ------------------------------------------------------------
      # Cross-aggregate: lines are drawn from many Policy aggregates, and the
      # broker filter reaches through the line's policy.
      lines = [l for l in tax_filing_lines
               if l.status == "OPEN"
               and l.state_program_id == FilingBatch.state_program_id
               and l.period_key == FilingBatch.period_key
               and policy_of(l).broker_id == FilingBatch.broker_id]
      lines = sorted(lines, key=lambda l: l.created_at)   # ASC

      line_count               = len(lines)
      total_tax_cents          = sum(l.tax_cents for l in lines)
      total_stamping_fee_cents = sum(l.stamping_fee_cents for l in lines)

      # ---- Due date ---------------------------------------------------------
      period_end = last calendar day of the period named by period_key
      due_date   = period_end + program.filing_deadline_days days,
                   at 23:59:59.999Z

      # ---- Late determination is STRICT ------------------------------------
      # A batch prepared at exactly due_date is ON TIME.
      late = clock_now > due_date

      if not late:
          penalty_cents = 0
      else:
          penalty_cents = max(
              round_half_up(max(total_tax_cents, 0) * LATE_PENALTY_RATE),
              LATE_PENALTY_MIN_CENTS)

      # A refund-heavy batch can legitimately owe a negative total.
      total_due_cents = total_tax_cents + total_stamping_fee_cents + penalty_cents
    constants:
      LATE_PENALTY_RATE: 0.10
      LATE_PENALTY_MIN_CENTS: 2500
    precision: "integer cents, round_half_up; totals may be negative; the late comparison is strictly greater-than"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority order.
#
# Every request walks this ladder top to bottom and returns on the FIRST rule
# it violates. When a request violates two rules, the lower-numbered priority
# is the one reported. This ordering is normative and is the subject of the
# scaffold's priority-conflict difficulty instances.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "The request carries both an X-User-ID header and an X-User-Role header, each a non-empty string."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Missing or blank identity headers are rejected before anything else is inspected, including the path."

  - priority: 2
    category: auth
    check: "X-User-Role is one of PlacementBroker, ComplianceOfficer, TaxFiler, StateRegulator, PlatformAdmin."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "An unrecognised role string is treated as a failure to authenticate, not as a permission failure."

  - priority: 3
    category: auth
    check: "The endpoint's `roles:` list contains the acting X-User-Role, or the list is [Any]."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "A recognised role attempting an operation outside its matrix row is forbidden."

  - priority: 4
    category: existence
    check: "Every templated path segment resolves to an existing entity, checked LEFT TO RIGHT."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "For POST /policies/{id}/endorsements the policy is resolved first. When two path ids are both unknown the leftmost one's error is returned."

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing entity, checked in the field order declared by the endpoint's `input:` list."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input contains a FK field"
    description: "Body FK existence is checked after path existence and before field shape, so an unknown carrier_id reports 404 rather than 400."

  - priority: 6
    category: existence
    check: "Every field the endpoint declares as required is present, of the declared type, within the declared range, and a member of the declared enum."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Covers missing required fields, wrong types, out-of-range numerics, malformed two-letter state codes, unknown enum members, and negative money where money must be non-negative."

  - priority: 7
    category: business_referential
    check: "When the acting role is PlacementBroker, the resource being written belongs to that broker: Placement.broker_id, Policy.broker_id, or FilingBatch.broker_id equals the acting X-User-ID."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /placements/{id}/begin-search, POST /placements/{id}/complete-search, POST /placements/{id}/declinations, POST /policies, POST /policies/{id}/affix-notices, POST /policies/{id}/endorsements, POST /policies/{id}/cancellations, POST /policies/{id}/affidavits, POST /endorsements/{id}/issue, POST /endorsements/{id}/void, POST /cancellations/{id}/process, POST /affidavits/{id}/sign"
    description: "Ownership is checked after the body is known to be well-formed, so a malformed payload on someone else's placement reports 400."

  - priority: 8
    category: concurrency
    check: "When the endpoint declares an expected_<parent>_version field, its value equals the parent's current version."
    error_id: "the §1.2.1 rule's error_id"
    http_status: 412
    applies_to: "POST /policies, POST /policies/{id}/endorsements, POST /market-security-reviews/{id}/decide"
    description: "Stale-version rejection precedes every state and business check, so a client holding an outdated view is told to refresh rather than being told its business intent is invalid."

  - priority: 9
    category: state
    check: "The subject entity is in a state from which the requested transition is declared in §1.2."
    error_id: "ERR_INVALID_STATE, or the transition-specific state error named in §1.6"
    http_status: 409
    applies_to: "all state-transition endpoints"
    description: "Includes Placement neither SEARCH_COMPLETE nor BOUND at policy issuance (ERR_PLACEMENT_NOT_BINDABLE), Policy not ISSUED (ERR_POLICY_NOT_ISSUED), Policy tax UNCALCULATED (ERR_TAX_NOT_CALCULATED), notices not affixed (ERR_NOTICES_NOT_AFFIXED), an already-open review (ERR_REVIEW_ALREADY_OPEN), an already-bound placement (ERR_PLACEMENT_ALREADY_BOUND), an empty batch (ERR_BATCH_EMPTY), and every terminal-state re-trigger."

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID is not the same person who performed the paired earlier step."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /filing-batches/{id}/remit, POST /affidavits/{id}/sign"
    description: "On remit, the actor must differ from FilingBatch.prepared_by_user_id. On affidavit signing, the actor must differ from the reviewer_user_id of every APPROVED or CONDITIONAL MarketSecurityReview of the policy's carrier."

  - priority: 11
    category: business_referential
    check: "The broker holds a BrokerLicense of license_type SURPLUS_LINES for the relevant state whose computed status is ACTIVE."
    error_id: ERR_BROKER_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /policies, POST /filing-batches/{id}/submit"
    description: "On policy issuance the relevant state is the placement's home_state; on batch submission it is the batch state's state_code. A license whose expires_on is exactly the current logical clock is LAPSED."

  - priority: 12
    category: business_referential
    check: "The carrier's security_status is APPROVED or CONDITIONAL."
    error_id: ERR_CARRIER_NOT_SECURITY_APPROVED
    http_status: 409
    applies_to: "POST /policies"
    description: "A carrier that is UNREVIEWED or DECLINED may not be used. Checked before the white-list check, so an unreviewed carrier reports its security status rather than its listing."

  - priority: 13
    category: business_referential
    check: "A CarrierEligibility row exists for the carrier and the home state's StateProgram whose listing_status is WHITE_LISTED and whose listing window contains the policy's effective_date."
    error_id: ERR_CARRIER_NOT_WHITE_LISTED
    http_status: 409
    applies_to: "POST /policies"
    description: "The window is [listed_on, removed_on) when removed_on is set and [listed_on, +infinity) otherwise."

  - priority: 14
    category: business_safety
    check: "The requested interval does not collide with an existing occupation of the same resource."
    error_id: "ERR_POLICY_TERM_OVERLAP or ERR_ELIGIBILITY_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /policies, POST /carrier-eligibilities"
    description: "Policy terms on one placement are half-open [effective_date, expiration_date) so back-to-back terms that touch are allowed. Eligibility windows on one carrier-and-state pair are CLOSED [listed_on, removed_on] and additionally require a 30-day cooling-off gap after a removal, so touching windows are rejected."

  - priority: 15
    category: business_fiscal
    check: "The diligent search is sufficient per diligent_search_sufficiency."
    error_id: ERR_DILIGENT_SEARCH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /placements/{id}/complete-search"
    description: "Evaluated only after state, license and interval checks have passed."

  - priority: 16
    category: business_fiscal
    check: "Documentary completeness: required notice codes are all present; an affidavit's attested declination count matches the placement's recorded count; a decision matches its score band; a CONDITIONAL decision carries a note; a REJECT stamping decision carries a reason."
    error_id: "ERR_NOTICES_INCOMPLETE, ERR_AFFIDAVIT_COUNT_MISMATCH, ERR_DECISION_SCORE_MISMATCH, ERR_CONDITIONS_NOTE_REQUIRED, ERR_REJECTION_REASON_REQUIRED"
    http_status: 422
    applies_to: "POST /policies/{id}/affix-notices, POST /affidavits/{id}/sign, POST /market-security-reviews/{id}/decide, POST /policies/{id}/stamping-decision"
    description: "Content-level compliance checks that require the calculation layer to have run."

  - priority: 17
    category: business_fiscal
    check: "The remitted amount equals the batch's computed total_due_cents, and a cancellation date lies inside the policy term."
    error_id: "ERR_REMITTANCE_AMOUNT_MISMATCH, ERR_CANCELLATION_DATE_OUT_OF_TERM, ERR_FLAT_CANCELLATION_NOT_AVAILABLE, ERR_PREMIUM_WOULD_BE_NON_POSITIVE, ERR_HOME_STATE_INDETERMINATE, ERR_ALLOCATION_STATE_PROGRAM_MISSING, ERR_SUPERSEDE_TARGET_INVALID, ERR_ENDORSEMENT_ALREADY_REMITTED"
    http_status: 422
    applies_to: "POST /filing-batches/{id}/remit, POST /cancellations/{id}/process, POST /endorsements/{id}/issue, POST /endorsements/{id}/void, POST /placements, POST /policies/{id}/calculate-tax"
    description: "The last rung: money-and-arithmetic checks that can only be evaluated once every structural, referential and state check has passed."

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "/" — every collection sits at the top level. Nested GETs exist
# purely as reverse-reachability read channels; identity always lives in the
# collection's own id.
#
# Every endpoint accepts `X-User-ID` and `X-User-Role` headers. List endpoints
# additionally accept `limit` and `offset` per §1.0 pagination defaults.
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every time-dependent rule in this API reads this clock, never the wall clock. The clock starts at 2026-08-01T00:00:00Z on a fresh process."
    roles: [Any]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "the logical clock is set to current_utc; BrokerLicense.status recomputation, diligent-search lookback windows and filing-batch lateness all observe the new value immediately"

  # --- Broker ---------------------------------------------------------------
  - method: POST
    path: "/brokers"
    description: "Register a surplus lines brokerage."
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, home_state]
    output: Broker
    side_effects:
      - "status=ACTIVE"

  - method: GET
    path: "/brokers/{id}"
    description: "Retrieve a brokerage."
    roles: [Any]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: POST
    path: "/brokers/{id}/suspend"
    description: "Suspend a brokerage. A suspended brokerage cannot begin a diligent search."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Broker
    side_effects:
      - "Broker.status -> SUSPENDED"
      - "increments Broker.version by 1"

  # --- BrokerLicense --------------------------------------------------------
  - method: POST
    path: "/brokers/{id}/licenses"
    description: "Record a state license held by the brokerage."
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, license_number, license_type, expires_on]
    output: BrokerLicense
    side_effects:
      - "broker_id is taken from the path"
      - "status is computed on read: ACTIVE while the logical clock is strictly before expires_on, otherwise LAPSED"

  - method: GET
    path: "/brokers/{id}/licenses"
    description: "List the licenses held by a brokerage."
    roles: [Any]
    code: 200
    input: ["license_type?", "state_code?", "limit?", "offset?"]
    output: BrokerLicense[]
    side_effects: []

  # --- StateProgram ---------------------------------------------------------
  - method: POST
    path: "/state-programs"
    description: "Configure a state's surplus lines program: its tax and stamping rates, its taxation method, its diligent search requirement, its filing calendar and its required policy notices."
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, premium_tax_rate, stamping_fee_rate, "stamping_fee_cap_cents?", stamping_office_required, allocation_method, diligent_search_min_declinations, export_list_exempts_search, filing_frequency, filing_deadline_days, return_premium_tax_refundable, return_premium_stamping_refundable, min_carrier_capital_surplus_cents, required_notice_codes]
    output: StateProgram
    side_effects:
      - "state_code must be unique across StateProgram, else ERR_STATE_PROGRAM_DUPLICATE"

  - method: GET
    path: "/state-programs/{id}"
    description: "Retrieve a state program."
    roles: [Any]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: PATCH
    path: "/state-programs/{id}"
    description: "Amend a state program's rates, thresholds or calendar. Amending a rate does NOT retroactively change any PolicyStateAllocation row: rates are pinned onto allocation rows when the tax is first calculated."
    roles: [PlatformAdmin]
    code: 200
    input: ["premium_tax_rate?", "stamping_fee_rate?", "stamping_fee_cap_cents?", "stamping_office_required?", "diligent_search_min_declinations?", "filing_deadline_days?", "required_notice_codes?"]
    output: StateProgram
    side_effects:
      - "only the supplied fields change"
      - "increments StateProgram.version by 1"

  # --- Carrier --------------------------------------------------------------
  - method: POST
    path: "/carriers"
    description: "Register a non-admitted (surplus lines) insurer."
    roles: [PlatformAdmin]
    code: 201
    input: [naic_number, legal_name, domicile_type, capital_surplus_cents, am_best_rating, "trust_fund_cents?", "naic_quarterly_listing?"]
    output: Carrier
    side_effects:
      - "security_status=UNREVIEWED"
      - "naic_number must be unique across Carrier, else ERR_CARRIER_DUPLICATE"

  - method: GET
    path: "/carriers/{id}"
    description: "Retrieve an insurer."
    roles: [Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: PATCH
    path: "/carriers/{id}"
    description: "Amend an insurer's financial profile. This is the only way a carrier's version advances outside a security decision, and it is what makes a pending review decision stale."
    roles: [PlatformAdmin]
    code: 200
    input: ["capital_surplus_cents?", "am_best_rating?", "trust_fund_cents?", "naic_quarterly_listing?"]
    output: Carrier
    side_effects:
      - "only the supplied fields change; security_status is NOT re-derived"
      - "increments Carrier.version by 1"

  # --- CarrierEligibility (white list) --------------------------------------
  - method: POST
    path: "/carrier-eligibilities"
    description: "Add an insurer to a state's eligible surplus lines white list, effective from listed_on."
    roles: [StateRegulator]
    code: 201
    input: [carrier_id, state_program_id, listed_on]
    output: CarrierEligibility
    side_effects:
      - "listing_status=WHITE_LISTED, removed_on=null"
      - "the carrier's capital_surplus_cents must be >= the state's min_carrier_capital_surplus_cents, else ERR_CARRIER_BELOW_STATE_CAPITAL_MINIMUM"
      - "the new window must not collide with an existing window on the same carrier and state pair under closed-interval semantics with a 30-day cooling-off buffer, else ERR_ELIGIBILITY_WINDOW_CONFLICT"

  - method: GET
    path: "/carrier-eligibilities/{id}"
    description: "Retrieve a white-list entry."
    roles: [Any]
    code: 200
    input: []
    output: CarrierEligibility
    side_effects: []

  - method: GET
    path: "/carrier-eligibilities"
    description: "List white-list entries, optionally filtered by insurer, state program or listing status."
    roles: [Any]
    code: 200
    input: ["carrier_id?", "state_program_id?", "listing_status?", "limit?", "offset?"]
    output: CarrierEligibility[]
    side_effects: []

  - method: POST
    path: "/carrier-eligibilities/{id}/remove"
    description: "Remove an insurer from a state's white list as of removed_on."
    roles: [StateRegulator]
    code: 200
    input: ["removed_on?"]
    output: CarrierEligibility
    side_effects:
      - "listing_status -> REMOVED, removed_on -> the supplied date"
      - "removed_on must be >= listed_on, else ERR_INVALID_REQUEST"
      - "increments CarrierEligibility.version by 1"

  # --- MarketSecurityReview -------------------------------------------------
  - method: POST
    path: "/carriers/{id}/security-reviews"
    description: "Open a market security review of a non-admitted insurer."
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: MarketSecurityReview
    side_effects:
      - "carrier_id is taken from the path"
      - "status=DRAFT, score=0, variant_applied=null"

  - method: GET
    path: "/carriers/{id}/security-reviews"
    description: "List the market security reviews of an insurer."
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MarketSecurityReview[]
    side_effects: []

  - method: POST
    path: "/market-security-reviews/{id}/start"
    description: "Begin the review. This is where the market_security_score calculation runs and where the INITIAL_REVIEW versus RECERTIFICATION variant is selected."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MarketSecurityReview
    side_effects:
      - "variant_applied -> RECERTIFICATION when an earlier APPROVED review of the same carrier exists, else INITIAL_REVIEW"
      - "score -> market_security_score under the selected variant"
      - "status -> UNDER_REVIEW"
      - "increments MarketSecurityReview.version by 1"

  - method: POST
    path: "/market-security-reviews/{id}/decide"
    description: "Record the compliance decision. The decision must match the score band the review computed."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, expected_carrier_version, "conditions_note?"]
    output: MarketSecurityReview
    side_effects:
      - "decision is one of APPROVE, CONDITION, DECLINE"
      - "reviewer_user_id, capital_surplus_at_review_cents and rating_at_review are pinned from the carrier"
      - "status -> APPROVED, CONDITIONAL or DECLINED; Carrier.security_status mirrors it"
      - "on DECLINE, every WHITE_LISTED CarrierEligibility row of the carrier becomes REMOVED (depth-3 cascade)"
      - "increments MarketSecurityReview.version and Carrier.version by 1 each"

  # --- Placement ------------------------------------------------------------
  - method: POST
    path: "/placements"
    description: "Open a placement file for a risk. The home state is determined here, once, by home_state_determination, and is never recomputed."
    roles: [PlacementBroker]
    code: 201
    input: [insured_name, principal_place_of_business_state, coverage_class, "is_export_list_risk?", state_exposures]
    output: Placement
    side_effects:
      - "broker_id -> acting X-User-ID"
      - "home_state -> home_state_determination result; an exposure schedule with no positive insured value raises ERR_HOME_STATE_INDETERMINATE"
      - "total_insured_value_cents -> sum of state_exposures insured_value_cents"
      - "declination_count=0, status=DRAFT"

  - method: GET
    path: "/placements/{id}"
    description: "Retrieve a placement."
    roles: [Any]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "List placements, optionally filtered by brokerage, home state or status."
    roles: [Any]
    code: 200
    input: ["broker_id?", "home_state?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{id}/begin-search"
    description: "Begin (or re-begin, after a change request) the diligent search of the admitted market."
    roles: [PlacementBroker]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "status -> SEARCH_IN_PROGRESS"
      - "increments Placement.version by 1"

  - method: POST
    path: "/placements/{id}/complete-search"
    description: "Assert that the diligent search is complete. Runs diligent_search_sufficiency."
    roles: [PlacementBroker]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "declination_count -> valid_declination_count"
      - "status -> SEARCH_COMPLETE"
      - "increments Placement.version by 1"

  - method: POST
    path: "/placements/{id}/request-changes"
    description: "Send a completed search back to the broker for revision. Closes the placement's revision cycle."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "declination_count -> 0"
      - "status -> CHANGES_REQUESTED"
      - "increments Placement.version by 1"

  # --- Declination ----------------------------------------------------------
  - method: POST
    path: "/placements/{id}/declinations"
    description: "Record a declination received from an admitted carrier."
    roles: [PlacementBroker]
    code: 201
    input: [admitted_carrier_name, state_code, reason_code, declined_on]
    output: Declination
    side_effects:
      - "placement_id is taken from the path"
      - "status=RECORDED"

  - method: GET
    path: "/placements/{id}/declinations"
    description: "List the declinations recorded against a placement."
    roles: [Any]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: Declination[]
    side_effects: []

  - method: POST
    path: "/declinations/{id}/invalidate"
    description: "Strike a declination from the diligent search record."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Declination
    side_effects:
      - "status -> INVALIDATED; the row stops counting toward diligent_search_sufficiency"
      - "increments Declination.version by 1"

  # --- Policy ---------------------------------------------------------------
  - method: POST
    path: "/policies"
    description: "Issue a surplus lines policy against a completed placement. This is the scaffold's densest gate: ownership, stale placement version, placement state, broker licensing, carrier security, carrier white-listing and term overlap are all checked, in that order."
    roles: [PlacementBroker]
    code: 201
    input: [placement_id, carrier_id, policy_number, effective_date, expiration_date, original_gross_premium_cents, "policy_fee_cents?", "broker_fee_cents?", "min_earned_premium_pct?", expected_placement_version]
    output: Policy
    side_effects:
      - "broker_id -> Placement.broker_id"
      - "home_state -> Placement.home_state (pinned)"
      - "allocation_method_applied -> the home state's StateProgram.allocation_method (pinned)"
      - "gross_premium_cents -> original_gross_premium_cents"
      - "taxable_premium_cents=0, total_tax_cents=0, total_stamping_fee_cents=0 until the tax is calculated"
      - "status=ISSUED, compliance_status=PENDING_NOTICES, tax_status=UNCALCULATED"
      - "stamping_status=PENDING when the home state's stamping_office_required is true, else NOT_REQUIRED"
      - "notice_codes_affixed=[]"
      - "Placement.status -> BOUND (a placement already BOUND stays BOUND and remains bindable for successive terms); increments Placement.version by 1"

  - method: GET
    path: "/policies/{id}"
    description: "Retrieve a policy."
    roles: [Any]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List policies, optionally filtered by placement, insurer, brokerage or tax status."
    roles: [Any]
    code: 200
    input: ["placement_id?", "carrier_id?", "broker_id?", "tax_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: POST
    path: "/policies/{id}/affix-notices"
    description: "Record that the state's required surplus lines notices have been affixed to the policy."
    roles: [PlacementBroker]
    code: 200
    input: [notice_codes]
    output: Policy
    side_effects:
      - "every code in the home state's required_notice_codes must be present, else ERR_NOTICES_INCOMPLETE"
      - "notice_codes_affixed -> the supplied codes, de-duplicated and sorted ASCII ascending"
      - "compliance_status -> NOTICES_AFFIXED"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/calculate-tax"
    description: "Compute the policy's taxable premium, state allocation, premium tax and stamping fee. Deliberately carries no expected_policy_version: a second call is barred by the tax_status precondition, not by a version check."
    roles: [TaxFiler]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "premium_tax_and_stamping_fee runs under Policy.allocation_method_applied"
      - "one PolicyStateAllocation row per allocated state, created in state_code ASC order, with premium_tax_rate_applied and stamping_fee_rate_applied pinned"
      - "one TaxFilingLine with line_type NEW_BUSINESS and status OPEN per allocated state"
      - "taxable_premium_cents, total_tax_cents, total_stamping_fee_cents populated"
      - "tax_status -> CALCULATED"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/submit-stamping"
    description: "Submit the policy to the home state's stamping office."
    roles: [TaxFiler]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "stamping_submitted_at -> current logical clock"
      - "stamping_status -> SUBMITTED"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/stamping-decision"
    description: "Record the stamping office's decision."
    roles: [StateRegulator]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Policy
    side_effects:
      - "decision is one of ACCEPT, REJECT"
      - "on ACCEPT, stamping_status -> ACCEPTED and compliance_status is untouched"
      - "on REJECT, stamping_status -> REJECTED and compliance_status -> DEFICIENT"
      - "increments Policy.version by 1"

  # --- PolicyStateAllocation ------------------------------------------------
  - method: GET
    path: "/policies/{id}/allocations"
    description: "List the policy's per-state premium allocation rows, each carrying the tax and stamping rates pinned at calculation time."
    roles: [Any]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: PolicyStateAllocation[]
    side_effects: []

  # --- Endorsement ----------------------------------------------------------
  - method: POST
    path: "/policies/{id}/endorsements"
    description: "Draft an endorsement to the policy."
    roles: [PlacementBroker]
    code: 201
    input: [endorsement_type, premium_delta_cents, effective_date, "supersedes_endorsement_id?", expected_policy_version]
    output: Endorsement
    side_effects:
      - "policy_id is taken from the path"
      - "sequence_number -> one greater than the highest sequence_number on the policy, starting at 1"
      - "status=DRAFT, tax_adjustment_cents=0, stamping_fee_adjustment_cents=0"

  - method: GET
    path: "/endorsements/{id}"
    description: "Retrieve an endorsement."
    roles: [Any]
    code: 200
    input: []
    output: Endorsement
    side_effects: []

  - method: GET
    path: "/endorsements"
    description: "List endorsements, optionally filtered by policy, superseded endorsement or status."
    roles: [Any]
    code: 200
    input: ["policy_id?", "supersedes_endorsement_id?", "status?", "limit?", "offset?"]
    output: Endorsement[]
    side_effects: []

  - method: POST
    path: "/endorsements/{id}/issue"
    description: "Issue the endorsement. Origin of the scaffold's depth-4 cascade: endorsement status, then policy premium, then allocation rows, then tax filing lines."
    roles: [PlacementBroker]
    code: 200
    input: []
    output: Endorsement
    side_effects:
      - "status -> ISSUED"
      - "endorsement_tax_adjustment runs; Policy premium, allocation rows and totals are recomputed from the full ISSUED set using the pinned percentages and pinned rates"
      - "one TaxFilingLine with line_type ENDORSEMENT and status OPEN per state whose tax or stamping fee moved"
      - "tax_adjustment_cents and stamping_fee_adjustment_cents recorded on the endorsement"
      - "when supersedes_endorsement_id is set, that endorsement is VOIDED first and its own compensating lines are emitted before this endorsement's"
      - "Policy.tax_status -> ADJUSTED"
      - "increments Endorsement.version and Policy.version by 1 each"

  - method: POST
    path: "/endorsements/{id}/void"
    description: "Void an endorsement. Voiding an ISSUED endorsement fully reverses its premium and tax effect; voiding a DRAFT endorsement has no fiscal effect at all."
    roles: [PlacementBroker]
    code: 200
    input: []
    output: Endorsement
    side_effects:
      - "status -> VOIDED"
      - "from ISSUED: policy premium, allocation rows and totals recomputed from the remaining ISSUED set; one compensating TaxFilingLine per affected state, negating the original per-state deltas exactly; Policy.tax_status -> ADJUSTED"
      - "from DRAFT: no TaxFilingLine, no policy field change"
      - "increments Endorsement.version by 1"

  # --- Cancellation ---------------------------------------------------------
  - method: POST
    path: "/policies/{id}/cancellations"
    description: "Request cancellation of the policy."
    roles: [PlacementBroker]
    code: 201
    input: [cancellation_type, cancellation_date]
    output: Cancellation
    side_effects:
      - "policy_id is taken from the path"
      - "status=REQUESTED; all computed money fields start at 0"

  - method: GET
    path: "/policies/{id}/cancellations"
    description: "List the cancellation requests raised against a policy."
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cancellation[]
    side_effects: []

  - method: POST
    path: "/cancellations/{id}/process"
    description: "Process the cancellation: earn premium, compute the return premium and refund the premium tax and stamping fee that the state allows to be refunded."
    roles: [PlacementBroker]
    code: 200
    input: []
    output: Cancellation
    side_effects:
      - "return_premium_and_tax_adjustment runs; earned_premium_cents, return_premium_cents, tax_refund_cents and stamping_fee_refund_cents are written as positive amounts"
      - "one TaxFilingLine with line_type CANCELLATION_RETURN and status OPEN per allocated state, carrying negative amounts"
      - "status -> PROCESSED"
      - "Policy.status -> CANCELLED and Policy.tax_status -> ADJUSTED"
      - "increments Cancellation.version and Policy.version by 1 each"

  # --- TaxFilingLine --------------------------------------------------------
  - method: GET
    path: "/tax-filing-lines/{id}"
    description: "Retrieve a single premium tax filing line."
    roles: [Any]
    code: 200
    input: []
    output: TaxFilingLine
    side_effects: []

  - method: GET
    path: "/tax-filing-lines"
    description: "List premium tax filing lines, optionally filtered by policy, state program, batch, source endorsement, source cancellation, status or period."
    roles: [Any]
    code: 200
    input: ["policy_id?", "state_program_id?", "filing_batch_id?", "source_endorsement_id?", "source_cancellation_id?", "status?", "period_key?", "line_type?", "limit?", "offset?"]
    output: TaxFilingLine[]
    side_effects: []

  # --- FilingBatch ----------------------------------------------------------
  - method: POST
    path: "/filing-batches"
    description: "Open a premium tax filing batch for one state, one brokerage and one filing period."
    roles: [TaxFiler]
    code: 201
    input: [state_program_id, broker_id, period_key]
    output: FilingBatch
    side_effects:
      - "status=OPEN, line_count=0, all money totals 0, penalty_cents=0, late=false, due_date=null"

  - method: GET
    path: "/filing-batches/{id}"
    description: "Retrieve a filing batch."
    roles: [Any]
    code: 200
    input: []
    output: FilingBatch
    side_effects: []

  - method: GET
    path: "/filing-batches"
    description: "List filing batches, optionally filtered by state program, brokerage, status or period."
    roles: [Any]
    code: 200
    input: ["state_program_id?", "broker_id?", "status?", "period_key?", "limit?", "offset?"]
    output: FilingBatch[]
    side_effects: []

  - method: POST
    path: "/filing-batches/{id}/prepare"
    description: "Sweep the brokerage's open filing lines for this state and period into the batch, total them, derive the statutory due date and apply the late-filing penalty."
    roles: [TaxFiler]
    code: 200
    input: []
    output: FilingBatch
    side_effects:
      - "filing_batch_totals_and_penalty runs"
      - "matching OPEN TaxFilingLine rows get filing_batch_id set and status -> BATCHED, in created_at ASC order"
      - "line_count, total_tax_cents, total_stamping_fee_cents, due_date, late, penalty_cents and total_due_cents are written"
      - "prepared_by_user_id -> acting X-User-ID"
      - "status -> PREPARED"
      - "increments FilingBatch.version by 1"

  - method: POST
    path: "/filing-batches/{id}/submit"
    description: "File the batch with the state. Requires the brokerage to hold an ACTIVE surplus lines license in that state."
    roles: [TaxFiler]
    code: 200
    input: []
    output: FilingBatch
    side_effects:
      - "every BATCHED line -> FILED"
      - "each affected Policy advances tax_status to FILED once all of its lines are FILED, VOIDED or REMITTED"
      - "status -> SUBMITTED"
      - "increments FilingBatch.version by 1"

  - method: POST
    path: "/filing-batches/{id}/remit"
    description: "Remit the amount due. The remitter must not be the preparer, and the amount must match the batch total exactly."
    roles: [TaxFiler]
    code: 200
    input: [remitted_amount_cents]
    output: FilingBatch
    side_effects:
      - "the acting X-User-ID must differ from prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
      - "remitted_amount_cents must equal total_due_cents, else ERR_REMITTANCE_AMOUNT_MISMATCH"
      - "every FILED line -> REMITTED"
      - "each affected Policy advances tax_status to REMITTED once all of its lines are REMITTED or VOIDED"
      - "remitted_by_user_id -> acting X-User-ID"
      - "status -> REMITTED"
      - "increments FilingBatch.version by 1"

  # --- Affidavit ------------------------------------------------------------
  - method: POST
    path: "/policies/{id}/affidavits"
    description: "Draft a broker affidavit attesting to the diligent search or to the premium tax reported."
    roles: [PlacementBroker]
    code: 201
    input: [affidavit_type, declination_count_attested]
    output: Affidavit
    side_effects:
      - "policy_id is taken from the path"
      - "status=DRAFT, signed_by_user_id=null, signed_at=null"

  - method: GET
    path: "/policies/{id}/affidavits"
    description: "List the affidavits drafted against a policy."
    roles: [Any]
    code: 200
    input: ["affidavit_type?", "status?", "limit?", "offset?"]
    output: Affidavit[]
    side_effects: []

  - method: POST
    path: "/affidavits/{id}/sign"
    description: "Sign the affidavit. The signer must not be a compliance officer who approved the policy's insurer, and the attested declination count must match the placement's record."
    roles: [PlacementBroker, ComplianceOfficer]
    code: 200
    input: []
    output: Affidavit
    side_effects:
      - "the acting X-User-ID must not be the reviewer_user_id of any APPROVED or CONDITIONAL MarketSecurityReview of the policy's carrier, else ERR_SEGREGATION_OF_DUTIES"
      - "declination_count_attested must equal Placement.declination_count, else ERR_AFFIDAVIT_COUNT_MISMATCH"
      - "signed_by_user_id -> acting X-User-ID, signed_at -> current logical clock"
      - "status -> SIGNED"
      - "when affidavit_type is DILIGENT_SEARCH and Policy.compliance_status is NOTICES_AFFIXED, Policy.compliance_status -> COMPLIANT and Policy.version increments by 1"
      - "increments Affidavit.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Authentication and authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role is missing or blank, or X-User-Role is not one of the five declared roles."
    applies_to: [all]

  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "The acting role is not listed in the endpoint's roles."
    applies_to: [all]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "A PlacementBroker acts on a placement, policy, endorsement, cancellation, affidavit or filing batch that belongs to a different brokerage."
    applies_to: ["POST /placements/{id}/begin-search", "POST /placements/{id}/complete-search", "POST /placements/{id}/declinations", "POST /policies", "POST /policies/{id}/affix-notices", "POST /policies/{id}/endorsements", "POST /policies/{id}/cancellations", "POST /policies/{id}/affidavits", "POST /endorsements/{id}/issue", "POST /endorsements/{id}/void", "POST /cancellations/{id}/process", "POST /affidavits/{id}/sign"]

  # --- Request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "A required field is missing, a value has the wrong type, a numeric value is out of range, a state code is not exactly two uppercase letters, an enum value is unrecognised, expiration_date is not strictly after effective_date, or removed_on precedes listed_on."
    applies_to: [all]

  # --- Existence (404) ------------------------------------------------------
  - id: ERR_BROKER_NOT_FOUND
    http_status: 404
    condition: "No Broker with the given id, whether from the path or from a body broker_id."
    applies_to: ["GET /brokers/{id}", "POST /brokers/{id}/suspend", "POST /brokers/{id}/licenses", "GET /brokers/{id}/licenses", "POST /filing-batches"]

  - id: ERR_STATE_PROGRAM_NOT_FOUND
    http_status: 404
    condition: "No StateProgram with the given id, whether from the path or from a body state_program_id."
    applies_to: ["GET /state-programs/{id}", "PATCH /state-programs/{id}", "POST /carrier-eligibilities", "POST /filing-batches"]

  - id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    condition: "No Carrier with the given id, whether from the path or from a body carrier_id."
    applies_to: ["GET /carriers/{id}", "PATCH /carriers/{id}", "POST /carriers/{id}/security-reviews", "GET /carriers/{id}/security-reviews", "POST /carrier-eligibilities", "POST /policies"]

  - id: ERR_CARRIER_ELIGIBILITY_NOT_FOUND
    http_status: 404
    condition: "No CarrierEligibility with the given id."
    applies_to: ["GET /carrier-eligibilities/{id}", "POST /carrier-eligibilities/{id}/remove"]

  - id: ERR_MARKET_SECURITY_REVIEW_NOT_FOUND
    http_status: 404
    condition: "No MarketSecurityReview with the given id."
    applies_to: ["POST /market-security-reviews/{id}/start", "POST /market-security-reviews/{id}/decide"]

  - id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    condition: "No Placement with the given id, whether from the path or from a body placement_id."
    applies_to: ["GET /placements/{id}", "POST /placements/{id}/begin-search", "POST /placements/{id}/complete-search", "POST /placements/{id}/request-changes", "POST /placements/{id}/declinations", "GET /placements/{id}/declinations", "POST /policies"]

  - id: ERR_DECLINATION_NOT_FOUND
    http_status: 404
    condition: "No Declination with the given id."
    applies_to: ["POST /declinations/{id}/invalidate"]

  - id: ERR_POLICY_NOT_FOUND
    http_status: 404
    condition: "No Policy with the given id."
    applies_to: ["GET /policies/{id}", "POST /policies/{id}/affix-notices", "POST /policies/{id}/calculate-tax", "POST /policies/{id}/submit-stamping", "POST /policies/{id}/stamping-decision", "GET /policies/{id}/allocations", "POST /policies/{id}/endorsements", "POST /policies/{id}/cancellations", "GET /policies/{id}/cancellations", "POST /policies/{id}/affidavits", "GET /policies/{id}/affidavits"]

  - id: ERR_ENDORSEMENT_NOT_FOUND
    http_status: 404
    condition: "No Endorsement with the given id, whether from the path or from a body supersedes_endorsement_id."
    applies_to: ["GET /endorsements/{id}", "POST /endorsements/{id}/issue", "POST /endorsements/{id}/void", "POST /policies/{id}/endorsements"]

  - id: ERR_CANCELLATION_NOT_FOUND
    http_status: 404
    condition: "No Cancellation with the given id."
    applies_to: ["POST /cancellations/{id}/process"]

  - id: ERR_TAX_FILING_LINE_NOT_FOUND
    http_status: 404
    condition: "No TaxFilingLine with the given id."
    applies_to: ["GET /tax-filing-lines/{id}"]

  - id: ERR_FILING_BATCH_NOT_FOUND
    http_status: 404
    condition: "No FilingBatch with the given id."
    applies_to: ["GET /filing-batches/{id}", "POST /filing-batches/{id}/prepare", "POST /filing-batches/{id}/submit", "POST /filing-batches/{id}/remit"]

  - id: ERR_AFFIDAVIT_NOT_FOUND
    http_status: 404
    condition: "No Affidavit with the given id."
    applies_to: ["POST /affidavits/{id}/sign"]

  # --- Optimistic concurrency (412) ----------------------------------------
  - id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412
    condition: "expected_placement_version does not equal the placement's current version."
    applies_to: ["POST /policies"]

  - id: ERR_STALE_POLICY_VERSION
    http_status: 412
    condition: "expected_policy_version does not equal the policy's current version."
    applies_to: ["POST /policies/{id}/endorsements"]

  - id: ERR_STALE_CARRIER_VERSION
    http_status: 412
    condition: "expected_carrier_version does not equal the carrier's current version."
    applies_to: ["POST /market-security-reviews/{id}/decide"]

  # --- State (409) ----------------------------------------------------------
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "The requested transition is not declared from the entity's current state, and no more specific state error covers the case. Includes every terminal-state re-trigger and every repeat of a once-only action such as calculating tax twice."
    applies_to: [all state-transition endpoints]

  - id: ERR_PLACEMENT_NOT_BINDABLE
    http_status: 409
    condition: "A policy is issued against a placement whose status is neither SEARCH_COMPLETE nor BOUND — that is, one still in DRAFT, SEARCH_IN_PROGRESS or CHANGES_REQUESTED."
    applies_to: ["POST /policies"]

  - id: ERR_PLACEMENT_ALREADY_BOUND
    http_status: 409
    condition: "A change request or a declination invalidation is attempted on a placement that already carries a policy."
    applies_to: ["POST /placements/{id}/request-changes", "POST /declinations/{id}/invalidate"]

  - id: ERR_POLICY_NOT_ISSUED
    http_status: 409
    condition: "An endorsement is issued or a cancellation is processed on a policy whose status is not ISSUED."
    applies_to: ["POST /endorsements/{id}/issue", "POST /cancellations/{id}/process"]

  - id: ERR_TAX_NOT_CALCULATED
    http_status: 409
    condition: "An endorsement issue, a cancellation processing or a stamping submission is attempted while the policy's tax_status is still UNCALCULATED."
    applies_to: ["POST /endorsements/{id}/issue", "POST /cancellations/{id}/process", "POST /policies/{id}/submit-stamping"]

  - id: ERR_NOTICES_NOT_AFFIXED
    http_status: 409
    condition: "A stamping submission is attempted while the policy's compliance_status is still PENDING_NOTICES or already DEFICIENT."
    applies_to: ["POST /policies/{id}/submit-stamping"]

  - id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    condition: "A market security review is started while another review of the same carrier is UNDER_REVIEW."
    applies_to: ["POST /market-security-reviews/{id}/start"]

  - id: ERR_BROKER_SUSPENDED
    http_status: 409
    condition: "A diligent search is begun on behalf of a brokerage whose status is SUSPENDED."
    applies_to: ["POST /placements/{id}/begin-search"]

  - id: ERR_BATCH_EMPTY
    http_status: 409
    condition: "A filing batch with line_count 0 is submitted."
    applies_to: ["POST /filing-batches/{id}/submit"]

  - id: ERR_ENDORSEMENT_ALREADY_REMITTED
    http_status: 409
    condition: "An ISSUED endorsement is voided after at least one of its tax filing lines has reached status REMITTED."
    applies_to: ["POST /endorsements/{id}/void"]

  # --- Segregation of duties and licensing (409) ---------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "The remitter of a filing batch is also its preparer, or the signer of an affidavit is a compliance officer who decided an APPROVED or CONDITIONAL market security review of the policy's carrier."
    applies_to: ["POST /filing-batches/{id}/remit", "POST /affidavits/{id}/sign"]

  - id: ERR_BROKER_LICENSE_NOT_ACTIVE
    http_status: 409
    condition: "The brokerage holds no BrokerLicense of license_type SURPLUS_LINES for the relevant state whose computed status is ACTIVE."
    applies_to: ["POST /policies", "POST /filing-batches/{id}/submit"]

  # --- Carrier eligibility (409) -------------------------------------------
  - id: ERR_CARRIER_NOT_SECURITY_APPROVED
    http_status: 409
    condition: "The carrier's security_status is UNREVIEWED or DECLINED at policy issuance."
    applies_to: ["POST /policies"]

  - id: ERR_CARRIER_NOT_WHITE_LISTED
    http_status: 409
    condition: "No WHITE_LISTED CarrierEligibility row covers the carrier and the home state on the policy's effective_date."
    applies_to: ["POST /policies"]

  - id: ERR_CARRIER_BELOW_STATE_CAPITAL_MINIMUM
    http_status: 409
    condition: "A carrier whose capital_surplus_cents is below the state's min_carrier_capital_surplus_cents is added to that state's white list."
    applies_to: ["POST /carrier-eligibilities"]

  # --- Interval conflicts (409) --------------------------------------------
  - id: ERR_POLICY_TERM_OVERLAP
    http_status: 409
    condition: "The new policy's half-open term [effective_date, expiration_date) intersects the term of an existing non-CANCELLED policy on the same placement. Adjacency, where one term's expiration equals the next term's effective instant, is allowed."
    applies_to: ["POST /policies"]

  - id: ERR_ELIGIBILITY_WINDOW_CONFLICT
    http_status: 409
    condition: "The new white-list window on the same carrier and state pair collides with an existing window under closed-interval semantics, or begins within the 30-day cooling-off buffer that follows an existing window's removed_on."
    applies_to: ["POST /carrier-eligibilities"]

  # --- Uniqueness (409) ----------------------------------------------------
  - id: ERR_STATE_PROGRAM_DUPLICATE
    http_status: 409
    condition: "A StateProgram already exists for the given state_code."
    applies_to: ["POST /state-programs"]

  - id: ERR_CARRIER_DUPLICATE
    http_status: 409
    condition: "A Carrier already exists with the given naic_number."
    applies_to: ["POST /carriers"]

  # --- Fiscal and documentary (422) ---------------------------------------
  - id: ERR_HOME_STATE_INDETERMINATE
    http_status: 422
    condition: "The placement's state_exposures array is empty or contains no row with insured_value_cents greater than zero, so no home state can be determined."
    applies_to: ["POST /placements"]

  - id: ERR_DILIGENT_SEARCH_INSUFFICIENT
    http_status: 422
    condition: "The count of valid home-state declinations is below the state's diligent_search_min_declinations and no export-list exemption applies."
    applies_to: ["POST /placements/{id}/complete-search"]

  - id: ERR_ALLOCATION_STATE_PROGRAM_MISSING
    http_status: 422
    condition: "The tax calculation needs a StateProgram for a state the policy allocates premium to, and none is configured."
    applies_to: ["POST /policies/{id}/calculate-tax"]

  - id: ERR_NOTICES_INCOMPLETE
    http_status: 422
    condition: "The supplied notice_codes array omits at least one code from the home state's required_notice_codes."
    applies_to: ["POST /policies/{id}/affix-notices"]

  - id: ERR_AFFIDAVIT_COUNT_MISMATCH
    http_status: 422
    condition: "declination_count_attested does not equal the placement's recorded declination_count."
    applies_to: ["POST /affidavits/{id}/sign"]

  - id: ERR_DECISION_SCORE_MISMATCH
    http_status: 422
    condition: "The submitted decision does not match the band the review's score falls into: APPROVE requires score >= 70, CONDITION requires 50 <= score < 70, DECLINE requires score < 50."
    applies_to: ["POST /market-security-reviews/{id}/decide"]

  - id: ERR_CONDITIONS_NOTE_REQUIRED
    http_status: 422
    condition: "A CONDITION decision is submitted without a non-empty conditions_note."
    applies_to: ["POST /market-security-reviews/{id}/decide"]

  - id: ERR_REJECTION_REASON_REQUIRED
    http_status: 422
    condition: "A REJECT stamping decision is submitted without a non-empty rejection_reason."
    applies_to: ["POST /policies/{id}/stamping-decision"]

  - id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    condition: "supersedes_endorsement_id names an endorsement that is not ISSUED, or that belongs to a different policy."
    applies_to: ["POST /endorsements/{id}/issue"]

  - id: ERR_PREMIUM_WOULD_BE_NON_POSITIVE
    http_status: 422
    condition: "Issuing the endorsement would drive the policy's gross_premium_cents to zero or below."
    applies_to: ["POST /endorsements/{id}/issue"]

  - id: ERR_CANCELLATION_DATE_OUT_OF_TERM
    http_status: 422
    condition: "cancellation_date precedes the policy's effective_date or follows its expiration_date."
    applies_to: ["POST /cancellations/{id}/process"]

  - id: ERR_FLAT_CANCELLATION_NOT_AVAILABLE
    http_status: 422
    condition: "A FLAT cancellation is processed with a cancellation_date later than the policy's effective_date."
    applies_to: ["POST /cancellations/{id}/process"]

  - id: ERR_PERIOD_KEY_MALFORMED
    http_status: 422
    condition: "period_key does not match the format the state's filing_frequency requires: YYYY-MM for MONTHLY, YYYY-Qn for QUARTERLY."
    applies_to: ["POST /filing-batches/{id}/prepare"]

  - id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http_status: 422
    condition: "remitted_amount_cents does not equal the batch's total_due_cents."
    applies_to: ["POST /filing-batches/{id}/remit"]

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
#
# Identity is carried by the X-User-ID header. For PlacementBroker the header
# value IS a Broker.id, which is what makes ownership checkable. The other four
# roles are opaque user identifiers with no backing entity; the segregation
# rules compare them by value only.
# =============================================================================
roles:

  - name: PlacementBroker
    description: "A licensed surplus lines broker acting for its own brokerage. Opens placements, documents the diligent search, binds policies, endorses and cancels them, and signs affidavits."
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /placements"
      - "POST /placements/{id}/begin-search"
      - "POST /placements/{id}/complete-search"
      - "POST /placements/{id}/declinations"
      - "POST /policies"
      - "POST /policies/{id}/affix-notices"
      - "POST /policies/{id}/endorsements"
      - "POST /endorsements/{id}/issue"
      - "POST /endorsements/{id}/void"
      - "POST /policies/{id}/cancellations"
      - "POST /cancellations/{id}/process"
      - "POST /policies/{id}/affidavits"
    shared_operations:
      - "POST /affidavits/{id}/sign (shared with ComplianceOfficer)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Reviews the security of non-admitted carriers, sends deficient placements back for revision, strikes invalid declinations, and may counter-sign affidavits — but never on a policy whose carrier it cleared."
    identity: opaque
    exclusive_operations:
      - "POST /carriers/{id}/security-reviews"
      - "POST /market-security-reviews/{id}/start"
      - "POST /market-security-reviews/{id}/decide"
      - "POST /placements/{id}/request-changes"
      - "POST /declinations/{id}/invalidate"
    shared_operations:
      - "POST /affidavits/{id}/sign (shared with PlacementBroker)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TaxFiler
    description: "Calculates premium tax and stamping fees, submits policies to stamping offices, and runs the filing calendar. The preparer of a batch may never be its remitter."
    identity: opaque
    exclusive_operations:
      - "POST /policies/{id}/calculate-tax"
      - "POST /policies/{id}/submit-stamping"
      - "POST /filing-batches"
      - "POST /filing-batches/{id}/prepare"
      - "POST /filing-batches/{id}/submit"
      - "POST /filing-batches/{id}/remit"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: StateRegulator
    description: "Maintains the state's eligible surplus lines white list and renders stamping office decisions."
    identity: opaque
    exclusive_operations:
      - "POST /carrier-eligibilities"
      - "POST /carrier-eligibilities/{id}/remove"
      - "POST /policies/{id}/stamping-decision"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: PlatformAdmin
    description: "Registers brokerages, licenses, state programs and carriers, and amends carrier financials and state program configuration. Holds no power over any placement, policy, tax or filing operation — this is deliberate, so the segregation rules cannot be bypassed by an administrator."
    identity: opaque
    exclusive_operations:
      - "POST /brokers"
      - "POST /brokers/{id}/suspend"
      - "POST /brokers/{id}/licenses"
      - "POST /state-programs"
      - "PATCH /state-programs/{id}"
      - "POST /carriers"
      - "PATCH /carriers/{id}"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
