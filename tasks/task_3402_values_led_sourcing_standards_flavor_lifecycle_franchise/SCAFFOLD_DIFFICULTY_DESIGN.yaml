              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-P1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 80 }
              as: SourcingManager
              captures: { c1_id: $.data.id }
            - call: "POST /creamery/certifications/${c1_id}/verify"
              payload: { verified_coverage_pct: 80 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "NON_GMO", certificate_number: "NG-P2", ingredient_scope: "COCOA", issued_at: "2026-01-01T00:00:00Z", valid_until: "2026-09-10T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { c2_id: $.data.id }
            - call: "POST /creamery/certifications/${c2_id}/verify"
              payload: { verified_coverage_pct: 90 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Half Verified", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c1_id}", "${c2_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/flavors/${f_id}/publish-claim"
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_COVERAGE_INSUFFICIENT (HTTP 422): compliance/safety check wins"
            - "err != ERR_CERT_NOT_VERIFIED even though cited cert ${c2_id} is EXPIRED at publish time"
            - "Flavor.${f_id}.claim_coverage_verified_pct == 85.0 (below threshold 95)"

  - rule_id: boundary_precision_check
    instances:
      - name: revival_threshold_exact_500
        grounds:
          - calculations.revival_qualification
          - state_machines.RevivalRequest.OPEN_to_QUALIFIED
          - entities.RevivalRequest.fields.signature_count
        distinguishing_aspect: |
          Count metric on the sign endpoint: the qualification threshold is
          inclusive — exactly 500 signatures flips the request to QUALIFIED,
          while 499 leaves it OPEN. Boundary sits on signature_count, reached
          via POST /revival-requests/{id}/sign.
        test_recipe:
          setup:
            - "Flavor retired (LIMITED_RUN -> RETIRED) at the default logical time"
            - "RevivalRequest OPEN with 0 signatures"
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Gone But Loved", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "starter@x.com", title: "Revive it" }
              as: Fan
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "fan-a@x.com", count: 499 }
              as: Fan
              captures: { mid_status: $.data.status, mid_count: $.data.signature_count }
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "fan-b@x.com", count: 1 }
              as: Fan
              captures: { end_status: $.data.status, end_count: $.data.signature_count, q_at: $.data.qualified_at }
          assert:
            - "mid_count == 499 and mid_status == OPEN (499 does not qualify)"
            - "end_count == 500 and end_status == QUALIFIED (exactly 500 qualifies; threshold is >=)"
            - "q_at == 2026-09-01T00:00:00Z (logical clock default at qualification)"

      - name: claim_coverage_exact_threshold_publishes
        grounds:
          - calculations.claim_coverage
          - "validations[priority=10]"
        distinguishing_aspect: |
          Percentage metric on the publish endpoint (different metric and
          endpoint from revival_threshold_exact_500): a verified coverage of
          exactly 95.0 meets the FAIR_TRADE_SOURCING threshold because the gate
          is >=, so publish succeeds at the boundary.
        test_recipe:
          setup:
            - "Supplier APPROVED with one VERIFIED DAIRY cert, declared 95 / verified 95, valid to 2027-06-01"
            - "Flavor DAIRY LIMITED_RUN with claim FAIR_TRADE_SOURCING substantiated citing only that cert"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Exact Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-B95", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Boundary Batch", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
