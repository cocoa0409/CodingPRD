            - call: "POST /load-sheets"
              payload: { load_plan_id: "${lp1}", expected_load_plan_version: "${lp1_ver}" }
              as: LoadController
              as_user_id: "lc-01"
              captures: { sh1: $.data.id }
          assert:
            - "before the triggers: LoadPlan.${lp1}.base_payload_kg == 6100.00 (the BOOKED 400 kg consignment is excluded)"
            - "before the triggers: LoadPlan.${lp1}.index_zfw == 78.66, zero_fuel_weight_kg == 48650.00, mac_zfw_pct == 14.03"
            - "before the triggers: LoadPlan.${lp1}.takeoff_weight_kg == 58200.00, index_tow == 87.26, mac_tow_pct == 15.24, underload_kg == 14080.00"
            - "before the triggers: Flight.${f1}.dg_hold_count == 1 and Flight.${f1}.load_release_state == HELD_FOR_DG"
