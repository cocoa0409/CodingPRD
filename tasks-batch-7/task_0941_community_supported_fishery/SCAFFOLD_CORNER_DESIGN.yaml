  - section: errors
    instances:
      - name: error_season_closed_blocks_writes_after_true_up
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_SEASON_CLOSED]", "state_machines.Season.TRUE_UP_to_CLOSED"]
        distinguishing_aspect: "Once the true-up run has driven the season to CLOSED, the global write gate at priority 24 refuses any further write on that season's resources with 409 ERR_SEASON_CLOSED, ahead of the per-resource state rung."
        test_recipe:
          setup: ["a season taken through OPEN, LANDINGS_CLOSED and the true-up sweep, so its status is CLOSED and its one subscription is COMPLETED"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
              captures: { plan_med_id: $.data.id }
            - call: "POST /csf/pickup-hubs"
              payload: { hub_code: "HUB-A", cooler_slots_default: 4, grace_minutes: 90 }
              as: CsfAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Mara One", email: "m1@csf.test" }
              as: CsfAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m1_id}", share_plan_id: "${plan_med_id}", season_id: "${season_id}", fulfillment_mode: "HUB_PICKUP", payment_basis: "INSTALLMENT", join_week_index: 20, pickup_hub_id: "${hub_id}" }
              as: CsfAdmin
              captures: { sub1_id: $.data.id }
            - call: "POST /csf/subscriptions/${sub1_id}/activate"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/close-landings"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/true-up"
              payload: {}
              as: CsfAdmin
          trigger:
            - call: "POST /csf/subscriptions/${sub1_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == ERR_SEASON_CLOSED"
            - "Season.${season_id}.status == CLOSED"
            - "Subscription.${sub1_id}.lifecycle_status == COMPLETED"

      - name: error_dislike_alternative_available_soft_blocks_the_offer
        claim_type: violation_to_error
        grounds: ["validations[priority=39]", "errors[ERR_DISLIKE_ALTERNATIVE_AVAILABLE]", "entities.Member.fields.dislikes"]
        distinguishing_aspect: "COD is only a soft block: because HADDOCK is offered this season and sits in a CLEAR lot the member neither dislikes nor is allergic to, the COD offer is refused with 422 ERR_DISLIKE_ALTERNATIVE_AVAILABLE at priority 39 rather than being allowed through."
        test_recipe:
          setup:
            - "an OPEN season offering SALMON, COD and HADDOCK, with a MEDIUM x PREMIUM_FINFISH x WEEKLY plan"
            - "one ACTIVE HUB_PICKUP member whose dislikes contain COD and whose allergy list is empty"
            - "a 3.00 lb SALMON lot allocated to the week-1 box, leaving it UNDER_FILLED"
            - "a 6.00 lb COD lot and a 6.00 lb HADDOCK lot, both RECORDED and CLEAR, so an acceptable alternative exists"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON", "COD", "HADDOCK"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
              captures: { plan_med_id: $.data.id }
            - call: "POST /csf/pickup-hubs"
              payload: { hub_code: "HUB-A", cooler_slots_default: 4, grace_minutes: 90 }
              as: CsfAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Mara One", email: "m1@csf.test", dislikes: ["COD"] }
              as: CsfAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m1_id}", share_plan_id: "${plan_med_id}", season_id: "${season_id}", fulfillment_mode: "HUB_PICKUP", payment_basis: "INSTALLMENT", join_week_index: 1, pickup_hub_id: "${hub_id}" }
              as: CsfAdmin
              captures: { sub1_id: $.data.id }
            - call: "POST /csf/subscriptions/${sub1_id}/activate"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_salmon_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_cod_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "HADDOCK", management_area: "GOM-5", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_had_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_salmon_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip1_id: $.data.id }
            - call: "POST /csf/trips/${trip1_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 3.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot1_id: $.data.id, lot1_v: $.data.version }
            - call: "POST /csf/landing-lots/${lot1_id}/allocations"
              payload: { week_index: 1, expected_landing_lot_version: "${lot1_v}" }
              as: CsfAdmin
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_cod_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip2_id: $.data.id }
            - call: "POST /csf/trips/${trip2_id}/land"
              payload: { species: "COD", landed_pounds_gross: 6.00, ex_vessel_price_cents_per_lb: 700, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot2_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_had_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-5" }
              as: CsfAdmin
              captures: { trip3_id: $.data.id }
            - call: "POST /csf/trips/${trip3_id}/land"
              payload: { species: "HADDOCK", landed_pounds_gross: 6.00, ex_vessel_price_cents_per_lb: 700, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot3_id: $.data.id }
            - call: "GET /csf/share-deliveries"
              payload: { subscription_id: "${sub1_id}", week_index: 1 }
              as: CsfAdmin
              captures: { d1_id: "$.data[0].id" }
          trigger:
            - call: "POST /csf/share-deliveries/${d1_id}/substitutions"
              payload: { substitute_landing_lot_id: "${lot2_id}", substitute_pounds: 2.00 }
              as: CsfAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422"
            - "${err_id} == ERR_DISLIKE_ALTERNATIVE_AVAILABLE"
            - "ShareDelivery.${d1_id}.fill_status == UNDER_FILLED"
            - "LandingLot.${lot3_id}.species == HADDOCK"
            - "LandingLot.${lot3_id}.quality_status == CLEAR"

      - name: error_window_not_open_on_pickup_before_the_window_opens
