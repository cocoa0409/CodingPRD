              captures: { t_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_id}", title_id: "${t_id}", requested_by_school_id: "${s_id}" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /title-approvals/${ap_id}/decision"
              payload: { action: "APPROVE" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /coaches/${c_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { tm1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Ada Lin", birthdate: "2009-05-10", grade_level: 11 }
              as: LeagueAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st1_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { sl1_id: $.data.id }
          trigger:
            - call: "POST /roster-slots/${sl1_id}/release"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
            - call: "POST /coaches/${c_id}/certification"
              payload: { action: "SUSPEND" }
              as: LeagueAdmin
            - call: "POST /coaches/${c_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2028-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "GET /coaches/${c_id}"
              as: LeagueAdmin
          assert:
            - "trigger 1 returns 200 (not 201) with the complete RosterSlot representation: id, team_id, student_id, slot_role, verification_status, academic_status, participation_status == RELEASED, released_at == 2026-08-01T00:00:00.000Z, version == 2, created_at and updated_at"
            - "the optional release_note was omitted and the call still succeeded; RosterSlot.${sl1_id}.release_note is null"
            - "after trigger 1 Team.${tm1_id}.starter_slots_used == 0 and starter_slots_available == 3 — the action's declared side effects fired even with an empty body"
            - "trigger 2 returns 200 with the complete Coach representation, data.certification_status == SUSPENDED and data.version == 3 (create 1 -> CERTIFY 2 -> SUSPEND 3), executed by LeagueAdmin with no ownership check"
            - "trigger 2 left data.background_check_expires_on at 2027-06-30 — the SUSPEND branch does not touch it"
            - "trigger 3 returns 200 from the AthleticDirector whose X-User-ID equals ${s_id}, with data.certification_status == CERTIFIED, data.background_check_expires_on == 2028-06-30 and data.version == 4 — the same action endpoint behaves identically for both declared roles"
            - "trigger 4 shows exactly the same field values as trigger 3's response body — the action response is the authoritative post-state, not a partial projection"
            - "no other entity's version moved: Team.${tm1_id}.version and Student.${st1_id}.version are unchanged by triggers 2 and 3"

      - name: every_fk_reverse_lookup_filter_is_scoped_and_composable
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /title-approvals]
          - endpoints[GET /seasons]
          - endpoints[GET /fair-play-cases]
          - entities.TitleApproval.fields.district_id
          - entities.FairPlayCase.fields.subject_student_id
        distinguishing_aspect: |
          The FK reverse-reachability surface: every declared filter must narrow to the
          rows that actually hold that foreign key, filters must AND with each other
          rather than replace one another, and a filter pair that matches nothing must
          return an empty array with total_count 0 instead of falling back to the
          unfiltered set. Two districts, two titles and two teams are built so that every
          filter has a row it must EXCLUDE.
        test_recipe:
