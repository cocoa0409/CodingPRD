            - "EnrollmentCertification.${cert1}.mha_term_total_cents == 618306"
            - "EnrollmentCertification.${cert1}.status == CERTIFIED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mha_term_total_per_segment_rounding_then_sum
        grounds:
          - calculations.mha_term_total
          - calculations.rate_of_pursuit_and_training_time
          - entities.EnrollmentCertification.fields.mha_term_total_cents
          - state_machines.EnrollmentCertification.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (b): the housing total is a multi-step chain in which each of the five
          calendar-month segments is rounded to whole cents BEFORE summation, so the
          intermediate rounding is observable — 56987 + 213700 + 213700 + 213700 +
          78357 == 776444, whereas summing billable days first and rounding once
          yields 776443. The 30-day full-month convention also makes a 31-day October
          and a 30-day November bill the identical 213700 cents.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "Program BSN-UG APPROVED, full_time_credit_hours 12, campus_bah_monthly_cents 213700."
            - "Term FA2026 2026-08-24..2026-12-11 (110 inclusive days spanning five calendar-month segments: 8 partial days in August, three whole months, 11 partial days in December)."
            - "Student V-1001 CH33 at benefit_level_pct 100 with a VERIFIED COE."
            - "Certification cert1 for 12 of 12 residential credits is SUBMITTED with a REPORTED TuitionFeeReport."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
