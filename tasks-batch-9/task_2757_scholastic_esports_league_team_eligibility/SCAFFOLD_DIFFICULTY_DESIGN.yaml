            - call: "POST /matches/${m3_id}/result-reports"
              payload: { reporting_team_id: "${tm_b_id}", home_games_won: 2, away_games_won: 1, expected_match_version: "${m3_v1}" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { m3_v2: $.data.version }
            - call: "POST /matches/${m3_id}/result-reports"
              payload: { reporting_team_id: "${tm_c_id}", home_games_won: 2, away_games_won: 1, expected_match_version: "${m3_v2}" }
              as: Coach
              as_user_id: "${c_c_id}"
          trigger:
            - call: "POST /seasons/${se_id}/seeding"
              payload: {}
              as: LeagueAdmin
            - call: "POST /seasons/${se_id}/seeding"
              payload: { basis_override: "WIN_PERCENTAGE_BASIS" }
              as: LeagueAdmin
          assert:
            - "after the first trigger call Season.${se_id}.seeding_basis_applied == MATCH_POINT_BASIS"
            - "after the first trigger call Team.${tm_a_id}.seed_points == 6.0000 and Team.${tm_a_id}.seed_position == 1 and Team.${tm_a_id}.status == PLAYOFF_SEEDED"
            - "after the first trigger call Team.${tm_b_id}.seed_points == 3.0000 and Team.${tm_b_id}.seed_position == 2 and Team.${tm_b_id}.status == PLAYOFF_SEEDED"
            - "after the first trigger call Team.${tm_c_id}.seed_points == 0.0000 and Team.${tm_c_id}.seed_position == 3 and Team.${tm_c_id}.status == ELIMINATED"
            - "after the second trigger call Season.${se_id}.seeding_basis_applied == WIN_PERCENTAGE_BASIS"
            - "after the second trigger call Team.${tm_a_id}.seed_points == 0.0000 and Team.${tm_a_id}.seed_position == 2"
            - "after the second trigger call Team.${tm_b_id}.seed_points == 1.0000 and Team.${tm_b_id}.seed_position == 1"
            - "after the second trigger call Team.${tm_c_id}.seed_points == 0.0000 and Team.${tm_c_id}.seed_position == 3 (broken away from Alpha by head-to-head points 0 vs 3 inside the tied group)"
            - "Season.${se_id}.seed_order == [${tm_a_id}, ${tm_b_id}, ${tm_c_id}] after the first call and [${tm_b_id}, ${tm_a_id}, ${tm_c_id}] after the second"
            - "Season.${se_id}.match_point_pool == 9 and is unchanged by either seeding run"
            - "Team.${tm_a_id}.match_points == 6, Team.${tm_b_id}.match_points == 3, Team.${tm_c_id}.match_points == 0 (unchanged by either seeding run)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: integrity_score_repeat_multiplier_ladder_lands_exactly_on_the_suspension_floor
        mode: a
        grounds:
          - calculations.team_integrity_score
          - entities.FairPlayCase.fields.severity_weight
          - entities.FairPlayCase.fields.repeat_index
          - entities.FairPlayCase.fields.applied_penalty
          - entities.FairPlayCase.fields.sanction_type
          - entities.Team.fields.integrity_score
          - state_machines.FairPlayCase.INVESTIGATING_to_SUSTAINED
        distinguishing_aspect: |
          Mode (a): a multi-step sequential formula whose steps are order-dependent and
          non-commutative. Each sustained case is weighted by SEVERITY_WEIGHT + TYPE_SURCHARGE,
          then multiplied by a repeat multiplier that depends on the case's created_at rank,
          then rounded to 2 dp PER CASE before summing (25.00 + 15.00 + 20.00 = 60.00), and
          only then subtracted from 100.00 and clamped. The sanction ladder is a fifth step
          that reads the finished score. The result lands on exactly 40.00, which is NOT
          below INTEGRITY_SUSPENSION_FLOOR, so the ladder must NOT escalate to
          TEAM_SUSPENSION. Reordering the surcharge and the multiplier, or summing before
          rounding, or using a strict-vs-inclusive floor comparison, all change the outcome.
        test_recipe:
          setup:
            - "One district, school, coach and student; one DRAFT team holding a single PROSPECTIVE STARTER slot for that student"
            - "Three FairPlayCases against the same team, created in this order and all sustained at severity MINOR: CHEAT_DETECTION, then ACCOUNT_SHARING, then ACCOUNT_SHARING"
            - "The team is never registered, so it stays DRAFT and the COMPETING -> SUSPENDED cascade link cannot fire"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default, so days_clean == 0 and clean_credit == 0"
