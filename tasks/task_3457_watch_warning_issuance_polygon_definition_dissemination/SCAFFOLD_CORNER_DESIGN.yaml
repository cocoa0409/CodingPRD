              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${rb_off}", zone_ids: ["${rb_zone}"], effective_from: "2026-09-02T00:00:00Z", expires_at: "2026-09-02T12:00:00Z" }
