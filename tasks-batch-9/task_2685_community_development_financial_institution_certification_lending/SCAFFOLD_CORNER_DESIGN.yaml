      - name: entity_specific_state_errors_sweep_instead_of_the_generic_rung
        claim_type: error_triggerable
        grounds:
          - validations[priority=52]
          - validations[priority=55]
          - validations[priority=56]
          - validations[priority=58]
        distinguishing_aspect: |
          Four wrong-state operations on four different entities must each answer with their own
          409 id - ERR_LOAN_NOT_IN_UNDERWRITING, ERR_AWARD_NOT_AWARDED,
          ERR_COMMITMENT_NOT_PLEDGED and ERR_REPORT_NOT_DISPUTED - and never with the generic
          priority-50 ERR_INVALID_STATE_TRANSITION that a naive state-machine guard would raise.
        test_recipe:
          setup:
            - "One institution with one product and one borrower."
            - "One loan still in SCREENING, never underwritten."
            - "One DRAFT award whose only commitment has been WITHDRAWN."
            - "One impact report filed against the loan and still SUBMITTED."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000042", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /cdfi/institutions/${inst_id}/award-applications"
              payload: { program: "NEW_MARKETS", requested_amount_cents: 1000000, match_ratio_pct: 100.00, performance_goal_jobs: 5, performance_goal_housing_units: 0, period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { award_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Meridian Foundation", source_type: "CASH_PRIVATE", amount_cents: 1000000, committed_on: "2026-07-15T00:00:00Z" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { mc_id: $.data.id }
            - call: "POST /cdfi/matching-fund-commitments/${mc_id}/withdraw"
              payload: { withdraw_reason: "FUNDER_RESCINDED" }
