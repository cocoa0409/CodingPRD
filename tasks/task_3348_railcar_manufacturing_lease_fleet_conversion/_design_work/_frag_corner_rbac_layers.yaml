              as: RegulatoryRetrofitist
              captures: { rpct_id: $.data.id, rpct_prog: $.data.retrofit_program_id, rpct_ct: $.data.car_type_id }
            - call: "POST /api/v1/retrofit-programs/${rp_id}/start"
              payload: {}
              as: RegulatoryRetrofitist
              captures: { rp_status1: $.data.status, rp_v1: $.data.version }
            - call: "POST /api/v1/retrofit-programs/${rp_id}/void"
