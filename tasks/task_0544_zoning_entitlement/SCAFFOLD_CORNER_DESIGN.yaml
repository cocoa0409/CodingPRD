# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0544
# Breadth probe over SS1.1-1.7 claims not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Sections/claim_types are drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_application_returns_all_fields_201
        claim_type: Creation
        grounds: [entities.EntitlementApplication, endpoints]
        distinguishing_aspect: "POST /applications with all required fields returns 201, status DRAFT, and echoes application_type/parcel_id/applicant_id."
        test_recipe:
          setup: ["A parcel and an applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "C-1", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cy One", email: "cy@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "setback" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "response http status == 201"
            - "EntitlementApplication.${app_id}.status == DRAFT"
            - "EntitlementApplication.${app_id}.application_type == VARIANCE"
            - "EntitlementApplication.${app_id}.revision_count == 0"

      - name: create_application_missing_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.EntitlementApplication.fields.application_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applications omitting application_type -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A parcel and applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "C-2", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cy Two", email: "cy2@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "x" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: create_application_bad_parcel_returns_not_found
        claim_type: Not Found
        grounds: [entities.EntitlementApplication.fields.parcel_id, "errors[ERR_PARCEL_NOT_FOUND]"]
        distinguishing_aspect: "POST /applications with a non-existent parcel_id -> ERR_PARCEL_NOT_FOUND (404)."
        test_recipe:
          setup: ["An applicant exists; parcel_id points to a missing UUID."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Cy Three", email: "cy3@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "00000000-0000-4000-8000-000000000000", applicant_id: "${applicant_id}", requested_use: "x" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "$.data.error_id == ERR_PARCEL_NOT_FOUND"

      - name: create_application_bad_applicant_returns_not_found
        claim_type: Not Found
        grounds: [entities.EntitlementApplication.fields.applicant_id, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "POST /applications with a non-existent applicant_id -> ERR_APPLICANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["A parcel exists; applicant_id points to a missing UUID."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "C-3", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "00000000-0000-4000-8000-000000000000", requested_use: "x" }
              as: Applicant
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "$.data.error_id == ERR_APPLICANT_NOT_FOUND"

      - name: get_application_missing_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /applications/{appId} with a non-existent id -> ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "$.data.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: notice_recipient_count_expanded_radius_when_sensitive
        claim_type: Computed Fields
        grounds: [calculations.notice_recipient_count, entities.NoticeMailing.fields.recipient_count, entities.Parcel.fields.sensitive_area]
        distinguishing_aspect: "For a sensitive-area parcel (neighbor 12, expanded 20), NoticeMailing.recipient_count == 20 and used_expanded_radius == true."
        test_recipe:
          setup: ["A SUBMITTED application on a sensitive-area parcel."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "C-4", zoning_district: "RES", area_acres: 3, neighbor_parcel_count: 12, expanded_neighbor_count: 20, sensitive_area: true }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cy Four", email: "cy4@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "x" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
              captures: { rc: $.data.recipient_count, exp: $.data.used_expanded_radius }
          assert:
            - "NoticeMailing.recipient_count == 20"
            - "NoticeMailing.used_expanded_radius == true"

      - name: create_application_extra_field_ignored
        claim_type: System Fields
        grounds: [entities.EntitlementApplication.fields.status]
        distinguishing_aspect: "Client-supplied status/id are ignored: created application still starts DRAFT with a server-minted id and version 1."
        test_recipe:
          setup: ["A parcel and applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "C-5", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cy Five", email: "cy5@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { application_type: "REZONE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "x", status: "EFFECTIVE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, v: $.data.version }
          assert:
            - "EntitlementApplication.${app_id}.status == DRAFT"
            - "EntitlementApplication.${app_id}.version == 1"

