# =============================================================================
# Task 1960 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All formula-derived
# assert literals were pre-computed from the pinned formulas/constants.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shrink_provisional_formula_vs_certified_scale
        grounds:
          - calculations.provisional_shrink_estimate
          - calculations.final_weight_reconciliation
          - state_machines.GrainLot.DRYING_to_DRIED
        distinguishing_aspect: |
          Dual-variant on the GrainLot WEIGHT domain: the provisional formula
          (water shrink + 0.5 handling) yields 9068 lbs for the same lot whose
          certified scale-out variant yields 9050 lbs — two sanctioned
          algorithms, identical inputs, different results; delta surfaced as
          shrink_variance_lbs == 18.
        test_recipe:
          setup:
            - "Customer with credit_limit 500000; CORN tariff (T1<=20.0:4c, T2<=25.0:5c, T3:7c, FM>3.0 +10%, min 1500); unit DRYER-1; clock at 2026-09-01T08:00:00Z"
            - "Lot 10000 lbs wet net (gross 44000, tare 34000), target 15.0, fm 4.2, certified at 22.5% intake"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 4.2 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "GET /grain-drying/grain-lots/${lot}", as: ElevatorManager, captures: { prov_dw: $.data.provisional_dry_weight_lbs } }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lot}", queue_ticket_id: "${tick}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { run: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${run}/start", payload: { meter_start_therms: 1200.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ElevatorManager }
          trigger:
            - { call: "POST /grain-drying/dryer-runs/${run}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, meter_end_therms: 1265.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "GET /grain-drying/grain-lots/${lot}", as: ElevatorManager, captures: { final_dw: $.data.final_dry_weight_lbs, final_sp: $.data.final_shrink_pct, var_lbs: $.data.shrink_variance_lbs, lot_status: $.data.status } }
          assert:
            - "captured provisional_dry_weight_lbs == 9068 (formula variant: water shrink 7.5/85*100 + 0.5 = 9.323529...; 10000 * (1 - 0.09323529) = 9067.647 -> round_half_up 9068)"
            - "GrainLot.${lot}.final_dry_weight_lbs == 9050 (certified scale variant)"
            - "GrainLot.${lot}.final_shrink_pct == 9.50"
            - "GrainLot.${lot}.shrink_variance_lbs == 18"
            - "${prov_dw} != ${final_dw} — identical lot, two variants, different weights"
            - "GrainLot.${lot}.status == DRIED"

      - name: energy_metered_vs_estimated_burn
        grounds:
          - calculations.energy_passthrough_charge
          - state_machines.DryerRun.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant on the DryerRun ENERGY domain (different entity domain
          from the GrainLot weight instance): two runs with identical duration
          (4.0 h) and identical points removed (7.5) — the metered variant
          (65.0 therms) charges 5575c, the estimated variant (68.75 therms via
          duration * 12.5 * (1 + 0.05*7.5)) charges 5931c; delta 356c.
        test_recipe:
          setup:
            - "Customer, CORN tariff, unit DRYER-1 (cooldown 30); clock choreography pins 4.0 h durations"
            - "Lot A and lot E both 10000 lbs, target 15.0, fm 2.0, certified at 22.5% — so points_removed = 7.5 for both runs"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotA: $.data.id, lotA_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotA}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lotA_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testA: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testA}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotE: $.data.id, lotE_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotE}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lotE_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testE: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testE}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotA}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tickA: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickA}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotE}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tickE: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickE}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotA}", queue_ticket_id: "${tickA}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { runM: $.data.id } }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotE}", queue_ticket_id: "${tickE}", scheduled_start: "2026-09-05T13:00:00Z", scheduled_end: "2026-09-05T17:00:00Z" }, as: DryerOperator, captures: { runE: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runM}/start", payload: { meter_start_therms: 1200.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runM}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, meter_end_therms: 1265.0 }, as: DryerOperator, as_user_id: "op-1", captures: { runM_charge: $.data.energy_charge_cents } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T13:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runE}/start", payload: { meter_start_therms: 500.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T17:00:00Z" }, as: ElevatorManager }
          trigger:
            - { call: "POST /grain-drying/dryer-runs/${runE}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, energy_estimated: true }, as: DryerOperator, as_user_id: "op-1", captures: { runE_charge: $.data.energy_charge_cents, runE_therms: $.data.fuel_therms } }
          assert:
            - "DryerRun.${runM}.energy_charge_cents == 5575 (metered: 65.0 therms -> 60*85 + 5*95)"
            - "DryerRun.${runE}.fuel_therms == 68.75 (estimated: 4.0 * 12.5 * 1.375, unrounded)"
            - "DryerRun.${runE}.energy_charge_cents == 5931 (estimated: 60*85 + 8.75*95 = 5931.25 -> 5931)"
            - "${runM_charge} != ${runE_charge} — same duration and points, two variants, different charges"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: drying_charge_tiered_bracket_surcharge_floor
        grounds:
          - calculations.drying_charge
          - entities.GrainLot.fields.foreign_material_pct
        distinguishing_aspect: |
          Combinatorial mode (a) — >=3 inputs with non-linear interaction:
          bracket selection on intake moisture (22.5 -> T2 rate 5), conditional
          FM surcharge (4.2 > 3.0 -> x1.10), and a minimum floor applied last.
          178.571428... bu * 7.5 pt * 5c = 6696.43 -> x1.10 = 7366.07 ->
          round 7366 -> max(1500, 7366) = 7366.
        test_recipe:
          setup:
            - "Customer, CORN tariff, clock 2026-09-01; lot 10000 lbs, target 15.0, fm 4.2, certified 22.5%"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 4.2 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "GET /grain-drying/grain-lots/${lot}/charge-preview", as: ElevatorManager, captures: { charge: $.data.drying_charge_cents, rate: $.data.rate_cents_per_pt_bu, fm_flag: $.data.fm_surcharge_applied, pts: $.data.points_removed } }
          assert:
            - "preview.points_removed == 7.5"
            - "preview.rate_cents_per_pt_bu == 5 (T2: 20.0 < 22.5 <= 25.0)"
            - "preview.fm_surcharge_applied == true (4.2 > 3.0)"
            - "preview.drying_charge_cents == 7366"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_composition
          - calculations.energy_passthrough_charge
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding where order matters: the
          invoice pins round-per-line-then-sum. Two estimated runs produce
          fractional charges 5931.25 and 3984.375; per-line rounding gives
          5931 + 3984 = 9915, whereas sum-then-round would give 9916. Energy
          line sum must be 9915 and invoice total 19281 (7366 + 5931 + 2000
          + 3984).
        test_recipe:
          setup:
            - "Customer, CORN tariff, unit DRYER-1; two lots dried with estimated-energy runs completing 2026-09-05"
            - "Lot A 10000 lbs @22.5 (fm 4.2 -> drying 7366), run A 240 min estimated, discharge 15.0 (7.5 pts -> 68.75 therms -> 5931)"
            - "Lot B 5600 lbs @20.0 (fm 2.0 -> drying 2000), run B 180 min estimated, discharge 15.0 (5.0 pts -> 46.875 therms -> 3984)"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 4.2 }, as: IntakeTechnician, captures: { lotA: $.data.id, lotA_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotA}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lotA_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testA: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testA}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 39600, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotB: $.data.id, lotB_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotB}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotB_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testB: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testB}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotA}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tickA: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickA}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotB}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 100 }, as: Grower, as_user_id: "${cust}", captures: { tickB: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickB}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotA}", queue_ticket_id: "${tickA}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { runA: $.data.id } }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotB}", queue_ticket_id: "${tickB}", scheduled_start: "2026-09-05T13:00:00Z", scheduled_end: "2026-09-05T16:00:00Z" }, as: DryerOperator, captures: { runB: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runA}/start", payload: { meter_start_therms: 100.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runA}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, energy_estimated: true }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T13:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runB}/start", payload: { meter_start_therms: 100.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T16:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${runB}/complete", payload: { scale_out_weight_lbs: 5400, discharge_moisture_pct: 15.0, energy_estimated: true }, as: DryerOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /grain-drying/invoices", payload: { customer_id: "${cust}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ElevatorManager, captures: { inv: $.data.id, inv_total: $.data.total_cents } }
          assert:
            - "Invoice.${inv} has an ENERGY line with amount_cents == 5931 (run A, round_half_up of 5931.25)"
            - "Invoice.${inv} has an ENERGY line with amount_cents == 3984 (run B, round_half_up of 3984.375)"
            - "energy lines sum to 9915 — per-line rounding; sum-then-round would yield 9916"
            - "Invoice.${inv} has DRYING lines with amount_cents == 7366 and == 2000"
            - "Invoice.${inv}.total_cents == 19281"
            - "Invoice.${inv}.status == DRAFT"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: grain_lot_damage_hold_cycle
        grounds:
          - state_machines.GrainLot.DRIED_to_DAMAGE_HOLD
          - state_machines.GrainLot.DAMAGE_HOLD_to_DRIED
        distinguishing_aspect: |
          Non-linear CYCLE on GrainLot (DRIED -> DAMAGE_HOLD -> DRIED): filing
          a claim holds the lot; denying the claim releases it back to exactly
          DRIED — the lot is not a linear pipeline.
        test_recipe:
          setup:
