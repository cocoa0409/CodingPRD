              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T13:00:00Z", temperature_c: 6.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", status: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
              captures: { exc_id: "$.data[0].id" }
          trigger:
            - call: "POST /seafood-ops/excursions/${exc_id}/resolve"
              payload: { resolution: "DISPOSE", note: "ice bed failed overnight" }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
            - call: "GET /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "COLD_CHAIN_DISPOSAL" }
              as: ComplianceOfficer
              as_user_id: "officer-cold-5"
