    grounds:
    - '§1.3 program_budget_rollup ("CONSERVED QUANTITY: committed_budget_cents + budget_headroom_cents
      == budget_total_cents, always")'
    - §1.2 Registration ACCEPTED -> CONFIRMED and CONFIRMED -> CANCELLED side_effects
    - §1.1 Program.committed_budget_cents, budget_headroom_cents, budget_total_cents, budget_posture
