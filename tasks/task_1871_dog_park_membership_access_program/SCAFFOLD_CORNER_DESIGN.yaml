  - section: consistency_model
    instances:
      - name: immediate_visibility_after_checkin
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.occupancy_count
        distinguishing_aspect: "The check-in response shows the OPEN visit and the very next GET on the area shows occupancy 1 — no reconciliation lag."
        test_recipe:
          setup: ["clock 2026-08-01; SMALL area; active member with VERIFIED SMALL dog"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, vst: $.data.status }
            - call: "GET /dog-park/areas/${a_id}"
              payload: {}
              as: ParkAdmin
              captures: { occ: $.data.current_occupancy }
          assert:
            - "check-in response status == OPEN"
            - "immediately after, ParkArea.${a_id}.current_occupancy == 1 (immediate consistency)"
