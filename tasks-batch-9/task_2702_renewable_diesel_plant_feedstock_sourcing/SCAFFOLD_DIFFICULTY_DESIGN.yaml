  - rule_id: resource_temporal_overlap
    instances:
      - name: turnaround_windows_need_seventy_two_clear_hours_touching_is_not_enough
        grounds:
          - validations[priority=23]
          - errors[ERR_TURNAROUND_BUFFER_VIOLATION]
          - entities.TurnaroundWindow.fields.start_at
          - endpoints["POST /hydrotreating-units/{id}/turnaround-windows"]
        distinguishing_aspect: |
          Turnaround windows are the one interval family in this domain that reserves the unit with a mandatory
          separation instead of mere non-overlap: a window starting exactly when the previous one ends is
          refused, and 72 hours of clear time is sufficient at the boundary. Contrast run windows, where the
          identical touching arrangement is legal — the same unit, the same instants, opposite verdicts.
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window [2026-08-01, 2026-08-03) and one ACTIVE charge."
            - "An APPROVED INSPECTION window A over [2026-09-10, 2026-09-12) on that unit."
            - "Clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { boot_win_id: $.data.id }
            - call: "POST /turnaround-windows/${boot_win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "INSPECTION", start_at: "2026-09-10T00:00:00Z", end_at: "2026-09-12T00:00:00Z" }
              as: PlantOperator
              captures: { win_a_id: $.data.id }
            - call: "POST /turnaround-windows/${win_a_id}/approvals"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "INSPECTION", start_at: "2026-09-12T00:00:00Z", end_at: "2026-09-14T00:00:00Z" }
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "INSPECTION", start_at: "2026-09-14T00:00:00Z", end_at: "2026-09-16T00:00:00Z" }
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "INSPECTION", start_at: "2026-09-15T00:00:00Z", end_at: "2026-09-17T00:00:00Z" }
              as: PlantOperator
              captures: { win_c_id: $.data.id }
          assert:
            - "First trigger call (touching A's end): response.status == 409 and response.error_id == ERR_TURNAROUND_BUFFER_VIOLATION"
            - "Second trigger call (48 hours of clear time): response.status == 409 and response.error_id == ERR_TURNAROUND_BUFFER_VIOLATION"
            - "Third trigger call (exactly 72 hours of clear time): response.status == 201"
            - "TurnaroundWindow.${win_c_id}.status == PLANNED"
            - "TurnaroundWindow.${win_c_id}.start_at == 2026-09-15T00:00:00Z"
            - "GET /hydrotreating-units/${unit_id}/turnaround-windows returns exactly 3 windows (the bootstrap window, A and C)"

      - name: hydrogen_nominations_collide_on_the_shared_inclusive_end_day
        grounds:
          - validations[priority=37]
          - errors[ERR_HYDROGEN_CAPACITY_EXCEEDED]
          - calculations.hydrogen_committed_capacity
          - entities.HydrogenNomination.fields.end_at
        distinguishing_aspect: |
          Nomination intervals are closed on both ends, so two nominations that merely share an endpoint really
          do stack on that calendar day: 3000.0 over [09-01, 09-05] plus 2500.0 over [09-05, 09-08] is 5500.0 on
          09-05 against a 5000.0 daily capacity. Shifting the second nomination one day later removes the
          collision, and the contract's peak is the per-day maximum rather than any sum of nominations.
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window and one ACTIVE charge, plus one PLANNED run over [2026-09-01, 2026-09-09) to hang the nominations on."
            - "A hydrogen contract with daily_capacity_kg 5000.0 over the closed window [2026-08-25, 2026-09-30]."
            - "One CONFIRMED nomination of 3000.0 kg/day over [2026-09-01, 2026-09-05]."
            - "Clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
