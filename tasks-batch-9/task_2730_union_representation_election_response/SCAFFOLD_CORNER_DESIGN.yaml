          Two singleton constraints keyed on state rather than on a column: a second ElectionAgreement is
          refused while the existing one is anything but VOID, and a second VoterList is refused only once
          the first reaches SUBMITTED or ACCEPTED. Re-stipulating the already-approved agreement is a
