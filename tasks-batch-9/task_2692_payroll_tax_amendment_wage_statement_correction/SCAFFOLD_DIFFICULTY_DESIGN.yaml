            - "GET /control-remediations?correction_case_id=${case_id}&status=VERIFIED returns total_count == 1"

      - name: statement_box_deltas_depend_on_repayment_reaching_collected
        grounds:
          - calculations.statement_box_deltas.input_set
          - calculations.repayment_recovery_basis.variants.SAME_YEAR_NET
          - state_machines.WageRepayment.AGREED_to_COLLECTED
          - entities.CorrectedWageStatement.fields.withholding_delta_cents
        distinguishing_aspect: |
          A third entity pair — CorrectedWageStatement <- WageRepayment — where the dependency is
          on a NUMERIC projection rather than on permission to transition: an AGREED repayment
          contributes nothing to the box deltas, and only when it becomes COLLECTED does the
          SAME_YEAR_NET basis pull the repaid gross out of boxes 1 and 3/5 and the repaid income
          tax out of box 2. The same repayment row therefore yields two different statements
          depending only on its own state.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme; federal agency FED-941 with jurisdiction_code US."
            - "One 2025 Q1 register line for Dana Reed of 1000000 taxable wage / 150000 withheld with work_jurisdiction_code NJ and workday_ratio_bps 4000, and a filed return reporting both totals exactly, so the sole variance is JURISDICTION_ASSIGNMENT 400000, filing_status stays FILING_NOT_REQUIRED and the discrepancy is categorised."
            - "A PORTAL corrected wage statement for 2025 has been created and ISSUED while no repayment existed at all."
            - "A wage repayment of 400000 gross (60000 income tax withheld, 30600 FICA withheld) overpaid in 2025 and recovered in 2025 is then created and AGREED: same-year recovery, so recovery_basis is SAME_YEAR_NET, employee_due_cents 309400 and agency_recoverable_cents 90600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NJ", workday_ratio_bps: 4000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 150000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "JURISDICTION_ASSIGNMENT" }
              as: PayrollAnalyst
              captures: { d_jur_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_jur_id}/categorize"
              payload: { category: "JURISDICTION_ASSIGNMENT", root_cause_code: "JURISDICTION_MAPPING_ERROR" }
              as: PayrollAnalyst
            - call: "POST /corrected-wage-statements"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", tax_year: 2025, delivery_channel: "PORTAL" }
              as: TaxPreparer
              captures: { st1_id: "$.data.id" }
            - call: "POST /corrected-wage-statements/${st1_id}/issue"
              payload: {}
              as: TaxPreparer
            - call: "POST /wage-repayments"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", overpaid_gross_cents: 400000, overpaid_income_tax_withheld_cents: 60000, overpaid_fica_withheld_cents: 30600, overpayment_tax_year: 2025, recovery_tax_year: 2025 }
              as: PayrollAnalyst
              captures: { rp_id: "$.data.id" }
            - call: "POST /wage-repayments/${rp_id}/agree"
              payload: {}
              as: PayrollAnalyst
          trigger:
            - call: "GET /corrected-wage-statements/${st1_id}"
              payload: {}
              as: TaxPreparer
            - call: "POST /wage-repayments/${rp_id}/collect"
              payload: { collected_cents: 309400 }
              as: PayrollAnalyst
            - call: "GET /corrected-wage-statements"
              payload: { correction_case_id: "${case_id}", supersedes_statement_id: "${st1_id}" }
              as: TaxPreparer
              captures: { st2_id: "$.data[0].id" }
            - call: "POST /corrected-wage-statements/${st2_id}/issue"
              payload: {}
              as: TaxPreparer
          assert:
            - "WageRepayment.${rp_id}.recovery_basis == SAME_YEAR_NET, employee_due_cents == 309400, agency_recoverable_cents == 90600"
            - "while the repayment is only AGREED: CorrectedWageStatement.${st1_id}.wage_delta_cents == -400000, fica_wage_delta_cents == -400000 and withholding_delta_cents == 0"
            - "while the repayment is only AGREED: CorrectionCase.${case_id}.corrected_wage_base_cents == 600000 and repayment_recovered_cents == 0"
            - "after collect: WageRepayment.${rp_id}.status == COLLECTED and CorrectedWageStatement.${st1_id}.status == VOIDED"
            - "after collect: the successor statement has wage_delta_cents == -800000, fica_wage_delta_cents == -800000 and withholding_delta_cents == -60000"
            - "after collect: the successor statement has sequence_no == 2, is_prior_year == true and status == DRAFT"
            - "after collect: CorrectionCase.${case_id}.repayment_recovered_cents == 90600"
            - "after issuing the successor: CorrectionCase.${case_id}.statement_status == STMT_ISSUED and status == REMEDIATION_PENDING"
            - "after issuing the successor: CorrectionCase.${case_id}.corrected_wage_base_cents == 200000"
            - "after issuing the successor: Employee.${e1_id}.active_statement_count == 1"

  - rule_id: resource_temporal_overlap
    instances:

      - name: agency_account_quarter_ranges_reject_overlap_but_admit_adjacency
        grounds:
          - validations.priority_71.ERR_ACCOUNT_PERIOD_OVERLAP
          - entities.AgencyAccount.fields.from_period_ordinal
          - entities.AgencyAccount.fields.to_period_ordinal
          - state_machines.AgencyAccount.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Resource entity: AgencyAccount, whose interval semantics are CLOSED-CLOSED over discrete
          quarter ordinals, with 999999 standing for an open-ended upper bound. A successor that
          starts on the predecessor's last quarter overlaps and must be refused, while one that
          starts exactly one quarter later is adjacent and must be admitted — and admitting it
          retires the predecessor into CLOSED. The open-ended row then blocks everything above its
          own start.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme and state agency NY-WH with requires_registration true."
            - "An ACTIVE AgencyAccount NY-A covering 2025 Q1 through 2025 Q2, i.e. the closed-closed ordinal interval [8100, 8101]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-WH", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 1, effective_to_tax_year: 2025, effective_to_quarter: 2 }
              as: PlatformAdmin
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /agency-accounts/${acct_a_id}/activate"
              payload: { account_number: "NY-A" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 2, effective_to_tax_year: 2025, effective_to_quarter: 4 }
              as: PlatformAdmin
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 3, effective_to_tax_year: 2025, effective_to_quarter: 4 }
              as: PlatformAdmin
              captures: { acct_c_id: "$.data.id" }
            - call: "POST /agency-accounts/${acct_c_id}/activate"
              payload: { account_number: "NY-C" }
              as: PlatformAdmin
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2026, effective_from_quarter: 1 }
              as: PlatformAdmin
              captures: { acct_d_id: "$.data.id" }
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2026, effective_from_quarter: 3, effective_to_tax_year: 2026, effective_to_quarter: 4 }
              as: PlatformAdmin
          assert:
            - "AgencyAccount.${acct_a_id}.from_period_ordinal == 8100 and to_period_ordinal == 8101"
            - "the 2025 Q2..Q4 creation returns HTTP 409 with error_id == ERR_ACCOUNT_PERIOD_OVERLAP (8101 is shared with NY-A because both bounds are inclusive)"
            - "the 2025 Q3..Q4 creation returns HTTP 201 with from_period_ordinal == 8102 and to_period_ordinal == 8103"
            - "after activating NY-C: AgencyAccount.${acct_c_id}.registration_status == ACTIVE"
            - "after activating NY-C: AgencyAccount.${acct_a_id}.registration_status == CLOSED (the adjacent successor retires it)"
            - "the open-ended 2026 Q1 creation returns HTTP 201 with from_period_ordinal == 8104 and to_period_ordinal == 999999"
            - "the final 2026 Q3..Q4 creation returns HTTP 409 with error_id == ERR_ACCOUNT_PERIOD_OVERLAP because [8106, 8107] falls inside the open-ended [8104, 999999]"
            - "GET /agency-accounts?employer_id=${emp_id}&agency_id=${ny_id} returns total_count == 3"

      - name: amendment_slot_capacity_one_per_case_and_form_code
        grounds:
          - validations.priority_70.ERR_AMENDMENT_SLOT_OCCUPIED
          - state_machines.AmendedReturn.DRAFT_to_VOID
          - entities.AmendedReturn.fields.form_code
        distinguishing_aspect: |
          A different resource entity (the amendment slot on an AmendedReturn's
          (correction_case_id, form_code) key) with entirely different interval semantics: the
          occupied interval is not a date range at all but a STATE window — the slot is held for as
          long as any return sits in {DRAFT, PREPARED, SIGNED, SUBMITTED} and is released the
          moment one goes terminal. A second form_code is a different resource and never contends,
          and voiding the occupant frees the slot for a fresh draft.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "The 2025 Q1 federal case with one categorised WITHHOLDING variance of 50000 cents."
            - "One DRAFT amended return for form_code 941X already occupies the slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
