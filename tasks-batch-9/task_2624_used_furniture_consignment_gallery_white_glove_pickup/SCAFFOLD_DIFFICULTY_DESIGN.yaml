# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2624 - Used Furniture Consignment Gallery & White-Glove Pickup
#
# 9 rule_ids, 19 instances. Every numeric literal in every `assert:` was
# produced by executing the matching §1.3 formula with its declared constants
# (integer cents, round_half_up) - none is an estimate.
#
# Conventions shared by every instance (each instance still drives itself from
# an empty database):
#   * the logical clock starts at 2026-08-01T00:00:00Z (§1.5 /_clock default)
#   * price schedule STD-2026: steps (1, day 0, 0.00, floor 0),
#     (2, day 30, 0.15, floor 0), (3, day 60, 0.30, floor 0),
#     (4, day 90, 0.50, floor 45000); unsold_trigger_day 120,
#     election_window_days 14
#   * opaque operator ids are pinned so segregation-of-duties is observable:
#     appraiser-1, floor-1, logi-1, mgr-1, mgr-2, sysop-1
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: pickup_surcharge_quoted_vs_final_diverges
        grounds:
          - calculations.pickup_surcharge
          - entities.PickupJob.fields.quoted_surcharge_cents
          - entities.PickupJob.fields.final_surcharge_cents
          - entities.PickupJob.fields.surcharge_variance_cents
          - state_machines.PickupJob.SCHEDULED_to_COMPLETED
          - entities.Consignor.fields.status
        distinguishing_aspect: |
          The quoted variant reads declared_stair_flights 2 / declared_elevator false /
          crew_size 3 and the final variant reads actual_stair_flights 8 /
          actual_elevator_used false / actual_crew_size 4 over the SAME two attached
          items, so the same pickup yields 61250 quoted and 87483 final - and the
          final figure is the 0.35-of-declared-value cap, not the 108750 the crew
          multiplier alone would produce.
        test_recipe:
          setup:
            - "one consignor at floor 3 with no elevator, so declared_stair_flights is 2"
            - "one ACTIVE agreement on the STD-2026 schedule"
            - "item S1: SOFA, declared 189950, volume 70 cuft, footprint 24 sqft, screened grade B"
            - "item C1: CASEGOOD, declared 60000, volume 18 cuft, footprint 18 sqft, screened grade A"
            - "one SCHEDULED PickupJob on truck T1 carrying both items with crew_size 3, so quoted_surcharge_cents is 61250"
            - "consignor balance still 0 - the quote mints no ledger entry"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 2, start_day_offset: 30, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 3, start_day_offset: 60, markdown_pct: 0.30, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 4, start_day_offset: 90, markdown_pct: 0.50, min_price_cents: 45000 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Ada Cole", email: "ada@example.com", address_line: "12 Elm St", floor_number: 3, has_elevator: false, payout_method: "ACH" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: "$.data.id" }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${ps_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Chesterfield sofa", category: "SOFA", declared_value_cents: 189950, photo_count: 6, volume_cuft: 70, footprint_sqft: 24 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { s1_id: "$.data.id" }
            - call: "POST /consignment-items/${s1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 7.0, photo_structure_score: 6.5, photo_completeness_score: 6.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Walnut dresser", category: "CASEGOOD", declared_value_cents: 60000, photo_count: 5, volume_cuft: 18, footprint_sqft: 18 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consignment-items/${c1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "Truck 1", capacity_volume_cuft: 600 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: "$.data.id" }
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T11:00:00Z", crew_size: 3, item_ids: ["${s1_id}", "${c1_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: "$.data.id", quoted: "$.data.quoted_surcharge_cents" }
          trigger:
            - call: "POST /pickup-jobs/${job_id}/complete"
              payload: { actual_stair_flights: 8, actual_elevator_used: false, actual_crew_size: 4 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "PickupJob.${job_id}.quoted_surcharge_cents == 61250"
            - "PickupJob.${job_id}.final_surcharge_cents == 87483"
            - "PickupJob.${job_id}.surcharge_variance_cents == 26233"
            - "PickupJob.${job_id}.final_surcharge_cents != PickupJob.${job_id}.quoted_surcharge_cents"
            - "PickupJob.${job_id}.final_surcharge_cents == 87483, which is the cap round_half_up(0.35 * (189950 + 60000)) and NOT the uncapped 108750 the crew multiplier produces from subtotal 75000"
            - "PickupJob.${job_id}.status == COMPLETED"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 1 and its single entry has entry_type == PICKUP_SURCHARGE_DEBIT and amount_cents == -87483"
            - "that entry's balance_after_cents == -87483"
            - "Consignor.${cons_id}.unclaimed_balance_cents == -87483"
            - "Consignor.${cons_id}.status == SUSPENDED"
            - "ConsignmentItem.${s1_id}.lifecycle_state == RECEIVED and inventory_state == IN_CUSTODY"
            - "ConsignmentItem.${c1_id}.lifecycle_state == RECEIVED and inventory_state == IN_CUSTODY"

      - name: condition_grade_provisional_vs_final_list_price_diverges
        grounds:
          - calculations.photo_screening_score
          - calculations.item_list_price
          - entities.ConsignmentItem.fields.provisional_condition_grade
          - entities.ConsignmentItem.fields.provisional_list_price_cents
          - entities.ConsignmentItem.fields.condition_grade
          - entities.ConsignmentItem.fields.list_price_cents
          - state_machines.ConsignmentItem.RECEIVED_to_AWAITING_PLACEMENT
        distinguishing_aspect: |
          The provisional variant grades from the consignor's photographs
          (7.0 / 6.5 / 6.0 -> 6.60 -> B -> 126317) and the final variant grades the
          same piece from physical inspection (5.0 / 5.5 / 4.5 -> 5.03 -> C -> 99249);
          the row keeps BOTH figures, so the divergence is observable on a single
          entity rather than inferred from a delta.
        test_recipe:
          setup:
            - "one consignor at floor 3 with no elevator on an ACTIVE STD-2026 agreement"
            - "item S1: SOFA, declared 189950, volume 70 cuft, footprint 24 sqft"
            - "S1 screened by appraiser-1 at 7.0 / 6.5 / 6.0, so provisional_condition_grade B and provisional_list_price_cents 126317"
            - "S1 collected on a completed 2-mover pickup, so lifecycle_state RECEIVED and inventory_state IN_CUSTODY"
            - "consignor balance -44000 from the pickup surcharge, which leaves status ACTIVE (the -50000 suspension floor is not crossed)"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 2, start_day_offset: 30, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 3, start_day_offset: 60, markdown_pct: 0.30, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 4, start_day_offset: 90, markdown_pct: 0.50, min_price_cents: 45000 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Ada Cole", email: "ada@example.com", address_line: "12 Elm St", floor_number: 3, has_elevator: false, payout_method: "ACH" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: "$.data.id" }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${ps_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Chesterfield sofa", category: "SOFA", declared_value_cents: 189950, photo_count: 6, volume_cuft: 70, footprint_sqft: 24 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { s1_id: "$.data.id" }
            - call: "POST /consignment-items/${s1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 7.0, photo_structure_score: 6.5, photo_completeness_score: 6.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "Truck 1", capacity_volume_cuft: 600 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: "$.data.id" }
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T11:00:00Z", crew_size: 2, item_ids: ["${s1_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: "$.data.id" }
            - call: "POST /pickup-jobs/${job_id}/complete"
              payload: { actual_stair_flights: 2, actual_elevator_used: false, actual_crew_size: 2 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          trigger:
            - call: "POST /consignment-items/${s1_id}/receive"
              payload: { photo_surface_score: 5.0, photo_structure_score: 5.5, photo_completeness_score: 4.5 }
              as: FloorOperator
              as_user_id: "floor-1"
          assert:
            - "ConsignmentItem.${s1_id}.provisional_condition_grade == B"
            - "ConsignmentItem.${s1_id}.provisional_list_price_cents == 126317"
            - "ConsignmentItem.${s1_id}.photo_score == 5.03"
            - "ConsignmentItem.${s1_id}.condition_grade == C"
            - "ConsignmentItem.${s1_id}.list_price_cents == 99249"
            - "ConsignmentItem.${s1_id}.current_price_cents == 99249"
            - "ConsignmentItem.${s1_id}.list_price_cents != ConsignmentItem.${s1_id}.provisional_list_price_cents"
            - "ConsignmentItem.${s1_id}.lifecycle_state == AWAITING_PLACEMENT (a one-grade downgrade, so no RECEIVING_DISPUTE)"
            - "ConsignmentItem.${s1_id}.election_deadline_at == null"
            - "ConsignmentItem.${s1_id}.received_by_user_id == floor-1 and screened_by_user_id == appraiser-1"
            - "Consignor.${cons_id}.unclaimed_balance_cents == -44000 and status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: consignor_split_max_clamp_beats_category_and_price_bonus
        grounds:
          - calculations.consignor_split
          - entities.Sale.fields.split_pct_applied
          - entities.Sale.fields.consignor_share_cents
          - entities.Sale.fields.gallery_share_cents
          - entities.ConsignmentItem.fields.category
          - state_machines.ConsignmentItem.ON_FLOOR_to_SOLD
        distinguishing_aspect: |
          Mode (a) - a conditional branch inside the formula: ART's 0.65 category base
          plus the 0.10 high-price bonus reaches 0.75, and the PCT_CEILING branch
          rewrites it to 0.70, so consignor_share_cents is 142800 and not the 153000
          the unclamped percentage would pay.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement"
            - "item A1: ART, declared 200000, volume 12 cuft, footprint 10 sqft, screened 8.0 / 9.0 / 9.0 -> 8.55 -> grade A -> list_price_cents 204000"
            - "A1 collected on a completed 2-mover pickup (surcharge 17000), received at the same scores and placed in Front A"
            - "one ACTIVE buyer at floor 2 with no elevator"
            - "clock still 2026-08-01T00:00:00Z, so markdown step 1 is in force and current_price_cents == 204000"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 2, start_day_offset: 30, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 3, start_day_offset: 60, markdown_pct: 0.30, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 4, start_day_offset: 90, markdown_pct: 0.50, min_price_cents: 45000 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Bea Ruiz", email: "bea@example.com", address_line: "4 Oak Ln", floor_number: 1, has_elevator: false, payout_method: "ACH" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: "$.data.id" }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${ps_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Oil landscape", category: "ART", declared_value_cents: 200000, photo_count: 4, volume_cuft: 12, footprint_sqft: 10 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consignment-items/${a1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "Truck 1", capacity_volume_cuft: 600 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: "$.data.id" }
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z", crew_size: 2, item_ids: ["${a1_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: "$.data.id" }
            - call: "POST /pickup-jobs/${job_id}/complete"
              payload: { actual_stair_flights: 0, actual_elevator_used: false, actual_crew_size: 2 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
            - call: "POST /consignment-items/${a1_id}/receive"
              payload: { photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /floor-zones"
              payload: { name: "Front A", zone_type: "SHOWROOM_FRONT", capacity_sqft: 200 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { zone_a_id: "$.data.id" }
            - call: "POST /consignment-items/${a1_id}/place"
              payload: { placement_zone_id: "${zone_a_id}", tag_code: "T-2001" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /buyers"
              payload: { display_name: "Cal Devi", email: "cal@example.com", address_line: "9 Pine Ct", floor_number: 2, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /sales"
              payload: { item_id: "${a1_id}", buyer_id: "${buyer_id}", sale_price_cents: 204000 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sale_id: "$.data.id" }
          assert:
            - "ConsignmentItem.${a1_id}.list_price_cents == 204000 and current_price_cents == 204000"
            - "Sale.${sale_id}.split_pct_applied == 0.70"
            - "Sale.${sale_id}.consignor_share_cents == 142800"
            - "Sale.${sale_id}.gallery_share_cents == 61200"
            - "Sale.${sale_id}.consignor_share_cents + Sale.${sale_id}.gallery_share_cents == 204000"
            - "Sale.${sale_id}.consignor_share_cents != 153000, the figure the unclamped 0.65 + 0.10 = 0.75 percentage would produce"
            - "Sale.${sale_id}.markdown_sequence_at_sale == 1"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 2 with the SALE_CREDIT entry amount_cents == 142800 and balance_after_cents == 125800"
            - "Consignor.${cons_id}.unclaimed_balance_cents == 125800 and lifetime_credits_cents == 142800"

      - name: list_price_two_step_rounding_order_pinned
        grounds:
          - calculations.item_list_price
          - calculations.photo_screening_score
          - entities.ConsignmentItem.fields.provisional_list_price_cents
          - state_machines.ConsignmentItem.INTAKE_SUBMITTED_to_SCREEN_ACCEPTED
        distinguishing_aspect: |
          Mode (b) - the order of operations is the whole answer: rounding the grade
          factor first (round_half_up(129950 * 0.85) = 110458) and only then applying
          the ART category factor gives 132550, whereas collapsing both factors into
          one multiplication gives 132549, so the two-step form is pinned by a
          one-cent gap that no other fixture can hide.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement"
            - "item A2: ART, declared 129950, volume 6 cuft, footprint 4 sqft, still INTAKE_SUBMITTED with no scores"
            - "clock untouched at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 2, start_day_offset: 30, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Dov Amar", email: "dov@example.com", address_line: "3 Ash Way", floor_number: 1, has_elevator: false, payout_method: "ACH" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: "$.data.id" }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${ps_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Framed etching", category: "ART", declared_value_cents: 129950, photo_count: 4, volume_cuft: 6, footprint_sqft: 4 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "POST /consignment-items/${a2_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
          assert:
            - "ConsignmentItem.${a2_id}.photo_score == 8.55"
            - "ConsignmentItem.${a2_id}.provisional_condition_grade == A"
            - "ConsignmentItem.${a2_id}.provisional_list_price_cents == 132550"
            - "ConsignmentItem.${a2_id}.list_price_cents == 132550"
            - "ConsignmentItem.${a2_id}.current_price_cents == 132550"
