scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: client_register_returns_201_with_all_fields
        claim_type: creation
        grounds:
          - entities.Client
          - endpoints[POST /clients/register]
        distinguishing_aspect: |
          POST /clients/register with all required input fields (full_name, email,
          phone) returns 201 with a Client whose id, created_at, updated_at,
          version, retainer_signed=false, and retainer_signed_at=null are all
          populated.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients/register"
              payload: { full_name: "Alpha Client", email: "alpha@example.com", phone: "555-2000" }
              as: Anonymous
              captures: { client_id: $.data.id, ver: $.data.version, retainer: $.data.retainer_signed }
          assert:
            - "response.status_code == 201"
            - "Client.${client_id}.full_name == 'Alpha Client'"
            - "Client.${client_id}.email == 'alpha@example.com'"
            - "Client.${client_id}.retainer_signed == false"
            - "Client.${client_id}.version == 1"

      - name: case_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Case
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[GET /cases/{id}]
        distinguishing_aspect: |
          GET /cases/{id} with a UUID that does not match any Case returns
          ERR_RESOURCE_NOT_FOUND with HTTP 404.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Attorney
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == 'ERR_RESOURCE_NOT_FOUND'"

      - name: case_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Case
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=20]
          - endpoints[POST /cases]
        distinguishing_aspect: |
          POST /cases without the required `jurisdiction` field returns
          ERR_INVALID_REQUEST (HTTP 400). client_id and accident_date are present
          and valid; the only defect is the missing jurisdiction.
        test_recipe:
          setup:
            - "One Client with retainer signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Req Field", email: "req@example.com", phone: "555-2100" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
          trigger:
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15" }
              as: Paralegal
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: case_create_bad_jurisdiction_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Case.fields.jurisdiction
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=20]
        distinguishing_aspect: |
          jurisdiction is constrained to {CA, NY, TX, FL, IL}. POST /cases with
          jurisdiction='WA' is rejected with ERR_INVALID_REQUEST (HTTP 400).
        test_recipe:
          setup:
            - "One Client with retainer signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Bad Enum", email: "be@example.com", phone: "555-2200" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
          trigger:
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "WA" }
              as: Paralegal
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: case_create_with_fk_unknown_client_rejected
        claim_type: parent_relationships
        grounds:
          - entities.Case.fields.client_id
          - errors[ERR_FK_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          POST /cases with a client_id that does not resolve to any Client returns
          ERR_FK_NOT_FOUND (HTTP 404).
        test_recipe:
          setup:
            - "Empty database, clock 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cases"
              payload: { client_id: "00000000-0000-0000-0000-000000000001", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == 'ERR_FK_NOT_FOUND'"

      - name: case_sol_default_zero_tolling
        claim_type: defaults
        grounds:
          - entities.Case.fields.sol_tolled_days
          - entities.Case.fields.statute_of_limitations_date
        distinguishing_aspect: |
          When sol_tolled_days is omitted on POST /cases it defaults to 0;
          statute_of_limitations_date equals accident_date + statute_years for
          jurisdiction. For accident_date=2024-01-15 and jurisdiction=CA (2y),
          statute_of_limitations_date should equal 2026-01-15T00:00:00Z.
        test_recipe:
          setup:
            - "One Client with retainer signed, clock 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Default SOL", email: "dsol@example.com", phone: "555-2300" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
          trigger:
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-01-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id, sol: $.data.statute_of_limitations_date, tolled: $.data.sol_tolled_days }
          assert:
            - "Case.${case_id}.sol_tolled_days == 0"
            - "Case.${case_id}.statute_of_limitations_date == '2026-01-15T00:00:00Z' (or equivalent ISO 8601)"

      - name: case_included_damages_total_is_computed
        claim_type: computed_fields
        grounds:
          - entities.Case.fields.included_damages_total_cents
          - state_machines.DamagesItem.PROPOSED_to_INCLUDED
        distinguishing_aspect: |
          Case.included_damages_total_cents is server-computed and reflects the sum
          of DamagesItem.amount_cents for items in INCLUDED status. Direct input is
          ignored; only INCLUDED transitions update the value. After three
          INCLUDED items totaling 600_000 cents the field reads 600_000.
        test_recipe:
          setup:
            - "Active CA Case with one REVIEWED MedicalRecordsRequest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Comp Field", email: "cf@example.com", phone: "555-2400" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Comp Hosp", contact: "comp@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 200000 }
              as: Paralegal
              captures: { di1: $.data.id }
            - call: "POST /damages-items/${di1}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "LOST_WAGES", amount_cents: 250000 }
              as: Paralegal
              captures: { di2: $.data.id }
            - call: "POST /damages-items/${di2}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PROPERTY", amount_cents: 150000 }
              as: Paralegal
              captures: { di3: $.data.id }
            - call: "POST /damages-items/${di3}/include"
              payload: {}
              as: Attorney
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { total: $.data.included_damages_total_cents }
          assert:
            - "Case.${case_id}.included_damages_total_cents == 600000"

      - name: damages_pain_suffering_cap_exceeded_ca
        claim_type: type_constraints
        grounds:
          - validations[priority=16]
          - errors[ERR_DAMAGES_OVER_CAP]
          - entities.DamagesItem.fields.amount_cents
        distinguishing_aspect: |
          POST /damages-items with category=PAIN_SUFFERING, amount_cents=25_000_001
          (one cent over the CA cap of $250_000) on a CA-jurisdiction Case returns
          ERR_DAMAGES_OVER_CAP (HTTP 422). A creation at exactly 25_000_000 would
          succeed (boundary verified separately under boundary-precision section).
        test_recipe:
          setup:
            - "Active CA Case, clock 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Cap Client", email: "cap@example.com", phone: "555-2500" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PAIN_SUFFERING", amount_cents: 25000001 }
              as: Paralegal
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_DAMAGES_OVER_CAP'"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: case_activate_from_already_active_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Case.INTAKE_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /cases/{id}/activate when Case.status is already ACTIVE returns
          ERR_INVALID_STATE (HTTP 409). The case stays ACTIVE; version does not
          increment a second time.
        test_recipe:
          setup:
            - "One Active CA Case (already activated)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Active Twice", email: "atw@example.com", phone: "555-2600" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Case.${case_id}.status == 'ACTIVE'"

      - name: case_close_from_settled_requires_disbursement_released
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Case.SETTLED_to_CLOSED
          - errors[ERR_CROSS_ENTITY_STATE]
          - entities.Disbursement.fields.status
        distinguishing_aspect: |
          POST /cases/{id}/close on a SETTLED case whose Disbursement is still
          PENDING (not RELEASED) returns ERR_CROSS_ENTITY_STATE (409). Case stays
          SETTLED.
        test_recipe:
          setup:
            - "Settled CA Case with PENDING Disbursement (just-accepted settlement; release not yet called). Use the chain from Rule 4 instance 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Close Premature", email: "cp@example.com", phone: "555-2700" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "CP Hosp", contact: "cp@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_cp"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_cp"
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v: $.data.version }
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v}" }
              as: ManagingPartner
          trigger:
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: ManagingPartner
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_CROSS_ENTITY_STATE'"
            - "Case.${case_id}.status == 'SETTLED'"

      - name: mrr_review_without_prior_receive_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.MedicalRecordsRequest.RECEIVED_to_REVIEWED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /medical-records-requests/{id}/review when status is still REQUESTED
          (not yet RECEIVED) is rejected with ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "One MedicalRecordsRequest just created (status REQUESTED) on an Active CA Case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "MRR Skip", email: "mrrs@example.com", phone: "555-2800" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Skip Hosp", contact: "sk@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
          trigger:
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: settlement_accept_from_terminal_rejected_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.SettlementOffer.PENDING_to_REJECTED
          - state_machines.SettlementOffer.PENDING_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A SettlementOffer that has been REJECTED is in a terminal state; a
          subsequent accept attempt returns ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Active CA Case in IN_NEGOTIATION with one SettlementOffer already in REJECTED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "RejAccept", email: "rja@example.com", phone: "555-2900" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "RJ Hosp", contact: "rj@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 500000 }
              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_rj"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_rj"
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 2000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "POST /settlement-offers/${offer_id}/reject"
              payload: {}
              as: ManagingPartner
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v}" }
              as: ManagingPartner
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "SettlementOffer.${offer_id}.status == 'REJECTED'"

      - name: settlement_offer_thirty_day_expiry_on_clock_advance
        claim_type: side_effect_execution
        grounds:
          - state_machines.SettlementOffer.PENDING_to_EXPIRED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Setting the clock to a time ≥ 30 days after a PENDING SettlementOffer's
          created_at transitions that offer's status to EXPIRED automatically (no
          direct expire endpoint). responded_at is stamped to the new clock value.
          A read endpoint after the clock advance reflects the EXPIRED status.
        test_recipe:
          setup:
            - "Active CA Case in IN_NEGOTIATION with one CARRIER PENDING offer at 2_000_000 created at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Expire C", email: "exp@example.com", phone: "555-3000" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
