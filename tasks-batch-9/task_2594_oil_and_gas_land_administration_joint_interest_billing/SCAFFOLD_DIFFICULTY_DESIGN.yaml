            - "Four interest owners: OP (operator, WI 0.500000, NRI 0.412500, preferential_right true, bond 50000000), OA (WI 0.300000, NRI 0.240000, preferential_right true, bond 10000000), OB (WI 0.200000, NRI 0.150000, preferential_right false, bond 0), OC (Gamma Operating LP, bond 20000000, holds no interest in this well)"
            - "The well is left in well_status DRILLING while the first statement is issued and only then moved to PRODUCING"
            - "Three cost entries, one per billing period: CAPITAL 1000000 incurred 2026-05-10 paid 2026-05-12; OPERATING 200000 incurred 2026-07-10 paid 2026-07-12; CAPITAL 100000 incurred 2026-03-15 paid 2026-03-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
              captures: { alloc2_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Operator Energy LLC", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "op@example.com", tax_id_on_file: true, bond_posted_cents: 50000000 }
              as: LandAdministrator
              captures: { op_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: true, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Gamma Operating LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "gamma@example.com", tax_id_on_file: true, bond_posted_cents: 20000000 }
              as: LandAdministrator
