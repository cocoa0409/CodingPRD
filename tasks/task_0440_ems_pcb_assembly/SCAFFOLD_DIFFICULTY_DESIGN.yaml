        grounds:
          - calculations.first_pass_yield
          - state_machines.WorkOrder.AT_TEST_to_PASSED
          - state_machines.WorkOrder.AT_TEST_to_FAILED
        distinguishing_aspect: |
          Numeric threshold-crossing on first_pass_yield_pct via POST
          /work-orders/{id}/finalize-test: a run with FPY exactly 70.00 satisfies
          >= MIN_YIELD_PCT (70) and branches to PASSED; 69.xx would branch to FAILED.
          The boundary uses >= not >.
