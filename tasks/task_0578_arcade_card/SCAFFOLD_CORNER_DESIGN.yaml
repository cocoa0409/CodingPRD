      - name: redeem_insufficient_points
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Reserving a prize costing more points than the card holds returns ERR_INSUFFICIENT_POINTS (402)."
