              as_user_id: "${client_id}"
              captures: { tu_id: $.data.id }
          trigger:
            - call: "POST /studio/touchups/${tu_id}/schedule"
              payload: {}
              as: StudioManager
              captures: { st: $.data.status }
          assert:
            - "TouchUp.${tu_id}.status == SCHEDULED"
            - "Appointment.${ap_id}.status == COMPLETED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: artist_half_open_adjacent_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.Appointment.fields.start_at
          - entities.Appointment.fields.end_at
        distinguishing_aspect: |
          Artist-slot uses HALF-OPEN [start,end) interval arithmetic with ZERO
          buffer: a second appointment for the same artist that overlaps an existing
          one (10:30-12:30 vs 10:00-12:00) is rejected ERR_ARTIST_DOUBLE_BOOKED,
          while an exactly-adjacent one (12:00-13:00) would be allowed.
        test_recipe:
          setup:
            - "One Artist; two Chairs (so the conflict is purely the artist, not the chair); one VERIFIED Client."
            - "One non-terminal HELD appointment for the artist 10:00-12:00 on chair 1."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Ovl Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Ovl C1", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair1_id: $.data.id, chair1_v: $.data.version }
            - call: "POST /studio/chairs"
              payload: { label: "Ovl C2", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair2_id: $.data.id, chair2_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Ovl Client", email: "ovl@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair1_id}", expected_chair_version: "${chair1_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 120, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T12:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap1_id: $.data.id }
          trigger:
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair2_id}", expected_chair_version: "${chair2_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 120, start_at: "2026-06-10T10:30:00Z", end_at: "2026-06-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ARTIST_DOUBLE_BOOKED"
            - "trigger response HTTP status == 409"

      - name: chair_buffered_adjacent_rejected
        grounds:
          - validations[priority=12]
          - entities.Chair.fields.cleanup_buffer_minutes
          - entities.Appointment.fields.chair_id
        distinguishing_aspect: |
          Chair-slot uses BUFFERED interval arithmetic: with a 30-min cleanup
          buffer, a second appointment on the same chair that is exactly adjacent
          (12:00-13:00 after 10:00-12:00, with two DIFFERENT artists so the artist
          check passes) is rejected ERR_CHAIR_UNAVAILABLE because the 0-min gap is
          inside the 30-min buffer — different interval semantics than the artist
          half-open check.
        test_recipe:
          setup:
            - "Two Artists; one Chair with cleanup_buffer_minutes=30; one VERIFIED Client."
            - "One HELD appointment for artist 1 on the chair 10:00-12:00."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Buf Artist1", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist1_id: $.data.id }
            - call: "POST /studio/artists"
              payload: { display_name: "Buf Artist2", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist2_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Buf Chair", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Buf Client", email: "buf@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist1_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 120, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T12:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap1_id: $.data.id }
            - call: "GET /studio/chairs/${chair_id}"
              payload: {}
              as: StudioManager
              captures: { chair_v2: $.data.version }
          trigger:
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist2_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v2}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-06-10T12:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CHAIR_UNAVAILABLE"
            - "trigger response HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: artist_cancel_preserves_deposit_total
        grounds:
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - entities.Deposit.fields.amount_cents
          - entities.Appointment.fields.deposit_paid_cents
        distinguishing_aspect: |
          Conserved quantity = total client deposit money on a CONFIRMED appointment.
          Artist cancel is the compensating action that, unlike client cancel, MUST
          leave SUM(Deposit.amount_cents where status in {CONFIRMED}) == deposit_paid_cents
          == 10800 unchanged (no forfeiture); the deposit is conserved.
        test_recipe:
          setup:
            - "One Artist; one VERIFIED Client; one Chair; one CONFIRMED appointment with deposit 10800."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Inv9a Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Inv9a Chair", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Inv9a Client", email: "inv9a@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-20T10:00:00Z", end_at: "2026-06-20T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { dep_id: $.data.id }
            - call: "POST /studio/appointments/${ap_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${ap_id}/cancel-by-artist"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Appointment.${ap_id}.deposit_paid_cents == 10800"
            - "Deposit.${dep_id}.status == CONFIRMED"
            - "Appointment.${ap_id}.status == CANCELLED"

      - name: custom_request_decline_conserves_queue_slot_count
        grounds:
          - state_machines.CustomDesignRequest.PENDING_to_DECLINED
          - entities.CustomDesignRequest.fields.status
          - entities.FlashDesign.fields.status
        distinguishing_aspect: |
          Different conserved quantity = count of an artist's AVAILABLE flash
          designs (catalog inventory). Declining a CustomDesignRequest is a
          compensating action on the queue that MUST leave the artist's flash
          catalog count (COUNT(FlashDesign where status==AVAILABLE)==1) unchanged —
          a custom decline touches the request queue only, never the flash catalog.
        test_recipe:
          setup:
            - "One Artist with exactly one AVAILABLE flash design; one Client with one PENDING custom request to that artist."
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "Inv9b Artist", discipline: "TATTOO", hourly_rate_cents: 16000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/flash-designs"
              payload: { artist_id: "${artist_id}", title: "Koi", piece_price_cents: 40000, estimated_minutes: 90 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { flash_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { full_name: "Inv9b Client", email: "inv9b@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/custom-requests"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", brief: "Phoenix back piece" }
              as: Client
              as_user_id: "${client_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /studio/custom-requests/${req_id}/decline"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "CustomDesignRequest.${req_id}.status == DECLINED"
            - "FlashDesign.${flash_id}.status == AVAILABLE"
