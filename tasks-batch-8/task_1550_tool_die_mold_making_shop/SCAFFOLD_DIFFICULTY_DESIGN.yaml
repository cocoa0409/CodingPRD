# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >=2 instances = 19 instances. Grounds reference
# SCAFFOLD.yaml §1.1–§1.7 only. All currency in integer cents.
# Fixture conventions: logical clock defaults to 2026-08-01T00:00:00Z;
# invoices issued by FinanceAdmin fin-a; payments recorded by fin-b (SoD-clean).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: quote_budgetary_vs_firm_contingency_divergence
        grounds:
          - calculations.quote_price_calculation
          - entities.Quote.fields.quote_kind
          - entities.Quote.fields.total_price_cents
        distinguishing_aspect: |
          Same design inputs (CLASS_103, 4 cavities, complexity 10, 12-week lead,
          not expedited) yield base 10000000 and a strictly different total per
          quote_kind: BUDGETARY 11500000 (15% contingency) vs FIRM 10500000 (5%) —
          a Quote-entity-domain dual variant.
        test_recipe:
          setup:
            - "Customer C1 ACTIVE (credit_limit 0 = unlimited)"
            - "ToolDesign D1 for C1: part PN-1001, INJECTION_MOLD, CLASS_103, 4 cavities, complexity 10, RELEASED"
            - "Two DRAFT quotes on D1: Q_B BUDGETARY and Q_F FIRM, both requested_lead_weeks 12, expedited false"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Acme Plastics", contact_email: "ap@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-1001", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "BUDGETARY", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q_b: $.data.id}
            - call: "GET /tool-designs/${d1}"
              as: Any
              captures: {d1_ver2: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver2}"}
              as: Estimator
              captures: {q_f: $.data.id}
          trigger:
            - call: "GET /quotes/${q_b}"
              as: Any
            - call: "GET /quotes/${q_f}"
              as: Any
          assert:
            - "Quote.${q_b}.base_price_cents == 10000000"
            - "Quote.${q_b}.contingency_pct == 0.15"
            - "Quote.${q_b}.total_price_cents == 11500000"
            - "Quote.${q_f}.base_price_cents == 10000000"
            - "Quote.${q_f}.contingency_pct == 0.05"
            - "Quote.${q_f}.total_price_cents == 10500000"
            - "Quote.${q_b}.total_price_cents - Quote.${q_f}.total_price_cents == 1000000"

      - name: warranty_linear_vs_declining_balance_divergence
        grounds:
          - calculations.warranty_proration_credit
          - entities.ToolAsset.fields.warranty_terms
          - entities.WarrantyClaim.fields.approved_credit_cents
        distinguishing_aspect: |
          Two tools at identical shot position (100000 of 250000 limit) and identical
          repair base 500000 produce different credits purely by warranty_terms
          variant — LINEAR_PRORATION 300000 vs DECLINING_BALANCE 180000 — a
          ToolAsset/WarrantyClaim-entity-domain dual variant (distinct from the
          Quote pricing domain).
        test_recipe:
          setup:
            - "Two customers CA and CB, each with a RELEASED CLASS_103 design (PN-3001/PN-3002, INJECTION_MOLD, 4 cavities, complexity 10)"
            - "Each with a FIRM quote (lead 12, total 10500000): CA's LINEAR_PRORATION (default), CB's DECLINING_BALANCE"
            - "Each quote ACCEPTED, build job created, advanced to IN_BUILD, tryout bought off (500 tryout shots), milestones 1-5 EARNED, milestones 1-4 invoiced (8925000) and paid in full via one payment of 8925000, job READY_TO_SHIP (outstanding 1575000 == lien threshold), tool shipped and delivered (IN_PRODUCTION)"
            - "Each tool driven to lifetime_shots == 100000 via one shot report of 99500 (period end 2026-08-20; clock advanced to 2026-08-25)"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Cust A", contact_email: "ca@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {ca: $.data.id}
            - call: "POST /customers"
              payload: {company_name: "Cust B", contact_email: "cb@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {cb: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${ca}", part_number: "PN-3001", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${ca}"
              captures: {da: $.data.id}
            - call: "POST /tool-designs/${da}/submit"
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /tool-designs/${da}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {da_ver: $.data.version}
            - call: "POST /tool-designs"
              payload: {customer_id: "${cb}", part_number: "PN-3002", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${cb}"
              captures: {db: $.data.id}
            - call: "POST /tool-designs/${db}/submit"
              as: Customer
              as_user_id: "${cb}"
            - call: "POST /tool-designs/${db}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {db_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${ca}", tool_design_id: "${da}", quote_kind: "FIRM", requested_lead_weeks: 12, warranty_terms: "LINEAR_PRORATION", expected_tool_design_version: "${da_ver}"}
              as: Estimator
              captures: {qa: $.data.id}
            - call: "POST /quotes"
              payload: {customer_id: "${cb}", tool_design_id: "${db}", quote_kind: "FIRM", requested_lead_weeks: 12, warranty_terms: "DECLINING_BALANCE", expected_tool_design_version: "${db_ver}"}
              as: Estimator
              captures: {qb: $.data.id}
            - call: "POST /quotes/${qa}/issue"
              as: Estimator
            - call: "POST /quotes/${qa}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /quotes/${qb}/issue"
              as: Estimator
            - call: "POST /quotes/${qb}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${cb}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${qa}"}
              as: ProjectManager
              captures: {ja: $.data.id}
            - call: "POST /build-jobs"
              payload: {quote_id: "${qb}"}
              as: ProjectManager
              captures: {jb: $.data.id}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${ja}"}
              as: Any
              captures: {a_m1: "$.data[0].id", a_m2: "$.data[1].id", a_m3: "$.data[2].id", a_m4: "$.data[3].id", a_m5: "$.data[4].id"}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${jb}"}
              as: Any
              captures: {b_m1: "$.data[0].id", b_m2: "$.data[1].id", b_m3: "$.data[2].id", b_m4: "$.data[3].id", b_m5: "$.data[4].id"}
            - call: "GET /tool-assets"
              payload: {build_job_id: "${ja}"}
              as: Any
              captures: {ta: "$.data[0].id"}
            - call: "GET /tool-assets"
              payload: {build_job_id: "${jb}"}
              as: Any
              captures: {tb: "$.data[0].id"}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${ja}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${jb}", machine_id: "CNC_2", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /build-jobs/${ja}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
            - call: "POST /build-jobs/${jb}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
            - call: "POST /press-reservations"
              payload: {build_job_id: "${ja}", press_id: "PRESS_500T", start_time: "2026-08-10T08:00:00Z", end_time: "2026-08-10T16:00:00Z"}
              as: ProjectManager
              captures: {pra: $.data.id}
            - call: "POST /press-reservations"
              payload: {build_job_id: "${jb}", press_id: "PRESS_800T", start_time: "2026-08-10T08:00:00Z", end_time: "2026-08-10T16:00:00Z"}
              as: ProjectManager
              captures: {prb: $.data.id}
            - call: "POST /tryout-samples"
              payload: {build_job_id: "${ja}", press_reservation_id: "${pra}"}
              as: ProjectManager
              captures: {sa: $.data.id}
            - call: "POST /tryout-samples"
              payload: {build_job_id: "${jb}", press_reservation_id: "${prb}"}
              as: ProjectManager
              captures: {sb: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-10T10:00:00Z"}
              as: ShopAdmin
            - call: "POST /tryout-samples/${sa}/submit"
              payload: {sample_qty: 30, shots_used: 500, measured_report_ref: "LAY-A1"}
              as: ProjectManager
            - call: "POST /tryout-samples/${sb}/submit"
              payload: {sample_qty: 30, shots_used: 500, measured_report_ref: "LAY-B1"}
              as: ProjectManager
            - call: "POST /tryout-samples/${sa}/buyoff-decision"
              payload: {decision: "BOUGHT_OFF"}
              as: QualityManager
            - call: "POST /tryout-samples/${sb}/buyoff-decision"
              payload: {decision: "BOUGHT_OFF"}
              as: QualityManager
            - call: "POST /build-milestones/${a_m1}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${a_m2}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${a_m3}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${a_m4}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${a_m5}/complete"
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /build-milestones/${b_m1}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${b_m2}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${b_m3}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${b_m4}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${b_m5}/complete"
              as: Customer
              as_user_id: "${cb}"
            - call: "POST /build-milestones/${a_m1}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${a_m2}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${a_m3}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${a_m4}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${b_m1}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${b_m2}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${b_m3}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "POST /build-milestones/${b_m4}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
            - call: "GET /build-jobs/${ja}"
              as: Any
              captures: {ja_ver: $.data.version}
            - call: "POST /build-jobs/${ja}/payments"
              payload: {amount_cents: 8925000, expected_build_job_version: "${ja_ver}"}
              as: FinanceAdmin
              as_user_id: "fin-b"
            - call: "GET /build-jobs/${jb}"
              as: Any
              captures: {jb_ver: $.data.version}
            - call: "POST /build-jobs/${jb}/payments"
              payload: {amount_cents: 8925000, expected_build_job_version: "${jb_ver}"}
              as: FinanceAdmin
              as_user_id: "fin-b"
            - call: "POST /build-jobs/${ja}/advance"
              payload: {target_state: "READY_TO_SHIP"}
              as: ProjectManager
            - call: "POST /build-jobs/${jb}/advance"
              payload: {target_state: "READY_TO_SHIP"}
              as: ProjectManager
            - call: "POST /tool-assets/${ta}/ship"
              payload: {carrier: "OLD DOMINION", tracking_number: "TRK-A"}
              as: ProjectManager
            - call: "POST /tool-assets/${tb}/ship"
              payload: {carrier: "OLD DOMINION", tracking_number: "TRK-B"}
              as: ProjectManager
            - call: "POST /tool-assets/${ta}/deliver"
              as: ProjectManager
            - call: "POST /tool-assets/${tb}/deliver"
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-25T00:00:00Z"}
              as: ShopAdmin
            - call: "POST /shot-reports"
              payload: {tool_asset_id: "${ta}", report_period_end: "2026-08-20T00:00:00Z", shots_in_period: 99500}
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /shot-reports"
              payload: {tool_asset_id: "${tb}", report_period_end: "2026-08-20T00:00:00Z", shots_in_period: 99500}
              as: Customer
              as_user_id: "${cb}"
          trigger:
            - call: "POST /warranty-claims"
              payload: {tool_asset_id: "${ta}", defect_description: "cracked cavity block", estimated_repair_cost_cents: 500000}
              as: Customer
              as_user_id: "${ca}"
              captures: {cla: $.data.id}
            - call: "POST /warranty-claims/${cla}/review"
              payload: {decision: "APPROVE"}
              as: QualityManager
            - call: "POST /warranty-claims"
              payload: {tool_asset_id: "${tb}", defect_description: "cracked cavity block", estimated_repair_cost_cents: 500000}
              as: Customer
              as_user_id: "${cb}"
              captures: {clb: $.data.id}
            - call: "POST /warranty-claims/${clb}/review"
              payload: {decision: "APPROVE"}
              as: QualityManager
          assert:
            - "WarrantyClaim.${cla}.claimed_at_shot_count == 100000"
            - "WarrantyClaim.${cla}.approved_credit_cents == 300000"
            - "WarrantyClaim.${clb}.claimed_at_shot_count == 100000"
            - "WarrantyClaim.${clb}.approved_credit_cents == 180000"
            - "WarrantyClaim.${cla}.approved_credit_cents - WarrantyClaim.${clb}.approved_credit_cents == 120000"
            - "ToolAsset.${ta}.warranty_terms == LINEAR_PRORATION"
            - "ToolAsset.${tb}.warranty_terms == DECLINING_BALANCE"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: quote_price_compression_expedited_compound_stack
        grounds:
          - calculations.quote_price_calculation
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (a) — a >= 3-input non-linear formula: tiered class base plus
          per-cavity and per-complexity rates, a min()-capped lead-compression
          surcharge, and a compounding expedited multiplier applied BEFORE the
          contingency. CLASS_105, 1 cavity, complexity 4, 4-week lead (2 weeks
          compressed = 0.10), expedited, FIRM: 2600000 -> x1.10 = 2860000 ->
          x1.10 = 3146000 -> x1.05 = 3303300.
        test_recipe:
          setup:
            - "Customer C ACTIVE; design D RELEASED: part PN-2001, PROGRESSIVE_DIE, CLASS_105, 1 cavity, complexity 4"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Rapid Proto", contact_email: "rp@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-2001", tool_type: "PROGRESSIVE_DIE", die_class: "CLASS_105", cavity_count: 1, design_complexity_score: 4}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
          trigger:
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 4, expedited: true, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
          assert:
            - "Quote.${q1}.base_price_cents == 2600000"
            - "Quote.${q1}.surcharge_pct == 0.10"
            - "Quote.${q1}.subtotal_cents == 3146000"
            - "Quote.${q1}.total_price_cents == 3303300"

      - name: milestone_replan_rounding_and_remainder_absorption
        grounds:
          - calculations.milestone_billing_schedule
          - entities.BuildMilestone.fields.planned_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: per-milestone
          round_half_up FIRST, remainder absorbed by the highest-seq replanned
          milestone. After an ECO re-baselines the CLASS_105 job to the odd-cent
          contract 3557929 with milestones 1-3 frozen (EARNED), replanned
          milestones 4/5/6 are 533689 / 355793 / 356137 — m6 is 356137, not the
          naive round(3557929*5%) = 177896, and the six sum exactly to 3557929.
        test_recipe:
          setup:
            - "Customer C ACTIVE; design CLASS_105 (PN-2005, PROGRESSIVE_DIE, 1 cavity, complexity 4) RELEASED"
            - "FIRM quote lead 4 expedited ACCEPTED (total 3303300); build job created and IN_BUILD; milestones 1-3 EARNED (locked 660660/825825/825825), milestones 4-6 PENDING"
            - "ECO filed against the job (SHOP, affects_from_milestone_seq 4) and assessed: 10.0 rework hours, 40000 scrapped material, 5-week lead extension"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Rapid Proto 2", contact_email: "rp2@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-2005", tool_type: "PROGRESSIVE_DIE", die_class: "CLASS_105", cavity_count: 1, design_complexity_score: 4}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 4, expedited: true, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${j1}"}
              as: Any
              captures: {m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id", m5: "$.data[4].id", m6: "$.data[5].id"}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /build-jobs/${j1}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
            - call: "POST /build-milestones/${m1}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${m2}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${m3}/complete"
              as: ProjectManager
            - call: "GET /build-jobs/${j1}"
              as: Any
              captures: {j1_ver: $.data.version}
            - call: "POST /engineering-changes"
              payload: {build_job_id: "${j1}", requested_by: "SHOP", description: "add lifters", affects_from_milestone_seq: 4, expected_build_job_version: "${j1_ver}"}
              as: ToolingEngineer
              captures: {eco: $.data.id}
            - call: "POST /engineering-changes/${eco}/assess"
              payload: {rework_hours: 10.0, scrapped_material_cost_cents: 40000, lead_extension_weeks: 5}
              as: ToolingEngineer
          trigger:
            - call: "POST /engineering-changes/${eco}/customer-decision"
              payload: {decision: "APPROVED"}
              as: Customer
              as_user_id: "${c1}"
          assert:
            - "BuildJob.${j1}.contract_value_cents == 3557929"
            - "BuildMilestone.${m1}.planned_amount_cents == 660660"
            - "BuildMilestone.${m2}.planned_amount_cents == 825825"
            - "BuildMilestone.${m3}.planned_amount_cents == 825825"
            - "BuildMilestone.${m4}.planned_amount_cents == 533689"
            - "BuildMilestone.${m5}.planned_amount_cents == 355793"
            - "BuildMilestone.${m6}.planned_amount_cents == 356137"
            - "BuildMilestone.${m6}.status == PENDING"
            - "660660 + 825825 + 825825 + 533689 + 355793 + 356137 == BuildJob.${j1}.contract_value_cents"

      - name: eco_reprice_pinned_evaluation_order
        grounds:
          - calculations.eco_impact_reprice
          - entities.EngineeringChange.fields.schedule_penalty_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation
          order: the schedule penalty base is (contract + impact_cost) and MUST
          exclude the penalty itself. On the CLASS_105 job (contract 3303300)
          with 10.0 h rework, 40000 scrapped material, 5-week extension:
          labor 105000 + material 46000 = impact 151000; penalty =
          round(0.03 x 3454300) = 103629 (a contract-only base would give 99099);
          total_charge = 254629.
        test_recipe:
          setup:
            - "Same fixture as milestone_replan_rounding_and_remainder_absorption up to ECO creation: CLASS_105 job IN_BUILD, contract 3303300, ECO SUBMITTED with affects_from_milestone_seq 4"
          setup_api_calls:
