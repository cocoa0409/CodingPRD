scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: family_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Family, entities.Family.fields.outstanding_balance_cents, entities.Family.fields.credit_balance_cents]
        distinguishing_aspect: "A created family starts with zeroed computed balances, version 1, and server-minted id/created_at; a create missing the required membership_status fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /school/families", payload: { family_name: "Fam Zero", primary_email: "z@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id, f_out: $.data.outstanding_balance_cents, f_credit: $.data.credit_balance_cents, f_ver: $.data.version, f_created: $.data.created_at } }
            - { call: "POST /school/families", payload: { family_name: "Fam Bad", primary_email: "bad@x.org" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "f_out == 0 and f_credit == 0 (computed defaults)"
            - "f_ver == 1 and f_created is an ISO-8601 timestamp (system fields server-minted)"
            - "err == ERR_INVALID_REQUEST (HTTP 400) for the missing membership_status"

      - name: invalid_input_shapes_return_invalid_request
        claim_type: type_constraints
        grounds: [entities.Student.fields.grade, entities.Section.fields.start_time, "validations[priority=5]"]
        distinguishing_aspect: "Enum and range violations are rejected at the request layer: grade 'G9' is not in the declared enum, and end_time <= start_time violates the section time-range rule."
        test_recipe:
          setup: ["one family exists; one year exists (SETUP suffices)"]
          setup_api_calls:
            - { call: "POST /school/families", payload: { family_name: "Fam S", primary_email: "s@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
          trigger:
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Kid", grade: "G9", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "11:30", end_time: "10:00" }, as: SchoolAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (grade G9 not in K|G1..G7)"
            - "err2 == ERR_INVALID_REQUEST (end_time 10:00 <= start_time 11:30)"

      - name: get_nonexistent_family_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a well-formed but absent family id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /school/families/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: enrollment_extra_field_rejected
        claim_type: system_fields
        grounds: [entities.Enrollment.fields.estimated_tuition_cents, "validations[priority=5]"]
        distinguishing_aspect: "Client-supplied computed/unknown fields (estimated_tuition_cents) are rejected with ERR_INVALID_REQUEST — computed values are server-owned."
        test_recipe:
          setup: ["OPEN year with ACTIVE plan; staffed G3/BEGINNER section; family with one G3/BEGINNER student"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam X", primary_email: "x@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Ex", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
          trigger:
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}", estimated_tuition_cents: 1 }, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400) — unknown/computed field in payload"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: teacher_hire_from_applied_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Teacher.VETTED_to_HIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "hire is declared only from VETTED; invoking it on an APPLIED teacher fails with ERR_INVALID_STATE and leaves status APPLIED."
        test_recipe:
          setup: ["teacher created with background_check_cleared true (still APPLIED)"]
          setup_api_calls:
            - { call: "POST /school/teachers", payload: { full_name: "New", email: "n@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"
            - "Teacher.${t_id}.status remains APPLIED"

      - name: invalid_from_state_transitions_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SecurityPlan.SUBMITTED_to_ACTIVE, state_machines.AssistanceApplication.UNDER_REVIEW_to_APPROVED, state_machines.Milestone.SCHEDULED_to_COMPLETED, state_machines.Enrollment.terminal_states, state_machines.Session.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Five from-state violations across five entities — approve a DRAFT plan, decide a SUBMITTED (unreviewed) application, complete a TRACKING milestone, withdraw an already-WITHDRAWN enrollment, cancel an already-CANCELLED session — all fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "OPEN year with plan P1 ACTIVE (for the open) and plan P2 left DRAFT; staffed G3/BEGINNER section capacity 5; family with one enrolled student (milestone TRACKING, application SUBMITTED); one session created and manually cancelled; enrollment withdrawn once"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P1" }, as: SchoolAdmin, captures: { sp1: $.data.id } }
            - { call: "POST /school/security-plans/${sp1}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp1}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P2 draft" }, as: SchoolAdmin, captures: { sp2: $.data.id, sp2_status: $.data.status } }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam F", primary_email: "f@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Eff", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { enr: $.data.id } }
            - { call: "GET /school/milestones?student_id=${stu}", payload: {}, as: SchoolAdmin, captures: { m_id: "$.data[0].id" } }
            - { call: "POST /school/families/${fam}/assistance-applications", payload: { school_year_id: "${y_id}", reason: "Need" }, as: SchoolAdmin, captures: { app: $.data.id } }
            - { call: "POST /school/sections/${sec}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { se: $.data.id } }
            - { call: "POST /school/sessions/${se}/cancel", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/enrollments/${enr}/withdraw", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /school/security-plans/${sp2}/approve", payload: {}, as: SchoolAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /school/assistance-applications/${app}/decide", payload: { decision: "DENIED" }, as: SchoolAdmin, as_user_id: "admin-9", captures: { e2: $.data.error_id } }
            - { call: "POST /school/milestones/${m_id}/complete", payload: {}, as: SchoolAdmin, captures: { e3: $.data.error_id } }
            - { call: "POST /school/enrollments/${enr}/withdraw", payload: {}, as: SchoolAdmin, captures: { e4: $.data.error_id } }
            - { call: "POST /school/sessions/${se}/cancel", payload: {}, as: SchoolAdmin, captures: { e5: $.data.error_id } }
          assert:
            - "e1 == ERR_INVALID_STATE (approve from DRAFT, not SUBMITTED)"
            - "e2 == ERR_INVALID_STATE (decide from SUBMITTED, not UNDER_REVIEW)"
            - "e3 == ERR_INVALID_STATE (complete from TRACKING, not SCHEDULED)"
            - "e4 == ERR_INVALID_STATE (second withdraw on terminal WITHDRAWN — idempotency)"
            - "e5 == ERR_INVALID_STATE (cancel on terminal CANCELLED — terminal lockdown)"

      - name: initial_states_and_payment_auto_transitions
        claim_type: initial_state
        grounds: [state_machines.TuitionInvoice, state_machines.Enrollment, state_machines.Section, entities.Milestone, entities.VolunteerCommitment]
        distinguishing_aspect: "Fresh entities land in their declared initial states (Section OPEN, Enrollment REGISTERED, Milestone TRACKING, VolunteerCommitment OPEN, invoice ISSUED), and payments drive the automatic ISSUED -> PARTIALLY_PAID -> PAID transitions with balances recomputed at each hop."
        test_recipe:
          setup: ["OPEN year with ACTIVE plan; staffed G3/BEGINNER section capacity 5; MEMBER family with one student"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id, y_status0: $.data.status } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P1" }, as: SchoolAdmin, captures: { sp: $.data.id, sp_status0: $.data.status } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id, t_status0: $.data.status } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version, sec_status0: $.data.status } }
            - { call: "POST /school/families", payload: { family_name: "Fam I", primary_email: "i@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id, fam_v: $.data.version } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Eye", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { enr: $.data.id, enr_status0: $.data.status } }
            - { call: "GET /school/milestones?student_id=${stu}", payload: {}, as: SchoolAdmin, captures: { m_status0: "$.data[0].status" } }
            - { call: "GET /school/volunteer-commitments?family_id=${fam}", payload: {}, as: SchoolAdmin, captures: { vc_status0: "$.data[0].status", vc_req: "$.data[0].required_hours" } }
          trigger:
            - { call: "POST /school/families/${fam}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv: $.data.id, inv_status0: $.data.status } }
            - { call: "POST /school/families/${fam}/payments", payload: { amount_cents: 20000, method: "CARD" }, as: SchoolAdmin }
            - { call: "GET /school/invoices/${inv}", payload: {}, as: SchoolAdmin, captures: { st_mid: $.data.status, bal_mid: $.data.balance_cents } }
            - { call: "POST /school/families/${fam}/payments", payload: { amount_cents: 52063, method: "ACH" }, as: SchoolAdmin }
            - { call: "GET /school/invoices/${inv}", payload: {}, as: SchoolAdmin, captures: { st_end: $.data.status, bal_end: $.data.balance_cents } }
          assert:
            - "Initial states: y_status0 == SETUP, sp_status0 == DRAFT, t_status0 == APPLIED, sec_status0 == OPEN, enr_status0 == REGISTERED, m_status0 == TRACKING, vc_status0 == OPEN with vc_req == 8, inv_status0 == ISSUED"
            - "After paying 20000: st_mid == PARTIALLY_PAID and bal_mid == 52063 (72063 - 20000)"
            - "After paying the remaining 52063: st_end == PAID and bal_end == 0"

      - name: closure_cancels_covered_sessions
        claim_type: side_effect_execution
        grounds: ["endpoints.POST /school/school-years/{id}/closures", state_machines.Session.SCHEDULED_to_CANCELLED, entities.Session.fields.cancel_reason]
        distinguishing_aspect: "Creating a closure cancels exactly the SCHEDULED sessions whose dates fall inside the inclusive range (cancel_reason CLOSURE) and leaves out-of-range sessions SCHEDULED."
        test_recipe:
          setup: ["OPEN year; staffed section with two SCHEDULED sessions 2026-09-13 and 2026-09-20; no closures yet"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id } }
            - { call: "POST /school/sections/${sec}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { s_in: $.data.id } }
            - { call: "POST /school/sections/${sec}/sessions", payload: { session_date: "2026-09-20" }, as: SchoolAdmin, captures: { s_out: $.data.id } }
          trigger:
            - { call: "POST /school/school-years/${y_id}/closures", payload: { start_date: "2026-09-12", end_date: "2026-09-14", reason: "Yom Kippur" }, as: SchoolAdmin }
            - { call: "GET /school/sessions/${s_in}", payload: {}, as: SchoolAdmin, captures: { st_in: $.data.status, why_in: $.data.cancel_reason } }
            - { call: "GET /school/sessions/${s_out}", payload: {}, as: SchoolAdmin, captures: { st_out: $.data.status } }
          assert:
            - "st_in == CANCELLED and why_in == CLOSURE (2026-09-13 inside [09-12, 09-14])"
            - "st_out == SCHEDULED (2026-09-20 outside the closure)"

      - name: session_hold_activates_registered_enrollments
        claim_type: side_effect_execution
        grounds: [state_machines.Session.SCHEDULED_to_HELD, state_machines.Enrollment.REGISTERED_to_ACTIVE]
        distinguishing_aspect: "The first hold of a section session flips that section's REGISTERED enrollments to ACTIVE (cross-entity bubble from Session to Enrollment)."
        test_recipe:
          setup: ["OPEN year; staffed section with one REGISTERED enrollment; session 2026-09-13; clock advanced to 2026-09-13"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam H", primary_email: "h@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Aitch", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { enr: $.data.id } }
