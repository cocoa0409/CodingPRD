            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_s1}", title: "TS1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_s1}"
              captures: { trk_s1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_s2}", title: "TS2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_s2}"
              captures: { trk_s2: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Tight List", genre_focus: "POP", mood_focus: "ANY", slot_count: 1, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_sl: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_s1}", pitch_text: "first", target_playlist_id: "${pl_sl}" }
              as: RightsHolder
              as_user_id: "${art_s1}"
              captures: { pit_s1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_s2}", pitch_text: "second", target_playlist_id: "${pl_sl}" }
              as: RightsHolder
              as_user_id: "${art_s2}"
              captures: { pit_s2: $.data.id }
            - call: "POST /catalog/pitches/${pit_s1}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_s2}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
          trigger:
            - call: "POST /catalog/pitches/${pit_s1}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "POST /catalog/pitches/${pit_s2}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
              captures: { err_slot: $.data.error_id }
          assert:
            - "first ACCEPT succeeds and creates a PlaylistPlacement with slot_index == 0 and status SCHEDULED"
            - "second ACCEPT returns 409 err_slot == ERR_NO_FREE_SLOT — the candidate set is empty at exactly slot_count == occupied"
            - "PitchSubmission.${pit_s2}.status is still UNDER_REVIEW (the selector failure is not a rejection)"
            - "PitchSubmission.${pit_s1}.status == ACCEPTED"

