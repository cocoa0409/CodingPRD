    code: 200
    input: []
    output: ColdChainShipper
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/shippers/{id}/attach-carton"
    description: "Load a carton into the shipper and recompute the ice requirement"
    roles: [LogisticsOperator]
    code: 200
    input: [carton_id]
    output: ColdChainShipper
    side_effects:
      - "carton.cold_chain_shipper_id set"
      - "payload_locked_at set on the first attached carton, blocking further packing edits"
      - "required_dry_ice_kg, dry_ice_deficit_kg and punctured_ice_slots recomputed"
      - "increments cold_chain_shipper.version by 1"
  - method: POST
    path: "/vaccine-distribution/shippers/{id}/seal"
