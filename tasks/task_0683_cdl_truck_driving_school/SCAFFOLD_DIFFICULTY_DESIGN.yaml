              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_road: $.data.id }
