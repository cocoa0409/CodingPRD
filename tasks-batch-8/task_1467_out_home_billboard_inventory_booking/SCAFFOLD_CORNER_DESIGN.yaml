  # =================================================================
  # Section: calculations (PERMIT_SUSPENSION branch)
  # =================================================================
  - section: calculations
    instances:
      - name: permit_reinstate_restores_face_and_settles_suspension_credit
        claim_type: correct_result
        grounds: [calculations.make_good_credit, state_machines.Permit.EXPIRED_to_ACTIVE, state_machines.Face.PERMIT_SUSPENDED_to_AVAILABLE]
        distinguishing_aspect: "Compensation cycle: permit expiry suspends the face (marker set on the LIVE flight at 2026-09-15); reinstatement 7 days later restores the face and settles the accrual — suspension_days_accrued == 7 and a PERMIT_SUSPENSION make-good of round_half_up(287500 x 7/7) == 287500 is auto-proposed."
        test_recipe:
          setup:
            - "Static face F1 (illuminated, 300000) with permit expiring 2026-09-15T00:00:00Z; flight 2026-08-10..2026-10-04 (8 weeks) LIVE via verified posting at clock 2026-08-10; campaign ACTIVE"
            - "Clock 2026-09-15T00:00:00Z swept permit EXPIRED -> face PERMIT_SUSPENDED -> flight.suspension_started_at = 2026-09-15T00:00:00Z"
          setup_api_calls:
