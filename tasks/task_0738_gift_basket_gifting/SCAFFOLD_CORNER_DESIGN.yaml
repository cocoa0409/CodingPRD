scaffold_corner_design:
  # ===========================================================================
  # Section: entities  (FK/path existence checks — one per distinct 404 error_id)
  # ===========================================================================
  - section: entities
    instances:
      - name: get_account_not_found_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=3]", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET /corporate-accounts/{id} with a syntactically well-formed but non-existent id returns ERR_ACCOUNT_NOT_FOUND, not a 200 with empty data."
        test_recipe:
          setup: ["No account exists with the probed id."]
          setup_api_calls: []
          trigger:
            - call: "GET /corporate-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response error_id == 'ERR_ACCOUNT_NOT_FOUND' with http_status 404"

      - name: order_path_id_not_found_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=4]", "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{id} with a non-existent order id returns ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["No order exists with the probed id."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response error_id == 'ERR_ORDER_NOT_FOUND' with http_status 404"

      - name: recipient_path_id_not_found_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=5]", "errors[ERR_RECIPIENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /recipients/{id}/message-proof with a non-existent recipient id returns ERR_RECIPIENT_NOT_FOUND before any state/business check runs."
        test_recipe:
          setup: ["No recipient exists with the probed id."]
          setup_api_calls: []
          trigger:
            - call: "POST /recipients/00000000-0000-4000-8000-000000000002/message-proof"
              payload: { message_text: "Hi", submitted_by_user_id: "emp-x" }
              as: AccountManager
              as_user_id: "acct-doesnt-matter"
          assert:
            - "response error_id == 'ERR_RECIPIENT_NOT_FOUND' with http_status 404"

      - name: template_id_not_found_on_order_create_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=6]", "errors[ERR_TEMPLATE_NOT_FOUND]"]
        distinguishing_aspect: "POST /corporate-accounts/{id}/orders referencing a non-existent template_id returns ERR_TEMPLATE_NOT_FOUND."
        test_recipe:
          setup: ["A CorporateAccount exists; no GiftBasketTemplate exists with the probed id."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Upsilon Corp", billing_email: "ap@upsilon.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "00000000-0000-4000-8000-000000000003", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_TEMPLATE_NOT_FOUND' with http_status 404"

      - name: branding_profile_id_not_found_on_order_create_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=7]", "errors[ERR_BRANDING_PROFILE_NOT_FOUND]"]
        distinguishing_aspect: "POST /corporate-accounts/{id}/orders referencing a non-existent branding_profile_id returns ERR_BRANDING_PROFILE_NOT_FOUND (checked after template existence, priority 7 after priority 6)."
        test_recipe:
          setup: ["A CorporateAccount and a valid GiftBasketTemplate exist; no BrandingProfile exists with the probed id."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Phi Corp", billing_email: "ap@phi.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Cap", unit_cost_cents: 200, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Cap Basket", category: "CORPORATE_WELCOME", base_price_cents: 2000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
          trigger:
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", branding_profile_id: "00000000-0000-4000-8000-000000000004", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_BRANDING_PROFILE_NOT_FOUND' with http_status 404"

      - name: sku_id_not_found_on_template_create_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=8]", "errors[ERR_SKU_NOT_FOUND]"]
        distinguishing_aspect: "POST /gift-basket-templates with a components[].sku_id that does not exist returns ERR_SKU_NOT_FOUND."
        test_recipe:
          setup: ["No ComponentSKU exists with the probed id."]
          setup_api_calls: []
          trigger:
            - call: "POST /gift-basket-templates"
              payload: { name: "Bad Basket", category: "CUSTOM", base_price_cents: 1000, is_perishable: false, components: [ { sku_id: "00000000-0000-4000-8000-000000000005", quantity: 1 } ], active: true }
              as: PlatformAdmin
          assert:
            - "response error_id == 'ERR_SKU_NOT_FOUND' with http_status 404"

      - name: station_id_not_found_on_budget_decision_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=9]", "errors[ERR_FULFILLMENT_REF_NOT_FOUND]"]
        distinguishing_aspect: "POST /orders/{id}/budget-decision APPROVE referencing a non-existent station_id returns ERR_FULFILLMENT_REF_NOT_FOUND."
        test_recipe:
          setup: ["An order is submitted for approval and awaiting a human decision (PENDING_APPROVAL)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Chi Corp", billing_email: "ap@chi.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Pen", unit_cost_cents: 100, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Pen Basket 2", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Ref Recipient", email: "ref@example.com", shipping_address_line1: "1 Ref St", city: "Salem", state_code: "OR", postal_code: "97301", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-18" }
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-18", station_id: "00000000-0000-4000-8000-000000000006", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
          assert:
            - "response error_id == 'ERR_FULFILLMENT_REF_NOT_FOUND' with http_status 404"

      - name: assembly_task_path_id_not_found_returns_404
        claim_type: fk_integrity
        grounds: ["validations[priority=10]", "errors[ERR_SUBRESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /assembly-tasks/{id}/advance with a non-existent task id returns ERR_SUBRESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["No AssemblyTask exists with the probed id."]
          setup_api_calls: []
          trigger:
            - call: "POST /assembly-tasks/00000000-0000-4000-8000-000000000007/advance"
              payload: { target_status: "IN_PROGRESS" }
              as: WarehouseOps
          assert:
            - "response error_id == 'ERR_SUBRESOURCE_NOT_FOUND' with http_status 404"

  # ===========================================================================
  # Section: state_machines  (invalid-from-state rejections not already covered by §1.8)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assembly_task_start_after_complete_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.AssemblyTask.IN_PROGRESS_to_COMPLETE", "errors[ERR_INVALID_FULFILLMENT_STATE]"]
        distinguishing_aspect: "An AssemblyTask already COMPLETE cannot be advanced to IN_PROGRESS again; no side effects (no double-decrement of on_hand_qty)."
        test_recipe:
          setup: ["An order is approved with 1 recipient; its single AssemblyTask is advanced QUEUED -> IN_PROGRESS -> COMPLETE."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Psi Corp", billing_email: "ap@psi.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Lamp", unit_cost_cents: 800, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Lamp Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station V", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Task Recipient", email: "task@example.com", shipping_address_line1: "2 Task St", city: "Keizer", state_code: "OR", postal_code: "97303", country_code: "US", quantity: 2 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-19" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-19", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
            - call: "GET /assembly-tasks"
              payload: { recipient_id: "${recipient_id}" }
              as: WarehouseOps
              captures: { task_id: "$.data[0].id" }
            - call: "POST /assembly-tasks/${task_id}/advance"
              payload: { target_status: "IN_PROGRESS" }
              as: WarehouseOps
            - call: "POST /assembly-tasks/${task_id}/advance"
              payload: { target_status: "COMPLETE" }
              as: WarehouseOps
          trigger:
            - call: "POST /assembly-tasks/${task_id}/advance"
              payload: { target_status: "IN_PROGRESS" }
              as: WarehouseOps
          assert:
            - "response error_id == 'ERR_INVALID_FULFILLMENT_STATE' with http_status 409"

      - name: shipment_advance_after_delivered_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Shipment", "errors[ERR_INVALID_FULFILLMENT_STATE]"]
        distinguishing_aspect: "A Shipment already DELIVERED (terminal) cannot be advanced further."
        test_recipe:
          setup: ["A Shipment is created and advanced CREATED -> LABEL_GENERATED -> IN_TRANSIT -> DELIVERED."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Omega Corp", billing_email: "ap@omega.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Vase", unit_cost_cents: 600, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Vase Basket", category: "CLIENT_APPRECIATION", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "US-SOUTH", country_codes: ["US"], carrier: "SwiftShip", base_rate_cents: 500, per_kg_rate_cents: 100, transit_days_min: 2, transit_days_max: 5, blackout_dates: [] }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Ship Recipient", email: "ship@example.com", shipping_address_line1: "3 Ship St", city: "Albany", state_code: "OR", postal_code: "97321", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /recipients/${recipient_id}/message-proof"
              payload: { message_text: "Thanks!", submitted_by_user_id: "emp-msg-5" }
              as: AccountManager
              captures: { proof_id: $.data.id }
            - call: "POST /message-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE", decided_by_user_id: "proof-appr-5" }
              as: ProofApprover
            - call: "POST /recipients/${recipient_id}/shipments"
              payload: { zone_id: "${zone_id}", ship_date: "2026-03-05T00:00:00Z" }
              as: ShippingOps
              captures: { shipment_id: $.data.id }
            - call: "POST /shipments/${shipment_id}/advance"
              payload: { target_status: "LABEL_GENERATED" }
              as: ShippingOps
            - call: "POST /shipments/${shipment_id}/advance"
              payload: { target_status: "IN_TRANSIT" }
              as: ShippingOps
            - call: "POST /shipments/${shipment_id}/advance"
              payload: { target_status: "DELIVERED" }
              as: ShippingOps
          trigger:
            - call: "POST /shipments/${shipment_id}/advance"
              payload: { target_status: "IN_TRANSIT" }
              as: ShippingOps
          assert:
            - "response error_id == 'ERR_INVALID_FULFILLMENT_STATE' with http_status 409"

      - name: budget_decision_after_already_decided_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.BudgetApproval", "errors[ERR_INVALID_DECISION_STATE]"]
        distinguishing_aspect: "A BudgetApproval already APPROVED cannot be decided again (no second REJECT can overwrite an already-APPROVED decision)."
        test_recipe:
          setup: ["An order is submitted and approved once."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "AlphaTwo Corp", billing_email: "ap@alphatwo.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Cup", unit_cost_cents: 200, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Cup Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station W", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Decided Recipient", email: "decided@example.com", shipping_address_line1: "4 Decide St", city: "Lebanon", state_code: "OR", postal_code: "97355", country_code: "US", quantity: 2 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-20" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-20", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
          trigger:
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "REJECT", approver_user_id: "fin-appr-21", decision_reason: "too late" }
              as: FinanceApprover
          assert:
            - "response error_id == 'ERR_INVALID_DECISION_STATE' with http_status 409"

      - name: message_proof_decision_after_locked_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MessageProof", "errors[ERR_INVALID_DECISION_STATE]"]
        distinguishing_aspect: "A MessageProof already LOCKED cannot be decided again."
        test_recipe:
          setup: ["A MessageProof is submitted and APPROVE-decided, auto-advancing to LOCKED."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "BetaTwo Corp", billing_email: "ap@betatwo.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Bowl", unit_cost_cents: 300, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Bowl Basket", category: "CLIENT_APPRECIATION", base_price_cents: 3000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Locked Recipient", email: "locked@example.com", shipping_address_line1: "5 Lock St", city: "Newport", state_code: "OR", postal_code: "97365", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /recipients/${recipient_id}/message-proof"
              payload: { message_text: "Cheers!", submitted_by_user_id: "emp-msg-6" }
              as: AccountManager
              captures: { proof_id: $.data.id }
            - call: "POST /message-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE", decided_by_user_id: "proof-appr-6" }
              as: ProofApprover
          trigger:
            - call: "POST /message-proofs/${proof_id}/decision"
              payload: { decision: "REQUEST_REVISION", decided_by_user_id: "proof-appr-6" }
              as: ProofApprover
          assert:
            - "response error_id == 'ERR_INVALID_DECISION_STATE' with http_status 409"

      - name: recurring_series_pause_when_already_paused_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.RecurringOrderSeries", "errors[ERR_INVALID_SERIES_STATE]"]
        distinguishing_aspect: "Pausing an already-paused RecurringOrderSeries is rejected (target active=false requested twice)."
        test_recipe:
          setup: ["A RecurringOrderSeries is created (active=true) then paused once (active=false)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "GammaTwo Corp", billing_email: "ap@gammatwo.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Planner", unit_cost_cents: 400, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Planner Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { source_order_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/recurring-series"
              payload: { source_order_id: "${source_order_id}", interval_days: 30 }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { series_id: $.data.id }
            - call: "PATCH /recurring-series/${series_id}"
              payload: { active: false }
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "PATCH /recurring-series/${series_id}"
              payload: { active: false }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_INVALID_SERIES_STATE' with http_status 409"

      - name: submit_for_approval_while_already_pending_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.CorporateOrder.DRAFT_to_PENDING_APPROVAL", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "Submitting an order that is already PENDING_APPROVAL (not DRAFT or REJECTED) is rejected."
        test_recipe:
          setup: ["An order is submitted once and awaits a human FinanceApprover decision (PENDING_APPROVAL)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "DeltaTwo Corp", billing_email: "ap@deltatwo.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
