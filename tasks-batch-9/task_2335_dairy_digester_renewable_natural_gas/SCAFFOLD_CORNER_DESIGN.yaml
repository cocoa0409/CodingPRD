              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_statement: "$.data.error_id" }
          assert:
            - "every call HTTP status == 404"
            - "every call response_type == error"
            - "${err_dairy} == ERR_DAIRY_NOT_FOUND"
            - "${err_facility} == ERR_FACILITY_NOT_FOUND"
            - "${err_agreement} == ERR_AGREEMENT_NOT_FOUND"
            - "${err_delivery} == ERR_DELIVERY_NOT_FOUND"
            - "${err_ops_day} == ERR_OPS_DAY_NOT_FOUND"
            - "${err_interconnect} == ERR_INTERCONNECT_NOT_FOUND"
            - "${err_nomination} == ERR_NOMINATION_NOT_FOUND"
            - "${err_pathway} == ERR_PATHWAY_NOT_FOUND"
            - "${err_batch} == ERR_BATCH_NOT_FOUND"
            - "${err_audit} == ERR_AUDIT_NOT_FOUND"
            - "${err_application} == ERR_APPLICATION_NOT_FOUND"
            - "${err_statement} == ERR_STATEMENT_NOT_FOUND"

      - name: error_missing_auth_headers_are_unauthenticated_before_any_lookup
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=10]
        distinguishing_aspect: >
          Authentication is screened at priority 10, ahead of the priority-30 path lookup,
          so an unauthenticated read of a non-existent facility answers 401 rather than
          404 - and an unrecognised role string is treated as unauthenticated, not as a
          forbidden role.
        test_recipe:
          setup:
            - "Empty database; the request never reaches a lookup."
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/9f000000-0000-4000-8000-000000000002"
              payload: {}
              as: "(no X-User-Role header sent)"
              as_user_id: "u-admin"
              captures: { err_no_role: "$.data.error_id" }
            - call: "GET /facilities/9f000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              as_user_id: "(no X-User-ID header sent)"
              captures: { err_no_user: "$.data.error_id" }
            - call: "GET /facilities/9f000000-0000-4000-8000-000000000002"
              payload: {}
              as: "LenderAgent"
              as_user_id: "u-lender"
              captures: { err_unknown_role: "$.data.error_id" }
          assert:
            - "every call HTTP status == 401"
            - "every call response_type == error"
            - "${err_no_role} == ERR_UNAUTHENTICATED"
            - "${err_no_user} == ERR_UNAUTHENTICATED"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED"
            - "every call data.message is a non-empty string"

      - name: error_enum_and_numeric_constraint_breaches_are_invalid_request
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=20]
          - entities.DigesterFacility.fields.thermal_regime
          - entities.Dairy.fields.herd_size
        distinguishing_aspect: >
          Shape screening at priority 20 covers three different breach kinds under one
          code - an out-of-catalogue enum, a numeric constraint violation and a wrong
          scalar type - and it runs before any foreign-key resolution.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Ambient Lagoon", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "AMBIENT", target_temperature_c: 22.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /dairies"
              payload: { name: "Empty Barn Dairy", county: "Tulare", herd_size: 0, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_range: "$.data.error_id" }
            - call: "POST /dairies"
              payload: { name: "Typo Dairy", county: "Tulare", herd_size: "three thousand", manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_type: "$.data.error_id" }
          assert:
            - "every call HTTP status == 400"
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_range} == ERR_INVALID_REQUEST"
            - "${err_type} == ERR_INVALID_REQUEST"
            - "no Dairy row exists"
            - "no DigesterFacility row exists"

  - section: rbac
    instances:
      - name: rbac_platform_admin_performs_its_exclusive_master_data_writes
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - endpoints[POST /dairies]
          - endpoints[POST /facilities]
        distinguishing_aspect: >
          The three PlatformAdmin-exclusive writes all succeed for that role in one pass -
          clock, dairy and facility - which is the positive half of the exclusivity claim
          the denial tests depend on.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
          assert:
            - "second call HTTP status == 201"
            - "third call HTTP status == 201"
            - "Dairy.${dairy1_id}.status == PROSPECT"
            - "DigesterFacility.${facility_id}.design_max_olr == 3.500"

      - name: rbac_other_roles_are_forbidden_from_exclusive_writes
        claim_type: unauthorized_operation
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - roles.CreditVerifier.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >
          Role screening at priority 15 precedes payload and state screening, so each of
          these four calls carries a perfectly valid body and still returns 403: the
          operator cannot register a dairy, finance cannot register a facility, the
          verifier cannot open a pathway and the program desk cannot open an audit.
        test_recipe:
          setup:
            - "Canonical plant plus one PROVISIONAL LCFS pathway, so the denied calls have real ids to aim at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /credit-pathways"
              payload: { facility_id: "${facility_id}", program: "LCFS", pathway_code: "CA-LCFS-DDRNG-2026-01" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { pathway_id: "$.data.id" }
          trigger:
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { err_dairy_write: "$.data.error_id" }
            - call: "POST /facilities"
              payload: { name: "Shadow Plant", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { err_facility_write: "$.data.error_id" }
            - call: "POST /credit-pathways"
              payload: { facility_id: "${facility_id}", program: "RFS_D3", pathway_code: "EPA-RFS-D3-2026-01" }
              as: CreditVerifier
              as_user_id: "u-verifier"
              captures: { err_pathway_write: "$.data.error_id" }
            - call: "POST /verification-audits"
              payload: { pathway_id: "${pathway_id}", audit_year: 2026, verifier_body_name: "Sierra Verification Services" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { err_audit_write: "$.data.error_id" }
          assert:
            - "every call HTTP status == 403"
            - "${err_dairy_write} == ERR_FORBIDDEN_ROLE"
            - "${err_facility_write} == ERR_FORBIDDEN_ROLE"
            - "${err_pathway_write} == ERR_FORBIDDEN_ROLE"
            - "${err_audit_write} == ERR_FORBIDDEN_ROLE"
            - "no Dairy row exists"
            - "CreditPathway.${pathway_id}.status == PROVISIONAL"

      - name: rbac_dairy_partner_cannot_act_on_another_dairys_agreement
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=50]
          - errors[ERR_NOT_OWNING_DAIRY]
          - roles.DairyPartner.identity
        distinguishing_aspect: >
          DairyPartner identity is entity-backed, so authorisation is per-row rather than
          per-role: the second dairy holds the DairyPartner role and is still refused on
          both counter and sign, while the owning dairy signs the very same agreement
          successfully.
        test_recipe:
          setup:
            - "Canonical plant with two dairies and one OFFERED agreement naming the first dairy."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /dairies"
              payload: { name: "Rio Seco Dairy", county: "Kings", herd_size: 1800, manure_management_baseline: "SOLID_STORAGE", haul_distance_km: 30.0, annual_nitrogen_budget_kg: 15000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy2_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 6.50, term_start_date: "2026-07-01", term_end_date: "2027-06-30", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
          trigger:
            - call: "POST /feedstock-agreements/${agr1_id}/counter"
              payload: { countered_tonnes_per_day: 120.000, countered_revenue_share_pct: 0.3000, comment: "Opportunistic counter by a third party" }
              as: DairyPartner
              as_user_id: "${dairy2_id}"
              captures: { err_counter: "$.data.error_id" }
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "Someone Else" }
              as: DairyPartner
              as_user_id: "${dairy2_id}"
              captures: { err_sign: "$.data.error_id" }
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
          assert:
            - "first call HTTP status == 403"
            - "${err_counter} == ERR_NOT_OWNING_DAIRY"
            - "second call HTTP status == 403"
            - "${err_sign} == ERR_NOT_OWNING_DAIRY"
            - "third call HTTP status == 200"
            - "FeedstockAgreement.${agr1_id}.status == ACTIVE"
            - "FeedstockAgreement.${agr1_id}.negotiation_round == 0"
            - "Dairy.${dairy1_id}.status == CONTRACTED"
            - "Dairy.${dairy2_id}.status == PROSPECT"

      - name: rbac_the_approver_of_a_statement_may_not_release_its_payment
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=110]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.RevenueStatement.transitions.APPROVED_to_PAID
        distinguishing_aspect: >
          The bar is on the user id, not the role: u-fin-a holds FinanceController and is
          still refused because it approved the statement, while u-fin-b in the same role
          pays it immediately afterwards.
        test_recipe:
          setup:
            - "Canonical plant with an APPROVED August statement of 2010000 cents approved by u-fin-a."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id", facility_v: "$.data.version" }
            - call: "POST /revenue-statements"
              payload: { facility_id: "${facility_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gas_revenue_cents: 2010000, expected_facility_version: "${facility_v}" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { stmt_id: "$.data.id" }
            - call: "POST /revenue-statements/${stmt_id}/approve"
              payload: { approval_note: "August settlement approved" }
              as: FinanceController
              as_user_id: "u-fin-a"
          trigger:
            - call: "POST /revenue-statements/${stmt_id}/pay"
              payload: { payment_reference: "ACH-2026-08-0001" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { err_sod: "$.data.error_id" }
            - call: "POST /revenue-statements/${stmt_id}/pay"
              payload: { payment_reference: "ACH-2026-08-0002" }
              as: FinanceController
              as_user_id: "u-fin-b"
          assert:
            - "first call HTTP status == 403"
            - "${err_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "second call HTTP status == 200"
            - "RevenueStatement.${stmt_id}.status == PAID"
            - "RevenueStatement.${stmt_id}.approved_by_user_id == u-fin-a"
            - "RevenueStatement.${stmt_id}.payment_reference == ACH-2026-08-0002"
            - "DigesterFacility.${facility_id}.retained_to_date_cents == 1409512"

      - name: rbac_the_user_who_verified_a_batch_may_not_issue_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=110]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.CreditBatch.transitions.VERIFIED_to_ISSUED
        distinguishing_aspect: >
          Segregation follows the identity across roles: u-dual verified the batch wearing
          CreditVerifier and is refused when it puts on ProgramAdministrator to issue,
          even though that role is otherwise entitled to issue.
        test_recipe:
          setup:
            - "Canonical plant with day 2026-08-03 injected in full and an LCFS pathway CERTIFIED over 2026-08-01..2026-08-31."
            - "One August batch VERIFIED by user u-dual."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
