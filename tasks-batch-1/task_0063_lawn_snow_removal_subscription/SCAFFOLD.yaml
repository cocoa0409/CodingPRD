  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, service_zip]
    output: Customer
    side_effects: ["create Customer with wallet_credit_cents = 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- ServiceProperty ----
  - method: POST
    path: "/properties"
    description: "Create a property for a customer"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, address, lawn_area_sqft, zip]
    output: ServiceProperty
    side_effects: []
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: ServiceProperty
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List properties, filterable by owner"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: ServiceProperty[]
    side_effects: []

  # ---- CustomerPreference ----
  - method: POST
    path: "/preferences"
    description: "Set preferences for a property"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [property_id, grass_height_mm, "fertilization_enabled?", "snow_opt_out?"]
    output: CustomerPreference
    side_effects: []
  - method: GET
    path: "/preferences/{id}"
    description: "Fetch a preference record"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: CustomerPreference
    side_effects: []
  - method: GET
    path: "/preferences"
    description: "List preferences, filterable by property"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: CustomerPreference[]
    side_effects: []

  # ---- ServiceContract ----
  - method: POST
    path: "/contracts"
    description: "Create a seasonal contract (DRAFT)"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, property_id, season, contract_price_cents, term_months, "prepaid_deposit_cents?"]
    output: ServiceContract
    side_effects: ["create ServiceContract in DRAFT with accrued_balance_cents = 0"]
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts, filterable by owner or property"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: ["customer_id?", "property_id?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT or reactivate a SUSPENDED contract"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> ACTIVE", "DRAFT->ACTIVE sets accrued_balance_cents = contract_price_cents", "SUSPENDED->ACTIVE re-activates RouteStops for the property", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/suspend"
    description: "Suspend an ACTIVE contract"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> SUSPENDED", "CASCADE: RouteStops for the property flip active=false", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/close-season"
    description: "Close out the season; finalizes billing into a SeasonInvoice"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> CLOSED", "CASCADE: create SeasonInvoice (final_season_invoice)", "CASCADE: SeasonInvoice debits Customer.wallet_credit_cents", "increments ServiceContract.version by 1"]
  - method: GET
    path: "/contracts/{id}/invoices"
    description: "List SeasonInvoices for a contract (reverse-reachability for SeasonInvoice.contract_id)"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: SeasonInvoice[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}/visits"
    description: "List ServiceVisits for a contract (reverse-reachability for ServiceVisit.contract_id)"
    roles: [PlatformAdmin, Customer, DispatchManager, CrewLead]
    code: 200
    input: []
    output: ServiceVisit[]
    side_effects: []

  # ---- ServiceRoute ----
  - method: POST
    path: "/routes"
    description: "Create a service route"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [region_zip, daily_capacity_minutes]
    output: ServiceRoute
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []
  - method: POST
    path: "/routes/{id}/reopen"
    description: "Reopen a DISPATCHED route"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: ["status -> OPEN"]
  - method: POST
    path: "/routes/{id}/close"
    description: "Close an OPEN route"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: ["status -> CLOSED"]
  - method: GET
    path: "/routes/{id}/stops"
    description: "List RouteStops on a route (reverse-reachability for RouteStop.route_id)"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/routes/{id}/crews"
    description: "List Crews homed on a route (reverse-reachability for Crew.home_route_id)"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: Crew[]
    side_effects: []
  - method: GET
    path: "/routes/{id}/equipment"
    description: "List Equipment assigned to a route (reverse-reachability for Equipment.assigned_route_id)"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: Equipment[]
    side_effects: []

  # ---- RouteStop ----
  - method: POST
    path: "/route-stops"
    description: "Add a stop (property) to a route"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [route_id, property_id, sequence, base_service_minutes, "travel_minutes?"]
    output: RouteStop
    side_effects: ["create RouteStop with active = true"]
  - method: GET
    path: "/route-stops/{id}"
    description: "Fetch a route stop"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List route stops, filterable by property"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create a crew homed on a route"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [name, home_route_id]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- Equipment ----
  - method: POST
    path: "/equipment"
    description: "Register an equipment asset"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [asset_tag, equipment_type, age_months, "assigned_route_id?"]
    output: Equipment
    side_effects: ["create Equipment in IDLE with wear_score = 0"]
  - method: GET
    path: "/equipment/{id}"
    description: "Fetch an equipment asset"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  - method: GET
    path: "/equipment"
    description: "List equipment, filterable by assigned route"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: ["assigned_route_id?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: POST
    path: "/equipment/{id}/rotate"
    description: "Rotate equipment onto a different route (OCC-guarded)"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: [assigned_route_id, expected_equipment_version]
    output: Equipment
    side_effects: ["set assigned_route_id", "recompute wear_score", "increments Equipment.version by 1"]
  - method: POST
    path: "/equipment/{id}/start-maintenance"
    description: "Begin maintenance on a MAINTENANCE_DUE asset"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status -> UNDER_MAINTENANCE"]
  - method: POST
    path: "/equipment/{id}/complete-maintenance"
    description: "Finish maintenance; reset wear baseline"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status -> IDLE", "runtime_at_last_service_hours = cumulative_runtime_hours", "dispatch_count_since_service = 0", "recompute wear_score"]
  - method: GET
    path: "/equipment/{id}/wear-estimate"
    description: "Computed read: estimated post-completion wear for the equipment's in-flight DISPATCHED visit"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: []
    output: "{ equipment_id: string, estimated_wear_score: integer, actual_wear_score: integer }"
    side_effects: []

  # ---- WeatherReading ----
  - method: POST
    path: "/weather-readings"
    description: "Record a weather observation"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [region_zip, snow_depth_in, observed_at]
    output: WeatherReading
    side_effects: ["create WeatherReading with processed = false"]
  - method: GET
    path: "/weather-readings/{id}"
    description: "Fetch a weather reading"
    roles: [PlatformAdmin, DispatchManager]
    code: 200
    input: []
    output: WeatherReading
    side_effects: []
  - method: POST
    path: "/weather-readings/{id}/process"
    description: "Evaluate a reading for snow auto-dispatch across matching routes"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: [route_id]
    output: ServiceRoute
    side_effects: ["if snow_depth_in > 2.0 and route OPEN: compute route_dispatch_load, fan-out SNOW visits per non-opted-out active stop, mark reading processed, route -> DISPATCHED"]

  # ---- ServiceVisit ----
  - method: POST
    path: "/visits"
    description: "Schedule a (LAWN/FERTILIZATION) visit against a contract+stop"
    roles: [PlatformAdmin, DispatchManager]
    code: 201
    input: [contract_id, route_stop_id, service_type, "snow_depth_in?", "runtime_hours?"]
    output: ServiceVisit
    side_effects: ["create ServiceVisit in SCHEDULED"]
  - method: GET
    path: "/visits/{id}"
    description: "Fetch a visit"
    roles: [PlatformAdmin, DispatchManager, CrewLead, Customer]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List visits, filterable by route stop or equipment (reverse-reachability for ServiceVisit.route_stop_id and ServiceVisit.equipment_id)"
    roles: [PlatformAdmin, DispatchManager, CrewLead]
    code: 200
    input: ["route_stop_id?", "equipment_id?", "contract_id?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/dispatch"
    description: "Manually dispatch a SCHEDULED visit (selects equipment by lowest wear_score)"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status -> DISPATCHED", "select & assign Equipment (lowest wear_score, tie-break created_at ASC)", "Equipment -> IN_SERVICE", "Crew -> ON_DISPATCH"]
  - method: POST
    path: "/visits/{id}/complete"
    description: "Complete a DISPATCHED visit"
    roles: [CrewLead, PlatformAdmin]
    code: 200
    input: ["runtime_hours?"]
    output: ServiceVisit
    side_effects: ["compute surcharge_cents (visit_surcharge)", "status -> COMPLETED", "Equipment cumulative_runtime_hours/dispatch_count incremented, wear recompute, status flip", "ServiceContract.accrued_balance_cents += surcharge_cents"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a SCHEDULED visit"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status -> CANCELLED"]

  # ---- SkipRequest ----
  - method: POST
    path: "/skip-requests"
    description: "Customer requests to skip a scheduled visit"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [visit_id, reason]
    output: SkipRequest
    side_effects: ["create SkipRequest in PENDING"]
  - method: GET
    path: "/skip-requests/{id}"
    description: "Fetch a skip request"
    roles: [PlatformAdmin, DispatchManager, Customer]
    code: 200
    input: []
    output: SkipRequest
    side_effects: []
  - method: GET
    path: "/skip-requests"
    description: "List skip requests, filterable by visit"
    roles: [PlatformAdmin, DispatchManager, Customer]
    code: 200
    input: ["visit_id?", "limit?", "offset?"]
    output: SkipRequest[]
    side_effects: []
  - method: POST
    path: "/skip-requests/{id}/approve"
    description: "Approve a PENDING skip; grants credit and skips the visit"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: SkipRequest
    side_effects: ["SkipRequest -> APPROVED", "compute credit_cents (skip_credit)", "ServiceVisit -> SKIPPED", "Customer.wallet_credit_cents += credit_cents", "ServiceContract.accrued_balance_cents -= credit_cents"]
  - method: POST
    path: "/skip-requests/{id}/reject"
    description: "Reject a PENDING skip"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: SkipRequest
    side_effects: ["SkipRequest -> REJECTED"]

  # ---- SeasonInvoice ----
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch a season invoice"
    roles: [PlatformAdmin, Customer, DispatchManager]
    code: 200
    input: []
    output: SeasonInvoice
    side_effects: []

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer acting on a resource they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing/malformed field, illegal enum, or numeric range violation (e.g. grass_height_mm out of 20..120)"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Customer.email or Equipment.asset_tag already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_PROPERTY_MISMATCH
    http: 409
    condition: "route stop / visit references a property inconsistent with the route or contract"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "dispatch attempted while the owning contract is not ACTIVE"
  - id: ERR_NO_EQUIPMENT_AVAILABLE
    http: 409
    condition: "no Equipment on the route with status IN {IDLE, IN_SERVICE} to dispatch"
  - id: ERR_EQUIPMENT_NOT_READY
    http: 409
    condition: "completing a visit whose selected equipment is no longer IN_SERVICE"
  - id: ERR_READING_ALREADY_PROCESSED
    http: 409
    condition: "weather reading already processed for dispatch"
  - id: ERR_SNOW_THRESHOLD_NOT_MET
    http: 409
    condition: "weather process invoked but snow_depth_in <= 2.0"
  - id: ERR_OPEN_DISPATCH_EXISTS
    http: 409
    condition: "close-season attempted while a visit on the contract is DISPATCHED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_equipment_version does not match current Equipment.version on rotate"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "snow_depth_in or runtime_hours negative, or other numeric field below its declared floor"
  - id: ERR_NO_SKIPPABLE_VISIT
    http: 409
    condition: "skip request created against a visit not in SCHEDULED state"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser; can perform any operation for setup and override"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "all property/preference/contract/route/stop/crew/equipment/weather/visit/skip operations"
  - name: Customer
    description: "End customer; owns their properties, preferences, contracts, and skip requests"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /skip-requests"
      - "POST /contracts/{id}/activate"
    shared_operations:
      - "POST /properties"
      - "POST /preferences"
      - "POST /contracts"
      - "GET own contracts/properties/preferences/visits/invoices/skip-requests"
  - name: DispatchManager
    description: "Operations dispatcher; owns routes, weather processing, dispatch, skip approval, suspension and season close"
    identity: "opaque"
    exclusive_operations:
      - "POST /weather-readings/{id}/process"
      - "POST /contracts/{id}/suspend"
      - "POST /contracts/{id}/close-season"
      - "POST /skip-requests/{id}/approve"
      - "POST /skip-requests/{id}/reject"
      - "POST /visits/{id}/dispatch"
      - "POST /visits/{id}/cancel"
      - "POST /equipment/{id}/rotate"
      - "POST /routes/{id}/reopen"
      - "POST /routes/{id}/close"
    shared_operations:
      - "POST /routes, POST /route-stops, POST /crews, POST /equipment, POST /weather-readings, POST /visits"
      - "GET read endpoints"
  - name: CrewLead
    description: "Field crew lead; completes dispatched visits"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /visits/{id}/complete"
    shared_operations:
      - "GET routes/stops/crews/equipment/visits"
