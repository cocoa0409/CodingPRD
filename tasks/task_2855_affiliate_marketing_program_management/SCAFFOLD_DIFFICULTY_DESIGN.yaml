  - rule_id: cross_entity_state_dependency
    instances:

      - name: application_decide_blocked_by_applicant_affiliate_state
        grounds:
          - validations.priority_27_ERR_AFFILIATE_NOT_ELIGIBLE
          - state_machines.AffiliateApplication.SCREENED_to_APPROVED
          - state_machines.Affiliate.PENDING_APPLICATION_to_SUSPENDED
        distinguishing_aspect: >-
          The application itself is in a perfectly legal SCREENED/PASS state and the
          OCC token is fresh, yet the decide is refused purely because a DIFFERENT
          entity — the applicant Affiliate — was moved to SUSPENDED between screening
          and decision, so the guard lives on the parent Affiliate.status, not on the
          AffiliateApplication.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Network."
            - "One Affiliate in PENDING_APPLICATION with a SCREENED AffiliateApplication whose screening_outcome is PASS (site_quality_score 87.8, brand_suitability_score 100.0)."
            - "A ComplianceAnalyst then suspends the applicant, which is legal from PENDING_APPLICATION and bumps Affiliate.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /affiliates"
              payload: { legal_name: "Blocked Media Ltd", contact_email: "blk@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: $.data.id }
            - call: "POST /affiliates/${aff_id}/applications"
              payload: { site_url: "https://blocked.example", primary_traffic_source: "ORGANIC_SEARCH", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_id: $.data.id }
            - call: "POST /affiliate-applications/${app_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { app_v2: $.data.version }
            - call: "POST /affiliates/${aff_id}/status-change"
              payload: { target_status: "SUSPENDED", reason: "MANUAL_COMPLIANCE_ACTION" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { aff_v_after_suspend: $.data.version }
          trigger:
            - call: "POST /affiliate-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "looks good", expected_affiliate_version: "${aff_v_after_suspend}" }
              as: PartnerManager
              as_user_id: "pm-001"
          assert:
            - "before the trigger, AffiliateApplication.${app_id}.review_state == \"SCREENED\", screening_outcome == \"PASS\", site_quality_score == 87.8 and brand_suitability_score == 100.0"
            - "before the trigger, Affiliate.${aff_id}.status == \"SUSPENDED\""
            - "the response status is 409 and error_id == \"ERR_AFFILIATE_NOT_ELIGIBLE\""
            - "the response error_id != \"ERR_STALE_AFFILIATE_VERSION\" — the supplied version is correct, so the concurrency rule at priority 29 must not fire"
            - "AffiliateApplication.${app_id}.review_state is still \"SCREENED\", decided_by_user_id is null and version == ${app_v2}"
            - "Affiliate.${aff_id}.status is still \"SUSPENDED\""

      - name: payout_line_held_by_affiliate_tax_document_state_at_validation
        grounds:
          - state_machines.PayoutLine.INCLUDED_to_HELD_TAX_DOC
          - entities.Affiliate.fields.tax_document_status
          - state_machines.TaxDocument
          - calculations.payout_line_settlement
          - calculations.network_fee_reconciliation
        distinguishing_aspect: >-
          Two lines that are arithmetically identical at generation diverge at
          validation solely on the state of a third entity: partner A's TaxDocument is
          VALID so its line stays INCLUDED at net 4000, while partner B's is still
          PENDING so its line drops to HELD_TAX_DOC — and the batch still reconciles
          as MATCHED because gross_commission_cents counts both lines while
          net_payable_cents counts only A's.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z."
            - "One Network with fee_bps 0 and flat_fee_cents 0."
            - "Partner A: ACTIVE CONTENT with a VERIFIED W9 (status VALID, treaty_withholding_bps 0)."
            - "Partner B: ACTIVE CONTENT with a filed but unverified W8BEN (status PENDING)."
            - "Each partner holds one VALIDATED Conversion of 100000 cents at 400 bps, payable 4000."
            - "One DRAFT PayoutBatch generated over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), with both lines INCLUDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
