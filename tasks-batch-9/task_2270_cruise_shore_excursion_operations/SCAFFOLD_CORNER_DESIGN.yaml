  - section: calculations
    instances:

      - name: booking_quote_walks_all_five_steps_on_a_premium_precruise_party_of_two
        claim_type: correct_result
        grounds:
          - calculations.booking_price_quote
          - entities.Booking.fields.per_guest_price_cents
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.service_fee_cents
          - entities.Booking.fields.charge_total_cents
        distinguishing_aspect: |
          The PREMIUM 11500 bps multiplier, the -500 bps pre-cruise reduction earned at 45 days
          out, a zero discount for a NONE-tier party of 2 and the 300 bps fee compose to 13110 per
          guest, 26220 quoted, 787 fee and 27007 charged.
        test_recipe:
          setup:
            - "Cozumel world with a PREMIUM excursion at base_price_cents 12000 and one SELLING departure meeting 2026-09-15T09:00:00Z."
            - "The clock stands at 2026-08-01T00:00:00Z, which is 45 whole days out."
            - "One NONE-tier guest exists and the departure version has been read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
