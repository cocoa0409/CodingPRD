            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_l_id}", expected_study_version: "${study_l_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_l_id: "$.data.id", analysis_l_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_l_id}", expected_coverage_analysis_version: "${analysis_l_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_l_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_l_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_l_id}", source_analysis_id: "${analysis_l_id}" }
              as: CoverageAnalyst
