            - "required 10 against remaining 10 succeeds with 201 (>= is inclusive) and remaining_sample_ng becomes 0"
            - "testing_status == SAMPLE_EXHAUSTED (0 < MIN_TESTABLE_NG 5) after the equality reservation"

