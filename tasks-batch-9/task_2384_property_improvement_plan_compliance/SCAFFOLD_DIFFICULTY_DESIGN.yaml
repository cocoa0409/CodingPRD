              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/capital-budgets/${budget1_id}/lock"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/items/${item1_id}/start"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
