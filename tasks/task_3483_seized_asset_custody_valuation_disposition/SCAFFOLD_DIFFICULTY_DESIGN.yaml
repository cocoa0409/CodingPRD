  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: isr_requires_asset_valued
        grounds:
          - state_machines.InterlocutorySaleRequest
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "InterlocutorySaleRequest x Asset pair: the same ISR payload is rejected while the asset's legal_state is VALUATION_PENDING (valuation submitted but not adjudicated) and accepted the moment adjudication flips it to VALUED — the ISR machine's valid from-states are a function of a different entity's state."
