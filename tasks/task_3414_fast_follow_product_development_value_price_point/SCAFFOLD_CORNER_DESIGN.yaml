          assert:
            - "the second accept returns 409 and err_idem == ERR_INVALID_STATE"
            - "CostQuote.${quote_id} remains ACCEPTED with pinned_formula_version == 1 and accepted_at unchanged (2026-09-01T00:00:00Z)"

      - name: quote_settle_requires_launched_product
        claim_type: Precondition Enforcement
        grounds:
