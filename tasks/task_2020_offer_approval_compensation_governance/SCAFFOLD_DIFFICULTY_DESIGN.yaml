            - "events include CHECK_TRANSITIONED (FAILED), RESCINDED, CHECK_CANCELLED, PERK_VOIDED in that relative order"

      - name: hire_headcount_autoclose_withdrawal_chain
        grounds:
          - state_machines.Offer.ACCEPTED_to_HIRED
          - calculations.headcount_filled
          - state_machines.Requisition.OPEN_to_CLOSED
          - state_machines.Offer.PENDING_APPROVAL_to_WITHDRAWN
