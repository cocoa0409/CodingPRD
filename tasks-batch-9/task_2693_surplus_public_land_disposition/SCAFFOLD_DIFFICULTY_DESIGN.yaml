            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 80000000, terms_summary: "Opening position at appraised value less curative." }
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "PREFERENCE_ENTITY", price_offered_cents: 60000000, terms_summary: "Counter at 60,000,000 citing the statutory write-down.", responded_to_round_number: 1 }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 70000000, terms_summary: "Second agency position.", responded_to_round_number: 2 }
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "PREFERENCE_ENTITY", price_offered_cents: 62000000, terms_summary: "Counter at 62,000,000.", responded_to_round_number: 3 }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 66000000, terms_summary: "Final agency position inside the near band.", responded_to_round_number: 4 }
              as: RealPropertyOfficer
            - call: "POST /declarations/${decl_id}/close-preference-window"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/conclude"
              payload: { outcome: "IMPASSE" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/good-faith-review"
              payload: {}
              as: ComplianceMonitor
            - call: "POST /preference-offers/${offer_id}/good-faith-determination"
              payload: { remediation_note: "Four rounds, two timely, final position inside the near band." }
              as: ComplianceMonitor
            - call: "POST /declarations/${decl_id}/authorize-disposition"
              payload: { disposition_type: "COMPETITIVE_SALE" }
              as: BoardClerk
              as_user_id: "clerk-authorize-1"
            - call: "GET /declarations/${decl_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { decl_v: "$.data.version" }
          trigger:
            - call: "POST /offerings"
              payload: { declaration_id: "${decl_id}", offering_type: "COMPETITIVE_SALE", bid_open_at: "2026-12-01T00:00:00Z", bid_close_at: "2026-12-31T00:00:00Z", expected_declaration_version: "${decl_v}" }
              as: RealPropertyOfficer
              captures: { offering_id: "$.data.id" }
          assert:
            - "PreferenceOffer.${offer_id}.ah_minimum_price_cents == 64750000"
            - "PreferenceOffer.${offer_id}.preference_category == AFFORDABLE_HOUSING"
            - "DispositionOffering.${offering_id}.minimum_price_cents == 99750000"
            - "DispositionOffering.${offering_id}.minimum_price_variant == MARKET_FLOOR"
            - "DispositionOffering.${offering_id}.minimum_price_cents - PreferenceOffer.${offer_id}.ah_minimum_price_cents == 35000000"
            - "PreferenceOffer.${offer_id}.ah_minimum_price_cents < Parcel.${parcel_id}.book_value_cents, i.e. 64750000 < 70000000"
            - "DispositionOffering.${offering_id}.minimum_price_cents > Parcel.${parcel_id}.book_value_cents, i.e. 99750000 > 70000000"
            - "DispositionOffering.${offering_id}.required_deposit_cents == 4987500"
      - name: good_faith_interim_score_below_pass_while_final_clears
        grounds:
          - calculations.good_faith_compliance_score
          - entities.PreferenceOffer.fields.interim_good_faith_score
          - entities.PreferenceOffer.fields.final_good_faith_score
          - state_machines.PreferenceOffer.UNDER_REVIEW_to_SATISFIED
          - validations[priority=36]
        distinguishing_aspect: |
          Subject domain is negotiation-conduct compliance, not valuation: the
          identical NegotiationRound history (3 CUSTODIAN_AGENCY rounds, 2 of them
          timely, latest officer price 66000000) yields
          interim_good_faith_score == 65 under the INTERIM variant, which is BELOW
          GOOD_FAITH_PASS_SCORE 70, and final_good_faith_score == 90 under the
          FINAL variant, which clears it, so the same data drives
