      - name: warranty_credit_waterfall_fills_parts_then_labor_and_forfeits_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.warranty_credit_waterfall
          - calculations.warranty_credit_waterfall.constants
          - entities.WarrantyClaim.warranty_credit_cents
          - entities.WarrantyClaim.claim_unit_standard_cost_cents
        distinguishing_aspect: |
          Two claims against the same shipped unit adjudicate the waterfall at two service ages.
          At 6 months the ceiling (149922) is smaller than the sum of the caps, so parts fill to
          their own 60% cap (117586), labour takes only what remains of the ceiling (32336 — NOT
          its own 45000 cap) and freight receives nothing at all: the claimed 20000 of freight is
          FORFEITED, never redistributed back into parts. At exactly PRO_RATA_MONTHS the factor is
          0, so a DEFECT_CONFIRMED claim yields a credit of exactly 0 — the adjudication and the
          credit are independent outputs.
