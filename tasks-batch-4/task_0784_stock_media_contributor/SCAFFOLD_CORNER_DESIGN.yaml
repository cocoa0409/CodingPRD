scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: corner_create_contributor_returns_201_defaults
        claim_type: Creation
        grounds: [entities.Contributor, endpoints]
        distinguishing_aspect: "POST /contributors with display_name+country_code -> 201; onboarding_status=PENDING, tax_form_status=MISSING, royalty_level=BRONZE, exclusivity=NON_EXCLUSIVE, all balances/counters 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contributors"
              payload: { display_name: "Zoe", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
          assert:
            - "response code == 201"
            - "Contributor.${c_id}.onboarding_status == PENDING"
            - "Contributor.${c_id}.tax_form_status == MISSING"
            - "Contributor.${c_id}.royalty_level == BRONZE"
            - "Contributor.${c_id}.exclusivity == NON_EXCLUSIVE"
            - "Contributor.${c_id}.lifetime_earnings_cents == 0 and available_balance_cents == 0 and accepted_asset_count == 0 and strike_count == 0"
            - "Contributor.${c_id}.version == 1"

      - name: corner_get_contributor_not_found
        claim_type: Not Found
        grounds: ["entities.Contributor", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /contributors/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contributors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "trigger error_id == ERR_NOT_FOUND"

      - name: corner_create_asset_missing_required_title
        claim_type: Required Fields
        grounds: ["entities.Asset.fields.title", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /assets omitting title -> ERR_VALIDATION (422); title has source input and no default."
        test_recipe:
          setup: ["One contributor exists."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Al", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "trigger error_id == ERR_VALIDATION"

      - name: corner_create_asset_invalid_media_type_enum
        claim_type: Type Constraints
        grounds: ["entities.Asset.fields.media_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /assets with media_type not in {PHOTO,VIDEO,VECTOR} -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["One contributor exists."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Be", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "GIF", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_VALIDATION"

      - name: corner_license_tier_duplicate_code
        claim_type: Type Constraints
        grounds: ["entities.LicenseTier.fields.code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A second POST /license-tiers with an already-used code -> ERR_VALIDATION (422); code is unique."
        test_recipe:
          setup: ["LicenseTier STANDARD already created."]
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
          trigger:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 2000 }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_VALIDATION"

      - name: corner_asset_id_and_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Asset]
        distinguishing_aspect: "id, created_at, updated_at, version are server-minted on POST /assets; client-sent values for them are ignored."
        test_recipe:
          setup: ["One contributor exists."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Ce", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id, a_ver: $.data.version }
          assert:
            - "Asset.${a_id}.version == 1"
            - "Asset.${a_id}.status == DRAFT"
            - "id is a UUID without a type prefix"

      - name: corner_list_contributors_pagination_envelope
        claim_type: Listing
        grounds: [entities.Contributor, endpoints]
        distinguishing_aspect: "GET /contributors returns an array response with pagination meta total_count and has_more."
        test_recipe:
          setup: ["Two contributors exist."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "P1", country_code: "US" }
              as: Contributor
            - call: "POST /contributors"
              payload: { display_name: "P2", country_code: "US" }
              as: Contributor
          trigger:
            - call: "GET /contributors"
              payload: { limit: 1, offset: 0 }
              as: FinanceAdmin
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == true (limit 1 of 2)"

      - name: corner_download_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Download.fields.royalty_amount_cents, entities.Download.fields.sale_price_cents]
        distinguishing_aspect: "sale_price_cents, royalty_rate_snapshot_pct, royalty_amount_cents, available_at are computed; POST /downloads accepts only asset_id/license_tier_code/buyer_reference."
        test_recipe:
          setup: ["Contributor ACTIVE non-exclusive BRONZE; STANDARD tier (1000); one ACCEPTED asset."]
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Do", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-1" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
          trigger:
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "b1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
          assert:
            - "Download.${dl_id}.sale_price_cents == 1000"
            - "Download.${dl_id}.royalty_rate_snapshot_pct == 0.15"
            - "Download.${dl_id}.royalty_amount_cents == 150"
            - "Download.${dl_id}.earning_status == PENDING"

      - name: corner_royalty_level_boundary_24999_vs_25000
        claim_type: Computed Fields
        grounds: [calculations.contributor_royalty_level, entities.Contributor.fields.royalty_level]
        distinguishing_aspect: "lifetime 24999 -> BRONZE, exactly 25000 -> SILVER (inclusive lower bound), via POST /contributors/{id}/earning-adjustments."
        test_recipe:
          setup: ["Contributor X: +24999 adjustment; contributor Y: +25000 adjustment."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "X", country_code: "US" }
              as: Contributor
              captures: { cX: $.data.id }
            - call: "POST /contributors/${cX}/earning-adjustments"
              payload: { amount_cents: 24999, reason: "s" }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Y", country_code: "US" }
              as: Contributor
              captures: { cY: $.data.id }
            - call: "POST /contributors/${cY}/earning-adjustments"
              payload: { amount_cents: 25000, reason: "s" }
              as: FinanceAdmin
          trigger:
            - call: "GET /contributors/${cX}"
              payload: {}
              as: FinanceAdmin
            - call: "GET /contributors/${cY}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Contributor.${cX}.royalty_level == BRONZE (24999 < 25000)"
            - "Contributor.${cY}.royalty_level == SILVER (25000 >= 25000)"

      - name: corner_asset_review_immutable_no_version
        claim_type: Immutability
        grounds: [entities.AssetReview]
        distinguishing_aspect: "AssetReview has common_fields:false — it exposes id and created_at only, no version field, and no update endpoint exists."
        test_recipe:
          setup: ["An AssetReview was created by accepting an asset."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Im", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-2" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
              captures: { rev_asset: $.data.asset_id }
          trigger:
            - call: "GET /reviews"
              payload: { asset_id: "${a_id}" }
              as: Reviewer
          assert:
            - "the returned AssetReview carries id and created_at but no version field"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_claim_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Asset.SUBMITTED_to_IN_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /assets/{id}/claim on a DRAFT (un-submitted) asset -> ERR_INVALID_STATE; claim requires SUBMITTED."
        test_recipe:
          setup: ["One asset in DRAFT."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Da", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"

      - name: corner_taken_down_asset_is_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Asset, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A TAKEN_DOWN asset accepts no further transitions; POST /assets/{id}/submit on it -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["One asset ACCEPTED then TAKEN_DOWN via an upheld takedown."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Te", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-3" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "COPYRIGHT", claimant_name: "C" }
              as: ComplianceOfficer
              captures: { td_id: $.data.id }
            - call: "POST /takedowns/${td_id}/decision"
              payload: { decision: "UPHOLD" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Asset.${a_id}.status == TAKEN_DOWN"
            - "trigger error_id == ERR_INVALID_STATE"

      - name: corner_takedown_dismiss_leaves_asset_accepted
        claim_type: Valid Transition
        grounds: [state_machines.TakedownRequest.OPEN_to_DISMISSED]
        distinguishing_aspect: "DISMISS on an OPEN takedown -> DISMISSED with resolution_note; the asset stays ACCEPTED and no cascade fires."
        test_recipe:
          setup: ["One ACCEPTED asset with an OPEN takedown."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Di", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-4" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "PRIVACY", claimant_name: "C" }
              as: ComplianceOfficer
              captures: { td_id: $.data.id }
          trigger:
            - call: "POST /takedowns/${td_id}/decision"
              payload: { decision: "DISMISS", resolution_note: "no merit" }
              as: ComplianceOfficer
          assert:
            - "TakedownRequest.${td_id}.status == DISMISSED"
            - "Asset.${a_id}.status == ACCEPTED"
            - "Contributor.${c_id}.accepted_asset_count == 1 and strike_count == 0"

      - name: corner_submit_requires_release_without_release_id
        claim_type: Precondition Enforcement
        grounds: [state_machines.Asset.DRAFT_to_SUBMITTED, "errors[ERR_RELEASE_REQUIRED]"]
        distinguishing_aspect: "Submitting an asset with requires_release=true but model_release_id null -> ERR_RELEASE_REQUIRED (422)."
        test_recipe:
          setup: ["One DRAFT asset with requires_release=true and no model_release_id."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Su", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: true }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_RELEASE_REQUIRED"

      - name: corner_reject_without_reason
        claim_type: Precondition Enforcement
        grounds: [state_machines.Asset.IN_REVIEW_to_REJECTED, "errors[ERR_MISSING_REJECT_REASON]"]
        distinguishing_aspect: "REJECT decision on POST /assets/{id}/reviews without reject_reason -> ERR_MISSING_REJECT_REASON (422)."
        test_recipe:
          setup: ["One asset IN_REVIEW."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Rj", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
          trigger:
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "REJECT" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_MISSING_REJECT_REASON"

      - name: corner_similar_reject_without_target
        claim_type: Precondition Enforcement
        grounds: [state_machines.Asset.IN_REVIEW_to_REJECTED, "errors[ERR_MISSING_SIMILAR_TARGET]"]
        distinguishing_aspect: "REJECT with reject_reason=SIMILAR but no similar_to_asset_id -> ERR_MISSING_SIMILAR_TARGET (422)."
        test_recipe:
          setup: ["One asset IN_REVIEW."]
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Si", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
          trigger:
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "REJECT", reject_reason: "SIMILAR" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_MISSING_SIMILAR_TARGET"

      - name: corner_settle_before_clearing_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Download.PENDING_to_AVAILABLE, "errors[ERR_NOT_YET_CLEARED]"]
        distinguishing_aspect: "settle while the logical clock is still before download.available_at (default 2026-03-01, available_at 2026-03-31) -> ERR_NOT_YET_CLEARED (409)."
        test_recipe:
          setup: ["Contributor ACTIVE; STANDARD tier; ACCEPTED asset; one PENDING download at default clock; clock NOT advanced."]
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Cl", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-5" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "b1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
          trigger:
            - call: "POST /downloads/${dl_id}/settle"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_NOT_YET_CLEARED"

      - name: corner_asset_reject_similar_invalid_state_stub
        claim_type: Invalid Transitions
        grounds: [state_machines.Asset.IN_REVIEW_to_REJECTED]
        excluded_because:
          difficulty_instance: boundary_precision_check / similar_distance_5_vs_6
          rationale: "The valid SIMILAR reject (distance 5) and the over-threshold rejection are both asserted by the named §1.8 boundary instance."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: corner_withholding_domestic_w9_zero
        claim_type: Variant Selection
        grounds: [calculations.payout_withholding, entities.TaxForm.fields.form_type]
        distinguishing_aspect: "domestic_w9 variant: a VERIFIED W9 contributor pays 0 withholding, so net == gross on payout."
        test_recipe:
          setup: ["US/W9 ACTIVE contributor with a +10000 adjustment (available 10000)."]
          setup_api_calls:
            - call: "POST /contributors"
