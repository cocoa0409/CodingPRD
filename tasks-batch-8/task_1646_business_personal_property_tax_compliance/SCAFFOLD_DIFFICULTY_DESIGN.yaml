    instances:
      - name: filing_deadline_equality_is_on_time
        grounds:
          - calculations.late_filing_penalty
          - validations[priority=16]
        distinguishing_aspect: |
          Date-equality boundary on the file endpoint: filing exactly ON
          deadline_date (2027-04-15) is on time ('>' semantics, late_days == 0,
          penalty 0); filing one day later (2027-04-16) is late with months ==
          ceil(1/30) == 1 and penalty 12000 on a 600000 rendition — the
          boundary sits between the two dates, not at deadline+1 vs +2.
