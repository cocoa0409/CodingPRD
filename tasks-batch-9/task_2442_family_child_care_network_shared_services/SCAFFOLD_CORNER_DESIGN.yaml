          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /fccn/membership-agreements/{id}/execute is a Provider exclusive operation, so a FiscalOfficer call returns ERR_FORBIDDEN_ROLE at HTTP 403 and the agreement stays SENT — the role gate at priority 3 fires before any agreement-state logic."
        test_recipe:
          setup:
