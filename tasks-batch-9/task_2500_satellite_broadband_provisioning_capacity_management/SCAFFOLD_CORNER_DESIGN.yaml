              captures: { beam_id: "$.data.id", beam_v1: "$.data.version" }
          trigger:
            - call: "POST /satellite-broadband/beams/${beam_id}/capacity-policy"
              payload: { oversubscription_limit: 5.0, deprioritization_grace_gb: 10, expected_beam_version: "${beam_v1}" }
              as: NetworkOpsEngineer
              captures: { v_after_first: "$.data.version" }
            - call: "POST /satellite-broadband/beams/${beam_id}/capacity-policy"
              payload: { oversubscription_limit: 6.0, deprioritization_grace_gb: 20, expected_beam_version: "${beam_v1}" }
              as: NetworkOpsEngineer
              captures: { err1: "$.data.error_id" }
          assert:
            - "first trigger response HTTP status == 200 and data.oversubscription_limit == 5.0 and data.deprioritization_grace_gb == 10"
            - "${v_after_first} == ${beam_v1} + 1"
            - "second trigger response HTTP status == 412 and data.error_id == ERR_STALE_BEAM_VERSION"
            - "Beam.${beam_id}.oversubscription_limit == 5.0 and deprioritization_grace_gb == 10 (the refused write changed nothing)"
            - "Beam.${beam_id}.version == ${v_after_first} (a refused OCC write does not bump the counter)"

      - name: beam_version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.Beam.fields.version
          - 'endpoints["POST /satellite-broadband/beams/{id}/capacity-policy"]'
          - 'endpoints["POST /satellite-broadband/subscriptions"]'
          - 'endpoints["GET /satellite-broadband/beams/{id}"]'
        distinguishing_aspect: "Four consecutive writes of two different kinds (two policy writes and one activation) each bump Beam.version by exactly one, and the reads interleaved between them leave it untouched — so the OCC token is a write counter, not a request counter."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (1000 Mbps) freshly created, cell CELL-001 (max 1), plan PLAN-P1-200, subscriber sub1 with a RESERVED order and an INSTALLED terminal."
