          assert:
            - "the response carries exactly 1 row with total_count == 1"
            - "${got} == ${study}, ${got_plan} == ${plan} and ${got_site} == ${site}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: study_plan_submit_moves_to_under_agency_review
        claim_type: valid_transition
        grounds:
          - state_machines.StudyPlan.DRAFT_to_UNDER_AGENCY_REVIEW
          - endpoints["POST /relicensing/study-plans/{study_plan_id}/submit"]
        distinguishing_aspect: "The happy path of the submit transition: status DRAFT -> UNDER_AGENCY_REVIEW, submitted_at stamped from the logical clock and the plan version incremented, with the project stage untouched."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan carrying one attached study."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9015", project_name: "Submit Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id, v1: $.data.version, st0: $.data.status }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Recreation use survey", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
          trigger:
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "ready for review" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { st: $.data.status, sub: $.data.submitted_at, cnt: $.data.attached_study_count }
          assert:
            - "${st0} == DRAFT and ${v1} == 1"
            - "${st} == UNDER_AGENCY_REVIEW and ${sub} == 2026-08-01T00:00:00Z"
            - "${cnt} == 1 and StudyPlan.${plan}.approved_at == null"
            - "RelicensingProject.${proj}.stage == STUDY_PHASE and regulatory_posture == OPEN"

      - name: plan_submit_with_no_attached_studies_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StudyPlan.DRAFT_to_UNDER_AGENCY_REVIEW
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The empty-plan boundary: attached_study_count 0 blocks submission with a 400 and leaves the plan in DRAFT with its version unchanged."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan and no studies attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9016", project_name: "Empty Plan Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "nothing attached" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "StudyPlan.${plan}.status == DRAFT, submitted_at == null and version == ${v1}"

      - name: study_report_before_fieldwork_completed_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ResourceStudy.NOT_SUBMITTED_to_UNDER_REVIEW
          - endpoints["POST /relicensing/studies/{study_id}/report"]
        distinguishing_aspect: "The report transition reads the other state dimension: with fieldwork_status IN_PROGRESS the report is rejected, and the same call succeeds once fieldwork_status is COMPLETED."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a plan submitted into UNDER_AGENCY_REVIEW and one study whose fieldwork has been started but not completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9017", project_name: "Report Order Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
