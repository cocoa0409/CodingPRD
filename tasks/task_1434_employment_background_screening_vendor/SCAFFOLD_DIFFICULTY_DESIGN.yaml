  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_period_half_open_adjacency
        grounds:
          - "validations[priority=6.5]"
          - "errors[ERR_AUDIT_PERIOD_OVERLAP]"
        distinguishing_aspect: |
          Resource = ScreeningVendor, semantics = HALF-OPEN intervals: an
          overlapping period [2026-01-15, 2026-02-15) is rejected, while the
          adjacent period starting exactly at the existing period_end
          (2026-02-01 == end) is ACCEPTED. Adjacency is not a collision here.
        test_recipe:
          setup:
            - "Vendor V with existing audit A covering [2026-01-01T00:00:00Z, 2026-02-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-TO1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", sample_size: 50, mismatches_found: 1 }, as: Auditor }
          trigger:
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z", sample_size: 10, mismatches_found: 0 }, as: Auditor, captures: { err: $.data.error_id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", sample_size: 10, mismatches_found: 0 }, as: Auditor, captures: { a_adj: $.data.id } }
          assert:
            - "overlapping attempt: error_id == ERR_AUDIT_PERIOD_OVERLAP (409)"
            - "adjacent attempt (start == existing end): succeeds 201, audit id captured"
            - "overlap evaluated only against audits of the SAME vendor"

      - name: rescreen_sweep_closed_interval_inclusion
        grounds:
          - calculations.rescreen_sweep
          - state_machines.VendorAccuracyAudit.transitions.DRAFT_to_FINALIZED
          - entities.ScreeningOrder.fields.rescreen_of_order_id
        distinguishing_aspect: |
          Different resource (ScreeningReport delivery instants) and DIFFERENT
          interval semantics from the audit-overlap rule: the sweep window is
          CLOSED — a report delivered exactly at period_start (2026-07-01T00:00:00Z)
          and one at exactly period_end (2026-07-31T23:59:59Z) are both swept,
