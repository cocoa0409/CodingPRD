            - "RiskAssessment.${ra_id}.acuity_points == 6"
            - "RiskAssessment.${ra_id}.comorbidity_points == 13 (12.5 rounded half-up, NOT truncated to 12)"
            - "RiskAssessment.${ra_id}.utilization_points == 11"
            - "RiskAssessment.${ra_id}.social_modifier_points == 8 (7.5 rounded half-up)"
            - "RiskAssessment.${ra_id}.risk_score == 44, never 43"
            - "CareEpisode.${ep1_id}.risk_tier == HIGH and required_visit_complexity == HIGH_COMPLEXITY"

      - name: claim_withhold_tier_keyed_on_post_coinsurance_net
        grounds:
