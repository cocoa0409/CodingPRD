            payload: {}
            as: FinanceBusinessPartner
            as_user_id: "${fin_id}"
          - call: "GET /litigation/matters/${matter_id}"
            payload: {}
            as: LitigationCounsel
            as_user_id: "${counsel_id}"
            captures: { accrued_post: $.data.accrued_to_date_cents }
        assert:
          - "accrued_pre == 0"
          - "accrued_mid == 7000000 (disburse accrues the payment)"
          - "accrued_post == 0 (mark-returned unwinds exactly the same amount; round trip conserves the ledger)"
