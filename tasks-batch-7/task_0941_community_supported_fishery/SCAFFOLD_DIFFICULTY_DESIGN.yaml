          A different entity pair, Trip to Vessel: a PLANNED trip that satisfied every gate at
          creation can no longer be landed once its Vessel walks COMPLIANT -> PROBATION ->
          SUSPENDED, because the landing precondition reads compliance_status on the other
          entity. The trip itself never changed.
