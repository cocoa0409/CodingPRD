  - section: rbac
    instances:
      - name: unauthenticated_and_missing_header_calls_die_before_role_and_state_checks
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.CatastropheDirector.exclusive_operations
        distinguishing_aspect: "Priorities 1 and 2 sit above every other rule, so the auth ladder is observable on ONE endpoint: no headers, X-User-Role without X-User-ID, and an undeclared role string all give 401 ERR_UNAUTHENTICATED, a declared-but-wrong role gives 403 ERR_ROLE_NOT_PERMITTED, and a wrong role aimed at a NON-EXISTENT event with an INVALID enum still gives 403 — not 404 and not 400. Only the director's call mutates anything."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; one DECLARED storm event awaiting its targeting decision (targeting_score is comfortably above the floor of 60)."
            - "No other data is required — the whole ladder is exercised on POST /hail-ops/storm-events/{id}/decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events"
              payload: { name: "Wichita Supercell", region_state_code: "KS", max_hail_size_mm: 55, swath_area_km2: 520, swath_confidence: "GROUND_TRUTHED", vehicle_population_estimate: 40000, competitor_shop_count: 3, first_hail_at: "2026-08-04T21:00:00Z" }
              as: CatastropheDirector
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: "NO_HEADERS (neither X-User-Role nor X-User-ID is sent)"
              captures: { err_no_headers: $.data.error_id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: "CatastropheDirector but X-User-ID is omitted"
              captures: { err_no_user_id: $.data.error_id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: "HailCzar (a role string that is not in §1.7)"
              captures: { err_bad_role: $.data.error_id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: PermitOfficer
              captures: { err_wrong_role: $.data.error_id }
            - call: "POST /hail-ops/storm-events/00000000-0000-4000-8000-000000000000/decision"
              payload: { decision: "TARGETTED" }
              as: PermitOfficer
              captures: { err_role_first: $.data.error_id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: CatastropheDirector
          assert:
            - "call 1 returns 401 with ${err_no_headers} == ERR_UNAUTHENTICATED"
            - "call 2 returns 401 with ${err_no_user_id} == ERR_UNAUTHENTICATED — X-User-ID is mandatory for every role, opaque ones included"
            - "call 3 returns 401 with ${err_bad_role} == ERR_UNAUTHENTICATED because an undeclared role fails the priority-1 check, NOT 403"
            - "call 4 returns 403 with ${err_wrong_role} == ERR_ROLE_NOT_PERMITTED — the decision endpoint is PermitOfficer's only for permits, never for storm events"
            - "call 5 returns 403 with ${err_role_first} == ERR_ROLE_NOT_PERMITTED, not ERR_INVALID_REQUEST (priority 3) and not ERR_STORM_EVENT_NOT_FOUND (priority 4)"
            - "StormEvent.${ev}.status is still DECLARED and its version is unchanged after calls 1-5"
            - "call 6 returns 200 with data.status == TARGETED and data.decision_recorded_at == 2026-08-05T08:00:00Z"
            - "every rejected call returns the two-field error envelope {error_id, message} and no data payload"

