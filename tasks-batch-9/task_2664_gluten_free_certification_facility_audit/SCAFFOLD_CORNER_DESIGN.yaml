      - name: certificate_issuance_while_the_applicant_sits_on_probation_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_41
          - errors.ERR_APPLICANT_POSTURE_BLOCKED
          - calculations.applicant_compliance_posture
          - calculations.open_nc_penalty_points
        distinguishing_aspect: |
          The posture gate is the last substantive gate (priority 41), so every earlier gate is
          satisfied and the block comes purely from the aggregate: six failing lot tests raise
          six MAJOR nonconformances worth 8 points each, driving posture_score_cycle to
          100 - 48 = 52, one band below the WATCH floor of 60. The nonconformances hang off LOT
          TESTS rather than the audit, so the facility keeps its CLOSED_PASS outcome (priority 20
          stays satisfied) and none of them is CRITICAL (priority 21 stays satisfied) - the only
          thing that fires is the posture band.
        test_recipe:
          setup:
            - "The complete pre-issuance path: applicant, facility VALIDATED (no shared equipment, operations NONE), supplier, APPROVED INHERENTLY_GF ingredient, STANDARD product with formula CLEARED, testing plan ACTIVE at threshold_ppm 20, label APPROVED at STANDARD, INITIAL audit CLOSED_PASS by aud-1."
            - "Six SCHEDULED lot tests on that product, lot codes RSL-L1..RSL-L6, each at 30.0 ppm - above the threshold of 20 but not above 2x20, so each is a FAIL of MAJOR severity and raises one OPEN nonconformance worth 8 points."
            - "No certificate has ever been issued, so the cycle window runs from the applicant's created_at and open_nc_penalty_points is 48."
