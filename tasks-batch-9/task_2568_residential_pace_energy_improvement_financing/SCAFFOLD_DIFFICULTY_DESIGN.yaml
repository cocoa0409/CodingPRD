            - call: "POST /pace/financing-agreements"
              payload: { application_id: "${a1}", term_years: 20, apr_bps: 800, expected_application_version: "${a1_v2}" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
              captures: { fa1: $.data.id, financed: $.data.financed_amount_cents }
            - call: "POST /pace/financing-agreements/${fa1}/sign"
              payload: { signature_name: "Ada Ruiz" }
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "GET /pace/properties/${p1}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { committed_signed: $.data.committed_pace_principal_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/completion-certificates"
              payload: { application_id: "${a1}", measure_ids: ["${m_solar}", "${m_hvac}"], certified_cost_cents: 4200000 }
              as: Contractor
              as_user_id: "${c1}"
              captures: { cc1: $.data.id }
            - call: "POST /pace/completion-certificates/${cc1}/sign"
              payload: { homeowner_signature_name: "Ada Ruiz" }
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /pace/financing-agreements/${fa1}/rescind"
              payload: { reason: "Owner reconsidered after reading the disclosure packet" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { fa_status: $.data.status, rescinded_at: $.data.rescinded_at }
            - call: "GET /pace/properties/${p1}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { committed_after: $.data.committed_pace_principal_cents }
            - call: "POST /pace/financing-agreements/${fa1}/rescind"
              payload: { reason: "duplicate submit" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { err_second: $.data.error_id }
          assert:
            - "Baseline: committed_before == 0 and, after signing, committed_signed == 4314500 == FinancingAgreement.${fa1}.financed_amount_cents (the SIGNED status is what pulls the agreement into the rollup)"
            - "Rescission returns 200 with FinancingAgreement.${fa1}.status == RESCINDED and rescinded_at == '2026-08-14T00:00:00Z'"
            - "The invariant closes exactly: committed_after == committed_before == 0, i.e. the -= financed_amount_cents undid the += with no residue and no double-subtraction"
            - "recorded_pace_principal_cents was 0 throughout (no Assessment was ever created), which proves the rollup's two terms are tracked separately rather than the whole field being recomputed from assessments alone"
            - "Collateral compensation 1: Application.${a1}.status == WITHDRAWN (terminal) and its requested_principal_cents is left at 4200000 as a historical record"
            - "Collateral compensation 2: ProjectMeasure.${m_solar}.status == INELIGIBLE and ProjectMeasure.${m_hvac}.status == INELIGIBLE (both were APPROVED before the rescission)"
            - "Collateral compensation 3: CompletionCertificate.${cc1}.status == REJECTED with rejection_reason == 'AGREEMENT_RESCINDED', even though no FundingOfficer ever posted a REJECT decision"
            - "Nothing leaks into the contractor ledger, because no funds moved: Contractor.${c1}.gross_disbursed_cents == 0, clawed_back_total_cents == 0, net_disbursed_cents == 0"
            - "Idempotency guard: err_second == 'ERR_AGREEMENT_STATE_INVALID' (409) and committed_pace_principal_cents is still 0 — a second rescission cannot drive the parcel exposure negative"

      - name: reversal_conserves_contractor_gross_and_clawback_ledger
        grounds:
          - state_machines.Disbursement.RELEASED_to_REVERSED
          - entities.Contractor.fields.net_disbursed_cents
          - entities.Contractor.fields.gross_disbursed_cents
          - errors[ERR_NO_RECOURSE_BASIS]
        distinguishing_aspect: |
          A different conserved quantity with the OPPOSITE symmetry to the rescission pair: the
          contractor ledger identity net = gross - clawed_back must hold while gross is deliberately
          NEVER rewound, so a clawback drives net to 0 with gross still 4200000. The homeowner side is
          explicitly not compensated (the Application stays FUNDED), which is the mirror image of the
          rescission case where the homeowner side is fully unwound. An implementation that treats
          reversal as "undo the release" (decrementing gross, or reverting the application) fails.
