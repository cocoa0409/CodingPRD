      - name: existence_before_state_on_usage
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A usage logged against a nonexistent bike id fails existence (ERR_NOT_FOUND, priority 4) even though the request would also fail the bike-state check — path ids resolve left-to-right before any state rule."
        test_recipe:
          setup: ["one part at version 1; no bikes"]
          setup_api_calls:
