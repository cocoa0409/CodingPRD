# =============================================================================
# SCAFFOLD — task_3093_advisory_loss_cost_filing_standard_form_licensing
# Advisory Loss Cost Filing & Standard Form Licensing (rating-bureau domain)
#
# Difficulty instruction applied: "Generate task much harder than expert level!"
# Escalation applied to the maximum prescribed level: Expert-band entity and
# endpoint counts at the top of the band, nine difficulty rules with maximum
# entanglement (deep transitive cascades, cyclic + parallel state machines,
# dual-variant calculations on three distinct entity domains, combinatorial
# formulas in all three modes (a)/(b)/(c), validation priority conflicts on
# three distinct error-category pairs, temporal overlap under two different
# interval semantics, compensating invariants over two distinct conserved
# quantities, and OCC on two distinct parent entities).
# =============================================================================

scenario: |
  Advisory Loss Cost Filing & Standard Form Licensing (Verisk): statistical data
  collection from member insurers with edit and validation routines, loss cost
  development by state, line and class with actuarial review and trend selection,
  filing of advisory loss costs with regulators and insurer adoption through loss
  cost multipliers, standard policy form and endorsement drafting with countrywide
  and state-specific variants, circular publication informing insurers of form and
  rule changes with implementation dates, licensing agreements governing insurer
  use of forms and manuals, class plan revisions and their effect on insurer
  rating engines, regulatory objection handling and resubmission

domain_name: advisory-loss-cost-bureau
api_prefix: /bureau

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: MemberInsurer
    parent: null
    common_fields: true
    fields:
      - { name: insurer_code, type: string, source: input, description: "Bureau-assigned member code, unique" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the member insurer" }
      - { name: insurer_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | WITHDRAWN; starts ACTIVE", constraints: "enum {ACTIVE, SUSPENDED, WITHDRAWN}" }
      - { name: quality_score_bps, type: integer, source: computed, description: "Statistical reporting quality score in basis points, 0..10000; starts 10000, recomputed on every StatisticalSubmission disposition" }

  - name: StatisticalPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Statistical plan code, unique" }
      - { name: line_of_business, type: string, source: input, description: "Line of business this plan governs, e.g. COMMERCIAL_PROPERTY" }
      - { name: min_premium_cents, type: integer, source: input, description: "Records below this written premium are excluded from the aggregate edit" }
      - { name: max_record_age_months, type: integer, source: input, description: "Policy records older than this many months from the submission period end are rejected by the age edit" }
      - { name: plan_status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; starts DRAFT", constraints: "enum {DRAFT, ACTIVE, RETIRED}" }

  - name: StatisticalSubmission
    parent: MemberInsurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> MemberInsurer.id; submitting insurer" }
      - { name: plan_id, type: string, source: input, description: "FK -> StatisticalPlan.id; plan whose edit routines govern this submission" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the statistical period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the statistical period (half-open [period_start, period_end))" }
      - { name: record_count, type: integer, source: input, description: "Number of statistical records in the batch, >= 1" }
      - { name: written_premium_cents, type: integer, source: input, description: "Total written premium of the batch, >= 0" }
      - { name: submission_status, type: enum, source: system, description: "RECEIVED | EDITING | ACCEPTED | ACCEPTED_WITH_WARNINGS | REJECTED; starts RECEIVED", constraints: "enum {RECEIVED, EDITING, ACCEPTED, ACCEPTED_WITH_WARNINGS, REJECTED}" }
      - { name: accepted_record_count, type: integer, source: computed, description: "record_count minus count of ERROR-severity findings; recomputed at disposition" }
      - { name: error_finding_count, type: integer, source: computed, description: "Count of SubmissionEditFinding rows with severity ERROR; recomputed at disposition" }
      - { name: warning_finding_count, type: integer, source: computed, description: "Count of SubmissionEditFinding rows with severity WARNING; recomputed at disposition" }

  - name: SubmissionEditFinding
    parent: StatisticalSubmission
    common_fields: false
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> StatisticalSubmission.id; owning submission" }
      - { name: edit_code, type: string, source: input, description: "Edit routine code, e.g. E-101 premium-below-minimum" }
      - { name: severity, type: enum, source: input, description: "ERROR | WARNING", constraints: "enum {ERROR, WARNING}" }
      - { name: affected_records, type: integer, source: input, description: "Number of batch records this finding covers, >= 1" }

  - name: LossCostFiling
    parent: null
    common_fields: true
    fields:
      - { name: filing_code, type: string, source: input, description: "Bureau filing code, unique per filing_version chain root" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code this filing targets" }
      - { name: line_of_business, type: string, source: input, description: "Line of business" }
      - { name: filing_version, type: integer, source: system, description: "1 for the original filing; each resubmission after objection increments by 1 via supersedes_filing_id chain" }
      - { name: supersedes_filing_id, type: string, source: input, description: "FK -> LossCostFiling.id; null on version 1, otherwise the objected filing this filing answers; self_referential" , constraints: "nullable"}
      - { name: trend_selection, type: enum, source: input, description: "Actuarial trend methodology chosen by the reviewing actuary", constraints: "enum {EXPONENTIAL_LEAST_SQUARES, LINEAR_LEAST_SQUARES}" }
      - { name: review_notes, type: string, source: input, description: "Actuarial review narrative", constraints: "nullable" }
      - { name: filing_status, type: enum, source: system, description: "DRAFT | IN_ACTUARIAL_REVIEW | REVIEWED | FILED | OBJECTED | EFFECTIVE | WITHDRAWN; starts DRAFT", constraints: "enum {DRAFT, IN_ACTUARIAL_REVIEW, REVIEWED, FILED, OBJECTED, EFFECTIVE, WITHDRAWN}" }
      - { name: last_submitted_by_admin_id, type: string, source: system, description: "X-User-ID of the BureauAdmin who submitted the filing to actuarial review; consumed by the segregation-of-duties check at complete-review; null until submit-review", constraints: "nullable" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp when the filing entered FILED; objection-window arithmetic is anchored here; null until FILED", constraints: "nullable" }
      - { name: indicated_change_pct, type: number, source: computed, description: "Aggregate indicated loss-cost level change for the filing, computed from LossCostCell rows at REVIEWED; pinned evaluation order per calculations.indicated_change" }
      - { name: effective_date, type: datetime, source: input, description: "Requested effective date of the advisory loss costs", constraints: "nullable until FILED" }

  - name: LossCostCell
    parent: LossCostFiling
    common_fields: false
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> LossCostFiling.id; owning filing" }
      - { name: class_code, type: string, source: input, description: "Class code within the filing's line of business" }
      - { name: earned_premium_cents, type: integer, source: input, description: "On-level earned premium for the experience period, > 0" }
      - { name: incurred_loss_cents, type: integer, source: input, description: "Developed incurred losses for the experience period, >= 0" }
      - { name: weight_pct, type: integer, source: input, description: "Credibility weight of this cell within the filing in whole percent, 1..100; cell weights within a filing need not sum to 100 (residual goes to no-change)" }
      - { name: current_loss_cost_cents, type: integer, source: input, description: "Currently effective advisory loss cost for this state/line/class, > 0" }

  - name: RegulatoryObjection
    parent: LossCostFiling
    common_fields: false
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> LossCostFiling.id; filing objected to" }
      - { name: department_id, type: string, source: input, description: "FK -> StateDepartment.id; regulator department raising the objection" }
      - { name: objection_code, type: string, source: input, description: "Regulator's objection category code" }
      - { name: objection_text, type: string, source: input, description: "Objection narrative" }
      - { name: raised_at, type: datetime, source: system, description: "Logical-clock timestamp when the objection was raised" }

  - name: StateDepartment
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code, unique" }
      - { name: department_name, type: string, source: input, description: "Name of the department of insurance" }
      - { name: objection_window_days, type: integer, source: input, description: "Days from FILED during which the department may raise an objection, > 0" }
      - { name: max_lcm_deviation_pct, type: integer, source: input, description: "Maximum permitted loss-cost-multiplier deviation above the bureau-authorized band in whole percent, >= 0" }

  - name: LossCostMultiplierAdoption
    parent: MemberInsurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> MemberInsurer.id; adopting insurer" }
      - { name: filing_id, type: string, source: input, description: "FK -> LossCostFiling.id; EFFECTIVE filing whose advisory loss costs are being adopted" }
      - { name: multiplier_pct, type: integer, source: input, description: "Loss cost multiplier in whole percent (100 = pure adoption of advisory loss costs), >= 1" }
      - { name: adoption_status, type: enum, source: system, description: "PENDING | AUTHORIZED | REJECTED_BAND | WITHDRAWN; starts PENDING", constraints: "enum {PENDING, AUTHORIZED, REJECTED_BAND, WITHDRAWN}" }
      - { name: authorized_premium_cents, type: integer, source: computed, description: "Sum over the filing's LossCostCell rows of per-cell rounded premium under the multiplier; pinned rounding order per calculations.lcm_premium" }

  - name: PolicyForm
    parent: null
    common_fields: true
    fields:
      - { name: form_number, type: string, source: input, description: "Countrywide form or endorsement number, unique" }
      - { name: form_title, type: string, source: input, description: "Form title" }
      - { name: form_kind, type: enum, source: input, description: "POLICY_FORM | ENDORSEMENT", constraints: "enum {POLICY_FORM, ENDORSEMENT}" }
      - { name: form_status, type: enum, source: system, description: "DRAFTING | IN_REVIEW | APPROVED | PUBLISHED | WITHDRAWN; starts DRAFTING", constraints: "enum {DRAFTING, IN_REVIEW, APPROVED, PUBLISHED, WITHDRAWN}" }

  - name: FormVariant
    parent: PolicyForm
    common_fields: true
    fields:
      - { name: form_id, type: string, source: input, description: "FK -> PolicyForm.id; parent countrywide form" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; the literal CW marks the countrywide variant" }
      - { name: variant_text_ref, type: string, source: input, description: "Reference to the variant text payload" }
      - { name: review_status, type: enum, source: system, description: "PENDING | CLEARED | BLOCKED; parallel dimension 1, starts PENDING", constraints: "enum {PENDING, CLEARED, BLOCKED}" }
      - { name: publication_status, type: enum, source: system, description: "UNPUBLISHED | SCHEDULED | LIVE | RETIRED; parallel dimension 2, starts UNPUBLISHED", constraints: "enum {UNPUBLISHED, SCHEDULED, LIVE, RETIRED}" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the variant's usability window (half-open [effective_from, effective_to))" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the usability window; null means open-ended", constraints: "nullable" }

  - name: Circular
    parent: null
    common_fields: true
    fields:
      - { name: circular_number, type: string, source: input, description: "Circular number, unique" }
      - { name: subject, type: string, source: input, description: "Circular subject line" }
      - { name: implementation_date, type: datetime, source: input, description: "Date by which member insurers must implement the announced changes" }
      - { name: circular_status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED; starts DRAFT", constraints: "enum {DRAFT, PUBLISHED, SUPERSEDED}" }
      - { name: supersedes_circular_id, type: string, source: input, description: "FK -> Circular.id; null unless this circular supersedes an earlier one; self_referential", constraints: "nullable" }

  - name: LicenseAgreement
    parent: MemberInsurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> MemberInsurer.id; licensed insurer" }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive start of licensed coverage (closed interval [coverage_start, coverage_end])" }
      - { name: coverage_end, type: datetime, source: input, description: "Inclusive end of licensed coverage; a same-day window is a single licensed day" }
      - { name: royalty_rate_bps, type: integer, source: input, description: "Royalty rate in basis points applied to adopted premium, 0..5000" }
      - { name: agreement_status, type: enum, source: system, description: "ACTIVE | LAPSED | TERMINATED; starts ACTIVE", constraints: "enum {ACTIVE, LAPSED, TERMINATED}" }

  - name: ClassPlan
    parent: null
    common_fields: true
    fields:
      - { name: class_plan_code, type: string, source: input, description: "Class plan code, unique" }
      - { name: line_of_business, type: string, source: input, description: "Line of business governed by this class plan" }
      - { name: current_revision_id, type: string, source: system, description: "FK -> ClassPlanRevision.id; revision currently in force; null until first revision activates; cross_aggregate", constraints: "nullable" }
      - { name: plan_status, type: enum, source: system, description: "OPEN | LOCKED; starts OPEN", constraints: "enum {OPEN, LOCKED}" }

  - name: ClassPlanRevision
    parent: ClassPlan
    common_fields: true
    fields:
      - { name: class_plan_id, type: string, source: input, description: "FK -> ClassPlan.id; owning class plan" }
      - { name: revision_number, type: integer, source: system, description: "Monotonic per plan, starts at 1" }
      - { name: class_count, type: integer, source: input, description: "Number of classes in this revision, >= 1" }
      - { name: revision_status, type: enum, source: system, description: "STAGED | ACTIVATED | SUPERSEDED; starts STAGED", constraints: "enum {STAGED, ACTIVATED, SUPERSEDED}" }
      - { name: activates_at, type: datetime, source: input, description: "Logical-clock instant at which activation is permitted and scheduled actions fire" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StatisticalSubmission
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, ACCEPTED_WITH_WARNINGS, REJECTED]
    transitions:
      - from: RECEIVED
        to: EDITING
        trigger: "POST /bureau/submissions/{id}/begin-edit"
        actor: BureauAdmin
        preconditions:
          - "submission_status == RECEIVED"
        side_effects: []
      - from: EDITING
        to: ACCEPTED
        trigger: "POST /bureau/submissions/{id}/dispose"
        actor: BureauAdmin
        preconditions:
          - "submission_status == EDITING"
          - "error_finding_count == 0 AND warning_finding_count == 0 (computed from SubmissionEditFinding rows at dispose time)"
        side_effects:
          - "MemberInsurer.quality_score_bps recomputed via calculations.submission_quality_score"
          - "increments MemberInsurer.version by 1"
      - from: EDITING
        to: ACCEPTED_WITH_WARNINGS
        trigger: "POST /bureau/submissions/{id}/dispose"
        actor: BureauAdmin
        preconditions:
          - "submission_status == EDITING"
          - "error_finding_count == 0 AND warning_finding_count > 0"
        side_effects:
          - "MemberInsurer.quality_score_bps recomputed via calculations.submission_quality_score"
          - "increments MemberInsurer.version by 1"
      - from: EDITING
        to: REJECTED
        trigger: "POST /bureau/submissions/{id}/dispose"
        actor: BureauAdmin
        preconditions:
          - "submission_status == EDITING"
          - "error_finding_count > 0"
        side_effects:
          - "MemberInsurer.quality_score_bps recomputed via calculations.submission_quality_score"
          - "increments MemberInsurer.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /bureau/submissions/{id}/dispose with fast_reject=true (structural failure: record_count < 1 or written_premium_cents < 0 is impossible at create; fast_reject covers batch-level structural edit failure)"
        actor: BureauAdmin
        preconditions:
          - "submission_status == RECEIVED"
          - "payload fast_reject == true"
        side_effects:
          - "MemberInsurer.quality_score_bps recomputed via calculations.submission_quality_score"
          - "increments MemberInsurer.version by 1"

  - entity: LossCostFiling
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_ACTUARIAL_REVIEW
        trigger: "POST /bureau/filings/{id}/submit-review"
        actor: BureauAdmin
        preconditions:
          - "filing_status == DRAFT"
          - "at least one LossCostCell row exists for the filing"
        side_effects: []
      - from: IN_ACTUARIAL_REVIEW
        to: REVIEWED
        trigger: "POST /bureau/filings/{id}/complete-review"
        actor: BureauActuary
        preconditions:
          - "filing_status == IN_ACTUARIAL_REVIEW"
          - "segregation of duties: the completing actuary's X-User-ID must differ from the BureauAdmin X-User-ID that submitted the review (tracked on filing as last_submitted_by_admin_id, set at submit-review)"
        side_effects:
          - "indicated_change_pct computed via calculations.indicated_change"
      - from: REVIEWED
        to: FILED
        trigger: "POST /bureau/filings/{id}/file"
        actor: BureauAdmin
        preconditions:
          - "filing_status == REVIEWED"
          - "effective_date is set and strictly after the logical clock"
          - "a StateDepartment row exists for filing.state_code"
        side_effects: []
      - from: FILED
        to: OBJECTED
        trigger: "POST /bureau/filings/{id}/objections (first objection within window)"
        actor: RegulatorAnalyst
        preconditions:
          - "filing_status == FILED"
          - "logical clock <= filed_at + StateDepartment.objection_window_days"
          - "the analyst's department state_code == filing.state_code"
        side_effects:
          - "RegulatoryObjection row created"
      - from: FILED
        to: EFFECTIVE
        trigger: "POST /bureau/filings/{id}/finalize (after objection window lapses with no objection)"
        actor: BureauAdmin
        preconditions:
          - "filing_status == FILED"
          - "logical clock > filed_at + StateDepartment.objection_window_days"
          - "zero RegulatoryObjection rows for the filing"
        side_effects:
          - "filing becomes adoptable: LossCostMultiplierAdoption creation now permitted against it"
      - from: OBJECTED
        to: DRAFT
        trigger: "POST /bureau/filings (resubmission: new LossCostFiling with supersedes_filing_id = objected filing id)"
        actor: BureauAdmin
        preconditions:
          - "superseded filing_status == OBJECTED"
          - "OCC: expected_superseded_version matches superseded filing's version"
        side_effects:
          - "new filing created in DRAFT with filing_version = superseded.filing_version + 1"
          - "superseded filing transitions OBJECTED -> WITHDRAWN (terminal) — the cycle lives on the version chain, not the row"
          - "increments superseded LossCostFiling.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /bureau/filings/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "filing_status == DRAFT"
        side_effects: []
      - from: IN_ACTUARIAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /bureau/filings/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "filing_status == IN_ACTUARIAL_REVIEW"
        side_effects: []
      - from: REVIEWED
        to: WITHDRAWN
        trigger: "POST /bureau/filings/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "filing_status == REVIEWED"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /bureau/filings/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "filing_status == FILED"
          - "zero RegulatoryObjection rows for the filing"
        side_effects: []

  - entity: LossCostMultiplierAdoption
    initial_state: PENDING
    terminal_states: [AUTHORIZED, REJECTED_BAND, WITHDRAWN]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /bureau/adoptions/{id}/authorize"
        actor: BureauAdmin
        preconditions:
          - "adoption_status == PENDING"
          - "multiplier_pct - 100 <= StateDepartment.max_lcm_deviation_pct for the filing's state"
          - "insurer holds a LicenseAgreement with agreement_status == ACTIVE whose closed [coverage_start, coverage_end] window contains the logical clock date per calculations.license_window_contains"
        side_effects:
          - "authorized_premium_cents computed via calculations.lcm_premium (per-cell round-then-sum)"
      - from: PENDING
        to: REJECTED_BAND
        trigger: "POST /bureau/adoptions/{id}/authorize when deviation exceeds max_lcm_deviation_pct"
        actor: BureauAdmin
        preconditions:
          - "adoption_status == PENDING"
          - "multiplier_pct - 100 > StateDepartment.max_lcm_deviation_pct"
          - "insurer holds a LicenseAgreement with agreement_status == ACTIVE whose closed [coverage_start, coverage_end] window contains the logical clock date per calculations.license_window_contains"
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /bureau/adoptions/{id}/withdraw"
        actor: InsurerUser
        preconditions:
          - "adoption_status == PENDING"
          - "X-User-ID == adoption.insurer_id (entity-backed ownership)"
        side_effects: []
      - from: AUTHORIZED
        to: WITHDRAWN
        trigger: "POST /bureau/adoptions/{id}/withdraw"
        actor: InsurerUser
        preconditions:
          - "adoption_status == AUTHORIZED"
          - "X-User-ID == adoption.insurer_id"
        side_effects: []

  - entity: PolicyForm
    initial_state: DRAFTING
    terminal_states: [PUBLISHED, WITHDRAWN]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /bureau/forms/{id}/submit-review"
        actor: BureauAdmin
        preconditions:
          - "form_status == DRAFTING"
          - "at least one FormVariant row with state_code == CW exists for the form"
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /bureau/forms/{id}/approve"
        actor: BureauActuary
        preconditions:
          - "form_status == IN_REVIEW"
          - "every FormVariant of the form has review_status == CLEARED"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFTING
        trigger: "POST /bureau/forms/{id}/return-to-drafting"
        actor: BureauActuary
        preconditions:
          - "form_status == IN_REVIEW"
        side_effects:
          - "every FormVariant with review_status == CLEARED reverts to PENDING"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /bureau/circulars (publishing a circular whose payload lists this form)"
        actor: BureauAdmin
        preconditions:
          - "form_status == APPROVED"
          - "the circular's circular_status transitions DRAFT -> PUBLISHED in the same request"
        side_effects:
          - "every FormVariant of the form with review_status == CLEARED transitions publication_status UNPUBLISHED -> SCHEDULED"
      - from: DRAFTING
        to: WITHDRAWN
        trigger: "POST /bureau/forms/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "form_status == DRAFTING"
        side_effects: []
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /bureau/forms/{id}/withdraw"
        actor: BureauAdmin
        preconditions:
          - "form_status == IN_REVIEW"
        side_effects: []

  - entity: FormVariant
    initial_state: "review_status=PENDING, publication_status=UNPUBLISHED"
    terminal_states: ["publication_status=RETIRED"]
    transitions:
      - from: "review_status=PENDING"
        to: "review_status=CLEARED"
        trigger: "POST /bureau/variants/{id}/clear"
        actor: BureauActuary
        preconditions:
          - "review_status == PENDING"
          - "publication_status == UNPUBLISHED"
          - "no other FormVariant of the same form_id and same state_code has a half-open usability window overlapping [effective_from, effective_to) per calculations.variant_window_overlap"
        side_effects: []
      - from: "review_status=PENDING"
        to: "review_status=BLOCKED"
        trigger: "POST /bureau/variants/{id}/block"
        actor: BureauActuary
        preconditions:
          - "review_status == PENDING"
        side_effects: []
      - from: "review_status=BLOCKED"
        to: "review_status=PENDING"
        trigger: "POST /bureau/variants/{id}/unblock"
        actor: BureauActuary
        preconditions:
          - "review_status == BLOCKED"
          - "publication_status == UNPUBLISHED"
        side_effects: []
      - from: "publication_status=UNPUBLISHED"
        to: "publication_status=SCHEDULED"
        trigger: "system (parent PolicyForm reaches PUBLISHED via circular publication)"
        actor: system
        preconditions:
          - "review_status == CLEARED"
        side_effects: []
      - from: "publication_status=SCHEDULED"
        to: "publication_status=LIVE"
        trigger: "system (logical clock reaches the parent circular's implementation_date)"
        actor: system
        preconditions:
          - "publication_status == SCHEDULED"
          - "logical clock >= parent circular.implementation_date"
        side_effects:
          - "licensed-use gate opens: insurers with an ACTIVE LicenseAgreement containing the date may use the variant"
      - from: "publication_status=LIVE"
        to: "publication_status=RETIRED"
        trigger: "POST /bureau/variants/{id}/retire"
        actor: BureauAdmin
        preconditions:
          - "publication_status == LIVE"
        side_effects: []

  - entity: Circular
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /bureau/circulars/{id}/publish"
        actor: BureauAdmin
        preconditions:
          - "circular_status == DRAFT"
          - "implementation_date strictly after the logical clock"
        side_effects:
          - "every PolicyForm listed in the circular payload transitions APPROVED -> PUBLISHED, which cascades its CLEARED FormVariants UNPUBLISHED -> SCHEDULED"
          - "if supersedes_circular_id is set, that circular transitions PUBLISHED -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a later circular with supersedes_circular_id = this id is published)"
        actor: system
        preconditions:
          - "circular_status == PUBLISHED"
        side_effects: []

  - entity: LicenseAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (logical clock passes coverage_end; evaluated on read and at adoption authorization)"
        actor: system
        preconditions:
          - "agreement_status == ACTIVE"
          - "logical clock > coverage_end"
        side_effects:
          - "any PENDING LossCostMultiplierAdoption of this insurer transitions PENDING -> WITHDRAWN with reason LICENCE_LAPSED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bureau/agreements/{id}/terminate"
        actor: BureauAdmin
        preconditions:
          - "agreement_status == ACTIVE"
          - "the insurer has zero LossCostMultiplierAdoption rows in AUTHORIZED status"
        side_effects:
          - "any PENDING LossCostMultiplierAdoption of this insurer transitions PENDING -> WITHDRAWN with reason LICENCE_TERMINATED"

  - entity: ClassPlan
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /bureau/class-plans/{id}/lock"
        actor: BureauAdmin
        preconditions:
          - "plan_status == OPEN"
          - "current_revision_id is not null"
          - "zero ClassPlanRevision rows in STAGED status"
        side_effects: []

  - entity: ClassPlanRevision
    initial_state: STAGED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: STAGED
        to: ACTIVATED
        trigger: "POST /bureau/class-plan-revisions/{id}/activate"
        actor: BureauAdmin
        preconditions:
          - "revision_status == STAGED"
          - "logical clock >= activates_at"
          - "parent ClassPlan.plan_status == OPEN"
        side_effects:
          - "the plan's previous ACTIVATED revision (if any) transitions ACTIVATED -> SUPERSEDED"
          - "ClassPlan.current_revision_id set to this revision's id"
          - "increments ClassPlan.version by 1"
          - "insurer rating-engine impact recorded: every AUTHORIZED LossCostMultiplierAdoption whose filing's line_of_business == plan's line_of_business is flagged rating_engine_stale = true (derived flag recomputed on read)"

  - entity: MemberInsurer
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bureau/insurers/{id}/suspend"
        actor: BureauAdmin
        preconditions:
          - "insurer_status == ACTIVE"
        side_effects:
          - "new StatisticalSubmission creation by this insurer is rejected while SUSPENDED (state validation)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bureau/insurers/{id}/reinstate"
        actor: BureauAdmin
        preconditions:
          - "insurer_status == SUSPENDED"
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /bureau/insurers/{id}/withdraw-membership"
        actor: BureauAdmin
        preconditions:
          - "insurer_status == ACTIVE"
          - "zero LicenseAgreement rows in ACTIVE status for the insurer"
          - "zero LossCostMultiplierAdoption rows in PENDING or AUTHORIZED status for the insurer"
        side_effects: []
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /bureau/insurers/{id}/withdraw-membership"
        actor: BureauAdmin
        preconditions:
          - "insurer_status == SUSPENDED"
          - "zero LicenseAgreement rows in ACTIVE status for the insurer"
          - "zero LossCostMultiplierAdoption rows in PENDING or AUTHORIZED status for the insurer"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: filing-resubmission-stale-superseded
    parent_entity: LossCostFiling
    write_endpoint: "POST /bureau/filings"
    occ_field: expected_superseded_version
    description: |
      Creating a resubmission LossCostFiling against a superseded filing whose
      version has advanced since the client last observed it is rejected. The
      version advances because another resubmission already moved the objected
      filing OBJECTED -> WITHDRAWN (or because withdraw fired), so the client's
      view of the supersede chain is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adoption-create-stale-filing
    parent_entity: LossCostFiling
    write_endpoint: "POST /bureau/adoptions"
    occ_field: expected_filing_version
    description: |
      Creating a LossCostMultiplierAdoption against a filing whose version has
      advanced since the client last observed it is rejected. The adoption pins
      the filing version it was priced against; a version bump means the
      advisory loss costs the client saw are no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: trend_factor
    trigger: "during calculations.indicated_change, per LossCostCell, according to the filing's trend_selection"
    algorithm: constraint_propagation
    formula: |
      inputs: cell.earned_premium_cents, cell.incurred_loss_cents,
              filing.trend_selection, constants
      raw_ratio = cell.incurred_loss_cents / cell.earned_premium_cents   (exact rational, no rounding yet)
      if filing.trend_selection == EXPONENTIAL_LEAST_SQUARES:
          trended_ratio = raw_ratio * (1 + TREND_RATE_PER_PERIOD) ** TREND_PERIODS
      else:  # LINEAR_LEAST_SQUARES
          trended_ratio = raw_ratio * (1 + TREND_RATE_PER_PERIOD * TREND_PERIODS)
      cell_indication_pct = (trended_ratio / TARGET_LOSS_RATIO - 1) * 100
    input_set: "all LossCostCell rows of the filing (immutable once REVIEWED)"
    constants:
      TREND_RATE_PER_PERIOD: 0.04
      TREND_PERIODS: 2.5
      TARGET_LOSS_RATIO: 0.60
    precision: "cell_indication_pct carried at full float precision until indicated_change aggregation"
    variants:
      - name: exponential
        when: "filing.trend_selection == EXPONENTIAL_LEAST_SQUARES"
        difference: "compounds the per-period trend rate: (1+r)^n; larger indication than linear for positive r"
      - name: linear
        when: "filing.trend_selection == LINEAR_LEAST_SQUARES"
        difference: "adds the accumulated trend: r*n; strictly smaller indication than exponential for identical inputs"

  - name: indicated_change
    trigger: "LossCostFiling transition IN_ACTUARIAL_REVIEW -> REVIEWED"
    algorithm: weighted_scoring
    formula: |
      EVALUATION ORDER (pinned — circular-looking dependency resolved):
        step 1: for each cell, compute cell_indication_pct via calculations.trend_factor (unrounded float)
        step 2: weight_sum = sum(cell.weight_pct for all cells)   # 1..100*k, may be < or > 100
        step 3: residual_weight = max(0, 100 - weight_sum)        # residual gets 0% indication (no-change)
        step 4: if weight_sum > 100: scale each weight by 100 / weight_sum (normalize down); else use weights as-is
        step 5: indicated_change_pct = sum(scaled_weight_i * cell_indication_pct_i) / 100
        step 6: round indicated_change_pct to 4 decimal places, round_half_up
    input_set: "all LossCostCell rows of the filing at the moment of complete-review"
    constants:
      RESIDUAL_INDICATION_PCT: 0
    precision: "4 decimal places, round_half_up, single final rounding only"

  - name: lcm_premium
    trigger: "LossCostMultiplierAdoption transition PENDING -> AUTHORIZED"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER (pinned — per-cell round THEN sum):
        for each LossCostCell of the filing:
          cell_premium_cents = round_half_up(cell.current_loss_cost_cents * adoption.multiplier_pct / 100)
        authorized_premium_cents = sum(cell_premium_cents)
      (Sum-then-round of the unrounded products yields different cents whenever any
      cell product has a fractional part >= 0.5 cent; the scaffold pins per-cell-first.)
    input_set: "all LossCostCell rows of the adoption's filing"
    constants: {}
    precision: "integer cents, round_half_up per cell"
    variants:
      - name: per_cell_round_then_sum
        when: "always — this is the pinned authoritative order"
        difference: "round each cell product to cents, then sum"
      - name: sum_then_round
        when: "NEVER used by the system — documented as the rejected alternative so tests can assert the delta"
        difference: "sum unrounded cell products, then round once; differs from pinned order on fractional cents"

  - name: submission_quality_score
    trigger: "every StatisticalSubmission disposition (any transition into ACCEPTED, ACCEPTED_WITH_WARNINGS, or REJECTED)"
    algorithm: weighted_scoring
    formula: |
      inputs: insurer's submission history, current disposition
      EVALUATION ORDER (pinned):
        step 1: submissions = all StatisticalSubmission rows of the insurer in a terminal
                status, sorted by updated_at ASC, tie-break created_at ASC
        step 2: for each submission, points = 10000 - 200 * error_finding_count - 50 * warning_finding_count,
                floored at 0 per submission
        step 3: weights decay: the k-th most recent submission gets weight DECAY_BASE ** (k-1)
                (most recent = weight 1)
        step 4: quality_score_bps = round_half_up( sum(points_k * weight_k) / sum(weight_k) )
        step 5: clamp to [0, 10000]
    input_set: "all terminal StatisticalSubmission rows of the insurer (ACCEPTED, ACCEPTED_WITH_WARNINGS, REJECTED)"
    constants:
      ERROR_PENALTY_BPS: 200
      WARNING_PENALTY_BPS: 50
      DECAY_BASE: 0.5
    precision: "integer basis points, round_half_up at final step only"
    variants:
      - name: chronological_replay
        when: "always — pinned authoritative order: recency-weighted with DECAY_BASE geometric decay, most recent heaviest"
        difference: "weight_k = DECAY_BASE^(k-1) by recency rank"
      - name: flat_average
        when: "NEVER used — rejected alternative: unweighted mean of per-submission points; differs whenever submissions differ in finding counts"
        difference: "equal weights; most recent disposition would not dominate"

  - name: variant_window_overlap
    trigger: "FormVariant review_status PENDING -> CLEARED precondition evaluation"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics: [effective_from, effective_to).
      Two variants of the same form_id and state_code conflict iff:
        a.effective_from < b.effective_to (or b.effective_to is null)
        AND b.effective_from < a.effective_to (or a.effective_to is null)
      Adjacent windows where a.effective_to == b.effective_from do NOT overlap (touching is allowed).
    input_set: "all FormVariant rows with the same form_id and state_code, excluding review_status == BLOCKED and publication_status == RETIRED"
    constants: {}
    precision: "datetime comparison, no rounding"

  - name: license_window_contains
    trigger: "LossCostMultiplierAdoption authorization; LicenseAgreement lapse evaluation"
    algorithm: interval_merge
    formula: |
      CLOSED interval semantics: [coverage_start, coverage_end].
      A date D is covered iff coverage_start <= D AND D <= coverage_end.
      A single-day window (coverage_start == coverage_end) covers exactly that day.
      This deliberately differs from calculations.variant_window_overlap (half-open):
      the same pair of timestamps can be non-overlapping under variant semantics but
      covering under license semantics.
    input_set: "the insurer's LicenseAgreement rows"
    constants: {}
    precision: "date-granularity comparison at day precision"

  - name: royalty_accrual
    trigger: "computed on read of a LicenseAgreement via GET /bureau/agreements/{id}/royalty"
    algorithm: aggregation
    formula: |
      royalty_due_cents = round_half_up(
          sum(adoption.authorized_premium_cents for the insurer's AUTHORIZED adoptions
              whose filing became EFFECTIVE while this agreement was ACTIVE)
          * agreement.royalty_rate_bps / 10000 )
    input_set: "AUTHORIZED LossCostMultiplierAdoption rows of the insurer, filtered to filings that reached EFFECTIVE during the agreement's ACTIVE closed window"
    constants: {}
    precision: "integer cents, round_half_up, single final rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles / §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-segment resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Body foreign keys exist, validated in the order declared in the endpoint's input list (insurer_id before plan_id before filing_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Cross-entity state gates: filing adoptable only when EFFECTIVE; class-plan revision activation only while plan OPEN; adoption authorization only while insurer ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/adoptions, POST /bureau/adoptions/{id}/authorize, POST /bureau/class-plan-revisions/{id}/activate"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: complete-review actuary X-User-ID != the submit-review admin X-User-ID recorded on the filing"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /bureau/filings/{id}/complete-review"
  - priority: 8
    category: business_safety
    check: "Regulator jurisdiction: RegulatorAnalyst's department state_code == filing.state_code"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /bureau/filings/{id}/objections"
  - priority: 9
    category: business_temporal
    check: "Objection window: logical clock <= filed_at + department.objection_window_days"
    error_id: ERR_OBJECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bureau/filings/{id}/objections"
  - priority: 10
    category: business_temporal
    check: "FormVariant half-open window overlap per calculations.variant_window_overlap"
    error_id: ERR_VARIANT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /bureau/variants/{id}/clear"
  - priority: 11
    category: business_temporal
    check: "License closed-window coverage of logical clock per calculations.license_window_contains"
    error_id: ERR_LICENSE_NOT_COVERING
    http_status: 422
    applies_to: "POST /bureau/adoptions/{id}/authorize"
  - priority: 12
    category: business_constraint
    check: "LCM band: multiplier_pct - 100 <= StateDepartment.max_lcm_deviation_pct (exceeding routes to REJECTED_BAND, not an error, when == boundary exactly it is allowed)"
    error_id: ERR_LCM_BAND_EXCEEDED
    http_status: 422
    applies_to: "POST /bureau/adoptions (pre-screen when insurer requests immediate authorization flag)"
  - priority: 13
    category: business_constraint
    check: "LossCostCell field ranges: earned_premium_cents > 0, current_loss_cost_cents > 0, weight_pct in 1..100, incurred_loss_cents >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /bureau/filings/{id}/cells"
  - priority: 14
    category: business_constraint
    check: "Required input fields present; enum values in declared sets; record_count >= 1; written_premium_cents >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 12
    category: business_fiscal
    check: "OCC: expected_superseded_version matches the superseded filing's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bureau/filings (resubmission)"
  - priority: 13
    category: business_referential
    check: "Resubmission chain integrity: supersedes_filing_id references an OBJECTED filing; circular supersedes_circular_id references a PUBLISHED circular"
    error_id: ERR_SUPERSEDE_CHAIN_BROKEN
    http_status: 422
    applies_to: "POST /bureau/filings, POST /bureau/circulars"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- clock (test-driving; default startup time fixed) ---
  - method: POST
    path: "/bureau/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [BureauAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["system transitions gated on the logical clock are evaluated lazily on next relevant read/action"]

  # --- MemberInsurer ---
  - method: POST
    path: "/bureau/insurers"
    description: "Register a member insurer"
    roles: [BureauAdmin]
    code: 201
    input: [insurer_code, legal_name]
    output: MemberInsurer
    side_effects: ["insurer_status=ACTIVE, quality_score_bps=10000"]

  - method: GET
    path: "/bureau/insurers/{id}"
    description: "Get insurer"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst, InsurerUser]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: []

  - method: GET
    path: "/bureau/insurers"
    description: "List insurers"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst]
    code: 200
    input: ["insurer_status?", "limit?", "offset?"]
    output: MemberInsurer[]
    side_effects: []

  - method: POST
    path: "/bureau/insurers/{id}/suspend"
    description: "Suspend an insurer"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: ["insurer_status -> SUSPENDED", "increments MemberInsurer.version by 1"]

  - method: POST
    path: "/bureau/insurers/{id}/reinstate"
    description: "Reinstate a suspended insurer"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: ["insurer_status -> ACTIVE", "increments MemberInsurer.version by 1"]

  - method: POST
    path: "/bureau/insurers/{id}/withdraw-membership"
    description: "Withdraw insurer membership (terminal)"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: ["insurer_status -> WITHDRAWN", "increments MemberInsurer.version by 1"]

  # --- StatisticalPlan ---
  - method: POST
    path: "/bureau/statistical-plans"
    description: "Create a statistical plan"
    roles: [BureauAdmin]
    code: 201
    input: [plan_code, line_of_business, min_premium_cents, max_record_age_months]
    output: StatisticalPlan
    side_effects: ["plan_status=DRAFT"]

  - method: GET
    path: "/bureau/statistical-plans/{id}"
    description: "Get a statistical plan"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: StatisticalPlan
    side_effects: []

  - method: POST
    path: "/bureau/statistical-plans/{id}/activate"
    description: "Activate a statistical plan"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: StatisticalPlan
    side_effects: ["plan_status DRAFT -> ACTIVE"]

  # --- StatisticalSubmission ---
  - method: POST
    path: "/bureau/submissions"
    description: "Submit a statistical data batch"
    roles: [InsurerUser]
    code: 201
    input: [insurer_id, plan_id, period_start, period_end, record_count, written_premium_cents]
    output: StatisticalSubmission
    side_effects: ["submission_status=RECEIVED"]

  - method: GET
    path: "/bureau/submissions/{id}"
    description: "Get a submission"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: StatisticalSubmission
    side_effects: []

  - method: GET
    path: "/bureau/submissions"
    description: "List submissions (filtered)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: ["insurer_id?", "plan_id?", "submission_status?", "limit?", "offset?"]
    output: StatisticalSubmission[]
    side_effects: []

  - method: POST
    path: "/bureau/submissions/{id}/begin-edit"
    description: "Begin edit routine pass"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: StatisticalSubmission
    side_effects: ["submission_status RECEIVED -> EDITING"]

  - method: POST
    path: "/bureau/submissions/{id}/findings"
    description: "Record an edit finding against a submission in EDITING"
    roles: [BureauAdmin]
    code: 201
    input: [edit_code, severity, affected_records]
    output: SubmissionEditFinding
    side_effects: []

  - method: GET
    path: "/bureau/submissions/{id}/findings"
    description: "List findings of a submission"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: SubmissionEditFinding[]
    side_effects: []

  - method: POST
    path: "/bureau/submissions/{id}/dispose"
    description: "Dispose a submission: computes findings and transitions to a terminal status"
    roles: [BureauAdmin]
    code: 200
    input: ["fast_reject?"]
    output: StatisticalSubmission
    side_effects: ["computes error_finding_count/warning_finding_count/accepted_record_count", "transitions per §1.2", "recalculates MemberInsurer.quality_score_bps via calculations.submission_quality_score", "increments MemberInsurer.version by 1"]

  # --- StateDepartment ---
  - method: POST
    path: "/bureau/departments"
    description: "Register a state department of insurance"
    roles: [BureauAdmin]
    code: 201
    input: [state_code, department_name, objection_window_days, max_lcm_deviation_pct]
    output: StateDepartment
    side_effects: []

  - method: GET
    path: "/bureau/departments/{id}"
    description: "Get a department"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst, InsurerUser]
    code: 200
    input: []
    output: StateDepartment
    side_effects: []

  # --- LossCostFiling ---
  - method: POST
    path: "/bureau/filings"
    description: "Create a loss cost filing; when supersedes_filing_id is provided this is a resubmission (OCC-guarded)"
    roles: [BureauAdmin]
    code: 201
    input: [filing_code, state_code, line_of_business, trend_selection, "review_notes?", "effective_date?", "supersedes_filing_id?", "expected_superseded_version?"]
    output: LossCostFiling
    side_effects: ["filing_status=DRAFT, filing_version = 1 or superseded.filing_version + 1", "on resubmission: superseded filing OBJECTED -> WITHDRAWN and increments superseded LossCostFiling.version by 1"]

  - method: GET
    path: "/bureau/filings/{id}"
    description: "Get a filing"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst, InsurerUser]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: []

  - method: GET
    path: "/bureau/filings"
    description: "List filings (filtered)"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst, InsurerUser]
    code: 200
    input: ["state_code?", "line_of_business?", "filing_status?", "supersedes_filing_id?", "limit?", "offset?"]
    output: LossCostFiling[]
    side_effects: []

  - method: GET
    path: "/bureau/departments/{id}/objections"
    description: "List objections raised by a department (reverse-reachability for RegulatoryObjection.department_id)"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst]
    code: 200
    input: []
    output: RegulatoryObjection[]
    side_effects: []

  - method: GET
    path: "/bureau/circulars"
    description: "List circulars (filtered)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: ["circular_status?", "supersedes_circular_id?", "limit?", "offset?"]
    output: Circular[]
    side_effects: []

  - method: GET
    path: "/bureau/insurers/{id}/agreements"
    description: "List license agreements of an insurer (reverse-reachability for LicenseAgreement.insurer_id)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: LicenseAgreement[]
    side_effects: []

  - method: GET
    path: "/bureau/class-plan-revisions/{id}/in-force-for"
    description: "List class plans whose current_revision_id is this revision (returns 0 or 1 rows)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: ClassPlan[]
    side_effects: []

  - method: POST
    path: "/bureau/filings/{id}/cells"
    description: "Add a loss cost cell to a DRAFT filing"
    roles: [BureauAdmin]
    code: 201
    input: [class_code, earned_premium_cents, incurred_loss_cents, weight_pct, current_loss_cost_cents]
    output: LossCostCell
    side_effects: []

  - method: GET
    path: "/bureau/filings/{id}/cells"
    description: "List cells of a filing"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst, InsurerUser]
    code: 200
    input: []
    output: LossCostCell[]
    side_effects: []

  - method: POST
    path: "/bureau/filings/{id}/submit-review"
    description: "Submit filing to actuarial review; records the submitting admin id for segregation of duties"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: ["filing_status DRAFT -> IN_ACTUARIAL_REVIEW", "records last_submitted_by_admin_id = X-User-ID"]

  - method: POST
    path: "/bureau/filings/{id}/complete-review"
    description: "Actuary completes review; computes indicated_change_pct"
    roles: [BureauActuary]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: ["filing_status IN_ACTUARIAL_REVIEW -> REVIEWED", "computes indicated_change_pct via calculations.indicated_change"]

  - method: POST
    path: "/bureau/filings/{id}/file"
    description: "File the reviewed filing with the state department"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: ["filing_status REVIEWED -> FILED", "records filed_at = logical clock"]

  - method: POST
    path: "/bureau/filings/{id}/objections"
    description: "Raise a regulatory objection against a FILED filing"
    roles: [RegulatorAnalyst]
    code: 201
    input: [department_id, objection_code, objection_text]
    output: RegulatoryObjection
    side_effects: ["filing_status FILED -> OBJECTED", "increments LossCostFiling.version by 1"]

  - method: GET
    path: "/bureau/filings/{id}/objections"
    description: "List objections against a filing"
    roles: [BureauAdmin, BureauActuary, RegulatorAnalyst]
    code: 200
    input: []
    output: RegulatoryObjection[]
    side_effects: []

  - method: POST
    path: "/bureau/filings/{id}/finalize"
    description: "Finalize a FILED filing whose objection window lapsed without objection"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: ["filing_status FILED -> EFFECTIVE"]

  - method: POST
    path: "/bureau/filings/{id}/withdraw"
    description: "Withdraw a filing (terminal)"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LossCostFiling
    side_effects: ["filing_status -> WITHDRAWN"]

  # --- LossCostMultiplierAdoption ---
  - method: POST
    path: "/bureau/adoptions"
    description: "Insurer adopts an EFFECTIVE filing's advisory loss costs via a multiplier (OCC-guarded on filing version)"
    roles: [InsurerUser]
    code: 201
    input: [insurer_id, filing_id, multiplier_pct, expected_filing_version]
    output: LossCostMultiplierAdoption
    side_effects: ["adoption_status=PENDING"]

  - method: GET
    path: "/bureau/adoptions/{id}"
    description: "Get an adoption"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: LossCostMultiplierAdoption
    side_effects: []

  - method: GET
    path: "/bureau/adoptions"
    description: "List adoptions (filtered)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: ["insurer_id?", "filing_id?", "adoption_status?", "limit?", "offset?"]
    output: LossCostMultiplierAdoption[]
    side_effects: []

  - method: POST
    path: "/bureau/adoptions/{id}/authorize"
    description: "Bureau authorizes (or band-rejects) an adoption; computes authorized_premium_cents"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LossCostMultiplierAdoption
    side_effects: ["adoption_status -> AUTHORIZED or REJECTED_BAND", "on AUTHORIZED: computes authorized_premium_cents via calculations.lcm_premium"]

  - method: POST
    path: "/bureau/adoptions/{id}/withdraw"
    description: "Insurer withdraws its own adoption"
    roles: [InsurerUser]
    code: 200
    input: []
    output: LossCostMultiplierAdoption
    side_effects: ["adoption_status -> WITHDRAWN"]

  # --- PolicyForm / FormVariant ---
  - method: POST
    path: "/bureau/forms"
    description: "Create a standard policy form or endorsement"
    roles: [BureauAdmin]
    code: 201
    input: [form_number, form_title, form_kind]
    output: PolicyForm
    side_effects: ["form_status=DRAFTING"]

  - method: GET
    path: "/bureau/forms/{id}"
    description: "Get a form"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: PolicyForm
    side_effects: []

  - method: POST
    path: "/bureau/forms/{id}/variants"
    description: "Add a state or countrywide variant to a form"
    roles: [BureauAdmin]
    code: 201
    input: [state_code, variant_text_ref, effective_from, "effective_to?"]
    output: FormVariant
    side_effects: ["review_status=PENDING, publication_status=UNPUBLISHED"]

  - method: GET
    path: "/bureau/forms/{id}/variants"
    description: "List variants of a form"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: ["state_code?"]
    output: FormVariant[]
    side_effects: []

  - method: GET
    path: "/bureau/variants/{id}"
    description: "Get a variant"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: FormVariant
    side_effects: []

  - method: POST
    path: "/bureau/variants/{id}/clear"
    description: "Actuary clears a variant (overlap-checked)"
    roles: [BureauActuary]
    code: 200
    input: []
    output: FormVariant
    side_effects: ["review_status PENDING -> CLEARED"]

  - method: POST
    path: "/bureau/variants/{id}/block"
    description: "Actuary blocks a variant"
    roles: [BureauActuary]
    code: 200
    input: []
    output: FormVariant
    side_effects: ["review_status PENDING -> BLOCKED"]

  - method: POST
    path: "/bureau/variants/{id}/unblock"
    description: "Actuary returns a blocked variant to pending"
    roles: [BureauActuary]
    code: 200
    input: []
    output: FormVariant
    side_effects: ["review_status BLOCKED -> PENDING"]

  - method: POST
    path: "/bureau/variants/{id}/retire"
    description: "Retire a LIVE variant (terminal on the publication dimension)"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: FormVariant
    side_effects: ["publication_status LIVE -> RETIRED"]

  - method: POST
    path: "/bureau/forms/{id}/submit-review"
    description: "Submit form for review"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: PolicyForm
    side_effects: ["form_status DRAFTING -> IN_REVIEW"]

  - method: POST
    path: "/bureau/forms/{id}/approve"
    description: "Actuary approves a form (all variants must be CLEARED)"
    roles: [BureauActuary]
    code: 200
    input: []
    output: PolicyForm
    side_effects: ["form_status IN_REVIEW -> APPROVED"]

  - method: POST
    path: "/bureau/forms/{id}/return-to-drafting"
    description: "Return form to drafting; cleared variants revert to PENDING"
    roles: [BureauActuary]
    code: 200
    input: []
    output: PolicyForm
    side_effects: ["form_status IN_REVIEW -> DRAFTING", "all CLEARED variants revert review_status -> PENDING"]

  - method: POST
    path: "/bureau/forms/{id}/withdraw"
    description: "Withdraw a form (terminal)"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: PolicyForm
    side_effects: ["form_status -> WITHDRAWN"]

  # --- Circular ---
  - method: POST
    path: "/bureau/circulars"
    description: "Create a circular; payload may list form ids it publishes and may supersede an earlier circular"
    roles: [BureauAdmin]
    code: 201
    input: [circular_number, subject, implementation_date, "form_ids?", "supersedes_circular_id?"]
    output: Circular
    side_effects: ["circular_status=DRAFT"]

  - method: GET
    path: "/bureau/circulars/{id}"
    description: "Get a circular"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: Circular
    side_effects: []

  - method: POST
    path: "/bureau/circulars/{id}/publish"
    description: "Publish a circular; cascades listed forms APPROVED -> PUBLISHED and their CLEARED variants UNPUBLISHED -> SCHEDULED"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: Circular
    side_effects: ["circular_status DRAFT -> PUBLISHED", "listed forms -> PUBLISHED", "their CLEARED variants -> SCHEDULED", "superseded circular -> SUPERSEDED"]

  # --- LicenseAgreement ---
  - method: POST
    path: "/bureau/agreements"
    description: "Create a license agreement for an insurer"
    roles: [BureauAdmin]
    code: 201
    input: [insurer_id, coverage_start, coverage_end, royalty_rate_bps]
    output: LicenseAgreement
    side_effects: ["agreement_status=ACTIVE"]

  - method: GET
    path: "/bureau/agreements/{id}"
    description: "Get an agreement (evaluates lapse lazily)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["may transition ACTIVE -> LAPSED if logical clock > coverage_end"]

  - method: GET
    path: "/bureau/agreements/{id}/royalty"
    description: "Computed royalty accrual read"
    roles: [BureauAdmin, BureauActuary]
    code: 200
    input: []
    output: { royalty_due_cents: integer }
    side_effects: []

  - method: POST
    path: "/bureau/agreements/{id}/terminate"
    description: "Terminate an agreement; pending adoptions of the insurer are withdrawn"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["agreement_status ACTIVE -> TERMINATED", "insurer's PENDING adoptions -> WITHDRAWN"]

  # --- ClassPlan / ClassPlanRevision ---
  - method: POST
    path: "/bureau/class-plans"
    description: "Create a class plan"
    roles: [BureauAdmin]
    code: 201
    input: [class_plan_code, line_of_business]
    output: ClassPlan
    side_effects: ["plan_status=OPEN, current_revision_id=null"]

  - method: GET
    path: "/bureau/class-plans/{id}"
    description: "Get a class plan"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: ClassPlan
    side_effects: []

  - method: GET
    path: "/bureau/class-plans"
    description: "List class plans (filtered)"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: ["current_revision_id?", "line_of_business?", "limit?", "offset?"]
    output: ClassPlan[]
    side_effects: []

  - method: GET
    path: "/bureau/class-plan-revisions/{id}"
    description: "Get a class plan revision"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: ClassPlanRevision
    side_effects: []

  - method: POST
    path: "/bureau/class-plans/{id}/revisions"
    description: "Stage a class plan revision"
    roles: [BureauAdmin]
    code: 201
    input: [class_count, activates_at]
    output: ClassPlanRevision
    side_effects: ["revision_status=STAGED, revision_number = max(existing)+1"]

  - method: GET
    path: "/bureau/class-plans/{id}/revisions"
    description: "List revisions of a class plan"
    roles: [BureauAdmin, BureauActuary, InsurerUser]
    code: 200
    input: []
    output: ClassPlanRevision[]
    side_effects: []

  - method: POST
    path: "/bureau/class-plan-revisions/{id}/activate"
    description: "Activate a staged revision at/after its activates_at; supersedes the previous revision"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: ClassPlanRevision
    side_effects: ["revision_status STAGED -> ACTIVATED", "previous ACTIVATED revision -> SUPERSEDED", "ClassPlan.current_revision_id updated", "increments ClassPlan.version by 1"]

  - method: POST
    path: "/bureau/class-plans/{id}/lock"
    description: "Lock a class plan (terminal)"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: ClassPlan
    side_effects: ["plan_status OPEN -> LOCKED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.5/§1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body foreign-key resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-enum value, or out-of-range numeric field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition, or a cross-entity state gate fails" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "complete-review actuary is the same X-User-ID that submitted the filing to review" }
  - { id: ERR_JURISDICTION_MISMATCH, http: 422, condition: "RegulatorAnalyst's department state_code differs from the filing's state_code" }
  - { id: ERR_OBJECTION_WINDOW_CLOSED, http: 422, condition: "Logical clock past filed_at + objection_window_days" }
  - { id: ERR_VARIANT_WINDOW_OVERLAP, http: 422, condition: "FormVariant half-open usability window overlaps a sibling variant of the same form and state" }
  - { id: ERR_LICENSE_NOT_COVERING, http: 422, condition: "No ACTIVE LicenseAgreement of the insurer covers the logical clock date under closed-interval semantics" }
  - { id: ERR_LCM_BAND_EXCEEDED, http: 422, condition: "Requested multiplier deviation exceeds the department's max_lcm_deviation_pct at adoption pre-screen" }
  - { id: ERR_SUPERSEDE_CHAIN_BROKEN, http: 422, condition: "supersedes_filing_id not OBJECTED, or supersedes_circular_id not PUBLISHED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INSURER_SUSPENDED, http: 409, condition: "SUSPENDED insurer attempted a submission creation (specialized form of state rejection reported distinctly for audit)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller: any request without a recognized X-User-Role is treated as Anonymous and fails the priority-1 authentication check with 401 ERR_UNAUTHENTICATED"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "none — every endpoint rejects Anonymous with ERR_UNAUTHENTICATED at validation priority 1"
  - name: BureauAdmin
    description: "Bureau operations administrator: registers insurers/plans/departments, drives submissions through edit and disposition, creates filings and cells, files and finalizes filings, authorizes adoptions, manages forms, circulars, agreements, and class plans"
    identity: opaque
    exclusive_operations:
      - "POST /bureau/insurers*, POST /bureau/statistical-plans*, POST /bureau/departments"
      - "POST /bureau/submissions/{id}/begin-edit|findings|dispose"
      - "POST /bureau/filings*, POST /bureau/filings/{id}/file|finalize|withdraw"
      - "POST /bureau/adoptions/{id}/authorize"
      - "POST /bureau/forms*, POST /bureau/forms/{id}/submit-review|withdraw, POST /bureau/variants/{id}/retire"
      - "POST /bureau/circulars*, POST /bureau/agreements*, POST /bureau/class-plans*, POST /bureau/class-plan-revisions/{id}/activate"
      - "POST /bureau/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
  - name: BureauActuary
    description: "Bureau actuarial reviewer: completes filing reviews (segregated from the submitting admin), clears/blocks form variants, approves forms"
    identity: opaque
    exclusive_operations:
      - "POST /bureau/filings/{id}/complete-review"
      - "POST /bureau/variants/{id}/clear|block|unblock"
      - "POST /bureau/forms/{id}/approve|return-to-drafting"
    shared_operations:
      - "GET endpoints"
  - name: RegulatorAnalyst
    description: "State department analyst raising objections on filings within jurisdiction"
    identity: "entity_backed:StateDepartment"
    exclusive_operations:
      - "POST /bureau/filings/{id}/objections"
    shared_operations:
      - "GET /bureau/filings*, GET /bureau/insurers*"
  - name: InsurerUser
    description: "Member insurer user: submits statistical data, adopts loss costs via multipliers, withdraws own adoptions"
    identity: "entity_backed:MemberInsurer"
    exclusive_operations:
      - "POST /bureau/submissions"
      - "POST /bureau/adoptions"
      - "POST /bureau/adoptions/{id}/withdraw"
    shared_operations:
      - "GET endpoints scoped to own insurer resources"
