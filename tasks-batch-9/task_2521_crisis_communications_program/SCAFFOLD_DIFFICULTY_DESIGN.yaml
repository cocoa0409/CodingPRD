  - rule_id: transitive_cascade
    instances:
      - name: cascade_reject_voids_sibling_blocks_notice_and_restricts_posture
        grounds:
          - state_machines.ApprovalTask.PENDING_to_REJECTED
          - state_machines.Statement.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.StakeholderNotice.QUEUED_to_BLOCKED
          - entities.Incident.fields.open_approval_task_count
          - entities.Incident.fields.blocked_notice_count
          - entities.Incident.fields.comms_posture
          - endpoints.POST_/crisis/approval-tasks/{task_id}/decide
        distinguishing_aspect: |
          Depth 4 and each hop is caused by the previous one, not by the request: rejecting one task
          (hop 1) forces the statement into REVISION_REQUESTED (hop 2), which voids the untouched
          sibling task and blocks the statement's queued notice (hop 3), whose blocked count is what
          drives comms_posture to RESTRICTED (hop 4).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "SEV2 incident ACTIVATED (escalated MEDIA signal scoring 83.00) so approval_quorum_requirement is 2 (INCIDENT_LEAD + LEGAL_COUNSEL)."
            - "INCIDENT_LEAD and LEGAL_COUNSEL seats ACKNOWLEDGED; the comms lead is the drafter and holds no approval seat."
            - "One HOLDING statement with one QUEUED EMPLOYEE notice, submitted for review so both approval tasks are PENDING and open_approval_task_count == 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
