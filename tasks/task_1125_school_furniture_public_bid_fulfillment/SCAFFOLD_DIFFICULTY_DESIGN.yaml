            - { call: "POST /v1/purchase-orders/${po1}/cancel", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (state check at priority 6 fires before the fiscal cap check at priority 15)"
            - "The response is NOT ERR_DISTRICT_FISCAL_CAP_EXCEEDED even though 220000 > 200000"

      - name: poline_create_temporal_error_beats_spec_version_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_referential): creating a PO line
          after award.order_by_date while the spec has drifted from the award pin (spec_version 2
          vs pinned 1) must return ERR_ORDER_WINDOW_CLOSED (priority 8), never
          ERR_SPEC_VERSION_STALE (priority 9) — a different category pair than state-vs-fiscal.
        test_recipe:
          setup:
            - "District D1; coop award (order_by_date 2026-06-01) accepted with awarded_spec_version pinned at 1; spec then amended (addendum + re-publish -> spec_version 2, pin now stale); clock advanced to 2026-06-02 (past order_by_date); PO created"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id, award_pin: $.data.awarded_spec_version } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/bid-specs/${specA}/issue-addendum", payload: { addendum_note: "post-award clarification" }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { spec_v_now: $.data.spec_version } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "award_pin == 1 and spec_v_now == 2 (referential violation armed)"
            - "Clock 2026-06-02 > order_by_date 2026-06-01 (temporal violation armed)"
            - "err == ERR_ORDER_WINDOW_CLOSED (temporal at priority 8 beats referential at priority 9)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: coop_tier_boundary_exactly_100th_unit_prices_tier2
        grounds:
          - calculations.coop_tiered_unit_price
          - validations[priority=13]
        distinguishing_aspect: |
          Boundary on cumulative unit index reachable via POST /v1/po-lines: with cumulative base
          90 and qty 10, the 100th unit satisfies u >= min_qty 100 and prices at tier-2 10500 —
          total 118500 (9 x 12000 + 1 x 10500); a '>' reading would give 120000. Different metric
          (cumulative unit index) and endpoint than the warranty date boundary.
        test_recipe:
          setup:
            - "District D1; coop tiers 1:12000/100:10500; spec/line qty 500 cap 13000; COOP award accepted; PO-1 line qty 90 (cumulative 90); PO-2 awaiting a qty-10 line"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 90 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-2", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po2: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po2}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { ln: $.data.id, ln_total: $.data.line_total_cents, ln_unit: $.data.computed_unit_price_cents } }
          assert:
            - "ln_total == 118500 (units 91..99 at 12000 = 108000; unit 100 at 10500 because u >= min_qty)"
            - "ln_unit == 11850 (round_half_up(118500 / 10))"
            - "ln_total != 120000 (a '>' boundary reading) and != 105000 (all-tier-2 reading)"

      - name: warranty_claim_on_exact_expiry_day_valid_next_day_rejected
        grounds:
          - calculations.warranty_coverage_cents
          - validations[priority=8]
        distinguishing_aspect: |
          Boundary on a calendar date reachable via POST /v1/warranty-claims: filing exactly on
          base_end (installed_at 2026-07-08 + 5 years = 2031-07-08) is valid ('<=' inclusive),
          while filing one day later (2031-07-09) returns ERR_WARRANTY_EXPIRED — a different
          metric (date vs cumulative unit index) and endpoint than the coop tier boundary.
        test_recipe:
          setup:
            - "District D1 (not enrolled); flat award warranty_years 5; PO with lines L1 and L2 qty 5 each (same spec line), both delivered and installed with completion clock 2026-07-08 -> installed_at 2026-07-08; base_end 2031-07-08"
