            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid2}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T11:10:00Z", scheduled_end: "2026-06-01T12:10:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ROOM_BUFFER_CONFLICT"
            - "trigger response HTTP status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: visit_pool_conserved_on_schedule_then_cancel
        grounds:
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - entities.InsuranceAuthorization.fields.visits_used
          - calculations.care_plan_responsibility
        distinguishing_aspect: |
          Conserved quantity = authorized visit pool: schedule (+1) then cancel (-1) leaves
          visits_used == count of non-CANCELLED sessions == 0.
        test_recipe:
          setup:
            - "ACTIVE plan; APPROVED auth (5 visits); one scheduled session."
