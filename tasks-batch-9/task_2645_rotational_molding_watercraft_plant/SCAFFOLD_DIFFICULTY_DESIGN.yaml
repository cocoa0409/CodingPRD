          setup:
            - "ProductModel PM-P5-KM: KAYAK/MID, msrp_cents 300000, warranty_basis FLAT_SCHEDULE, initial_warranty_reserve_cents 500000, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, min_cooling_minutes 30, wall_cv_max_pct 12.00, wall_thickness_min_mm 4.50, impact_test_min_joules 90.00."
            - "Mold MLD-P5-2 with cavity_count 2 and nominal_charge_kg 24.000 == 12.000 * 2 (so one cycle yields the two hulls the two claims need), OvenStation OV-1, CoolingBay CB-1 FORCED_AIR, four ACTIVE Technicians with MOLDING_OPERATOR, ASSEMBLY_TECH and QUALITY_INSPECTOR held by three distinct rows."
