# =============================================================================
# task_1498 — §1.9 Scaffold Corner Design (breadth coverage beyond §1.8)
# Sections follow references/claim-extraction-guide.md. Clock default is
# 2026-08-01T00:00:00Z unless set. Instances already exercised as §1.8 failure
# paths carry excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: project_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Project.fields.contingency_days, entities.Project.fields.status, entities.Project.fields.posture]
        distinguishing_aspect: "Omitting contingency_days yields 0; new project is PLANNING/CLEAR with delay and LD counters at 0 and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Defaults", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { st: "$.data.status", po: "$.data.posture", cd: "$.data.contingency_days", dl: "$.data.cumulative_delay_days", ld: "$.data.liquidated_damages_cents", v: "$.data.version" } }
          trigger: []
          assert:
            - "st == PLANNING and po == CLEAR"
            - "cd == 0 (default applied) and dl == 0 and ld == 0 and v == 1"
      - name: parcel_panel_upgrade_computed_at_80_percent
        claim_type: computed_field
        grounds: [entities.Parcel.fields.panel_upgrade_required, calculations.panel_upgrade_rule]
        distinguishing_aspect: "load 80 vs panel 100 => 80 >= 0.8*100 exactly => true; load 79 => false. Client-supplied panel_upgrade_required is rejected as unknown input."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "PanelCalc", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
          trigger:
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "1 A St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 80 }, as: RightOfWayAgent, captures: { req80: "$.data.panel_upgrade_required" } }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "2 A St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 79 }, as: RightOfWayAgent, captures: { req79: "$.data.panel_upgrade_required" } }
          assert:
            - "req80 == true (exactly 80% triggers the upgrade — >= boundary)"
            - "req79 == false"
      - name: get_participation_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/participations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProgramManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"
      - name: create_segment_missing_required_field
        claim_type: required_fields
        grounds: [entities.TrenchSegment.fields.max_depth_inches, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required max_depth_inches fails with ERR_VALIDATION 400 before any state is persisted."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "ReqFields", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
          trigger:
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-X", length_ft: 100 }, as: ProgramManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"
      - name: actual_cost_entry_is_immutable
        claim_type: immutability
        grounds: [entities.ActualCostEntry]
        distinguishing_aspect: "common_fields:false — the entry exposes id + created_at but no version/updated_at; no PUT/PATCH/DELETE endpoint exists for it."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Immutable", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/actual-cost-entries", payload: { project_id: "${proj}", cost_code: JOINT_TRENCH, amount_cents: 12345, incurred_on: "2026-09-01T00:00:00Z" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { ace: "$.data.id" } }
          trigger:
            - { call: "GET /api/actual-cost-entries/${ace}", payload: {}, as: FinanceAnalyst, captures: { sub: "$.data.submitted_by_user_id", amt: "$.data.amount_cents" } }
          assert:
            - "sub == 'fin-1' (system-stamped from X-User-ID) and amt == 12345"
            - "response has no version and no updated_at keys (append-only entity)"
  # ============================================================ state machines
  - section: state_machines
    instances:
      - name: easement_draft_to_signed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Easement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> SIGNED skips REQUESTED; rejected with ERR_INVALID_STATE, status stays DRAFT."
        test_recipe:
          setup: ["project + parcel + DRAFT easement"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM1", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "1 B St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 50 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: ACCESS }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
          trigger:
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: withdrawn_participation_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.UtilityParticipation]
        distinguishing_aspect: "WITHDRAWN is terminal: any further transition attempt fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["project + INVITED participation withdrawn"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM2", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: WITHDRAWN }, as: UtilityCoordinator, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (terminal lockdown)"
      - name: slot_install_failed_retry_cycle
        claim_type: valid_transition
        grounds: [state_machines.OccupancySlot.INSTALL_FAILED_to_INSTALLING]
        distinguishing_aspect: "INSTALLING -> INSTALL_FAILED -> INSTALLING retry loop is legal; deeper-first gate re-applies on retry."
        test_recipe:
          setup: ["mobilized 2-party project, segment EXCAVATING, one RESERVED electric slot"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM3", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 1, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "2 B St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 50 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p1}", depth_top_inches: 36, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: INSTALLING }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: INSTALL_FAILED }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { st1: "$.data.status" } }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: INSTALLING }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { st2: "$.data.status" } }
          assert:
            - "st1 == INSTALL_FAILED"
            - "st2 == INSTALLING (retry cycle re-enters INSTALLING)"
      - name: segment_reopen_cycle_backfilled_to_excavating
        claim_type: valid_transition
        grounds: [state_machines.TrenchSegment]
        distinguishing_aspect: "BACKFILLED -> EXCAVATING reopen is legal when easement/permit gates still hold — the trench machine is cyclic, not linear."
        test_recipe:
          setup: ["segment driven EXCAVATING -> BACKFILLING -> BACKFILLED (no slots)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM4", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 6000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 4000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "3 B St", owner_name: "O", existing_panel_amps: 100, load_calc_amps: 50 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLED }, as: ProgramManager }
          trigger:
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager, captures: { st: "$.data.status" } }
          assert:
            - "st == EXCAVATING (reopen cycle succeeds)"
      - name: outage_reschedule_cycle_resets_notification
        claim_type: valid_transition
        grounds: [state_machines.OutageWindow.NOTIFIED_to_PROPOSED, entities.OutageWindow.fields.notified_at]
        distinguishing_aspect: "NOTIFIED -> PROPOSED reschedule replaces the window and resets notified_at to null; the cycle requires re-approval and re-notification."
        test_recipe:
          setup: ["approved+notified outage starting 2026-09-05T10:00 (clock 2026-09-01T09:00, lead > 72h)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM5", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 1, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/outage-windows", payload: { project_id: "${proj}", feeder_id: "F9", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T14:00:00Z" }, as: ProgramManager, captures: { ow: "$.data.id" } }
            - { call: "POST /api/outage-windows/${ow}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/outage-windows/${ow}/transition", payload: { to: NOTIFIED }, as: UtilityCoordinator, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/outage-windows/${ow}/transition", payload: { to: PROPOSED, new_start_at: "2026-09-20T10:00:00Z", new_end_at: "2026-09-20T14:00:00Z" }, as: ProgramManager, captures: { st: "$.data.status", na: "$.data.notified_at", sa: "$.data.start_at" } }
          assert:
            - "st == PROPOSED and na == null (notification voided) and sa == '2026-09-20T10:00:00Z'"
      - name: change_order_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.ChangeOrder.PRICED_to_PROPOSED, entities.ChangeOrder.fields.revision_count]
        distinguishing_aspect: "PRICED -> PROPOSED revision loop increments revision_count and clears pricing fields; re-pricing then allows approval."
        test_recipe:
          setup: ["project + PRICED change order"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM6", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "revise me" }, as: ProgramManager, captures: { co: "$.data.id" } }
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: PRICED, delta_cost_cents: 1000, delta_delay_days: 1, delay_cause: NEGLIGENT }, as: ProgramManager }
          trigger:
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: PROPOSED }, as: ProgramManager, captures: { rc: "$.data.revision_count", st: "$.data.status" } }
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: PRICED, delta_cost_cents: 2000, delta_delay_days: 0, delay_cause: EXCUSABLE }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: APPROVED }, as: ProgramManager, captures: { st2: "$.data.status" } }
          assert:
            - "st == PROPOSED and rc == 1"
            - "st2 == APPROVED after re-pricing"
      - name: withdrawal_releases_slots_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.UtilityParticipation]
        excluded_because:
          difficulty_instance: participation_withdrawal_cascade
          rationale: "Slot RELEASED + depth recompute asserted hop-by-hop in the §1.8 cascade instance."
      - name: participation_installed_requires_slots_terminal
        claim_type: precondition_enforcement
        grounds: [state_machines.UtilityParticipation.MOBILIZED_to_INSTALLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A MOBILIZED participation holding a merely-RESERVED slot cannot reach INSTALLED."
        test_recipe:
          setup: ["mobilized project, participation MOBILIZED with one RESERVED slot"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM8", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 9999, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 1, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: MOBILIZED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60 }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p1}", depth_top_inches: 36, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /api/participations/${p1}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (slot still RESERVED, not VERIFIED|RELEASED)"
  # ============================================================ calculations
  - section: calculations
    instances:
      - name: posture_conditional_on_refused_easement
        claim_type: correct_result
        grounds: [calculations.project_posture, entities.Project.fields.posture]
        distinguishing_aspect: "A REFUSED TRENCH easement (no approved CO, no variance) yields CONDITIONAL — the middle tier of the three-level priority."
        test_recipe:
          setup: ["project with parcel whose TRENCH easement is REFUSED"]
          setup_api_calls:
