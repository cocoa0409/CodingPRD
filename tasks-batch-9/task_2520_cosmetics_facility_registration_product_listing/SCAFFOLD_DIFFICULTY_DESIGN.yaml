            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/renewals"
              payload: { renewal_kind: "STANDARD" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { new_period_id: $.data.id, new_kind: $.data.period_kind, new_start: $.data.period_start, new_end: $.data.period_end }
          assert:
            - "before the trigger: Facility.${fac_id}.registration_status == LAPSED with compliance_posture FROZEN, ProductListing.${lst_id}.listing_status == SUSPENDED with suspension_reason FACILITY_LAPSED, ResponsiblePerson.${rp_id}.active_designation_count == 0 and status DORMANT, Facility.${fac_id}.listed_product_count == 0"
            - "${new_kind} == LATE_RENEWAL (the filing date 2028-08-01 is past the prior period_end)"
            - "${new_start} == 2028-08-01 and ${new_end} == 2030-07-31: the successor starts the day AFTER the prior period ended, so the biennial timeline is gap-free despite the lapse"
            - "RegistrationPeriod.${new_period_id}.sequence_index == 2, status == ACTIVE, renewal_window_open_date == 2030-05-02, grace_end_date == 2030-09-29; the sequence_index 1 period is EXPIRED"
            - "compensation: ProductListing.${lst_id}.listing_status == LISTED with suspension_reason null, ResponsiblePerson.${rp_id}.active_designation_count == 1 with status ACTIVE, and Facility.${fac_id}.listed_product_count == 1 — exactly the quantities the lapse released, no more"
            - "Facility.${fac_id}.registration_status == REGISTERED, registration_cycle_count == 2, compliance_posture == OPEN, current_period_end == 2030-07-31"
            - "NOT compensated: SafetySubstantiation.${sub_id}.status is still REVALIDATION_REQUIRED and ProductListing.${lst_id}.safety_status is still REVALIDATION_REQUIRED, so marketable is still false — the de-escalation does not reverse the revalidation cascade"
            - "the facility ledger holds one POSTURE_CHANGE entry with posture_before FROZEN and posture_after OPEN plus exactly one STATE_TRANSITION entry for the restored listing"
