              as_user_id: "cm-enf"
              captures: { case_b2: $.data.id }
          trigger:
            - call: "POST /drinkware/enforcement-cases/${case_b1}/resolve"
              payload: { outcome: "ESCALATED_LEGAL", resolution_notes: "counter-notice received" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { c_dealer_vb: $.data.version }
            - call: "POST /drinkware/enforcement-cases/${case_b1}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "BRAND_STANDARD", resolution_notes: "legal confirmed", expected_dealer_version: "${c_dealer_vb}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/enforcement-cases/${case_b2}/resolve"
              payload: { outcome: "DISMISSED", resolution_notes: "legitimate secondhand listing" }
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "case_b1 reached ESCALATED_LEGAL then CONFIRMED_VIOLATION with infraction_points == 3 (BRAND_STANDARD row of the table)"
            - "case_b2 is DISMISSED and contributes 0 points"
            - "Dealer.${c_dealer}.infraction_points == 3 and status == AUTHORIZED (below 8)"

      - name: qc_fail_rework_loop_then_pass_captures_payment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CustomizationOrder.schedule_status
          - state_machines.CustomizationOrder.payment_status
        distinguishing_aspect: "The schedule axis cycles CONFIRMED -> IN_PRODUCTION -> CONFIRMED on a FAIL (qc_fail_count 1, reservation untouched) and a later PASS lands COMPLETE with payment CAPTURED and reservation CONSUMED — minutes stay booked because capacity was spent."
        test_recipe:
          setup:
            - "Clock set; canonical pipeline driven to IN_PRODUCTION."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
            - *c_reserve
            - *c_proof
            - *c_approve
            - *c_lock
            - *c_start
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/complete-production"
              payload: { qc_outcome: "FAIL" }
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${c_order}/start-production"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${c_order}/complete-production"
              payload: { qc_outcome: "PASS" }
              as: ProductionLead
              as_user_id: "pl-1"
              captures: { c_order_done: $.data.id }
          assert:
            - "after FAIL: schedule_status == CONFIRMED and qc_fail_count == 1 (rework loop), payment_status still AUTHORIZED"
            - "after re-start + PASS: schedule_status == COMPLETE, payment_status == CAPTURED, reservation_status == CONSUMED"
            - "CustomizationOrder.${c_order}.completed_at is set"
            - "PrintSlot.${c_slot}.booked_minutes == 40 (CONSUMED minutes remain booked)"

      - name: order_created_with_all_axes_at_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.CustomizationOrder
