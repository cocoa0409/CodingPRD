      - name: empty_takeoff_submit_rejected_at_zero_active_lines
        grounds:
          - validations[priority=18]
          - errors[ERR_EMPTY_TAKEOFF]
        distinguishing_aspect: |
          Empty-collection / zero-count boundary on a different metric (number
          of ACTIVE TakeoffLine rows) and a different endpoint
          (POST /supply/takeoffs/{id}/submit). Submitting a takeoff whose only
          line has been soft-cancelled is rejected with ERR_EMPTY_TAKEOFF; adding
          one ACTIVE line succeeds.
        test_recipe:
          setup:
            - "Account ACTIVE, project exists, product exists"
            - "Takeoff T1 with one line; the line is then DELETE-cancelled (line_status=CANCELLED), leaving zero ACTIVE lines"
          setup_api_calls:
