      - name: natural_key_duplicates_each_return_their_own_duplicate_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_SKU]
          - errors[ERR_DUPLICATE_FAMILY_CODE]
          - errors[ERR_DUPLICATE_CHANNEL_CODE]
          - validations[priority 32]
        distinguishing_aspect: "One validation row guards three natural keys but raises three distinct error ids, and the uniqueness is on the key alone: the second request differs in every other field and is still refused."
        test_recipe:
          setup:
            - "AncillaryProduct BAG_CHECKED_1, FareFamily ECO_LITE and DistributionChannel DIRECT_WEB each exist exactly once"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "Second checked bag priced differently", category: "SEAT", list_price_cents: 9900, tax_treatment: "EXEMPT", revenue_class: "AIR", revenue_account_code: "4999" }
              as: MerchandisingAnalyst
