            - "response.data.error_id == ERR_DEFECT_NOT_COVERED"

      - name: issue_rma_after_warranty_expired_returns_warranty_expired
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_WARRANTY_EXPIRED]
          - state_machines.Registration.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          A claim filed in-window but whose registration is swept to EXPIRED before RMA issuance is
