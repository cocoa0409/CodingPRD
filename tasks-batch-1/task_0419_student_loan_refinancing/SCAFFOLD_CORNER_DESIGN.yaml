            - "HTTP status == 403"

      - name: err_cosigner_not_consented_on_lock
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COSIGNER_NOT_CONSENTED]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_lock_requires_cosigner_consented
          rationale: "Offer lock rejected with ERR_COSIGNER_NOT_CONSENTED while the attached cosigner is INVITED is the named §1.8 instance."

      - name: err_invalid_state_disbursement_send_loan_forbearance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
          - state_machines.Disbursement.SCHEDULED_to_SENT
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / disbursement_send_requires_loan_current
          rationale: "Disbursement send rejected with ERR_INVALID_STATE while the parent Loan is FORBEARANCE is the named §1.8 instance."

