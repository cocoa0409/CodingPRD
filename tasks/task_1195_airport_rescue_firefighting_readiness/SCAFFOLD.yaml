    roles: [ArffChief]
    code: 201
    input: [employee_no, full_name]
    output: Firefighter
    side_effects: ["Recompute supported_index_by_staffing (new firefighter is not yet training-current)"]
  - method: GET
    path: "/arff/firefighters"
    description: "List firefighters"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Firefighter[]"
    side_effects: []
  - method: GET
    path: "/arff/firefighters/{id}"
    description: "Get one firefighter (Firefighter role: own id only)"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: Firefighter
    side_effects: []
  - method: GET
    path: "/arff/firefighters/{id}/training-records"
    description: "List a firefighter's live-fire training records"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "LiveFireTrainingRecord[]"
    side_effects: []
  - method: POST
    path: "/arff/firefighters/{id}/suspend"
    description: "Suspend a firefighter (ACTIVE -> SUSPENDED)"
    roles: [ArffChief]
    code: 200
    input: []
    output: Firefighter
    side_effects: ["Staffing/effective-index recompute with notification rules; increment AirportOpsProfile.version"]
  - method: POST
    path: "/arff/firefighters/{id}/reactivate"
    description: "Reactivate a firefighter (SUSPENDED -> ACTIVE)"
    roles: [ArffChief]
    code: 200
    input: []
    output: Firefighter
    side_effects: ["Staffing/effective-index recompute with notification rules; increment AirportOpsProfile.version"]
  - method: POST
    path: "/arff/live-fire-training-records"
    description: "Record a live-fire training completion"
    roles: [ArffChief]
    code: 201
    input: [firefighter_id, completed_on, drill_type, result]
    output: LiveFireTrainingRecord
    side_effects:
      - "On PASS: recompute firefighter.last_live_fire_completed_on, is_training_current, is_deployable"
      - "Recompute supported_index_by_staffing, effective_index, index_compliance_status; increment AirportOpsProfile.version; apply notification create/resolve rules"

  # --- Response drills ---
  - method: POST
    path: "/arff/response-drills"
    description: "Schedule a response drill on a runway (half-open window overlap among SCHEDULED drills on the same runway is rejected)"
    roles: [ArffChief]
    code: 201
    input: [runway_designator, scheduled_start, scheduled_end]
    output: ResponseDrill
    side_effects: []
  - method: GET
    path: "/arff/response-drills"
    description: "List response drills"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["runway_designator?", "status?", "limit?", "offset?"]
    output: "ResponseDrill[]"
    side_effects: []
  - method: GET
    path: "/arff/response-drills/{id}"
    description: "Get one response drill"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: ResponseDrill
    side_effects: []
  - method: POST
    path: "/arff/response-drills/{id}/execute"
    description: "Record measured arrival times; computes outcome (SCHEDULED -> EXECUTED)"
    roles: [ArffChief]
    code: 200
    input: [first_vehicle_arrival_seconds, all_vehicles_arrival_seconds]
    output: ResponseDrill
    side_effects: ["Compute outcome per drill_outcome_threshold"]
  - method: POST
    path: "/arff/response-drills/{id}/certify"
    description: "Certify an executed drill (EXECUTED -> CERTIFIED; requires outcome PASS)"
    roles: [ArffChief]
    code: 200
    input: []
    output: ResponseDrill
    side_effects: []
  - method: POST
    path: "/arff/response-drills/{id}/fail"
    description: "Record a failed drill disposition (EXECUTED -> FAILED)"
    roles: [ArffChief]
    code: 200
    input: []
    output: ResponseDrill
    side_effects: []

  # --- Index determinations (OCC) ---
  - method: POST
    path: "/arff/index-determinations"
    description: "Create an index determination; supersedes the previous ACTIVE determination and re-certificates the profile"
    roles: [AirportManager]
    code: 201
    input: [largest_aircraft_id, new_certificated_index, expected_profile_version]
    output: IndexDetermination
    side_effects:
      - "Previous ACTIVE determination -> SUPERSEDED; supersedes_determination_id recorded"
      - "profile.certificated_index = new_certificated_index; recompute effective_index/compliance; increments AirportOpsProfile.version by 1"

  # --- Incidents ---
  - method: POST
    path: "/arff/incidents"
    description: "Report an alert incident"
    roles: [ArffChief]
    code: 201
    input: [alert_level, location, "aircraft_id?"]
    output: AlertIncident
    side_effects: []
  - method: GET
    path: "/arff/incidents"
    description: "List incidents"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["status?", "alert_level?", "limit?", "offset?"]
    output: "AlertIncident[]"
    side_effects: []
  - method: GET
    path: "/arff/incidents/{id}"
    description: "Get one incident"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: AlertIncident
    side_effects: []
  - method: POST
    path: "/arff/incidents/{id}/respond"
    description: "Begin response (REPORTED -> RESPONDING; index sufficiency gate)"
    roles: [ArffChief]
    code: 200
    input: []
    output: AlertIncident
    side_effects: []
  - method: POST
    path: "/arff/incidents/{id}/control"
    description: "Mark incident controlled (RESPONDING -> CONTROLLED; sets controlled_at)"
    roles: [ArffChief]
    code: 200
    input: []
    output: AlertIncident
    side_effects: []
  - method: POST
    path: "/arff/incidents/{id}/close"
    description: "Close incident (CONTROLLED -> CLOSED; blocked by open mutual-aid requests)"
    roles: [ArffChief]
    code: 200
    input: []
    output: AlertIncident
    side_effects: []
  - method: PATCH
    path: "/arff/incidents/{id}/alert-level"
    description: "Escalate the alert level (REPORTED/RESPONDING only; strictly increasing)"
    roles: [ArffChief]
    code: 200
    input: [alert_level]
    output: AlertIncident
    side_effects: []
  - method: GET
    path: "/arff/incidents/{id}/mutual-aid-requests"
    description: "List mutual-aid requests for an incident"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "MutualAidRequest[]"
    side_effects: []
  - method: GET
    path: "/arff/incidents/{id}/reports"
    description: "List incident reports for an incident"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

  # --- Mutual aid ---
  - method: POST
    path: "/arff/mutual-aid-agreements"
    description: "Create a mutual-aid agreement (closed-window overlap per partner among DRAFT/ACTIVE is rejected)"
    roles: [AirportManager]
    code: 201
    input: [partner_airport_code, max_alert_level, start_date, end_date]
    output: MutualAidAgreement
    side_effects: []
  - method: GET
    path: "/arff/mutual-aid-agreements"
    description: "List mutual-aid agreements"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["partner_airport_code?", "status?", "limit?", "offset?"]
    output: "MutualAidAgreement[]"
    side_effects: []
  - method: GET
    path: "/arff/mutual-aid-agreements/{id}"
    description: "Get one mutual-aid agreement"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: MutualAidAgreement
    side_effects: []
  - method: POST
    path: "/arff/mutual-aid-agreements/{id}/activate"
    description: "Activate an agreement (DRAFT -> ACTIVE)"
    roles: [AirportManager]
    code: 200
    input: []
    output: MutualAidAgreement
    side_effects: []
  - method: POST
    path: "/arff/mutual-aid-agreements/{id}/terminate"
    description: "Terminate an agreement (ACTIVE -> TERMINATED)"
    roles: [AirportManager]
    code: 200
    input: []
    output: MutualAidAgreement
    side_effects: []
  - method: GET
    path: "/arff/mutual-aid-agreements/{id}/mutual-aid-requests"
    description: "List mutual-aid requests made under an agreement"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "MutualAidRequest[]"
    side_effects: []
  - method: POST
    path: "/arff/incidents/{id}/mutual-aid-requests"
