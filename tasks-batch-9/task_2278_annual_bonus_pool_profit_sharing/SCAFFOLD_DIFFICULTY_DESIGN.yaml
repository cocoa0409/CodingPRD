              as_user_id: "${unit_id}"
            - call: "POST /bu-pools/${pool_id}/scorecard-decision"
              payload: { decision: "CERTIFY" }
              as: CompensationCommittee
              as_user_id: "cc_scorecard"
            - call: "POST /bonus-plans/${plan_id}/target-assignments"
              payload: {}
