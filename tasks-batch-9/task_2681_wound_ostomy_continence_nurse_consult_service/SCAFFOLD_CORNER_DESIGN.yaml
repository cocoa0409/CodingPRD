            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents == 226000"
            - "Derivation: days 1-7 at TIER_1_FACTOR 1.0 = 7 * 10000 = 70000; days 8-21 at TIER_2_FACTOR 0.9 = 14 * 9000 = 126000; days 22-25 at TIER_3_FACTOR 0.75 = 4 * 7500 = 30000"
