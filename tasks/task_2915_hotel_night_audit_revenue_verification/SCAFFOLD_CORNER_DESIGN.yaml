        grounds: ["errors[ERR_CHARGE_TYPE_NOT_POSTABLE]", "errors[ERR_TICKET_FOLIO_REQUIRED]", "errors[ERR_CROSS_PROPERTY_REFERENCE]", "errors[ERR_INVALID_REQUEST]", "validations[priority=70]", "validations[priority=71]", "validations[priority=73]"]
        distinguishing_aspect: "These four are the pure body-shape family: a value that is a legal enum member but not client-postable, a field that is required or forbidden depending on a sibling field's value, two ids that individually resolve but belong to different properties, and a body that is not an object at all."
