# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1515: Title I Funding & Program Compliance
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: equitable_share_variant_divergence
        grounds:
          - calculations.equitable_services_share
          - entities.DistrictGrant.fields.equitable_count_method
          - entities.EquitableServicesConsultation.fields.agreed_low_income_count
        distinguishing_aspect: |
          Same private-school data (P1 verified 50, P2 verified 30; signed agreed
          counts 55 and 30) yields two different EQUITABLE_SERVICES minimums on two
          otherwise identical grants: VERIFIED_COUNT -> 6042553 cents vs
          CONSULTATION_AGREED -> 6393008 cents. Entity domain: private-school
          equitable services (distinct from the grant-ledger domain of the sibling
          instance).
        test_recipe:
          setup:
            - "Four schools S1..S4 (400/500, 300/500, 200/500, 195/500 low-income/total)"
            - "Two verified private schools P1 (50) and P2 (30)"
            - "Grant GV: FY2027, total 100000000, admin_reserve 5000000, method VERIFIED_COUNT"
            - "Grant GC: FY2032, identical amounts, method CONSULTATION_AGREED"
            - "GC has AFFIRMATION_SIGNED consultations for P1 (agreed 55) and P2 (agreed 30)"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Alpha Elementary", nces_id: "000001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Beta Middle", nces_id: "000002", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Gamma High", nces_id: "000003", grade_span_low: 9, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Delta Elementary", nces_id: "000004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "St Mary", low_income_resident_count: 50, contact_email: "om@stmary.example", nonprofit_verified: true }, as: ComplianceAnalyst, captures: { p1: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "Grace Academy", low_income_resident_count: 30, contact_email: "om@grace.example", nonprofit_verified: true }, as: ComplianceAnalyst, captures: { p2: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2027, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gv: $.data.id, gv_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s2}", low_income_student_count: 300, total_student_count: 500 }, { school_id: "${s3}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_v: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_v}/certify", payload: { expected_grant_version: "${gv_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2032, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "CONSULTATION_AGREED" }, as: FederalProgramsDirector, captures: { gc: $.data.id, gc_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gc}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s2}", low_income_student_count: 300, total_student_count: 500 }, { school_id: "${s3}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_c: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_c}/certify", payload: { expected_grant_version: "${gc_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/equitable-services-consultations", payload: { grant_id: "${gc}", private_school_id: "${p1}" }, as: ComplianceAnalyst, captures: { con1: $.data.id } }
            - { call: "POST /title-i/equitable-services-consultations/${con1}/record-session", payload: { session_date: "2026-08-01", topics: "needs assessment", attendee_count: 4 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/equitable-services-consultations/${con1}/record-session", payload: { session_date: "2026-08-01", topics: "funding share", attendee_count: 4 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/equitable-services-consultations/${con1}/sign-affirmation", payload: { agreed_low_income_count: 55 }, as: PrivateSchoolOmbudsman, as_user_id: "omb-1" }
            - { call: "POST /title-i/equitable-services-consultations", payload: { grant_id: "${gc}", private_school_id: "${p2}" }, as: ComplianceAnalyst, captures: { con2: $.data.id } }
            - { call: "POST /title-i/equitable-services-consultations/${con2}/record-session", payload: { session_date: "2026-08-01", topics: "needs assessment", attendee_count: 3 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/equitable-services-consultations/${con2}/record-session", payload: { session_date: "2026-08-01", topics: "service delivery", attendee_count: 3 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/equitable-services-consultations/${con2}/sign-affirmation", payload: { agreed_low_income_count: 30 }, as: PrivateSchoolOmbudsman, as_user_id: "omb-2" }
            - { call: "POST /title-i/grants/${gc}/lock-rankings", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${gv}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gc}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${gv}", category: "EQUITABLE_SERVICES" }, as: FederalProgramsDirector, captures: { eq_v: "$.data[0].minimum_cents" } }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${gc}", category: "EQUITABLE_SERVICES" }, as: FederalProgramsDirector, captures: { eq_c: "$.data[0].minimum_cents" } }
          assert:
            - "SetAside(grant ${gv}, EQUITABLE_SERVICES).minimum_cents == 6042553"
            - "SetAside(grant ${gc}, EQUITABLE_SERVICES).minimum_cents == 6393008"
            - "reserved_cents == minimum_cents on both rows at finalize"
            - "the two values differ although both grants have identical financial inputs — only the count-method variant differs"

      - name: carryover_provisional_vs_final_divergence
        grounds:
          - calculations.carryover_computation
          - entities.DistrictGrant.fields.provisional_carryover_cents
          - entities.DistrictGrant.fields.final_carryover_cents
        distinguishing_aspect: |
          Grant-ledger domain (distinct from the equitable-services domain of the
          sibling instance): with one ALLOWED 3000000-cent expenditure and one
          PENDING_REVIEW 1000000-cent expenditure, the PROVISIONAL variant reads
          16000000 cents (8000 bp) while the FINAL variant after disallow+reclassify
          and close-out reads 17000000 cents (8500 bp) — same ledger events,
          different inclusion sets.
        test_recipe:
          setup:
            - "Grant GE: FY2033, total 20000000, admin 0, VERIFIED_COUNT; one school SE (60/100)"
            - "Allocation SE certified; expenditure E1 3000000 ALLOWED; expenditure E2 1000000 PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Elias Elementary", nces_id: "000101", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { se: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2033, total_allocation_cents: 20000000, poverty_measure: "FREE_REDUCED_LUNCH", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { ge: $.data.id, ge_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${ge}", measure: "FREE_REDUCED_LUNCH", entries: [ { school_id: "${se}", low_income_student_count: 60, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_e: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_e}/certify", payload: { expected_grant_version: "${ge_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${ge}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${ge}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${ge}", school_id: "${se}" }, as: FederalProgramsDirector, captures: { ae: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${ae}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${ge}", school_allocation_id: "${ae}", amount_cents: 3000000, function_code: "INSTRUCTION", description: "tutor salaries", incurred_date: "2032-09-15", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e1: $.data.id } }
            - { call: "POST /title-i/expenditures/${e1}/review", payload: { decision: "ALLOW" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${ge}", school_allocation_id: "${ae}", amount_cents: 1000000, function_code: "INSTRUCTION", description: "curriculum materials", incurred_date: "2032-10-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e2: $.data.id } }
            - { call: "GET /title-i/grants/${ge}", payload: {}, as: FederalProgramsDirector, captures: { prov_c: $.data.provisional_carryover_cents, prov_bp: $.data.provisional_carryover_pct_bp } }
          trigger:
            - { call: "POST /title-i/expenditures/${e2}/review", payload: { decision: "DISALLOW", disallow_reason: "UNALLOWABLE_COST", review_note: "not allocable" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/expenditures/${e2}/reclassify", payload: { reclassified_to_fund_source: "NON_TITLE_I_LOCAL" }, as: ComplianceAnalyst }
            - { call: "POST /title-i/grants/${ge}/request-carryover-waiver", payload: { justification: "unusual mid-year staffing vacancy delayed the tutoring program launch significantly" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${ge}/decide-carryover-waiver", payload: { decision: "GRANT" }, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/grants/${ge}/close-out", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/grants/${ge}", payload: {}, as: FederalProgramsDirector, captures: { fin_c: $.data.final_carryover_cents, fin_bp: $.data.final_carryover_pct_bp } }
          assert:
            - "provisional read before disallow: provisional_carryover_cents == 16000000 and provisional_carryover_pct_bp == 8000 (pending counted as encumbered)"
            - "after close-out: final_carryover_cents == 17000000 and final_carryover_pct_bp == 8500 (disallowed/reclassified excluded)"
            - "DistrictGrant.status == CLOSED_OUT and the two variants differ by exactly the 1000000-cent reclassified charge"

  - rule_id: combinatorial_formula
    instances:
      - name: set_aside_floor_and_threshold_interaction
        grounds:
          - calculations.set_aside_minimums
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: PE branches on
          total_allocation_cents strictly greater than 50000000; HOMELESS takes
          max(500000, 0.5% of net); PD takes 5% of net. Grant G2 (total exactly
          50000000) -> PE 0; grant G2B (total 50000100, one dollar over) -> PE 500001,
          while HOMELESS stays at the 500000 floor for both.
        test_recipe:
          setup:
            - "Grant G2: FY2028, total 50000000, admin 0; school SG2 (40/100)"
            - "Grant G2B: FY2034, total 50000100, admin 0; same school"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Boundary Elementary", nces_id: "000201", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sg2: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2028, total_allocation_cents: 50000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g2: $.data.id, g2_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g2}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sg2}", low_income_student_count: 40, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_g2: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_g2}/certify", payload: { expected_grant_version: "${g2_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g2}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g2}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2034, total_allocation_cents: 50000100, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g2b: $.data.id, g2b_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g2b}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sg2}", low_income_student_count: 40, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_g2b: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_g2b}/certify", payload: { expected_grant_version: "${g2b_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g2b}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g2b}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${g2}" }, as: FederalProgramsDirector }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${g2b}" }, as: FederalProgramsDirector }
          assert:
            - "G2 PARENT_ENGAGEMENT.minimum_cents == 0 (total == 50000000 is NOT strictly greater)"
            - "G2 HOMELESS_SERVICES.minimum_cents == 500000 (floor wins over 0.5% of net = 250000)"
            - "G2 PROFESSIONAL_DEVELOPMENT.minimum_cents == 2500000"
            - "G2B PARENT_ENGAGEMENT.minimum_cents == 500001 (round_half_up(0.01 * 50000100))"
            - "G2B HOMELESS_SERVICES.minimum_cents == 500000 (floor still wins over round_half_up(0.005 * 50000100) = 250001)"
            - "G2B PROFESSIONAL_DEVELOPMENT.minimum_cents == 2500005"

      - name: waterfall_per_school_rounding_then_remainder
        grounds:
          - calculations.school_allocation_waterfall
          - calculations.equitable_services_share
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-school round_half_up of
          unit*weight BEFORE multiplying by headcount, then a NEGATIVE remainder
          (-128 cents) reconciled one cent at a time in rank_position DESC order.
          The four final allocation literals below are unreachable under a
          sum-then-round evaluation order.
        test_recipe:
          setup:
            - "Grant GV: FY2027, total 100000000, admin 5000000, VERIFIED_COUNT; schools 400/500, 300/500, 200/500, 195/500, 100/500; verified private schools 50 and 30 (LIp 80)"
            - "school_pool = 95000000 - 6250000 - 6042553 = 82707447"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Alpha Elementary", nces_id: "000001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Beta Middle", nces_id: "000002", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Gamma High", nces_id: "000003", grade_span_low: 9, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Delta Elementary", nces_id: "000004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Epsilon Prep", nces_id: "000005", grade_span_low: 9, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s5: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "St Mary", low_income_resident_count: 50, contact_email: "om@stmary.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/private-schools", payload: { name: "Grace Academy", low_income_resident_count: 30, contact_email: "om@grace.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2027, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gv: $.data.id, gv_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s2}", low_income_student_count: 300, total_student_count: 500 }, { school_id: "${s3}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 }, { school_id: "${s5}", low_income_student_count: 100, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_v: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_v}/certify", payload: { expected_grant_version: "${gv_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/lock-rankings", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${gv}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s1}" }, as: FederalProgramsDirector, captures: { a1: "$.data[0].allocation_amount_cents", p1: "$.data[0].per_pupil_cents" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s2}" }, as: FederalProgramsDirector, captures: { a2: "$.data[0].allocation_amount_cents" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s3}" }, as: FederalProgramsDirector, captures: { a3: "$.data[0].allocation_amount_cents" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s4}" }, as: FederalProgramsDirector, captures: { a4: "$.data[0].allocation_amount_cents" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s5}" }, as: FederalProgramsDirector, captures: { a5: "$.data[0].allocation_amount_cents" } }
          assert:
            - "S1 per_pupil_cents == 87367 and allocation_amount_cents == 34946768 (remainder -32 in DESC-rank cycling)"
            - "S2 allocation_amount_cents == 21841768"
            - "S3 allocation_amount_cents == 14561168"
            - "S4 allocation_amount_cents == 11357743"
            - "S5 allocation_amount_cents == 0 and served == false (2000 bp below 3500, not elected)"
            - "sum of the four served allocations == 82707447 == school_pool exactly (remainder fully reconciled)"

      - name: equitable_share_evaluation_order_pinned
        grounds:
          - calculations.equitable_services_share
          - calculations.set_aside_minimums
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          equitable share is computed on P = net_allocable - non-equitable
          set-asides (step 1 before step 4), so VERIFIED share == 6042553, NOT the
          6468085 that net_allocable-based ordering would produce.
        test_recipe:
          setup:
            - "Grant GV: FY2027, total 100000000, admin 5000000, VERIFIED_COUNT; 4 schools (400/500, 300/500, 200/500, 195/500); verified private schools 50 + 30"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Alpha Elementary", nces_id: "000001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Beta Middle", nces_id: "000002", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Gamma High", nces_id: "000003", grade_span_low: 9, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Delta Elementary", nces_id: "000004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "St Mary", low_income_resident_count: 50, contact_email: "om@stmary.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/private-schools", payload: { name: "Grace Academy", low_income_resident_count: 30, contact_email: "om@grace.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2027, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gv: $.data.id, gv_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s2}", low_income_student_count: 300, total_student_count: 500 }, { school_id: "${s3}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_v: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_v}/certify", payload: { expected_grant_version: "${gv_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/lock-rankings", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${gv}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${gv}", category: "EQUITABLE_SERVICES" }, as: FederalProgramsDirector, captures: { eq_min: "$.data[0].minimum_cents" } }
          assert:
            - "EQUITABLE_SERVICES.minimum_cents == 6042553 == round_half_up(88750000 * 80 / 1175) where 88750000 = net_allocable - 6250000 non-equitable set-asides"
            - "minimum_cents != 6468085, the value that the wrong order (share computed on net_allocable_cents directly) would yield"

  - rule_id: non_linear_state_machine
    instances:
      - name: finding_cap_revision_cycle
        grounds:
          - state_machines.MonitoringFinding.CAP_SUBMITTED_to_CAP_RETURNED
          - state_machines.MonitoringFinding.CAP_RETURNED_to_CAP_SUBMITTED
          - entities.MonitoringFinding.fields.cap_attempt_count
        distinguishing_aspect: |
          Cyclic machine on MonitoringFinding: OPEN -> CAP_SUBMITTED -> CAP_RETURNED
          -> CAP_SUBMITTED -> VERIFIED; cap_attempt_count must read 2 after the loop,
          proving the cycle re-entry is a new submission, not an idempotent replay.
        test_recipe:
          setup:
            - "Grant GF FY2040 (total 5000000); visit V [2026-08-01..2026-08-05] IN_PROGRESS at default clock 2026-08-01; finding F OPEN with cap_due_date 2026-08-10"
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2040, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gf: $.data.id } }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${gf}", visit_start_date: "2026-08-01", visit_end_date: "2026-08-05", scope: "PROGRAMMATIC" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { v1: $.data.id } }
            - { call: "POST /title-i/monitoring-visits/${v1}/start", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/monitoring-findings", payload: { visit_id: "${v1}", citation: "34 CFR 200.77", severity: "FINDING", description: "per-pupil amounts decrease down the ranking", cap_due_date: "2026-08-10" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { f1: $.data.id } }
            - { call: "POST /title-i/monitoring-visits/${v1}/issue-report", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
          trigger:
            - { call: "POST /title-i/monitoring-findings/${f1}/submit-cap", payload: { cap_narrative: "The district will revise its per-pupil allocation worksheet and resubmit ranking documentation." }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { att1: $.data.cap_attempt_count, st1: $.data.status } }
            - { call: "POST /title-i/monitoring-findings/${f1}/return-cap", payload: { return_note: "worksheet lacks board approval evidence" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { st2: $.data.status } }
            - { call: "POST /title-i/monitoring-findings/${f1}/submit-cap", payload: { cap_narrative: "Revised plan now attaches the board-approved allocation worksheet and timeline for correction." }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { att2: $.data.cap_attempt_count, st3: $.data.status } }
            - { call: "POST /title-i/monitoring-findings/${f1}/accept-cap", payload: {}, as: SEAMonitor, as_user_id: "monitor-1", captures: { st4: $.data.status } }
          assert:
            - "first submit: status == CAP_SUBMITTED and cap_attempt_count == 1"
            - "return: status == CAP_RETURNED"
            - "second submit (cycle re-entry): status == CAP_SUBMITTED and cap_attempt_count == 2"
            - "accept: status == VERIFIED"
            - "MonitoringVisit.${v1}.status == CLOSED (last terminal finding auto-closes the visit)"

      - name: consultation_dispute_resume_cycle
        grounds:
          - state_machines.EquitableServicesConsultation.DISPUTED_to_CONSULTING
          - state_machines.EquitableServicesConsultation.CONSULTING_to_DISPUTED
          - state_machines.EquitableServicesConsultation.DISPUTED_to_COMPLAINT_FILED
        distinguishing_aspect: |
          Branching-with-revert machine on EquitableServicesConsultation (different
          entity from the finding cycle): CONSULTING -> DISPUTED -> CONSULTING via
          record-session resume, with sessions accumulated across the loop, then a
          second branch DISPUTED -> COMPLAINT_FILED -> CONSULTING via SEA resolution
          before the affirmation can finally be signed.
        test_recipe:
          setup:
            - "Grant GC FY2041 SETUP; private school PX verified"
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2041, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "CONSULTATION_AGREED" }, as: FederalProgramsDirector, captures: { gc: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "Pilot Academy", low_income_resident_count: 12, contact_email: "om@pilot.example", nonprofit_verified: true }, as: ComplianceAnalyst, captures: { px: $.data.id } }
            - { call: "POST /title-i/equitable-services-consultations", payload: { grant_id: "${gc}", private_school_id: "${px}" }, as: ComplianceAnalyst, captures: { cx: $.data.id } }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/record-session", payload: { session_date: "2026-08-01", topics: "needs assessment", attendee_count: 3 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/record-session", payload: { session_date: "2026-08-01", topics: "count methodology", attendee_count: 3 }, as: ComplianceAnalyst }
          trigger:
            - { call: "POST /title-i/equitable-services-consultations/${cx}/dispute", payload: { dispute_reason: "district used an outdated survey source for the count" }, as: PrivateSchoolOmbudsman, as_user_id: "omb-1", captures: { st1: $.data.status } }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/record-session", payload: { session_date: "2026-08-01", topics: "reconciliation of count source", attendee_count: 5 }, as: ComplianceAnalyst, captures: { st2: $.data.status, n2: $.data.sessions_count } }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/dispute", payload: { dispute_reason: "proportional share still contested" }, as: PrivateSchoolOmbudsman, as_user_id: "omb-1" }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/file-complaint", payload: { complaint_text: "formal complaint: consultation was not timely and meaningful" }, as: PrivateSchoolOmbudsman, as_user_id: "omb-1", captures: { st3: $.data.status } }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/resolve-complaint", payload: { determination_note: "SEA directs the district to apply the updated survey count" }, as: SEAMonitor, as_user_id: "monitor-9", captures: { st4: $.data.status } }
            - { call: "POST /title-i/equitable-services-consultations/${cx}/sign-affirmation", payload: { agreed_low_income_count: 14 }, as: PrivateSchoolOmbudsman, as_user_id: "omb-1", captures: { st5: $.data.status, n5: $.data.sessions_count } }
          assert:
            - "dispute: status == DISPUTED"
            - "record-session resume loop: status == CONSULTING and sessions_count == 3 (sessions survive the dispute)"
            - "file-complaint: status == COMPLAINT_FILED"
            - "resolve-complaint: status == CONSULTING (second reversion to CONSULTING in one lifecycle)"
            - "sign-affirmation succeeds after the loops: status == AFFIRMATION_SIGNED, sessions_count == 3, agreed_low_income_count == 14"

  - rule_id: transitive_cascade
    instances:
      - name: snapshot_recertification_cascade
        grounds:
          - state_machines.PovertyDataSnapshot.DRAFT_to_CERTIFIED
          - state_machines.SchoolAllocation.CERTIFIED_to_PENDING
          - state_machines.SupplementDocumentation.ACCEPTED_to_STALE
          - calculations.school_ranking
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (snapshot certify): (B) prior snapshot
          SUPERSEDED and allocation rows recomputed in place; (C) CERTIFIED
          allocations flip to PENDING because their figures changed; (D) that flip
          STALEs the ACCEPTED SNS document and auto-DISALLOWs the supplant-screened
          PENDING_REVIEW expenditure with reason SNS_STALE_CASCADE. Each link is
          caused by the previous mutation, not by the certify call directly.
        test_recipe:
          setup:
            - "Grant GV FY2027 fully ALLOCATED (2 schools 400/500 and 195/500); allocation A1 CERTIFIED; SNS doc ACCEPTED for A1; expenditure EX supplant_screen=true PENDING_REVIEW on A1"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Alpha Elementary", nces_id: "000001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Delta Elementary", nces_id: "000004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2027, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gv: $.data.id, gv_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap1: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap1}/certify", payload: { expected_grant_version: "${gv_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s1}" }, as: FederalProgramsDirector, captures: { a1: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a1}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/supplement-documentation", payload: { school_allocation_id: "${a1}", methodology: "PER_PUPIL_FORMULA", coverage_start_date: "2026-07-01", coverage_end_date: "2027-07-01", narrative: "Districtwide per-pupil formula distributes state and local funds to all schools identically regardless of Title I status." }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { sd1: $.data.id } }
            - { call: "POST /title-i/supplement-documentation/${sd1}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /title-i/supplement-documentation/${sd1}/review", payload: { decision: "ACCEPT" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${gv}", school_allocation_id: "${a1}", amount_cents: 500000, function_code: "INSTRUCTION", description: "interventionist stipend", incurred_date: "2026-11-01", supplant_screen: true }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { ex1: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 205, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap2: $.data.id } }
            - { call: "GET /title-i/grants/${gv}", payload: {}, as: FederalProgramsDirector, captures: { gv_pre: $.data.version } }
          trigger:
            - { call: "POST /title-i/poverty-snapshots/${snap2}/certify", payload: { expected_grant_version: "${gv_pre}" }, as: FederalProgramsDirector }
            - { call: "GET /title-i/poverty-snapshots/${snap1}", payload: {}, as: FederalProgramsDirector, captures: { snap1_st: $.data.status } }
            - { call: "GET /title-i/school-allocations/${a1}", payload: {}, as: FederalProgramsDirector, captures: { a1_st: $.data.status, a1_pct: $.data.poverty_pct_bp } }
            - { call: "GET /title-i/supplement-documentation/${sd1}", payload: {}, as: FederalProgramsDirector, captures: { sd1_st: $.data.status } }
            - { call: "GET /title-i/expenditures/${ex1}", payload: {}, as: FederalProgramsDirector, captures: { ex1_st: $.data.status, ex1_reason: $.data.disallow_reason } }
          assert:
            - "link B: snapshot ${snap1}.status == SUPERSEDED and ${snap2}.status == CERTIFIED"
            - "link C: allocation ${a1}.status == PENDING (was CERTIFIED) with figures recomputed (poverty_pct_bp == 8000)"
            - "S4 allocation recomputed to poverty_pct_bp == 4100 and program_model == SCHOOLWIDE (crossed the 4000 bp line)"
            - "link D1: SupplementDocumentation.${sd1}.status == STALE (caused by the allocation flip, not directly by the certify)"
            - "link D2: Expenditure.${ex1}.status == DISALLOWED with disallow_reason == SNS_STALE_CASCADE (caused by the SNS going stale)"

      - name: cap_acceptance_bubble_up_cascade
        grounds:
          - state_machines.MonitoringFinding.CAP_SUBMITTED_to_VERIFIED
          - state_machines.MonitoringVisit.REPORT_ISSUED_to_CLOSED
          - calculations.monitoring_clearance
        distinguishing_aspect: |
          Depth-3 bubble-up from a DIFFERENT trigger (accept-cap, not snapshot
          certify): accepting the second of two findings verifies the finding (B);
          because it was the visit's last non-terminal finding the visit
          auto-closes (C); because no non-terminal findings remain on the grant the
          grant's monitoring_clearance recomputes to CLEARED (D). Accepting the
          first finding must NOT close the visit — proving the chain is conditional
          on the aggregate child state.
        test_recipe:
          setup:
            - "Grant GB FY2042; visit IN_PROGRESS then REPORT_ISSUED with findings F1, F2 OPEN"
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2042, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gb: $.data.id } }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${gb}", visit_start_date: "2026-08-01", visit_end_date: "2026-08-05", scope: "COMPREHENSIVE" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { vb: $.data.id } }
            - { call: "POST /title-i/monitoring-visits/${vb}/start", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/monitoring-findings", payload: { visit_id: "${vb}", citation: "34 CFR 200.77", severity: "FINDING", description: "ranking documentation incomplete", cap_due_date: "2026-09-01" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { f1: $.data.id } }
            - { call: "POST /title-i/monitoring-findings", payload: { visit_id: "${vb}", citation: "2 CFR 200.403", severity: "SYSTEMIC", description: "allowability documentation missing for two cost items", cap_due_date: "2026-09-01" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { f2: $.data.id } }
            - { call: "POST /title-i/monitoring-visits/${vb}/issue-report", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/monitoring-findings/${f1}/submit-cap", payload: { cap_narrative: "District will publish the full ranking worksheet with school board sign-off and training records." }, as: ComplianceAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /title-i/monitoring-findings/${f1}/accept-cap", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "GET /title-i/monitoring-visits/${vb}", payload: {}, as: SEAMonitor, captures: { v_mid: $.data.status } }
            - { call: "POST /title-i/monitoring-findings/${f2}/submit-cap", payload: { cap_narrative: "District will retrain business office staff on 2 CFR 200.403 and attach corrected ledgers." }, as: ComplianceAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /title-i/monitoring-findings/${f2}/accept-cap", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "GET /title-i/monitoring-visits/${vb}", payload: {}, as: SEAMonitor, captures: { v_end: $.data.status } }
            - { call: "GET /title-i/grants/${gb}", payload: {}, as: SEAMonitor, captures: { clearance: $.data.monitoring_clearance } }
          assert:
            - "after accepting F1 only: visit status == REPORT_ISSUED (F2 still OPEN — no premature closure)"
            - "link B: F2.status == VERIFIED after accept"
            - "link C: visit status == CLOSED after the last finding verifies"
            - "link D: grant.monitoring_clearance == CLEARED (was FINDINGS_OPEN since finding creation)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_expenditure_create
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_ALLOCATION_NOT_CERTIFIED]
          - errors[ERR_INSUFFICIENT_ALLOCATION_BALANCE]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: the charge targets a PENDING
          allocation (state violation, priority 5) AND exceeds every balance
          (fiscal violation, priority 10) — the state error
          ERR_ALLOCATION_NOT_CERTIFIED must win over ERR_INSUFFICIENT_ALLOCATION_BALANCE.
        test_recipe:
          setup:
            - "Grant GP FY2043 ALLOCATED; school SP 100/100; allocation AP still PENDING (never certified)"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Pine Elementary", nces_id: "000301", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sp: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2043, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gp: $.data.id, gp_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gp}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sp}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_p: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_p}/certify", payload: { expected_grant_version: "${gp_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gp}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gp}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gp}", school_id: "${sp}" }, as: FederalProgramsDirector, captures: { ap: "$.data[0].id" } }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${gp}", school_allocation_id: "${ap}", amount_cents: 99000000, function_code: "INSTRUCTION", description: "oversized charge on uncertified allocation", incurred_date: "2042-09-01", supplant_screen: false }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_ALLOCATION_NOT_CERTIFIED (priority 5 state) — NOT ERR_INSUFFICIENT_ALLOCATION_BALANCE (priority 10 fiscal)"

      - name: safety_vs_fiscal_on_expenditure_create
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_SUPPLANT_RISK_UNRESOLVED]
          - errors[ERR_INSUFFICIENT_ALLOCATION_BALANCE]
        distinguishing_aspect: |
          Category pair {business_safety, business_fiscal} — different pair from
          the sibling instance: the allocation IS certified (no state violation),
          but the charge is supplant_screen=true with no ACCEPTED SNS document
          (safety, priority 7) AND exceeds the remaining balance (fiscal,
          priority 10) — ERR_SUPPLANT_RISK_UNRESOLVED (403) must win.
        test_recipe:
          setup:
            - "Grant GQ FY2044 ALLOCATED; school SQ 100/100; allocation AQ CERTIFIED with balance 9000000; no SNS documentation at all"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Quartz Elementary", nces_id: "000302", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sq: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2044, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gq: $.data.id, gq_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gq}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sq}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_q: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_q}/certify", payload: { expected_grant_version: "${gq_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gq}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gq}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gq}", school_id: "${sq}" }, as: FederalProgramsDirector, captures: { aq: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${aq}/certify", payload: {}, as: FederalProgramsDirector }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${gq}", school_allocation_id: "${aq}", amount_cents: 99000000, function_code: "INSTRUCTION", description: "oversized supplanting charge", incurred_date: "2043-09-01", supplant_screen: true }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_SUPPLANT_RISK_UNRESOLVED (priority 7 safety) — NOT ERR_INSUFFICIENT_ALLOCATION_BALANCE (priority 10 fiscal)"

  - rule_id: boundary_precision_check
    instances:
      - name: schoolwide_threshold_exact_40pct
        grounds:
          - calculations.school_ranking
          - entities.SchoolAllocation.fields.program_model
        distinguishing_aspect: |
          Metric: poverty percentage in basis points. A school at exactly
          200/500 = 4000 bp is SCHOOLWIDE (>= semantics); a school at 195/500 =
          3900 bp is TARGETED_ASSISTANCE. Reachable via the lock-rankings /
          school-allocations read path.
        test_recipe:
          setup:
            - "Grant GT FY2045; schools S_HI (200/500) and S_LO (195/500)"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "High Boundary", nces_id: "000401", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { shi: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Low Boundary", nces_id: "000402", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { slo: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2045, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gt: $.data.id, gt_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gt}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${shi}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${slo}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_t: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_t}/certify", payload: { expected_grant_version: "${gt_v}" }, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${gt}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gt}", school_id: "${shi}" }, as: FederalProgramsDirector, captures: { hi_pct: "$.data[0].poverty_pct_bp", hi_model: "$.data[0].program_model", hi_elig: "$.data[0].eligibility_flag" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gt}", school_id: "${slo}" }, as: FederalProgramsDirector, captures: { lo_pct: "$.data[0].poverty_pct_bp", lo_model: "$.data[0].program_model", lo_elig: "$.data[0].eligibility_flag" } }
          assert:
            - "S_HI poverty_pct_bp == 4000 and program_model == SCHOOLWIDE (>= 4000 includes the boundary)"
            - "S_LO poverty_pct_bp == 3900 and program_model == TARGETED_ASSISTANCE"
            - "both are eligibility_flag == ELIGIBLE (3500 <= pct < 7500)"

      - name: carryover_limit_exact_15pct
        grounds:
          - calculations.carryover_computation
          - errors[ERR_CARRYOVER_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric: carryover basis points — a different metric (grant fiscal ratio)
          and a different endpoint (close-out) than the poverty-percentage sibling.
          Carryover of exactly 1500000 cents on a 10000000-cent grant rounds to
          1500 bp and CLOSES without a waiver; 1500500 cents rounds to 1501 bp and
          is REJECTED.
        test_recipe:
          setup:
            - "Grant G3 FY2029 total 10000000 with school S7 (100/100), allocation certified, ALLOWED expenditure 8500000 (carryover exactly 1500000)"
            - "Grant G4 FY2030 identical but ALLOWED 8499500 (carryover 1500500)"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Solo School", nces_id: "000403", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s7: $.data.id } }
