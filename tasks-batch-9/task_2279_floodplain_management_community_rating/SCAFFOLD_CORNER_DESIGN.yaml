            - "Structure.${struct_id}.substantial_status == NONE"

      - name: ngvd29_offset_is_rounded_before_the_margin_is_taken
        claim_type: precision
        grounds:
          - calculations.certificate_datum_normalization
          - entities.ElevationCertificate.fields.normalized_lowest_floor_ft
          - endpoints."POST /floodplain/elevation-certificates"
        distinguishing_aspect: |
          A 15.00 ft NGVD29 reading becomes 15.00 - 0.85 = 14.15, which is rounded half-up to
          the stored single-decimal 14.2 before the requirement is subtracted, giving
          freeboard_margin_ft 0.7 against the 13.5 ft requirement — the stored normalized
          value is 14.2, never the unrounded 14.15.
        test_recipe:
          setup:
            - "Canonical base fixture; permit ISSUED with required_lowest_floor_elevation_ft 13.5."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
