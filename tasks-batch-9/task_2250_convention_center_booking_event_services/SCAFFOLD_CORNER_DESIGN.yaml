          One OUTSIDE_EXCEPTION arrangement, two variants, and the MIN_BUYOUT_CENTS
          floor decides differently on each: 22 percent of the 1000000 estimate is
          220000 so the ESTIMATED variant is floored to 250000, while 22 percent of the
