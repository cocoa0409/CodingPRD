            - "GET /hhi/extension-requests?case_id=${case_a_id} returns total_count == 0 and case A data.extension_count == 0."

      - name: missing_published_rule_is_reported_until_a_higher_priority_state_rule_takes_over
        claim_type: priority_ordering
        grounds:
          - errors[ERR_NO_PUBLISHED_ENTITLEMENT_RULE]
          - errors[ERR_CERT_NOT_REVIEWABLE]
          - validations[priority 8]
          - validations[priority 11]
        distinguishing_aspect: |
          With no PUBLISHED MIDDLE/IN_HOME rule the acceptance fails at priority 11 with
          ERR_NO_PUBLISHED_ENTITLEMENT_RULE; after the rule is published the same call succeeds; and
          once the certification is ACCEPTED, retiring the rule again does NOT resurface the
          priority-11 code — the priority-8 ERR_CERT_NOT_REVIEWABLE is reported instead.
        test_recipe:
          setup:
            - "Only a PUBLISHED PRIMARY/IN_HOME rule exists, so a grade-7 (MIDDLE) IN_HOME case has no resolvable rule."
            - "Case in PENDING_CERT_REVIEW with one SUBMITTED certification of 30 expected absence days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "PRIMARY", delivery_mode: "IN_HOME", base_weekly_minutes: 300, cap_weekly_minutes: 400, min_session_minutes: 30, max_session_minutes: 90, max_daily_minutes: 180, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
