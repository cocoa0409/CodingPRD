            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 }, { product_id: "${p2}", qty_requested: 5 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
