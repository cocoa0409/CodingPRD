            - "HealthDocument.${doc1}.issued_at == 2026-07-23T00:00:00Z (unchanged by the refused resubmission)"

      - name: disclosable_incident_cannot_close_before_disclosure_while_minor_incident_closes_directly
        grounds:
          - state_machines.AnimalIncident.INVESTIGATING_to_CLOSED
          - state_machines.AnimalIncident.INVESTIGATING_to_REGULATOR_DISCLOSED
          - validations.priority_53
          - errors.ERR_DISCLOSURE_PENDING
        distinguishing_aspect: |
          FORK-JOIN shape on AnimalIncident, a third distinct entity: from INVESTIGATING the machine forks into
          a direct-close branch and a disclosure branch, and the branch is selected by disclosure_required.
          The minor incident (score 40) takes the direct branch in setup; the disclosable one (score 62) is
          blocked at the join until the disclosure is filed.
        test_recipe:
          setup:
            - "Two-leg CHECKED itinerary with a 720-minute connection so the second segment demands 4 welfare checks and has 0 recorded"
            - "Incident A: INJURY with no segment reference, preliminary score 40, disclosure_required false, already investigated and closed directly with CARRIER_ATTRIBUTABLE (branch B)"
            - "Incident B: INJURY against the second segment, preliminary score 62 which is at or above DISCLOSURE_SCORE_THRESHOLD 60, so disclosure_required is true; it is INVESTIGATING and no disclosure has been filed"
