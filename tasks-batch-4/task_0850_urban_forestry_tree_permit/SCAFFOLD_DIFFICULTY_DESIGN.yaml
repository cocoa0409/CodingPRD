  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_revoke_conserves_outstanding_mitigation
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_APPROVED
          - state_machines.Permit.APPROVED_to_REVOKED
          - entities.Permit.fields.mitigation_fee_cents
        distinguishing_aspect: "Conserved quantity = total_outstanding_mitigation_cents = SUM(Permit.mitigation_fee_cents where status IN {APPROVED, ISSUED} AND fee_paid==false). A baseline permit contributes 20156; approving a second (adds 40312) then revoking it (subtracts 40312) returns the sum to 20156."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T10 (dbh=10) and Tree T20 (dbh=20), each with a FINALIZED benign inspection."
            - "Baseline: REMOVAL permit pBase on T10 APPROVED with REPLACEMENT_COST (fee 20156, unpaid) -> outstanding == 20156."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 10.0, canopy_radius_m: 5.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t10: $.data.id, t10_v: $.data.version }
            - call: "POST /forestry/trees/${t10}/inspections"
              payload: { expected_tree_version: "${t10_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp10: $.data.id }
            - call: "POST /forestry/inspections/${insp10}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t10}", permit_type: "REMOVAL", reason: "base" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { pBase: $.data.id }
            - call: "POST /forestry/permits/${pBase}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${pBase}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "base" }
              as: Arborist
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp20: $.data.id }
            - call: "POST /forestry/inspections/${insp20}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "second" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p2: $.data.id }
            - call: "POST /forestry/permits/${p2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p2}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "second" }
              as: Arborist
          trigger:
            - call: "POST /forestry/permits/${p2}/revoke"
              payload: { reason: "withdrawn" }
              as: ForestryAdmin
          assert:
            - "Permit.${p2}.status == REVOKED"
            - "Permit.${p2}.mitigation_fee_cents == 40312"
            - "sum of Permit.mitigation_fee_cents over GET /forestry/permits where status IN {APPROVED, ISSUED} and fee_paid == false == 20156"

      - name: finalize_then_dispute_conserves_zone_high_risk_count
        grounds:
          - state_machines.Inspection.FINALIZED_to_DISPUTED
          - entities.Zone.fields.high_risk_tree_count
          - entities.Tree.fields.prior_risk_rating
        distinguishing_aspect: "Conserved quantity = zone.high_risk_tree_count (a COUNT, different type from the mitigation cents invariant). Finalizing SEVERE bumps it 0->1; disputing restores the tree's prior rating and returns the count to 0."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20; one inspection likelihood=3 consequence=3 target=4 finalized (SEVERE) -> high_risk_tree_count == 1."
          setup_api_calls:
            - call: "POST /forestry/zones"
