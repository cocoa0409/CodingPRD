scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: barrel_volume_ledger_vs_statutory_divergence
        grounds:
          - calculations.barrel_volume_ledger
          - calculations.barrel_volume_statutory
          - entities.Barrel.fields.current_volume_ledger_liters
          - entities.Barrel.fields.current_volume_statutory_liters
        distinguishing_aspect: |
          One barrel, one instant, two volumes: the ledger variant replays recorded
          events (reading 190.0, then sample draw 2.0 -> 188.00) while the statutory
          variant applies the season/floor/age rate table over 4 fully elapsed 90-day
          blocks (191.27); the variants operate on the Barrel volume domain and MUST
          differ (188.00 != 191.27).
        test_recipe:
          setup:
            - "Rickhouse with 1 floor x 1 row x 1 position commissioned (project approved 2026-09-01, lag 24 months, commissioned at 2028-08-21)."
            - "Barrel filled 2028-09-01 on the floor-1 slot (heat_factor 1.00): 200.0 L, seasoning_months 12, min_maturation_months 48."
            - "EVAPORATION_READING 190.0 at 2029-03-01; QUALITY_SAMPLE draw 2.0 at 2029-04-01; clock then at 2029-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-DV", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 190.0 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "QUALITY_SAMPLE", sample_draw_liters: 2.0, quality_score: 88 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /barrel-aging/barrels/${b_id}"
              as: WarehouseManager
          assert:
            - "Barrel.${b_id}.current_volume_ledger_liters == 188.00 (200.0 -> reading 190.0 -> sample 2.0)"
            - "Barrel.${b_id}.current_volume_statutory_liters == 191.27 (blocks: AUT r=0.012, AUT r=0.012, WINTER r=0.0084, SPRING r=0.012 on heat 1.00, seasoning 12 -> no discount)"
            - "Barrel.${b_id}.current_volume_ledger_liters != Barrel.${b_id}.current_volume_statutory_liters"

      - name: report_loss_actual_vs_statutory_divergence
        grounds:
          - calculations.report_period_loss_actual
          - calculations.report_period_loss_statutory
          - entities.BondedPeriodReport.fields.loss_actual_liters
          - entities.BondedPeriodReport.fields.loss_statutory_liters
        distinguishing_aspect: |
          Same barrels, same period, two loss figures on the BondedPeriodReport domain
          (a different entity domain than the Barrel volume pair): the actual variant
          replays readings (per-barrel 1.005 and 2.005 -> round-then-sum 3.02) while the
          statutory variant prices the rate table at the period boundaries (per-barrel
          3.962988... -> 3.96 -> round-then-sum 7.92); the two reported figures MUST
          differ (3.02 != 7.92).
        test_recipe:
          setup:
            - "Rickhouse 1 floor x 1 row x 2 positions commissioned; barrels A and B filled 2028-09-01 with 200.0 L each, seasoning 12, both on floor-1 slots."
            - "At 2029-06-01: A records EVAPORATION_READING 198.995, B records 197.995."
            - "Report period [2029-03-01, 2029-09-01) created at clock 2029-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-RL", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 2, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id", slot_b: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_a: $.data.id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_b}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_a}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 198.995 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels/${b_b}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 197.995 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2029-03-01T00:00:00Z", period_end: "2029-09-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /barrel-aging/bonded-reports/${rep_id}/reconcile"
              as: BondedPreparer
          assert:
            - "BondedPeriodReport.${rep_id}.loss_actual_liters == 3.02 (round(1.005)+round(2.005) = 1.01+2.01)"
            - "BondedPeriodReport.${rep_id}.loss_statutory_liters == 7.92 (per-barrel 195.2288-191.265811 = 3.962988... -> 3.96, twice)"
            - "BondedPeriodReport.${rep_id}.loss_actual_liters != BondedPeriodReport.${rep_id}.loss_statutory_liters"
            - "BondedPeriodReport.${rep_id}.reported_loss_liters == 3.02 (pinned to the actual variant)"
            - "BondedPeriodReport.${rep_id}.opening_inventory_liters == 400.00"
            - "BondedPeriodReport.${rep_id}.closing_inventory_liters == 396.98 (400.00 + 0 - 0 - 3.02)"

  - rule_id: combinatorial_formula
    instances:
      - name: statutory_evaporation_multi_factor_rate
        grounds:
          - calculations.barrel_volume_statutory
          - entities.WarehouseSlot.fields.heat_factor
        distinguishing_aspect: |
          Mode (a) non-linear interaction: the per-block rate multiplies FOUR inputs
          (base rate x floor heat 1.05 x season multiplier x tiered age multiplier) with
          a conditional seasoning discount (24 >= 18 -> x0.95) and a min(rate, 0.05) cap;
          computed over 8 blocks it yields exactly 181.85, which no single-factor or
          linear approximation reproduces.
        test_recipe:
          setup:
            - "Rickhouse 2 floors x 1 row x 1 position commissioned; barrel filled 2028-09-01 on the FLOOR-2 slot (heat_factor 1.05): 200.0 L, seasoning_months 24 (earns the 0.95 discount), min_maturation_months 48."
            - "No assessments; clock at 2030-09-01 (8 fully elapsed 90-day blocks)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-MF", region_code: "TN", floors: 2, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 60000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_f2: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_f2}", wood_origin: "FRENCH_OAK", seasoning_months: 24, char_level: 2, spirit_type: "RYE", fill_proof: 110.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /barrel-aging/barrels/${b_id}"
              as: WarehouseManager
          assert:
            - "Barrel.${b_id}.current_volume_statutory_liters == 181.85 (8 blocks: r in {0.01197 x5, 0.008379 x2, 0.017955 x1} after heat 1.05, season, age 1.2 and 0.95 seasoning discount)"
            - "Barrel.${b_id}.current_volume_ledger_liters == 200.00 (no events recorded)"
            - "WarehouseSlot.${slot_f2}.heat_factor == 1.05 (floor 2: 1.0 + 0.05*(2-1))"

      - name: report_loss_round_per_barrel_then_sum
        grounds:
          - calculations.report_period_loss_actual
        distinguishing_aspect: |
          Mode (b) nested rounding where the order matters and the scaffold pins it:
          per-barrel losses 1.005, 2.005 and 0.015 are EACH rounded to 2dp half-up BEFORE
          summing, giving 1.01+2.01+0.02 = 3.04; the rejected sum-then-round order gives
          round(3.025) = 3.03. The implementation MUST produce 3.04.
        test_recipe:
          setup:
            - "Rickhouse 1 x 1 x 3 commissioned; barrels A, B, C filled 2028-09-01 with 200.0 L each, seasoning 12, floor-1 slots."
            - "At 2029-06-01: A reads 198.995 (loss 1.005), B reads 197.995 (loss 2.005), C reads 199.985 (loss 0.015)."
            - "Report period [2029-03-01, 2029-09-01) created at clock 2029-09-01 and reconciled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-RO", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 3, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id", slot_b: "$.data[1].id", slot_c: "$.data[2].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_a: $.data.id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_b}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_b: $.data.id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_c}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_a}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 198.995 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels/${b_b}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 197.995 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels/${b_c}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 199.985 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2029-03-01T00:00:00Z", period_end: "2029-09-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /barrel-aging/bonded-reports/${rep_id}/reconcile"
              as: BondedPreparer
          assert:
            - "BondedPeriodReport.${rep_id}.loss_actual_liters == 3.04 (round-per-barrel-then-sum: 1.01 + 2.01 + 0.02)"
            - "BondedPeriodReport.${rep_id}.loss_actual_liters != 3.03 (the rejected sum-then-round order round(3.025))"
            - "BondedPeriodReport.${rep_id}.opening_inventory_liters == 600.00"
            - "BondedPeriodReport.${rep_id}.closing_inventory_liters == 596.96"

  - rule_id: non_linear_state_machine
    instances:
      - name: barrel_parallel_maturation_and_custody_dimensions
        grounds:
          - "state_machines.Barrel(maturation_status)"
          - "state_machines.Barrel(custody_status)"
          - entities.Barrel.fields.maturation_status
          - entities.Barrel.fields.custody_status
        distinguishing_aspect: |
          Barrel carries TWO independent state dimensions on one row (parallel shape):
          maturation progresses FILLED -> AGING -> MATURE_ELIGIBLE -> DUMPED while custody
          stays BONDED the whole time, and only the withdrawal join gate couples the
          dimensions (withdraw requires DUMPED). A single linear pipeline cannot express
          "MATURE_ELIGIBLE and still BONDED" or "DUMPED but still BONDED".
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with min_maturation_months 48 (matures at 2028-09-01 + 1440 days = 2032-08-11)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-PD", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-08-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /barrel-aging/barrels/${b_id}"
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels/${b_id}/withdraw"
              as: WarehouseManager
              captures: { err_gate: $.data.error_id }
            - call: "POST /barrel-aging/barrels/${b_id}/dump"
              as: WarehouseManager
          assert:
            - "before the clock advance the barrel read maturation_status == AGING (fill 2028-09-01 + 1440 days not yet reached)"
            - "after clock 2032-08-11: maturation_status == MATURE_ELIGIBLE while custody_status == BONDED (dimensions evolve independently)"
            - "withdraw before dump: err_gate == ERR_INVALID_STATE_TRANSITION (join gate: custody transition requires maturation DUMPED)"
            - "after dump: maturation_status == DUMPED and custody_status == BONDED (dump does not move the custody dimension)"

      - name: blend_batch_revision_cycle_commits
        grounds:
          - "state_machines.BlendBatch.VALIDATED_to_PROPOSED"
          - "state_machines.BlendBatch.VALIDATED_to_COMMITTED"
          - calculations.age_years_at_date
        distinguishing_aspect: |
          BlendBatch is cyclic (VALIDATED -> PROPOSED revision loop), unlike any linear
          pipeline: the batch is validated, kicked back for revision, re-validated with
          the same components, and only then commits; each pass bumps version and the
          final commit still enforces the age statement at the scheduled bottling date.
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01, 200.0 L, min_maturation_months 24 (mature at 2030-08-21), spirit BOURBON."
            - "Label 'Old Cycler' age_statement_years 2, BOURBON, activated; batch with scheduled_bottling_date 2030-09-01 (barrel age at bottling exactly 2 years = 730 days after the 2028-09-01 fill) created at clock 2030-08-25; component drawn 120.0 added."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-BC", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 24 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /barrel-aging/labels"
              payload: { name: "Old Cycler", age_statement_years: 2, spirit_type: "BOURBON" }
              as: MasterBlender
              captures: { lbl_id: $.data.id }
            - call: "POST /barrel-aging/labels/${lbl_id}/activate"
              as: MasterBlender
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-08-25T00:00:00Z" }
              as: PlatformAdmin
