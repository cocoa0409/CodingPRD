              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_total: $.data.invoice_total_cents, m_access_0: $.data.access_status }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_id}", season_id: "${s27_id}", swimmer_name: "Nadia Writeoff", swimmer_birthdate: "2016-06-06", squad: "MINI" }
