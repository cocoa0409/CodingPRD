# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pain Management Clinic & Controlled-Substance Compliance — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rx_provisional_vs_final_med_diverge
        grounds:
          - calculations.provisional_daily_med
          - calculations.final_daily_med
          - state_machines.Prescription.ACTIVE_to_DISCONTINUED
          - entities.Prescription.fields.final_daily_med_mg
        distinguishing_aspect: |
          On the Prescription domain: provisional_daily_med (forward projection) yields 135.00 while
          final_daily_med (chronological, scaled by actual elapsed course fraction) yields 45.00 for the
          same dose inputs when discontinued after 10 of 30 supplied days.
        test_recipe:
          setup:
            - "Clinic with defaults; a PRESCRIBER provider; patient ACTIVE with a routed MEDICATION plan"
            - "One prescription oxycodone dose_mg=15 units_per_day=6 conversion_factor=1.5 day_supply=30 (provisional MED 135), ACTIVE at clock 2026-06-01T00:00:00Z, discontinued at clock 2026-06-11T00:00:00Z (10 elapsed days)"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "CO One", dea_number: "AC7654321", role_kind: "COMPLIANCE_OFFICER" }
              as: ClinicAdmin
              captures: { co_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat One", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/opioid-agreements"
              payload: { patient_id: "${patient_id}", prescriber_id: "${prescriber_id}" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/opioid-agreements/${agreement_id}/counter-sign"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/pdmp-checks"
              payload: { patient_id: "${patient_id}", queried_by_provider_id: "${prescriber_id}", outcome: "CLEAR" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prior-authorizations"
              payload: { target_kind: "PRESCRIPTION", payer: "Aetna", authorized_units: 30 }
              as: PriorAuthClerk
              captures: { pa_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVED" }
              as: PriorAuthClerk
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", prior_auth_id: "${pa_id}", drug_name: "oxycodone", dose_mg: 15, units_per_day: 6, conversion_factor: 1.5, day_supply: 30, pills_dispensed: 180 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx_id: $.data.id, prov_med: $.data.provisional_daily_med_mg }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-11T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx_id}/discontinue"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { final_med: $.data.final_daily_med_mg }
          assert:
            - "Prescription.${rx_id}.provisional_daily_med_mg == 135.00"
            - "Prescription.${rx_id}.final_daily_med_mg == 45.00"
            - "Prescription.${rx_id}.provisional_daily_med_mg != Prescription.${rx_id}.final_daily_med_mg"

      - name: pillcount_forward_vs_chronological_diverge
        grounds:
          - calculations.pill_count_expected_remaining
          - entities.PillCountAudit.fields.expected_pills_forward
          - entities.PillCountAudit.fields.expected_pills_chronological
        distinguishing_aspect: |
          On the PillCountAudit domain (different entity from rule-1 instance 1): forward projection yields
          expected_pills_forward=30.00 (fractional units*days, rounded once) while chronological per-day whole-pill
          consumption yields expected_pills_chronological=20 for units_per_day=1.5 over 20 elapsed days.
        test_recipe:
          setup:
            - "Patient ACTIVE with a routed MEDICATION plan and one ACTIVE below-threshold prescription units_per_day=1.5 pills_dispensed=60 day_supply=40, created at clock 2026-06-01T00:00:00Z"
            - "Audit performed at clock 2026-06-21T00:00:00Z (20 elapsed days), counted_pills=22"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic 2", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "CO One", dea_number: "AC7654321", role_kind: "COMPLIANCE_OFFICER" }
              as: ClinicAdmin
              captures: { co_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Two", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", drug_name: "tramadol", dose_mg: 50, units_per_day: 1.5, conversion_factor: 0.1, day_supply: 40, pills_dispensed: 60 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-21T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/pill-count-audits"
              payload: { prescription_id: "${rx_id}", audit_utc: "2026-06-21T00:00:00Z", counted_pills: 22 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { audit_id: $.data.id }
          assert:
            - "PillCountAudit.${audit_id}.expected_pills_forward == 30.00"
            - "PillCountAudit.${audit_id}.expected_pills_chronological == 20"
            - "PillCountAudit.${audit_id}.expected_pills_forward != PillCountAudit.${audit_id}.expected_pills_chronological"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_med_multiinput_threshold_selection
        grounds:
          - calculations.provisional_daily_med
          - validations[priority=9]
          - entities.Clinic.fields.med_review_threshold_mg
        distinguishing_aspect: |
          Mode (a): provisional_daily_med multiplies 3 inputs (dose_mg x units_per_day x conversion_factor)
          and that product selects a non-linear branch — at/above med_review_threshold_mg (90) the activate path
          requires agreement+PDMP+prior-auth, below it does not; MED 135 (>=90) forces the gated branch.
        test_recipe:
          setup:
            - "Patient ACTIVE with routed MEDICATION plan; a PROPOSED prescription with dose_mg=15 units_per_day=6 conversion_factor=1.5 (provisional 135 >= 90); NO opioid agreement yet"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic 3", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Three", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", drug_name: "oxycodone", dose_mg: 15, units_per_day: 6, conversion_factor: 1.5, day_supply: 30, pills_dispensed: 180 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx_id: $.data.id, prov_med: $.data.provisional_daily_med_mg }
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Prescription.${rx_id}.provisional_daily_med_mg == 135.00"
            - "response.data.error_id == ERR_OPIOID_AGREEMENT_REQUIRED"
            - "Prescription.${rx_id}.status == PROPOSED"

      - name: pillcount_perday_ceil_then_sum_order
        grounds:
          - calculations.pill_count_expected_remaining
          - entities.PillCountAudit.fields.expected_pills_chronological
          - entities.PillCountAudit.fields.discrepancy_pills
        distinguishing_aspect: |
          Mode (b): pill_count_expected_remaining pins rounding ORDER — chronological ceils units_per_day to whole
          pills PER DAY then sums (2*20=40 consumed), giving 20; the forward variant multiplies-then-rounds-once
          giving 30. The scaffold pins that result/discrepancy use the chronological (round-per-day-then-sum) value.
        test_recipe:
          setup:
            - "Same-shape ACTIVE below-threshold prescription units_per_day=1.5 pills_dispensed=60 day_supply=40 created at 2026-06-01, audit at 2026-06-21 (20 days), counted_pills=15"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic 4", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "CO One", dea_number: "AC7654321", role_kind: "COMPLIANCE_OFFICER" }
              as: ClinicAdmin
              captures: { co_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Four", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", drug_name: "tramadol", dose_mg: 50, units_per_day: 1.5, conversion_factor: 0.1, day_supply: 40, pills_dispensed: 60 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-21T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/pill-count-audits"
              payload: { prescription_id: "${rx_id}", audit_utc: "2026-06-21T00:00:00Z", counted_pills: 15 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { audit_id: $.data.id }
          assert:
            - "PillCountAudit.${audit_id}.expected_pills_chronological == 20"
            - "PillCountAudit.${audit_id}.discrepancy_pills == 5"
            - "PillCountAudit.${audit_id}.result == INCONSISTENT"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: uds_recollect_cycle_back_to_scheduled
        grounds:
          - state_machines.UrineDrugScreen.RESULTED_INCONSISTENT_to_SCHEDULED
          - state_machines.UrineDrugScreen.COLLECTED_to_RESULTED_INCONSISTENT
          - entities.UrineDrugScreen.fields.recollect_count
        distinguishing_aspect: |
          UrineDrugScreen is cyclic: COLLECTED->RESULTED_INCONSISTENT->SCHEDULED (recollect) returns to a prior
          state, incrementing recollect_count to 1 — a strict cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Patient ACTIVE; one UDS SCHEDULED due 2026-06-01, collected then resulted INCONSISTENT (expected {oxycodone} vs detected {}), clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic 5", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "CO One", dea_number: "AC7654321", role_kind: "COMPLIANCE_OFFICER" }
              as: ClinicAdmin
              captures: { co_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Five", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/urine-drug-screens"
              payload: { due_utc: "2026-06-01T00:00:00Z", expected_substances: ["oxycodone"] }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { uds_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/urine-drug-screens/${uds_id}/collect"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/urine-drug-screens/${uds_id}/result"
              payload: { detected_substances: [] }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/urine-drug-screens/${uds_id}/recollect"
              payload: { due_utc: "2026-06-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { rc: $.data.recollect_count }
          assert:
            - "UrineDrugScreen.${uds_id}.status == SCHEDULED"
            - "UrineDrugScreen.${uds_id}.recollect_count == 1"
            - "UrineDrugScreen.${uds_id}.detected_substances == null"

      - name: rx_taper_reescalate_cycle
        grounds:
          - state_machines.Prescription.ACTIVE_to_TAPERING
          - state_machines.Prescription.TAPERING_to_ACTIVE
          - entities.Prescription.fields.taper_step_pct
        distinguishing_aspect: |
          Prescription (different entity from the UDS cycle) is cyclic: ACTIVE->TAPERING->ACTIVE via re-escalate
          returns to ACTIVE, keeping its provisional MED in the active ledger; a linear pipeline could not return.
        test_recipe:
          setup:
            - "Patient ACTIVE with routed MEDICATION plan; one ACTIVE below-threshold prescription (provisional 20) with taper_step_pct=10"
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Pain Clinic 6", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Six", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
