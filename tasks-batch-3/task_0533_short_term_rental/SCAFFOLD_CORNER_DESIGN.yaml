# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Short-Term Rental City Registration & Lodging Tax — Expert
# Breadth probe: walks references/claim-extraction-guide.md against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_zone_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Zone]
        distinguishing_aspect: "POST /zones with all required fields returns 201 and echoes zone_code, permit_cap; server mints id/version=1/active_permit_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { zone_code: "C1", permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id, apc: $.data.active_permit_count, ver: $.data.version }
          assert:
            - "response http_status == 201"
            - "Zone.zone_code == C1"
            - "Zone.active_permit_count == 0"
            - "Zone.version == 1"

      - name: get_permit_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Permit, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /permits/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /permits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_property_missing_bedroom_count_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Property.fields.bedroom_count, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /properties omitting bedroom_count returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A host and zone exist."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "C2", permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "c2@x.com", full_name: "Host C2" }
              as: CityRegistrar
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "C2 St" }
              as: CityRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: property_max_occupancy_computed_input_ignored
        claim_type: Computed Fields
        grounds: [calculations.occupancy_max, entities.Property.fields.max_occupancy]
        distinguishing_aspect: "max_occupancy is computed 2*bedroom_count+1; a 2-bedroom property yields 5 regardless of any client-supplied value."
        test_recipe:
          setup: ["A host and zone exist."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "C3", permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "c3@x.com", full_name: "Host C3" }
              as: CityRegistrar
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "C3 St", bedroom_count: 2 }
              as: CityRegistrar
              captures: { mo: $.data.max_occupancy }
          assert:
            - "Property.max_occupancy == 5"

      - name: duplicate_zone_code_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Zone.fields.zone_code, "errors[ERR_DUPLICATE_ZONE_CODE]"]
        distinguishing_aspect: "A second POST /zones with an existing zone_code returns ERR_DUPLICATE_ZONE_CODE (409)."
        test_recipe:
          setup: ["A zone with zone_code C4 exists."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "C4", permit_cap: 5 }
              as: CityRegistrar
          trigger:
            - call: "POST /zones"
              payload: { zone_code: "C4", permit_cap: 3 }
              as: CityRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_ZONE_CODE"
            - "http_status == 409"

      - name: listing_report_immutable_no_version
        claim_type: Immutability
        grounds: [entities.ListingReport]
        distinguishing_aspect: "ListingReport has common_fields:false — its create response carries id and created_at but no version field."
        test_recipe:
          setup: ["A platform exists."]
          setup_api_calls:
            - call: "POST /platforms"
              payload: { platform_name: "PlatC5" }
              as: CityRegistrar
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /listing-reports"
              payload: { platform_id: "${pid}", street_address: "Nowhere St", reported_nights: 3 }
              as: Platform
              as_user_id: "${pid}"
              captures: { lid: $.data.id, mr: $.data.match_result }
          assert:
            - "ListingReport.match_result == NO_PERMIT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_from_draft_permit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Permit.ISSUED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a DRAFT (not ISSUED) permit is undefined and returns ERR_INVALID_STATE (409); no version bump."
        test_recipe:
          setup: ["A DRAFT permit, owning host known."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "S1", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "s1@x.com", full_name: "Host S1" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "S1 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "WHOLE_HOME", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /permits/${pid}/activate"
              payload: {}
              as: Host
              as_user_id: "${hid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: reject_terminal_rejected_permit_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Permit.DRAFT_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED permit is terminal; a second reject returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A permit already REJECTED."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "S2", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "s2@x.com", full_name: "Host S2" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "S2 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "WHOLE_HOME", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/reject"
              payload: {}
              as: CityRegistrar
          trigger:
            - call: "POST /permits/${pid}/reject"
              payload: {}
              as: CityRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: complaint_dismiss_no_strike_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.Complaint.OPEN_to_DISMISSED, entities.Complaint.fields.strike_points]
        distinguishing_aspect: "Dismissing an OPEN complaint sets status DISMISSED and leaves strike_points 0; host strike_total unaffected."
        test_recipe:
          setup: ["An ISSUED permit and an OPEN complaint against it."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "S3", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "s3@x.com", full_name: "Host S3" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "S3 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /complaints"
              payload: { permit_id: "${pid}", category: "NOISE" }
              as: CityRegistrar
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /complaints/${cid}/dismiss"
              payload: {}
              as: CityRegistrar
              captures: { st: $.data.status, sp: $.data.strike_points }
          assert:
            - "Complaint.status == DISMISSED"
            - "Complaint.strike_points == 0"
            - "Host.${hid}.strike_total == 0"

      - name: permit_auto_expires_on_clock_advance
        claim_type: Valid Transition
        grounds: [state_machines.Permit.ISSUED_to_EXPIRED, entities.Zone.fields.active_permit_count]
        distinguishing_aspect: "Advancing the clock to expires_at auto-transitions an ISSUED permit to EXPIRED on next GET and decrements zone.active_permit_count from 1 to 0."
        test_recipe:
          setup: ["An ISSUED permit (expires_at 2027-05-01); clock advanced to 2027-05-01."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "S4", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "s4@x.com", full_name: "Host S4" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "S4 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: CityRegistrar
          trigger:
            - call: "GET /permits/${pid}"
              payload: {}
              as: CityRegistrar
              captures: { st: $.data.status }
            - call: "GET /zones/${zid}"
              payload: {}
              as: CityRegistrar
              captures: { apc: $.data.active_permit_count }
          assert:
            - "Permit.${pid}.status == EXPIRED"
            - "Zone.${zid}.active_permit_count == 0"

      - name: reinstate_suspended_permit_returns_active
        claim_type: Valid Transition
        grounds: [state_machines.Permit.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "A SUSPENDED permit (cumulative strike 2, <4) reinstated by the registrar returns to ACTIVE."
        test_recipe:
          setup: ["A SUSPENDED permit: ISSUED, ACTIVE, then one UPHELD OVER_OCCUPANCY (2 pts) pushed it to SUSPENDED."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "S5", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "s5@x.com", full_name: "Host S5" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "S5 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits/${pid}/activate"
              payload: {}
              as: Host
              as_user_id: "${hid}"
            - call: "POST /complaints"
              payload: { permit_id: "${pid}", category: "OVER_OCCUPANCY" }
              as: CityRegistrar
              captures: { cid: $.data.id }
            - call: "POST /complaints/${cid}/uphold"
              payload: {}
              as: CityRegistrar
          trigger:
            - call: "POST /permits/${pid}/reinstate"
              payload: {}
              as: CityRegistrar
              captures: { st: $.data.status }
          assert:
            - "Permit.${pid}.status == ACTIVE"

      - name: uphold_suspends_active_permit_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds: [state_machines.Permit.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / uphold_revoke_frees_seat_and_bars_host_depth3
          rationale: "The suspend-then-revoke cascade side-effect chain is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: tot_due_base_tier_no_straddle_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.tot_due]
        excluded_because:
          difficulty_instance: dual_variant_calc / tot_due_cost_accounting_on_tax_filing
          rationale: "Base-tier tot_due=43000 for 10 nights/$5000 is the asserted value of the named §1.8 instance."

      - name: platform_match_matched_active_permit
        claim_type: Correct Result
        grounds: [calculations.platform_match, entities.ListingReport.fields.match_result]
        distinguishing_aspect: "A ListingReport whose claimed_permit_number and street_address resolve to an ACTIVE permit yields match_result MATCHED and matched_permit_id set."
        test_recipe:
          setup: ["An ACTIVE permit at address 'PM1 St' and a platform."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "PM1", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "pm1@x.com", full_name: "Host PM1" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "PM1 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits/${pid}/activate"
              payload: {}
              as: Host
              as_user_id: "${hid}"
            - call: "POST /platforms"
              payload: { platform_name: "PlatPM1" }
              as: CityRegistrar
              captures: { platid: $.data.id }
          trigger:
            - call: "POST /listing-reports"
              payload: { platform_id: "${platid}", claimed_permit_number: "${pid}", street_address: "PM1 St", reported_nights: 4 }
              as: Platform
              as_user_id: "${platid}"
              captures: { mr: $.data.match_result, mp: $.data.matched_permit_id }
          assert:
            - "ListingReport.match_result == MATCHED"

      - name: platform_match_address_mismatch
        claim_type: Correct Result
        grounds: [calculations.platform_match]
        distinguishing_aspect: "A ListingReport whose claimed_permit_number resolves to a permit but whose street_address differs yields ADDRESS_MISMATCH."
        test_recipe:
          setup: ["An ISSUED permit at 'PM2 St' and a platform submitting a wrong address."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "PM2", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "pm2@x.com", full_name: "Host PM2" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "PM2 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /platforms"
              payload: { platform_name: "PlatPM2" }
              as: CityRegistrar
              captures: { platid: $.data.id }
          trigger:
            - call: "POST /listing-reports"
              payload: { platform_id: "${platid}", claimed_permit_number: "${pid}", street_address: "WRONG St", reported_nights: 2 }
              as: Platform
              as_user_id: "${platid}"
              captures: { mr: $.data.match_result }
          assert:
            - "ListingReport.match_result == ADDRESS_MISMATCH"

      - name: platform_match_no_permit_by_address
        claim_type: Correct Result
        grounds: [calculations.platform_match]
        distinguishing_aspect: "A ListingReport with no claimed_permit_number and an address matching no permit yields NO_PERMIT and matched_permit_id null."
        test_recipe:
          setup: ["A platform exists; no permit at 'PM3 St'."]
          setup_api_calls:
            - call: "POST /platforms"
              payload: { platform_name: "PlatPM3" }
              as: CityRegistrar
              captures: { platid: $.data.id }
          trigger:
            - call: "POST /listing-reports"
              payload: { platform_id: "${platid}", street_address: "PM3 St", reported_nights: 6 }
              as: Platform
              as_user_id: "${platid}"
              captures: { mr: $.data.match_result }
          assert:
            - "ListingReport.match_result == NO_PERMIT"

      - name: tax_penalty_interest_branch_below_cap
        claim_type: Correct Result
        grounds: [calculations.tax_penalty]
        distinguishing_aspect: "A filing 5 days late on unpaid 43000 yields penalty_cents=3575 (flat 2500 + interest 1075), below the 25% cap of 10750 — the interest branch, not the cap branch."
        test_recipe:
          setup: ["A FILED filing tot_due=43000, unpaid, due_at 2026-04-30, clock at 2026-05-05."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "PN1", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "pn1@x.com", full_name: "Host PN1" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "PN1 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /hosts/${hid}/attest-primary-residence"
              payload: { property_id: "${prop}" }
              as: Host
              as_user_id: "${hid}"
            - call: "POST /permits"
              payload: { property_id: "${prop}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${pid}", period_year: 2026, period_month: 3, nights_booked: 10, gross_revenue_cents: 500000 }
              as: TaxOfficer
              captures: { fid: $.data.id }
            - call: "POST /tax-filings/${fid}/file"
              payload: {}
              as: TaxOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: TaxOfficer
          trigger:
            - call: "GET /tax-filings/${fid}"
              payload: {}
              as: TaxOfficer
              captures: { pen: $.data.penalty_cents, st: $.data.status }
          assert:
            - "TaxFiling.${fid}.status == DELINQUENT"
            - "TaxFiling.${fid}.penalty_cents == 3575"

  # ===========================================================================
  - section: validations
    instances:
      - name: whole_home_forbidden_in_disallowed_zone
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_WHOLE_HOME_FORBIDDEN]"]
        distinguishing_aspect: "Issuing a WHOLE_HOME permit in a zone with whole_home_allowed=false returns ERR_WHOLE_HOME_FORBIDDEN (422)."
        test_recipe:
          setup: ["A DRAFT WHOLE_HOME permit in a str_eligible zone with whole_home_allowed=false."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "V1", str_eligible: true, whole_home_allowed: false, permit_cap: 5 }
              as: CityRegistrar
              captures: { zid: $.data.id }
            - call: "POST /hosts"
              payload: { email: "v1@x.com", full_name: "Host V1" }
              as: CityRegistrar
              captures: { hid: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${hid}", zone_id: "${zid}", street_address: "V1 St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop: $.data.id }
            - call: "POST /permits"
