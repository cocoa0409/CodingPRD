            - call: "POST /insurance-filings"
              payload: { authority_id: "${auth2_id}", insurer_id: "${insurer2_id}", filing_type: "BIPD", coverage_limit_cents: 75000000, policy_number: "BIPD-2", effective_at: "2026-09-14T00:00:00Z", expected_authority_version: "${auth2_v3}" }
