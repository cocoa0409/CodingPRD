            - { call: "POST /grillops/devices/${dev_id}/firmware", payload: { action: "UNPAIR" }, as: AppUser, captures: { st2: "$.data.status" } }
            - { call: "POST /grillops/devices/${dev_id}/firmware", payload: { action: "UPDATE", target_version: "2.2.0" }, as: AppUser, captures: { e1: "$.data.error_id" } }
            - { call: "GET /grillops/sales/${sale_id}/devices", as: ServiceAgent, captures: { dev_fw: "$.data[0].firmware_version" } }
          assert:
            - "captured e0 == ERR_DEVICE_NOT_FOUND (404 on unknown device id)"
            - "captured sale_st0 == SOLD and sale_st1 == REGISTERED (pairing registers the sale as a side effect)"
