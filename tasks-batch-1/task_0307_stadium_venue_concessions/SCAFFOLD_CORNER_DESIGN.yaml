scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints.POST./concessions/venues]
        distinguishing_aspect: "POST /concessions/venues with all required fields returns 201 and a Venue with id, version==1, venue_share_pct, service_fee_pct echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /concessions/venues"
              payload: { name: "Coliseum", venue_share_pct: 15, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 5 }
              as: ConcessionsManager
              captures: { v_id: $.data.id, v_ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Venue.${v_id}.venue_share_pct == 15"
            - "Venue.${v_id}.service_fee_pct == 5"
            - "Venue.${v_id}.version == 1"

      - name: get_event_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Event, "errors[ERR_NOT_FOUND]", "endpoints.GET./concessions/events/{id}"]
        distinguishing_aspect: "GET a non-existent event id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /concessions/events/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: create_product_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product, "errors[ERR_INVALID_REQUEST]", endpoints.POST./concessions/products]
        distinguishing_aspect: "POST /concessions/products omitting base_price_cents (a required input with no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V1", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "X", name: "X", unit_cost_cents: 10 }
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 422"

      - name: create_stand_applies_default_demand_tier_mid
        claim_type: Defaults
        grounds: [entities.Stand.fields.demand_tier, endpoints.POST./concessions/stands]
        distinguishing_aspect: "Omitting demand_tier on stand creation applies the default MID."
        test_recipe:
          setup: ["A venue + SCHEDULED event exist."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V2", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E2", doors_time: "2026-07-01T18:00:00.000Z", end_time: "2026-07-01T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S2", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id, s_tier: $.data.demand_tier }
          assert:
            - "Stand.${s_id}.demand_tier == MID"
            - "Stand.${s_id}.status == CLOSED"

      - name: menu_item_price_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.MenuItem.fields.price_cents, calculations.event_day_item_pricing]
        distinguishing_aspect: "MenuItem.price_cents is server-computed from base/multiplier/tier; the create payload has no price field, and the response price equals the off-peak formula 552 for soda base 400, mult 120, MID off-peak."
        test_recipe:
          setup: ["Venue, soda product base 400, event mult 120 doors-open, MID stand (no staff needed; menu create does not require OPEN)."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V3", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "SODA", name: "Soda", base_price_cents: 400, unit_cost_cents: 50, perishable: false }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E3", doors_time: "2026-07-02T18:00:00.000Z", end_time: "2026-07-02T23:00:00.000Z", event_multiplier_pct: 120 }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/events/${e_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S3", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", available: true }
              as: ConcessionsManager
              captures: { mi_id: $.data.id, mi_price: $.data.price_cents }
          assert:
            - "MenuItem.${mi_id}.price_cents == 552"

      - name: waste_record_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WasteRecord]
        distinguishing_aspect: "WasteRecord has common_fields:false → it exposes id and created_at but no version field, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["Venue/event/stand opened, bun stocked one lot; a SPILLAGE waste of 5 buns logged."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V4", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E4", doors_time: "2026-07-03T18:00:00.000Z", end_time: "2026-07-03T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/events/${e_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S4", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 50, unit_cost_cents: 30, par_level: 50, reorder_point: 10 }
              as: StockRunner
          trigger:
            - call: "POST /concessions/waste-records"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", reason: "SPILLAGE", qty: 5 }
              as: StockRunner
              captures: { wr_id: $.data.id }
          assert:
            - "WasteRecord.${wr_id}.cost_cents == 150"
            - "the WasteRecord response has no version field"

      - name: create_event_invalid_enum_multiplier_out_of_range
        claim_type: Type Constraints
        grounds: [entities.Event.fields.event_multiplier_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "event_multiplier_pct=400 exceeds the declared range 50..300 → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V5", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E5", doors_time: "2026-07-04T18:00:00.000Z", end_time: "2026-07-04T23:00:00.000Z", event_multiplier_pct: 400 }
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 422"

      - name: create_event_end_before_doors_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Event.fields.doors_time, entities.Event.fields.end_time, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "end_time <= doors_time fails the body-range check → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V5b", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E5b", doors_time: "2026-07-04T23:00:00.000Z", end_time: "2026-07-04T18:00:00.000Z" }
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 422"

      - name: create_lot_reorder_point_exceeds_par_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.InventoryLot.fields.reorder_point, entities.InventoryLot.fields.par_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "reorder_point=80 > par_level=50 violates the lot body-range constraint → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Venue/event/stand exist."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V6", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E6", doors_time: "2026-07-05T18:00:00.000Z", end_time: "2026-07-05T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S6", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 50, unit_cost_cents: 30, par_level: 50, reorder_point: 80 }
              as: StockRunner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 422"

      - name: lot_remaining_qty_initialized_to_received_qty
        claim_type: Computed Fields
        grounds: [entities.InventoryLot.fields.remaining_qty, entities.InventoryLot.fields.received_qty]
        distinguishing_aspect: "On lot creation, remaining_qty is set equal to received_qty (100) and status defaults ACTIVE regardless of any client-supplied remaining value."
        test_recipe:
          setup: ["Venue/event/stand exist."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V7", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E7", doors_time: "2026-07-06T18:00:00.000Z", end_time: "2026-07-06T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S7", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 100, unit_cost_cents: 30, par_level: 200, reorder_point: 20 }
              as: StockRunner
              captures: { l_id: $.data.id, l_rem: $.data.remaining_qty }
          assert:
            - "InventoryLot.${l_id}.remaining_qty == 100"
            - "InventoryLot.${l_id}.status == ACTIVE"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: settle_from_scheduled_event_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Event, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling an event still in SCHEDULED (settle is only defined from IN_PROGRESS) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A venue + SCHEDULED event exist (no stands, doors never opened)."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V8", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E8", doors_time: "2026-07-07T18:00:00.000Z", end_time: "2026-07-07T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /concessions/events/${e_id}/settle"
              payload: {}
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: cancel_settled_event_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Event, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal SETTLED, re-opening the peak window is undefined → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An event driven to SETTLED with no stands open and no orders (gross 0, waste 0)."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V9", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E9", doors_time: "2026-07-08T18:00:00.000Z", end_time: "2026-07-08T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S9", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/events/${e_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/events/${e_id}/peak-window/open"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/events/${e_id}/settle"
              payload: {}
              as: ConcessionsManager
          trigger:
            - call: "POST /concessions/events/${e_id}/peak-window/open"
              payload: {}
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: check_in_increments_assigned_staff_count
        claim_type: Side Effect Execution
        grounds: [state_machines.StaffShift.SCHEDULED_to_CHECKED_IN, entities.Stand.fields.assigned_staff_count]
        distinguishing_aspect: "Checking a shift in raises the stand's assigned_staff_count from 0 to 1 (the side effect that later permits opening)."
        test_recipe:
          setup: ["Event/stand created (CLOSED), one SCHEDULED shift for the stand; assigned_staff_count starts 0."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V10", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E10", doors_time: "2026-07-09T18:00:00.000Z", end_time: "2026-07-09T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S10", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${s_id}", worker_name: "Ora", shift_start: "2026-07-09T18:00:00.000Z", shift_end: "2026-07-09T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /concessions/staff-shifts/${sh_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "GET /concessions/stands/${s_id}"
              payload: {}
              as: StandOperator
              captures: { s_cnt: $.data.assigned_staff_count }
          assert:
            - "Stand.${s_id}.assigned_staff_count == 1"
            - "StaffShift.${sh_id}.status == CHECKED_IN"

      - name: double_check_in_returns_invalid_state_idempotency
        claim_type: Idempotency
        grounds: [state_machines.StaffShift.SCHEDULED_to_CHECKED_IN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking the same shift in twice: the second call sees status CHECKED_IN (not SCHEDULED) and is rejected ERR_INVALID_STATE (409); count is not double-incremented."
        test_recipe:
          setup: ["A SCHEDULED shift already checked in once."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V11", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E11", doors_time: "2026-07-10T18:00:00.000Z", end_time: "2026-07-10T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S11", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${s_id}", worker_name: "Pia", shift_start: "2026-07-10T18:00:00.000Z", shift_end: "2026-07-10T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { sh_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${sh_id}/check-in"
              payload: {}
              as: StandOperator
          trigger:
            - call: "POST /concessions/staff-shifts/${sh_id}/check-in"
              payload: {}
              as: StandOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: close_stand_with_placed_order_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Stand.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing an OPEN stand that still has a PLACED order violates the close precondition (no PLACED/READY order) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Event/stand opened with staff, water stocked, an order PLACED at the stand."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V12", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "WATER", name: "Water", base_price_cents: 100, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E12", doors_time: "2026-07-11T18:00:00.000Z", end_time: "2026-07-11T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/events/${e_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S12", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${s_id}", worker_name: "Quin", shift_start: "2026-07-11T18:00:00.000Z", shift_end: "2026-07-11T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { sh_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${sh_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${s_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", available: true }
              as: ConcessionsManager
              captures: { mi_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 50, unit_cost_cents: 10, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "Pat12" }
