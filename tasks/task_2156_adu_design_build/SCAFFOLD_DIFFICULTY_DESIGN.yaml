            - "AduProject.${proj_b_id}.status == 'PERMITTED'"

      - name: inspector_slot_capacity_conserved_on_cancel
        grounds:
          - state_machines.InspectionAppointment.SCHEDULED_to_CANCELLED
          - validations[priority=68]
          - entities.Inspector.fields.daily_capacity
        distinguishing_aspect: |
          Conserved quantity 2 — a CAPACITY COUNT rather than money, pinned as
          remaining_slots(I, D) == Inspector.daily_capacity - count(InspectionAppointment with
          inspector_id == I, slot_date == D, status IN {SCHEDULED, PARTIAL}). Booking a slot
          and then cancelling it must return remaining_slots on 2026-09-02 to the exact
          pre-booking value of 2, leaving no leaked slot.
        test_recipe:
          setup:
            - "Inspector I2 in PLMD with daily_capacity 2 and zero appointments on 2026-09-02."
            - "AduProject B on Property P2 in PLMD at status PERMITTED with ConstructionPhase F SCHEDULED for 2026-09-01 through 2026-09-05."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /inspectors"
              payload: { jurisdiction_id: "${jur_plmd_id}", full_name: "T. Alvarez", certifications: ["STRUCTURAL", "ELECTRICAL", "PLUMBING", "ENVELOPE", "FINAL"], daily_capacity: 2, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { insp_2_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
            - call: "POST /permit-submittals/${sub_b_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_b_id}/plan-check-result"
              payload: { outcome: "APPROVED" }
              as: PlanChecker
            - call: "POST /adu-projects/${proj_b_id}/construction-phases"
              payload: { phase_code: "FOUNDATION", disruption_class: "INVASIVE", sequence_index: 0 }
              as: ProjectManager
              captures: { phase_f_id: $.data.id }
            - call: "POST /construction-phases/${phase_f_id}/schedule"
              payload: { window_start_date: "2026-09-01", window_end_date: "2026-09-05" }
              as: ProjectManager
            - call: "GET /inspectors/${insp_2_id}/availability"
              payload: { slot_date: "2026-09-02" }
              as: ProjectManager
              captures: { rem_before: $.data.remaining_slots }
            - call: "POST /construction-phases/${phase_f_id}/inspection-appointments"
              payload: { inspector_id: "${insp_2_id}", inspection_type: "FOUNDATION", slot_date: "2026-09-02", slot_start: "2026-09-02T09:00:00Z", slot_end: "2026-09-02T10:00:00Z" }
              as: ProjectManager
              captures: { appt_1_id: $.data.id }
            - call: "GET /inspectors/${insp_2_id}/availability"
              payload: { slot_date: "2026-09-02" }
              as: ProjectManager
              captures: { rem_booked: $.data.remaining_slots }
          trigger:
            - call: "POST /inspection-appointments/${appt_1_id}/cancel"
              payload: {}
              as: ProjectManager
          assert:
            - "the captured rem_before == 2"
            - "the captured rem_booked == 1"
            - "InspectionAppointment.${appt_1_id}.status == 'CANCELLED'"
            - "GET /inspectors/${insp_2_id}/availability?slot_date=2026-09-02 returns booked_count == 0 and remaining_slots == 2, exactly the pre-booking value"
            - "GET /inspection-appointments?inspector_id=${insp_2_id}&slot_date=2026-09-02&status=SCHEDULED returns total_count == 0"
