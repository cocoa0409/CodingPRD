scenario: "desgin task harder than expert level.!!!!2148. Water Taxi & Harbor Shuttle Operations (harbor water taxi operator): on-demand vs scheduled stop routing, capacity & tide/weather constraints, ticketing & multi-ride pass, dock slot sharing & landing fees, crew certification & vessel inspection, event surge (game day) capacity plan, service interruption & refund, seasonal operations & winter layup"
domain_name: "water-taxi-harbor-shuttle"
api_prefix: "/harbor"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_free_flat_references
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Twelve peer entities linked by foreign keys only (no nested ownership tree). Trip carries two
    independent state axes (operational_status x settlement_status). Booking is cyclic
    (OFFERED -> REQUESTED on decline, bounded by offer_round). ServiceDay.posture is a derived
    aggregate that gates every downstream vessel movement. Two interval-overlap regimes with
    deliberately different geometry (half-open + turnaround buffer + berth_count aggregate
    capacity on Dock, versus closed-closed calendar-date single-occupancy layup window on
    Vessel). Landing fees are posted provisionally at departure and reversed-then-reposted at
    completion, which makes Dock.accrued_fee_cents a conserved quantity that only balances when
    the compensating reversal is executed in the pinned order.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Dock
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable dock name."
        constraints: "1..80 chars, required"
      - name: berth_count
        type: integer
        source: input
        description: "Number of berths usable at once; the aggregate capacity used by the DockSlot overlap rule."
        constraints: ">= 1"
      - name: min_turnaround_minutes
        type: integer
        source: input
        description: "Buffer in whole minutes appended to BOTH ends of every existing slot and of the candidate slot when testing berth occupancy overlap."
        default: 15
        constraints: ">= 0"
      - name: landing_fee_per_pax_cents
        type: integer
        source: input
        description: "Per-passenger landing fee charged on a DockSlot posting."
        constraints: ">= 0"
      - name: berth_minute_rate_cents
        type: integer
        source: input
        description: "Per-berth-minute occupancy rate charged on a DockSlot posting."
        constraints: ">= 0"
      - name: monthly_fee_cap_cents
        type: integer
        source: input
        description: "Hard ceiling on accrued_fee_cents. Evaluated ONLY on the FINAL posting made by POST /harbor/trips/{id}/complete."
        constraints: ">= 1"
      - name: shared_operator_count
        type: integer
        source: input
        description: "How many operators share this dock. Recorded for reporting; never participates in any calculation or selector."
        default: 1
        constraints: ">= 1"
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "Running landing-fee accrual for this dock. Invariant INV_DOCK_FEE_CONSERVATION pins it against DockSlot rows."
        default: 0
      - name: fee_status
        type: enum
        source: computed
        description: "ACCRUING until a FINAL posting drives accrued_fee_cents to monthly_fee_cap_cents, then CAPPED forever."
        default: "ACCRUING"
        constraints: "one of {ACCRUING, CAPPED}"

  - name: Stop
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: dock_id
        type: string
        source: input
        description: "FK -> Dock.id; the dock this stop physically lands at."
      - name: name
        type: string
        source: input
        description: "Stop name shown to riders."
        constraints: "1..80 chars, required"
      - name: zone_index
        type: integer
        source: input
        description: "Fare zone ordinal. zone_span between two stops is abs(destination.zone_index - origin.zone_index)."
        constraints: "1..6"
      - name: charted_depth_m
        type: number
        source: input
        description: "Charted depth at the stop in metres relative to chart datum, 2 decimals."
        constraints: ">= 0.00"

  - name: Vessel
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Vessel name."
        constraints: "1..80 chars, required"
      - name: seat_capacity
        type: integer
        source: input
        description: "Certificated seated passenger capacity."
        constraints: ">= 1"
      - name: draft_m
        type: number
        source: input
        description: "Loaded draft in metres, 2 decimals. Under-keel clearance is round_half_up(ServiceDay.low_water_m - draft_m, 2)."
        constraints: "> 0.00"
      - name: hull_class
        type: enum
        source: input
        description: "HARBOR hulls may not depart while ServiceDay.posture is RESTRICTED; OFFSHORE hulls may."
        constraints: "one of {HARBOR, OFFSHORE}"
      - name: required_endorsement
        type: enum
        source: input
        description: "Minimum crew endorsement required to master this vessel. Rank order MASTER_25T < MASTER_100T."
        constraints: "one of {MASTER_25T, MASTER_100T}"
      - name: layup_start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD, inclusive) of the seasonal winter-layup window, or null when the vessel has no layup planned."
        default: null
      - name: layup_end_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) of the seasonal winter-layup window, or null. Must be >= layup_start_date."
        default: null
      - name: service_state
        type: enum
        source: computed
        description: "Derived at every read and at every gate check from the logical clock, the layup window, and the latest ANNUAL VesselInspection."
        constraints: "one of {IN_SERVICE, LAID_UP, OUT_OF_SERVICE}"
      - name: annual_inspection_expires_on
        type: string
        source: computed
        description: "expires_on of the latest ANNUAL VesselInspection for this vessel (see calculation latest_annual_inspection), or null when none exists."

  - name: VesselInspection
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the inspected vessel."
      - name: inspection_type
        type: enum
        source: input
        description: "ANNUAL rows gate departures for 365 days; PRE_DEPARTURE rows are advisory and never gate anything."
        constraints: "one of {ANNUAL, PRE_DEPARTURE}"
      - name: result
        type: enum
        source: input
        description: "Inspection outcome."
        constraints: "one of {PASS, PASS_WITH_DEFICIENCIES, FAIL}"
      - name: deficiency_count
        type: integer
        source: input
        description: "Open deficiencies recorded by this inspection."
        default: 0
        constraints: ">= 0"
      - name: performed_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the inspection was carried out. Primary sort key of latest_annual_inspection."
      - name: expires_on
        type: string
        source: computed
        description: "performed_on + 365 days for inspection_type ANNUAL; null for PRE_DEPARTURE."
      - name: inspector_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the MarineInspector who filed the row."

  - name: CrewMember
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Crew member name."
        constraints: "1..80 chars, required"
      - name: endorsement_class
        type: enum
        source: input
        description: "Held endorsement. Rank order MASTER_25T < MASTER_100T."
        constraints: "one of {MASTER_25T, MASTER_100T}"
      - name: cert_expires_on
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) the licence endorsement remains current."
      - name: medical_expires_on
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) the medical certificate remains current."
      - name: status
        type: enum
        source: input
        description: "SUSPENDED crew may not master a departure."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: trips_mastered_count
        type: integer
        source: computed
        description: "Count of Trip rows with master_crew_id = this crew member and operational_status = COMPLETED."
        default: 0

  - name: ServiceDay
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) this row governs. Globally unique."
        constraints: "unique across all ServiceDay rows"
      - name: wind_knots
        type: number
        source: input
        description: "Observed sustained wind in knots, 1 decimal."
        constraints: ">= 0.0"
      - name: wave_height_m
        type: number
        source: input
        description: "Observed significant wave height in metres, 2 decimals."
        constraints: ">= 0.00"
      - name: low_water_m
        type: number
        source: input
        description: "Predicted lowest water level of the day in metres above chart datum, 2 decimals."
        constraints: ">= 0.00"
      - name: manual_suspension
        type: boolean
        source: input
        description: "Operator override that forces posture SUSPENDED regardless of the observed weather and tide."
        default: false
      - name: event_name
        type: string
        source: input
        description: "Name of the stadium/arena event driving surge on this date, or null when there is none."
        default: null
      - name: expected_attendance
        type: integer
        source: input
        description: "Forecast attendance for event_name. Selects surge_tier."
        default: 0
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate for every vessel movement on this date (see calculation service_day_posture)."
        constraints: "one of {NORMAL, RESTRICTED, SUSPENDED}"
      - name: surge_tier
        type: enum
        source: computed
        description: "NONE / ELEVATED / PEAK selected from expected_attendance (see calculation surge_tier_selection)."
        constraints: "one of {NONE, ELEVATED, PEAK}"
      - name: surge_multiplier_bp
        type: integer
        source: computed
        description: "Basis-point fare multiplier implied by surge_tier: NONE 10000, ELEVATED 12500, PEAK 15000."
      - name: planned_extra_vessels
        type: integer
        source: computed
        description: "Event surge capacity plan: 0 when surge_tier is NONE, 1 when ELEVATED, 2 when PEAK."
        default: 0

  - name: Trip
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_day_id
        type: string
        source: input
        description: "FK -> ServiceDay.id; the operating day whose posture gates this trip."
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the assigned vessel."
      - name: master_crew_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the crew member who must act as VesselMaster on board/depart/complete."
      - name: origin_stop_id
        type: string
        source: input
        description: "FK -> Stop.id; departure stop."
      - name: destination_stop_id
        type: string
        source: input
        description: "FK -> Stop.id; arrival stop."
      - name: service_mode
        type: enum
        source: input
        description: "SCHEDULED trips are published timetable sailings; ON_DEMAND trips are opened for dispatch of on-demand bookings."
        constraints: "one of {SCHEDULED, ON_DEMAND}"
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: "Timetabled departure instant, ISO 8601 UTC."
      - name: scheduled_arrival_utc
        type: datetime
        source: input
        description: "Timetabled arrival instant, ISO 8601 UTC. Must be strictly after scheduled_departure_utc."
      - name: actual_departure_utc
        type: datetime
        source: system
        description: "Logical-clock reading at the instant POST /harbor/trips/{id}/depart succeeded; null before that."
        default: null
      - name: actual_arrival_utc
        type: datetime
        source: system
        description: "Logical-clock reading at the instant POST /harbor/trips/{id}/complete succeeded; null before that."
        default: null
      - name: effective_capacity
        type: integer
        source: computed
        description: "Saleable seats for this trip after posture, tide, crew and event-surge adjustment (see calculation trip_effective_capacity)."
      - name: seats_committed
        type: integer
        source: computed
        description: "Sum of Booking.party_size over bookings on this trip whose status is in {CONFIRMED, BOARDED}."
        default: 0
      - name: booked_pax
        type: integer
        source: system
        description: "Snapshot of seats_committed taken at the moment of departure; the PROVISIONAL landing-fee pax basis."
        default: 0
      - name: boarded_pax
        type: integer
        source: system
        description: "Sum of party_size over the bookings named in the boarding manifest; the FINAL landing-fee pax basis."
        default: 0
      - name: operational_status
        type: enum
        source: system
        description: "Movement axis of the trip. Evolves independently of settlement_status."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, BOARDING, DEPARTED, COMPLETED, CANCELLED}"
      - name: settlement_status
        type: enum
        source: system
        description: "Money axis of the trip. Evolves independently of operational_status."
        default: "UNSETTLED"
        constraints: "one of {UNSETTLED, PROVISIONAL, FINAL, VOID}"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "Sum of DockSlot.projected_fee_cents posted for this trip at departure."
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Sum of DockSlot.landing_fee_cents posted for this trip at completion."
        default: 0
      - name: cancellation_reason
        type: string
        source: system
        description: "Free text stamped when the trip is auto-cancelled by a posture cascade; null otherwise."
        default: null

  - name: DockSlot
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: dock_id
        type: string
        source: input
        description: "FK -> Dock.id; the dock whose berths this slot occupies."
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the trip that reserved this slot."
      - name: purpose
        type: enum
        source: input
        description: "LANDING slots are billed; LAYOVER slots occupy a berth but are billed at pax_basis 0."
        constraints: "one of {LANDING, LAYOVER}"
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start of the reserved berth occupancy, ISO 8601 UTC."
      - name: end_utc
        type: datetime
        source: input
        description: "Exclusive end of the reserved berth occupancy, ISO 8601 UTC. Must be strictly after start_utc."
      - name: status
        type: enum
        source: system
        description: "RESERVED on creation; CONSUMED when the trip completes; VOIDED when the trip is cancelled."
        default: "RESERVED"
        constraints: "one of {RESERVED, CONSUMED, VOIDED}"
      - name: pax_basis
        type: integer
        source: system
        description: "Passenger count actually used by the most recent fee posting on this slot."
        default: 0
      - name: berth_minutes
        type: integer
        source: computed
        description: "Whole minutes of berth occupancy used by the most recent fee posting on this slot."
        default: 0
      - name: rebate_bp
        type: integer
        source: computed
        description: "Shared-dock rebate in basis points selected by the most recent fee posting on this slot, or pre-locked to 10000 when a cap flip on the dock made every remaining reservation fee-free."
        default: 0
      - name: projected_fee_cents
        type: integer
        source: computed
        description: "PROVISIONAL fee posted at departure. Reversed out of Dock.accrued_fee_cents at completion and reset to 0."
        default: 0
      - name: landing_fee_cents
        type: integer
        source: computed
        description: "FINAL fee posted at completion. Stays 0 until the trip completes and 0 forever if the slot is VOIDED."
        default: 0

  - name: RidePass
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: rider_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Rider who bought the pass; ownership is compared against this value, never against any entity id."
      - name: zone_tier
        type: enum
        source: input
        description: "Coverage tier: INNER covers zone_span <= 1, OUTER covers zone_span <= 3, ALL_ZONE covers any zone_span."
        constraints: "one of {INNER, OUTER, ALL_ZONE}"
      - name: rides_purchased
        type: integer
        source: input
        description: "Rides bought on this pass."
        constraints: ">= 1"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Amount paid for the pass."
        constraints: ">= 0"
      - name: valid_until
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) the pass may be redeemed."
      - name: rides_remaining
        type: integer
        source: computed
        description: "rides_purchased minus rides currently held as REDEEMED by bookings on this pass. Invariant INV_RIDE_CREDIT_CONSERVATION pins it."
      - name: rides_consumed
        type: integer
        source: computed
        description: "Sum of Booking.party_size over bookings whose ride_pass_id is this pass and whose redemption_status is REDEEMED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while redeemable; EXHAUSTED at zero remaining; back to ACTIVE when a restoration returns rides; EXPIRED and REFUNDED are terminal."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, EXHAUSTED, EXPIRED, REFUNDED}"
      - name: refund_basis
        type: enum
        source: system
        description: "Which residual-value variant was applied when the pass was refunded; null until then."
        default: null
        constraints: "one of {PRO_RATA, DIFFERENTIAL} or null"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Residual value paid out when the pass was refunded (see calculation ride_pass_residual_value)."
        default: 0

  - name: Booking
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: rider_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Rider who created the booking; ownership is compared against this value."
      - name: trip_id
        type: string
        source: system
        description: "FK -> Trip.id; the currently offered or confirmed trip, or null while the booking sits in REQUESTED."
        default: null
      - name: ride_pass_id
        type: string
        source: input
        description: "FK -> RidePass.id; the pass tendered for this booking, or null for a cash booking."
        default: null
      - name: origin_stop_id
        type: string
        source: input
        description: "FK -> Stop.id; requested departure stop."
      - name: destination_stop_id
        type: string
        source: input
        description: "FK -> Stop.id; requested arrival stop."
      - name: requested_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of travel. Resolved to the ServiceDay whose service_date equals it."
      - name: service_mode
        type: enum
        source: input
        description: "SCHEDULED bookings may only be offered SCHEDULED trips; ON_DEMAND bookings may only be offered ON_DEMAND trips."
        constraints: "one of {SCHEDULED, ON_DEMAND}"
      - name: party_size
        type: integer
        source: input
        description: "Number of passengers travelling on this booking."
        constraints: "1..12"
      - name: offer_round
        type: integer
        source: system
        description: "Number of offers this booking has declined. At 3 the booking becomes UNFULFILLED."
        default: 0
      - name: declined_trip_ids
        type: array
        source: system
        description: "Trip ids this booking has already declined; excluded from every later dispatch candidate pool."
        default: []
      - name: status
        type: enum
        source: system
        description: "Cyclic lifecycle; OFFERED can fall back to REQUESTED on decline."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, OFFERED, CONFIRMED, BOARDED, COMPLETED, INTERRUPTED, UNFULFILLED}"
      - name: redemption_status
        type: enum
        source: system
        description: "NONE for cash bookings; REDEEMED once pass rides are taken; RESTORED once a service interruption gives them back."
        default: "NONE"
        constraints: "one of {NONE, REDEEMED, RESTORED}"
      - name: interrupted_from_status
        type: enum
        source: system
        description: "The status the booking held immediately before the posture cascade moved it to INTERRUPTED; selects the entitlement branch of interruption_refund_waterfall. Null until interrupted."
        default: null
        constraints: "one of {OFFERED, CONFIRMED, BOARDED} or null"
      - name: fare_quoted_cents
        type: integer
        source: computed
        description: "Fare locked at booking creation (see calculation booking_fare_quote). Never re-quoted afterwards."
      - name: fare_charged_cents
        type: integer
        source: computed
        description: "fare_quoted_cents at confirmation for a cash booking; 0 for a pass booking."
        default: 0
      - name: fare_refunded_cents
        type: integer
        source: computed
        description: "Cash bucket of the interruption refund waterfall."
        default: 0
      - name: credit_refunded_cents
        type: integer
        source: computed
        description: "Harbor-credit bucket of the interruption refund waterfall."
        default: 0

  - name: ServiceInterruption
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_day_id
        type: string
        source: input
        description: "FK -> ServiceDay.id; the suspended operating day this interruption covers."
      - name: cause
        type: enum
        source: input
        description: "Recorded cause of the interruption."
        constraints: "one of {WEATHER, TIDE, MECHANICAL, DOCK_CLOSURE}"
      - name: declared_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Dispatcher who declared it; copied onto every RefundClaim it creates."
      - name: status
        type: enum
        source: system
        description: "DECLARED on creation; RESOLVED once every RefundClaim it created has left OPEN."
        default: "DECLARED"
        constraints: "one of {DECLARED, RESOLVED}"
      - name: affected_booking_count
        type: integer
        source: computed
        description: "Number of RefundClaim rows this interruption created."
        default: 0
      - name: total_provisional_refund_cents
        type: integer
        source: computed
        description: "Sum of entitlement_cents over the RefundClaim rows this interruption created."
        default: 0

  - name: RefundClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the interrupted booking this claim compensates."
      - name: service_interruption_id
        type: string
        source: system
        description: "FK -> ServiceInterruption.id; the declaration that created this claim."
      - name: declarer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID copied from ServiceInterruption.declared_by_user_id; the segregation-of-duties comparand."
      - name: approver_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FareAuditor who approved the claim; null while OPEN."
        default: null
      - name: entitlement_cents
        type: integer
        source: computed
        description: "Total compensation owed before waterfall allocation (see calculation interruption_refund_waterfall)."
        default: 0
      - name: cash_refund_cents
        type: integer
        source: computed
        description: "Cash bucket of the waterfall, capped at CASH_REFUND_CAP_CENTS."
        default: 0
      - name: credit_refund_cents
        type: integer
        source: computed
        description: "Harbor-credit bucket of the waterfall; receives everything the cash bucket could not absorb."
        default: 0
      - name: ride_restored
        type: boolean
        source: computed
        description: "True when the interrupted booking was a pass booking and the cascade already returned its rides in kind."
        default: false
      - name: status
        type: enum
        source: system
        description: "OPEN on creation; APPROVED then PAID by a FareAuditor; DENIED is terminal."
        default: "OPEN"
        constraints: "one of {OPEN, APPROVED, DENIED, PAID}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Trip, axis 1 of 2: movement -----------------------------------------
  - entity: Trip
    state_field: operational_status
    shape: parallel
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      This axis evolves independently of Trip.settlement_status. A trip is DEPARTED while it is
      PROVISIONAL, and COMPLETED while it is FINAL, but the two axes are written by different
      clauses of the same transitions and are asserted separately.
    transitions:
      - from: SCHEDULED
        to: BOARDING
        trigger: "POST /harbor/trips/{id}/board"
        actor: VesselMaster
        preconditions:
          - "acting X-User-ID equals Trip.master_crew_id"
          - "Trip.operational_status == SCHEDULED (else ERR_TRIP_NOT_SCHEDULED)"
          - "ServiceDay(Trip.service_day_id).posture != SUSPENDED (else ERR_SERVICE_SUSPENDED)"
          - "every id in boarded_booking_ids is a Booking with trip_id == Trip.id and status == CONFIRMED (else ERR_BOOKING_NOT_CONFIRMED)"
          - "sum of party_size over boarded_booking_ids <= Trip.effective_capacity (else ERR_TRIP_CAPACITY_EXCEEDED)"
        side_effects:
          - "sets Trip.boarded_pax = sum of Booking.party_size over boarded_booking_ids"
          - "sets each named Booking.status = BOARDED"
          - "recomputes Trip.seats_committed (BOARDED bookings still count)"
          - "increments Trip.version by 1"

      - from: BOARDING
        to: DEPARTED
        trigger: "POST /harbor/trips/{id}/depart"
        actor: VesselMaster
        preconditions:
          - "acting X-User-ID equals Trip.master_crew_id"
          - "Trip.operational_status == BOARDING (else ERR_TRIP_NOT_BOARDING)"
          - "ServiceDay.posture != SUSPENDED (else ERR_SERVICE_SUSPENDED)"
          - "Vessel.service_state == IN_SERVICE (LAID_UP -> ERR_VESSEL_IN_LAYUP, OUT_OF_SERVICE -> ERR_VESSEL_OUT_OF_SERVICE)"
          - "latest ANNUAL VesselInspection exists, result in {PASS, PASS_WITH_DEFICIENCIES}, expires_on >= date(clock_now); and when ServiceDay.posture == RESTRICTED also deficiency_count <= MAX_DEFICIENCIES_RESTRICTED, where MAX_DEFICIENCIES_RESTRICTED is 2 (else ERR_VESSEL_INSPECTION_INVALID)"
          - "ServiceDay.posture != RESTRICTED or Vessel.hull_class == OFFSHORE (else ERR_HULL_CLASS_RESTRICTED)"
          - "CrewMember.status == ACTIVE and cert_expires_on >= date(clock_now) and medical_expires_on >= date(clock_now) (else ERR_CREW_CERT_EXPIRED)"
          - "rank(CrewMember.endorsement_class) >= rank(Vessel.required_endorsement) (else ERR_CREW_ENDORSEMENT_INSUFFICIENT)"
          - "round_half_up(ServiceDay.low_water_m - Vessel.draft_m, 2) >= MIN_UNDER_KEEL_CLEARANCE_M (else ERR_UNDER_KEEL_CLEARANCE)"
        side_effects:
          - "sets Trip.actual_departure_utc = clock_now"
          - "sets Trip.booked_pax = Trip.seats_committed (the PROVISIONAL pax basis snapshot)"
          - "runs calculation dock_slot_fee_posting variant PROVISIONAL for every RESERVED DockSlot of this trip, writing DockSlot.projected_fee_cents / berth_minutes / rebate_bp / pax_basis"
          - "adds each slot's projected_fee_cents to Dock.accrued_fee_cents and increments Dock.version by 1 per touched dock (cap NOT evaluated on provisional postings)"
          - "sets Trip.provisional_fee_cents = sum of the posted projected_fee_cents"
          - "sets Trip.settlement_status = PROVISIONAL"
          - "increments Trip.version by 1"

      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /harbor/trips/{id}/complete"
        actor: VesselMaster
        preconditions:
          - "acting X-User-ID equals Trip.master_crew_id"
          - "Trip.operational_status == DEPARTED (else ERR_TRIP_NOT_DEPARTED)"
          - "clock_now > Trip.actual_departure_utc (else ERR_INVALID_TIME_WINDOW)"
        side_effects:
          - "sets Trip.actual_arrival_utc = clock_now"
          - "CASCADE B link 1: for every RESERVED DockSlot of this trip, subtracts DockSlot.projected_fee_cents from Dock.accrued_fee_cents, sets projected_fee_cents = 0, then runs calculation dock_slot_fee_posting variant FINAL and sets DockSlot.landing_fee_cents, status = CONSUMED"
          - "CASCADE B link 2: adds the FINAL landing_fee_cents to Dock.accrued_fee_cents; when the result reaches or exceeds Dock.monthly_fee_cap_cents the excess is trimmed off landing_fee_cents, accrued_fee_cents is pinned to monthly_fee_cap_cents and Dock.fee_status flips ACCRUING -> CAPPED"
          - "CASCADE B link 3: because Dock.fee_status became CAPPED, every still-RESERVED DockSlot on that same dock has its rebate_bp pre-locked to 10000, so any later posting on it computes a fee of exactly 0"
          - "sets Trip.final_fee_cents = sum of the posted landing_fee_cents"
          - "sets Trip.settlement_status = FINAL"
          - "sets every Booking on this trip with status == BOARDED to COMPLETED"
          - "increments CrewMember.trips_mastered_count by 1"
          - "increments Dock.version by 1 per touched dock and Trip.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: ServiceDay.posture recomputed to SUSPENDED by PATCH /harbor/service-days/{id}"
        actor: system
        preconditions:
          - "Trip.service_day_id is the recomputed ServiceDay"
          - "Trip.operational_status == SCHEDULED"
        side_effects:
          - "CASCADE A link 1: sets Trip.operational_status = CANCELLED, Trip.settlement_status = VOID, Trip.cancellation_reason = 'POSTURE_SUSPENDED'"
          - "CASCADE A link 2a: because the trip was cancelled, every DockSlot of this trip with status == RESERVED becomes VOIDED with projected_fee_cents = 0 and landing_fee_cents = 0"
          - "CASCADE A link 2b: because the trip was cancelled, every Booking on this trip with status in {OFFERED, CONFIRMED, BOARDED} becomes INTERRUPTED, its previous status is stamped into Booking.interrupted_from_status, and its trip_id is retained for claim lookup"
          - "CASCADE A link 3: because a Booking became INTERRUPTED while redemption_status == REDEEMED, its RidePass gains back party_size rides (rides_remaining += party_size), the booking's redemption_status becomes RESTORED, and a RidePass whose status was EXHAUSTED returns to ACTIVE"
          - "recomputes Trip.seats_committed to 0 and increments Trip.version by 1"

      - from: BOARDING
        to: CANCELLED
        trigger: "system event: ServiceDay.posture recomputed to SUSPENDED by PATCH /harbor/service-days/{id}"
        actor: system
        preconditions:
          - "Trip.service_day_id is the recomputed ServiceDay"
          - "Trip.operational_status == BOARDING"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED cascade; Trip.boarded_pax is deliberately LEFT at its boarding value so the audit trail survives the cancellation"

  # ---- Trip, axis 2 of 2: money --------------------------------------------
  - entity: Trip
    state_field: settlement_status
    shape: parallel
    initial_state: UNSETTLED
    terminal_states: [FINAL, VOID]
    note: "Written by the same endpoints as the movement axis but asserted separately; UNSETTLED persists across the SCHEDULED -> BOARDING move."
    transitions:
      - from: UNSETTLED
        to: PROVISIONAL
        trigger: "POST /harbor/trips/{id}/depart"
        actor: VesselMaster
        preconditions:
          - "Trip.settlement_status == UNSETTLED"
          - "the movement axis transition BOARDING -> DEPARTED succeeded"
        side_effects:
          - "PROVISIONAL landing-fee postings described on the movement axis"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /harbor/trips/{id}/complete"
        actor: VesselMaster
        preconditions:
          - "Trip.settlement_status == PROVISIONAL"
          - "the movement axis transition DEPARTED -> COMPLETED succeeded"
        side_effects:
          - "provisional reversal then FINAL postings described on the movement axis"
      - from: UNSETTLED
        to: VOID
        trigger: "system event: posture cascade cancels the trip"
        actor: system
        preconditions:
          - "Trip.settlement_status == UNSETTLED"
        side_effects:
          - "no money is posted; every DockSlot of the trip is VOIDED with both fee fields at 0"

  # ---- Booking: cyclic ------------------------------------------------------
  - entity: Booking
    state_field: status
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [COMPLETED, INTERRUPTED, UNFULFILLED]
    transitions:
      - from: REQUESTED
        to: OFFERED
        trigger: "POST /harbor/bookings/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Booking.status == REQUESTED (else ERR_BOOKING_NOT_REQUESTED)"
          - "the candidate pool defined by calculation trip_dispatch_selector is non-empty (else ERR_NO_ELIGIBLE_TRIP)"
        side_effects:
          - "sets Booking.trip_id to the selected trip"
          - "increments Booking.version by 1"
        note: "Dispatch does not commit seats; seats_committed only moves at confirmation."

      - from: OFFERED
        to: REQUESTED
        trigger: "POST /harbor/bookings/{id}/decline"
        actor: Rider
        preconditions:
          - "acting X-User-ID equals Booking.rider_user_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Booking.status == OFFERED (else ERR_BOOKING_NOT_OFFERED)"
          - "Booking.offer_round + 1 < MAX_OFFER_ROUNDS, where MAX_OFFER_ROUNDS is 3"
        side_effects:
          - "appends the current trip_id to Booking.declined_trip_ids, then sets trip_id = null"
          - "increments Booking.offer_round by 1"
          - "increments Booking.version by 1"
        note: "This is the cycle edge: the booking returns to the dispatch pool with a larger exclusion set."

      - from: OFFERED
        to: UNFULFILLED
        trigger: "POST /harbor/bookings/{id}/decline"
        actor: Rider
        preconditions:
          - "acting X-User-ID equals Booking.rider_user_id"
          - "Booking.status == OFFERED"
          - "Booking.offer_round + 1 >= MAX_OFFER_ROUNDS, where MAX_OFFER_ROUNDS is 3"
        side_effects:
          - "appends the current trip_id to Booking.declined_trip_ids, then sets trip_id = null"
          - "increments Booking.offer_round by 1 (reaching MAX_OFFER_ROUNDS)"
          - "increments Booking.version by 1"

      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /harbor/bookings/{id}/confirm"
        actor: Rider
        preconditions:
          - "acting X-User-ID equals Booking.rider_user_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Booking.status == OFFERED (else ERR_BOOKING_NOT_OFFERED)"
          - "Trip(Booking.trip_id).operational_status == SCHEDULED (else ERR_TRIP_NOT_SCHEDULED)"
          - "expected_trip_version equals Trip.version (else ERR_STALE_TRIP_VERSION, 412)"
          - "ServiceDay(Trip.service_day_id).posture != SUSPENDED (else ERR_SERVICE_SUSPENDED)"
          - "when ride_pass_id is set: RidePass.zone_tier covers abs(destination.zone_index - origin.zone_index) (else ERR_PASS_ZONE_NOT_COVERED)"
          - "when ride_pass_id is set: RidePass.valid_until >= date(clock_now) (else the pass is moved to EXPIRED and ERR_PASS_EXPIRED is returned)"
          - "when ride_pass_id is set: RidePass.status == ACTIVE (else ERR_PASS_NOT_ACTIVE)"
          - "when ride_pass_id is set: RidePass.rides_remaining >= Booking.party_size (else ERR_PASS_NO_RIDES_REMAINING)"
          - "Trip.effective_capacity - Trip.seats_committed >= Booking.party_size (else ERR_TRIP_CAPACITY_EXCEEDED)"
        side_effects:
          - "when a pass is tendered: RidePass.rides_remaining -= party_size, Booking.redemption_status = REDEEMED, Booking.fare_charged_cents = 0, and RidePass.status flips ACTIVE -> EXHAUSTED when rides_remaining reaches 0"
          - "when no pass is tendered: Booking.fare_charged_cents = Booking.fare_quoted_cents"
          - "recomputes Trip.seats_committed"
          - "increments Trip.version by 1 and Booking.version by 1"

      - from: CONFIRMED
        to: BOARDED
        trigger: "POST /harbor/trips/{id}/board"
        actor: VesselMaster
        preconditions:
          - "Booking.id appears in boarded_booking_ids"
          - "Booking.status == CONFIRMED"
        side_effects:
          - "contributes party_size to Trip.boarded_pax"
          - "increments Booking.version by 1"

      - from: BOARDED
        to: COMPLETED
        trigger: "POST /harbor/trips/{id}/complete"
        actor: VesselMaster
        preconditions:
          - "Booking.trip_id == the completing trip"
          - "Booking.status == BOARDED"
        side_effects:
          - "increments Booking.version by 1"

      - from: OFFERED
        to: INTERRUPTED
        trigger: "system event: posture cascade cancels Booking.trip_id"
        actor: system
        preconditions:
          - "Booking.status == OFFERED and Booking.trip_id is the cancelled trip"
        side_effects:
          - "no ride restoration is due (nothing was redeemed) and fare_charged_cents stays 0"

      - from: CONFIRMED
        to: INTERRUPTED
        trigger: "system event: posture cascade cancels Booking.trip_id"
        actor: system
        preconditions:
          - "Booking.status == CONFIRMED and Booking.trip_id is the cancelled trip"
        side_effects:
          - "CASCADE A link 3: when redemption_status == REDEEMED, RidePass.rides_remaining += party_size, redemption_status becomes RESTORED and an EXHAUSTED pass returns to ACTIVE"
          - "increments Booking.version by 1 and RidePass.version by 1"

      - from: BOARDED
        to: INTERRUPTED
        trigger: "system event: posture cascade cancels Booking.trip_id"
        actor: system
        preconditions:
          - "Booking.status == BOARDED and Booking.trip_id is the cancelled trip"
        side_effects:
          - "same ride restoration as the CONFIRMED -> INTERRUPTED edge"

  # ---- ServiceDay: posture-driven, cyclic ----------------------------------
  - entity: ServiceDay
    state_field: posture
    shape: cyclic
    initial_state: NORMAL
    terminal_states: []
    note: |
      posture is fully derived by calculation service_day_posture from the row's own observation
      fields, so every edge of the 3x3 matrix is reachable and re-reachable. NORMAL is the initial
      state only when the creation observations are calm; the creating POST evaluates the same
      calculation, so a row can be born RESTRICTED or SUSPENDED.
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is RESTRICTED"
        side_effects:
          - "recomputes Trip.effective_capacity for every Trip on this ServiceDay (posture_factor drops to 70%)"
          - "increments ServiceDay.version by 1"
      - from: RESTRICTED
        to: NORMAL
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is NORMAL"
        side_effects:
          - "recomputes Trip.effective_capacity for every Trip on this ServiceDay"
          - "increments ServiceDay.version by 1"
      - from: NORMAL
        to: SUSPENDED
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is SUSPENDED"
        side_effects:
          - "CASCADE A: fires the Trip SCHEDULED/BOARDING -> CANCELLED system transition for every non-terminal Trip on this ServiceDay, processed in ascending Trip.scheduled_departure_utc with ties broken by ascending Trip.created_at"
          - "increments ServiceDay.version by 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is SUSPENDED"
        side_effects:
          - "identical CASCADE A as the NORMAL -> SUSPENDED edge"
      - from: SUSPENDED
        to: NORMAL
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is NORMAL"
        side_effects:
          - "no un-cancellation occurs; already CANCELLED trips stay CANCELLED"
          - "increments ServiceDay.version by 1"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "PATCH /harbor/service-days/{id}"
        actor: HarborAdmin
        preconditions:
          - "the recomputed value of service_day_posture is RESTRICTED"
        side_effects:
          - "no un-cancellation occurs; already CANCELLED trips stay CANCELLED"
          - "increments ServiceDay.version by 1"

  # ---- DockSlot -------------------------------------------------------------
  - entity: DockSlot
    state_field: status
    shape: branching
    initial_state: RESERVED
    terminal_states: [CONSUMED, VOIDED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /harbor/trips/{id}/complete"
        actor: system
        preconditions:
          - "DockSlot.trip_id == the completing trip"
          - "DockSlot.status == RESERVED"
        side_effects:
          - "the provisional reversal / FINAL posting / cap sequence described in CASCADE B, including the rebate_bp pre-lock applied to sibling RESERVED slots when the dock caps"
      - from: RESERVED
        to: VOIDED
        trigger: "system event: posture cascade cancels DockSlot.trip_id"
        actor: system
        preconditions:
          - "DockSlot.status == RESERVED"
        side_effects:
          - "zeroes projected_fee_cents and landing_fee_cents; when a provisional amount had been posted it is subtracted back out of Dock.accrued_fee_cents"

  # ---- RidePass: cyclic through EXHAUSTED ----------------------------------
  - entity: RidePass
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REFUNDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /harbor/bookings/{id}/confirm"
        actor: Rider
        preconditions:
          - "the confirmation redeemed party_size rides and rides_remaining reached exactly 0"
        side_effects:
          - "increments RidePass.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system event: posture cascade interrupts a REDEEMED Booking on this pass"
        actor: system
        preconditions:
          - "rides_remaining rose above 0 through a restoration"
        side_effects:
          - "increments RidePass.version by 1"
        note: "The cycle edge; a pass may be exhausted and revived any number of times."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /harbor/bookings/{id}/confirm"
        actor: Rider
        preconditions:
          - "RidePass.valid_until < date(clock_now) at the moment of tender"
        side_effects:
          - "the tendering confirmation is rejected with ERR_PASS_EXPIRED but the pass row is left in EXPIRED"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /harbor/ride-passes/{id}/refund"
        actor: Rider
        preconditions:
          - "acting X-User-ID equals RidePass.rider_user_id (else ERR_NOT_RESOURCE_OWNER)"
          - "RidePass.status == ACTIVE (else ERR_PASS_NOT_ACTIVE)"
        side_effects:
          - "sets refund_basis to the requested settlement_basis and refund_amount_cents to the result of calculation ride_pass_residual_value"
          - "sets rides_remaining = 0"
          - "increments RidePass.version by 1"
      - from: EXHAUSTED
        to: REFUNDED
        trigger: "POST /harbor/ride-passes/{id}/refund"
        actor: Rider
        preconditions:
          - "acting X-User-ID equals RidePass.rider_user_id"
          - "RidePass.status == EXHAUSTED"
        side_effects:
          - "same as the ACTIVE -> REFUNDED edge; a PRO_RATA settlement of an exhausted pass pays 0"

  # ---- ServiceInterruption --------------------------------------------------
  - entity: ServiceInterruption
    state_field: status
    shape: compound
    initial_state: DECLARED
    terminal_states: [RESOLVED]
    transitions:
      - from: DECLARED
        to: RESOLVED
        trigger: "system event: the last RefundClaim created by this interruption leaves OPEN"
        actor: system
        preconditions:
          - "affected_booking_count > 0"
          - "no RefundClaim with this service_interruption_id has status == OPEN"
        side_effects:
          - "increments ServiceInterruption.version by 1"
        note: "Bubble-up: the parent is re-derived from its children's states on every child transition."

  # ---- RefundClaim: branching with an auto-advance ---------------------------
  - entity: RefundClaim
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [PAID, DENIED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /harbor/refund-claims/{id}/approve with decision APPROVE"
        actor: FareAuditor
        preconditions:
          - "RefundClaim.status == OPEN (else ERR_REFUND_CLAIM_NOT_OPEN)"
          - "acting X-User-ID != RefundClaim.declarer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "ServiceInterruption(service_interruption_id).status == DECLARED"
        side_effects:
          - "stamps approver_user_id with the acting X-User-ID"
          - "writes Booking.fare_refunded_cents = cash_refund_cents and Booking.credit_refunded_cents = credit_refund_cents"
          - "increments RefundClaim.version by 1 and Booking.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "system event: disbursement completes inside the same approve request"
        actor: system
        preconditions:
          - "RefundClaim.status == APPROVED"
        side_effects:
          - "may bubble the owning ServiceInterruption to RESOLVED when no OPEN sibling remains"
          - "increments RefundClaim.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /harbor/refund-claims/{id}/approve with decision DENY"
        actor: FareAuditor
        preconditions:
          - "RefundClaim.status == OPEN"
          - "acting X-User-ID != RefundClaim.declarer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "stamps approver_user_id, leaves both refund buckets on the Booking at 0"
          - "may bubble the owning ServiceInterruption to RESOLVED when no OPEN sibling remains"
          - "increments RefundClaim.version by 1"

  # ---- Vessel: derived availability -----------------------------------------
  - entity: Vessel
    state_field: service_state
    shape: guarded
    derived: true
    initial_state: IN_SERVICE
    terminal_states: []
    note: "service_state is not stored as a written state; it is re-derived from the logical clock, the layup window and the latest ANNUAL inspection at every read and every gate check."
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /harbor/vessels/{id}/inspections with inspection_type ANNUAL and result FAIL"
        actor: MarineInspector
        preconditions:
          - "the newly filed row becomes the latest ANNUAL inspection under calculation latest_annual_inspection"
        side_effects:
          - "every later depart attempt on this vessel is rejected with ERR_VESSEL_OUT_OF_SERVICE"
          - "increments Vessel.version by 1"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /harbor/vessels/{id}/inspections with inspection_type ANNUAL and result PASS or PASS_WITH_DEFICIENCIES on a later performed_on"
        actor: MarineInspector
        preconditions:
          - "the newly filed row becomes the latest ANNUAL inspection"
        side_effects:
          - "increments Vessel.version by 1"
      - from: IN_SERVICE
        to: LAID_UP
        trigger: "POST /_clock/set_current_utc moving the logical clock into [layup_start_date, layup_end_date]"
        actor: HarborAdmin
        preconditions:
          - "layup_start_date is not null and layup_start_date <= date(clock_now) <= layup_end_date"
          - "the latest ANNUAL inspection is not a FAIL"
        side_effects:
          - "every depart attempt on this vessel is rejected with ERR_VESSEL_IN_LAYUP"
      - from: LAID_UP
        to: IN_SERVICE
        trigger: "POST /_clock/set_current_utc moving the logical clock past layup_end_date"
        actor: HarborAdmin
        preconditions:
          - "date(clock_now) > layup_end_date or date(clock_now) < layup_start_date"
        side_effects:
          - "the vessel becomes departable again"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's version — the only sanctioned
#       mechanism; every other write-write conflict here is a state precondition)
# =============================================================================
concurrency_rules:
  - rule_id: dock-slot-reserve-stale-dock
    parent_entity: Dock
    write_endpoint: "POST /harbor/trips/{id}/dock-slots"
    occ_field: "expected_dock_version"
    description: |
      Reserving a berth window on a Dock whose version has advanced since the client last read the
      dock is rejected. A second reservation against the same dock is legitimate product behaviour
      whenever berth_count still has room, so the stale view — not the state of any single slot — is
      what the server rejects.
    error_id: ERR_STALE_DOCK_VERSION
    http_status: 412

  - rule_id: booking-confirm-stale-trip
    parent_entity: Trip
    write_endpoint: "POST /harbor/bookings/{id}/confirm"
    occ_field: "expected_trip_version"
    description: |
      Confirming a booking against a Trip whose version has advanced since the offer was read is
      rejected. Another rider confirming first legitimately supersedes the seat picture the current
      client is holding, and the second confirmation would otherwise still succeed on remaining
      capacity, so the server resolves it as a stale-version conflict on the Trip.
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: service_day_posture
    trigger: "POST /harbor/service-days and PATCH /harbor/service-days/{id}; the value is stored on ServiceDay.posture"
    algorithm: threshold
    formula: |
      if manual_suspension == true:                          return "SUSPENDED"
      if wind_knots >= WIND_SUSPEND_KT:                       return "SUSPENDED"
      if wave_height_m >= WAVE_SUSPEND_M:                     return "SUSPENDED"
      if wind_knots >= WIND_RESTRICT_KT:                      return "RESTRICTED"
      if wave_height_m >= WAVE_RESTRICT_M:                    return "RESTRICTED"
      if low_water_m < LOW_WATER_RESTRICT_M:                  return "RESTRICTED"
      return "NORMAL"
    input_set: "Only the ServiceDay row's own observation fields. No child aggregation; the posture is never influenced by trips already on the day."
    constants:
      WIND_SUSPEND_KT: 35.0
      WAVE_SUSPEND_M: 2.50
      WIND_RESTRICT_KT: 22.0
      WAVE_RESTRICT_M: 1.20
      LOW_WATER_RESTRICT_M: 1.80
    precision: "wind compared at 1 decimal, wave and water at 2 decimals; all comparisons on the stored rounded values"
    boundary_notes: "wind_knots exactly 22.0 is RESTRICTED (>=); exactly 35.0 is SUSPENDED (>=); low_water_m exactly 1.80 is NOT restricting (strict <)."

  - name: surge_tier_selection
    trigger: "POST /harbor/service-days and PATCH /harbor/service-days/{id}; writes ServiceDay.surge_tier, surge_multiplier_bp and planned_extra_vessels"
    algorithm: threshold
    formula: |
      if event_name is null:                                   tier = "NONE"
      elif expected_attendance >= SURGE_PEAK_FLOOR:            tier = "PEAK"
      elif expected_attendance >= SURGE_ELEVATED_FLOOR:        tier = "ELEVATED"
      else:                                                    tier = "NONE"
      surge_multiplier_bp   = { NONE: 10000, ELEVATED: 12500, PEAK: 15000 }[tier]
      planned_extra_vessels = { NONE: 0,     ELEVATED: 1,     PEAK: 2     }[tier]
    input_set: "ServiceDay.event_name and ServiceDay.expected_attendance only."
    constants:
      SURGE_ELEVATED_FLOOR: 15000
      SURGE_PEAK_FLOOR: 30000
    precision: "integer attendance; integer basis points"
    boundary_notes: "attendance exactly 15000 with a non-null event_name is ELEVATED; exactly 30000 is PEAK; a null event_name forces NONE no matter how large expected_attendance is."

  - name: trip_effective_capacity
    trigger: "on POST /harbor/trips, on every PATCH /harbor/service-days/{id} that changes the day's posture, and re-derived on every read of Trip.effective_capacity"
    algorithm: constraint_propagation
    formula: |
      # Four independent inputs interact non-linearly: posture factor, tide clearance,
      # crew endorsement and event surge. min() over three derated ceilings, then a
      # conditionally-gated additive bonus, then a hard ceiling.
      posture_factor_pct = { NORMAL: 100, RESTRICTED: 70, SUSPENDED: 0 }[ServiceDay.posture]
      clearance_m        = round_half_up(ServiceDay.low_water_m - Vessel.draft_m, 2)

      posture_cap = floor(Vessel.seat_capacity * posture_factor_pct / 100)
      tide_cap    = floor(Vessel.seat_capacity / 2) if clearance_m < CAPACITY_DERATE_CLEARANCE_M
                    else Vessel.seat_capacity
      crew_cap    = Vessel.seat_capacity if CrewMember.endorsement_class == "MASTER_100T"
                    else CREW_LIMITED_CAP

      core = min(posture_cap, tide_cap, crew_cap)

      surge_bonus = SURGE_STANDING_BONUS
                    if (ServiceDay.posture == "NORMAL"
                        and ServiceDay.event_name is not null
                        and ServiceDay.expected_attendance >= SURGE_ELEVATED_FLOOR)
                    else 0

      effective_capacity = min(core + surge_bonus, Vessel.seat_capacity + SURGE_STANDING_BONUS)
    input_set: "Exactly one Vessel (Trip.vessel_id), one CrewMember (Trip.master_crew_id) and one ServiceDay (Trip.service_day_id). Bookings never feed back into capacity."
    constants:
      CAPACITY_DERATE_CLEARANCE_M: 0.60
      CREW_LIMITED_CAP: 24
      SURGE_STANDING_BONUS: 12
      SURGE_ELEVATED_FLOOR: 15000
    precision: "integer seats; floor() on every derate; clearance compared at 2 decimals"
    boundary_notes: "clearance_m exactly 0.60 does NOT derate (strict <). The surge bonus is suppressed entirely once posture leaves NORMAL, even when the day is a PEAK event day."

  - name: booking_fare_quote
    trigger: "POST /harbor/bookings; the result is frozen into Booking.fare_quoted_cents and is never re-quoted"
    algorithm: tiered_pricing
    formula: |
      origin   = Stop(Booking.origin_stop_id)
      dest     = Stop(Booking.destination_stop_id)
      day      = the ServiceDay whose service_date == Booking.requested_date
      zone_span   = abs(dest.zone_index - origin.zone_index)
      base_cents  = ZONE_BASE_CENTS + zone_span * ZONE_STEP_CENTS
      mode_mult_bp  = 14000 if Booking.service_mode == "ON_DEMAND" else 10000
      surge_mult_bp = day.surge_multiplier_bp

      # PINNED ROUNDING ORDER (round-per-seat-then-multiply). Rounding is applied to
      # whole cents after EACH multiplier and BEFORE the party_size multiplication.
      # Computing round_half_up(base_cents * mode * surge * party_size) instead yields a
      # different number of cents and is WRONG.
      per_seat_after_mode  = round_half_up(base_cents * mode_mult_bp / 10000)
      per_seat_after_surge = round_half_up(per_seat_after_mode * surge_mult_bp / 10000)
      fare_quoted_cents    = per_seat_after_surge * Booking.party_size
    input_set: "The two Stop rows named on the booking plus the ServiceDay matching requested_date. The offered or confirmed Trip never influences the quote."
    constants:
      ZONE_BASE_CENTS: 450
      ZONE_STEP_CENTS: 275
      MODE_MULT_BP_ON_DEMAND: 14000
      MODE_MULT_BP_SCHEDULED: 10000
    precision: "whole cents, round_half_up at each of the two pinned rounding points"
    boundary_notes: "zone_span may be 0 when both stops share a zone_index; base_cents is then ZONE_BASE_CENTS."

  - name: dock_slot_fee_posting
    trigger: "POST /harbor/trips/{id}/depart (variant PROVISIONAL) and POST /harbor/trips/{id}/complete (variant FINAL)"
    algorithm: waterfall_allocation
    formula: |
      # Slots of one trip are posted in ascending DockSlot.start_utc, ties broken by
      # ascending DockSlot.created_at.
      pax_basis =
          0                     if slot.purpose == "LAYOVER"
          Trip.booked_pax       if variant == "PROVISIONAL"
          Trip.boarded_pax      if variant == "FINAL"

      berth_minutes =
          floor(minutes between slot.start_utc and slot.end_utc)                      if variant == "PROVISIONAL"
          max(0, floor(minutes between slot.start_utc and Trip.actual_departure_utc)) if variant == "FINAL"

      gross_cents = berth_minutes * Dock.berth_minute_rate_cents
                  + pax_basis     * Dock.landing_fee_per_pax_cents

      # CIRCULAR-LOOKING DEPENDENCY, PINNED EVALUATION ORDER.
      # The rebate tier is keyed on the dock accrual, and the dock accrual is grown by the
      # fee this formula produces. The order below is normative:
      #   (1) when variant == FINAL, first subtract slot.projected_fee_cents back out of
      #       Dock.accrued_fee_cents and set slot.projected_fee_cents = 0;
      #   (2) read pre_posting_accrued = Dock.accrued_fee_cents (post-reversal value);
      #   (3) select rebate_bp from pre_posting_accrued ONLY - never from the value the
      #       posting is about to produce;
      #   (4) compute fee_cents;
      #   (5) add fee_cents to Dock.accrued_fee_cents;
      #   (6) evaluate the monthly cap - FINAL postings only.
      rebate_bp = 10000 if slot.rebate_bp == 10000    # pre-locked by a cap flip on this dock
                  else 1500 if pre_posting_accrued >= REBATE_TIER2_FLOOR_CENTS
                  else 800  if pre_posting_accrued >= REBATE_TIER1_FLOOR_CENTS
                  else 0
      fee_cents = gross_cents - round_half_up(gross_cents * rebate_bp / 10000)

      if variant == "PROVISIONAL":
          slot.projected_fee_cents = fee_cents
          Dock.accrued_fee_cents  += fee_cents          # the monthly cap is NOT evaluated here
      else:
          Dock.accrued_fee_cents  += fee_cents
          if Dock.accrued_fee_cents >= Dock.monthly_fee_cap_cents:
              overflow                = Dock.accrued_fee_cents - Dock.monthly_fee_cap_cents
              fee_cents               = fee_cents - overflow
              Dock.accrued_fee_cents  = Dock.monthly_fee_cap_cents
              Dock.fee_status         = "CAPPED"
          slot.landing_fee_cents = fee_cents
      slot.berth_minutes = berth_minutes
      slot.rebate_bp     = rebate_bp
      slot.pax_basis     = pax_basis
    input_set: "Every DockSlot of the trip whose status == RESERVED, plus the Dock rows they name. VOIDED and already-CONSUMED slots are excluded."
    constants:
      REBATE_TIER1_FLOOR_CENTS: 200000
      REBATE_TIER2_FLOOR_CENTS: 500000
    precision: "whole cents; round_half_up on the rebate amount; berth minutes floored to whole minutes"
    variants:
      - name: PROVISIONAL
        when: "posted by POST /harbor/trips/{id}/depart, alongside Trip.settlement_status UNSETTLED -> PROVISIONAL"
        difference: "pax_basis is Trip.booked_pax (the seats committed at departure) and berth_minutes come from the RESERVED window [start_utc, end_utc); the monthly cap is never evaluated."
      - name: FINAL
        when: "posted by POST /harbor/trips/{id}/complete, alongside Trip.settlement_status PROVISIONAL -> FINAL"
        difference: "pax_basis is Trip.boarded_pax (who actually boarded) and berth_minutes run from start_utc to the real actual_departure_utc, so a late departure bills more minutes; the monthly cap IS evaluated and can trim the posting."

  - name: ride_pass_residual_value
    trigger: "POST /harbor/ride-passes/{id}/refund; writes RidePass.refund_amount_cents and RidePass.refund_basis"
    algorithm: dual_variant_settlement
    formula: |
      RETAIL_PER_RIDE_CENTS = { INNER: 1100, OUTER: 1800, ALL_ZONE: 2600 }
      if settlement_basis == "PRO_RATA":
          unit_cents = round_half_up(purchase_price_cents / rides_purchased)
          amount     = rides_remaining * unit_cents
      else:  # DIFFERENTIAL
          amount     = max(0, purchase_price_cents
                              - rides_consumed * RETAIL_PER_RIDE_CENTS[zone_tier])
      refund_amount_cents = amount
    input_set: "The RidePass row alone; rides_consumed is the aggregation over its REDEEMED bookings, so rides restored by a service interruption are NOT counted as consumed."
    constants:
      RETAIL_PER_RIDE_INNER_CENTS: 1100
      RETAIL_PER_RIDE_OUTER_CENTS: 1800
      RETAIL_PER_RIDE_ALL_ZONE_CENTS: 2600
    precision: "whole cents; round_half_up on the per-ride unit price"
    variants:
      - name: PRO_RATA
        when: "the rider asks for settlement_basis PRO_RATA"
        difference: "pays for the rides NOT taken at the average price actually paid; ignores retail value entirely."
      - name: DIFFERENTIAL
        when: "the rider asks for settlement_basis DIFFERENTIAL"
        difference: "claws back the retail value of the rides already taken from the purchase price, so a discounted multi-ride pass returns strictly less than PRO_RATA once any ride has been used."

  - name: interruption_refund_waterfall
    trigger: "POST /harbor/service-days/{id}/interruptions; creates one RefundClaim per eligible Booking"
    algorithm: waterfall_allocation
    formula: |
      # Claims are created in ascending Booking.created_at.
      eligible = Bookings B where B.status == "INTERRUPTED"
                 and Trip(B.trip_id).service_day_id == this ServiceDay.id
                 and no RefundClaim already exists with booking_id == B.id
      for each B:
          entitlement_cents =
              B.fare_charged_cents                                            if B.interrupted_from_status in {"OFFERED", "CONFIRMED"}
              round_half_up(B.fare_charged_cents * PARTIAL_LEG_SHARE_BP / 10000)  if B.interrupted_from_status == "BOARDED"

          # Ordered buckets. Bucket 1 absorbs the whole entitlement in kind when the
          # cascade already handed the rides back; buckets 2 and 3 are then skipped.
          if B.redemption_status == "RESTORED":
              ride_restored = true;  cash_refund_cents = 0;  credit_refund_cents = 0
          else:
              ride_restored = false
              cash_refund_cents   = min(entitlement_cents, CASH_REFUND_CAP_CENTS)
              credit_refund_cents = entitlement_cents - cash_refund_cents
      ServiceInterruption.affected_booking_count        = number of claims created
      ServiceInterruption.total_provisional_refund_cents = sum of entitlement_cents over those claims
    input_set: "Only Bookings already moved to INTERRUPTED by the posture cascade. Bookings still in REQUESTED (never offered a trip) are not eligible and get no claim."
    constants:
      PARTIAL_LEG_SHARE_BP: 5000
      CASH_REFUND_CAP_CENTS: 5000
    precision: "whole cents; round_half_up on the partial-leg share"
    boundary_notes: "entitlement_cents exactly equal to CASH_REFUND_CAP_CENTS puts the whole amount in the cash bucket and leaves credit_refund_cents at 0."

  - name: trip_dispatch_selector
    trigger: "POST /harbor/bookings/{id}/dispatch"
    algorithm: selector_policy
    formula: |
      day = ServiceDay whose service_date == Booking.requested_date
      # (a) eligibility filter - explicit predicate, no fuzzy adjectives
      candidates = Trips T where
            T.service_day_id        == day.id
        and T.operational_status    == "SCHEDULED"
        and T.service_mode          == Booking.service_mode
        and T.origin_stop_id        == Booking.origin_stop_id
        and T.destination_stop_id   == Booking.destination_stop_id
        and T.id NOT IN Booking.declined_trip_ids
        and T.scheduled_departure_utc >= clock_now
        and day.posture IN {"NORMAL", "RESTRICTED"}
        and (T.effective_capacity - T.seats_committed) >= Booking.party_size
      # (b) ranking expression
      order by T.scheduled_departure_utc ASC
      # (c) tie-breaks, in order
      then by (T.effective_capacity - T.seats_committed) DESC
      then by T.created_at ASC
      # (d) empty-pool fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_TRIP (409) and leave the
          Booking completely untouched - status stays REQUESTED, offer_round unchanged,
          declined_trip_ids unchanged, version unchanged.
    input_set: "All Trip rows on the resolved ServiceDay. Trip.id is used only as an exclusion-set membership token, never as a ranking or tie-break key."
    constants:
      MAX_OFFER_ROUNDS: 3
      MAX_DEFICIENCIES_RESTRICTED: 2
      MIN_UNDER_KEEL_CLEARANCE_M: 0.30
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "integer seat arithmetic; timestamps compared at whole-second resolution"

  - name: trip_seats_committed
    trigger: "recomputed on POST /harbor/bookings/{id}/confirm, POST /harbor/trips/{id}/board, and on every posture cascade that interrupts a booking"
    algorithm: aggregation
    formula: |
      Trip.seats_committed = sum(B.party_size
                                 for B in Bookings
                                 where B.trip_id == Trip.id
                                   and B.status in {"CONFIRMED", "BOARDED"})
    input_set: "Bookings on this trip whose status is exactly CONFIRMED or BOARDED. OFFERED, REQUESTED, INTERRUPTED, UNFULFILLED and COMPLETED bookings are all excluded."
    constants: {}
    precision: "integer seats"
    invariant: "INV_SEAT_COMMITMENT: Trip.seats_committed == sum of party_size over that trip's bookings in {CONFIRMED, BOARDED}, at every observable moment."

  - name: latest_annual_inspection
    trigger: "evaluated whenever Vessel.service_state, Vessel.annual_inspection_expires_on, or the depart-time inspection gate is needed"
    algorithm: aggregation
    formula: |
      rows = VesselInspections where vessel_id == Vessel.id and inspection_type == "ANNUAL"
      order by performed_on DESC, then created_at DESC
      latest = first row, or null when rows is empty
      Vessel.annual_inspection_expires_on = latest.expires_on if latest else null
      Vessel.service_state =
          "OUT_OF_SERVICE" if latest is not null and latest.result == "FAIL"
          else "LAID_UP"   if Vessel.layup_start_date is not null
                              and Vessel.layup_start_date <= date(clock_now) <= Vessel.layup_end_date
          else "IN_SERVICE"
    input_set: "ANNUAL rows only; PRE_DEPARTURE rows never participate, even when newer."
    constants:
      ANNUAL_INSPECTION_VALID_DAYS: 365
    precision: "date comparison at day resolution; expires_on = performed_on + 365 days"
    boundary_notes: "expires_on exactly equal to date(clock_now) is still valid at departure (>=). A FAIL outranks a layup window: a failed vessel reads OUT_OF_SERVICE even inside its layup dates."

  - name: dock_berth_overlap_count
    trigger: "POST /harbor/trips/{id}/dock-slots, before the slot row is written"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS 1 of 2: half-open [start, end) instants, symmetric turnaround
      # buffer on BOTH ends of BOTH intervals, aggregate capacity of berth_count.
      buffer = Dock.min_turnaround_minutes minutes
      s = candidate.start_utc ; e = candidate.end_utc
      occupied = { X in DockSlots
                   where X.dock_id == Dock.id
                     and X.status in {"RESERVED", "CONSUMED"}
                     and s < (X.end_utc + buffer)
                     and X.start_utc < (e + buffer) }
      conflict = ( count(occupied) >= Dock.berth_count )
      if conflict: reject with ERR_DOCK_BERTH_CONFLICT (409)
    input_set: "DockSlot rows on this dock in RESERVED or CONSUMED. VOIDED slots are invisible to the overlap test and free their berth immediately."
    constants: {}
    precision: "instants compared at whole-second resolution; the buffer is whole minutes"
    boundary_notes: "With min_turnaround_minutes = 0 two slots that merely touch (previous.end_utc == candidate.start_utc) do NOT overlap, because the test is strict `<`. With a non-zero buffer the same touching pair DOES occupy the berth together. Occupancy is counted, not merged: berth_count - 1 overlapping slots are accepted and the berth_count-th is rejected."

  - name: vessel_layup_overlap
    trigger: "POST /harbor/trips, before the trip row is written"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS 2 of 2: closed-closed [start, end] CALENDAR DATES, single
      # occupancy (the vessel itself), no buffer. Deliberately different geometry from
      # dock_berth_overlap_count.
      if Vessel.layup_start_date is null or Vessel.layup_end_date is null: no conflict
      trip_first_day = date(scheduled_departure_utc)
      trip_last_day  = date(scheduled_arrival_utc)
      conflict = ( trip_first_day <= Vessel.layup_end_date
                   and trip_last_day >= Vessel.layup_start_date )
      if conflict: reject with ERR_VESSEL_IN_LAYUP (409)
    input_set: "The single layup window stored on the Vessel row. No other vessel's window is consulted."
    constants: {}
    precision: "calendar-date comparison at day resolution, UTC"
    boundary_notes: "A trip whose departure date equals layup_end_date DOES conflict (closed end), unlike the dock rule where an interval ending exactly at the candidate start does not by itself conflict."

# =============================================================================
# Conserved-quantity invariants (compensating-action pairs)
# =============================================================================
invariants:
  - id: INV_RIDE_CREDIT_CONSERVATION
    conserved_quantity: "ride credits on a RidePass"
    formula: |
      RidePass.rides_purchased ==
          RidePass.rides_remaining
        + sum(Booking.party_size for Booking where ride_pass_id == RidePass.id
                                                and redemption_status == "REDEEMED")
    forward_action: "POST /harbor/bookings/{id}/confirm with a pass tendered (rides_remaining -= party_size, redemption_status = REDEEMED)"
    compensating_action: "the posture cascade interrupting that booking (rides_remaining += party_size, redemption_status = RESTORED)"
    note: "The identity must hold before the forward action, between the two actions, and after the compensating action. RESTORED bookings must not be counted by the sum, otherwise the pass silently loses a ride."

  - id: INV_DOCK_FEE_CONSERVATION
    conserved_quantity: "landing-fee money accrued against a Dock, in cents"
    formula: |
      Dock.accrued_fee_cents ==
          sum(DockSlot.landing_fee_cents  for slots on this dock with status == "CONSUMED")
        + sum(DockSlot.projected_fee_cents for slots on this dock with status == "RESERVED")
    forward_action: "POST /harbor/trips/{id}/depart posting the PROVISIONAL fee into Dock.accrued_fee_cents"
    compensating_action: "POST /harbor/trips/{id}/complete subtracting that exact projected_fee_cents back out before the FINAL posting"
    note: "If the reversal is skipped, the dock accrual drifts by exactly the provisional amount and the identity breaks even though every individual endpoint returns 200. The identity is also asserted after a VOIDED slot, where both terms fall to 0."

  - id: INV_SEAT_COMMITMENT
    conserved_quantity: "committed seats on a Trip"
    formula: |
      Trip.seats_committed ==
          sum(Booking.party_size for Booking where trip_id == Trip.id
                                               and status in {"CONFIRMED", "BOARDED"})
    forward_action: "POST /harbor/bookings/{id}/confirm"
    compensating_action: "the posture cascade moving that booking to INTERRUPTED"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the URL path resolves, validated left-to-right"
    error_id: "ERR_DOCK_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_SERVICE_DAY_NOT_FOUND | ERR_TRIP_NOT_FOUND | ERR_DOCK_SLOT_NOT_FOUND | ERR_RIDE_PASS_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_REFUND_CLAIM_NOT_FOUND | ERR_CREW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_STOP_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_SERVICE_DAY_NOT_FOUND | ERR_DOCK_NOT_FOUND | ERR_RIDE_PASS_NOT_FOUND"
    http_status: 404
    applies_to: "POST /harbor/trips, POST /harbor/trips/{id}/dock-slots, POST /harbor/bookings, POST /harbor/docks/{id}/stops"

  - priority: 5
    category: auth
    check: "for Rider-owned resources the acting X-User-ID equals Booking.rider_user_id or RidePass.rider_user_id; for VesselMaster actions the acting X-User-ID equals Trip.master_crew_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /harbor/bookings/{id}/decline, POST /harbor/bookings/{id}/confirm, POST /harbor/ride-passes/{id}/refund, POST /harbor/trips/{id}/board, POST /harbor/trips/{id}/depart, POST /harbor/trips/{id}/complete"

  - priority: 6
    category: business_constraint
    check: "all required input fields present, of the declared type, within the declared numeric range, and every enum value is a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: business_temporal
    check: "scheduled_arrival_utc > scheduled_departure_utc on trips; end_utc > start_utc on dock slots; layup_end_date >= layup_start_date on vessels; clock_now > Trip.actual_departure_utc on completion"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /harbor/trips, POST /harbor/trips/{id}/dock-slots, POST /harbor/vessels, POST /harbor/trips/{id}/complete"

  - priority: 8
    category: business_referential
    check: "origin_stop_id != destination_stop_id"
    error_id: ERR_SAME_ORIGIN_DESTINATION
    http_status: 422
    applies_to: "POST /harbor/trips, POST /harbor/bookings"

  - priority: 9
    category: business_constraint
    check: "ServiceDay.service_date is unique across all ServiceDay rows"
    error_id: ERR_SERVICE_DAY_DUPLICATE
    http_status: 409
    applies_to: "POST /harbor/service-days"

  - priority: 10
    category: state
    check: "the target resource is in the state the requested transition departs from"
    error_id: "ERR_TRIP_NOT_SCHEDULED | ERR_TRIP_NOT_BOARDING | ERR_TRIP_NOT_DEPARTED | ERR_BOOKING_NOT_REQUESTED | ERR_BOOKING_NOT_OFFERED | ERR_BOOKING_NOT_CONFIRMED | ERR_PASS_NOT_ACTIVE | ERR_REFUND_CLAIM_NOT_OPEN | ERR_INTERRUPTION_NOT_DECLARABLE"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 11
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_DOCK_VERSION | ERR_STALE_TRIP_VERSION"
    http_status: 412
    applies_to: "POST /harbor/trips/{id}/dock-slots, POST /harbor/bookings/{id}/confirm"

  - priority: 12
    category: business_safety
    check: "ServiceDay.posture != SUSPENDED"
    error_id: ERR_SERVICE_SUSPENDED
    http_status: 409
    applies_to: "POST /harbor/trips/{id}/board, POST /harbor/trips/{id}/depart, POST /harbor/bookings/{id}/confirm"

  - priority: 13
    category: business_safety
    check: "Vessel.service_state == IN_SERVICE at the moment of departure; and at trip creation the trip's calendar window must not overlap the vessel's closed-closed layup window"
    error_id: "ERR_VESSEL_IN_LAYUP | ERR_VESSEL_OUT_OF_SERVICE"
    http_status: 409
    applies_to: "POST /harbor/trips, POST /harbor/trips/{id}/depart"

  - priority: 14
    category: business_safety
    check: "the latest ANNUAL VesselInspection exists, is not FAIL, has expires_on >= date(clock_now), and under RESTRICTED posture carries deficiency_count <= MAX_DEFICIENCIES_RESTRICTED (2)"
    error_id: ERR_VESSEL_INSPECTION_INVALID
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/depart"

  - priority: 15
    category: business_safety
    check: "under RESTRICTED posture only Vessel.hull_class == OFFSHORE may sail"
    error_id: ERR_HULL_CLASS_RESTRICTED
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/depart"

  - priority: 16
    category: business_safety
    check: "CrewMember.status == ACTIVE and cert_expires_on >= date(clock_now) and medical_expires_on >= date(clock_now)"
    error_id: ERR_CREW_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/depart"

  - priority: 17
    category: business_safety
    check: "rank(CrewMember.endorsement_class) >= rank(Vessel.required_endorsement), where MASTER_25T < MASTER_100T"
    error_id: ERR_CREW_ENDORSEMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/depart"

  - priority: 18
    category: business_safety
    check: "round_half_up(ServiceDay.low_water_m - Vessel.draft_m, 2) >= 0.30"
    error_id: ERR_UNDER_KEEL_CLEARANCE
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/depart"

  - priority: 19
    category: business_temporal
    check: "the candidate berth window does not push overlapping occupancy on the dock to berth_count, using calculation dock_berth_overlap_count"
    error_id: ERR_DOCK_BERTH_CONFLICT
    http_status: 409
    applies_to: "POST /harbor/trips/{id}/dock-slots"

  - priority: 20
    category: business_temporal
    check: "RidePass.valid_until >= date(clock_now) at the moment of tender; a stale pass is moved to EXPIRED before the rejection is returned"
    error_id: ERR_PASS_EXPIRED
    http_status: 409
    applies_to: "POST /harbor/bookings/{id}/confirm"

  - priority: 21
    category: business_referential
    check: "the dock named on a slot is the dock of either the trip's origin_stop or its destination_stop"
    error_id: ERR_SLOT_DOCK_NOT_ON_ROUTE
    http_status: 422
    applies_to: "POST /harbor/trips/{id}/dock-slots"

  - priority: 22
    category: business_referential
    check: "RidePass.zone_tier covers abs(destination.zone_index - origin.zone_index): INNER covers <= 1, OUTER covers <= 3, ALL_ZONE covers everything"
    error_id: ERR_PASS_ZONE_NOT_COVERED
    http_status: 422
    applies_to: "POST /harbor/bookings/{id}/confirm"

  - priority: 23
    category: business_referential
    check: "the acting FareAuditor's X-User-ID differs from RefundClaim.declarer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /harbor/refund-claims/{id}/approve"

  - priority: 24
    category: business_constraint
    check: "the dispatch candidate pool built by calculation trip_dispatch_selector is non-empty"
    error_id: ERR_NO_ELIGIBLE_TRIP
    http_status: 409
    applies_to: "POST /harbor/bookings/{id}/dispatch"

  - priority: 25
    category: business_constraint
    check: "Trip.effective_capacity - Trip.seats_committed >= party_size at confirmation, and the boarding manifest's total party_size <= Trip.effective_capacity"
    error_id: ERR_TRIP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /harbor/bookings/{id}/confirm, POST /harbor/trips/{id}/board"

  - priority: 26
    category: business_fiscal
    check: "RidePass.rides_remaining >= Booking.party_size"
    error_id: ERR_PASS_NO_RIDES_REMAINING
    http_status: 409
    applies_to: "POST /harbor/bookings/{id}/confirm"

validation_priority_conflicts:
  - id: state_beats_safety_on_depart
    pair: "state (priority 10, ERR_TRIP_NOT_BOARDING) versus business_safety (priority 18, ERR_UNDER_KEEL_CLEARANCE)"
    scenario: "a trip that already DEPARTED is asked to depart again on a day whose under-keel clearance is below 0.30 m"
    winner: ERR_TRIP_NOT_BOARDING
  - id: referential_beats_fiscal_on_confirm
    pair: "business_referential (priority 22, ERR_PASS_ZONE_NOT_COVERED) versus business_fiscal (priority 26, ERR_PASS_NO_RIDES_REMAINING)"
    scenario: "an INNER pass with zero rides left is tendered for a three-zone hop"
    winner: ERR_PASS_ZONE_NOT_COVERED
  - id: occ_beats_constraint_on_confirm
    pair: "state/OCC (priority 11, ERR_STALE_TRIP_VERSION) versus business_constraint (priority 25, ERR_TRIP_CAPACITY_EXCEEDED)"
    scenario: "a stale expected_trip_version is sent for a party that would also overflow the trip's effective capacity"
    winner: ERR_STALE_TRIP_VERSION

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Docks and stops ------------------------------------------------------
  - method: POST
    path: "/harbor/docks"
    description: "Register a dock with its berth capacity, turnaround buffer and landing tariff."
    roles: [HarborAdmin]
    code: 201
    input: [name, berth_count, "min_turnaround_minutes?", landing_fee_per_pax_cents, berth_minute_rate_cents, monthly_fee_cap_cents, "shared_operator_count?"]
    output: Dock
    side_effects: ["accrued_fee_cents initialised to 0 and fee_status to ACCRUING"]

  - method: GET
    path: "/harbor/docks/{id}"
    description: "Read one dock including its live landing-fee accrual and cap status."
    roles: [HarborAdmin, Dispatcher, VesselMaster, MarineInspector, FareAuditor]
    code: 200
    input: []
    output: Dock
    side_effects: []

  - method: POST
    path: "/harbor/docks/{id}/stops"
    description: "Add a fare-zone stop served by this dock."
    roles: [HarborAdmin]
    code: 201
    input: [name, zone_index, charted_depth_m]
    output: Stop
    side_effects: ["dock_id is taken from the path"]

  - method: GET
    path: "/harbor/docks/{id}/stops"
    description: "List every Stop whose dock_id is this dock (FK reverse-reachability for Stop.dock_id)."
    roles: [HarborAdmin, Dispatcher, VesselMaster, Rider, FareAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Stop[]"
    side_effects: []

  # ---- Vessels and inspections ---------------------------------------------
  - method: POST
    path: "/harbor/vessels"
    description: "Register a vessel, optionally with a closed-closed seasonal winter-layup window."
    roles: [HarborAdmin]
    code: 201
    input: [name, seat_capacity, draft_m, hull_class, required_endorsement, "layup_start_date?", "layup_end_date?"]
    output: Vessel
    side_effects: ["service_state derived immediately from the logical clock and the layup window"]

  - method: GET
    path: "/harbor/vessels/{id}"
    description: "Read one vessel with its derived service_state and annual_inspection_expires_on."
    roles: [HarborAdmin, Dispatcher, VesselMaster, MarineInspector]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: POST
    path: "/harbor/vessels/{id}/inspections"
    description: "File an inspection record against a vessel. ANNUAL rows gate departures for 365 days."
    roles: [MarineInspector]
    code: 201
    input: [inspection_type, result, "deficiency_count?", performed_on]
    output: VesselInspection
    side_effects:
      - "expires_on computed as performed_on + 365 days for ANNUAL rows, null otherwise"
      - "inspector_user_id stamped from X-User-ID"
      - "re-derives Vessel.service_state and Vessel.annual_inspection_expires_on; increments Vessel.version by 1"

  - method: GET
    path: "/harbor/vessels/{id}/inspections"
    description: "List inspection rows for a vessel, newest performed_on first (FK reverse-reachability for VesselInspection.vessel_id)."
    roles: [HarborAdmin, Dispatcher, VesselMaster, MarineInspector]
    code: 200
    input: ["inspection_type?", "limit?", "offset?"]
    output: "VesselInspection[]"
    side_effects: []

  # ---- Crew ------------------------------------------------------------------
  - method: POST
    path: "/harbor/crew-members"
    description: "Register a crew member with endorsement class and certificate expiry dates."
    roles: [HarborAdmin]
    code: 201
    input: [name, endorsement_class, cert_expires_on, medical_expires_on, "status?"]
    output: CrewMember
    side_effects: ["trips_mastered_count initialised to 0"]

  - method: GET
    path: "/harbor/crew-members/{id}"
    description: "Read one crew member."
    roles: [HarborAdmin, Dispatcher, VesselMaster]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ---- Service days ----------------------------------------------------------
  - method: POST
    path: "/harbor/service-days"
    description: "Open an operating day with its weather, tide and event observations. posture and surge fields are derived on creation."
    roles: [HarborAdmin]
    code: 201
    input: [service_date, wind_knots, wave_height_m, low_water_m, "manual_suspension?", "event_name?", "expected_attendance?"]
    output: ServiceDay
    side_effects: ["runs service_day_posture and surge_tier_selection"]

  - method: GET
    path: "/harbor/service-days/{id}"
    description: "Read one operating day with its derived posture and event surge plan."
    roles: [HarborAdmin, Dispatcher, VesselMaster, Rider, FareAuditor]
    code: 200
    input: []
    output: ServiceDay
    side_effects: []

  - method: PATCH
    path: "/harbor/service-days/{id}"
    description: "Update the day's observations. Recomputes posture and, when the new posture is SUSPENDED, runs CASCADE A over every non-terminal trip on the day."
    roles: [HarborAdmin]
    code: 200
    input: ["wind_knots?", "wave_height_m?", "low_water_m?", "manual_suspension?", "event_name?", "expected_attendance?"]
    output: ServiceDay
    side_effects:
      - "re-runs service_day_posture and surge_tier_selection"
      - "recomputes Trip.effective_capacity for every trip on this day"
      - "CASCADE A on a SUSPENDED result: trips CANCELLED -> dock slots VOIDED and bookings INTERRUPTED -> pass rides restored"
      - "increments ServiceDay.version by 1"

  - method: POST
    path: "/harbor/service-days/{id}/interruptions"
    description: "Declare a service interruption for a suspended day and open one RefundClaim per interrupted booking."
    roles: [Dispatcher]
    code: 201
    input: [cause]
    output: ServiceInterruption
    side_effects:
      - "requires ServiceDay.posture == SUSPENDED, else ERR_INTERRUPTION_NOT_DECLARABLE"
      - "declared_by_user_id stamped from X-User-ID"
      - "runs interruption_refund_waterfall and creates one RefundClaim per eligible booking in ascending Booking.created_at"
      - "sets affected_booking_count and total_provisional_refund_cents"

  - method: GET
    path: "/harbor/service-days/{id}/interruptions"
    description: "List interruptions declared on this day (FK reverse-reachability for ServiceInterruption.service_day_id)."
    roles: [HarborAdmin, Dispatcher, FareAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceInterruption[]"
    side_effects: []

  # ---- Trips ------------------------------------------------------------------
  - method: POST
    path: "/harbor/trips"
    description: "Create a sailing. Rejects trips whose calendar window overlaps the vessel's closed-closed layup window."
    roles: [Dispatcher]
    code: 201
    input: [service_day_id, vessel_id, master_crew_id, origin_stop_id, destination_stop_id, service_mode, scheduled_departure_utc, scheduled_arrival_utc]
    output: Trip
    side_effects:
      - "runs vessel_layup_overlap and trip_effective_capacity"
      - "operational_status SCHEDULED, settlement_status UNSETTLED, seats_committed 0"

  - method: GET
    path: "/harbor/trips/{id}"
    description: "Read one trip with both state axes and its derived effective_capacity."
    roles: [HarborAdmin, Dispatcher, VesselMaster, Rider, FareAuditor]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: GET
    path: "/harbor/trips"
    description: "List trips with foreign-key and state filters (FK reverse-reachability for every Trip FK)."
    roles: [HarborAdmin, Dispatcher, VesselMaster, Rider, FareAuditor]
    code: 200
    input: ["service_day_id?", "vessel_id?", "master_crew_id?", "origin_stop_id?", "destination_stop_id?", "operational_status?", "settlement_status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: POST
    path: "/harbor/trips/{id}/dock-slots"
    description: "Reserve a berth window for this trip on a shared dock. OCC-guarded on the Dock's version."
    roles: [Dispatcher]
    code: 201
    input: [dock_id, purpose, start_utc, end_utc, expected_dock_version]
    output: DockSlot
    side_effects:
      - "runs dock_berth_overlap_count against RESERVED and CONSUMED slots on the dock"
      - "creates the slot in RESERVED with both fee fields at 0"
      - "increments Dock.version by 1"

  - method: GET
    path: "/harbor/dock-slots/{id}"
    description: "Read one berth reservation with its fee posting fields."
    roles: [HarborAdmin, Dispatcher, VesselMaster, FareAuditor]
    code: 200
    input: []
    output: DockSlot
    side_effects: []

  - method: GET
    path: "/harbor/dock-slots"
    description: "List berth reservations filtered by dock or trip (FK reverse-reachability for both DockSlot FKs)."
    roles: [HarborAdmin, Dispatcher, VesselMaster, FareAuditor]
    code: 200
    input: ["dock_id?", "trip_id?", "status?", "limit?", "offset?"]
    output: "DockSlot[]"
    side_effects: []

  - method: POST
    path: "/harbor/trips/{id}/board"
    description: "Open boarding and record the manifest. Only the trip's own master may call it."
    roles: [VesselMaster]
    code: 200
    input: [boarded_booking_ids]
    output: Trip
    side_effects:
      - "sets boarded_pax from the manifest and moves each named booking CONFIRMED -> BOARDED"
      - "operational_status SCHEDULED -> BOARDING; settlement_status untouched"
      - "increments Trip.version by 1"

  - method: POST
    path: "/harbor/trips/{id}/depart"
    description: "Sail. Runs the full safety ladder, then posts PROVISIONAL landing fees on every reserved dock slot."
    roles: [VesselMaster]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "stamps actual_departure_utc from the logical clock and booked_pax from seats_committed"
      - "runs dock_slot_fee_posting variant PROVISIONAL; adds each projected_fee_cents to Dock.accrued_fee_cents; increments Dock.version by 1 per touched dock"
      - "operational_status BOARDING -> DEPARTED and settlement_status UNSETTLED -> PROVISIONAL"
      - "increments Trip.version by 1"

  - method: POST
    path: "/harbor/trips/{id}/complete"
    description: "Arrive. Reverses the provisional postings, posts FINAL landing fees, and may cap the dock."
    roles: [VesselMaster]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "stamps actual_arrival_utc from the logical clock"
      - "CASCADE B: provisional reversal -> FINAL posting per slot (status CONSUMED) -> dock cap flip -> rebate_bp pre-locked to 10000 on the dock's remaining RESERVED slots"
      - "moves every BOARDED booking on the trip to COMPLETED and increments CrewMember.trips_mastered_count"
      - "operational_status DEPARTED -> COMPLETED and settlement_status PROVISIONAL -> FINAL"
      - "increments Dock.version by 1 per touched dock and Trip.version by 1"

  # ---- Ride passes -------------------------------------------------------------
  - method: POST
    path: "/harbor/ride-passes"
    description: "Buy a multi-ride pass. rider_user_id is stamped from X-User-ID."
    roles: [Rider]
    code: 201
    input: [zone_tier, rides_purchased, purchase_price_cents, valid_until]
    output: RidePass
    side_effects: ["rides_remaining initialised to rides_purchased, rides_consumed to 0, status ACTIVE"]

  - method: GET
    path: "/harbor/ride-passes/{id}"
    description: "Read one pass with its live ride balance."
    roles: [Rider, HarborAdmin, Dispatcher, FareAuditor]
    code: 200
    input: []
    output: RidePass
    side_effects: []

  - method: POST
    path: "/harbor/ride-passes/{id}/refund"
    description: "Refund the residual value of a pass under the chosen settlement basis."
    roles: [Rider]
    code: 200
    input: [settlement_basis]
    output: RidePass
    side_effects:
      - "runs ride_pass_residual_value; writes refund_basis and refund_amount_cents"
      - "sets rides_remaining to 0 and status to REFUNDED"
      - "increments RidePass.version by 1"

  # ---- Bookings ------------------------------------------------------------------
  - method: POST
    path: "/harbor/bookings"
    description: "Request a ride. The fare is quoted and frozen here from the stops, the mode and the day's surge multiplier."
    roles: [Rider]
    code: 201
    input: [origin_stop_id, destination_stop_id, requested_date, service_mode, party_size, "ride_pass_id?"]
    output: Booking
    side_effects:
      - "rider_user_id stamped from X-User-ID; status REQUESTED; trip_id null; offer_round 0"
      - "runs booking_fare_quote and freezes fare_quoted_cents"

  - method: GET
    path: "/harbor/bookings/{id}"
    description: "Read one booking."
    roles: [Rider, Dispatcher, HarborAdmin, VesselMaster, FareAuditor]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/harbor/bookings"
    description: "List bookings with foreign-key and state filters (FK reverse-reachability for every Booking FK)."
    roles: [Rider, Dispatcher, HarborAdmin, VesselMaster, FareAuditor]
    code: 200
    input: ["trip_id?", "ride_pass_id?", "origin_stop_id?", "destination_stop_id?", "rider_user_id?", "status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/harbor/bookings/{id}/dispatch"
    description: "Offer the highest-ranked eligible trip to a requested booking, per calculation trip_dispatch_selector."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "sets trip_id to the selected trip and status REQUESTED -> OFFERED"
      - "no seats are committed; on an empty pool nothing at all is written"
      - "increments Booking.version by 1"

  - method: POST
    path: "/harbor/bookings/{id}/decline"
    description: "Decline the offered trip. The booking cycles back to REQUESTED with a larger exclusion set, or falls to UNFULFILLED at the third decline."
    roles: [Rider]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "appends trip_id to declined_trip_ids, clears trip_id, increments offer_round"
      - "status OFFERED -> REQUESTED, or OFFERED -> UNFULFILLED once offer_round reaches 3"
      - "increments Booking.version by 1"

  - method: POST
    path: "/harbor/bookings/{id}/confirm"
    description: "Confirm the offered trip, committing seats and redeeming pass rides. OCC-guarded on the Trip's version."
    roles: [Rider]
    code: 200
    input: [expected_trip_version]
    output: Booking
    side_effects:
      - "status OFFERED -> CONFIRMED; recomputes Trip.seats_committed; increments Trip.version by 1"
      - "with a pass: rides_remaining -= party_size, redemption_status REDEEMED, fare_charged_cents 0, pass may flip ACTIVE -> EXHAUSTED"
      - "without a pass: fare_charged_cents = fare_quoted_cents"
      - "increments Booking.version by 1"

  # ---- Refund claims ---------------------------------------------------------------
  - method: GET
    path: "/harbor/refund-claims/{id}"
    description: "Read one refund claim with its waterfall buckets."
    roles: [FareAuditor, Dispatcher, HarborAdmin, Rider]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: GET
    path: "/harbor/refund-claims"
    description: "List refund claims by booking or by interruption (FK reverse-reachability for both RefundClaim FKs)."
    roles: [FareAuditor, Dispatcher, HarborAdmin, Rider]
    code: 200
    input: ["booking_id?", "service_interruption_id?", "status?", "limit?", "offset?"]
    output: "RefundClaim[]"
    side_effects: []

  - method: POST
    path: "/harbor/refund-claims/{id}/approve"
    description: "Approve or deny a refund claim. Segregation of duties forbids the declaring user from deciding it."
    roles: [FareAuditor]
    code: 200
    input: [decision]
    output: RefundClaim
    side_effects:
      - "APPROVE: status OPEN -> APPROVED -> PAID inside the same request; writes the buckets onto the Booking"
      - "DENY: status OPEN -> DENIED with both buckets left at 0"
      - "may bubble the owning ServiceInterruption DECLARED -> RESOLVED"
      - "increments RefundClaim.version by 1"

  # ---- Test-driving endpoint (last rung of the section 1.5 priority ladder) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [HarborAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["re-derives every Vessel.service_state and every RidePass expiry check against the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint in section 1.5"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Rider acts on a Booking/RidePass whose rider_user_id differs from X-User-ID, or a VesselMaster acts on a Trip whose master_crew_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FareAuditor deciding a RefundClaim has the same X-User-ID as the claim's declarer_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, out-of-range number, or an enum value outside the declared set"

  - id: ERR_DOCK_NOT_FOUND
    http: 404
    condition: "no Dock with the given id, in the path or in a request body"
  - id: ERR_STOP_NOT_FOUND
    http: 404
    condition: "origin_stop_id or destination_stop_id names no Stop"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "no Vessel with the given id, in the path or in a request body"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "no CrewMember with the given id, in the path or as master_crew_id"
  - id: ERR_SERVICE_DAY_NOT_FOUND
    http: 404
    condition: "no ServiceDay with the given id, or no ServiceDay whose service_date equals a booking's requested_date"
  - id: ERR_TRIP_NOT_FOUND
    http: 404
    condition: "no Trip with the given id"
  - id: ERR_DOCK_SLOT_NOT_FOUND
    http: 404
    condition: "no DockSlot with the given id"
  - id: ERR_RIDE_PASS_NOT_FOUND
    http: 404
    condition: "no RidePass with the given id, in the path or as ride_pass_id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking with the given id, including an id listed in a boarding manifest"
  - id: ERR_REFUND_CLAIM_NOT_FOUND
    http: 404
    condition: "no RefundClaim with the given id"

  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "scheduled_arrival_utc <= scheduled_departure_utc, end_utc <= start_utc, layup_end_date < layup_start_date, or a completion whose clock reading is not after actual_departure_utc"
  - id: ERR_SAME_ORIGIN_DESTINATION
    http: 422
    condition: "origin_stop_id equals destination_stop_id on a trip or a booking"
  - id: ERR_SERVICE_DAY_DUPLICATE
    http: 409
    condition: "a ServiceDay already exists for that service_date"

  - id: ERR_TRIP_NOT_SCHEDULED
    http: 409
    condition: "board or confirm attempted while Trip.operational_status is not SCHEDULED"
  - id: ERR_TRIP_NOT_BOARDING
    http: 409
    condition: "depart attempted while Trip.operational_status is not BOARDING"
  - id: ERR_TRIP_NOT_DEPARTED
    http: 409
    condition: "complete attempted while Trip.operational_status is not DEPARTED"
  - id: ERR_BOOKING_NOT_REQUESTED
    http: 409
    condition: "dispatch attempted while Booking.status is not REQUESTED"
  - id: ERR_BOOKING_NOT_OFFERED
    http: 409
    condition: "decline or confirm attempted while Booking.status is not OFFERED"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "a boarding manifest names a booking that is not CONFIRMED on this trip"
  - id: ERR_PASS_NOT_ACTIVE
    http: 409
    condition: "a tendered pass is EXHAUSTED, EXPIRED or REFUNDED, or a refund is requested on a pass already REFUNDED or EXPIRED"
  - id: ERR_REFUND_CLAIM_NOT_OPEN
    http: 409
    condition: "approve or deny attempted on a RefundClaim that is not OPEN"
  - id: ERR_INTERRUPTION_NOT_DECLARABLE
    http: 409
    condition: "an interruption is declared on a ServiceDay whose posture is not SUSPENDED"

  - id: ERR_STALE_DOCK_VERSION
    http: 412
    condition: "expected_dock_version does not equal the Dock's current version"
  - id: ERR_STALE_TRIP_VERSION
    http: 412
    condition: "expected_trip_version does not equal the offered Trip's current version"

  - id: ERR_SERVICE_SUSPENDED
    http: 409
    condition: "board, depart or confirm attempted while ServiceDay.posture is SUSPENDED"
  - id: ERR_VESSEL_IN_LAYUP
    http: 409
    condition: "a trip window overlaps the vessel's closed-closed layup window, or a departure is attempted while Vessel.service_state is LAID_UP"
  - id: ERR_VESSEL_OUT_OF_SERVICE
    http: 409
    condition: "a departure is attempted while the vessel's latest ANNUAL inspection result is FAIL"
  - id: ERR_VESSEL_INSPECTION_INVALID
    http: 422
    condition: "no ANNUAL inspection exists, the latest one has expires_on < date(clock_now), or under RESTRICTED posture it carries deficiency_count > 2"
  - id: ERR_HULL_CLASS_RESTRICTED
    http: 422
    condition: "a HARBOR-class hull is asked to depart while ServiceDay.posture is RESTRICTED"
  - id: ERR_CREW_CERT_EXPIRED
    http: 422
    condition: "the master is SUSPENDED, or cert_expires_on or medical_expires_on is earlier than date(clock_now)"
  - id: ERR_CREW_ENDORSEMENT_INSUFFICIENT
    http: 422
    condition: "the master holds MASTER_25T while the vessel requires MASTER_100T"
  - id: ERR_UNDER_KEEL_CLEARANCE
    http: 422
    condition: "round_half_up(low_water_m - draft_m, 2) is strictly below 0.30"

  - id: ERR_DOCK_BERTH_CONFLICT
    http: 409
    condition: "the candidate berth window would push overlapping buffered occupancy on the dock to berth_count"
  - id: ERR_SLOT_DOCK_NOT_ON_ROUTE
    http: 422
    condition: "the slot's dock is neither the trip's origin stop's dock nor its destination stop's dock"
  - id: ERR_PASS_EXPIRED
    http: 409
    condition: "a tendered pass has valid_until earlier than date(clock_now); the pass row is moved to EXPIRED before the rejection is returned"
  - id: ERR_PASS_ZONE_NOT_COVERED
    http: 422
    condition: "the pass zone_tier does not cover the booking's zone_span"
  - id: ERR_PASS_NO_RIDES_REMAINING
    http: 409
    condition: "rides_remaining is smaller than the booking's party_size at confirmation"
  - id: ERR_NO_ELIGIBLE_TRIP
    http: 409
    condition: "the dispatch candidate pool is empty"
  - id: ERR_TRIP_CAPACITY_EXCEEDED
    http: 409
    condition: "the confirmation or boarding manifest would exceed Trip.effective_capacity"

# =============================================================================
# 1.7 RBAC Matrix  (segregation of duties)
# =============================================================================
roles:
  - name: HarborAdmin
    description: "Shoreside administrator: owns the physical estate (docks, stops, vessels, crew) and the daily weather/tide/event observations."
    identity: "opaque"
    exclusive_operations:
      - "POST /harbor/docks"
      - "POST /harbor/docks/{id}/stops"
      - "POST /harbor/vessels"
      - "POST /harbor/crew-members"
      - "POST /harbor/service-days"
      - "PATCH /harbor/service-days/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /harbor/docks/{id}"
      - "GET /harbor/docks/{id}/stops"
      - "GET /harbor/vessels/{id}"
      - "GET /harbor/vessels/{id}/inspections"
      - "GET /harbor/crew-members/{id}"
      - "GET /harbor/service-days/{id}"
      - "GET /harbor/service-days/{id}/interruptions"
      - "GET /harbor/trips/{id}"
      - "GET /harbor/trips"
      - "GET /harbor/dock-slots/{id}"
      - "GET /harbor/dock-slots"
      - "GET /harbor/ride-passes/{id}"
      - "GET /harbor/bookings/{id}"
      - "GET /harbor/bookings"
      - "GET /harbor/refund-claims/{id}"
      - "GET /harbor/refund-claims"

  - name: Dispatcher
    description: "Runs the sailing plan: creates trips, books berths, offers trips to riders and declares service interruptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /harbor/trips"
      - "POST /harbor/trips/{id}/dock-slots"
      - "POST /harbor/bookings/{id}/dispatch"
      - "POST /harbor/service-days/{id}/interruptions"
    shared_operations:
      - "GET /harbor/docks/{id}"
      - "GET /harbor/docks/{id}/stops"
      - "GET /harbor/vessels/{id}"
      - "GET /harbor/vessels/{id}/inspections"
      - "GET /harbor/crew-members/{id}"
      - "GET /harbor/service-days/{id}"
      - "GET /harbor/service-days/{id}/interruptions"
      - "GET /harbor/trips/{id}"
      - "GET /harbor/trips"
      - "GET /harbor/dock-slots/{id}"
      - "GET /harbor/dock-slots"
      - "GET /harbor/ride-passes/{id}"
      - "GET /harbor/bookings/{id}"
      - "GET /harbor/bookings"
      - "GET /harbor/refund-claims/{id}"
      - "GET /harbor/refund-claims"

  - name: VesselMaster
    description: "The licensed master of a specific vessel movement. X-User-ID is a CrewMember id and must equal the trip's master_crew_id."
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /harbor/trips/{id}/board"
      - "POST /harbor/trips/{id}/depart"
      - "POST /harbor/trips/{id}/complete"
    shared_operations:
      - "GET /harbor/docks/{id}"
      - "GET /harbor/docks/{id}/stops"
      - "GET /harbor/vessels/{id}"
      - "GET /harbor/vessels/{id}/inspections"
      - "GET /harbor/crew-members/{id}"
      - "GET /harbor/service-days/{id}"
      - "GET /harbor/trips/{id}"
      - "GET /harbor/trips"
      - "GET /harbor/dock-slots/{id}"
      - "GET /harbor/dock-slots"
      - "GET /harbor/bookings/{id}"
      - "GET /harbor/bookings"

  - name: MarineInspector
    description: "Independent surveyor. The only role that may file inspection records; may not create or move vessels."
    identity: "opaque"
    exclusive_operations:
      - "POST /harbor/vessels/{id}/inspections"
    shared_operations:
      - "GET /harbor/docks/{id}"
      - "GET /harbor/vessels/{id}"
      - "GET /harbor/vessels/{id}/inspections"

  - name: Rider
    description: "Travelling customer. X-User-ID is an opaque customer identifier stored on Booking.rider_user_id and RidePass.rider_user_id; it is never compared to any entity id."
    identity: "opaque"
    exclusive_operations:
      - "POST /harbor/ride-passes"
      - "POST /harbor/ride-passes/{id}/refund"
      - "POST /harbor/bookings"
      - "POST /harbor/bookings/{id}/decline"
      - "POST /harbor/bookings/{id}/confirm"
    shared_operations:
      - "GET /harbor/docks/{id}/stops"
      - "GET /harbor/service-days/{id}"
      - "GET /harbor/trips/{id}"
      - "GET /harbor/trips"
      - "GET /harbor/ride-passes/{id}"
      - "GET /harbor/bookings/{id}"
      - "GET /harbor/bookings"
      - "GET /harbor/refund-claims/{id}"
      - "GET /harbor/refund-claims"

  - name: FareAuditor
    description: "Revenue control. Decides refund claims and may never be the same person who declared the interruption that created them."
    identity: "opaque"
    exclusive_operations:
      - "POST /harbor/refund-claims/{id}/approve"
    shared_operations:
      - "GET /harbor/docks/{id}"
      - "GET /harbor/docks/{id}/stops"
      - "GET /harbor/service-days/{id}"
      - "GET /harbor/service-days/{id}/interruptions"
      - "GET /harbor/trips/{id}"
      - "GET /harbor/trips"
      - "GET /harbor/dock-slots/{id}"
      - "GET /harbor/dock-slots"
      - "GET /harbor/ride-passes/{id}"
      - "GET /harbor/bookings/{id}"
      - "GET /harbor/bookings"
      - "GET /harbor/refund-claims/{id}"
      - "GET /harbor/refund-claims"
    segregation_of_duties:
      - "the Dispatcher who declares a ServiceInterruption cannot decide any RefundClaim it created (ERR_SEGREGATION_OF_DUTIES); the comparand is RefundClaim.declarer_user_id versus the acting X-User-ID"
      - "the MarineInspector who files an inspection is never permitted to create or move the vessel it covers"
