  - rule_id: transitive_cascade
    instances:

      - name: sweep_credential_expiry_cascades_five_hops_to_voided_badge
        grounds:
          - state_machines.Credential.VERIFIED_to_EXPIRED
          - state_machines.VendorRep.CREDENTIALED_to_SUSPENDED
          - state_machines.CaseRepAuthorization.APPROVED_to_REVOKED
          - state_machines.KioskCheckIn.ISSUED_to_VOIDED
          - calculations.rep_credential_posture
          - calculations.case_vendor_coverage_status
          - calculations.vendor_scorecard_tier_and_quota
          - entities.ComplianceSweep.fields.badges_voided_count
        distinguishing_aspect: |
          A five-hop chain fired by a single sweep call, rooted at a Credential:
          credential EXPIRED -> rep credential_posture LAPSED -> rep access_status SUSPENDED ->
          CaseRepAuthorization REVOKED (revoked_reason REP_SUSPENDED) -> KioskCheckIn VOIDED, plus the
          counter fan-out on Vendor, VendorRep and SurgicalCase. The distinguishing observable is that
          badges_voided_count is 1 while badges_expired_count is 0: the badge left ISSUED through the
          phase-4 revocation path, not the phase-5 expiry path, even though its window had also closed.
        test_recipe:
          setup:
            - "Facility WD-07 exists with default badge_lead_minutes 60 and badge_grace_minutes 30."
            - "Rep Lena Fischer of Vendor ENDOS is CREDENTIALED; her IMMUNIZATION_INFLUENZA credential expires exactly at 2026-10-01T08:45:00Z and the other three expire 2027-07-01T00:00:00Z."
            - "Case CASE-9501 is a non-implant case running 2026-10-01T09:00:00Z to 11:00:00Z, so the badge window is 08:00:00Z to 11:30:00Z."
            - "The authorization is approved at the 2026-08-01T00:00:00Z default clock, when the influenza credential is 61 days out and the posture is COMPLIANT."
            - "The clock then moves to 2026-10-01T08:30:00Z and the rep checks in, so a badge is ISSUED before anything expires."
            - "Finally the clock moves to exactly 2026-10-01T08:45:00Z; nothing has changed state yet because every expiry transition is sweep-driven."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Westdale General Hospital", code: "WD-07", spd_turnaround_hours: 6, spd_bay_count: 3 }
              as: CredentialingOfficer
