  # ---------------------------------------------------------------------------
  # RBAC
  # ---------------------------------------------------------------------------
  - section: roles
    instances:
      - name: inspector_cannot_review_document
        claim_type: role_denial
        grounds: ["roles[Inspector]", "roles[DrawProcessor]", "endpoints[POST /draw-documents/{id}/review]"]
        distinguishing_aspect: "approval_chain step ownership: Inspector's only write is inspection completion; calling the DrawProcessor-only document review fails with 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["draw D DRAFT with one SUBMITTED invoice document"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_id: $.data.id } }
          trigger:
            - { call: "POST /draw-documents/${doc_id}/review", payload: { decision: "VERIFIED" }, as: Inspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (HTTP 403); document remains SUBMITTED"

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reallocation-create-stale-loan]", "errors[ERR_STALE_LOAN_VERSION]"]
        distinguishing_aspect: "OCC on Loan.version: creating reallocation R1 with the observed version succeeds and bumps Loan.version by 1; a second create carrying the same (now stale) expected_loan_version fails with 412 ERR_STALE_LOAN_VERSION — deterministic with two strictly sequential requests."
        test_recipe:
          setup: ["loan L with lines BL-A 40000000 and BL-B 30000000 (no other activity)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "FRAM", description: "Framing", original_amount_cents: 30000000 }, as: LenderAdmin, captures: { bl_b: $.data.id } }
            - { call: "GET /loans/${l_id}", as: LenderAdmin, captures: { l_v: $.data.version } }
          trigger:
            - { call: "POST /reallocation-requests", payload: { loan_id: "${l_id}", from_budget_line_id: "${bl_a}", to_budget_line_id: "${bl_b}", amount_cents: 1000000, justification: "First", expected_loan_version: "${l_v}" }, as: LenderAdmin, captures: { ra_id: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { loan_id: "${l_id}", from_budget_line_id: "${bl_a}", to_budget_line_id: "${bl_b}", amount_cents: 2000000, justification: "Second with stale version", expected_loan_version: "${l_v}" }, as: LenderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first create succeeds (201), ReallocationRequest.${ra_id}.status == PENDING and created_loan_version == captured version"
            - "Loan.${l_id}.version incremented by exactly 1 after the create (observed via GET before and after)"
            - "second create: err == ERR_STALE_LOAN_VERSION (HTTP 412); no second reallocation exists for the loan"

      - name: derived_totals_recomputed_on_line_add
        claim_type: derived_field_reconciliation
        grounds: [entities.DrawRequest.fields.requested_total_cents, "endpoints[POST /draw-line-items]"]
        excluded_because:
          difficulty_instance: draw_revision_cycle_resubmit
          rationale: "That §1.8 instance asserts requested_total_cents == 7500000 after adding a second line item in REVISION_REQUESTED — the derived-field recomputation claim."

      - name: conversion_cascade_closes_budget_lines
        claim_type: cascading_side_effects
        grounds: [state_machines.Loan.OPEN_to_CONVERTED, state_machines.BudgetLine.ACTIVE_to_CLOSED]
        excluded_because:
          difficulty_instance: conversion_decline_branch_vs_convert_branch
          rationale: "That §1.8 instance asserts BudgetLine status == CLOSED and the reserve SWEEP as consequences of the convert branch."

  # ---------------------------------------------------------------------------
  # Consistency model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate consistency: a GET issued right after a mutating call observes the mutation — the loan created with reserve 200000 reads back interest_reserve_balance_cents 200000 and status OPEN with no recompute or delay endpoint involved."
        test_recipe:
          setup: ["one borrower registered"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "GET /loans/${l_id}", as: CreditOfficer }
          assert:
            - "GET returns interest_reserve_balance_cents == 200000, status == OPEN, version == 1 in the immediately following request"
