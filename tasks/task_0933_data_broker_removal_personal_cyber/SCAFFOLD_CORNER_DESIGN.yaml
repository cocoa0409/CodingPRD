      - name: breach_event_with_disclosure_before_the_breach_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "disclosed_at must be at or after breach_date; supplying 2026-03-01 disclosure for a 2026-04-01 breach returns ERR_INVALID_DATE_RANGE (422), a different rung from the numeric-range rung 9."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /breach-events"
              payload: { name: "Impossible Breach", breach_date: "2026-04-01T00:00:00Z", disclosed_at: "2026-03-01T00:00:00Z", record_types: ["EMAIL_ADDRESS"], base_severity_points: 10 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_INVALID_DATE_RANGE"
            - "The same payload with disclosed_at equal to breach_date is accepted with HTTP 201 — the comparison is >="
            - "An IdentityDocument with expires_at equal to the current clock instant also returns ERR_INVALID_DATE_RANGE"

      - name: invited_member_cannot_create_a_monitored_profile
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=21]
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: "Rung 21 requires the target Member to be ACTIVE, so an INVITED member who has not yet redeemed their token cannot create a profile: ERR_MEMBER_NOT_ACTIVE, distinct from the ownership and authorization rungs."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one INVITED member who has not activated."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, av1: $.data.version }
