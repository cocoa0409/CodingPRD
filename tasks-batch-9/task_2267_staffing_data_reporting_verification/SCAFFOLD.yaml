scenario: "2267. Staffing Data Reporting & Verification (skilled nursing facility payroll-based reporting): employee and contractor hour capture by job category with direct care classification rules, exclusion of non-direct-care and administrative time with allocation for split roles, census data reconciliation to compute hours per resident day, quarterly submission with validation errors and correction windows, audit readiness with payroll records supporting each reported hour, staffing measure calculation feeding public rating systems with thresholds and weekend staffing metrics, agency and contract staff data collection from vendors, discrepancy investigation and rating appeal process"

domain_name: staffing-data-reporting-verification

api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, parallel_state_dimensions]
  role_model: segregation_of_duties
  consistency_model: immediate

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: ccn
        type: string
        source: input
        description: CMS Certification Number identifying the skilled nursing facility
        constraints: exactly 6 characters, unique across Facility
      - name: name
        type: string
        source: input
        description: legal facility name
      - name: state_code
        type: string
        source: input
        description: two-letter state code the facility reports under
        constraints: exactly 2 uppercase letters
      - name: certified_bed_count
        type: integer
        source: input
        description: number of certified beds
        constraints: ">= 1"
      - name: posture
        type: enum
        source: computed
        description: reporting posture derived from this facility's DiscrepancyCase set by calculations.facility_posture_derivation
        default: REPORTING_OPEN
        constraints: REPORTING_OPEN | AUDIT_HOLD | SANCTIONED
      - name: open_case_count
        type: integer
        source: computed
        description: count of DiscrepancyCase rows for this facility with status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW}
        default: 0
      - name: substantiated_case_count
        type: integer
        source: computed
        description: count of DiscrepancyCase rows for this facility with status == SUBSTANTIATED
        default: 0
      - name: outstanding_surcharge_cents
        type: integer
        source: computed
        description: sum over this facility's QuarterlySubmission rows of (amendment_surcharge_cents - waived_surcharge_cents)
        default: 0
      - name: latest_staffing_rating
        type: integer
        source: computed
        description: staffing_rating of the most recently published StaffingMeasure for this facility, selected by publication_status == PUBLISHED ordered by published_at DESC then created_at DESC; null when none
        constraints: 1..5 or null

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_code
        type: string
        source: input
        description: quarter code such as 2026Q2
        constraints: unique per state_code
      - name: state_code
        type: string
        source: input
        description: two-letter state code this period governs
        constraints: exactly 2 uppercase letters
      - name: start_date
        type: string
        source: input
        description: first calendar day covered (YYYY-MM-DD, inclusive)
      - name: end_date
        type: string
        source: input
        description: last calendar day covered (YYYY-MM-DD, inclusive)
        constraints: end_date >= start_date
      - name: submission_deadline
        type: datetime
        source: input
        description: instant after which a submit is late and amendment surcharges accrue
      - name: correction_window_end
        type: datetime
        source: input
        description: instant after which no hour, census, or amendment write is accepted for this period
        constraints: correction_window_end > submission_deadline
      - name: day_count
        type: integer
        source: computed
        description: inclusive calendar day count between start_date and end_date
      - name: status
        type: enum
        source: computed
        description: OPEN until POST /reporting-periods/{id}/close moves it to CLOSED
        default: OPEN
        constraints: OPEN | CLOSED

  - name: JobCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: internal job category code
        constraints: unique across JobCategory
      - name: cms_job_code
        type: integer
        source: input
        description: CMS payroll-based job code
        constraints: 1..40
      - name: direct_care_class
        type: enum
        source: input
        description: classification driving direct care credit
        constraints: DIRECT_CARE | DIRECT_CARE_SPLIT | ADMINISTRATIVE | NON_DIRECT_CARE
      - name: nurse_group
        type: enum
        source: input
        description: nurse grouping used by staffing measures
        constraints: RN | LPN | NA | NONE
      - name: direct_care_credit_pct
        type: number
        source: input
        description: fraction of allocated hours that count as direct care for this category
        constraints: 0.00..1.00, exactly 2 decimal places
      - name: weekend_countable
        type: boolean
        source: input
        description: whether hours in this category count toward weekend staffing metrics
        default: true

  - name: Worker
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility this worker reports hours for
      - name: full_name
        type: string
        source: input
        description: worker name as it appears on payroll
      - name: worker_type
        type: enum
        source: input
        description: employment relationship
        constraints: EMPLOYEE | AGENCY_CONTRACTOR | INDIVIDUAL_CONTRACTOR
      - name: primary_job_category_id
        type: string
        source: input
        description: FK -> JobCategory.id; default job category for this worker
      - name: vendor_id
        type: string
        source: input
        description: FK -> StaffingVendor.id; required when worker_type == AGENCY_CONTRACTOR, must be null otherwise
        default: null
      - name: hire_date
        type: string
        source: input
        description: first date the worker may report hours (YYYY-MM-DD, inclusive)
      - name: authorized_roles
        type: array
        source: input
        description: role names this worker may act as; each element is one of STAFFING_COORDINATOR, FACILITY_ADMINISTRATOR
        default: []
      - name: status
        type: enum
        source: computed
        description: ACTIVE until POST /workers/{id}/terminate moves it to TERMINATED
        default: ACTIVE
        constraints: ACTIVE | TERMINATED
      - name: reported_hours_total
        type: number
        source: computed
        description: sum of HourEntry.raw_hours for this worker over HourEntry rows with entry_status == ACTIVE, 2 decimal places
        default: 0.00

  - name: StaffingVendor
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility this vendor supplies staff to
      - name: vendor_name
        type: string
        source: input
        description: staffing agency legal name
      - name: tax_id
        type: string
        source: input
        description: vendor tax identifier
        constraints: unique per facility_id
      - name: attestation_contact
        type: string
        source: input
        description: email of the vendor representative who attests submitted hours
      - name: status
        type: enum
        source: computed
        description: ACTIVE until POST /vendors/{id}/suspend moves it to SUSPENDED
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED
      - name: accepted_hours_total
        type: number
        source: computed
        description: sum of VendorHourSubmission.accepted_direct_care_hours over this vendor's submissions with status == ACCEPTED, 2 decimal places
        default: 0.00

  - name: VendorHourSubmission
    parent: StaffingVendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> StaffingVendor.id; the vendor supplying this hour batch
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the receiving facility
      - name: reporting_period_id
        type: string
        source: input
        description: FK -> ReportingPeriod.id; the period the lines fall in
      - name: lines
        type: array
        source: input
        description: hour lines, each an object { worker_id, job_category_id, work_date, shift_start, shift_end, allocations }; allocations uses the same shape as HourEntry.allocations
        constraints: at least 1 element
      - name: line_count
        type: integer
        source: computed
        description: number of elements in lines
      - name: attested_by
        type: string
        source: input
        description: name of the vendor signatory attesting the batch
      - name: status
        type: enum
        source: computed
        description: lifecycle per state_machines.VendorHourSubmission
        default: DRAFT
        constraints: DRAFT | SUBMITTED | ACCEPTED | REJECTED | REVOKED
      - name: accepted_direct_care_hours
        type: number
        source: computed
        description: sum of direct_care_hours over the HourEntry rows synthesized from this batch, 2 decimal places
        default: 0.00
      - name: accepted_hour_entry_ids
        type: array
        source: computed
        description: ids of the HourEntry rows synthesized when this batch was accepted, in lines order
        default: []
      - name: rejection_reason
        type: string
        source: computed
        description: reason recorded by POST /vendor-submissions/{id}/reject
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: logical clock instant when status became SUBMITTED
        default: null

  - name: PayrollRecord
    parent: Facility
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; owning facility
      - name: worker_id
        type: string
        source: input
        description: FK -> Worker.id; the worker the payroll document covers
      - name: pay_period_start
        type: string
        source: input
        description: first day covered by the document (YYYY-MM-DD, inclusive)
      - name: pay_period_end
        type: string
        source: input
        description: last day covered by the document (YYYY-MM-DD, inclusive)
        constraints: pay_period_end >= pay_period_start
      - name: paid_hours
        type: number
        source: input
        description: hours paid on this document, 2 decimal places
        constraints: "> 0.00"
      - name: support_type
        type: enum
        source: input
        description: document class backing reported hours
        constraints: TIMECARD | PAYROLL_JOURNAL | INVOICE
      - name: document_ref
        type: string
        source: input
        description: immutable external document reference
        constraints: unique per facility_id

  - name: HourEntry
    parent: QuarterlySubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> QuarterlySubmission.id; the quarterly submission this hour lands in
      - name: facility_id
        type: string
        source: computed
        description: FK -> Facility.id; copied from the parent QuarterlySubmission.facility_id
      - name: reporting_period_id
        type: string
        source: computed
        description: FK -> ReportingPeriod.id; copied from the parent QuarterlySubmission.reporting_period_id
      - name: worker_id
        type: string
        source: input
        description: FK -> Worker.id; the worker who worked the shift
      - name: job_category_id
        type: string
        source: input
        description: FK -> JobCategory.id; the category the shift is reported under
      - name: vendor_submission_id
        type: string
        source: computed
        description: FK -> VendorHourSubmission.id; set when this entry was synthesized by a vendor batch acceptance, null otherwise
        default: null
      - name: payroll_record_id
        type: string
        source: input
        description: FK -> PayrollRecord.id; the payroll document offered as support for this hour, null when unsupported
        default: null
      - name: work_date
        type: string
        source: input
        description: calendar date of the shift (YYYY-MM-DD)
      - name: shift_start
        type: string
        source: input
        description: shift start time-of-day on work_date (HH:MM, 24h)
      - name: shift_end
        type: string
        source: input
        description: shift end time-of-day on work_date (HH:MM, 24h); must be strictly after shift_start
      - name: raw_hours
        type: number
        source: computed
        description: shift length in hours from shift_start to shift_end, 2 decimal places
      - name: allocations
        type: array
        source: input
        description: split-role allocation lines, each an object { job_category_id, percent }; percent has exactly 2 decimal places and the percents must sum to 100.00
        constraints: at least 1 element
      - name: direct_care_hours
        type: number
        source: computed
        description: direct-care-credited hours from calculations.hour_entry_classification, 2 decimal places
      - name: excluded_hours
        type: number
        source: computed
        description: raw_hours minus direct_care_hours, 2 decimal places
      - name: rn_hours
        type: number
        source: computed
        description: portion of direct_care_hours from allocation lines whose JobCategory.nurse_group == RN, 2 decimal places
      - name: lpn_hours
        type: number
        source: computed
        description: portion of direct_care_hours from allocation lines whose JobCategory.nurse_group == LPN, 2 decimal places
      - name: na_hours
        type: number
        source: computed
        description: portion of direct_care_hours from allocation lines whose JobCategory.nurse_group == NA, 2 decimal places
      - name: is_weekend
        type: boolean
        source: computed
        description: true when work_date falls on Saturday or Sunday
      - name: source
        type: enum
        source: computed
        description: PAYROLL when created via POST /hour-entries, VENDOR_SUBMISSION when synthesized by a vendor batch acceptance
        default: PAYROLL
        constraints: PAYROLL | VENDOR_SUBMISSION
      - name: entry_status
        type: enum
        source: computed
        description: ACTIVE until POST /hour-entries/{id}/void moves it to VOID
        default: ACTIVE
        constraints: ACTIVE | VOID
      - name: verification_status
        type: enum
        source: computed
        description: audit verification dimension per state_machines.HourEntry
        default: UNVERIFIED
        constraints: UNVERIFIED | SUPPORTED | UNSUPPORTED
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAuditor who last verified this entry
        default: null
      - name: submission_version
        type: integer
        source: computed
        description: value of QuarterlySubmission.version immediately after this entry was applied
      - name: allocation_revision
        type: integer
        source: computed
        description: number of times allocations has been replaced via PUT /hour-entries/{id}/allocations
        default: 0

  - name: CensusDay
    parent: QuarterlySubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> QuarterlySubmission.id; the quarterly submission this census day belongs to
      - name: facility_id
        type: string
        source: computed
        description: FK -> Facility.id; copied from the parent QuarterlySubmission.facility_id
      - name: reporting_period_id
        type: string
        source: computed
        description: FK -> ReportingPeriod.id; copied from the parent QuarterlySubmission.reporting_period_id
      - name: census_date
        type: string
        source: input
        description: calendar date of the midnight census (YYYY-MM-DD)
        constraints: unique per submission_id
      - name: resident_count
        type: integer
        source: input
        description: facility-reported resident count at midnight
        constraints: ">= 0"
      - name: mds_resident_count
        type: integer
        source: input
        description: independent MDS-derived resident count used for reconciliation, null when not yet supplied
        default: null
      - name: variance_pct
        type: number
        source: computed
        description: absolute relative variance between resident_count and mds_resident_count from calculations.census_variance_reconciliation, 4 decimal places, null when mds_resident_count is null
        default: null
      - name: status
        type: enum
        source: computed
        description: reconciliation state per state_machines.CensusDay
        default: REPORTED
        constraints: REPORTED | RECONCILED | DISPUTED
      - name: is_weekend
        type: boolean
        source: computed
        description: true when census_date falls on Saturday or Sunday
      - name: submission_version
        type: integer
        source: computed
        description: value of QuarterlySubmission.version immediately after this census day was applied

  - name: QuarterlySubmission
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the reporting facility
      - name: reporting_period_id
        type: string
        source: input
        description: FK -> ReportingPeriod.id; the quarter being reported
        constraints: unique per facility_id among submissions with status != VOID
      - name: status
        type: enum
        source: computed
        description: lifecycle per state_machines.QuarterlySubmission
        default: DRAFT
        constraints: DRAFT | VALIDATED | SUBMITTED | ACCEPTED | REJECTED | FINAL | VOID
      - name: total_raw_hours
        type: number
        source: computed
        description: sum of HourEntry.raw_hours over this submission's entries with entry_status == ACTIVE, 2 decimal places
        default: 0.00
      - name: total_direct_care_hours
        type: number
        source: computed
        description: sum of HourEntry.direct_care_hours over this submission's entries with entry_status == ACTIVE, 2 decimal places
        default: 0.00
      - name: total_excluded_hours
        type: number
        source: computed
        description: sum of HourEntry.excluded_hours over this submission's entries with entry_status == ACTIVE, 2 decimal places
        default: 0.00
      - name: total_rn_direct_care_hours
        type: number
        source: computed
        description: sum of HourEntry.rn_hours over this submission's entries with entry_status == ACTIVE, 2 decimal places
        default: 0.00
      - name: weekend_direct_care_hours
        type: number
        source: computed
        description: sum of HourEntry.direct_care_hours over this submission's entries with entry_status == ACTIVE and is_weekend == true, 2 decimal places
        default: 0.00
      - name: vendor_sourced_hours
        type: number
        source: computed
        description: sum of HourEntry.direct_care_hours over this submission's entries with entry_status == ACTIVE and source == VENDOR_SUBMISSION, 2 decimal places
        default: 0.00
      - name: total_resident_days
        type: integer
        source: computed
        description: sum of CensusDay.resident_count over this submission's census days with status IN {REPORTED, RECONCILED, DISPUTED}
        default: 0
      - name: hprd_reported
        type: number
        source: computed
        description: as_submitted hours per resident day from calculations.hprd_reconciliation, 4 decimal places, null when total_resident_days == 0
        default: null
      - name: weekend_hprd_reported
        type: number
        source: computed
        description: weekend_direct_care_hours divided by the sum of resident_count over census days with is_weekend == true, 4 decimal places, null when that sum is 0
        default: null
      - name: open_fatal_finding_count
        type: integer
        source: computed
        description: count of ValidationFinding rows for this submission with severity == FATAL and status == OPEN
        default: 0
      - name: open_warning_finding_count
        type: integer
        source: computed
        description: count of ValidationFinding rows for this submission with severity == WARNING and status == OPEN
        default: 0
      - name: audit_support_score
        type: number
        source: computed
        description: score from calculations.audit_support_score computed on acceptance, 2 decimal places
        default: null
      - name: validated_by_worker_id
        type: string
        source: computed
        description: FK -> Worker.id; the Worker whose id was the X-User-ID on the successful validate call
        default: null
      - name: attested_by_worker_id
        type: string
        source: computed
        description: FK -> Worker.id; the Worker whose id was the X-User-ID on the successful submit call
        default: null
      - name: accepted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAuditor who accepted or rejected this submission
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: logical clock instant of the most recent successful submit
        default: null
      - name: accepted_at
        type: datetime
        source: computed
        description: logical clock instant of the most recent successful accept
        default: null
      - name: correction_deadline
        type: datetime
        source: computed
        description: copy of ReportingPeriod.correction_window_end at creation time
      - name: amendment_index
        type: integer
        source: computed
        description: number of times this submission has been reopened via POST /submissions/{id}/reopen
        default: 0
      - name: amendment_surcharge_cents
        type: integer
        source: computed
        description: cumulative surcharge assessed by calculations.amendment_surcharge across reopens
        default: 0
      - name: waived_surcharge_cents
        type: integer
        source: computed
        description: cumulative surcharge waived by granted RatingAppeal decisions
        default: 0
      - name: rejection_reason
        type: string
        source: computed
        description: reason recorded by POST /submissions/{id}/reject
        default: null

  - name: ValidationFinding
    parent: QuarterlySubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> QuarterlySubmission.id; the submission the finding was raised against
      - name: code
        type: enum
        source: computed
        description: finding code raised by validate, census reconciliation, or a cascade
        constraints: CENSUS_VARIANCE | CENSUS_INCOMPLETE | HPRD_IMPLAUSIBLE | UNSUPPORTED_HOURS | FACILITY_SANCTIONED | ZERO_DIRECT_CARE_DAY | MISSING_PAYROLL_SUPPORT
      - name: severity
        type: enum
        source: computed
        description: FATAL blocks submit, WARNING does not
        constraints: FATAL | WARNING
      - name: subject_ref
        type: string
        source: computed
        description: opaque human-readable pointer to the offending subject, such as a work_date or census_date string; not a foreign key
      - name: detail
        type: string
        source: computed
        description: human-readable explanation of the finding
      - name: status
        type: enum
        source: computed
        description: OPEN until resolved by a corrective write or waived by a StateAuditor
        default: OPEN
        constraints: OPEN | RESOLVED | WAIVED
      - name: waived_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAuditor who waived this finding
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: logical clock instant when status left OPEN
        default: null

  - name: StaffingMeasure
    parent: QuarterlySubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> QuarterlySubmission.id; the accepted submission the measure was computed from
      - name: facility_id
        type: string
        source: computed
        description: FK -> Facility.id; copied from the source submission
      - name: reporting_period_id
        type: string
        source: computed
        description: FK -> ReportingPeriod.id; copied from the source submission
      - name: measure_variant
        type: enum
        source: computed
        description: AS_SUBMITTED at creation; flips to AUDIT_ADJUSTED when an audit revision recomputes it in place
        default: AS_SUBMITTED
        constraints: AS_SUBMITTED | AUDIT_ADJUSTED
      - name: total_nurse_hprd
        type: number
        source: computed
        description: total nurse hours per resident day from calculations.hprd_reconciliation under the active measure_variant, 4 decimal places
      - name: rn_hprd
        type: number
        source: computed
        description: RN hours per resident day under the active measure_variant, 4 decimal places
      - name: weekend_total_nurse_hprd
        type: number
        source: computed
        description: weekend nurse hours per weekend resident day under the active measure_variant, 4 decimal places
      - name: total_nurse_points
        type: integer
        source: computed
        description: star points from the total_nurse_hprd tier table in calculations.staffing_rating_assignment
        constraints: 1..5
      - name: rn_points
        type: integer
        source: computed
        description: star points from the rn_hprd tier table in calculations.staffing_rating_assignment
        constraints: 1..5
      - name: days_with_zero_rn_hours
        type: integer
        source: computed
        description: count of census dates in the period for which the source submission has no ACTIVE HourEntry with rn_hours > 0.00
      - name: staffing_rating
        type: integer
        source: computed
        description: final public star rating from calculations.staffing_rating_assignment
        constraints: 1..5
      - name: publication_status
        type: enum
        source: computed
        description: publication dimension per state_machines.StaffingMeasure
        default: PROVISIONAL
        constraints: PROVISIONAL | PUBLISHED | SUPPRESSED
      - name: audit_status
        type: enum
        source: computed
        description: audit dimension per state_machines.StaffingMeasure
        default: NOT_AUDITED
        constraints: NOT_AUDITED | UNDER_AUDIT | AUDIT_CONFIRMED | AUDIT_REVISED
      - name: published_at
        type: datetime
        source: computed
        description: logical clock instant when publication_status became PUBLISHED
        default: null
      - name: appeal_deadline
        type: datetime
        source: computed
        description: published_at plus 30 calendar days; null until published
        default: null
      - name: has_open_appeal
        type: boolean
        source: computed
        description: true while a RatingAppeal for this measure has status == SUBMITTED
        default: false
      - name: computed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the CmsPublisher who computed this measure
        default: null

  - name: DiscrepancyCase
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility under investigation
      - name: submission_id
        type: string
        source: input
        description: FK -> QuarterlySubmission.id; the submission whose data is disputed
      - name: staffing_measure_id
        type: string
        source: input
        description: FK -> StaffingMeasure.id; the measure affected by the investigation, null when none exists yet
        default: null
      - name: trigger_reason
        type: enum
        source: input
        description: why the case was opened
        constraints: AUDIT_SCORE_BELOW_FLOOR | UNSUPPORTED_HOURS | CENSUS_MISMATCH | VENDOR_DATA_GAP | PUBLIC_COMPLAINT
      - name: detail
        type: string
        source: input
        description: investigator narrative
      - name: status
        type: enum
        source: computed
        description: investigation lifecycle per state_machines.DiscrepancyCase
        default: OPEN
        constraints: OPEN | INFO_REQUESTED | UNDER_REVIEW | SUBSTANTIATED | DISMISSED | OVERTURNED
      - name: auto_opened
        type: boolean
        source: computed
        description: true when the case was opened by the acceptance cascade rather than by POST /discrepancy-cases
        default: false
      - name: opened_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAuditor who opened the case; the literal string SYSTEM when auto_opened is true
      - name: info_request_count
        type: integer
        source: computed
        description: number of times POST /discrepancy-cases/{id}/request-info has succeeded on this case
        default: 0
      - name: facility_response_count
        type: integer
        source: computed
        description: number of times POST /discrepancy-cases/{id}/respond has succeeded on this case
        default: 0
      - name: last_request_note
        type: string
        source: computed
        description: note supplied on the most recent successful POST /discrepancy-cases/{id}/request-info
        default: null
      - name: last_response_note
        type: string
        source: computed
        description: note supplied on the most recent successful POST /discrepancy-cases/{id}/respond
        default: null
      - name: substantiated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAuditor who substantiated the case
        default: null
      - name: resolution_note
        type: string
        source: computed
        description: note recorded on the terminal or overturning transition
        default: null

  - name: RatingAppeal
    parent: StaffingMeasure
    common_fields: true
    fields:
      - name: staffing_measure_id
        type: string
        source: input
        description: FK -> StaffingMeasure.id; the published measure being appealed
      - name: facility_id
        type: string
        source: computed
        description: FK -> Facility.id; copied from the appealed measure
      - name: discrepancy_case_id
        type: string
        source: input
        description: FK -> DiscrepancyCase.id; the case the appeal contests, null when the appeal is not tied to a case
        default: null
      - name: filed_by_worker_id
        type: string
        source: computed
        description: FK -> Worker.id; the Worker whose id was the X-User-ID on the create call
      - name: grounds
        type: enum
        source: input
        description: appeal grounds
        constraints: DATA_ENTRY_ERROR | CENSUS_ERROR | VENDOR_DATA_ERROR | MEASURE_CALCULATION_ERROR
      - name: narrative
        type: string
        source: input
        description: facility explanation supporting the appeal
      - name: status
        type: enum
        source: computed
        description: decision lifecycle per state_machines.RatingAppeal
        default: SUBMITTED
        constraints: SUBMITTED | GRANTED | DENIED
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the AppealsReviewer who decided the appeal
        default: null
      - name: decision_note
        type: string
        source: computed
        description: reviewer note recorded with the decision
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: logical clock instant of the decision
        default: null
      - name: surcharge_waived_cents
        type: integer
        source: computed
        description: cents removed from the source submission's outstanding surcharge when the appeal was granted
        default: 0

state_machines:
  - entity: QuarterlySubmission
    initial_state: DRAFT
    terminal_states: [FINAL, VOID]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /submissions/{id}/validate"
        actor: StaffingCoordinator
        preconditions:
          - "submission.status == DRAFT"
          - "ReportingPeriod.status == OPEN"
          - "Facility.posture != SANCTIONED"
          - "the submission has at least one CensusDay with status IN {REPORTED, RECONCILED, DISPUTED}"
        side_effects:
          - "runs calculations.submission_hour_census_rollup and refreshes total_raw_hours, total_direct_care_hours, total_excluded_hours, total_rn_direct_care_hours, weekend_direct_care_hours, vendor_sourced_hours, total_resident_days"
          - "runs calculations.hprd_reconciliation variant as_submitted and refreshes hprd_reported and weekend_hprd_reported"
          - "creates ValidationFinding rows: code CENSUS_INCOMPLETE severity WARNING with subject_ref equal to the date, for each date in [start_date, end_date] with no CensusDay on this submission; code CENSUS_VARIANCE severity WARNING for each CensusDay with status == DISPUTED; code HPRD_IMPLAUSIBLE severity FATAL with subject_ref PERIOD when hprd_reported > MAX_PLAUSIBLE_HPRD; code MISSING_PAYROLL_SUPPORT severity WARNING for each ACTIVE HourEntry with payroll_record_id == null; code ZERO_DIRECT_CARE_DAY severity WARNING for each CensusDay whose census_date has no ACTIVE HourEntry carrying direct_care_hours > 0.00"
          - "resolves every previously OPEN ValidationFinding whose condition no longer holds by setting status RESOLVED and resolved_at"
          - "refreshes open_fatal_finding_count and open_warning_finding_count"
          - "increments QuarterlySubmission.version by 1"
        note: "validate is re-runnable from DRAFT; each run recomputes findings from scratch"
      - from: VALIDATED
        to: SUBMITTED
        trigger: "POST /submissions/{id}/submit"
        actor: FacilityAdministrator
        preconditions:
          - "submission.status == VALIDATED"
          - "open_fatal_finding_count == 0"
          - "Facility.posture == REPORTING_OPEN"
          - "the acting Worker.id != validated_by_worker_id"
          - "logical clock <= ReportingPeriod.correction_window_end"
        side_effects:
          - "sets attested_by_worker_id to the acting Worker.id"
          - "sets submitted_at to the logical clock instant"
          - "increments QuarterlySubmission.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /submissions/{id}/accept"
        actor: StateAuditor
        preconditions:
          - "submission.status == SUBMITTED"
          - "the acting X-User-ID is not equal to verified_by_user_id on any HourEntry of this submission"
        side_effects:
          - "sets accepted_by_user_id and accepted_at"
          - "runs calculations.audit_support_score variant sampled_audit and stores audit_support_score"
          - "when audit_support_score < AUDIT_RISK_FLOOR, creates a DiscrepancyCase with auto_opened true, trigger_reason AUDIT_SCORE_BELOW_FLOOR, opened_by_user_id SYSTEM, status OPEN"
          - "runs calculations.facility_posture_derivation and refreshes Facility.posture, open_case_count, substantiated_case_count"
          - "increments QuarterlySubmission.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /submissions/{id}/reject"
        actor: StateAuditor
        preconditions:
          - "submission.status == SUBMITTED"
        side_effects:
          - "sets rejection_reason and accepted_by_user_id"
          - "increments QuarterlySubmission.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /submissions/{id}/reopen"
        actor: StaffingCoordinator
        preconditions:
          - "submission.status IN {REJECTED, ACCEPTED}"
          - "ReportingPeriod.status == OPEN"
          - "logical clock <= ReportingPeriod.correction_window_end"
          - "Facility.outstanding_surcharge_cents plus the surcharge this reopen would assess <= SURCHARGE_CAP_CENTS"
        side_effects:
          - "increments amendment_index by 1"
          - "runs calculations.amendment_surcharge and adds the result to amendment_surcharge_cents"
          - "refreshes Facility.outstanding_surcharge_cents"
          - "clears validated_by_worker_id and attested_by_worker_id"
          - "increments QuarterlySubmission.version by 1"
      - from: ACCEPTED
        to: DRAFT
        trigger: "POST /submissions/{id}/reopen"
        actor: StaffingCoordinator
        preconditions:
          - "submission.status IN {REJECTED, ACCEPTED}"
          - "ReportingPeriod.status == OPEN"
          - "logical clock <= ReportingPeriod.correction_window_end"
          - "Facility.outstanding_surcharge_cents plus the surcharge this reopen would assess <= SURCHARGE_CAP_CENTS"
        side_effects:
          - "increments amendment_index by 1"
          - "runs calculations.amendment_surcharge and adds the result to amendment_surcharge_cents"
          - "refreshes Facility.outstanding_surcharge_cents"
          - "clears validated_by_worker_id and attested_by_worker_id"
          - "increments QuarterlySubmission.version by 1"
        note: "closes the cycle DRAFT -> VALIDATED -> SUBMITTED -> ACCEPTED -> DRAFT"
      - from: VALIDATED
        to: DRAFT
        trigger: "system event: any successful POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /census-days, PATCH /census-days/{id}, POST /census-days/{id}/reconcile, or POST /vendor-submissions/{id}/accept touching this submission"
        actor: system
        preconditions:
          - "submission.status == VALIDATED"
        side_effects:
          - "reverts status to DRAFT so the changed data must be re-validated"
          - "increments QuarterlySubmission.version by 1"
      - from: VALIDATED
        to: DRAFT
        trigger: "system event: Facility.posture becomes SANCTIONED via the DiscrepancyCase substantiation cascade"
        actor: system
        preconditions:
          - "submission.status == VALIDATED"
        side_effects:
          - "creates a ValidationFinding with code FACILITY_SANCTIONED severity FATAL status OPEN"
          - "refreshes open_fatal_finding_count"
          - "increments QuarterlySubmission.version by 1"
      - from: ACCEPTED
        to: FINAL
        trigger: "POST /reporting-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "submission.status == ACCEPTED"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "locks the submission against all further writes"
          - "increments QuarterlySubmission.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /reporting-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "submission.status IN {DRAFT, VALIDATED, REJECTED}"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "voids the never-accepted submission"
          - "increments QuarterlySubmission.version by 1"
      - from: VALIDATED
        to: VOID
        trigger: "POST /reporting-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "submission.status IN {DRAFT, VALIDATED, REJECTED}"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "voids the never-accepted submission"
          - "increments QuarterlySubmission.version by 1"
      - from: REJECTED
        to: VOID
        trigger: "POST /reporting-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "submission.status IN {DRAFT, VALIDATED, REJECTED}"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "voids the never-accepted submission"
          - "increments QuarterlySubmission.version by 1"

  - entity: VendorHourSubmission
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vendor-submissions/{id}/submit"
        actor: VendorRepresentative
        preconditions:
          - "batch.status IN {DRAFT, REJECTED}"
          - "StaffingVendor.status == ACTIVE"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "sets submitted_at to the logical clock instant"
          - "increments VendorHourSubmission.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vendor-submissions/{id}/accept"
        actor: StaffingCoordinator
        preconditions:
          - "batch.status == SUBMITTED"
          - "StaffingVendor.status == ACTIVE"
          - "a QuarterlySubmission exists for this facility_id and reporting_period_id with status IN {DRAFT, VALIDATED}"
        side_effects:
          - "synthesizes one HourEntry per element of lines, in lines order, with source VENDOR_SUBMISSION and vendor_submission_id set to this batch"
          - "records the created ids in accepted_hour_entry_ids and sets accepted_direct_care_hours"
          - "refreshes StaffingVendor.accepted_hours_total"
          - "runs calculations.submission_hour_census_rollup on the target QuarterlySubmission"
          - "when the target submission was VALIDATED, reverts it to DRAFT"
          - "increments VendorHourSubmission.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vendor-submissions/{id}/reject"
        actor: StaffingCoordinator
        preconditions:
          - "batch.status == SUBMITTED"
        side_effects:
          - "sets rejection_reason"
          - "increments VendorHourSubmission.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /vendor-submissions/{id}/submit"
        actor: VendorRepresentative
        preconditions:
          - "batch.status IN {DRAFT, REJECTED}"
          - "StaffingVendor.status == ACTIVE"
          - "ReportingPeriod.status == OPEN"
        side_effects:
          - "clears rejection_reason"
          - "sets submitted_at to the logical clock instant"
          - "increments VendorHourSubmission.version by 1"
        note: "closes the cycle DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /vendor-submissions/{id}/revoke"
        actor: VendorRepresentative
        preconditions:
          - "batch.status == ACCEPTED"
          - "the target QuarterlySubmission.status IN {DRAFT, VALIDATED}"
        side_effects:
          - "sets entry_status VOID on every HourEntry listed in accepted_hour_entry_ids"
          - "sets accepted_direct_care_hours to 0.00 and refreshes StaffingVendor.accepted_hours_total"
          - "runs calculations.submission_hour_census_rollup on the target QuarterlySubmission"
          - "when the target submission was VALIDATED, reverts it to DRAFT"
          - "increments VendorHourSubmission.version by 1"

  - entity: HourEntry
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /hour-entries/{id}/void"
        actor: StaffingCoordinator
        preconditions:
          - "entry.entry_status == ACTIVE"
          - "the parent QuarterlySubmission.status IN {DRAFT, VALIDATED}"
          - "logical clock <= ReportingPeriod.correction_window_end"
        side_effects:
          - "removes the entry's hours from every QuarterlySubmission rollup field via calculations.submission_hour_census_rollup"
          - "refreshes Worker.reported_hours_total"
          - "when the parent submission was VALIDATED, reverts it to DRAFT"
          - "increments QuarterlySubmission.version by 1"
        note: "entry_status is the first of two independent state dimensions on HourEntry"
      - from: UNVERIFIED
        to: SUPPORTED
        trigger: "POST /hour-entries/{id}/verify with outcome SUPPORTED"
        actor: StateAuditor
        preconditions:
          - "entry.verification_status IN {UNVERIFIED, UNSUPPORTED}"
          - "entry.entry_status == ACTIVE"
          - "entry.payroll_record_id != null"
        side_effects:
          - "sets verified_by_user_id to the acting X-User-ID"
          - "resolves any OPEN ValidationFinding with code MISSING_PAYROLL_SUPPORT whose subject_ref names this entry's work_date and no longer holds"
        note: "verification_status is the second, independent state dimension; it changes without touching entry_status"
      - from: UNVERIFIED
        to: UNSUPPORTED
        trigger: "POST /hour-entries/{id}/verify with outcome UNSUPPORTED"
        actor: StateAuditor
        preconditions:
          - "entry.verification_status IN {UNVERIFIED, UNSUPPORTED}"
          - "entry.entry_status == ACTIVE"
        side_effects:
          - "sets verified_by_user_id to the acting X-User-ID"
          - "creates a ValidationFinding with code UNSUPPORTED_HOURS severity WARNING status OPEN on the parent submission"
          - "refreshes the parent submission's open_warning_finding_count"
      - from: UNSUPPORTED
        to: SUPPORTED
        trigger: "POST /hour-entries/{id}/verify with outcome SUPPORTED"
        actor: StateAuditor
        preconditions:
          - "entry.verification_status IN {UNVERIFIED, UNSUPPORTED}"
          - "entry.entry_status == ACTIVE"
          - "entry.payroll_record_id != null"
        side_effects:
          - "sets verified_by_user_id to the acting X-User-ID"
          - "resolves the OPEN ValidationFinding with code UNSUPPORTED_HOURS raised for this entry"
          - "refreshes the parent submission's open_warning_finding_count"

  - entity: CensusDay
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: RECONCILED
        trigger: "POST /census-days/{id}/reconcile"
        actor: StaffingCoordinator
        preconditions:
          - "day.status IN {REPORTED, DISPUTED}"
          - "day.mds_resident_count != null"
          - "the parent QuarterlySubmission.status IN {DRAFT, VALIDATED}"
          - "calculations.census_variance_reconciliation yields variance_pct <= CENSUS_VARIANCE_TOLERANCE"
        side_effects:
          - "stores variance_pct"
          - "resolves any OPEN ValidationFinding with code CENSUS_VARIANCE whose subject_ref equals this census_date"
          - "when the parent submission was VALIDATED, reverts it to DRAFT"
          - "increments QuarterlySubmission.version by 1"
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /census-days/{id}/reconcile"
        actor: StaffingCoordinator
        preconditions:
          - "day.status IN {REPORTED, DISPUTED}"
          - "day.mds_resident_count != null"
          - "the parent QuarterlySubmission.status IN {DRAFT, VALIDATED}"
          - "calculations.census_variance_reconciliation yields variance_pct > CENSUS_VARIANCE_TOLERANCE"
        side_effects:
          - "stores variance_pct"
          - "creates a ValidationFinding with code CENSUS_VARIANCE severity WARNING status OPEN and subject_ref equal to census_date"
          - "when the parent submission was VALIDATED, reverts it to DRAFT"
          - "increments QuarterlySubmission.version by 1"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /census-days/{id}/reconcile"
        actor: StaffingCoordinator
        preconditions:
          - "day.status IN {REPORTED, DISPUTED}"
          - "day.mds_resident_count != null"
          - "the parent QuarterlySubmission.status IN {DRAFT, VALIDATED}"
          - "calculations.census_variance_reconciliation yields variance_pct <= CENSUS_VARIANCE_TOLERANCE"
        side_effects:
          - "stores the recomputed variance_pct"
          - "resolves the OPEN ValidationFinding with code CENSUS_VARIANCE whose subject_ref equals this census_date"
          - "when the parent submission was VALIDATED, reverts it to DRAFT"
          - "increments QuarterlySubmission.version by 1"
        note: "PATCH /census-days/{id} changes resident_count or mds_resident_count, so a DISPUTED day can be corrected and re-reconciled"

  - entity: StaffingMeasure
    initial_state: PROVISIONAL
    terminal_states: [SUPPRESSED]
    transitions:
      - from: PROVISIONAL
        to: PUBLISHED
        trigger: "POST /staffing-measures/{id}/publish"
        actor: CmsPublisher
        preconditions:
          - "measure.publication_status == PROVISIONAL"
          - "measure.audit_status IN {NOT_AUDITED, AUDIT_CONFIRMED, AUDIT_REVISED}"
          - "Facility.posture != SANCTIONED"
        side_effects:
          - "sets published_at to the logical clock instant"
          - "sets appeal_deadline to published_at plus 30 calendar days"
          - "refreshes Facility.latest_staffing_rating"
        note: "publication_status is the first of two independent state dimensions on StaffingMeasure"
      - from: PUBLISHED
        to: SUPPRESSED
        trigger: "system event: a RatingAppeal for this measure is granted via POST /rating-appeals/{id}/grant"
        actor: system
        preconditions:
          - "measure.publication_status == PUBLISHED"
        side_effects:
          - "clears Facility.latest_staffing_rating when no other PUBLISHED measure remains for the facility"
          - "sets has_open_appeal false"
      - from: NOT_AUDITED
        to: UNDER_AUDIT
        trigger: "system event: a DiscrepancyCase naming this measure moves to UNDER_REVIEW"
        actor: system
        preconditions:
          - "measure.audit_status == NOT_AUDITED"
        side_effects:
          - "freezes the measure against POST /staffing-measures recomputation for the same submission"
        note: "audit_status is the second, independent state dimension; publication_status is untouched by audit transitions"
      - from: UNDER_AUDIT
        to: AUDIT_CONFIRMED
        trigger: "system event: the DiscrepancyCase naming this measure is dismissed via POST /discrepancy-cases/{id}/dismiss"
        actor: system
        preconditions:
          - "measure.audit_status == UNDER_AUDIT"
        side_effects:
          - "leaves measure_variant, total_nurse_hprd, rn_hprd, and staffing_rating unchanged"
      - from: UNDER_AUDIT
        to: AUDIT_REVISED
        trigger: "system event: the DiscrepancyCase naming this measure is substantiated via POST /discrepancy-cases/{id}/substantiate"
        actor: system
        preconditions:
          - "measure.audit_status == UNDER_AUDIT"
        side_effects:
          - "sets measure_variant to AUDIT_ADJUSTED"
          - "recomputes total_nurse_hprd, rn_hprd, weekend_total_nurse_hprd via calculations.hprd_reconciliation variant audit_adjusted"
          - "recomputes total_nurse_points, rn_points, days_with_zero_rn_hours, staffing_rating via calculations.staffing_rating_assignment"
          - "refreshes Facility.latest_staffing_rating when publication_status == PUBLISHED"

  - entity: DiscrepancyCase
    initial_state: OPEN
    terminal_states: [DISMISSED, OVERTURNED]
    transitions:
      - from: OPEN
        to: INFO_REQUESTED
        trigger: "POST /discrepancy-cases/{id}/request-info"
        actor: StateAuditor
        preconditions:
          - "case.status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "increments info_request_count by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /discrepancy-cases/{id}/respond"
        actor: FacilityAdministrator
        preconditions:
          - "case.status == INFO_REQUESTED"
          - "the acting Worker.facility_id == case.facility_id"
        side_effects:
          - "increments facility_response_count by 1"
          - "when staffing_measure_id != null and that measure's audit_status == NOT_AUDITED, moves the measure to UNDER_AUDIT"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /discrepancy-cases/{id}/request-info"
        actor: StateAuditor
        preconditions:
          - "case.status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "increments info_request_count by 1"
        note: "closes the cycle INFO_REQUESTED -> UNDER_REVIEW -> INFO_REQUESTED for iterative evidence rounds"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /discrepancy-cases/{id}/substantiate"
        actor: StateAuditor
        preconditions:
          - "case.status IN {INFO_REQUESTED, UNDER_REVIEW}"
          - "facility_response_count >= 1"
        side_effects:
          - "sets substantiated_by_user_id and resolution_note"
          - "when staffing_measure_id != null, moves that measure's audit_status UNDER_AUDIT -> AUDIT_REVISED with its audit_adjusted recompute cascade"
          - "runs calculations.facility_posture_derivation, setting Facility.posture SANCTIONED and refreshing substantiated_case_count and open_case_count"
          - "reverts every VALIDATED QuarterlySubmission of this facility to DRAFT with a FATAL FACILITY_SANCTIONED ValidationFinding"
      - from: INFO_REQUESTED
        to: SUBSTANTIATED
        trigger: "POST /discrepancy-cases/{id}/substantiate"
        actor: StateAuditor
        preconditions:
          - "case.status IN {INFO_REQUESTED, UNDER_REVIEW}"
          - "facility_response_count >= 1"
        side_effects:
          - "sets substantiated_by_user_id and resolution_note"
          - "when staffing_measure_id != null, moves that measure's audit_status UNDER_AUDIT -> AUDIT_REVISED with its audit_adjusted recompute cascade"
          - "runs calculations.facility_posture_derivation, setting Facility.posture SANCTIONED and refreshing substantiated_case_count and open_case_count"
          - "reverts every VALIDATED QuarterlySubmission of this facility to DRAFT with a FATAL FACILITY_SANCTIONED ValidationFinding"
        note: "a further evidence round may be requested after a response; substantiation is still permitted from INFO_REQUESTED as long as the facility has already been heard once, which is exactly what validation priority 35 enforces"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /discrepancy-cases/{id}/dismiss"
        actor: StateAuditor
        preconditions:
          - "case.status == UNDER_REVIEW"
        side_effects:
          - "sets resolution_note"
          - "when staffing_measure_id != null, moves that measure's audit_status UNDER_AUDIT -> AUDIT_CONFIRMED"
          - "runs calculations.facility_posture_derivation and refreshes Facility.posture and open_case_count"
      - from: SUBSTANTIATED
        to: OVERTURNED
        trigger: "system event: a RatingAppeal contesting this case is granted via POST /rating-appeals/{id}/grant"
        actor: system
        preconditions:
          - "case.status == SUBSTANTIATED"
        side_effects:
          - "sets resolution_note to the appeal decision_note"
          - "runs calculations.facility_posture_derivation, which clears SANCTIONED when no other SUBSTANTIATED case remains"

  - entity: RatingAppeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /rating-appeals/{id}/grant"
        actor: AppealsReviewer
        preconditions:
          - "appeal.status == SUBMITTED"
          - "the appealed StaffingMeasure.publication_status == PUBLISHED"
        side_effects:
          - "sets decided_by_user_id, decision_note, decided_at"
          - "moves the appealed StaffingMeasure PUBLISHED -> SUPPRESSED"
          - "when discrepancy_case_id != null and that case's status == SUBSTANTIATED, moves the case SUBSTANTIATED -> OVERTURNED and re-derives Facility.posture"
          - "sets surcharge_waived_cents to the source submission's (amendment_surcharge_cents - waived_surcharge_cents), adds it to that submission's waived_surcharge_cents, and refreshes Facility.outstanding_surcharge_cents"
          - "sets the measure's has_open_appeal false"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rating-appeals/{id}/deny"
        actor: AppealsReviewer
        preconditions:
          - "appeal.status == SUBMITTED"
          - "the appealed StaffingMeasure.publication_status == PUBLISHED"
        side_effects:
          - "sets decided_by_user_id, decision_note, decided_at"
          - "leaves the measure's publication_status, staffing_rating, the contested case's status, and the submission's surcharge fields unchanged"
          - "sets the measure's has_open_appeal false"
        note: "branching with divergent side-effect sets: GRANTED suppresses, overturns, and waives; DENIED changes nothing beyond the decision fields"

  - entity: Facility
    initial_state: REPORTING_OPEN
    terminal_states: []
    transitions:
      - from: REPORTING_OPEN
        to: AUDIT_HOLD
        trigger: "system event: calculations.facility_posture_derivation re-runs after a DiscrepancyCase for this facility enters status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW}"
        actor: system
        preconditions:
          - "the facility has no DiscrepancyCase with status == SUBSTANTIATED"
        side_effects:
          - "refreshes open_case_count"
          - "blocks POST /submissions/{id}/submit for this facility with ERR_FACILITY_UNDER_HOLD"
      - from: AUDIT_HOLD
        to: SANCTIONED
        trigger: "system event: a DiscrepancyCase for this facility moves to SUBSTANTIATED"
        actor: system
        preconditions:
          - "the facility has at least one DiscrepancyCase with status == SUBSTANTIATED"
        side_effects:
          - "refreshes substantiated_case_count"
          - "reverts every VALIDATED QuarterlySubmission of this facility to DRAFT with a FATAL FACILITY_SANCTIONED ValidationFinding"
          - "blocks POST /submissions/{id}/validate for this facility with ERR_FACILITY_SANCTIONED"
      - from: SANCTIONED
        to: AUDIT_HOLD
        trigger: "system event: the last SUBSTANTIATED DiscrepancyCase moves to OVERTURNED while at least one case remains in status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW}"
        actor: system
        preconditions:
          - "substantiated_case_count becomes 0"
          - "open_case_count >= 1"
        side_effects:
          - "refreshes substantiated_case_count and open_case_count"
      - from: SANCTIONED
        to: REPORTING_OPEN
        trigger: "system event: the last SUBSTANTIATED DiscrepancyCase moves to OVERTURNED and no case remains in status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW}"
        actor: system
        preconditions:
          - "substantiated_case_count becomes 0"
          - "open_case_count == 0"
        side_effects:
          - "refreshes substantiated_case_count and open_case_count"
      - from: AUDIT_HOLD
        to: REPORTING_OPEN
        trigger: "system event: the last DiscrepancyCase in status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW} is dismissed"
        actor: system
        preconditions:
          - "open_case_count becomes 0"
          - "substantiated_case_count == 0"
        side_effects:
          - "refreshes open_case_count"

concurrency_rules:
  - rule_id: hour-entry-create-stale-submission
    parent_entity: QuarterlySubmission
    write_endpoint: "POST /hour-entries"
    occ_field: "expected_submission_version"
    description: |
      Creating an HourEntry against a QuarterlySubmission whose version has advanced
      past the value the client last observed is rejected. A new entry legitimately
      changes the submission's rollup totals, hprd_reported, and validation posture,
      so a writer holding a stale view of the submission would append hours on top of
      a rollup it never saw; the stale-version check rejects that write.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
  - rule_id: allocation-replace-stale-submission
    parent_entity: QuarterlySubmission
    write_endpoint: "PUT /hour-entries/{id}/allocations"
    occ_field: "expected_submission_version"
    description: |
      Replacing an HourEntry's split-role allocation set is a full re-statement of that
      entry's direct-care credit, which rewrites the parent submission's rollup fields.
      When the submission's version has advanced past the value the client last observed,
      the replacement is computed against a rollup the client never saw and is rejected.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
  - rule_id: appeal-create-stale-measure
    parent_entity: StaffingMeasure
    write_endpoint: "POST /rating-appeals"
    occ_field: "expected_measure_version"
    description: |
      Filing a RatingAppeal against a StaffingMeasure whose version has advanced past
      the value the client last observed is rejected. An audit revision can rewrite
      staffing_rating in place, so an appeal filed on a stale view would contest a
      rating that no longer exists; the stale-version check rejects it.
    error_id: ERR_STALE_MEASURE_VERSION
    http_status: 412

calculations:
  - name: hour_entry_classification
    trigger: "on POST /hour-entries, on PUT /hour-entries/{id}/allocations, and on each HourEntry synthesized by POST /vendor-submissions/{id}/accept"
    algorithm: waterfall_allocation
    formula: |
      minutes = (hour(shift_end)*60 + minute(shift_end)) - (hour(shift_start)*60 + minute(shift_start))
      raw_hours = round_half_up(minutes / 60, 2)

      # allocation lines are processed in the exact order supplied in the request's
      # allocations array (index 0 first); the array order is the pinned processing order
      # and no re-sorting is performed.
      for each allocation line i in allocations, in array order:
          category_i = JobCategory with id == allocations[i].job_category_id
          credit_i   = category_i.direct_care_credit_pct
          # ROUNDING ORDER IS PINNED: each line is rounded to 2 decimals BEFORE summing.
          # Summing unrounded line values and rounding once at the end is a DIFFERENT,
          # incorrect result (e.g. raw_hours 7.50 with percents 45.00/27.50/27.50 and
          # credits 1.00/0.60/0.00 gives 4.62 per-line-then-sum, 4.61 sum-then-round).
          line_direct_i = round_half_up(raw_hours * (allocations[i].percent / 100) * credit_i, 2)

      direct_care_hours = sum over i of line_direct_i
      excluded_hours    = round_half_up(raw_hours - direct_care_hours, 2)
      rn_hours          = sum of line_direct_i over lines whose category_i.nurse_group == RN
      lpn_hours         = sum of line_direct_i over lines whose category_i.nurse_group == LPN
      na_hours          = sum of line_direct_i over lines whose category_i.nurse_group == NA
      is_weekend        = day_of_week(work_date) IN {SATURDAY, SUNDAY}
    input_set: "the allocation lines of the single HourEntry being written, each resolved against its JobCategory row; JobCategory rows are configuration and are read at write time"
    constants:
      MINUTES_PER_HOUR: 60
      ALLOCATION_PERCENT_TOTAL: 100.00
      MAX_SHIFT_HOURS: 16.00
      MAX_HOURS_PER_DAY: 24.00
      MAX_REPORTED_HOURS_PER_WORKER_DAY: 20.00
    precision: "raw_hours, direct_care_hours, excluded_hours, rn_hours, lpn_hours, na_hours: 2 decimal places, round_half_up; each allocation line is rounded to 2 decimal places before the sum"

  - name: submission_hour_census_rollup
    trigger: "on POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /census-days, PATCH /census-days/{id}, POST /census-days/{id}/reconcile, POST /vendor-submissions/{id}/accept, POST /vendor-submissions/{id}/revoke, and POST /submissions/{id}/validate"
    algorithm: aggregation
    formula: |
      E = HourEntry rows with submission_id == submission.id AND entry_status == ACTIVE
      C = CensusDay rows with submission_id == submission.id AND status IN {REPORTED, RECONCILED, DISPUTED}

      total_raw_hours             = round_half_up(sum of e.raw_hours for e in E, 2)
      total_direct_care_hours     = round_half_up(sum of e.direct_care_hours for e in E, 2)
      total_excluded_hours        = round_half_up(sum of e.excluded_hours for e in E, 2)
      total_rn_direct_care_hours  = round_half_up(sum of e.rn_hours for e in E, 2)
      weekend_direct_care_hours   = round_half_up(sum of e.direct_care_hours for e in E where e.is_weekend == true, 2)
      vendor_sourced_hours        = round_half_up(sum of e.direct_care_hours for e in E where e.source == VENDOR_SUBMISSION, 2)
      total_resident_days         = sum of c.resident_count for c in C
      weekend_resident_days       = sum of c.resident_count for c in C where c.is_weekend == true

      weekend_hprd_reported = null if weekend_resident_days == 0
                              else round_half_up(weekend_direct_care_hours / weekend_resident_days, 4)

      # Worker.reported_hours_total is refreshed for every Worker referenced by E:
      Worker.reported_hours_total = round_half_up(sum of e.raw_hours for e in E with e.worker_id == worker.id, 2)
    input_set: "ACTIVE HourEntry rows of the submission (VOID entries are excluded from every hour field); CensusDay rows of the submission in any of REPORTED, RECONCILED, DISPUTED (all three count toward resident days)"
    constants: {}
    precision: "hour fields 2 decimal places, round_half_up; weekend_hprd_reported 4 decimal places, round_half_up; total_resident_days is an exact integer sum"

  - name: hprd_reconciliation
    trigger: "on POST /submissions/{id}/validate (variant as_submitted), on GET /submissions/{id}/hprd (variant selected by the variant input), on POST /staffing-measures (variant as_submitted), and on the AUDIT_REVISED cascade of POST /discrepancy-cases/{id}/substantiate (variant audit_adjusted)"
    algorithm: threshold
    formula: |
      # variant-dependent numerator set N and denominator set D — see variants below.
      total_direct = round_half_up(sum of e.direct_care_hours for e in N, 2)
      total_rn     = round_half_up(sum of e.rn_hours for e in N, 2)
      weekend_direct = round_half_up(sum of e.direct_care_hours for e in N where e.is_weekend == true, 2)

      resident_days         = sum of d.counted_residents for d in D
      weekend_resident_days = sum of d.counted_residents for d in D where d.is_weekend == true

      total_nurse_hprd          = null if resident_days == 0 else round_half_up(total_direct / resident_days, 4)
      rn_hprd                   = null if resident_days == 0 else round_half_up(total_rn / resident_days, 4)
      weekend_total_nurse_hprd  = null if weekend_resident_days == 0 else round_half_up(weekend_direct / weekend_resident_days, 4)

      implausible = (total_nurse_hprd != null AND total_nurse_hprd > MAX_PLAUSIBLE_HPRD)
    input_set: "HourEntry rows of the submission with entry_status == ACTIVE, further filtered by variant; CensusDay rows of the submission with status IN {REPORTED, RECONCILED, DISPUTED}, with counted_residents chosen by variant"
    constants:
      MAX_PLAUSIBLE_HPRD: 12.0000
    precision: "4 decimal places, round_half_up; the hour sums that feed the division are each rounded to 2 decimal places first"
    variants:
      - name: as_submitted
        when: "computing hprd_reported on validate, computing a StaffingMeasure at POST /staffing-measures, and GET /submissions/{id}/hprd with variant omitted or AS_SUBMITTED"
        difference: "N = every ACTIVE HourEntry regardless of verification_status; D.counted_residents = CensusDay.resident_count (the facility-reported count) for every included day"
      - name: audit_adjusted
        when: "recomputing a StaffingMeasure during the AUDIT_REVISED cascade, and GET /submissions/{id}/hprd with variant AUDIT_ADJUSTED"
        difference: "N = only ACTIVE HourEntry rows with verification_status == SUPPORTED (unverified and unsupported hours are dropped); D.counted_residents = CensusDay.mds_resident_count when it is non-null, else CensusDay.resident_count"

  - name: census_variance_reconciliation
    trigger: "on POST /census-days/{id}/reconcile and on PATCH /census-days/{id} when mds_resident_count is present"
    algorithm: threshold
    formula: |
      if mds_resident_count == null:
          variance_pct = null                       # reconcile is rejected with ERR_MDS_COUNT_MISSING
      elif mds_resident_count == 0:
          variance_pct = 0.0000 if resident_count == 0 else 1.0000
      else:
          variance_pct = round_half_up(abs(resident_count - mds_resident_count) / mds_resident_count, 4)

      # strict comparison at the tolerance: exactly at tolerance reconciles.
      outcome = RECONCILED if variance_pct <= CENSUS_VARIANCE_TOLERANCE else DISPUTED
    input_set: "the single CensusDay row being reconciled; resident_count and mds_resident_count as currently stored"
    constants:
      CENSUS_VARIANCE_TOLERANCE: 0.0500
    precision: "variance_pct 4 decimal places, round_half_up; the comparison uses the rounded variance_pct, so resident_count 105 against mds_resident_count 100 yields exactly 0.0500 and RECONCILES, while 106 against 100 yields 0.0600 and DISPUTES"

  - name: staffing_rating_assignment
    trigger: "on POST /staffing-measures and on the AUDIT_REVISED recompute cascade of POST /discrepancy-cases/{id}/substantiate"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — two independent tier lookups over the two hprd metrics.
      total_nurse_points = 5 if total_nurse_hprd >= TOTAL_TIER_5 else
                           4 if total_nurse_hprd >= TOTAL_TIER_4 else
                           3 if total_nurse_hprd >= TOTAL_TIER_3 else
                           2 if total_nurse_hprd >= TOTAL_TIER_2 else 1
      rn_points          = 5 if rn_hprd >= RN_TIER_5 else
                           4 if rn_hprd >= RN_TIER_4 else
                           3 if rn_hprd >= RN_TIER_3 else
                           2 if rn_hprd >= RN_TIER_2 else 1
      # a null hprd (no resident days) scores 1 point on that dimension.

      # Step 2 — combine: the weaker of the two dimensions governs.
      base_star = min(total_nurse_points, rn_points)

      # Step 3 — weekend staffing floor, applied to the combined star, not to either tier.
      star = max(1, base_star - 1) if (weekend_total_nurse_hprd == null OR
                                       weekend_total_nurse_hprd < WEEKEND_HPRD_FLOOR)
             else base_star

      # Step 4 — zero-RN-day override, applied last and unconditionally.
      days_with_zero_rn_hours = count of CensusDay rows of the source submission
                                (status IN {REPORTED, RECONCILED, DISPUTED}) whose census_date
                                has no ACTIVE HourEntry of the submission with rn_hours > 0.00
      staffing_rating = 1 if days_with_zero_rn_hours >= ZERO_RN_DAY_LIMIT else star
    input_set: "the total_nurse_hprd, rn_hprd, and weekend_total_nurse_hprd already computed by calculations.hprd_reconciliation under the measure's active measure_variant, plus the source submission's CensusDay rows and ACTIVE HourEntry rows for the zero-RN-day count"
    constants:
      TOTAL_TIER_5: 3.6000
      TOTAL_TIER_4: 3.0000
      TOTAL_TIER_3: 2.4000
      TOTAL_TIER_2: 1.8000
      RN_TIER_5: 0.7500
      RN_TIER_4: 0.5500
      RN_TIER_3: 0.3500
      RN_TIER_2: 0.2000
      WEEKEND_HPRD_FLOOR: 2.4000
      ZERO_RN_DAY_LIMIT: 4
    precision: "all comparisons use the 4-decimal round_half_up hprd values; every tier boundary is inclusive (>=), and the weekend floor is exclusive (< downgrades, == does not)"

  - name: audit_support_score
    trigger: "on POST /submissions/{id}/accept (variant sampled_audit) and on GET /facilities/{id}/audit-readiness (variant selected by the variant input)"
    algorithm: weighted_scoring
    formula: |
      # S = the considered entry set, chosen by variant (see variants below).
      considered_hours = round_half_up(sum of e.direct_care_hours for e in S, 2)
      supported_hours  = round_half_up(sum of e.direct_care_hours for e in S
                                       where e.verification_status == SUPPORTED, 2)
      support_ratio = 1.0000 if considered_hours == 0.00
                      else round_half_up(supported_hours / considered_hours, 4)

      V = entries in S with source == VENDOR_SUBMISSION
      V_ok = entries in V whose VendorHourSubmission.status == ACCEPTED
      vendor_attestation_ratio = 1.0000 if count(V) == 0
                                 else round_half_up(count(V_ok) / count(V), 4)

      C = CensusDay rows of the submission with status IN {REPORTED, RECONCILED, DISPUTED}
      census_reconciled_ratio = 0.0000 if count(C) == 0
                                else round_half_up(count of c in C with c.status == RECONCILED / count(C), 4)

      # each ratio is rounded to 4 decimals BEFORE weighting; the weighted sum is rounded once.
      score = round_half_up(100 * (W_SUPPORT * support_ratio
                                   + W_VENDOR * vendor_attestation_ratio
                                   + W_CENSUS * census_reconciled_ratio), 2)
      at_risk = score < AUDIT_RISK_FLOOR
    input_set: "HourEntry rows of the submission with entry_status == ACTIVE, narrowed by variant; CensusDay rows of the submission in REPORTED, RECONCILED, or DISPUTED"
    constants:
      W_SUPPORT: 0.50
      W_VENDOR: 0.30
      W_CENSUS: 0.20
      SAMPLE_SIZE: 5
      AUDIT_RISK_FLOOR: 70.00
    precision: "ratios 4 decimal places round_half_up, score 2 decimal places round_half_up; at_risk uses a strict < against AUDIT_RISK_FLOOR so a score of exactly 70.00 is not at risk"
    variants:
      - name: sampled_audit
        when: "on POST /submissions/{id}/accept, and on GET /facilities/{id}/audit-readiness with variant omitted or SAMPLED"
        difference: "S = the first SAMPLE_SIZE ACTIVE HourEntry rows of the submission ordered by work_date ASC, then created_at ASC as the tie-break; when the submission has fewer than SAMPLE_SIZE ACTIVE entries, S is all of them"
      - name: full_population
        when: "on GET /facilities/{id}/audit-readiness with variant FULL"
        difference: "S = every ACTIVE HourEntry row of the submission, with no sample truncation and therefore no ordering dependence"

  - name: amendment_surcharge
    trigger: "on POST /submissions/{id}/reopen, evaluated before the status change is applied"
    algorithm: tiered_pricing
    formula: |
      amendment_index_after = submission.amendment_index + 1

      base_fee_cents = 0 if submission.status == REJECTED
                       else BASE_AMENDMENT_FEE_CENTS
                            + ESCALATION_STEP_CENTS * (amendment_index_after - 1)

      seconds_late = (logical_clock - ReportingPeriod.submission_deadline) in whole seconds
      late_days = 0 if seconds_late <= 0 else ceil(seconds_late / SECONDS_PER_DAY)

      # EVALUATION ORDER IS PINNED. The late-rate tier is keyed on base_fee_cents, i.e. the
      # tier is fixed BEFORE late_fee_cents is added. The resulting surcharge_cents may
      # therefore land in a higher tier band than the rate that was applied to it; reading
      # the tier off the final total is a DIFFERENT, incorrect result (base 25000 with
      # 6 late days yields 28000 under the pinned order, 29500 under the total-keyed reading).
      late_rate = LATE_RATE_TIER_HIGH if base_fee_cents >= TIER_HIGH_FLOOR_CENTS else
                  LATE_RATE_TIER_MID  if base_fee_cents >= TIER_MID_FLOOR_CENTS  else
                  LATE_RATE_TIER_LOW  if base_fee_cents >= 1 else
                  LATE_RATE_TIER_ZERO

      late_fee_cents  = round_half_up(base_fee_cents * late_rate * late_days, 0)
      surcharge_cents = base_fee_cents + late_fee_cents

      # cap check runs against the facility-wide outstanding balance, not this fee alone
      if Facility.outstanding_surcharge_cents + surcharge_cents > SURCHARGE_CAP_CENTS:
          reject with ERR_SURCHARGE_CAP_EXCEEDED and apply no state change
      else:
          submission.amendment_surcharge_cents += surcharge_cents
          submission.amendment_index = amendment_index_after
    input_set: "the single QuarterlySubmission being reopened, its ReportingPeriod.submission_deadline, the logical clock, and the owning Facility.outstanding_surcharge_cents"
    constants:
      BASE_AMENDMENT_FEE_CENTS: 25000
      ESCALATION_STEP_CENTS: 2500
      TIER_HIGH_FLOOR_CENTS: 27500
      TIER_MID_FLOOR_CENTS: 25000
      LATE_RATE_TIER_HIGH: 0.0300
      LATE_RATE_TIER_MID: 0.0200
      LATE_RATE_TIER_LOW: 0.0100
      LATE_RATE_TIER_ZERO: 0.0000
      SECONDS_PER_DAY: 86400
      SURCHARGE_CAP_CENTS: 50000
    precision: "cents are integers; late_fee_cents is rounded to 0 decimal places with round_half_up; late_days is a ceiling over whole seconds, so any fraction of a day past the deadline counts as a full late day"

  - name: facility_posture_derivation
    trigger: "on every DiscrepancyCase status change (POST /discrepancy-cases, /request-info, /respond, /substantiate, /dismiss, and the OVERTURNED cascade of POST /rating-appeals/{id}/grant) and on POST /submissions/{id}/accept when the acceptance cascade opens a case"
    algorithm: constraint_propagation
    formula: |
      cases = DiscrepancyCase rows with facility_id == facility.id
      substantiated_case_count = count of c in cases with c.status == SUBSTANTIATED
      open_case_count          = count of c in cases with c.status IN {OPEN, INFO_REQUESTED, UNDER_REVIEW}

      posture = SANCTIONED     if substantiated_case_count >= 1
                AUDIT_HOLD     elif open_case_count >= 1
                REPORTING_OPEN else

      outstanding_surcharge_cents = sum over QuarterlySubmission rows with
          facility_id == facility.id AND status != VOID of
          (amendment_surcharge_cents - waived_surcharge_cents)

      latest_staffing_rating = staffing_rating of the StaffingMeasure with facility_id == facility.id
          AND publication_status == PUBLISHED, ranked by published_at DESC then created_at DESC;
          null when that candidate set is empty
    input_set: "all DiscrepancyCase rows of the facility in any status, all non-VOID QuarterlySubmission rows of the facility, and all StaffingMeasure rows of the facility with publication_status == PUBLISHED"
    constants: {}
    precision: "counts and cents are exact integers; the posture ladder is evaluated top to bottom so SUBSTANTIATED dominates any number of open cases"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for a role whose identity is entity_backed, X-User-ID equals the id of an existing row of that backing entity"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints called as StaffingCoordinator, FacilityAdministrator, or VendorRepresentative"
  - priority: 5
    category: auth
    check: "the acting Worker.authorized_roles array contains the acting role name (STAFFING_COORDINATOR or FACILITY_ADMINISTRATOR)"
    error_id: ERR_WORKER_ROLE_NOT_AUTHORIZED
    http_status: 403
    applies_to: "all endpoints called as StaffingCoordinator or FacilityAdministrator"
  - priority: 6
    category: auth
    check: "the acting Worker.status == ACTIVE"
    error_id: ERR_ACTOR_INACTIVE
    http_status: 403
    applies_to: "all endpoints called as StaffingCoordinator or FacilityAdministrator"
  - priority: 7
    category: auth
    check: "the acting Worker.facility_id equals the facility_id of the target resource (or of the target resource's parent submission)"
    error_id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all write endpoints called as StaffingCoordinator or FacilityAdministrator"
  - priority: 8
    category: auth
    check: "for VendorRepresentative, X-User-ID equals the vendor_id of the target VendorHourSubmission or the vendor_id in the request body"
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /vendor-submissions, POST /vendor-submissions/{id}/submit, POST /vendor-submissions/{id}/revoke"
  - priority: 9
    category: auth
    check: "segregation of duties on attestation: the acting Worker.id must not equal the submission's validated_by_worker_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /submissions/{id}/submit"
  - priority: 10
    category: auth
    check: "segregation of duties on acceptance: the acting X-User-ID must not equal verified_by_user_id on any HourEntry of the submission"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /submissions/{id}/accept"
  - priority: 11
    category: existence
    check: "every id in the request path resolves to an existing row, validated left to right"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_REPORTING_PERIOD_NOT_FOUND | ERR_JOB_CATEGORY_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_VENDOR_SUBMISSION_NOT_FOUND | ERR_PAYROLL_RECORD_NOT_FOUND | ERR_HOUR_ENTRY_NOT_FOUND | ERR_CENSUS_DAY_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 12
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row, including every allocations[].job_category_id and every lines[].worker_id / lines[].job_category_id of a vendor batch"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_REPORTING_PERIOD_NOT_FOUND | ERR_JOB_CATEGORY_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PAYROLL_RECORD_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints with foreign-key body fields"
  - priority: 13
    category: business_constraint
    check: "all required body fields for the endpoint are present and of the declared type"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 14
    category: business_constraint
    check: "every enum-typed body field carries a value declared in that field's constraints"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all write endpoints with enum body fields"
  - priority: 15
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 16
    category: business_constraint
    check: "date fields match YYYY-MM-DD, time-of-day fields match HH:MM in 24-hour form, and datetime fields are ISO 8601 UTC"
    error_id: ERR_INVALID_DATE_FORMAT
    http_status: 422
    applies_to: "all write endpoints with date, time, or datetime fields"
  - priority: 17
    category: state
    check: "the governing ReportingPeriod.status == OPEN"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /submissions, POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /census-days, PATCH /census-days/{id}, POST /census-days/{id}/reconcile, POST /submissions/{id}/validate, /submit, /accept, /reject, /reopen, POST /vendor-submissions/{id}/submit, /accept, /revoke"
  - priority: 18
    category: state
    check: "the target QuarterlySubmission.status is in the from-set the requested operation declares (DRAFT for hour and census writes and validate; VALIDATED for submit; SUBMITTED for accept and reject; ACCEPTED or REJECTED for reopen; ACCEPTED for POST /staffing-measures); the check also covers DRAFT plus VALIDATED for hour and census writes"
    error_id: ERR_SUBMISSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /census-days, PATCH /census-days/{id}, POST /census-days/{id}/reconcile, POST /submissions/{id}/validate, /submit, /accept, /reject, /reopen, POST /submissions/{id}/findings/{finding_id}/waive, POST /vendor-submissions/{id}/accept, /revoke, POST /staffing-measures"
  - priority: 19
    category: state
    check: "the target HourEntry.entry_status == ACTIVE"
    error_id: ERR_HOUR_ENTRY_VOIDED
    http_status: 409
    applies_to: "PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /hour-entries/{id}/verify"
  - priority: 20
    category: state
    check: "the target HourEntry.payroll_record_id != null when the verify outcome is SUPPORTED"
    error_id: ERR_SUPPORT_DOCUMENT_MISSING
    http_status: 409
    applies_to: "POST /hour-entries/{id}/verify"
  - priority: 21
    category: state
    check: "the target VendorHourSubmission.status is in the from-set the requested operation declares (DRAFT or REJECTED for submit; SUBMITTED for accept and reject; ACCEPTED for revoke)"
    error_id: ERR_VENDOR_SUBMISSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /vendor-submissions/{id}/submit, /accept, /reject, /revoke"
  - priority: 22
    category: state
    check: "the governing StaffingVendor.status == ACTIVE"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /vendor-submissions, POST /vendor-submissions/{id}/submit, POST /vendor-submissions/{id}/accept"
  - priority: 23
    category: state
    check: "the target CensusDay.mds_resident_count != null"
    error_id: ERR_MDS_COUNT_MISSING
    http_status: 409
    applies_to: "POST /census-days/{id}/reconcile"
  - priority: 24
    category: state
    check: "the referenced StaffingMeasure.publication_status == PUBLISHED"
    error_id: ERR_MEASURE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /rating-appeals, POST /rating-appeals/{id}/grant, POST /rating-appeals/{id}/deny"
  - priority: 25
    category: state
    check: "no existing StaffingMeasure for this submission has audit_status == UNDER_AUDIT"
    error_id: ERR_MEASURE_UNDER_AUDIT
    http_status: 409
    applies_to: "POST /staffing-measures, POST /staffing-measures/{id}/publish"
  - priority: 26
    category: state
    check: "the target DiscrepancyCase.status is in the from-set the requested operation declares (OPEN or UNDER_REVIEW for request-info; INFO_REQUESTED for respond; INFO_REQUESTED or UNDER_REVIEW for substantiate; UNDER_REVIEW for dismiss)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /discrepancy-cases/{id}/request-info, /respond, /substantiate, /dismiss"
  - priority: 27
    category: state
    check: "the target RatingAppeal.status == SUBMITTED"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /rating-appeals/{id}/grant, POST /rating-appeals/{id}/deny"
  - priority: 28
    category: state
    check: "the submission has at least one CensusDay with status IN {REPORTED, RECONCILED, DISPUTED}"
    error_id: ERR_NO_CENSUS_DATA
    http_status: 409
    applies_to: "POST /submissions/{id}/validate, POST /staffing-measures"
  - priority: 29
    category: state
    check: "the target ValidationFinding.status == OPEN"
    error_id: ERR_FINDING_NOT_OPEN
    http_status: 409
    applies_to: "POST /submissions/{id}/findings/{finding_id}/waive"
  - priority: 30
    category: state
    check: "expected_submission_version in the request body equals the current QuarterlySubmission.version"
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
    applies_to: "POST /hour-entries, PUT /hour-entries/{id}/allocations"
  - priority: 31
    category: state
    check: "expected_measure_version in the request body equals the current StaffingMeasure.version"
    error_id: ERR_STALE_MEASURE_VERSION
    http_status: 412
    applies_to: "POST /rating-appeals"
  - priority: 32
    category: business_safety
    check: "the owning Facility.posture != SANCTIONED"
    error_id: ERR_FACILITY_SANCTIONED
    http_status: 409
    applies_to: "POST /submissions/{id}/validate, POST /staffing-measures/{id}/publish"
  - priority: 33
    category: business_safety
    check: "the owning Facility.posture == REPORTING_OPEN"
    error_id: ERR_FACILITY_UNDER_HOLD
    http_status: 409
    applies_to: "POST /submissions/{id}/submit"
  - priority: 34
    category: business_safety
    check: "the submission's open_fatal_finding_count == 0"
    error_id: ERR_FATAL_FINDINGS_OPEN
    http_status: 409
    applies_to: "POST /submissions/{id}/submit"
  - priority: 35
    category: business_safety
    check: "the target DiscrepancyCase.facility_response_count >= 1 so the facility has been heard before substantiation"
    error_id: ERR_CASE_RESPONSE_REQUIRED
    http_status: 409
    applies_to: "POST /discrepancy-cases/{id}/substantiate"
  - priority: 36
    category: business_temporal
    check: "work_date falls within the submission's ReportingPeriod [start_date, end_date] inclusive"
    error_id: ERR_WORK_DATE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 37
    category: business_temporal
    check: "work_date >= the referenced Worker.hire_date"
    error_id: ERR_WORK_DATE_BEFORE_HIRE
    http_status: 422
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 38
    category: business_temporal
    check: "shift_end is strictly later than shift_start on the same work_date"
    error_id: ERR_SHIFT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /hour-entries, POST /vendor-submissions"
  - priority: 39
    category: business_temporal
    check: "the new shift's half-open interval [shift_start, shift_end) must not intersect the half-open interval of any other ACTIVE HourEntry for the same worker_id on the same work_date; touching endpoints (previous end == new start) do not intersect and are allowed"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 40
    category: business_temporal
    check: "the new ReportingPeriod's closed-inclusive [start_date, end_date] interval must not intersect the closed-inclusive interval of any existing ReportingPeriod with the same state_code; sharing a single boundary date is an intersection and is rejected"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /reporting-periods"
  - priority: 41
    category: business_temporal
    check: "aggregate payroll capacity: over the PayrollRecord rows of the same worker_id whose closed-inclusive [pay_period_start, pay_period_end] interval intersects the new record's interval, the sum of paid_hours plus the new paid_hours must not exceed MAX_HOURS_PER_DAY multiplied by the number of distinct calendar days in the union of those intersecting intervals"
    error_id: ERR_PAYROLL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /payroll-records"
  - priority: 42
    category: business_temporal
    check: "the logical clock is at or before the submission's correction_deadline"
    error_id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /hour-entries/{id}/void, POST /census-days, PATCH /census-days/{id}, POST /census-days/{id}/reconcile, POST /submissions/{id}/submit, POST /submissions/{id}/reopen"
  - priority: 43
    category: business_temporal
    check: "the logical clock is at or before the referenced StaffingMeasure.appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rating-appeals"
  - priority: 44
    category: business_referential
    check: "the referenced Worker.facility_id equals the target submission's facility_id"
    error_id: ERR_WORKER_FACILITY_MISMATCH
    http_status: 422
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 45
    category: business_referential
    check: "for every line of a vendor batch, the referenced Worker.worker_type == AGENCY_CONTRACTOR and Worker.vendor_id equals the batch's vendor_id"
    error_id: ERR_VENDOR_WORKER_MISMATCH
    http_status: 422
    applies_to: "POST /vendor-submissions, POST /vendor-submissions/{id}/accept"
  - priority: 46
    category: business_referential
    check: "the referenced PayrollRecord.worker_id equals the entry's worker_id and work_date falls within [pay_period_start, pay_period_end] inclusive"
    error_id: ERR_PAYROLL_SUPPORT_MISMATCH
    http_status: 422
    applies_to: "POST /hour-entries"
  - priority: 47
    category: business_referential
    check: "the referenced QuarterlySubmission.facility_id equals the case's facility_id, and when staffing_measure_id is supplied that measure's submission_id equals the case's submission_id"
    error_id: ERR_CASE_SUBMISSION_MISMATCH
    http_status: 422
    applies_to: "POST /discrepancy-cases"
  - priority: 48
    category: business_referential
    check: "when discrepancy_case_id is supplied, that case's facility_id equals the appealed StaffingMeasure.facility_id"
    error_id: ERR_APPEAL_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /rating-appeals"
  - priority: 49
    category: business_constraint
    check: "the allocations array is non-empty and its percent values sum to exactly 100.00"
    error_id: ERR_ALLOCATION_SUM_INVALID
    http_status: 422
    applies_to: "POST /hour-entries, PUT /hour-entries/{id}/allocations, POST /vendor-submissions"
  - priority: 50
    category: business_constraint
    check: "the computed raw_hours must not exceed MAX_SHIFT_HOURS"
    error_id: ERR_SHIFT_LENGTH_EXCEEDED
    http_status: 422
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 51
    category: business_constraint
    check: "the sum of raw_hours over ACTIVE HourEntry rows for the same worker_id and work_date, including the new entry, must not exceed MAX_REPORTED_HOURS_PER_WORKER_DAY"
    error_id: ERR_DAILY_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /hour-entries, POST /vendor-submissions/{id}/accept"
  - priority: 52
    category: business_constraint
    check: "at most one QuarterlySubmission with status != VOID may exist per (facility_id, reporting_period_id)"
    error_id: ERR_DUPLICATE_SUBMISSION
    http_status: 409
    applies_to: "POST /submissions"
  - priority: 53
    category: business_constraint
    check: "census_date is unique within the submission"
    error_id: ERR_DUPLICATE_CENSUS_DAY
    http_status: 409
    applies_to: "POST /census-days"
  - priority: 54
    category: business_constraint
    check: "census_date falls within the submission's ReportingPeriod [start_date, end_date] inclusive"
    error_id: ERR_CENSUS_DATE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /census-days"
  - priority: 55
    category: business_constraint
    check: "Facility.ccn is unique across all facilities"
    error_id: ERR_DUPLICATE_CCN
    http_status: 409
    applies_to: "POST /facilities"
  - priority: 56
    category: business_constraint
    check: "ReportingPeriod.period_code is unique per state_code, and correction_window_end is strictly after submission_deadline"
    error_id: ERR_DUPLICATE_PERIOD_CODE
    http_status: 409
    applies_to: "POST /reporting-periods"
  - priority: 57
    category: business_constraint
    check: "JobCategory.code is unique, and direct_care_credit_pct is 0.00 for ADMINISTRATIVE and NON_DIRECT_CARE classes"
    error_id: ERR_DUPLICATE_JOB_CATEGORY
    http_status: 409
    applies_to: "POST /job-categories"
  - priority: 58
    category: business_constraint
    check: "StaffingVendor.tax_id is unique per facility_id"
    error_id: ERR_DUPLICATE_VENDOR_TAX_ID
    http_status: 409
    applies_to: "POST /vendors"
  - priority: 59
    category: business_constraint
    check: "PayrollRecord.document_ref is unique per facility_id"
    error_id: ERR_DUPLICATE_DOCUMENT_REF
    http_status: 409
    applies_to: "POST /payroll-records"
  - priority: 60
    category: business_constraint
    check: "vendor_id is present exactly when worker_type == AGENCY_CONTRACTOR and absent otherwise"
    error_id: ERR_VENDOR_LINKAGE_INVALID
    http_status: 422
    applies_to: "POST /workers"
  - priority: 61
    category: business_constraint
    check: "the vendor batch lines array contains at least one element"
    error_id: ERR_VENDOR_LINES_EMPTY
    http_status: 422
    applies_to: "POST /vendor-submissions"
  - priority: 62
    category: business_constraint
    check: "no StaffingMeasure with publication_status IN {PROVISIONAL, PUBLISHED} already exists for the submission"
    error_id: ERR_DUPLICATE_MEASURE
    http_status: 409
    applies_to: "POST /staffing-measures"
  - priority: 63
    category: business_constraint
    check: "no RatingAppeal with status == SUBMITTED already exists for the referenced StaffingMeasure"
    error_id: ERR_DUPLICATE_APPEAL
    http_status: 409
    applies_to: "POST /rating-appeals"
  - priority: 64
    category: business_fiscal
    check: "Facility.outstanding_surcharge_cents plus the surcharge this reopen would assess must not exceed SURCHARGE_CAP_CENTS"
    error_id: ERR_SURCHARGE_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /submissions/{id}/reopen"

endpoints:
  # ---------- test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every deadline, correction-window, appeal-window, and late-day rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["repositions the logical clock used by calculations.amendment_surcharge and by every business_temporal validation"]

  # ---------- Facility ----------
  - method: POST
    path: "/facilities"
    description: "Registers a skilled nursing facility."
    roles: [PlatformAdmin]
    code: 201
    input: [ccn, name, state_code, certified_bed_count]
    output: Facility
    side_effects: ["initializes posture REPORTING_OPEN, open_case_count 0, substantiated_case_count 0, outstanding_surcharge_cents 0, latest_staffing_rating null"]
  - method: GET
    path: "/facilities/{id}"
    description: "Reads one facility including its derived posture and surcharge balance."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities"
    description: "Lists facilities with optional state and posture filters."
    roles: [PlatformAdmin, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["state_code?", "posture?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
  - method: GET
    path: "/facilities/{id}/audit-readiness"
    description: "Computed read: runs calculations.audit_support_score for one submission of this facility under the selected variant without persisting anything."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor]
    code: 200
    input: [submission_id, "variant?"]
    output: "{ submission_id: string, variant: string, considered_entry_count: integer, considered_hours: number, supported_hours: number, support_ratio: number, vendor_attestation_ratio: number, census_reconciled_ratio: number, score: number, at_risk: boolean }"
    side_effects: []

  # ---------- ReportingPeriod ----------
  - method: POST
    path: "/reporting-periods"
    description: "Opens a reporting period for a state with its submission deadline and correction window."
    roles: [PlatformAdmin]
    code: 201
    input: [period_code, state_code, start_date, end_date, submission_deadline, correction_window_end]
    output: ReportingPeriod
    side_effects: ["computes day_count", "sets status OPEN"]
  - method: GET
    path: "/reporting-periods/{id}"
    description: "Reads one reporting period."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []
  - method: GET
    path: "/reporting-periods"
    description: "Lists reporting periods."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["state_code?", "status?", "period_code?", "limit?", "offset?"]
    output: ReportingPeriod[]
    side_effects: []
  - method: POST
    path: "/reporting-periods/{id}/close"
    description: "Closes the period: ACCEPTED submissions become FINAL and never-accepted submissions become VOID."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects:
      - "sets status CLOSED"
      - "moves every ACCEPTED QuarterlySubmission of this period to FINAL"
      - "moves every DRAFT, VALIDATED, or REJECTED QuarterlySubmission of this period to VOID"
      - "increments each touched QuarterlySubmission.version by 1"

  # ---------- JobCategory ----------
  - method: POST
    path: "/job-categories"
    description: "Defines a job category with its direct care classification and credit percentage."
    roles: [PlatformAdmin]
    code: 201
    input: [code, cms_job_code, direct_care_class, nurse_group, direct_care_credit_pct, "weekend_countable?"]
    output: JobCategory
    side_effects: []
  - method: GET
    path: "/job-categories/{id}"
    description: "Reads one job category."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: JobCategory
    side_effects: []
  - method: GET
    path: "/job-categories"
    description: "Lists job categories."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["direct_care_class?", "nurse_group?", "code?", "limit?", "offset?"]
    output: JobCategory[]
    side_effects: []

  # ---------- Worker ----------
  - method: POST
    path: "/workers"
    description: "Registers an employee or contractor who may report hours for a facility."
    roles: [PlatformAdmin, FacilityAdministrator]
    code: 201
    input: [facility_id, full_name, worker_type, primary_job_category_id, hire_date, "vendor_id?", "authorized_roles?"]
    output: Worker
    side_effects: ["sets status ACTIVE and reported_hours_total 0.00"]
  - method: GET
    path: "/workers/{id}"
    description: "Reads one worker."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: Worker
    side_effects: []
  - method: GET
    path: "/workers"
    description: "Lists workers, filterable by facility, job category, vendor, type, and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["facility_id?", "primary_job_category_id?", "vendor_id?", "worker_type?", "status?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []
  - method: POST
    path: "/workers/{id}/terminate"
    description: "Terminates a worker so the identity can no longer act."
    roles: [PlatformAdmin, FacilityAdministrator]
    code: 200
    input: []
    output: Worker
    side_effects: ["sets status TERMINATED"]

  # ---------- StaffingVendor ----------
  - method: POST
    path: "/vendors"
    description: "Registers a staffing agency that supplies contract staff to a facility."
    roles: [PlatformAdmin, FacilityAdministrator]
    code: 201
    input: [facility_id, vendor_name, tax_id, attestation_contact]
    output: StaffingVendor
    side_effects: ["sets status ACTIVE and accepted_hours_total 0.00"]
  - method: GET
    path: "/vendors/{id}"
    description: "Reads one staffing vendor."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: StaffingVendor
    side_effects: []
  - method: GET
    path: "/vendors"
    description: "Lists staffing vendors, filterable by facility and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: StaffingVendor[]
    side_effects: []
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "Suspends a vendor, blocking new batch submissions and acceptances."
    roles: [PlatformAdmin, StateAuditor]
    code: 200
    input: []
    output: StaffingVendor
    side_effects: ["sets status SUSPENDED"]

  # ---------- VendorHourSubmission ----------
  - method: POST
    path: "/vendor-submissions"
    description: "Creates a draft agency hour batch for a facility and period."
    roles: [VendorRepresentative, PlatformAdmin]
    code: 201
    input: [vendor_id, facility_id, reporting_period_id, lines, attested_by]
    output: VendorHourSubmission
    side_effects: ["computes line_count", "sets status DRAFT"]
  - method: GET
    path: "/vendor-submissions/{id}"
    description: "Reads one agency hour batch including the ids of any synthesized hour entries."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor]
    code: 200
    input: []
    output: VendorHourSubmission
    side_effects: []
  - method: GET
    path: "/vendor-submissions"
    description: "Lists agency hour batches, filterable by vendor, facility, period, and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor]
    code: 200
    input: ["vendor_id?", "facility_id?", "reporting_period_id?", "status?", "limit?", "offset?"]
    output: VendorHourSubmission[]
    side_effects: []
  - method: POST
    path: "/vendor-submissions/{id}/submit"
    description: "Vendor attests and submits the batch to the facility."
    roles: [VendorRepresentative]
    code: 200
    input: []
    output: VendorHourSubmission
    side_effects: ["sets status SUBMITTED and submitted_at", "clears rejection_reason"]
  - method: POST
    path: "/vendor-submissions/{id}/accept"
    description: "Facility accepts the batch into a named quarterly submission, synthesizing one HourEntry per line."
    roles: [StaffingCoordinator]
    code: 200
    input: [submission_id]
    output: VendorHourSubmission
    side_effects:
      - "sets status ACCEPTED"
      - "synthesizes one HourEntry per element of lines in array order with source VENDOR_SUBMISSION"
      - "sets accepted_hour_entry_ids and accepted_direct_care_hours"
      - "refreshes StaffingVendor.accepted_hours_total"
      - "runs calculations.submission_hour_census_rollup and calculations.hprd_reconciliation on the named QuarterlySubmission"
      - "reverts the named QuarterlySubmission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments the named QuarterlySubmission.version by 1"
  - method: POST
    path: "/vendor-submissions/{id}/reject"
    description: "Facility rejects the batch back to the vendor for correction."
    roles: [StaffingCoordinator]
    code: 200
    input: [rejection_reason]
    output: VendorHourSubmission
    side_effects: ["sets status REJECTED and rejection_reason"]
  - method: POST
    path: "/vendor-submissions/{id}/revoke"
    description: "Vendor revokes an accepted batch, voiding every hour entry it produced."
    roles: [VendorRepresentative]
    code: 200
    input: []
    output: VendorHourSubmission
    side_effects:
      - "sets status REVOKED"
      - "sets entry_status VOID on every HourEntry in accepted_hour_entry_ids"
      - "sets accepted_direct_care_hours 0.00 and refreshes StaffingVendor.accepted_hours_total"
      - "runs calculations.submission_hour_census_rollup on the target QuarterlySubmission"
      - "reverts that submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments that QuarterlySubmission.version by 1"

  # ---------- PayrollRecord ----------
  - method: POST
    path: "/payroll-records"
    description: "Files an immutable payroll document that can support reported hours."
    roles: [PlatformAdmin, StaffingCoordinator]
    code: 201
    input: [facility_id, worker_id, pay_period_start, pay_period_end, paid_hours, support_type, document_ref]
    output: PayrollRecord
    side_effects: []
  - method: GET
    path: "/payroll-records/{id}"
    description: "Reads one payroll document."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor]
    code: 200
    input: []
    output: PayrollRecord
    side_effects: []
  - method: GET
    path: "/payroll-records"
    description: "Lists payroll documents, filterable by facility, worker, and document class."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor]
    code: 200
    input: ["facility_id?", "worker_id?", "support_type?", "limit?", "offset?"]
    output: PayrollRecord[]
    side_effects: []

  # ---------- QuarterlySubmission ----------
  - method: POST
    path: "/submissions"
    description: "Opens a draft quarterly payroll-based submission for a facility and period."
    roles: [StaffingCoordinator, PlatformAdmin]
    code: 201
    input: [facility_id, reporting_period_id]
    output: QuarterlySubmission
    side_effects: ["sets status DRAFT, amendment_index 0, all rollup fields to their zero values", "copies ReportingPeriod.correction_window_end into correction_deadline"]
  - method: GET
    path: "/submissions/{id}"
    description: "Reads one quarterly submission with all rollup and surcharge fields."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: QuarterlySubmission
    side_effects: []
  - method: GET
    path: "/submissions"
    description: "Lists quarterly submissions, filterable by facility, period, attesting worker, validating worker, and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["facility_id?", "reporting_period_id?", "validated_by_worker_id?", "attested_by_worker_id?", "status?", "limit?", "offset?"]
    output: QuarterlySubmission[]
    side_effects: []
  - method: GET
    path: "/submissions/{id}/findings"
    description: "Lists the validation findings raised against a submission."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["code?", "severity?", "status?", "limit?", "offset?"]
    output: ValidationFinding[]
    side_effects: []
  - method: GET
    path: "/validation-findings/{id}"
    description: "Reads one validation finding."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: ValidationFinding
    side_effects: []
  - method: GET
    path: "/submissions/{id}/hprd"
    description: "Computed read: runs calculations.hprd_reconciliation for the submission under the selected variant without persisting anything."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["variant?"]
    output: "{ submission_id: string, variant: string, total_direct_care_hours: number, total_rn_hours: number, weekend_direct_care_hours: number, resident_days: integer, weekend_resident_days: integer, total_nurse_hprd: number, rn_hprd: number, weekend_total_nurse_hprd: number, implausible: boolean }"
    side_effects: []
  - method: POST
    path: "/submissions/{id}/validate"
    description: "Runs the full validation pass, refreshing rollups, hprd, and the finding set."
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: QuarterlySubmission
    side_effects:
      - "runs calculations.submission_hour_census_rollup and calculations.hprd_reconciliation variant as_submitted"
      - "creates and resolves ValidationFinding rows per state_machines.QuarterlySubmission DRAFT_to_VALIDATED"
      - "refreshes open_fatal_finding_count and open_warning_finding_count"
      - "sets status VALIDATED and validated_by_worker_id"
      - "increments QuarterlySubmission.version by 1"
  - method: POST
    path: "/submissions/{id}/submit"
    description: "Facility administrator attests and submits the validated quarter to the state."
    roles: [FacilityAdministrator]
    code: 200
    input: []
    output: QuarterlySubmission
    side_effects: ["sets status SUBMITTED, attested_by_worker_id, submitted_at", "increments QuarterlySubmission.version by 1"]
  - method: POST
    path: "/submissions/{id}/accept"
    description: "State auditor accepts the submission, scoring audit readiness on a sampled basis and opening a discrepancy case when the score falls below the risk floor."
    roles: [StateAuditor]
    code: 200
    input: []
    output: QuarterlySubmission
    side_effects:
      - "sets status ACCEPTED, accepted_by_user_id, accepted_at"
      - "runs calculations.audit_support_score variant sampled_audit and stores audit_support_score"
      - "creates an auto_opened DiscrepancyCase with trigger_reason AUDIT_SCORE_BELOW_FLOOR when audit_support_score < 70.00"
      - "runs calculations.facility_posture_derivation and refreshes Facility.posture, open_case_count"
      - "increments QuarterlySubmission.version by 1"
  - method: POST
    path: "/submissions/{id}/reject"
    description: "State auditor rejects the submission back to the facility."
    roles: [StateAuditor]
    code: 200
    input: [rejection_reason]
    output: QuarterlySubmission
    side_effects: ["sets status REJECTED, rejection_reason, accepted_by_user_id", "increments QuarterlySubmission.version by 1"]
  - method: POST
    path: "/submissions/{id}/reopen"
    description: "Reopens an accepted or rejected submission for amendment, assessing the amendment surcharge."
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: QuarterlySubmission
    side_effects:
      - "runs calculations.amendment_surcharge and adds the result to amendment_surcharge_cents"
      - "increments amendment_index by 1"
      - "sets status DRAFT and clears validated_by_worker_id and attested_by_worker_id"
      - "refreshes Facility.outstanding_surcharge_cents"
      - "increments QuarterlySubmission.version by 1"
  - method: POST
    path: "/submissions/{id}/findings/{finding_id}/waive"
    description: "State auditor waives an open validation finding so it stops counting against the submission."
    roles: [StateAuditor]
    code: 200
    input: [waiver_note]
    output: ValidationFinding
    side_effects:
      - "sets status WAIVED, waived_by_user_id, resolved_at, and detail suffixed with the waiver_note"
      - "refreshes the submission's open_fatal_finding_count and open_warning_finding_count"
      - "increments QuarterlySubmission.version by 1"

  # ---------- HourEntry ----------
  - method: POST
    path: "/hour-entries"
    description: "Captures one worked shift against a draft submission, classifying it into direct care and excluded hours."
    roles: [StaffingCoordinator]
    code: 201
    input: [submission_id, worker_id, job_category_id, work_date, shift_start, shift_end, allocations, expected_submission_version, "payroll_record_id?"]
    output: HourEntry
    side_effects:
      - "runs calculations.hour_entry_classification to set raw_hours, direct_care_hours, excluded_hours, rn_hours, lpn_hours, na_hours, is_weekend"
      - "runs calculations.submission_hour_census_rollup on the parent submission"
      - "refreshes Worker.reported_hours_total"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1 and records it on the entry as submission_version"
  - method: GET
    path: "/hour-entries/{id}"
    description: "Reads one hour entry with its classification breakdown."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher]
    code: 200
    input: []
    output: HourEntry
    side_effects: []
  - method: GET
    path: "/hour-entries"
    description: "Lists hour entries, filterable by submission, facility, period, worker, category, vendor batch, payroll document, date, and both status dimensions."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, VendorRepresentative, StateAuditor, CmsPublisher]
    code: 200
    input: ["submission_id?", "facility_id?", "reporting_period_id?", "worker_id?", "job_category_id?", "vendor_submission_id?", "payroll_record_id?", "work_date?", "entry_status?", "verification_status?", "source?", "limit?", "offset?"]
    output: HourEntry[]
    side_effects: []
  - method: PUT
    path: "/hour-entries/{id}/allocations"
    description: "Replaces the split-role allocation set of an hour entry, re-stating its direct care credit."
    roles: [StaffingCoordinator]
    code: 200
    input: [allocations, expected_submission_version]
    output: HourEntry
    side_effects:
      - "re-runs calculations.hour_entry_classification for this entry"
      - "increments allocation_revision by 1"
      - "runs calculations.submission_hour_census_rollup on the parent submission"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1 and records it on the entry as submission_version"
  - method: POST
    path: "/hour-entries/{id}/void"
    description: "Voids an hour entry, removing its hours from every submission rollup. Takes no version token, so it silently advances the parent submission's version."
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: HourEntry
    side_effects:
      - "sets entry_status VOID"
      - "runs calculations.submission_hour_census_rollup on the parent submission"
      - "refreshes Worker.reported_hours_total"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1"
  - method: POST
    path: "/hour-entries/{id}/verify"
    description: "State auditor records whether payroll evidence supports this reported hour."
    roles: [StateAuditor]
    code: 200
    input: [outcome]
    output: HourEntry
    side_effects:
      - "sets verification_status to the outcome and verified_by_user_id to the acting X-User-ID"
      - "creates an UNSUPPORTED_HOURS ValidationFinding when the outcome is UNSUPPORTED"
      - "resolves the UNSUPPORTED_HOURS or MISSING_PAYROLL_SUPPORT finding for this entry when the outcome is SUPPORTED"
      - "refreshes the parent submission's open_warning_finding_count"

  # ---------- CensusDay ----------
  - method: POST
    path: "/census-days"
    description: "Reports the midnight resident census for one date of the submission."
    roles: [StaffingCoordinator]
    code: 201
    input: [submission_id, census_date, resident_count, "mds_resident_count?"]
    output: CensusDay
    side_effects:
      - "sets status REPORTED and computes is_weekend"
      - "runs calculations.submission_hour_census_rollup on the parent submission"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1 and records it on the census day as submission_version"
  - method: GET
    path: "/census-days/{id}"
    description: "Reads one census day with its reconciliation variance."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher]
    code: 200
    input: []
    output: CensusDay
    side_effects: []
  - method: GET
    path: "/census-days"
    description: "Lists census days, filterable by submission, facility, period, status, and date."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher]
    code: 200
    input: ["submission_id?", "facility_id?", "reporting_period_id?", "status?", "census_date?", "limit?", "offset?"]
    output: CensusDay[]
    side_effects: []
  - method: PATCH
    path: "/census-days/{id}"
    description: "Corrects the reported or MDS resident count for a census day."
    roles: [StaffingCoordinator]
    code: 200
    input: ["resident_count?", "mds_resident_count?"]
    output: CensusDay
    side_effects:
      - "recomputes variance_pct when mds_resident_count is non-null"
      - "runs calculations.submission_hour_census_rollup on the parent submission"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1 and records it on the census day as submission_version"
  - method: POST
    path: "/census-days/{id}/reconcile"
    description: "Reconciles the facility-reported count against the MDS count, moving the day to RECONCILED or DISPUTED by the variance tolerance."
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: CensusDay
    side_effects:
      - "runs calculations.census_variance_reconciliation and stores variance_pct"
      - "sets status RECONCILED when variance_pct <= 0.0500, DISPUTED otherwise"
      - "creates or resolves the CENSUS_VARIANCE ValidationFinding for this census_date"
      - "reverts the parent submission from VALIDATED to DRAFT when it was VALIDATED"
      - "increments QuarterlySubmission.version by 1"

  # ---------- StaffingMeasure ----------
  - method: POST
    path: "/staffing-measures"
    description: "Computes the public staffing measure and star rating from an accepted submission."
    roles: [CmsPublisher]
    code: 201
    input: [submission_id]
    output: StaffingMeasure
    side_effects:
      - "runs calculations.hprd_reconciliation variant as_submitted to set total_nurse_hprd, rn_hprd, weekend_total_nurse_hprd"
      - "runs calculations.staffing_rating_assignment to set total_nurse_points, rn_points, days_with_zero_rn_hours, staffing_rating"
      - "sets measure_variant AS_SUBMITTED, publication_status PROVISIONAL, audit_status NOT_AUDITED, computed_by_user_id"
  - method: GET
    path: "/staffing-measures/{id}"
    description: "Reads one staffing measure with both its state dimensions."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: StaffingMeasure
    side_effects: []
  - method: GET
    path: "/staffing-measures"
    description: "Lists staffing measures, filterable by submission, facility, period, publication status, and audit status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["submission_id?", "facility_id?", "reporting_period_id?", "publication_status?", "audit_status?", "measure_variant?", "limit?", "offset?"]
    output: StaffingMeasure[]
    side_effects: []
  - method: POST
    path: "/staffing-measures/{id}/publish"
    description: "Publishes the measure to the public rating system and opens the appeal window."
    roles: [CmsPublisher]
    code: 200
    input: []
    output: StaffingMeasure
    side_effects:
      - "sets publication_status PUBLISHED, published_at, and appeal_deadline at published_at plus 30 calendar days"
      - "refreshes Facility.latest_staffing_rating"

  # ---------- DiscrepancyCase ----------
  - method: POST
    path: "/discrepancy-cases"
    description: "Opens a discrepancy investigation against a facility's submission."
    roles: [StateAuditor]
    code: 201
    input: [facility_id, submission_id, trigger_reason, detail, "staffing_measure_id?"]
    output: DiscrepancyCase
    side_effects:
      - "sets status OPEN, auto_opened false, opened_by_user_id to the acting X-User-ID"
      - "runs calculations.facility_posture_derivation and refreshes Facility.posture and open_case_count"
  - method: GET
    path: "/discrepancy-cases/{id}"
    description: "Reads one discrepancy case."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: DiscrepancyCase
    side_effects: []
  - method: GET
    path: "/discrepancy-cases"
    description: "Lists discrepancy cases, filterable by facility, submission, measure, reason, and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["facility_id?", "submission_id?", "staffing_measure_id?", "trigger_reason?", "status?", "limit?", "offset?"]
    output: DiscrepancyCase[]
    side_effects: []
  - method: POST
    path: "/discrepancy-cases/{id}/request-info"
    description: "Auditor requests supporting information from the facility."
    roles: [StateAuditor]
    code: 200
    input: [request_note]
    output: DiscrepancyCase
    side_effects: ["sets status INFO_REQUESTED, last_request_note, and increments info_request_count by 1"]
  - method: POST
    path: "/discrepancy-cases/{id}/respond"
    description: "Facility answers the information request, moving the case into review."
    roles: [FacilityAdministrator]
    code: 200
    input: [response_note]
    output: DiscrepancyCase
    side_effects:
      - "sets status UNDER_REVIEW, last_response_note, and increments facility_response_count by 1"
      - "moves the named StaffingMeasure's audit_status from NOT_AUDITED to UNDER_AUDIT when staffing_measure_id is set"
  - method: POST
    path: "/discrepancy-cases/{id}/substantiate"
    description: "Auditor substantiates the discrepancy, triggering the audit-adjusted measure revision and facility sanction cascade."
    roles: [StateAuditor]
    code: 200
    input: [resolution_note]
    output: DiscrepancyCase
    side_effects:
      - "sets status SUBSTANTIATED, substantiated_by_user_id, resolution_note"
      - "moves the named StaffingMeasure's audit_status UNDER_AUDIT to AUDIT_REVISED, sets measure_variant AUDIT_ADJUSTED, and recomputes its hprd, points, and staffing_rating"
      - "runs calculations.facility_posture_derivation, setting Facility.posture SANCTIONED"
      - "reverts every VALIDATED QuarterlySubmission of the facility to DRAFT and raises a FATAL FACILITY_SANCTIONED ValidationFinding on each"
      - "increments each reverted QuarterlySubmission.version by 1"
      - "refreshes Facility.latest_staffing_rating when the revised measure is PUBLISHED"
  - method: POST
    path: "/discrepancy-cases/{id}/dismiss"
    description: "Auditor dismisses the discrepancy, confirming the measure as computed."
    roles: [StateAuditor]
    code: 200
    input: [resolution_note]
    output: DiscrepancyCase
    side_effects:
      - "sets status DISMISSED and resolution_note"
      - "moves the named StaffingMeasure's audit_status UNDER_AUDIT to AUDIT_CONFIRMED, leaving staffing_rating unchanged"
      - "runs calculations.facility_posture_derivation and refreshes Facility.posture and open_case_count"

  # ---------- RatingAppeal ----------
  - method: POST
    path: "/rating-appeals"
    description: "Facility appeals a published staffing rating."
    roles: [FacilityAdministrator]
    code: 201
    input: [staffing_measure_id, grounds, narrative, expected_measure_version, "discrepancy_case_id?"]
    output: RatingAppeal
    side_effects:
      - "sets status SUBMITTED and filed_by_worker_id to the acting X-User-ID"
      - "sets the appealed StaffingMeasure.has_open_appeal true"
      - "increments StaffingMeasure.version by 1"
  - method: GET
    path: "/rating-appeals/{id}"
    description: "Reads one rating appeal."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: []
    output: RatingAppeal
    side_effects: []
  - method: GET
    path: "/rating-appeals"
    description: "Lists rating appeals, filterable by measure, facility, contested case, filer, and status."
    roles: [PlatformAdmin, StaffingCoordinator, FacilityAdministrator, StateAuditor, CmsPublisher, AppealsReviewer]
    code: 200
    input: ["staffing_measure_id?", "facility_id?", "discrepancy_case_id?", "filed_by_worker_id?", "grounds?", "status?", "limit?", "offset?"]
    output: RatingAppeal[]
    side_effects: []
  - method: POST
    path: "/rating-appeals/{id}/grant"
    description: "Appeals reviewer grants the appeal, suppressing the measure, overturning any substantiated case, and waiving the outstanding amendment surcharge."
    roles: [AppealsReviewer]
    code: 200
    input: [decision_note]
    output: RatingAppeal
    side_effects:
      - "sets status GRANTED, decided_by_user_id, decision_note, decided_at"
      - "moves the appealed StaffingMeasure from PUBLISHED to SUPPRESSED and clears has_open_appeal"
      - "moves a SUBSTANTIATED contested DiscrepancyCase to OVERTURNED and re-derives Facility.posture"
      - "sets surcharge_waived_cents, adds it to the source submission's waived_surcharge_cents, and refreshes Facility.outstanding_surcharge_cents"
      - "refreshes Facility.latest_staffing_rating"
  - method: POST
    path: "/rating-appeals/{id}/deny"
    description: "Appeals reviewer denies the appeal, leaving the published rating, the contested case, and the surcharge untouched."
    roles: [AppealsReviewer]
    code: 200
    input: [decision_note]
    output: RatingAppeal
    side_effects:
      - "sets status DENIED, decided_by_user_id, decision_note, decided_at"
      - "clears the appealed StaffingMeasure.has_open_appeal"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the target endpoint"
  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "an entity_backed role's X-User-ID does not match any row of its backing entity"
  - id: ERR_WORKER_ROLE_NOT_AUTHORIZED
    http: 403
    condition: "the acting Worker.authorized_roles does not contain the acting role name"
  - id: ERR_ACTOR_INACTIVE
    http: 403
    condition: "the acting Worker.status == TERMINATED"
  - id: ERR_FACILITY_SCOPE_VIOLATION
    http: 403
    condition: "the acting Worker belongs to a different facility than the target resource"
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "a VendorRepresentative acts on a batch belonging to a different vendor"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same identity would perform two duties that must be separated: attesting a submission it validated, or accepting a submission whose hours it verified"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "no Facility with the supplied id"
  - id: ERR_REPORTING_PERIOD_NOT_FOUND
    http: 404
    condition: "no ReportingPeriod with the supplied id"
  - id: ERR_JOB_CATEGORY_NOT_FOUND
    http: 404
    condition: "no JobCategory with the supplied id, including inside an allocations line"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "no Worker with the supplied id, including inside a vendor batch line"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "no StaffingVendor with the supplied id"
  - id: ERR_VENDOR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no VendorHourSubmission with the supplied id"
  - id: ERR_PAYROLL_RECORD_NOT_FOUND
    http: 404
    condition: "no PayrollRecord with the supplied id"
  - id: ERR_HOUR_ENTRY_NOT_FOUND
    http: 404
    condition: "no HourEntry with the supplied id"
  - id: ERR_CENSUS_DAY_NOT_FOUND
    http: 404
    condition: "no CensusDay with the supplied id"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no QuarterlySubmission with the supplied id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "no ValidationFinding with the supplied id, or the finding does not belong to the named submission"
  - id: ERR_MEASURE_NOT_FOUND
    http: 404
    condition: "no StaffingMeasure with the supplied id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "no DiscrepancyCase with the supplied id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no RatingAppeal with the supplied id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing or of the wrong type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum body field carries a value outside its declared set"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_INVALID_DATE_FORMAT
    http: 422
    condition: "a date, time-of-day, or datetime field is malformed"
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "the governing ReportingPeriod.status == CLOSED"
  - id: ERR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "the QuarterlySubmission is not in a status the requested operation accepts"
  - id: ERR_HOUR_ENTRY_VOIDED
    http: 409
    condition: "the target HourEntry.entry_status == VOID"
  - id: ERR_SUPPORT_DOCUMENT_MISSING
    http: 409
    condition: "verify with outcome SUPPORTED on an entry whose payroll_record_id is null"
  - id: ERR_VENDOR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "the VendorHourSubmission is not in a status the requested operation accepts"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "the governing StaffingVendor.status == SUSPENDED"
  - id: ERR_MDS_COUNT_MISSING
    http: 409
    condition: "reconcile on a CensusDay whose mds_resident_count is null"
  - id: ERR_MEASURE_NOT_PUBLISHED
    http: 409
    condition: "an appeal is filed against or decided on a StaffingMeasure whose publication_status is not PUBLISHED"
  - id: ERR_MEASURE_UNDER_AUDIT
    http: 409
    condition: "a measure for this submission has audit_status == UNDER_AUDIT and is frozen against recomputation or publication"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "the DiscrepancyCase is not in a status the requested operation accepts"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "the RatingAppeal has already been decided"
  - id: ERR_NO_CENSUS_DATA
    http: 409
    condition: "validate or measure computation on a submission with no CensusDay rows"
  - id: ERR_FINDING_NOT_OPEN
    http: 409
    condition: "waive on a ValidationFinding whose status is not OPEN"
  - id: ERR_STALE_SUBMISSION_VERSION
    http: 412
    condition: "expected_submission_version does not equal the current QuarterlySubmission.version"
  - id: ERR_STALE_MEASURE_VERSION
    http: 412
    condition: "expected_measure_version does not equal the current StaffingMeasure.version"
  - id: ERR_FACILITY_SANCTIONED
    http: 409
    condition: "the facility has a SUBSTANTIATED discrepancy case, so posture is SANCTIONED and validation or publication is blocked"
  - id: ERR_FACILITY_UNDER_HOLD
    http: 409
    condition: "the facility has an unresolved discrepancy case, so posture is AUDIT_HOLD and submission is blocked"
  - id: ERR_FATAL_FINDINGS_OPEN
    http: 409
    condition: "submit attempted while open_fatal_finding_count > 0"
  - id: ERR_CASE_RESPONSE_REQUIRED
    http: 409
    condition: "substantiate attempted before the facility responded at least once"
  - id: ERR_WORK_DATE_OUTSIDE_PERIOD
    http: 422
    condition: "work_date falls outside the submission's reporting period"
  - id: ERR_WORK_DATE_BEFORE_HIRE
    http: 422
    condition: "work_date precedes the worker's hire_date"
  - id: ERR_SHIFT_WINDOW_INVALID
    http: 422
    condition: "shift_end is not strictly after shift_start"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "the new shift's half-open interval intersects another ACTIVE entry for the same worker on the same date"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "the new reporting period's closed-inclusive date range intersects an existing period for the same state, including sharing a single boundary date"
  - id: ERR_PAYROLL_CAPACITY_EXCEEDED
    http: 409
    condition: "the worker's intersecting payroll documents would collectively exceed 24.00 paid hours per calendar day in the union of their pay periods"
  - id: ERR_CORRECTION_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is past the submission's correction_deadline"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is past the measure's appeal_deadline"
  - id: ERR_WORKER_FACILITY_MISMATCH
    http: 422
    condition: "the referenced worker belongs to a different facility than the submission"
  - id: ERR_VENDOR_WORKER_MISMATCH
    http: 422
    condition: "a vendor batch line names a worker who is not an AGENCY_CONTRACTOR of that vendor"
  - id: ERR_PAYROLL_SUPPORT_MISMATCH
    http: 422
    condition: "the offered payroll document belongs to another worker or does not cover work_date"
  - id: ERR_CASE_SUBMISSION_MISMATCH
    http: 422
    condition: "the case's submission belongs to another facility, or the named measure was computed from another submission"
  - id: ERR_APPEAL_CASE_MISMATCH
    http: 422
    condition: "the contested case belongs to a different facility than the appealed measure"
  - id: ERR_ALLOCATION_SUM_INVALID
    http: 422
    condition: "the allocations array is empty or its percent values do not sum to exactly 100.00"
  - id: ERR_SHIFT_LENGTH_EXCEEDED
    http: 422
    condition: "raw_hours exceeds 16.00"
  - id: ERR_DAILY_HOURS_EXCEEDED
    http: 409
    condition: "the worker's ACTIVE hours for that work_date would exceed 24.00"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "a non-VOID submission already exists for this facility and period"
  - id: ERR_DUPLICATE_CENSUS_DAY
    http: 409
    condition: "a CensusDay for this census_date already exists on the submission"
  - id: ERR_CENSUS_DATE_OUTSIDE_PERIOD
    http: 422
    condition: "census_date falls outside the submission's reporting period"
  - id: ERR_DUPLICATE_CCN
    http: 409
    condition: "another Facility already uses this ccn"
  - id: ERR_DUPLICATE_PERIOD_CODE
    http: 409
    condition: "another ReportingPeriod for this state already uses this period_code, or correction_window_end is not after submission_deadline"
  - id: ERR_DUPLICATE_JOB_CATEGORY
    http: 409
    condition: "another JobCategory already uses this code, or a non-direct-care class was given a non-zero direct_care_credit_pct"
  - id: ERR_DUPLICATE_VENDOR_TAX_ID
    http: 409
    condition: "another StaffingVendor at this facility already uses this tax_id"
  - id: ERR_DUPLICATE_DOCUMENT_REF
    http: 409
    condition: "another PayrollRecord at this facility already uses this document_ref"
  - id: ERR_VENDOR_LINKAGE_INVALID
    http: 422
    condition: "vendor_id supplied for a non-agency worker, or omitted for an AGENCY_CONTRACTOR"
  - id: ERR_VENDOR_LINES_EMPTY
    http: 422
    condition: "the vendor batch lines array is empty"
  - id: ERR_DUPLICATE_MEASURE
    http: 409
    condition: "a PROVISIONAL or PUBLISHED StaffingMeasure already exists for this submission"
  - id: ERR_DUPLICATE_APPEAL
    http: 409
    condition: "a RatingAppeal with status SUBMITTED already exists for this measure"
  - id: ERR_SURCHARGE_CAP_EXCEEDED
    http: 402
    condition: "the facility's outstanding surcharge plus this reopen's assessment would exceed 50000 cents"

roles:
  - name: PlatformAdmin
    description: "Operator of the reporting platform: registers facilities, periods, job categories, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /facilities"
      - "POST /reporting-periods"
      - "POST /reporting-periods/{id}/close"
      - "POST /job-categories"
    shared_operations:
      - "POST /workers"
      - "POST /workers/{id}/terminate"
      - "POST /vendors"
      - "POST /vendors/{id}/suspend"
      - "POST /payroll-records"
      - "POST /submissions"
      - "POST /vendor-submissions"
      - "all GET reads"
  - name: StaffingCoordinator
    description: "Facility staffing office that captures hours, census, and vendor batches and validates the quarter. Acts as a Worker whose authorized_roles contains STAFFING_COORDINATOR."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /hour-entries"
      - "PUT /hour-entries/{id}/allocations"
      - "POST /hour-entries/{id}/void"
      - "POST /census-days"
      - "PATCH /census-days/{id}"
      - "POST /census-days/{id}/reconcile"
      - "POST /submissions/{id}/validate"
      - "POST /submissions/{id}/reopen"
      - "POST /vendor-submissions/{id}/accept"
      - "POST /vendor-submissions/{id}/reject"
    shared_operations:
      - "POST /submissions"
      - "POST /payroll-records"
      - "GET /facilities/{id}/audit-readiness"
      - "GET /submissions/{id}/hprd"
      - "all GET reads within the acting worker's facility"
  - name: FacilityAdministrator
    description: "Facility leadership that attests and submits the quarter, answers discrepancy information requests, and files rating appeals. Acts as a Worker whose authorized_roles contains FACILITY_ADMINISTRATOR."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /submissions/{id}/submit"
      - "POST /discrepancy-cases/{id}/respond"
      - "POST /rating-appeals"
    shared_operations:
      - "POST /workers"
      - "POST /workers/{id}/terminate"
      - "POST /vendors"
      - "GET /facilities/{id}/audit-readiness"
      - "GET /submissions/{id}/hprd"
      - "all GET reads within the acting worker's facility"
  - name: VendorRepresentative
    description: "Staffing agency contact that files, attests, and revokes agency hour batches. X-User-ID is the StaffingVendor id."
    identity: "entity_backed:StaffingVendor"
    exclusive_operations:
      - "POST /vendor-submissions/{id}/submit"
      - "POST /vendor-submissions/{id}/revoke"
    shared_operations:
      - "POST /vendor-submissions"
      - "GET /vendor-submissions"
      - "GET /vendor-submissions/{id}"
      - "GET /workers"
      - "GET /hour-entries"
  - name: StateAuditor
    description: "State survey agency that accepts or rejects submissions, verifies payroll support, waives findings, and runs discrepancy investigations."
    identity: "opaque"
    exclusive_operations:
      - "POST /submissions/{id}/accept"
      - "POST /submissions/{id}/reject"
      - "POST /submissions/{id}/findings/{finding_id}/waive"
      - "POST /hour-entries/{id}/verify"
      - "POST /discrepancy-cases"
      - "POST /discrepancy-cases/{id}/request-info"
      - "POST /discrepancy-cases/{id}/substantiate"
      - "POST /discrepancy-cases/{id}/dismiss"
    shared_operations:
      - "POST /vendors/{id}/suspend"
      - "GET /facilities/{id}/audit-readiness"
      - "GET /submissions/{id}/hprd"
      - "all GET reads"
  - name: CmsPublisher
    description: "National rating publisher that computes staffing measures from accepted submissions and publishes star ratings."
    identity: "opaque"
    exclusive_operations:
      - "POST /staffing-measures"
      - "POST /staffing-measures/{id}/publish"
    shared_operations:
      - "GET /submissions/{id}/hprd"
      - "all GET reads"
  - name: AppealsReviewer
    description: "Independent reviewer that grants or denies rating appeals; cannot compute, publish, or audit measures."
    identity: "opaque"
    exclusive_operations:
      - "POST /rating-appeals/{id}/grant"
      - "POST /rating-appeals/{id}/deny"
    shared_operations:
      - "GET /rating-appeals"
      - "GET /rating-appeals/{id}"
      - "GET /staffing-measures"
      - "GET /staffing-measures/{id}"
      - "GET /submissions/{id}"
      - "GET /submissions/{id}/hprd"
      - "GET /discrepancy-cases/{id}"

