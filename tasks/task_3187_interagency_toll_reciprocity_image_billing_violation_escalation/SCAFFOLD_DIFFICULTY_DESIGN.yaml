              as: SettlementOfficer
              captures: { agr: "$.data.id" }
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "NYP100", plate_state: "NY", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-02T09:00:00Z", is_peak: false, idempotency_key: "l1" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "NYP200", plate_state: "NY", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-02T09:30:00Z", is_peak: false, idempotency_key: "l2" }
