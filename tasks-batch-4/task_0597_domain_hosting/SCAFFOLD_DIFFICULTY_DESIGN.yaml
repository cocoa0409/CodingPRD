  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ssl_certificate_closed_interval_with_buffer_on_a_domain
        grounds:
          - calculations.ssl_interval_conflict
          - validations[priority=72]
          - errors[ERR_SSL_INTERVAL_CONFLICT]
          - entities.AddOn.fields.starts_at
          - entities.AddOn.fields.ends_at
        distinguishing_aspect: |
          Resource = Domain (its certificate slot), interval semantics = CLOSED intervals widened
          by SSL_RENEWAL_BUFFER_DAYS = 1 on both sides, so a certificate starting the day AFTER
          the incumbent's ends_at (2026-07-31 vs ends_at 2026-07-30) still collides; only a
          start of 2026-08-01 or later clears the buffer.
