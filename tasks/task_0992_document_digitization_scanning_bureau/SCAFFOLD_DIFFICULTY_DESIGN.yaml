  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_cascade_batch_box_shelf
        grounds:
          - state_machines.Batch.DELIVERED_to_DISPOSITION_PENDING
          - state_machines.Box.SCAN_COMPLETE_to_AWAITING_DISPOSITION
          - state_machines.ShelfAssignment.ACTIVE_to_RELEASED
          - entities.ShelfSlot.fields.occupied_weight_grams
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock endpoint: set_current_utc
          mutates Batch (DELIVERED -> DISPOSITION_PENDING); that transition
          itself mutates each Box (STORED -> AWAITING_DISPOSITION); each box
