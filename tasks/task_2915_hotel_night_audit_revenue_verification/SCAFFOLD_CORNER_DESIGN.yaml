  - section: state_machines
    instances:

      - name: state_valid_transition_full_close_spine_walks_open_to_archived
        claim_type: valid_transition
        grounds: ["state_machines.BusinessDate.status", "state_machines.AccountingPeriod.status", "state_machines.RevenueReport.status", "calculations.occupancy_statistics", "calculations.audit_retention_date"]
        distinguishing_aspect: "The whole declared spine is walked once in order - OPEN, ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED, CLOSED, ARCHIVED - and every hop is checked to bump BusinessDate.version by exactly one while the derived statistics and the period roll-up follow along."
        test_recipe:
          setup: ["Standard property with out_of_order_room_count 4, so rooms_available_count is 96; no outlets, so the settlement precondition is vacuously satisfied; one IN_HOUSE rack-rate folio for 1 night at 200.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-SPINE", guest_name: "Rae Nolan", room_number: "2101", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/balance"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_v: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller", "RevenueManager"], expected_business_date_version: "${bd_v}", pace_basis: "CALENDAR_ALIGNED" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { report_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${report_id}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
