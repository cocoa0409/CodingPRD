              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 99, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_INVALID_STATE (state priority 7 beats capacity priority 16)."

      - name: ppvc_bookingmode_before_seats
