          - entities.TripReservation.fields.subscription_trip_id
          - entities.SubscriptionTrip.fields.status
        distinguishing_aspect: "POST /subscription-trips/{id}/instantiate on an ACTIVE standing trip creates a TripReservation REQUESTED whose subscription_trip_id links back to the standing trip."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Certified rider with an ACTIVE SubscriptionTrip."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Inst R", phone: "555-1034", email: "inst@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /subscription-trips"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, day_of_week: "FRI", pickup_time_utc: "09:00" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /subscription-trips/${sub_id}/instantiate"
              payload: { service_date: "2026-06-05", requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
              captures: { trip_id: "$.data.id" }
          assert:
            - "response.http_status == 201"
            - "TripReservation.${trip_id}.status == REQUESTED"
            - "TripReservation.${trip_id}.subscription_trip_id == ${sub_id}"
