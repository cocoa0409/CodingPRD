  # ===========================================================================
  # §1.3 Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_terms_risk_score_exactly_at_accept_ceiling_blocks_accept
        claim_type: threshold
        grounds:
          - calculations.lc_discrepancy_risk_score
          - validations.priority_18
          - errors[ERR_RECOMMENDATION_NOT_PERMITTED]
          - state_machines.LetterOfCredit.transitions.UNDER_REVIEW_to_AMENDMENT_REQUESTED
        distinguishing_aspect: "Two MAJOR findings on EXPIRY score round(15 * 1.5, 2) = 22.50 each for an exact 45.00 — precisely RISK_ACCEPT_CEILING. ACCEPT requires score < 45.00 so it is refused, while AMEND is still permitted because 45.00 < RISK_REJECT_FLOOR 60.00; the boundary is strict on the accept side and open on the reject side."
        test_recipe:
          setup:
            - "Credit LC-2026-0001 (25000.00, SIGHT) captured by u_ops_alice on a DRAFT order, under review by u_rev_bob with two MAJOR/EXPIRY findings raised."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { line_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0001"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                tolerance_pct: 10.00
                availability: "SIGHT"
                usance_days: 0
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                presentation_period_days: 21
                partial_shipment_allowed: false
                transshipment_allowed: false
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              captures: { review_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/findings"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { code: "EXPIRY_TOO_EARLY", severity: "MAJOR", clause_ref: "EXPIRY", detail: "Expiry date leaves no presentation margin" }
              captures: { finding_1: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/findings"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { code: "EXPIRY_PLACE_MISSING", severity: "MAJOR", clause_ref: "EXPIRY", detail: "Place of expiry is not stated" }
              captures: { finding_2: "$.data.id" }
          trigger:
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "ACCEPT" }
              captures: { err: "$.data.error_id" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "AMEND" }
          assert:
            - "the ACCEPT attempt returns HTTP 409 with data.error_id == \"ERR_RECOMMENDATION_NOT_PERMITTED\" and leaves GET /lc-terms-reviews/${review_id} at status \"DRAFTING\""
            - "the AMEND attempt returns HTTP 200 with data.status == \"SUBMITTED\", data.recommendation == \"AMEND\", data.terms_risk_score == 45.00 and data.finding_count == 2"
            - "GET /letters-of-credit/${lc_id} reports status == \"AMENDMENT_REQUESTED\""
            - "GET /export-orders/${order_id} reports settlement_status == \"UNSECURED\" — only ACCEPT charges the money axis"

      - name: corner_terms_risk_score_at_reject_floor_permits_only_reject
        claim_type: threshold
        grounds:
          - calculations.lc_discrepancy_risk_score
          - validations.priority_18
          - state_machines.LetterOfCredit.transitions.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: "A single CRITICAL finding on AMOUNT scores round(40 * 1.5, 2) = 60.00, exactly RISK_REJECT_FLOOR: AMEND is refused (>= 60.00 permits only REJECT) and only REJECT goes through — proving the reject floor is inclusive while the accept ceiling is exclusive."
        test_recipe:
          setup:
            - "Credit LC-2026-0001 under review by u_rev_bob with one CRITICAL/AMOUNT finding raised."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0001"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                tolerance_pct: 10.00
                availability: "SIGHT"
                usance_days: 0
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                presentation_period_days: 21
                partial_shipment_allowed: false
                transshipment_allowed: false
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              captures: { review_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/findings"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { code: "AMOUNT_MISMATCH", severity: "CRITICAL", clause_ref: "AMOUNT", detail: "Credit amount is below the order value" }
              captures: { finding_1: "$.data.id" }
          trigger:
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "AMEND" }
              captures: { err: "$.data.error_id" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "REJECT" }
          assert:
            - "the AMEND attempt returns HTTP 409 with data.error_id == \"ERR_RECOMMENDATION_NOT_PERMITTED\""
            - "the REJECT attempt returns HTTP 200 with data.terms_risk_score == 60.00 and data.recommendation == \"REJECT\""
            - "GET /letters-of-credit/${lc_id} reports status == \"REJECTED\""
            - "GET /discrepancy-findings?lc_terms_review_id=${review_id} returns total_count == 1 with source == \"TERMS\" and cure_status == \"OPEN\""

      - name: corner_premium_tier_1_upper_bound_inclusive_with_fee_waived
        claim_type: tiered_pricing
        grounds:
          - calculations.insurance_premium_assessment
          - endpoints.POST /credit-insurance-policies
          - entities.CreditInsurancePolicy.fields.exposure_tier
        distinguishing_aspect: "credit_limit_usd exactly 250000.00 with zero prior exposure lands on TIER_1 because the ceiling is inclusive (<=), and deductible 5000.00 >= DEDUCTIBLE_FEE_WAIVER waives the fee entirely: premium_usd == base_premium == 1912.50 with no 250.00 floor added."
        test_recipe:
          setup:
            - "One BBB-rated buyer with no existing policies (aggregate_exposure_usd 0)."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /credit-insurance-policies"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload:
                buyer_id: "${buyer_id}"
                policy_number: "POL-2026-0001"
                credit_limit_usd: 250000.00
                insured_pct: 90.00
                deductible_usd: 5000.00
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2027-06-30T00:00:00Z"
              captures: { policy_id: "$.data.id" }
          assert:
            - "HTTP 201; data.exposure_tier == \"TIER_1\"; data.premium_usd == 1912.50 (round(250000.00 * 90/100 * 0.85/100 * 1.00, 2) + 0.00)"
            - "data.status == \"ACTIVE\"; data.utilized_usd == 0; data.available_limit_usd == 250000.00; data.indemnified_total_usd == 0"
            - "GET /foreign-buyers/${buyer_id} reports aggregate_exposure_usd == 0 — a fresh policy contributes utilized_usd 0, not its limit"

      - name: corner_premium_tier_2_adds_percentage_fee_above_floor
        claim_type: tiered_pricing
        grounds:
          - calculations.insurance_premium_assessment
          - entities.CreditInsurancePolicy.fields.premium_usd
        distinguishing_aspect: "One dollar over the TIER_1 ceiling (250001.00 basis at credit_limit 300000.00) switches the rate to 1.15% AND turns the fee on: the fee is max(250.00, round(300000.00 * 0.10/100, 2) = 300.00) = 300.00, so premium_usd is 3105.00 + 300.00 = 3405.00 — the marginal jump is not proportional to the limit increase."
        test_recipe:
          setup:
            - "One BBB-rated buyer with no existing policies."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /credit-insurance-policies"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload:
                buyer_id: "${buyer_id}"
                policy_number: "POL-2026-0002"
                credit_limit_usd: 300000.00
                insured_pct: 90.00
                deductible_usd: 7500.00
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2027-06-30T00:00:00Z"
              captures: { policy_id: "$.data.id" }
          assert:
            - "HTTP 201; data.exposure_tier == \"TIER_2\" (basis 300000.00 > 250000.00, <= 1000000.00)"
            - "data.premium_usd == 3405.00 — base round(300000.00 * 0.90 * 0.0115 * 1.00, 2) = 3105.00 plus fee 300.00, each rounded before the addition"
            - "data.available_limit_usd == 300000.00 and data.status == \"ACTIVE\" (the deductible 7500.00 does not waive the fee outside TIER_1)"

      - name: corner_settlement_waterfall_uninsured_pushes_remainder_to_credit_note
        claim_type: waterfall_allocation
