  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_sponsor_version_rejects_a_second_advance_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[advance-request-stale-sponsor]
          - validations[priority=31]
          - errors[ERR_STALE_SPONSOR_VERSION]
          - endpoints[POST /sfsp/advance-payments].side_effects
        distinguishing_aspect: "The first advance request itself invalidates the version the client is holding: replaying that same expected_sponsor_version returns 412 ERR_STALE_SPONSOR_VERSION (not 409 or 422), and only a re-read of Sponsor.version lets the second request through — proving the guard reads the live Sponsor.version rather than the value echoed at approval time."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "EXPERIENCED, advance_eligible NONPROFIT sponsor APPROVED, with an APPROVED 2026 budget of 4,500,000 operating and 700,000 admin cents."
            - "The client observed Sponsor.version immediately after approval and holds that value."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
              captures: { sp_ver0: $.data.version }
            - call: "POST /sfsp/sponsor-budgets"
              payload: { sponsor_id: "${sp_id}", program_year: 2026, operating_cost_budget_cents: 5000000, admin_cost_budget_cents: 800000, projected_total_meals: 20000 }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { bud_id: $.data.id }
            - call: "POST /sfsp/sponsor-budgets/${bud_id}/submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsor-budgets/${bud_id}/decision"
              payload: { decision: "APPROVED", approved_operating_cents: 4500000, approved_admin_cents: 700000 }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-06", requested_amount_cents: 1000000, expected_sponsor_version: "${sp_ver0}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { adv1_id: $.data.id }
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-07", requested_amount_cents: 200000, expected_sponsor_version: "${sp_ver0}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver1: $.data.version }
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-07", requested_amount_cents: 200000, expected_sponsor_version: "${sp_ver1}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { adv2_id: $.data.id, adv2_status: $.data.status }
          assert:
            - "Trigger 1 HTTP status == 201 and AdvancePayment.${adv1_id}.status == REQUESTED"
            - "Trigger 2 HTTP status == 412 and ${e_stale} == ERR_STALE_SPONSOR_VERSION"
            - "GET /sfsp/advance-payments?sponsor_id=${sp_id} returns total_count == 1 after trigger 2: the stale request created nothing"
            - "${sp_ver1} == ${sp_ver0} + 1 — exactly one increment, so the rejected request did not bump the version either"
            - "Trigger 4 HTTP status == 201 and ${adv2_status} == REQUESTED, with AdvancePayment.${adv2_id}.request_month == 2026-07"
            - "Sponsor.${sp_id}.version == ${sp_ver0} + 2 after trigger 4"
            - "Sponsor.${sp_id}.advance_paid_cents == 0 throughout: requesting never moves money (only /disburse does)"

      - name: stale_sponsor_version_rejects_claim_creation_after_an_advance
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-create-stale-sponsor]
          - validations[priority=31]
          - errors[ERR_STALE_SPONSOR_VERSION]
          - endpoints[POST /sfsp/meal-claims].side_effects
        distinguishing_aspect: "The second §1.2.1 rule shares Sponsor.version with the first, so a write on the advance path — not on the claim path — is what makes the claim's expected_sponsor_version stale; the claim is refused with 412 even though nothing about the claim month or the sponsor's approval changed, and the identical payload succeeds once the version is refreshed."
        test_recipe:
          setup:
            - "Clock at 2026-07-06T00:00:00Z after an APPROVED sponsor with an APPROVED 2026 budget."
            - "The client read Sponsor.version at approval time and then requested a 2026-06 advance, which incremented it."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
              captures: { sp_ver0: $.data.version }
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-06", requested_amount_cents: 1000000, expected_sponsor_version: "${sp_ver0}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${sp_ver0}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver1: $.data.version }
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${sp_ver1}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { claim_id: $.data.id, claim_status: $.data.status, claim_deadline: $.data.deadline_date }
          assert:
            - "Trigger 1 HTTP status == 412 and ${e_stale} == ERR_STALE_SPONSOR_VERSION"
            - "GET /sfsp/meal-claims?sponsor_id=${sp_id} returns total_count == 0 after trigger 1"
            - "${sp_ver1} == ${sp_ver0} + 1 (the advance request in setup was the only intervening mutation)"
            - "Trigger 3 HTTP status == 201, ${claim_status} == DRAFT, MealClaim.${claim_id}.revision_round == 0"
            - "${claim_deadline} == 2026-07-31 (last calendar day of the month after claim_month 2026-06)"
            - "Sponsor.${sp_id}.version == ${sp_ver0} + 2 after trigger 3"

      - name: sponsor_version_increments_once_per_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Sponsor.common_fields
          - state_machines.Sponsor.transitions[DRAFT->SUBMITTED].side_effects
          - state_machines.Sponsor.transitions[SUBMITTED->APPROVED].side_effects
          - endpoints[POST /sfsp/advance-payments].side_effects
          - endpoints[POST /sfsp/meal-claims].side_effects
        distinguishing_aspect: "Every mutation of the Sponsor advances version by exactly one — creation lands on 1, then submit, approve, advance request and claim creation walk it to 5 — while a pure read (GET) leaves it untouched, so the OCC token is a mutation counter rather than a per-endpoint or per-request counter."
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id, v_create: $.data.version }
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: StateAgencyReviewer
              captures: { v_read: $.data.version }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { v_submit: $.data.version }
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
              captures: { v_approve: $.data.version }
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-06", requested_amount_cents: 500000, expected_sponsor_version: "${v_approve}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: StateAgencyReviewer
              captures: { v_after_adv: $.data.version }
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${v_after_adv}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: StateAgencyReviewer
              captures: { v_after_claim: $.data.version }
          assert:
            - "${v_create} == 1 (common_fields version starts at 1)"
            - "${v_read} == 1 — the intervening GET did not mutate the row"
            - "${v_submit} == 2 and ${v_approve} == 3"
            - "${v_after_adv} == 4 and ${v_after_claim} == 5"
            - "Sponsor.${sp_id}.updated_at strictly increases at each of the four mutations and is unchanged across both GETs"
            - "Sponsor.${sp_id}.application_status == APPROVED and approved_at == 2026-06-01T00:00:00.000Z"

      - name: cascading_side_effect_chain_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Site.transitions[APPROVED->SUSPENDED].side_effects
        excluded_because:
          difficulty_instance: critical_finding_suspends_site_voids_days_and_holds_claim_line
          rationale: "The three-hop chain (visit report -> site suspension -> day voiding -> claim-line hold) is asserted end-to-end, hop by hop, by the named §1.8 instance, including that already-FINALIZED days are left alone."

      - name: cascading_side_effect_ordering_and_partial_failure_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /sfsp/meal-claims/{claim_id}/edit-check].side_effects
        excluded_because:
          difficulty_instance: edit_check_disallowance_flags_site_and_opens_compliance_action
          rationale: "Ordering sensitivity and partial (per-line-item) failure of the edit-check cascade — one line disallowed, the sibling line untouched, the flag threshold opening a CorrectiveAction — is exactly the named §1.8 instance's subject."

      - name: dual_variant_delta_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.claim_reimbursement.variants
        excluded_because:
          difficulty_instance: claim_reimbursement_preliminary_versus_final_variants
          rationale: "Both variants on identical data plus the delta applied when the claim switches from PRELIMINARY to FINAL is the whole point of the named §1.8 instance."

      - name: rate_threshold_boundary_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.admin_cost_cap
          - calculations.holding_time_compliance
        excluded_because:
          difficulty_instance: admin_cap_evaluation_order_keyed_to_operating_reimbursement
          rationale: "The cumulative 20 percent admin threshold is walked at the boundary by the named §1.8 instance, and the instantaneous 240-minute holding threshold is walked at 240/241 minutes by holding_time_240_minutes_compliant_241_breaches; a third probe here would only restate them."

      - name: waterfall_allocation_order_covered_by_difficulty
        claim_type: waterfall_allocation
        grounds:
          - complexity_profile.complexity_layers[waterfall_allocation]
          - calculations.advance_recovery_waterfall
        excluded_because:
          difficulty_instance: advance_recovery_ledger_conserved_across_pay_then_open_revision
          rationale: "Oldest-request_month-first bucket filling, overflow into the next advance and the remainder left as net_payable are all asserted — and then reversed without drift — by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_writing_response_itself
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /sfsp/meal-service-days/{day_id}/finalize].side_effects
          - endpoints[POST /sfsp/meal-claims/{claim_id}/line-items].side_effects
        distinguishing_aspect: "consistency_model is immediate, so no read-after-write lag is tolerated anywhere in the chain: the finalize response already carries the reimbursable counts, the line-item response already carries the aggregated day count and rate value, and an immediately following GET returns byte-identical derived values — no second call or delay is ever needed to see a side effect."
        test_recipe:
          setup:
            - "APPROVED sponsor and APPROVED rural SELF_PREP site with LUNCH approved, operating from 2026-06-08."
            - "One MealServiceDay for 2026-06-08 opened with production_counts { LUNCH: 150 }, 47 first LUNCH meals counted, then CLOSED."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Riverbend Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
            - call: "POST /sfsp/sites/${site_id}/eligibility-determination"
              payload: {}
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/meal-service-days"
              payload: { site_id: "${site_id}", service_date: "2026-06-08", meal_services: [{ meal_type: "LUNCH", planned_meals: 150, service_start: "11:30", service_end: "12:30" }] }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { day_id: $.data.id }
            - call: "POST /sfsp/meal-service-days/${day_id}/open"
              payload: { production_counts: { LUNCH: 150 }, food_received_at: "2026-06-08T10:30:00Z" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${day_id}/meal-counts"
              payload: { meal_type: "LUNCH", first_meals: 47, second_meals: 0, adult_meals: 0 }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${day_id}/close"
              payload: {}
              as: SiteSupervisor
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /sfsp/meal-service-days/${day_id}/finalize"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { fin_status: $.data.status, fin_reimb: $.data.reimbursable_meals, fin_left: $.data.leftover_meals }
            - call: "GET /sfsp/meal-service-days/${day_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { read_status: $.data.status, read_reimb: $.data.reimbursable_meals, read_left: $.data.leftover_meals }
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver: $.data.version }
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${sp_ver}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /sfsp/meal-claims/${claim_id}/line-items"
              payload: { site_id: "${site_id}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { li_id: $.data.id, li_days: $.data.finalized_day_count, li_value: $.data.meals_rate_value_cents, li_rate: $.data.rate_class }
            - call: "GET /sfsp/meal-claims/${claim_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { claim_value: $.data.meals_rate_value_cents }
          assert:
            - "${fin_status} == FINALIZED, ${fin_reimb} == 47 and ${fin_left} == 103 (150 produced - 47 served) in the finalize response itself — no follow-up read required"
            - "${read_status} == ${fin_status}, ${read_reimb} == ${fin_reimb} and ${read_left} == ${fin_left}: the immediate GET agrees field-for-field"
            - "${li_days} == 1, ${li_rate} == RURAL_OR_SELF_PREP and ${li_value} == 22114 in the line-item creation response (47 x 470.50 = 22113.5, round_half_up -> 22114)"
            - "${claim_value} == 22114 on the claim read immediately after the line-item write: the parent aggregate was updated in the same transaction"
            - "ClaimLineItem.${li_id}.finalized_day_count == 1 is already visible on GET /sfsp/claim-line-items/${li_id} issued right after the line-item write"
            - "No assertion in this recipe needs a retry, sleep or second read to become true"
