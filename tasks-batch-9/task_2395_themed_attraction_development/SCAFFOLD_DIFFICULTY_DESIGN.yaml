          One POST /budget-ledger-entries violates priority 8 (category `state`, ERR_PROJECT_FROZEN) and priority 48
          (category `business_fiscal`, ERR_BUDGET_CEILING_EXCEEDED) at once; the response carries ERR_PROJECT_FROZEN with
          HTTP 409 and the ledger gains no row.
