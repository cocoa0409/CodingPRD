# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3017_supermarket_deli_made_order_sub_production
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# Shared fixture catalogue is the one declared at the head of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; every chain here re-creates its own subset
# from empty DB using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    # Table 1 — Entity creation, defaults, computed and system fields
    instances:
      - name: store_create_returns_derived_posture_and_zero_counters
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/deli/stores
          - calculations.store_deli_posture
          - calculations.diffusion_index
        distinguishing_aspect: "A store created with five input fields comes back 201 with posture OPEN, posture_reason OK, protection_index 100, diffusion_index 0, case_on_hand_lbs 0 and ops_run_index 0; none of those seven derived fields is client-supplied."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed startup default 2026-09-01T00:00:00Z and never advanced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/stores"
              payload: { store_number: "101", name: "Store One", deli_case_capacity_lbs: 300, hot_bar_capacity_lbs: 60, sub_station_count: 2 }
              as: PlatformAdmin
              captures: { s1: "$.data.id", s1_v: "$.data.version" }
          trigger:
            - call: "GET /deli/stores/${s1}"
              payload: {}
              as: DeliClerk
          assert:
            - "Store.${s1}.posture == OPEN and Store.${s1}.posture_reason == OK"
            - "Store.${s1}.case_on_hand_lbs == 0 and Store.${s1}.ops_run_index == 0"
            - "Store.${s1}.certified_slicer_operator_count == 0"
            - "Store.${s1}.version == 1 and Store.${s1}.created_at is three-fractional-digit ISO 8601"
            - "POST /deli/posture-report for ${s1} returns protection_index 100 and diffusion_index 0"
      - name: deli_item_defaults_and_bread_link
        claim_type: Defaults
        grounds:
          - entities.DeliItem.fields.servings_per_platter
          - entities.DeliItem.fields.bread_deli_item_id
          - endpoints.POST_/deli/items
        distinguishing_aspect: "Omitting servings_per_platter yields the default 12 on a platter item, and omitting bread_deli_item_id yields null on a non-sub item while accepting it on a sub item."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deli/items"
              payload: { sku: "BREAD-ITA", name: "Italian Roll", category: "BREAD", unit_cost_cents: 120, retail_price_per_lb_cents: 250, case_life_minutes: 720, markdown_window_minutes: 60, allergen_flags: ["WHEAT"], slicer_required: "false" }
              as: PlatformAdmin
              captures: { b1: "$.data.id" }
            - call: "POST /deli/items"
              payload: { sku: "PLAT-CLASSIC", name: "Classic Platter", category: "CATERING_PLATTER", unit_cost_cents: 900, retail_price_per_lb_cents: 1800, case_life_minutes: 480, markdown_window_minutes: 60, allergen_flags: ['MILK', 'WHEAT'], slicer_required: false }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /deli/items"
              payload: { sku: "CC-TURK-01", name: "Turkey Breast", category: "COLD_CUT", unit_cost_cents: 520, retail_price_per_lb_cents: 899, case_life_minutes: 180, markdown_window_minutes: 30, allergen_flags: ['MILK'], slicer_required: true }
              as: PlatformAdmin
              captures: { j2: "$.data.id" }
            - call: "POST /deli/items"
              payload: { sku: "SUBS-001", name: "Classic Sub", category: "SUB", unit_cost_cents: 480, retail_price_per_lb_cents: 799, case_life_minutes: 240, markdown_window_minutes: 30, allergen_flags: ['WHEAT'], slicer_required: false, bread_deli_item_id: "${b1}" }
              as: PlatformAdmin
              captures: { j1: "$.data.id" }
          trigger:
            - call: "GET /deli/items/${p1}"
              payload: {}
              as: DeliClerk
            - call: "GET /deli/items/${j2}"
              payload: {}
              as: DeliClerk
          assert:
            - "DeliItem.${p1}.servings_per_platter == 12, so the platter default was applied"
            - "DeliItem.${j2}.bread_deli_item_id is null and DeliItem.${j1}.bread_deli_item_id == ${b1}"
            - "GET /deli/items filtered by bread_deli_item_id=${b1} returns exactly the one sub item built on that roll"
      - name: production_batch_ignores_client_supplied_computed_fields
        claim_type: Computed Fields
        grounds:
          - entities.ProductionBatch.fields.produced_lbs
