  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: shipper_seal_rejects_a_stale_shipper_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipper-pack-stale-dispatch]
          - endpoints.POST_/shippers/{id}/seal
          - errors[ERR_STALE_VERSION]
          - entities.ColdChainShipper.fields.version
        distinguishing_aspect: "Attaching a carton between the read and the seal advances the shipper's version, so a seal carrying the pre-attach version is refused with 412 ERR_STALE_VERSION while the same seal with the refreshed version succeeds."
        test_recipe:
          setup:
            - "The anchored base fixture with a packed dispatch, a shipper created, one carton attached and a logger reading in place."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
            - *x_order
            - call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
            - *x_disp
            - *x_pack
            - *x_shipper
            - call: "GET /vaccine-distribution/shippers/${ship_id}"
              payload: {}
              as: LogisticsOperator
              captures: { stale_v: "$.data.version" }
            - call: "POST /vaccine-distribution/shippers/${ship_id}/attach-carton"
              payload: { carton_id: "${c01}" }
              as: LogisticsOperator
            - call: "POST /vaccine-distribution/logger-readings"
              payload: { cold_chain_shipper_id: "${ship_id}", recorded_at: "2026-09-01T01:00:00Z", temperature_c: -75, source: "LOGGER" }
              as: LogisticsOperator
            - call: "GET /vaccine-distribution/shippers/${ship_id}"
              payload: {}
              as: LogisticsOperator
              captures: { fresh_v: "$.data.version" }
          trigger:
            - call: "POST /vaccine-distribution/shippers/${ship_id}/seal"
              payload: { expected_shipper_version: "${stale_v}" }
              as: LogisticsOperator
              captures: { error_id: "$.data.error_id" }
            - call: "POST /vaccine-distribution/shippers/${ship_id}/seal"
              payload: { expected_shipper_version: "${fresh_v}" }
              as: LogisticsOperator
              captures: { sealed_status: "$.data.packing_status", sealed_version: "$.data.version" }
          assert:
            - "the stale seal returns 412 with error_id == ERR_STALE_VERSION"
            - "fresh_v is greater than stale_v because attaching the carton and writing the reading each advanced the version"
            - "sealed_status == SEALED and sealed_version == ${fresh_v} + 1"
            - "cold chain status: ColdChainShipper.${ship_id}.packing_completed_at == 2026-09-01T00:00:00Z"

      - name: order_acceptance_rejects_a_stale_window_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[entitlement-acceptance-stale-window]
          - endpoints.POST_/site-orders/{id}/accept
          - errors[ERR_STALE_VERSION]
          - entities.AllocationWindow.fields.version
        distinguishing_aspect: "Accepting one order advances the window version, so a second acceptance still carrying the pre-acceptance version is refused with 412 while the refreshed version succeeds and both acceptances land."
        test_recipe:
          setup:
