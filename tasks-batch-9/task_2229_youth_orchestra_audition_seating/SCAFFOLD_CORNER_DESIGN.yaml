      - name: tuition_account_read_exposes_the_full_balance_identity
        claim_type: computed_read
        grounds:
          - endpoints[GET /tuition-accounts/{accountId}]
          - entities.TuitionAccount.fields.balance_cents
          - calculations.tuition_assessment
        distinguishing_aspect: |
          The account read is a computed projection whose every term is separately
          visible, so balance_cents can be audited from the same payload: 123223 assessed
          - 0 aid_effective + 4500 STRING loan fee - 20000 paid = 107723. The loan fee is
          part of the balance but never part of assessed_cents, and the PRELIMINARY variant
          keeps both discount components at 0.
