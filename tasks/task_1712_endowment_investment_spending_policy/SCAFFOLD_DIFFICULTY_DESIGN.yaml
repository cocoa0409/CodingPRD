          assert:
            - "After Q1 finalize: fund_status == ACTIVE and spending_posture == NORMAL (${pd_status_q1}/${pd_posture_q1})"
            - "After Q2 finalize: fund_status == ACTIVE and spending_posture == SPENDING_SUSPENDED (${pd_status_q2}/${pd_posture_q2}) — posture moved without any lifecycle transition"
            - "After exception approval: fund_status == ACTIVE and spending_posture == EXCEPTION_ACTIVE (${pd_status_q3}/${pd_posture_q3}) — the two dimensions are independently observable"

      - name: distribution_review_loop_cycles_proposed_revision_proposed
        grounds:
          - state_machines.SpendingDistribution.PROPOSED_to_REVISION_REQUESTED
          - state_machines.SpendingDistribution.REVISION_REQUESTED_to_PROPOSED
        distinguishing_aspect: |
          SpendingDistribution's review loop is cyclic (PROPOSED -> REVISION_REQUESTED ->
          PROPOSED -> ... unbounded), a different entity and shape from the Fund parallel
          dimensions: the distribution iterates the loop twice and still reaches APPROVED,
          each pass recomputing amounts.
        test_recipe:
          setup:
            - "Pool with allocation, policy (rate 500, window 4, floor 0, cap 10000, FY2026) ADOPTED, engaged manager, ACTIVE fund FRL with 100000000000 micro-units; Q1 finalized at price 100000 (fund MV 10000000 == HGV, not underwater)"
