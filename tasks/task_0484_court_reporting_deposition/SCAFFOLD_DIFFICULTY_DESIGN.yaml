              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Ups v Xi", docket_number: "D-1014", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep EE", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
