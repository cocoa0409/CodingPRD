          - endpoints[POST /interconnection-applications/{id}/withdraw]
        distinguishing_aspect: "The denormalized site_capital_commitment_usd is recomputed on every source change rather than incremented once: 0 at screen, 360000.00 once the 300 MW application books its study fee, 27305136.00 once the reservation books the network upgrade, and back to 0 when the application is withdrawn."
