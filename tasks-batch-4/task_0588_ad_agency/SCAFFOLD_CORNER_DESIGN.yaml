scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:

      - name: create_client_returns_201_with_system_fields_and_active_status
        claim_type: creation
        grounds:
          - entities.Client.fields.status
          - endpoints[POST /clients]
        distinguishing_aspect: "POST /clients with name/industry/billing_email returns 201, a server-minted UUID id (no type prefix), version 1, and status ACTIVE."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Client.${cli}.status == ACTIVE"
            - "Client.${cli}.version == 1"
            - "Client.${cli}.name == 'Acme Retail'"
            - "response envelope has meta.api_request_id and meta.api_request_timestamp and response_type == 'object'"

      - name: create_client_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /clients without billing_email is rejected with ERR_INVALID_REQUEST (400) and no Client row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_client_invalid_enum_industry_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Client.fields.industry
          - validations[priority=4]
        distinguishing_aspect: "industry = 'PHARMA' is not a member of {RETAIL, FINANCE, CPG, TECH, AUTO} and is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "PHARMA", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_client_with_unknown_uuid_returns_client_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_CLIENT_NOT_FOUND]
        distinguishing_aspect: "GET /clients/{id} with a well-formed but unknown UUID returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CLIENT_NOT_FOUND"

      - name: staff_member_capacity_minutes_default_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.StaffMember.fields.standard_daily_capacity_minutes
          - endpoints[POST /staff-members]
        distinguishing_aspect: "Omitting standard_daily_capacity_minutes yields the declared default 480, not null and not 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st: $.data.id }
          assert:
            - "HTTP status == 201"
            - "StaffMember.${st}.standard_daily_capacity_minutes == 480"

      - name: media_placement_min_dark_days_default_zero_when_omitted
        claim_type: defaults
        grounds:
          - entities.MediaPlacement.fields.min_dark_days
          - endpoints[POST /media-placements]
        distinguishing_aspect: "Omitting min_dark_days yields the declared default 0, which makes back-to-back flights on that placement legal."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /media-placements"
              payload: { publisher_name: "StreamCo", channel: "VIDEO" }
              as: AgencyAdmin
              captures: { pl: $.data.id }
          assert:
            - "HTTP status == 201"
            - "MediaPlacement.${pl}.min_dark_days == 0"

      - name: sow_pinned_rates_survive_a_later_rate_card_edit
        claim_type: computed_fields
        grounds:
          - entities.SOW.fields.pinned_rate_senior_cents_per_hour
          - entities.SOW.fields.pinned_rate_card_version
          - endpoints[PATCH /rate-cards/{id}]
          - state_machines.SOW.DRAFT_to_COUNTERSIGNED
        distinguishing_aspect: |
          Version-pinning on approval: after countersign at RateCard version 1 (SENIOR 20000), a PATCH
          raising the live SENIOR rate to 30000 leaves SOW.pinned_rate_senior_cents_per_hour at 20000,
          and a TimeEntry created afterwards is still priced at 20000 c/h.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; RateCard v1 with SENIOR 20000; SOW countersigned so pinned_rate_senior_cents_per_hour == 20000 and pinned_rate_card_version == 1; campaign IN_FLIGHT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
          trigger:
            - call: "PATCH /rate-cards/${rc}"
              payload: { rate_senior_cents_per_hour: 30000 }
              as: AgencyAdmin
              captures: { rc_v2: $.data.version }
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T09:00:00Z", ended_at: "2026-06-02T10:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te: $.data.id }
          assert:
            - "RateCard.${rc}.rate_senior_cents_per_hour == 30000"
            - "${rc_v2} == 2"
            - "SOW.${sow}.pinned_rate_senior_cents_per_hour == 20000"
            - "SOW.${sow}.pinned_rate_card_version == 1"
            - "TimeEntry.${te}.pinned_rate_cents_per_hour == 20000"
            - "TimeEntry.${te}.estimated_amount_cents == 20000"

      - name: system_fields_are_server_minted_and_client_input_is_ignored
        claim_type: system_fields
        grounds:
          - entities.Retainer.fields.balance_cents
          - entities.Retainer.fields.status
          - endpoints[POST /retainers]
        distinguishing_aspect: "Retainer computed fields (funded_cents, balance_cents, status) are derived from initial_funding_cents; id/created_at/updated_at/version are server-minted with version 1."
        test_recipe:
          setup: ["Clock 2026-06-01; one Client."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 500000, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Retainer.${ret}.funded_cents == 500000"
            - "Retainer.${ret}.balance_cents == 500000"
            - "Retainer.${ret}.status == ACTIVE"
            - "Retainer.${ret}.version == 1"

      - name: campaign_referencing_another_clients_sow_returns_invalid_request
        claim_type: parent_relationships
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
          - entities.Campaign.fields.sow_id
        distinguishing_aspect: "Cross-reference integrity in a flat topology: POST /campaigns with a sow_id whose SOW.client_id differs from the body's client_id is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Two clients, Acme and Borea. A SOW belongs to Borea. The campaign body names Acme as client_id but Borea's SOW as sow_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli_a: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borea Bank", industry: "FINANCE", billing_email: "ap@borea.test" }
              as: AgencyAdmin
              captures: { cli_b: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli_b}", rate_card_id: "${rc}", title: "Borea SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow_b: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { client_id: "${cli_a}", sow_id: "${sow_b}", name: "Mismatch", brief_summary: "Cross-client brief", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: time_entry_ended_at_before_started_at_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.TimeEntry.fields.ended_at
          - validations[priority=4]
        distinguishing_aspect: "ended_at <= started_at violates the declared constraint and is rejected with ERR_INVALID_REQUEST (400) before any overlap or cap check runs."
        test_recipe:
          setup: ["Clock 2026-06-01; Acme; SOW countersigned; campaign IN_FLIGHT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
          trigger:
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T12:00:00Z", ended_at: "2026-06-02T09:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: deliverable_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Deliverable.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "APPROVE is only declared from SUBMITTED; calling it on a DRAFT deliverable returns ERR_INVALID_STATE (409) and leaves approved_asset_version null."
        test_recipe:
          setup: ["Clock 2026-06-01; Acme; SOW countersigned; campaign IN_FLIGHT; one Deliverable still in DRAFT (never submitted)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Kai Osei", grade: "DIRECTOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 9000 }
              as: AgencyAdmin
              captures: { st_kai: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /deliverables"
              payload: { campaign_id: "${camp}", title: "Hero film 30s cut" }
              as: CreativeLead
              as_user_id: "${st_kai}"
              captures: { dlv: $.data.id }
          trigger:
            - call: "POST /deliverables/${dlv}/approve"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "Deliverable.${dlv}.status == DRAFT"
            - "Deliverable.${dlv}.current_asset_version == 0"
            - "Deliverable.${dlv}.approved_asset_version == null"
            - "Campaign.${camp}.status == IN_FLIGHT"

      - name: deliverable_fourth_request_changes_hits_revision_limit
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=16]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
          - entities.Deliverable.fields.revision_round
        distinguishing_aspect: "Three request-changes rounds are legal (revision_round reaches 3); the fourth is rejected with ERR_REVISION_LIMIT_EXCEEDED (422) and revision_round stays 3."
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; SOW countersigned; campaign IN_FLIGHT."
            - "Deliverable cycled through three submit/request-changes rounds: revision_round == 3, current_asset_version == 4, status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Kai Osei", grade: "DIRECTOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 9000 }
              as: AgencyAdmin
              captures: { st_kai: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /deliverables"
              payload: { campaign_id: "${camp}", title: "Hero film 30s cut" }
              as: CreativeLead
              as_user_id: "${st_kai}"
              captures: { dlv: $.data.id }
            - call: "POST /deliverables/${dlv}/submit"
              payload: {}
              as: CreativeLead
              as_user_id: "${st_kai}"
            - call: "POST /deliverables/${dlv}/request-changes"
              payload: { feedback: "Round 1" }
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /deliverables/${dlv}/submit"
              payload: {}
              as: CreativeLead
              as_user_id: "${st_kai}"
            - call: "POST /deliverables/${dlv}/request-changes"
              payload: { feedback: "Round 2" }
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /deliverables/${dlv}/submit"
              payload: {}
              as: CreativeLead
              as_user_id: "${st_kai}"
            - call: "POST /deliverables/${dlv}/request-changes"
              payload: { feedback: "Round 3" }
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /deliverables/${dlv}/submit"
              payload: {}
              as: CreativeLead
              as_user_id: "${st_kai}"
          trigger:
            - call: "POST /deliverables/${dlv}/request-changes"
              payload: { feedback: "Round 4" }
              as: ClientReviewer
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_REVISION_LIMIT_EXCEEDED"
            - "Deliverable.${dlv}.revision_round == 3"
            - "Deliverable.${dlv}.current_asset_version == 4"
            - "Deliverable.${dlv}.status == SUBMITTED"
            - "Deliverable.${dlv}.last_feedback == 'Round 3'"

      - name: campaign_launch_with_draft_sow_returns_sow_not_countersigned
        claim_type: guarded_transition
        grounds:
          - validations[priority=12]
          - state_machines.Campaign.DRAFT_to_IN_FLIGHT
          - errors[ERR_SOW_NOT_COUNTERSIGNED]
