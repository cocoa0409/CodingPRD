        claim_type: Computed read
        grounds: [entities.ClearanceRecord.fields.cleared, calculations.surgical_risk_score]
        distinguishing_aspect: "Issuing a STANDARD clearance for a MEDICAL-tier patient (score 70) yields cleared=false because STANDARD does not satisfy MEDICAL."
        test_recipe:
          setup: ["A MEDICAL-tier patient (asa 3, smoker, score 70)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Med M", date_of_birth: "1986-01-01", age_years: 40, bmi: 25, asa_class: 3, smoker: true }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
