scenario: |
  SNAP/EBT Food Stamps: household composition and income, net income calculation,
  monthly allotment, EBT card issuance, eligible items, fraud monitoring, ABAWD
  work training waiver, Emergency Allotment.

domain_name: snap-ebt-food-stamps
api_prefix: /households

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - pagination_with_filtering
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: system
        description: Public-facing case identifier (e.g., "SNAP-2026-000001"); unique
        constraints: pattern "SNAP-YYYY-NNNNNN", server-generated, immutable
      - name: state_code
        type: enum
        source: input
        description: Two-letter US state code where the household resides
        constraints: enum [CA, TX, NY, FL, IL, PA, OH, GA, NC, MI]
      - name: address_zip
        type: string
        source: input
        description: 5-digit residential ZIP code
        constraints: exactly 5 digits
      - name: household_size
        type: integer
        source: computed
        description: Count of Members with status=ACTIVE belonging to this household
        constraints: ">= 1, recomputed on any Member status change"
      - name: gross_monthly_income_cents
        type: integer
        source: computed
        description: Sum of Member.earned_income_cents + Member.unearned_income_cents over Members with status=ACTIVE
        constraints: ">= 0, recomputed on Member create/update/deactivate"
      - name: net_monthly_income_cents
        type: integer
        source: computed
        description: Result of calc_net_monthly_income; recomputed whenever gross_monthly_income_cents, expenses, or household_size change
        constraints: ">= 0 (floored at 0)"
      - name: monthly_allotment_cents
        type: integer
        source: computed
        description: Result of calc_monthly_allotment; the base SNAP benefit before any Emergency Allotment supplement
        constraints: ">= 0"
      - name: certification_status
        type: enum
        source: computed
        description: Reflects the latest Application's state for this household; null until first application is filed
        constraints: enum [null, PENDING, APPROVED, DENIED, CLOSED]
      - name: certification_period_end
        type: datetime
        source: computed
        description: ISO8601 UTC; APPROVED application's certification_period_end_at
        constraints: nullable; set on APPROVE transition
      - name: dependent_care_expense_cents
        type: integer
        source: input
        description: Monthly out-of-pocket dependent-care cost paid by household, used in net income deductions
        default: 0
        constraints: ">= 0"
      - name: shelter_expense_cents
        type: integer
        source: input
        description: Monthly rent/mortgage + utilities total used in excess-shelter deduction
        default: 0
        constraints: ">= 0"
      - name: has_elderly_or_disabled
        type: boolean
        source: computed
        description: True if any active Member has age >= 60 or is_disabled = true
        default: false
        constraints: recomputed on Member changes

  - name: Member
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK to Household.id
        constraints: required; must reference existing Household
      - name: full_name
        type: string
        source: input
        description: Member legal name
        constraints: 1..100 chars
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO8601 UTC date; used for age and ABAWD eligibility
        constraints: required
      - name: is_disabled
        type: boolean
        source: input
        description: Disability flag affecting elderly/disabled deductions and ABAWD exemption
        default: false
      - name: is_pregnant
        type: boolean
        source: input
        description: Pregnancy flag (ABAWD exemption category)
        default: false
      - name: earned_income_cents
        type: integer
        source: input
        description: Member's monthly earned income (wages); used in 20% earned-income deduction
        default: 0
        constraints: ">= 0"
      - name: unearned_income_cents
        type: integer
        source: input
        description: Member's monthly unearned income (SSI, child support, etc.)
        default: 0
        constraints: ">= 0"
      - name: abawd_status
        type: enum
        source: computed
        description: Set by calc_abawd_status; drives ABAWD work-training and time-limit
        constraints: enum [NOT_ABAWD, ABAWD_EXEMPT, ABAWD_WAIVED, ABAWD_SUBJECT]
      - name: abawd_countable_months_used
        type: integer
        source: computed
        description: Count of countable months consumed in the current 36-month period
        default: 0
        constraints: 0..3
      - name: status
        type: enum
        source: computed
        description: Lifecycle on the Household roster
        constraints: enum [ACTIVE, REMOVED]

  - name: Application
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK to Household.id
        constraints: required
      - name: state
        type: enum
        source: computed
        description: Application lifecycle
        constraints: enum [DRAFT, SUBMITTED, PENDING_INTERVIEW, INTERVIEW_DONE, APPROVED, DENIED, CLOSED]
      - name: submitted_at
        type: datetime
        source: system
        description: When the application moved DRAFT->SUBMITTED
        constraints: nullable
      - name: interview_completed_at
        type: datetime
        source: system
        description: When PENDING_INTERVIEW->INTERVIEW_DONE fired
        constraints: nullable
      - name: decision_at
        type: datetime
        source: system
        description: When APPROVED or DENIED was set
        constraints: nullable
      - name: certification_period_start_at
        type: datetime
        source: system
        description: Start of approved certification period (= decision_at)
        constraints: nullable; set on APPROVE
      - name: certification_period_end_at
        type: datetime
        source: system
        description: End of approved certification period (= decision_at + 12 months exact)
        constraints: nullable; set on APPROVE
      - name: denial_reason
        type: enum
        source: input
        description: Required when DENIED is set by a caseworker
        constraints: enum [INCOME_OVER_LIMIT, INCOMPLETE_INFO, IDENTITY_FAILURE, OTHER]; nullable

  - name: EbtCard
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK to Household.id (a Household may have at most one ACTIVE card at a time)
        constraints: required
      - name: card_number_last4
        type: string
        source: system
        description: Last 4 digits of EBT card PAN (no PAN stored)
        constraints: exactly 4 digits
      - name: status
        type: enum
        source: computed
        description: Card lifecycle
        constraints: enum [ISSUED, ACTIVE, SUSPENDED, REPLACED, CLOSED]
      - name: issued_at
        type: datetime
        source: system
        description: Set on POST issuance
      - name: activated_at
        type: datetime
        source: system
        description: Set on ISSUED->ACTIVE transition
        constraints: nullable
      - name: balance_cents
        type: integer
        source: computed
        description: Current spendable balance; recomputed from BenefitLedger entries
        constraints: ">= 0"
      - name: replaced_by_card_id
        type: string
        source: system
        description: When REPLACED, points to the new card; nullable otherwise

  - name: BenefitLedger
    parent: Household
    common_fields: false
    fields:
      - name: household_id
        type: string
        source: input
        description: FK to Household.id
      - name: card_id
        type: string
        source: system
        description: FK to EbtCard.id (the card the entry settles to)
      - name: entry_type
        type: enum
        source: input
        description: Ledger entry kind
        constraints: enum [REGULAR_ALLOTMENT, EMERGENCY_ALLOTMENT, PURCHASE, REFUND, ADJUSTMENT]
      - name: amount_cents
        type: integer
        source: input
        description: Signed amount; credits positive, purchases negative
      - name: benefit_month
        type: string
        source: input
        description: YYYY-MM string the entry is attributed to
        constraints: exactly "YYYY-MM"
      - name: reference_id
        type: string
        source: input
        description: Linked Transaction.id (for PURCHASE/REFUND) or null
        constraints: nullable

  - name: Transaction
    parent: EbtCard
    common_fields: false
    fields:
      - name: card_id
        type: string
        source: input
        description: FK to EbtCard.id
      - name: merchant_id
        type: string
        source: input
        description: FK to Merchant.id
      - name: requested_amount_cents
        type: integer
        source: input
        description: Total cart amount the merchant attempts to charge
        constraints: ">= 1"
      - name: eligible_amount_cents
        type: integer
        source: computed
        description: Portion of the cart actually approved (eligible items only)
        constraints: ">= 0"
      - name: ineligible_amount_cents
        type: integer
        source: computed
        description: requested_amount_cents - eligible_amount_cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Transaction outcome
        constraints: enum [PENDING, APPROVED, DECLINED, REVERSED]
      - name: decline_reason
        type: enum
        source: computed
        description: Why declined; null otherwise
        constraints: "enum [null, INSUFFICIENT_FUNDS, CARD_NOT_ACTIVE, MERCHANT_NOT_AUTHORIZED, ALL_ITEMS_INELIGIBLE]"
      - name: line_items
        type: array
        source: input
        description: "Array of { item_category: enum, unit_price_cents: int, quantity: int }"
        constraints: "1..50 items; item_category enum [STAPLE, PRODUCE, DAIRY, MEAT, BREAD, COLD_PREPARED, HOT_PREPARED, NON_FOOD, ALCOHOL, TOBACCO]"
      - name: posted_at
        type: datetime
        source: system
        description: Set when status leaves PENDING

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Merchant DBA name
        constraints: 1..100 chars
      - name: snap_authorization_status
        type: enum
        source: computed
        description: USDA SNAP retailer authorization status
        constraints: enum [AUTHORIZED, SUSPENDED, REVOKED]
      - name: authorization_expires_at
        type: datetime
        source: input
        description: Date the SNAP authorization expires; if past current_clock, authorization is invalid
      - name: hot_food_pilot
        type: boolean
        source: input
        description: True if merchant is in the SNAP Restaurant Meals Program (allows HOT_PREPARED for elderly/disabled/homeless households)
        default: false

  - name: FraudCase
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK to Household.id
      - name: state
        type: enum
        source: computed
        description: Fraud-case lifecycle (cyclic — can return to OPEN on appeal)
        constraints: enum [OPEN, UNDER_REVIEW, SUBSTANTIATED, UNFOUNDED, APPEAL_PENDING, CLOSED]
      - name: trigger_reason
        type: enum
        source: input
        description: Why the case was opened
        constraints: enum [TRAFFICKING_PATTERN, DUPLICATE_BENEFITS, IDENTITY_MISMATCH, MANUAL_REPORT]
      - name: suspicious_score
        type: number
        source: computed
        description: Output of calc_fraud_score; 0.0..1.0
        constraints: 0.0..1.0, two decimal places, half_up
      - name: investigator_user_id
        type: string
        source: input
        description: Opaque FraudInvestigator user id assigned to this case
        constraints: nullable until assigned
      - name: opened_at
        type: datetime
        source: system
      - name: closed_at
        type: datetime
        source: system
        constraints: nullable

  - name: AbawdWaiver
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK to Member.id
      - name: waiver_kind
        type: enum
        source: input
        description: Type of ABAWD exemption/waiver
        constraints: enum [WORK_TRAINING_ENROLLED, MEDICALLY_UNFIT, CAREGIVER, AREA_HIGH_UNEMPLOYMENT]
      - name: state
        type: enum
        source: computed
        description: Waiver lifecycle
        constraints: enum [REQUESTED, APPROVED, REJECTED, EXPIRED]
      - name: effective_from
        type: datetime
        source: input
        description: Date the waiver begins
      - name: effective_to
        type: datetime
        source: input
        description: Date the waiver ends; must be > effective_from and within 12 months
      - name: decision_reason
        type: enum
        source: input
        description: Required on REJECTED
        constraints: enum [INSUFFICIENT_DOCS, INELIGIBLE_CATEGORY, OTHER]; nullable

  - name: EmergencyAllotment
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: enum
        source: input
        description: State this declaration applies to
        constraints: enum [CA, TX, NY, FL, IL, PA, OH, GA, NC, MI]
      - name: benefit_month
        type: string
        source: input
        description: YYYY-MM the declaration funds
        constraints: 'pattern "YYYY-MM"'
      - name: state
        type: enum
        source: computed
        description: Declaration lifecycle
        constraints: enum [DRAFT, DECLARED, DISBURSED, CANCELLED]
      - name: max_allotment_table_version
        type: integer
        source: input
        description: Which max_allotment table (by household_size) this declaration uses
        constraints: ">= 1"
      - name: declared_at
        type: datetime
        source: system
      - name: disbursed_at
        type: datetime
        source: system
        constraints: nullable
      - name: cancelled_at
        type: datetime
        source: system
        constraints: nullable

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: Current server clock (only ever one row, id=GLOBAL_CLOCK); advanced via POST /_clock/advance
        constraints: ISO8601 UTC; monotonic non-decreasing

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /households/{id}/applications/{appId}/submit"
        actor: Applicant
        preconditions:
          - "Household has >= 1 Member with status=ACTIVE"
          - "Household.address_zip and Household.state_code are present"
        side_effects:
          - "Application.submitted_at = Clock.now"
          - "Household.certification_status = PENDING"

      - from: SUBMITTED
        to: PENDING_INTERVIEW
        trigger: "POST /households/{id}/applications/{appId}/schedule-interview"
        actor: Caseworker
        preconditions:
          - "Application.state = SUBMITTED"
        side_effects: []

      - from: PENDING_INTERVIEW
        to: INTERVIEW_DONE
        trigger: "POST /households/{id}/applications/{appId}/complete-interview"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "Application.interview_completed_at = Clock.now"

      - from: INTERVIEW_DONE
        to: APPROVED
        trigger: "POST /households/{id}/applications/{appId}/approve"
        actor: Caseworker
        preconditions:
          - "Application.interview_completed_at is not null"
          - "Household.net_monthly_income_cents <= NET_INCOME_LIMIT(household_size)"
          - "Household.gross_monthly_income_cents <= GROSS_INCOME_LIMIT(household_size) OR Household.has_elderly_or_disabled = true"
        side_effects:
          - "Application.decision_at = Clock.now"
          - "Application.certification_period_start_at = Clock.now"
          - "Application.certification_period_end_at = Clock.now + 12 months exact"
          - "Household.certification_status = APPROVED"
          - "Household.certification_period_end = certification_period_end_at"
          - "Recompute Household.monthly_allotment_cents via calc_monthly_allotment"
          - "Auto-create EbtCard with status=ISSUED if no ACTIVE card exists (transitive: BenefitLedger seed REGULAR_ALLOTMENT for current benefit_month -> EbtCard.balance_cents recomputed)"
        note: |
          Cascade chain depth 3:
          (1) Application APPROVED
          -> (2) EbtCard auto-issued (ISSUED)
          -> (3) BenefitLedger REGULAR_ALLOTMENT credited for current benefit_month
          -> (4) EbtCard.balance_cents recomputed.

      - from: INTERVIEW_DONE
        to: DENIED
        trigger: "POST /households/{id}/applications/{appId}/deny"
        actor: Caseworker
        preconditions:
          - "denial_reason is set"
        side_effects:
          - "Application.decision_at = Clock.now"
          - "Household.certification_status = DENIED"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /households/{id}/applications/{appId}/return-for-correction"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "Application.submitted_at = null"
          - "Household.certification_status = null IF no other approved Application"
        note: "Reverts to DRAFT for correction; cyclic branch."

      - from: APPROVED
        to: CLOSED
        trigger: "POST /households/{id}/applications/{appId}/close OR auto when Clock.now >= certification_period_end_at"
        actor: Caseworker | system
        preconditions: []
        side_effects:
          - "Household.certification_status = CLOSED"
          - "Active EbtCard transitions ACTIVE->CLOSED (cascade)"

  - entity: EbtCard
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /households/{id}/cards/{cardId}/activate"
        actor: HouseholdHead
        preconditions:
          - "Household.certification_status = APPROVED"
        side_effects:
          - "EbtCard.activated_at = Clock.now"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /households/{id}/cards/{cardId}/suspend"
        actor: Caseworker
        preconditions:
          - "No open FraudCase requirement — suspending is allowed even without one"
        side_effects:
          - "Subsequent purchase attempts return ERR_CARD_NOT_ACTIVE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /households/{id}/cards/{cardId}/resume"
        actor: Caseworker
        preconditions:
          - "No FraudCase in state=SUBSTANTIATED for this Household"
        side_effects: []

      - from: ACTIVE
        to: REPLACED
        trigger: "POST /households/{id}/cards/{cardId}/replace"
        actor: HouseholdHead | Caseworker
        preconditions: []
        side_effects:
          - "A new EbtCard row is created with status=ISSUED (cascade: old.replaced_by_card_id = new.id, new.balance_cents = old.balance_cents AT replacement instant; transfer is logged as ADJUSTMENT entries: -old.balance_cents on old, +old.balance_cents on new)"
        note: |
          Cascade chain depth 3:
          (1) Replace REPLACE old card
          -> (2) New EbtCard ISSUED
          -> (3) BenefitLedger ADJUSTMENT pair posted
          -> (4) New EbtCard.balance_cents recomputed.

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /households/{id}/cards/{cardId}/close OR cascade from Application CLOSED"
        actor: Caseworker | system
        preconditions: []
        side_effects:
          - "EbtCard.balance_cents forfeited to 0 via ADJUSTMENT entry"

  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /fraud-cases/{caseId}/assign"
        actor: FraudInvestigator
        preconditions:
          - "investigator_user_id is supplied"
        side_effects: []

      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /fraud-cases/{caseId}/substantiate"
        actor: FraudInvestigator
        preconditions:
          - "suspicious_score >= 0.70"
        side_effects:
          - "All ACTIVE EbtCard rows for the household transition ACTIVE->SUSPENDED (cascade)"
          - "Household becomes ineligible for new Emergency Allotment disbursements until appeal_pending or unfounded"

      - from: UNDER_REVIEW
        to: UNFOUNDED
        trigger: "POST /fraud-cases/{caseId}/dismiss"
        actor: FraudInvestigator
        preconditions: []
        side_effects: []

      - from: SUBSTANTIATED
        to: APPEAL_PENDING
        trigger: "POST /fraud-cases/{caseId}/appeal"
        actor: HouseholdHead
        preconditions:
          - "Clock.now <= opened_at + 90 days"
        side_effects: []

      - from: APPEAL_PENDING
        to: OPEN
        trigger: "POST /fraud-cases/{caseId}/reopen-investigation"
        actor: FraudInvestigator
        preconditions: []
        side_effects: []
        note: "Cyclic: appeal reverts case to OPEN for re-investigation."

      - from: APPEAL_PENDING
        to: UNFOUNDED
        trigger: "POST /fraud-cases/{caseId}/uphold-appeal"
        actor: FraudInvestigator
        preconditions: []
        side_effects:
          - "Previously suspended EbtCards transition SUSPENDED->ACTIVE (cascade)"

      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /fraud-cases/{caseId}/close"
        actor: FraudInvestigator
        preconditions: []
        side_effects:
          - "FraudCase.closed_at = Clock.now"

      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /fraud-cases/{caseId}/close"
        actor: FraudInvestigator
        preconditions:
          - "Clock.now > opened_at + 90 days (appeal window expired)"
        side_effects:
          - "FraudCase.closed_at = Clock.now"

  - entity: AbawdWaiver
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /households/{id}/members/{memberId}/abawd-waivers/{waiverId}/approve"
        actor: Caseworker
        preconditions:
          - "Member age between 18 and 49 inclusive at effective_from"
          - "Member.is_disabled = false"
          - "Member.is_pregnant = false"
          - "Household has no Member under age 18"
        side_effects:
          - "Member.abawd_status = ABAWD_WAIVED"
          - "Recompute Member.abawd_countable_months_used (waived months don't count)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /households/{id}/members/{memberId}/abawd-waivers/{waiverId}/reject"
        actor: Caseworker
        preconditions:
          - "decision_reason is set"
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system, when Clock.now >= effective_to"
        actor: system
        preconditions: []
        side_effects:
          - "Member.abawd_status recomputed (likely returns to ABAWD_SUBJECT)"
        note: "Time-triggered transition reachable via POST /_clock/advance + GET /households/{id}/members/{memberId} (lazy recompute on read) or POST /_sweep/run."

  - entity: EmergencyAllotment
    initial_state: DRAFT
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DECLARED
        trigger: "POST /emergency-allotments/{eaId}/declare"
        actor: StateAdministrator
        preconditions:
          - "max_allotment_table_version in {1, 2, 3}"
        side_effects:
          - "EmergencyAllotment.declared_at = Clock.now"

      - from: DECLARED
        to: DISBURSED
        trigger: "POST /emergency-allotments/{eaId}/disburse"
        actor: StateAdministrator
        preconditions:
          - "EmergencyAllotment.state = DECLARED"
        side_effects:
          - "For every Household with state_code=EmergencyAllotment.state_code and certification_status=APPROVED and no SUBSTANTIATED FraudCase: post one BenefitLedger entry entry_type=EMERGENCY_ALLOTMENT, amount_cents = calc_emergency_allotment(household), benefit_month = EmergencyAllotment.benefit_month (cascade)"
          - "EmergencyAllotment.disbursed_at = Clock.now"
        note: |
          Cascade depth 3:
          (1) Disburse EA
          -> (2) BenefitLedger EMERGENCY_ALLOTMENT credits posted to each qualifying household
          -> (3) Each affected EbtCard.balance_cents recomputed.

      - from: DECLARED
        to: CANCELLED
        trigger: "POST /emergency-allotments/{eaId}/cancel"
        actor: StateAdministrator
        preconditions:
          - "EmergencyAllotment.disbursed_at is null"
        side_effects:
          - "EmergencyAllotment.cancelled_at = Clock.now"

  - entity: Transaction
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED, REVERSED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /transactions (auto-settled inline)"
        actor: Merchant
        preconditions:
          - "EbtCard.status = ACTIVE"
          - "Merchant.snap_authorization_status = AUTHORIZED AND Merchant.authorization_expires_at > Clock.now"
          - "calc_eligible_amount > 0"
          - "EbtCard.balance_cents >= calc_eligible_amount"
        side_effects:
          - "BenefitLedger PURCHASE entry amount = -eligible_amount_cents posted to current benefit_month"
          - "EbtCard.balance_cents recomputed"
          - "Transaction.posted_at = Clock.now"

      - from: PENDING
        to: DECLINED
        trigger: "POST /transactions (auto on validation failure)"
        actor: Merchant
        preconditions:
          - "Any one of: EbtCard not ACTIVE, Merchant not AUTHORIZED, eligible_amount = 0, balance < eligible_amount"
        side_effects:
          - "Transaction.decline_reason set per the failing check"
          - "Transaction.posted_at = Clock.now"

      - from: APPROVED
        to: REVERSED
        trigger: "POST /transactions/{txId}/reverse"
        actor: Merchant
        preconditions:
          - "Clock.now <= Transaction.posted_at + 24 hours"
        side_effects:
          - "BenefitLedger REFUND entry amount = +eligible_amount_cents posted"
          - "EbtCard.balance_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two purchase attempts on the same EbtCard race when only one can be covered by the remaining balance"
    guarantee: "At most one transaction is APPROVED; the loser whose balance check now fails is DECLINED with INSUFFICIENT_FUNDS"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    serialization: "Per-card transaction serialization; first writer that posts the BenefitLedger PURCHASE wins"

  - scenario: "Caseworker approves Application while another caseworker denies the same Application"
    guarantee: "Exactly one transition succeeds; the loser gets ERR_INVALID_STATE because the application is no longer in INTERVIEW_DONE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.state"

  - scenario: "Two parallel calls attempt to issue a new EbtCard for the same Household when none is active"
    guarantee: "At most one ACTIVE/ISSUED EbtCard per Household at any time; the second issuance is rejected"
    error_id: ERR_CARD_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on EbtCard creation per household_id where status in {ISSUED, ACTIVE, SUSPENDED}"

  - scenario: "Two state administrators try to disburse the same Emergency Allotment declaration simultaneously"
    guarantee: "Exactly one disbursement succeeds; second is rejected"
    error_id: ERR_EA_ALREADY_DISBURSED
    http_status: 409
    serialization: "First-writer-wins on EmergencyAllotment.state DECLARED->DISBURSED"

  - scenario: "Optimistic concurrency mismatch on Household PATCH (e.g., expense update races with cert renewal)"
    guarantee: "Loser receives a version-conflict error; client must re-read and retry"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version field compare-and-swap"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_net_monthly_income
    trigger: "On every Household or Member mutation that changes income, expenses, household_size, or has_elderly_or_disabled; and inline at Application APPROVE precondition evaluation"
    algorithm: tiered_pricing
    formula: |
      # All amounts are integer cents. Rounding: per-step round_half_up to whole cents.
      # Step order is fixed and load-bearing — step rounding must be applied BEFORE summing
      # for the excess-shelter test (see Rule 2 mode (b)).

      gross = sum(member.earned_income_cents + member.unearned_income_cents
                  for member in active_members)
      earned = sum(member.earned_income_cents for member in active_members)

      # 1) Standard deduction by household_size
      standard_deduction = STANDARD_DEDUCTION_TABLE[min(household_size, 6)]

      # 2) Earned income deduction = 20% of earned income, round_half_up per-step
      earned_income_deduction = round_half_up(earned * 0.20)

      # 3) Dependent care deduction (capped at DEPENDENT_CARE_CAP_CENTS per household)
      dependent_care_deduction = min(dependent_care_expense_cents, DEPENDENT_CARE_CAP_CENTS)

      # 4) Adjusted income after non-shelter deductions
      adjusted_income = max(0, gross - standard_deduction - earned_income_deduction - dependent_care_deduction)

      # 5) Excess shelter test — per-step rounding pinned (round each subterm independently, then subtract)
      half_adjusted = round_half_up(adjusted_income / 2)
      excess_shelter_raw = shelter_expense_cents - half_adjusted
      shelter_deduction_uncapped = max(0, excess_shelter_raw)
      if has_elderly_or_disabled:
          shelter_deduction = shelter_deduction_uncapped       # uncapped for elderly/disabled
      else:
          shelter_deduction = min(shelter_deduction_uncapped, EXCESS_SHELTER_CAP_CENTS)

      net = max(0, adjusted_income - shelter_deduction)
      return net
    input_set: "All Members with status=ACTIVE belonging to this Household."
    constants:
      STANDARD_DEDUCTION_TABLE: {1: 19300, 2: 19300, 3: 19300, 4: 20600, 5: 24100, 6: 27600}  # cents
      DEPENDENT_CARE_CAP_CENTS: 25000
      EXCESS_SHELTER_CAP_CENTS: 67200
    precision: "round_half_up at every numbered step; final value is integer cents"
    variants:
      - name: standard_household
        when: "has_elderly_or_disabled = false"
        difference: "shelter_deduction is capped at EXCESS_SHELTER_CAP_CENTS"
      - name: elderly_or_disabled_household
        when: "has_elderly_or_disabled = true"
        difference: "shelter_deduction is uncapped — produces a strictly different (lower) net for households where shelter_deduction_uncapped > EXCESS_SHELTER_CAP_CENTS"

  - name: calc_monthly_allotment
    trigger: "On Application APPROVE; on every recompute of Household.net_monthly_income_cents; on Household.household_size change"
    algorithm: forward_looking
    formula: |
      # Maximum allotment for the household_size bracket.
      max_allotment = MAX_ALLOTMENT_TABLE[min(household_size, 6)]

      # SNAP rule: expected contribution = 30% of net income, round_half_up.
      expected_contribution = round_half_up(net_monthly_income_cents * 0.30)

      raw_allotment = max(0, max_allotment - expected_contribution)

      # Minimum benefit floor applies for household_size in {1, 2} only.
      if household_size <= 2 and raw_allotment < MINIMUM_BENEFIT_CENTS:
          allotment = MINIMUM_BENEFIT_CENTS
      else:
          allotment = raw_allotment

      return allotment
    input_set: "Household.net_monthly_income_cents, Household.household_size."
    constants:
      MAX_ALLOTMENT_TABLE: {1: 29100, 2: 53500, 3: 76600, 4: 97300, 5: 115500, 6: 138600}  # cents
      MINIMUM_BENEFIT_CENTS: 2300
      GROSS_INCOME_LIMIT_TABLE: {1: 162200, 2: 218800, 3: 275400, 4: 332000, 5: 388600, 6: 445200}  # 130% FPL, cents
      NET_INCOME_LIMIT_TABLE:   {1: 124800, 2: 168300, 3: 211800, 4: 255400, 5: 298900, 6: 342400}  # 100% FPL, cents
    precision: "round_half_up on the 30% multiplication; result is integer cents"
    variants:
      - name: standard_allotment
        when: "household has only the regular monthly disbursement; no active EA declaration applies"
        difference: "monthly_allotment_cents only"
      - name: with_emergency_allotment_supplement
        when: "An EmergencyAllotment for the household's state_code and current benefit_month is DISBURSED"
        difference: |
          Effective total disbursement = monthly_allotment_cents + calc_emergency_allotment(household).
          The two variants differ in TOTAL benefit received for the SAME inputs because the
          EA supplement uses MAX_ALLOTMENT(household_size) - regular_allotment as the top-up,
          not a flat percentage — see calc_emergency_allotment.

  - name: calc_emergency_allotment
    trigger: "On EmergencyAllotment DECLARED->DISBURSED; once per qualifying Household"
    algorithm: threshold
    formula: |
      # Top-up rule (post-COVID rebased): the household receives the difference
      # between the bracket maximum and its regular allotment, but never less than
      # EA_FLOOR_CENTS while the declaration is active.
      max_allotment = MAX_ALLOTMENT_TABLE[min(household_size, 6)]
      top_up = max(0, max_allotment - monthly_allotment_cents)
      ea_amount = max(top_up, EA_FLOOR_CENTS)
      return ea_amount
    input_set: "Each Household with state_code=EA.state_code, certification_status=APPROVED, and no SUBSTANTIATED FraudCase."
    constants:
      MAX_ALLOTMENT_TABLE: {1: 29100, 2: 53500, 3: 76600, 4: 97300, 5: 115500, 6: 138600}
      EA_FLOOR_CENTS: 9500
    precision: "integer cents; no rounding step needed"
    variants: []

  - name: calc_eligible_amount
    trigger: "On every POST /transactions during PENDING resolution"
    algorithm: aggregation
    formula: |
      # Eligibility evaluation order is pinned:
      # Step 1: Filter out ineligible categories outright (NON_FOOD, ALCOHOL, TOBACCO).
      # Step 2: HOT_PREPARED and COLD_PREPARED categories are eligible ONLY IF
      #         Merchant.hot_food_pilot = true AND Household.has_elderly_or_disabled = true.
      #         Otherwise treated as ineligible.
      # Step 3: For each remaining line item, line_total = unit_price_cents * quantity.
      #         Sum all line_totals to produce eligible_amount_cents.
      # Step 4: ineligible_amount_cents = requested_amount_cents - eligible_amount_cents.

      eligible = 0
      for item in line_items:
          if item.item_category in {NON_FOOD, ALCOHOL, TOBACCO}:
              continue
          if item.item_category in {HOT_PREPARED, COLD_PREPARED}:
              if not (merchant.hot_food_pilot and household.has_elderly_or_disabled):
                  continue
          eligible += item.unit_price_cents * item.quantity
      return eligible
    input_set: "Transaction.line_items, Merchant.hot_food_pilot, Household.has_elderly_or_disabled"
    constants: {}
    precision: "integer cents; no rounding needed (multiplication of integers)"
    variants:
      - name: standard_household_purchase
        when: "Household.has_elderly_or_disabled = false OR Merchant.hot_food_pilot = false"
        difference: "HOT_PREPARED and COLD_PREPARED line items count as ineligible"
      - name: restaurant_meals_program
        when: "Household.has_elderly_or_disabled = true AND Merchant.hot_food_pilot = true"
        difference: "HOT_PREPARED and COLD_PREPARED line items count as eligible — produces a higher eligible_amount_cents for the same cart"

  - name: calc_fraud_score
    trigger: "On every Transaction APPROVED for the household; recomputed on FraudCase open and on each reassessment"
    algorithm: weighted_scoring
    formula: |
      # Risk score over the most recent ROLLING_WINDOW_DAYS days.
      # Three signals, weighted, half_up rounded to 2 decimal places.

      now = Clock.now
      window_start = now - ROLLING_WINDOW_DAYS days

      # Signal A: rapid-balance-depletion ratio (sum of PURCHASE entries within 24h of credit)
      a_total = sum(|entry.amount_cents|
                    for entry in BenefitLedger
                    where entry.entry_type = PURCHASE
                    and entry.household_id = H.id
                    and entry.created_at >= window_start
                    and exists credit_entry in BenefitLedger where
                        credit_entry.entry_type in {REGULAR_ALLOTMENT, EMERGENCY_ALLOTMENT}
                        and credit_entry.household_id = H.id
                        and entry.created_at - credit_entry.created_at <= 24 hours)
      a_signal = min(1.0, a_total / max(1, monthly_allotment_cents))

      # Signal B: out-of-state merchant ratio (count of APPROVED txns where Merchant.state != Household.state_code)
      total_tx = count of APPROVED Transaction for H.id within window
      oos_tx   = count of those where Merchant resolves to a different state
      b_signal = (oos_tx / total_tx) if total_tx > 0 else 0.0

      # Signal C: even-amount clustering (count of APPROVED txns with eligible_amount_cents divisible by 10000) / total_tx
      c_signal = (even_count / total_tx) if total_tx > 0 else 0.0

      raw = WEIGHT_A*a_signal + WEIGHT_B*b_signal + WEIGHT_C*c_signal
      score = round_half_up(raw, 2)   # NOTE: round at the END (sum-then-round)
      return score
    input_set: "BenefitLedger entries, Transactions for this household over the rolling window."
    constants:
      ROLLING_WINDOW_DAYS: 30
      WEIGHT_A: 0.50
      WEIGHT_B: 0.30
      WEIGHT_C: 0.20
    precision: "Score is two-decimal-place number; rounding ORDER is sum-then-round (NOT round per signal then sum) — this is opposite of calc_net_monthly_income."
    variants: []

  - name: calc_abawd_status
    trigger: "On Member create, on Member.is_disabled/is_pregnant/date_of_birth update, on Household composition change, on AbawdWaiver state change, and on POST /_clock/advance lazy recompute"
    algorithm: threshold
    formula: |
      age_years = (Clock.now - date_of_birth) // 365.25 days  # truncated integer years

      # Exemption ladder (first match wins, ordered):
      if not (18 <= age_years <= 49):
          return NOT_ABAWD
      if is_disabled or is_pregnant:
          return ABAWD_EXEMPT
      if household has any Member with age_years < 18 (status=ACTIVE):
          return ABAWD_EXEMPT
      if exists AbawdWaiver(member_id=self.id, state=APPROVED, effective_from <= Clock.now < effective_to):
          return ABAWD_WAIVED
      return ABAWD_SUBJECT
    input_set: "Member, sibling Members within Household, AbawdWaivers."
    constants: {}
    precision: "Enum result; integer age"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except POST /_clock/advance and POST /_sweep/run"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "All foreign-key bodies (household_id, member_id, card_id, merchant_id) reference existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "Target entity is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Acting EbtCard is ACTIVE for transactional operations"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 7
    category: business_safety
    check: "FraudCase in SUBSTANTIATED state blocks card resume, EA disbursement, and new card issuance for the household"
    error_id: ERR_FRAUD_HOLD
    http_status: 422
    applies_to: "POST /households/{id}/cards/{cardId}/resume, EA disburse, card issuance"

  - priority: 8
    category: business_safety
    check: "Merchant.snap_authorization_status = AUTHORIZED AND authorization_expires_at > Clock.now"
    error_id: ERR_MERCHANT_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 9
    category: business_referential
    check: "ABAWD waiver applicant: Member age >= 18 and age <= 49 inclusive at effective_from (boundary)"
    error_id: ERR_ABAWD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /households/{id}/members/{memberId}/abawd-waivers/{waiverId}/approve"

  - priority: 10
    category: business_temporal
    check: "Application APPROVE: gross_monthly_income_cents <= GROSS_INCOME_LIMIT(household_size) OR Household.has_elderly_or_disabled = true (boundary: <= vs <)"
    error_id: ERR_GROSS_INCOME_OVER_LIMIT
    http_status: 422
    applies_to: "POST /households/{id}/applications/{appId}/approve"

  - priority: 11
    category: business_fiscal
    check: "Application APPROVE: net_monthly_income_cents <= NET_INCOME_LIMIT(household_size) (boundary: <= vs <)"
    error_id: ERR_NET_INCOME_OVER_LIMIT
    http_status: 422
    applies_to: "POST /households/{id}/applications/{appId}/approve"

  - priority: 12
    category: business_fiscal
    check: "Transaction: EbtCard.balance_cents >= calc_eligible_amount (boundary: >= 0 means zero-balance with zero eligible_amount returns DECLINED with ALL_ITEMS_INELIGIBLE, not INSUFFICIENT_FUNDS)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 13
    category: business_constraint
    check: "Transaction: at least one line item must be eligible (eligible_amount_cents > 0)"
    error_id: ERR_ALL_ITEMS_INELIGIBLE
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 14
    category: business_constraint
    check: "EbtCard issuance: at most one EbtCard with status in {ISSUED, ACTIVE, SUSPENDED} per Household"
    error_id: ERR_CARD_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /households/{id}/cards"

  - priority: 15
    category: business_constraint
    check: "Emergency Allotment cannot transition DECLARED->DISBURSED twice for the same declaration"
    error_id: ERR_EA_ALREADY_DISBURSED
    http_status: 409
    applies_to: "POST /emergency-allotments/{eaId}/disburse"

  - priority: 16
    category: business_temporal
    check: "Transaction REVERSE: Clock.now <= posted_at + 24 hours"
    error_id: ERR_REVERSAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /transactions/{txId}/reverse"

  - priority: 17
    category: business_temporal
    check: "FraudCase APPEAL: Clock.now <= opened_at + 90 days (boundary: 90d exact allowed, 90d+1ns rejected)"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /fraud-cases/{caseId}/appeal"

  - priority: 18
    category: business_constraint
    check: "AbawdWaiver.effective_to > effective_from AND (effective_to - effective_from) <= 12 months exact"
    error_id: ERR_WAIVER_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /households/{id}/members/{memberId}/abawd-waivers"

  - priority: 19
    category: business_temporal
    check: "AbawdWaiver overlap on same Member: a new waiver's [effective_from, effective_to) interval must NOT overlap any existing AbawdWaiver for the same member in state in {REQUESTED, APPROVED}. Semantics: half-open intervals — adjacency (new.effective_from == existing.effective_to) is ALLOWED; any open-interval overlap is rejected."
    error_id: ERR_WAIVER_OVERLAP
    http_status: 422
    applies_to: "POST /households/{id}/members/{memberId}/abawd-waivers"

  - priority: 20
    category: business_temporal
    check: "EmergencyAllotment uniqueness: at most one EmergencyAllotment per (state_code, benefit_month) tuple in state in {DRAFT, DECLARED, DISBURSED}. Semantics: discrete-key conflict — any second creation with the same tuple is rejected. (Compare with priority 19, which uses interval geometry on a continuous time axis.)"
    error_id: ERR_EA_DUPLICATE
    http_status: 409
    applies_to: "POST /emergency-allotments"

  - priority: 21
    category: business_constraint
    check: "Request body schema valid (types, required fields, enum values, pagination bounds 1..100)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 22
    category: business_constraint
    check: "OCC version match on PATCH/PUT (if version supplied, must equal current)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH/PUT mutation endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Household ----
  - method: POST
    path: "/households"
    description: "Create a new Household (no members yet)"
    roles: [Caseworker]
    code: 201
    input: [state_code, address_zip, "dependent_care_expense_cents?", "shelter_expense_cents?"]
    output: Household
    side_effects:
      - "case_number assigned"

  - method: GET
    path: "/households/{id}"
    description: "Fetch a Household with all computed fields up to date"
    roles: [Caseworker, HouseholdHead, FraudInvestigator]
    code: 200
    input: []
    output: Household
    side_effects:
      - "Lazy recompute of household_size, gross/net income, monthly allotment, has_elderly_or_disabled, abawd statuses"

  - method: GET
    path: "/households"
    description: "List Households with filters"
    roles: [Caseworker, StateAdministrator, FraudInvestigator]
    code: 200
    input: ["state_code?", "certification_status?", "limit?", "offset?"]
    output: "Household[]"
    side_effects: []

  - method: PATCH
    path: "/households/{id}"
    description: "Update mutable Household fields"
    roles: [Caseworker]
    code: 200
    input: ["state_code?", "address_zip?", "dependent_care_expense_cents?", "shelter_expense_cents?", "version?"]
    output: Household
    side_effects:
      - "If shelter/dependent_care changed, recompute net_monthly_income_cents and monthly_allotment_cents"

  # ---- Member ----
  - method: POST
    path: "/households/{id}/members"
    description: "Add a Member to a Household"
    roles: [Caseworker]
    code: 201
    input: [full_name, date_of_birth, "is_disabled?", "is_pregnant?", "earned_income_cents?", "unearned_income_cents?"]
    output: Member
    side_effects:
      - "Recompute Household.household_size, gross_monthly_income_cents, has_elderly_or_disabled, net_monthly_income_cents, monthly_allotment_cents"
      - "Recompute Member.abawd_status"

  - method: GET
    path: "/households/{id}/members/{memberId}"
    description: "Fetch a Member"
    roles: [Caseworker, HouseholdHead]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Lazy recompute of abawd_status from clock"

  - method: PATCH
    path: "/households/{id}/members/{memberId}"
    description: "Update Member fields"
    roles: [Caseworker]
    code: 200
    input: ["is_disabled?", "is_pregnant?", "earned_income_cents?", "unearned_income_cents?", "version?"]
    output: Member
    side_effects:
      - "Recompute Household income aggregates and downstream allotment"

  - method: POST
    path: "/households/{id}/members/{memberId}/deactivate"
    description: "Remove Member from active roster (sets status=REMOVED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Recompute Household.household_size and downstream calc cascade"

  # ---- Application ----
  - method: POST
    path: "/households/{id}/applications"
    description: "Create a draft Application"
    roles: [Caseworker, HouseholdHead]
    code: 201
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/households/{id}/applications/{appId}/submit"
    description: "Submit a draft application (DRAFT->SUBMITTED)"
    roles: [HouseholdHead, Caseworker]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Household.certification_status = PENDING"

  - method: POST
    path: "/households/{id}/applications/{appId}/schedule-interview"
    description: "SUBMITTED->PENDING_INTERVIEW"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/households/{id}/applications/{appId}/complete-interview"
    description: "PENDING_INTERVIEW->INTERVIEW_DONE"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/households/{id}/applications/{appId}/return-for-correction"
    description: "SUBMITTED->DRAFT (revert; cyclic)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/households/{id}/applications/{appId}/approve"
    description: "INTERVIEW_DONE->APPROVED; triggers full cascade"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Auto-issue EbtCard (ISSUED) if no active card"
      - "Post REGULAR_ALLOTMENT BenefitLedger entry for current benefit_month"
      - "Recompute EbtCard.balance_cents"

  - method: POST
    path: "/households/{id}/applications/{appId}/deny"
    description: "INTERVIEW_DONE->DENIED"
    roles: [Caseworker]
    code: 200
    input: [denial_reason]
    output: Application
    side_effects: []

  - method: POST
    path: "/households/{id}/applications/{appId}/close"
    description: "APPROVED->CLOSED (cascade closes ACTIVE EbtCard)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Active EbtCard transitions ACTIVE->CLOSED"

  # ---- EBT Card ----
  - method: POST
    path: "/households/{id}/cards"
    description: "Manually issue a new EbtCard (when no ACTIVE one exists)"
    roles: [Caseworker]
    code: 201
    input: []
    output: EbtCard
    side_effects:
      - "card_number_last4 assigned (server-minted)"

  - method: POST
    path: "/households/{id}/cards/{cardId}/activate"
    description: "ISSUED->ACTIVE"
    roles: [HouseholdHead]
    code: 200
    input: []
    output: EbtCard
    side_effects: []

  - method: POST
    path: "/households/{id}/cards/{cardId}/suspend"
    description: "ACTIVE->SUSPENDED"
    roles: [Caseworker, FraudInvestigator]
    code: 200
    input: []
    output: EbtCard
    side_effects: []

  - method: POST
    path: "/households/{id}/cards/{cardId}/resume"
    description: "SUSPENDED->ACTIVE"
    roles: [Caseworker]
    code: 200
    input: []
    output: EbtCard
    side_effects: []

  - method: POST
    path: "/households/{id}/cards/{cardId}/replace"
    description: "ACTIVE->REPLACED; creates new EbtCard (ISSUED), transfers balance"
    roles: [HouseholdHead, Caseworker]
    code: 200
    input: []
    output: EbtCard
    side_effects:
      - "New EbtCard ISSUED with replaced_by linkage and balance transferred via ADJUSTMENT pair"

  - method: GET
    path: "/households/{id}/cards/{cardId}"
    description: "Fetch a card with current balance"
    roles: [Caseworker, HouseholdHead]
    code: 200
    input: []
    output: EbtCard
    side_effects: []

  - method: GET
    path: "/households/{id}/cards/{cardId}/ledger"
    description: "List BenefitLedger entries for a card"
    roles: [Caseworker, HouseholdHead]
    code: 200
    input: ["entry_type?", "benefit_month?", "limit?", "offset?"]
    output: "BenefitLedger[]"
    side_effects: []

  # ---- Transactions ----
  - method: POST
    path: "/transactions"
    description: "Merchant submits a purchase request — inline settle to APPROVED or DECLINED"
    roles: [Merchant]
    code: 201
    input: [card_id, merchant_id, requested_amount_cents, line_items]
    output: Transaction
    side_effects:
      - "PURCHASE BenefitLedger entry posted on APPROVED"
      - "EbtCard.balance_cents recomputed"

  - method: GET
    path: "/transactions/{txId}"
    description: "Fetch a transaction"
    roles: [Caseworker, Merchant, HouseholdHead, FraudInvestigator]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List transactions with filters"
    roles: [Caseworker, FraudInvestigator]
    code: 200
    input: ["card_id?", "merchant_id?", "status?", "limit?", "offset?"]
    output: "Transaction[]"
    side_effects: []

  - method: POST
    path: "/transactions/{txId}/reverse"
    description: "APPROVED->REVERSED within 24-hour window"
    roles: [Merchant]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "REFUND BenefitLedger entry posted"
      - "EbtCard.balance_cents recomputed"

  # ---- Merchants ----
  - method: POST
    path: "/merchants"
    description: "Onboard a merchant"
    roles: [StateAdministrator]
    code: 201
    input: [name, authorization_expires_at, "hot_food_pilot?"]
    output: Merchant
    side_effects: []

  - method: PATCH
    path: "/merchants/{merchantId}"
    description: "Update merchant authorization/pilot status"
    roles: [StateAdministrator]
    code: 200
    input: ["snap_authorization_status?", "authorization_expires_at?", "hot_food_pilot?", "version?"]
    output: Merchant
    side_effects: []

  - method: GET
    path: "/merchants/{merchantId}"
    description: "Fetch a merchant"
    roles: [StateAdministrator, Merchant]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  # ---- Fraud ----
  - method: POST
    path: "/fraud-cases"
    description: "Open a new FraudCase for a household"
    roles: [FraudInvestigator, Caseworker]
    code: 201
    input: [household_id, trigger_reason]
    output: FraudCase
    side_effects:
      - "calc_fraud_score computed and stored"

  - method: POST
    path: "/fraud-cases/{caseId}/assign"
    description: "OPEN->UNDER_REVIEW"
    roles: [FraudInvestigator]
    code: 200
    input: [investigator_user_id]
    output: FraudCase
    side_effects: []

  - method: POST
    path: "/fraud-cases/{caseId}/substantiate"
    description: "UNDER_REVIEW->SUBSTANTIATED (cascade: suspend all ACTIVE cards)"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudCase
    side_effects:
      - "All ACTIVE EbtCard rows of household -> SUSPENDED"

  - method: POST
    path: "/fraud-cases/{caseId}/dismiss"
    description: "UNDER_REVIEW->UNFOUNDED"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: POST
    path: "/fraud-cases/{caseId}/appeal"
    description: "SUBSTANTIATED->APPEAL_PENDING (within 90 days)"
    roles: [HouseholdHead]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: POST
    path: "/fraud-cases/{caseId}/reopen-investigation"
    description: "APPEAL_PENDING->OPEN (cyclic)"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: POST
    path: "/fraud-cases/{caseId}/uphold-appeal"
    description: "APPEAL_PENDING->UNFOUNDED (cascade: resume previously suspended cards)"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudCase
    side_effects:
      - "SUSPENDED EbtCard rows that were suspended by this case -> ACTIVE"

  - method: POST
    path: "/fraud-cases/{caseId}/close"
    description: "UNFOUNDED->CLOSED or SUBSTANTIATED (with expired appeal window) ->CLOSED"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: GET
    path: "/fraud-cases"
    description: "List fraud cases"
    roles: [FraudInvestigator, Caseworker]
    code: 200
    input: ["state?", "household_id?", "limit?", "offset?"]
    output: "FraudCase[]"
    side_effects: []

  - method: GET
    path: "/fraud-cases/{caseId}"
    description: "Fetch a fraud case"
    roles: [FraudInvestigator, Caseworker, HouseholdHead]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  # ---- ABAWD Waivers ----
  - method: POST
    path: "/households/{id}/members/{memberId}/abawd-waivers"
    description: "Request an ABAWD waiver for a member"
    roles: [HouseholdHead, Caseworker]
    code: 201
    input: [waiver_kind, effective_from, effective_to]
    output: AbawdWaiver
    side_effects: []

  - method: POST
    path: "/households/{id}/members/{memberId}/abawd-waivers/{waiverId}/approve"
    description: "REQUESTED->APPROVED (boundary: age 18..49 inclusive at effective_from)"
    roles: [Caseworker]
    code: 200
    input: []
    output: AbawdWaiver
    side_effects:
      - "Member.abawd_status recomputed -> ABAWD_WAIVED while waiver valid"

  - method: POST
    path: "/households/{id}/members/{memberId}/abawd-waivers/{waiverId}/reject"
    description: "REQUESTED->REJECTED"
    roles: [Caseworker]
    code: 200
    input: [decision_reason]
    output: AbawdWaiver
    side_effects: []

  - method: GET
    path: "/households/{id}/members/{memberId}/abawd-waivers/{waiverId}"
    description: "Fetch a waiver"
    roles: [Caseworker, HouseholdHead]
    code: 200
    input: []
    output: AbawdWaiver
    side_effects: []

  - method: GET
    path: "/households/{id}/members/{memberId}/abawd-waivers"
    description: "List waivers for a member"
    roles: [Caseworker, HouseholdHead]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: "AbawdWaiver[]"
    side_effects: []

  # ---- Emergency Allotment ----
  - method: POST
    path: "/emergency-allotments"
    description: "Create a draft EA declaration"
    roles: [StateAdministrator]
    code: 201
    input: [state_code, benefit_month, max_allotment_table_version]
    output: EmergencyAllotment
    side_effects: []

  - method: POST
    path: "/emergency-allotments/{eaId}/declare"
    description: "DRAFT->DECLARED"
    roles: [StateAdministrator]
    code: 200
    input: []
    output: EmergencyAllotment
    side_effects: []

  - method: POST
    path: "/emergency-allotments/{eaId}/disburse"
    description: "DECLARED->DISBURSED; cascades EMERGENCY_ALLOTMENT credits to qualifying households"
    roles: [StateAdministrator]
    code: 200
    input: []
    output: EmergencyAllotment
    side_effects:
      - "Post EMERGENCY_ALLOTMENT BenefitLedger entries for all qualifying households"
      - "Recompute each affected EbtCard.balance_cents"

  - method: POST
    path: "/emergency-allotments/{eaId}/cancel"
    description: "DECLARED->CANCELLED (only if not yet disbursed)"
    roles: [StateAdministrator]
    code: 200
    input: []
    output: EmergencyAllotment
    side_effects: []

  - method: GET
    path: "/emergency-allotments/{eaId}"
    description: "Fetch an EA declaration"
    roles: [StateAdministrator, Caseworker]
    code: 200
    input: []
    output: EmergencyAllotment
    side_effects: []

  - method: GET
    path: "/emergency-allotments"
    description: "List EA declarations"
    roles: [StateAdministrator, Caseworker]
    code: 200
    input: ["state_code?", "benefit_month?", "state?", "limit?", "offset?"]
    output: "EmergencyAllotment[]"
    side_effects: []

  # ---- Test-driving endpoints (required for state reachability per §1.5 principle) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock (test fixture); required to exercise time-gated transitions (certification expiry, waiver expiry, appeal window)"
    roles: [SystemTest]
    code: 200
    input: [to_iso8601]
    output: Clock
    side_effects:
      - "Clock.now updated; subsequent reads recompute time-derived statuses"

  - method: POST
    path: "/_sweep/run"
    description: "Run the periodic sweep: auto-CLOSE Applications past certification_period_end_at, EXPIRE AbawdWaivers past effective_to, auto-CLOSE SUBSTANTIATED FraudCases past 90-day appeal window"
    roles: [SystemTest]
    code: 200
    input: []
    output: null
    side_effects:
      - "Application APPROVED->CLOSED for expired"
      - "AbawdWaiver APPROVED->EXPIRED for expired"
      - "FraudCase SUBSTANTIATED->CLOSED for >90d"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing or empty X-User-Role/X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not exist"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body-supplied foreign key references nonexistent row"

  - id: ERR_VALIDATION
    http: 400
    condition: "Request body schema invalid (type, range, enum, pagination)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity state does not permit this transition"

  - id: ERR_CARD_NOT_ACTIVE
    http: 422
    condition: "Transaction submitted against a card whose status != ACTIVE"

  - id: ERR_FRAUD_HOLD
    http: 422
    condition: "Operation blocked because household has a SUBSTANTIATED FraudCase"

  - id: ERR_MERCHANT_NOT_AUTHORIZED
    http: 422
    condition: "Merchant.snap_authorization_status != AUTHORIZED or authorization_expires_at <= Clock.now"

  - id: ERR_ABAWD_NOT_ELIGIBLE
    http: 422
    condition: "Member not in 18..49 inclusive age range at effective_from, or has under-18 sibling, etc."

  - id: ERR_GROSS_INCOME_OVER_LIMIT
    http: 422
    condition: "Application APPROVE blocked because gross_monthly_income_cents > GROSS_INCOME_LIMIT and household lacks elderly/disabled member"

  - id: ERR_NET_INCOME_OVER_LIMIT
    http: 422
    condition: "Application APPROVE blocked because net_monthly_income_cents > NET_INCOME_LIMIT"

  - id: ERR_INSUFFICIENT_FUNDS
    http: 422
    condition: "Transaction eligible_amount_cents > EbtCard.balance_cents AND eligible_amount_cents > 0"

  - id: ERR_ALL_ITEMS_INELIGIBLE
    http: 422
    condition: "Transaction eligible_amount_cents = 0 (zero-eligible-item edge wins over INSUFFICIENT_FUNDS)"

  - id: ERR_CARD_ALREADY_EXISTS
    http: 409
    condition: "Household already has an EbtCard in {ISSUED, ACTIVE, SUSPENDED}"

  - id: ERR_EA_ALREADY_DISBURSED
    http: 409
    condition: "EmergencyAllotment already in DISBURSED state"

  - id: ERR_REVERSAL_WINDOW_EXPIRED
    http: 422
    condition: "Clock.now > posted_at + 24h on POST /transactions/{txId}/reverse"

  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "Clock.now > opened_at + 90d on POST /fraud-cases/{caseId}/appeal"

  - id: ERR_WAIVER_PERIOD_INVALID
    http: 422
    condition: "effective_to <= effective_from or period > 12 months"

  - id: ERR_WAIVER_OVERLAP
    http: 422
    condition: "New AbawdWaiver interval overlaps an existing REQUESTED/APPROVED waiver on the same Member (half-open semantics; adjacency allowed)"

  - id: ERR_EA_DUPLICATE
    http: 409
    condition: "Existing EmergencyAllotment with same (state_code, benefit_month) in {DRAFT, DECLARED, DISBURSED}"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH/PUT supplied version does not match current entity version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Caseworker
    description: "State agency caseworker — handles application lifecycle, member management, card administration, expense updates"
    identity: "opaque"
    exclusive_operations:
      - "POST /households (create)"
      - "POST /households/{id}/applications/{appId}/schedule-interview"
      - "POST /households/{id}/applications/{appId}/complete-interview"
      - "POST /households/{id}/applications/{appId}/return-for-correction"
      - "POST /households/{id}/applications/{appId}/approve"
      - "POST /households/{id}/applications/{appId}/deny"
      - "POST /households/{id}/applications/{appId}/close"
      - "POST /households/{id}/members"
      - "PATCH /households/{id}/members/{memberId}"
      - "POST /households/{id}/members/{memberId}/deactivate"
      - "POST /households/{id}/cards"
      - "POST /households/{id}/cards/{cardId}/resume"
      - "POST /households/{id}/members/{memberId}/abawd-waivers/{waiverId}/approve"
      - "POST /households/{id}/members/{memberId}/abawd-waivers/{waiverId}/reject"
      - "PATCH /households/{id}"
    shared_operations:
      - "POST /households/{id}/applications (with HouseholdHead)"
      - "POST /households/{id}/applications/{appId}/submit (with HouseholdHead)"
      - "POST /households/{id}/cards/{cardId}/suspend (with FraudInvestigator)"
      - "POST /households/{id}/cards/{cardId}/replace (with HouseholdHead)"
      - "POST /households/{id}/members/{memberId}/abawd-waivers (with HouseholdHead)"
      - "POST /fraud-cases (with FraudInvestigator)"
      - "GET endpoints across households, members, cards, fraud-cases, transactions, EA"

  - name: HouseholdHead
    description: "Head of an applicant/recipient household — files applications, activates/replaces cards, appeals fraud"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /households/{id}/cards/{cardId}/activate"
      - "POST /fraud-cases/{caseId}/appeal"
    shared_operations:
      - "POST /households/{id}/applications"
      - "POST /households/{id}/applications/{appId}/submit"
      - "POST /households/{id}/cards/{cardId}/replace"
      - "POST /households/{id}/members/{memberId}/abawd-waivers"
      - "GET /households/{id}, GET /households/{id}/members/{memberId}, GET /households/{id}/cards/{cardId}, GET ledger, GET /fraud-cases/{caseId}, GET /transactions/{txId}, GET /households/{id}/members/{memberId}/abawd-waivers*"
    note: "X-User-ID for HouseholdHead must equal the target Household.id. Cross-household access yields ERR_FORBIDDEN."

  - name: Merchant
    description: "SNAP-authorized retailer — submits and reverses transactions"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /transactions"
      - "POST /transactions/{txId}/reverse"
    shared_operations:
      - "GET /transactions/{txId} (only for own merchant_id)"
      - "GET /merchants/{merchantId} (only own id)"
    note: "X-User-ID for Merchant must equal the acting Merchant.id; merchant_id in transaction body must match."

  - name: FraudInvestigator
    description: "State fraud-investigation officer — opens, investigates, substantiates, appeals fraud cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /fraud-cases/{caseId}/assign"
      - "POST /fraud-cases/{caseId}/substantiate"
      - "POST /fraud-cases/{caseId}/dismiss"
      - "POST /fraud-cases/{caseId}/reopen-investigation"
      - "POST /fraud-cases/{caseId}/uphold-appeal"
      - "POST /fraud-cases/{caseId}/close"
    shared_operations:
      - "POST /fraud-cases (with Caseworker)"
      - "POST /households/{id}/cards/{cardId}/suspend (with Caseworker)"
      - "GET /fraud-cases, GET /fraud-cases/{caseId}, GET /transactions, GET /households, GET /households/{id}"

  - name: StateAdministrator
    description: "State-level admin who manages merchant onboarding and Emergency Allotment declarations"
    identity: "opaque"
    exclusive_operations:
      - "POST /merchants"
      - "PATCH /merchants/{merchantId}"
      - "POST /emergency-allotments"
      - "POST /emergency-allotments/{eaId}/declare"
      - "POST /emergency-allotments/{eaId}/disburse"
      - "POST /emergency-allotments/{eaId}/cancel"
    shared_operations:
      - "GET /merchants/{merchantId}"
      - "GET /emergency-allotments, GET /emergency-allotments/{eaId}"
      - "GET /households (read only)"

  - name: SystemTest
    description: "Test fixture role used only by /_clock/advance and /_sweep/run; never used in normal traffic"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations: []
