            - "Hall HJ1 (SINGLE_TENANT, design_kw_capacity 400.00, cooling_redundancy N) has reached COMMISSIONING with a deliberately tight cooling plant: CU-1 rated_sensible_kw 20.00, design_airflow_cfm 3000, supply_delta_t_f 12.0, measured_airflow_cfm 3000, IN_SERVICE."
