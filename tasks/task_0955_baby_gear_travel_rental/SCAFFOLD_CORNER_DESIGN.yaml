  - section: rbac
    instances:
      - name: customer_cannot_create_catalog_item
        claim_type: role_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "Customer role invoking POST /catalog-items (OperationsAdmin-exclusive) is rejected ERR_FORBIDDEN (403)."
