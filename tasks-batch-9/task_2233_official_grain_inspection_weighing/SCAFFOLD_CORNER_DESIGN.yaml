              captures: { sup: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${sup}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${sup}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-SEAL", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-SEAL", declared_quantity_bushels: 900, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${sup}", seal_number: "SEAL-BREAK", portions_count: 4 }
              captures: { smp: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/samples/${smp}/break-seal
              as: SupervisingInspector
              payload: { reason: "seal found cut on arrival" }
              captures: { ist: "$.data.integrity_status" }
          assert:
            - "200 with integrity_status BROKEN while portions_available remains 4, proving integrity and exhaustion are separate gates"
            - "POST /grain-inspection/grading-results on ${smp} -> 409 ERR_SAMPLE_INTEGRITY_BROKEN"
            - "POST /grain-inspection/protein-analyses on ${smp} -> 409 ERR_SAMPLE_INTEGRITY_BROKEN"
            - "A second POST /grain-inspection/samples/${smp}/break-seal -> 409 ERR_INVALID_STATE_TRANSITION, since BROKEN is terminal"
            - "The same call as LicensedInspector -> 403 ERR_UNAUTHORIZED: break-seal is a SupervisingInspector exclusive"
            - "GET /grain-inspection/samples?inspection_request_id=${req}&integrity_status=BROKEN -> total_count 1 and GET /grain-inspection/inspection-requests/${req} -> grading_status still SAMPLED"

      - name: nested_certificate_read_is_scoped_and_filterable
