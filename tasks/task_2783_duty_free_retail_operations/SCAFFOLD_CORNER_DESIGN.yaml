  - section: endpoints
    instances:
      - claim_type: listing_and_filtering
        name: filtered_lists_paginate_deterministically_and_respect_every_declared_filter
        grounds:
          - endpoints["GET /bonded-movements"]
          - endpoints["GET /sale-lines"]
          - endpoints["GET /pre-orders"]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Every list endpoint declares limit and offset plus one filter per FK, orders by created_at ASC,
          and MUST NOT fall back to id ordering. limit/offset MUST slice the FILTERED set (not the whole
          table), an unmatched filter MUST return an empty array rather than everything, and combining two
          filters MUST intersect them.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product, one stock item, three RECEIPT movements of 1, 2 and 3 units in that order"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 1 }
              as: StockController
              captures: { m1: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 2 }
              as: StockController
              captures: { m2: $.data.id }
            - call: "POST /bonded-movements"
