            - "StorePosition.${p1_id}.available_units == 4 < min 12 and stock_status == LOW; its in_transit_units is still 0 because approve reserves but does not ship"
            - "Assortment is unaffected by the approve on either side: ${p2_id} stays COMPLETE and ${p1_id} stays BROKEN with broken_size_count 2"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: locked_program_blocks_decisions_but_not_line_ship_or_confirm_receipt
        grounds:
          - validations[priority:9]
          - endpoints.POST /allocation/allocation-lines/{lineId}/ship
          - endpoints.POST /allocation/allocation-lines/{lineId}/confirm-receipt
          - validations[priority:28]
          - calculations.network_on_hand_invariant
        distinguishing_aspect: |
          An AllocationLine's own state machine is untouched by the lock, but which of its operations are
          legal depends on a different entity: AllocationProgram.status. LOCKED blocks every decision
          (receipt create, run create/propose/commit, transfer create/approve/dispatch, detection, snapshot)
          while explicitly exempting physical logistics, so the same lock that refuses a new receipt still
          lets this line ship and be confirmed - and the shipping is what then makes recall illegal for a
          completely different reason.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores 0101(A,13000,URBAN) 0102(B,10000,URBAN) 0103(C,12500,SUBURBAN) 0104(D,11000,SUBURBAN)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500, core_size_min_share_bp 1500; SKU-1001 is SEASONAL so its resolved model is DEMAND_DRIVEN"
            - "Positions: 0101 on_hand 6 + on_order 4, forecast 9, trailing 30; 0102 on_hand 20, forecast 5, trailing 16; 0103 on_hand 2, forecast 3, trailing 6; 0104 on_hand 0, forecast 2, trailing 5"
            - "A 44-unit receipt was spread DEMAND_DRIVEN / FORWARD_LOOKING and COMMITTED: lines 0101 26, 0103 10, 0104 8, all PENDING"
            - "NET(SKU-1001) across the four positions is 6 + 20 + 2 + 0 = 28 units before anything ships"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
