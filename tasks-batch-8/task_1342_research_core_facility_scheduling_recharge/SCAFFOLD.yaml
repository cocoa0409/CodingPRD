# =============================================================================
# SCAFFOLD — Research Core Facility Scheduling & Recharge (university core facility)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Research Core Facility Scheduling & Recharge (university core facility): instrument
  catalog & booking calendar with training requirement, user rate development
  (internal/external) & break-even review, usage logging & automated recharge to
  grants, subsidy/startup fund application, instrument downtime & maintenance
  contract, priority access & cancellation penalties, annual rate true-up &
  surplus/deficit carryforward, acknowledgment & publication tracking

domain_name: research-core-facility
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.4) — HARDER-THAN-EXPERT calibration
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 15
  calculation_count: 10
  validation_count: 41
  endpoint_count: 87
  error_code_count: 39
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology, FK links)
# =============================================================================
entities:
  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Full legal name of the facility user" }
      - { name: email, type: string, source: input, description: "Institutional email; unique across Users", constraints: "unique; non-empty" }
      - { name: affiliation, type: enum, source: input, description: "INTERNAL (university member, grant-billed) | EXTERNAL (outside client, invoiced)", constraints: "INTERNAL | EXTERNAL" }
      - { name: department, type: string, source: input, description: "Department or company name", default: null }
      - { name: is_pi, type: boolean, source: input, description: "True when the user is a principal investigator who may own grants", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; new users start ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Instrument display name (e.g. '600MHz NMR')" }
      - { name: model, type: string, source: input, description: "Manufacturer model string" }
      - { name: location, type: string, source: input, description: "Room / building" }
      - { name: requires_training, type: boolean, source: input, description: "When true, bookings require a CERTIFIED TrainingRecord for (user, instrument)", default: true }
      - { name: booking_buffer_minutes, type: integer, source: input, description: "Turnaround gap appended AFTER each booking: every booking occupies the half-open interval [start_at, end_at + booking_buffer_minutes) for booking-vs-booking overlap checks", default: 0, constraints: ">= 0" }
      - { name: min_booking_minutes, type: integer, source: input, description: "Minimum booking duration", constraints: "> 0" }
      - { name: max_booking_minutes, type: integer, source: input, description: "Maximum booking duration", constraints: ">= min_booking_minutes" }
      - { name: cancellation_free_notice_hours, type: integer, source: input, description: "Cancelling an APPROVED booking at least this many hours before start_at is free of penalty", constraints: ">= 0" }
      - { name: late_cancel_penalty_pct, type: number, source: input, description: "Fraction of estimated_charge_cents charged when cancelling inside the free-notice window", constraints: "0 <= p <= 1" }
      - { name: no_show_penalty_pct, type: number, source: input, description: "Fraction of estimated_charge_cents charged on a staff-marked no-show", constraints: "0 <= p <= 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DOWN | MAINTENANCE | RETIRED; new instruments start AVAILABLE", constraints: "AVAILABLE | DOWN | MAINTENANCE | RETIRED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "FK -> User.id; the trainee" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; the instrument the training covers" }
      - { name: status, type: enum, source: system, description: "ENROLLED | CERTIFIED | EXPIRED | REVOKED; starts ENROLLED. EXPIRED is derived: a CERTIFIED record whose expires_at <= current logical time is reported and treated as EXPIRED.", constraints: "ENROLLED | CERTIFIED | EXPIRED | REVOKED; at most one record with status IN {ENROLLED, CERTIFIED, EXPIRED} per (user_id, instrument_id)" }
      - { name: certified_at, type: datetime, source: system, description: "Logical timestamp of last certification; null until first certify" }
      - { name: expires_at, type: datetime, source: system, description: "certified_at + CERT_VALIDITY_MONTHS (12); null until first certify" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: grant_code, type: string, source: input, description: "Sponsor award number; unique", constraints: "unique; non-empty" }
      - { name: pi_user_id, type: string, source: input, description: "FK -> User.id; principal investigator who owns the grant" }
      - { name: title, type: string, source: input, description: "Grant title" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total authorized budget", constraints: "> 0" }
      - { name: authorized_user_ids, type: array, source: input, description: "Array of User.id allowed to charge this grant; the PI is always implicitly authorized", default: [] }
      - { name: start_date, type: string, source: input, description: "First chargeable date, YYYY-MM-DD inclusive" }
      - { name: end_date, type: string, source: input, description: "Last chargeable date, YYYY-MM-DD inclusive", constraints: ">= start_date" }
      - { name: budget_encumbered_cents, type: integer, source: computed, description: "Sum of encumbered_cents over this grant's Bookings with status IN {APPROVED, IN_PROGRESS}" }
      - { name: budget_used_cents, type: integer, source: computed, description: "Sum of net_amount_cents over this grant's RechargeEntries with kind IN {USAGE, PENALTY} and status IN {PENDING, BILLED, PAID, DISPUTED} (WRITTEN_OFF excluded — reversed; ADJUSTMENT entries never count)" }
      - { name: budget_available_cents, type: integer, source: computed, description: "budget_total_cents - budget_encumbered_cents - budget_used_cents; may go negative only via budget amendment" }
      - { name: status, type: enum, source: computed, description: "CLOSED (stored, via close) | EXPIRED (end_date < current logical date) | EXHAUSTED (budget_available_cents <= 0) | ACTIVE (otherwise). Precedence: CLOSED > EXPIRED > EXHAUSTED > ACTIVE.", constraints: "ACTIVE | EXHAUSTED | EXPIRED | CLOSED" }

  - name: RateSet
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the rates apply to (e.g. 2027)" }
      - { name: effective_from, type: datetime, source: input, description: "Activation gate: set may be activated only when current logical time >= effective_from" }
      - { name: lines, type: array, source: input, description: "Array of rate line objects: { instrument_id (FK -> Instrument.id; unique within the set), internal_rate_cents_per_hour (int > 0), external_rate_cents_per_hour (int >= internal rate), billing_increment_minutes (int > 0), min_charge_minutes (int >= 0), projected_billable_hours (number > 0), break_even_waiver_reason (string or null) }" }
      - { name: line_verdicts, type: array, source: computed, description: "Per-line computed array mirroring `lines`, each element extended with { break_even_verdict: PASS | DEFICIT | WAIVED, flagged_for_review: boolean }" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | EFFECTIVE | SUPERSEDED; starts DRAFT", constraints: "DRAFT | UNDER_REVIEW | APPROVED | EFFECTIVE | SUPERSEDED; at most one EFFECTIVE set per fiscal_year" }
      - { name: supersedes_rate_set_id, type: string, source: system, description: "FK -> RateSet.id; set at activation to the previously EFFECTIVE set of the same fiscal_year (which flips to SUPERSEDED); null until activation" }
      - { name: developed_by, type: string, source: system, description: "X-User-ID of the FacilityAdmin who created the set (segregation-of-duties reference)" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the FinanceOfficer who approved the set; null until approved" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "FK -> User.id; who runs the session" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; required (non-null) when the user is INTERNAL, must be null for EXTERNAL users" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC), exclusive for booking-vs-booking overlap", constraints: "> start_at" }
      - { name: priority, type: enum, source: input, description: "STANDARD | PRIORITY; PRIORITY requires an ACTIVE priority-conveying SubsidyAward and may preempt STANDARD APPROVED bookings at approval", default: "STANDARD", constraints: "STANDARD | PRIORITY" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW | PREEMPTED | REJECTED; starts REQUESTED", constraints: "terminal: COMPLETED, CANCELLED, NO_SHOW, PREEMPTED, REJECTED" }
      - { name: cancellation_reason, type: enum, source: system, description: "null | USER | STAFF | PREEMPTION | DOWNTIME | USER_SUSPENDED | INSTRUMENT_RETIRED; set when status becomes CANCELLED/PREEMPTED" }
      - { name: penalty_cents, type: integer, source: computed, description: "Cancellation/no-show penalty per calculation cancellation_penalty; 0 when penalty_waived" }
      - { name: penalty_waived, type: boolean, source: system, description: "True when cancellation is involuntary (PREEMPTION, DOWNTIME, USER_SUSPENDED, INSTRUMENT_RETIRED)", default: false }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "Provisional variant of calculation usage_charge at approval: scheduled minutes x pinned rate (no ceil, no consumables)" }
      - { name: encumbered_cents, type: integer, source: system, description: "Amount currently encumbered on the grant: estimated_charge_cents while APPROVED/IN_PROGRESS, 0 otherwise; always 0 for EXTERNAL bookings" }
      - { name: rate_set_id, type: string, source: system, description: "FK -> RateSet.id; the EFFECTIVE rate set pinned at approval" }
      - { name: applied_rate_cents_per_hour, type: integer, source: system, description: "Rate snapshot pinned at approval (internal or external per booker affiliation)" }
      - { name: applied_increment_minutes, type: integer, source: system, description: "Billing increment snapshot pinned at approval" }
      - { name: applied_min_charge_minutes, type: integer, source: system, description: "Minimum-charge snapshot pinned at approval" }

  - name: UsageLog
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; exactly one UsageLog per booking", constraints: "unique per booking_id" }
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; denormalized from the booking" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id; denormalized from the booking" }
      - { name: actual_start_at, type: datetime, source: input, description: "Observed session start" }
      - { name: actual_end_at, type: datetime, source: input, description: "Observed session end; must be > actual_start_at and <= booking.end_at + 24h", constraints: "actual_end_at > actual_start_at" }
      - { name: consumable_fee_cents, type: integer, source: input, description: "Flat consumables charge added after hourly computation", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VALIDATED | REJECTED; starts DRAFT", constraints: "DRAFT | SUBMITTED | VALIDATED | REJECTED" }
      - { name: logged_by, type: string, source: system, description: "X-User-ID of the CoreStaff creator (segregation-of-duties reference)" }
      - { name: validated_by, type: string, source: system, description: "X-User-ID of the validating CoreStaff; must differ from logged_by; null until validated" }
      - { name: billable_minutes, type: integer, source: computed, description: "ceil(actual minutes / applied_increment_minutes) * applied_increment_minutes, then floored at applied_min_charge_minutes" }
      - { name: usage_charge_cents, type: integer, source: computed, description: "Final variant of calculation usage_charge: round_half_up(billable_minutes * applied_rate_cents_per_hour / 60) + consumable_fee_cents" }

  - name: RechargeBatch
    parent: null
    common_fields: true
    fields:
      - { name: period_year, type: integer, source: input, description: "Billing period year" }
      - { name: period_month, type: integer, source: input, description: "Billing period month 1-12", constraints: "1 <= m <= 12; (period_year, period_month) unique" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED; starts OPEN. At most one OPEN batch exists at any time.", constraints: "OPEN | FINALIZED" }
      - { name: entry_count, type: integer, source: computed, description: "Count of RechargeEntries with batch_id == this batch" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of amount_cents over entries in this batch" }
      - { name: subsidy_offset_cents, type: integer, source: computed, description: "Sum of subsidy_offset_cents over entries in this batch" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Sum of net_amount_cents over entries in this batch" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical timestamp of finalization; null while OPEN. Once FINALIZED the totals are immutable — later corrections post ADJUSTMENT entries into the next OPEN batch." }

  - name: RechargeEntry
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> RechargeBatch.id; the batch the entry posts to" }
      - { name: usage_log_id, type: string, source: system, description: "FK -> UsageLog.id; null for PENALTY and ADJUSTMENT entries" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; null for ADJUSTMENT entries" }
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; null for external (invoiced) entries" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id; who is charged" }
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; instrument used" }
      - { name: kind, type: enum, source: system, description: "USAGE | PENALTY | ADJUSTMENT", constraints: "USAGE | PENALTY | ADJUSTMENT" }
      - { name: is_external, type: boolean, source: system, description: "True when the charged user has affiliation EXTERNAL (invoiced, never debits a grant, never subsidized)" }
      - { name: amount_cents, type: integer, source: system, description: "Gross charge; may be negative only for ADJUSTMENT entries" }
      - { name: subsidy_offset_cents, type: integer, source: system, description: "Portion covered by subsidy waterfall; 0 for PENALTY and ADJUSTMENT entries and for external entries", default: 0 }
      - { name: net_amount_cents, type: integer, source: computed, description: "amount_cents - subsidy_offset_cents; this is what debits the grant (or is invoiced externally)" }
      - { name: status, type: enum, source: system, description: "PENDING | BILLED | PAID | DISPUTED | WRITTEN_OFF; USAGE and PENALTY entries start PENDING, ADJUSTMENT entries are created directly in PAID (self-settling correction records)", constraints: "terminal: PAID, WRITTEN_OFF" }
      - { name: dispute_reason, type: string, source: input, description: "Required when disputing; cleared on UPHOLD resolution", default: null }

  - name: SubsidyApplication
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "FK -> User.id; applicant; INTERNAL affiliation required" }
      - { name: kind, type: enum, source: input, description: "STARTUP (new-lab startup funds; may convey priority) | SUBSIDY (ordinary usage subsidy)", constraints: "STARTUP | SUBSIDY" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested", constraints: "> 0" }
      - { name: justification, type: string, source: input, description: "Free-text justification" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED; starts DRAFT", constraints: "terminal: APPROVED, REJECTED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the FinanceOfficer who last acted on the application; null until reviewed" }

  - name: SubsidyAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> SubsidyApplication.id; one award per approved application", constraints: "unique per application_id" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id; copied from the application" }
      - { name: kind, type: enum, source: system, description: "STARTUP | SUBSIDY; copied from the application" }
      - { name: awarded_amount_cents, type: integer, source: input, description: "Amount granted at approval (may differ from requested)", constraints: "> 0" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "awarded_amount_cents - sum of non-reversed subsidy_offset_cents applied from this award" }
      - { name: conveys_priority, type: boolean, source: input, description: "When true, the holder may create PRIORITY bookings while the award is ACTIVE" }
      - { name: valid_from, type: datetime, source: input, description: "Award validity start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Award validity end (exclusive for offset eligibility)", constraints: "> valid_from" }
      - { name: status, type: enum, source: computed, description: "REVOKED (stored, via revoke) | EXPIRED (valid_until <= current logical time) | EXHAUSTED (remaining_amount_cents <= 0) | ACTIVE (otherwise). Precedence: REVOKED > EXPIRED > EXHAUSTED > ACTIVE.", constraints: "ACTIVE | EXHAUSTED | EXPIRED | REVOKED" }

  - name: MaintenanceContract
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: vendor, type: string, source: input, description: "Service vendor name" }
      - { name: sla_response_hours, type: integer, source: input, description: "Vendor response SLA in hours", constraints: "> 0" }
      - { name: coverage_start, type: string, source: input, description: "Coverage start date YYYY-MM-DD inclusive" }
      - { name: coverage_end, type: string, source: input, description: "Coverage end date YYYY-MM-DD inclusive", constraints: ">= coverage_start" }
      - { name: annual_cost_cents, type: integer, source: input, description: "Full annual contract cost; counted once (never prorated) in break-even and true-up cost for any fiscal year the coverage window intersects", constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "TERMINATED (stored, via terminate) | EXPIRED (coverage_end < current logical date) | ACTIVE (otherwise). Precedence: TERMINATED > EXPIRED > ACTIVE.", constraints: "ACTIVE | EXPIRED | TERMINATED" }

  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: maintenance_contract_id, type: string, source: input, description: "FK -> MaintenanceContract.id; required for kind PREVENTIVE_MAINTENANCE (contract must be ACTIVE and its coverage dates must contain the event window), optional otherwise", default: null }
      - { name: kind, type: enum, source: input, description: "UNSCHEDULED_FAILURE | PREVENTIVE_MAINTENANCE | CALIBRATION", constraints: "UNSCHEDULED_FAILURE | PREVENTIVE_MAINTENANCE | CALIBRATION" }
      - { name: start_at, type: datetime, source: input, description: "Downtime window start" }
      - { name: end_at, type: datetime, source: input, description: "Downtime window end (inclusive for conflict purposes — touching endpoints collide)", constraints: "> start_at" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | RESOLVED | CANCELLED; starts REPORTED", constraints: "terminal: RESOLVED, CANCELLED" }
      - { name: notes, type: string, source: input, description: "Free-text notes", default: null }

  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "FK -> User.id; reporting author" }
      - { name: title, type: string, source: input, description: "Publication title" }
      - { name: journal, type: string, source: input, description: "Venue / journal" }
      - { name: published_at, type: string, source: input, description: "Publication date YYYY-MM-DD" }
      - { name: acknowledges_core, type: boolean, source: input, description: "True when the paper acknowledges the core facility" }
      - { name: non_ack_reason, type: string, source: input, description: "Required when acknowledges_core is false", default: null }
      - { name: instrument_ids, type: array, source: input, description: "Non-empty array of Instrument.id values; every element must reference an existing Instrument", constraints: "non-empty" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | REJECTED; starts REPORTED", constraints: "terminal: VERIFIED, REJECTED" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the verifying CoreStaff; null until verified" }

  - name: FiscalYearPeriod
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label; unique. Fiscal year N covers calendar dates N-01-01 through N-12-31 inclusive (charge date = the entry's batch period; booking date = start_at's date)", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; starts OPEN; CLOSED is terminal", constraints: "OPEN | CLOSED" }
      - { name: carryforward_in_cents, type: integer, source: input, description: "Signed carryforward from the prior year's close (positive = surplus, negative = deficit); system-set on auto-creation", default: 0 }
      - { name: revenue_cents, type: integer, source: computed, description: "ACCRUAL revenue at close: sum of net_amount_cents over RechargeEntries of kind USAGE or PENALTY whose batch period falls in this fiscal year and whose status is BILLED or PAID at close time" }
      - { name: cash_revenue_cents, type: integer, source: computed, description: "CASH-variant informational revenue at close: same input set but only entries whose status is PAID at close time" }
      - { name: cost_cents, type: integer, source: computed, description: "Sum of annual_cost_cents over MaintenanceContracts whose coverage window intersects this fiscal year (full cost, no proration) + OPERATING_OVERHEAD_CENTS per Instrument that has at least one counted revenue entry this fiscal year" }
      - { name: surplus_deficit_cents, type: integer, source: computed, description: "revenue_cents - cost_cents (signed; positive = surplus, negative = deficit)" }
      - { name: carryforward_out_cents, type: integer, source: computed, description: "Equals surplus_deficit_cents; posted as carryforward_in_cents on the next fiscal year period" }
      - { name: closed_at, type: datetime, source: system, description: "Logical close timestamp; null while OPEN" }

# =============================================================================
# §1.2 State Machine Table (15 machines)
# =============================================================================
state_machines:
  - entity: User
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /users/{id}/suspend"
        actor: FacilityAdmin
        preconditions: []
        side_effects:
          - "User's REQUESTED bookings with start_at > now -> REJECTED"
          - "User's APPROVED bookings with start_at > now -> CANCELLED with cancellation_reason=USER_SUSPENDED, penalty_waived=true, penalty_cents=0"
          - "Each such cancellation releases the booking's grant encumbrance: Grant.budget_encumbered_cents -= booking.encumbered_cents, booking.encumbered_cents -> 0, Grant.status recomputed (EXHAUSTED may recover to ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /users/{id}/reactivate"
        actor: FacilityAdmin
        preconditions: []
        side_effects: []

  - entity: Instrument
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: DOWN
        trigger: "system: POST /downtime-events/{id}/confirm with kind=UNSCHEDULED_FAILURE on this instrument WHEN the event window contains the current logical time (future-window confirms leave the instrument AVAILABLE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "system: POST /downtime-events/{id}/confirm with kind IN {PREVENTIVE_MAINTENANCE, CALIBRATION} on this instrument WHEN the event window contains the current logical time"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DOWN, MAINTENANCE]
        to: AVAILABLE
        trigger: "POST /instruments/{id}/return-to-service, or system on POST /downtime-events/{id}/resolve"
        actor: "FacilityAdmin or system"
        preconditions:
          - "No other CONFIRMED DowntimeEvent on this instrument whose window contains the current logical time"
        side_effects: []
      - from: [AVAILABLE, DOWN, MAINTENANCE]
        to: RETIRED
        note: "future-window CONFIRMED downtime does NOT change instrument status; the DOWN/MAINTENANCE flip happens only when the confirmed window contains the current logical time"
        trigger: "POST /instruments/{id}/retire"
        actor: FacilityAdmin
        preconditions: []
        side_effects:
          - "REQUESTED bookings on this instrument -> REJECTED"
          - "APPROVED bookings on this instrument with start_at > now -> CANCELLED with cancellation_reason=INSTRUMENT_RETIRED, penalty_waived=true, penalty_cents=0"
          - "Each such cancellation releases the booking's grant encumbrance: Grant.budget_encumbered_cents -= booking.encumbered_cents, booking.encumbered_cents -> 0, Grant.status recomputed (EXHAUSTED may recover to ACTIVE)"
          - "CONFIRMED DowntimeEvents on this instrument -> RESOLVED"
          - "The instrument's line inside any RateSet with status IN {DRAFT, UNDER_REVIEW} gets flagged_for_review=true"

  - entity: TrainingRecord
    field: status
    initial_state: ENROLLED
    terminal_states: [REVOKED]
    note: "Cyclic recertification loop: ENROLLED -> CERTIFIED -> EXPIRED -> ENROLLED. EXPIRED is derived from expires_at vs the logical clock; any read or use of a CERTIFIED record whose expires_at <= now reports and treats it as EXPIRED."
    transitions:
      - from: ENROLLED
        to: CERTIFIED
        trigger: "POST /training-records/{id}/certify"
        actor: CoreStaff
        preconditions:
          - "User status ACTIVE"
          - "Instrument status != RETIRED"
        side_effects:
          - "certified_at = now; expires_at = now + 12 months (CERT_VALIDITY_MONTHS)"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: derived whenever current logical time >= expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: ENROLLED
        trigger: "POST /training-records/{id}/re-enroll"
        actor: CoreStaff
        preconditions: []
        side_effects:
          - "certified_at -> null, expires_at -> null"
      - from: [ENROLLED, CERTIFIED, EXPIRED]
        to: REVOKED
        trigger: "POST /training-records/{id}/revoke"
        actor: CoreStaff
        preconditions: []
        side_effects:
          - "Blocks all future booking creation/approval for this (user, instrument) until a NEW TrainingRecord is created and certified"

  - entity: Grant
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: "Status is computed: CLOSED (stored) > EXPIRED (end_date < today) > EXHAUSTED (budget_available_cents <= 0) > ACTIVE. EXHAUSTED <-> ACTIVE flips are derived bubble-ups of ledger mutations."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: ledger mutation (booking approval encumbrance, entry billing) drives budget_available_cents <= 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: reversal (booking cancel/release, entry write-off, budget amendment) drives budget_available_cents > 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, EXHAUSTED]
        to: EXPIRED
        trigger: "system: logical clock passes end_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, EXHAUSTED, EXPIRED]
        to: CLOSED
        trigger: "POST /grants/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "No RechargeEntries on this grant with status IN {PENDING, BILLED, DISPUTED} (else ERR_GRANT_HAS_OPEN_ENTRIES)"
        side_effects:
          - "Remaining encumbrance released: the grant's APPROVED bookings are NOT cancelled, but no new bookings may charge a CLOSED grant"

  - entity: RateSet
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Branching review loop: UNDER_REVIEW -> DRAFT on reject. Self-referential supersession on activation."
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /rate-sets/{id}/submit"
        actor: FacilityAdmin
        preconditions:
          - "lines non-empty; every instrument_id exists and is not RETIRED"
          - "Each line: external_rate >= internal_rate (ERR_RATE_ORDER_INVALID)"
          - "For each line whose instrument has a line in the currently EFFECTIVE set of the PRECEDING fiscal year: new internal rate <= prior internal rate * (1 + MAX_RATE_INCREASE_PCT), unless override_justification is supplied (ERR_RATE_CAP_EXCEEDED)"
        side_effects:
          - "break_even_review computed per line (projected variant); each line_verdicts[i].break_even_verdict set to PASS or DEFICIT"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rate-sets/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "FiscalYearPeriod for rate_set.fiscal_year exists and is OPEN (ERR_FY_CLOSED)"
          - "Every line with break_even_verdict=DEFICIT has a non-null break_even_waiver_reason (ERR_BREAK_EVEN_WAIVER_REQUIRED); waived lines recorded as WAIVED"
          - "Segregation of duties: approver X-User-ID != rate_set.developed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by = approver X-User-ID"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /rate-sets/{id}/reject"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /rate-sets/{id}/activate"
        actor: FinanceOfficer
        preconditions:
          - "current logical time >= effective_from"
          - "FiscalYearPeriod for rate_set.fiscal_year is OPEN (ERR_FY_CLOSED)"
        side_effects:
          - "Previously EFFECTIVE RateSet of the same fiscal_year (if any) -> SUPERSEDED; its id is recorded in this set's supersedes_rate_set_id"

  - entity: Booking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, PREEMPTED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bookings/{id}/approve"
        actor: CoreStaff
        preconditions:
          - "Instrument status AVAILABLE (ERR_INSTRUMENT_UNAVAILABLE)"
          - "User status ACTIVE (ERR_USER_SUSPENDED)"
          - "If instrument.requires_training: user holds a TrainingRecord for this instrument that is CERTIFIED with expires_at > booking.end_at (ERR_TRAINING_REQUIRED / ERR_TRAINING_EXPIRED)"
          - "Window still valid at approval time: no booking-vs-booking overlap (buffered half-open), no CONFIRMED downtime intersection (closed-interval)"
          - "INTERNAL: grant ACTIVE, booking date within grant window, user authorized on grant, grant.budget_available_cents >= provisional estimated_charge_cents (ERR_GRANT_BUDGET_EXCEEDED)"
          - "PRIORITY: preemption_victim_selection empties the window; if IN_PROGRESS or PRIORITY APPROVED bookings overlap -> ERR_PREEMPTION_BLOCKED"
        side_effects:
          - "Pins rate snapshot from the EFFECTIVE RateSet of the fiscal year containing start_at: rate_set_id, applied_rate_cents_per_hour (internal for INTERNAL users, external otherwise), applied_increment_minutes, applied_min_charge_minutes"
          - "estimated_charge_cents = provisional usage_charge (scheduled minutes x pinned rate); encumbered_cents = estimated_charge_cents for INTERNAL, 0 for EXTERNAL"
          - "Grant.budget_encumbered_cents += encumbered_cents; Grant.status recomputed"
          - "PREEMPTION: each selected victim booking -> PREEMPTED with cancellation_reason=PREEMPTION, penalty_waived=true, penalty_cents=0; each preemption releases the victim's grant encumbrance (Grant.budget_encumbered_cents -= victim.encumbered_cents, victim.encumbered_cents -> 0) and recomputes the victim grant's status"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /bookings/{id}/reject, or system on user suspension / instrument retirement"
        actor: "CoreStaff or system"
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: "Researcher | ExternalClient (own) | CoreStaff"
        preconditions: []
        side_effects:
          - "penalty_cents = 0 (cancelling a not-yet-approved booking is always free)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or system on downtime confirm / user suspension / instrument retirement"
        actor: "Researcher | ExternalClient (own) | CoreStaff | system"
        note: "The strictly-before-start_at restriction applies ONLY to the actor-driven cancel endpoint (ERR_INVALID_STATE past start); system-driven cancellations (downtime, suspension, retirement) are exempt"
        preconditions:
          - "actor-driven cancel: current logical time < start_at (after start, only no-show applies)"
        side_effects:
          - "penalty_cents per calculation cancellation_penalty (0 when notice >= free window or penalty_waived)"
          - "Grant encumbrance released: Grant.budget_encumbered_cents -= encumbered_cents, encumbered_cents -> 0, Grant.status recomputed"
          - "If penalty_cents > 0: a PENALTY RechargeEntry (amount=penalty, subsidy_offset=0, net=penalty) posts to the currently OPEN RechargeBatch (ERR_BATCH_NOT_OPEN if none), debiting the grant (or external invoice)"
      - from: APPROVED
        to: PREEMPTED
        trigger: "system: a PRIORITY booking approval selected this booking as a victim"
        actor: system
        preconditions:
          - "This booking has priority=STANDARD"
        side_effects:
          - "cancellation_reason=PREEMPTION, penalty_waived=true, penalty_cents=0"
          - "Grant encumbrance released as on cancel; Grant.status recomputed"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /bookings/{id}/check-in"
        actor: CoreStaff
        preconditions:
          - "current logical time >= start_at - 15 minutes (EARLY_CHECKIN_MINUTES = 15) and <= end_at"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: CoreStaff
        preconditions: []
        side_effects:
          - "Grant encumbrance released (actual charge will post via the UsageLog's RechargeEntry): Grant.budget_encumbered_cents -= encumbered_cents, encumbered_cents -> 0, Grant.status recomputed"
      - from: APPROVED
        to: NO_SHOW
        trigger: "POST /bookings/{id}/no-show"
        actor: CoreStaff
        preconditions:
          - "current logical time > start_at"
        side_effects:
          - "penalty_cents = no_show_penalty_pct x estimated_charge_cents (round_half_up to cents); penalty_waived=false"
          - "Grant encumbrance released; Grant.status recomputed"
          - "If penalty_cents > 0: PENALTY RechargeEntry posts to the OPEN batch as on cancel"

  - entity: UsageLog
    field: status
    initial_state: DRAFT
    terminal_states: [VALIDATED]
    note: "Correction cycle: REJECTED logs are edited via PUT and resubmitted (REJECTED -> SUBMITTED)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /usage-logs/{id}/submit"
        actor: CoreStaff
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /usage-logs/{id}/validate"
        actor: CoreStaff
        preconditions:
          - "Segregation of duties: validator X-User-ID != logged_by (ERR_SEGREGATION_OF_DUTIES)"
          - "Booking status COMPLETED (ERR_BOOKING_NOT_COMPLETED)"
          - "An OPEN RechargeBatch exists (ERR_BATCH_NOT_OPEN)"
          - "INTERNAL: after subsidy offset, grant.budget_available_cents >= net_amount_cents (ERR_GRANT_BUDGET_EXCEEDED)"
        side_effects:
          - "validated_by = validator X-User-ID"
          - "billable_minutes and usage_charge_cents computed per calculation usage_charge (final variant)"
          - "Subsidy waterfall (calculation subsidy_offset_waterfall) applies for INTERNAL users: subsidy_offset_cents drawn from ACTIVE awards"
          - "USAGE RechargeEntry created in the OPEN batch: amount=usage_charge_cents, offset per waterfall, net=amount-offset; entry status PENDING"
          - "Grant.budget_used_cents += net; award remaining_amount_cents decremented; Grant.status recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /usage-logs/{id}/reject"
        actor: CoreStaff
        preconditions:
          - "Segregation of duties: rejecter X-User-ID != logged_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /usage-logs/{id}/submit (after PUT correction)"
        actor: CoreStaff
        preconditions: []
        side_effects: []

  - entity: RechargeBatch
    field: status
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /recharge-batches/{id}/finalize"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "All entries in this batch with status PENDING -> BILLED"
          - "Totals frozen: entry_count, gross_amount_cents, subsidy_offset_cents, net_amount_cents recomputed once and immutable thereafter"
          - "Each affected Grant.status recomputed"
          - "NOTE: finalization does NOT auto-create the next batch; FinanceOfficer opens each period's batch explicitly via POST /recharge-batches (deterministic gating for fiscal-year close)"

  - entity: RechargeEntry
    field: status
    initial_state: PENDING
    terminal_states: [PAID, WRITTEN_OFF]
    note: "Dispute loop: BILLED -> DISPUTED -> BILLED (upheld) may repeat; DISPUTED -> WRITTEN_OFF is the compensating exit."
    transitions:
      - from: PENDING
        to: BILLED
        trigger: "system: batch finalization"
        actor: system
        preconditions: []
        side_effects: []
      - from: BILLED
        to: PAID
        trigger: "POST /recharge-entries/{id}/mark-paid"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: BILLED
        to: DISPUTED
        trigger: "POST /recharge-entries/{id}/dispute"
        actor: "Researcher | ExternalClient (own) | FinanceOfficer"
        preconditions:
          - "dispute_reason non-empty"
        side_effects: []
      - from: DISPUTED
        to: BILLED
        trigger: "POST /recharge-entries/{id}/resolve-dispute with resolution=UPHOLD"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "dispute_reason cleared"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /recharge-entries/{id}/resolve-dispute with resolution=WRITE_OFF"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Compensating ADJUSTMENT entry created in the currently OPEN batch (ERR_BATCH_NOT_OPEN if none) with kind=ADJUSTMENT, status=PAID (self-settling), grant_id/user_id/instrument_id copied from the original, amount_cents = -original.amount_cents, subsidy_offset_cents = 0, net_amount_cents = -original.amount_cents; the finalized batch's frozen totals never change"
          - "Grant budget_used_cents recomputes via the formula (WRITTEN_OFF original leaves the counted set; the PAID ADJUSTMENT never counts) — net effect: the original charge is fully credited; Grant.status recomputed (EXHAUSTED may recover to ACTIVE)"
          - "Subsidy reversed: award.remaining_amount_cents += original.subsidy_offset_cents (award may recover EXHAUSTED -> ACTIVE unless EXPIRED/REVOKED)"

  - entity: SubsidyApplication
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Revision cycle: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW may repeat."
    transitions:
      - from: [DRAFT, REVISION_REQUESTED]
        to: SUBMITTED
        trigger: "POST /subsidy-applications/{id}/submit"
        actor: "Researcher (own)"
        preconditions:
          - "Applicant affiliation INTERNAL (ERR_SUBSIDY_INELIGIBLE for EXTERNAL)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /subsidy-applications/{id}/review"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "reviewed_by = reviewer X-User-ID"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /subsidy-applications/{id}/request-revision"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /subsidy-applications/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "awarded_amount_cents > 0 and <= requested_amount_cents"
          - "conveys_priority=true permitted only for kind=STARTUP (ERR_SUBSIDY_INELIGIBLE otherwise)"
        side_effects:
          - "SubsidyAward created (status ACTIVE): application_id, user_id, kind copied; awarded_amount_cents, conveys_priority, valid_from, valid_until from input; remaining_amount_cents = awarded_amount_cents"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /subsidy-applications/{id}/reject"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

  - entity: SubsidyAward
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    note: "Status computed with precedence REVOKED (stored) > EXPIRED (valid_until <= now) > EXHAUSTED (remaining <= 0) > ACTIVE; EXHAUSTED -> ACTIVE recovery on offset reversal."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: subsidy waterfall drives remaining_amount_cents to 0"
        actor: system
        preconditions: []
        side_effects:
          - "Priority entitlement ends (conveys_priority no longer grants PRIORITY bookings)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches valid_until"
        actor: system
        preconditions: []
        side_effects:
          - "Priority entitlement ends"
      - from: [ACTIVE, EXHAUSTED, EXPIRED]
        to: REVOKED
        trigger: "POST /subsidy-awards/{id}/revoke"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Remaining balance clawed back: remaining_amount_cents -> 0 (already-applied offsets are NOT reversed)"
          - "Priority entitlement ends"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: write-off reversal restores remaining_amount_cents > 0 while still within validity window"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceContract
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "EXPIRED is derived from coverage_end vs the logical date. Overlap rule: an instrument may not have two contracts with status != TERMINATED whose [coverage_start, coverage_end] windows overlap; touching boundaries (end == start) are allowed (half-open date semantics)."
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /maintenance-contracts/{id}/terminate, or system on instrument retirement"
        actor: "FacilityAdmin or system"
        preconditions: []
        side_effects:
          - "Contract no longer satisfies ERR_CONTRACT_REQUIRED checks for new PREVENTIVE_MAINTENANCE events"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical date passes coverage_end"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DowntimeEvent
    field: status
    initial_state: REPORTED
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /downtime-events/{id}/confirm"
        actor: "CoreStaff | FacilityAdmin"
        preconditions:
          - "Instrument not RETIRED"
        side_effects:
          - "Instrument -> DOWN (UNSCHEDULED_FAILURE) or MAINTENANCE (PREVENTIVE_MAINTENANCE, CALIBRATION) ONLY when the event window contains the current logical time; a future-window confirm leaves the instrument AVAILABLE but still blocks overlapping bookings via ERR_DOWNTIME_CONFLICT"
          - "Bookings on this instrument whose [start_at, end_at) intersects the downtime window under CLOSED-interval semantics (touching endpoints count): APPROVED -> CANCELLED with cancellation_reason=DOWNTIME, penalty_waived=true, penalty_cents=0; REQUESTED -> REJECTED"
          - "Each such cancellation releases the booking's grant encumbrance: Grant.budget_encumbered_cents -= booking.encumbered_cents, booking.encumbered_cents -> 0, Grant.status recomputed (EXHAUSTED may recover to ACTIVE)"
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /downtime-events/{id}/resolve, or system on instrument retirement"
        actor: "CoreStaff | FacilityAdmin | system"
        preconditions: []
        side_effects:
          - "Instrument -> AVAILABLE when no other CONFIRMED downtime window contains the current logical time"
      - from: REPORTED
        to: CANCELLED
        trigger: "POST /downtime-events/{id}/cancel"
        actor: "CoreStaff | FacilityAdmin"
        preconditions: []
        side_effects: []

  - entity: Publication
    field: status
    initial_state: REPORTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /publications/{id}/verify"
        actor: CoreStaff
        preconditions:
          - "Evidence: the reporting user has at least one UsageLog with status VALIDATED whose instrument_id is in the publication's instrument_ids (ERR_PUBLICATION_EVIDENCE_MISSING)"
        side_effects:
          - "verified_by = verifier X-User-ID"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /publications/{id}/reject"
        actor: CoreStaff
        preconditions: []
        side_effects: []

  - entity: FiscalYearPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /fiscal-years/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "No RechargeBatch whose period falls inside this fiscal year has status OPEN (ERR_UNFINALIZED_BATCHES)"
        side_effects:
          - "fiscal_trueup computed (official ACCRUAL variant): revenue_cents, cash_revenue_cents (informational cash variant), cost_cents, surplus_deficit_cents, carryforward_out_cents; closed_at = now"
          - "Next fiscal year period auto-created (status OPEN) if absent, with carryforward_in_cents = this carryforward_out_cents"
          - "That next period's carryforward_in_cents propagates into any RateSet with status IN {DRAFT, UNDER_REVIEW} for the next fiscal year: derived_rate_computation re-runs with the new carryforward"
          - "Each re-derived line whose stored internal rate deviates from the derived suggestion by more than RATE_DEVIATION_FLAG_PCT gets flagged_for_review=true in line_verdicts"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-reschedule-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/reschedule"
    occ_field: "expected_booking_version"
    description: |
      Rescheduling an APPROVED booking against a Booking.version the client
      observed earlier is rejected when the booking's version has since advanced
      (e.g., a prior legitimate reschedule moved the window). Both reschedules
      are individually legitimate against the stored state, so the stale view —
      not any status field — is what must fail.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grant-amend-stale-grant
    parent_entity: Grant
    write_endpoint: "PUT /grants/{id}"
    occ_field: "expected_grant_version"
    description: |
      Amending a grant's budget or window against a Grant.version the client
      observed earlier is rejected when the grant's version has since advanced
      (e.g., a prior legitimate amendment already applied). Sequential amendments
      are individually legitimate, so only the stale version check rejects the
      second writer.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rate-set-edit-stale-rate-set
    parent_entity: RateSet
    write_endpoint: "PUT /rate-sets/{id}"
    occ_field: "expected_rate_set_version"
    description: |
      Editing a DRAFT rate set's lines or effective_from against a
      RateSet.version the client observed earlier is rejected when the set's
      version has since advanced (e.g., another developer's legitimate edit
      landed first). Sequential edits are individually legitimate while DRAFT,
      so only the stale version check rejects the second writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (10 rules)
# =============================================================================
calculations:
  - name: usage_charge
    trigger: "booking approval (PROVISIONAL variant -> Booking.estimated_charge_cents); usage-log validation (FINAL variant -> UsageLog.billable_minutes / usage_charge_cents)"
    algorithm: forward_looking
    formula: |
      PROVISIONAL (at approval, Booking):
        scheduled_minutes = (end_at - start_at) in whole minutes
        estimated_charge_cents = round_half_up(scheduled_minutes * applied_rate_cents_per_hour / 60)
        (no billing-increment ceil, no min-charge floor, no consumables)
      FINAL (at validation, UsageLog):
        actual_minutes = (actual_end_at - actual_start_at) in whole minutes
        billable_minutes = max(ceil(actual_minutes / applied_increment_minutes) * applied_increment_minutes,
                               applied_min_charge_minutes)
        usage_charge_cents = round_half_up(billable_minutes * applied_rate_cents_per_hour / 60) + consumable_fee_cents
      Rounding order is pinned: ceil to the billing increment FIRST (integer
      minutes), apply the min-charge floor SECOND, multiply by the rate and
      round_half_up to whole cents THIRD, add consumable_fee_cents LAST
      (consumables are never rounded). Computing money from un-ceiled minutes
      yields a different cent value and is non-conformant.
    input_set: "the booking's pinned rate snapshot (rate_set_id / applied_* fields); the two variants produce different results for identical bookings whenever actual minutes differ from scheduled minutes"
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "integer cents, round_half_up applied exactly once per money computation"
    variants:
      - name: provisional_estimate
        when: "booking approval"
        difference: "uses scheduled minutes as-is; excludes increment ceil, min-charge floor, and consumables"
      - name: final_validated_charge
        when: "usage-log validation"
        difference: "uses actual minutes with increment ceil + min-charge floor + consumables; result differs from provisional whenever actual != scheduled"

  - name: cancellation_penalty
    trigger: "booking cancel from APPROVED; staff no-show marking"
    algorithm: threshold
    formula: |
      if penalty_waived (reason IN {PREEMPTION, DOWNTIME, USER_SUSPENDED, INSTRUMENT_RETIRED}):
        penalty_cents = 0
      elif cancel from REQUESTED: penalty_cents = 0
      elif actor marks NO_SHOW:
        penalty_cents = round_half_up(estimated_charge_cents * no_show_penalty_pct)
      else (user/staff cancel of APPROVED before start):
        notice_minutes = (start_at - now) in whole minutes
        if notice_minutes >= cancellation_free_notice_hours * 60: penalty_cents = 0
        else: penalty_cents = round_half_up(estimated_charge_cents * late_cancel_penalty_pct)
      Boundary: notice EXACTLY equal to the free window is FREE (>= semantics).
      Inputs (>= 3): notice_minutes, estimated_charge_cents, per-instrument
      penalty percents, booking priority/reason branch — conditional branches on
      entity state make this non-linear.
    input_set: "the booking being cancelled, its instrument's penalty configuration, the logical clock"
    precision: "integer cents, round_half_up"

  - name: subsidy_offset_waterfall
    trigger: "USAGE RechargeEntry creation at usage-log validation (INTERNAL users only)"
    algorithm: waterfall_allocation
    formula: |
      candidates = SubsidyAwards where user_id == entry.user_id
        AND status resolves ACTIVE (not REVOKED/EXPIRED/EXHAUSTED)
        AND valid_from <= entry creation time < valid_until   (half-open: valid_until instant NOT eligible)
      order: valid_until ASC, tie-break created_at ASC
      Evaluation order is pinned and load-bearing:
        remaining_to_cover = entry.amount_cents
        for each award in order:
          take = min(award.remaining_amount_cents, remaining_to_cover)
          award.remaining_amount_cents -= take
          remaining_to_cover -= take
        entry.subsidy_offset_cents = entry.amount_cents - remaining_to_cover
        entry.net_amount_cents = remaining_to_cover
      PENALTY and ADJUSTMENT entries and EXTERNAL users are NEVER subsidized
      (offset 0). Boundary: when take exactly empties an award, the award
      becomes EXHAUSTED and the next award continues the same entry.
    input_set: "the new USAGE entry plus the user's ACTIVE awards at entry-creation time"
    precision: "integer cents"

  - name: derived_rate_computation
    trigger: "rate-set authoring aid, and re-run by the fiscal-year close cascade when carryforward_in changes"
    algorithm: constraint_propagation
    formula: |
      adjusted_cost_cents = projected_cost_cents - carryforward_in_cents
        (carryforward_in signed: surplus positive REDUCES next year's rate base,
         deficit negative INCREASES it)
      suggested_internal_rate = round_half_up(adjusted_cost_cents / projected_billable_hours)
      Rounding order pinned: each line's suggested rate is rounded to whole
      cents FIRST; the break-even re-check THEN runs against the ROUNDED rates
      (rounded rates feed projected revenue). Rounding only the final verdict
      yields different cents and is non-conformant.
      Cap check at submit: suggested vs the instrument's internal rate in the
      EFFECTIVE set of the PRECEDING fiscal year; increases >
      MAX_RATE_INCREASE_PCT require override_justification. Exactly AT the cap
      (<=) is allowed.
    input_set: "a DRAFT/UNDER_REVIEW RateSet's lines, the FY period's carryforward_in_cents, projected costs"
    constants:
      MAX_RATE_INCREASE_PCT: 0.10
      RATE_DEVIATION_FLAG_PCT: 0.05
    precision: "integer cents, round_half_up per line before aggregation"

  - name: break_even_review
    trigger: "rate-set submit (PROJECTED variant); fiscal-year close (ACTUAL variant, per instrument)"
    algorithm: aggregation
    formula: |
      PROJECTED (per RateSet line, at submit):
        projected_revenue_cents = internal_rate_cents_per_hour * projected_billable_hours
        projected_cost_cents = sum(annual_cost_cents of MaintenanceContracts on the
          instrument whose [coverage_start, coverage_end] intersects the rate set's
          fiscal year; full cost, NO proration) + OPERATING_OVERHEAD_CENTS
        verdict: PASS if projected_revenue_cents >= projected_cost_cents else DEFICIT
        (DEFICIT requires a waiver reason at approval -> recorded WAIVED)
      ACTUAL (per instrument, at FY close): revenue side of fiscal_trueup vs the
      same cost formula; the two variants diverge whenever actual usage deviates
      from projected hours.
    input_set: "PROJECTED: the rate set's lines + contracts; ACTUAL: the FY's billed/paid entries + contracts"
    constants:
      OPERATING_OVERHEAD_CENTS: 120000
    precision: "integer cents, round_half_up"
    variants:
      - name: projected
        when: "rate development / approval"
        difference: "revenue = rate x projected hours (planning estimate)"
      - name: actual
        when: "fiscal-year close"
        difference: "revenue = sum of billed/paid entry nets (realized); identical inputs to both variants give different totals whenever actual != projected"

  - name: fiscal_trueup
    trigger: "POST /fiscal-years/{id}/close"
    algorithm: aggregation
    formula: |
      counted_entries = RechargeEntries of kind IN {USAGE, PENALTY} whose
        RechargeBatch period (year, month) falls inside the fiscal year
      OFFICIAL ACCRUAL variant:
        revenue_cents = sum(net_amount_cents over counted_entries with status
          IN {BILLED, PAID} at close time)   (WRITTEN_OFF reversed -> excluded)
      INFORMATIONAL CASH variant (reported as cash_revenue_cents):
        cash_revenue_cents = sum(net_amount_cents over counted_entries with
          status PAID at close time)
      cost_cents = sum(annual_cost_cents of MaintenanceContracts whose coverage
        window intersects the fiscal year; full cost, no proration)
        + OPERATING_OVERHEAD_CENTS * (number of Instruments having >= 1 counted entry)
      surplus_deficit_cents = revenue_cents - cost_cents   (signed)
      carryforward_out_cents = surplus_deficit_cents
      The two variants produce different results for identical data whenever
      any counted entry is BILLED-but-unpaid at close; the ACCRUAL figure is
      the official one carried forward.
    input_set: "entries in the FY's finalized batches, contracts, instruments with usage"
    constants:
      OPERATING_OVERHEAD_CENTS: 120000
    precision: "integer cents"
    variants:
      - name: accrual_official
        when: "carryforward computation"
        difference: "counts BILLED and PAID entries"
      - name: cash_informational
        when: "reported alongside as cash_revenue_cents"
        difference: "counts PAID entries only; diverges from accrual by the unpaid-billed balance"

  - name: grant_budget_available
    trigger: "any mutation touching Booking.encumbered_cents or RechargeEntry.net_amount_cents for the grant"
    algorithm: aggregation
    formula: |
      budget_encumbered_cents = sum(encumbered_cents over Bookings of this grant
        with status IN {APPROVED, IN_PROGRESS})
      budget_used_cents = sum(net_amount_cents over RechargeEntries of this grant
        with kind IN {USAGE, PENALTY} and status IN {PENDING, BILLED, PAID, DISPUTED})
        (WRITTEN_OFF excluded; ADJUSTMENT entries never count)
      budget_available_cents = budget_total_cents - budget_encumbered_cents - budget_used_cents
      Grant.status: EXHAUSTED when budget_available_cents <= 0 (boundary: exactly
      0 IS exhausted); recovers to ACTIVE when a reversal pushes it > 0.
    input_set: "the grant's bookings with status IN {APPROVED, IN_PROGRESS} and its entries with status IN {PENDING, BILLED, PAID, DISPUTED}"
    precision: "integer cents"

  - name: preemption_victim_selection
    trigger: "approval of a PRIORITY booking whose window is occupied"
    algorithm: selector
    formula: |
      eligibility: bookings on the SAME instrument with status == APPROVED and
        priority == STANDARD whose [start_at, end_at) overlaps the incoming
        window under buffered half-open semantics
      ranking: created_at DESC (most recently created bumped first)
      tie-break: start_at ASC
      empty-pool / residual rule: after bumping ALL eligible victims, if any
        overlapping booking remains (IN_PROGRESS, or APPROVED with
        priority == PRIORITY), approval fails with ERR_PREEMPTION_BLOCKED and
        NO victim is bumped (all-or-nothing)
      approval succeeds only when the selected victim set fully clears the window
    input_set: "bookings of the same instrument overlapping the incoming PRIORITY window"
    precision: "n/a (selection)"

  - name: training_expiry
    trigger: "training certification; any read/use of a CERTIFIED record"
    algorithm: decay_function
    formula: |
      expires_at = certified_at + CERT_VALIDITY_MONTHS months (step decay, not continuous)
      effective_status = EXPIRED when current logical time >= expires_at else CERTIFIED
      Boundary: exactly AT expires_at the record IS expired (>= semantics);
      one second before, it is still CERTIFIED.
    input_set: "the TrainingRecord and the logical clock"
    constants:
      CERT_VALIDITY_MONTHS: 12
    precision: "second precision on the expiry instant"

  - name: batch_totals
    trigger: "entry creation in an OPEN batch; batch finalization freezes them"
    algorithm: aggregation
    formula: |
      entry_count = count(entries with batch_id == batch.id)
      gross_amount_cents = sum(amount_cents) over those entries
      subsidy_offset_cents = sum(subsidy_offset_cents) over those entries
      net_amount_cents = sum(net_amount_cents) over those entries
      While OPEN the totals track entries incrementally; at finalization they
      are frozen and MUST NOT change afterwards — post-finalization corrections
      post ADJUSTMENT entries into the NEXT open batch instead.
    input_set: "entries of the batch"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles; for entity-backed roles the id must reference an existing User", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles; entity-backed roles (Researcher, ExternalClient) may only access resources whose user_id equals X-User-ID and may only create resources with user_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: usage-log validator/rejecter X-User-ID != UsageLog.logged_by; rate-set approver X-User-ID != RateSet.developed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /usage-logs/{id}/validate, POST /usage-logs/{id}/reject, POST /rate-sets/{id}/approve" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right; body FK references (instrument_id, grant_id, user_id, booking_id, application_id, maintenance_contract_id, every element of instrument_ids) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "OCC: expected_<parent>_version matches the parent's current version on the three OCC write endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /bookings/{id}/reschedule, PUT /grants/{id}, PUT /rate-sets/{id}" }
  - { priority: 6, category: state, check: "Target resource state permits the requested transition per §1.2; booking approval additionally requires an EFFECTIVE RateSet for the fiscal year containing start_at", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "Entry-posting actions (cancel/no-show penalty, usage validation, write-off adjustment) require an OPEN RechargeBatch", error_id: ERR_BATCH_NOT_OPEN, http_status: 409, applies_to: "POST /bookings/{id}/cancel, POST /bookings/{id}/no-show, POST /usage-logs/{id}/validate, POST /recharge-entries/{id}/resolve-dispute" }
  - { priority: 8, category: state, check: "Rate-set approve/activate and batch creation rejected when the target FY period is CLOSED", error_id: ERR_FY_CLOSED, http_status: 409, applies_to: "POST /rate-sets/{id}/approve, POST /rate-sets/{id}/activate, POST /recharge-batches" }
  - { priority: 9, category: state, check: "Grant close rejected while entries PENDING/BILLED/DISPUTED exist on the grant", error_id: ERR_GRANT_HAS_OPEN_ENTRIES, http_status: 409, applies_to: "POST /grants/{id}/close" }
  - { priority: 10, category: state, check: "Instrument must be AVAILABLE for booking creation and approval", error_id: ERR_INSTRUMENT_UNAVAILABLE, http_status: 409, applies_to: "POST /bookings, POST /bookings/{id}/approve" }
  - { priority: 11, category: state, check: "User must be ACTIVE (not SUSPENDED) for booking creation/approval and training certification", error_id: ERR_USER_SUSPENDED, http_status: 403, applies_to: "POST /bookings, POST /bookings/{id}/approve, POST /training-records/{id}/certify" }
  - { priority: 12, category: business_safety, check: "If instrument.requires_training: a TrainingRecord for (user, instrument) exists with effective status CERTIFIED", error_id: ERR_TRAINING_REQUIRED, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/approve" }
  - { priority: 13, category: business_safety, check: "The CERTIFIED record's expires_at is strictly AFTER booking.end_at (certification must cover the whole session)", error_id: ERR_TRAINING_EXPIRED, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/approve" }
  - { priority: 14, category: business_temporal, check: "Booking start_at strictly in the future (> now)", error_id: ERR_BOOKING_IN_PAST, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/reschedule" }
  - { priority: 15, category: business_temporal, check: "Booking duration within [min_booking_minutes, max_booking_minutes]", error_id: ERR_DURATION_OUT_OF_RANGE, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/reschedule" }
  - { priority: 16, category: business_temporal, check: "No booking-vs-booking overlap on the instrument under buffered half-open semantics (each booking occupies [start_at, end_at + booking_buffer_minutes); intervals conflict iff they intersect; exact adjacency — one's start_at equals the other's buffered end — is allowed; REQUESTED bookings never block); a PRIORITY request may overlap STANDARD APPROVED victims", error_id: ERR_BOOKING_OVERLAP, http_status: 409, applies_to: "POST /bookings, POST /bookings/{id}/approve, POST /bookings/{id}/reschedule" }
  - { priority: 17, category: business_temporal, check: "No intersection with any CONFIRMED DowntimeEvent window on the instrument under CLOSED-interval semantics (touching endpoints collide)", error_id: ERR_DOWNTIME_CONFLICT, http_status: 409, applies_to: "POST /bookings, POST /bookings/{id}/approve, POST /bookings/{id}/reschedule" }
  - { priority: 18, category: business_temporal, check: "New maintenance contract coverage window must not overlap another contract with status != TERMINATED on the same instrument; touching boundaries allowed (half-open date semantics)", error_id: ERR_CONTRACT_OVERLAP, http_status: 409, applies_to: "POST /maintenance-contracts" }
  - { priority: 19, category: business_temporal, check: "UsageLog window: actual_end_at > actual_start_at and actual_end_at <= booking.end_at + 24h", error_id: ERR_USAGE_WINDOW_INVALID, http_status: 422, applies_to: "POST /usage-logs, PUT /usage-logs/{id}" }
  - { priority: 20, category: business_temporal, check: "PREVENTIVE_MAINTENANCE downtime requires maintenance_contract_id of an ACTIVE contract whose [coverage_start, coverage_end] contains the event window", error_id: ERR_CONTRACT_REQUIRED, http_status: 422, applies_to: "POST /downtime-events" }
  - { priority: 21, category: business_constraint, check: "Field-level formats: required fields present, enums valid, end_at > start_at, positive amounts, email format; unknown or computed/system-sourced fields in request bodies are rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 22, category: business_constraint, check: "Uniqueness: user email, grant_code, fiscal_year, (batch period_year, period_month), one EFFECTIVE rate set per fiscal year, one non-REVOKED TrainingRecord per (user, instrument), rate-set lines unique per instrument", error_id: ERR_UNIQUE_CONSTRAINT, http_status: 409, applies_to: "POST /users, POST /grants, POST /fiscal-years, POST /recharge-batches, POST /training-records, POST /rate-sets, PUT /rate-sets/{id}" }
  - { priority: 23, category: business_constraint, check: "No second OPEN RechargeBatch while one is OPEN", error_id: ERR_DUPLICATE_OPEN_BATCH, http_status: 409, applies_to: "POST /recharge-batches" }
  - { priority: 24, category: business_constraint, check: "Duplicate booking: same user + instrument + start_at among bookings with status IN {REQUESTED, APPROVED, IN_PROGRESS}", error_id: ERR_DUPLICATE_BOOKING, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 25, category: business_constraint, check: "One UsageLog per booking", error_id: ERR_USAGE_LOG_EXISTS, http_status: 409, applies_to: "POST /usage-logs" }
  - { priority: 26, category: business_constraint, check: "Each rate line: external_rate_cents_per_hour >= internal_rate_cents_per_hour", error_id: ERR_RATE_ORDER_INVALID, http_status: 422, applies_to: "POST /rate-sets, PUT /rate-sets/{id}" }
  - { priority: 27, category: business_constraint, check: "PRIORITY booking requires the user to hold an ACTIVE SubsidyAward with conveys_priority=true; EXTERNAL users are never eligible", error_id: ERR_PRIORITY_NOT_AVAILABLE, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 28, category: business_constraint, check: "PRIORITY approval blocked when an overlapping booking is IN_PROGRESS or PRIORITY APPROVED (victim set cannot clear the window)", error_id: ERR_PREEMPTION_BLOCKED, http_status: 409, applies_to: "POST /bookings/{id}/approve" }
  - { priority: 29, category: business_constraint, check: "Publication verify requires a VALIDATED usage log by the same user on one of the listed instruments", error_id: ERR_PUBLICATION_EVIDENCE_MISSING, http_status: 422, applies_to: "POST /publications/{id}/verify" }
  - { priority: 30, category: business_constraint, check: "Publication create: acknowledges_core=false requires non-empty non_ack_reason", error_id: ERR_ACK_REASON_REQUIRED, http_status: 422, applies_to: "POST /publications" }
  - { priority: 31, category: business_fiscal, check: "Grant affiliation: INTERNAL users must supply a grant_id; EXTERNAL users must not", error_id: ERR_GRANT_AFFILIATION_MISMATCH, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 32, category: business_fiscal, check: "Grant usable at booking time: status resolves ACTIVE (not EXHAUSTED/EXPIRED/CLOSED)", error_id: ERR_GRANT_INACTIVE, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/approve" }
  - { priority: 33, category: business_fiscal, check: "Booking date must fall within the grant's [start_date, end_date] chargeable window", error_id: ERR_GRANT_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/approve" }
  - { priority: 34, category: business_fiscal, check: "Booker authorized on grant: user_id == pi_user_id or in authorized_user_ids", error_id: ERR_GRANT_NOT_AUTHORIZED, http_status: 403, applies_to: "POST /bookings" }
  - { priority: 35, category: business_fiscal, check: "Fiscal capacity: at approval grant.budget_available_cents >= estimated_charge_cents; at validation grant.budget_available_cents >= entry net_amount_cents", error_id: ERR_GRANT_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /bookings/{id}/approve, POST /usage-logs/{id}/validate" }
  - { priority: 36, category: business_fiscal, check: "Rate cap: each submitted line's internal rate <= the prior fiscal year's EFFECTIVE line internal rate * (1 + MAX_RATE_INCREASE_PCT) unless override_justification supplied", error_id: ERR_RATE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /rate-sets/{id}/submit" }
  - { priority: 37, category: business_fiscal, check: "Rate-set approval: every DEFICIT line carries a break_even_waiver_reason", error_id: ERR_BREAK_EVEN_WAIVER_REQUIRED, http_status: 422, applies_to: "POST /rate-sets/{id}/approve" }
  - { priority: 38, category: business_fiscal, check: "Subsidy eligibility: applicant affiliation INTERNAL; conveys_priority award only for kind=STARTUP; awarded_amount_cents <= requested_amount_cents", error_id: ERR_SUBSIDY_INELIGIBLE, http_status: 422, applies_to: "POST /subsidy-applications, POST /subsidy-applications/{id}/submit, POST /subsidy-applications/{id}/approve" }
  - { priority: 39, category: business_referential, check: "Usage-log creation only for bookings with status COMPLETED", error_id: ERR_BOOKING_NOT_COMPLETED, http_status: 422, applies_to: "POST /usage-logs" }
  - { priority: 40, category: business_referential, check: "Fiscal-year close: no OPEN batch exists whose period falls inside the closing fiscal year", error_id: ERR_UNFINALIZED_BATCHES, http_status: 409, applies_to: "POST /fiscal-years/{id}/close" }
  - { priority: 41, category: business_temporal, check: "no-show allowed only after start_at has passed; cancel of APPROVED allowed only strictly before start_at", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /bookings/{id}/no-show, POST /bookings/{id}/cancel" }

# =============================================================================
# §1.5 API Endpoint Table (86 endpoints)
# =============================================================================
endpoints:
  # --- Users (5) ---
  - { method: POST, path: "/users", description: "Register a facility user", roles: [FacilityAdmin], code: 201, input: [full_name, email, affiliation, "department?", "is_pi?"], output: User, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/users", description: "List users with filters", roles: [FacilityAdmin, CoreStaff, FinanceOfficer], code: 200, input: ["affiliation?", "status?", "limit?", "offset?"], output: "User[]", side_effects: [] }
  - { method: GET, path: "/users/{id}", description: "Get one user; entity-backed roles may only read themselves", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: User, side_effects: [] }
  - { method: POST, path: "/users/{id}/suspend", description: "Suspend a user; future REQUESTED bookings are REJECTED and future APPROVED bookings CANCELLED (reason USER_SUSPENDED, penalty waived) with grant encumbrance released", roles: [FacilityAdmin], code: 200, input: [], output: User, side_effects: ["booking cascade per User state machine", "increments User.version by 1"] }
  - { method: POST, path: "/users/{id}/reactivate", description: "Reactivate a suspended user", roles: [FacilityAdmin], code: 200, input: [], output: User, side_effects: ["increments User.version by 1"] }

  # --- Instruments (5) ---
  - { method: POST, path: "/instruments", description: "Register an instrument with its booking/cancellation policy", roles: [FacilityAdmin], code: 201, input: [name, model, location, "requires_training?", "booking_buffer_minutes?", min_booking_minutes, max_booking_minutes, cancellation_free_notice_hours, late_cancel_penalty_pct, no_show_penalty_pct], output: Instrument, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/instruments", description: "List instruments", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["status?", "limit?", "offset?"], output: "Instrument[]", side_effects: [] }
  - { method: GET, path: "/instruments/{id}", description: "Get one instrument", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/instruments/{id}/retire", description: "Retire an instrument; cascades per Instrument state machine (bookings cancelled waived, downtime resolved, draft rate lines flagged)", roles: [FacilityAdmin], code: 200, input: [], output: Instrument, side_effects: ["retire cascade per Instrument state machine", "increments Instrument.version by 1"] }
  - { method: POST, path: "/instruments/{id}/return-to-service", description: "Return a DOWN/MAINTENANCE instrument to AVAILABLE when no current CONFIRMED downtime remains", roles: [FacilityAdmin], code: 200, input: [], output: Instrument, side_effects: ["increments Instrument.version by 1"] }

  # --- Training records (6) ---
  - { method: POST, path: "/training-records", description: "Enroll a user for training on an instrument", roles: [CoreStaff, FacilityAdmin], code: 201, input: [user_id, instrument_id], output: TrainingRecord, side_effects: ["status=ENROLLED"] }
  - { method: GET, path: "/training-records", description: "List training records; entity-backed roles are force-filtered to themselves", roles: [CoreStaff, FacilityAdmin, Researcher, ExternalClient], code: 200, input: ["user_id?", "instrument_id?", "status?", "limit?", "offset?"], output: "TrainingRecord[]", side_effects: [] }
  - { method: GET, path: "/training-records/{id}", description: "Get one training record", roles: [CoreStaff, FacilityAdmin, Researcher, ExternalClient], code: 200, input: [], output: TrainingRecord, side_effects: [] }
  - { method: POST, path: "/training-records/{id}/certify", description: "Certify an ENROLLED record: certified_at=now, expires_at=now+12 months", roles: [CoreStaff], code: 200, input: [], output: TrainingRecord, side_effects: ["sets certified_at/expires_at", "increments TrainingRecord.version by 1"] }
  - { method: POST, path: "/training-records/{id}/re-enroll", description: "Re-enroll an EXPIRED record back to ENROLLED (clears certified_at/expires_at)", roles: [CoreStaff], code: 200, input: [], output: TrainingRecord, side_effects: ["increments TrainingRecord.version by 1"] }
  - { method: POST, path: "/training-records/{id}/revoke", description: "Revoke a training record (terminal)", roles: [CoreStaff], code: 200, input: [], output: TrainingRecord, side_effects: ["increments TrainingRecord.version by 1"] }

  # --- Grants (5) ---
  - { method: POST, path: "/grants", description: "Create a grant funding source", roles: [FinanceOfficer], code: 201, input: [grant_code, pi_user_id, title, budget_total_cents, start_date, end_date, "authorized_user_ids?"], output: Grant, side_effects: ["status ACTIVE (subject to computed derivation)"] }
  - { method: GET, path: "/grants", description: "List grants; Researcher is force-filtered to grants where caller is PI or authorized", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher], code: 200, input: ["pi_user_id?", "status?", "limit?", "offset?"], output: "Grant[]", side_effects: [] }
  - { method: GET, path: "/grants/{id}", description: "Get one grant (Researcher only if PI or authorized)", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher], code: 200, input: [], output: Grant, side_effects: [] }
  - { method: PUT, path: "/grants/{id}", description: "Amend grant budget/window/authorized users; OCC on Grant.version; budget_total_cents may not be lowered below encumbered+used (ERR_GRANT_BUDGET_EXCEEDED)", roles: [FinanceOfficer], code: 200, input: [expected_grant_version, "budget_total_cents?", "start_date?", "end_date?", "authorized_user_ids?"], output: Grant, side_effects: ["increments Grant.version by 1", "Grant.status recomputed"] }
  - { method: POST, path: "/grants/{id}/close", description: "Close a grant with no open entries", roles: [FinanceOfficer], code: 200, input: [], output: Grant, side_effects: ["increments Grant.version by 1"] }

  # --- Rate sets (9) ---
  - { method: POST, path: "/rate-sets", description: "Author a DRAFT rate set for a fiscal year with embedded rate lines", roles: [FacilityAdmin], code: 201, input: [fiscal_year, effective_from, lines], output: RateSet, side_effects: ["status=DRAFT", "developed_by = caller X-User-ID"] }
  - { method: GET, path: "/rate-sets", description: "List rate sets", roles: [FacilityAdmin, FinanceOfficer], code: 200, input: ["fiscal_year?", "status?", "supersedes_rate_set_id?", "limit?", "offset?"], output: "RateSet[]", side_effects: [] }
  - { method: GET, path: "/rate-sets/{id}", description: "Get one rate set (includes line_verdicts)", roles: [FacilityAdmin, FinanceOfficer], code: 200, input: [], output: RateSet, side_effects: [] }
  - { method: PUT, path: "/rate-sets/{id}", description: "Edit a DRAFT rate set's lines/effective_from; OCC on RateSet.version", roles: [FacilityAdmin], code: 200, input: [expected_rate_set_version, "effective_from?", "lines?"], output: RateSet, side_effects: ["increments RateSet.version by 1"] }
  - { method: POST, path: "/rate-sets/{id}/submit", description: "Submit DRAFT for review; runs break_even_review (projected) and the rate-cap check", roles: [FacilityAdmin], code: 200, input: ["override_justification?"], output: RateSet, side_effects: ["line_verdicts computed", "increments RateSet.version by 1"] }
  - { method: POST, path: "/rate-sets/{id}/approve", description: "Approve an UNDER_REVIEW set (FinanceOfficer; SoD vs developed_by; DEFICIT lines need waivers)", roles: [FinanceOfficer], code: 200, input: [], output: RateSet, side_effects: ["approved_by set", "increments RateSet.version by 1"] }
  - { method: POST, path: "/rate-sets/{id}/reject", description: "Send an UNDER_REVIEW set back to DRAFT", roles: [FinanceOfficer], code: 200, input: ["reason?"], output: RateSet, side_effects: ["increments RateSet.version by 1"] }
  - { method: POST, path: "/rate-sets/{id}/activate", description: "Activate an APPROVED set once now >= effective_from; supersedes the incumbent EFFECTIVE set of the same fiscal year", roles: [FinanceOfficer], code: 200, input: [], output: RateSet, side_effects: ["incumbent EFFECTIVE set -> SUPERSEDED; supersedes_rate_set_id recorded", "increments RateSet.version by 1"] }
  - { method: GET, path: "/rate-sets/{id}/break-even", description: "Computed per-line projected break-even review", roles: [FacilityAdmin, FinanceOfficer], code: 200, input: [], output: { fiscal_year: integer, overall_verdict: string, lines: array }, side_effects: [] }

  # --- Bookings (10) ---
  - { method: POST, path: "/bookings", description: "Create a booking request (REQUESTED). Full validation chain per §1.4; INTERNAL requires grant_id, EXTERNAL forbids it.", roles: [Researcher, ExternalClient], code: 201, input: [user_id, instrument_id, "grant_id?", start_at, end_at, "priority?"], output: Booking, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/bookings", description: "List bookings; entity-backed roles are force-filtered to their own", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["user_id?", "instrument_id?", "grant_id?", "rate_set_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}", description: "Get one booking (entity-backed roles: own only)", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/bookings/{id}/approve", description: "Approve a REQUESTED booking: pins the rate snapshot, encumbers the grant, runs preemption when PRIORITY", roles: [CoreStaff], code: 200, input: [], output: Booking, side_effects: ["rate snapshot pinned; estimated_charge_cents computed (provisional)", "Grant.budget_encumbered_cents += encumbered_cents; Grant.status recomputed", "PRIORITY: victim STANDARD APPROVED bookings -> PREEMPTED with encumbrance release per Booking state machine", "increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{id}/reject", description: "Reject a REQUESTED booking", roles: [CoreStaff], code: 200, input: ["reason?"], output: Booking, side_effects: ["increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "Cancel a REQUESTED (free) or APPROVED (penalty per cancellation_penalty) booking; entity-backed callers must own it; cancellation_reason = USER for entity-backed callers, STAFF for CoreStaff", roles: [Researcher, ExternalClient, CoreStaff], code: 200, input: ["reason?"], output: Booking, side_effects: ["penalty per calculation cancellation_penalty", "grant encumbrance released; Grant.status recomputed", "penalty > 0 posts a PENALTY RechargeEntry to the OPEN batch", "increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{id}/reschedule", description: "Move an APPROVED booking to a new window; OCC on Booking.version; re-validates overlap/downtime/training; re-estimates and re-encumbers", roles: [Researcher, ExternalClient, CoreStaff], code: 200, input: [expected_booking_version, start_at, end_at], output: Booking, side_effects: ["increments Booking.version by 1", "estimate recomputed with pinned rate; grant encumbrance adjusted by the delta; Grant.status recomputed"] }
  - { method: POST, path: "/bookings/{id}/check-in", description: "Check in an APPROVED booking (from start_at - EARLY_CHECKIN_MINUTES until end_at)", roles: [CoreStaff], code: 200, input: [], output: Booking, side_effects: ["increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{id}/complete", description: "Complete an IN_PROGRESS booking; releases the grant encumbrance", roles: [CoreStaff], code: 200, input: [], output: Booking, side_effects: ["encumbrance released; Grant.status recomputed", "increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{id}/no-show", description: "Mark an APPROVED booking NO_SHOW after start_at; applies the no-show penalty as a PENALTY entry", roles: [CoreStaff], code: 200, input: [], output: Booking, side_effects: ["penalty per cancellation_penalty (no_show branch)", "encumbrance released; Grant.status recomputed", "PENALTY RechargeEntry posts to the OPEN batch when penalty > 0", "increments Booking.version by 1"] }

  # --- Usage logs (7) ---
  - { method: POST, path: "/usage-logs", description: "Create a DRAFT usage log for a COMPLETED booking (one per booking)", roles: [CoreStaff], code: 201, input: [booking_id, actual_start_at, actual_end_at, "consumable_fee_cents?"], output: UsageLog, side_effects: ["status=DRAFT", "logged_by = caller X-User-ID"] }
  - { method: GET, path: "/usage-logs", description: "List usage logs; entity-backed roles force-filtered to their own", roles: [CoreStaff, FacilityAdmin, FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["booking_id?", "instrument_id?", "user_id?", "status?", "limit?", "offset?"], output: "UsageLog[]", side_effects: [] }
  - { method: GET, path: "/usage-logs/{id}", description: "Get one usage log", roles: [CoreStaff, FacilityAdmin, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: UsageLog, side_effects: [] }
  - { method: PUT, path: "/usage-logs/{id}", description: "Edit a DRAFT or REJECTED usage log", roles: [CoreStaff], code: 200, input: ["actual_start_at?", "actual_end_at?", "consumable_fee_cents?"], output: UsageLog, side_effects: ["increments UsageLog.version by 1"] }
  - { method: POST, path: "/usage-logs/{id}/submit", description: "Submit a DRAFT or REJECTED log for validation", roles: [CoreStaff], code: 200, input: [], output: UsageLog, side_effects: ["increments UsageLog.version by 1"] }
  - { method: POST, path: "/usage-logs/{id}/validate", description: "Validate a SUBMITTED log (SoD: validator != logged_by): computes the final charge, runs the subsidy waterfall, posts a PENDING USAGE entry to the OPEN batch, debits the grant", roles: [CoreStaff], code: 200, input: [], output: UsageLog, side_effects: ["billable_minutes and usage_charge_cents computed (final variant)", "USAGE RechargeEntry created PENDING in OPEN batch; subsidy waterfall applied for INTERNAL users", "Grant.budget_used_cents += net; award remaining decremented; Grant.status recomputed", "increments UsageLog.version by 1"] }
  - { method: POST, path: "/usage-logs/{id}/reject", description: "Reject a SUBMITTED log back for correction (SoD: rejecter != logged_by)", roles: [CoreStaff], code: 200, input: ["reason?"], output: UsageLog, side_effects: ["increments UsageLog.version by 1"] }

  # --- Recharge batches (4) ---
  - { method: POST, path: "/recharge-batches", description: "Open a billing batch for a period; only one OPEN batch at a time; FY of the period must be OPEN", roles: [FinanceOfficer], code: 201, input: [period_year, period_month], output: RechargeBatch, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/recharge-batches", description: "List batches", roles: [FinanceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "RechargeBatch[]", side_effects: [] }
  - { method: GET, path: "/recharge-batches/{id}", description: "Get one batch", roles: [FinanceOfficer], code: 200, input: [], output: RechargeBatch, side_effects: [] }
  - { method: POST, path: "/recharge-batches/{id}/finalize", description: "Finalize an OPEN batch: PENDING entries -> BILLED, totals frozen (does NOT auto-create the next batch)", roles: [FinanceOfficer], code: 200, input: [], output: RechargeBatch, side_effects: ["PENDING entries -> BILLED", "totals frozen per calculation batch_totals", "increments RechargeBatch.version by 1"] }

  # --- Recharge entries (5) ---
  - { method: GET, path: "/recharge-entries", description: "List entries; entity-backed roles force-filtered to their own", roles: [FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["batch_id?", "usage_log_id?", "booking_id?", "grant_id?", "user_id?", "instrument_id?", "kind?", "status?", "limit?", "offset?"], output: "RechargeEntry[]", side_effects: [] }
  - { method: GET, path: "/recharge-entries/{id}", description: "Get one entry", roles: [FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: RechargeEntry, side_effects: [] }
  - { method: POST, path: "/recharge-entries/{id}/dispute", description: "Dispute a BILLED entry (owner or finance); dispute_reason required", roles: [Researcher, ExternalClient, FinanceOfficer], code: 200, input: [dispute_reason], output: RechargeEntry, side_effects: ["increments RechargeEntry.version by 1"] }
  - { method: POST, path: "/recharge-entries/{id}/resolve-dispute", description: "Resolve a DISPUTED entry: UPHOLD (-> BILLED) or WRITE_OFF (-> WRITTEN_OFF with grant credit, subsidy restoration, and ADJUSTMENT entry in the OPEN batch)", roles: [FinanceOfficer], code: 200, input: [resolution, "note?"], output: RechargeEntry, side_effects: ["per RechargeEntry state machine", "increments RechargeEntry.version by 1"] }
  - { method: POST, path: "/recharge-entries/{id}/mark-paid", description: "Mark a BILLED entry PAID", roles: [FinanceOfficer], code: 200, input: [], output: RechargeEntry, side_effects: ["increments RechargeEntry.version by 1"] }

  # --- Subsidy applications (7) ---
  - { method: POST, path: "/subsidy-applications", description: "Create a subsidy/startup application (INTERNAL researchers only)", roles: [Researcher], code: 201, input: [user_id, kind, requested_amount_cents, justification], output: SubsidyApplication, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/subsidy-applications", description: "List applications; Researcher force-filtered to own", roles: [FinanceOfficer, FacilityAdmin, Researcher], code: 200, input: ["user_id?", "status?", "limit?", "offset?"], output: "SubsidyApplication[]", side_effects: [] }
  - { method: GET, path: "/subsidy-applications/{id}", description: "Get one application", roles: [FinanceOfficer, FacilityAdmin, Researcher], code: 200, input: [], output: SubsidyApplication, side_effects: [] }
  - { method: POST, path: "/subsidy-applications/{id}/submit", description: "Submit a DRAFT or REVISION_REQUESTED application (owner only)", roles: [Researcher], code: 200, input: [], output: SubsidyApplication, side_effects: ["increments SubsidyApplication.version by 1"] }
  - { method: POST, path: "/subsidy-applications/{id}/review", description: "Move SUBMITTED -> UNDER_REVIEW", roles: [FinanceOfficer], code: 200, input: [], output: SubsidyApplication, side_effects: ["reviewed_by set", "increments SubsidyApplication.version by 1"] }
  - { method: POST, path: "/subsidy-applications/{id}/request-revision", description: "Send UNDER_REVIEW -> REVISION_REQUESTED", roles: [FinanceOfficer], code: 200, input: ["note?"], output: SubsidyApplication, side_effects: ["increments SubsidyApplication.version by 1"] }
  - { method: POST, path: "/subsidy-applications/{id}/approve", description: "Approve UNDER_REVIEW -> APPROVED and mint the SubsidyAward", roles: [FinanceOfficer], code: 200, input: [awarded_amount_cents, valid_from, valid_until, conveys_priority], output: SubsidyAward, side_effects: ["SubsidyAward created ACTIVE with remaining = awarded", "increments SubsidyApplication.version by 1"] }
  - { method: POST, path: "/subsidy-applications/{id}/reject", description: "Reject UNDER_REVIEW -> REJECTED", roles: [FinanceOfficer], code: 200, input: ["reason?"], output: SubsidyApplication, side_effects: ["increments SubsidyApplication.version by 1"] }

  # --- Subsidy awards (3) ---
  - { method: GET, path: "/subsidy-awards", description: "List awards; Researcher force-filtered to own", roles: [FinanceOfficer, Researcher], code: 200, input: ["application_id?", "user_id?", "status?", "limit?", "offset?"], output: "SubsidyAward[]", side_effects: [] }
  - { method: GET, path: "/subsidy-awards/{id}", description: "Get one award", roles: [FinanceOfficer, Researcher], code: 200, input: [], output: SubsidyAward, side_effects: [] }
  - { method: POST, path: "/subsidy-awards/{id}/revoke", description: "Revoke an award (terminal): remaining clawed back to 0, priority entitlement ends", roles: [FinanceOfficer], code: 200, input: ["reason?"], output: SubsidyAward, side_effects: ["remaining_amount_cents -> 0", "increments SubsidyAward.version by 1"] }

  # --- Maintenance contracts (4) ---
  - { method: POST, path: "/maintenance-contracts", description: "Create a maintenance contract; coverage windows of contracts with status != TERMINATED on one instrument must not overlap", roles: [FacilityAdmin], code: 201, input: [instrument_id, vendor, sla_response_hours, coverage_start, coverage_end, annual_cost_cents], output: MaintenanceContract, side_effects: ["status ACTIVE (subject to derivation)"] }
  - { method: GET, path: "/maintenance-contracts", description: "List contracts", roles: [FacilityAdmin, CoreStaff, FinanceOfficer], code: 200, input: ["instrument_id?", "status?", "limit?", "offset?"], output: "MaintenanceContract[]", side_effects: [] }
  - { method: GET, path: "/maintenance-contracts/{id}", description: "Get one contract", roles: [FacilityAdmin, CoreStaff, FinanceOfficer], code: 200, input: [], output: MaintenanceContract, side_effects: [] }
  - { method: POST, path: "/maintenance-contracts/{id}/terminate", description: "Terminate a contract (terminal)", roles: [FacilityAdmin], code: 200, input: ["reason?"], output: MaintenanceContract, side_effects: ["increments MaintenanceContract.version by 1"] }

  # --- Downtime events (6) ---
  - { method: POST, path: "/downtime-events", description: "Report a downtime event (PREVENTIVE_MAINTENANCE requires an ACTIVE covering contract)", roles: [CoreStaff, FacilityAdmin], code: 201, input: [instrument_id, kind, start_at, end_at, "maintenance_contract_id?", "notes?"], output: DowntimeEvent, side_effects: ["status=REPORTED"] }
  - { method: GET, path: "/downtime-events", description: "List downtime events", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["instrument_id?", "maintenance_contract_id?", "status?", "limit?", "offset?"], output: "DowntimeEvent[]", side_effects: [] }
  - { method: GET, path: "/downtime-events/{id}", description: "Get one downtime event", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: DowntimeEvent, side_effects: [] }
  - { method: POST, path: "/downtime-events/{id}/confirm", description: "Confirm a REPORTED event: instrument -> DOWN/MAINTENANCE; intersecting bookings cancelled (waived) or rejected; grant encumbrances released", roles: [CoreStaff, FacilityAdmin], code: 200, input: [], output: DowntimeEvent, side_effects: ["confirm cascade per DowntimeEvent state machine", "increments DowntimeEvent.version by 1"] }
  - { method: POST, path: "/downtime-events/{id}/resolve", description: "Resolve a CONFIRMED event; instrument returns to AVAILABLE when no other current CONFIRMED event remains", roles: [CoreStaff, FacilityAdmin], code: 200, input: [], output: DowntimeEvent, side_effects: ["increments DowntimeEvent.version by 1"] }
  - { method: POST, path: "/downtime-events/{id}/cancel", description: "Cancel a REPORTED event (erroneous report)", roles: [CoreStaff, FacilityAdmin], code: 200, input: [], output: DowntimeEvent, side_effects: ["increments DowntimeEvent.version by 1"] }

  # --- Publications (5) ---
  - { method: POST, path: "/publications", description: "Report a publication; acknowledges_core=false requires non_ack_reason", roles: [Researcher, ExternalClient], code: 201, input: [user_id, title, journal, published_at, acknowledges_core, instrument_ids, "non_ack_reason?"], output: Publication, side_effects: ["status=REPORTED"] }
  - { method: GET, path: "/publications", description: "List publications", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: ["user_id?", "instrument_id?", "status?", "limit?", "offset?"], output: "Publication[]", side_effects: [] }
  - { method: GET, path: "/publications/{id}", description: "Get one publication", roles: [FacilityAdmin, CoreStaff, FinanceOfficer, Researcher, ExternalClient], code: 200, input: [], output: Publication, side_effects: [] }
  - { method: POST, path: "/publications/{id}/verify", description: "Verify a REPORTED publication; requires a VALIDATED usage log by the same user on a listed instrument", roles: [CoreStaff], code: 200, input: [], output: Publication, side_effects: ["verified_by set", "increments Publication.version by 1"] }
  - { method: POST, path: "/publications/{id}/reject", description: "Reject a REPORTED publication", roles: [CoreStaff], code: 200, input: ["reason?"], output: Publication, side_effects: ["increments Publication.version by 1"] }

  # --- Fiscal years (4) ---
  - { method: POST, path: "/fiscal-years", description: "Open a fiscal year period", roles: [FinanceOfficer], code: 201, input: [fiscal_year, "carryforward_in_cents?"], output: FiscalYearPeriod, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/fiscal-years", description: "List fiscal year periods", roles: [FinanceOfficer, FacilityAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "FiscalYearPeriod[]", side_effects: [] }
  - { method: GET, path: "/fiscal-years/{id}", description: "Get one fiscal year period", roles: [FinanceOfficer, FacilityAdmin], code: 200, input: [], output: FiscalYearPeriod, side_effects: [] }
  - { method: POST, path: "/fiscal-years/{id}/close", description: "Close an OPEN fiscal year: runs fiscal_trueup (accrual official + cash informational), posts carryforward to the auto-created next period, re-derives next-year draft rate lines and flags deviations", roles: [FinanceOfficer], code: 200, input: [], output: FiscalYearPeriod, side_effects: ["close cascade per FiscalYearPeriod state machine", "increments FiscalYearPeriod.version by 1"] }

  # --- Test-driving clock (1) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default when never called: exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [FacilityAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["derived time-dependent statuses (EXPIRED grants/awards/contracts, EXPIRED training) resolve against the new clock on subsequent reads"] }

# =============================================================================
# §1.6 Error Code Catalog (39 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum value, bad date/datetime format, non-positive amount, end_at <= start_at" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or entity-backed id not found" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or entity-backed role accessing another user's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve (checked left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the requested transition (incl. cancel/no-show time-window misuse)" }
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "Entry-posting action requires an OPEN RechargeBatch" }
  - { id: ERR_FY_CLOSED, http: 409, condition: "Rate approval/activation or batch creation targets a CLOSED fiscal year" }
  - { id: ERR_GRANT_HAS_OPEN_ENTRIES, http: 409, condition: "Grant close blocked by entries in PENDING/BILLED/DISPUTED" }
  - { id: ERR_INSTRUMENT_UNAVAILABLE, http: 409, condition: "Instrument not AVAILABLE (DOWN/MAINTENANCE/RETIRED) for booking create/approve" }
  - { id: ERR_USER_SUSPENDED, http: 403, condition: "Suspended user cannot book or be certified" }
  - { id: ERR_TRAINING_REQUIRED, http: 422, condition: "No CERTIFIED training record for (user, instrument) on a training-requiring instrument" }
  - { id: ERR_TRAINING_EXPIRED, http: 422, condition: "Certification expires at or before booking end_at" }
  - { id: ERR_BOOKING_IN_PAST, http: 422, condition: "start_at is not strictly in the future" }
  - { id: ERR_DURATION_OUT_OF_RANGE, http: 422, condition: "Duration outside [min_booking_minutes, max_booking_minutes]" }
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "Buffered half-open overlap with another APPROVED/IN_PROGRESS booking on the instrument" }
  - { id: ERR_DOWNTIME_CONFLICT, http: 409, condition: "Closed-interval intersection with a CONFIRMED downtime window (touching endpoints collide)" }
  - { id: ERR_CONTRACT_OVERLAP, http: 409, condition: "Coverage window overlaps another contract with status != TERMINATED on the same instrument" }
  - { id: ERR_USAGE_WINDOW_INVALID, http: 422, condition: "actual_end_at <= actual_start_at, or actual_end_at beyond booking.end_at + 24h" }
  - { id: ERR_CONTRACT_REQUIRED, http: 422, condition: "PREVENTIVE_MAINTENANCE event lacks an ACTIVE contract covering its window" }
  - { id: ERR_UNIQUE_CONSTRAINT, http: 409, condition: "Duplicate email/grant_code/fiscal_year/batch period/training pair/rate-line instrument/EFFECTIVE rate set" }
  - { id: ERR_DUPLICATE_OPEN_BATCH, http: 409, condition: "An OPEN RechargeBatch already exists" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "Same user+instrument+start_at among REQUESTED/APPROVED/IN_PROGRESS bookings" }
  - { id: ERR_USAGE_LOG_EXISTS, http: 409, condition: "Booking already has a usage log" }
  - { id: ERR_RATE_ORDER_INVALID, http: 422, condition: "external_rate_cents_per_hour < internal_rate_cents_per_hour on a line" }
  - { id: ERR_PRIORITY_NOT_AVAILABLE, http: 422, condition: "PRIORITY booking without an ACTIVE priority-conveying award, or EXTERNAL requester" }
  - { id: ERR_PREEMPTION_BLOCKED, http: 409, condition: "PRIORITY approval blocked by IN_PROGRESS or PRIORITY overlap; victims not bumped" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Validator == logger, or rate approver == developer" }
  - { id: ERR_PUBLICATION_EVIDENCE_MISSING, http: 422, condition: "No VALIDATED usage by the reporting user on any listed instrument" }
  - { id: ERR_ACK_REASON_REQUIRED, http: 422, condition: "acknowledges_core=false without non_ack_reason" }
  - { id: ERR_GRANT_AFFILIATION_MISMATCH, http: 422, condition: "INTERNAL booking without grant_id, or EXTERNAL booking with one" }
  - { id: ERR_GRANT_INACTIVE, http: 422, condition: "Grant status not ACTIVE (EXHAUSTED/EXPIRED/CLOSED)" }
  - { id: ERR_GRANT_WINDOW_VIOLATION, http: 422, condition: "Booking date outside the grant's [start_date, end_date]" }
  - { id: ERR_GRANT_NOT_AUTHORIZED, http: 403, condition: "Booker is neither the grant's PI nor in authorized_user_ids" }
  - { id: ERR_GRANT_BUDGET_EXCEEDED, http: 422, condition: "Estimated charge (approval) or entry net (validation) exceeds grant budget_available_cents; also budget amendment below encumbered+used" }
  - { id: ERR_RATE_CAP_EXCEEDED, http: 422, condition: "Line internal rate exceeds 110% of the prior fiscal year's EFFECTIVE line rate without override_justification" }
  - { id: ERR_BREAK_EVEN_WAIVER_REQUIRED, http: 422, condition: "Approving a rate set whose DEFICIT line lacks break_even_waiver_reason" }
  - { id: ERR_SUBSIDY_INELIGIBLE, http: 422, condition: "EXTERNAL applicant, conveys_priority on non-STARTUP award, or awarded > requested" }
  - { id: ERR_UNFINALIZED_BATCHES, http: 409, condition: "Fiscal-year close while an in-year batch is still OPEN" }

# =============================================================================
# §1.7 RBAC Matrix (5 roles, segregation-of-duties model)
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Core facility administrator: user registry, instrument catalog, rate development, maintenance contracts"
    identity: opaque
    exclusive_operations:
      - "POST /users; POST /users/{id}/suspend; POST /users/{id}/reactivate"
      - "POST /instruments; POST /instruments/{id}/retire; POST /instruments/{id}/return-to-service"
      - "POST /rate-sets; PUT /rate-sets/{id}; POST /rate-sets/{id}/submit"
      - "POST /maintenance-contracts; POST /maintenance-contracts/{id}/terminate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "training record create (with CoreStaff)"
      - "downtime create/confirm/resolve/cancel (with CoreStaff)"
      - "read access to catalog, bookings, usage, applications, fiscal years"
  - name: CoreStaff
    description: "Facility scientific staff: training certification, booking approval, session check-in/out, usage logging"
    identity: opaque
    exclusive_operations:
      - "POST /training-records/{id}/certify; POST /training-records/{id}/re-enroll; POST /training-records/{id}/revoke"
      - "POST /bookings/{id}/approve; POST /bookings/{id}/reject; POST /bookings/{id}/check-in; POST /bookings/{id}/complete; POST /bookings/{id}/no-show"
      - "POST /usage-logs; PUT /usage-logs/{id}; POST /usage-logs/{id}/submit; POST /usage-logs/{id}/validate; POST /usage-logs/{id}/reject (subject to SoD: actor != logged_by)"
      - "POST /publications/{id}/verify; POST /publications/{id}/reject"
    shared_operations:
      - "training record create (with FacilityAdmin)"
      - "booking cancel (with owner)"
      - "downtime create/confirm/resolve/cancel (with FacilityAdmin)"
      - "read access to catalog, bookings, usage, grants"
  - name: FinanceOfficer
    description: "Research finance office: grants, rate approval/activation, recharge batches, entry dispute resolution, subsidies, fiscal-year close"
    identity: opaque
    exclusive_operations:
      - "POST /grants; PUT /grants/{id}; POST /grants/{id}/close"
      - "POST /rate-sets/{id}/approve; POST /rate-sets/{id}/reject; POST /rate-sets/{id}/activate (SoD: approver != developed_by)"
      - "POST /recharge-batches; POST /recharge-batches/{id}/finalize; GET /recharge-batches*"
      - "POST /recharge-entries/{id}/resolve-dispute; POST /recharge-entries/{id}/mark-paid"
      - "POST /subsidy-applications/{id}/review|request-revision|approve|reject; POST /subsidy-awards/{id}/revoke"
      - "POST /fiscal-years; POST /fiscal-years/{id}/close"
    shared_operations:
      - "entry dispute (with entry owner)"
      - "read access to users, instruments, rate sets, entries, fiscal years"
  - name: Researcher
    description: "INTERNAL university user (entity-backed): books instruments at internal rates against authorized grants, applies for subsidies, reports publications, disputes own entries"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /subsidy-applications; POST /subsidy-applications/{id}/submit (own)"
    shared_operations:
      - "booking create/cancel/reschedule (own; with CoreStaff on cancel/reschedule)"
      - "publication create (own; with ExternalClient)"
      - "entry dispute (own; with FinanceOfficer)"
      - "read access to catalog, downtime, own bookings/usage/entries/grants/applications/awards"
  - name: ExternalClient
    description: "EXTERNAL paying client (entity-backed): books at external rates, invoiced instead of grant-billed, never eligible for subsidies or priority access"
    identity: "entity_backed:User"
    exclusive_operations: []
    shared_operations:
      - "booking create/cancel/reschedule (own; grant_id forbidden)"
      - "publication create (own)"
      - "entry dispute (own)"
      - "read access to catalog, downtime, own bookings/usage/entries"
