              as: SchoolLiaison
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /student-registrations/${r2_id}/transitions"
              payload: { target_status: "VERIFIED", expected_distribution_event_version: "${ev_v_observed}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_EVENT_VERSION"
            - "StudentRegistration.${r2_id}.eligibility_status == PENDING"
            - "StudentRegistration.${r1_id}.eligibility_status == VERIFIED"

      - name: stale_drive_cycle_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[purchase-order-transition-stale-cycle]", "errors[ERR_STALE_CYCLE_VERSION]", "validations[priority=10]"]
        distinguishing_aspect: "A second order submitted with the cycle version observed before the first submission returns 412 ERR_STALE_CYCLE_VERSION and allocates no cash."
        test_recipe:
          setup:
            - "COLLECTING cycle with a 40000-cent UNRESTRICTED gift and two DRAFT pencil orders of 6540 cents each."
            - "The cycle version is read once, then consumed by submitting the first order."
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Acme Corp", amount_cents: 40000, restriction_type: "UNRESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d1_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", requested_unit_gap: 24 }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po1_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", requested_unit_gap: 24 }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po2_id: $.data.id }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { cyc_v_observed: $.data.version }
            - call: "POST /purchase-orders/${po1_id}/transitions"
              payload: { target_status: "SUBMITTED", expected_drive_cycle_version: "${cyc_v_observed}" }
              as: WarehouseLead
              as_user_id: "wl-1"
          trigger:
            - call: "POST /purchase-orders/${po2_id}/transitions"
              payload: { target_status: "SUBMITTED", expected_drive_cycle_version: "${cyc_v_observed}" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_CYCLE_VERSION"
            - "PurchaseOrder.${po2_id}.status == DRAFT and funding_allocations == []"
            - "PurchaseOrder.${po1_id}.status == SUBMITTED"
            - "DriveCycle.${cycle_id}.cash_allocated_cents == 6540"
            - "CashDonation.${d1_id}.allocated_cents == 6540"

      - name: cash_aggregates_are_reconciled_on_every_gift
        claim_type: derived_field_reconciliation
        grounds: ["calculations.cash_conservation", "calculations.teacher_supplemental_budget", "entities.DriveCycle.fields.unrestricted_gross_cents"]
        distinguishing_aspect: "After a 50000-cent unrestricted gift and a 30000-cent item-restricted gift, cash_received_cents is 80000, unrestricted_gross_cents is 50000 and supplemental_cap_cents is 7500 — the cap tracks only the unrestricted slice."
        test_recipe:
          setup: ["COLLECTING cycle with no gifts yet; backpacks exist in the catalog."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Acme Corp", amount_cents: 50000, restriction_type: "UNRESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Backpack Fund", amount_cents: 30000, restriction_type: "ITEM_RESTRICTED", restricted_supply_item_id: "${backpack_id}" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d2_id: $.data.id }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { received: $.data.cash_received_cents, cap: $.data.supplemental_cap_cents }
          assert:
            - "DriveCycle.${cycle_id}.cash_received_cents == 80000"
