      - name: client_book_entry_list_hides_soft_deleted_rows_until_the_flag_is_set
        claim_type: standard_crud
        grounds:
          - endpoints[GET /lateral-hiring/client-book-entries]
          - endpoints[DELETE /lateral-hiring/client-book-entries/{entry_id}]
          - entities.ClientBookEntry.fields.status
          - response_envelope.pagination_fields
          - entities.LateralQuestionnaire.fields.entry_count
        distinguishing_aspect: |
          The collection GET is the only route that can prove the soft-delete semantics,
          because DELETE returns the withdrawn row itself and so cannot show what the list
          now omits. Three reads of the SAME collection differ only in query parameters:
          the default read sees 1 of 2 rows, include_withdrawn=true sees both, and
          status=WITHDRAWN plus the flag isolates the tombstone. Every read also carries the
          meta envelope, so total_count must track the filtered set rather than the table.
