              payload: { variant: ROLLING }
              as: CurriculumDirector
              captures: { rb: $.data.base_amount, rr: $.data.contingency_rate, rt: $.data.forecast_total }
            - call: "GET /adoption-cycles/${cy_id}/budget-forecast"
              payload: { variant: STRAIGHT_LINE }
              as: CurriculumDirector
              captures: { sb: $.data.base_amount, sr: $.data.contingency_rate, st: $.data.forecast_total }
          assert:
            - "ROLLING: base_amount == 480000.00 (4000 * 120.00 * 0.20 * 5), contingency_rate == 0.08 (100000.00 <= 480000.00 < 500000.00), forecast_total == 518400.00"
            - "STRAIGHT_LINE with empty history: base_amount == 0.00, contingency_rate == 0.05, forecast_total == 0.00"

  - rule_id: non_linear_state_machine
