  - rule_id: cross_entity_state_dependency
    instances:
      - name: crossmatch_requires_active_type_and_screen
        grounds:
          - validations[priority=7]
          - entities.Patient.fields.has_active_type_and_screen
        distinguishing_aspect: |
          Pair Crossmatch x TypeAndScreen: with an ACTIVE T&S the crossmatch
          creates (PENDING); for a second patient verified under the EMERGENCY
          path with NO T&S, the same call fails with ERR_TS_NOT_ACTIVE —
          crossmatch is gated on the TypeAndScreen entity's state.
