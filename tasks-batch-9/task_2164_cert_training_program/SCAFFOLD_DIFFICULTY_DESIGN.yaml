  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_turnover_buffer_makes_exactly_adjacent_sessions_collide
        grounds:
          - validations[priority=40]
          - entities.ClassSession.fields.ends_at
          - entities.Facility.fields.room_code
          - errors[ERR_FACILITY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Overlap rule #1 lives on the FACILITY resource and uses BUFFERED interval geometry: the
          candidate's interval is widened by 30 minutes at BOTH ends before being intersected with the
          existing unbuffered [starts_at, ends_at). A session starting exactly when the previous one ends
          therefore COLLIDES, and a session starting exactly 30 minutes later does not.
        test_recipe:
          setup:
            - "Facility EOC-A holds one SCHEDULED session for CERT-101 running 2026-08-03T09:00:00Z to 2026-08-03T11:30:00Z with instructor Ines Ruiz"
            - "The candidate sessions use instructor Evan Ko, so the instructor rule cannot fire and the facility rule is isolated"
            - "Cohort C-2026A is RECRUITING with seats_confirmed 0, so the capacity check cannot fire"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
