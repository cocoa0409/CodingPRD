      - name: corner_issue_checks_pinned_source_version_then_issued_uniqueness
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - validations.priority_26
          - errors[ERR_DOCUMENT_STALE_SOURCE]
          - errors[ERR_DUPLICATE_ISSUED_DOCUMENT]
          - entities.TradeDocument.fields.pinned_order_version
