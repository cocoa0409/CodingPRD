              payload: { plan_update_id: "${pu}", source_element_id: "${el_par}", action_type: "MONITORING", title: "Reduce park deficit tracts", indicator_name: "deficit_tracts", indicator_direction: "DECREASE", baseline_value: 30, target_value: 12 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ia_off: $.data.id }
            - call: "POST /planning/implementation-actions/${ia_ok}/record-reading"
              payload: { reading_value: 140 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ok_track: $.data.on_track, ok_reads: $.data.reading_count }
            - call: "POST /planning/implementation-actions/${ia_off}/record-reading"
              payload: { reading_value: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { off_track: $.data.on_track, off_reads: $.data.reading_count }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: StateReviewer
              as_user_id: "state-1"
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_tra}", target_element_id: "${el_lu}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk: $.data.id }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
