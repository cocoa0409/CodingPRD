    status_codes: {200: "inspected", 400: "ERR_INVALID_REQUEST", 403: "ERR_MEMBER_RECUSED", 404: "ERR_REMEDIAL_ACTION_NOT_FOUND", 409: "ERR_REMEDIAL_STATE_INVALID"}

  # ------------------------- writes: credit sales -------------------------
  - method: POST
    path: /mitigation/credit-sales
    purpose: "Quote credits to a permittee. OCC-guarded against the bank ledger (§1.2.1). Applies the QUOTED variant of credit_sale_price, including the demand premium and the service-area tier."
