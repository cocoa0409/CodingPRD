            - "ChargeItem.${item}.gross_charge_cents == 240000 and ChargeItem.${item}.version == 5 (the failed reprice mutated nothing)"
            - "${e_schema} == ERR_VALIDATION with HTTP 422 (7-character justification beats the empty candidate set at 53)"
            - "${e_norule2} == ERR_NO_APPLICABLE_PRICE_RULE with HTTP 422"
            - "PriceRule.${rule_a}.status == ACTIVE (an expired interval does not change the rule's status)"
            - "the fourth call returns HTTP 201 (2026-11-01 abuts nothing: rule A ends 2026-10-01)"
            - "${gross_new} == 500000 and ${prior} == 240000"
            - "ChargeItem.${item}.applied_price_rule_id == ${rule_b}"
