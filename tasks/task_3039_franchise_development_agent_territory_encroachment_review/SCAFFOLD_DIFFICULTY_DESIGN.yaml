  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: underperformance_cascade_depth3
        grounds:
          - state_machines.DevelopmentAgent.transitions.UNDER_REVIEW_to_UNDERPERFORMING
          - state_machines.Territory.transitions.ASSIGNED_to_REASSIGNMENT_PENDING
          - state_machines.SiteApplication.transitions.SUBMITTED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from the second underperformance flag: agent ->
          UNDERPERFORMING mutates the territory to REASSIGNMENT_PENDING (hop 1),
          which itself suspends the territory's SUBMITTED site application (hop 2),
          which itself voids the application's PROVISIONAL impact study (hop 3) —
          each link caused by the previous link, not by the flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Agent DA (ACTIVE) assigned to territory T; a site application in SUBMITTED with a PROVISIONAL impact study."
            - "DA already carries one strike (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-C1", region: "Cascade", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "F2 LLC", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2_id: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2_id}", proposed_address: "9 Oak", proposed_lat: 40.012, proposed_lng: -75.0, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { study_id: $.data.id }
            - call: "POST /development-agents/${da_id}/flag-underperformance"
              payload: {}
              as: FranchisorOps
          trigger:
            - call: "POST /development-agents/${da_id}/flag-underperformance"
              payload: {}
              as: FranchisorOps
          assert:
            - "DevelopmentAgent.${da_id}.status == UNDERPERFORMING and underperformance_strikes == 2"
            - "Territory.${terr_id}.status == REASSIGNMENT_PENDING (hop 1)"
            - "SiteApplication.${app_id}.status == SUSPENDED (hop 2, caused by hop 1)"
            - "ImpactStudy.${study_id}.status == VOID (hop 3, caused by hop 2)"

      - name: fail_critical_inspection_cascade_depth2
        grounds:
          - state_machines.Store.transitions.OPEN_to_TERMINATION_PENDING
          - state_machines.Inspection.transitions.CONDUCTED_to_FINALIZED
          - state_machines.TransferRequest.transitions.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (inspection finalize, not agent
          flagging): FAIL_CRITICAL drives the store OPEN -> TERMINATION_PENDING
          (hop 1), and that store transition itself cancels the store's PENDING
          transfer request and voids its SCHEDULED follow-up inspection (hop 2).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with OPEN store S1 (owner FR1); a PENDING transfer request TR1 on S1 to buyer FR2; inspection I1 SCHEDULED on S1 with findings recorded (3 critical violations); a second inspection I2 still SCHEDULED."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-C2", region: "Cascade Two", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Seller LLC", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer LLC", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SC-201", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { tr1: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${s1}", scheduled_on: "2026-09-02T00:00:00Z", inspector_ref: "insp-1" }
              as: FranchisorOps
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/record-findings"
              payload: { food_safety_score: 70.0, cleanliness_score: 70.0, operations_score: 70.0, critical_violations: 3 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections"
              payload: { store_id: "${s1}", scheduled_on: "2026-09-09T00:00:00Z", inspector_ref: "insp-2" }
              as: FranchisorOps
              captures: { i2: $.data.id }
          trigger:
            - call: "POST /inspections/${i1}/finalize"
              payload: {}
              as: FranchisorOps
          assert:
            - "Inspection.${i1}.outcome == FAIL_CRITICAL (critical_violations 3 >= 3)"
            - "Store.${s1}.status == TERMINATION_PENDING (hop 1)"
            - "TransferRequest.${tr1}.status == CANCELLED (hop 2, caused by hop 1)"
            - "Inspection.${i2}.status == VOID (hop 2, caused by hop 1)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_transfer_approve
        grounds:
          - validations.priority_5_state
          - validations.priority_6_business_safety
          - errors.ERR_INVALID_STATE
          - errors.ERR_BUYER_TRAINING_INCOMPLETE
        distinguishing_aspect: |
          Category pair state vs business_safety: approving a CANCELLED transfer
          request whose buyer ALSO lacks completed training must surface
          ERR_INVALID_STATE (priority 5), never ERR_BUYER_TRAINING_INCOMPLETE
          (priority 6), proving state preconditions outrank safety gates.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with OPEN store S1 owned by FR1; transfer request TR1 on S1 to buyer FR2 (no training enrollment) created and then CANCELLED by the seller."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-P1", region: "Priority", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Seller LLC", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer LLC", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SP-301", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 P St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { tr1: $.data.id }
            - call: "POST /transfer-requests/${tr1}/cancel"
              payload: {}
              as: Franchisee
              as_user_id: "${fr1}"
          trigger:
            - call: "POST /transfer-requests/${tr1}/approve"
              payload: {}
              as: FranchisorOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "err != ERR_BUYER_TRAINING_INCOMPLETE (the priority-6 safety check never runs)"

      - name: referential_beats_temporal_on_protest_filing
        grounds:
