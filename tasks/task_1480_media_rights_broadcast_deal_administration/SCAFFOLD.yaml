  - status?
  - sublicensee_territory?
  - deal_id?
  output: SublicenseRequest[]
  side_effects: []
- method: GET
  path: /deals/{dealId}/sublicense-requests/{requestId}
  description: Get a sublicense request
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: SublicenseRequest
  side_effects: []
- method: POST
  path: /deals/{dealId}/sublicense-requests/{requestId}/approve
