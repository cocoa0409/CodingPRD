              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: "$.data.id", v_create: "$.data.version" }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${v_create}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1: "$.data.id" }
          trigger:
            - call: "POST /flag-rollout-steps/${step1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "GET /feature-flags/${flag_id}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { v_soak: "$.data.version" }
            - call: "POST /feature-flags/${flag_id}/pause"
              payload: { reason: "investigating latency" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { v_pause: "$.data.version" }
            - call: "POST /feature-flags/${flag_id}/resume"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { v_resume: "$.data.version" }
          assert:
            - "${v_create} == 1"
            - "The read-only GET does not change the version: a second GET still reports ${v_soak}"
            - "${v_pause} == ${v_soak} + 1"
            - "${v_resume} == ${v_soak} + 2"
            - "FeatureFlag.${flag_id}.state == ACTIVE_ROLLING_OUT after the resume"
            - "FeatureFlag.${flag_id}.kill_switch_engaged == false and current_exposure_pct == 0"
            - "FlagRolloutStep.${step1}.state == SOAKING throughout the pause and resume"

      - name: canary_abort_triggers_at_exactly_the_abort_error_rate_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.canary_health_verdict
          - entities.Deployment.fields.abort_error_rate_pct
          - entities.CanaryEvaluation.fields.abort_triggered
        distinguishing_aspect: "The abort predicate is >=, so an observed rate of exactly 25.0 percent against abort_error_rate_pct 25.0 sets abort_triggered true with weighted_health_score 58.0 and verdict FAIL, while a 24.9 percent window one tick below the threshold passes with 58.14."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Environment staging-eu: tier STAGING, hours 0..24, cooldown_minutes 0."
            - "Release 2026.08.1 cut at 2026-08-08T00:00:00Z; CANARY deployment (canary_pct 10, abort_error_rate_pct 25.0, abort_latency_p95_ms 800, min_sample_count 5) window [02:00, 04:00) started at 02:05."
            - "Two CANARY signals: at 02:10 with 8 requests / 2 errors / p95 300 ms (exactly 25.0 percent), and at 02:40 with 1000 requests / 249 errors / p95 300 ms (24.9 percent)."
            - "The clock is at 2026-08-10T02:45:00Z and the below-threshold window is evaluated first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "staging-eu", tier: "STAGING", deploy_window_start_hour_utc: 0, deploy_window_end_hour_utc: 24, cooldown_minutes: 0 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: "$.data.id" }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "CANARY", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800, canary_pct: 10, min_sample_count: 5 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /deployments/${dep_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:10:00Z", cohort: "CANARY", request_count: 8, error_count: 2, latency_p95_ms: 300 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:40:00Z", cohort: "CANARY", request_count: 1000, error_count: 249, latency_p95_ms: 300 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:45:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /deployments/${dep_id}/canary-evaluations"
              payload: { window_start_at: "2026-08-10T02:30:00Z", window_end_at: "2026-08-10T02:45:00Z" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { below_verdict: "$.data.verdict", below_score: "$.data.weighted_health_score" }
            - call: "POST /deployments/${dep_id}/canary-evaluations"
              payload: { window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T02:30:00Z" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { at_verdict: "$.data.verdict", at_score: "$.data.weighted_health_score" }
          assert:
            - "Below-threshold window: sample_count == 1000, error_rate_pct_rounded == 24.9, latency_p95_ms == 300"
            - "Below-threshold window: abort_triggered == false, verdict == PASS, weighted_health_score == 58.14"
            - "Deployment.${dep_id}.verification_state == PASSING and health_score == 58.14 after the first evaluation"
            - "At-threshold window: sample_count == 8, error_rate_pct_rounded == 25.0, latency_p95_ms == 300"
            - "At-threshold window: abort_triggered == true, verdict == FAIL, weighted_health_score == 58.0"
            - "Deployment.${dep_id}.verification_state == FAILING and health_score == 58.0 after the second evaluation"
            - "GET /deployments/${dep_id}/canary-evaluations returns total_count == 2"

      - name: cascading_side_effects_covered_by_difficulty_instances
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Incident.OPEN_to_DECIDED
          - state_machines.ReleaseTrain.ACTIVE_to_FROZEN
        excluded_because:
          difficulty_instance: transitive_cascade / incident_rollback_cascades_deployment_release_flag_steps_and_changes
          rationale: "The named §1.8 instance verifies the five-level chain end to end, and its sibling transitive_cascade instance covers the freeze chain and its ordering sensitivity."

      - name: dual_variant_calculation_covered_by_difficulty_instances
        claim_type: dual_variant_calculation
        grounds:
          - calculations.change_risk_score
          - calculations.release_readiness_score
        excluded_because:
          difficulty_instance: dual_variant_calc / change_risk_score_preliminary_vs_final_diverge_on_dependency_depth
          rationale: "The named §1.8 instance asserts both variants and the ledger delta, and its sibling dual_variant_calc instance does the same for the readiness score."

  # =======================================================================
  - section: consistency_model
    instances:

      - name: cut_response_body_carries_the_recomputed_release_fields
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Release.OPEN_to_CUT
          - calculations.release_readiness_score
        distinguishing_aspect: "Nothing lags: the cut response body itself already reports phase CUT, readiness_score_attested 94 and the deferral of the in-flight change, and a follow-up GET returns byte-identical values rather than a later-converging figure."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 (freeze_at 2026-08-08T00:00:00Z) on core-train."
            - "CR_L (40 lines, 1 subsystem, INTERNAL -> 9 LOW) is merged at 2026-08-01T00:00:00Z; CR_M (300 lines, 2 subsystems, SINGLE_TENANT -> 33 MEDIUM) is left in RISK_CLASSIFIED."
            - "The clock is advanced to 2026-08-08T00:00:00Z so the cut is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Small fix", summary_internal: "one-line fix", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: "$.data.id" }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Retry policy rewrite", summary_internal: "two subsystems", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_m: "$.data.id" }
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_m}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { body_phase: "$.data.phase", body_attested: "$.data.readiness_score_attested" }
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { read_phase: "$.data.phase", read_attested: "$.data.readiness_score_attested" }
          assert:
            - "The cut response body reports phase == CUT and readiness_score_attested == 94 in the same response"
            - "The cut response body reports committed_change_count == 1 and risk_budget_consumed_points == 9"
            - "${read_phase} == ${body_phase} and ${read_attested} == ${body_attested}"
            - "ChangeRequest.${cr_m}.state == DEFERRED as of the cut response, with no follow-up call needed"
            - "ChangeRequest.${cr_l}.state == MERGED"
            - "ReleaseTrain.${train_id}.open_release_count == 0 immediately after the cut"
            - "The response envelope carries meta.api_request_id and meta.api_request_timestamp with response_type == object"
