  - rule_id: priority_pair_validation_conflict
    instances:
      - name: paused_member_with_slot_held_by_waitlist_returns_member_not_active
        grounds:
          - "1.4 validation priority 14 ERR_MEMBER_NOT_ACTIVE, category state"
          - "1.4 validation priority 50 ERR_ITEM_SLOTS_EXHAUSTED, category business_fiscal"
          - "1.2 Member ACTIVE to PAUSED and 1.5 POST /members/{member_id}/pause"
          - "1.1 MembershipPlan.item_slots and Member.units_out_count"
          - "1.1 Reservation state WAITLISTED"
        distinguishing_aspect: >-
          Both rules are violated by the same request: the member is PAUSED (priority 14, category state) and the
          single SOLO1 item slot is already consumed by a WAITLISTED reservation (priority 50, category
          business_fiscal). The response must be ERR_MEMBER_NOT_ACTIVE, not ERR_ITEM_SLOTS_EXHAUSTED, because the
          state category is evaluated before the fiscal category. The pair is genuinely simultaneous - pausing is
          legal precisely because units_out_count is 0 while the waitlisted row still counts against item_slots - so
          an implementation that checks capacity first returns the wrong error_id with the same HTTP 409.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SOLO1 with item_slots 1, monthly_swaps_allowed 1 and shipping_cadence_days 14"
            - "style LUM-DRESS-03 with no rental units at all, so any request against it is waitlisted rather than matched"
            - "member on SOLO1 books 2026-08-10 to 2026-08-16 against LUM-DRESS-03 and lands in WAITLISTED at waitlist_position 1, which consumes the single item slot without raising units_out_count"
            - "the member is then paused, which is legal because validation priority 57 only requires units_out_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SOLO1", name: "Solo One", item_slots: 1, monthly_fee_cents: 4500, monthly_swaps_allowed: 1, shipping_cadence_days: 14, waiver_monthly_fee_cents: 900, waiver_coverage_cents: 4000 }
              as: PlatformAdmin
              captures: { plan_solo1_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "LUM-DRESS-03", brand: "Lumen", category: "DRESS", retail_price_cents: 20000, acquisition_cost_cents: 8000, size_run: ["S", "M"], expected_rental_turns_per_unit: 8, planned_eol_value_cents: 1500, forecast_monthly_requests: 0, avg_rental_days: 0, planned_depth_units: 0 }
              as: InventoryPlanner
              captures: { style_bare_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_solo1_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { style_id: "${style_bare_id}", requested_size: "M", requested_start_date: "2026-08-10", requested_end_date: "2026-08-16" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res1_id: "$.data.id" }
            - call: "POST /members/${member_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /reservations"
              payload: { style_id: "${style_bare_id}", requested_size: "M", requested_start_date: "2026-08-20", requested_end_date: "2026-08-24" }
              as: Member
              as_user_id: "${member_id}"
              captures: { reserve_error_id: "$.data.error_id" }
            - call: "POST /members/${member_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /reservations"
              payload: { style_id: "${style_bare_id}", requested_size: "M", requested_start_date: "2026-08-20", requested_end_date: "2026-08-24" }
              as: Member
              as_user_id: "${member_id}"
              captures: { reserve_error_id_2: "$.data.error_id" }
          assert:
            - "the response is HTTP 409 with error_id == ERR_MEMBER_NOT_ACTIVE"
            - "the response is NOT ERR_ITEM_SLOTS_EXHAUSTED, even though units_out_count 0 plus 1 waitlisted reservation already equals item_slots 1"
            - "GET /reservations?member_id={member_id} still reports total_count == 1 with the first reservation in state WAITLISTED at waitlist_position == 1"
            - "the member still reports status == PAUSED and units_out_count == 0"
            - "after the resume call the third trigger repeats the identical request and now returns HTTP 409 with error_id == ERR_ITEM_SLOTS_EXHAUSTED, which proves the fiscal rule was live and merely outranked"
      - name: quarantine_hold_outranks_segregation_of_duties_on_repair_signoff
        grounds:
          - "1.4 validation priority 20 ERR_QUARANTINE_HOLD_ACTIVE, category business_safety"
          - "1.4 validation priority 25 ERR_SEGREGATION_OF_DUTIES, category business_constraint"
          - "1.5 POST /reverse-logistics-jobs/{job_id}/repair-completion and quarantine-clearance"
          - "1.1 RentalUnit.quarantine_hold and Inspection.biohazard_flag"
          - "1.1 ReverseLogisticsJob.inspecting_technician_id"
        distinguishing_aspect: >-
          The repair sign-off is filed by the very technician who wrote the inspection, on a unit whose biohazard
          inspection set quarantine_hold true, so priority 20 (business_safety) and priority 25 (business_constraint)
          are violated by one call. The safety error must win. The instance then clears the quarantine with a properly
          certified second technician and repeats the identical call, which now returns ERR_SEGREGATION_OF_DUTIES -
          proving the duties rule was live all along and that the first response was an ordering decision rather than
          a missing check.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4, technician T-INSP-1 and technician T-REP-2, both ACTIVE and both repair_certified and photography_certified"
            - "style AUR-GOWN-01 and one grade-A size-M unit"
            - "one turn is completed to inbound receipt (received 2026-08-18) and T-INSP-1 files an inspection with HEAVY soil, MODERATE damage, condition_grade_after B and biohazard_flag true"
            - "that inspection sets unit.quarantine_hold true and condition_state QUARANTINED, leaves the job in PROCESSING with both cleaning_required and repair_required true, and opens a DamageClaim"
            - "job.inspecting_technician_id is therefore T-INSP-1, so a repair sign-off by T-INSP-1 also violates segregation of duties"
