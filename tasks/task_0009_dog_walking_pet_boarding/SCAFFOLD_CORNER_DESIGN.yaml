scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: owner_creation_minimum_required_fields_succeeds
        claim_type: creation
        grounds: ["entities.Owner", "endpoints[POST /api/v1/owners/register]"]
        distinguishing_aspect: "POST /api/v1/owners/register with all required fields (email, full_name, phone) returns 201 with the new Owner including server-minted id, created_at, version=1, wallet_credit_cents=0."
        test_recipe:
          setup: ["Empty DB; clock at 2026-06-20T08:00:00Z."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/owners/register"
              payload: { email: "corner_owner@example.com", full_name: "Corner Owner", phone: "+12025559001" }
              as: Anonymous
              captures: { new_owner_id: $.data.id, new_owner_version: $.data.version, new_owner_wallet: $.data.wallet_credit_cents }
          assert:
            - "HTTP status == 201"
            - "Owner.${new_owner_id}.version == 1"
            - "Owner.${new_owner_id}.wallet_credit_cents == 0"
            - "Owner.${new_owner_id}.email == 'corner_owner@example.com'"

      - name: owner_register_missing_required_field_invalid_request
        claim_type: required_fields
        grounds: ["entities.Owner", "validations[priority=18]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/v1/owners/register without email returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/owners/register"
              payload: { full_name: "No Email", phone: "+12025559002" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: sitter_register_fresh_defaults
        claim_type: defaults
        grounds: ["entities.Sitter"]
        distinguishing_aspect: "Newly registered Sitter has default status=APPLIED, tier=BRONZE, tier_score=10, claim_count=0, total_completed_bookings=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/sitters/register"
              payload: { email: "fresh_sitter@example.com", full_name: "Fresh Sitter", phone: "+12025559003" }
              as: Anonymous
              captures: { fresh_sitter_id: $.data.id, fresh_status: $.data.status, fresh_tier: $.data.tier, fresh_score: $.data.tier_score, fresh_claims: $.data.claim_count }
          assert:
            - "Sitter.${fresh_sitter_id}.status == APPLIED"
            - "Sitter.${fresh_sitter_id}.tier == BRONZE"
            - "Sitter.${fresh_sitter_id}.tier_score == 10"
            - "Sitter.${fresh_sitter_id}.claim_count == 0"
            - "Sitter.${fresh_sitter_id}.total_completed_bookings == 0"

      - name: owner_retrieval_returns_full_entity
        claim_type: retrieval
        grounds: ["entities.Owner", "endpoints[GET /api/v1/owners/{id}]"]
        distinguishing_aspect: "GET /api/v1/owners/{id} returns the stored Owner matching the path id."
        test_recipe:
          setup: ["One Owner created."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "ret_owner@example.com", full_name: "Ret Owner", phone: "+12025559004" }
              as: Anonymous
              captures: { ret_owner_id: $.data.id }
          trigger:
            - call: "GET /api/v1/owners/${ret_owner_id}"
              payload: {}
              as: Owner
              as_user_id: "${ret_owner_id}"
              captures: { ret_email: $.data.email }
          assert:
            - "response.data.id == ${ret_owner_id}"
            - "response.data.email == 'ret_owner@example.com'"

      - name: pet_creation_referenced_owner_not_found
        claim_type: parent_relationships
        grounds: ["entities.Pet", "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/v1/pets with owner_id pointing to a non-existent Owner returns 404 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["No Owner with id 00000000-0000-0000-0000-000000000000."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "any_owner@example.com", full_name: "Any", phone: "+12025559005" }
              as: Anonymous
              captures: { real_owner_id: $.data.id }
          trigger:
            - call: "POST /api/v1/pets"
              payload: { owner_id: "00000000-0000-0000-0000-000000000000", name: "Ghost", species: "DOG", weight_kg: 10 }
              as: Owner
              as_user_id: "${real_owner_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: pet_invalid_species_enum
        claim_type: type_constraints
        grounds: ["entities.Pet", "validations[priority=18]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/v1/pets with species='HAMSTER' returns 400 ERR_INVALID_REQUEST (enum constraint)."
        test_recipe:
          setup: ["Owner exists."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "pet_enum@example.com", full_name: "Pet Enum", phone: "+12025559006" }
              as: Anonymous
              captures: { pe_owner_id: $.data.id }
          trigger:
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${pe_owner_id}", name: "Ham", species: "HAMSTER", weight_kg: 0.5 }
              as: Owner
              as_user_id: "${pe_owner_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: gps_track_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.GpsTrack"]
        distinguishing_aspect: "GpsTrack has common_fields:false — no version field is present on read; entity is append-only (no update endpoint)."
        test_recipe:
          setup: ["A Booking has reached IN_PROGRESS; one GpsTrack created."]
          setup_api_calls:
            # Setup chain: register, BG, MG, book, key-handoff, start
            - call: "POST /api/v1/owners/register"
              payload: { email: "ogps@example.com", full_name: "O GPS", phone: "+12025559007" }
              as: Anonymous
              captures: { ogps_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sgps@example.com", full_name: "S GPS", phone: "+12025559008" }
              as: Anonymous
              captures: { sgps_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sgps_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bggps_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bggps_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${ogps_id}", name: "Track", species: "DOG", weight_kg: 9 }
              as: Owner
              as_user_id: "${ogps_id}"
              captures: { pgps_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${ogps_id}", sitter_id: "${sgps_id}", pet_id: "${pgps_id}", scheduled_at: "2026-06-21T07:30:00Z" }
              as: Owner
              as_user_id: "${ogps_id}"
              captures: { mggps_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mggps_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${ogps_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${ogps_id}", sitter_id: "${sgps_id}", pet_id: "${pgps_id}", service_type: "WALK_30MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-21T09:00:00Z", end_at: "2026-06-21T09:30:00Z" }
              as: Owner
              as_user_id: "${ogps_id}"
              captures: { bgps_id: $.data.id }
            - call: "POST /api/v1/bookings/${bgps_id}/confirm"
              payload: {}
              as: Sitter
              as_user_id: "${sgps_id}"
            - call: "POST /api/v1/key-handoffs"
              payload: { booking_id: "${bgps_id}", method: "IN_PERSON" }
              as: Owner
              as_user_id: "${ogps_id}"
              captures: { khgps_id: $.data.id }
            - call: "POST /api/v1/key-handoffs/${khgps_id}/receive"
              payload: {}
              as: Sitter
              as_user_id: "${sgps_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/bookings/${bgps_id}/start"
              payload: {}
              as: Sitter
              as_user_id: "${sgps_id}"
          trigger:
            - call: "POST /api/v1/gps-tracks"
              payload: { booking_id: "${bgps_id}", latitude: 40.7128, longitude: -74.0060, recorded_at: "2026-06-21T09:05:00Z" }
              as: Sitter
              as_user_id: "${sgps_id}"
              captures: { gt_id: $.data.id, gt_lat: $.data.latitude }
          assert:
            - "GpsTrack created; response.data.id is present and is a UUID"
            - "response.data does NOT include a 'version' field (common_fields:false)"
            - "response.data does NOT include an 'updated_at' field"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: booking_initial_state_is_requested
        claim_type: initial_state
        grounds: ["state_machines.Booking.initial_state"]
        distinguishing_aspect: "Booking created via POST /api/v1/bookings starts in status=REQUESTED."
        test_recipe:
          setup: ["Owner+Sitter+Pet+approved MG."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "ois@example.com", full_name: "O IS", phone: "+12025559010" }
              as: Anonymous
              captures: { ois_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sis@example.com", full_name: "S IS", phone: "+12025559011" }
              as: Anonymous
              captures: { sis_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sis_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bgis_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bgis_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${ois_id}", name: "IS", species: "DOG", weight_kg: 10 }
              as: Owner
              as_user_id: "${ois_id}"
              captures: { pis_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${ois_id}", sitter_id: "${sis_id}", pet_id: "${pis_id}", scheduled_at: "2026-06-22T07:30:00Z" }
              as: Owner
              as_user_id: "${ois_id}"
              captures: { mgis_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgis_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${ois_id}"
          trigger:
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${ois_id}", sitter_id: "${sis_id}", pet_id: "${pis_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-22T09:00:00Z", end_at: "2026-06-22T10:00:00Z" }
              as: Owner
              as_user_id: "${ois_id}"
              captures: { bis_id: $.data.id, bis_status: $.data.status }
          assert:
            - "Booking.${bis_id}.status == REQUESTED"

      - name: booking_terminal_state_cannot_re_cancel
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Booking.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED Booking cannot be cancelled again — second POST /api/v1/bookings/{id}/cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Booking b_term in REQUESTED state, then cancelled once."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "oterm@example.com", full_name: "O Term", phone: "+12025559012" }
              as: Anonymous
              captures: { oterm_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sterm@example.com", full_name: "S Term", phone: "+12025559013" }
              as: Anonymous
              captures: { sterm_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sterm_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bgterm_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bgterm_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${oterm_id}", name: "T", species: "DOG", weight_kg: 8 }
              as: Owner
              as_user_id: "${oterm_id}"
              captures: { pterm_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${oterm_id}", sitter_id: "${sterm_id}", pet_id: "${pterm_id}", scheduled_at: "2026-06-22T07:30:00Z" }
              as: Owner
              as_user_id: "${oterm_id}"
              captures: { mgterm_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgterm_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${oterm_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${oterm_id}", sitter_id: "${sterm_id}", pet_id: "${pterm_id}", service_type: "WALK_30MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-22T09:00:00Z", end_at: "2026-06-22T09:30:00Z" }
              as: Owner
              as_user_id: "${oterm_id}"
              captures: { bterm_id: $.data.id }
            - call: "POST /api/v1/bookings/${bterm_id}/cancel"
              payload: { reason: "first" }
              as: Owner
              as_user_id: "${oterm_id}"
          trigger:
            - call: "POST /api/v1/bookings/${bterm_id}/cancel"
              payload: { reason: "second attempt - rejects" }
              as: Owner
              as_user_id: "${oterm_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: booking_invalid_transition_complete_from_confirmed
        claim_type: invalid_transitions
        grounds: ["state_machines.Booking.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /api/v1/bookings/{id}/complete on a CONFIRMED Booking (not IN_PROGRESS) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Booking b_inv in CONFIRMED state."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "oinv@example.com", full_name: "O Inv", phone: "+12025559014" }
              as: Anonymous
              captures: { oinv_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sinv@example.com", full_name: "S Inv", phone: "+12025559015" }
              as: Anonymous
              captures: { sinv_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sinv_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bginv_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bginv_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${oinv_id}", name: "Inv", species: "DOG", weight_kg: 10 }
              as: Owner
              as_user_id: "${oinv_id}"
              captures: { pinv_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${oinv_id}", sitter_id: "${sinv_id}", pet_id: "${pinv_id}", scheduled_at: "2026-06-22T07:30:00Z" }
              as: Owner
              as_user_id: "${oinv_id}"
              captures: { mginv_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mginv_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${oinv_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${oinv_id}", sitter_id: "${sinv_id}", pet_id: "${pinv_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-22T09:00:00Z", end_at: "2026-06-22T10:00:00Z" }
              as: Owner
              as_user_id: "${oinv_id}"
              captures: { binv_id: $.data.id }
            - call: "POST /api/v1/bookings/${binv_id}/confirm"
              payload: {}
              as: Sitter
              as_user_id: "${sinv_id}"
          trigger:
            - call: "POST /api/v1/bookings/${binv_id}/complete"
              payload: {}
              as: Sitter
              as_user_id: "${sinv_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: meet_and_greet_branching_decline_terminal
        claim_type: invalid_transitions
        grounds: ["state_machines.MeetAndGreet.SCHEDULED_to_COMPLETED_DECLINED", "state_machines.MeetAndGreet.terminal_states"]
        distinguishing_aspect: "MeetAndGreet COMPLETED_DECLINED is terminal — a subsequent /approve attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["MG in COMPLETED_DECLINED state."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "odec@example.com", full_name: "O Dec", phone: "+12025559016" }
              as: Anonymous
              captures: { odec_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sdec@example.com", full_name: "S Dec", phone: "+12025559017" }
              as: Anonymous
              captures: { sdec_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sdec_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bgdec_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bgdec_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${odec_id}", name: "Dec", species: "DOG", weight_kg: 8 }
              as: Owner
              as_user_id: "${odec_id}"
              captures: { pdec_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${odec_id}", sitter_id: "${sdec_id}", pet_id: "${pdec_id}", scheduled_at: "2026-06-23T07:30:00Z" }
              as: Owner
              as_user_id: "${odec_id}"
              captures: { mgdec_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgdec_id}/decline"
              payload: { notes: "not a fit" }
              as: Owner
              as_user_id: "${odec_id}"
          trigger:
            - call: "POST /api/v1/meet-and-greets/${mgdec_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${odec_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: sitter_initial_state_is_applied_excluded
        claim_type: initial_state
        grounds: ["state_machines.Sitter.APPLIED_to_BG_CHECK_PENDING"]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_complete_cascade_depth_three_booking_to_sitter_counters_to_tier
          rationale: "Sitter's APPLIED → BG_CHECK_PENDING → ACTIVE chain is implicitly exercised by every §1.8 instance that drives a Sitter through to ACTIVE state before booking creation; verifying Sitter.status==APPLIED on registration is covered by the corner instance sitter_register_fresh_defaults above."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: booking_quote_below_deductible_recurring_zero_discount
        claim_type: correct_result
        grounds: ["calculations.booking_quote"]
        distinguishing_aspect: "WALK_30MIN BRONZE STANDARD NONE: base 2000 * 1.00 = 2000; * 1.00 = 2000; - 0 discount + 0 surcharge = 2000 cents."
        test_recipe:
          setup: ["Sitter ACTIVE BRONZE, MG approved."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "obq@example.com", full_name: "O BQ", phone: "+12025559020" }
              as: Anonymous
              captures: { obq_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sbq@example.com", full_name: "S BQ", phone: "+12025559021" }
              as: Anonymous
              captures: { sbq_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sbq_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bgbq_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bgbq_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${obq_id}", name: "Q", species: "DOG", weight_kg: 8 }
              as: Owner
              as_user_id: "${obq_id}"
              captures: { pbq_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-24T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${obq_id}", sitter_id: "${sbq_id}", pet_id: "${pbq_id}", scheduled_at: "2026-06-24T07:30:00Z" }
              as: Owner
              as_user_id: "${obq_id}"
              captures: { mgbq_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgbq_id}/approve"
              payload: {}
              as: Owner
