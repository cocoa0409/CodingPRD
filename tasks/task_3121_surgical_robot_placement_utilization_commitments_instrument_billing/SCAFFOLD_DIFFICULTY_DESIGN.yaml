          assert:
            - "PlacementAgreement.${agr}.agreement_status == TERMINATED"
            - "hop 1: GET /api/robot-systems/${sys} reports service_status DECOMMISSIONED"
            - "hop 2: GET /api/service-contracts/${sc} reports contract_status TERMINATED"
            - "hop 3: GET /api/incident-service-requests/${inc} reports request_status RESOLVED with a non-null resolved_at_utc"
            - "HospitalAccount.${acct}.account_posture == ONBOARDING_GATE because the account's only review is PASSED but it now has no ACTIVE agreement gate left to lift it"

      - name: system_service_action_two_hop_agreement_suspension_cascade
        grounds:
          - state_machines.RobotSystem.IN_SERVICE_to_SERVICE_ACTION_REQUIRED
          - state_machines.PlacementAgreement.ACTIVE_to_SUSPENDED
