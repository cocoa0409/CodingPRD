      - name: a_patient_cannot_address_another_patients_visit_reminder_or_record
        claim_type: peer_roles
        grounds:
          - errors[ERR_PATIENT_NOT_OWNER]
          - roles[Patient].identity
          - roles[Patient].shared_operations
        distinguishing_aspect: |
          Patient is the second entity_backed role and the only one whose ownership check
          covers reads as well as writes, across four different addressed entities — the
          patient row, the visit, the regimen and the reminder contact. Every one of those
          must answer ERR_PATIENT_NOT_OWNER (403) rather than a 404, because the row plainly
          exists and a staff role can read it in the same fixture; and the same patient's own
          rows must remain reachable, so this is scoping and not a blanket denial.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One center, one chair, one nurse with capacity 12, one drug, one MID template."
            - "Two 70 kg patients, each with an ACTIVE 6-cycle plan and one TENTATIVE visit: patient one on 2026-08-10 at 540, patient two on 2026-08-11 at 540."
            - "One SMS reminder contact is queued on patient two's visit and is still NO_RESPONSE."
