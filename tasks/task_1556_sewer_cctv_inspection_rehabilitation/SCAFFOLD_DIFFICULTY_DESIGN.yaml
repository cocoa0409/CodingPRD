            - call: "POST /sewer/districts/${d_id}/flow-periods"
              payload: { basin_label: "B1", phase: "PRE_REHAB", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-15T00:00:00Z" }
              as: DistrictEngineer
              captures: { fpre_id: $.data.id }
            - call: "POST /sewer/flow-periods/${fpre_id}/activate"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/flow-periods/${fpre_id}/close"
              payload: { dry_weather_avg_gpm: 100, peak_storm_gpm: 500 }
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/flow-periods"
              payload: { basin_label: "B1", phase: "POST_REHAB", window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-25T00:00:00Z" }
              as: DistrictEngineer
              captures: { fpost_id: $.data.id }
            - call: "POST /sewer/flow-periods/${fpost_id}/activate"
              payload: {}
              as: DistrictEngineer
