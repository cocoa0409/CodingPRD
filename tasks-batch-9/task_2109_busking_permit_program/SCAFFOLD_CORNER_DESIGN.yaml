scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: corner_zone_creation_returns_every_declared_field
        claim_type: creation
        grounds: ["entities.Zone", "endpoints"]
        distinguishing_aspect: "POST /busking/zones with all declared inputs returns 201 and every Zone field, with active_closure_count seeded to 0 and version 1."
        test_recipe:
          setup: ["Empty database; logical clock untouched at its 2026-08-01T00:00:00Z startup default."]
          setup_api_calls: []
          trigger:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
          assert:
            - 'HTTP status is 201'
            - 'Zone.${z1}.name == "Riverside Plaza"'
            - 'Zone.${z1}.code == "RP"'
            - 'Zone.${z1}.base_noise_cap_db == 78'
            - 'Zone.${z1}.quiet_hours_start_minute == 1380'
            - 'Zone.${z1}.active_closure_count == 0'
            - 'Zone.${z1}.version == 1'
            - 'response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == "object"'

      - name: corner_pitch_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds: ["entities.Pitch.fields.amplification_allowed", "entities.Pitch.fields.max_session_minutes", "entities.Pitch.fields.daily_session_cap", "entities.Pitch.fields.premium_slots_per_draw", "entities.Pitch.fields.availability_status"]
        distinguishing_aspect: "Creating a pitch with only zone_id, code, tier and noise_cap_db yields amplification_allowed false, max_session_minutes 120, daily_session_cap 3, premium_slots_per_draw 1, fallback_pitch_id null and availability_status OPEN."
        test_recipe:
          setup: ["One zone exists."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
          trigger:
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-09", tier: "STANDARD", noise_cap_db: 80 }
              as: PermitOfficer
              captures: { p9: "$.data.id" }
          assert:
            - 'Pitch.${p9}.amplification_allowed == false'
            - 'Pitch.${p9}.max_session_minutes == 120'
            - 'Pitch.${p9}.daily_session_cap == 3'
            - 'Pitch.${p9}.premium_slots_per_draw == 1'
            - 'Pitch.${p9}.fallback_pitch_id == null'
            - 'Pitch.${p9}.availability_status == "OPEN"'
            - 'Zone.${z1}.weekend_noise_bonus_db == 0 and Zone.${z1}.evening_penalty_db == 0 and Zone.${z1}.max_concurrent_closures == 1'

      - name: corner_pitch_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints", "entities.Pitch"]
        distinguishing_aspect: "GET /busking/pitches?zone_id=...&limit=2&offset=0 over three pitches returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One zone holds exactly three pitches."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82 }
              as: PermitOfficer
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-02", tier: "STANDARD", noise_cap_db: 80 }
              as: PermitOfficer
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-P1", tier: "PREMIUM", noise_cap_db: 84 }
              as: PermitOfficer
          trigger:
            - call: "GET /busking/pitches?zone_id=${z1}&limit=2&offset=0"
              as: PermitOfficer
            - call: "GET /busking/pitches?zone_id=${z1}&limit=2&offset=2"
              as: PermitOfficer
          assert:
            - 'The first list returns 2 items with total_count == 3 and has_more == true'
            - 'The second list returns 1 item with total_count == 3 and has_more == false'
            - 'response_type == "array" on both'

      - name: corner_pitch_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PITCH_NOT_FOUND]", "validations[priority=30]"]
        distinguishing_aspect: "GET /busking/pitches/00000000-0000-4000-8000-000000000000 returns 404 with data.error_id ERR_PITCH_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /busking/pitches/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
              captures: { e404: "$.data.error_id" }
          assert:
            - 'HTTP status is 404'
            - 'data.error_id == "ERR_PITCH_NOT_FOUND"'

      - name: corner_performer_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Performer.fields.email", "validations[priority=45]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /busking/performers without the required email field returns 400 ERR_INVALID_REQUEST and creates no Performer row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { e_req: "$.data.error_id" }
          assert:
            - 'HTTP status is 400'
            - 'data.error_id == "ERR_INVALID_REQUEST"'

      - name: corner_performer_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Performer.fields.conduct_score", "entities.Performer.fields.standing", "entities.Performer.fields.premium_wins_this_season", "validations[priority=45]"]
        distinguishing_aspect: "Body keys outside the declared input list (id, conduct_score, standing) are ignored, so the created Performer still has a server-minted UUID id, conduct_score 100, renewal_conduct_score 100 and standing GOOD."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC", conduct_score: 10, standing: "BARRED", id: "not-a-uuid" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
          assert:
            - 'HTTP status is 201'
            - 'Performer.${perf_a}.conduct_score == 100'
            - 'Performer.${perf_a}.renewal_conduct_score == 100'
            - 'Performer.${perf_a}.standing == "GOOD"'
            - 'Performer.${perf_a}.upheld_complaint_count == 0'
            - 'Performer.${perf_a}.premium_wins_this_season == 0'
            - 'Performer.${perf_a}.id is a server-minted UUID with no type prefix and is not the string "not-a-uuid"'

      - name: corner_pitch_invalid_tier_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Pitch.fields.tier", "validations[priority=45]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tier outside {PREMIUM, STANDARD} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One zone exists."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
          trigger:
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-BAD", tier: "GOLD", noise_cap_db: 80 }
              as: PermitOfficer
              captures: { e_enum: "$.data.error_id" }
          assert:
            - 'HTTP status is 400'
            - 'data.error_id == "ERR_INVALID_REQUEST"'
            - 'GET /busking/pitches?zone_id=${z1} returns total_count 0'

      - name: corner_audition_score_is_immutable_and_has_no_version
        claim_type: immutability
        grounds: ["entities.AuditionScore", "entities.AuditionScore.fields.composite_score"]
        distinguishing_aspect: "AuditionScore is declared common_fields false, so its create response carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it."
        test_recipe:
          setup: ["Performer Bo's AMPLIFIED_MUSIC application is in AUDITION_SCHEDULED with an open sitting."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Bo Kestrel", stage_name: "Bo K", email: "bo@example.org", act_type: "AMPLIFIED_MUSIC" }
              as: PermitOfficer
              captures: { perf_b: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_b}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "AMPLIFIED_MUSIC", amplification_requested: true }
              as: Performer
              as_user_id: "${perf_b}"
              captures: { app_b: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_b}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_b}"
            - call: "POST /busking/permit-applications/${app_b}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/auditions"
              payload: { application_id: "${app_b}", scheduled_for: "2026-08-06T10:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { aud_b: "$.data.id" }
          trigger:
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 7, suitability_score: 7, safety_score: 7 }
              as: AuditionPanelist
              as_user_id: "panelist-1"
              captures: { sc1: "$.data.id" }
          assert:
            - 'HTTP status is 201'
            - 'AuditionScore.${sc1}.composite_score == 7.00'
            - 'AuditionScore.${sc1}.panelist_user_id == "panelist-1"'
            - 'the AuditionScore response body carries id and created_at but no version and no updated_at field'
            - 'Audition.${aud_b}.score_count == 1'

      - name: corner_pitch_creation_with_unknown_zone_returns_zone_not_found
        claim_type: foreign_key_integrity
        grounds: ["entities.Pitch.fields.zone_id", "validations[priority=35]", "errors[ERR_ZONE_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that resolves to nothing returns 404 ERR_ZONE_NOT_FOUND, distinguishing body-FK existence (priority 35) from path existence (priority 30)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /busking/pitches"
              payload: { zone_id: "00000000-0000-4000-8000-000000000000", code: "RP-01", tier: "STANDARD", noise_cap_db: 82 }
              as: PermitOfficer
              captures: { e_zone: "$.data.error_id" }
          assert:
            - 'HTTP status is 404'
            - 'data.error_id == "ERR_ZONE_NOT_FOUND"'

      - name: corner_pitch_fallback_must_sit_in_the_same_zone
        claim_type: foreign_key_integrity
        grounds: ["entities.Pitch.fields.fallback_pitch_id", "validations[priority=65]", "errors[ERR_PITCH_ZONE_MISMATCH]"]
        distinguishing_aspect: "The self-referential fallback_pitch_id is refused with 422 ERR_PITCH_ZONE_MISMATCH when it names a pitch in a different zone."
        test_recipe:
          setup: ["Two zones exist; zone OT already holds pitch OT-01."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/zones"
              payload: { name: "Old Town", code: "OT", base_noise_cap_db: 72, evening_start_minute: 1020, quiet_hours_start_minute: 1260, quiet_hours_end_minute: 480, max_concurrent_closures: 2 }
              as: PermitOfficer
              captures: { z2: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z2}", code: "OT-01", tier: "STANDARD", noise_cap_db: 70 }
              as: PermitOfficer
              captures: { p4: "$.data.id" }
          trigger:
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82, fallback_pitch_id: "${p4}" }
              as: PermitOfficer
              captures: { e_mismatch: "$.data.error_id" }
          assert:
            - 'HTTP status is 422'
            - 'data.error_id == "ERR_PITCH_ZONE_MISMATCH"'
            - 'GET /busking/pitches?zone_id=${z1} returns total_count 0'

      - name: corner_zone_code_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.Zone.fields.code", "validations[priority=48]", "errors[ERR_ZONE_CODE_TAKEN]"]
        distinguishing_aspect: "A second Zone with code RP returns 409 ERR_ZONE_CODE_TAKEN and leaves exactly one zone row."
        test_recipe:
          setup: ["Zone RP already exists."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
          trigger:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza Annex", code: "RP", base_noise_cap_db: 74, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { e_code: "$.data.error_id" }
          assert:
            - 'HTTP status is 409'
            - 'data.error_id == "ERR_ZONE_CODE_TAKEN"'
            - 'Zone.${z1}.name == "Riverside Plaza"'

      - name: corner_performer_email_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.Performer.fields.email", "validations[priority=48]", "errors[ERR_PERFORMER_EMAIL_TAKEN]"]
        distinguishing_aspect: "A second Performer with the same email differing only in case returns 409 ERR_PERFORMER_EMAIL_TAKEN."
        test_recipe:
          setup: ["Performer ada@example.org exists."]
          setup_api_calls:
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
          trigger:
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance II", stage_name: "Ada Two", email: "ADA@example.org", act_type: "VISUAL_ART" }
              as: PermitOfficer
              captures: { e_email: "$.data.error_id" }
          assert:
            - 'HTTP status is 409'
            - 'data.error_id == "ERR_PERFORMER_EMAIL_TAKEN"'
            - 'Performer.${perf_a}.act_type == "ACOUSTIC_MUSIC"'

      - name: corner_pitch_code_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.Pitch.fields.code", "validations[priority=48]", "errors[ERR_PITCH_CODE_TAKEN]"]
        distinguishing_aspect: "Pitch codes are unique across the whole table, not per zone: reusing RP-01 in a second zone still returns 409 ERR_PITCH_CODE_TAKEN."
        test_recipe:
          setup: ["Zone RP holds pitch RP-01; zone OT exists and holds nothing."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/zones"
              payload: { name: "Old Town", code: "OT", base_noise_cap_db: 72, evening_start_minute: 1020, quiet_hours_start_minute: 1260, quiet_hours_end_minute: 480, max_concurrent_closures: 2 }
              as: PermitOfficer
              captures: { z2: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82 }
              as: PermitOfficer
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z2}", code: "RP-01", tier: "STANDARD", noise_cap_db: 70 }
              as: PermitOfficer
              captures: { e_pcode: "$.data.error_id" }
          assert:
            - 'HTTP status is 409'
            - 'data.error_id == "ERR_PITCH_CODE_TAKEN"'
            - 'GET /busking/pitches?zone_id=${z2} returns total_count 0'

      - name: corner_complaint_booking_must_belong_to_the_same_permit
        claim_type: foreign_key_integrity
        grounds: ["entities.Complaint.fields.booking_id", "validations[priority=66]", "errors[ERR_BOOKING_PERMIT_MISMATCH]"]
        distinguishing_aspect: "Naming a booking that belongs to a different permit returns 422 ERR_BOOKING_PERMIT_MISMATCH even though both ids exist."
        test_recipe:
          setup:
            - "Two performers, Ada and Eli, each hold an ACTIVE, CLEAR 2026 ACOUSTIC_MUSIC permit with the 5400-cent invoice paid."
            - "Eli holds a RESERVED 60-minute booking on RP-01 for 2026-08-25T14:00:00Z to 15:00:00Z."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82 }
              as: PermitOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_a}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "APPROVED", decision_note: "ok" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_a}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/performers"
              payload: { legal_name: "Eli Marsh", stage_name: "Eli M", email: "eli@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_e: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_e}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_e}"
              captures: { app_e: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_e}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_e}"
            - call: "POST /busking/permit-applications/${app_e}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_e}/decision"
              payload: { outcome: "APPROVED", decision_note: "ok" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_e}"
              as: PermitOfficer
              captures: { permit_e: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_e}/fee-invoices"
              as: PermitOfficer
              captures: { inv_e: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_e}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_e}"
            - call: "GET /busking/permits/${permit_e}"
              as: PermitOfficer
              captures: { pv_e: "$.data.version" }
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_e}", pitch_id: "${p1}", start_at: "2026-08-25T14:00:00Z", end_at: "2026-08-25T15:00:00Z", expected_permit_version: "${pv_e}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_e}"
              captures: { bk_e: "$.data.id" }
          trigger:
            - call: "POST /busking/complaints"
              payload: { permit_id: "${permit_a}", category: "NOISE", description: "Wrong permit named", booking_id: "${bk_e}" }
              as: Resident
              as_user_id: "resident-1"
              captures: { e_mm: "$.data.error_id" }
          assert:
            - 'HTTP status is 422'
            - 'data.error_id == "ERR_BOOKING_PERMIT_MISMATCH"'
            - 'GET /busking/complaints?permit_id=${permit_a} returns total_count 0'

  # =======================================================================
  - section: state_machines
    instances:

      - name: corner_application_starts_in_draft
        claim_type: initial_state
        grounds: ["state_machines.PermitApplication.DRAFT_to_SUBMITTED", "entities.PermitApplication.fields.status", "entities.PermitApplication.fields.requires_audition"]
        distinguishing_aspect: "A freshly created PermitApplication has status DRAFT, revision_count 0, requires_audition false, submitted_at null and assessed_fee_cents 0."
        test_recipe:
          setup: ["One zone and one performer exist."]
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
