      - name: discount_cap_outranks_promotion_window_conflict_on_promotion_create
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - errors[ERR_DISCOUNT_CAP_EXCEEDED]
          - errors[ERR_PROMO_WINDOW_CONFLICT]
          - endpoints[POST /franchise/promotions]
          - calculations.effective_monthly_dues.constants.MAX_FRANCHISE_DISCOUNT_PCT
        conflict_pair:
          higher: { priority: 12, category: business_constraint, error_id: ERR_DISCOUNT_CAP_EXCEEDED }
          lower: { priority: 14, category: business_temporal, error_id: ERR_PROMO_WINDOW_CONFLICT }
        distinguishing_aspect: |
          A different error-category pair - business_constraint (12) against business_temporal (14) - on
          a different endpoint. The filed promotion breaks the brand discount cap (0.35 > 0.30) and also
          overlaps an already APPROVED window for the same (franchisee_id, plan_template_id). Date-window
          checking is the more expensive query and therefore the one implementations tend to run first,
          which would surface ERR_PROMO_WINDOW_CONFLICT. The follow-up call with a compliant 0.10
          discount over the identical window confirms the temporal violation is real and not a
          mis-attributed cap failure.
        test_recipe:
          setup:
            - "One franchisee and one PUBLISHED CORE12 plan template."
            - "One APPROVED promotion for that (franchisee, plan) covering the closed window 2026-07-01..2026-09-30."
