# =============================================================================
# task_0546_foundation_repair — Seed tables (§1.0–§1.7)
# Foundation Repair & Structural Stabilization
# Difficulty band: Expert
# =============================================================================

scenario: "Foundation Repair & Structural Stabilization: free inspection & soil/crack assessment, engineered scope & pier/anchor count, quote & financing, permit & crew scheduling, install & adjustment, transferable lifetime warranty, annual re-tightening visit, callback/claim"

domain_name: foundation-repair
api_prefix: /foundation

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat            # peer collections under a shared /foundation mount, FK links, no deep nesting
  state_machine_shape: parallel    # Job carries independent fulfillment_status × permit_status; Quote/Claim are cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles           # each role owns a distinct slice of the pipeline; Admin has operational overrides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lead
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_name, type: string, source: input, description: "Homeowner name" }
      - { name: property_address, type: string, source: input, description: "Street address of the structure" }
      - { name: contact_email, type: string, source: input, description: "Homeowner contact email" }
      - { name: region_code, type: enum, source: input, description: "NORTH | SOUTH | EAST | WEST — service region; a scheduled Crew must match this region" }
      - { name: financing_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding financed principal: sum of total_cents over ACCEPTED quotes whose Job is not CANCELLED (see calculations.lead_financing_balance)" }
      - { name: active_visit_count, type: integer, source: computed, default: 0, description: "Count of MaintenanceVisit rows in status SCHEDULED across this lead's warranties (maintained by cascade)" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "When the free inspection is booked (ISO 8601 UTC)" }
      - { name: soil_class, type: enum, source: input, description: "STABLE | EXPANSIVE | UNSTABLE — set on completion; UNSTABLE gates install scheduling", constraints: "required on complete" }
      - { name: crack_severity, type: integer, source: input, description: "0..5 severity index recorded on completion" }
      - { name: max_crack_width_mm, type: number, source: input, description: "Widest observed crack in millimetres, recorded on completion" }
      - { name: settlement_inches, type: number, source: input, description: "Observed differential settlement in inches, recorded on completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / CANCELLED", constraints: "SCHEDULED, COMPLETED, CANCELLED" }

  - name: EngineeringScope
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; source assessment for this scope" }
      - { name: pier_count, type: integer, source: input, description: "Number of push/helical piers engineered" }
      - { name: anchor_count, type: integer, source: input, description: "Number of wall anchors engineered" }
      - { name: avg_pier_depth_ft, type: number, source: input, description: "Average engineered pier depth in feet; selects the depth pricing tier" }
      - { name: access_difficulty, type: enum, source: input, description: "EASY | MODERATE | HARD — site access multiplier" }
      - { name: supplemental_engineering, type: boolean, source: input, default: false, description: "True when a supplemental stabilization design is attached; required to schedule when soil_class=UNSTABLE" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ENGINEERED -> SUPERSEDED", constraints: "DRAFT, ENGINEERED, SUPERSEDED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: scope_id, type: string, source: input, description: "FK -> EngineeringScope.id; priced scope" }
      - { name: financing_plan, type: enum, source: input, description: "CASH | PLAN_12 | PLAN_60 — selects the financing fee rate" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Estimate pier+anchor subtotal at send time (calculations.pier_pricing, estimate variant)" }
      - { name: financing_fee_cents, type: integer, source: computed, description: "Financing fee on financed principal (calculations.financing_total)" }
      - { name: total_cents, type: integer, source: computed, description: "financed_principal + financing_fee_cents (calculations.financing_total)" }
      - { name: expires_at, type: datetime, source: computed, description: "send_time + QUOTE_VALID_DAYS; accept after this instant is rejected" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SENT <-> REVISED, SENT -> ACCEPTED / REJECTED / EXPIRED", constraints: "DRAFT, SENT, REVISED, ACCEPTED, REJECTED, EXPIRED" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: system, description: "FK -> Lead.id" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; null for claim-remediation jobs" }
      - { name: source_claim_id, type: string, source: system, description: "FK -> Claim.id; set only for claim-remediation jobs, else null" }
      - { name: crew_id, type: string, source: system, description: "FK -> Crew.id; set on schedule, null before" }
      - { name: scheduled_start, type: datetime, source: input, description: "Install window start (set on schedule)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Install window end (set on schedule)" }
      - { name: piers_installed, type: integer, source: input, description: "Actual piers installed, recorded on complete" }
      - { name: adjustment_inches, type: number, source: input, description: "Lift/adjustment achieved in inches, recorded on complete" }
      - { name: final_subtotal_cents, type: integer, source: computed, description: "Final pier+anchor subtotal from piers_installed (calculations.pier_pricing, final variant)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final invoice total incl financing (calculations.financing_total on final subtotal)" }
      - { name: fulfillment_status, type: enum, source: system, description: "Dimension A: UNSCHEDULED -> SCHEDULED -> IN_PROGRESS -> COMPLETED; UNSCHEDULED/SCHEDULED -> CANCELLED", constraints: "UNSCHEDULED, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED" }
      - { name: permit_status, type: enum, source: system, description: "Dimension B (independent): NOT_STARTED -> PENDING -> APPROVED / REJECTED; mirrors latest Permit decision", constraints: "NOT_STARTED, PENDING, APPROVED, REJECTED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Install crew label" }
      - { name: region_code, type: enum, source: input, description: "NORTH | SOUTH | EAST | WEST — the region this crew serves" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of (scheduled_end - scheduled_start) in minutes over this crew's Jobs whose fulfillment_status IN {SCHEDULED, IN_PROGRESS} (calculations.crew_booked_minutes)" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: permit_type, type: enum, source: input, description: "STANDARD | STRUCTURAL | ENGINEERED" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT — supplied on decide", constraints: "APPROVE, REJECT" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / REJECTED", constraints: "PENDING, APPROVED, REJECTED" }

  - name: Warranty
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: system, description: "FK -> Lead.id" }
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; the install job that produced this warranty" }
      - { name: holder_name, type: string, source: system, description: "Current warranty holder; changes on transfer (transferable lifetime warranty)" }
      - { name: activated_at, type: datetime, source: system, description: "Clock instant the install completed and warranty went ACTIVE" }
      - { name: transfer_count, type: integer, source: computed, default: 0, description: "Number of ownership transfers performed" }
      - { name: remediation_count, type: integer, source: computed, default: 0, description: "Number of approved claims that spawned a remediation job (maintained by cascade)" }
      - { name: covered_pier_count, type: integer, source: system, description: "piers_installed copied from the producing Job at activation" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VOID (transferable, no expiry)", constraints: "ACTIVE, VOID" }

  - name: MaintenanceVisit
    parent: null
    common_fields: true
    fields:
      - { name: warranty_id, type: string, source: input, description: "FK -> Warranty.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; optional crew assigned to the re-tightening visit" }
      - { name: scheduled_date, type: datetime, source: input, description: "Booked date for the annual re-tightening visit (ISO 8601 UTC)" }
      - { name: tightening_turns, type: integer, source: input, description: "Turns applied, recorded on completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / MISSED", constraints: "SCHEDULED, COMPLETED, MISSED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: warranty_id, type: string, source: input, description: "FK -> Warranty.id" }
      - { name: description, type: string, source: input, description: "Homeowner callback/claim description" }
      - { name: reported_settlement_inches, type: number, source: input, description: "Reported new settlement in inches; drives remediation pier count" }
      - { name: settlement_cents, type: integer, source: computed, description: "Approved settlement value (calculations.claim_settlement)" }
      - { name: coverage_variant, type: enum, source: computed, description: "FULL | PRORATED — which settlement variant applied", constraints: "FULL, PRORATED" }
      - { name: remediation_job_id, type: string, source: system, description: "FK -> Job.id; remediation job spawned on approval, null before" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW <-> NEEDS_INFO, UNDER_REVIEW -> APPROVED / DENIED, APPROVED -> RESOLVED", constraints: "FILED, UNDER_REVIEW, NEEDS_INFO, APPROVED, DENIED, RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /foundation/inspections/{inspection_id}/complete"
        actor: FieldEngineer
        preconditions: ["soil_class, crack_severity, max_crack_width_mm, settlement_inches provided"]
        side_effects: ["assessment fields persisted; unlocks EngineeringScope creation for the lead"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /foundation/inspections/{inspection_id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []

  - entity: EngineeringScope
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: (none)
        to: DRAFT
        trigger: "POST /foundation/scopes"
        actor: FieldEngineer
        preconditions:
          - "referenced Inspection.status == COMPLETED (ERR_INVALID_STATE)"
          - "expected_lead_version matches Lead.version (ERR_STALE_VERSION)"
        side_effects:
          - "any prior EngineeringScope for this lead in {DRAFT, ENGINEERED} transitions to SUPERSEDED"
          - "increments Lead.version by 1"
      - from: DRAFT
        to: ENGINEERED
        trigger: "POST /foundation/scopes/{scope_id}/finalize"
        actor: FieldEngineer
        preconditions: ["pier_count >= 1 (ERR_NO_PIERS)"]
        side_effects: ["scope becomes eligible to back an accepted quote"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — a newer EngineeringScope is created for the same lead"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENGINEERED
        to: SUPERSEDED
        trigger: "system — a newer EngineeringScope is created for the same lead"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    note: "Cyclic: SENT <-> REVISED forms a revision loop before a terminal decision."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /foundation/quotes/{quote_id}/send"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "compute subtotal_cents (calculations.pier_pricing estimate variant)"
          - "compute financing_fee_cents and total_cents (calculations.financing_total)"
          - "set expires_at = current_clock + QUOTE_VALID_DAYS"
      - from: REVISED
        to: SENT
        trigger: "POST /foundation/quotes/{quote_id}/send"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "recompute subtotal_cents, financing_fee_cents, total_cents"
          - "reset expires_at = current_clock + QUOTE_VALID_DAYS"
      - from: SENT
        to: REVISED
        trigger: "POST /foundation/quotes/{quote_id}/revise"
        actor: SalesAgent
        preconditions: []
        side_effects: ["optionally updates financing_plan; pricing is stale until re-sent"]
      - from: SENT
        to: ACCEPTED
        trigger: "POST /foundation/quotes/{quote_id}/accept"
        actor: Customer
        preconditions:
          - "current_clock <= expires_at (ERR_QUOTE_EXPIRED)"
          - "referenced EngineeringScope.status == ENGINEERED (ERR_SCOPE_NOT_ENGINEERED)"
          - "financed_principal <= FINANCING_LIMIT_CENTS (ERR_FINANCING_LIMIT_EXCEEDED)"
        side_effects:
          - "create Job (fulfillment_status=UNSCHEDULED, permit_status=NOT_STARTED, quote_id set, lead_id copied)"
          - "Lead.financing_balance_cents increases by total_cents (calculations.lead_financing_balance)"
          - "increments Lead.version by 1"
      - from: SENT
        to: REJECTED
        trigger: "POST /foundation/quotes/{quote_id}/reject"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: SENT
        to: EXPIRED
        trigger: "system — evaluated when current_clock > expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Job
    initial_state: UNSCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      Parallel dimensions on one row. Dimension A (fulfillment_status) is driven by
      schedule/start/complete/cancel. Dimension B (permit_status) is driven independently
      by Permit create/decide. The two dimensions evolve without ordering constraints
      except that scheduling reads permit_status.
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /foundation/jobs/{job_id}/schedule"
        actor: OpsCoordinator
        preconditions:
          - "scheduled_end > scheduled_start (ERR_SCHEDULE_WINDOW_INVALID)"
          - "if Inspection.soil_class==UNSTABLE then EngineeringScope.supplemental_engineering==true (ERR_UNSAFE_SOIL_UNMITIGATED)"
          - "no other Job of this crew_id in {SCHEDULED, IN_PROGRESS} overlaps [scheduled_start, scheduled_end) (ERR_CREW_DOUBLE_BOOKED)"
          - "permit_status == APPROVED (ERR_PERMIT_NOT_APPROVED)"
          - "Crew.region_code == Lead.region_code (ERR_CREW_REGION_MISMATCH)"
        side_effects:
          - "set crew_id, scheduled_start, scheduled_end"
          - "Crew.booked_minutes increases by window minutes (calculations.crew_booked_minutes)"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /foundation/jobs/{job_id}/start"
        actor: OpsCoordinator
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /foundation/jobs/{job_id}/complete"
        actor: OpsCoordinator
        preconditions:
          - "if quote_id != null: abs(piers_installed - EngineeringScope.pier_count) <= PIER_TOLERANCE (ERR_PIER_COUNT_MISMATCH)"
        side_effects:
          - "if quote_id != null: compute final_subtotal_cents and final_total_cents (calculations.pier_pricing final variant + financing_total)"
          - "if quote_id != null: create Warranty ACTIVE (holder_name=Lead.customer_name, covered_pier_count=piers_installed, activated_at=current_clock) [cascade hop 1]"
          - "Warranty activation creates first MaintenanceVisit SCHEDULED at activated_at + VISIT_INTERVAL_DAYS [cascade hop 2]"
          - "MaintenanceVisit creation increments Lead.active_visit_count by 1 [cascade hop 3]"
      - from: UNSCHEDULED
        to: CANCELLED
        trigger: "POST /foundation/jobs/{job_id}/cancel"
        actor: OpsCoordinator
        preconditions: []
        side_effects:
          - "if quote_id != null: Lead.financing_balance_cents decreases by the accepted quote's total_cents (compensation; calculations.lead_financing_balance)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /foundation/jobs/{job_id}/cancel"
        actor: OpsCoordinator
        preconditions: []
        side_effects:
          - "Crew.booked_minutes decreases by window minutes (compensation; calculations.crew_booked_minutes)"
          - "if quote_id != null: Lead.financing_balance_cents decreases by total_cents (compensation)"

  - entity: Permit
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: (none)
        to: PENDING
        trigger: "POST /foundation/permits"
        actor: OpsCoordinator
        preconditions: ["referenced Job.fulfillment_status != CANCELLED (ERR_INVALID_STATE)"]
        side_effects: ["set parent Job.permit_status = PENDING"]
      - from: PENDING
        to: APPROVED
        trigger: "POST /foundation/permits/{permit_id}/decide (decision=APPROVE)"
        actor: OpsCoordinator
        preconditions: []
        side_effects: ["set parent Job.permit_status = APPROVED (bubble-up)"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /foundation/permits/{permit_id}/decide (decision=REJECT)"
        actor: OpsCoordinator
        preconditions: []
        side_effects: ["set parent Job.permit_status = REJECTED (bubble-up)"]

  - entity: Warranty
    initial_state: ACTIVE
    terminal_states: [VOID]
    note: "Created ACTIVE by an install job's completion; transferable with no expiry."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /foundation/warranties/{warranty_id}/transfer"
        actor: Customer
        preconditions: ["new_holder_name provided"]
        side_effects: ["holder_name := new_holder_name; transfer_count += 1"]
      - from: ACTIVE
        to: VOID
        trigger: "POST /foundation/warranties/{warranty_id}/void"
        actor: Admin
        preconditions: []
        side_effects: ["any SCHEDULED MaintenanceVisit for this warranty is left as-is; new claims/visits are blocked"]

  - entity: MaintenanceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: (none)
        to: SCHEDULED
        trigger: "POST /foundation/maintenance-visits  (also auto-created by Job completion)"
        actor: OpsCoordinator
        preconditions:
          - "referenced Warranty.status == ACTIVE (ERR_WARRANTY_NOT_ACTIVE)"
          - "scheduled_date > current_clock (ERR_VISIT_DATE_IN_PAST)"
          - "scheduled_date is >= MIN_VISIT_GAP_DAYS from every other MaintenanceVisit.scheduled_date on the warranty (ERR_VISIT_TOO_SOON)"
        side_effects: ["Lead.active_visit_count += 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /foundation/maintenance-visits/{visit_id}/complete"
        actor: OpsCoordinator
        preconditions: ["tightening_turns provided"]
        side_effects: ["Lead.active_visit_count -= 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /foundation/maintenance-visits/{visit_id}/mark-missed"
        actor: OpsCoordinator
        preconditions: ["current_clock > scheduled_date (ERR_VISIT_NOT_DUE)"]
        side_effects: ["Lead.active_visit_count -= 1; contributes to claim proration (calculations.claim_settlement)"]

  - entity: Claim
    initial_state: FILED
    terminal_states: [DENIED, RESOLVED]
    note: "Cyclic: UNDER_REVIEW <-> NEEDS_INFO forms an information loop before a terminal decision."
    transitions:
      - from: (none)
        to: FILED
        trigger: "POST /foundation/claims"
        actor: Customer
        preconditions: ["referenced Warranty.status == ACTIVE (ERR_WARRANTY_NOT_ACTIVE)"]
        side_effects: []
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /foundation/claims/{claim_id}/review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /foundation/claims/{claim_id}/request-info"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /foundation/claims/{claim_id}/resubmit"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /foundation/claims/{claim_id}/approve"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "compute settlement_cents and coverage_variant (calculations.claim_settlement)"
          - "create remediation Job (quote_id=null, source_claim_id set, lead_id=Warranty.lead_id, fulfillment_status=UNSCHEDULED) [cascade hop 1]"
          - "remediation Job creation increments Warranty.remediation_count by 1 [cascade hop 2]"
          - "set remediation_job_id on the claim"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /foundation/claims/{claim_id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /foundation/claims/{claim_id}/resolve"
        actor: ClaimsAdjuster
        preconditions: ["remediation Job.fulfillment_status == COMPLETED (ERR_REMEDIATION_NOT_COMPLETE)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: scope-create-stale-lead
    parent_entity: Lead
    write_endpoint: "POST /foundation/scopes"
    occ_field: "expected_lead_version"
    description: |
      Creating an EngineeringScope against a Lead whose version has advanced since
      the client last observed it is rejected. A new scope legitimately supersedes
      any prior DRAFT/ENGINEERED scope for the lead; if another writer has already
      created a superseding scope (advancing Lead.version) the current writer's view
      of the lead is stale and the create is refused on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pier_pricing
    trigger: "Quote send (estimate variant) and Job complete (final variant)"
    algorithm: tiered_pricing
    formula: |
      depth_tier_unit(depth_ft):
        depth_ft < 15         -> PIER_TIER1_CENTS   (120000)
        15 <= depth_ft < 25   -> PIER_TIER2_CENTS   (165000)   # boundary at 15 is inclusive to tier2
        depth_ft >= 25        -> PIER_TIER3_CENTS   (210000)
      per_pier_cents = round_half_up(depth_tier_unit(avg_pier_depth_ft)
                                     * SOIL_MULT[soil_class] * ACCESS_MULT[access_difficulty])
      # rounding order is PINNED: round each per-pier value first, THEN multiply by the pier count
      pier_subtotal  = per_pier_cents * n_piers
      anchor_subtotal = anchor_count * ANCHOR_UNIT_CENTS   (45000)
      subtotal_cents = pier_subtotal + anchor_subtotal
    input_set: "soil_class from the scope's Inspection; access_difficulty & anchor_count from the EngineeringScope"
    constants:
      PIER_TIER1_CENTS: 120000
      PIER_TIER2_CENTS: 165000
      PIER_TIER3_CENTS: 210000
      ANCHOR_UNIT_CENTS: 45000
      SOIL_MULT: { STABLE: 1.00, EXPANSIVE: 1.15, UNSTABLE: 1.30 }
      ACCESS_MULT: { EASY: 1.00, MODERATE: 1.10, HARD: 1.25 }
      PIER_TOLERANCE: 2            # |piers_installed - pier_count| must be <= 2 at install-job complete
    precision: "integer cents, round_half_up per pier before multiplying by pier count"
    variants:
      - name: estimate
        when: "Quote send"
        difference: "n_piers = EngineeringScope.pier_count (projected); writes Quote.subtotal_cents"
      - name: final
        when: "Job complete"
        difference: "n_piers = Job.piers_installed (actual); writes Job.final_subtotal_cents; diverges from estimate whenever piers_installed != pier_count"

  - name: financing_total
    trigger: "Quote send (on subtotal_cents) and Job complete (on final_subtotal_cents)"
    algorithm: constraint_propagation
    formula: |
      # circular-looking dependency, evaluation order PINNED to make the value well-defined:
      # 1) volume discount is keyed on the GROSS subtotal tier (NOT the total)
      # 2) financed principal = gross subtotal - discount
      # 3) financing fee is computed on the financed principal (NOT the gross subtotal)
      # 4) total = financed principal + financing fee
      gross_subtotal = subtotal_cents
      volume_discount_cents = (gross_subtotal >= VOLUME_DISCOUNT_THRESHOLD_CENTS)
                              ? round_half_up(gross_subtotal * VOLUME_DISCOUNT_RATE) : 0
      financed_principal = gross_subtotal - volume_discount_cents
      financing_fee_cents = round_half_up(financed_principal * PLAN_FEE_RATE[financing_plan])
      total_cents = financed_principal + financing_fee_cents
    input_set: "gross subtotal from pier_pricing; financing_plan from the Quote"
    constants:
      VOLUME_DISCOUNT_THRESHOLD_CENTS: 2000000
      VOLUME_DISCOUNT_RATE: 0.05
      PLAN_FEE_RATE: { CASH: 0.00, PLAN_12: 0.05, PLAN_60: 0.12 }
      FINANCING_LIMIT_CENTS: 5000000
    precision: "integer cents, round_half_up; financed_principal is the OCC subject of ERR_FINANCING_LIMIT_EXCEEDED at accept"

  - name: claim_settlement
    trigger: "Claim approve"
    algorithm: weighted_scoring
    formula: |
      piers_needed = ceil(reported_settlement_inches / INCHES_PER_PIER)   (INCHES_PER_PIER = 0.5)
      full_cost_cents = piers_needed * REMEDIATION_PIER_CENTS             (150000)
      missed = count of MaintenanceVisit on the warranty with status == MISSED
      coverage_pct = max(COVERAGE_FLOOR, 1.00 - MISSED_PENALTY * missed)
      settlement_cents = round_half_up(full_cost_cents * coverage_pct)
    input_set: "MISSED maintenance visits for the claim's warranty; reported_settlement_inches from the Claim"
    constants:
      INCHES_PER_PIER: 0.5
      REMEDIATION_PIER_CENTS: 150000
      MISSED_PENALTY: 0.10
      COVERAGE_FLOOR: 0.50
      # Named durations used across §1.2/§1.4 (all measured against the logical clock):
      QUOTE_VALID_DAYS: 30           # Quote.expires_at = send_clock + 30 days
      VISIT_INTERVAL_DAYS: 365       # first auto MaintenanceVisit = activated_at + 365 days
      MIN_VISIT_GAP_DAYS: 300        # minimum gap between any two visits on a warranty
    precision: "integer cents, round_half_up"
    variants:
      - name: full
        when: "missed == 0"
        difference: "coverage_variant = FULL; settlement_cents = full_cost_cents (coverage_pct = 1.00)"
      - name: prorated
        when: "missed >= 1"
        difference: "coverage_variant = PRORATED; coverage_pct reduced by MISSED_PENALTY per missed visit, floored at COVERAGE_FLOOR"

  - name: crew_booked_minutes
    trigger: "Job schedule (add) and Job cancel from SCHEDULED (subtract); recomputed as an aggregate"
    algorithm: aggregation
    formula: |
      Crew.booked_minutes = sum over Job j where j.crew_id == crew.id
                            and j.fulfillment_status IN {SCHEDULED, IN_PROGRESS}
                            of minutes(j.scheduled_end - j.scheduled_start)
    input_set: "Jobs in {SCHEDULED, IN_PROGRESS} for the crew; window is half-open [scheduled_start, scheduled_end)"
    precision: "integer minutes"

  - name: lead_financing_balance
    trigger: "Quote accept (debit) and Job cancel (credit)"
    algorithm: aggregation
    formula: |
      Lead.financing_balance_cents = sum of Quote.total_cents over ACCEPTED quotes of the lead
                                     whose produced Job.fulfillment_status != CANCELLED
    input_set: "ACCEPTED quotes with a non-CANCELLED job"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation (RBAC); Customer ownership: X-User-ID must equal the resource's lead_id (directly or via warranty.lead_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids and body FK ids resolve to existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body schema valid: required fields present, enums in range, numbers well-typed"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all writes
  - priority: 5
    category: state
    check: "OCC: expected_lead_version equals current Lead.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /foundation/scopes"
  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints
  - priority: 7
    category: state
    check: "Quote not expired: current_clock <= expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /foundation/quotes/{quote_id}/accept"
  - priority: 8
    category: business_safety
    check: "UNSTABLE soil requires supplemental_engineering on the scope before scheduling"
    error_id: ERR_UNSAFE_SOIL_UNMITIGATED
    http_status: 422
    applies_to: "POST /foundation/jobs/{job_id}/schedule"
  - priority: 9
    category: business_temporal
    check: "Crew has no overlapping [start,end) booking with another SCHEDULED/IN_PROGRESS job (half-open; adjacency allowed)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /foundation/jobs/{job_id}/schedule"
  - priority: 10
    category: business_temporal
    check: "MaintenanceVisit scheduled_date is >= MIN_VISIT_GAP_DAYS from every existing visit on the warranty (point-gap buffer)"
    error_id: ERR_VISIT_TOO_SOON
    http_status: 409
    applies_to: "POST /foundation/maintenance-visits"
  - priority: 11
    category: business_referential
    check: "Job permit_status == APPROVED before scheduling"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /foundation/jobs/{job_id}/schedule"
  - priority: 12
    category: business_referential
    check: "Quote's EngineeringScope is ENGINEERED before accept"
    error_id: ERR_SCOPE_NOT_ENGINEERED
    http_status: 409
    applies_to: "POST /foundation/quotes/{quote_id}/accept"
  - priority: 13
    category: business_referential
    check: "Warranty is ACTIVE before filing a claim or scheduling a visit"
    error_id: ERR_WARRANTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /foundation/claims, POST /foundation/maintenance-visits"
  - priority: 14
    category: business_constraint
    check: "Crew.region_code equals Lead.region_code at scheduling"
    error_id: ERR_CREW_REGION_MISMATCH
    http_status: 409
    applies_to: "POST /foundation/jobs/{job_id}/schedule"
  - priority: 15
    category: business_constraint
    check: "On install-job complete, |piers_installed - scope.pier_count| <= PIER_TOLERANCE"
    error_id: ERR_PIER_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /foundation/jobs/{job_id}/complete"
  - priority: 16
    category: business_constraint
    check: "Scope finalize requires pier_count >= 1"
    error_id: ERR_NO_PIERS
    http_status: 422
    applies_to: "POST /foundation/scopes/{scope_id}/finalize"
  - priority: 17
    category: business_temporal
    check: "Schedule window valid: scheduled_end > scheduled_start"
    error_id: ERR_SCHEDULE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /foundation/jobs/{job_id}/schedule"
  - priority: 18
    category: business_temporal
    check: "MaintenanceVisit scheduled_date must be in the future relative to current_clock"
    error_id: ERR_VISIT_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /foundation/maintenance-visits"
  - priority: 19
    category: business_temporal
    check: "mark-missed requires current_clock > scheduled_date"
    error_id: ERR_VISIT_NOT_DUE
    http_status: 409
    applies_to: "POST /foundation/maintenance-visits/{visit_id}/mark-missed"
  - priority: 20
    category: business_referential
    check: "Claim resolve requires the remediation Job to be COMPLETED"
    error_id: ERR_REMEDIATION_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /foundation/claims/{claim_id}/resolve"
  - priority: 21
    category: business_fiscal
    check: "financed_principal <= FINANCING_LIMIT_CENTS at accept"
    error_id: ERR_FINANCING_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /foundation/quotes/{quote_id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Lead ---
  - { method: POST, path: "/foundation/leads", description: "Create a Lead", roles: [SalesAgent], code: 201, input: [customer_name, property_address, contact_email, region_code], output: Lead, side_effects: ["financing_balance_cents=0, active_visit_count=0"] }
  - { method: GET, path: "/foundation/leads/{lead_id}", description: "Get a Lead", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Lead, side_effects: [] }
  - { method: GET, path: "/foundation/leads", description: "List Leads", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["region_code?", "limit?", "offset?"], output: "Lead[]", side_effects: [] }

  # --- Inspection ---
  - { method: POST, path: "/foundation/inspections", description: "Book a free inspection", roles: [SalesAgent], code: 201, input: [lead_id, scheduled_at], output: Inspection, side_effects: ["status=SCHEDULED"] }
  - { method: POST, path: "/foundation/inspections/{inspection_id}/complete", description: "Record soil/crack assessment", roles: [FieldEngineer], code: 200, input: [soil_class, crack_severity, max_crack_width_mm, settlement_inches], output: Inspection, side_effects: ["status=COMPLETED"] }
  - { method: POST, path: "/foundation/inspections/{inspection_id}/cancel", description: "Cancel a scheduled inspection", roles: [SalesAgent], code: 200, input: [], output: Inspection, side_effects: ["status=CANCELLED"] }
  - { method: GET, path: "/foundation/inspections/{inspection_id}", description: "Get an Inspection", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET, path: "/foundation/inspections", description: "List Inspections (reverse lookup by lead)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["lead_id?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }

  # --- EngineeringScope ---
  - { method: POST, path: "/foundation/scopes", description: "Create an engineered scope (OCC on Lead; supersedes prior)", roles: [FieldEngineer], code: 201, input: [lead_id, inspection_id, pier_count, anchor_count, avg_pier_depth_ft, access_difficulty, "supplemental_engineering?", expected_lead_version], output: EngineeringScope, side_effects: ["status=DRAFT", "supersede prior scope of the lead", "increments Lead.version by 1"] }
  - { method: POST, path: "/foundation/scopes/{scope_id}/finalize", description: "Finalize scope DRAFT -> ENGINEERED", roles: [FieldEngineer], code: 200, input: [], output: EngineeringScope, side_effects: ["status=ENGINEERED"] }
  - { method: GET, path: "/foundation/scopes/{scope_id}", description: "Get an EngineeringScope", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: EngineeringScope, side_effects: [] }
  - { method: GET, path: "/foundation/scopes", description: "List scopes (reverse lookup by lead or inspection)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["lead_id?", "inspection_id?", "limit?", "offset?"], output: "EngineeringScope[]", side_effects: [] }

  # --- Quote ---
  - { method: POST, path: "/foundation/quotes", description: "Create a Quote (DRAFT)", roles: [SalesAgent], code: 201, input: [lead_id, scope_id, financing_plan], output: Quote, side_effects: ["status=DRAFT"] }
  - { method: POST, path: "/foundation/quotes/{quote_id}/send", description: "Send/re-send quote; compute pricing & financing", roles: [SalesAgent], code: 200, input: [], output: Quote, side_effects: ["status=SENT", "compute subtotal_cents, financing_fee_cents, total_cents", "set expires_at"] }
  - { method: POST, path: "/foundation/quotes/{quote_id}/accept", description: "Customer accepts a sent quote; spawns Job", roles: [Customer], code: 200, input: [], output: Quote, side_effects: ["status=ACCEPTED", "create Job", "Lead.financing_balance_cents += total_cents", "increments Lead.version by 1"] }
  - { method: POST, path: "/foundation/quotes/{quote_id}/reject", description: "Customer rejects a sent quote", roles: [Customer], code: 200, input: [], output: Quote, side_effects: ["status=REJECTED"] }
  - { method: POST, path: "/foundation/quotes/{quote_id}/revise", description: "Send back to REVISED (revision loop)", roles: [SalesAgent], code: 200, input: ["financing_plan?"], output: Quote, side_effects: ["status=REVISED"] }
  - { method: GET, path: "/foundation/quotes/{quote_id}", description: "Get a Quote", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Quote, side_effects: [] }
  - { method: GET, path: "/foundation/quotes", description: "List quotes (reverse lookup by lead or scope)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["lead_id?", "scope_id?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }

  # --- Job (created via quote accept / claim approve) ---
  - { method: POST, path: "/foundation/jobs/{job_id}/schedule", description: "Schedule install & book crew", roles: [OpsCoordinator], code: 200, input: [crew_id, scheduled_start, scheduled_end], output: Job, side_effects: ["fulfillment_status=SCHEDULED", "set crew_id", "Crew.booked_minutes += window"] }
  - { method: POST, path: "/foundation/jobs/{job_id}/start", description: "Start a scheduled install", roles: [OpsCoordinator], code: 200, input: [], output: Job, side_effects: ["fulfillment_status=IN_PROGRESS"] }
  - { method: POST, path: "/foundation/jobs/{job_id}/complete", description: "Complete install & adjustment; activate warranty", roles: [OpsCoordinator], code: 200, input: [piers_installed, adjustment_inches], output: Job, side_effects: ["fulfillment_status=COMPLETED", "compute final_subtotal_cents/final_total_cents", "create Warranty (cascade)", "create first MaintenanceVisit (cascade)", "Lead.active_visit_count += 1 (cascade)"] }
  - { method: POST, path: "/foundation/jobs/{job_id}/cancel", description: "Cancel an unscheduled/scheduled job", roles: [OpsCoordinator], code: 200, input: [], output: Job, side_effects: ["fulfillment_status=CANCELLED", "release crew minutes if scheduled", "credit Lead.financing_balance_cents"] }
  - { method: GET, path: "/foundation/jobs/{job_id}", description: "Get a Job", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Job, side_effects: [] }
  - { method: GET, path: "/foundation/jobs", description: "List jobs (reverse lookup by lead, quote, crew, or source claim)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["lead_id?", "quote_id?", "crew_id?", "source_claim_id?", "limit?", "offset?"], output: "Job[]", side_effects: [] }

  # --- Crew ---
  - { method: POST, path: "/foundation/crews", description: "Create an install crew", roles: [Admin], code: 201, input: [crew_name, region_code], output: Crew, side_effects: ["booked_minutes=0"] }
  - { method: GET, path: "/foundation/crews/{crew_id}", description: "Get a Crew", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Crew, side_effects: [] }
  - { method: GET, path: "/foundation/crews", description: "List crews", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["region_code?", "limit?", "offset?"], output: "Crew[]", side_effects: [] }

  # --- Permit ---
  - { method: POST, path: "/foundation/permits", description: "Open a permit for a job", roles: [OpsCoordinator], code: 201, input: [job_id, permit_type], output: Permit, side_effects: ["status=PENDING", "Job.permit_status=PENDING"] }
  - { method: POST, path: "/foundation/permits/{permit_id}/decide", description: "Approve or reject a permit", roles: [OpsCoordinator], code: 200, input: [decision], output: Permit, side_effects: ["status=APPROVED/REJECTED", "Job.permit_status bubbles up"] }
  - { method: GET, path: "/foundation/permits/{permit_id}", description: "Get a Permit", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: GET, path: "/foundation/permits", description: "List permits (reverse lookup by job)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["job_id?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }

  # --- Warranty (created via job complete) ---
  - { method: POST, path: "/foundation/warranties/{warranty_id}/transfer", description: "Transfer warranty to a new holder", roles: [Customer], code: 200, input: [new_holder_name], output: Warranty, side_effects: ["holder_name updated", "transfer_count += 1"] }
  - { method: POST, path: "/foundation/warranties/{warranty_id}/void", description: "Void a warranty", roles: [Admin], code: 200, input: [], output: Warranty, side_effects: ["status=VOID"] }
  - { method: GET, path: "/foundation/warranties/{warranty_id}", description: "Get a Warranty", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Warranty, side_effects: [] }
  - { method: GET, path: "/foundation/warranties", description: "List warranties (reverse lookup by lead or job)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["lead_id?", "job_id?", "limit?", "offset?"], output: "Warranty[]", side_effects: [] }

  # --- MaintenanceVisit ---
  - { method: POST, path: "/foundation/maintenance-visits", description: "Schedule an annual re-tightening visit", roles: [OpsCoordinator], code: 201, input: [warranty_id, scheduled_date, "crew_id?"], output: MaintenanceVisit, side_effects: ["status=SCHEDULED", "Lead.active_visit_count += 1"] }
  - { method: POST, path: "/foundation/maintenance-visits/{visit_id}/complete", description: "Complete a re-tightening visit", roles: [OpsCoordinator], code: 200, input: [tightening_turns], output: MaintenanceVisit, side_effects: ["status=COMPLETED", "Lead.active_visit_count -= 1"] }
  - { method: POST, path: "/foundation/maintenance-visits/{visit_id}/mark-missed", description: "Mark an overdue visit missed", roles: [OpsCoordinator], code: 200, input: [], output: MaintenanceVisit, side_effects: ["status=MISSED", "Lead.active_visit_count -= 1"] }
  - { method: GET, path: "/foundation/maintenance-visits/{visit_id}", description: "Get a MaintenanceVisit", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: MaintenanceVisit, side_effects: [] }
  - { method: GET, path: "/foundation/maintenance-visits", description: "List visits (reverse lookup by warranty or crew)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["warranty_id?", "crew_id?", "limit?", "offset?"], output: "MaintenanceVisit[]", side_effects: [] }

  # --- Claim ---
  - { method: POST, path: "/foundation/claims", description: "File a callback/claim", roles: [Customer], code: 201, input: [warranty_id, description, reported_settlement_inches], output: Claim, side_effects: ["status=FILED"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/review", description: "Begin review FILED -> UNDER_REVIEW", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status=UNDER_REVIEW"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/request-info", description: "Request more info UNDER_REVIEW -> NEEDS_INFO", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status=NEEDS_INFO"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/resubmit", description: "Resubmit info NEEDS_INFO -> UNDER_REVIEW (loop)", roles: [Customer], code: 200, input: [], output: Claim, side_effects: ["status=UNDER_REVIEW"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/approve", description: "Approve claim; compute settlement; spawn remediation job", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status=APPROVED", "compute settlement_cents/coverage_variant", "create remediation Job (cascade)", "Warranty.remediation_count += 1 (cascade)", "set remediation_job_id"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/deny", description: "Deny claim", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status=DENIED"] }
  - { method: POST, path: "/foundation/claims/{claim_id}/resolve", description: "Resolve an approved claim once remediation completes", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status=RESOLVED"] }
  - { method: GET, path: "/foundation/claims/{claim_id}", description: "Get a Claim", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/foundation/claims", description: "List claims (reverse lookup by warranty or remediation job)", roles: [SalesAgent, FieldEngineer, OpsCoordinator, ClaimsAdjuster, Customer, Admin], code: 200, input: ["warranty_id?", "remediation_job_id?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/foundation/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock time), so every expiry/window/buffer rule is deterministic.", roles: [Admin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; SENT quotes past expires_at are treated EXPIRED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Customer acting on a lead/warranty they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, out-of-range enum, or malformed value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lead_version does not match current Lead.version on scope create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted after current_clock > Quote.expires_at" }
  - { id: ERR_SCOPE_NOT_ENGINEERED, http: 409, condition: "Quote accept requires its EngineeringScope to be ENGINEERED" }
  - { id: ERR_UNSAFE_SOIL_UNMITIGATED, http: 422, condition: "UNSTABLE soil without supplemental_engineering at schedule" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew already has an overlapping [start,end) job window" }
  - { id: ERR_CREW_REGION_MISMATCH, http: 409, condition: "Crew.region_code differs from Lead.region_code at schedule" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Job permit_status is not APPROVED at schedule" }
  - { id: ERR_SCHEDULE_WINDOW_INVALID, http: 422, condition: "scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_PIER_COUNT_MISMATCH, http: 422, condition: "piers_installed deviates from scope.pier_count beyond PIER_TOLERANCE on complete" }
  - { id: ERR_NO_PIERS, http: 422, condition: "Scope finalize attempted with pier_count < 1" }
  - { id: ERR_FINANCING_LIMIT_EXCEEDED, http: 402, condition: "financed_principal exceeds FINANCING_LIMIT_CENTS at accept" }
  - { id: ERR_WARRANTY_NOT_ACTIVE, http: 409, condition: "Claim/visit against a warranty that is not ACTIVE" }
  - { id: ERR_VISIT_TOO_SOON, http: 409, condition: "MaintenanceVisit closer than MIN_VISIT_GAP_DAYS to an existing visit" }
  - { id: ERR_VISIT_DATE_IN_PAST, http: 422, condition: "MaintenanceVisit scheduled_date not in the future relative to current_clock" }
  - { id: ERR_VISIT_NOT_DUE, http: 409, condition: "mark-missed before current_clock passes scheduled_date" }
  - { id: ERR_REMEDIATION_NOT_COMPLETE, http: 409, condition: "Claim resolve before the remediation job is COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAgent
    description: "Owns lead intake, inspection booking, and quoting/revising."
    identity: opaque
    exclusive_operations:
      - "POST /foundation/leads"
      - "POST /foundation/inspections"
      - "POST /foundation/inspections/{inspection_id}/cancel"
      - "POST /foundation/quotes"
      - "POST /foundation/quotes/{quote_id}/send"
      - "POST /foundation/quotes/{quote_id}/revise"
    shared_operations: ["all GET reads"]

  - name: FieldEngineer
    description: "Completes inspections and produces engineered scopes (pier/anchor counts)."
    identity: opaque
    exclusive_operations:
      - "POST /foundation/inspections/{inspection_id}/complete"
      - "POST /foundation/scopes"
      - "POST /foundation/scopes/{scope_id}/finalize"
    shared_operations: ["all GET reads"]

  - name: OpsCoordinator
    description: "Manages permits, crew scheduling, installs, and maintenance visits."
    identity: opaque
    exclusive_operations:
      - "POST /foundation/permits"
      - "POST /foundation/permits/{permit_id}/decide"
      - "POST /foundation/jobs/{job_id}/schedule"
      - "POST /foundation/jobs/{job_id}/start"
      - "POST /foundation/jobs/{job_id}/complete"
      - "POST /foundation/jobs/{job_id}/cancel"
      - "POST /foundation/maintenance-visits"
      - "POST /foundation/maintenance-visits/{visit_id}/complete"
      - "POST /foundation/maintenance-visits/{visit_id}/mark-missed"
    shared_operations: ["all GET reads"]

  - name: ClaimsAdjuster
    description: "Reviews, decides, and resolves warranty claims."
    identity: opaque
    exclusive_operations:
      - "POST /foundation/claims/{claim_id}/review"
      - "POST /foundation/claims/{claim_id}/request-info"
      - "POST /foundation/claims/{claim_id}/approve"
      - "POST /foundation/claims/{claim_id}/deny"
      - "POST /foundation/claims/{claim_id}/resolve"
    shared_operations: ["all GET reads"]

  - name: Customer
    description: "The homeowner. Acts only on resources belonging to their own Lead."
    identity: "entity_backed:Lead"
    exclusive_operations:
      - "POST /foundation/quotes/{quote_id}/accept"
      - "POST /foundation/quotes/{quote_id}/reject"
      - "POST /foundation/claims"
      - "POST /foundation/claims/{claim_id}/resubmit"
      - "POST /foundation/warranties/{warranty_id}/transfer"
    shared_operations: ["all GET reads"]
    note: "X-User-ID must equal the Lead.id owning the target quote (quote.lead_id), warranty (warranty.lead_id), or claim (claim.warranty.lead_id); else ERR_FORBIDDEN."

  - name: Admin
    description: "Operational overrides: crew management, warranty void, logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /foundation/crews"
      - "POST /foundation/warranties/{warranty_id}/void"
      - "POST /foundation/_clock/set_current_utc"
    shared_operations: ["all GET reads"]
