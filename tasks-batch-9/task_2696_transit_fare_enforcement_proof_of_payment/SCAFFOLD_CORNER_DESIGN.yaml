          assert:
            - "HTTP 409 with ${err_na} == ERR_DEPLOYMENT_NOT_ACTIVE while D1 is still PLANNED, even though occurred_at is inside the window"
            - "HTTP 422 with ${err_w1} == ${err_w2} == ${err_w3} == ERR_ENCOUNTER_OUTSIDE_WINDOW: one second before window_start, exactly at the exclusive window_end, and inside the window but one hour after the logical clock"
            - "InspectionEncounter.${e1}.validation_result == NO_PROOF and outcome == PENDING"
            - "HTTP 409 with ${err_d1} == ${err_d2} == ERR_DISPOSITION_NOT_SUPPORTED: COMPLIANT needs validation_result VALID and UNRESOLVED_IDENTITY needs a null rider_id or identity_capture_method REFUSED"
            - "HTTP 409 with ${err_open} == ERR_OPEN_ENCOUNTERS_REMAIN, proving priority 16 is evaluated before the adequacy rule even though sample_adequacy_ratio is 0.0000 at that moment"
            - "after the WARNING_ISSUED resolution: InspectionEncounter.${e1}.outcome == WARNING_ISSUED, Rider.${r1}.prior_warning_count == 1, InspectionDeployment.${d1}.achieved_sample_count == 1 and sample_adequacy_ratio == 0.2000"
            - "HTTP 409 with ${err_adeq} == ERR_SAMPLE_SIZE_INADEQUATE on the second close attempt (0.2000 < 0.8000), and InspectionDeployment.${d1}.status is still ACTIVE with measured_evasion_rate_bps null"

