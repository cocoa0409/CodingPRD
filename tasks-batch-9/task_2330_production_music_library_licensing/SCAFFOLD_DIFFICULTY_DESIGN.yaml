              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Noor Haddad" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Cedar Line", duration_sec: 170, tempo_bpm: 108, genre: "CINEMATIC", mood_tags: ["HOPEFUL"], instrumentation: ["STRINGS", "PIANO"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { comp1_v: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "BTV-STD", media_type: "BROADCAST_TV", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierBtv: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Cedar Line Films", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 5000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12, exclusive_requested: false, rush_requested: false }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${sr1}", expected_composition_version: "${comp1_v}" }
              as: LicensingAgent
              captures: { lic1: $.data.id }
            - call: "POST /music-library/cue-sheets"
              payload: { license_id: "${lic1}", production_title: "Cedar Line Feature", broadcast_date: "2026-08-01T00:00:00Z", market_tier: "NETWORK", cues: [{ composition_id: "${comp1}", usage_type: "THEME", duration_sec: 45 }, { composition_id: "${comp1}", usage_type: "FEATURE", duration_sec: 45 }, { composition_id: "${comp1}", usage_type: "BACKGROUND", duration_sec: 45 }] }
              as: LicensingAgent
              captures: { cs1: $.data.id }
            - call: "POST /music-library/cue-sheets/${cs1}/register"
              payload: { society_reference: "BMI-2026-0042" }
              as: RightsManager
          trigger:
            - call: "POST /music-library/cue-sheets/${cs1}/society-decision"
              payload: { decision: "REJECT", rejection_reason: "CUE_TIMING_MISMATCH" }
              as: RightsManager
          assert:
            - "CueSheet.${cs1}.status == REJECTED_BY_SOCIETY and rejection_reason == CUE_TIMING_MISMATCH"
            - "a PERFORMANCE_REVERSAL RoyaltyLedgerEntry exists for ${c1} with source_ref_id == ${cs1} and amount_cents == -1882"
            - "the original PERFORMANCE entry still exists unchanged with amount_cents == 1882 and cash_recognized_at == null"
            - "INVARIANT: Composition.${comp1}.lifetime_performance_credits == 0.00, exactly its pre-registration value"
            - "INVARIANT: the PERFORMANCE and PERFORMANCE_REVERSAL amounts sum to 0, so Composer.${c1}.accrued_unpaid_cents == 156000 (the SYNC_FEE alone)"
            - "CueSheet.${cs1}.total_credits == 3.01 and total_seconds == 135 are unchanged by the rejection"
            - "CueSheet.${cs1}.registration_round == 1 and society_reference == BMI-2026-0042 are unchanged"
            - "exactly 3 RoyaltyLedgerEntry rows exist for ${c1}: SYNC_FEE 156000, PERFORMANCE 1882, PERFORMANCE_REVERSAL -1882"
