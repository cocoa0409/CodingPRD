        claim_type: reconciliation
        grounds:
          - calculations.forecast_value
          - state_machines.CommercializationForecast.ACTIVE_to_REALIZED
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_risk_weighted_vs_committed_variant_divergence
          rationale: "The same instance asserts the post-switch weighted_annual_value_cents and both factors at 1.00, which is the reconciliation claim."

