              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.69, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { res_69: "$.data.validation_result" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.70, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { res_70: "$.data.validation_result" }
          assert:
            - "Photo with head_height_fraction 0.69 -> validation_result == \"PASS\""
            - "Photo with head_height_fraction 0.70 -> validation_result == \"FAIL\" and failure_reasons contains \"HEAD_OUT_OF_RANGE\""

