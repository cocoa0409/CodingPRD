  - rule_id: boundary_precision_check
    instances:
      - name: submission_lead_time_exact_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_SUBMISSION_TOO_LATE]
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: "With clock set to exactly event_start - 14 days (2026-06-01T18:00:00Z for event_start 2026-06-15T18:00:00Z), submit succeeds because the lead-time check is inclusive (clock <= event_start - MIN_SUBMISSION_LEAD_DAYS); one second later would fail."
        test_recipe:
          setup:
            - "Draft application with all three documents; clock set to the exact 14-day boundary."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T18:00:00Z" }, as: PermitClerk }
          trigger:
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          assert:
            - "PermitApplication.${a}.status == SUBMITTED"

      - name: high_occupancy_guard_boundary
        grounds:
          - calculations.required_security_guards
          - entities.SecurityPlan.fields.required_guard_count
          - entities.Venue.fields.occupancy_limit
        distinguishing_aspect: "expected_attendance exactly equals venue.occupancy_limit*0.90 (180 == 200*0.90), so the high_occupancy_bonus fires under the inclusive >= test, giving required_guard_count 4 (base ceil(180/75)=3 + 1); 179 attendees would give 3 — a distinct metric (guard count) reached through POST /permits/security-plans, not the date boundary."
        test_recipe:
          setup:
            - "Venue occupancy_limit=200; application expects exactly 180 attendees over 4 alcohol-service hours (no duration bonus)."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Edge Hall", address: "3 Edge St", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Edge Co", event_name: "Edge Fest", event_start: "2026-07-10T18:00:00Z", event_end: "2026-07-10T22:00:00Z", alcohol_service_hours: 4, expected_attendance: 180, requested_sales_limit_cents: 300000 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 4, plan_summary: "Edge perimeter" }, as: Applicant, captures: { sp: $.data.id } }
          assert:
            - "SecurityPlan.${sp}.required_guard_count == 4"

