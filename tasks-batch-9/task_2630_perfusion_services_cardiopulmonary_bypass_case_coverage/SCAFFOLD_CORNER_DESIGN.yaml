        distinguishing_aspect: |
          A machine whose accumulated runtime has reached its own service_interval_hours is refused as a
          primary even while its status is still AVAILABLE, and the same configuration succeeds once a
          service completion resets the counter to zero - the guard reads the runtime counter against the
          per-device interval, not the device status.
