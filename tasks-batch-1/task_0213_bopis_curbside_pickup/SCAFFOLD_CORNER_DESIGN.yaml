              as_user_id: "${c2_id}"
            - call: "POST /orders/${o1_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv_pre}" }
              as: Customer
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /orders/${o2_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv_pre}" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 412 with error_id == ERR_STALE_SLOT_VERSION (sv_pre is stale after O1 booked)"

      - name: derived_active_curbside_count_reconciled_on_cancel
        claim_type: derived_field_reconciliation
        grounds: [entities.Store.fields.active_curbside_count, state_machines.CurbsideCheckIn.ARRIVED_to_CANCELLED]
        distinguishing_aspect: "Store.active_curbside_count rises to 1 on check-in and falls back to 0 when that check-in is cancelled (derived field reconciled on transition)."
        test_recipe:
          setup: ["Order AWAITING_PICKUP at store curbside_spaces 3; one ARRIVED check-in -> active_curbside_count 1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 3, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /curbside-checkins"
              payload: { order_id: "${o_id}", store_id: "${s_id}", vehicle_description: "car" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ci_id: $.data.id }
            - call: "GET /stores/${s_id}"
              payload: {}
              as: StoreManager
              captures: { acc_before: $.data.active_curbside_count }
          trigger:
            - call: "POST /curbside-checkins/${ci_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { cs: $.data.checkin_status }
            - call: "GET /stores/${s_id}"
              payload: {}
              as: StoreManager
              captures: { acc_after: $.data.active_curbside_count }
          assert:
            - "active_curbside_count == 1 before cancel"
            - "CurbsideCheckIn.${ci_id}.checkin_status == CANCELLED and Store.${s_id}.active_curbside_count == 0 after cancel"

      - name: cancel_submitted_cascade_releases_inventory_and_slot
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.SUBMITTED_to_CANCELLED, entities.StoreInventory.fields.reserved, entities.PickupSlot.fields.booked_count]
        excluded_because:
          difficulty_instance: compensating_invariant / inventory_units_conserved_on_submit_then_cancel
          rationale: "The §1.8 inventory-invariant instance drives submit->cancel and asserts the reservation release and conservation."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: submit_response_reflects_authorized_total_immediately
        claim_type: immediate
        grounds: [entities.Order.fields.authorized_total_cents, state_machines.Order.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "The submit response itself carries the freshly-pinned authorized_total_cents and AUTHORIZED payment_status (immediate consistency, no read-after-write lag)."
        test_recipe:
          setup: ["DRAFT order line A x2 (1500) + C x3 (1000); slot OPEN"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "A", unit_price_cents: 1500 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C", name: "C", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${a_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${c_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${a_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${c_id}", qty_ordered: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { auth: $.data.authorized_total_cents, ps: $.data.payment_status }
          assert:
            - "submit response data.authorized_total_cents == 6000 (1500*2 + 1000*3) in the same response"
            - "submit response data.payment_status == AUTHORIZED immediately"
