# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Personal Chef & In-Home Dining Booking — Expert
#
# Breadth probe: enumerates testable claims in §1.1-§1.7 NOT already covered by
# §1.8. Same seven-point contract & §1.5 reachability gates as §1.8.
# Section/claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_chef_returns_201_with_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Chef.fields.status
          - entities.Chef.fields.settled_reliability_score
          - entities.Chef.fields.prep_buffer_minutes
        distinguishing_aspect: "POST /chefs with only display_name+home_base_zip -> 201, status=DRAFT, prep_buffer_minutes default 90, max_bookings_per_day default 2, both reliability scores 50, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /chefs"
              payload: { display_name: "Solo Chef", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Chef.${chef_id}.status == DRAFT"
            - "Chef.${chef_id}.prep_buffer_minutes == 90"
            - "Chef.${chef_id}.max_bookings_per_day == 2"
            - "Chef.${chef_id}.settled_reliability_score == 50"
            - "Chef.${chef_id}.projected_reliability_score == 50"
            - "Chef.${chef_id}.version == 1"

      - name: create_booking_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.event_start_utc
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /bookings omitting event_start_utc -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a chef and client exist"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef RF", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client RF", email: "rf@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_booking_event_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Booking.fields.event_end_utc
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "event_end_utc <= event_start_utc -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["chef + client exist"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef TC", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client TC", email: "tc@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-15T22:00:00Z", event_end_utc: "2026-08-15T18:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_booking_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Booking
          - errors[ERR_BOOKING_NOT_FOUND]
        distinguishing_aspect: "GET /bookings/{random-uuid} -> ERR_BOOKING_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Client
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_BOOKING_NOT_FOUND"

      - name: booking_computed_quote_fields_zero_before_confirm
        claim_type: Computed Fields
        grounds:
          - entities.Booking.fields.quote_total_cents
          - entities.Booking.fields.travel_zone_id
          - entities.Booking.fields.event_date
        distinguishing_aspect: "On a freshly created REQUESTED booking, quote_total_cents/labor/grocery are 0 (computed only at confirm) but travel_zone_id, travel_fee_cents and event_date are resolved at creation."
        test_recipe:
          setup: ["active chef with ZONE_A fee 5000; menu published"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef CF", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { zone_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client CF", email: "cf@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-15T18:00:00Z", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.lifecycle_status == REQUESTED"
            - "Booking.${booking_id}.quote_total_cents == 0"
            - "Booking.${booking_id}.travel_fee_cents == 5000"
            - "Booking.${booking_id}.travel_zone_id == ${zone_id}"
            - "Booking.${booking_id}.event_date == 2026-08-15"

      - name: create_booking_zip_outside_service_area_returns_error
        claim_type: Parent Relationships
        grounds:
          - validations[priority=9]
          - errors[ERR_ZIP_OUTSIDE_SERVICE_AREA]
          - entities.TravelZone.fields.zip_prefixes
        distinguishing_aspect: "service_zip 95000 prefix-matches none of the chef's zones (only 941) -> ERR_ZIP_OUTSIDE_SERVICE_AREA (422)."
        test_recipe:
          setup: ["chef with only ZONE_A covering prefix 941"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef ZIP", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /clients"
              payload: { full_name: "Client ZIP", email: "zip@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "95000", event_start_utc: "2026-08-15T18:00:00Z", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ZIP_OUTSIDE_SERVICE_AREA"

      - name: list_chefs_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.Chef
        distinguishing_aspect: "GET /chefs returns array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["two chefs exist"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef L1", home_base_zip: "94101" }
              as: Chef
            - call: "POST /chefs"
              payload: { display_name: "Chef L2", home_base_zip: "94102" }
              as: Chef
          trigger:
            - call: "GET /chefs?limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_booking_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a booking already CONFIRMED -> ERR_INVALID_STATE (409); idempotency rejection on the lifecycle axis."
        test_recipe:
          setup: ["a CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef IS", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client IS", email: "is@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-15T18:00:00Z", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "GET /chefs/${chef_id}"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${v_now}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_before_paid_in_full_returns_balance_outstanding
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.IN_PREP_to_COMPLETED
          - errors[ERR_BALANCE_OUTSTANDING]
          - entities.Booking.fields.payment_status
        distinguishing_aspect: "Completing an IN_PREP booking whose payment_status is only DEPOSIT_PAID -> ERR_BALANCE_OUTSTANDING (402)."
        test_recipe:
          setup: ["booking CONFIRMED, deposit paid, grocery run FINALIZED, started prep (IN_PREP), balance NOT paid"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef BO", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client BO", email: "bo@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-15T18:00:00Z", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", kind: "DEPOSIT", amount_cents: 26196 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /grocery-runs"
              payload: { booking_id: "${booking_id}", line_items: [{ label: "a", actual_cost_cents: 8001 }, { label: "b", actual_cost_cents: 8001 }, { label: "c", actual_cost_cents: 7998 }] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { gr_id: $.data.id }
            - call: "POST /grocery-runs/${gr_id}/finalize"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /bookings/${booking_id}/start-prep"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 402"
            - "response.data.error_id == ERR_BALANCE_OUTSTANDING"

      - name: start_prep_without_finalized_grocery_run_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.CONFIRMED_to_IN_PREP
          - errors[ERR_GROCERY_RUN_NOT_FINALIZED]
        distinguishing_aspect: "start-prep on a CONFIRMED booking with no FINALIZED grocery run -> ERR_GROCERY_RUN_NOT_FINALIZED (409)."
        test_recipe:
          setup: ["CONFIRMED booking, no grocery run finalized"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef GF", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client GF", email: "gf@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-16T18:00:00Z", event_end_utc: "2026-08-16T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/start-prep"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_GROCERY_RUN_NOT_FINALIZED"

      - name: cancel_terminal_completed_booking_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) booking -> ERR_INVALID_STATE (409); terminal lockdown."
        test_recipe:
          setup: ["a fully COMPLETED booking"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef TL", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "M", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client TL", email: "tl@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-17T18:00:00Z", event_end_utc: "2026-08-17T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", kind: "DEPOSIT", amount_cents: 26196 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /grocery-runs"
              payload: { booking_id: "${booking_id}", line_items: [{ label: "a", actual_cost_cents: 8001 }, { label: "b", actual_cost_cents: 8001 }, { label: "c", actual_cost_cents: 7998 }] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { gr_id: $.data.id }
            - call: "POST /grocery-runs/${gr_id}/finalize"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", kind: "BALANCE", amount_cents: 61124 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /bookings/${booking_id}/start-prep"
              payload: {}
