              payload: {}
              as: Buyer
              as_user_id: "${buyer_de_id}"
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/execute"
              payload: {}
              as: HeadOfSales
              as_user_id: "hos-closer-9"
            - call: "POST /film-sales/films/${film_id}/collection-accounts"
              payload: { bank_name: "Fiduciary Trust", account_reference: "CAM-2793" }
              as: CollectionAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /film-sales/payment-milestones/${ms_sig_id}/receipt"
              payload: { amount_usd: 900000.00, received_at: "2026-08-05T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "POST /film-sales/payment-milestones/${ms_del_id}/receipt"
              payload: { amount_usd: 400000.00, received_at: "2026-08-06T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "POST /film-sales/payment-milestones/${ms_rel_id}/receipt"
              payload: { amount_usd: 200000.00, received_at: "2026-08-07T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
          assert:
            - "PaymentMilestone.${ms_sig_id}.accrued_commission_usd == 90000.00"
            - "PaymentMilestone.${ms_del_id}.accrued_commission_usd == 40000.00"
            - "PaymentMilestone.${ms_rel_id}.accrued_commission_usd == 15000.00"
            - "SalesAgencyAgreement.${agr_id}.gross_collected_usd == 1500000.00"
            - "SalesAgencyAgreement.${agr_id}.commission_earned_usd == 145000.00"
            - "CollectionAccount.${acct_id}.total_receipts_usd == 1500000.00"
            - "CollectionAccount.${acct_id}.balance_usd == 1500000.00"
            - "Film.${film_id}.total_mg_collected_usd == 1500000.00"
            - "PreSaleContract.${contract_id}.collection_status == PARTIALLY_PAID"
            - "PreSaleContract.${contract_id}.unpaid_amount_usd == 500000.00"

      - name: waterfall_round_each_tier_share_before_subtracting_shifts_a_cent_to_equity_tier
        grounds:
          - calculations.waterfall_distribution
          - entities.WaterfallTier.fields.pct_of_available
          - entities.WaterfallTier.fields.cap_usd
          - entities.WaterfallTier.fields.recouped_usd
          - entities.DistributionRun.fields.allocations
          - entities.DistributionRun.fields.residual_usd
          - entities.CollectionAccount.fields.balance_usd
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding whose ORDER changes the cents. Distributing
          500000.04 across six tiers, rounding each tier's share to cents BEFORE subtracting gives
          EQUITY_RECOUPMENT exactly 24637.51; carrying full precision and rounding only at the end
          gives 24637.50, so the single cent is the falsifiable signature of the pinned order. This
          instance is about rounding order, not about the pre-receipt rate selection of the
          commission instance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; contract MG 2000000.00 EXECUTED with the four-line milestone schedule."
            - "Facility DRAWN for 1000000.00 (bond posted), so the BANK_DEBT tier is ACTIVE rather than SUSPENDED."
            - "90000.00 of sales expenses logged against a 75000.00 expense cap, so the recoupable expense ceiling is 75000.00."
            - "Three receipts posted (900000.00, 400000.00, 200000.00) leaving total_receipts_usd 1500000.00, balance_usd 1500000.00 and commission_earned_usd 145000.00."
            - "Six waterfall tiers: 1 COLLECTION_FEE 0.0125 cap 25000.00, 2 SALES_COMMISSION 1.00 cap 145000.00, 3 SALES_EXPENSES 1.00 cap 75000.00, 4 BANK_DEBT 0.85 cap 1000000.00, 5 EQUITY_RECOUPMENT 0.60 cap 12000000.00, 6 PARTICIPATION 1.00 uncapped."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
