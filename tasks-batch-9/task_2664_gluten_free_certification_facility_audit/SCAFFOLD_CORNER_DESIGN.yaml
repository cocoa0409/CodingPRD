      - name: linking_the_same_ingredient_to_a_product_twice_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_33
          - errors.ERR_DUPLICATE_PRODUCT_INGREDIENT
          - endpoints."POST /gfco/product-ingredients"
        distinguishing_aspect: |
          The junction guard is on the (product_id, ingredient_id) pair, so a second link with
          a DIFFERENT inclusion_pct is still a duplicate - the immutable junction offers no
          update path, and the original 60 pct row must survive untouched.
        test_recipe:
          setup:
