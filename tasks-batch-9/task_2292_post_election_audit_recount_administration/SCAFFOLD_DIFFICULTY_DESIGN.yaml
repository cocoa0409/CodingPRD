  - rule_id: compensating_invariant
    instances:
      - name: compensating_reopen_restores_audit_error_ledger
        grounds:
          - state_machines.ManualTally.SUBMITTED_to_DRAFT
          - state_machines.Discrepancy.OPEN_to_VOIDED
          - state_machines.AuditRound.REVIEW_REQUIRED_to_TALLYING
          - state_machines.Audit.DISCREPANCY_REVIEW_to_TALLYING
          - calculations.tally_discrepancy_measure
        distinguishing_aspect: |
          Conserved quantity: the audit error ledger (AuditRound.cumulative_net_error_votes and counted_ballots and
          the measures derived from them). Reopening the only submitted tally must return every ledger figure to its
          pre-submit value of zero and walk both the round and the audit back one state, leaving no residue except the
          incremented reopen_count and the VOIDED discrepancy.
        test_recipe:
          setup:
            - "Election ST-01 contest C1 canvassed (margin_votes 300) with six 1000-ballot batches machine-tabulated 525/475; audit A1 RISK_LIMITING alpha 0.05 seeded 0459231087 drew B-003, B-004, B-005."
            - "Team T-1 submitted B-003 as 520/480, so net_error_votes 10 pushed round_measure to 0.0100, round 1 into REVIEW_REQUIRED, A1 into DISCREPANCY_REVIEW and Election.certification_risk_flag to true."
            - "Exactly one OPEN discrepancy exists and no discrepancy has been documented, escalated or resolved, so the reopen is permitted."
            - "reopen_count is 0 and the clock stays at 2026-11-05T09:00:00Z."
