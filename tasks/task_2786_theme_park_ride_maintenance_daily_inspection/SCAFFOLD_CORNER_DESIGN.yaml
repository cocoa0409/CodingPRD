          assert:
            - "After the setup NDT record: ComponentAsset.${c_id}.last_ndt_at == \"2026-08-01T00:00:00Z\", last_ndt_method == \"MAGNETIC_PARTICLE\", last_ndt_cycles == 0, ndt_status == \"CURRENT\", condition_flag == \"OK\""
            - "Trigger 2 (29 days): ndt_status == \"CURRENT\" and cycles_since_last_ndt == 0"
            - "Trigger 4 (30 days, exactly ndt_interval_days): ndt_status == \"DUE\""
            - "Trigger 6 (35 days, one below the grace ceiling): ndt_status == \"DUE\""
            - "Trigger 8 (36 days, exactly ceil(30 * 1.2)): ndt_status == \"OVERDUE\""
            - "Trigger 9: Attraction.${a_id}.operational_posture == \"DOWN\" purely because of the OVERDUE SAFETY_CRITICAL component, with no downtime event and no inspection in play"

      - name: four_hop_cascade_from_a_safety_critical_failure_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.InspectionItemResult.transitions.PENDING_to_FAIL"
          - "state_machines.DailyInspection.transitions.IN_PROGRESS_to_BLOCKED"
        excluded_because:
          difficulty_instance: transitive_cascade / safety_critical_fail_cascades_four_hops_and_walk_back_is_partial
          rationale: "That §1.8 instance asserts each of the four hops and then proves the walk-back is deliberately partial, which subsumes any shorter cascade probe."

      - name: both_capacity_variants_are_asserted_on_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.downtime_capacity_loss.variants"
          - "calculations.bulletin_fleet_risk_score.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_loss_settled_per_event_rounding_vs_provisional_single_rounding
          rationale: "That §1.8 instance reports SETTLED, PROVISIONAL and the signed divergence from one event set, which is exactly the layer's claim."

      - name: parts_budget_derived_field_is_correct_after_create_update_and_release
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.parts_budget_committed_ledger"
          - "entities.Attraction.fields.parts_budget_committed_cents"
        excluded_because:
          difficulty_instance: compensating_invariant / requisition_cancel_releases_exactly_what_it_committed_and_requested_cancel_is_a_no_op
          rationale: "That §1.8 instance tracks the derived committed total through reserve, receive and cancel, including the REQUESTED cancel that must move nothing."

  - section: consistency_model
    instances:

      - name: the_mutation_response_already_shows_the_recomputed_posture
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /park-ops/attractions/{id}/cycles]"
          - "calculations.operational_posture_derivation"
        distinguishing_aspect: "One cycle log crosses the NDT grace ceiling, and the very response body of that POST (whose declared output is the Attraction) already carries cumulative_cycles 120 and operational_posture \"DOWN\" - no second read is needed for the derived state to settle, and the immediately following component read agrees."
        test_recipe:
          setup:
            - "One attraction with a SAFETY_CRITICAL component whose ndt_interval_cycles is 100 (grace ceiling 120) and whose cycle counter is still 0."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Immediate Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "IM-1", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Immediate Brake", component_type: "BRAKE", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 100, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/attractions/${a_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 120 }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          assert:
            - "Trigger 1 response body: cumulative_cycles == 120 and operational_posture == \"DOWN\" in the same response that caused the change"
            - "Trigger 2: ComponentAsset.${c_id}.cycles_since_last_ndt == 120 and ndt_status == \"OVERDUE\""
            - "Trigger 3: the re-read Attraction is byte-identical in cumulative_cycles and operational_posture to the trigger 1 body (no lag, no drift)"
            - "Attraction.${a_id}.version advanced exactly once for the single cycle log"
