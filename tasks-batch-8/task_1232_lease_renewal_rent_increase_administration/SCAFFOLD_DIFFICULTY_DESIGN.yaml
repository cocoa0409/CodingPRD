  # ---------------------------------------------------------------------------
  # Rule 7: cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_create_blocked_when_lease_noticed
        grounds:
          - state_machines.Lease.RENEWAL_PENDING_to_NON_RENEWAL_NOTICED
          - errors[ERR_LEASE_NOT_ISSUABLE]
          - concurrency_rules[offer-create-stale-lease]
        distinguishing_aspect: |
          Entity pair RenewalOffer -> Lease: offer creation is gated on the LEASE's status (not
          the offer's, which does not exist yet). With the lease NON_RENEWAL_NOTICED and a fresh
          matching expected_lease_version (so OCC passes), the create still fails with
          ERR_LEASE_NOT_ISSUABLE — the cross-entity state gate, not version staleness, is tested.
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [12,12]; unit market 210000; lease rent 200000, 2026-06-01 + 12mo"
            - "Notice REPEATED_LATE_PAYMENT effective 2027-06-01 created by user_la_1 and served by user_pm_1 at 2026-05-01 -> lease NON_RENEWAL_NOTICED"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Notice Gate Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "1001", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ola Haddad", email: "ola.haddad@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id" }
            - call: "POST /leases/${lease}/non-renewal-notices"
              payload: { cause_type: "REPEATED_LATE_PAYMENT", effective_date: "2027-06-01" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { notice: "$.data.id" }
            - call: "POST /non-renewal-notices/${notice}/serve"
              payload: {}
              as: PropertyManager
              as_user_id: "user_pm_1"
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { l_status: "$.data.status", lease_v: "$.data.version" }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "l_status == NON_RENEWAL_NOTICED before the trigger"
            - "err == ERR_LEASE_NOT_ISSUABLE (http 409) even though expected_lease_version matched the current version"
            - "no RenewalOffer exists for the lease afterwards (GET /renewal-offers?lease_id returns an empty list)"

      - name: concession_approve_blocked_when_offer_not_countered
        grounds:
          - state_machines.ConcessionApproval.SUBMITTED_to_APPROVED
          - state_machines.RenewalOffer.COUNTERED_to_ISSUED
          - errors[ERR_OFFER_NOT_COUNTERED]
        distinguishing_aspect: |
          Entity pair ConcessionApproval -> RenewalOffer (different pair than the sibling): the
          approval's own status is still SUBMITTED, yet approval is rejected because the OFFER it
          is chained to left COUNTERED (an intervening revise at an above-proposed rent needed no
          concession and re-issued the offer, orphaning the pending request).
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [18,18]; unit market 220000; lease rent 200000"
            - "Offer BALANCED proposed 210800, issued; resident counters 205000 -> COUNTERED; concession for 205000 (275 bps) SUBMITTED by user_la_1"
            - "Agent revises to 211000 (>= proposed 210800, so no approval gate fires; 550 bps <= cap; window open at default clock) -> offer ISSUED round 2, concession still SUBMITTED"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Orphan Gate House", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "1002", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Pia Moreau", email: "pia.moreau@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id" }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 205000 }
              as: Resident
              as_user_id: "${res}"
            - call: "POST /renewal-offers/${offer}/concession-approvals"
              payload: { requested_rent_cents: 205000, reason: "retention" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { conc: "$.data.id", conc_status: "$.data.status" }
            - call: "POST /renewal-offers/${offer}/revise"
              payload: { revised_rent_cents: 211000 }
              as: LeasingAgent
              captures: { o_status: "$.data.status", o_round: "$.data.offer_round" }
          trigger:
            - call: "POST /concession-approvals/${conc}/approve"
              payload: {}
              as: PropertyManager
              as_user_id: "user_pm_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "conc_status == SUBMITTED at trigger time (the concession itself is in the right state)"
            - "o_status == ISSUED and o_round == 2 (the offer left COUNTERED via the revise)"
            - "err == ERR_OFFER_NOT_COUNTERED (http 409): the cross-entity gate fires even though the concession's own state precondition holds"

  # ---------------------------------------------------------------------------
  # Rule 8: resource temporal-overlap conflicts with different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_lease_half_open_overlap_rejected
        grounds:
          - entities.Lease.fields.term_end_date
          - errors[ERR_LEASE_TERM_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: Unit; semantics: pairwise half-open interval intersection [start, end). Lease B
          starting 2027-05-15 intersects lease A's [2026-06-01, 2027-06-01) and is rejected; the
          same unit with start exactly 2027-06-01 (zero-gap adjacency) is ACCEPTED because
          half-open ends do not intersect.
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [12,12]; one unit; two residents; lease A 2026-06-01 + 12mo occupies [2026-06-01, 2027-06-01)"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Overlap Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "1101", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res Alpha", email: "res.alpha@x.com" }
              as: PlatformAdmin
              captures: { ra: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res Beta", email: "res.beta@x.com" }
              as: PlatformAdmin
              captures: { rb: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${ra}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_a: "$.data.id" }
          trigger:
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${rb}", term_start_date: "2027-05-15", term_months: 12, monthly_rent_cents: 205000 }
              as: PropertyManager
              captures: { err: "$.data.error_id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${rb}", term_start_date: "2027-06-01", term_months: 12, monthly_rent_cents: 205000 }
              as: PropertyManager
              captures: { lease_b: "$.data.id", end_b: "$.data.term_end_date" }
          assert:
            - "overlapping start 2027-05-15: err == ERR_LEASE_TERM_OVERLAP (http 409)"
            - "zero-gap adjacency start 2027-06-01 (== A's half-open end): accepted, lease_b created with end_b == 2028-06-01"

      - name: repositioning_quarterly_quota_third_rejected
