            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "V4", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u4: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "R1", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { rs1: $.data.id }
            - call: "POST /ccrc/residents"
