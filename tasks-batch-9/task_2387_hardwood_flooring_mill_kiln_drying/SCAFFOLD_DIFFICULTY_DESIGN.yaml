            - "Second load: status 200 with data.status == \"LOADED\"."
            - "GET /mill/kiln-chambers/{chamber_id} then shows status \"OCCUPIED\" and GET /mill/green-receipts/{r1} shows status \"CONSUMED\"."
            - "The charge's own fields never changed between the two attempts: only the other entity's state decided the outcome."

