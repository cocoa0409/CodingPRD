              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Y1", contact_email: "y1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
