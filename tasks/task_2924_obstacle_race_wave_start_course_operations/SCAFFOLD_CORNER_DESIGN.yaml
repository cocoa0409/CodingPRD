        distinguishing_aspect: "With three 1500 sqm tasks against 4500 disturbed sqm and a 1,000,000-cent bond, verifying only the first releases round_half_up(1000000 × 1500 / 4500) = 333333 cents; the two PENDING tasks contribute nothing and the denominator stays 4500 rather than collapsing to the 1500 verified sqm."
