  - section: state_machines
    instances:
      - name: state_initial_states_on_create_across_the_domain
        claim_type: initial_state
        grounds:
          - state_machines.AcademicTerm
          - state_machines.PublisherAgreement
          - state_machines.CourseMaterialTitle
          - state_machines.CourseSection
          - state_machines.Adoption
          - state_machines.Enrollment
          - state_machines.DisclosureReport
        distinguishing_aspect: |
          Each entity lands in its declared initial_state with its counters at their zero values,
          including the two-dimensional PublisherAgreement (DRAFT and NOT_STARTED are independent
          dimensions) and a DisclosureReport whose metrics are computed at creation time and
          therefore report NOT_APPLICABLE rather than null while the term holds no charge.
        test_recipe:
          setup:
            - "Term FA26 (PLANNING), PUB-A (DRAFT), title T1 with one tier and section ECON-101-001 all created at 2026-07-01T00:00:00Z. The term is deliberately left in PLANNING - adoption authoring is legal there."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id, term_status: $.data.status }
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
          trigger:
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt1_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu1_id}", enrolled_on: "2026-08-24" }
              as: Registrar
              captures: { enr1_id: $.data.id }
            - call: "POST /disclosure-reports"
              payload: { term_id: "${term_id}", reporting_state_code: "CA" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_id: $.data.id }
          assert:
            - "Setup: AcademicTerm.${term_id}.status == PLANNING, PublisherAgreement.${agr_id}.status == DRAFT AND reconciliation_status == NOT_STARTED, CourseMaterialTitle.${t1_id}.status == ACTIVE"
            - "Setup: CourseSection.${sec_id}.ia_status == NOT_FLAGGED, inclusive_access_flag == false, billing_basis_enrollment_count == null, first_posted_at == null"
            - "Trigger call 1 -> HTTP 201: Adoption.${adopt1_id}.status == DRAFT, revision_count == 0, requires_rebill == false, locked_list_price_cents == null, submitted_at == null, submitted_by_user_id == null, approved_at == null"
            - "Trigger call 2 -> HTTP 201: Student.${stu1_id}.status == ACTIVE and bursar_balance_cents == 0"
            - "Trigger call 3 -> HTTP 201: Enrollment.${enr1_id}.status == ENROLLED, registration_type == REGULAR (2026-08-24 <= add_drop_deadline), dropped_on == null"
            - "Trigger call 4 -> HTTP 201: DisclosureReport.${rep_id}.status == DRAFT, amendment_count == 0, certified_at == null, published_at == null"
            - "Trigger call 4 metrics: ia_section_count == 0, charge_count == 0, enrolled_student_count == 0, opted_out_student_count == 0, total_list_price_cents == 0, total_net_billed_cents == 0, average_net_cost_cents == 0, savings_pct == 0.0000, compliance_status == NOT_APPLICABLE"
            - "CourseSection.${sec_id}.enrolled_count == 1 and participation_rate == 0.0000 after trigger call 3 (no charge is provisioned yet)"

      - name: state_agreement_activate_then_suspend_valid_transitions
        claim_type: valid_transition
        grounds:
          - state_machines.PublisherAgreement.DRAFT_to_ACTIVE
          - state_machines.PublisherAgreement.ACTIVE_to_SUSPENDED
          - endpoints[POST /agreements/{agreement_id}/activate]
          - endpoints[POST /agreements/{agreement_id}/suspend]
        distinguishing_aspect: |
          The lifecycle dimension moves DRAFT -> ACTIVE -> SUSPENDED with one version increment per
          hop while the reconciliation dimension stays at NOT_STARTED throughout - proving the two
          state fields on the same row are independent - and SUSPENDED is terminal by declaration.
        test_recipe:
          setup:
            - "PUB-A in DRAFT with one ACTIVE title T1 carrying one PricingTier, so the activation readiness precondition holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
