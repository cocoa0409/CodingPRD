            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "USAGE_BASED", base_monthly_fee_cents: 0, minimum_procedures_per_cycle: 4, interval_months: 1, placement_fee_cents: 1500000, usage_rate_basis_points: 400 }
              as: RegionalSalesDirector
