# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_milestone_provisional_vs_finalized_quote
        grounds:
          - calculations.milestone_generation
          - state_machines.Booking.DRAFT_to_RESERVED
          - entities.Booking.fields.grand_total_cents
          - entities.PaymentMilestone.fields.amount_due_cents
        distinguishing_aspect: "On the Booking/PaymentMilestone domain: provisional grand_total (DRAFT, 100000 with 1 traveler, no insurance) diverges from the finalized grand_total (104000 after a PREMIUM insurance attach), and reserve freezes 104000 so DEPOSIT=20800 / BALANCE=83200 come from the FROZEN value, not the pre-insurance 100000."
        test_recipe:
          setup:
            - "Agency clock 2026-01-01; PUBLISHED package base=100000/pp, deposit_pct=20."
            - "Booking with 1 traveler -> provisional grand_total 100000; then PREMIUM insurance (1*4000=4000) -> finalized grand_total 104000 frozen at reserve."
            - "One mandatory FLIGHT component on an auto_confirm supplier."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe Tours", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/_clock/set"
              payload: { now_utc: "2026-01-01T00:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c1@x.com", full_name: "C One" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "AutoAir", kind: "FLIGHT", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "Alps", base_price_per_person_cents: 100000, deposit_pct: 20 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "POST /agencies/insurance-policies"
              payload: { booking_id: "${bk}", coverage_tier: "PREMIUM" }
              as: TravelAgent
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup}", kind: "FLIGHT", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T12:00:00.000Z", is_mandatory: true }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /agencies/bookings/${bk}/reserve"
              payload: { expected_booking_version: "${v1}" }
              as: TravelAgent
          assert:
            - "Booking.${bk}.grand_total_cents == 104000"
            - "PaymentMilestone(kind=DEPOSIT).amount_due_cents == 20800"
            - "PaymentMilestone(kind=BALANCE).amount_due_cents == 83200"
      - name: dvc_cancellation_refund_original_vs_wallet
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.RESERVED_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
          - entities.CancellationRecord.fields.refund_cents
        distinguishing_aspect: "On the CancellationRecord/Customer domain (different from the Booking/Milestone domain above): the SAME refund_cents=371250 either credits Customer.wallet_credit_cents (WALLET) or leaves it at 0 (ORIGINAL)."
        test_recipe:
          setup:
            - "RESERVED booking, grand_total 495000 (5 travelers @ 95000 + PREMIUM ins 20000), DEPOSIT 99000 + BALANCE 396000 both SETTLED so paid_cents=495000."
            - "Clock 2026-01-01; departure 2026-01-31 (30 days -> TIER_LOW 25%) -> penalty 123750, refund 371250."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe Tours", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/_clock/set"
              payload: { now_utc: "2026-01-01T00:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c1@x.com", full_name: "C One" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "AutoAir", kind: "FLIGHT", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "Alps", base_price_per_person_cents: 100000, deposit_pct: 20, min_group_size_for_discount: 5 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-01-31T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v1: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T2", expected_booking_version: "${v1}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v2: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T3", expected_booking_version: "${v2}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v3: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T4", expected_booking_version: "${v3}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v4: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T5", expected_booking_version: "${v4}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v5: $.data.version }
            - call: "POST /agencies/insurance-policies"
              payload: { booking_id: "${bk}", coverage_tier: "PREMIUM" }
              as: TravelAgent
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup}", kind: "FLIGHT", starts_at: "2026-01-31T08:00:00.000Z", ends_at: "2026-01-31T12:00:00.000Z", is_mandatory: true }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v6: $.data.version }
            - call: "POST /agencies/bookings/${bk}/reserve"
              payload: { expected_booking_version: "${v6}" }
              as: TravelAgent
              captures: { v7: $.data.version }
            - call: "GET /agencies/milestones?booking_id=${bk}&kind=DEPOSIT"
              payload: {}
              as: TravelAgent
              captures: { dep_ms: "$.data[0].id" }
            - call: "POST /agencies/payments"
              payload: { booking_id: "${bk}", milestone_id: "${dep_ms}", amount_cents: 99000, method: "CARD" }
              as: TravelAgent
            - call: "GET /agencies/milestones?booking_id=${bk}&kind=BALANCE"
              payload: {}
              as: TravelAgent
              captures: { bal_ms: "$.data[0].id" }
            - call: "POST /agencies/payments"
              payload: { booking_id: "${bk}", milestone_id: "${bal_ms}", amount_cents: 396000, method: "CARD" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v8: $.data.version }
          trigger:
            - call: "POST /agencies/bookings/${bk}/cancel"
              payload: { expected_booking_version: "${v8}", refund_destination: "WALLET" }
              as: TravelAgent
          assert:
            - "CancellationRecord.refund_cents == 371250"
            - "CancellationRecord.penalty_cents == 123750"
            - "Customer.${cust}.wallet_credit_cents == 371250"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_group_discount_round_then_multiply
        grounds:
          - calculations.group_discount_price_per_person
          - entities.Booking.fields.subtotal_cents
          - state_machines.Booking.DRAFT_to_RESERVED
        distinguishing_aspect: "Mode (b) nested-rounding-order: per_person = round_half_up(33333*0.95)=31666 then *6 = 199996... pinned round-then-multiply yields 189996, whereas sum-then-round would yield 189998 — the scaffold pins round-then-multiply."
        test_recipe:
          setup:
            - "PUBLISHED package base=33333/pp, min_group=5; booking with 6 travelers (5% TIER_SMALL discount)."
            - "per_person_cents=31666 (round_half_up of 31666.35), subtotal=31666*6=189996."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 33333, min_group_size_for_discount: 5 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v1: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T2", expected_booking_version: "${v1}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v2: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T3", expected_booking_version: "${v2}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v3: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T4", expected_booking_version: "${v3}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v4: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T5", expected_booking_version: "${v4}" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v5: $.data.version }
          trigger:
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T6", expected_booking_version: "${v5}" }
              as: TravelAgent
          assert:
            - "Booking.${bk}.traveler_count == 6"
            - "Booking.${bk}.subtotal_cents == 189996"
            - "Booking.${bk}.grand_total_cents == 189996"
      - name: cf_milestone_deposit_round_then_balance_remainder
        grounds:
          - calculations.milestone_generation
          - entities.PaymentMilestone.fields.amount_due_cents
          - state_machines.Booking.DRAFT_to_RESERVED
        distinguishing_aspect: "Mode (a) non-linear branch + remainder allocation (different mode from cf_group_discount): grand=100002, deposit_pct=25 -> DEPOSIT=round_half_up(25000.5)=25001, BALANCE=100002-25001=75001 (remainder, not independently rounded), DEPOSIT+BALANCE==grand exactly."
        test_recipe:
          setup:
            - "PUBLISHED package base=100002/pp, deposit_pct=25, min_group=5; booking with 1 traveler (no discount) -> grand=100002."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/_clock/set"
              payload: { now_utc: "2026-01-01T00:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "AutoAir", kind: "FLIGHT", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 100002, deposit_pct: 25, min_group_size_for_discount: 5 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup}", kind: "FLIGHT", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T12:00:00.000Z", is_mandatory: true }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /agencies/bookings/${bk}/reserve"
              payload: { expected_booking_version: "${v1}" }
              as: TravelAgent
          assert:
            - "PaymentMilestone(kind=DEPOSIT).amount_due_cents == 25001"
            - "PaymentMilestone(kind=BALANCE).amount_due_cents == 75001"
            - "DEPOSIT.amount_due_cents + BALANCE.amount_due_cents == 100002"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_component_branch_confirm_vs_reject
        grounds:
          - state_machines.BookingComponent.REQUESTED_to_CONFIRMED
          - state_machines.BookingComponent.REQUESTED_to_REJECTED
          - entities.BookingComponent.fields.status
        distinguishing_aspect: "Branching fork on BookingComponent: REQUESTED forks to CONFIRMED (no parent side-effect) vs REJECTED (mandatory reject re-opens the RESERVED parent) — divergent side-effect sets per branch on the BookingComponent entity."
        test_recipe:
          setup:
            - "Two manual-confirm FLIGHT suppliers; a DRAFT booking with 1 traveler and two REQUESTED FLIGHT components c1,c2 from those suppliers."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "ManualAir", kind: "FLIGHT", auto_confirm: false }
              as: AgencyAdmin
              captures: { sup1: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 100000 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup1}", kind: "FLIGHT", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T10:00:00.000Z", is_mandatory: true }
              as: TravelAgent
              captures: { c1: $.data.id }
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup1}", kind: "FLIGHT", starts_at: "2026-06-01T20:00:00.000Z", ends_at: "2026-06-01T22:00:00.000Z", is_mandatory: false }
              as: TravelAgent
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /agencies/components/${c1}/confirm"
              payload: {}
              as: Supplier
              as_user_id: "${sup1}"
              captures: { c1_status: $.data.status }
            - call: "POST /agencies/components/${c2}/reject"
              payload: {}
              as: Supplier
              as_user_id: "${sup1}"
              captures: { c2_status: $.data.status }
          assert:
            - "BookingComponent.${c1}.status == CONFIRMED"
            - "BookingComponent.${c2}.status == REJECTED"
            - "Booking.${bk}.status == DRAFT (optional c2 reject does NOT re-open; booking was already DRAFT)"
      - name: nlsm_booking_parallel_status_and_payment_status
        grounds:
          - state_machines.Booking.DRAFT_to_RESERVED
          - entities.Booking.fields.status
          - entities.Booking.fields.payment_status
          - calculations.payment_status_derivation
        distinguishing_aspect: "Parallel dimensions on the Booking entity (different entity from BookingComponent above): status advances DRAFT->RESERVED while payment_status (UNPAID->DEPOSIT_PAID) evolves independently via milestone settlement, not via the lifecycle transition."
        test_recipe:
          setup:
            - "RESERVED booking, grand=100000, deposit_pct=20 -> DEPOSIT 20000 / BALANCE 80000; clock 2026-01-01, departure far out."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/_clock/set"
              payload: { now_utc: "2026-01-01T00:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "AutoAir", kind: "FLIGHT", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 100000, deposit_pct: 20 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id, v0: $.data.version }
            - call: "POST /agencies/bookings/${bk}/travelers"
              payload: { full_name: "T1", expected_booking_version: "${v0}" }
              as: TravelAgent
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup}", kind: "FLIGHT", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T12:00:00.000Z", is_mandatory: true }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { v1: $.data.version }
            - call: "POST /agencies/bookings/${bk}/reserve"
              payload: { expected_booking_version: "${v1}" }
              as: TravelAgent
            - call: "GET /agencies/milestones?booking_id=${bk}&kind=DEPOSIT"
              payload: {}
              as: TravelAgent
              captures: { dep_ms: "$.data[0].id" }
          trigger:
            - call: "POST /agencies/payments"
              payload: { booking_id: "${bk}", milestone_id: "${dep_ms}", amount_cents: 20000, method: "CARD" }
              as: TravelAgent
            - call: "GET /agencies/bookings/${bk}"
              payload: {}
              as: TravelAgent
              captures: { final_status: $.data.status, final_pay: $.data.payment_status }
          assert:
            - "Booking.${bk}.status == RESERVED"
            - "Booking.${bk}.payment_status == DEPOSIT_PAID"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_mandatory_reject_reopens_booking_waives_milestones
        grounds:
          - state_machines.BookingComponent.REQUESTED_to_REJECTED
          - state_machines.Booking.RESERVED_to_DRAFT
          - state_machines.PaymentMilestone
          - calculations.payment_status_derivation
        distinguishing_aspect: "Depth-3 chain triggered by component reject: reject mandatory component (A) -> Booking RESERVED->DRAFT (B, caused by A) -> OPEN milestones WAIVED (C, caused by B) -> payment_status recomputes to UNPAID (D, caused by C)."
        test_recipe:
          setup:
            - "RESERVED booking, 1 traveler, grand=100000, DEPOSIT 20000 OPEN + BALANCE 80000 OPEN; mandatory FLIGHT component c1 on a manual supplier still REQUESTED."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/_clock/set"
              payload: { now_utc: "2026-01-01T00:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "ManualAir", kind: "FLIGHT", auto_confirm: false }
              as: AgencyAdmin
              captures: { sup: $.data.id }
            - call: "POST /agencies/tour-packages"
