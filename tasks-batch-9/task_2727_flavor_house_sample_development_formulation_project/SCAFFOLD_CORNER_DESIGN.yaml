          - entities.SampleLot.fields.disposition_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / sample_lot_qc_and_disposition_dimensions_advance_independently
          rationale: "The named instance walks both SampleLot dimensions independently and asserts the combined (qc_status, disposition_status) pair at each step."

      - name: lot_release_guarded_by_formula_state
        claim_type: guarded transitions
        grounds:
          - state_machines.SampleLot.HELD_to_RELEASED
          - validations[priority=42]
          - errors.ERR_FORMULA_NOT_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_release_requires_its_formula_to_still_be_approved
          rationale: "That instance holds the lot fixed and flips only the formula out of APPROVED, which is exactly the cross-entity guard claim."

      - name: shipment_cancellation_compensates_the_mass_ledger
        claim_type: compensation
        grounds:
          - state_machines.SampleShipment.PACKET_ASSEMBLED_to_CANCELLED
          - calculations.sample_mass_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / lot_gram_mass_conserved_across_shipment_cancel_and_retention_withdraw
          rationale: "That instance replays allocate-then-compensate on one lot and asserts batch_size_g == available_g + allocated_g after every step with no drift."

      - name: retention_withdrawal_syncs_cabinet_slots
        claim_type: ledger sync
        grounds:
          - state_machines.RetentionSample.STORED_to_WITHDRAWN
          - calculations.retention_slot_occupancy
        excluded_because:
          difficulty_instance: compensating_invariant / cabinet_slot_count_conserved_across_two_withdrawals
          rationale: "That instance asserts RetentionCabinet.slots_available before and after each withdrawal against capacity_slots, which is the ledger-sync claim."

      - name: application_test_failure_conditional_cascade
        claim_type: conditional cascade
        grounds:
          - state_machines.ApplicationTest.IN_PROGRESS_to_FAILED
          - state_machines.Formula.APPROVED_to_REWORK_REQUIRED
          - state_machines.CommercializationForecast.ACTIVE_to_AT_RISK
        excluded_because:
          difficulty_instance: transitive_cascade / failed_application_test_three_link_forecast_cascade
          rationale: "That instance follows the FAILED verdict through formula rework, lot re-hold and forecast AT_RISK, and asserts the cascade stops at children in the qualifying states."

  - section: calculations
    instances:

      - name: claim_profile_excludes_a_certificate_that_expired_before_the_clock
        claim_type: input_set_filtering
        grounds:
          - calculations.formula_claim_profile
          - entities.RawMaterial.fields.verified_claim_types
          - entities.SubstantiationRecord.fields.is_expired
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Two identical single-material formulas costed on either side of the certificate's valid_until diverge: the one costed at 2026-08-01 gets kosher_eligible true, the one costed at 2028-01-01 gets kosher_eligible false, while the record itself stays status VERIFIED with is_expired true."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; material GUM-BASE at 2000 cents/kg with one KOSHER certificate valid_until 2027-06-30, status VERIFIED."
            - "Brief BRF-0001 accepted with kosher_required true."
            - "Formulas F1 and F2 each hold GUM-BASE at 100.0000 %; F1 is costed while the certificate is still current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /substantiation-records"
              payload: { raw_material_id: "${m1}", claim_type: "KOSHER", issuing_body: "OU Kosher", document_ref: "K-11", valid_until: "2027-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { r1: "$.data.id" }
            - call: "POST /substantiation-records/${r1}/verify"
              payload: {}
              as: RegulatoryAffairs
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD", kosher_required: true }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { f1_kosher: "$.data.kosher_eligible" }
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F2" }
              as: Flavorist
              captures: { f2: "$.data.id" }
            - call: "POST /formulas/${f2}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-01T00:00:00Z" }
              as: RegulatoryAffairs
          trigger:
            - call: "POST /formulas/${f2}/cost"
              payload: {}
              as: Flavorist
          assert:
            - "f1_kosher == true"
            - "HTTP status == 200"
            - "Formula.${f2}.kosher_eligible == false"
            - "Formula.${f2}.bench_cost_per_kg_cents == 2000"
            - "Formula.${f2}.status == COSTED"
            - "SubstantiationRecord.${r1}.status == VERIFIED"
            - "SubstantiationRecord.${r1}.is_expired == true"
            - "RawMaterial.${m1}.verified_claim_types == []"
            - "RawMaterial.${m1}.claim_status == CLEAR"

      - name: forecast_uses_the_clarification_stage_probability_constant
        claim_type: constants_applied
        grounds:
          - calculations.forecast_value
          - entities.CommercializationForecast.fields.stage_probability
          - entities.CommercializationForecast.fields.technical_factor
        distinguishing_aspect: "A forecast published while the brief sits in CLARIFICATION_REQUESTED applies STAGE_PROB_CLARIFICATION 0.10 and TECH_FACTOR_EARLY 0.55, so 500 kg at 10000 cents/kg yields weighted_annual_value_cents 275000 — not the 550000 the SUBMITTED stage would give."
        test_recipe:
          setup:
            - "Brief BRF-0001 submitted and then sent back once, so status == CLARIFICATION_REQUESTED; no formula of the brief is APPROVED and no application test has PASSED."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/clarification-request"
              payload: { clarification_note: "restate the top note" }
              as: TechnicalDirector
              captures: { b1_ver: "$.data.version" }
          trigger:
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 500, unit_price_cents_per_kg: 10000, expected_brief_version: "${b1_ver}" }
              as: AccountManager
              captures: { fc1: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "CommercializationForecast.${fc1}.variant_applied == RISK_WEIGHTED"
            - "CommercializationForecast.${fc1}.stage_probability == 0.10"
            - "CommercializationForecast.${fc1}.technical_factor == 0.55"
            - "CommercializationForecast.${fc1}.weighted_annual_value_cents == 275000"
            - "CommercializationForecast.${fc1}.pinned_brief_version == ${b1_ver}"
            - "CommercializationForecast.${fc1}.status == ACTIVE"

