          rationale: "Switching from the PRELIM ceiling proxy to the POST_SCREEN per-item maximum on the same request, and the resulting divergence, is exactly the named §1.8 instance."

      - name: appraisal_threshold_boundary_at_min_appraisal_score_for_permanent
        claim_type: correct_result
        grounds:
          - calculations.appraisal_score
          - calculations.appraisal_score.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / appraisal_permanent_threshold_inclusive_at_and_one_cent_below
          rationale: "The inclusive >= comparison at the threshold and the one-cent-below near miss are the named §1.8 instance's whole subject."

      - name: access_service_fee_tier_boundaries_and_rounding_order
        claim_type: precision
        grounds:
          - calculations.access_service_fee
          - calculations.access_service_fee.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / access_service_fee_per_line_rounding_order_pinned
          rationale: "Per-line rounding before summation, and the one-cent difference from the rejected aggregate order, are asserted by the named §1.8 instance."

      - name: migration_job_cost_waterfall_step_order
        claim_type: correct_result
        grounds:
          - calculations.migration_job_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / migration_job_cost_six_step_order_pinned
          rationale: "The six-step pinned order, including the temptation to re-key the discount on the net total, is the named §1.8 instance."

      - name: exhibit_loan_interval_merge_half_open_plus_buffer
        claim_type: correct_result
        grounds:
          - calculations.exhibit_loan_window_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exhibit_loan_half_open_window_plus_light_recovery_buffer_on_item
          rationale: "Touching endpoints, the 45-day buffer and the strict-inequality escape are all asserted by the named §1.8 instance."

      - name: zone_migration_capacity_closed_interval_aggregate_peak
        claim_type: correct_result
        grounds:
          - calculations.zone_migration_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / zone_migration_closed_interval_aggregate_capacity_ceiling
          rationale: "Aggregate peak counting at the ceiling and one job beyond it is the named §1.8 instance."

      - name: preservation_budget_aggregation_after_commit_and_release
        claim_type: input_set_filtering
        grounds:
          - calculations.preservation_budget_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / preservation_budget_committed_restored_exactly_by_job_cancellation
          rationale: "The status-partitioned sums before, during and after cancellation are asserted with zero drift by the named §1.8 instance."

      - name: unit_custody_aggregation_across_loan_lifecycle
        claim_type: input_set_filtering
        grounds:
          - calculations.unit_custody_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / unit_custody_triple_restored_exactly_by_exhibit_loan_return
          rationale: "The four-field identity across check-out and return is the named §1.8 instance's conserved quantity."

      - name: interview_release_state_constraint_propagation_chain
        claim_type: correct_result
        grounds:
          - calculations.interview_release_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / oral_history_two_independent_state_axes_advance_separately
          rationale: "Propagation of both axes into release_state at every intermediate combination is asserted step by step by the named §1.8 instance."

      - name: retention_expiry_threshold_inclusive_at_the_expiry_instant
        claim_type: constants_applied
        grounds:
          - calculations.retention_expiry
          - calculations.retention_expiry.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / retention_expiry_instant_inclusive_to_the_millisecond
          rationale: "The inclusive >= comparison at the exact expiry millisecond, and the one-millisecond-earlier rejection, are the named §1.8 instance."

  # ==========================================================================
  # §1.9 Section 4 — Validations (Table 4)
  # ==========================================================================
  - section: validations
    instances:

      - name: validations_process_with_unit_count_mismatch_returns_unit_count_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_UNIT_COUNT_MISMATCH]
          - entities.Accession.fields.processed_unit_count
        distinguishing_aspect: "An accession declaring 4 units but holding a single 3-unit item passes provenance verification and then fails processing with ERR_UNIT_COUNT_MISMATCH (422); the accession stays PROVENANCE_VERIFIED and the item stays UNPROCESSED."
        test_recipe:
          setup:
            - "PROVENANCE_VERIFIED accession with declared_unit_count 4 and one 3-unit item."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "VAL-01", retention_years: 10, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.1", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Facilities Files", business_unit: "Facilities", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 14, earliest_record_year: 1990, latest_record_year: 2012 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-VAL01", temperature_c: 16.0, relative_humidity_pct: 44.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Facilities Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 4 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "FAC-1990-2012", unit_count: 3, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Held by facilities since creation.", transfer_instrument_reference: "IT-2026-402" }
              as: Archivist
              as_user_id: "archivist-a"
          trigger:
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err} == ERR_UNIT_COUNT_MISMATCH"
            - "Accession.${acc_id}.status == PROVENANCE_VERIFIED"
            - "Accession.${acc_id}.processed_unit_count == 3"
            - "Accession.${acc_id}.declared_unit_count == 4"
            - "ArchivalItem.${item_id}.status == UNPROCESSED"

      - name: validations_process_from_received_returns_provenance_not_documented_ahead_of_state_guard
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_PROVENANCE_NOT_DOCUMENTED]
        distinguishing_aspect: "Processing a RECEIVED accession violates both the priority-19 provenance check and the priority-20 state guard; the response must be ERR_PROVENANCE_NOT_DOCUMENTED (422) and NOT ERR_ACCESSION_STATE_INVALID (409), because 19 is evaluated first."
        test_recipe:
          setup:
            - "RECEIVED accession whose declared_unit_count already matches its single item, so only the provenance and state checks can fail."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "VAL-02", retention_years: 11, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.2", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Fleet Maintenance Files", business_unit: "Logistics", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 16, earliest_record_year: 1991, latest_record_year: 2010 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-VAL02", temperature_c: 16.0, relative_humidity_pct: 44.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Fleet Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 2 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "FLEET-1991-2010", unit_count: 2, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err} == ERR_PROVENANCE_NOT_DOCUMENTED"
            - "Accession.${acc_id}.status == RECEIVED"
            - "Accession.${acc_id}.provenance_documented == false"
            - "ArchivalItem.${item_id}.status == UNPROCESSED"

      - name: validations_access_request_with_empty_item_array_returns_no_items_requested
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - validations[priority=5]
          - errors[ERR_NO_ITEMS_REQUESTED]
        distinguishing_aspect: "An empty requested_item_ids array is shape-legal (the §1.1 constraint admits 0..50 elements) so it passes the priority-5 check and is rejected as a business violation with ERR_NO_ITEMS_REQUESTED (422), not ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "An ACTIVE requester and an ACTIVE series; no request created yet."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "VAL-03", retention_years: 12, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.3", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Union Agreements", business_unit: "Human Resources", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 7, earliest_record_year: 1974, latest_record_year: 2001 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /requesters"
              payload: { display_name: "P. Achterberg", requester_class: "EXTERNAL_RESEARCHER", affiliation: "Institute of Labour Studies", nda_on_file: false }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /access-requests"
              payload: { requester_id: "${req_id}", record_series_id: "${series_id}", purpose: "Nothing specific yet.", requested_item_ids: [] }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err} == ERR_NO_ITEMS_REQUESTED"
            - "GET /access-requests?record_series_id=${series_id} returns total_count 0"

      - name: validations_access_request_with_item_from_another_series_returns_item_not_in_series
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_ITEM_NOT_IN_SERIES]
        distinguishing_aspect: "The requested item exists and resolves (so the priority-12 existence check passes), but its accession belongs to series B while the request names series A — the failure is ERR_ITEM_NOT_IN_SERIES (422), not a NOT_FOUND."
        test_recipe:
          setup:
            - "Two series A and B, each with an accession; the only item lives under series B."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "VAL-04", retention_years: 13, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.4", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
