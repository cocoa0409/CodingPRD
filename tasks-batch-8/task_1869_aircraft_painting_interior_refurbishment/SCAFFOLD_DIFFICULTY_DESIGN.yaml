            - "p_status == IN_WORK (revert) and p_rework == 1"
            - "auto_src == INSPECTION_AUTO, auto_safety == true, auto_st == OPEN (major_defects 2 >= threshold 2)"
            - "re-entry to IN_INSPECTION is blocked until the auto item is COMPLETED (ERR_DISCOVERY_ITEMS_OPEN if attempted now)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approval_depth3_cascade
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.DelayEvent.transitions
          - entities.RefurbProgram.fields.committed_delivery_date
        distinguishing_aspect: |
          Depth-3 chain, trigger = ChangeOrder approval: (link 1) program
          total_contract_value_cents +600,000 and committed_delivery_date +3d;
          (link 2, caused by the date mutation) system DelayEvent created
          CONFIRMED/CUSTOMER_CAUSED/3d; (link 3, caused by the event
          confirmation) the program's DRAFT FINAL invoice regenerates its
          remainder line from 6,172,837 to 6,772,837.
        test_recipe:
          setup:
            - "Program QUOTED with a DRAFT FINAL invoice (total 6,172,837 = remainder only); SUBMITTED change order +600,000 / +3 days"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/invoices", payload: { program_id: "${prog_id}", kind: "FINAL" }, as: FinanceClerk, captures: { inv_id: $.data.id, inv_tot0: $.data.total_cents } }
            - { call: "POST /completion/change-orders", payload: { program_id: "${prog_id}", delta_price_cents: 600000, delta_days: 3, description: "Add galley refurbishment" }, as: ProgramManager, captures: { co_id: $.data.id } }
            - { call: "POST /completion/change-orders/${co_id}/submit", payload: {}, as: ProgramManager }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
          trigger:
            - { call: "POST /completion/change-orders/${co_id}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { tcv: $.data.total_contract_value_cents, cdd: $.data.committed_delivery_date } }
            - { call: "GET /completion/delay-events?program_id=${prog_id}", as: ProgramManager, captures: { ev_src: "$.data[0].source", ev_st: "$.data[0].status", ev_days: "$.data[0].impact_days", ev_cat: "$.data[0].category" } }
            - { call: "GET /completion/invoices/${inv_id}", as: FinanceClerk, captures: { inv_tot1: $.data.total_cents } }
          assert:
            - "inv_tot0 == 6172837 (remainder only, no bookings/discovery/penalty yet)"
            - "link 1: tcv == 12945673 and cdd == 2026-09-04"
            - "link 2: exactly one DelayEvent with ev_src == CHANGE_ORDER, ev_st == CONFIRMED, ev_cat == CUSTOMER_CAUSED, ev_days == 3 (never passed through REPORTED)"
            - "link 3: inv_tot1 == 6772837 — DRAFT invoice regenerated from the new contract value (12945673 - 1234567 - 4938269)"

      - name: discovery_approval_depth2_cascade
        grounds:
          - state_machines.DiscoveryItem.ESTIMATED_to_APPROVED
          - entities.RefurbProgram.fields.discovery_cost_total_cents
          - entities.Invoice.fields.lines
        distinguishing_aspect: |
          Depth-2 chain, different trigger = DiscoveryItem approval: (link 1)
          program.discovery_cost_total_cents += est_cost_cents (250,000);
          (link 2, caused by the total mutation) the DRAFT FINAL invoice
          regenerates, gaining a 250,000 discovery line and a 25,000 handling
          line (total 6,172,837 -> 6,447,837).
        test_recipe:
          setup:
            - "Program INDUCTED; DRAFT FINAL invoice exists (total 6,172,837); discovery item ESTIMATED at 250,000 / 40h"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/invoices", payload: { program_id: "${prog_id}", kind: "FINAL" }, as: FinanceClerk, captures: { inv_id: $.data.id, inv_tot0: $.data.total_cents } }
            - { call: "POST /completion/discovery-items", payload: { program_id: "${prog_id}", description: "Rivet line corrosion repair" }, as: ShopTechnician, captures: { di_id: $.data.id } }
            - { call: "POST /completion/discovery-items/${di_id}/estimate", payload: { est_cost_cents: 250000, est_hours: 40 }, as: ProgramManager }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
          trigger:
            - { call: "POST /completion/discovery-items/${di_id}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { dtot: $.data.discovery_cost_total_cents } }
            - { call: "GET /completion/invoices/${inv_id}", as: FinanceClerk, captures: { inv_tot1: $.data.total_cents } }
          assert:
            - "link 1: dtot == 250000 (est_cost_cents debited at approval)"
            - "link 2: inv_tot1 == 6447837 (6172837 + 250000 + round(250000 x 0.10)=25000 handling) — regenerated without any direct invoice call"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: advance_state_vs_fiscal_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=26]
        distinguishing_aspect: |
          Error-category pair state (P7) vs business_fiscal (P26): advancing a
          QUOTED program directly to IN_WORK violates the phase machine AND the
          customer is on CREDIT_HOLD — the state error must win.
        test_recipe:
          setup: ["Program QUOTED; customer placed on CREDIT_HOLD after program creation"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/customers/${cust_id}/credit-status", payload: { credit_status: "CREDIT_HOLD" }, as: CenterAdmin }
          trigger:
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "IN_WORK" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (state, P7) — not ERR_CREDIT_HOLD (fiscal, P26)"
            - "program remains QUOTED"

      - name: defer_safety_vs_temporal_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=19]
        distinguishing_aspect: |
          Error-category pair business_safety (P12) vs business_temporal (P19):
          deferring a safety_linked item when the clock (2026-09-02) is already
          past committed_delivery_date (2026-09-01) violates both — the safety
          error must win.
        test_recipe:
          setup: ["Program INDUCTED; safety_linked discovery item ESTIMATED; clock moved past committed delivery date"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/discovery-items", payload: { program_id: "${prog_id}", description: "HEAVY corrosion doubler repair", safety_linked: true }, as: ShopTechnician, captures: { di_id: $.data.id } }
            - { call: "POST /completion/discovery-items/${di_id}/estimate", payload: { est_cost_cents: 600000, est_hours: 80 }, as: ProgramManager }
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CenterAdmin }
          trigger:
            - { call: "POST /completion/discovery-items/${di_id}/defer", payload: { defer_reason: "awaiting customer decision" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SAFETY_DEFERRAL_FORBIDDEN (safety, P12) — not ERR_DELIVERY_WINDOW_PASSED (temporal, P19)"
            - "item remains ESTIMATED"

      - name: slot_temporal_vs_fiscal_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=26]
        distinguishing_aspect: |
          Error-category pair business_temporal (P16) vs business_fiscal (P26) —
          a third, distinct pair from the other two instances: booking a slot
          whose start_at predates the logical clock while the customer is on
          CREDIT_HOLD must return the temporal error.
        test_recipe:
          setup: ["Program QUOTED; customer on CREDIT_HOLD; bay ACTIVE; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/customers/${cust_id}/credit-status", payload: { credit_status: "CREDIT_HOLD" }, as: CenterAdmin }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
          trigger:
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-07-10T00:00:00Z" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SLOT_IN_PAST (temporal, P16) — not ERR_CREDIT_HOLD (fiscal, P26)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: weight_delta_exact_limit_allowed
        grounds:
          - validations[priority=22]
          - calculations.weight_delta
        distinguishing_aspect: |
          Metric = weight delta in lbs; endpoint = WBR sign-off. The gate is
          strict > on the ROUNDED value: installed 119.4 gives raw 50.024 ->
          stored 50.0 which equals max_delta_lbs 50.0 and is ALLOWED, while
          installed 119.5 gives 50.124 -> 50.1 > 50.0 and is REJECTED.
        test_recipe:
          setup: ["Program QUOTED with APPROVED scheme (2400/2/0.10, STRIP default -> FINAL film 30.624)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 119.4 }, as: ShopTechnician, as_user_id: "tech-1", captures: { wbr1: $.data.id, d1: $.data.delta_lbs } }
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 119.5 }, as: ShopTechnician, as_user_id: "tech-1", captures: { wbr2: $.data.id, d2: $.data.delta_lbs } }
          trigger:
            - { call: "POST /completion/weight-balance-records/${wbr1}/sign-off", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { st1: $.data.status } }
            - { call: "POST /completion/weight-balance-records/${wbr2}/sign-off", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { err: $.data.error_id } }
          assert:
            - "d1 == 50.0 (raw 50.024 rounds to exactly the limit) and st1 == SIGNED_OFF (>= gate admits equality)"
            - "d2 == 50.1 and err == ERR_WEIGHT_DELTA_EXCEEDED (one tenth over the rounded limit)"

      - name: booth_buffer_exact_gap_allowed
        grounds:
          - validations[priority=18]
          - entities.PaintBooth.fields.cure_buffer_hours
        distinguishing_aspect: |
          Metric = time gap in hours; endpoint = POST /booth-bookings. Gap
          exactly == cure_buffer_hours (6h) is ALLOWED (>= semantics), while
          5h is REJECTED — the boundary sits on the inclusive side.
        test_recipe:
          setup: ["Program QUOTED; booth with cure_buffer_hours 6; booking A occupies 2026-08-10T08:00->16:00"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/paint-booths", payload: { name: "BOOTH-1", hourly_rate_cents: 25000, cure_buffer_hours: 6 }, as: CenterAdmin, captures: { booth_id: $.data.id } }
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProgramManager, captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-10T23:00:00Z" }, as: ProgramManager, captures: { bk_b: $.data.id } }
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-11T04:00:00Z", end_at: "2026-08-11T05:00:00Z" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "booking B (start exactly 6h after A.end) succeeds — gap == buffer allowed"
            - "booking C (start 5h after B.end 23:00) -> err == ERR_BOOTH_BUFFER_VIOLATION"

      - name: retest_count_third_fail_quarantines
        grounds:
          - calculations.burn_certification_derivation
          - entities.SoftGoodLot.fields.fail_count
        distinguishing_aspect: |
          Metric = integer FAIL count; endpoint = POST burn-tests. fail_count
          reaching exactly MAX_RETESTS (3) transitions to CERT_QUARANTINED
          (>= semantics): at 2 the lot is still CERT_FAILED and may retest.
        test_recipe:
          setup: ["Program QUOTED; one lot with two FAILs already recorded (fail_count 2, CERT_FAILED)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/soft-good-lots", payload: { program_id: "${prog_id}", description: "Carpet roll", material: "Wool blend", quantity: 4, estimated_weight_lbs: 60.0 }, as: ShopTechnician, captures: { lot_id: $.data.id } }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "HORIZONTAL_25", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "HORIZONTAL_25", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "GET /completion/soft-good-lots/${lot_id}", as: ShopTechnician, captures: { st_pre: $.data.status, fc_pre: $.data.fail_count } }
          trigger:
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "HORIZONTAL_25", result: "FAIL", lab_name: "AeroBurn Labs" }, as: ShopTechnician }
            - { call: "GET /completion/soft-good-lots/${lot_id}", as: ShopTechnician, captures: { st_post: $.data.status, fc_post: $.data.fail_count } }
          assert:
            - "st_pre == CERT_FAILED and fc_pre == 2 (one FAIL below the cap still allows retest)"
            - "st_post == CERT_QUARANTINED and fc_post == 3 (exactly-at-cap triggers quarantine, >= not >)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: in_work_requires_approved_scheme
        grounds:
          - state_machines.RefurbProgram.SURFACE_REVIEW_to_IN_WORK
          - validations[priority=25]
        distinguishing_aspect: |
          Entity pair RefurbProgram x PaintScheme: the program's advance to
          IN_WORK is gated on a DIFFERENT entity (a PaintScheme of the program
          in APPROVED status). Fails with ERR_SCHEME_NOT_APPROVED while only
          SUBMITTED; succeeds after approval.
        test_recipe:
          setup: ["Program in SURFACE_REVIEW: assessment DECIDED (STRIP/NONE), booth booking present, scheme only SUBMITTED"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
