      - name: state_vs_business_safety_on_batch_release
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=29]
        distinguishing_aspect: |
          Conflict between state (priority 6, ERR_INVALID_STATE) and business_safety
          (priority 29, ERR_BATCH_TESTS_FAILED). When a batch is in TESTING state
          (not POSITIVE_RELEASE_HOLD) AND also has failing nutrient results, the
          state error wins because priority 6 < priority 29.
        test_recipe:
          setup:
            - "A ProductionBatch in TESTING status exists (submitted for testing but results not yet submitted)."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
