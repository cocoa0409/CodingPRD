          - state_machines.Appointment.DRAFT_to_WITHDRAWN
        distinguishing_aspect: "Three identically priced appointments sit on one award, but only the OFFER_ISSUED one is a held appointment: the DRAFT row was never issued and the WITHDRAWN row was issued and then withdrawn. The ledger must read 81220.00, not 243660.00 and not 162440.00, and the DRAFT row's own encumbrance_usd must still be the declared default 0.00 - so an implementation that sums all rows, or that computes the encumbrance at create time, is caught."
