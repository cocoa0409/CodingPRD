              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "TO1-1", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
