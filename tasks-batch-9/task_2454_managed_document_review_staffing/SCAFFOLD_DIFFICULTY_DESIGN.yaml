              captures: { ra_id: $.data.id }
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - &k_rev_b
              call: "POST /reviewers"
              payload:
