          - "reserve_after_accrual == 1100000 (max(0, 2500000*60/100 - 400000))"
          - "reserve_after_reopen == 1500000 (reopened variant skips accrued subtraction: 2500000*60/100)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
- rule_id: non_linear_state_machine
  instances:
    - name: settlement_request_negotiation_cycle_resets_approvals
      grounds:
        - state_machines.SettlementRequest.UNDER_REVIEW_to_COUNTERED
        - state_machines.SettlementRequest.COUNTERED_to_UNDER_REVIEW
        - calculations.settlement_authority_routing
      distinguishing_aspect: |
        SettlementRequest is cyclic: UNDER_REVIEW -> COUNTERED -> UNDER_REVIEW loops, and the
        counter transition clears approved_by_user_ids so a first dual-approval granted before
        the counter does not survive — branch-asymmetric side effects on a negotiation cycle,
        distinct from any linear pipeline.
      test_recipe:
        setup:
          - "an ACTIVE matter (exposure TIER_2) with APPROVED budget, ACTIVE engagement"
          - "an active SettlementAuthorityPolicy for TIER_2 naming GeneralCounsel with max_single_amount_cents=10000000, dual over 10000000 (so proposed 12000000 requires dual approval by GeneralCounsel then a higher rank — ChiefFinancialOfficer)"
          - "a SettlementRequest for 12000000 submitted and under review with the first (GC) approval recorded"
          - "logical clock at default"
        setup_api_calls:
          - call: "POST /litigation/staff-users"
            payload: { full_name: "Casey Counsel", email: "casey@corp.example", job_family: "LEGAL" }
            as: LegalOperationsAnalyst
            captures: { counsel_id: $.data.id }
          - call: "POST /litigation/staff-users"
