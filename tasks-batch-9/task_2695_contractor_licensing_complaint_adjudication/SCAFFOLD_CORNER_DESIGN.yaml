            - call: "POST /licensing/citations"
              payload: { investigation_id: "${inv3_id}", classification_id: "${c20_id}", violation_code: "B-7028", correction_due_date: "2026-09-15" }
              as: Investigator
              as_user_id: "inv-10"
          trigger:
            - call: "GET /licensing/citations?classification_id=${c10_id}&limit=1&offset=0"
              payload: {}
              as: LicensingAnalyst
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response http status == 200"
            - "response total_count == 2"
            - "response has_more == true"
