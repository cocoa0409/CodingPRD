scaffold_corner_design:
  - section: entities
    instances:
      - name: create_account_applies_defaults_and_clock_default
        claim_type: defaults
        grounds: [entities.ShareholderAccount.fields.tin_status, entities.ShareholderAccount.fields.account_status, entities.ShareholderAccount.fields.address_verified]
        distinguishing_aspect: "Minimal create applies documented defaults (tin_status MISSING, residency US, treaty_tier STANDARD, account_status ACTIVE, address_verified true, version 1) and the logical clock's startup default stamps created_at exactly 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty DB; logical clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Upsilon Corp", cusip: "000000020", ticker: "UPSI", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
          trigger:
            - call: "POST /accounts"
              payload: { holder_name: "Default Dana", address_line1: "28 Date St", city: "Tulsa", state_code: "OK", postal_code: "74101", country_code: "US", tax_id: "181-81-8181" }
              as: AgentAdmin
              captures: { acct: $.data.id }
          assert:
            - "ShareholderAccount.${acct}.tin_status == MISSING (default applied)"
            - "ShareholderAccount.${acct}.residency == US and treaty_tier == STANDARD"
            - "ShareholderAccount.${acct}.account_status == ACTIVE and address_verified == true"
            - "ShareholderAccount.${acct}.version == 1"
            - "ShareholderAccount.${acct}.created_at == \"2026-08-01T00:00:00Z\" (fixed clock default, not wall clock)"
            - "ShareholderAccount.${acct}.last_qualifying_contact_date == created_at"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ShareholderAccount.fields.tax_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field tax_id is rejected with ERR_INVALID_REQUEST 400; no account row is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { holder_name: "No Tin", address_line1: "1 Nowhere", city: "Tulsa", state_code: "OK", postal_code: "74101", country_code: "US" }
              as: AgentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /accounts returns total_count == 0 is not required; the failed call itself carries the error envelope"

      - name: get_account_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Reading a well-formed but non-existent account id yields ERR_ACCOUNT_NOT_FOUND 404, not a generic 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AgentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_FOUND with HTTP 404"

      - name: create_issuer_duplicate_cusip_rejected
        claim_type: type_constraints
        grounds: [entities.Issuer.fields.cusip, "errors[ERR_DUPLICATE_CUSIP]"]
        distinguishing_aspect: "The cusip uniqueness constraint rejects a second issuer with the same cusip even when every other field differs."
        test_recipe:
          setup: ["one issuer with cusip 000000021 already onboarded"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Phi One", cusip: "000000021", ticker: "PHI1", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
          trigger:
            - call: "POST /issuers"
              payload: { name: "Phi Two", cusip: "000000021", ticker: "PHI2", shares_outstanding: 200, par_value_cents: 2, current_market_price_cents: 6000 }
              as: AgentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CUSIP with HTTP 409"

      - name: duplicate_position_same_account_issuer_rejected
        claim_type: type_constraints
        grounds: [entities.Position.fields.account_id, "errors[ERR_DUPLICATE_POSITION]"]
        distinguishing_aspect: "At most one Position per (account, issuer); the second seed attempt fails even with a different share count."
        test_recipe:
          setup: ["issuer and account exist; one position of 100 shares already seeded"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Chi Corp", cusip: "000000022", ticker: "CHIC", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Dup Dan", address_line1: "2 Duo St", city: "Tulsa", state_code: "OK", postal_code: "74102", country_code: "US", tax_id: "191-91-9191" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
          trigger:
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 50 }
              as: AgentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_POSITION with HTTP 409"

      - name: position_total_shares_computed_after_withdrawal
        claim_type: computed_fields
        grounds: [entities.Position.fields.total_shares, entities.Position.fields.certificated_shares]
        distinguishing_aspect: "total_shares is computed (book + certificated), not stored from input: after a 20-share withdrawal the position still reports total_shares == 120."
        test_recipe:
          setup: ["issuer outstanding 120; account with 120 book-entry shares"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Psi Inc", cusip: "000000023", ticker: "PSII", shares_outstanding: 120, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Comp Carla", address_line1: "3 Sum St", city: "Tulsa", state_code: "OK", postal_code: "74103", country_code: "US", tax_id: "202-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 120 }
              as: AgentAdmin
              captures: { pos: $.data.id }
          trigger:
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 20 }
              as: TransferExaminer
            - call: "GET /positions?account_id=${acct}"
              as: TransferExaminer
          assert:
            - "Position.${pos}.book_entry_shares == 100 and certificated_shares == 20"
            - "Position.${pos}.total_shares == 120 (computed sum, unchanged by form conversion)"
            - "Position.${pos}.version == 2 (withdrawal bumped it)"

      - name: audit_event_immutable_genesis_chain
        claim_type: immutability
        grounds: [entities.AuditEvent.fields.prev_entry_hash, entities.AuditEvent.fields.entry_hash]
        distinguishing_aspect: "AuditEvent is append-only (common_fields: false — no updated_at, no version); the first event in an empty DB anchors the tamper-evident chain with prev_entry_hash == GENESIS."
        test_recipe:
          setup: ["empty DB; the issuer create below is the first mutation"]
          setup_api_calls: []
          trigger:
            - call: "POST /issuers"
              payload: { name: "Omega Chain", cusip: "000000024", ticker: "OMGA", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "GET /audit-events?entity_type=Issuer&entity_id=${iss}"
              as: ComplianceOfficer
          assert:
            - "exactly one AuditEvent exists for the issuer with action issuer.create"
            - "AuditEvent.prev_entry_hash == \"GENESIS\" and entry_hash is a non-empty hex digest"
            - "AuditEvent entries carry no version or updated_at fields (immutable log)"
            - "AuditEvent.actor_role == \"AgentAdmin\""

  - section: state_machines
    instances:
      - name: settled_transfer_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransferRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SETTLED is terminal: a cancel attempt on a settled transfer fails with ERR_INVALID_STATE 409 and no side effects fire."
        test_recipe:
          setup: ["issuer outstanding 100 price 5000; accounts A (100 book) and B; transfer of 40 medallion-verified, approved, settled"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Alpha Settle", cusip: "000000025", ticker: "ALST", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Settled Sam", address_line1: "4 Final St", city: "Tulsa", state_code: "OK", postal_code: "74104", country_code: "US", tax_id: "212-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_a: $.data.id, a_v: $.data.version }
            - call: "POST /accounts"
              payload: { holder_name: "Settled Sue", address_line1: "5 Final St", city: "Tulsa", state_code: "OK", postal_code: "74105", country_code: "US", tax_id: "222-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_a}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 40, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t: $.data.id }
            - call: "POST /transfer-requests/${t}/submit-medallion"
              payload: { medallion_reference: "MED-T", coverage_cents: 200000 }
              as: TransferExaminer
              as_user_id: "exam_1"
            - call: "POST /transfer-requests/${t}/approve"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_1"
            - call: "POST /transfer-requests/${t}/settle"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_1"
          trigger:
            - call: "POST /transfer-requests/${t}/cancel"
              payload: {}
              as: Shareholder
              as_user_id: "${acct_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "TransferRequest.${t}.status remains SETTLED"
            - "transferee Position.book_entry_shares remains 40 (no compensation fired)"

      - name: certificate_recover_restores_issued_withdraws_claim
        claim_type: valid_transition
        grounds: [state_machines.Certificate.LOST_REPORTED_to_ISSUED, state_machines.LostCertificateClaim.FILED_to_WITHDRAWN]
        distinguishing_aspect: "Recovering a lost certificate closes the stop-transfer occupancy and cascades the open claim to WITHDRAWN — the certificate returns to ISSUED (cyclic machine), the claim to a terminal state."
        test_recipe:
          setup: ["issuer outstanding 100; account with 100 book; certificate of 30 withdrawn and reported lost (claim FILED)"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Beta Recover", cusip: "000000026", ticker: "BREC", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Recover Rita", address_line1: "6 Found St", city: "Tulsa", state_code: "OK", postal_code: "74106", country_code: "US", tax_id: "232-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
              captures: { pos: $.data.id }
            - call: "POST /positions/${pos}/certificate-withdrawals"
              payload: { share_quantity: 30 }
              as: TransferExaminer
              captures: { cert: $.data.id }
            - call: "POST /certificates/${cert}/report-lost"
              payload: { loss_date: "2026-08-10T00:00:00Z" }
              as: TransferExaminer
              as_user_id: "exam_1"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /certificates/${cert}/recover"
              payload: {}
              as: TransferExaminer
            - call: "GET /lost-certificate-claims?certificate_id=${cert}"
              as: TransferExaminer
          assert:
            - "Certificate.${cert}.status == ISSUED and lost_reported_at is null (occupancy closed)"
            - "LostCertificateClaim.${claim}.status == WITHDRAWN (cascade from recovery)"
            - "Position.certificated_shares remains 30 throughout (recovery changes form, not count)"

      - name: returned_payment_reissue_refreshes_disbursed_at
        claim_type: side_effect_execution
        grounds: [state_machines.DividendPayment.RETURNED_to_DISBURSED, entities.DividendPayment.fields.disbursed_at]
        distinguishing_aspect: "The DISBURSED -> RETURNED -> DISBURSED cycle restarts the stale-dating clock: reissue refreshes disbursed_at to the reissue instant, so a payment returned and reissued does not stale-date on the original disbursement schedule."
        test_recipe:
          setup:
            - "issuer outstanding 100; CERTIFIED account with 100 shares; declaration 500 millicents, record 2026-08-02, payable 2026-08-03"
            - "payment DISBURSED at 2026-08-03, marked RETURNED at 2026-08-10, address fixed by PATCH at 2026-08-12"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Gamma Reissue", cusip: "000000027", ticker: "GREI", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Reissue Ray", address_line1: "7 Mail St", city: "Tulsa", state_code: "OK", postal_code: "74107", country_code: "US", tax_id: "242-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-08-02T00:00:00Z", payable_date: "2026-08-03T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
              captures: { pay: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /dividend-payments/${pay}/mark-returned"
              payload: {}
              as: ServiceAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AgentAdmin
            - call: "PATCH /accounts/${acct}"
              payload: { address_line1: "7 Mail St Apt 2" }
              as: AgentAdmin
          trigger:
            - call: "POST /dividend-payments/${pay}/reissue"
              payload: {}
              as: ServiceAgent
            - call: "GET /dividend-payments/${pay}"
              as: ServiceAgent
          assert:
            - "DividendPayment.${pay}.status == DISBURSED (cycle RETURNED -> DISBURSED traversed)"
            - "DividendPayment.${pay}.disbursed_at == \"2026-08-12T00:00:00Z\" (stale clock restarted at reissue, not the original 2026-08-03)"
            - "ShareholderAccount.${acct}.address_verified == true (PATCH side effect that unblocked reissue)"

      - name: inquiry_followup_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.ShareholderInquiry.ANSWERED_to_IN_REVIEW, state_machines.ShareholderInquiry.IN_REVIEW_to_ANSWERED]
        distinguishing_aspect: "The inquiry machine loops: claim is legal from both OPEN and ANSWERED, so a follow-up reclaims an answered inquiry; claimed_by_agent_id tracks the latest claimant."
        test_recipe:
          setup: ["account exists; inquiry created, claimed by agent_1, answered"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Inquiry Ivy", address_line1: "8 Query St", city: "Tulsa", state_code: "OK", postal_code: "74108", country_code: "US", tax_id: "252-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /inquiries"
              payload: { account_id: "${acct}", channel: "EMAIL", subject: "where is my dividend" }
              as: Shareholder
              as_user_id: "${acct}"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/claim"
              payload: {}
              as: ServiceAgent
              as_user_id: "agent_1"
            - call: "POST /inquiries/${inq}/answer"
              payload: { answer_text: "mailed 2026-08-03" }
              as: ServiceAgent
              as_user_id: "agent_1"
          trigger:
            - call: "POST /inquiries/${inq}/claim"
              payload: {}
              as: ServiceAgent
              as_user_id: "agent_2"
            - call: "GET /inquiries/${inq}"
              as: ServiceAgent
          assert:
            - "ShareholderInquiry.${inq}.status == IN_REVIEW (ANSWERED -> IN_REVIEW follow-up cycle)"
            - "ShareholderInquiry.${inq}.claimed_by_agent_id == \"agent_2\""
            - "ShareholderInquiry.${inq}.version == 4 (create, claim, answer, re-claim)"

      - name: legend_deficient_resubmit_cycle_reaches_legend_removed
        claim_type: side_effect_execution
        grounds: [state_machines.LegendRemovalRequest.DEFICIENT_to_OPINION_UNDER_REVIEW, state_machines.LegendRemovalRequest.OPINION_UNDER_REVIEW_to_LEGEND_REMOVED]
        distinguishing_aspect: "Legend removal loops SUBMITTED -> OPINION_UNDER_REVIEW -> DEFICIENT -> OPINION_UNDER_REVIEW before approval; approval at the default clock passes the 180-day holding period for a 2024 acquisition and decrements restricted_shares 100 -> 60."
        test_recipe:
          setup: ["issuer outstanding 100; account with 100 book shares, 100 restricted; legend request for 40 shares acquired 2024-01-01"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Delta Legend", cusip: "000000028", ticker: "DLEG", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Legend Larry", address_line1: "9 Rule144 St", city: "Tulsa", state_code: "OK", postal_code: "74109", country_code: "US", tax_id: "262-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100, restricted_shares: 100 }
              as: AgentAdmin
              captures: { pos: $.data.id, p_v: $.data.version }
            - call: "POST /legend-removal-requests"
              payload: { position_id: "${pos}", account_id: "${acct}", share_quantity: 40, rule_basis: "RULE_144", acquisition_date: "2024-01-01T00:00:00Z", expected_position_version: "${p_v}" }
              as: Shareholder
              as_user_id: "${acct}"
              captures: { req: $.data.id }
            - call: "POST /legend-removal-requests/${req}/submit-opinion"
              payload: { counsel_opinion_reference: "OP-1" }
              as: Shareholder
              as_user_id: "${acct}"
            - call: "POST /legend-removal-requests/${req}/flag-deficient"
              payload: { deficiency_reason: "opinion letter unsigned" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /legend-removal-requests/${req}/submit-opinion"
              payload: { counsel_opinion_reference: "OP-2" }
              as: Shareholder
              as_user_id: "${acct}"
            - call: "POST /legend-removal-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /positions?account_id=${acct}"
              as: ComplianceOfficer
          assert:
            - "LegendRemovalRequest.${req}.status == LEGEND_REMOVED after the DEFICIENT -> OPINION_UNDER_REVIEW resubmission cycle"
            - "Position.${pos}.restricted_shares == 60 (100 - 40)"
            - "Position.${pos}.pending_legend_removal_count == 0"
            - "Position.${pos}.book_entry_shares == 100 (legend removal frees restriction, not shares)"

      - name: voided_declaration_never_accrues
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DividendDeclaration.DECLARED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOIDED is terminal and excluded from clock-driven accrual: advancing the clock past record_date generates zero payments and the declaration never leaves VOIDED."
        test_recipe:
          setup: ["issuer outstanding 100; account with 100 shares; declaration record 2026-09-01 voided before the record date"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Epsilon Void", cusip: "000000029", ticker: "EVOI", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Void Vera", address_line1: "10 Null St", city: "Tulsa", state_code: "OK", postal_code: "74110", country_code: "US", tax_id: "272-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-09-01T00:00:00Z", payable_date: "2026-09-15T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /dividend-declarations/${decl}/void"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${iss}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-declarations/${decl}"
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
          assert:
            - "DividendDeclaration.${decl}.status == VOIDED (unchanged by clock evaluation past both record and payable dates)"
            - "GET /dividend-payments?declaration_id=${decl} returns total_count == 0"

      - name: escheated_account_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ShareholderAccount, state_machines.EscheatmentCase.REPORTED_to_REMITTED, "errors[ERR_ACCOUNT_ESCHEATED]"]
        distinguishing_aspect: "Remit is the end of the line: the account lands in ESCHEATED (terminal), its position is CLOSED and zeroed, the stale payment is ESCHEATED, and any subsequent account mutation is rejected."
        test_recipe:
          setup:
            - "TX account created at default clock holding 10 shares of a 6000-cent issuer; dividend disbursed 2026-08-03 and stale-dated"
            - "sweep at 2029-08-01: account DORMANT, case IDENTIFIED; notice sent; 60 days elapsed; case REPORTED"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Zeta Remit", cusip: "000000030", ticker: "ZREM", shares_outstanding: 10, par_value_cents: 1, current_market_price_cents: 6000 }
