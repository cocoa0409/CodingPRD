              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.0900, density_max_g_per_cm3: 0.1100, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q1_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p2_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q2_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q2_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-P1", total_pallet_count: 4 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_p1_id: $.data.id }
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p2_id}", lot_code: "L-P2", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_p2_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-001", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /sterilization/cycles/${cyc_id}/load-positions"
              payload: { lot_id: "${lot_p1_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${cyc_v0}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos_a_id: $.data.id, cyc_v1: $.data.cycle_version_after }
            - call: "POST /sterilization/cycles/${cyc_id}/load-positions"
              payload: { lot_id: "${lot_p2_id}", position_index: 2, zone: "INTERIOR", pallet_count: 1, expected_cycle_version: "${cyc_v1}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos_b_id: $.data.id, cyc_v2: $.data.cycle_version_after }
          trigger:
            - call: "DELETE /sterilization/cycles/${cyc_id}/load-positions/${pos_b_id}"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "DELETE /sterilization/cycles/${cyc_id}/load-positions/${pos_a_id}"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
          assert:
            - "before either delete: Cycle.${cyc_id}.loaded_pallet_count == 3 and load_density_g_per_cm3 == 0.1031"
            - "after the first delete: Cycle.${cyc_id}.loaded_pallet_count == 2 and load_density_g_per_cm3 == 0.1"
            - "after the first delete: Lot.${lot_p2_id}.staged_pallet_count == 0, available_pallet_count == 2, status == RECEIVED"
            - "after the first delete: Lot.${lot_p1_id}.staged_pallet_count == 2, available_pallet_count == 2, status == STAGED"
            - "after the second delete: Cycle.${cyc_id}.loaded_pallet_count == 0 and load_density_g_per_cm3 == 0.0"
            - "after the second delete: Cycle.${cyc_id}.status == PLANNED"
            - "after the second delete: Lot.${lot_p1_id}.staged_pallet_count == 0, available_pallet_count == 4, status == RECEIVED"
            - "Lot.${lot_p1_id}.staged_pallet_count + Lot.${lot_p1_id}.available_pallet_count == 4 at every observation point"
            - "GET /sterilization/load-positions?cycle_id=${cyc_id} returns total_count == 0"
