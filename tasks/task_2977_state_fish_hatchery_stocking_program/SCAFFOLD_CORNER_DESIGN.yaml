# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2977_state_fish_hatchery_stocking_program
#
# The nine `section:` values and their `claim_type:` rows come from
# references/claim-extraction-guide.md, walked against SCAFFOLD.yaml §1.1–§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
#
# YAML anchors named c_<step> build the same reachable production chain the
# §1.8 file uses (anchors are file-scoped, so they are re-declared here). The
# chain is declared incrementally: c_clock_0801 and c_hatch in the first
# instance, the waters in the third, the full egg-to-truck chain in
# stocking_event_mark_type_defaults_to_none_and_marked_count_to_zero.
#
# Every literal below was computed against §1.3's formulas and constants.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: hatchery_creation_returns_the_full_computed_field_set
        claim_type: creation
        grounds:
          - endpoints.POST /hatcheries
          - entities.Hatchery.fields.water_available_af
          - entities.Hatchery.fields.budget_available_cents
          - entities.Hatchery.fields.operating_posture
        distinguishing_aspect: |
          A create with all nine declared inputs must return 201 with every
          computed counter seeded from the declared defaults — water_available_af
          equal to the full water right, budget_available_cents equal to the full
          appropriation, posture OPEN and version 1 — not merely the echoed input.
        test_recipe:
          setup:
            - "An empty database with the logical clock parked at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - &c_clock_0801
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &c_hatch
              call: "POST /hatcheries"
              payload:
                name: "Silver Creek Hatchery"
                station_code: "SLVC"
                water_source_type: "SPRING"
                annual_water_right_af: 120.0
                rearing_capacity_lbs: 2000.0
                oxygen_supply_lpm: 6.0
                effluent_permit_number: "CO-0044821"
                tss_permit_limit_mg_l: 20.0
                annual_budget_cents: 50000000
              as: ProgramAdmin
              captures: { hatch_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object and a data envelope carrying id, created_at, updated_at and version == 1"
            - "Hatchery.${hatch_id}.station_code == SLVC and water_source_type == SPRING"
            - "Hatchery.${hatch_id}.water_reserved_af == 0.0000, water_used_af == 0.0000, water_available_af == 120.0000"
            - "Hatchery.${hatch_id}.biomass_on_hand_lbs == 0.00, density_index == 0.0000, exceedance_count_rolling == 0"
            - "Hatchery.${hatch_id}.budget_committed_cents == 0, budget_spent_cents == 0, budget_available_cents == 50000000"
            - "Hatchery.${hatch_id}.operating_posture == OPEN"

      - name: hatchery_retrieval_returns_the_stored_row_to_its_own_manager
        claim_type: retrieval
        grounds:
          - endpoints.GET /hatcheries/{id}
          - roles.HatcheryManager.identity
        distinguishing_aspect: |
          GET /hatcheries/{id} must return the persisted row byte-for-byte to the
          manager whose X-User-ID equals that hatchery's id — the identity binding
          declared for the entity_backed role, not an opaque operator token.
        test_recipe:
          setup:
            - "Hatchery SLVC exists with the values it was created with"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "GET /hatcheries/${hatch_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200 with data.id == ${hatch_id}"
            - "data.name == Silver Creek Hatchery, data.rearing_capacity_lbs == 2000.0, data.oxygen_supply_lpm == 6.0"
            - "data.tss_permit_limit_mg_l == 20.0 and data.effluent_permit_number == CO-0044821"
            - "data.version == 1 and data.created_at == data.updated_at"

      - name: waters_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /waters
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three waters exist; a limit of 2 must return exactly 2 rows with
          total_count 3 and has_more true, and the follow-up page at offset 2 must
          return the last row with has_more false. total_count counts the whole
          filtered set, never the page.
        test_recipe:
          setup:
            - "Three waters exist: Blue Mesa (RAINBOW_TROUT, PUBLIC_BOAT), Taylor Park (RAINBOW_TROUT, SHORE_ONLY) and Spinney Mountain (WALLEYE, REMOTE)"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - &c_water_a
              call: "POST /waters"
              payload:
                name: "Blue Mesa Reservoir"
                county: "Gunnison"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 80
                angler_demand_index: 90
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 2000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              captures: { water_a_id: $.data.id }
            - &c_water_b
              call: "POST /waters"
              payload:
                name: "Taylor Park Reservoir"
                county: "Gunnison"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 70
                angler_demand_index: 60
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 4000
                access_type: "SHORE_ONLY"
              as: ProgramAdmin
              captures: { water_b_id: $.data.id }
            - &c_water_c
              call: "POST /waters"
              payload:
                name: "Spinney Mountain Reservoir"
                county: "Park"
                water_class: "WARMWATER_LAKE"
                habitat_suitability_score: 60
                angler_demand_index: 100
                plan_species: "WALLEYE"
                plan_target_count: 1000
                access_type: "REMOTE"
              as: ProgramAdmin
              captures: { water_c_id: $.data.id }
          trigger:
            - call: "GET /waters?limit=2&offset=0"
              payload: {}
              as: RegionalBiologist
              as_user_id: "bio-carla"
          assert:
            - "HTTP 200 with response_type array, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "exactly 2 rows are returned"
            - "GET /waters?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /waters?plan_species=WALLEYE returns total_count == 1 and that row's id == ${water_c_id}"
            - "GET /waters?county=Gunnison returns total_count == 2"

      - name: hatchery_id_that_does_not_exist_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /hatcheries/{id}
          - errors.ERR_HATCHERY_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid UUID that names no row must return the collection's
          own 404 (ERR_HATCHERY_NOT_FOUND), not a generic ERR_INVALID_REQUEST and
          not an empty 200 envelope.
        test_recipe:
          setup:
            - "Hatchery SLVC exists; the queried id belongs to no row"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "GET /hatcheries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_HATCHERY_NOT_FOUND"
            - "response_type == error and data carries only error_id and message"
            - "GET /hatcheries/${hatch_id} still returns 200 — the miss did not disturb the existing row"

      - name: water_creation_missing_plan_target_count_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST /waters
          - entities.Water.fields.plan_target_count
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          plan_target_count is declared `source: input` with no default, so omitting
          it must be refused at request-shape priority 6 with ERR_INVALID_REQUEST —
          the water must not be created with a null or zero target that would later
          divide by zero in water_plan_shortfall.
        test_recipe:
          setup:
            - "The clock is set and no water exists yet"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /waters"
              payload:
                name: "Antero Reservoir"
                county: "Park"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 55
                angler_demand_index: 40
                plan_species: "RAINBOW_TROUT"
                access_type: "SHORE_ONLY"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /waters returns total_count == 0 — nothing was persisted"

      - name: allocation_plan_mode_defaults_to_priority_waterfall
        claim_type: defaults
        grounds:
          - entities.AllocationPlan.fields.allocation_mode
          - endpoints.POST /allocation-plans
        distinguishing_aspect: |
          allocation_mode is the only optional input on the plan and its declared
          default is PRIORITY_WATERFALL; omitting it must persist that value
          explicitly, because the selector branches on it and a null mode would
          make calculations.allocation_grant undefined.
        test_recipe:
          setup:
            - "Hatchery SLVC exists"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "YEARLING"
                available_count: 5000
                public_request_cap_pct: 0.20
              as: ProgramAdmin
              captures: { plan_d_id: $.data.id }
          assert:
            - "HTTP 201 with AllocationPlan.${plan_d_id}.allocation_mode == PRIORITY_WATERFALL"
            - "AllocationPlan.${plan_d_id}.status == DRAFT and version == 1"
            - "AllocationPlan.${plan_d_id}.allocated_total_count == 0, unmet_demand_count == 0, run_count == 0, public_allocated_count == 0"

      - name: spawn_event_projection_fields_are_computed_and_client_values_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.egg_take_projection
          - entities.SpawnEvent.fields.planned_eggs
          - entities.SpawnEvent.fields.cumulative_survival
          - entities.SpawnEvent.fields.water_reserved_af
          - endpoints.POST /spawn-events
        distinguishing_aspect: |
          planned_eggs, cumulative_survival, required_eggs_for_target,
          projected_release_count and water_reserved_af are all `source: computed`
          and are absent from the endpoint's `input:`. Supplying them in the body
          must change nothing: the server derives 60000 / 0.6840 / 21930 / 41040 /
          3.0000 from the brood group's fecundity and the station's stored density.
        test_recipe:
          setup:
            - "Hatchery SLVC is OPEN at density_index 0.0000"
            - "Brood group BS-1 (400 females, fecundity 3000, window 2026-08-01..2026-10-31) is SPAWNING"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - &c_brood
              call: "POST /brood-stocks"
              payload:
                hatchery_id: "${hatch_id}"
                species: "RAINBOW_TROUT"
                strain: "Hofer"
                female_count: 400
                male_count: 200
                expected_fecundity_per_female: 3000
                spawning_window_start: "2026-08-01T00:00:00Z"
                spawning_window_end: "2026-10-31T00:00:00Z"
                egg_take_target: 120000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { brood_id: $.data.id }
            - &c_open
              call: "POST /brood-stocks/${brood_id}/open-spawning-window"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          trigger:
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
                planned_eggs: 999999
                water_reserved_af: 0.0
                cumulative_survival: 1.0
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { spawn_x_id: $.data.id }
          assert:
            - "HTTP 201: SpawnEvent.${spawn_x_id}.planned_eggs == 60000, NOT 999999"
            - "SpawnEvent.${spawn_x_id}.cumulative_survival == 0.6840, NOT 1.0"
            - "SpawnEvent.${spawn_x_id}.required_eggs_for_target == 21930 and projected_release_count == 41040"
            - "SpawnEvent.${spawn_x_id}.water_reserved_af == 3.0000, NOT 0.0"
            - "SpawnEvent.${spawn_x_id}.eggs_taken == null, taken_at == null, status == PLANNED"
            - "Hatchery.${hatch_id}.water_reserved_af == 3.0000 and water_available_af == 117.0000"
            - "BroodStock.${brood_id}.females_reserved == 20 and females_available == 380"

      - name: rearing_lot_system_fields_are_assigned_by_the_record_take
        claim_type: system_fields
        grounds:
          - entities.RearingLot.fields.hatchery_id
          - entities.RearingLot.fields.initial_count
          - entities.RearingLot.fields.initial_biomass_lbs
          - state_machines.SpawnEvent.PLANNED_to_TAKEN
        distinguishing_aspect: |
          A RearingLot has no create endpoint at all: every one of its identity
          fields is `source: system`, written by record-take. The lot must appear
          with hatchery_id and spawn_event_id back-filled from the spawn chain and
          initial_biomass_lbs frozen at 4.41 for 20000 eggs at EGG_WEIGHT_G.
        test_recipe:
          setup:
            - "Brood group BS-1 is SPAWNING and spawn event S1 is PLANNED for 20 females"
            - "The clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - &c_spawn1
              call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { spawn1_id: $.data.id }
            - &c_clock_0810
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &c_take1
              call: "POST /spawn-events/${spawn1_id}/record-take"
              payload: { eggs_taken: 20000, taken_at: "2026-08-10T00:00:00Z" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: SpawnEvent.${spawn1_id}.status == TAKEN with eggs_taken == 20000"
            - "GET /rearing-lots?spawn_event_id=${spawn1_id} returns total_count == 1"
            - "that lot's hatchery_id == ${hatch_id}, spawn_event_id == ${spawn1_id}, species == RAINBOW_TROUT"
            - "that lot's initial_count == 20000, count_on_hand == 20000, reserved_count == 0, avg_weight_g == 0.1"
            - "that lot's initial_biomass_lbs == 4.41, biomass_lbs == 4.41, rearing_stage == EGG, health_status == UNSCREENED, version == 1"
            - "Hatchery.${hatch_id}.water_reserved_af == 0.0000, water_used_af == 1.0000, water_available_af == 119.0000"
            - "Hatchery.${hatch_id}.biomass_on_hand_lbs == 4.41 and density_index == 0.0022"
            - "BroodStock.${brood_id}.females_reserved == 0, females_spent == 20, cumulative_eggs_taken == 20000, status == SPAWNING"

      - name: stocking_event_mark_type_defaults_to_none_and_marked_count_to_zero
        claim_type: defaults
        grounds:
          - entities.StockingEvent.fields.mark_type
          - entities.StockingEvent.fields.marked_count
          - calculations.transport_cost
          - endpoints.POST /stocking-events
        distinguishing_aspect: |
          Omitting mark_type and marked_count must persist NONE and 0 rather than
          null, and effective_marked_count must stay null because no marks were
          applied — an unmarked release can never yield a cohort contribution index.
        test_recipe:
          setup:
            - "The full base chain: lot at 16000 YEARLING fish, avg_weight_g 45.3592, CERTIFIED to 2026-09-24T00:00:00Z"
            - "Request R1 for 2400 YEARLING RAINBOW_TROUT on Blue Mesa is ALLOCATED 2400 by plan P1"
            - "The clock stands at 2026-09-01T08:00:00Z and truck TRK-01 is AVAILABLE"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - &c_truck1
              call: "POST /transport-units"
              payload:
                hatchery_id: "${hatch_id}"
                unit_code: "TRK-01"
                tank_gallons: 500.0
                max_load_lbs: 300.0
                oxygen_lpm: 12.0
                certification_expires_at: "2027-01-01T00:00:00Z"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { truck1_id: $.data.id }
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - &c_lot
              call: "GET /rearing-lots?spawn_event_id=${spawn1_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { lot_id: "$.data[0].id" }
            - &c_feed1
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-10T00:00:00Z", feed_lbs: 300.0, avg_weight_g_after: 4.53592, mortality_count: 2000 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &c_adv_fry
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "FRY" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &c_adv_fing
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "FINGERLING" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &c_clock_0820
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
            - &c_feed2
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-20T00:00:00Z", feed_lbs: 1500.0, avg_weight_g_after: 45.3592, mortality_count: 2000 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &c_adv_year
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "YEARLING" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &c_clock_0825
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: ProgramAdmin
            - &c_insp1
              call: "POST /health-inspections"
              payload: { lot_id: "${lot_id}", inspection_type: "PRE_TRANSFER", sample_size: 60, sampled_at: "2026-08-25T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { insp1_id: $.data.id }
            - &c_res_neg
              call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "NEGATIVE" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - &c_certify
              call: "POST /health-inspections/${insp1_id}/certify"
              payload: {}
              as: FishHealthVeterinarian
              as_user_id: "vet-bruno"
            - &c_req1
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_a_id}"
                species: "RAINBOW_TROUT"
                requested_count: 2400
                size_class: "YEARLING"
                justification: "Opening-day put-and-take fishery on Blue Mesa"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { req1_id: $.data.id }
            - &c_plan1
              call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "YEARLING"
                available_count: 5000
                public_request_cap_pct: 0.20
                allocation_mode: "PRIORITY_WATERFALL"
              as: ProgramAdmin
              captures: { plan1_id: $.data.id, plan1_v0: $.data.version }
            - &c_attach1
              call: "POST /stocking-requests/${req1_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan1_id}", expected_plan_version: "${plan1_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
            - &c_plan_v1
              call: "GET /allocation-plans/${plan1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan1_v1: $.data.version }
            - &c_run1
              call: "POST /allocation-plans/${plan1_id}/run"
              payload: { expected_plan_version: "${plan1_v1}" }
              as: ProgramAdmin
            - &c_clock_0901
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - &c_lot_v
              call: "GET /rearing-lots/${lot_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { lot_v1: $.data.version }
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2400
                scheduled_depart_at: "2026-09-01T08:00:00Z"
                scheduled_return_at: "2026-09-01T14:00:00Z"
                expected_lot_version: "${lot_v1}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event_nomark_id: $.data.id }
          assert:
            - "HTTP 201: StockingEvent.${event_nomark_id}.mark_type == NONE and marked_count == 0"
            - "StockingEvent.${event_nomark_id}.effective_marked_count == null and contribution_index_cohort == null"
            - "StockingEvent.${event_nomark_id}.planned_load_lbs == 240.00 and transport_cost_cents == 81000"
            - "StockingEvent.${event_nomark_id}.status == SCHEDULED, max_fish_allowed == null, oxygen_flow_lpm == null, transport_mortality_count == 0"
            - "RearingLot.${lot_id}.reserved_count == 2400 and count_on_hand == 16000"
            - "Hatchery.${hatch_id}.budget_committed_cents == 81000 and budget_available_cents == 49919000"

      - name: water_class_outside_the_declared_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Water.fields.water_class
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          water_class declares exactly three members (COLDWATER_LAKE,
          COLDWATER_STREAM, WARMWATER_LAKE). A plausible-sounding fourth value must
          be refused rather than stored as free text, because the value feeds no
          calculation that could later reveal the corruption.
        test_recipe:
          setup:
            - "The clock is set and no water exists"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /waters"
              payload:
                name: "Eleven Mile Canyon Reservoir"
                county: "Park"
                water_class: "RESERVOIR"
                habitat_suitability_score: 65
                angler_demand_index: 70
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 3000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /waters returns total_count == 0"

      - name: habitat_suitability_score_above_one_hundred_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Water.fields.habitat_suitability_score
          - calculations.stocking_request_priority_score
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The declared range is 0..100 inclusive. 101 must be refused at priority 6,
          because W_HABITAT * 101 would let priority_score clamp at 100 and silently
          hide the bad datum; 100 itself must still be accepted.
        test_recipe:
          setup:
            - "The clock is set and no water exists"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /waters"
              payload:
                name: "Trappers Lake"
                county: "Garfield"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 101
                angler_demand_index: 50
                plan_species: "BROWN_TROUT"
                plan_target_count: 500
                access_type: "REMOTE"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the identical body with habitat_suitability_score 100 returns 201, proving the bound is inclusive"
            - "the identical body with angler_demand_index -1 also returns ERR_INVALID_REQUEST"

      - name: effluent_reading_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.EffluentReading.common_fields
          - calculations.effluent_compliance
          - endpoints.POST /effluent-readings
          - endpoints.GET /hatcheries/{id}/effluent-readings
        distinguishing_aspect: |
          EffluentReading is the one entity declared `common_fields: false`: the row
          is a permanent regulatory sample. It must come back with no version and no
          updated_at, §1.5 must expose no update or delete for it, and a sample
          exactly at the permit limit must classify COMPLIANT with margin 0.000.
        test_recipe:
          setup:
            - "Hatchery SLVC has tss_permit_limit_mg_l 20.0 and posture OPEN"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - &c_eff_compliant
              call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-08-01T06:00:00Z", tss_mg_l: 20.0, total_phosphorus_mg_l: 0.08, flow_af: 1.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { eff1_id: $.data.id }
          assert:
            - "HTTP 201 with data.id and data.created_at present but NO version and NO updated_at field"
            - "EffluentReading.${eff1_id}.status == COMPLIANT and exceedance_margin_mg_l == 0.000 (20.0 is not strictly greater than 20.0)"
            - "Hatchery.${hatch_id}.exceedance_count_rolling == 0 and operating_posture == OPEN"
            - "GET /hatcheries/${hatch_id}/effluent-readings returns total_count == 1 with that row"
            - "§1.5 declares no PUT, PATCH or DELETE for /effluent-readings — the sample cannot be amended"

      - name: spawn_event_with_unknown_brood_stock_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SpawnEvent.parent
          - endpoints.POST /spawn-events
          - errors.ERR_BROOD_STOCK_NOT_FOUND
          - validation_priority_ladder.5
        distinguishing_aspect: |
          brood_stock_id is the SpawnEvent's parent FK; a body FK that resolves to
          no row must fail at ladder priority 5 with the referenced collection's own
          404, BEFORE any request-shape, state or fiscal check — even though this
          body would also fail the brood-group state gate if the id existed.
        test_recipe:
          setup:
            - "Hatchery SLVC exists; no brood group has the id in the body"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "00000000-0000-0000-0000-000000000000"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_BROOD_STOCK_NOT_FOUND"
            - "NOT ERR_BROOD_STOCK_NOT_SPAWNING and NOT ERR_INVALID_REQUEST"
            - "Hatchery.${hatch_id}.water_reserved_af == 0.0000 — no acre-feet were reserved"

      - name: stocking_request_on_an_unknown_water_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.StockingRequest.parent
          - endpoints.POST /stocking-requests
          - errors.ERR_WATER_NOT_FOUND
        distinguishing_aspect: |
          A StockingRequest cannot be scored without its Water (habitat, demand and
          plan gap all come from it), so an unresolvable water_id must 404 rather
          than persist a request with a null priority_score.
        test_recipe:
          setup:
            - "Blue Mesa exists but the body names a different, non-existent water"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
          trigger:
            - call: "POST /stocking-requests"
              payload:
                water_id: "00000000-0000-0000-0000-000000000000"
                species: "RAINBOW_TROUT"
                requested_count: 500
                size_class: "YEARLING"
                justification: "Request against a water that does not exist"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_WATER_NOT_FOUND"
            - "GET /stocking-requests returns total_count == 0"

      - name: body_foreign_keys_are_resolved_in_declared_order_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validation_priority_ladder.5
          - endpoints.POST /stocking-events
          - errors.ERR_LOT_NOT_FOUND
          - errors.ERR_TRANSPORT_UNIT_NOT_FOUND
        distinguishing_aspect: |
          The flat topology means POST /stocking-events carries three independent
          FKs. With BOTH lot_id and transport_unit_id unresolvable, the ladder's
          left-to-right rule over the declared input order must report
          ERR_LOT_NOT_FOUND — lot_id precedes transport_unit_id in `input:`.
        test_recipe:
          setup:
            - "Request R1 exists and is ALLOCATED 2400 by plan P1; the lot and truck ids in the body name no rows"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_truck1
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "00000000-0000-0000-0000-000000000000"
                transport_unit_id: "11111111-1111-1111-1111-111111111111"
                fish_count: 2400
                scheduled_depart_at: "2026-09-01T08:00:00Z"
                scheduled_return_at: "2026-09-01T14:00:00Z"
                expected_lot_version: "${lot_v1}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_LOT_NOT_FOUND, NOT ERR_TRANSPORT_UNIT_NOT_FOUND"
            - "repeating the call with the real ${lot_id} and the bogus transport_unit_id returns ERR_TRANSPORT_UNIT_NOT_FOUND"
            - "RearingLot.${lot_id}.reserved_count == 0 and Hatchery.${hatch_id}.budget_committed_cents == 0 after both attempts"

  # ===========================================================================
  # SECTION 2 — state_machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: brood_stock_starts_in_ready_with_no_females_reserved
        claim_type: initial_state
        grounds:
          - state_machines.BroodStock.initial_state
          - entities.BroodStock.fields.females_available
        distinguishing_aspect: |
          A newly created brood group must be READY, not SPAWNING: eggs may not be
          taken until a manager opens the window, and females_available must equal
          female_count with nothing reserved or spent.
        test_recipe:
          setup:
            - "Hatchery SLVC exists and the clock stands at 2026-08-01T00:00:00Z, inside the window the group will declare"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - *c_brood
          assert:
            - "HTTP 201: BroodStock.${brood_id}.status == READY even though the clock is already inside the spawning window"
            - "BroodStock.${brood_id}.females_reserved == 0, females_spent == 0, females_available == 400"
            - "BroodStock.${brood_id}.cumulative_eggs_taken == 0 and version == 1"

      - name: open_spawning_window_moves_ready_to_spawning
        claim_type: valid_transition
        grounds:
          - state_machines.BroodStock.READY_to_SPAWNING
          - endpoints.POST /brood-stocks/{id}/open-spawning-window
        distinguishing_aspect: |
          The declared trigger, fired by the owning manager inside the window on an
          OPEN station, must move READY to SPAWNING and bump version — this is the
          single gate that makes SpawnEvent creation reachable at all.
        test_recipe:
          setup:
            - "Brood group BS-1 is READY and the clock stands at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
          trigger:
            - *c_open
          assert:
            - "HTTP 200: BroodStock.${brood_id}.status == SPAWNING and version == 2"
            - "BroodStock.${brood_id}.females_available == 400 — opening the window reserves nothing"
            - "Hatchery.${hatch_id}.operating_posture == OPEN"

      - name: open_spawning_window_before_the_window_starts_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BroodStock.READY_to_SPAWNING
          - validations.spawn-window-open
          - errors.ERR_SPAWN_WINDOW_CLOSED
        distinguishing_aspect: |
          The window precondition is spawning_window_start <= current_utc <
          spawning_window_end. With the clock at 2026-07-15 — sixteen days early —
          the transition must be refused with ERR_SPAWN_WINDOW_CLOSED and the group
          must stay READY, so the same call succeeds once the clock reaches 08-01.
        test_recipe:
          setup:
            - "The logical clock is parked at 2026-07-15T00:00:00Z"
            - "Brood group BS-1 declares a window of 2026-08-01T00:00:00Z .. 2026-10-31T00:00:00Z and is READY"
          setup_api_calls:
            - &c_clock_0715
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: ProgramAdmin
            - *c_hatch
            - *c_brood
          trigger:
            - *c_open
          assert:
            - "HTTP 409 with error_id ERR_SPAWN_WINDOW_CLOSED"
            - "BroodStock.${brood_id}.status == READY and version == 1"
            - "advancing the clock to exactly 2026-08-01T00:00:00Z and repeating the call returns 200 with status SPAWNING — the lower bound is inclusive"

      - name: record_take_closes_the_brood_group_when_the_egg_target_is_met
        claim_type: side_effect_execution
        grounds:
          - state_machines.BroodStock.SPAWNING_to_CLOSED
          - entities.BroodStock.fields.cumulative_eggs_taken
          - endpoints.POST /spawn-events/{id}/record-take
        distinguishing_aspect: |
          The SPAWNING to CLOSED edge is evaluated at the END of record-take, from
          cumulative_eggs_taken >= egg_take_target. A group whose target is exactly
          20000 must close on a 20000-egg take (the comparison is >=), while the
          take itself still succeeds and still produces its lot.
        test_recipe:
          setup:
            - "Hatchery SLVC is OPEN"
            - "Brood group BS-2 declares egg_take_target 20000 and is SPAWNING"
            - "Spawn event S2 is PLANNED for 20 females and the clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - &c_brood_small
              call: "POST /brood-stocks"
              payload:
                hatchery_id: "${hatch_id}"
                species: "RAINBOW_TROUT"
                strain: "Tasmanian"
                female_count: 400
                male_count: 200
                expected_fecundity_per_female: 3000
                spawning_window_start: "2026-08-01T00:00:00Z"
                spawning_window_end: "2026-10-31T00:00:00Z"
                egg_take_target: 20000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { brood_s_id: $.data.id }
            - call: "POST /brood-stocks/${brood_s_id}/open-spawning-window"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_s_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { spawn_s_id: $.data.id }
            - *c_clock_0810
          trigger:
            - call: "POST /spawn-events/${spawn_s_id}/record-take"
              payload: { eggs_taken: 20000, taken_at: "2026-08-10T00:00:00Z" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: SpawnEvent.${spawn_s_id}.status == TAKEN with eggs_taken == 20000"
            - "BroodStock.${brood_s_id}.cumulative_eggs_taken == 20000 and status == CLOSED"
            - "BroodStock.${brood_s_id}.females_spent == 20 and females_reserved == 0"
            - "GET /rearing-lots?spawn_event_id=${spawn_s_id} still returns total_count == 1 — closing the group does not withdraw the lot"

      - name: advance_stage_skipping_fingerling_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.RearingLot.stage_FRY_to_FINGERLING
          - validations.own-state-legal
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The stage dimension advances one step at a time. A lot sitting at FRY that
          already weighs 45.3592 g — comfortably past the YEARLING gate of 45.0 —
          must still be refused a jump to YEARLING with ERR_INVALID_STATE, not
          ERR_STAGE_WEIGHT_NOT_MET: the target stage, not the weight, is wrong.
        test_recipe:
          setup:
            - "A lot from a 20000-egg take has been fed twice (to 4.53592 g then to 45.3592 g) but advanced only once, so rearing_stage is FRY"
            - "count_on_hand is 16000 and the clock stands at 2026-08-20T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_clock_0820
            - *c_feed2
          trigger:
            - call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "YEARLING" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "NOT ERR_STAGE_WEIGHT_NOT_MET — the lot's avg_weight_g is 45.3592, above every gate"
            - "RearingLot.${lot_id}.rearing_stage == FRY"
            - "the same call with to_stage FINGERLING returns 200 and a following call with to_stage YEARLING then also returns 200"

      - name: cancel_on_a_taken_spawn_event_is_refused_from_a_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SpawnEvent.terminal_states
          - endpoints.POST /spawn-events/{id}/cancel
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          TAKEN is terminal. Cancelling after the take must be refused, because the
          reserved acre-feet have already been converted into water_used_af and a
          refund would double-count them against the water right.
        test_recipe:
          setup:
            - "Spawn event S1 has been taken for 20000 eggs, so the hatchery shows water_used_af 1.0000 and the lot exists"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
          trigger:
            - call: "POST /spawn-events/${spawn1_id}/cancel"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "SpawnEvent.${spawn1_id}.status == TAKEN"
            - "Hatchery.${hatch_id}.water_used_af == 1.0000, water_reserved_af == 0.0000, water_available_af == 119.0000"
            - "BroodStock.${brood_id}.females_spent == 20 and females_available == 380"

      - name: certify_twice_is_refused_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.HealthInspection.PASSED_to_CERTIFIED
          - state_machines.HealthInspection.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          CERTIFIED is terminal on the inspection. A repeated certify must fail with
          ERR_INVALID_STATE at priority 8 — ahead of the segregation-of-duties check
          at 11 — and must not re-stamp certified_at or extend the lot's certificate
          by another 30 days.
        test_recipe:
          setup:
            - "Inspection I1 was sampled by vet-anna, recorded NEGATIVE and certified by vet-bruno at 2026-08-25T00:00:00Z"
            - "The lot is CERTIFIED with certificate_expires_at 2026-09-24T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
          trigger:
            - call: "POST /health-inspections/${insp1_id}/certify"
              payload: {}
              as: FishHealthVeterinarian
              as_user_id: "vet-cara"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "HealthInspection.${insp1_id}.certified_by_user_id == vet-bruno and certified_at == 2026-08-25T00:00:00Z"
            - "HealthInspection.${insp1_id}.certificate_expires_at == 2026-09-24T00:00:00Z"
            - "RearingLot.${lot_id}.health_status == CERTIFIED and certificate_expires_at == 2026-09-24T00:00:00Z"

      - name: closing_a_water_moves_active_to_closed_and_is_not_repeatable
        claim_type: valid_transition
        grounds:
          - state_machines.Water.ACTIVE_to_CLOSED
          - endpoints.POST /waters/{id}/close
        distinguishing_aspect: |
          The only Water transition is ACTIVE to CLOSED, fired by the administrator.
          It must bump version and leave the water's counters untouched, and CLOSED
          being terminal means a second close is ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Blue Mesa is ACTIVE with allocated_count_ytd 0 and released_count_ytd 0"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
          trigger:
            - &c_close_water_a
              call: "POST /waters/${water_a_id}/close"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 200: Water.${water_a_id}.status == CLOSED and version == 2"
            - "Water.${water_a_id}.allocated_count_ytd == 0, released_count_ytd == 0, plan_shortfall_count == 2000, plan_fill_pct == 0.00"
            - "repeating the close returns 409 ERR_INVALID_STATE and version stays 2"

      - name: attach_to_plan_after_withdraw_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.StockingRequest.SUBMITTED_to_WITHDRAWN
          - state_machines.StockingRequest.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          WITHDRAWN is terminal, and only SUBMITTED or DEFERRED requests may attach.
          The refusal must be ERR_INVALID_STATE at priority 8 with the plan's version
          left alone — a withdrawn request must never enlarge a candidate set.
        test_recipe:
          setup:
            - "Request R1 was authored by bio-carla and then withdrawn by her, so it is WITHDRAWN"
            - "Plan P1 is DRAFT at version 1 with no attached requests"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
            - call: "POST /stocking-requests/${req1_id}/withdraw"
              payload: {}
              as: RegionalBiologist
              as_user_id: "bio-carla"
          trigger:
            - call: "POST /stocking-requests/${req1_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan1_id}", expected_plan_version: "${plan1_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "NOT ERR_STALE_PLAN_VERSION — the supplied version was current, so the OCC gate at priority 7 passed"
            - "StockingRequest.${req1_id}.status == WITHDRAWN and allocation_plan_id == null"
            - "AllocationPlan.${plan1_id}.version == ${plan1_v0} — the plan was not bumped"

      - name: transport_unit_goes_out_of_service_when_its_certification_lapses
        claim_type: side_effect_execution
        grounds:
          - state_machines.TransportUnit.AVAILABLE_to_OUT_OF_SERVICE
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: |
          This is a clock-driven system transition with an inclusive boundary:
          current_utc >= certification_expires_at. At 2026-12-31T23:59:59Z the unit
          is still AVAILABLE; at exactly 2027-01-01T00:00:00Z it must flip to
          OUT_OF_SERVICE without anyone calling a fleet endpoint.
        test_recipe:
          setup:
            - "Truck TRK-01 is AVAILABLE with certification_expires_at 2027-01-01T00:00:00Z"
            - "The clock has been advanced to 2026-12-31T23:59:59Z, one second short of expiry"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_truck1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T23:59:59Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
          assert:
            - "before the trigger, TransportUnit.${truck1_id}.status == AVAILABLE"
            - "after the trigger, TransportUnit.${truck1_id}.status == OUT_OF_SERVICE and current_event_id == null"
            - "GET /transport-units?status=AVAILABLE returns total_count == 0"

      - name: lot_certificate_lapses_to_unscreened_when_the_clock_passes_expiry
        claim_type: side_effect_execution
        grounds:
          - state_machines.RearingLot.health_CERTIFIED_to_health_UNSCREENED
          - entities.RearingLot.fields.certificate_expires_at
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: |
          The lapse is strict (current_utc > certificate_expires_at) and it must
          RETAIN certificate_expires_at on the lot while flipping health_status to
          UNSCREENED; the HealthInspection row stays CERTIFIED as the historical
          record. At exactly the expiry instant nothing changes.
        test_recipe:
          setup:
            - "The lot is CERTIFIED with certificate_expires_at 2026-09-24T00:00:00Z from inspection I1"
            - "The clock has been advanced to exactly 2026-09-24T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - &c_clock_0924
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:01Z" }
              as: ProgramAdmin
          assert:
            - "at 2026-09-24T00:00:00Z the lot was still CERTIFIED — the comparison is strictly greater"
            - "after the trigger, RearingLot.${lot_id}.health_status == UNSCREENED"
            - "RearingLot.${lot_id}.certificate_expires_at == 2026-09-24T00:00:00Z — the lapsed instant is retained, not nulled"
            - "HealthInspection.${insp1_id}.status == CERTIFIED and certified_by_user_id == vet-bruno"

      - name: parallel_stage_and_health_dimensions_move_independently
        claim_type: parallel_state_dimensions
        grounds:
          - state_machines.RearingLot.initial_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / rearing_lot_stage_and_health_dimensions_move_independently
          rationale: "The named §1.8 instance drives both RearingLot dimensions through the full cross-product and asserts that a stage advance leaves health_status untouched and vice versa."

      - name: reportable_finding_cascades_down_to_the_stocking_event
        claim_type: cascade_down
        grounds:
          - state_machines.RearingLot.health_to_QUARANTINED
        excluded_because:
          difficulty_instance: transitive_cascade / reportable_pathogen_unwinds_the_whole_trip
          rationale: "The named §1.8 instance walks the four-link cascade from FAILED_REPORTABLE through QUARANTINED, ABORTED and DEFERRED end to end."

      - name: abort_compensates_every_reservation_the_event_made
        claim_type: compensation
        grounds:
          - state_machines.StockingEvent.SCHEDULED_to_ABORTED
        excluded_because:
          difficulty_instance: compensating_invariant / event_abort_restores_fish_budget_and_grant_identities
          rationale: "The named §1.8 instance asserts all three conservation identities before and after the abort, including the no-double-restoration replay."

      - name: release_is_guarded_by_the_destination_waters_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.StockingEvent.IN_TRANSIT_to_RELEASED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / release_requires_the_destination_water_active
          rationale: "The named §1.8 instance closes the water underneath an IN_TRANSIT trip and asserts ERR_WATER_CLOSED with the trip left recoverable."

  # ===========================================================================
  # SECTION 3 — calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: lot_biomass_and_fcr_round_half_up_to_the_declared_places
        claim_type: precision
        grounds:
          - calculations.lot_biomass
          - calculations.feed_conversion_ratio
        distinguishing_aspect: |
          Every literal in this recipe is chosen so the arithmetic does NOT land on
          a clean value: 20000 fish at 3.99 g is 175.92573... lbs, which must be
          reported as 175.93 (half-up at 2 dp), and the FCR denominator 171.52 gives
          0.583 at 3 dp. With mortality_count 0 the two FCR variants must coincide
          exactly, which is the only condition under which they may.
        test_recipe:
          setup:
            - "A lot of 20000 eggs exists at avg_weight_g 0.1 with initial_biomass_lbs 4.41 and the clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - &c_feed_399
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-10T12:00:00Z", feed_lbs: 100.0, avg_weight_g_after: 3.99, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 201: RearingLot.${lot_id}.biomass_lbs == 175.93 — round(20000 * 3.99 / 453.592, 2), NOT the truncation 175.92"
            - "RearingLot.${lot_id}.count_on_hand == 20000 and cumulative_mortality_count == 0 and cumulative_mortality_biomass_lbs == 0.00"
            - "RearingLot.${lot_id}.cumulative_feed_lbs == 100.0"
            - "RearingLot.${lot_id}.fcr_biological == 0.583 — round(100 / (175.93 - 4.41), 3)"
            - "RearingLot.${lot_id}.fcr_economic == 0.583 — identical to the biological variant precisely because no pounds died"
            - "RearingLot.${lot_id}.growth_rate_g_per_day == null — the span from the lot's creation is 0 whole days"

      - name: density_index_is_recomputed_from_station_biomass_to_four_decimals
        claim_type: correct_result
        grounds:
          - calculations.hatchery_density_index
          - calculations.hatchery_operating_posture
        distinguishing_aspect: |
          The station index is an aggregation over its own non-terminal lots divided
          by permitted capacity, at 4 dp. 175.93 / 2000.0 is 0.087965, which must be
          reported as 0.0880 — a 2-dp implementation would say 0.09 and a truncating
          one 0.0879. The posture must stay OPEN because 0.0880 < 0.9.
        test_recipe:
          setup:
            - "Station SLVC has rearing_capacity_lbs 2000.0 and exactly one lot, at 175.93 lbs"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - *c_feed_399
          assert:
            - "Hatchery.${hatch_id}.biomass_on_hand_lbs == 175.93"
            - "Hatchery.${hatch_id}.density_index == 0.0880 — round(175.93 / 2000.0, 4)"
            - "Hatchery.${hatch_id}.operating_posture == OPEN"
            - "feeding the same lot again to avg_weight_g_after 45.3592 with mortality_count 4000 gives biomass 1600.00 and density_index exactly 0.8000, still OPEN"

      - name: allocation_run_ignores_requests_that_were_never_attached
        claim_type: input_set_filtering
        grounds:
          - calculations.allocation_grant.input_set_filter
          - endpoints.POST /allocation-plans/{id}/run
        distinguishing_aspect: |
          The candidate set is exactly the QUEUED requests attached to THIS plan. A
          second request that is species-, size- and fiscal-year-compatible but was
          never attached must be left completely untouched — still SUBMITTED, still
          unlinked, still allocated_count 0 — and must not consume any of the pool.
        test_recipe:
          setup:
            - "Plan P1 has available_count 5000 in PRIORITY_WATERFALL mode"
            - "Request R1 (2400 YEARLING RAINBOW_TROUT on Blue Mesa) is attached and QUEUED"
            - "Request R2 (1000 YEARLING RAINBOW_TROUT on Taylor Park) was never attached and is SUBMITTED"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_water_b
            - *c_req1
            - &c_req2_taylor
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_b_id}"
                species: "RAINBOW_TROUT"
                requested_count: 1000
                size_class: "YEARLING"
                justification: "Taylor Park yearling supplement"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { req2_id: $.data.id }
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
          trigger:
            - *c_run1
          assert:
            - "HTTP 200: AllocationPlan.${plan1_id}.allocated_total_count == 2400 — only R1 was in the candidate set"
            - "AllocationPlan.${plan1_id}.unmet_demand_count == 0 and run_count == 1 and public_allocated_count == 0"
            - "StockingRequest.${req1_id}.status == ALLOCATED with allocated_count == 2400"
            - "StockingRequest.${req2_id}.status == SUBMITTED, allocation_plan_id == null, allocated_count == 0"
            - "Water.${water_b_id}.allocated_count_ytd == 0 — the unattached request moved nothing"

      - name: priority_score_is_frozen_at_creation_and_the_plan_gap_clamps_at_zero
        claim_type: weighted_scoring_rescore
        grounds:
          - calculations.stocking_request_priority_score
          - calculations.water_plan_shortfall
        distinguishing_aspect: |
          The score is computed once, at creation, from the water's counters AS THEY
          STAND. After Blue Mesa is allocated 2400 against a 2000-fish plan target
          the gap term must clamp to 0.00 (not go negative), so a second identical
          request scores 0.45*80 + 0.35*90 + 0.2*0.00 + 10 = 77.50 while the first
          request keeps its original 97.50 — the earlier row is never re-scored.
        test_recipe:
          setup:
            - "Blue Mesa has plan_target_count 2000, habitat 80, demand 90, plan_species RAINBOW_TROUT, access PUBLIC_BOAT"
            - "Request R1 was created while the water was empty and scored 97.50, then allocated 2400 fish"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
          trigger:
            - call: "POST /stocking-requests"
              payload:
                water_id: "${water_a_id}"
                species: "RAINBOW_TROUT"
                requested_count: 600
                size_class: "YEARLING"
                justification: "Second pass on Blue Mesa after the first grant"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { req3_id: $.data.id }
          assert:
            - "HTTP 201: StockingRequest.${req3_id}.priority_score == 77.50 — the plan-gap term is 0.00 because 2000 - 0 - 2400 clamps to 0"
            - "NOT a negative gap contribution: a score of 65.50 would mean the max(0, ...) clamp is missing"
            - "StockingRequest.${req1_id}.priority_score == 97.50 — unchanged by the allocation that followed it"
            - "Water.${water_a_id}.plan_shortfall_count == 0 and plan_fill_pct == 120.00"

      - name: water_plan_fill_pct_can_exceed_one_hundred_while_shortfall_floors_at_zero
        claim_type: aggregation_floor_honored
        grounds:
          - calculations.water_plan_shortfall
        distinguishing_aspect: |
          The two outputs of the same rule are clamped differently: the shortfall
          COUNT floors at zero, while the fill PERCENTAGE is deliberately unclamped
          so an over-allocated water reads 120.00 rather than 100.00. An
          implementation that clamps both, or neither, fails exactly one assert here.
        test_recipe:
          setup:
            - "Blue Mesa has plan_target_count 2000 and has just been granted 2400 fish, none yet released"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
          trigger:
            - *c_run1
          assert:
            - "Water.${water_a_id}.allocated_count_ytd == 2400 and released_count_ytd == 0"
            - "Water.${water_a_id}.plan_shortfall_count == 0 — max(0, 2000 - 0 - 2400), NOT -400"
            - "Water.${water_a_id}.plan_fill_pct == 120.00 — round((0 + 2400) / 2000 * 100, 2), NOT clamped to 100.00"

      - name: effluent_sample_exactly_at_the_permit_limit_is_compliant
        claim_type: threshold_boundary
        grounds:
          - calculations.effluent_compliance.boundary_notes
          - entities.EffluentReading.fields.exceedance_margin_mg_l
        distinguishing_aspect: |
          The permit test is strictly greater-than on BOTH analytes, so tss_mg_l
          exactly 20.0 against a 20.0 limit is COMPLIANT with margin 0.000, and
          total_phosphorus 0.1 exactly is likewise compliant. One tenth more TSS
          (20.1) must flip the same reading to EXCEEDANCE with margin 0.100 and lift
          the station to RESTRICTED on a single count.
        test_recipe:
          setup:
            - "Station SLVC has tss_permit_limit_mg_l 20.0 and exceedance_count_rolling 0"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-08-01T06:00:00Z", tss_mg_l: 20.0, total_phosphorus_mg_l: 0.1, flow_af: 1.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { eff_edge_id: $.data.id }
          assert:
            - "HTTP 201: EffluentReading.${eff_edge_id}.status == COMPLIANT with both analytes sitting exactly on their limits"
            - "EffluentReading.${eff_edge_id}.exceedance_margin_mg_l == 0.000"
            - "Hatchery.${hatch_id}.exceedance_count_rolling == 0 and operating_posture == OPEN"
            - "Hatchery.${hatch_id}.water_used_af == 1.0 and water_available_af == 119.0000 — the sampled flow is charged to the water right"
            - "a second reading at tss_mg_l 20.1 returns status EXCEEDANCE with exceedance_margin_mg_l 0.100, exceedance_count_rolling 1 and operating_posture RESTRICTED"

      - name: transport_cost_ceils_the_per_pound_term_onto_the_base_fee
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.transport_cost
          - calculations.transport_load_plan
        distinguishing_aspect: |
          The cost is a flat 45000-cent mobilisation plus a ceilinged per-pound term,
          committed — not spent — at scheduling. 2400 fish at 0.1 lb each is 240.00
          lbs, so the trip costs exactly 81000 cents and must appear in
          budget_committed_cents with budget_spent_cents still 0.
        test_recipe:
          setup:
            - "A CERTIFIED YEARLING lot of 16000 fish at avg_weight_g 45.3592 exists at station SLVC"
            - "Truck TRK-01 is AVAILABLE, request R1 has a 2400-fish grant, and the clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
          trigger:
            - &c_event1
              call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2400
                scheduled_depart_at: "2026-09-01T09:00:00Z"
                scheduled_return_at: "2026-09-01T17:00:00Z"
                expected_lot_version: "${lot_v1}"
                mark_type: "CWT"
                marked_count: 2400
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event1_id: $.data.id }
          assert:
            - "HTTP 201: StockingEvent.${event1_id}.planned_load_lbs == 240.00 and transport_cost_cents == 81000"
            - "StockingEvent.${event1_id}.oxygen_flow_lpm == 3.600 and status == SCHEDULED"
            - "StockingEvent.${event1_id}.max_fish_allowed == null — the load plan needs a water temperature, which arrives at load"
            - "Hatchery.${hatch_id}.budget_committed_cents == 81000, budget_spent_cents == 0, budget_available_cents == 49919000"
            - "RearingLot.${lot_id}.reserved_count == 2400 and count_on_hand == 16000 — reservation does not remove fish"

      - name: acclimation_requirement_ceils_to_whole_six_minute_steps
        claim_type: constants_applied
        grounds:
          - calculations.acclimation_requirement
          - endpoints.POST /stocking-events/{id}/release
        distinguishing_aspect: |
          A 7.5 °C gap costs ceil(7.5 / 1.0) * 6 = 48 minutes, exactly what an 8.0 °C
          gap would cost — the step is ceilinged, not prorated (a prorating
          implementation would say 45). Supplying exactly 48 minutes must be accepted,
          because the comparison that refuses is strictly less-than.
        test_recipe:
          setup:
            - "Event E1 is IN_TRANSIT, loaded at 12.0 °C with 2400 fish bound for Blue Mesa"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
            - *c_event1
            - &c_load1
              call: "POST /stocking-events/${event1_id}/load"
              payload: { loaded_at: "2026-09-01T09:00:00Z", load_water_temp_c: 12.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          trigger:
            - &c_release1
              call: "POST /stocking-events/${event1_id}/release"
              payload: { arrived_at: "2026-09-01T12:00:00Z", site_water_temp_c: 4.5, tempering_minutes: 48, transport_mortality_count: 20 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: StockingEvent.${event1_id}.tempering_minutes_required == 48 — ceil(7.5) * 6, NOT 45"
            - "StockingEvent.${event1_id}.status == RELEASED with released_count == 2380 and tempering_minutes == 48"
            - "StockingEvent.${event1_id}.max_fish_allowed == 2500 — computed at load from 12.0 °C, below the warm-water threshold"
            - "supplying tempering_minutes 47 instead returns 422 ERR_ACCLIMATION_INSUFFICIENT and leaves the event IN_TRANSIT"
            - "a site temperature of 2.0 °C (delta exactly 10.0) requires 60 minutes and is still releasable"

      - name: waterfall_fills_the_first_bucket_before_the_second
        claim_type: waterfall_remainder
        grounds:
          - calculations.allocation_grant.ordering_note
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_waterfall_rounds_to_unit_before_decrementing_pool
          rationale: "The named §1.8 instance runs the full three-request waterfall and asserts that the unit rounding happens before the pool is decremented, so the rounded-away fish stay available to the next bucket."

      - name: proportional_mode_is_selected_at_plan_creation
        claim_type: variant_selection
        grounds:
          - calculations.allocation_grant.variant_selector
        excluded_because:
          difficulty_instance: combinatorial_formula / proportional_mode_leaves_rounding_remainder_unallocated
          rationale: "The named §1.8 instance runs the identical request set under PROPORTIONAL and asserts the 925-fish total against the waterfall's 1000, proving the selector is read from allocation_mode."

      - name: warm_water_derate_threshold_is_strict
        claim_type: threshold_boundary
        grounds:
          - calculations.transport_load_plan.boundary_notes
        excluded_because:
          difficulty_instance: boundary_precision_check / warm_water_derate_starts_strictly_above_fifteen_degrees
          rationale: "The named §1.8 instance loads the same truck at 15.0 and at 15.1 °C and asserts max_fish_allowed 2500 then 2000."

      - name: feed_conversion_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.feed_conversion_ratio.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / fcr_biological_vs_economic_diverge_on_same_lot
          rationale: "The named §1.8 instance asserts both variants after two feedings with mortality (1.128 vs 0.991) and the ECONOMIC <= BIOLOGICAL ordering."

      - name: contribution_index_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.contribution_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / contribution_cohort_vs_harvest_diverge_on_same_release
          rationale: "The named §1.8 instance records one recovery report and asserts the cohort index against the harvest expansion, including the tag-loss discount."

      - name: egg_projection_reads_the_derate_tier_once
        claim_type: projection_late_event
        grounds:
          - calculations.egg_take_projection.tier_resolution_note
        excluded_because:
          difficulty_instance: combinatorial_formula / egg_projection_derate_tier_read_from_stored_density
          rationale: "The named §1.8 instance creates two spawn events either side of a density change and asserts each kept the tier that was current when it was created."

  # ===========================================================================
  # SECTION 4 — validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: stage_weight_gate_is_satisfied_exactly_at_the_gate_weight
        claim_type: satisfaction_pass
        grounds:
          - validations.stage-weight-met
          - calculations.stage_weight_gate.boundary_notes
        distinguishing_aspect: |
          The gate is inclusive. A lot whose avg_weight_g is exactly 4.0 g — the
          FINGERLING gate to four significant figures — must be allowed through, so
          the rule is avg_weight_g < gate and not avg_weight_g <= gate.
        test_recipe:
          setup:
            - "A lot of 20000 fish has been fed to avg_weight_g exactly 4.0 and advanced to FRY"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - &c_feed_400
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-10T12:00:00Z", feed_lbs: 100.0, avg_weight_g_after: 4.0, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - *c_adv_fry
          trigger:
            - *c_adv_fing
          assert:
            - "HTTP 200: RearingLot.${lot_id}.rearing_stage == FINGERLING"
            - "NOT 422 ERR_STAGE_WEIGHT_NOT_MET — 4.0 is exactly the gate and the comparison is strict"
            - "RearingLot.${lot_id}.avg_weight_g == 4.0 and biomass_lbs == 176.37"
            - "RearingLot.${lot_id}.health_status == UNSCREENED — a stage advance touches only the stage dimension"

      - name: stage_weight_gate_refuses_an_advance_one_hundredth_below_the_gate
        claim_type: violation_error
        grounds:
          - validations.stage-weight-met
          - errors.ERR_STAGE_WEIGHT_NOT_MET
        distinguishing_aspect: |
          The same lot one hundredth of a gram lighter (3.99 g) must be refused with
          ERR_STAGE_WEIGHT_NOT_MET at 422 — not ERR_INVALID_STATE, because FRY to
          FINGERLING is a declared transition and only the weight is wrong.
        test_recipe:
          setup:
            - "A lot of 20000 fish has been fed to avg_weight_g 3.99 and advanced to FRY"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed_399
            - *c_adv_fry
          trigger:
            - *c_adv_fing
          assert:
            - "HTTP 422 with error_id ERR_STAGE_WEIGHT_NOT_MET"
            - "NOT ERR_INVALID_STATE — the transition exists, the weight does not qualify"
            - "RearingLot.${lot_id}.rearing_stage == FRY and avg_weight_g == 3.99"

      - name: spawn_event_on_a_restricted_station_is_refused
        claim_type: conditional_validation
        grounds:
          - validations.hatchery-not-restricted
          - calculations.hatchery_operating_posture
          - errors.ERR_HATCHERY_RESTRICTED
        distinguishing_aspect: |
          RESTRICTED gates only new production: it blocks POST /spawn-events while
          leaving feedings, health work and stocking alone. The posture here is
          reached by density (index exactly 1.0000, which the density hard cap still
          permits because it refuses only values ABOVE 1.0000), not by an exceedance,
          so the station is RESTRICTED and not FROZEN.
        test_recipe:
          setup:
            - "Station SLVC has rearing_capacity_lbs 2000.0 and one lot of 16000 fish"
            - "The lot has been fed to avg_weight_g 56.699, putting station biomass at 2000.00 lbs"
            - "Brood group BS-1 is still SPAWNING with females_available 380 and the window is open"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - &c_feed_full
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-20T12:00:00Z", feed_lbs: 200.0, avg_weight_g_after: 56.699, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          trigger:
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-08-20T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the third feeding returned 201 — density_index exactly 1.0000 is not ABOVE the hard cap"
            - "Hatchery.${hatch_id}.biomass_on_hand_lbs == 2000.00, density_index == 1.0000, operating_posture == RESTRICTED"
            - "HTTP 409 with error_id ERR_HATCHERY_RESTRICTED on the spawn-event attempt"
            - "NOT ERR_HATCHERY_FROZEN — exceedance_count_rolling is 0 and water_available_af is 119.0000"
            - "BroodStock.${brood_id}.females_reserved == 0 and females_available == 380 — the refused event reserved nothing"

      - name: inverted_spawning_window_is_refused_by_the_shape_gate
        claim_type: violation_error
        grounds:
          - validations.request-shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Interval pairs are part of the shape contract, not a business rule: a brood
          group whose spawning_window_end equals its spawning_window_start is
          rejected at priority 6 with ERR_INVALID_REQUEST, before any window or
          posture rule is consulted.
        test_recipe:
          setup:
            - "Station SLVC is OPEN and the clock stands at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /brood-stocks"
              payload:
                hatchery_id: "${hatch_id}"
                species: "RAINBOW_TROUT"
                strain: "Hofer"
                female_count: 400
                male_count: 200
                expected_fecundity_per_female: 3000
                spawning_window_start: "2026-08-01T00:00:00Z"
                spawning_window_end: "2026-08-01T00:00:00Z"
                egg_take_target: 120000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST — the interval is inverted because end <= start"
            - "NOT ERR_SPAWN_WINDOW_CLOSED — that rule lives at priority 8 and guards the transition, not the shape"
            - "GET /brood-stocks?hatchery_id=${hatch_id} returns total_count == 0"

      - name: path_row_existence_is_checked_before_body_shape_and_returns_not_found
        claim_type: priority_ordering
        grounds:
          - validations.path-entity-exists
          - validations.request-shape
          - errors.ERR_LOT_NOT_FOUND
        distinguishing_aspect: |
          A feeding posted to a lot id that does not exist, WITH a body that is also
          malformed (feed_lbs sent as a string and avg_weight_g_after omitted), must
          report ERR_LOT_NOT_FOUND at 404 — priority 4 beats priority 6. Reporting
          ERR_INVALID_REQUEST here would leak that shape is validated first.
        test_recipe:
          setup:
            - "Station SLVC exists; no rearing lot has the id 00000000-0000-4000-8000-000000000000"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /rearing-lots/00000000-0000-4000-8000-000000000000/feedings"
              payload: { fed_at: "2026-08-01T00:00:00Z", feed_lbs: "one hundred" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_LOT_NOT_FOUND"
            - "NOT ERR_INVALID_REQUEST (400) despite the wrong-typed feed_lbs and the missing avg_weight_g_after"

      - name: role_gate_is_checked_before_the_path_row_and_returns_forbidden_not_found_free
        claim_type: priority_ordering
        grounds:
          - validations.role-permitted
          - validations.path-entity-exists
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          A PublicRequester reading a rearing lot that does not exist must be told
          ERR_FORBIDDEN_ROLE at 403 (priority 2), never ERR_LOT_NOT_FOUND (priority
          4) — the ordering is what stops an unauthorised caller from probing which
          ids exist.
        test_recipe:
          setup:
            - "No rearing lot has the id 00000000-0000-4000-8000-000000000000"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "GET /rearing-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PublicRequester
              as_user_id: "pub-dana"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "NOT ERR_LOT_NOT_FOUND (404) — the role gate fires first and the response reveals nothing about the id"

      - name: state_check_beats_the_quarantine_safety_check
        claim_type: priority_conflict
        grounds:
          - validation_conflict_pairs.state-beats-safety
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / own_state_beats_quarantine_safety_on_load_of_aborted_event
          rationale: "The named §1.8 instance violates own-state-legal (8) and lot-not-quarantined (10) in one call and asserts ERR_INVALID_STATE, then removes the state violation to show the safety error surfacing."

      - name: oxygen_supply_is_an_aggregate_over_concurrent_trips
        claim_type: aggregate_validation
        grounds:
          - validations.oxygen-supply-adequate
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_oxygen_supply_exceeded_across_two_concurrent_trips
          rationale: "The named §1.8 instance loads two individually-legal trips on separate trucks whose summed oxygen_flow_lpm exceeds the station's bulk supply."

      - name: water_rest_buffer_is_a_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations.water-rest-buffer
        excluded_because:
          difficulty_instance: resource_temporal_overlap / water_rest_buffer_refuses_a_release_one_second_early
          rationale: "The named §1.8 instance releases into the same water one second before and then exactly at the 48-hour boundary."

      - name: spawn_event_creation_depends_on_the_parent_groups_state
        claim_type: cross_entity_validation
        grounds:
          - validations.brood-stock-spawning
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / spawn_event_creation_requires_brood_stock_in_spawning
          rationale: "The named §1.8 instance asserts ERR_BROOD_STOCK_NOT_SPAWNING from READY and from CLOSED and the success from SPAWNING."

      - name: density_hard_cap_refuses_the_feeding_that_would_cross_it
        claim_type: violation_error
        grounds:
          - validations.density-cap
        excluded_because:
          difficulty_instance: boundary_precision_check / density_cap_admits_exactly_one_then_refuses_the_next_increment
          rationale: "The named §1.8 instance feeds to exactly density_index 1.0000 and then asserts ERR_DENSITY_CAP_EXCEEDED on the next gram."

  # ===========================================================================
  # SECTION 5 — endpoints (§1.5)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: effluent_sub_resource_lists_newest_first_and_filters_by_status
        claim_type: standard_crud
        grounds:
          - endpoints.GET /hatcheries/{id}/effluent-readings
          - response_envelope.pagination
        distinguishing_aspect: |
          The station's discharge log is a sub-resource: it is scoped to the parent
          hatchery, ordered newest sample first, and its optional status filter must
          narrow total_count itself rather than just the page. Two readings six hours
          apart make the ordering falsifiable in both directions.
        test_recipe:
          setup:
            - "Station SLVC has a COMPLIANT reading sampled at 06:00 (tss 20.0) and an EXCEEDANCE reading sampled at 12:00 (tss 26.5)"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_eff_compliant
            - &c_eff_exceed
              call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-08-01T12:00:00Z", tss_mg_l: 26.5, total_phosphorus_mg_l: 0.08, flow_af: 1.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { eff2_id: $.data.id }
          trigger:
            - call: "GET /hatcheries/${hatch_id}/effluent-readings?status=EXCEEDANCE"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { filtered_first_id: "$.data[0].id" }
          assert:
            - "HTTP 200 with total_count == 1, has_more == false, limit == 10, offset == 0"
            - "${filtered_first_id} == ${eff2_id} and its exceedance_margin_mg_l == 6.500"
            - "the same call without the filter returns total_count == 2 with the 12:00 sample first — newest sampled_at leads"
            - "Hatchery.${hatch_id}.water_used_af == 3.0, water_available_af == 117.0000, exceedance_count_rolling == 1, operating_posture == RESTRICTED"

      - name: attach_to_plan_links_the_request_and_bumps_the_plan_version
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /stocking-requests/{id}/attach-to-plan
          - state_machines.StockingRequest.SUBMITTED_to_QUEUED
        distinguishing_aspect: |
          The link endpoint touches BOTH sides: the request becomes QUEUED with
          allocation_plan_id set, and the PLAN's version increments even though the
          plan's own fields are otherwise untouched — that bump is what makes a
          concurrent second attach detectable. The request's frozen priority_score
          must not be recomputed by the link.
        test_recipe:
          setup:
            - "Request R1 is SUBMITTED with priority_score 97.50, authored by bio-carla"
            - "Plan P1 is DRAFT with size_class YEARLING and version 1"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
          trigger:
            - *c_attach1
          assert:
            - "HTTP 200: StockingRequest.${req1_id}.status == QUEUED and allocation_plan_id == ${plan1_id}"
            - "StockingRequest.${req1_id}.priority_score == 97.50 — the link does not re-score"
            - "AllocationPlan.${plan1_id}.version == ${plan1_v0} + 1 and status == DRAFT"
            - "AllocationPlan.${plan1_id}.allocated_total_count == 0 and run_count == 0"
            - "GET /stocking-requests?allocation_plan_id=${plan1_id} returns total_count == 1"

      - name: run_with_nothing_queued_returns_no_eligible_requests_and_mutates_nothing
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /allocation-plans/{id}/run
          - validations.eligible-candidate-set
          - errors.ERR_NO_ELIGIBLE_REQUESTS
        distinguishing_aspect: |
          The run is all-or-nothing. With no attached request at all the plan must be
          refused with ERR_NO_ELIGIBLE_REQUESTS at 422 and left completely
          unmodified — DRAFT, run_count 0 and the SAME version, so the caller's
          expected_plan_version is still usable on the retry.
        test_recipe:
          setup:
            - "Plan P1 exists in DRAFT at version 1 with no attached requests"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_plan1
          trigger:
            - call: "POST /allocation-plans/${plan1_id}/run"
              payload: { expected_plan_version: "${plan1_v0}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_NO_ELIGIBLE_REQUESTS"
            - "AllocationPlan.${plan1_id}.status == DRAFT, run_count == 0, version == ${plan1_v0}"
            - "AllocationPlan.${plan1_id}.allocated_total_count == 0 and unmet_demand_count == 0"

      - name: stocking_event_read_exposes_the_load_plan_it_computed
        claim_type: computed_read
        grounds:
          - endpoints.GET /stocking-events/{id}
          - calculations.transport_load_plan
        distinguishing_aspect: |
          The read is where the trip's derived numbers are inspected, and they are
          filled in at two DIFFERENT moments: planned_load_lbs, oxygen_flow_lpm and
          transport_cost_cents at scheduling, max_fish_allowed only at load (it needs
          the water temperature), and tempering_minutes_required only at release.
        test_recipe:
          setup:
            - "Event E1 was scheduled for 2400 fish and then loaded at 12.0 °C"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
            - *c_event1
            - *c_load1
          trigger:
            - call: "GET /stocking-events/${event1_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: status == IN_TRANSIT, planned_load_lbs == 240.00, transport_cost_cents == 81000, oxygen_flow_lpm == 3.600"
            - "max_fish_allowed == 2500 — now populated, from the 12.0 °C supplied at load"
            - "tempering_minutes_required == null and released_count == null — the trip has not been released"
            - "contribution_index_cohort == null and contribution_index_harvest == null and effective_marked_count == 2280"
            - "TransportUnit.${truck1_id}.status == IN_USE with current_event_id == ${event1_id}"

      - name: recoveries_on_a_scheduled_event_are_refused
        claim_type: conditional_action
        grounds:
          - endpoints.POST /stocking-events/{id}/recoveries
          - validations.own-state-legal
        distinguishing_aspect: |
          Recoveries are only meaningful after a release: reporting tags against a
          still-SCHEDULED trip must be refused with ERR_INVALID_STATE and must leave
          recovered_count and both contribution indices null, so no contribution can
          ever be attributed to fish that never entered the water.
        test_recipe:
          setup:
            - "Event E1 is SCHEDULED for 2400 CWT-marked fish and has not been loaded"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
            - *c_event1
          trigger:
            - call: "POST /stocking-events/${event1_id}/recoveries"
              payload: { recovered_count: 57, creel_sample_fraction: 0.25 }
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "StockingEvent.${event1_id}.recovered_count == null, contribution_index_cohort == null, contribution_index_harvest == null"
            - "StockingEvent.${event1_id}.status == SCHEDULED"

      - name: load_endpoint_applies_the_tightest_of_its_three_limits
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /stocking-events/{id}/load
        excluded_because:
          difficulty_instance: combinatorial_formula / transport_load_plan_volume_limit_binds_over_oxygen_and_payload
          rationale: "The named §1.8 instance asserts which of volume, oxygen and rated payload binds, and that the error names the fish count rather than the binding limit."

      - name: recoveries_endpoint_reports_both_contribution_indices
        claim_type: computed_read
        grounds:
          - endpoints.POST /stocking-events/{id}/recoveries
        excluded_because:
          difficulty_instance: dual_variant_calc / contribution_cohort_vs_harvest_diverge_on_same_release
          rationale: "The named §1.8 instance records the recovery report and asserts both stored indices plus the tag-loss-discounted effective_marked_count."

      - name: release_endpoint_settles_fish_water_and_money_together
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /stocking-events/{id}/release
        excluded_because:
          difficulty_instance: compensating_invariant / release_moves_budget_from_committed_to_spent_without_drift
          rationale: "The named §1.8 instance asserts the full settlement ledger across the lot, the water, the request, the plan and the appropriation in one release."

  # ===========================================================================
  # SECTION 6 — errors (§1.6) — every catalogued error_id is triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: duplicate_station_code_is_refused_on_the_second_hatchery
        claim_type: error_triggerable
        grounds:
          - validations.station-code-unique
          - errors.ERR_DUPLICATE_STATION_CODE
        distinguishing_aspect: |
          station_code is the program-wide natural key. A second station reusing SLVC
          must be refused with ERR_DUPLICATE_STATION_CODE at 409 — not
          ERR_INVALID_REQUEST — and no row may be created.
        test_recipe:
          setup:
            - "Station SLVC already exists"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
          trigger:
            - call: "POST /hatcheries"
              payload:
                name: "Second Silver Creek"
                station_code: "SLVC"
                water_source_type: "WELL"
                annual_water_right_af: 60.0
                rearing_capacity_lbs: 1000.0
                oxygen_supply_lpm: 8.0
                effluent_permit_number: "CO-0044822"
                tss_permit_limit_mg_l: 25.0
                annual_budget_cents: 10000000
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_STATION_CODE"
            - "NOT ERR_INVALID_REQUEST — every field is well formed, only the code collides"
            - "GET /hatcheries/${hatch_id} still shows name Silver Creek Hatchery and version 1"

      - name: loading_a_never_certified_lot_reports_lot_not_certified
        claim_type: error_triggerable
        grounds:
          - validations.lot-certified
          - errors.ERR_LOT_NOT_CERTIFIED
        distinguishing_aspect: |
          The certificate is checked at load, not at scheduling: the event is created
          happily against an UNSCREENED lot and only the load is refused, with
          ERR_LOT_NOT_CERTIFIED at 422 because certificate_expires_at is null (never
          certified) rather than lapsed.
        test_recipe:
          setup:
            - "A YEARLING lot of 16000 fish exists but no health inspection was ever performed, so health_status is UNSCREENED and certificate_expires_at is null"
            - "Event E1 is SCHEDULED for 2400 fish and the clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
            - *c_event1
          trigger:
            - call: "POST /stocking-events/${event1_id}/load"
              payload: { loaded_at: "2026-09-01T09:00:00Z", load_water_temp_c: 12.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_LOT_NOT_CERTIFIED"
            - "NOT ERR_HEALTH_CERTIFICATE_EXPIRED — the lot has no certificate at all, so certificate_expires_at is null"
            - "StockingEvent.${event1_id}.status == SCHEDULED and max_fish_allowed == null"
            - "TransportUnit.${truck1_id}.status == AVAILABLE with current_event_id == null"

      - name: retest_inside_the_drug_withdrawal_window_reports_withdrawal_period_active
        claim_type: error_triggerable
        grounds:
          - validations.withdrawal-cleared
          - state_machines.HealthInspection.RETEST_DUE_to_PASSED
          - errors.ERR_WITHDRAWAL_PERIOD_ACTIVE
        distinguishing_aspect: |
          withdrawal_clears_at is treatment_completed_at plus withdrawal_days: 2026-08-25
          plus 21 days is 2026-09-15T00:00:00Z. A retest read on 2026-09-01 must be
          refused with ERR_WITHDRAWAL_PERIOD_ACTIVE even though the result is NEGATIVE,
          and the same call must pass once the clock reaches the clearing instant.
        test_recipe:
          setup:
            - "Inspection I1 on the lot recorded POSITIVE_TREATABLE and was treated with FORMALIN for 21 withdrawal days, completed 2026-08-25T00:00:00Z"
            - "The inspection is RETEST_DUE with retest_count 1 and the clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
