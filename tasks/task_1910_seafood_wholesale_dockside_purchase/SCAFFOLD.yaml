# =============================================================================
# Task 1910 — Seafood Wholesale & Dockside Purchase — Seed Tables
# =============================================================================

scenario: |
  1910. Seafood Wholesale & Dockside Purchase (regional seafood wholesaler):
  landing purchase by species/grade & dock ticket, traceability to vessel &
  catch area, fresh vs frozen inventory & shelf-life clock, grading/yield after
  processing, market price volatility & daily quote, cold-chain shipping &
  air-freight booking, species substitution & labeling compliance, import
  documentation & inspection hold

domain_name: seafood-wholesale-dockside
api_prefix: /

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology — no nested URLs)
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Vessel display name" }
      - { name: registration_number, type: string, source: input, description: "Official registration number; unique across vessels" }
      - { name: home_port, type: string, source: input, description: "Home port name" }
      - { name: payable_balance_cents, type: integer, source: computed, default: 0, description: "Amount owed to the vessel for settled-not-paid dock tickets; settle adds, pay subtracts, void reverses" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Wholesale buyer business name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed credit exposure in cents" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Fractional line discount, e.g. 0.10 = 10%; applied per line before rounding" }
      - { name: credit_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this customer's orders in {CONFIRMED, FULFILLED, INVOICED}" }

  - name: CatchArea
    parent: null
    common_fields: true
    fields:
      - { name: fao_code, type: string, source: input, description: "FAO major fishing area code; unique" }
      - { name: name, type: string, source: input, description: "Catch area display name" }
      - { name: region, type: string, source: input, description: "Region description" }

  - name: Species
    parent: null
    common_fields: true
    fields:
      - { name: species_code, type: string, source: input, description: "Short species code; unique" }
      - { name: common_name, type: string, source: input, description: "Common trade name" }
      - { name: labeling_name, type: string, source: input, description: "Legally required market labeling name" }
      - { name: substitution_group, type: string, source: input, description: "Substitution group key; only species sharing this key may substitute for each other" }
      - { name: is_import, type: boolean, source: input, default: false, description: "True if this species requires import documentation before settlement" }
      - { name: requires_cites, type: boolean, source: input, default: false, description: "True if CITES documentation is required to use this species as a substitute" }
      - { name: fresh_shelf_life_hours, type: integer, source: input, description: "Shelf life in hours for FRESH lots of this species" }
      - { name: frozen_shelf_life_days, type: integer, source: input, description: "Shelf life in days for FROZEN lots of this species (from frozen_at)" }

  - name: MarketQuote
    parent: null
    common_fields: true
    fields:
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; quoted species" }
      - { name: grade, type: enum, source: input, description: "GRADE_A | GRADE_B | GRADE_C" }
      - { name: quote_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the quote applies to" }
      - { name: price_per_kg_cents, type: integer, source: input, description: "Quoted price per kg in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | PUBLISHED | SUPERSEDED | EXPIRED" }
      - { name: volatility_pct, type: number, source: computed, default: 0, description: "Absolute pct change vs prior published quote for same species+grade, computed at publish, 2dp round_half_up" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (used for segregation-of-duties on volatility approval)" }

  - name: DockTicket
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; landing vessel" }
      - { name: catch_area_id, type: string, source: input, description: "FK -> CatchArea.id; catch area for traceability" }
      - { name: landing_start_at, type: datetime, source: input, description: "Landing window start (ISO8601 UTC)" }
      - { name: landing_end_at, type: datetime, source: input, description: "Landing window end; must be strictly after landing_start_at" }
      - { name: status, type: enum, source: system, description: "DRAFT | LANDED | GRADED | SETTLED | PAID | VOIDED" }
      - { name: regrade_count, type: integer, source: system, default: 0, description: "Number of GRADED -> LANDED re-grade reversals; hard cap 2" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_amount_cents over non-voided landing lines" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents over lines whose latest assessment is FINAL" }

  - name: LandingLine
    parent: null
    common_fields: true
    fields:
      - { name: dock_ticket_id, type: string, source: input, description: "FK -> DockTicket.id; owning dock ticket" }
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; landed species" }
      - { name: declared_grade, type: enum, source: input, description: "GRADE_A | GRADE_B | GRADE_C as declared at landing" }
      - { name: landed_weight_kg, type: number, source: input, description: "Landed weight in kg, 2dp, must be > 0" }
      - { name: processing_type, type: enum, source: input, default: "WHOLE", description: "WHOLE | FILLETED" }
      - { name: provisional_amount_cents, type: integer, source: computed, default: 0, description: "Provisional settlement (declared grade quote x landed weight), round_half_up to cents" }
      - { name: processed_weight_kg, type: number, source: computed, default: 0, description: "Yield-adjusted processed weight, 2dp, computed at assessment finalize" }
      - { name: final_amount_cents, type: integer, source: computed, default: 0, description: "Final settlement (assessed grade quote x processed weight), at assessment finalize" }
      - { name: voided, type: boolean, source: system, default: false, description: "True when owning ticket is voided" }

  - name: GradeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: landing_line_id, type: string, source: input, description: "FK -> LandingLine.id; assessed line" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the recording GradingInspector" }
      - { name: assessed_grade, type: enum, source: input, description: "GRADE_A | GRADE_B | GRADE_C as assessed" }
      - { name: yield_pct, type: number, source: input, description: "Processing yield fraction, 0 < yield_pct <= 1" }
      - { name: notes, type: string, source: input, default: "", description: "Free-text notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: landing_line_id, type: string, source: system, description: "FK -> LandingLine.id; source landing line (traceability)" }
      - { name: species_id, type: string, source: system, description: "FK -> Species.id; denormalized from landing line at creation" }
      - { name: storage_type, type: enum, source: system, default: "FRESH", description: "FRESH | FROZEN" }
      - { name: landed_at, type: datetime, source: system, description: "Copied from ticket landing_start_at at lot creation" }
      - { name: frozen_at, type: datetime, source: system, description: "Set when lot is frozen; null while FRESH", default: null }
      - { name: expires_at, type: datetime, source: computed, description: "FRESH: landed_at + fresh_shelf_life_hours; after freeze: frozen_at + frozen_shelf_life_days" }
      - { name: received_weight_kg, type: number, source: system, default: 0, description: "Weight received into inventory = processed_weight_kg of source line at creation" }
      - { name: available_weight_kg, type: number, source: computed, default: 0, description: "Unreserved sellable weight" }
      - { name: reserved_weight_kg, type: number, source: computed, default: 0, description: "Weight in RESERVED allocations" }
      - { name: committed_weight_kg, type: number, source: computed, default: 0, description: "Weight in COMMITTED allocations not yet shipped" }
      - { name: shipped_weight_kg, type: number, source: computed, default: 0, description: "Weight delivered by shipments" }
      - { name: condemned_weight_kg, type: number, source: computed, default: 0, description: "Weight condemned by inspection" }
      - { name: spoiled_weight_kg, type: number, source: computed, default: 0, description: "Weight written off or expired" }
      - { name: recalled_weight_kg, type: number, source: computed, default: 0, description: "Weight recalled by ticket void / re-grade" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | DEPLETED | EXPIRED | RECALLED (parallel dimension 1)" }
      - { name: hold_status, type: enum, source: system, description: "CLEAR | ON_HOLD | CONDEMNED (parallel dimension 2)" }
      - { name: unit_cost_cents, type: integer, source: computed, default: 0, description: "round_half_up(final_amount_cents / received_weight_kg) at lot creation; 0 if received is 0" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: required_delivery_date, type: string, source: input, description: "Requested delivery date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | FULFILLED | INVOICED | CANCELLED" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents; computed at confirm, adjusted by substitution apply" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Set at confirm" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; owning order" }
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; requested species (rewritten by substitution apply)" }
      - { name: requested_grade, type: enum, source: input, description: "GRADE_A | GRADE_B | GRADE_C" }
      - { name: requested_qty_kg, type: number, source: input, description: "Requested quantity, 2dp, > 0" }
      - { name: min_remaining_shelf_life_hours, type: integer, source: input, default: 0, description: "Minimum remaining shelf life required at allocation time" }
      - { name: allow_substitution, type: boolean, source: input, default: false, description: "Whether species substitution is permitted on this line" }
      - { name: unit_price_cents, type: integer, source: computed, default: 0, description: "Locked at confirm from selected PUBLISHED quote; rewritten at substitution apply" }
      - { name: line_total_cents, type: integer, source: computed, default: 0, description: "round_half_up(requested_qty_kg x unit_price_cents x (1 - discount_pct)) at confirm" }
      - { name: allocated_qty_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over allocations in {RESERVED, COMMITTED}" }
      - { name: committed_qty_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over allocations in {COMMITTED}" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; allocated line" }
      - { name: inventory_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; source lot" }
      - { name: qty_kg, type: number, source: input, description: "Allocated weight, 2dp, > 0" }
      - { name: transit_hours, type: integer, source: input, description: "Planned transit hours; added to min shelf-life requirement" }
      - { name: status, type: enum, source: system, description: "RESERVED | COMMITTED | RELEASED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; shipped order" }
      - { name: mode, type: enum, source: input, description: "AIR | TRUCK" }
      - { name: flight_number, type: string, source: input, default: "", description: "Required when mode = AIR" }
      - { name: flight_date, type: string, source: input, default: "", description: "Required when mode = AIR (YYYY-MM-DD)" }
      - { name: temp_zone, type: enum, source: input, description: "CHILLED | FROZEN cold-chain requirement" }
      - { name: booked_weight_kg, type: number, source: input, description: "Booked weight used for provisional freight, 2dp, > 0" }
      - { name: actual_weight_kg, type: number, source: system, default: 0, description: "Actual weight at tender" }
      - { name: volume_m3, type: number, source: system, default: 0, description: "Actual volume at tender" }
      - { name: chargeable_weight_kg, type: number, source: computed, default: 0, description: "max(actual_weight_kg, round_half_up(volume_m3 x 167, 2)) at tender; booked_weight_kg at book" }
      - { name: provisional_freight_cents, type: integer, source: computed, default: 0, description: "Freight estimate computed at book from booked_weight_kg" }
      - { name: final_freight_cents, type: integer, source: computed, default: 0, description: "Freight charge computed at tender from chargeable weight" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOOKED | TENDERED | IN_TRANSIT | DELIVERED | CANCELLED" }

  - name: ImportDocument
    parent: null
    common_fields: true
    fields:
      - { name: dock_ticket_id, type: string, source: input, description: "FK -> DockTicket.id; ticket this document covers" }
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; species this document covers" }
      - { name: doc_type, type: enum, source: input, description: "HEALTH_CERT | CITES | CUSTOMS_ENTRY" }
      - { name: reference_number, type: string, source: input, description: "External document reference" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CLEARED | REJECTED" }
      - { name: submitted_by_user_id, type: string, source: system, default: "", description: "X-User-ID of last submitter" }
      - { name: reviewed_by_user_id, type: string, source: system, default: "", description: "X-User-ID of clearing officer" }
      - { name: resubmit_count, type: integer, source: system, default: 0, description: "Number of REJECTED -> SUBMITTED resubmissions" }

  - name: InspectionHold
    parent: null
    common_fields: true
    fields:
      - { name: inventory_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot under hold" }
      - { name: reason, type: string, source: input, description: "Hold reason" }
      - { name: status, type: enum, source: system, description: "PLACED | RELEASED | CONDEMNED" }
      - { name: placed_by_user_id, type: string, source: system, description: "X-User-ID of placing officer" }
      - { name: resolved_by_user_id, type: string, source: system, default: "", description: "X-User-ID of releasing/condemning officer" }
      - { name: placed_at, type: datetime, source: system, description: "Set at placement" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Set at release/condemn" }

  - name: SubstitutionApproval
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line being substituted (auto-created records set this from the shortage line)" }
      - { name: original_species_id, type: string, source: system, description: "FK -> Species.id; line species at request time" }
      - { name: substitute_species_id, type: string, source: input, description: "FK -> Species.id; proposed substitute" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | APPLIED" }
      - { name: price_credit_cents, type: integer, source: computed, default: 0, description: "Credit computed at apply: round_half_up((old_unit - new_unit) x requested_qty_kg)" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when created by the condemn/expiry cascade selector" }
      - { name: requested_by_user_id, type: string, source: system, default: "", description: "X-User-ID of requester (empty for auto-created)" }
      - { name: decided_by_user_id, type: string, source: system, default: "", description: "X-User-ID of approver/rejecter" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MarketQuote
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /market-quotes/{id}/publish"
        actor: OperationsManager
        preconditions:
          - "Quote in DRAFT (ERR_QUOTE_INVALID_STATE)"
          - "expected_species_version == Species.version (ERR_STALE_VERSION)"
          - "volatility_pct < 10.00 vs prior PUBLISHED quote for same species+grade (else transition goes to PENDING_APPROVAL, not an error)"
        side_effects:
          - "Prior PUBLISHED quote for same (species_id, grade) -> SUPERSEDED"
          - "increments Species.version by 1"
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /market-quotes/{id}/publish"
        actor: OperationsManager
        preconditions:
          - "Quote in DRAFT (ERR_QUOTE_INVALID_STATE)"
          - "expected_species_version == Species.version (ERR_STALE_VERSION)"
          - "volatility_pct >= 10.00 vs prior PUBLISHED quote for same species+grade"
        side_effects:
          - "increments Species.version by 1"
      - from: PENDING_APPROVAL
        to: PUBLISHED
        trigger: "POST /market-quotes/{id}/approve-volatility"
        actor: OperationsManager
        preconditions:
          - "Quote in PENDING_APPROVAL (ERR_QUOTE_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "Prior PUBLISHED quote for same (species_id, grade) -> SUPERSEDED"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /market-quotes/{id}/reject-volatility"
        actor: OperationsManager
        preconditions:
          - "Quote in PENDING_APPROVAL (ERR_QUOTE_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a newer quote for same species+grade reaches PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when current date passes quote_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DockTicket
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: LANDED
        trigger: "POST /dock-tickets/{id}/land"
        actor: DockBuyer | VesselAgent
        preconditions:
          - "Ticket in DRAFT (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: LANDED
        to: GRADED
        trigger: "system (automatic when every non-voided LandingLine has a FINAL GradeAssessment and ticket has >= 1 line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRADED
        to: SETTLED
        trigger: "POST /dock-tickets/{id}/settle"
        actor: OperationsManager
        preconditions:
          - "Ticket in GRADED (ERR_TICKET_INVALID_STATE)"
          - "For every line whose species.is_import: required ImportDocuments (HEALTH_CERT always; CITES when species.requires_cites) for that ticket+species are CLEARED (ERR_IMPORT_DOCS_NOT_CLEARED)"
          - "No derived InventoryLot has hold_status == ON_HOLD (ERR_LOT_ON_HOLD)"
        side_effects:
          - "Vessel.payable_balance_cents += final_total_cents"
      - from: SETTLED
        to: PAID
        trigger: "POST /dock-tickets/{id}/pay"
        actor: OperationsManager
        preconditions:
          - "Ticket in SETTLED (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Vessel.payable_balance_cents -= final_total_cents"
      - from: GRADED
        to: LANDED
        trigger: "POST /dock-tickets/{id}/request-regrade"
        actor: DockBuyer | OperationsManager
        preconditions:
          - "Ticket in GRADED (ERR_TICKET_INVALID_STATE)"
          - "regrade_count < 2 (ERR_REGRADE_LIMIT_EXCEEDED)"
        side_effects:
          - "regrade_count += 1"
          - "All FINAL GradeAssessments of the ticket's lines -> SUPERSEDED"
          - "All InventoryLots derived from the ticket's lines -> RECALLED; their remaining available+reserved+committed weight moves to recalled_weight_kg"
          - "Each RESERVED Allocation on recalled lots -> RELEASED (weight returns to lot buckets before recall zeroing); each COMMITTED Allocation on recalled lots -> RELEASED"
          - "Affected OrderLines recompute allocated_qty_kg / committed_qty_kg; affected SalesOrders re-evaluate FULFILLED regression"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /dock-tickets/{id}/void"
        actor: OperationsManager
        preconditions:
          - "Ticket in DRAFT | LANDED | GRADED | SETTLED (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "All LandingLines: voided = true"
          - "All InventoryLots derived from the ticket's lines -> RECALLED; remaining available+reserved+committed weight moves to recalled_weight_kg"
          - "Each RESERVED/COMMITTED Allocation on recalled lots -> RELEASED; OrderLines recompute; SalesOrders re-evaluate FULFILLED regression"
          - "If ticket was SETTLED: Vessel.payable_balance_cents -= final_total_cents (exact reversal of settle)"
      - from: LANDED
        to: VOIDED
        trigger: "POST /dock-tickets/{id}/void"
        actor: OperationsManager
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> VOIDED"]
      - from: GRADED
        to: VOIDED
        trigger: "POST /dock-tickets/{id}/void"
        actor: OperationsManager
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> VOIDED"]
      - from: SETTLED
        to: VOIDED
        trigger: "POST /dock-tickets/{id}/void"
        actor: OperationsManager
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> VOIDED, including payable reversal"]

  - entity: GradeAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /grade-assessments/{id}/finalize"
        actor: GradingInspector
        preconditions:
          - "Assessment in DRAFT (ERR_ASSESSMENT_INVALID_STATE)"
          - "Owning ticket in LANDED (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Compute LandingLine.processed_weight_kg and final_amount_cents (calculations yield_processing + dock_line_settlement final variant)"
          - "Create InventoryLot from the line (storage FRESH, received = processed_weight_kg, available = received, expires_at = landed_at + fresh_shelf_life_hours)"
          - "DockTicket.final_total_cents recomputed"
          - "If all non-voided lines of the ticket have FINAL assessments and ticket has >= 1 line: DockTicket -> GRADED"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (automatic on ticket request-regrade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InventoryLot
    initial_state: "lifecycle_status=ACTIVE, hold_status=CLEAR"
    terminal_states: ["lifecycle: DEPLETED | EXPIRED | RECALLED", "hold: CONDEMNED"]
    transitions:
      - from: "ACTIVE (lifecycle, parallel dim 1)"
        to: DEPLETED
        trigger: "system (automatic when available+reserved+committed == 0 and received_weight_kg > 0 after a deliver/write-off/condemn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ACTIVE (lifecycle)"
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "available+reserved weight -> spoiled_weight_kg (committed stays until its order resolves)"
          - "Each RESERVED Allocation on this lot -> RELEASED; OrderLines recompute; SalesOrders re-evaluate FULFILLED regression"
          - "For each shortage line with allow_substitution == true: auto-create SubstitutionApproval REQUESTED via substitute selector (calculations.substitute_selection)"
      - from: "ACTIVE (lifecycle)"
        to: RECALLED
        trigger: "system (ticket void or request-regrade cascade)"
        actor: system
        preconditions: []
        side_effects: ["remaining available+reserved+committed weight -> recalled_weight_kg"]
      - from: "CLEAR (hold, parallel dim 2)"
        to: ON_HOLD
        trigger: "POST /inspection-holds"
        actor: ComplianceOfficer
        preconditions:
          - "Lot lifecycle_status == ACTIVE and hold_status == CLEAR (ERR_LOT_INVALID_STATE)"
          - "No other PLACED InspectionHold on this lot (ERR_HOLD_ALREADY_ACTIVE)"
        side_effects: ["hold_status -> ON_HOLD"]
      - from: ON_HOLD
        to: CLEAR
        trigger: "POST /inspection-holds/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "Hold in PLACED (ERR_HOLD_INVALID_STATE)"
          - "X-User-ID != placed_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["hold_status -> CLEAR"]
      - from: ON_HOLD
        to: CONDEMNED
        trigger: "POST /inspection-holds/{id}/condemn"
        actor: ComplianceOfficer
        preconditions:
          - "Hold in PLACED (ERR_HOLD_INVALID_STATE)"
        side_effects:
          - "hold_status -> CONDEMNED; available+reserved+committed weight -> condemned_weight_kg"
          - "Each RESERVED/COMMITTED Allocation on this lot -> RELEASED; OrderLines recompute allocated/committed"
          - "SalesOrders of affected lines: if status == FULFILLED and any line no longer fully committed -> CONFIRMED (regression)"
          - "For each shortage line with allow_substitution == true: auto-create SubstitutionApproval REQUESTED via substitute selector"
          - "If lifecycle was ACTIVE and all buckets except shipped/spoiled zero: lifecycle -> DEPLETED evaluation"

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, INVOICED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sales-orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Order in DRAFT (ERR_ORDER_INVALID_STATE)"
          - "customer_id == X-User-ID (ERR_OWNERSHIP_MISMATCH)"
          - "Order has >= 1 OrderLine (ERR_ORDER_EMPTY)"
        side_effects: []
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /sales-orders/{id}/confirm"
        actor: OperationsManager
        preconditions:
          - "Order in SUBMITTED (ERR_ORDER_INVALID_STATE)"
          - "Every line resolves a PUBLISHED quote via latest_published_quote selector (ERR_QUOTE_NOT_PUBLISHED)"
          - "customer.credit_exposure_cents + order.total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Lock unit_price_cents per line; compute line_total_cents per line; total_cents = sum of line totals (calculations order_line_pricing)"
          - "confirmed_at = now; Customer.credit_exposure_cents recomputed"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "system (automatic when every line's committed_qty_kg >= requested_qty_kg)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: CONFIRMED
        trigger: "system (automatic regression when any line's committed_qty_kg drops below requested_qty_kg after release/condemn/expiry/void cascades)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: INVOICED
        trigger: "POST /sales-orders/{id}/invoice"
        actor: OperationsManager
        preconditions:
          - "Order in FULFILLED (ERR_ORDER_INVALID_STATE)"
        side_effects: ["Customer.credit_exposure_cents unchanged (INVOICED remains in exposure set)"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: Customer | OperationsManager
        preconditions: ["Order in DRAFT | SUBMITTED | CONFIRMED (ERR_ORDER_INVALID_STATE)", "Customer role: customer_id == X-User-ID (ERR_OWNERSHIP_MISMATCH)"]
        side_effects: ["No allocations possible from DRAFT; credit exposure recompute"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: Customer | OperationsManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: Customer | OperationsManager
        preconditions: []
        side_effects:
          - "All RESERVED/COMMITTED Allocations of the order's lines -> RELEASED; lot buckets restored (reserved/committed -> available)"
          - "Customer.credit_exposure_cents recomputed (order leaves exposure set)"

  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /allocations/{id}/commit"
        actor: InventoryPlanner
        preconditions:
          - "Allocation in RESERVED (ERR_ALLOCATION_INVALID_STATE)"
          - "Lot lifecycle ACTIVE and hold CLEAR (ERR_LOT_INVALID_STATE / ERR_LOT_ON_HOLD)"
          - "Order in CONFIRMED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "Lot: reserved_weight_kg -= qty; committed_weight_kg += qty"
          - "OrderLine.committed_qty_kg recomputed; if all lines fully committed: SalesOrder -> FULFILLED"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /allocations/{id}/release OR system cascade (condemn/expiry/void/regrade/order-cancel)"
        actor: InventoryPlanner | system
        preconditions: ["Allocation in RESERVED (ERR_ALLOCATION_INVALID_STATE)"]
        side_effects: ["Lot: reserved_weight_kg -= qty; available_weight_kg += qty; OrderLine.allocated_qty_kg recomputed"]
      - from: COMMITTED
        to: RELEASED
        trigger: "system cascade only (condemn/expiry/void/regrade/order-cancel)"
        actor: system
        preconditions: []
        side_effects: ["Lot: committed_weight_kg -= qty; available_weight_kg += qty (or condemned/recalled bucket per cascade); OrderLine committed/allocated recomputed; SalesOrder FULFILLED regression evaluated"]

  - entity: Shipment
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOOKED
        trigger: "POST /shipments/{id}/book"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment in QUOTED (ERR_SHIPMENT_INVALID_STATE)"
          - "AIR: sum of booked_weight_kg over shipments in {BOOKED, TENDERED, IN_TRANSIT} with same (flight_number, flight_date) + this booked_weight_kg <= 1000 (ERR_FLIGHT_CAPACITY_EXCEEDED)"
        side_effects: ["Compute chargeable_weight_kg = booked_weight_kg and provisional_freight_cents (freight_charge provisional variant)"]
      - from: BOOKED
        to: TENDERED
        trigger: "POST /shipments/{id}/tender"
        actor: LogisticsCoordinator
        preconditions: ["Shipment in BOOKED (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects: ["Set actual_weight_kg, volume_m3; compute chargeable_weight_kg and final_freight_cents (freight_charge final variant)"]
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/depart"
        actor: LogisticsCoordinator
        preconditions: ["Shipment in TENDERED (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["Shipment in IN_TRANSIT (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects:
          - "For every COMMITTED Allocation on the order's lines: lot.committed_weight_kg -= qty; lot.shipped_weight_kg += qty"
          - "Lots reaching available+reserved+committed == 0 -> DEPLETED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["Shipment in QUOTED | BOOKED (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects: ["Frees flight capacity"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["Frees flight capacity"]

  - entity: ImportDocument
    initial_state: DRAFT
    terminal_states: [CLEARED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /import-documents/{id}/submit"
        actor: ComplianceOfficer
        preconditions: ["Document in DRAFT | REJECTED (ERR_IMPORT_DOC_INVALID_STATE)"]
        side_effects: ["submitted_by_user_id = X-User-ID"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /import-documents/{id}/submit"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["resubmit_count += 1; submitted_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /import-documents/{id}/clear"
        actor: ComplianceOfficer
        preconditions:
          - "Document in SUBMITTED (ERR_IMPORT_DOC_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["reviewed_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /import-documents/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["Document in SUBMITTED (ERR_IMPORT_DOC_INVALID_STATE)"]
        side_effects: []

  - entity: SubstitutionApproval
    initial_state: REQUESTED
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /substitution-approvals/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Record in REQUESTED (ERR_SUBSTITUTION_INVALID_STATE)"
          - "substitute species.substitution_group == original species.substitution_group (ERR_SUBSTITUTION_GROUP_MISMATCH)"
          - "substitute latest PUBLISHED quote price <= line locked unit_price_cents (ERR_SUBSTITUTION_PRICE_INCREASE)"
          - "If substitute.requires_cites: a CLEARED CITES ImportDocument for substitute species exists (ERR_LABELING_NONCOMPLIANT)"
        side_effects: ["decided_by_user_id = X-User-ID"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /substitution-approvals/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["Record in REQUESTED (ERR_SUBSTITUTION_INVALID_STATE)"]
        side_effects: ["decided_by_user_id = X-User-ID"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /substitution-approvals/{id}/apply"
        actor: InventoryPlanner
        preconditions:
          - "Record in APPROVED (ERR_SUBSTITUTION_INVALID_STATE)"
          - "Order in CONFIRMED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "OrderLine.species_id = substitute_species_id; unit_price_cents = substitute selected quote price"
          - "price_credit_cents = round_half_up((old_unit_price - new_unit_price) x requested_qty_kg)"
          - "OrderLine.line_total_cents recomputed (per-line rounding rule); SalesOrder.total_cents -= price_credit_cents"
          - "Customer.credit_exposure_cents recomputed"

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: ticket-line-add-stale-ticket
    parent_entity: DockTicket
    write_endpoint: "POST /landing-lines"
    occ_field: "expected_dock_ticket_version"
    description: |
      Adding a LandingLine to a DockTicket whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just added a line (which legitimately succeeds under the
      product semantics) and the current writer's view of the ticket is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quote-publish-stale-species
    parent_entity: Species
    write_endpoint: "POST /market-quotes/{id}/publish"
    occ_field: "expected_species_version"
    description: |
      Publishing a MarketQuote for a Species whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just published a quote for the same species (which
      legitimately supersedes the prior published quote) and the current
      writer's view of the species quote series is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /allocations"
    occ_field: "expected_sales_order_version"
    description: |
      Creating an Allocation against a SalesOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just allocated against the same order (which
      legitimately succeeds and advances the order version) and the current
      writer's view of the order's remaining quantities is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: dock_line_settlement
    trigger: "POST /landing-lines (provisional variant); POST /grade-assessments/{id}/finalize (final variant)"
    algorithm: aggregation
    formula: |
      Provisional variant (at line creation):
        quote = PUBLISHED MarketQuote with species_id = line.species_id,
                grade = line.declared_grade, quote_date == date(ticket.landing_start_at)
        provisional_amount_cents = round_half_up(landed_weight_kg x quote.price_per_kg_cents)
      Final variant (at assessment finalize):
        quote = PUBLISHED MarketQuote with species_id = line.species_id,
                grade = assessment.assessed_grade, quote_date == date(ticket.landing_start_at)
        final_amount_cents = round_half_up(processed_weight_kg x quote.price_per_kg_cents)
      Ticket aggregates:
        provisional_total_cents = sum of provisional_amount_cents over non-voided lines
        final_total_cents = sum of final_amount_cents over lines with a FINAL assessment
    input_set: "Non-voided LandingLines of the ticket. Settlement quote lookup: the MarketQuote for (species, grade, quote_date == date(landing_start_at)) whose status is IN {PUBLISHED, SUPERSEDED, EXPIRED} (i.e. any quote that reached PUBLISHED at some point — historical pricing survives supersession and expiry); if several match, the one with the greatest quote_date then latest created_at; if none exists -> ERR_QUOTE_NOT_PUBLISHED"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "line creation on a LANDED ticket"
        difference: "uses declared_grade quote and raw landed_weight_kg (no yield, no condition factor)"
      - name: final
        when: "assessment finalize"
        difference: "uses assessed_grade quote and yield-adjusted processed_weight_kg; identical landed weight therefore yields a different amount"

  - name: yield_processing
    trigger: "POST /grade-assessments/{id}/finalize"
    algorithm: constraint_propagation
    formula: |
      condition_factor = 1.00 if assessed_grade == GRADE_A
                         0.97 if assessed_grade == GRADE_B
                         0.92 if assessed_grade == GRADE_C
      processing_factor = 1.00 if processing_type == WHOLE
                          0.85 if processing_type == FILLETED
      processed_weight_kg = round_half_up(
          min(landed_weight_kg,
              landed_weight_kg x yield_pct x condition_factor x processing_factor), 2)
    input_set: "Single LandingLine + its FINALizing GradeAssessment"
    constants:
      GRADE_A_FACTOR: 1.00
      GRADE_B_FACTOR: 0.97
      GRADE_C_FACTOR: 0.92
      WHOLE_FACTOR: 1.00
      FILLETED_FACTOR: 0.85
    precision: "2 decimal places kg, round_half_up"

  - name: freight_charge
    trigger: "POST /shipments/{id}/book (provisional variant); POST /shipments/{id}/tender (final variant)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned; do not reorder:
      1. chargeable_weight_kg = max(actual_weight_kg, round_half_up(volume_m3 x DIM_KG_PER_M3, 2))
         (provisional variant: chargeable_weight_kg = booked_weight_kg, dimensional term = 0)
      2. subtotal_cents = BASE_CENTS[mode] + round_half_up(chargeable_weight_kg x PER_KG_CENTS[mode])
      3. discount_pct = DISCOUNT_PCT if subtotal_cents >= DISCOUNT_TIER_CENTS else 0
         (tier is keyed on the PRE-discount subtotal even when the discounted value falls below the tier)
      4. discounted_cents = round_half_up(subtotal_cents x (1 - discount_pct))
      5. fuel_cents = round_half_up(discounted_cents x FUEL_PCT)   (fuel keyed on discounted, not subtotal)
      6. total_cents = max(MIN_CHARGE_CENTS, discounted_cents + fuel_cents)
    input_set: "Single Shipment"
    constants:
      DIM_KG_PER_M3: 167
      BASE_CENTS_AIR: 5000
      BASE_CENTS_TRUCK: 2500
      PER_KG_CENTS_AIR: 320
      PER_KG_CENTS_TRUCK: 140
      DISCOUNT_TIER_CENTS: 10000
      DISCOUNT_PCT: 0.05
      FUEL_PCT: 0.12
      MIN_CHARGE_CENTS: 4000
    precision: "integer cents, round_half_up; weights 2dp"
    variants:
      - name: provisional
        when: "book transition"
        difference: "chargeable = booked_weight_kg (no dimensional weight); identical mass can price differently than final once volume is known"
      - name: final
        when: "tender transition"
        difference: "chargeable = max(actual, dimensional); overwrites chargeable_weight_kg and produces final_freight_cents"

  - name: order_line_pricing
    trigger: "POST /sales-orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      For each OrderLine (processing order: OrderLine.created_at ASC):
        unit_price_cents = latest_published_quote(species_id, requested_grade, confirm date)
        line_total_cents = round_half_up(requested_qty_kg x unit_price_cents x (1 - customer.discount_pct))
      SalesOrder.total_cents = sum of line_total_cents
      ROUNDING ORDER IS PINNED: round each line to integer cents FIRST, then sum.
      The alternative (sum raw values, round once) yields different cents and is forbidden.
    input_set: "All OrderLines of the order (no status filter — lines carry no status)"
    precision: "integer cents, round_half_up per line"

  - name: latest_published_quote
    trigger: "referenced by order_line_pricing, substitution_credit, substitute_selection"
    algorithm: selector
    formula: |
      Eligibility: MarketQuote with status == PUBLISHED, matching species_id and grade,
                   quote_date <= current logical date.
      Ranking: max quote_date.
      Tie-break: latest created_at.
      Fallback: empty candidate set -> ERR_QUOTE_NOT_PUBLISHED.
      (id is never used for selection; created_at is the only tie-break.)
    input_set: "MarketQuotes for (species, grade)"

  - name: volatility_guard
    trigger: "POST /market-quotes/{id}/publish"
    algorithm: threshold
    formula: |
      prior = current PUBLISHED MarketQuote for same (species_id, grade) with the
              greatest quote_date (tie-break: latest created_at); if none, guard is
              inert and the quote publishes directly.
      volatility_pct = round_half_up(|new.price_per_kg_cents - prior.price_per_kg_cents|
                                     / prior.price_per_kg_cents x 100, 2)
      if volatility_pct >= VOLATILITY_PCT -> target state PENDING_APPROVAL (>= triggers: exactly 10.00 requires approval)
      else -> target state PUBLISHED
    input_set: "PUBLISHED quotes for same species+grade"
    constants:
      VOLATILITY_PCT: 10.00
    precision: "2 decimal places percent, round_half_up"

  - name: shelf_life_clock
    trigger: "InventoryLot creation; POST /inventory-lots/{id}/freeze; POST /_clock/set_current_utc; POST /allocations"
    algorithm: decay_function
    formula: |
      FRESH lot: expires_at = landed_at + species.fresh_shelf_life_hours
      Freeze event (reset): frozen_at = now; expires_at = frozen_at + species.frozen_shelf_life_days
      Allocation gate: hours_between(now, lot.expires_at) >= order_line.min_remaining_shelf_life_hours + allocation.transit_hours
                       (>= passes: exact equality of remaining hours to the requirement is allocatable)
      Expiry sweep (on clock set): if now >= expires_at and lifecycle_status == ACTIVE -> EXPIRED
    input_set: "Single lot + requesting line/allocation; sweep covers all ACTIVE lots"
    precision: "hour granularity for fresh; day granularity for frozen (expires_at = frozen_at + N days exactly)"

  - name: customer_credit_exposure
    trigger: "POST /sales-orders/{id}/confirm; POST /sales-orders/{id}/cancel; POST /substitution-approvals/{id}/apply"
    algorithm: aggregation
    formula: |
      credit_exposure_cents = sum of total_cents over the customer's SalesOrders
                              with status IN {CONFIRMED, FULFILLED, INVOICED}
      Confirm gate: credit_exposure_cents + candidate.total_cents <= credit_limit_cents
                    (<= passes: landing exactly on the limit is permitted)
      DRAFT, SUBMITTED and CANCELLED orders are excluded from the sum.
    input_set: "SalesOrders of the customer in {CONFIRMED, FULFILLED, INVOICED}"
    precision: "integer cents"

  - name: substitution_credit
    trigger: "POST /substitution-approvals/{id}/apply"
    algorithm: aggregation
    formula: |
      new_unit_price = latest_published_quote(substitute_species_id, line.requested_grade, apply date)
      price_credit_cents = round_half_up((line.unit_price_cents - new_unit_price) x line.requested_qty_kg)
      line.unit_price_cents = new_unit_price
      line.line_total_cents = round_half_up(requested_qty_kg x new_unit_price x (1 - customer.discount_pct))
      order.total_cents = order.total_cents - price_credit_cents ... equivalently sum of line totals after repricing
    input_set: "Single OrderLine + its order + customer"
    precision: "integer cents, round_half_up"

  - name: substitute_selection
    trigger: "system cascades (inspection condemn, lot expiry) when a shortage line has allow_substitution == true"
    algorithm: selector
    formula: |
      Eligibility: Species s where s.id != line.species_id,
                   s.substitution_group == line species.substitution_group,
                   at least one InventoryLot of s with lifecycle_status == ACTIVE and hold_status == CLEAR exists,
                   and a PUBLISHED quote for (s, line.requested_grade, quote_date <= current date) exists.
      Ranking: selected quote price_per_kg_cents ASC (cheapest substitute first).
      Tie-break: Species.created_at ASC (never id).
      Fallback: empty candidate set -> no SubstitutionApproval is auto-created (cascade continues silently).
    input_set: "All Species in the same substitution_group"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: VesselAgent may act only on tickets of vessel_id == X-User-ID; Customer only on orders of customer_id == X-User-ID", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /dock-tickets, POST /dock-tickets/{id}/land, POST /sales-orders, POST /sales-orders/{id}/submit, POST /sales-orders/{id}/cancel, POST /order-lines" }
  - { priority: 4, category: existence, check: "Request shape decoded first (required fields present, enums in range, numeric bounds) -> ERR_INVALID_REQUEST 400; then path ids exist (left-to-right), then body FK references (species_id, vessel_id, catch_area_id, dock_ticket_id, landing_line_id, customer_id, sales_order_id, order_line_id, inventory_lot_id, substitute_species_id) exist -> ERR_{RESOURCE}_NOT_FOUND 404", error_id: "ERR_INVALID_REQUEST | ERR_{RESOURCE}_NOT_FOUND", http_status: 400, applies_to: "all endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /landing-lines, POST /market-quotes/{id}/publish, POST /allocations" }
  - { priority: 6, category: state, check: "Target resource in a valid from-state for the requested transition (per-machine)", error_id: "ERR_{MACHINE}_INVALID_STATE", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Lot not ON_HOLD for allocation/freeze/write-off/commit; ticket not settled while derived lot ON_HOLD; segregation-of-duties on volatility approve / import clear / hold release; labeling compliance on substitution approve", error_id: "ERR_LOT_ON_HOLD | ERR_SEGREGATION_OF_DUTIES_VIOLATION | ERR_LABELING_NONCOMPLIANT | ERR_IMPORT_DOCS_NOT_CLEARED", http_status: 409, applies_to: "POST /allocations, POST /allocations/{id}/commit, POST /inventory-lots/{id}/freeze, POST /inventory-lots/{id}/write-off, POST /dock-tickets/{id}/settle, POST /market-quotes/{id}/approve-volatility, POST /import-documents/{id}/clear, POST /inspection-holds/{id}/release, POST /substitution-approvals/{id}/approve" }
  - { priority: 8, category: business_temporal, check: "landing_end_at > landing_start_at; vessel landing window does not overlap another non-VOID ticket of same vessel (half-open [start,end), adjacency allowed); allocation shelf-life gate (hours remaining >= min + transit)", error_id: "ERR_INVALID_LANDING_WINDOW | ERR_VESSEL_LANDING_OVERLAP | ERR_SHELF_LIFE_INSUFFICIENT", http_status: 422, applies_to: "POST /dock-tickets, POST /allocations" }
  - { priority: 9, category: business_constraint, check: "AIR flight capacity aggregate (same flight_number+flight_date, shipments in BOOKED/TENDERED/IN_TRANSIT, + new <= 1000 kg); lot available_weight_kg >= qty; line remaining (requested - allocated) >= qty; species match between line and lot; one active assessment per line; one active hold per lot; regrade_count < 2; uniqueness of registration_number/species_code/fao_code; 0 < yield_pct <= 1; substitution group match; allow_substitution true; order non-empty on submit", error_id: "ERR_FLIGHT_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_LOT_QUANTITY | ERR_LINE_OVER_ALLOCATION | ERR_SPECIES_MISMATCH | ERR_ASSESSMENT_ALREADY_ACTIVE | ERR_HOLD_ALREADY_ACTIVE | ERR_REGRADE_LIMIT_EXCEEDED | ERR_DUPLICATE_UNIQUE_VALUE | ERR_INVALID_YIELD | ERR_SUBSTITUTION_GROUP_MISMATCH | ERR_SUBSTITUTION_NOT_ALLOWED | ERR_ORDER_EMPTY", http_status: 409, applies_to: "various" }
  - { priority: 10, category: business_fiscal, check: "PUBLISHED quote resolvable for pricing/settlement; customer credit limit (exposure + candidate total <= limit); substitute price <= original locked price", error_id: "ERR_QUOTE_NOT_PUBLISHED | ERR_CREDIT_LIMIT_EXCEEDED | ERR_SUBSTITUTION_PRICE_INCREASE", http_status: 402, applies_to: "POST /landing-lines, POST /grade-assessments/{id}/finalize, POST /sales-orders/{id}/confirm, POST /substitution-approvals/{id}/approve" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Configuration entities ---
  - { method: POST, path: "/vessels", description: "Register a vessel", roles: [OperationsManager], code: 201, input: [vessel_name, registration_number, home_port], output: Vessel, side_effects: ["payable_balance_cents = 0"] }
  - { method: GET, path: "/vessels/{id}", description: "Get a vessel", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: Vessel, side_effects: [] }
  - { method: POST, path: "/customers", description: "Register a wholesale customer", roles: [OperationsManager], code: 201, input: [business_name, credit_limit_cents, "discount_pct?"], output: Customer, side_effects: ["credit_exposure_cents = 0"] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/catch-areas", description: "Register an FAO catch area", roles: [OperationsManager], code: 201, input: [fao_code, name, region], output: CatchArea, side_effects: [] }
  - { method: GET, path: "/catch-areas/{id}", description: "Get a catch area", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: CatchArea, side_effects: [] }
  - { method: POST, path: "/species", description: "Register a species", roles: [OperationsManager], code: 201, input: [species_code, common_name, labeling_name, substitution_group, fresh_shelf_life_hours, frozen_shelf_life_days, "is_import?", "requires_cites?"], output: Species, side_effects: [] }
  - { method: GET, path: "/species/{id}", description: "Get a species", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: Species, side_effects: [] }

  # --- MarketQuote ---
  - { method: POST, path: "/market-quotes", description: "Create a daily quote (DRAFT)", roles: [OperationsManager], code: 201, input: [species_id, grade, quote_date, price_per_kg_cents], output: MarketQuote, side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/market-quotes", description: "List quotes with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["species_id?", "grade?", "quote_date?", "status?", "limit?", "offset?"], output: "MarketQuote[]", side_effects: [] }
  - { method: GET, path: "/market-quotes/{id}", description: "Get a quote", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: MarketQuote, side_effects: [] }
  - { method: POST, path: "/market-quotes/{id}/publish", description: "Publish a quote; volatility guard may route to PENDING_APPROVAL; supersedes prior PUBLISHED for same species+grade", roles: [OperationsManager], code: 200, input: [expected_species_version], output: MarketQuote, side_effects: ["volatility_guard calculation", "prior PUBLISHED for same key -> SUPERSEDED (when this reaches PUBLISHED)", "increments Species.version by 1"] }
  - { method: POST, path: "/market-quotes/{id}/approve-volatility", description: "Approve a volatile quote (PENDING_APPROVAL -> PUBLISHED); approver must differ from creator", roles: [OperationsManager], code: 200, input: [], output: MarketQuote, side_effects: ["status -> PUBLISHED; prior PUBLISHED for same key -> SUPERSEDED"] }
  - { method: POST, path: "/market-quotes/{id}/reject-volatility", description: "Reject a volatile quote back to DRAFT", roles: [OperationsManager], code: 200, input: [], output: MarketQuote, side_effects: ["status -> DRAFT"] }

  # --- DockTicket ---
  - { method: POST, path: "/dock-tickets", description: "Create a dock ticket (DRAFT); half-open landing-window overlap check per vessel", roles: [DockBuyer, VesselAgent], code: 201, input: [vessel_id, catch_area_id, landing_start_at, landing_end_at], output: DockTicket, side_effects: ["status = DRAFT; regrade_count = 0"] }
  - { method: GET, path: "/dock-tickets", description: "List dock tickets with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["vessel_id?", "catch_area_id?", "status?", "limit?", "offset?"], output: "DockTicket[]", side_effects: [] }
  - { method: GET, path: "/dock-tickets/{id}", description: "Get a dock ticket", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: DockTicket, side_effects: [] }
  - { method: POST, path: "/dock-tickets/{id}/land", description: "Mark ticket landed (DRAFT -> LANDED)", roles: [DockBuyer, VesselAgent], code: 200, input: [], output: DockTicket, side_effects: ["status -> LANDED", "increments DockTicket.version by 1"] }
  - { method: POST, path: "/dock-tickets/{id}/settle", description: "Settle a graded ticket (GRADED -> SETTLED); import-document and hold gates apply", roles: [OperationsManager], code: 200, input: [], output: DockTicket, side_effects: ["status -> SETTLED", "Vessel.payable_balance_cents += final_total_cents"] }
  - { method: POST, path: "/dock-tickets/{id}/pay", description: "Pay a settled ticket (SETTLED -> PAID)", roles: [OperationsManager], code: 200, input: [], output: DockTicket, side_effects: ["status -> PAID", "Vessel.payable_balance_cents -= final_total_cents"] }
  - { method: POST, path: "/dock-tickets/{id}/void", description: "Void a ticket (DRAFT/LANDED/GRADED/SETTLED -> VOIDED) with full cascade", roles: [OperationsManager], code: 200, input: [], output: DockTicket, side_effects: ["lines voided", "derived lots -> RECALLED", "RESERVED/COMMITTED allocations on those lots -> RELEASED", "SETTLED tickets: Vessel.payable_balance_cents -= final_total_cents"] }
  - { method: POST, path: "/dock-tickets/{id}/request-regrade", description: "Re-open grading (GRADED -> LANDED); supersedes FINAL assessments and recalls derived lots; max 2 regrades", roles: [DockBuyer, OperationsManager], code: 200, input: [], output: DockTicket, side_effects: ["regrade_count += 1", "FINAL assessments -> SUPERSEDED", "derived lots -> RECALLED with allocation release cascade"] }

  # --- LandingLine ---
  - { method: POST, path: "/landing-lines", description: "Add a landing line to a LANDED ticket (OCC on ticket version)", roles: [DockBuyer], code: 201, input: [dock_ticket_id, species_id, declared_grade, landed_weight_kg, "processing_type?", expected_dock_ticket_version], output: LandingLine, side_effects: ["provisional_amount_cents computed (dock_line_settlement provisional)", "ticket.provisional_total_cents recomputed", "increments DockTicket.version by 1"] }
  - { method: GET, path: "/landing-lines", description: "List landing lines with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["dock_ticket_id?", "species_id?", "limit?", "offset?"], output: "LandingLine[]", side_effects: [] }
  - { method: GET, path: "/landing-lines/{id}", description: "Get a landing line", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: LandingLine, side_effects: [] }

  # --- GradeAssessment ---
  - { method: POST, path: "/grade-assessments", description: "Record a grade assessment (DRAFT) for a line of a LANDED ticket; one active assessment per line", roles: [GradingInspector], code: 201, input: [landing_line_id, assessed_grade, yield_pct, "notes?"], output: GradeAssessment, side_effects: ["status = DRAFT; inspector_user_id = X-User-ID"] }
  - { method: POST, path: "/grade-assessments/{id}/finalize", description: "Finalize an assessment; computes processed weight + final amount; creates InventoryLot; may auto-grade the ticket", roles: [GradingInspector], code: 200, input: [], output: GradeAssessment, side_effects: ["status -> FINAL", "yield_processing + dock_line_settlement final", "create InventoryLot", "ticket -> GRADED when all lines FINAL"] }
  - { method: GET, path: "/grade-assessments", description: "List grade assessments with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["landing_line_id?", "status?", "limit?", "offset?"], output: "GradeAssessment[]", side_effects: [] }
  - { method: GET, path: "/grade-assessments/{id}", description: "Get a grade assessment", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: GradeAssessment, side_effects: [] }

  # --- InventoryLot ---
  - { method: GET, path: "/inventory-lots", description: "List inventory lots with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["landing_line_id?", "species_id?", "lifecycle_status?", "hold_status?", "limit?", "offset?"], output: "InventoryLot[]", side_effects: [] }
  - { method: GET, path: "/inventory-lots/{id}", description: "Get an inventory lot", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: POST, path: "/inventory-lots/{id}/freeze", description: "Convert FRESH lot to FROZEN; resets shelf-life clock", roles: [InventoryPlanner], code: 200, input: [], output: InventoryLot, side_effects: ["storage_type -> FROZEN", "frozen_at = now", "expires_at = frozen_at + species.frozen_shelf_life_days"] }
  - { method: POST, path: "/inventory-lots/{id}/write-off", description: "Write off spoiled weight from available bucket", roles: [InventoryPlanner], code: 200, input: [qty_kg, "reason?"], output: InventoryLot, side_effects: ["available_weight_kg -= qty_kg; spoiled_weight_kg += qty_kg", "DEPLETED evaluation"] }

  # --- SalesOrder ---
  - { method: POST, path: "/sales-orders", description: "Create a sales order (DRAFT)", roles: [Customer, OperationsManager], code: 201, input: [customer_id, required_delivery_date], output: SalesOrder, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/sales-orders", description: "List sales orders with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "SalesOrder[]", side_effects: [] }
  - { method: GET, path: "/sales-orders/{id}", description: "Get a sales order", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/sales-orders/{id}/submit", description: "Submit an order (DRAFT -> SUBMITTED); owner customer only", roles: [Customer], code: 200, input: [], output: SalesOrder, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/sales-orders/{id}/confirm", description: "Confirm an order: locks line prices from latest PUBLISHED quotes, computes totals, enforces credit limit", roles: [OperationsManager], code: 200, input: [], output: SalesOrder, side_effects: ["order_line_pricing per line", "total_cents computed", "credit_exposure recomputed", "status -> CONFIRMED"] }
  - { method: POST, path: "/sales-orders/{id}/cancel", description: "Cancel an order (DRAFT/SUBMITTED/CONFIRMED -> CANCELLED); releases allocations", roles: [Customer, OperationsManager], code: 200, input: [], output: SalesOrder, side_effects: ["RESERVED/COMMITTED allocations -> RELEASED with bucket restoration", "credit_exposure recomputed"] }
  - { method: POST, path: "/sales-orders/{id}/invoice", description: "Invoice a fulfilled order (FULFILLED -> INVOICED)", roles: [OperationsManager], code: 200, input: [], output: SalesOrder, side_effects: ["status -> INVOICED"] }

  # --- OrderLine ---
  - { method: POST, path: "/order-lines", description: "Add a line to a DRAFT order", roles: [Customer, OperationsManager], code: 201, input: [sales_order_id, species_id, requested_grade, requested_qty_kg, "min_remaining_shelf_life_hours?", "allow_substitution?"], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/order-lines", description: "List order lines with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["sales_order_id?", "species_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/order-lines/{id}", description: "Get an order line", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: OrderLine, side_effects: [] }

  # --- Allocation ---
  - { method: POST, path: "/allocations", description: "Reserve weight from a lot against an order line (OCC on order version)", roles: [InventoryPlanner], code: 201, input: [order_line_id, inventory_lot_id, qty_kg, transit_hours, expected_sales_order_version], output: Allocation, side_effects: ["lot available -> reserved", "OrderLine.allocated_qty_kg recomputed", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/allocations/{id}/commit", description: "Commit a reservation (RESERVED -> COMMITTED); may auto-fulfill the order", roles: [InventoryPlanner], code: 200, input: [], output: Allocation, side_effects: ["lot reserved -> committed", "OrderLine.committed_qty_kg recomputed", "order -> FULFILLED when all lines fully committed"] }
  - { method: POST, path: "/allocations/{id}/release", description: "Release a reservation (RESERVED -> RELEASED only; COMMITTED releases happen only via cascades)", roles: [InventoryPlanner], code: 200, input: [], output: Allocation, side_effects: ["lot reserved -> available", "OrderLine.allocated_qty_kg recomputed"] }
  - { method: GET, path: "/allocations", description: "List allocations with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["order_line_id?", "inventory_lot_id?", "status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: GET, path: "/allocations/{id}", description: "Get an allocation", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: Allocation, side_effects: [] }

  # --- Shipment ---
  - { method: POST, path: "/shipments", description: "Create a shipment (QUOTED) for a CONFIRMED or FULFILLED order", roles: [LogisticsCoordinator], code: 201, input: [sales_order_id, mode, "flight_number?", "flight_date?", booked_weight_kg, temp_zone], output: Shipment, side_effects: ["status = QUOTED"] }
  - { method: GET, path: "/shipments", description: "List shipments with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["sales_order_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/shipments/{id}", description: "Get a shipment", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/shipments/{id}/book", description: "Book a shipment (QUOTED -> BOOKED); AIR capacity aggregate check; provisional freight", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["chargeable_weight_kg = booked_weight_kg", "provisional_freight_cents computed"] }
  - { method: POST, path: "/shipments/{id}/tender", description: "Tender a booked shipment with actual weight/volume; final freight", roles: [LogisticsCoordinator], code: 200, input: [actual_weight_kg, volume_m3], output: Shipment, side_effects: ["chargeable_weight_kg recomputed", "final_freight_cents computed"] }
  - { method: POST, path: "/shipments/{id}/depart", description: "Depart a tendered shipment (TENDERED -> IN_TRANSIT)", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/shipments/{id}/deliver", description: "Deliver an in-transit shipment; consumes COMMITTED allocations into shipped bucket", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["lot committed -> shipped for all COMMITTED allocations of the order", "lot DEPLETED evaluation"] }
  - { method: POST, path: "/shipments/{id}/cancel", description: "Cancel a QUOTED or BOOKED shipment; frees flight capacity", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: [] }

  # --- ImportDocument ---
  - { method: POST, path: "/import-documents", description: "Create an import document (DRAFT)", roles: [ComplianceOfficer], code: 201, input: [dock_ticket_id, species_id, doc_type, reference_number], output: ImportDocument, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/import-documents", description: "List import documents with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["dock_ticket_id?", "species_id?", "status?", "limit?", "offset?"], output: "ImportDocument[]", side_effects: [] }
  - { method: GET, path: "/import-documents/{id}", description: "Get an import document", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: ImportDocument, side_effects: [] }
  - { method: POST, path: "/import-documents/{id}/submit", description: "Submit a document (DRAFT -> SUBMITTED; REJECTED -> SUBMITTED resubmission)", roles: [ComplianceOfficer], code: 200, input: [], output: ImportDocument, side_effects: ["submitted_by_user_id = X-User-ID", "resubmit_count += 1 when from REJECTED"] }
  - { method: POST, path: "/import-documents/{id}/clear", description: "Clear a submitted document; clearing officer must differ from submitter", roles: [ComplianceOfficer], code: 200, input: [], output: ImportDocument, side_effects: ["status -> CLEARED; reviewed_by_user_id = X-User-ID"] }
  - { method: POST, path: "/import-documents/{id}/reject", description: "Reject a submitted document", roles: [ComplianceOfficer], code: 200, input: [], output: ImportDocument, side_effects: ["status -> REJECTED"] }

  # --- InspectionHold ---
  - { method: POST, path: "/inspection-holds", description: "Place an inspection hold on an ACTIVE CLEAR lot (hold_status -> ON_HOLD)", roles: [ComplianceOfficer], code: 201, input: [inventory_lot_id, reason], output: InspectionHold, side_effects: ["lot hold_status -> ON_HOLD", "placed_by_user_id = X-User-ID", "placed_at = now"] }
  - { method: GET, path: "/inspection-holds", description: "List inspection holds with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["inventory_lot_id?", "status?", "limit?", "offset?"], output: "InspectionHold[]", side_effects: [] }
  - { method: GET, path: "/inspection-holds/{id}", description: "Get an inspection hold", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: InspectionHold, side_effects: [] }
  - { method: POST, path: "/inspection-holds/{id}/release", description: "Release a hold; releasing officer must differ from placing officer", roles: [ComplianceOfficer], code: 200, input: [], output: InspectionHold, side_effects: ["status -> RELEASED", "lot hold_status -> CLEAR", "resolved_by_user_id = X-User-ID"] }
  - { method: POST, path: "/inspection-holds/{id}/condemn", description: "Condemn a held lot; fires the condemn cascade (lot -> allocations -> orders -> auto-substitution)", roles: [ComplianceOfficer], code: 200, input: [], output: InspectionHold, side_effects: ["status -> CONDEMNED", "lot hold_status -> CONDEMNED, weight -> condemned bucket", "allocations RELEASED", "order FULFILLED regression", "auto SubstitutionApproval via selector"] }

  # --- SubstitutionApproval ---
  - { method: POST, path: "/substitution-approvals", description: "Request a species substitution on an order line", roles: [InventoryPlanner], code: 201, input: [order_line_id, substitute_species_id], output: SubstitutionApproval, side_effects: ["status = REQUESTED", "original_species_id = line.species_id", "requested_by_user_id = X-User-ID"] }
  - { method: GET, path: "/substitution-approvals", description: "List substitution approvals with filters", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: ["order_line_id?", "original_species_id?", "substitute_species_id?", "status?", "limit?", "offset?"], output: "SubstitutionApproval[]", side_effects: [] }
  - { method: GET, path: "/substitution-approvals/{id}", description: "Get a substitution approval", roles: [OperationsManager, DockBuyer, VesselAgent, GradingInspector, InventoryPlanner, LogisticsCoordinator, ComplianceOfficer, Customer, Any], code: 200, input: [], output: SubstitutionApproval, side_effects: [] }
  - { method: POST, path: "/substitution-approvals/{id}/approve", description: "Approve a substitution (group match, price non-increase, labeling/CITES compliance)", roles: [ComplianceOfficer], code: 200, input: [], output: SubstitutionApproval, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/substitution-approvals/{id}/reject", description: "Reject a substitution", roles: [ComplianceOfficer], code: 200, input: [], output: SubstitutionApproval, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/substitution-approvals/{id}/apply", description: "Apply an approved substitution: rewrites line species, reprices, credits the order", roles: [InventoryPlanner], code: 200, input: [], output: SubstitutionApproval, side_effects: ["OrderLine.species_id = substitute", "price_credit_cents computed", "order.total_cents reduced", "credit_exposure recomputed"] }

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Advancing the clock fires system transitions: PUBLISHED quotes whose quote_date has passed -> EXPIRED; ACTIVE lots with now >= expires_at -> EXPIRED (with allocation-release and auto-substitution cascades)."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["quote expiry sweep", "lot expiry sweep with cascades"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed role acting on a resource it does not own (VesselAgent vs vessel_id; Customer vs customer_id)" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or invalid enum member" }
  - { id: ERR_INVALID_LANDING_WINDOW, http: 400, condition: "landing_end_at must be strictly after landing_start_at" }
  - { id: ERR_INVALID_YIELD, http: 400, condition: "yield_pct must satisfy 0 < yield_pct <= 1" }
  # --- Not found ---
  - { id: ERR_VESSEL_NOT_FOUND, http: 404, condition: "Vessel id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_CATCH_AREA_NOT_FOUND, http: 404, condition: "CatchArea id does not exist" }
  - { id: ERR_SPECIES_NOT_FOUND, http: 404, condition: "Species id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "MarketQuote id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "DockTicket id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "LandingLine id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "GradeAssessment id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "SalesOrder id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_IMPORT_DOC_NOT_FOUND, http: 404, condition: "ImportDocument id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "InspectionHold id does not exist" }
  - { id: ERR_SUBSTITUTION_NOT_FOUND, http: 404, condition: "SubstitutionApproval id does not exist" }
  # --- State ---
  - { id: ERR_TICKET_INVALID_STATE, http: 409, condition: "DockTicket not in a valid from-state for the requested transition" }
  - { id: ERR_QUOTE_INVALID_STATE, http: 409, condition: "MarketQuote not in a valid from-state for the requested transition" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "GradeAssessment not in a valid from-state for the requested transition" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "InventoryLot lifecycle_status not ACTIVE (or otherwise not valid) for the requested operation" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "SalesOrder not in a valid from-state for the requested transition" }
  - { id: ERR_ALLOCATION_INVALID_STATE, http: 409, condition: "Allocation not in a valid from-state for the requested transition (includes direct release of COMMITTED)" }
  - { id: ERR_SHIPMENT_INVALID_STATE, http: 409, condition: "Shipment not in a valid from-state for the requested transition" }
  - { id: ERR_IMPORT_DOC_INVALID_STATE, http: 409, condition: "ImportDocument not in a valid from-state for the requested transition" }
  - { id: ERR_HOLD_INVALID_STATE, http: 409, condition: "InspectionHold not in a valid from-state for the requested transition" }
  - { id: ERR_SUBSTITUTION_INVALID_STATE, http: 409, condition: "SubstitutionApproval not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- Safety / compliance ---
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same user attempting both sides of a segregated duty (quote create vs volatility approve; import submit vs clear; hold place vs release)" }
  - { id: ERR_IMPORT_DOCS_NOT_CLEARED, http: 409, condition: "Settle blocked: required import documents for an imported species line are not all CLEARED" }
  - { id: ERR_LABELING_NONCOMPLIANT, http: 422, condition: "Substitution approve blocked: substitute requires CITES but no CLEARED CITES document exists for it" }
  - { id: ERR_LOT_ON_HOLD, http: 409, condition: "Operation blocked because the lot (or a derived lot) has hold_status == ON_HOLD" }
  # --- Temporal ---
  - { id: ERR_VESSEL_LANDING_OVERLAP, http: 409, condition: "Landing window [landing_start_at, landing_end_at) overlaps another non-VOID ticket of the same vessel; adjacency (end == start) is allowed" }
  - { id: ERR_SHELF_LIFE_INSUFFICIENT, http: 422, condition: "Lot remaining shelf life < order_line.min_remaining_shelf_life_hours + transit_hours" }
  # --- Constraint ---
  - { id: ERR_FLIGHT_CAPACITY_EXCEEDED, http: 409, condition: "AIR booking would push aggregate booked weight on (flight_number, flight_date) beyond 1000 kg" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 409, condition: "qty_kg exceeds lot available_weight_kg (or write-off qty exceeds available)" }
  - { id: ERR_LINE_OVER_ALLOCATION, http: 409, condition: "qty_kg exceeds line remaining quantity (requested_qty_kg - allocated_qty_kg)" }
  - { id: ERR_SPECIES_MISMATCH, http: 422, condition: "Allocation lot species does not equal order line species" }
  - { id: ERR_ASSESSMENT_ALREADY_ACTIVE, http: 409, condition: "A DRAFT or FINAL GradeAssessment already exists for this landing line" }
  - { id: ERR_HOLD_ALREADY_ACTIVE, http: 409, condition: "A PLACED InspectionHold already exists for this lot" }
  - { id: ERR_REGRADE_LIMIT_EXCEEDED, http: 409, condition: "regrade_count already at 2; further re-grade requests rejected" }
  - { id: ERR_DUPLICATE_UNIQUE_VALUE, http: 409, condition: "registration_number / species_code / fao_code already in use" }
  - { id: ERR_SUBSTITUTION_GROUP_MISMATCH, http: 422, condition: "Substitute species not in the same substitution_group as the original" }
  - { id: ERR_SUBSTITUTION_NOT_ALLOWED, http: 422, condition: "Order line has allow_substitution == false" }
  - { id: ERR_ORDER_EMPTY, http: 422, condition: "Submit requires at least one OrderLine" }
  # --- Fiscal ---
  - { id: ERR_QUOTE_NOT_PUBLISHED, http: 422, condition: "No PUBLISHED quote resolvable for the required (species, grade, date) pricing context" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm would push customer credit exposure beyond credit_limit_cents" }
  - { id: ERR_SUBSTITUTION_PRICE_INCREASE, http: 422, condition: "Substitute's selected quote price exceeds the line's locked unit_price_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Runs the wholesale house: config entities, quotes, settlement, order confirmation, invoicing, clock"
    identity: opaque
    exclusive_operations:
      - "POST /vessels, /customers, /catch-areas, /species"
      - "POST /market-quotes, /market-quotes/{id}/publish, /market-quotes/{id}/approve-volatility, /market-quotes/{id}/reject-volatility"
      - "POST /dock-tickets/{id}/settle, /pay, /void"
      - "POST /sales-orders/{id}/confirm, /invoice"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /sales-orders, /order-lines, /sales-orders/{id}/cancel (shared with Customer)"
      - "POST /dock-tickets/{id}/request-regrade (shared with DockBuyer)"
      - "All GET endpoints"
  - name: DockBuyer
    description: "Buys at the dock: creates tickets and landing lines, requests re-grades"
    identity: opaque
    exclusive_operations:
      - "POST /landing-lines"
    shared_operations:
      - "POST /dock-tickets, /dock-tickets/{id}/land (shared with VesselAgent)"
      - "POST /dock-tickets/{id}/request-regrade (shared with OperationsManager)"
      - "All GET endpoints"
  - name: VesselAgent
    description: "Acts for one vessel: creates/lands that vessel's dock tickets only"
    identity: "entity_backed:Vessel"
    exclusive_operations: []
    shared_operations:
      - "POST /dock-tickets, /dock-tickets/{id}/land — only when ticket vessel_id == X-User-ID"
      - "All GET endpoints"
  - name: GradingInspector
    description: "Records and finalizes grade assessments; creates inventory lots via finalization"
    identity: opaque
    exclusive_operations:
      - "POST /grade-assessments, /grade-assessments/{id}/finalize"
    shared_operations: ["All GET endpoints"]
  - name: InventoryPlanner
    description: "Plans allocations, freezing, write-offs, and substitution requests/applications"
    identity: opaque
    exclusive_operations:
      - "POST /allocations, /allocations/{id}/commit, /allocations/{id}/release"
      - "POST /inventory-lots/{id}/freeze, /inventory-lots/{id}/write-off"
      - "POST /substitution-approvals, /substitution-approvals/{id}/apply"
    shared_operations: ["All GET endpoints"]
  - name: LogisticsCoordinator
    description: "Books and executes cold-chain shipments and air freight"
    identity: opaque
    exclusive_operations:
      - "POST /shipments, /shipments/{id}/book, /tender, /depart, /deliver, /cancel"
    shared_operations: ["All GET endpoints"]
  - name: ComplianceOfficer
    description: "Regulatory gatekeeper: import documents, inspection holds, substitution compliance; segregation-of-duties applies to submit/clear and place/release pairs"
    identity: opaque
    exclusive_operations:
      - "POST /import-documents, /import-documents/{id}/submit, /clear, /reject"
      - "POST /inspection-holds, /inspection-holds/{id}/release, /condemn"
      - "POST /substitution-approvals/{id}/approve, /reject"
    shared_operations: ["All GET endpoints"]
  - name: Customer
    description: "Wholesale buyer acting on its own orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /sales-orders/{id}/submit"
    shared_operations:
      - "POST /sales-orders, /order-lines, /sales-orders/{id}/cancel — only when order customer_id == X-User-ID"
      - "All GET endpoints"
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
