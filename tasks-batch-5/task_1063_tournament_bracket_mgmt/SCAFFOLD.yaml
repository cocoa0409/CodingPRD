scenario: "Amateur Tournament & Bracket Management: event & format (single/double/round-robin/Swiss), registration & seeding, check-in & match-report, bracket & standings, prize/payout & tax, stream/schedule, dispute/admin, venue"
domain_name: tournament-bracket-management
api_prefix: "/"

complexity_profile:
  primary_archetype: graph_constraint          # bracket = DAG of matches; winner/loser advance along edges
  secondary_archetype: temporal_windowing      # match & stream scheduling on shared resources (stations, channels)
  complexity_layers:
    - optimistic_concurrency                    # OCC on Match.version and Tournament.version
    - cascading_side_effects                    # confirm -> advance -> auto-complete round -> payouts
    - dual_variant_calculation                  # payout provisional-vs-final; standings SEED-vs-GAME_DIFF tiebreak
    - derived_field_reconciliation              # standings & alive/eliminated counters derived from matches

  entity_topology: graph
  # graph: Match is self-referential (next_match_id, loser_next_match_id) forming a bracket DAG;
  #        Registration<->Match is many-to-many-ish via home/away/winner/loser FKs.

  state_machine_shape: cyclic
  # Match cycles through DISPUTED -> VOIDED -> PENDING (replay); Dispute forks OPEN -> {UPHELD, REJECTED};
  # Tournament is a longer branching pipeline with a compound COMPLETED gate over child matches.

  relationship_patterns:
    - one_to_many          # Tournament -> Registration/Match/Payout; Venue -> Station
    - many_to_many         # Match references up to four Registrations (home/away/winner/loser)
    - self_referential     # Match.next_match_id / Match.loser_next_match_id -> Match.id
    - cross_aggregate      # StreamAssignment references Match & StreamChannel across aggregates

  role_model: segregation_of_duties
  # Player reports own match; a Referee (not the reporter) must confirm; the Referee who confirmed a
  # match may not resolve its Dispute. Director is the hierarchical override for admin ops.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the venue
      - name: address
        type: string
        source: input
        description: postal address
      - name: open_minute
        type: integer
        source: input
        description: "minutes-after-midnight the venue opens (0..1440); match/stream scheduling must fall within [open_minute, close_minute)"
        constraints: "0 <= open_minute < close_minute <= 1440"
      - name: close_minute
        type: integer
        source: input
        description: "minutes-after-midnight the venue closes"
        constraints: "0 < close_minute <= 1440"

  - name: Station
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this station physically belongs to"
      - name: label
        type: string
        source: input
        description: "human label e.g. 'Table 3' / 'Court A'"

  - name: StreamChannel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: channel display name
      - name: platform
        type: enum
        source: input
        description: streaming platform
        constraints: "one of {TWITCH, YOUTUBE, FACEBOOK}"

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: public handle
      - name: email
        type: string
        source: input
        description: contact email; unique across players
        constraints: "unique"
      - name: rating
        type: integer
        source: input
        description: skill rating used for RATING seeding
        default: 1000
      - name: tax_id_provided
        type: boolean
        source: input
        description: "whether the player supplied a taxpayer id; drives backup-withholding rate on payouts"
        default: false

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: tournament title
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; where matches are physically played"
      - name: format
        type: enum
        source: input
        description: bracket format
        constraints: "one of {SINGLE_ELIM, DOUBLE_ELIM, ROUND_ROBIN, SWISS}"
      - name: status
        type: enum
        source: system
        description: "lifecycle state (see §1.2)"
        default: DRAFT
        constraints: "one of {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED, BRACKET_READY, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: max_participants
        type: integer
        source: input
        description: "hard capacity; the (max_participants)-th REGISTERED entry is accepted, the next is rejected"
        constraints: ">= 2"
      - name: seeding_method
        type: enum
        source: input
        description: how initial seeds are assigned at bracket generation
        default: RATING
        constraints: "one of {RATING, RANDOM_STABLE, MANUAL}"
      - name: tiebreak_method
        type: enum
        source: input
        description: "standings tiebreak among equal match-points (see §1.3 standings_ranking); SEED vs GAME_DIFF diverge"
        default: SEED
        constraints: "one of {SEED, GAME_DIFF}"
      - name: swiss_rounds
        type: integer
        source: input
        description: "number of Swiss rounds; required when format==SWISS, ignored otherwise"
        default: 0
      - name: num_swiss_rounds_played
        type: integer
        source: system
        description: Swiss rounds already generated
        default: 0
      - name: prize_pool_cents
        type: integer
        source: input
        description: total prize money in cents
        constraints: ">= 0"
      - name: paid_places
        type: integer
        source: input
        description: "number of top placements that receive a payout; selects the PAYOUT_PCT row (see §1.3)"
        default: 2
        constraints: "1 <= paid_places <= 4"
      - name: payout_variant
        type: enum
        source: system
        description: "which payout run is current: PROVISIONAL (projected at BRACKET_READY) or FINAL (actual at COMPLETED)"
        default: NONE
        constraints: "one of {NONE, PROVISIONAL, FINAL}"
      - name: unallocated_prize_cents
        type: integer
        source: computed
        description: "prize money not currently held by a non-VOID payout; upheld by the money-conservation invariant (§1.3 payout_allocation)"
        default: 0
      - name: registration_open_at
        type: datetime
        source: input
        description: when registration opens (informational window bound)
      - name: registration_close_at
        type: datetime
        source: input
        description: when registration closes
      - name: check_in_deadline
        type: datetime
        source: input
        description: "logical-clock instant at/after which check-in is rejected; boundary is inclusive (now <= deadline accepted)"
      - name: registered_count
        type: integer
        source: computed
        description: "count of Registration where status IN {REGISTERED, CHECKED_IN}"
        default: 0
      - name: checked_in_count
        type: integer
        source: computed
        description: "count of Registration where status == CHECKED_IN"
        default: 0
      - name: alive_count
        type: integer
        source: computed
        description: "count of CHECKED_IN registrations not yet eliminated; alive_count + eliminated_count == checked_in_count (§1.3 bracket_participant_conservation)"
        default: 0
      - name: eliminated_count
        type: integer
        source: computed
        description: count of checked-in registrations eliminated from the bracket
        default: 0

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the tournament entered"
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player entering"
      - name: status
        type: enum
        source: system
        description: "registration lifecycle (see §1.2)"
        default: REGISTERED
        constraints: "one of {REGISTERED, CHECKED_IN, WITHDRAWN, ELIMINATED, CHAMPION}"
      - name: seed
        type: integer
        source: computed
        description: "1-based seed assigned at bracket generation per Tournament.seeding_method; null until BRACKET_READY"
      - name: seed_input
        type: integer
        source: input
        description: "requested manual seed; only honored when Tournament.seeding_method==MANUAL"
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock time of check-in; null until checked in
      - name: eliminated
        type: boolean
        source: system
        description: "true once the registration has lost and cannot advance (double-elim: after losers-bracket loss)"
        default: false
      - name: final_placement
        type: integer
        source: system
        description: "1-based finishing rank; set at COMPLETED; drives FINAL payout"

  - name: Match
    parent: null
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the tournament this match belongs to"
      - name: bracket
        type: enum
        source: system
        description: "which sub-bracket"
        constraints: "one of {MAIN, WINNERS, LOSERS, GRAND_FINAL}"
      - name: round_number
        type: integer
        source: system
        description: 1-based round index within its bracket
      - name: slot_index
        type: integer
        source: system
        description: 0-based position of the match within its round
      - name: home_registration_id
        type: string
        source: system
        description: "FK -> Registration.id; home competitor; null until fed by a prior match or seeding"
      - name: away_registration_id
        type: string
        source: system
        description: "FK -> Registration.id; away competitor; null until fed"
      - name: home_score
        type: integer
        source: input
        description: "games won by home in a best-of-N; set on report"
        default: 0
      - name: away_score
        type: integer
        source: input
        description: games won by away; set on report
        default: 0
      - name: winner_registration_id
        type: string
        source: system
        description: "FK -> Registration.id; set on CONFIRMED"
      - name: loser_registration_id
        type: string
        source: system
        description: "FK -> Registration.id; set on CONFIRMED"
      - name: next_match_id
        type: string
        source: system
        description: "FK -> Match.id; where the winner advances (self-referential bracket edge); null for the final"
      - name: next_slot
        type: enum
        source: system
        description: "which slot of next_match the winner fills"
        constraints: "one of {HOME, AWAY}"
      - name: loser_next_match_id
        type: string
        source: system
        description: "FK -> Match.id; double-elim loser drop edge; null otherwise"
      - name: loser_next_slot
        type: enum
        source: system
        description: "which slot of loser_next_match the loser fills"
        constraints: "one of {HOME, AWAY}"
      - name: status
        type: enum
        source: system
        description: "match lifecycle (see §1.2)"
        default: PENDING
        constraints: "one of {PENDING, SCHEDULED, REPORTED, CONFIRMED, DISPUTED, VOIDED}"
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station scheduled to play the match; null until SCHEDULED"
      - name: scheduled_start
        type: datetime
        source: input
        description: half-open interval start on the station
      - name: scheduled_end
        type: datetime
        source: input
        description: half-open interval end on the station; end > start
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID that submitted the report (opaque or a Player id)
      - name: confirmed_by_user_id
        type: string
        source: system
        description: X-User-ID (a Referee) that confirmed; must differ from reported_by_user_id (SoD)

  - name: StreamAssignment
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the match being broadcast"
      - name: channel_id
        type: string
        source: input
        description: "FK -> StreamChannel.id; the channel carrying it"
      - name: start_at
        type: datetime
        source: input
        description: closed-interval broadcast start on the channel
      - name: end_at
        type: datetime
        source: input
        description: closed-interval broadcast end; end > start
      - name: status
        type: enum
        source: system
        description: "assignment state; set to CANCELLED when the broadcast match is VOIDED (cascade)"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED}"

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the tournament paying out"
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the finisher receiving this payout; null for a projected PROVISIONAL slot with no known finisher"
      - name: placement
        type: integer
        source: system
        description: 1-based placement this payout rewards
      - name: variant
        type: enum
        source: system
        description: "PROVISIONAL (projected from seeds) or FINAL (actual placement)"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: gross prize for this placement (see §1.3 payout_allocation)
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: backup withholding on this payout (see §1.3 tax_withholding)
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - tax_withheld_cents
      - name: status
        type: enum
        source: system
        description: payout lifecycle
        default: PENDING
        constraints: "one of {PENDING, PAID, VOID}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the disputed match"
      - name: raised_by_registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the competitor raising the dispute"
      - name: reason
        type: string
        source: input
        description: free-text dispute reason
      - name: status
        type: enum
        source: system
        description: dispute lifecycle (see §1.2)
        default: OPEN
        constraints: "one of {OPEN, UPHELD, REJECTED}"
      - name: resolution_note
        type: string
        source: input
        description: referee note recorded at resolution; null while OPEN
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID (Referee/Director) that resolved; must differ from the disputed match's confirmed_by_user_id (SoD)"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Tournament
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /tournaments/{id}/open-registration"
        actor: Director
        preconditions: ["tournament.status == DRAFT", "venue exists"]
        side_effects: ["stamp registration_open_at from body if provided"]
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /tournaments/{id}/close-registration"
        actor: Director
        preconditions: ["tournament.status == REGISTRATION_OPEN"]
        side_effects: ["no new registrations accepted afterward"]
      - from: REGISTRATION_CLOSED
        to: BRACKET_READY
        trigger: "POST /tournaments/{id}/generate-bracket"
        actor: Director
        preconditions:
          - "tournament.status == REGISTRATION_CLOSED"
          - "checked_in_count >= 2"
          - "for SWISS, swiss_rounds >= 1"
        side_effects:
          - "assign seed on every CHECKED_IN registration per seeding_method (§1.3 seeding_assignment)"
          - "set WITHDRAWN/REGISTERED (not-checked-in) registrations aside; only CHECKED_IN enter the bracket"
          - "create Match rows wiring next_match_id/loser_next_match_id per format (§1.3 bracket_generation)"
          - "initialize alive_count = checked_in_count, eliminated_count = 0"
          - "run PROVISIONAL payout: create Payout(variant=PROVISIONAL) rows from projected seed placements; set payout_variant=PROVISIONAL (§1.3 payout_allocation)"
      - from: BRACKET_READY
        to: IN_PROGRESS
        trigger: "POST /tournaments/{id}/start"
        actor: Director
        preconditions: ["tournament.status == BRACKET_READY"]
        side_effects: ["round-1 matches with both slots filled become eligible to SCHEDULE"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /tournaments/{id}/complete"
        actor: Director
        preconditions:
          - "tournament.status == IN_PROGRESS"
          - "expected_tournament_version matches (OCC)"
          - "every Match is terminal (status IN {CONFIRMED, VOIDED}); no PENDING/SCHEDULED/REPORTED/DISPUTED match remains  [cross-entity: Tournament depends on all Match states]"
        side_effects:
          - "assign final_placement to every CHECKED_IN registration (§1.3 final_placement_ranking); champion registration -> status CHAMPION"
          - "VOID all PROVISIONAL payouts; run FINAL payout: create Payout(variant=FINAL) from actual placements (§1.3 payout_allocation); set payout_variant=FINAL"
          - "recompute unallocated_prize_cents"
          - "increments Tournament.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tournaments/{id}/cancel"
        actor: Director
        preconditions: ["tournament.status IN {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}"]
        side_effects: ["VOID any PROVISIONAL payouts; recompute unallocated_prize_cents = prize_pool_cents"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /tournaments/{id}/cancel"
        actor: Director
        preconditions: ["tournament.status IN {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}"]
        side_effects: ["cascade: set all non-terminal Registrations to WITHDRAWN"]
      - from: REGISTRATION_CLOSED
        to: CANCELLED
        trigger: "POST /tournaments/{id}/cancel"
        actor: Director
        preconditions: ["tournament.status IN {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}"]
        side_effects: ["cascade: set all non-terminal Registrations to WITHDRAWN"]

  - entity: Registration
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, ELIMINATED, CHAMPION]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /registrations/{id}/check-in"
        actor: Player
        preconditions:
          - "tournament.status == REGISTRATION_CLOSED  [cross-entity: Registration depends on Tournament state]"
          - "now <= tournament.check_in_deadline (inclusive boundary)"
          - "registration.status == REGISTERED"
        side_effects: ["set checked_in_at = now", "increment tournament.checked_in_count"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: Player
        preconditions: ["registration.status IN {REGISTERED, CHECKED_IN}", "tournament.status != IN_PROGRESS"]
        side_effects: ["decrement tournament.registered_count; if was CHECKED_IN decrement checked_in_count"]
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: Player
        preconditions: ["registration.status IN {REGISTERED, CHECKED_IN}", "tournament.status != IN_PROGRESS"]
        side_effects: ["decrement checked_in_count"]
      - from: CHECKED_IN
        to: ELIMINATED
        trigger: "system: match CONFIRMED sets this registration as loser (single-elim) or second loss (double-elim)"
        actor: system
        preconditions: ["registration is the loser of a CONFIRMED match with no surviving bracket path"]
        side_effects: ["set eliminated=true; decrement tournament.alive_count; increment tournament.eliminated_count"]
      - from: ELIMINATED
        to: CHECKED_IN
        trigger: "system: dispute UPHELD voids the eliminating match"
        actor: system
        preconditions: ["the CONFIRMED match that eliminated this registration is being VOIDED by an UPHELD dispute"]
        side_effects: ["set eliminated=false; increment alive_count; decrement eliminated_count (compensating; §1.3 bracket_participant_conservation)"]
      - from: CHECKED_IN
        to: CHAMPION
        trigger: "POST /tournaments/{id}/complete"
        actor: system
        preconditions: ["registration is the unique final_placement==1 finisher"]
        side_effects: ["set final_placement=1"]

  - entity: Match
    initial_state: PENDING
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /matches/{id}/schedule"
        actor: Referee
        preconditions:
          - "match.status == PENDING"
          - "tournament.status == IN_PROGRESS"
          - "both home_registration_id and away_registration_id are non-null"
          - "both competitors are Registration.status == CHECKED_IN  [cross-entity: Match depends on Registration state]"
          - "station.venue_id == tournament.venue_id  [referential]"
          - "scheduled window within venue open hours"
          - "no station overlap incl. STATION_TURNOVER_MINUTES buffer (§1.3 station_overlap)"
        side_effects: ["set station_id, scheduled_start, scheduled_end"]
      - from: SCHEDULED
        to: REPORTED
        trigger: "POST /matches/{id}/report"
        actor: Player | Referee
        preconditions:
          - "match.status == SCHEDULED"
          - "home_score != away_score (no ties permitted in bracket play)"
          - "reporter is a competitor of the match OR a Referee"
        side_effects: ["set home_score, away_score, reported_by_user_id"]
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /matches/{id}/confirm"
        actor: Referee | Director
        preconditions:
          - "match.status == REPORTED"
          - "expected_match_version matches (OCC)"
          - "confirming user_id != reported_by_user_id (SoD)"
        side_effects:
          - "set winner_registration_id (higher score), loser_registration_id, confirmed_by_user_id"
          - "increments Match.version by 1"
          - "CASCADE advance winner: write winner into next_match.(next_slot); if that fills both slots on next_match it becomes eligible to schedule"
          - "double-elim: drop loser into loser_next_match.(loser_next_slot); single-elim/round-robin/final: loser Registration -> ELIMINATED (alive_count--, eliminated_count++)"
          - "if this was the final (next_match_id null and bracket in {MAIN, GRAND_FINAL}) mark winner path toward champion"
      - from: REPORTED
        to: DISPUTED
        trigger: "system: POST /disputes creates an OPEN dispute on this REPORTED match"
        actor: system
        preconditions: ["match.status == REPORTED", "no existing OPEN dispute on this match"]
        side_effects: ["freeze match; confirm is blocked while DISPUTED"]
      - from: DISPUTED
        to: REPORTED
        trigger: "system: dispute REJECTED"
        actor: system
        preconditions: ["dispute.status transitions OPEN->REJECTED"]
        side_effects: ["unfreeze; match returns to REPORTED and may be confirmed"]
      - from: DISPUTED
        to: VOIDED
        trigger: "system: dispute UPHELD on a still-REPORTED (unconfirmed) match"
        actor: system
        preconditions: ["dispute.status transitions OPEN->UPHELD", "match.status == DISPUTED"]
        side_effects: ["clear scores; match VOIDED", "cascade: any SCHEDULED StreamAssignment for this match -> CANCELLED"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "system: dispute UPHELD on an already-CONFIRMED match"
        actor: system
        preconditions: ["dispute.status transitions OPEN->UPHELD", "match.status == CONFIRMED"]
        side_effects:
          - "CASCADE compensation: pull the advanced winner back out of next_match.(next_slot) (that next match reverts toward PENDING if it loses a slot)"
          - "revert loser Registration ELIMINATED -> CHECKED_IN (alive_count++, eliminated_count--)"
          - "clear winner_registration_id/loser_registration_id/scores; match VOIDED"
          - "cascade: any SCHEDULED StreamAssignment for this match -> CANCELLED"
      - from: VOIDED
        to: PENDING
        trigger: "POST /matches/{id}/replay"
        actor: Referee | Director
        preconditions: ["match.status == VOIDED", "both competitor slots still populated"]
        side_effects: ["reset to PENDING for re-scheduling (cycle)"]

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve {outcome: UPHELD}"
        actor: Referee | Director
        preconditions:
          - "dispute.status == OPEN"
          - "expected_match_version matches the disputed match (OCC)"
          - "resolving user_id != match.confirmed_by_user_id (SoD; only meaningful when match already CONFIRMED)"
        side_effects:
          - "record resolved_by_user_id, resolution_note"
          - "CASCADE: disputed Match REPORTED->VOIDED or CONFIRMED->VOIDED (see Match); increments Match.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve {outcome: REJECTED}"
        actor: Referee | Director
        preconditions:
          - "dispute.status == OPEN"
          - "expected_match_version matches the disputed match (OCC)"
        side_effects:
          - "record resolved_by_user_id, resolution_note"
          - "CASCADE: disputed Match DISPUTED->REPORTED (unfreeze); increments Match.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =====================================================================
concurrency_rules:
  - rule_id: confirm-match-stale-version
    parent_entity: Match
    write_endpoint: "POST /matches/{id}/confirm"
    occ_field: "expected_match_version"
    description: |
      Confirming a Match whose version has advanced since the client last
      observed it is rejected. A dispute resolution or a prior confirm may have
      moved the match (REPORTED->DISPUTED->REPORTED, or bumped its version),
      so a confirm carrying a stale expected_match_version is refused rather
      than acting on an outdated view.
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412
  - rule_id: complete-tournament-stale-version
    parent_entity: Tournament
    write_endpoint: "POST /tournaments/{id}/complete"
    occ_field: "expected_tournament_version"
    description: |
      Completing a Tournament whose version has advanced since the client last
      observed it is rejected. Bracket generation and payout cascades bump the
      tournament version; a complete carrying a stale expected_tournament_version
      is refused so the FINAL payout run never executes against a stale view.
    error_id: ERR_STALE_TOURNAMENT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: seeding_assignment
    trigger: "POST /tournaments/{id}/generate-bracket (Tournament REGISTRATION_CLOSED->BRACKET_READY)"
    algorithm: weighted_scoring
    formula: |
      candidates = Registration where tournament_id == T.id AND status == CHECKED_IN
      if seeding_method == RATING:
        order = sort candidates by (player.rating DESC, created_at ASC)   # created_at is the only tie-break; never id
      elif seeding_method == MANUAL:
        order = sort candidates by (seed_input ASC, created_at ASC)
      elif seeding_method == RANDOM_STABLE:
        order = sort candidates by (created_at ASC)                       # deterministic "random" = insertion order
      for i, reg in enumerate(order): reg.seed = i + 1
    input_set: "only CHECKED_IN registrations of the tournament; REGISTERED/WITHDRAWN excluded"
    constants: {}
    precision: "integer seeds 1..checked_in_count"

  - name: bracket_generation
    trigger: "POST /tournaments/{id}/generate-bracket"
    algorithm: topological
    formula: |
      SINGLE_ELIM: standard seeded single-elimination bracket over the next power of two >= N
        (byes given to top seeds). Match.next_match_id wires winner up the tree; final has next_match_id null.
        Seed pairing per round uses the canonical bracket order (1 vs N, 2 vs N-1, ...).
      DOUBLE_ELIM: winners bracket as above; each winners loss drops to a losers-bracket match via
        loser_next_match_id; GRAND_FINAL fed by winners-final winner (HOME) and losers-final winner (AWAY).
      ROUND_ROBIN: one MAIN-bracket match for every unordered pair (N*(N-1)/2 matches), round_number by circle method.
        HOME/AWAY is pinned: the LOWER-seeded registration is home, the higher-seeded is away (deterministic; never random/id).
      SWISS: only round 1 generated now (pairing top-half vs bottom-half by seed; lower seed is home); later rounds not auto-generated.
    input_set: "seeded CHECKED_IN registrations"
    constants: {}
    precision: "integer match counts"

  - name: standings_ranking
    trigger: "GET /tournaments/{id}/standings (read); also final_placement_ranking at COMPLETED"
    algorithm: weighted_scoring
    formula: |
      For each CHECKED_IN registration r over CONFIRMED matches it played:
        wins   = count matches where winner_registration_id == r.id
        losses = count matches where loser_registration_id == r.id
        match_points = wins*MATCH_WIN_POINTS + losses*MATCH_LOSS_POINTS
        games_for     = sum of r's score across its CONFIRMED matches (home_score if r home else away_score)
        games_against = sum of opponent score across those matches
        game_diff     = games_for - games_against
      Rank by: (match_points DESC, then tiebreak):
        tiebreak_method == SEED:      seed ASC
        tiebreak_method == GAME_DIFF: game_diff DESC, then seed ASC
      # created_at is the ultimate fallback if seed is null; id is never used.
    input_set: "CONFIRMED matches only; PENDING/SCHEDULED/REPORTED/DISPUTED/VOIDED excluded"
    constants:
      MATCH_WIN_POINTS: 3
      MATCH_DRAW_POINTS: 1
      MATCH_LOSS_POINTS: 0
    precision: "integer points; deterministic total order"
    variants:
      - name: seed_tiebreak
        when: "tiebreak_method == SEED"
        difference: "ties on match_points broken by seed ASC only (ignores game_diff)"
      - name: game_diff_tiebreak
        when: "tiebreak_method == GAME_DIFF"
        difference: "ties on match_points broken by game_diff DESC first; can rank a lower seed above a higher seed"

  - name: final_placement_ranking
    trigger: "POST /tournaments/{id}/complete (side effect)"
    algorithm: topological
    formula: |
      ELIM formats: placement derived from elimination round — champion=1, runner-up=2,
        the two semifinal losers share 3-4 (assign by standings_ranking tiebreak among them), etc.
      ROUND_ROBIN / SWISS: placement = standings_ranking order (1-based).
      final_placement is dense 1..checked_in_count with tiebreak_method resolving equals.
    input_set: "all CHECKED_IN registrations"
    constants: {}
    precision: integer placements

  - name: payout_allocation
    trigger: "PROVISIONAL at generate-bracket; FINAL at complete"
    algorithm: waterfall_allocation
    formula: |
      places = paid_places
      pct_row = PAYOUT_PCT[places]                        # e.g. PAYOUT_PCT[2] = [0.70, 0.30]
      # (b) ROUNDING ORDER IS PINNED: round each placement's gross independently, then push the
      #     leftover remainder to placement 1 — NOT sum-then-round.
      for p in 1..places:
        gross[p] = round_half_up(prize_pool_cents * pct_row[p-1])   # integer cents
      remainder = prize_pool_cents - sum(gross[1..places])
      gross[1] += remainder                                 # first place absorbs rounding remainder
      # placement -> registration:
      #   PROVISIONAL: projected finisher = seed p (registration whose seed == p); may be null if unknown
      #   FINAL: registration whose final_placement == p
      for each created Payout(placement=p): gross_amount_cents = gross[p]; run tax_withholding; status=PENDING
      unallocated_prize_cents = prize_pool_cents - sum(gross_amount_cents of Payout where status != VOID)
    input_set: "top `paid_places` placements; PROVISIONAL uses seed projection, FINAL uses actual final_placement"
    constants:
      PAYOUT_PCT: "{1: [1.00], 2: [0.70, 0.30], 3: [0.50, 0.30, 0.20], 4: [0.40, 0.30, 0.20, 0.10]}"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_projection
        when: "Tournament BRACKET_READY (payout_variant PROVISIONAL)"
        difference: "placement->registration by seed projection (seed 1 = 1st); amounts are estimates and are VOIDed at complete"
      - name: final_actual
        when: "Tournament COMPLETED (payout_variant FINAL)"
        difference: "placement->registration by actual final_placement; can differ from provisional whenever a lower seed finishes higher"

  - name: tax_withholding
    trigger: "per Payout row during payout_allocation"
    algorithm: threshold
    formula: |
      rate = (player.tax_id_provided == true) ? TAX_RATE_WITH_ID : TAX_RATE_NO_ID
      tax_withheld_cents = round_half_up(gross_amount_cents * rate)     # rounded PER PAYOUT, not on the summed pool
      net_amount_cents   = gross_amount_cents - tax_withheld_cents
    input_set: "each Payout row individually; rounding applied per row"
    constants:
      TAX_RATE_NO_ID: 0.24
      TAX_RATE_WITH_ID: 0.00
    precision: "integer cents, round_half_up"

  - name: station_overlap
    trigger: "POST /matches/{id}/schedule"
    algorithm: interval_merge
    formula: |
      For the target station S and proposed half-open interval [start, end):
        conflict if exists another Match M2 (status IN {SCHEDULED, REPORTED, CONFIRMED, DISPUTED})
        on station S with [m2.start, m2.end) such that:
          start < (m2.end + STATION_TURNOVER_MINUTES minutes) AND m2.start < (end + STATION_TURNOVER_MINUTES minutes)
      # Buffer applies on BOTH sides; two matches exactly STATION_TURNOVER_MINUTES apart do NOT conflict
      # (gap must be >= buffer). Half-open: back-to-back with 0 gap conflicts.
    input_set: "matches on the same station in non-terminal-or-confirmed states; VOIDED excluded"
    constants:
      STATION_TURNOVER_MINUTES: 15
    precision: "minute-granular datetime comparison"

  - name: stream_overlap
    trigger: "POST /stream-assignments"
    algorithm: interval_merge
    formula: |
      For the target channel C and proposed CLOSED interval [start_at, end_at]:
        conflict if exists another StreamAssignment A2 (status == SCHEDULED) on channel C with
        [a2.start, a2.end] such that start_at < a2.end AND a2.start < end_at
      # Closed intervals but touching endpoints allowed: A ends exactly when B starts => NO conflict
      # (strict < comparisons). NO buffer (contrast with station_overlap).
    input_set: "SCHEDULED assignments on the same channel; CANCELLED excluded"
    constants: {}
    precision: "second-granular datetime comparison"

  - name: bracket_participant_conservation
    trigger: "invariant checked after every Match confirm/void cascade"
    algorithm: aggregation
    formula: |
      alive_count + eliminated_count == checked_in_count      # conserved: participant headcount
      # confirm: exactly one CHECKED_IN loser -> ELIMINATED (alive--, eliminated++)
      # UPHELD-dispute void of an eliminating match: exactly one ELIMINATED -> CHECKED_IN (alive++, eliminated--)
      # a confirm followed by its compensating void leaves alive_count/eliminated_count unchanged.
    input_set: "CHECKED_IN registrations of the tournament"
    constants: {}
    precision: integer headcount

  - name: money_conservation
    trigger: "invariant checked after every Payout create/void"
    algorithm: aggregation
    formula: |
      sum(Payout.gross_amount_cents where status != VOID) + Tournament.unallocated_prize_cents == prize_pool_cents
      # conserved: prize money in cents.
      # VOIDing a payout returns its gross to unallocated_prize_cents; the PROVISIONAL->FINAL switch
      # VOIDs all provisional rows (their gross returns to the pool) before FINAL rows are created.
    input_set: "non-VOID Payout rows of the tournament"
    constants: {}
    precision: "integer cents"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except public GETs and POST /players, POST /registrations (self-register)"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body id resolves to an entity, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "target resource is in a state that permits this transition (§1.2 from/preconditions); POST /registrations requires its Tournament.status == REGISTRATION_OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints and POST /registrations"
  - priority: 5
    category: state
    check: "check-in target Registration.status == REGISTERED and its Tournament.status == REGISTRATION_CLOSED (cross-entity state)"
    error_id: ERR_TOURNAMENT_NOT_IN_CHECKIN
    http_status: 409
    applies_to: "POST /registrations/{id}/check-in"
  - priority: 6
    category: business_temporal
    check: "check-in occurs at now <= check_in_deadline (inclusive); now > deadline rejected"
    error_id: ERR_CHECKIN_CLOSED
    http_status: 409
    applies_to: "POST /registrations/{id}/check-in"
  - priority: 7
    category: business_referential
    check: "scheduled station.venue_id == tournament.venue_id"
    error_id: ERR_STATION_WRONG_VENUE
    http_status: 409
    applies_to: "POST /matches/{id}/schedule"
  - priority: 8
    category: business_safety
    check: "SoD: match confirm by a user_id != reported_by_user_id"
    error_id: ERR_SOD_SELF_CONFIRM
    http_status: 409
    applies_to: "POST /matches/{id}/confirm"
  - priority: 9
    category: business_safety
    check: "SoD: dispute resolve by a user_id != disputed match.confirmed_by_user_id"
    error_id: ERR_SOD_CONFIRMER_RESOLVE
    http_status: 409
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 10
    category: business_constraint
    check: "both competitors of a match to be scheduled are Registration.status == CHECKED_IN (cross-entity)"
    error_id: ERR_COMPETITOR_NOT_CHECKED_IN
    http_status: 409
    applies_to: "POST /matches/{id}/schedule"
  - priority: 11
    category: business_constraint
    check: "reported home_score != away_score (no ties in bracket play)"
    error_id: ERR_TIE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /matches/{id}/report"
  - priority: 12
    category: business_constraint
    check: "reporter is a competitor of the match or a Referee"
    error_id: ERR_NOT_A_COMPETITOR
    http_status: 403
    applies_to: "POST /matches/{id}/report"
  - priority: 13
    category: business_temporal
    check: "scheduled window falls within venue [open_minute, close_minute) and end > start"
    error_id: ERR_OUTSIDE_VENUE_HOURS
    http_status: 422
    applies_to: "POST /matches/{id}/schedule"
  - priority: 14
    category: business_temporal
    check: "no station time-overlap incl. STATION_TURNOVER_MINUTES buffer (§1.3 station_overlap)"
    error_id: ERR_STATION_OVERLAP
    http_status: 409
    applies_to: "POST /matches/{id}/schedule"
  - priority: 15
    category: business_temporal
    check: "no stream channel overlap for closed interval (§1.3 stream_overlap)"
    error_id: ERR_CHANNEL_OVERLAP
    http_status: 409
    applies_to: "POST /stream-assignments"
  - priority: 16
    category: business_constraint
    check: "stream assignment target Match.status IN {SCHEDULED, REPORTED, CONFIRMED, DISPUTED} (cross-entity: not PENDING/VOIDED)"
    error_id: ERR_MATCH_NOT_SCHEDULABLE_STREAM
    http_status: 409
    applies_to: "POST /stream-assignments"
  - priority: 17
    category: business_constraint
    check: "registration capacity: at most max_participants REGISTERED/CHECKED_IN entries; the (max_participants+1)-th is rejected"
    error_id: ERR_TOURNAMENT_FULL
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 18
    category: business_constraint
    check: "a Player may hold at most one non-terminal Registration per Tournament"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 19
    category: business_constraint
    check: "generate-bracket requires checked_in_count >= 2 (and swiss_rounds >= 1 for SWISS)"
    error_id: ERR_INSUFFICIENT_PARTICIPANTS
    http_status: 409
    applies_to: "POST /tournaments/{id}/generate-bracket"
  - priority: 20
    category: business_constraint
    check: "complete requires every Match terminal (CONFIRMED or VOIDED)"
    error_id: ERR_MATCHES_INCOMPLETE
    http_status: 409
    applies_to: "POST /tournaments/{id}/complete"
  - priority: 21
    category: business_constraint
    check: "at most one OPEN dispute per Match at a time"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 22
    category: business_constraint
    check: "a dispute may only be raised on a REPORTED or CONFIRMED match"
    error_id: ERR_MATCH_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 23
    category: business_referential
    check: "payout pay/void target belongs to a COMPLETED tournament and is a FINAL variant"
    error_id: ERR_PAYOUT_NOT_FINAL
    http_status: 409
    applies_to: "POST /payouts/{id}/pay"
  - priority: 24
    category: business_referential
    check: "OCC expected_<parent>_version matches current parent.version"
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412
    applies_to: "POST /matches/{id}/confirm, POST /disputes/{id}/resolve, POST /tournaments/{id}/complete"
  - priority: 25
    category: business_constraint
    check: "request body field types/enums valid and required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # --- Venues & Stations ---
  - method: POST
    path: "/venues"
    description: create a venue
    roles: [Director]
    code: 201
    input: [name, address, open_minute, close_minute]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: fetch a venue
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/venues/{id}/stations"
    description: add a station to a venue
    roles: [Director]
    code: 201
    input: [label]
    output: Station
    side_effects: []
  - method: GET
    path: "/venues/{id}/stations"
    description: "list stations of a venue (reverse-reach Station.venue_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["limit?", "offset?"]
    output: Station[]
    side_effects: []
  - method: GET
    path: "/stations/{id}"
    description: fetch a station
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Station
    side_effects: []
  # --- Stream channels ---
  - method: POST
    path: "/stream-channels"
    description: create a streaming channel
    roles: [Director]
    code: 201
    input: [name, platform]
    output: StreamChannel
    side_effects: []
  - method: GET
    path: "/stream-channels/{id}"
    description: fetch a stream channel
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: StreamChannel
    side_effects: []
  # --- Players ---
  - method: POST
    path: "/players"
    description: register a player account
    roles: [Public, Director]
    code: 201
    input: [display_name, email, "rating?", "tax_id_provided?"]
    output: Player
    side_effects: []
  - method: GET
    path: "/players/{id}"
    description: fetch a player
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Player
    side_effects: []
  # --- Tournaments ---
  - method: POST
    path: "/tournaments"
    description: create a tournament in DRAFT
    roles: [Director]
    code: 201
    input: [name, venue_id, format, max_participants, "seeding_method?", "tiebreak_method?", "swiss_rounds?", prize_pool_cents, "paid_places?", "registration_open_at?", "registration_close_at?", check_in_deadline]
    output: Tournament
    side_effects: []
  - method: GET
    path: "/tournaments"
    description: "list tournaments (reverse-reach Tournament.venue_id via venue_id filter)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: Tournament[]
    side_effects: []
  - method: GET
    path: "/tournaments/{id}"
    description: fetch a tournament (includes computed counters)
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Tournament
    side_effects: []
  - method: POST
    path: "/tournaments/{id}/open-registration"
    description: DRAFT -> REGISTRATION_OPEN
    roles: [Director]
    code: 200
    input: ["registration_open_at?"]
    output: Tournament
    side_effects: ["Tournament.status -> REGISTRATION_OPEN"]
  - method: POST
    path: "/tournaments/{id}/close-registration"
    description: REGISTRATION_OPEN -> REGISTRATION_CLOSED
    roles: [Director]
    code: 200
    input: []
    output: Tournament
    side_effects: ["Tournament.status -> REGISTRATION_CLOSED"]
  - method: POST
    path: "/tournaments/{id}/generate-bracket"
    description: "REGISTRATION_CLOSED -> BRACKET_READY; seeds, matches, provisional payouts"
    roles: [Director]
    code: 200
    input: []
    output: Tournament
    side_effects:
      - "seeding_assignment; bracket_generation; PROVISIONAL payout_allocation"
      - "increments Tournament.version by 1"
  - method: POST
    path: "/tournaments/{id}/start"
    description: BRACKET_READY -> IN_PROGRESS
    roles: [Director]
    code: 200
    input: []
    output: Tournament
    side_effects: ["Tournament.status -> IN_PROGRESS"]
  - method: POST
    path: "/tournaments/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; FINAL payouts (OCC on tournament version)"
    roles: [Director]
    code: 200
    input: [expected_tournament_version]
    output: Tournament
    side_effects:
      - "final_placement_ranking; VOID provisional payouts; FINAL payout_allocation; champion Registration -> CHAMPION"
      - "increments Tournament.version by 1"
  - method: POST
    path: "/tournaments/{id}/cancel"
    description: "cancel a not-yet-started tournament -> CANCELLED"
    roles: [Director]
    code: 200
    input: []
    output: Tournament
    side_effects: ["VOID provisional payouts; cascade non-terminal Registrations -> WITHDRAWN"]
  - method: GET
    path: "/tournaments/{id}/standings"
    description: "computed standings (standings_ranking under tiebreak_method)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: "{ rows: array }"
    side_effects: []
  - method: GET
    path: "/tournaments/{id}/matches"
    description: "list matches of a tournament (reverse-reach Match.tournament_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["round_number?", "bracket?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []
  - method: GET
    path: "/tournaments/{id}/registrations"
    description: "list registrations of a tournament (reverse-reach Registration.tournament_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  # --- Registrations ---
  - method: POST
    path: "/registrations"
    description: enter a player into a tournament
    roles: [Player, Director]
    code: 201
    input: [tournament_id, player_id, "seed_input?"]
    output: Registration
    side_effects: ["increment Tournament.registered_count"]
  - method: GET
    path: "/registrations/{id}"
    description: fetch a registration
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/registrations"
    description: "list/filter registrations (reverse-reach Registration.player_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["tournament_id?", "player_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/check-in"
    description: REGISTERED -> CHECKED_IN
    roles: [Player, Director]
    code: 200
    input: []
    output: Registration
    side_effects: ["set checked_in_at=now; increment checked_in_count"]
  - method: POST
    path: "/registrations/{id}/withdraw"
    description: withdraw a registration before the tournament starts
    roles: [Player, Director]
    code: 200
    input: []
    output: Registration
    side_effects: ["decrement registered_count / checked_in_count"]
  # --- Matches ---
  - method: GET
    path: "/matches/{id}"
    description: fetch a match
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Match
    side_effects: []
  - method: GET
    path: "/matches"
    description: "list/filter matches (reverse-reach Match.station_id, home/away/winner/loser_registration_id, next_match_id, loser_next_match_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["tournament_id?", "station_id?", "home_registration_id?", "away_registration_id?", "winner_registration_id?", "loser_registration_id?", "next_match_id?", "loser_next_match_id?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []
  - method: POST
    path: "/matches/{id}/schedule"
    description: "PENDING -> SCHEDULED on a station/time window"
    roles: [Referee, Director]
    code: 200
    input: [station_id, scheduled_start, scheduled_end]
    output: Match
    side_effects: ["station_overlap check; set station_id/scheduled_start/scheduled_end"]
  - method: POST
    path: "/matches/{id}/report"
    description: "SCHEDULED -> REPORTED with scores"
    roles: [Player, Referee]
    code: 200
    input: [home_score, away_score]
    output: Match
    side_effects: ["set scores, reported_by_user_id"]
  - method: POST
    path: "/matches/{id}/confirm"
    description: "REPORTED -> CONFIRMED (OCC on match version, SoD); cascade advance/eliminate"
    roles: [Referee, Director]
    code: 200
    input: [expected_match_version]
    output: Match
    side_effects:
      - "set winner/loser; advance winner into next_match; eliminate loser or drop to losers bracket; counters"
      - "increments Match.version by 1"
  - method: POST
    path: "/matches/{id}/replay"
    description: "VOIDED -> PENDING to re-schedule (cycle)"
    roles: [Referee, Director]
    code: 200
    input: []
    output: Match
    side_effects: ["reset match to PENDING"]
  # --- Stream assignments ---
  - method: POST
    path: "/stream-assignments"
    description: assign a match to a channel for a broadcast window
    roles: [Referee, Director]
    code: 201
    input: [match_id, channel_id, start_at, end_at]
    output: StreamAssignment
    side_effects: ["stream_overlap check"]
  - method: GET
    path: "/stream-assignments/{id}"
    description: fetch a stream assignment
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: StreamAssignment
    side_effects: []
  - method: GET
    path: "/stream-assignments"
    description: "list/filter stream assignments (reverse-reach StreamAssignment.match_id, channel_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["match_id?", "channel_id?", "status?", "limit?", "offset?"]
    output: StreamAssignment[]
    side_effects: []
  # --- Disputes ---
  - method: POST
    path: "/disputes"
    description: raise a dispute on a REPORTED/CONFIRMED match
    roles: [Player, Director]
    code: 201
    input: [match_id, raised_by_registration_id, reason]
    output: Dispute
    side_effects: ["if match REPORTED -> DISPUTED (freeze)"]
  - method: GET
    path: "/disputes/{id}"
    description: fetch a dispute
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "list/filter disputes (reverse-reach Dispute.match_id, raised_by_registration_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["match_id?", "raised_by_registration_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "OPEN -> UPHELD/REJECTED (OCC on disputed match version, SoD); cascade to match"
    roles: [Referee, Director]
    code: 200
    input: [outcome, "resolution_note?", expected_match_version]
    output: Dispute
    side_effects:
      - "UPHELD: void the match (compensation cascade). REJECTED: unfreeze match to REPORTED."
      - "increments Match.version by 1"
  # --- Payouts ---
  - method: GET
    path: "/payouts/{id}"
    description: fetch a payout
    roles: [Director, Referee, Player, Public]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/payouts"
    description: "list/filter payouts (reverse-reach Payout.tournament_id, registration_id)"
    roles: [Director, Referee, Player, Public]
    code: 200
    input: ["tournament_id?", "registration_id?", "variant?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/payouts/{id}/pay"
    description: "mark a FINAL payout PAID"
    roles: [Director]
    code: 200
    input: []
    output: Payout
    side_effects: ["Payout.status PENDING -> PAID"]
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock; startup default is 2026-07-01T00:00:00Z (before every default fixture date); unset clock never falls back to wall-clock"
    roles: [Director]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["all now-dependent checks (check-in deadline) read this value"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown auth headers on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced entity does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not allowed from the resource's current state"
  - id: ERR_TOURNAMENT_NOT_IN_CHECKIN
    http: 409
    condition: "check-in attempted while tournament not in REGISTRATION_CLOSED"
  - id: ERR_CHECKIN_CLOSED
    http: 409
    condition: "check-in attempted after check_in_deadline (now > deadline)"
  - id: ERR_STATION_WRONG_VENUE
    http: 409
    condition: "station belongs to a different venue than the tournament"
  - id: ERR_SOD_SELF_CONFIRM
    http: 409
    condition: "confirming user is the same user_id that reported the match"
  - id: ERR_SOD_CONFIRMER_RESOLVE
    http: 409
    condition: "dispute resolver is the same user_id that confirmed the disputed match"
  - id: ERR_COMPETITOR_NOT_CHECKED_IN
    http: 409
    condition: "a match competitor is not CHECKED_IN at schedule time"
  - id: ERR_TIE_NOT_ALLOWED
    http: 422
    condition: "reported home_score == away_score"
  - id: ERR_NOT_A_COMPETITOR
    http: 403
    condition: "reporter is neither a competitor of the match nor a Referee"
  - id: ERR_OUTSIDE_VENUE_HOURS
    http: 422
    condition: "scheduled window outside venue hours or end <= start"
  - id: ERR_STATION_OVERLAP
    http: 409
    condition: "station busy within the STATION_TURNOVER_MINUTES buffer"
  - id: ERR_CHANNEL_OVERLAP
    http: 409
    condition: "stream channel busy during the requested closed interval"
  - id: ERR_MATCH_NOT_SCHEDULABLE_STREAM
    http: 409
    condition: "stream target match is PENDING or VOIDED"
  - id: ERR_TOURNAMENT_FULL
    http: 409
    condition: "registration would exceed max_participants"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "player already holds a non-terminal registration in this tournament"
  - id: ERR_INSUFFICIENT_PARTICIPANTS
    http: 409
    condition: "generate-bracket with < 2 checked-in participants (or swiss_rounds < 1 for SWISS)"
  - id: ERR_MATCHES_INCOMPLETE
    http: 409
    condition: "complete attempted while some match is non-terminal"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "an OPEN dispute already exists for this match"
  - id: ERR_MATCH_NOT_DISPUTABLE
    http: 409
    condition: "dispute raised on a match that is not REPORTED or CONFIRMED"
  - id: ERR_PAYOUT_NOT_FINAL
    http: 409
    condition: "pay attempted on a non-FINAL payout or non-COMPLETED tournament"
  - id: ERR_STALE_MATCH_VERSION
    http: 412
    condition: "expected_match_version does not match Match.version"
  - id: ERR_STALE_TOURNAMENT_VERSION
    http: 412
    condition: "expected_tournament_version does not match Tournament.version"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad type, or invalid enum value"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Director
    description: "tournament administrator; hierarchical override over all operations"
    identity: opaque
    exclusive_operations:
      - "POST /tournaments and lifecycle (open/close registration, generate-bracket, start, complete, cancel)"
      - "POST /venues, POST /venues/{id}/stations, POST /stream-channels"
      - "POST /payouts/{id}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /registrations, POST /registrations/{id}/check-in, POST /registrations/{id}/withdraw (with Player)"
      - "POST /matches/{id}/schedule, POST /matches/{id}/confirm, POST /matches/{id}/replay (with Referee)"
      - "POST /disputes/{id}/resolve, POST /stream-assignments (with Referee)"
      - "POST /disputes (with Player)"
      - "all GET reads"
  - name: Referee
    description: "officiates matches: schedule, confirm reports, resolve disputes, assign streams (SoD-constrained)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /matches/{id}/schedule, POST /matches/{id}/confirm, POST /matches/{id}/replay (with Director)"
      - "POST /matches/{id}/report (with Player)"
      - "POST /disputes/{id}/resolve, POST /stream-assignments (with Director)"
      - "all GET reads"
  - name: Player
    description: "a competitor; acts on own registrations and own matches"
    identity: "entity_backed:Player"
    exclusive_operations: []
    shared_operations:
      - "POST /registrations, POST /registrations/{id}/check-in, POST /registrations/{id}/withdraw (with Director)"
      - "POST /matches/{id}/report (with Referee)"
      - "POST /disputes (with Director)"
      - "all GET reads"
  - name: Public
    description: "unauthenticated read-only access and player self-signup"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET reads"
      - "POST /players (self-signup)"


