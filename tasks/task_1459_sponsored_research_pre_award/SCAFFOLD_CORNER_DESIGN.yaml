        claim_type: system_fields
        grounds: [response_envelope]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present; response_type 'object' for single resources and 'array' for lists; list responses carry limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one PI registered"]
          setup_api_calls:
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - { call: "GET /pre-award/principal-investigators/${pi_id}", payload: {}, as: OSPDirector, captures: { got_id: $.data.id } }
            - { call: "GET /pre-award/proposals", payload: {}, as: OSPDirector }
          assert:
            - "object response: meta.api_request_id present, response_type == object, got_id == ${pi_id}"
            - "list response: response_type == array and pagination fields limit/offset/total_count/has_more present with defaults limit 10 offset 0"

