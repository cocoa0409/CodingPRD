scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_defaults_applied
        claim_type: creation_defaults
        grounds: [entities.Customer.fields.demurrage_free_days, entities.Customer.fields.credit_status]
        distinguishing_aspect: "Omitting demurrage_free_days and credit_status at creation applies defaults 2 and GOOD."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Default Co", billing_email: "d@default.example" }
              as: SystemAdmin
              captures: { c_free: $.data.demurrage_free_days, c_credit: $.data.credit_status, c_id: $.data.id }
          trigger: []
          assert:
            - "captured c_free == 2"
            - "captured c_credit == GOOD"
            - "Customer.${c_id}.version == 1"

      - name: customer_missing_required_name_rejected
        claim_type: required_fields
        grounds: [entities.Customer.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /rail/customers without name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rail/customers"
              payload: { billing_email: "no-name@x.example" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: railcar_invalid_car_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Railcar.fields.car_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "car_type COIL is not in {BOX, HOPPER, TANK, FLAT, GONDOLA} and is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 1", car_type: COIL, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: railcar_duplicate_reporting_mark_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_REPORTING_MARK]"]
        distinguishing_aspect: "Second railcar with an already-registered reporting_mark returns ERR_DUPLICATE_REPORTING_MARK (409)."
        test_recipe:
          setup: ["one railcar GNWR 5001 exists"]
          setup_api_calls:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 5001", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
          trigger:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 5001", car_type: HOPPER, ownership: FOREIGN, hire_rate_per_hour_cents: 100, hire_rate_per_mile_cents: 80, home_road_mark: "NS" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_REPORTING_MARK"

      - name: segment_computed_speed_input_ignored
        claim_type: computed_fields
        grounds: [entities.TrackSegment.fields.effective_speed_mph, calculations.effective_speed_limit]
        distinguishing_aspect: "Client-supplied effective_speed_mph is ignored; a CLASS_2 segment computes 25."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rail/track-segments"
              payload: { name: "Spur 1", milepost_start: 0, milepost_end: 2, fra_class: CLASS_2, effective_speed_mph: 99 }
              as: SystemAdmin
              captures: { seg_speed: $.data.effective_speed_mph }
          assert:
            - "captured seg_speed == 25 (server-computed; input 99 ignored)"

      - name: customer_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /rail/customers/{uuid} for an absent id returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rail/customers/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_RESOURCE_NOT_FOUND"

      - name: customer_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit=2 returns 2 rows with has_more true; offset=2 returns the 3rd row with has_more false."
        test_recipe:
          setup: ["three customers exist"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Alpha Co", billing_email: "a@x.example" }
              as: SystemAdmin
            - call: "POST /rail/customers"
              payload: { name: "Beta Co", billing_email: "b@x.example" }
              as: SystemAdmin
            - call: "POST /rail/customers"
              payload: { name: "Gamma Co", billing_email: "g@x.example" }
              as: SystemAdmin
          trigger:
            - call: "GET /rail/customers"
              payload: { limit: 2, offset: 0 }
              as: SystemAdmin
              captures: { page1: "$.total_count", more1: "$.has_more" }
            - call: "GET /rail/customers"
              payload: { limit: 2, offset: 2 }
              as: SystemAdmin
              captures: { page2: "$.total_count", more2: "$.has_more" }
          assert:
            - "captured page1 == 3 and more1 == true"
            - "captured page2 == 3 and more2 == false"
            - "first page data length == 2; second page data length == 1"

      - name: railcar_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.Railcar, response_envelope]
        distinguishing_aspect: "id is a prefix-free UUID, version starts at 1, created_at equals the fixed default clock 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["empty database; logical clock never set"]
          setup_api_calls:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 7001", car_type: FLAT, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc_id: $.data.id, rc_v: $.data.version, rc_created: $.data.created_at }
          trigger: []
          assert:
            - "captured rc_id matches the UUID shape with no type prefix"
            - "captured rc_v == 1"
            - "captured rc_created == 2026-05-01T00:00:00.000Z (logical clock default)"

  - section: state_machines
    instances:
      - name: car_order_initial_state_placed
        claim_type: initial_state
        grounds: [state_machines.CarOrder]
        distinguishing_aspect: "A newly created car order is PLACED with cars_furnished_count 0."
        test_recipe:
          setup: ["customer and siding exist"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Init Co", billing_email: "i@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 1-2", milepost_start: 1, milepost_end: 2, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Init Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
          trigger:
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 2, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_status: $.data.status, ord_count: $.data.cars_furnished_count }
          assert:
            - "captured ord_status == PLACED"
            - "captured ord_count == 0"

      - name: car_order_double_accept_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CarOrder.PLACED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept on an already-ACCEPTED order is not a defined transition and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["an ACCEPTED order exists"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Dup Accept Co", billing_email: "d@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 3-4", milepost_start: 3, milepost_end: 4, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Dup Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 1, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: movement_settled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TrainMovement]
        distinguishing_aspect: "From terminal SETTLED no transition is defined; depart returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["movement with no waybills driven PLANNED -> READY -> DEPARTED -> ARRIVED -> SETTLED"]
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 5-9", milepost_start: 5, milepost_end: 9, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/crew-members"
              payload: { name: "L. Conductor", craft: CONDUCTOR }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-901", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/train-movements/${mov_id}/ready"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/arrive"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/settle"
              payload: {}
              as: SettlementClerk
              captures: { mov_final: $.data.status }
          trigger:
            - call: "POST /rail/train-movements/${mov_id}/depart"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "captured mov_final == SETTLED"
            - "captured err == ERR_INVALID_STATE"

      - name: statement_settled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CarHireStatement]
        distinguishing_aspect: "A SETTLED statement rejects dispute with ERR_INVALID_STATE; SETTLED is absorbing."
        test_recipe:
          setup: ["FOREIGN car received then delivered (statement auto-CLOSED), statement settled"]
          setup_api_calls:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 9100", car_type: TANK, ownership: FOREIGN, hire_rate_per_hour_cents: 100, hire_rate_per_mile_cents: 50, home_road_mark: "NS" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/interchange-events"
              payload: { class_i_partner: "NS", direction: RECEIVED, railcar_id: "${rc_id}" }
              as: Dispatcher
              captures: { ev1_id: $.data.id }
            - call: "POST /rail/interchange-events/${ev1_id}/confirm"
              payload: {}
              as: SettlementClerk
            - call: "POST /rail/interchange-events"
              payload: { class_i_partner: "NS", direction: DELIVERED, railcar_id: "${rc_id}", miles_traveled_on_line: 40 }
              as: Dispatcher
              captures: { ev2_id: $.data.id }
            - call: "POST /rail/interchange-events/${ev2_id}/confirm"
              payload: {}
              as: SettlementClerk
            - call: "GET /rail/car-hire-statements"
              payload: { railcar_id: "${rc_id}" }
              as: SettlementClerk
              captures: { stmt_id: "$.data[0].id" }
            - call: "POST /rail/car-hire-statements/${stmt_id}/settle"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "POST /rail/car-hire-statements/${stmt_id}/dispute"
              payload: {}
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: milestone_resubmit_after_reject
        claim_type: valid_transition
        grounds: [state_machines.GrantMilestone.REJECTED_to_SUBMITTED]
        distinguishing_aspect: "The cyclic resubmit edge REJECTED -> SUBMITTED is real: a rejected milestone can be resubmitted with new actual costs."
        test_recipe:
          setup: ["ACTIVE project with a milestone that was submitted (cost 90000) and rejected"]
          setup_api_calls:
            - call: "POST /rail/grant-projects"
              payload: { title: "Tie Renewal", grantor: "FRA CRISI", award_amount_cents: 500000, required_match_pct: 20 }
              as: GrantManager
              captures: { proj_id: $.data.id }
            - call: "POST /rail/grant-projects/${proj_id}/activate"
              payload: {}
              as: GrantManager
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "M1", milestone_value_cents: 200000 }
              as: GrantManager
              captures: { m_id: $.data.id }
            - call: "POST /rail/grant-milestones/${m_id}/submit"
              payload: { actual_cost_cents: 90000 }
              as: GrantManager
            - call: "POST /rail/grant-milestones/${m_id}/reject"
              payload: {}
              as: RegulatorOfficer
          trigger:
            - call: "POST /rail/grant-milestones/${m_id}/submit"
              payload: { actual_cost_cents: 150000 }
              as: GrantManager
              captures: { m_status: $.data.status, m_cost: $.data.actual_cost_cents }
          assert:
            - "captured m_status == SUBMITTED"
            - "captured m_cost == 150000 (replaced on resubmission)"

      - name: defect_cascade_holds_departed_movement
        claim_type: side_effect_execution
        grounds: [state_machines.TrackSegment.IN_SERVICE_to_RESTRICTED, state_machines.TrainMovement.DEPARTED_to_HELD]
        distinguishing_aspect: "Conditional cascade: a CRITICAL defect annuls PLANNED/READY movements but only HELDS a DEPARTED movement over the segment — the side effect depends on the child's current state."
        test_recipe:
          setup: ["movement DEPARTED over a CLASS_3 segment"]
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 12-16", milepost_start: 12, milepost_end: 16, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/crew-members"
              payload: { name: "M. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-902", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/train-movements/${mov_id}/ready"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/track-inspections"
              payload: { segment_id: "${seg_id}", scheduled_date: "2026-05-02" }
              as: TrackInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /rail/track-inspections/${insp_id}/file"
              payload: { defect_found: true, defect_severity: CRITICAL, findings: "broken joint bar" }
              as: TrackInspector
          assert:
            - "TrainMovement.${mov_id}.status == HELD (not ANNULLED — the cascade is conditional on movement state)"
            - "TrackSegment.${seg_id}.status == RESTRICTED"
            - "CrewCall.${call_id}.status == ACCEPTED (unaffected: EXPIRED only fires for CALLED/ACCEPTED calls of ANNULLED movements... but this call is ACCEPTED on a HELD movement, which is not annulled, so it persists)"

      - name: siding_expiry_sweep_and_renewal
        claim_type: side_effect_execution
        grounds: [state_machines.IndustrySiding.ACTIVE_to_EXPIRED, state_machines.IndustrySiding.EXPIRED_to_ACTIVE]
        distinguishing_aspect: "Clock sweep at exactly agreement_expires_on flips the siding to EXPIRED (>= semantics); renew-agreement restores ACTIVE."
        test_recipe:
          setup: ["siding with agreement_expires_on 2026-05-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Expiry Co", billing_email: "e@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 17-18", milepost_start: 17, milepost_end: 18, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Expiry Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2026-05-10T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
          trigger:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T23:59:59Z" }
              as: SystemAdmin
            - call: "GET /rail/industry-sidings/${sid_id}"
              payload: {}
              as: SystemAdmin
              captures: { st_before: $.data.maintenance_agreement_status }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /rail/industry-sidings/${sid_id}"
              payload: {}
              as: SystemAdmin
              captures: { st_expired: $.data.maintenance_agreement_status }
            - call: "POST /rail/industry-sidings/${sid_id}/renew-agreement"
              payload: { new_expires_on: "2027-06-01T00:00:00Z" }
              as: SystemAdmin
              captures: { st_renewed: $.data.maintenance_agreement_status }
          assert:
            - "captured st_before == ACTIVE (one second before expiry)"
            - "captured st_expired == EXPIRED (at exactly agreement_expires_on; >= comparison)"
            - "captured st_renewed == ACTIVE"

      - name: movement_settle_blocked_by_unrated_waybill
        claim_type: precondition_enforcement
        grounds: ["validations[priority=8]", "errors[ERR_WAYBILL_NOT_RATED]"]
        distinguishing_aspect: "Settle with a linked waybill still CREATED fails ERR_WAYBILL_NOT_RATED and the movement stays ARRIVED."
        test_recipe:
          setup: ["movement ARRIVED with one CREATED (unrated) waybill linked"]
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 21-24", milepost_start: 21, milepost_end: 24, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/crew-members"
              payload: { name: "N. Conductor", craft: CONDUCTOR }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-903", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/train-movements/${mov_id}/ready"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/train-movements/${mov_id}/arrive"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/customers"
              payload: { name: "Unrated Co", billing_email: "u@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8001", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/waybills"
              payload: { railcar_id: "${rc_id}", origin_customer_id: "${cust_id}", movement_id: "${mov_id}", destination: "Rochester", commodity: LUMBER, weight_tons: 10, through_route: false }
              as: Dispatcher
          trigger:
            - call: "POST /rail/train-movements/${mov_id}/settle"
              payload: {}
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_WAYBILL_NOT_RATED"
            - "TrainMovement.${mov_id}.status == ARRIVED (unchanged)"

  - section: calculations
    instances:
      - name: waybill_rating_uses_commodity_constant
        claim_type: correct_result
        grounds: [calculations.waybill_rating, entities.Waybill.fields.total_freight_charge_cents]
        distinguishing_aspect: "LUMBER at 42000 cents/ton: 50 tons rates to exactly 2100000 cents and flips the waybill to RATED."
        test_recipe:
          setup: ["customer and HOME railcar exist; waybill LUMBER 50 tons created"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Rate Co", billing_email: "r@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 6100", car_type: FLAT, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/waybills"
