# =============================================================================
# Retail Checking & Savings Account — Scaffold seed tables (§1.0–§1.7)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Retail Checking & Savings Account: account opening (CIP/KYC), direct deposit &
  ACH origination, overdraft/NSF fee tiers, courtesy-pay opt-in (Reg E/Reg DD),
  interest accrual/APY tiers, joint/POD ownership, dormancy & escheat, stop payment

domain_name: retail-checking-savings
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Account is the aggregate root (parent of Transaction, FeeAssessment, StopPayment,
  # InterestPosting, EscheatEvent). Customer/Owner/AchOrigination are flat peers
  # referenced by FK across the account boundary.

  state_machine_shape: branching
  # Application: branching fork-join (SUBMITTED→{APPROVED, REJECTED}); Account:
  # branching with revert (ACTIVE↔DORMANT cycle, ACTIVE→FROZEN→ACTIVE); Transaction:
  # branching (PENDING→{POSTED, RETURNED, STOPPED}). No long linear pipelines.

  relationship_patterns:
    - one_to_many        # Account → Transaction, FeeAssessment, InterestPosting
    - many_to_many       # Customer ↔ Account via AccountOwner junction (joint/POD)
    - cross_aggregate    # AchOrigination references both a debtor and creditor Account

  role_model: segregation_of_duties
  # The teller who SUBMITS a CIP application cannot APPROVE it (4-eyes / SoD).
  # ComplianceOfficer owns KYC adjudication & escheat; Teller owns deposits/withdrawals;
  # AccountHolder (entity_backed:Customer) acts on their own accounts.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Full legal name of the natural person" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: tax_id_last4, type: string, source: input, description: "Last 4 digits of SSN/ITIN, used in CIP" }
      - { name: country_of_residence, type: enum, source: input, default: "US", description: "ISO 3166 alpha-2; non-US flips CIP enhanced review" }
      - { name: cip_status, type: enum, source: computed, description: "UNVERIFIED | VERIFIED | REJECTED — derived from the latest adjudicated Application for this customer" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the applicant whose CIP/KYC is being adjudicated" }
      - { name: product_type, type: enum, source: input, description: "CHECKING | SAVINGS — the product the application opens on approval" }
      - { name: requested_apy_tier_code, type: string, source: input, description: "Selected APY tier code (validated against ApyTier on approval)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Teller X-User-ID captured at SUBMIT; enforces SoD against approver" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED; APPROVED/REJECTED terminal", constraints: "DRAFT, SUBMITTED, APPROVED, REJECTED" }
      - { name: kyc_risk_score, type: integer, source: computed, description: "0–100 risk score computed at SUBMIT from customer attributes" }
      - { name: opened_account_id, type: string, source: system, description: "FK -> Account.id; populated when APPROVED creates the Account" }
      - { name: rejection_reason_code, type: enum, source: system, description: "CIP_MISMATCH | SANCTIONS_HIT | UNDERAGE | DUPLICATE | null while not REJECTED" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: product_type, type: enum, source: system, description: "CHECKING | SAVINGS — copied from the approving Application" }
      - { name: origin_application_id, type: string, source: system, description: "FK -> Application.id; the application that opened this account" }
      - { name: apy_tier_code, type: string, source: system, description: "FK -> ApyTier.code; the interest tier governing accrual" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DORMANT | FROZEN | ESCHEATED | CLOSED", constraints: "ACTIVE, DORMANT, FROZEN, ESCHEATED, CLOSED" }
      - { name: courtesy_pay_opted_in, type: boolean, source: system, default: false, description: "Reg E/Reg DD opt-in for overdraft courtesy pay on one-time debits" }
      - { name: courtesy_pay_limit_cents, type: integer, source: system, default: 50000, description: "Max negative available balance courtesy pay will cover" }
      - { name: ledger_balance_cents, type: integer, source: computed, description: "Sum of POSTED transaction signed amounts; can go negative under courtesy pay" }
      - { name: hold_total_cents, type: integer, source: computed, description: "Sum of amount_cents for PENDING debit transactions (holds)" }
      - { name: available_balance_cents, type: integer, source: computed, description: "ledger_balance_cents - hold_total_cents" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued but not yet posted; reset to 0 on InterestPosting" }
      - { name: od_nsf_items_today, type: integer, source: computed, description: "Count of FeeAssessment rows whose assessed_date == current ledger date (fee-tier counter)" }
      - { name: last_activity_date, type: string, source: computed, description: "ISO date of the most recent customer-initiated POSTED/RETURNED/STOPPED transaction" }
      - { name: dormancy_threshold_days, type: integer, source: system, default: 365, description: "Days of inactivity before ACTIVE->DORMANT" }
      - { name: escheat_threshold_days, type: integer, source: system, default: 1095, description: "Days of inactivity before DORMANT->ESCHEATED (3y)" }

  - name: AccountOwner
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the owned account" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning party" }
      - { name: ownership_role, type: enum, source: input, description: "PRIMARY | JOINT | POD_BENEFICIARY", constraints: "PRIMARY, JOINT, POD_BENEFICIARY" }
      - { name: is_active, type: boolean, source: system, default: true, description: "POD beneficiary becomes inactive when superseded; JOINT removed on withdrawal" }

  - name: ApyTier
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Stable tier code, e.g. STD, HY1, HY2" }
      - { name: product_type, type: enum, source: input, description: "CHECKING | SAVINGS — tier applies to this product only" }
      - { name: min_balance_cents, type: integer, source: input, description: "Inclusive lower bound of ledger_balance_cents for this tier to apply" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Annual percentage yield in basis points (e.g. 450 = 4.50% APY)" }

  - name: Transaction
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the account this transaction posts to" }
      - { name: ach_origination_id, type: string, source: system, description: "FK -> AchOrigination.id; set when this transaction was produced by an ACH batch leg, else null" }
      - { name: txn_type, type: enum, source: input, description: "DEPOSIT | WITHDRAWAL | ACH_CREDIT | ACH_DEBIT | CHECK_DEBIT | INTEREST | FEE | ESCHEAT_SWEEP" }
      - { name: direction, type: enum, source: computed, description: "CREDIT | DEBIT — derived from txn_type" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute value in cents; sign comes from direction", constraints: "amount_cents > 0" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | RETURNED | STOPPED", constraints: "PENDING, POSTED, RETURNED, STOPPED" }
      - { name: posted_balance_cents, type: integer, source: system, description: "ledger_balance_cents immediately after this txn POSTED; null until POSTED" }
      - { name: check_number, type: string, source: input, description: "Check serial for CHECK_DEBIT; matched against StopPayment; null otherwise" }
      - { name: return_reason_code, type: enum, source: system, description: "NSF | STOP_PAYMENT | ACCOUNT_FROZEN | null while not RETURNED/STOPPED" }

  - name: FeeAssessment
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the charged account" }
      - { name: source_transaction_id, type: string, source: system, description: "FK -> Transaction.id; the overdrawing/returned item that triggered the fee" }
      - { name: fee_type, type: enum, source: system, description: "OVERDRAFT | NSF", constraints: "OVERDRAFT, NSF" }
      - { name: tier_ordinal, type: integer, source: system, description: "1-based ordinal of this fee among today's fee-bearing items (drives the tier amount)" }
      - { name: fee_amount_cents, type: integer, source: system, description: "Charged fee in cents per the tier schedule (0 when daily cap exceeded)" }
      - { name: assessed_date, type: string, source: system, description: "ISO date the fee was assessed (ledger clock date)" }

  - name: StopPayment
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account the stop order protects" }
      - { name: check_number, type: string, source: input, description: "Target check serial; matches Transaction.check_number" }
      - { name: max_amount_cents, type: integer, source: input, description: "Stop applies only when presented amount_cents <= max_amount_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONSUMED | EXPIRED", constraints: "ACTIVE, CONSUMED, EXPIRED" }
      - { name: expires_on, type: string, source: input, description: "ISO date the stop order lapses (exclusive: stop is dead on this date)" }

  - name: AchOrigination
    parent: null
    common_fields: true
    fields:
      - { name: debtor_account_id, type: string, source: input, description: "FK -> Account.id; account debited by this batch" }
      - { name: creditor_account_id, type: string, source: input, description: "FK -> Account.id; account credited by this batch (direct deposit target)" }
      - { name: posting_order, type: enum, source: input, default: "CHRONOLOGICAL", description: "CHRONOLOGICAL | HIGH_TO_LOW — leg posting order within the batch", constraints: "CHRONOLOGICAL, HIGH_TO_LOW" }
      - { name: status, type: enum, source: system, description: "STAGED | SETTLED | REVERSED", constraints: "STAGED, SETTLED, REVERSED" }
      - { name: total_debit_cents, type: integer, source: computed, description: "Sum of amount_cents of POSTED debit legs after settlement" }
      - { name: total_credit_cents, type: integer, source: computed, description: "Sum of amount_cents of POSTED credit legs after settlement" }

  - name: AchLeg
    parent: AchOrigination
    common_fields: true
    fields:
      - { name: ach_origination_id, type: string, source: system, description: "FK -> AchOrigination.id; the batch this leg belongs to" }
      - { name: leg_role, type: enum, source: input, description: "DEBIT | CREDIT — DEBIT hits debtor_account, CREDIT hits creditor_account", constraints: "DEBIT, CREDIT" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute leg amount in cents", constraints: "amount_cents > 0" }
      - { name: produced_transaction_id, type: string, source: system, description: "FK -> Transaction.id; the Transaction this leg created on settlement; null while STAGED" }
      - { name: settlement_outcome, type: enum, source: system, description: "POSTED | RETURNED_NSF | null while STAGED" }

  - name: InterestPosting
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account credited interest" }
      - { name: period_start_date, type: string, source: input, description: "ISO date inclusive start of accrual period" }
      - { name: period_end_date, type: string, source: input, description: "ISO date exclusive end of accrual period" }
      - { name: posted_interest_cents, type: integer, source: computed, description: "Interest credited for the period (truncated to whole cents)" }
      - { name: applied_apy_tier_code, type: string, source: system, description: "FK -> ApyTier.code; tier resolved at posting time" }

  - name: EscheatEvent
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the escheated account" }
      - { name: swept_amount_cents, type: integer, source: system, description: "ledger_balance_cents swept to the state at escheat (0 if non-positive)" }
      - { name: jurisdiction, type: enum, source: system, description: "State jurisdiction the funds escheat to, taken from the primary owner's residence" }
      - { name: dormancy_days_at_escheat, type: integer, source: system, description: "Inactivity days measured from last_activity_date to ledger clock at sweep" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Teller
        preconditions:
          - "Application.status == DRAFT (else ERR_INVALID_STATE)"
          - "Referenced Customer exists (else ERR_CUSTOMER_NOT_FOUND)"
        side_effects:
          - "kyc_risk_score recomputed (calc kyc_risk_scoring)"
          - "submitted_by_user_id set to acting Teller X-User-ID"
        note: "Captures the SoD anchor: approver must differ from submitted_by_user_id."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Application.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "kyc_risk_score < 70 (else ERR_KYC_RISK_TOO_HIGH)"
          - "requested_apy_tier_code resolves to an ApyTier whose product_type == product_type (else ERR_APY_TIER_NOT_FOUND)"
        side_effects:
          - "Account created: status=ACTIVE, product_type copied, apy_tier_code=requested_apy_tier_code, ledger_balance_cents=0"
          - "AccountOwner created: ownership_role=PRIMARY, customer_id=Application.customer_id, is_active=true"
          - "opened_account_id set to the new Account.id"
          - "Customer.cip_status recomputed -> VERIFIED (calc cip_status_derivation)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Application.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rejection_reason_code set from request body"
          - "Customer.cip_status recomputed -> REJECTED (calc cip_status_derivation)"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [ESCHEATED, CLOSED]
    transitions:
      - from: ACTIVE
        to: DORMANT
        trigger: "POST /accounts/{id}/run-dormancy-scan"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == ACTIVE (else ERR_INVALID_STATE)"
          - "(ledger_clock_date - last_activity_date) in days >= dormancy_threshold_days (else ERR_DORMANCY_NOT_DUE)"
        side_effects:
          - "status -> DORMANT; interest accrual continues but courtesy pay is suspended"

      - from: DORMANT
        to: ACTIVE
        trigger: "POST /accounts/{id}/transactions (customer-initiated deposit/withdrawal)"
        actor: AccountHolder
        preconditions:
          - "Account.status == DORMANT"
          - "txn_type in {DEPOSIT, WITHDRAWAL} (system-initiated INTEREST/FEE do NOT reactivate)"
        side_effects:
          - "status -> ACTIVE; last_activity_date set to ledger_clock_date (revives the dormancy clock)"
        note: "Branching revert leg: DORMANT->ACTIVE reactivation cycle."

      - from: DORMANT
        to: ESCHEATED
        trigger: "POST /accounts/{id}/run-escheat-sweep"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == DORMANT (else ERR_INVALID_STATE)"
          - "(ledger_clock_date - last_activity_date) in days >= escheat_threshold_days (else ERR_ESCHEAT_NOT_DUE)"
        side_effects:
          - "EscheatEvent created: swept_amount_cents=max(ledger_balance_cents,0), jurisdiction from primary owner residence"
          - "ESCHEAT_SWEEP Transaction POSTED for -swept_amount_cents; ledger_balance_cents -> 0 when positive"
          - "status -> ESCHEATED (terminal)"
          - "All ACTIVE StopPayment rows for the account -> EXPIRED"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /accounts/{id}/freeze"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> FROZEN; subsequent debit settlement legs RETURN with ACCOUNT_FROZEN"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /accounts/{id}/unfreeze"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == FROZEN (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: AccountHolder
        preconditions:
          - "Account.status == ACTIVE (else ERR_INVALID_STATE)"
          - "ledger_balance_cents == 0 (else ERR_NONZERO_BALANCE)"
          - "no PENDING transactions and no STAGED AchLeg references this account (else ERR_PENDING_ITEMS)"
        side_effects:
          - "status -> CLOSED (terminal); all ACTIVE StopPayment -> EXPIRED; JOINT/POD AccountOwner.is_active -> false"

  - entity: Transaction
    initial_state: PENDING
    terminal_states: [POSTED, RETURNED, STOPPED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /accounts/{id}/transactions (immediate post) OR POST /ach-originations/{id}/settle (leg posts)"
        actor: AccountHolder | system
        preconditions:
          - "Account.status in {ACTIVE, DORMANT} (else debit RETURNS; credits allowed in DORMANT)"
          - "For a DEBIT: matching ACTIVE StopPayment with amount_cents <= max_amount_cents absent (else STOPPED)"
          - "For a DEBIT: post-debit available_balance_cents >= -courtesy_pay_limit_cents when courtesy_pay_opted_in, else >= 0 (else RETURNED NSF)"
        side_effects:
          - "status -> POSTED; ledger_balance_cents adjusted by signed amount; posted_balance_cents stamped"
          - "available_balance_cents recomputed (calc available_balance)"
          - "On overdraft post: FeeAssessment OVERDRAFT created (calc overdraft_nsf_fee_tier)"
          - "Account.last_activity_date updated for customer-initiated types"

      - from: PENDING
        to: RETURNED
        trigger: "POST /ach-originations/{id}/settle (insufficient funds / frozen)"
        actor: system
        preconditions:
          - "Debit would breach courtesy-pay floor OR Account.status == FROZEN"
        side_effects:
          - "status -> RETURNED; return_reason_code set (NSF | ACCOUNT_FROZEN)"
          - "On NSF: FeeAssessment NSF created (calc overdraft_nsf_fee_tier)"
          - "AchLeg.settlement_outcome -> RETURNED_NSF"

      - from: PENDING
        to: STOPPED
        trigger: "POST /ach-originations/{id}/settle (matched stop) OR POST /accounts/{id}/transactions"
        actor: system
        preconditions:
          - "txn_type == CHECK_DEBIT AND matching ACTIVE StopPayment exists with amount_cents <= max_amount_cents"
        side_effects:
          - "status -> STOPPED; return_reason_code = STOP_PAYMENT; no fee assessed"
          - "Matched StopPayment.status -> CONSUMED"

  - entity: AchOrigination
    initial_state: STAGED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: STAGED
        to: SETTLED
        trigger: "POST /ach-originations/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "AchOrigination.status == STAGED (else ERR_INVALID_STATE)"
          - "expected_ach_origination_version matches (else ERR_STALE_VERSION)"
          - "debtor_account and creditor_account both exist and not CLOSED (else ERR_ACCOUNT_NOT_FOUND)"
        side_effects:
          - "Each AchLeg produces a Transaction posted in posting_order (calc ach_settlement_posting)"
          - "DEBIT legs may RETURN NSF and assess fees (calc overdraft_nsf_fee_tier)"
          - "total_debit_cents / total_credit_cents recomputed from POSTED legs"
          - "CREDIT legs to creditor_account update last_activity_date (direct deposit reactivates DORMANT)"

      - from: SETTLED
        to: REVERSED
        trigger: "POST /ach-originations/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "AchOrigination.status == SETTLED (else ERR_INVALID_STATE)"
          - "expected_ach_origination_version matches (else ERR_STALE_VERSION)"
        side_effects:
          - "Each POSTED produced Transaction reversed by an equal-and-opposite POSTED Transaction (calc ach_reversal_invariant)"
          - "Any FeeAssessment produced by this batch reversed by an offsetting FEE credit Transaction (conserves ledger_balance_cents net of the batch)"
          - "status -> REVERSED"

  - entity: StopPayment
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system: a matching CHECK_DEBIT is presented and STOPPED"
        actor: system
        preconditions:
          - "A CHECK_DEBIT with same check_number and amount_cents <= max_amount_cents presented while StopPayment.status == ACTIVE"
        side_effects:
          - "status -> CONSUMED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /accounts/{id}/run-stop-expiry OR account close/escheat cascade"
        actor: ComplianceOfficer | system
        preconditions:
          - "ledger_clock_date >= expires_on OR owning account transitions to CLOSED/ESCHEATED"
        side_effects:
          - "status -> EXPIRED; future matching CHECK_DEBIT posts normally"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ach-settle-stale-origination
    parent_entity: AchOrigination
    write_endpoint: "POST /ach-originations/{id}/settle"
    occ_field: "expected_ach_origination_version"
    description: |
      Settling an AchOrigination whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already amended the batch (added or removed an AchLeg, which legitimately
      bumps the origination's version) so the current settler's view of which legs
      will post is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ach-reverse-stale-origination
    parent_entity: AchOrigination
    write_endpoint: "POST /ach-originations/{id}/reverse"
    occ_field: "expected_ach_origination_version"
    description: |
      Reversing an AchOrigination whose version has advanced since the client last
      observed it is rejected. This captures the case where the batch was already
      settled (which advances the origination's version) and the current reverser's
      view of the produced transactions is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kyc_risk_scoring
    trigger: "Application SUBMITTED transition (POST /applications/{id}/submit)"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if Customer.country_of_residence != "US": score += 40
      age_years = floor((submit_date - Customer.date_of_birth) / 365.25)
      if age_years < 18: score += 60          # underage drives a forced rejection downstream
      if Customer.tax_id_last4 in SANCTIONED_LAST4 set: score += 50
      # count prior REJECTED Applications for this customer_id
      prior_rejections = count(Application where customer_id == this.customer_id and status == REJECTED)
      score += min(prior_rejections, 3) * 10
      kyc_risk_score = min(score, 100)        # ceiling clamp at 100
    input_set: "Customer attributes at submit time + all prior REJECTED Applications for the same customer_id"
    constants:
      SANCTIONED_LAST4: ["6666", "9999"]
      NON_US_WEIGHT: 40
      UNDERAGE_WEIGHT: 60
      SANCTIONS_WEIGHT: 50
      PRIOR_REJECTION_WEIGHT: 10
      PRIOR_REJECTION_CAP: 3
      RISK_CEILING: 100
    precision: "integer score, 0..100; approval gate at score >= 70"

  - name: cip_status_derivation
    trigger: "Application APPROVED or REJECTED transition"
    algorithm: projection
    formula: |
      Let latest = the Application for this customer_id with status in {APPROVED, REJECTED}
                   having the greatest created_at; tie-break by created_at then ERR is impossible
                   because created_at is unique per row.
      if no such Application: cip_status = UNVERIFIED
      elif latest.status == APPROVED: cip_status = VERIFIED
      else: cip_status = REJECTED
    input_set: "All adjudicated (APPROVED/REJECTED) Applications for the customer_id"
    precision: "enum"

  - name: available_balance
    trigger: "any Transaction status change (PENDING/POSTED/RETURNED/STOPPED), interest posting, fee assessment, escheat sweep"
    algorithm: aggregation
    formula: |
      ledger_balance_cents = sum( signed(t) for t in Transaction
                                  where account_id == A.id and status == POSTED )
        where signed(t) = +t.amount_cents if direction(t)==CREDIT else -t.amount_cents
      hold_total_cents = sum( t.amount_cents for t in Transaction
                              where account_id == A.id and status == PENDING and direction == DEBIT )
      available_balance_cents = ledger_balance_cents - hold_total_cents
    input_set: "POSTED transactions for ledger; PENDING DEBIT transactions for holds"
    precision: "integer cents; no rounding (cents are the atomic unit)"

  - name: overdraft_nsf_fee_tier
    trigger: "a DEBIT transaction posts into overdraft (OVERDRAFT) or is RETURNED for insufficient funds (NSF)"
    algorithm: tiered_pricing
    formula: |
      # tier_ordinal = 1 + count(FeeAssessment where account_id==A.id and assessed_date==ledger_clock_date)
      # i.e. the 1-based position of THIS fee among today's fee-bearing items.
      n = tier_ordinal
      if n == 1:            fee_amount_cents = 3000      # first item: $30.00
      elif n in {2, 3, 4}:  fee_amount_cents = 3500      # 2nd–4th item: $35.00
      else:                 fee_amount_cents = 0         # 5th+ item: daily cap, no fee
      # The fee itself is a FEE DEBIT Transaction that posts immediately and CAN push
      # the account further negative (fees are never NSF-returned, never recursively fee'd).
    input_set: "FeeAssessment rows for the same account with assessed_date == current ledger date"
    constants:
      TIER1_FEE_CENTS: 3000
      TIER2_4_FEE_CENTS: 3500
      DAILY_FEE_ITEM_CAP: 4
    precision: "integer cents; tier boundary is the 4th item inclusive (>4 => 0)"
    variants:
      - name: overdraft_paid
        when: "courtesy_pay_opted_in and post-debit available >= -courtesy_pay_limit_cents"
        difference: "fee_type=OVERDRAFT, the debit POSTS, balance may go negative"
      - name: nsf_returned
        when: "courtesy pay unavailable or floor breached"
        difference: "fee_type=NSF, the debit is RETURNED, balance unchanged by the item itself"

  - name: ach_settlement_posting
    trigger: "AchOrigination SETTLED transition (POST /ach-originations/{id}/settle)"
    algorithm: chronological
    formula: |
      legs = AchLeg rows for this origination.
      Order legs by posting_order:
        CHRONOLOGICAL: order ascending by AchLeg.created_at  (CANONICAL default).
        HIGH_TO_LOW:   order DEBIT legs descending by amount_cents, then ascending created_at
                       on ties; CREDIT legs always settle first (credits before debits).
      For each leg in order:
        if leg_role == CREDIT: post +amount_cents to creditor_account (always POSTED unless creditor CLOSED).
        if leg_role == DEBIT: apply the Transaction PENDING->POSTED/RETURNED rule against the
          debtor_account's CURRENT available_balance_cents (running, updated after each prior leg),
          assessing fees via overdraft_nsf_fee_tier in posting order.
      The running balance carries leg-to-leg, so posting_order changes how many DEBIT legs
      overdraw and therefore the total fees — this is the dual-variant divergence.
    input_set: "AchLeg rows of the settling origination; debtor account running balance"
    precision: "integer cents; posting order is the pinned tie-affecting axis"
    variants:
      - name: chronological_posting
        when: "posting_order == CHRONOLOGICAL"
        difference: "legs post oldest-first; fewer small debits bounce; canonical consumer-friendly order"
      - name: high_to_low_posting
        when: "posting_order == HIGH_TO_LOW"
        difference: "largest debit drains balance first; more small debits NSF; strictly >= fees vs chronological"

  - name: interest_accrual_apy
    trigger: "POST /accounts/{id}/post-interest"
    algorithm: tiered_pricing
    formula: |
      Resolve tier T = the ApyTier with code == Account.apy_tier_code.
      days = (period_end_date - period_start_date) in whole days   # end exclusive
      # Simple daily accrual on the period-start ledger balance, ACT/365 fixed.
      raw_cents = ledger_balance_cents_at_period_start * T.annual_rate_bps / 10000 * days / 365
      posted_interest_cents = floor(raw_cents)     # TRUNCATE toward zero to whole cents (pinned)
      # Posting creates an INTEREST CREDIT Transaction of posted_interest_cents and
      # resets accrued_interest_cents to 0.
    input_set: "ledger_balance_cents snapshot at period_start; resolved ApyTier.annual_rate_bps"
    constants:
      DAY_COUNT_BASIS: 365
      BPS_DIVISOR: 10000
    precision: "floor to whole cents AFTER the full multiplication (round-then-sum is NOT used); single pinned truncation step"

  - name: ach_reversal_invariant
    trigger: "AchOrigination REVERSED transition (POST /ach-originations/{id}/reverse)"
    algorithm: aggregation
    formula: |
      For each POSTED Transaction produced by this batch (its legs' produced_transaction_id),
      create an equal-and-opposite POSTED Transaction (CREDIT<->DEBIT, same amount_cents).
      For each FeeAssessment produced by this batch, create an offsetting FEE CREDIT Transaction
      of fee_amount_cents.
      INVARIANT (conserved quantity): across debtor + creditor accounts,
        sum(ledger_balance_cents over both accounts) after reverse
        == sum(ledger_balance_cents over both accounts) before this batch settled.
      i.e. settle followed by reverse leaves the two-account system ledger total unchanged.
    input_set: "Transactions and FeeAssessments whose origination is this batch"
    precision: "integer cents; conserved quantity = two-account ledger total"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids resolve, validated left-to-right (Account, Application, Customer, AchOrigination, ApyTier)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
    note: "Specialized: ERR_CUSTOMER_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_APY_TIER_NOT_FOUND override the generic where the missing resource is identified."

  - priority: 4
    category: business_referential
    check: "entity_backed AccountHolder X-User-ID must be an active AccountOwner of the target account (else cannot act)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "AccountHolder-initiated transactions, account close, stop-payment create"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: approver/rejecter X-User-ID must differ from Application.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /applications/{id}/approve, POST /applications/{id}/reject"

  - priority: 7
    category: business_safety
    check: "KYC gate: Application.kyc_risk_score must be < 70 to APPROVE"
    error_id: ERR_KYC_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 8
    category: business_constraint
    check: "OCC: expected_ach_origination_version must equal current AchOrigination.version on settle/reverse"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ach-originations/{id}/settle, POST /ach-originations/{id}/reverse"

  - priority: 9
    category: business_temporal
    check: "Dormancy not due: inactivity days < dormancy_threshold_days blocks ACTIVE->DORMANT"
    error_id: ERR_DORMANCY_NOT_DUE
    http_status: 409
    applies_to: "POST /accounts/{id}/run-dormancy-scan"

  - priority: 10
    category: business_temporal
    check: "Escheat not due: inactivity days < escheat_threshold_days blocks DORMANT->ESCHEATED"
    error_id: ERR_ESCHEAT_NOT_DUE
    http_status: 409
    applies_to: "POST /accounts/{id}/run-escheat-sweep"

  - priority: 11
    category: business_constraint
    check: "Account close requires ledger_balance_cents == 0"
    error_id: ERR_NONZERO_BALANCE
    http_status: 409
    applies_to: "POST /accounts/{id}/close"

  - priority: 12
    category: business_constraint
    check: "Account close requires no PENDING transactions and no STAGED AchLeg referencing the account"
    error_id: ERR_PENDING_ITEMS
    http_status: 409
    applies_to: "POST /accounts/{id}/close"

  - priority: 13
    category: business_constraint
    check: "POD_BENEFICIARY ownership: an account may carry at most one ACTIVE POD_BENEFICIARY AccountOwner"
    error_id: ERR_POD_ALREADY_DESIGNATED
    http_status: 409
    applies_to: "POST /accounts/{id}/owners"

  - priority: 14
    category: business_constraint
    check: "An account must always retain at least one PRIMARY active owner; removing the last PRIMARY is rejected"
    error_id: ERR_LAST_PRIMARY_OWNER
    http_status: 409
    applies_to: "DELETE /accounts/{id}/owners/{owner_id}"

  - priority: 15
    category: business_temporal
    check: "InterestPosting period [period_start_date, period_end_date) must not overlap an existing InterestPosting interval for the same account; adjacency (prior_end == new_start) is allowed (half-open day interval, gap=0 OK)"
    error_id: ERR_INTEREST_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /accounts/{id}/post-interest"

  - priority: 16
    category: business_constraint
    check: "At most one ACTIVE StopPayment may cover a given check_number on an account; amount-coverage bands [1, max_amount_cents] of two ACTIVE stops on the same check necessarily overlap (closed band from 1), so a second is rejected"
    error_id: ERR_DUPLICATE_STOP_PAYMENT
    http_status: 409
    applies_to: "POST /accounts/{id}/stop-payments"

  - priority: 17
    category: business_constraint
    check: "Stop payment expires_on must be strictly after the current ledger_clock_date"
    error_id: ERR_STOP_EXPIRY_IN_PAST
    http_status: 422
    applies_to: "POST /accounts/{id}/stop-payments"

  - priority: 18
    category: business_constraint
    check: "Transaction amount_cents must be a positive integer; ApyTier annual_rate_bps >= 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /accounts/{id}/transactions, POST /ach-originations/{id}/legs, POST /apy-tiers"

  - priority: 19
    category: business_constraint
    check: "Required body fields present and enum values within declared domains"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the ledger clock to a fixed UTC instant (drives dormancy/escheat/interest timing deterministically)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["ledger_clock_date advances to the date component of to_iso8601"]

  # ---- ApyTier (configuration) ----
  - method: POST
    path: "/apy-tiers"
    description: "Create an APY tier"
    roles: [ComplianceOfficer]
    code: 201
    input: [code, product_type, min_balance_cents, annual_rate_bps]
    output: ApyTier
    side_effects: []

  - method: GET
    path: "/apy-tiers"
    description: "List APY tiers (filterable by product_type)"
    roles: [ComplianceOfficer, Teller, AccountHolder]
    code: 200
    input: ["product_type?", "limit?", "offset?"]
    output: ApyTier[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer record (pre-CIP)"
    roles: [Teller, ComplianceOfficer]
    code: 201
    input: [legal_name, date_of_birth, tax_id_last4, "country_of_residence?"]
    output: Customer
    side_effects: ["cip_status initialized UNVERIFIED"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer including derived cip_status"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/applications"
    description: "List a customer's applications (FK reverse-reachability for Application.customer_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Application[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "Open a DRAFT application for a customer/product"
    roles: [Teller, ComplianceOfficer]
    code: 201
    input: [customer_id, product_type, requested_apy_tier_code]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications filtered by customer_id or opened_account_id (FK reverse-reachability for Application.customer_id and Application.opened_account_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "opened_account_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application for KYC adjudication"
    roles: [Teller]
    code: 200
    input: []
    output: Application
    side_effects: ["status->SUBMITTED", "kyc_risk_score computed", "submitted_by_user_id captured"]

  - method: POST
    path: "/applications/{id}/approve"
    description: "Approve a SUBMITTED application; opens an Account"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status->APPROVED", "Account+PRIMARY AccountOwner created", "opened_account_id set", "Customer.cip_status->VERIFIED"]

  - method: POST
    path: "/applications/{id}/reject"
    description: "Reject a SUBMITTED application"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason_code]
    output: Application
    side_effects: ["status->REJECTED", "Customer.cip_status->REJECTED"]

  # ---- Account ----
  - method: GET
    path: "/accounts/{id}"
    description: "Get an account with all computed balances and counters"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts (filter by origin_application_id, apy_tier_code, or status)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["origin_application_id?", "apy_tier_code?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/courtesy-pay"
    description: "Set Reg E/Reg DD courtesy-pay opt-in and limit"
    roles: [AccountHolder]
    code: 200
    input: [courtesy_pay_opted_in, "courtesy_pay_limit_cents?"]
    output: Account
    side_effects: ["courtesy_pay_opted_in / courtesy_pay_limit_cents updated"]

  - method: POST
    path: "/accounts/{id}/freeze"
    description: "Freeze an ACTIVE account (compliance hold)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->FROZEN"]

  - method: POST
    path: "/accounts/{id}/unfreeze"
    description: "Unfreeze a FROZEN account"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->ACTIVE"]

  - method: POST
    path: "/accounts/{id}/close"
    description: "Close a zero-balance ACTIVE account"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Account
    side_effects: ["status->CLOSED", "ACTIVE StopPayment->EXPIRED", "JOINT/POD owners deactivated"]

  - method: POST
    path: "/accounts/{id}/run-dormancy-scan"
    description: "Evaluate dormancy and transition ACTIVE->DORMANT if due"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->DORMANT when inactivity >= dormancy_threshold_days"]

  - method: POST
    path: "/accounts/{id}/run-escheat-sweep"
    description: "Evaluate escheat and sweep DORMANT->ESCHEATED if due"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["EscheatEvent created", "ESCHEAT_SWEEP txn posts", "status->ESCHEATED", "ACTIVE StopPayment->EXPIRED"]

  - method: POST
    path: "/accounts/{id}/run-stop-expiry"
    description: "Expire ACTIVE stop-payments whose expires_on <= ledger_clock_date"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["matured StopPayment->EXPIRED"]

  - method: POST
    path: "/accounts/{id}/post-interest"
    description: "Post tiered interest for a period; resets accrued_interest_cents. Rejects when [period_start_date, period_end_date) overlaps an existing posting (ERR_INTEREST_PERIOD_OVERLAP); adjacency allowed."
    roles: [ComplianceOfficer]
    code: 201
    input: [period_start_date, period_end_date]
    output: InterestPosting
    side_effects: ["INTEREST CREDIT txn posts", "accrued_interest_cents->0", "calc interest_accrual_apy"]

  # ---- AccountOwner ----
  - method: POST
    path: "/accounts/{id}/owners"
    description: "Add an owner (JOINT or POD_BENEFICIARY) to an account"
    roles: [AccountHolder, ComplianceOfficer]
    code: 201
    input: [customer_id, ownership_role]
    output: AccountOwner
    side_effects: ["AccountOwner created is_active=true"]

  - method: GET
    path: "/accounts/{id}/owners"
    description: "List owners of an account (FK reverse-reachability for AccountOwner.account_id)"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: AccountOwner[]
    side_effects: []

  - method: DELETE
    path: "/accounts/{id}/owners/{owner_id}"
    description: "Deactivate an owner (cannot remove the last PRIMARY)"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: []
    output: AccountOwner
    side_effects: ["AccountOwner.is_active->false"]

  - method: GET
    path: "/owners/{owner_id}"
    description: "Get a single AccountOwner row"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: AccountOwner
    side_effects: []

  - method: GET
    path: "/owners"
    description: "List AccountOwner rows filtered by customer_id (FK reverse-reachability for AccountOwner.customer_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "account_id?", "limit?", "offset?"]
    output: AccountOwner[]
    side_effects: []

  # ---- Transaction ----
  - method: POST
    path: "/accounts/{id}/transactions"
    description: "Post a customer-initiated transaction (DEPOSIT/WITHDRAWAL/CHECK_DEBIT); settles immediately"
    roles: [AccountHolder, Teller]
    code: 201
    input: [txn_type, amount_cents, "check_number?"]
    output: Transaction
    side_effects: ["balances recomputed", "fees assessed on overdraft/NSF", "stop-payment match -> STOPPED", "DORMANT reactivation on DEPOSIT/WITHDRAWAL"]

  - method: GET
    path: "/accounts/{id}/transactions"
    description: "List an account's transactions (FK reverse-reachability for Transaction.account_id)"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: ["status?", "txn_type?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: GET
    path: "/transactions/{id}"
    description: "Get a single transaction"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List transactions filtered by ach_origination_id (FK reverse-reachability for Transaction.ach_origination_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["ach_origination_id?", "account_id?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  # ---- FeeAssessment ----
  - method: GET
    path: "/accounts/{id}/fee-assessments"
    description: "List fee assessments for an account (FK reverse-reachability for FeeAssessment.account_id)"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: ["assessed_date?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  - method: GET
    path: "/fee-assessments/{id}"
    description: "Get a single fee assessment"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: GET
    path: "/fee-assessments"
    description: "List fee assessments filtered by source_transaction_id (FK reverse-reachability for FeeAssessment.source_transaction_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["source_transaction_id?", "account_id?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  # ---- StopPayment ----
  - method: POST
    path: "/accounts/{id}/stop-payments"
    description: "Place a stop-payment order on a check serial. Rejects a second ACTIVE stop on the same check_number (ERR_DUPLICATE_STOP_PAYMENT) and a non-future expires_on (ERR_STOP_EXPIRY_IN_PAST)."
    roles: [AccountHolder]
    code: 201
    input: [check_number, max_amount_cents, expires_on]
    output: StopPayment
    side_effects: ["StopPayment created ACTIVE"]

  - method: GET
    path: "/accounts/{id}/stop-payments"
    description: "List an account's stop-payments (FK reverse-reachability for StopPayment.account_id)"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StopPayment[]
    side_effects: []

  # ---- InterestPosting ----
  - method: GET
    path: "/accounts/{id}/interest-postings"
    description: "List interest postings for an account (FK reverse-reachability for InterestPosting.account_id)"
    roles: [Teller, ComplianceOfficer, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: InterestPosting[]
    side_effects: []

  # ---- EscheatEvent ----
  - method: GET
    path: "/accounts/{id}/escheat-events"
    description: "List escheat events for an account (FK reverse-reachability for EscheatEvent.account_id)"
    roles: [Teller, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EscheatEvent[]
    side_effects: []

  # ---- AchOrigination ----
  - method: POST
    path: "/ach-originations"
    description: "Stage an ACH origination batch between a debtor and creditor account"
    roles: [ComplianceOfficer, Teller]
    code: 201
    input: [debtor_account_id, creditor_account_id, "posting_order?"]
    output: AchOrigination
    side_effects: ["status=STAGED"]

  - method: GET
    path: "/ach-originations/{id}"
    description: "Get an ACH origination batch with computed totals"
    roles: [ComplianceOfficer, Teller]
    code: 200
    input: []
    output: AchOrigination
    side_effects: []

  - method: GET
    path: "/ach-originations"
    description: "List ACH originations filtered by debtor_account_id or creditor_account_id (FK reverse-reachability for both AchOrigination FKs)"
    roles: [ComplianceOfficer, Teller]
    code: 200
    input: ["debtor_account_id?", "creditor_account_id?", "status?", "limit?", "offset?"]
    output: AchOrigination[]
    side_effects: []

  - method: POST
    path: "/ach-originations/{id}/legs"
    description: "Add a DEBIT/CREDIT leg to a STAGED batch (bumps origination version)"
    roles: [ComplianceOfficer, Teller]
    code: 201
    input: [leg_role, amount_cents, expected_ach_origination_version]
    output: AchLeg
    side_effects: ["AchLeg created STAGED", "increments AchOrigination.version by 1"]

  - method: GET
    path: "/ach-originations/{id}/legs"
    description: "List legs of an ACH origination (FK reverse-reachability for AchLeg.ach_origination_id)"
    roles: [ComplianceOfficer, Teller]
    code: 200
    input: ["limit?", "offset?"]
    output: AchLeg[]
    side_effects: []

  - method: GET
    path: "/ach-legs/{id}"
    description: "Get a single ACH leg"
    roles: [ComplianceOfficer, Teller]
    code: 200
    input: []
    output: AchLeg
    side_effects: []

  - method: GET
    path: "/ach-legs"
    description: "List ACH legs filtered by produced_transaction_id or ach_origination_id (FK reverse-reachability for AchLeg.produced_transaction_id)"
    roles: [ComplianceOfficer, Teller]
    code: 200
    input: ["produced_transaction_id?", "ach_origination_id?", "limit?", "offset?"]
    output: AchLeg[]
    side_effects: []

  - method: POST
    path: "/ach-originations/{id}/settle"
    description: "Settle a STAGED batch: post legs in posting_order, assess fees, return NSF legs"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_ach_origination_version]
    output: AchOrigination
    side_effects: ["legs post (calc ach_settlement_posting)", "fees assessed", "totals recomputed", "increments AchOrigination.version by 1", "status->SETTLED"]

  - method: POST
    path: "/ach-originations/{id}/reverse"
    description: "Reverse a SETTLED batch: offset every produced transaction and fee (conserves two-account ledger total)"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_ach_origination_version]
    output: AchOrigination
    side_effects: ["offsetting transactions posted (calc ach_reversal_invariant)", "fees credited back", "increments AchOrigination.version by 1", "status->REVERSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "AccountHolder X-User-ID is not an active owner of the target account" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource id does not resolve" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer_id does not resolve" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Referenced debtor/creditor/target account_id does not resolve" }
  - { id: ERR_APY_TIER_NOT_FOUND, http: 404, condition: "requested_apy_tier_code does not resolve to an ApyTier for the product_type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver/rejecter X-User-ID equals the application's submitted_by_user_id" }
  - { id: ERR_KYC_RISK_TOO_HIGH, http: 409, condition: "kyc_risk_score >= 70 at approval" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_ach_origination_version does not match current version (OCC)" }
  - { id: ERR_DORMANCY_NOT_DUE, http: 409, condition: "Inactivity days < dormancy_threshold_days on dormancy scan" }
  - { id: ERR_ESCHEAT_NOT_DUE, http: 409, condition: "Inactivity days < escheat_threshold_days on escheat sweep" }
  - { id: ERR_NONZERO_BALANCE, http: 409, condition: "Account close attempted with ledger_balance_cents != 0" }
  - { id: ERR_PENDING_ITEMS, http: 409, condition: "Account close attempted with PENDING transactions or STAGED legs referencing the account" }
  - { id: ERR_POD_ALREADY_DESIGNATED, http: 409, condition: "Account already has an active POD_BENEFICIARY owner" }
  - { id: ERR_LAST_PRIMARY_OWNER, http: 409, condition: "Removing the only active PRIMARY owner is rejected" }
  - { id: ERR_INTEREST_PERIOD_OVERLAP, http: 409, condition: "New interest period overlaps an existing InterestPosting interval for the account (half-open; adjacency allowed)" }
  - { id: ERR_DUPLICATE_STOP_PAYMENT, http: 409, condition: "An ACTIVE StopPayment already covers this check_number on the account" }
  - { id: ERR_STOP_EXPIRY_IN_PAST, http: 422, condition: "Stop-payment expires_on not strictly after ledger_clock_date" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "amount_cents <= 0 or annual_rate_bps < 0" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field or enum value outside declared domain" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountHolder
    description: "A natural-person customer acting on accounts they own (deposits, withdrawals, courtesy-pay, stop-payments, close, owner management)"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /accounts/{id}/courtesy-pay — set Reg E/Reg DD opt-in"
      - "POST /accounts/{id}/close — close own account"
      - "POST /accounts/{id}/stop-payments — place stop order"
    shared_operations:
      - "POST /accounts/{id}/transactions — deposit/withdrawal (shared with Teller)"
      - "POST /accounts/{id}/owners — add JOINT/POD owner (shared with ComplianceOfficer)"
      - "DELETE /accounts/{id}/owners/{owner_id} — remove owner (shared with ComplianceOfficer)"
      - "GET endpoints on own account, customers, apy-tiers"

  - name: Teller
    description: "Branch employee who creates customers/applications, submits CIP applications, and posts over-the-counter transactions; barred from adjudicating their own submissions (SoD)"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/submit — submit application for KYC"
    shared_operations:
      - "POST /customers, POST /applications (shared with ComplianceOfficer)"
      - "POST /accounts/{id}/transactions (shared with AccountHolder)"
      - "POST /ach-originations, POST /ach-originations/{id}/legs (shared with ComplianceOfficer)"
      - "GET read endpoints"

  - name: ComplianceOfficer
    description: "Back-office officer who adjudicates KYC, runs dormancy/escheat/stop-expiry/interest jobs, manages APY tiers, freezes accounts, and settles/reverses ACH batches"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/approve — approve application (must differ from submitter)"
      - "POST /applications/{id}/reject — reject application"
      - "POST /apy-tiers — define APY tier"
      - "POST /accounts/{id}/freeze, POST /accounts/{id}/unfreeze"
      - "POST /accounts/{id}/run-dormancy-scan, run-escheat-sweep, run-stop-expiry"
      - "POST /accounts/{id}/post-interest"
      - "POST /ach-originations/{id}/settle, POST /ach-originations/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers, POST /applications (shared with Teller)"
      - "POST /ach-originations, POST /ach-originations/{id}/legs (shared with Teller)"
      - "POST /accounts/{id}/owners, DELETE owner (shared with AccountHolder)"
      - "GET read endpoints"
