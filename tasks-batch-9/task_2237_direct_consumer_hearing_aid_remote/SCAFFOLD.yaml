        constraints: "one of VERSION_DRIFT | POWER_LOSS | CHECKSUM | TIMEOUT"
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock instant the install completed"

  # ---------------------------------------------------------------- 20
  - name: ComplianceOverride
    description: "Dual-control authorization that lets a medically disqualified patient re-enter screening. Filed by one compliance officer and approved by a different one (segregation of duties)."
    common_fields: true
    fields:
      - name: patient_id
        type: uuid
        source: client
        description: "FK -> Patient.id; the disqualified patient this override applies to"
        constraints: "required; the patient must be in status MEDICALLY_DISQUALIFIED at filing time"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who filed the override"
        constraints: "required; immutable"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who approved it; null until APPROVED"
        constraints: "must differ from filed_by_user_id"
      - name: justification
        type: string
        source: client
        description: "Free-text clinical justification retained for audit"
        constraints: "required; 20..2000 characters"
      - name: status
        type: enum
        source: system
        description: "Approval state of the override"
        constraints: "one of PENDING | APPROVED | REJECTED"
        default: "PENDING"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the override was filed"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval or rejection; null while PENDING"

# =========================================================================
# 1.2 State Machine Table  (16 entries across 15 entities; DeviceOrder contributes two
#     independent state dimensions on the same row, addressed as
#     state_machines.DeviceOrder.payment_status.* and
#     state_machines.DeviceOrder.fulfillment_status.*)
# =========================================================================
state_machines:

  - entity: Patient
    state_field: status
    shape: cyclic
    initial_state: REGISTERED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: REGISTERED
        to: SCREENING_IN_PROGRESS
        trigger: "POST /patients/{patient_id}/screening-sessions"
        actor: Patient
        preconditions:
          - "patient.status == REGISTERED"
          - "patient.state_policy_id resolves to a StatePolicy with is_retired == false"
        side_effects:
          - "creates ScreeningSession in DRAFT with attempt_ordinal = 1"
          - "sets Patient.screening_attempt_count unchanged (only SCORED/INVALIDATED sessions count)"
      - from: SCREENING_IN_PROGRESS
        to: CANDIDATE_APPROVED
        trigger: "POST /screening-sessions/{id}/submit — scoring yields screening_outcome IN {PASS, ADVISORY_PASS}"
        actor: system
        preconditions:
          - "the submitted ScreeningSession has zero RedFlagFinding rows with severity == MANDATORY_REFERRAL"
          - "calculations.red_flag_referral_trigger advisory sum < ADVISORY_REFERRAL_THRESHOLD (2.5)"
          - "patient.age_years >= StatePolicy.min_age_years"
        side_effects:
          - "recomputes Patient.candidacy_risk_score via calculations.candidacy_risk_score variant PROVISIONAL_SELF_REPORTED and sets candidacy_risk_variant = PROVISIONAL_SELF_REPORTED"
          - "sets Patient.candidacy_risk_band from the recomputed score"
          - "sets Patient.advisory_weight_total and Patient.open_mandatory_flag_count = 0"
          - "increments Patient.screening_attempt_count"
      - from: SCREENING_IN_PROGRESS
        to: REFERRAL_REQUIRED
        trigger: "POST /screening-sessions/{id}/submit — scoring yields screening_outcome == RED_FLAG"
        actor: system
        preconditions:
          - "at least one RedFlagFinding with severity == MANDATORY_REFERRAL, OR advisory weight sum >= 2.5"
        side_effects:
          - "CASCADE-B hop 1: opens a ProviderReferral in OPEN with reason_codes from the findings, expires_at = clock + StatePolicy.referral_validity_days days"
          - "CASCADE-B hop 2: because Patient.status is now REFERRAL_REQUIRED, every DeviceOrder of this patient whose fulfillment_status IN {PENDING_FIT_CONFIRM, READY_TO_SHIP} moves fulfillment_status -> MEDICAL_HOLD with medical_hold_reason = MANDATORY_RED_FLAG"
          - "CASCADE-B hop 3: because those orders are now MEDICAL_HOLD, every RemoteFittingSession with status == SCHEDULED and session_type IN {INITIAL_FIT, FOLLOW_UP} referencing one of them moves to CANCELLED with no_show_charged_cents = 0"
          - "CASCADE-B hop 4: because those sessions were cancelled, calculations.provider_daily_capacity re-runs for each affected Provider, lowering Provider.booked_minutes_on_focus_date and Provider.utilization_pct"
          - "recomputes Patient.open_mandatory_flag_count and Patient.advisory_weight_total"
      - from: CANDIDATE_APPROVED
        to: REFERRAL_REQUIRED
        trigger: "POST /screening-sessions/{id}/submit on a later attempt yielding RED_FLAG"
        actor: system
        preconditions:
          - "the newly scored session supersedes the previously scored one"
        side_effects:
          - "same CASCADE-B hops 1-4 as the SCREENING_IN_PROGRESS -> REFERRAL_REQUIRED transition"
          - "sets the superseded ScreeningSession.status = INVALIDATED with invalidated_reason = SUPERSEDED"
      - from: PROVIDER_CLEARED
        to: REFERRAL_REQUIRED
        trigger: "POST /screening-sessions/{id}/submit on a later attempt yielding RED_FLAG"
        actor: system
        preconditions:
          - "the new session produced at least one MANDATORY_REFERRAL finding not already cleared"
        side_effects:
          - "same CASCADE-B hops 1-4"
      - from: REFERRAL_REQUIRED
        to: PROVIDER_CLEARED
        trigger: "POST /provider-referrals/{id}/determination with clearance_outcome = CLEARED"
        actor: LicensedAudiologist
        preconditions:
          - "referral.status == EVALUATED"
          - "referral.expires_at > current logical clock"
        side_effects:
          - "sets cleared_by_referral_id on every open RedFlagFinding named in referral.reason_codes and increments ProviderReferral.cleared_finding_count"
          - "recomputes Patient.open_mandatory_flag_count (expected 0) and Patient.advisory_weight_total"
          - "recomputes Patient.candidacy_risk_score via variant PROVIDER_ADJUSTED and sets candidacy_risk_variant = PROVIDER_ADJUSTED"
          - "releases every MEDICAL_HOLD order of this patient back to fulfillment_status = PENDING_FIT_CONFIRM and clears medical_hold_reason"
      - from: REFERRAL_REQUIRED
        to: MEDICALLY_DISQUALIFIED
        trigger: "POST /provider-referrals/{id}/determination with clearance_outcome = NOT_CLEARED"
        actor: LicensedAudiologist
        preconditions:
          - "referral.status == EVALUATED"
        side_effects:
          - "every DeviceOrder of this patient with fulfillment_status == MEDICAL_HOLD moves to CANCELLED"
          - "each such order's payment_status moves AUTHORIZED -> VOIDED, or CAPTURED -> REFUNDED with refunded_cents = captured_cents and retained_cents = 0 (regulatory full refund)"
          - "every CarePlanSubscription attached to those orders moves to CANCELLED"
      - from: REFERRAL_REQUIRED
        to: SCREENING_IN_PROGRESS
        trigger: "POST /patients/{patient_id}/screening-sessions after the blocking referral EXPIRED or was WITHDRAWN"
        actor: Patient
        preconditions:
          - "no ProviderReferral for this patient with status IN {OPEN, SCHEDULED, EVALUATED}"
        side_effects:
          - "creates a retake ScreeningSession with supersedes_session_id = the latest SCORED session id"
        note: "Cycle: REFERRAL_REQUIRED -> SCREENING_IN_PROGRESS -> {CANDIDATE_APPROVED | REFERRAL_REQUIRED} is the re-screen loop."
      - from: MEDICALLY_DISQUALIFIED
        to: SCREENING_IN_PROGRESS
        trigger: "POST /patients/{patient_id}/compliance-overrides/{override_id}/approve — second ComplianceOfficer approves the override"
        actor: ComplianceOfficer
        preconditions:
          - "the override was filed by a different ComplianceOfficer X-User-ID than the approver (segregation of duties)"
          - "patient.status == MEDICALLY_DISQUALIFIED"
        side_effects:
          - "invalidates the latest SCORED ScreeningSession with invalidated_reason = PROVIDER_OVERRIDE"
          - "creates a fresh ScreeningSession in DRAFT"
      - from: REGISTERED
        to: DEACTIVATED
        trigger: "DELETE /patients/{id}"
        actor: PlatformAdmin
        preconditions: ["patient has no DeviceOrder with fulfillment_status NOT IN {RETURNED, CANCELLED}"]
        side_effects: ["sets deactivated_at = current logical clock"]
      - from: CANDIDATE_APPROVED
        to: DEACTIVATED
        trigger: "DELETE /patients/{id}"
        actor: PlatformAdmin
        preconditions: ["patient has no DeviceOrder with fulfillment_status NOT IN {RETURNED, CANCELLED}"]
        side_effects: ["sets deactivated_at; cancels every ScreeningSession still in DRAFT by setting status = INVALIDATED, invalidated_reason = DATA_QUALITY"]
      - from: MEDICALLY_DISQUALIFIED
        to: DEACTIVATED
        trigger: "DELETE /patients/{id}"
        actor: PlatformAdmin
        preconditions: ["patient has no DeviceOrder with fulfillment_status NOT IN {RETURNED, CANCELLED}"]
        side_effects: ["sets deactivated_at"]

  - entity: ScreeningSession
    state_field: status
    shape: branching_with_revert
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "PATCH /screening-sessions/{id}"
        actor: Patient
        preconditions:
          - "session.status == DRAFT"
          - "acting Patient X-User-ID == session.patient_id"
        side_effects: ["stores pure_tone_avg_db, asymmetry_db, self_reported_difficulty_score, speech_in_noise_pct, symptom_codes"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /screening-sessions/{id}/submit"
        actor: Patient
        preconditions:
          - "all five measurement fields are non-null"
          - "patient.status IN {SCREENING_IN_PROGRESS}"
        side_effects: ["sets submitted_at = current logical clock"]
      - from: SUBMITTED
        to: SCORED
        trigger: "system, inside the same request as submit"
        actor: system
        preconditions: ["session.status == SUBMITTED"]
        side_effects:
          - "emits RedFlagFinding rows per calculations.red_flag_referral_trigger detection table"
          - "sets screening_outcome to PASS | ADVISORY_PASS | RED_FLAG and scored_at"
          - "drives the Patient transition to CANDIDATE_APPROVED or REFERRAL_REQUIRED"
      - from: SCORED
        to: INVALIDATED
        trigger: "POST /patients/{patient_id}/screening-sessions (retake) or compliance override approval"
        actor: system
        preconditions: ["a newer ScreeningSession exists whose supersedes_session_id == this id, or a ComplianceOfficer override was approved"]
        side_effects:
          - "sets invalidated_reason = SUPERSEDED or PROVIDER_OVERRIDE"
          - "excludes this session's open RedFlagFinding rows from Patient.advisory_weight_total"
      - from: IN_PROGRESS
        to: INVALIDATED
        trigger: "POST /screening-sessions/{id}/invalidate"
        actor: LicensedAudiologist
        preconditions:
          - "acting provider.provider_type == LICENSED_AUDIOLOGIST and provider.status == ACTIVE"
          - "provider.licensed_state_codes contains patient.state_code"
        side_effects: ["sets invalidated_reason = DATA_QUALITY"]
        note: "The provider that invalidates a session is recorded; the same provider may not later clear a referral triggered by a session they invalidated (segregation of duties)."
      - from: DRAFT
        to: INVALIDATED
        trigger: "DELETE /patients/{id} cascade"
        actor: system
        preconditions: ["patient transitioned to DEACTIVATED"]
        side_effects: ["sets invalidated_reason = DATA_QUALITY"]

  - entity: ProviderReferral
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLEARED, NOT_CLEARED, EXPIRED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /remote-fitting-sessions with session_type = REFERRAL_EVALUATION and provider_referral_id set"
        actor: Patient
        preconditions:
          - "referral.expires_at > current logical clock"
          - "selected Provider.provider_type == LICENSED_AUDIOLOGIST, status == ACTIVE, and licensed_state_codes contains patient.state_code"
          - "the selected provider did not invalidate referral.triggering_screening_session_id"
        side_effects:
          - "sets ProviderReferral.provider_id to the booked provider"
          - "recomputes Provider.booked_minutes_on_focus_date and utilization_pct"
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /remote-fitting-sessions/{id}/no-show or POST /remote-fitting-sessions/{id}/cancel"
        actor: HearingProfessional
        preconditions: ["the evaluation session moved to NO_SHOW or CANCELLED"]
        side_effects:
          - "increments ProviderReferral.reschedule_count"
          - "clears ProviderReferral.provider_id"
        note: "Cycle: OPEN -> SCHEDULED -> OPEN is the reschedule loop; a third reschedule is rejected by validations."
      - from: SCHEDULED
        to: EVALUATED
        trigger: "POST /remote-fitting-sessions/{id}/complete on the REFERRAL_EVALUATION session"
        actor: LicensedAudiologist
        preconditions: ["session.status == IN_PROGRESS", "referral.expires_at > current logical clock"]
        side_effects: ["sets clearance_outcome = PENDING awaiting the determination call"]
      - from: EVALUATED
        to: CLEARED
        trigger: "POST /provider-referrals/{id}/determination with clearance_outcome = CLEARED"
        actor: LicensedAudiologist
        preconditions:
          - "acting provider.id == referral.provider_id"
          - "acting provider did not invalidate referral.triggering_screening_session_id"
        side_effects:
          - "clears matching RedFlagFinding rows, increments cleared_finding_count"
          - "drives Patient REFERRAL_REQUIRED -> PROVIDER_CLEARED and its MEDICAL_HOLD release cascade"
      - from: EVALUATED
        to: NOT_CLEARED
        trigger: "POST /provider-referrals/{id}/determination with clearance_outcome = NOT_CLEARED"
        actor: LicensedAudiologist
        preconditions: ["acting provider.id == referral.provider_id"]
        side_effects: ["drives Patient REFERRAL_REQUIRED -> MEDICALLY_DISQUALIFIED and its order-cancel + full-refund + plan-cancel cascade"]
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past expires_at, evaluated lazily on the next read or write touching this referral"
        actor: system
        preconditions: ["current logical clock >= referral.expires_at"]
        side_effects: ["leaves Patient.status == REFERRAL_REQUIRED; the patient may now start a retake screening"]
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past expires_at"
        actor: system
        preconditions: ["current logical clock >= referral.expires_at"]
        side_effects: ["cancels the linked REFERRAL_EVALUATION session (status -> CANCELLED) and recomputes that Provider's booked_minutes_on_focus_date"]
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /provider-referrals/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions: ["referral.status == OPEN", "no RemoteFittingSession referencing this referral in status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["records withdrawal; the patient may start a retake screening"]

  - entity: RemoteFittingSession
    state_field: status
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /remote-fitting-sessions (creation confirms the slot in the same request)"
        actor: Patient
        preconditions:
          - "provider.status == ACTIVE"
          - "for a patient whose StatePolicy.telehealth_fitting_permitted == false, provider.licensed_state_codes contains patient.state_code"
          - "no overlap under calculations.fitting_slot_overlap (half-open [start,end) widened by provider.buffer_minutes on both sides)"
          - "calculations.provider_daily_capacity booked + duration_minutes <= provider.daily_capacity_minutes"
        side_effects:
          - "recomputes Provider.booked_minutes_on_focus_date and Provider.utilization_pct"
          - "for session_type == REFERRAL_EVALUATION, drives ProviderReferral OPEN -> SCHEDULED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /remote-fitting-sessions/{id}/start"
        actor: HearingProfessional
        preconditions:
          - "current logical clock >= scheduled_start_utc"
          - "current logical clock < scheduled_end_utc"
          - "for session_type == INITIAL_FIT: the linked DeviceOrder.fulfillment_status == DELIVERED"
        side_effects: ["no derived-field change"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /remote-fitting-sessions/{id}/complete"
        actor: HearingProfessional
        preconditions: ["programming_profile is non-null for session_type IN {INITIAL_FIT, FOLLOW_UP, TROUBLESHOOT}"]
        side_effects:
          - "sets completed_at and increments Provider.completed_session_count"
          - "for session_type == INITIAL_FIT, sets the linked DeviceOrder's Device.status = WITH_PATIENT if not already"
          - "for session_type == REFERRAL_EVALUATION, drives ProviderReferral SCHEDULED -> EVALUATED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /remote-fitting-sessions/{id}/no-show"
        actor: HearingProfessional
        preconditions: ["current logical clock >= scheduled_end_utc", "session.status == SCHEDULED"]
        side_effects:
          - "sets no_show_charged_cents = NO_SHOW_FEE_CENTS (2500) when the patient has a CarePlanSubscription with status IN {ACTIVE, PAST_DUE}, else 0"
          - "debits CarePlanSubscription.credit_balance_cents first, charging only the shortfall to the next cycle"
          - "recomputes Provider.booked_minutes_on_focus_date"
          - "for session_type == REFERRAL_EVALUATION, drives ProviderReferral SCHEDULED -> OPEN"
      - from: NO_SHOW
        to: REQUESTED
        trigger: "POST /remote-fitting-sessions/{id}/rebook"
        actor: Patient
        preconditions: ["patient.status NOT IN {MEDICALLY_DISQUALIFIED, DEACTIVATED}"]
        side_effects: ["clears scheduled_start_utc/scheduled_end_utc pending a new slot"]
        note: "Cycle: SCHEDULED -> NO_SHOW -> REQUESTED -> SCHEDULED."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /remote-fitting-sessions/{id}/cancel"
        actor: Patient
        preconditions: ["current logical clock < scheduled_start_utc"]
        side_effects:
          - "sets no_show_charged_cents = LATE_CANCEL_FEE_CENTS (1000) when the cancel lands within 24h of scheduled_start_utc and the patient holds a plan with status IN {ACTIVE, PAST_DUE}, else 0"
          - "recomputes Provider.booked_minutes_on_focus_date and utilization_pct"
          - "for session_type == REFERRAL_EVALUATION, drives ProviderReferral SCHEDULED -> OPEN"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from Patient -> REFERRAL_REQUIRED (CASCADE-B hop 3)"
        actor: system
        preconditions: ["the session's DeviceOrder moved to MEDICAL_HOLD in this request"]
        side_effects: ["sets no_show_charged_cents = 0 (fee always waived on medical hold) and recomputes Provider.booked_minutes_on_focus_date"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /remote-fitting-sessions/{id}/cancel"
        actor: Patient
        preconditions: ["session.status == REQUESTED"]
        side_effects: ["no capacity recompute (an unscheduled session occupies no interval)"]

  - entity: DeviceOrder
    state_field: payment_status
    shape: parallel
    dimension_note: "Independent of fulfillment_status; both dimensions live on one DeviceOrder row and advance under separate triggers."
    initial_state: PENDING_AUTH
    terminal_states: [REFUNDED, AUTH_FAILED, VOIDED]
    transitions:
      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "POST /_payments/simulate with outcome = AUTHORIZED"
        actor: PlatformAdmin
        preconditions: ["order.payment_status == PENDING_AUTH"]
        side_effects: ["no cash movement; captured_cents stays 0"]
      - from: PENDING_AUTH
        to: AUTH_FAILED
        trigger: "POST /_payments/simulate with outcome = DECLINED"
        actor: PlatformAdmin
        preconditions: ["order.payment_status == PENDING_AUTH"]
        side_effects: ["moves fulfillment_status to CANCELLED"]
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /device-orders/{id}/ship"
        actor: CareOpsAgent
        preconditions: ["order.fulfillment_status == READY_TO_SHIP"]
        side_effects:
          - "sets captured_cents = total_cents, retained_cents = 0, refunded_cents = 0, open_balance_cents = total_cents"
          - "advances fulfillment_status READY_TO_SHIP -> SHIPPED"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system cascade from Patient -> MEDICALLY_DISQUALIFIED, or POST /device-orders/{id}/cancel"
        actor: system
        preconditions: ["captured_cents == 0"]
        side_effects: ["moves fulfillment_status to CANCELLED; all cash counters remain 0"]
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /return-authorizations/{id}/settle when restocking_fee_cents + non_refundable_shipping_cents > 0"
        actor: system
        preconditions: ["the ReturnAuthorization reached INSPECTED", "refund_amount_cents > 0"]
        side_effects:
          - "sets refunded_cents += refund_amount_cents and retained_cents += restocking_fee_cents + non_refundable_shipping_cents"
          - "sets open_balance_cents = captured_cents - refunded_cents - retained_cents (expected 0 for a whole-order return)"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /return-authorizations/{id}/settle when restocking is WAIVED, or regulatory full refund on MEDICALLY_DISQUALIFIED"
        actor: system
        preconditions: ["refund_amount_cents == captured_cents"]
        side_effects: ["sets refunded_cents = captured_cents, retained_cents = 0, open_balance_cents = 0"]
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /return-authorizations/{id}/waive-restocking"
        actor: ComplianceOfficer
        preconditions: ["the settled ReturnAuthorization has restocking_fee_cents > 0", "settled_at within 30 days of the current logical clock"]
        side_effects:
          - "COMPENSATING ACTION: refunds the retained restocking, setting refunded_cents = captured_cents, retained_cents = 0, open_balance_cents = 0"
          - "sets ReturnAuthorization.restocking_variant = WAIVED, restocking_fee_cents = 0, non_refundable_shipping_cents = 0, refund_amount_cents = captured_cents"
          - "INVARIANT (cash conservation): captured_cents == refunded_cents + retained_cents + open_balance_cents holds before and after"

  - entity: DeviceOrder
    state_field: fulfillment_status
    shape: parallel
    dimension_note: "Independent of payment_status; MEDICAL_HOLD is reachable from two forward states and is exited only by clearance or cancellation."
    initial_state: PENDING_FIT_CONFIRM
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: PENDING_FIT_CONFIRM
        to: READY_TO_SHIP
        trigger: "POST /device-orders/{id}/confirm-fit"
        actor: CareOpsAgent
        preconditions:
          - "patient.status IN {CANDIDATE_APPROVED, PROVIDER_CLEARED}"
          - "patient.open_mandatory_flag_count == 0"
          - "when the pinned StatePolicy.waiver_required is true, patient.waiver_acknowledged_at is non-null"
          - "an InventoryPool row matching (order.model, order.dome_size, order.tip_type) has on_hand_units >= 1"
          - "order.payment_status == AUTHORIZED"
        side_effects:
          - "reserves 1 unit: InventoryPool.on_hand_units -= 1, reserved_units += 1"
          - "assigns an IN_STOCK Device of the same model: Device.status -> ASSIGNED, Device.device_order_id = order.id"
      - from: PENDING_FIT_CONFIRM
        to: MEDICAL_HOLD
        trigger: "system cascade from Patient -> REFERRAL_REQUIRED (CASCADE-B hop 2)"
        actor: system
        preconditions: ["patient.status became REFERRAL_REQUIRED in this request"]
        side_effects: ["sets medical_hold_reason = MANDATORY_RED_FLAG and triggers CASCADE-B hop 3 on scheduled sessions"]
      - from: READY_TO_SHIP
        to: MEDICAL_HOLD
        trigger: "system cascade from Patient -> REFERRAL_REQUIRED (CASCADE-B hop 2)"
        actor: system
        preconditions: ["patient.status became REFERRAL_REQUIRED in this request"]
        side_effects:
          - "sets medical_hold_reason = MANDATORY_RED_FLAG"
          - "releases the inventory reservation: InventoryPool.reserved_units -= 1, on_hand_units += 1"
          - "returns the assigned Device to status IN_STOCK and clears Device.device_order_id"
          - "triggers CASCADE-B hop 3 on scheduled sessions"
      - from: MEDICAL_HOLD
        to: PENDING_FIT_CONFIRM
        trigger: "system cascade from ProviderReferral -> CLEARED"
        actor: system
        preconditions: ["patient.status became PROVIDER_CLEARED in this request"]
        side_effects: ["clears medical_hold_reason; no inventory movement (the reservation was already released)"]
      - from: MEDICAL_HOLD
        to: CANCELLED
        trigger: "system cascade from ProviderReferral -> NOT_CLEARED, or POST /device-orders/{id}/cancel"
        actor: system
        preconditions: ["patient.status became MEDICALLY_DISQUALIFIED, or a CareOpsAgent cancelled the order"]
        side_effects: ["drives payment_status AUTHORIZED -> VOIDED or CAPTURED -> REFUNDED (regulatory full refund) and cancels any attached CarePlanSubscription"]
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /device-orders/{id}/ship"
        actor: CareOpsAgent
        preconditions: ["order.payment_status == AUTHORIZED", "an assigned Device exists with status == ASSIGNED"]
        side_effects:
          - "advances payment_status AUTHORIZED -> CAPTURED"
          - "sets Device.shipped_at = current logical clock and Device.warranty_expires_at = shipped_at + 730 days"
          - "moves the reserved inventory unit to dispatched: InventoryPool.reserved_units -= 1, dispatched_units += 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /_shipments/scan with event = DELIVERED"
        actor: PlatformAdmin
        preconditions: ["order.fulfillment_status == SHIPPED"]
        side_effects:
          - "sets delivered_at, Device.status = WITH_PATIENT"
          - "creates TrialPeriod in ACTIVE with started_at = delivered_at, nominal_end_utc = started_at + pinned_trial_days days"
          - "activates any TRIALING CarePlanSubscription attached to this order (status -> ACTIVE, cycle_start_utc = delivered_at)"
      - from: DELIVERED
        to: RETURN_IN_TRANSIT
        trigger: "POST /_shipments/scan with event = RETURN_PICKED_UP"
        actor: PlatformAdmin
        preconditions: ["a ReturnAuthorization for this order's TrialPeriod exists with status == ISSUED"]
        side_effects: ["advances that ReturnAuthorization ISSUED -> IN_TRANSIT"]
      - from: RETURN_IN_TRANSIT
        to: RETURNED
        trigger: "POST /return-authorizations/{id}/settle (CASCADE-A hop 2)"
        actor: system
        preconditions: ["the ReturnAuthorization reached INSPECTED"]
        side_effects:
          - "CASCADE-A hop 3: because fulfillment_status is now RETURNED, Device.status -> RETIRED and Device.device_order_id is retained for audit"
          - "CASCADE-A hop 4: because the Device is RETIRED, every CarePlanSubscription attached to this order moves to CANCELLED"
          - "CASCADE-A hop 5: because the subscription is CANCELLED, every FirmwareRollout on this Device with status IN {PENDING, OFFERED} moves to CANCELLED_INELIGIBLE and the campaign's rollout_count/failure_rate_pct are recomputed"
      - from: PENDING_FIT_CONFIRM
        to: CANCELLED
        trigger: "POST /device-orders/{id}/cancel"
        actor: CareOpsAgent
        preconditions: ["order.payment_status IN {PENDING_AUTH, AUTHORIZED}"]
        side_effects: ["voids the authorization; no inventory movement"]
      - from: READY_TO_SHIP
        to: CANCELLED
        trigger: "POST /device-orders/{id}/cancel"
        actor: CareOpsAgent
        preconditions: ["order.payment_status == AUTHORIZED"]
        side_effects:
          - "releases the reservation: InventoryPool.reserved_units -= 1, on_hand_units += 1"
          - "returns the assigned Device to IN_STOCK and clears its device_order_id"
          - "advances payment_status AUTHORIZED -> VOIDED"
          - "INVARIANT (inventory conservation): on_hand_units + reserved_units + dispatched_units == total_units_received holds before and after"

  - entity: TrialPeriod
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [RETURN_SETTLED, EXPIRED_KEPT, VOIDED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /repair-orders/{id}/receive (depot receipt of a device under trial)"
        actor: RepairTechnician
        preconditions: ["repair_order.pauses_trial == true", "trial.status == ACTIVE"]
        side_effects:
          - "appends a pause interval [current logical clock, null] to pause_intervals"
          - "recomputes paused_days and days_used via calculations.trial_days_used"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /repair-orders/{id}/return-to-patient"
        actor: RepairTechnician
        preconditions: ["trial.status == PAUSED", "the open pause interval has pause_end_utc == null"]
        side_effects:
          - "closes the open pause interval at the current logical clock"
          - "recomputes paused_days, days_used and effective_end_utc = nominal_end_utc + paused_days + extension_days_granted days"
        note: "Cycle: ACTIVE -> PAUSED -> ACTIVE repeats once per repair; pause intervals are closed intervals that may touch but never overlap."
      - from: ACTIVE
        to: RETURN_INITIATED
        trigger: "POST /trial-periods/{trial_period_id}/return-authorizations"
        actor: Patient
        preconditions:
          - "current logical clock <= trial.effective_end_utc"
          - "the order's pinned StatePolicy.restocking_fee_mode is any value (PROHIBITED yields a WAIVED variant, not a rejection)"
          - "no RepairOrder on the order's Device with status IN {KIT_SENT, RECEIVED, IN_REPAIR}"
          - "no FitExchange on the order with status IN {RESERVED, SHIPPED}"
        side_effects:
          - "creates ReturnAuthorization in ISSUED with days_used_at_issue = trial.days_used and return_deadline_utc = clock + 14 days"
          - "increments DeviceOrder.version by 1 (OCC guard for the return path)"
      - from: RETURN_INITIATED
        to: ACTIVE
        trigger: "POST /return-authorizations/{id}/void"
        actor: CareOpsAgent
        preconditions: ["the ReturnAuthorization status == ISSUED", "current logical clock <= trial.effective_end_utc"]
        side_effects:
          - "COMPENSATING ACTION: sets ReturnAuthorization.status = VOIDED, restocking_fee_cents = 0, refund_amount_cents = 0"
          - "INVARIANT (cash conservation): DeviceOrder.captured_cents == refunded_cents + retained_cents + open_balance_cents is unchanged by the issue/void pair"
        note: "Cycle: ACTIVE -> RETURN_INITIATED -> ACTIVE is the return-then-change-mind loop."
      - from: RETURN_INITIATED
        to: RETURN_SETTLED
        trigger: "POST /return-authorizations/{id}/settle (CASCADE-A hop 1)"
        actor: CareOpsAgent
        preconditions: ["the ReturnAuthorization status == INSPECTED"]
        side_effects:
          - "CASCADE-A hop 2: because the trial is RETURN_SETTLED, DeviceOrder.fulfillment_status -> RETURNED and payment_status -> PARTIALLY_REFUNDED or REFUNDED"
          - "increments Patient.lifetime_return_count"
      - from: ACTIVE
        to: EXPIRED_KEPT
        trigger: "POST /_clock/set_current_utc advancing past effective_end_utc, evaluated lazily on the next read or write touching this trial"
        actor: system
        preconditions: ["current logical clock > trial.effective_end_utc", "no ReturnAuthorization in status IN {ISSUED, IN_TRANSIT, RECEIVED, INSPECTED}"]
        side_effects: ["freezes days_used at the value computed at effective_end_utc; the device is now the patient's property"]
      - from: PAUSED
        to: EXPIRED_KEPT
        trigger: "POST /_clock/set_current_utc advancing past effective_end_utc while a pause is open"
        actor: system
        preconditions: ["current logical clock > trial.effective_end_utc"]
        side_effects: ["closes the open pause interval at effective_end_utc and freezes days_used"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system cascade from DeviceOrder.fulfillment_status -> CANCELLED"
        actor: system
        preconditions: ["the order was cancelled for a regulatory reason"]
        side_effects: ["voids any ISSUED ReturnAuthorization and cancels any attached CarePlanSubscription"]

  - entity: ReturnAuthorization
    state_field: status
    shape: branching_with_revert
    initial_state: ISSUED
    terminal_states: [REFUND_SETTLED, EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: IN_TRANSIT
        trigger: "POST /_shipments/scan with event = RETURN_PICKED_UP"
        actor: PlatformAdmin
        preconditions: ["status == ISSUED", "current logical clock <= return_deadline_utc"]
        side_effects: ["advances DeviceOrder.fulfillment_status DELIVERED -> RETURN_IN_TRANSIT"]
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /return-authorizations/{id}/receive"
        actor: CareOpsAgent
        preconditions: ["current logical clock <= return_deadline_utc"]
        side_effects: ["sets received_at = current logical clock"]
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /return-authorizations/{id}/inspect"
        actor: CareOpsAgent
        preconditions: ["inspection_grade is supplied"]
        side_effects:
          - "runs calculations.return_refund_settlement, writing restocking_variant, restocking_fee_cents, non_refundable_shipping_cents and refund_amount_cents"
          - "for inspection_grade == RESELLABLE, credits one unit back: InventoryPool.dispatched_units -= 1, on_hand_units += 1"
          - "for inspection_grade IN {REFURBISHABLE, DAMAGED}, no inventory credit (the unit leaves the conserved pool total via total_units_received adjustment recorded by the restock endpoint)"
      - from: INSPECTED
        to: REFUND_SETTLED
        trigger: "POST /return-authorizations/{id}/settle"
        actor: CareOpsAgent
        preconditions: ["refund_amount_cents has been computed", "DeviceOrder.payment_status == CAPTURED"]
        side_effects:
          - "sets settled_at; drives TrialPeriod RETURN_INITIATED -> RETURN_SETTLED (CASCADE-A hop 1)"
          - "sets Device.status = RETIRED (CASCADE-A hop 3)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past return_deadline_utc"
        actor: system
        preconditions: ["current logical clock > return_deadline_utc"]
        side_effects: ["reverts TrialPeriod RETURN_INITIATED -> ACTIVE when the trial's effective_end_utc has not passed, otherwise drives it to EXPIRED_KEPT"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /return-authorizations/{id}/void"
        actor: CareOpsAgent
        preconditions: ["status == ISSUED"]
        side_effects: ["reverts TrialPeriod RETURN_INITIATED -> ACTIVE"]

  - entity: FitExchange
    state_field: status
    shape: branching_with_revert
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /device-orders/{device_order_id}/fit-exchanges (reservation happens in the same request)"
        actor: Patient
        preconditions:
          - "order.fulfillment_status == DELIVERED"
          - "(to_dome_size, to_tip_type) != (order.dome_size, order.tip_type)"
          - "the target InventoryPool exists, is_discontinued == false and on_hand_units >= 1"
          - "the order's TrialPeriod.status IN {ACTIVE, PAUSED} OR the patient holds a CarePlanSubscription with status IN {ACTIVE, PAST_DUE}"
        side_effects:
          - "sets to_inventory_pool_id and from_inventory_pool_id"
          - "reserves the target unit: to_pool.on_hand_units -= 1, to_pool.reserved_units += 1"
          - "computes exchange_fee_cents via calculations.fit_exchange_fee and, when > 0, debits CarePlanSubscription.credit_balance_cents then charges the shortfall on the next cycle"
          - "increments DeviceOrder.version by 1 (OCC guard for the exchange path)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /device-orders/{device_order_id}/fit-exchanges when the target pool is depleted and the caller passed allow_backorder = false"
        actor: system
        preconditions: ["target pool on_hand_units == 0"]
        side_effects: ["sets rejection_reason = POOL_DEPLETED; no inventory movement"]
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /fit-exchanges/{id}/ship"
        actor: CareOpsAgent
        preconditions: ["status == RESERVED"]
        side_effects: ["no counter change: the unit stays in reserved_units until the patient confirms"]
      - from: SHIPPED
        to: COMPLETED
        trigger: "POST /fit-exchanges/{id}/confirm"
        actor: Patient
        preconditions: ["status == SHIPPED", "acting Patient X-User-ID == the order's patient_id"]
        side_effects:
          - "sets DeviceOrder.dome_size = to_dome_size and tip_type = to_tip_type"
          - "to_pool.reserved_units -= 1, to_pool.dispatched_units += 1"
          - "from_pool.dispatched_units -= 1, from_pool.on_hand_units += 1 (the outgoing configuration returns to stock)"
          - "INVARIANT (inventory conservation): for each pool, on_hand_units + reserved_units + dispatched_units == total_units_received holds before and after"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fit-exchanges/{id}/cancel"
        actor: Patient
        preconditions: ["status == RESERVED"]
        side_effects:
          - "COMPENSATING ACTION: to_pool.reserved_units -= 1, to_pool.on_hand_units += 1"
          - "refunds exchange_fee_cents to CarePlanSubscription.credit_balance_cents when it was charged"
          - "INVARIANT (inventory conservation) restored exactly to the pre-request value"
      - from: SHIPPED
        to: CANCELLED
        trigger: "POST /fit-exchanges/{id}/cancel"
        actor: CareOpsAgent
        preconditions: ["status == SHIPPED", "the order's TrialPeriod.status != RETURN_SETTLED"]
        side_effects:
          - "COMPENSATING ACTION: to_pool.reserved_units -= 1, to_pool.on_hand_units += 1; exchange fee credited back"

  - entity: RepairOrder
    state_field: status
    shape: branching_fork_join
    initial_state: KIT_REQUESTED
    terminal_states: [RETURNED_TO_PATIENT, ESCALATED_TO_WARRANTY, CANCELLED]
    transitions:
      - from: KIT_REQUESTED
        to: KIT_SENT
        trigger: "POST /repair-orders/{id}/send-kit"
        actor: CareOpsAgent
        preconditions: ["device.status == WITH_PATIENT"]
        side_effects: ["no derived-field change"]
      - from: KIT_SENT
        to: RECEIVED
        trigger: "POST /repair-orders/{id}/receive"
        actor: RepairTechnician
        preconditions: ["device.status == WITH_PATIENT"]
        side_effects:
          - "sets received_at, Device.status = IN_REPAIR, and sla_days from the plan tier"
          - "when pauses_trial == true, drives TrialPeriod ACTIVE -> PAUSED"
      - from: RECEIVED
        to: IN_REPAIR
        trigger: "POST /repair-orders/{id}/start"
        actor: RepairTechnician
        preconditions: ["status == RECEIVED"]
        side_effects: ["no derived-field change"]
      - from: IN_REPAIR
        to: REPAIRED
        trigger: "POST /repair-orders/{id}/resolve with resolution = REPAIRED"
        actor: RepairTechnician
        preconditions: ["fault_code != PHYSICAL_DAMAGE or the patient already paid a warranty deductible"]
        side_effects: ["branch A: repairable path; no warranty claim is created"]
      - from: IN_REPAIR
        to: UNREPAIRABLE
        trigger: "POST /repair-orders/{id}/resolve with resolution = UNREPAIRABLE"
        actor: RepairTechnician
        preconditions: ["status == IN_REPAIR"]
        side_effects: ["branch B: sets Device.status = REPLACED pending a warranty determination"]
      - from: REPAIRED
        to: RETURNED_TO_PATIENT
        trigger: "POST /repair-orders/{id}/return-to-patient"
        actor: RepairTechnician
        preconditions: ["status == REPAIRED"]
        side_effects:
          - "sets closed_at, turnaround_days and sla_credit_cents via calculations.repair_sla_credit"
          - "credits CarePlanSubscription.credit_balance_cents += sla_credit_cents when a plan is linked"
          - "sets Device.status = WITH_PATIENT"
          - "when the trial was paused by this repair, drives TrialPeriod PAUSED -> ACTIVE, extending effective_end_utc by paused_days"
      - from: UNREPAIRABLE
        to: ESCALATED_TO_WARRANTY
        trigger: "POST /repair-orders/{id}/escalate"
        actor: RepairTechnician
        preconditions: ["status == UNREPAIRABLE", "device.warranty_expires_at > current logical clock OR the fault_code == FIRMWARE_BRICK"]
        side_effects:
          - "sets closed_at, turnaround_days, sla_credit_cents and credits the plan"
          - "creates a WarrantyClaim in FILED with claim_kind = DEFECT and originating_repair_order_id = this repair"
          - "when the trial was paused by this repair, drives TrialPeriod PAUSED -> ACTIVE"
        note: "Branch B rejoins the DEFECT warranty path; branch A (REPAIRED) never creates a claim. Divergent side-effect sets per branch."
      - from: KIT_REQUESTED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: Patient
        preconditions: ["status == KIT_REQUESTED"]
        side_effects: ["no derived-field change"]
      - from: KIT_SENT
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: CareOpsAgent
        preconditions: ["status == KIT_SENT"]
        side_effects: ["no trial pause occurred, so no trial adjustment"]

  - entity: WarrantyClaim
    state_field: status
    shape: branching_fork_join
    initial_state: FILED
    terminal_states: [FULFILLED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /warranty-claims/{id}/triage"
        actor: RepairTechnician
        preconditions: ["status == FILED", "device.status NOT IN {RETIRED}"]
        side_effects:
          - "sets triaged_at, device_age_months, claim_ordinal and Device.age_months_at_last_claim"
          - "computes deductible_cents via calculations.warranty_deductible"
      - from: TRIAGED
        to: APPROVED_REPLACEMENT
        trigger: "POST /warranty-claims/{id}/decide with decision = REPLACE"
        actor: ComplianceOfficer
        preconditions:
          - "claim_kind IN {LOSS, DAMAGE} implies device.loss_damage_claims_approved < StatePolicy.max_loss_damage_claims"
          - "device.warranty_expires_at > current logical clock OR claim_kind == LOSS"
        side_effects:
          - "branch REPLACE: mints a new Device in IN_STOCK, assigns it to the same device_order_id, sets old Device.replaced_by_device_id and old Device.status = REPLACED (or LOST when claim_kind == LOSS)"
          - "sets replacement_device_id; new Device.firmware_version = '4.0.0', so pending FirmwareRollout rows on the old device move to CANCELLED_INELIGIBLE"
      - from: TRIAGED
        to: APPROVED_REPAIR
        trigger: "POST /warranty-claims/{id}/decide with decision = REPAIR"
        actor: ComplianceOfficer
        preconditions: ["claim_kind IN {DEFECT, DAMAGE}", "device.warranty_expires_at > current logical clock"]
        side_effects:
          - "branch REPAIR: creates a RepairOrder in KIT_REQUESTED for the same device with fault_code copied from the originating repair, or PHYSICAL_DAMAGE for a DAMAGE claim"
          - "no replacement device is minted and replacement_device_id stays null"
      - from: TRIAGED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/decide with decision = DENY"
        actor: ComplianceOfficer
        preconditions: ["status == TRIAGED"]
        side_effects: ["sets denial_reason to WARRANTY_EXPIRED | CLAIM_CAP_REACHED | NOT_COVERED_FAULT | DEVICE_RETIRED per the failing predicate"]
      - from: APPROVED_REPLACEMENT
        to: FULFILLED
        trigger: "POST /warranty-claims/{id}/fulfill"
        actor: CareOpsAgent
        preconditions: ["deductible_paid_cents == deductible_cents"]
        side_effects:
          - "sets replacement Device.status = WITH_PATIENT, shipped_at = current logical clock, warranty_expires_at = the ORIGINAL device's warranty_expires_at (warranty is not extended by a replacement)"
          - "recomputes Device.loss_damage_claims_approved on the original device"
      - from: APPROVED_REPAIR
        to: FULFILLED
        trigger: "POST /warranty-claims/{id}/fulfill"
        actor: CareOpsAgent
        preconditions: ["deductible_paid_cents == deductible_cents", "the created RepairOrder reached RETURNED_TO_PATIENT"]
        side_effects: ["no device replacement; branch join is on FULFILLED with a different precondition set than the REPLACE branch"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /warranty-claims/{id}/withdraw"
        actor: Patient
        preconditions: ["status == FILED", "acting Patient X-User-ID == claim.patient_id"]
        side_effects: ["no counters change; the claim does not count toward claim_ordinal"]

  - entity: ReimbursementClaim
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reimbursement-claims/{id}/submit"
        actor: ReimbursementSpecialist
        preconditions:
          - "documentation_complete == true"
          - "the subject entity exists and matches subject_kind"
          - "for subject_kind == DEVICE_ORDER: the order's payment_status IN {CAPTURED, PARTIALLY_REFUNDED}"
        side_effects:
          - "sets submitted_by_user_id to the acting X-User-ID"
          - "runs calculations.reimbursement_allocation, writing eligible_amount_cents, insurance_paid_cents, fsa_paid_cents, patient_responsibility_cents"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /reimbursement-claims/{id}/start-review"
        actor: ReimbursementSpecialist
        preconditions: ["status == SUBMITTED"]
        side_effects: ["no allocation change"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /reimbursement-claims/{id}/request-info"
        actor: ReimbursementSpecialist
        preconditions: ["info_request_count < 2"]
        side_effects: ["increments info_request_count"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /reimbursement-claims/{id}/supply-info"
        actor: Patient
        preconditions: ["acting Patient X-User-ID == claim.patient_id", "documentation_complete == true after the new document_codes are merged"]
        side_effects:
          - "re-runs calculations.reimbursement_allocation with the updated inputs (the allocation may change)"
        note: "Cycle: UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW, capped at two info requests."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reimbursement-claims/{id}/decide with decision = APPROVE"
        actor: ReimbursementSpecialist
        preconditions:
          - "acting X-User-ID != claim.submitted_by_user_id (segregation of duties)"
          - "claimed_amount_cents <= eligible_amount_cents"
        side_effects: ["sets approved_by_user_id; INVARIANT (benefit conservation): insurance_paid_cents + fsa_paid_cents + patient_responsibility_cents == eligible_amount_cents"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /reimbursement-claims/{id}/decide with decision = DENY"
        actor: ReimbursementSpecialist
        preconditions: ["acting X-User-ID != claim.submitted_by_user_id"]
        side_effects: ["sets denial_reason; zeroes insurance_paid_cents and fsa_paid_cents, setting patient_responsibility_cents = eligible_amount_cents so the invariant still holds"]
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /reimbursement-claims (appeal) with appeal_of_claim_id = this claim, then POST /reimbursement-claims/{id}/submit and /start-review"
        actor: ReimbursementSpecialist
        preconditions: ["the appealed claim's denial_reason != DUPLICATE_SUBJECT", "no prior appeal exists for this claim"]
        side_effects: ["the appeal claim inherits subject_kind and subject FK; the original claim re-enters UNDER_REVIEW so only one of the pair can be PAID"]
        note: "Cycle: UNDER_REVIEW -> DENIED -> UNDER_REVIEW is the appeal loop."
      - from: APPROVED
        to: PAID
        trigger: "POST /reimbursement-claims/{id}/pay"
        actor: ReimbursementSpecialist
        preconditions: ["approved_by_user_id is non-null", "insurance_paid_cents + fsa_paid_cents > 0"]
        side_effects: ["records payment; the claim becomes immutable"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /reimbursement-claims/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["status == APPROVED"]
        side_effects:
          - "COMPENSATING ACTION: zeroes insurance_paid_cents and fsa_paid_cents and sets patient_responsibility_cents = eligible_amount_cents"
          - "INVARIANT (benefit conservation): insurance_paid_cents + fsa_paid_cents + patient_responsibility_cents == eligible_amount_cents unchanged"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /reimbursement-claims/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["same benefit-conservation compensation as the APPROVED -> VOIDED transition"]

  - entity: CarePlanSubscription
    state_field: status
    shape: cyclic
    initial_state: TRIALING
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIALING
        to: ACTIVE
        trigger: "system cascade from DeviceOrder.fulfillment_status -> DELIVERED"
        actor: system
        preconditions: ["the order this plan is attached to reached DELIVERED"]
        side_effects: ["sets cycle_start_utc = order.delivered_at, cycle_end_utc = cycle_start_utc + 30 days, cycle_ordinal = 0"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /care-plan-subscriptions/{id}/run-billing-cycle"
        actor: PlatformAdmin
        preconditions: ["current logical clock >= cycle_end_utc", "credit_balance_cents + payment succeeds"]
        side_effects:
          - "runs calculations.care_plan_cycle_charge and writes service_fee_cents, loyalty_discount_cents, last_charge_cents"
          - "consumes credit_balance_cents before charging the instrument"
          - "increments cycle_ordinal, advances cycle_start_utc = old cycle_end_utc and cycle_end_utc = cycle_start_utc + 30 days"
        note: "Self-loop: the billing cycle is a cyclic transition on the same state."
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /care-plan-subscriptions/{id}/run-billing-cycle with a declined instrument"
        actor: PlatformAdmin
        preconditions: ["last_charge_cents > credit_balance_cents", "the simulated charge outcome is DECLINED"]
        side_effects: ["sets dunning_attempts = 1; cycle_ordinal is NOT incremented"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /care-plan-subscriptions/{id}/retry-payment with a succeeding instrument"
        actor: Patient
        preconditions: ["dunning_attempts < 3"]
        side_effects:
          - "increments cycle_ordinal, advances the cycle window, resets dunning_attempts = 0"
        note: "Cycle: ACTIVE -> PAST_DUE -> ACTIVE is the dunning-recovery loop."
      - from: PAST_DUE
        to: PAST_DUE
        trigger: "POST /care-plan-subscriptions/{id}/retry-payment with a declined instrument"
        actor: Patient
        preconditions: ["dunning_attempts < 3"]
        side_effects: ["increments dunning_attempts"]
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /care-plan-subscriptions/{id}/retry-payment producing the third failure"
        actor: system
        preconditions: ["dunning_attempts == 3 after the increment"]
        side_effects:
          - "every FirmwareRollout with status IN {PENDING, OFFERED} on a Device whose order is this plan's device_order_id moves to CANCELLED_INELIGIBLE, unless the campaign is_mandatory_safety == true"
          - "RepairOrder.sla_days for new repairs falls back to 15"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /care-plan-subscriptions/{id}/reinstate"
        actor: CareOpsAgent
        preconditions: ["the order's TrialPeriod.status != RETURN_SETTLED"]
        side_effects: ["resets dunning_attempts = 0 and advances the cycle window from the current logical clock"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /care-plan-subscriptions/{id}/cancel, or system cascade from a settled return (CASCADE-A hop 4)"
        actor: Patient
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CASCADE-A hop 5: every FirmwareRollout in status IN {PENDING, OFFERED} on this order's Device moves to CANCELLED_INELIGIBLE and the owning campaign's rollout counters are recomputed"
          - "forfeits credit_balance_cents (set to 0)"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /care-plan-subscriptions/{id}/cancel"
        actor: Patient
        preconditions: ["status == PAST_DUE"]
        side_effects: ["same rollout-cancel cascade and credit forfeiture"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /care-plan-subscriptions/{id}/cancel"
        actor: CareOpsAgent
        preconditions: ["status == SUSPENDED"]
        side_effects: ["same rollout-cancel cascade and credit forfeiture"]

  - entity: FirmwareCampaign
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /firmware-campaigns/{id}/schedule"
        actor: FirmwareEngineer
        preconditions: ["window_start_utc < window_end_utc", "to_version != from_version", "no other FirmwareCampaign with the same model and status IN {SCHEDULED, ROLLING, PAUSED} whose closed window [window_start_utc, window_end_utc] intersects this one"]
        side_effects: ["no rollouts yet"]
      - from: SCHEDULED
        to: ROLLING
        trigger: "POST /firmware-campaigns/{id}/advance"
        actor: FirmwareEngineer
        preconditions: ["window_start_utc <= current logical clock <= window_end_utc"]
        side_effects:
          - "runs calculations.firmware_cohort_selection, creating up to batch_size FirmwareRollout rows in PENDING with selection_rank 1..N and from_version_observed"
          - "recomputes rollout_count"
      - from: ROLLING
        to: ROLLING
        trigger: "POST /firmware-campaigns/{id}/advance"
        actor: FirmwareEngineer
        preconditions: ["count of rollouts in status == INSTALLING < max_concurrent_installs", "current logical clock <= window_end_utc"]
        side_effects: ["selects the next batch; recomputes rollout_count, installed_count and failure_rate_pct"]
        note: "Self-loop advance is the batch pump."
      - from: ROLLING
        to: PAUSED
        trigger: "POST /firmware-campaigns/{id}/pause, or system when failure_rate_pct > 25.0 after a rollout FAILED"
        actor: FirmwareEngineer
        preconditions: ["status == ROLLING"]
        side_effects: ["every rollout in PENDING stays PENDING; no new batches may be selected"]
      - from: PAUSED
        to: ROLLING
        trigger: "POST /firmware-campaigns/{id}/resume"
        actor: FirmwareEngineer
        preconditions: ["failure_rate_pct <= 25.0", "current logical clock <= window_end_utc"]
        side_effects: ["re-enables advance"]
        note: "Cycle: ROLLING -> PAUSED -> ROLLING."
      - from: ROLLING
        to: COMPLETED
        trigger: "POST /firmware-campaigns/{id}/complete"
        actor: FirmwareEngineer
        preconditions: ["no rollout in status IN {PENDING, OFFERED, INSTALLING}"]
        side_effects: ["freezes installed_count and failure_rate_pct"]
      - from: PAUSED
        to: ABORTED
        trigger: "POST /firmware-campaigns/{id}/abort"
        actor: FirmwareEngineer
        preconditions: ["status == PAUSED"]
        side_effects: ["every rollout in status IN {PENDING, OFFERED} moves to CANCELLED_INELIGIBLE; INSTALLED rollouts are left intact"]
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /firmware-campaigns/{id}/abort"
        actor: FirmwareEngineer
        preconditions: ["rollout_count == 0"]
        side_effects: ["no rollout changes (empty-set edge)"]

  - entity: FirmwareRollout
    state_field: status
    shape: branching_with_revert
    initial_state: PENDING
    terminal_states: [INSTALLED, ROLLED_BACK, CANCELLED_INELIGIBLE]
    transitions:
      - from: PENDING
        to: OFFERED
        trigger: "POST /firmware-rollouts/{id}/offer"
        actor: FirmwareEngineer
        preconditions:
          - "campaign.status == ROLLING"
          - "window_start_utc <= current logical clock <= window_end_utc"
          - "the device's CarePlanSubscription.status IN {ACTIVE, TRIALING} OR campaign.is_mandatory_safety == true"
        side_effects: ["no device change"]
      - from: OFFERED
        to: INSTALLING
        trigger: "POST /firmware-rollouts/{id}/install"
        actor: Patient
        preconditions:
          - "count of rollouts in INSTALLING for this campaign < campaign.max_concurrent_installs"
          - "device.status == WITH_PATIENT"
        side_effects: ["increments attempt_count"]
      - from: INSTALLING
        to: INSTALLED
        trigger: "POST /_firmware/report with outcome = SUCCESS"
        actor: PlatformAdmin
        preconditions: ["device.firmware_version == from_version_observed (no drift)"]
        side_effects:
          - "sets Device.firmware_version = campaign.to_version, installed_at"
          - "recomputes campaign.installed_count and failure_rate_pct"
      - from: INSTALLING
        to: FAILED
        trigger: "POST /_firmware/report with outcome = FAILURE"
        actor: PlatformAdmin
        preconditions: ["status == INSTALLING"]
        side_effects:
          - "sets failure_code; recomputes campaign.failure_rate_pct"
          - "when failure_rate_pct > 25.0, drives FirmwareCampaign ROLLING -> PAUSED"
      - from: FAILED
        to: INSTALLING
        trigger: "POST /firmware-rollouts/{id}/install (retry)"
        actor: Patient
        preconditions: ["attempt_count < 3", "campaign.status == ROLLING"]
        side_effects: ["increments attempt_count"]
        note: "Cycle: INSTALLING -> FAILED -> INSTALLING, capped at three attempts."
      - from: FAILED
        to: ROLLED_BACK
        trigger: "POST /firmware-rollouts/{id}/rollback"
        actor: FirmwareEngineer
        preconditions: ["attempt_count >= 3 OR failure_code == CHECKSUM"]
        side_effects:
          - "COMPENSATING ACTION: restores Device.firmware_version = from_version_observed"
          - "when fault persists, creates a RepairOrder in KIT_REQUESTED with fault_code = FIRMWARE_BRICK"
      - from: PENDING
        to: CANCELLED_INELIGIBLE
        trigger: "system cascade from a settled return (CASCADE-A hop 5), plan cancellation, plan suspension, or campaign abort"
        actor: system
        preconditions: ["the device left WITH_PATIENT status or its plan is no longer in {ACTIVE, TRIALING}"]
        side_effects: ["recomputes campaign.rollout_count and failure_rate_pct"]
      - from: OFFERED
        to: CANCELLED_INELIGIBLE
        trigger: "system cascade from plan cancellation, plan suspension, or campaign abort"
        actor: system
        preconditions: ["the device's plan left {ACTIVE, TRIALING} and campaign.is_mandatory_safety == false"]
        side_effects: ["recomputes campaign counters"]

  # -------------------------------------------------- machine 15 of 15
  - entity: ComplianceOverride
    state_field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /patients/{patient_id}/compliance-overrides/{override_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "override.status == PENDING"
          - "acting X-User-ID != override.filed_by_user_id (segregation of duties)"
          - "patient.status == MEDICALLY_DISQUALIFIED"
        side_effects:
          - "sets approved_by_user_id and decided_at"
          - "Patient MEDICALLY_DISQUALIFIED -> SCREENING_IN_PROGRESS"
          - "invalidates the patient's latest SCORED ScreeningSession with invalidated_reason = PROVIDER_OVERRIDE and clears its findings"
          - "resets Patient.open_mandatory_flag_count to 0 and advisory_weight_total to 0.0"
          - "creates a fresh ScreeningSession in DRAFT with attempt_ordinal = screening_attempt_count + 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /patients/{patient_id}/compliance-overrides/{override_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "override.status == PENDING"
          - "acting X-User-ID != override.filed_by_user_id"
        side_effects:
          - "sets decided_at; the patient stays MEDICALLY_DISQUALIFIED and all MEDICAL_HOLD orders stay held"

# =========================================================================
# 1.2.1 Concurrency Rules  (OCC on a parent's `version` only)
# =========================================================================
concurrency_rules:

  - rule_id: return-authorization-create-stale-trial
    parent_entity: TrialPeriod
    write_endpoint: "POST /trial-periods/{trial_period_id}/return-authorizations"
    occ_field: "expected_trial_period_version"
    description: |
      Issuing a ReturnAuthorization against a TrialPeriod whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A new authorization legitimately supersedes a prior VOIDED one and a
      granted extension legitimately shifts effective_end_utc, so a writer whose
      view of the trial predates either change would compute days_used_at_issue
      from a superseded snapshot.
    error_id: ERR_STALE_TRIAL_VERSION
    http_status: 412

  - rule_id: fit-exchange-create-stale-order
    parent_entity: DeviceOrder
    write_endpoint: "POST /device-orders/{device_order_id}/fit-exchanges"
    occ_field: "expected_device_order_version"
    description: |
      Requesting a FitExchange against a DeviceOrder whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A completed exchange legitimately rewrites dome_size and tip_type, so a
      writer holding an earlier view would reserve from the wrong source pool and
      corrupt the inventory conservation invariant.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: plan-tier-change-stale-subscription
    parent_entity: CarePlanSubscription
    write_endpoint: "POST /care-plan-subscriptions/{subscription_id}/change-tier"
    occ_field: "expected_subscription_version"
    description: |
      Changing the tier of a CarePlanSubscription whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A billing cycle run, an SLA credit from a closed repair, and a waived
      no-show fee all legitimately move credit_balance_cents and the cycle
      window, so a tier change computed against an earlier view would prorate
      against a superseded cycle boundary.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: rollout-enrollment-stale-device
    parent_entity: Device
    write_endpoint: "POST /firmware-campaigns/{campaign_id}/manual-enrollments"
    occ_field: "expected_device_version"
    description: |
      Manually enrolling a Device into a FirmwareCampaign when the Device version
      has advanced since the client last observed it is rejected with a
      stale-version error. A successful install legitimately rewrites
      firmware_version and a warranty replacement legitimately rewrites status
      and replaced_by_device_id, so an enrollment computed against an earlier
      view would pin a from_version_observed that no longer matches the unit.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412

# =========================================================================
# 1.3 Calculation Rules Table  (16 rules)
# =========================================================================
calculations:

  - name: red_flag_referral_trigger
    trigger: "state_machines.ScreeningSession.SUBMITTED_to_SCORED, inside POST /screening-sessions/{id}/submit"
    algorithm: threshold
    formula: |
      # --- detection table (evaluated in this exact order) ---
      findings = []
      if 'SUDDEN_LOSS'      in session.symptom_codes: findings += (SUDDEN_UNILATERAL_LOSS, MANDATORY_REFERRAL, 0.0)
      if 'DRAINAGE'         in session.symptom_codes: findings += (ACTIVE_DRAINAGE,        MANDATORY_REFERRAL, 0.0)
      if 'VERTIGO'          in session.symptom_codes: findings += (VERTIGO,                MANDATORY_REFERRAL, 0.0)
      if 'DEFORMITY'        in session.symptom_codes: findings += (VISIBLE_DEFORMITY,      MANDATORY_REFERRAL, 0.0)
      if 'PAIN'             in session.symptom_codes: findings += (EAR_PAIN,               ADVISORY,           1.5)
      if 'TINNITUS_ONE_EAR' in session.symptom_codes: findings += (UNILATERAL_TINNITUS,    ADVISORY,           1.0)
      if 'WAX'              in session.symptom_codes: findings += (IMPACTED_CERUMEN,       ADVISORY,           1.0)
      if patient.age_years < state_policy.min_age_years:
          findings += (AGE_BELOW_MINIMUM,     MANDATORY_REFERRAL, 0.0)
      if session.pure_tone_avg_db >= SEVERE_LOSS_DB:            # 71.0, inclusive
          findings += (SEVERE_LOSS_THRESHOLD, MANDATORY_REFERRAL, 0.0)
      if session.asymmetry_db    >= ASYMMETRY_DB:               # 15.0, inclusive
          findings += (SUDDEN_UNILATERAL_LOSS, MANDATORY_REFERRAL, 0.0)   # deduplicated by code

      # --- outcome ---
      mandatory_count = count(findings where severity == MANDATORY_REFERRAL)
      advisory_sum    = round_half_up(sum(f.weight for f in findings where severity == ADVISORY), 1)
      if mandatory_count > 0:                       outcome = RED_FLAG
      elif advisory_sum >= ADVISORY_REFERRAL_THRESHOLD:  outcome = RED_FLAG      # 2.5, INCLUSIVE
      elif advisory_sum > 0:                        outcome = ADVISORY_PASS
      else:                                         outcome = PASS              # empty finding set
    input_set: "Exactly the submitting ScreeningSession's own fields plus Patient.age_years and the Patient's StatePolicy.min_age_years. Findings from other sessions never contribute."
    constants:
      SEVERE_LOSS_DB: 71.0
      ASYMMETRY_DB: 15.0
      ADVISORY_REFERRAL_THRESHOLD: 2.5
    precision: "advisory_sum rounded to 1 decimal place, round_half_up, before the threshold comparison"
    variants:
      - name: dedupe_on_code
        when: "both the SUDDEN_LOSS symptom and asymmetry_db >= 15.0 are present"
        difference: "exactly one RedFlagFinding with code SUDDEN_UNILATERAL_LOSS is emitted, not two"

  - name: candidacy_risk_score
    trigger: "state_machines.Patient.SCREENING_IN_PROGRESS_to_CANDIDATE_APPROVED (provisional) and state_machines.Patient.REFERRAL_REQUIRED_to_PROVIDER_CLEARED (provider-adjusted)"
    algorithm: weighted_scoring
    formula: |
      ptn  = min(1.0, session.pure_tone_avg_db / 90.0)
      diff = session.self_reported_difficulty_score / 40.0
      sin  = 1.0 - (session.speech_in_noise_pct / 100.0)
      asym = min(1.0, session.asymmetry_db / 25.0)
      base = 100.0 * (W_PTN*ptn + W_DIFF*diff + W_SIN*sin + W_ASYM*asym)

      # variant selection is by TRIGGER, never by caller choice
      if variant == PROVISIONAL_SELF_REPORTED:
          score = round_half_up(base, 1)
      else:  # PROVIDER_ADJUSTED
          score = round_half_up(min(100.0,
                    base * PROVIDER_ATTENUATION
                    + MANDATORY_FLAG_POINTS * cleared_mandatory_finding_count
                    + ADVISORY_POINT_FACTOR  * advisory_weight_total_at_issue), 1)

      band = LOW      if score <  BAND_MODERATE_MIN                       # < 35.0
           = MODERATE if BAND_MODERATE_MIN <= score < BAND_HIGH_MIN       # 35.0 .. 64.9
           = HIGH     if score >= BAND_HIGH_MIN                           # >= 65.0, INCLUSIVE
    input_set: "The Patient's latest ScreeningSession with status == SCORED (ordered by scored_at DESC, tie-break created_at DESC). Sessions with status == INVALIDATED are excluded. cleared_mandatory_finding_count is ProviderReferral.cleared_finding_count of the clearing referral; advisory_weight_total_at_issue is Patient.advisory_weight_total observed at referral issue."
    constants:
      W_PTN: 0.40
      W_DIFF: 0.25
      W_SIN: 0.20
      W_ASYM: 0.15
      PROVIDER_ATTENUATION: 0.85
      MANDATORY_FLAG_POINTS: 6.0
      ADVISORY_POINT_FACTOR: 2.0
      BAND_MODERATE_MIN: 35.0
      BAND_HIGH_MIN: 65.0
    precision: "1 decimal place, round_half_up, applied once at the end (never to intermediate terms)"
    variants:
      - name: PROVISIONAL_SELF_REPORTED
        when: "the score is written by a screening submit that approved candidacy; no provider has examined the patient"
        difference: "red-flag evidence is excluded entirely and no attenuation is applied — the raw weighted sum is the score"
      - name: PROVIDER_ADJUSTED
        when: "the score is written by a licensed-provider clearance"
        difference: "the weighted sum is attenuated to 85% and then increased by cleared-flag points, so identical screening measurements yield a DIFFERENT score than the provisional variant"

  - name: order_total_composition
    trigger: "POST /patients/{patient_id}/device-orders"
    algorithm: aggregation
    formula: |
      device_subtotal_cents  = order.list_price_cents - order.discount_cents
      taxable_base_cents     = device_subtotal_cents + order.accessory_subtotal_cents   # shipping is not taxable
      tax_cents              = round_half_up(taxable_base_cents * SALES_TAX_RATE)
      total_cents            = device_subtotal_cents + order.accessory_subtotal_cents
                             + order.shipping_cents + tax_cents
      captured_cents = 0; refunded_cents = 0; retained_cents = 0; open_balance_cents = 0
    input_set: "Only the order's own input fields; no other order contributes"
    constants:
      SALES_TAX_RATE: 0.0725
    precision: "integer cents; the single rounding happens on tax_cents, round_half_up"

  - name: trial_days_used
    trigger: "state_machines.TrialPeriod.ACTIVE_to_PAUSED, PAUSED_to_ACTIVE, ACTIVE_to_RETURN_INITIATED, and lazily on any read of GET /trial-periods/{id}"
    algorithm: chronological
    formula: |
      window_end = min(current_logical_clock, trial.effective_end_utc)

      # pause intervals are CLOSED [pause_start_utc, pause_end_utc]; an open pause
      # (pause_end_utc == null) is treated as [pause_start_utc, window_end]
      sorted = sort(trial.pause_intervals) by pause_start_utc ASC,
                                            tie-break by array insertion index ASC
      merged = []
      for iv in sorted:
          if merged and iv.start <= merged[-1].end:      # touching endpoints MERGE
              merged[-1].end = max(merged[-1].end, iv.end)
          else:
              merged.append(iv)
      paused_seconds = sum(iv.end - iv.start for iv in merged)
      paused_days    = floor(paused_seconds / 86400)

      elapsed_days = floor((window_end - trial.started_at) / 86400)   # 24h == 1 day
      days_used    = max(0, elapsed_days - paused_days)
      effective_end_utc = trial.nominal_end_utc
                        + paused_days days + trial.extension_days_granted days
    input_set: "Only this TrialPeriod's own started_at, pause_intervals, nominal_end_utc and extension_days_granted, clipped at effective_end_utc"
    constants:
      SECONDS_PER_DAY: 86400
      MAX_TOTAL_PAUSED_DAYS: 60
    precision: "whole days, floor; a span of exactly 86400 seconds counts as 1 day and 86399 counts as 0"

  - name: return_refund_settlement
    trigger: "state_machines.ReturnAuthorization.RECEIVED_to_INSPECTED, inside POST /return-authorizations/{id}/inspect"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: components (pinned; the rounding order below is normative) ----
      device_component_cents    = order.list_price_cents - order.discount_cents
      accessory_component_cents = order.accessory_subtotal_cents

      # ---- step 2: variant selection (order of tests is normative) ----
      if order.pinned_restocking_mode == PROHIBITED:        variant = WAIVED
      elif ra.days_used_at_issue == 0:                      variant = WAIVED   # zero-day edge
      elif order.pinned_restocking_mode == FLAT_PCT:         variant = FLAT_PCT
      else:                                                  variant = PRORATED_DAILY

      # ---- step 3: per-component restocking, EACH ROUNDED TO THE CENT, THEN SUMMED ----
      if variant == FLAT_PCT:
          device_restock    = round_half_up(device_component_cents    * policy.restocking_fee_pct)
          accessory_restock = round_half_up(accessory_component_cents * policy.restocking_fee_pct
                                            * ACCESSORY_RATE_FACTOR)
      elif variant == PRORATED_DAILY:
          device_restock    = policy.restocking_daily_rate_cents
                              * min(ra.days_used_at_issue, order.pinned_trial_days)
          accessory_restock = 0
      else:  # WAIVED
          device_restock = 0; accessory_restock = 0

      # ---- step 4: damage surcharge is a THIRD component, rounded independently ----
      # It applies even when variant == WAIVED: a state restocking prohibition does
      # not shield the patient from damage they caused.
      if   ra.inspection_grade == DAMAGED:        damage_surcharge = round_half_up(device_component_cents * DAMAGE_RATE)
      elif ra.inspection_grade == REFURBISHABLE:  damage_surcharge = round_half_up(device_component_cents * REFURB_RATE)
      else:                                       damage_surcharge = 0

      # ---- step 5: cap applies to the SUM of the three already-rounded components ----
      raw_restock = device_restock + accessory_restock + damage_surcharge
      restocking_fee_cents = raw_restock if policy.restocking_fee_cap_cents == 0
                             else min(raw_restock, policy.restocking_fee_cap_cents)

      # ---- step 6 ----
      non_refundable_shipping_cents = 0 if policy.shipping_refundable else order.shipping_cents

      # ---- step 7 ----
      refund_amount_cents = max(0, order.captured_cents
                                   - restocking_fee_cents
                                   - non_refundable_shipping_cents)
    input_set: "The ReturnAuthorization's own days_used_at_issue snapshot and inspection_grade, plus the DeviceOrder's pinned_restocking_mode / pinned_trial_days / captured_cents / shipping_cents and the PINNED StatePolicy row (order.state_policy_id at order.pinned_state_policy_version). Live StatePolicy edits after checkout are excluded."
    constants:
      ACCESSORY_RATE_FACTOR: 0.5
      DAMAGE_RATE: 0.15
      REFURB_RATE: 0.05
    precision: "integer cents; round_half_up applied ONCE PER COMPONENT before summing — summing first and rounding the total is explicitly forbidden and yields different cents"
    variants:
      - name: FLAT_PCT
        when: "the pinned StatePolicy.restocking_fee_mode == FLAT_PCT and days_used_at_issue > 0"
        difference: "restocking scales with the device subtotal and is independent of how many trial days were used"
      - name: PRORATED_DAILY
        when: "the pinned StatePolicy.restocking_fee_mode == PRORATED_DAILY and days_used_at_issue > 0"
        difference: "restocking scales with min(days_used_at_issue, pinned_trial_days) and ignores the subtotal, so identical orders returned on the same day settle to a DIFFERENT refund than under FLAT_PCT"
      - name: WAIVED
        when: "the pinned mode is PROHIBITED, or days_used_at_issue == 0"
        difference: "device and accessory restocking are zero, but the damage surcharge component still applies"

  - name: reimbursement_allocation
    trigger: "state_machines.ReimbursementClaim.DRAFT_to_SUBMITTED and INFO_REQUESTED_to_SUBMITTED"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: eligible amount (5 inputs, branch on polymorphic subject) ----
      if not claim.documentation_complete:
          eligible = 0
      elif claim.subject_kind == DEVICE_ORDER:
          eligible = min(claim.claimed_amount_cents,
                         max(0, order.captured_cents - order.refunded_cents - order.retained_cents))
      elif claim.subject_kind == REPAIR_ORDER:
          eligible = min(claim.claimed_amount_cents, REPAIR_ELIGIBLE_CAP_CENTS)
      else:  # CARE_PLAN
          eligible = min(claim.claimed_amount_cents,
                         subscription.last_charge_cents * CARE_PLAN_ELIGIBLE_CYCLES)

      # ---- step 2..4: ordered buckets, no proportional split ----
      insurance_paid = min(eligible,
                           max(0, claim.insurance_benefit_cap_cents
                                  - claim.insurance_benefit_used_cents))
      remaining      = eligible - insurance_paid
      fsa_paid       = min(remaining, claim.fsa_balance_cents)
      patient_responsibility = eligible - insurance_paid - fsa_paid

      # INVARIANT (benefit conservation), asserted after every write:
      #   insurance_paid + fsa_paid + patient_responsibility == eligible
    input_set: "Bucket order is fixed: INSURANCE_BENEFIT, then FSA, then PATIENT_RESPONSIBILITY. Only the claim's own declared cap/used/balance inputs and the single subject entity named by subject_kind participate; sibling claims on the same subject never reduce the buckets (duplicate subjects are rejected by validation instead)."
    constants:
      REPAIR_ELIGIBLE_CAP_CENTS: 50000
      CARE_PLAN_ELIGIBLE_CYCLES: 12
    precision: "integer cents throughout; the third bucket absorbs any remainder by construction"

  - name: care_plan_cycle_charge
    trigger: "state_machines.CarePlanSubscription.ACTIVE_to_ACTIVE (run-billing-cycle), PAST_DUE_to_ACTIVE (retry-payment), and POST /care-plan-subscriptions/{subscription_id}/change-tier (prorated)"
    algorithm: constraint_propagation
    formula: |
      # The dependency LOOKS circular: the service fee depends on the subtotal
      # tier, and the loyalty discount depends on the fee-inclusive base. The
      # evaluation order below is NORMATIVE and makes the value well-defined.
      # Step 1 -> Step 2 -> Step 3 -> Step 4 -> Step 5. Testing the DISCOUNTED
      # amount against SERVICE_FEE_WAIVER_THRESHOLD_CENTS is forbidden and
      # produces a different total.
      step1: subtotal_cents = sub.base_fee_cents
                            + (PREMIUM_SURCHARGE_CENTS if sub.plan_tier == PREMIUM else 0)
      step2: service_fee_cents = 0 if subtotal_cents >= SERVICE_FEE_WAIVER_THRESHOLD_CENTS
                                 else SERVICE_FEE_CENTS            # >= is INCLUSIVE
      step3: fee_inclusive_base_cents = subtotal_cents + service_fee_cents
      step4: if   sub.cycle_ordinal >= LOYALTY_TIER2_CYCLES:  rate = LOYALTY_TIER2_RATE
             elif sub.cycle_ordinal >= LOYALTY_TIER1_CYCLES:  rate = LOYALTY_TIER1_RATE
             else:                                            rate = 0.0
             loyalty_discount_cents = min(LOYALTY_DISCOUNT_CAP_CENTS,
                                          round_half_up(fee_inclusive_base_cents * rate))
      step5: last_charge_cents = max(0, fee_inclusive_base_cents - loyalty_discount_cents)

      # settlement against credits (applied AFTER step 5, never inside it)
      applied_credit = min(sub.credit_balance_cents, last_charge_cents)
      amount_due     = last_charge_cents - applied_credit
      sub.credit_balance_cents -= applied_credit

      # proration on POST change-tier, evaluated with the NEW tier:
      remaining_days = ceil((sub.cycle_end_utc - current_logical_clock) / 86400)
      prorated_charge_cents = round_half_up(last_charge_cents * remaining_days / 30)
    input_set: "Only this subscription's own base_fee_cents, plan_tier, cycle_ordinal and credit_balance_cents. cycle_ordinal is the count of successfully charged cycles, so a PAST_DUE episode does not advance the loyalty tier."
    constants:
      PREMIUM_SURCHARGE_CENTS: 2000
      SERVICE_FEE_CENTS: 495
      SERVICE_FEE_WAIVER_THRESHOLD_CENTS: 9900
      LOYALTY_TIER1_CYCLES: 6
      LOYALTY_TIER1_RATE: 0.10
      LOYALTY_TIER2_CYCLES: 12
      LOYALTY_TIER2_RATE: 0.15
      LOYALTY_DISCOUNT_CAP_CENTS: 1500
    precision: "integer cents; round_half_up on the discount (step 4) and on the proration, in that order"

  - name: warranty_deductible
    trigger: "state_machines.WarrantyClaim.FILED_to_TRIAGED"
    algorithm: tiered_pricing
    formula: |
      device_age_months = floor(months_between(device.shipped_at, current_logical_clock))
      if   device_age_months <= AGE_TIER1_MONTHS: age_mult = AGE_TIER1_MULT   # <= 12 INCLUSIVE
      elif device_age_months <= AGE_TIER2_MONTHS: age_mult = AGE_TIER2_MULT   # 13..24
      else:                                       age_mult = AGE_TIER3_MULT   # > 24
      kind_factor = { DEFECT: 0.0, DAMAGE: 0.75, LOSS: 1.0 }[claim.claim_kind]
      ordinal_surcharge = 0 if claim.claim_ordinal == 1 else SECOND_CLAIM_SURCHARGE_CENTS
      deductible_cents = round_half_up(BASE_DEDUCTIBLE_CENTS * age_mult * kind_factor)
                         + ordinal_surcharge
    input_set: "The claim's own claim_kind and claim_ordinal plus the Device's shipped_at. WITHDRAWN claims are excluded from claim_ordinal; APPROVED_*/FULFILLED claims are included."
    constants:
      BASE_DEDUCTIBLE_CENTS: 9900
      AGE_TIER1_MONTHS: 12
      AGE_TIER1_MULT: 0.5
      AGE_TIER2_MONTHS: 24
      AGE_TIER2_MULT: 1.0
      AGE_TIER3_MULT: 1.5
      SECOND_CLAIM_SURCHARGE_CENTS: 5000
    precision: "integer cents; round_half_up applied to the multiplicative part ONLY, then the integer surcharge is added"

  - name: provider_daily_capacity
    trigger: "POST /remote-fitting-sessions, and every transition that leaves or enters RemoteFittingSession status IN {SCHEDULED, IN_PROGRESS, COMPLETED}"
    algorithm: aggregation
    formula: |
      focus_date = date_utc(candidate.scheduled_start_utc)
      booked_minutes_on_focus_date =
          sum(s.duration_minutes for s in RemoteFittingSession
              where s.provider_id == provider.id
                and s.status IN {SCHEDULED, IN_PROGRESS, COMPLETED}
                and date_utc(s.scheduled_start_utc) == focus_date)
      # gate: equality is ALLOWED
      accept iff booked_minutes_on_focus_date + candidate.duration_minutes
                 <= provider.daily_capacity_minutes
      utilization_pct = round_half_up(100.0 * booked_minutes_on_focus_date
                                      / provider.daily_capacity_minutes, 1)
    input_set: "Sessions with status IN {NO_SHOW, CANCELLED, REQUESTED} are EXCLUDED. A session is attributed entirely to the UTC date of its scheduled_start_utc even when it ends after midnight."
    constants: {}
    precision: "whole minutes; utilization_pct to 1 decimal place, round_half_up"

  - name: fitting_slot_overlap
    trigger: "POST /remote-fitting-sessions"
    algorithm: interval_merge
    formula: |
      # candidate occupancy is HALF-OPEN and widened symmetrically by the buffer
      cand_start = candidate.scheduled_start_utc - provider.buffer_minutes minutes
      cand_end   = candidate.scheduled_end_utc   + provider.buffer_minutes minutes
      for ex in RemoteFittingSession
          where ex.provider_id == provider.id
            and ex.status IN {SCHEDULED, IN_PROGRESS}:
          # existing occupancy is the un-widened half-open [start, end)
          if cand_start < ex.scheduled_end_utc and ex.scheduled_start_utc < cand_end:
              reject ERR_PROVIDER_SLOT_CONFLICT
      # exact adjacency at the buffered boundary (cand_start == ex.scheduled_end_utc)
      # is ACCEPTED because both comparisons are strict
    input_set: "Only SCHEDULED and IN_PROGRESS sessions of the same provider occupy intervals; COMPLETED, NO_SHOW, CANCELLED and REQUESTED sessions do not."
    constants: {}
    precision: "minute resolution; strict inequalities on both sides"

  - name: trial_pause_interval_overlap
    trigger: "state_machines.TrialPeriod.ACTIVE_to_PAUSED, inside POST /repair-orders/{id}/receive"
    algorithm: interval_merge
    formula: |
      # pause occupancy is CLOSED [start, end]; touching endpoints are ALLOWED
      new_start = current_logical_clock
      for iv in trial.pause_intervals:
          iv_end = iv.pause_end_utc if iv.pause_end_utc != null else FAR_FUTURE
          if new_start < iv_end and iv.pause_start_utc < FAR_FUTURE:
              reject ERR_PAUSE_INTERVAL_OVERLAP      # an open pause blocks a second one
      # aggregate capacity check on the SAME resource (the trial), not a point conflict
      if trial.paused_days >= MAX_TOTAL_PAUSED_DAYS:      # 60, INCLUSIVE
          reject ERR_PAUSE_BUDGET_EXHAUSTED
    input_set: "All pause_intervals of this TrialPeriod, including the open one; intervals of other trials never participate."
    constants:
      MAX_TOTAL_PAUSED_DAYS: 60
    precision: "second resolution; closed-interval semantics with touching endpoints permitted, plus an aggregate 60-day budget"

  - name: campaign_window_overlap
    trigger: "state_machines.FirmwareCampaign.DRAFT_to_SCHEDULED"
    algorithm: interval_merge
    formula: |
      # campaign windows are CLOSED [window_start_utc, window_end_utc] and
      # TOUCHING ENDPOINTS COLLIDE (non-strict comparisons on both sides)
      for ex in FirmwareCampaign
          where ex.id != campaign.id
            and ex.model == campaign.model
            and ex.status IN {SCHEDULED, ROLLING, PAUSED}:
          if campaign.window_start_utc <= ex.window_end_utc
             and ex.window_start_utc <= campaign.window_end_utc:
              reject ERR_CAMPAIGN_WINDOW_CONFLICT
    input_set: "Campaigns with status IN {DRAFT, COMPLETED, ABORTED} do not occupy a window; only same-model campaigns collide."
    constants: {}
    precision: "second resolution; NON-strict inequalities, so a window starting exactly when another ends is a conflict — the opposite of fitting_slot_overlap"

  - name: fit_exchange_fee
    trigger: "state_machines.FitExchange.REQUESTED_to_RESERVED"
    algorithm: threshold
    formula: |
      exchange_ordinal = 1 + count(FitExchange where device_order_id == order.id
                                     and status IN {SHIPPED, COMPLETED})
      if trial.status IN {ACTIVE, PAUSED}:
          exchange_fee_cents = 0                       # always free inside the trial
      elif exchange_ordinal <= FREE_EXCHANGE_COUNT:    # 2, INCLUSIVE
          exchange_fee_cents = 0
      elif subscription != null and subscription.plan_tier == PREMIUM
           and subscription.status IN {ACTIVE, PAST_DUE}:
          exchange_fee_cents = round_half_up(EXCHANGE_FEE_CENTS * PREMIUM_DISCOUNT_FACTOR)
      else:
          exchange_fee_cents = EXCHANGE_FEE_CENTS
    input_set: "Only FitExchange rows on the same device_order_id with status IN {SHIPPED, COMPLETED} count toward the ordinal; REQUESTED, RESERVED, REJECTED and CANCELLED rows do not."
    constants:
      FREE_EXCHANGE_COUNT: 2
      EXCHANGE_FEE_CENTS: 1900
      PREMIUM_DISCOUNT_FACTOR: 0.5
    precision: "integer cents, round_half_up"

  - name: repair_sla_credit
    trigger: "state_machines.RepairOrder.REPAIRED_to_RETURNED_TO_PATIENT and UNREPAIRABLE_to_ESCALATED_TO_WARRANTY"
    algorithm: decay_function
    formula: |
      turnaround_days = floor((repair.closed_at - repair.received_at) / 86400)
      days_over       = max(0, turnaround_days - repair.sla_days)     # equality yields 0
      mult            = PREMIUM_CREDIT_MULT if (subscription != null
                          and subscription.plan_tier == PREMIUM) else 1.0
      sla_credit_cents = min(SLA_CREDIT_CAP_CENTS,
                             round_half_up(days_over * SLA_CREDIT_PER_DAY_CENTS * mult))
    input_set: "Only this RepairOrder's received_at/closed_at and its linked CarePlanSubscription's plan_tier. Repairs closed as CANCELLED never produce a credit."
    constants:
      SLA_CREDIT_PER_DAY_CENTS: 500
      SLA_CREDIT_CAP_CENTS: 5000
      PREMIUM_CREDIT_MULT: 2.0
    precision: "integer cents; the cap is applied AFTER rounding the multiplied product"

  - name: firmware_cohort_selection
    trigger: "state_machines.FirmwareCampaign.SCHEDULED_to_ROLLING and ROLLING_to_ROLLING (POST /firmware-campaigns/{id}/advance)"
    algorithm: topological
    formula: |
      # (a) eligibility filter — explicit predicate, no fuzzy adjectives
      candidates = [d for d in Device where
            d.status == WITH_PATIENT
        and d.model == campaign.model
        and d.firmware_version == campaign.from_version
        and no RepairOrder r with r.device_id == d.id
                and r.status IN {KIT_SENT, RECEIVED, IN_REPAIR}
        and no FirmwareRollout fr with fr.device_id == d.id
                and fr.firmware_campaign_id == campaign.id
                and fr.status IN {PENDING, OFFERED, INSTALLING, INSTALLED}
        and ( campaign.is_mandatory_safety == true
              or ( subscription_of(d) != null
                   and subscription_of(d).status IN {ACTIVE, TRIALING}
                   and subscription_of(d).firmware_auto_update_enabled == true ) )]
      # subscription_of(d) := the CarePlanSubscription whose device_order_id == d.device_order_id

      # (b) ranking expression
      order by d.warranty_expires_at ASC
      # (c) tie-break chain, all non-random fields
         then d.created_at ASC
         then d.serial_number ASC

      # (d) empty-pool fallback
      if candidates is empty: reject ERR_NO_ELIGIBLE_DEVICES

      batch = candidates[0 : campaign.batch_size]
      for i, d in enumerate(batch):
          create FirmwareRollout(status=PENDING, selection_rank=i+1,
                                 from_version_observed=d.firmware_version)
    input_set: "Devices with status IN {IN_STOCK, ASSIGNED, IN_REPAIR, REPLACED, LOST, RETIRED} are excluded. A device already carrying a PENDING/OFFERED/INSTALLING/INSTALLED rollout for THIS campaign is excluded, but a CANCELLED_INELIGIBLE, FAILED or ROLLED_BACK rollout does not exclude re-selection."
    constants: {}
    precision: "integer selection_rank starting at 1; ordering is fully deterministic and never uses id"

  - name: referral_provider_selection
    trigger: "POST /remote-fitting-sessions with session_type = REFERRAL_EVALUATION and provider_id omitted"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter
      candidates = [p for p in Provider where
            p.provider_type == LICENSED_AUDIOLOGIST
        and p.status == ACTIVE
        and patient.state_code IN p.licensed_state_codes
        and p did not perform the IN_PROGRESS_to_INVALIDATED transition on
            referral.triggering_screening_session_id
        and provider_daily_capacity(p, candidate_slot) accepts]
      # (b) ranking expression
      order by round_half_up(100.0 * p.booked_minutes_on_focus_date
                             / p.daily_capacity_minutes, 1) ASC
      # (c) tie-break chain
         then p.created_at ASC
         then p.npi ASC
      # (d) empty-pool fallback
      if candidates is empty: reject ERR_NO_ELIGIBLE_PROVIDER
      selected = candidates[0]
    input_set: "Providers with provider_type == TELECARE_FITTER or status IN {SUSPENDED, OFFBOARDED} are excluded, as is any provider not licensed in the patient's state_code."
    constants: {}
    precision: "utilization to 1 decimal place, round_half_up, before comparison; deterministic tie-break chain that never uses id"

# =========================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
#     single request violates several rules)
#
# Domain priority argument for the business band: this is a regulated medical
# device channel, so (a) medical-safety and state-regulatory checks run FIRST,
# then (b) constraint/temporal checks, then (c) capacity/quota checks, and
# (d) fiscal checks run LAST — a patient must never be told "payment declined"
# for an order that was medically prohibited in the first place.
# =========================================================================
validations:

  # ---- 1..3 authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the nine roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID is the id of an existing instance of the backing entity (Patient or Provider) that is not DEACTIVATED / OFFBOARDED"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 401
    applies_to: "all endpoints called as Patient, HearingProfessional or LicensedAudiologist"

  # ---- 4..9 authorization, including segregation of duties ----
  - priority: 4
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: auth
    check: "an acting Patient's X-User-ID equals the patient_id of the targeted resource (directly, or transitively through device_order_id / trial_period_id / device_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Patient-callable endpoints that target an existing resource"
  - priority: 6
    category: auth
    check: "an acting HearingProfessional / LicensedAudiologist X-User-ID equals the targeted RemoteFittingSession.provider_id or ProviderReferral.provider_id"
    error_id: ERR_NOT_ASSIGNED_PROVIDER
    http_status: 403
    applies_to: "POST /remote-fitting-sessions/{id}/start|complete|no-show, POST /provider-referrals/{id}/determination"
  - priority: 7
    category: auth
    check: "the acting Provider.provider_type == LICENSED_AUDIOLOGIST for clearance and invalidation operations"
    error_id: ERR_PROVIDER_TYPE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /provider-referrals/{id}/determination, POST /screening-sessions/{id}/invalidate"
  - priority: 8
    category: auth
    check: "SEGREGATION OF DUTIES: the approving X-User-ID differs from ReimbursementClaim.submitted_by_user_id, and the approving ComplianceOfficer X-User-ID differs from the filer of the compliance override"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reimbursement-claims/{id}/decide, POST /patients/{patient_id}/compliance-overrides/{override_id}/approve"
  - priority: 9
    category: auth
    check: "SEGREGATION OF DUTIES: the clearing provider did not invalidate ProviderReferral.triggering_screening_session_id"
    error_id: ERR_PROVIDER_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: "POST /provider-referrals/{id}/determination, POST /remote-fitting-sessions (REFERRAL_EVALUATION)"

  # ---- 10..13 existence and referential integrity ----
  - priority: 10
    category: existence
    check: "every path-segment resource exists, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (state_policy_id, patient_id, provider_id, device_order_id, device_id, provider_referral_id, appeal_of_claim_id, subject FKs)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints that accept foreign keys"
  - priority: 12
    category: business_referential
    check: "a referenced StatePolicy has is_retired == false when it is being newly assigned; already-pinned retired policies stay valid on existing orders"
    error_id: ERR_STATE_POLICY_RETIRED
    http_status: 409
    applies_to: "POST /patients, PATCH /patients/{id}, POST /patients/{patient_id}/device-orders"
  - priority: 13
    category: business_referential
    check: "the InventoryPool matching (model, dome_size, tip_type) exists for the requested configuration"
    error_id: ERR_INVENTORY_POOL_NOT_FOUND
    http_status: 404
    applies_to: "POST /device-orders/{id}/confirm-fit, POST /device-orders/{device_order_id}/fit-exchanges"

  # ---- 14..17 request shape ----
  - priority: 14
    category: business_constraint
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 15
    category: business_constraint
    check: "all required body fields are present with the declared type and within declared numeric bounds"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 16
    category: business_constraint
    check: "every supplied enum value is a member of the field's declared constraint set"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST and PATCH endpoints with enum inputs"
  - priority: 17
    category: business_constraint
    check: "unique keys are unused: Patient.email, Provider.npi, Device.serial_number, InventoryPool.sku, FirmwareCampaign.campaign_code, StatePolicy.state_code"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /patients, POST /providers, POST /devices, POST /inventory-pools, POST /firmware-campaigns, POST /state-policies"

  # ---- 18..21 optimistic concurrency (before state, so a stale writer is told
  #      about staleness rather than about a state it cannot see) ----
  - priority: 18
    category: state
    check: "expected_trial_period_version equals TrialPeriod.version"
    error_id: ERR_STALE_TRIAL_VERSION
    http_status: 412
    applies_to: "POST /trial-periods/{trial_period_id}/return-authorizations"
  - priority: 19
    category: state
    check: "expected_device_order_version equals DeviceOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /device-orders/{device_order_id}/fit-exchanges"
  - priority: 20
    category: state
    check: "expected_subscription_version equals CarePlanSubscription.version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /care-plan-subscriptions/{subscription_id}/change-tier"
  - priority: 21
    category: state
    check: "expected_device_version equals Device.version"
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
    applies_to: "POST /firmware-campaigns/{campaign_id}/manual-enrollments"

  # ---- 22..24 state preconditions ----
  - priority: 22
    category: state
    check: "the targeted entity's current state is a declared `from:` state for the requested transition in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints that drive a state transition"
  - priority: 23
    category: state
    check: "the targeted entity is not already in a terminal state for its machine"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints that drive a state transition"
  - priority: 24
    category: state
    check: "CROSS-ENTITY: the sibling entity named by the transition's precondition is in an allowed state (order.fulfillment_status == DELIVERED for INITIAL_FIT start; campaign.status == ROLLING for rollout offer/install; trial.status != RETURN_SETTLED for subscription reinstate)"
    error_id: ERR_DEPENDENT_STATE_NOT_READY
    http_status: 409
    applies_to: "POST /remote-fitting-sessions/{id}/start, POST /firmware-rollouts/{id}/offer|install, POST /care-plan-subscriptions/{id}/reinstate"

  # ---- 25..33 business band (a): medical safety and state regulation ----
  - priority: 25
    category: business_safety
    check: "the patient's pinned StatePolicy.otc_sales_permitted is true"
    error_id: ERR_OTC_SALES_PROHIBITED_IN_STATE
    http_status: 422
    applies_to: "POST /patients/{patient_id}/device-orders"
  - priority: 26
    category: business_safety
    check: "patient.age_years >= StatePolicy.min_age_years"
    error_id: ERR_AGE_BELOW_STATE_MINIMUM
    http_status: 422
    applies_to: "POST /patients/{patient_id}/device-orders, POST /device-orders/{id}/confirm-fit"
  - priority: 27
    category: business_safety
    check: "patient.status != MEDICALLY_DISQUALIFIED"
    error_id: ERR_PATIENT_MEDICALLY_DISQUALIFIED
    http_status: 409
    applies_to: "POST /patients/{patient_id}/device-orders, POST /remote-fitting-sessions, POST /device-orders/{id}/confirm-fit"
  - priority: 28
    category: business_safety
    check: "patient.open_mandatory_flag_count == 0 (no uncleared mandatory red flag)"
    error_id: ERR_MANDATORY_REFERRAL_OPEN
    http_status: 409
    applies_to: "POST /device-orders/{id}/confirm-fit, POST /device-orders/{id}/ship"
  - priority: 29
    category: business_safety
    check: "when the pinned StatePolicy.waiver_required is true, patient.waiver_acknowledged_at is non-null"
    error_id: ERR_WAIVER_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /device-orders/{id}/confirm-fit"
  - priority: 30
    category: business_safety
    check: "when the patient's StatePolicy.telehealth_fitting_permitted is false, the booked Provider.licensed_state_codes contains patient.state_code"
    error_id: ERR_TELEHEALTH_NOT_PERMITTED_IN_STATE
    http_status: 422
    applies_to: "POST /remote-fitting-sessions"
  - priority: 31
    category: business_safety
    check: "for a REFERRAL_EVALUATION booking or a clearance, Provider.licensed_state_codes contains patient.state_code regardless of telehealth permission"
    error_id: ERR_PROVIDER_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /remote-fitting-sessions (REFERRAL_EVALUATION), POST /provider-referrals/{id}/determination"
  - priority: 32
    category: business_temporal
    check: "current logical clock < ProviderReferral.expires_at"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 409
    applies_to: "POST /remote-fitting-sessions (REFERRAL_EVALUATION), POST /provider-referrals/{id}/determination"
  - priority: 33
    category: business_safety
    check: "a firmware install is only offered when the subscriber consented (firmware_auto_update_enabled == true) or the campaign is_mandatory_safety == true"
    error_id: ERR_AUTO_UPDATE_NOT_CONSENTED
    http_status: 422
    applies_to: "POST /firmware-rollouts/{id}/offer, POST /firmware-campaigns/{campaign_id}/manual-enrollments"

  # ---- 34..42 business band (b): constraint and temporal ----
  - priority: 34
    category: business_temporal
    check: "current logical clock <= TrialPeriod.effective_end_utc"
    error_id: ERR_TRIAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /trial-periods/{trial_period_id}/return-authorizations, POST /trial-periods/{id}/extend"
  - priority: 35
    category: business_temporal
    check: "current logical clock <= ReturnAuthorization.return_deadline_utc"
    error_id: ERR_RETURN_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /return-authorizations/{id}/receive, POST /_shipments/scan with event = RETURN_PICKED_UP"
  - priority: 36
    category: business_temporal
    check: "scheduled_start_utc <= current logical clock < scheduled_end_utc for a session start; current logical clock < scheduled_start_utc for a patient cancel; current logical clock >= scheduled_end_utc for a no-show"
    error_id: ERR_SESSION_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /remote-fitting-sessions/{id}/start|cancel|no-show"
  - priority: 37
    category: business_constraint
    check: "half-open buffered interval overlap per calculations.fitting_slot_overlap"
    error_id: ERR_PROVIDER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /remote-fitting-sessions"
  - priority: 38
    category: business_constraint
    check: "closed-interval same-model window collision per calculations.campaign_window_overlap"
    error_id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/schedule"
  - priority: 39
    category: business_constraint
    check: "no open pause interval already exists on the trial per calculations.trial_pause_interval_overlap"
    error_id: ERR_PAUSE_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /repair-orders/{id}/receive"
  - priority: 40
    category: business_constraint
    check: "no RepairOrder on the order's Device with status IN {KIT_SENT, RECEIVED, IN_REPAIR}"
    error_id: ERR_REPAIR_IN_PROGRESS_BLOCKS_RETURN
    http_status: 409
    applies_to: "POST /trial-periods/{trial_period_id}/return-authorizations"
  - priority: 41
    category: business_constraint
    check: "no FitExchange on the order with status IN {RESERVED, SHIPPED}"
    error_id: ERR_EXCHANGE_IN_PROGRESS_BLOCKS_RETURN
    http_status: 409
    applies_to: "POST /trial-periods/{trial_period_id}/return-authorizations"
  - priority: 42
    category: business_constraint
    check: "(to_dome_size, to_tip_type) differs from the order's current (dome_size, tip_type)"
    error_id: ERR_SAME_FIT_CONFIGURATION
    http_status: 422
    applies_to: "POST /device-orders/{device_order_id}/fit-exchanges"

  # ---- 43..49 business band (b, continued): referential and documentation ----
  - priority: 43
    category: business_referential
    check: "exactly the subject FK matching subject_kind is supplied and the other two are null"
    error_id: ERR_SUBJECT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /reimbursement-claims"
  - priority: 44
    category: business_referential
    check: "no other ReimbursementClaim with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, PAID} references the same subject FK"
    error_id: ERR_DUPLICATE_REIMBURSEMENT_SUBJECT
    http_status: 409
    applies_to: "POST /reimbursement-claims, POST /reimbursement-claims/{id}/submit"
  - priority: 45
    category: business_constraint
    check: "document_codes is a superset of the required set for subject_kind ({INVOICE, AUDIOGRAM_OR_WAIVER, PROOF_OF_PAYMENT, LMN} for DEVICE_ORDER, {INVOICE, PROOF_OF_PAYMENT} otherwise)"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /reimbursement-claims/{id}/submit, POST /reimbursement-claims/{id}/supply-info"
  - priority: 46
    category: business_constraint
    check: "no prior appeal exists for the claim named by appeal_of_claim_id, and that claim's denial_reason != DUPLICATE_SUBJECT"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /reimbursement-claims"
  - priority: 47
    category: business_constraint
    check: "info_request_count < 2"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /reimbursement-claims/{id}/request-info"
  - priority: 48
    category: business_constraint
    check: "ProviderReferral.reschedule_count < 2 before a third SCHEDULED -> OPEN cycle"
    error_id: ERR_MAX_RESCHEDULES_EXCEEDED
    http_status: 409
    applies_to: "POST /remote-fitting-sessions (REFERRAL_EVALUATION)"
  - priority: 49
    category: business_constraint
    check: "Device.firmware_version equals FirmwareRollout.from_version_observed at install report time"
    error_id: ERR_FIRMWARE_VERSION_DRIFT
    http_status: 409
    applies_to: "POST /_firmware/report with outcome = SUCCESS"

  # ---- 50..57 business band (c): capacity and quota ----
  - priority: 50
    category: business_constraint
    check: "booked_minutes_on_focus_date + duration_minutes <= Provider.daily_capacity_minutes (equality accepted)"
    error_id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /remote-fitting-sessions"
  - priority: 51
    category: business_constraint
    check: "the target InventoryPool has is_discontinued == false"
    error_id: ERR_POOL_DISCONTINUED
    http_status: 409
    applies_to: "POST /device-orders/{id}/confirm-fit, POST /device-orders/{device_order_id}/fit-exchanges"
  - priority: 52
    category: business_constraint
    check: "the target InventoryPool has on_hand_units >= 1"
    error_id: ERR_INVENTORY_POOL_DEPLETED
    http_status: 409
    applies_to: "POST /device-orders/{id}/confirm-fit, POST /device-orders/{device_order_id}/fit-exchanges with allow_backorder = false"
  - priority: 53
    category: business_constraint
    check: "TrialPeriod.paused_days < 60 before opening a new pause"
    error_id: ERR_PAUSE_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/receive"
  - priority: 54
    category: business_constraint
    check: "count of FirmwareRollout rows in status == INSTALLING for the campaign < campaign.max_concurrent_installs"
    error_id: ERR_MAX_CONCURRENT_INSTALLS_REACHED
    http_status: 409
    applies_to: "POST /firmware-rollouts/{id}/install, POST /firmware-campaigns/{id}/advance"
  - priority: 55
    category: business_constraint
    check: "FirmwareRollout.attempt_count < 3"
    error_id: ERR_INSTALL_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /firmware-rollouts/{id}/install"
  - priority: 56
    category: business_constraint
    check: "calculations.firmware_cohort_selection produced a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_DEVICES
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/advance"
  - priority: 57
    category: business_constraint
    check: "calculations.referral_provider_selection produced a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_PROVIDER
    http_status: 409
    applies_to: "POST /remote-fitting-sessions with session_type = REFERRAL_EVALUATION and provider_id omitted"
  - priority: 58
    category: business_constraint
    check: "Device.loss_damage_claims_approved < StatePolicy.max_loss_damage_claims for a LOSS or DAMAGE claim decision"
    error_id: ERR_CLAIM_CAP_REACHED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/decide"

  # ---- 59..65 business band (d): fiscal, deliberately LAST ----
  - priority: 59
    category: business_temporal
    check: "Device.warranty_expires_at > current logical clock, except for claim_kind == LOSS"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/decide with decision IN {REPLACE, REPAIR}"
  - priority: 60
    category: business_fiscal
    check: "claimed_amount_cents <= eligible_amount_cents"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_ELIGIBLE
    http_status: 422
    applies_to: "POST /reimbursement-claims/{id}/decide with decision = APPROVE"
  - priority: 61
    category: business_fiscal
    check: "WarrantyClaim.deductible_paid_cents == deductible_cents"
    error_id: ERR_DEDUCTIBLE_UNPAID
    http_status: 402
    applies_to: "POST /warranty-claims/{id}/fulfill"
  - priority: 62
    category: business_fiscal
    check: "the simulated charge outcome is SUCCEEDED for the amount due after credits"
    error_id: ERR_PAYMENT_DECLINED
    http_status: 402
    applies_to: "POST /care-plan-subscriptions/{id}/run-billing-cycle, POST /care-plan-subscriptions/{id}/retry-payment"
  - priority: 63
    category: business_fiscal
    check: "CarePlanSubscription.dunning_attempts < 3"
    error_id: ERR_DUNNING_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /care-plan-subscriptions/{id}/retry-payment"
  - priority: 64
    category: business_fiscal
    check: "credit_balance_cents >= the amount being consumed when pay_from_credit = true"
    error_id: ERR_CREDIT_BALANCE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /care-plan-subscriptions/{id}/run-billing-cycle with pay_from_credit = true"
  - priority: 65
    category: business_temporal
    check: "current logical clock <= ReturnAuthorization.settled_at + 30 days"
    error_id: ERR_RESTOCKING_WAIVE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /return-authorizations/{id}/waive-restocking"

  # ---- documented priority conflicts (dual-failure scenarios) ----
  # Conflict 1 (state vs business_fiscal): a run-billing-cycle on a CANCELLED
  #   subscription with a declined instrument violates priority 22
  #   (ERR_INVALID_STATE) and priority 62 (ERR_PAYMENT_DECLINED) -> 22 wins.
  # Conflict 2 (business_safety vs business_referential): a confirm-fit for a
  #   patient with an open mandatory red flag AND a (model,dome,tip) combination
  #   that has no InventoryPool row violates priority 28
  #   (ERR_MANDATORY_REFERRAL_OPEN) and priority 13
  #   (ERR_INVENTORY_POOL_NOT_FOUND) -> 13 wins because referential existence is
  #   checked before the safety band.
  # Conflict 3 (business_temporal vs business_constraint): a return request past
  #   effective_end_utc on an order whose device is IN_REPAIR violates priority 34
  #   (ERR_TRIAL_WINDOW_CLOSED) and priority 40
  #   (ERR_REPAIR_IN_PROGRESS_BLOCKS_RETURN) -> 34 wins.
  # Conflict 4 (auth vs state): a Patient cancelling another patient's SHIPPED
  #   exchange violates priority 5 (ERR_NOT_RESOURCE_OWNER) and priority 22
  #   (ERR_INVALID_STATE) -> 5 wins.

# =========================================================================
# 1.5 API Endpoint Table  (all paths are relative to api_prefix /hearing-care)
# Every FK declared in §1.1 is reverse-reachable through either a
# sub-resource GET or a filtered-list GET whose input carries the fk field.
# =========================================================================
endpoints:

  # ---------- StatePolicy ----------
  - { method: POST, path: "/state-policies", description: "Create a state regulatory policy", roles: [PlatformAdmin], code: 201, input: ["state_code", "otc_sales_permitted", "telehealth_fitting_permitted", "min_age_years", "trial_period_days", "restocking_fee_mode", "restocking_fee_pct?", "restocking_daily_rate_cents?", "restocking_fee_cap_cents?", "shipping_refundable?", "referral_validity_days?", "waiver_required?", "max_loss_damage_claims?"], output: "StatePolicy", side_effects: ["sets version = 1"] }
  - { method: GET, path: "/state-policies", description: "List policies", roles: [PlatformAdmin, CareOpsAgent, ComplianceOfficer], code: 200, input: ["state_code?", "is_retired?", "limit?", "offset?"], output: "StatePolicy[]", side_effects: [] }
  - { method: GET, path: "/state-policies/{id}", description: "Read one policy including version", roles: [PlatformAdmin, CareOpsAgent, ComplianceOfficer], code: 200, input: [], output: "StatePolicy", side_effects: [] }
  - method: PATCH
    path: "/state-policies/{id}"
    description: "Amend a policy; existing orders keep their pinned snapshot"
    roles: [PlatformAdmin]
    code: 200
    input: ["trial_period_days?", "restocking_fee_mode?", "restocking_fee_pct?", "restocking_daily_rate_cents?", "restocking_fee_cap_cents?", "shipping_refundable?", "waiver_required?", "otc_sales_permitted?", "telehealth_fitting_permitted?", "min_age_years?", "referral_validity_days?", "max_loss_damage_claims?"]
    output: "StatePolicy"
    side_effects:
      - "increments StatePolicy.version by 1"
      - "does NOT touch DeviceOrder.pinned_* fields of existing orders (version pinning)"
  - { method: DELETE, path: "/state-policies/{id}", description: "Soft-retire a policy", roles: [PlatformAdmin], code: 200, input: [], output: "StatePolicy", side_effects: ["sets is_retired = true; increments version"] }

  # ---------- Patient ----------
  - method: POST
    path: "/patients"
    description: "Register a patient against a state policy"
    roles: [CareOpsAgent, PlatformAdmin]
    code: 201
    input: ["state_policy_id", "email", "full_name", "age_years"]
    output: "Patient"
    side_effects: ["denormalizes state_code from the policy", "status = REGISTERED, candidacy_risk_score = 0, candidacy_risk_band = LOW"]
  - { method: GET, path: "/patients", description: "List patients, filterable by policy (reverse reachability for Patient.state_policy_id)", roles: [CareOpsAgent, ComplianceOfficer, PlatformAdmin, ReimbursementSpecialist], code: 200, input: ["state_policy_id?", "status?", "candidacy_risk_band?", "limit?", "offset?"], output: "Patient[]", side_effects: [] }
  - { method: GET, path: "/patients/{id}", description: "Read a patient with computed candidacy fields and version", roles: [Patient, CareOpsAgent, LicensedAudiologist, HearingProfessional, ComplianceOfficer, ReimbursementSpecialist, PlatformAdmin], code: 200, input: [], output: "Patient", side_effects: [] }
  - { method: PATCH, path: "/patients/{id}", description: "Update contact details, age or state policy", roles: [Patient, CareOpsAgent], code: 200, input: ["email?", "full_name?", "age_years?", "state_policy_id?"], output: "Patient", side_effects: ["re-denormalizes state_code when state_policy_id changes", "increments version"] }
  - { method: POST, path: "/patients/{id}/acknowledge-waiver", description: "Record the medical-evaluation waiver acknowledgement", roles: [Patient], code: 200, input: [], output: "Patient", side_effects: ["sets waiver_acknowledged_at to the current logical clock", "increments version"] }
  - { method: DELETE, path: "/patients/{id}", description: "Deactivate a patient", roles: [PlatformAdmin], code: 200, input: [], output: "Patient", side_effects: ["status -> DEACTIVATED, sets deactivated_at, invalidates DRAFT screening sessions"] }

  # ---------- ScreeningSession / RedFlagFinding ----------
  - { method: POST, path: "/patients/{patient_id}/screening-sessions", description: "Start a self-administered screening (retake sets supersedes_session_id)", roles: [Patient], code: 201, input: ["supersedes_session_id?"], output: "ScreeningSession", side_effects: ["Patient.status -> SCREENING_IN_PROGRESS", "sets attempt_ordinal"] }
  - { method: GET, path: "/patients/{patient_id}/screening-sessions", description: "List a patient's screenings (reverse reachability for ScreeningSession.patient_id)", roles: [Patient, CareOpsAgent, LicensedAudiologist, PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ScreeningSession[]", side_effects: [] }
  - { method: GET, path: "/screening-sessions", description: "List screenings; supersedes_session_id filter gives reverse reachability for the self-reference", roles: [CareOpsAgent, LicensedAudiologist, ComplianceOfficer, PlatformAdmin], code: 200, input: ["patient_id?", "supersedes_session_id?", "status?", "screening_outcome?", "limit?", "offset?"], output: "ScreeningSession[]", side_effects: [] }
  - { method: GET, path: "/screening-sessions/{id}", description: "Read one screening with outcome and scores", roles: [Patient, CareOpsAgent, LicensedAudiologist, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "ScreeningSession", side_effects: [] }
  - { method: PATCH, path: "/screening-sessions/{id}", description: "Record screening measurements", roles: [Patient], code: 200, input: ["pure_tone_avg_db", "asymmetry_db", "self_reported_difficulty_score", "speech_in_noise_pct", "symptom_codes"], output: "ScreeningSession", side_effects: ["status DRAFT -> IN_PROGRESS", "increments version"] }
  - method: POST
    path: "/screening-sessions/{id}/submit"
    description: "Submit and score the screening; emits red-flag findings and drives the patient's candidacy state"
    roles: [Patient]
    code: 200
    input: []
    output: "ScreeningSession"
    side_effects:
      - "status IN_PROGRESS -> SUBMITTED -> SCORED inside one request"
      - "runs calculations.red_flag_referral_trigger, creating RedFlagFinding rows"
      - "runs calculations.candidacy_risk_score variant PROVISIONAL_SELF_REPORTED on a PASS/ADVISORY_PASS"
      - "on RED_FLAG: opens a ProviderReferral and runs CASCADE-B hops 2-4 (orders -> MEDICAL_HOLD, sessions -> CANCELLED, provider capacity recompute)"
      - "invalidates the superseded session when supersedes_session_id was set"
  - { method: POST, path: "/screening-sessions/{id}/invalidate", description: "Licensed audiologist voids a screening for data quality", roles: [LicensedAudiologist], code: 200, input: ["reason_note?"], output: "ScreeningSession", side_effects: ["status -> INVALIDATED with invalidated_reason = DATA_QUALITY", "records the invalidating provider id for the conflict-of-interest check", "recomputes Patient.advisory_weight_total and open_mandatory_flag_count"] }
  - { method: GET, path: "/screening-sessions/{id}/red-flag-findings", description: "List findings of a screening", roles: [Patient, LicensedAudiologist, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["severity?", "limit?", "offset?"], output: "RedFlagFinding[]", side_effects: [] }
  - { method: GET, path: "/red-flag-findings", description: "List findings; filters give reverse reachability for RedFlagFinding.screening_session_id and RedFlagFinding.cleared_by_referral_id", roles: [LicensedAudiologist, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["screening_session_id?", "cleared_by_referral_id?", "code?", "severity?", "limit?", "offset?"], output: "RedFlagFinding[]", side_effects: [] }

  # ---------- ComplianceOverride ----------
  - { method: POST, path: "/patients/{patient_id}/compliance-overrides", description: "File a medical-disqualification override for dual approval", roles: [ComplianceOfficer], code: 201, input: ["justification"], output: "ComplianceOverride", side_effects: ["status = PENDING, filed_by_user_id = acting X-User-ID"] }
  - { method: GET, path: "/patients/{patient_id}/compliance-overrides", description: "List overrides of a patient (reverse reachability for ComplianceOverride.patient_id)", roles: [ComplianceOfficer, PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ComplianceOverride[]", side_effects: [] }
  - { method: POST, path: "/patients/{patient_id}/compliance-overrides/{override_id}/approve", description: "Second compliance officer approves the override", roles: [ComplianceOfficer], code: 200, input: [], output: "ComplianceOverride", side_effects: ["status -> APPROVED, approved_by_user_id set", "Patient MEDICALLY_DISQUALIFIED -> SCREENING_IN_PROGRESS", "invalidates the latest SCORED screening with reason PROVIDER_OVERRIDE and creates a fresh DRAFT screening"] }
  - { method: POST, path: "/patients/{patient_id}/compliance-overrides/{override_id}/reject", description: "Reject a pending override", roles: [ComplianceOfficer], code: 200, input: ["reason_note?"], output: "ComplianceOverride", side_effects: ["status -> REJECTED; patient state unchanged"] }

  # ---------- Provider ----------
  - { method: POST, path: "/providers", description: "Onboard a hearing professional or licensed audiologist", roles: [PlatformAdmin], code: 201, input: ["provider_type", "npi", "full_name", "licensed_state_codes", "daily_capacity_minutes", "buffer_minutes?"], output: "Provider", side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/providers", description: "List providers", roles: [Patient, CareOpsAgent, HearingProfessional, LicensedAudiologist, PlatformAdmin], code: 200, input: ["provider_type?", "status?", "licensed_state_code?", "limit?", "offset?"], output: "Provider[]", side_effects: [] }
  - { method: GET, path: "/providers/{id}", description: "Read a provider with capacity utilization", roles: [Patient, CareOpsAgent, HearingProfessional, LicensedAudiologist, PlatformAdmin], code: 200, input: [], output: "Provider", side_effects: [] }
  - { method: PATCH, path: "/providers/{id}", description: "Adjust availability, capacity or licensure", roles: [PlatformAdmin], code: 200, input: ["status?", "daily_capacity_minutes?", "buffer_minutes?", "licensed_state_codes?"], output: "Provider", side_effects: ["increments version"] }

  # ---------- ProviderReferral ----------
  - { method: GET, path: "/provider-referrals", description: "List referrals; filters give reverse reachability for patient_id, provider_id and triggering_screening_session_id", roles: [Patient, LicensedAudiologist, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["patient_id?", "provider_id?", "triggering_screening_session_id?", "status?", "limit?", "offset?"], output: "ProviderReferral[]", side_effects: ["lazily expires referrals whose expires_at has passed"] }
  - { method: GET, path: "/provider-referrals/{id}", description: "Read one referral", roles: [Patient, LicensedAudiologist, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "ProviderReferral", side_effects: ["lazily expires this referral when expires_at has passed"] }
  - { method: GET, path: "/provider-referrals/{id}/cleared-findings", description: "Findings retired by this referral (reverse reachability for RedFlagFinding.cleared_by_referral_id)", roles: [LicensedAudiologist, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "RedFlagFinding[]", side_effects: [] }
  - method: POST
    path: "/provider-referrals/{id}/determination"
    description: "Licensed audiologist records the clearance decision"
    roles: [LicensedAudiologist]
    code: 200
    input: ["clearance_outcome", "clearance_note?"]
    output: "ProviderReferral"
    side_effects:
      - "CLEARED: clears matching findings, Patient -> PROVIDER_CLEARED, recomputes candidacy_risk_score with variant PROVIDER_ADJUSTED, releases MEDICAL_HOLD orders"
      - "NOT_CLEARED: Patient -> MEDICALLY_DISQUALIFIED, cancels MEDICAL_HOLD orders with a full refund and cancels their care plans"
  - { method: POST, path: "/provider-referrals/{id}/withdraw", description: "Withdraw an open referral", roles: [ComplianceOfficer], code: 200, input: ["reason_note?"], output: "ProviderReferral", side_effects: ["status -> WITHDRAWN; the patient may start a retake screening"] }

  # ---------- RemoteFittingSession ----------
  - method: POST
    path: "/remote-fitting-sessions"
    description: "Book a remote programming or referral-evaluation slot; omit provider_id for REFERRAL_EVALUATION to let calculations.referral_provider_selection pick"
    roles: [Patient]
    code: 201
    input: ["patient_id", "session_type", "scheduled_start_utc", "scheduled_end_utc", "provider_id?", "device_order_id?", "provider_referral_id?", "programming_profile?"]
    output: "RemoteFittingSession"
    side_effects:
      - "status REQUESTED -> SCHEDULED in the same request"
      - "runs calculations.fitting_slot_overlap and calculations.provider_daily_capacity"
      - "recomputes Provider.booked_minutes_on_focus_date and utilization_pct"
      - "for REFERRAL_EVALUATION, drives ProviderReferral OPEN -> SCHEDULED and sets its provider_id"
  - { method: GET, path: "/remote-fitting-sessions", description: "List sessions; filters give reverse reachability for patient_id, provider_id, device_order_id and provider_referral_id", roles: [Patient, HearingProfessional, LicensedAudiologist, CareOpsAgent, PlatformAdmin], code: 200, input: ["patient_id?", "provider_id?", "device_order_id?", "provider_referral_id?", "status?", "session_type?", "limit?", "offset?"], output: "RemoteFittingSession[]", side_effects: [] }
  - { method: GET, path: "/remote-fitting-sessions/{id}", description: "Read one session", roles: [Patient, HearingProfessional, LicensedAudiologist, CareOpsAgent, PlatformAdmin], code: 200, input: [], output: "RemoteFittingSession", side_effects: [] }
  - { method: POST, path: "/remote-fitting-sessions/{id}/start", description: "Begin the session inside its window", roles: [HearingProfessional, LicensedAudiologist], code: 200, input: [], output: "RemoteFittingSession", side_effects: ["status SCHEDULED -> IN_PROGRESS"] }
  - { method: POST, path: "/remote-fitting-sessions/{id}/complete", description: "Complete the session and apply the programming profile", roles: [HearingProfessional, LicensedAudiologist], code: 200, input: ["programming_profile?"], output: "RemoteFittingSession", side_effects: ["status -> COMPLETED, sets completed_at, increments Provider.completed_session_count", "INITIAL_FIT sets Device.status = WITH_PATIENT", "REFERRAL_EVALUATION drives ProviderReferral SCHEDULED -> EVALUATED"] }
  - { method: POST, path: "/remote-fitting-sessions/{id}/no-show", description: "Record a patient no-show after the window closed", roles: [HearingProfessional, LicensedAudiologist], code: 200, input: [], output: "RemoteFittingSession", side_effects: ["status -> NO_SHOW, charges no_show_charged_cents against plan credit first", "recomputes provider capacity", "REFERRAL_EVALUATION drives the referral back to OPEN and increments reschedule_count"] }
  - { method: POST, path: "/remote-fitting-sessions/{id}/cancel", description: "Cancel before the start instant", roles: [Patient, CareOpsAgent], code: 200, input: [], output: "RemoteFittingSession", side_effects: ["status -> CANCELLED, may charge a late-cancel fee", "recomputes provider capacity", "REFERRAL_EVALUATION drives the referral back to OPEN"] }
  - { method: POST, path: "/remote-fitting-sessions/{id}/rebook", description: "Reopen a no-showed session for rescheduling", roles: [Patient], code: 200, input: [], output: "RemoteFittingSession", side_effects: ["status NO_SHOW -> REQUESTED, clears the scheduled interval"] }

  # ---------- DeviceOrder ----------
  - method: POST
    path: "/patients/{patient_id}/device-orders"
    description: "Place an OTC device order; pins the state policy snapshot at checkout"
    roles: [Patient, CareOpsAgent]
    code: 201
    input: ["model", "dome_size", "tip_type", "list_price_cents", "discount_cents?", "accessory_subtotal_cents?", "shipping_cents?"]
    output: "DeviceOrder"
    side_effects:
      - "pins state_policy_id, pinned_state_policy_version, pinned_trial_days, pinned_restocking_mode"
      - "runs calculations.order_total_composition writing tax_cents and total_cents"
      - "payment_status = PENDING_AUTH, fulfillment_status = PENDING_FIT_CONFIRM"
  - { method: GET, path: "/device-orders", description: "List orders; filters give reverse reachability for patient_id and state_policy_id", roles: [Patient, CareOpsAgent, ReimbursementSpecialist, ComplianceOfficer, PlatformAdmin], code: 200, input: ["patient_id?", "state_policy_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"], output: "DeviceOrder[]", side_effects: [] }
  - { method: GET, path: "/device-orders/{id}", description: "Read an order with both state dimensions, cash counters and version", roles: [Patient, CareOpsAgent, ReimbursementSpecialist, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "DeviceOrder", side_effects: [] }
  - { method: GET, path: "/device-orders/{id}/summary", description: "Computed read: cash conservation breakdown, trial position and fit-exchange history", roles: [Patient, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "DeviceOrder", side_effects: [] }
  - method: POST
    path: "/device-orders/{id}/confirm-fit"
    description: "Clear the order for shipment: reserves inventory and assigns a device"
    roles: [CareOpsAgent]
    code: 200
    input: []
    output: "DeviceOrder"
    side_effects:
      - "fulfillment_status PENDING_FIT_CONFIRM -> READY_TO_SHIP"
      - "InventoryPool.on_hand_units -= 1, reserved_units += 1"
      - "assigns an IN_STOCK Device (Device.status -> ASSIGNED, device_order_id set)"
      - "increments DeviceOrder.version by 1"
  - { method: POST, path: "/device-orders/{id}/ship", description: "Ship the assigned device and capture payment", roles: [CareOpsAgent], code: 200, input: [], output: "DeviceOrder", side_effects: ["fulfillment_status READY_TO_SHIP -> SHIPPED and payment_status AUTHORIZED -> CAPTURED", "sets captured_cents = total_cents and open_balance_cents = total_cents", "sets Device.shipped_at and warranty_expires_at = shipped_at + 730 days", "InventoryPool.reserved_units -= 1, dispatched_units += 1", "increments DeviceOrder.version by 1"] }
  - { method: POST, path: "/device-orders/{id}/cancel", description: "Cancel an unshipped order", roles: [CareOpsAgent], code: 200, input: ["reason_note?"], output: "DeviceOrder", side_effects: ["fulfillment_status -> CANCELLED, payment_status AUTHORIZED -> VOIDED", "releases any inventory reservation and returns the assigned Device to IN_STOCK", "increments version"] }

  # ---------- Device ----------
  - { method: POST, path: "/devices", description: "Mint a warehouse unit", roles: [PlatformAdmin], code: 201, input: ["serial_number", "model", "firmware_version?"], output: "Device", side_effects: ["status = IN_STOCK"] }
  - { method: GET, path: "/devices", description: "List devices; filters give reverse reachability for device_order_id and replaced_by_device_id", roles: [CareOpsAgent, RepairTechnician, FirmwareEngineer, PlatformAdmin, Patient], code: 200, input: ["device_order_id?", "replaced_by_device_id?", "status?", "model?", "firmware_version?", "limit?", "offset?"], output: "Device[]", side_effects: [] }
  - { method: GET, path: "/devices/{id}", description: "Read a device with firmware, warranty and claim counters and version", roles: [Patient, CareOpsAgent, RepairTechnician, FirmwareEngineer, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "Device", side_effects: [] }

  # ---------- InventoryPool ----------
  - { method: POST, path: "/inventory-pools", description: "Create a dome/tip SKU pool", roles: [PlatformAdmin], code: 201, input: ["sku", "model", "dome_size", "tip_type"], output: "InventoryPool", side_effects: ["all counters start at 0"] }
  - { method: GET, path: "/inventory-pools", description: "List pools with conservation counters", roles: [CareOpsAgent, PlatformAdmin, Patient], code: 200, input: ["model?", "dome_size?", "tip_type?", "is_discontinued?", "limit?", "offset?"], output: "InventoryPool[]", side_effects: [] }
  - { method: POST, path: "/inventory-pools/{id}/restock", description: "Add units to a pool", roles: [PlatformAdmin], code: 200, input: ["units"], output: "InventoryPool", side_effects: ["on_hand_units += units and total_units_received += units", "increments version"] }
  - { method: DELETE, path: "/inventory-pools/{id}", description: "Discontinue a pool (soft delete, still queryable)", roles: [PlatformAdmin], code: 200, input: [], output: "InventoryPool", side_effects: ["sets is_discontinued = true"] }

  # ---------- TrialPeriod / ReturnAuthorization ----------
  - { method: GET, path: "/trial-periods", description: "List trials; filters give reverse reachability for device_order_id and patient_id", roles: [Patient, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["device_order_id?", "patient_id?", "status?", "limit?", "offset?"], output: "TrialPeriod[]", side_effects: ["lazily expires trials past effective_end_utc"] }
  - { method: GET, path: "/trial-periods/{id}", description: "Read a trial with days_used, paused_days, effective_end_utc and version", roles: [Patient, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "TrialPeriod", side_effects: ["recomputes days_used / paused_days / effective_end_utc via calculations.trial_days_used", "lazily expires the trial when the clock passed effective_end_utc"] }
  - { method: POST, path: "/trial-periods/{id}/extend", description: "Grant goodwill trial days", roles: [CareOpsAgent], code: 200, input: ["extension_days"], output: "TrialPeriod", side_effects: ["extension_days_granted += extension_days, recomputes effective_end_utc", "increments TrialPeriod.version by 1"] }
  - method: POST
    path: "/trial-periods/{trial_period_id}/return-authorizations"
    description: "Issue a return authorization for a trial (OCC guarded on the trial's version)"
    roles: [Patient]
    code: 201
    input: ["expected_trial_period_version"]
    output: "ReturnAuthorization"
    side_effects:
      - "TrialPeriod.status ACTIVE -> RETURN_INITIATED"
      - "snapshots days_used_at_issue and sets return_deadline_utc = clock + 14 days"
      - "increments TrialPeriod.version by 1 and DeviceOrder.version by 1"
  - { method: GET, path: "/trial-periods/{trial_period_id}/return-authorizations", description: "List a trial's authorizations (reverse reachability for ReturnAuthorization.trial_period_id)", roles: [Patient, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ReturnAuthorization[]", side_effects: [] }
  - { method: GET, path: "/return-authorizations/{id}", description: "Read one authorization with the settlement breakdown", roles: [Patient, CareOpsAgent, ComplianceOfficer, ReimbursementSpecialist, PlatformAdmin], code: 200, input: [], output: "ReturnAuthorization", side_effects: ["lazily expires the authorization when the clock passed return_deadline_utc"] }
  - { method: POST, path: "/return-authorizations/{id}/receive", description: "Warehouse receipt of the returned unit", roles: [CareOpsAgent], code: 200, input: [], output: "ReturnAuthorization", side_effects: ["status IN_TRANSIT -> RECEIVED, sets received_at"] }
  - method: POST
    path: "/return-authorizations/{id}/inspect"
    description: "Record the inspection grade and compute the restocking settlement"
    roles: [CareOpsAgent]
    code: 200
    input: ["inspection_grade"]
    output: "ReturnAuthorization"
    side_effects:
      - "status RECEIVED -> INSPECTED"
      - "runs calculations.return_refund_settlement writing restocking_variant, restocking_fee_cents, non_refundable_shipping_cents, refund_amount_cents"
      - "RESELLABLE credits one unit back: InventoryPool.dispatched_units -= 1, on_hand_units += 1"
  - method: POST
    path: "/return-authorizations/{id}/settle"
    description: "Settle the refund and run the return cascade"
    roles: [CareOpsAgent]
    code: 200
    input: []
    output: "ReturnAuthorization"
    side_effects:
      - "CASCADE-A hop 1: TrialPeriod RETURN_INITIATED -> RETURN_SETTLED, increments Patient.lifetime_return_count"
      - "CASCADE-A hop 2: DeviceOrder.fulfillment_status -> RETURNED and payment_status -> PARTIALLY_REFUNDED or REFUNDED with refunded_cents / retained_cents updated"
      - "CASCADE-A hop 3: Device.status -> RETIRED"
      - "CASCADE-A hop 4: attached CarePlanSubscription -> CANCELLED with credit_balance_cents forfeited"
      - "CASCADE-A hop 5: FirmwareRollout rows in PENDING/OFFERED on that device -> CANCELLED_INELIGIBLE and campaign counters recomputed"
  - { method: POST, path: "/return-authorizations/{id}/void", description: "Void an issued authorization and revert the trial", roles: [CareOpsAgent], code: 200, input: ["reason_note?"], output: "ReturnAuthorization", side_effects: ["status ISSUED -> VOIDED, TrialPeriod RETURN_INITIATED -> ACTIVE", "leaves the cash-conservation identity unchanged", "increments TrialPeriod.version by 1"] }
  - { method: POST, path: "/return-authorizations/{id}/waive-restocking", description: "Compensating action: refund previously retained restocking", roles: [ComplianceOfficer], code: 200, input: ["reason_note?"], output: "ReturnAuthorization", side_effects: ["restocking_fee_cents -> 0, non_refundable_shipping_cents -> 0, refund_amount_cents = captured_cents", "DeviceOrder.payment_status PARTIALLY_REFUNDED -> REFUNDED with retained_cents -> 0", "restocking_variant -> WAIVED"] }

  # ---------- FitExchange ----------
  - method: POST
    path: "/device-orders/{device_order_id}/fit-exchanges"
    description: "Request a dome/tip exchange (OCC guarded on the order's version)"
    roles: [Patient]
    code: 201
    input: ["to_dome_size", "to_tip_type", "expected_device_order_version", "allow_backorder?"]
    output: "FitExchange"
    side_effects:
      - "status REQUESTED -> RESERVED (or REJECTED with rejection_reason = POOL_DEPLETED when allow_backorder is true and stock is 0)"
      - "reserves one unit in the target pool and computes exchange_fee_cents via calculations.fit_exchange_fee"
      - "increments DeviceOrder.version by 1"
  - { method: GET, path: "/fit-exchanges", description: "List exchanges; filters give reverse reachability for device_order_id and both pool FKs", roles: [Patient, CareOpsAgent, PlatformAdmin], code: 200, input: ["device_order_id?", "from_inventory_pool_id?", "to_inventory_pool_id?", "status?", "limit?", "offset?"], output: "FitExchange[]", side_effects: [] }
  - { method: GET, path: "/fit-exchanges/{id}", description: "Read one exchange", roles: [Patient, CareOpsAgent, PlatformAdmin], code: 200, input: [], output: "FitExchange", side_effects: [] }
  - { method: POST, path: "/fit-exchanges/{id}/ship", description: "Ship the replacement domes/tips", roles: [CareOpsAgent], code: 200, input: [], output: "FitExchange", side_effects: ["status RESERVED -> SHIPPED; counters unchanged"] }
  - { method: POST, path: "/fit-exchanges/{id}/confirm", description: "Patient confirms the new configuration fits", roles: [Patient], code: 200, input: [], output: "FitExchange", side_effects: ["status SHIPPED -> COMPLETED", "rewrites DeviceOrder.dome_size / tip_type and increments its version", "target pool reserved -> dispatched, source pool dispatched -> on_hand"] }
  - { method: POST, path: "/fit-exchanges/{id}/cancel", description: "Cancel an exchange and restore inventory", roles: [Patient, CareOpsAgent], code: 200, input: ["reason_note?"], output: "FitExchange", side_effects: ["status -> CANCELLED, target pool reserved_units -> on_hand_units", "credits exchange_fee_cents back to CarePlanSubscription.credit_balance_cents when it was charged"] }

  # ---------- RepairOrder ----------
  - { method: POST, path: "/repair-orders", description: "Open a repair for a device with the patient", roles: [Patient, CareOpsAgent], code: 201, input: ["device_id", "fault_code"], output: "RepairOrder", side_effects: ["status = KIT_REQUESTED, denormalizes patient_id and care_plan_subscription_id, computes sla_days and pauses_trial"] }
  - { method: GET, path: "/repair-orders", description: "List repairs; filters give reverse reachability for device_id, patient_id and care_plan_subscription_id", roles: [Patient, RepairTechnician, CareOpsAgent, ReimbursementSpecialist, PlatformAdmin], code: 200, input: ["device_id?", "patient_id?", "care_plan_subscription_id?", "status?", "limit?", "offset?"], output: "RepairOrder[]", side_effects: [] }
  - { method: GET, path: "/repair-orders/{id}", description: "Read a repair with turnaround and SLA credit", roles: [Patient, RepairTechnician, CareOpsAgent, ReimbursementSpecialist, PlatformAdmin], code: 200, input: [], output: "RepairOrder", side_effects: [] }
  - { method: POST, path: "/repair-orders/{id}/send-kit", description: "Dispatch the mail-in kit", roles: [CareOpsAgent], code: 200, input: [], output: "RepairOrder", side_effects: ["status KIT_REQUESTED -> KIT_SENT"] }
  - { method: POST, path: "/repair-orders/{id}/receive", description: "Depot receipt; starts the SLA clock and pauses the trial", roles: [RepairTechnician], code: 200, input: [], output: "RepairOrder", side_effects: ["status KIT_SENT -> RECEIVED, sets received_at, Device.status -> IN_REPAIR", "when pauses_trial: TrialPeriod ACTIVE -> PAUSED with a new closed pause interval", "runs calculations.trial_pause_interval_overlap"] }
  - { method: POST, path: "/repair-orders/{id}/start", description: "Begin bench work", roles: [RepairTechnician], code: 200, input: [], output: "RepairOrder", side_effects: ["status RECEIVED -> IN_REPAIR"] }
  - { method: POST, path: "/repair-orders/{id}/resolve", description: "Record the branch outcome (REPAIRED or UNREPAIRABLE)", roles: [RepairTechnician], code: 200, input: ["resolution"], output: "RepairOrder", side_effects: ["status IN_REPAIR -> REPAIRED (branch A) or -> UNREPAIRABLE (branch B, Device.status -> REPLACED)"] }
  - { method: POST, path: "/repair-orders/{id}/return-to-patient", description: "Close a repaired unit back to the patient", roles: [RepairTechnician], code: 200, input: [], output: "RepairOrder", side_effects: ["status REPAIRED -> RETURNED_TO_PATIENT, sets closed_at and turnaround_days", "runs calculations.repair_sla_credit and credits CarePlanSubscription.credit_balance_cents", "Device.status -> WITH_PATIENT and TrialPeriod PAUSED -> ACTIVE with effective_end_utc extended"] }
  - { method: POST, path: "/repair-orders/{id}/escalate", description: "Escalate an unrepairable unit into a defect warranty claim", roles: [RepairTechnician], code: 200, input: [], output: "RepairOrder", side_effects: ["status UNREPAIRABLE -> ESCALATED_TO_WARRANTY, sets closed_at / turnaround_days / sla_credit_cents", "creates a WarrantyClaim in FILED with claim_kind = DEFECT", "TrialPeriod PAUSED -> ACTIVE"] }
  - { method: POST, path: "/repair-orders/{id}/cancel", description: "Cancel a repair before depot receipt", roles: [Patient, CareOpsAgent], code: 200, input: ["reason_note?"], output: "RepairOrder", side_effects: ["status -> CANCELLED; no trial adjustment and no SLA credit"] }

  # ---------- WarrantyClaim ----------
  - { method: POST, path: "/warranty-claims", description: "File a loss, damage or defect claim", roles: [Patient, CareOpsAgent], code: 201, input: ["device_id", "claim_kind", "originating_repair_order_id?"], output: "WarrantyClaim", side_effects: ["status = FILED, denormalizes patient_id"] }
  - { method: GET, path: "/warranty-claims", description: "List claims; filters give reverse reachability for device_id, patient_id, originating_repair_order_id and replacement_device_id", roles: [Patient, RepairTechnician, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: ["device_id?", "patient_id?", "originating_repair_order_id?", "replacement_device_id?", "status?", "claim_kind?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/warranty-claims/{id}", description: "Read a claim with the deductible breakdown", roles: [Patient, RepairTechnician, CareOpsAgent, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "WarrantyClaim", side_effects: [] }
  - { method: POST, path: "/warranty-claims/{id}/triage", description: "Triage the claim and compute the deductible", roles: [RepairTechnician], code: 200, input: [], output: "WarrantyClaim", side_effects: ["status FILED -> TRIAGED, sets device_age_months / claim_ordinal / triaged_at", "runs calculations.warranty_deductible"] }
  - method: POST
    path: "/warranty-claims/{id}/decide"
    description: "Compliance decision: REPLACE, REPAIR or DENY (divergent branch side effects)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "denial_reason?"]
    output: "WarrantyClaim"
    side_effects:
      - "REPLACE: mints a replacement Device, sets replacement_device_id, old Device.status -> REPLACED or LOST, old Device.replaced_by_device_id set, pending rollouts on the old device -> CANCELLED_INELIGIBLE"
      - "REPAIR: creates a RepairOrder in KIT_REQUESTED; replacement_device_id stays null"
      - "DENY: sets denial_reason"
  - { method: POST, path: "/warranty-claims/{id}/pay-deductible", description: "Collect the claim deductible", roles: [Patient], code: 200, input: ["amount_cents"], output: "WarrantyClaim", side_effects: ["deductible_paid_cents += amount_cents"] }
  - { method: POST, path: "/warranty-claims/{id}/fulfill", description: "Fulfill an approved claim (branch join)", roles: [CareOpsAgent], code: 200, input: [], output: "WarrantyClaim", side_effects: ["status -> FULFILLED", "REPLACE branch: replacement Device.status -> WITH_PATIENT with the ORIGINAL warranty_expires_at (no extension)", "recomputes Device.loss_damage_claims_approved"] }
  - { method: POST, path: "/warranty-claims/{id}/withdraw", description: "Patient withdraws a filed claim", roles: [Patient], code: 200, input: [], output: "WarrantyClaim", side_effects: ["status FILED -> WITHDRAWN; does not count toward claim_ordinal"] }

  # ---------- ReimbursementClaim ----------
  - { method: POST, path: "/reimbursement-claims", description: "Draft an insurance/FSA reimbursement claim or an appeal", roles: [Patient, ReimbursementSpecialist], code: 201, input: ["patient_id", "subject_kind", "claimed_amount_cents", "device_order_id?", "repair_order_id?", "care_plan_subscription_id?", "appeal_of_claim_id?", "document_codes?", "insurance_benefit_cap_cents?", "insurance_benefit_used_cents?", "fsa_balance_cents?"], output: "ReimbursementClaim", side_effects: ["status = DRAFT, computes documentation_complete", "an appeal drives the appealed claim DENIED -> UNDER_REVIEW"] }
  - { method: GET, path: "/reimbursement-claims", description: "List claims; filters give reverse reachability for patient_id, all three polymorphic subject FKs and appeal_of_claim_id", roles: [Patient, ReimbursementSpecialist, ComplianceOfficer, PlatformAdmin], code: 200, input: ["patient_id?", "device_order_id?", "repair_order_id?", "care_plan_subscription_id?", "appeal_of_claim_id?", "status?", "subject_kind?", "limit?", "offset?"], output: "ReimbursementClaim[]", side_effects: [] }
  - { method: GET, path: "/reimbursement-claims/{id}", description: "Read a claim with the three allocation buckets", roles: [Patient, ReimbursementSpecialist, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: "ReimbursementClaim", side_effects: [] }
  - { method: POST, path: "/reimbursement-claims/{id}/submit", description: "Submit the claim and run the benefit waterfall", roles: [ReimbursementSpecialist], code: 200, input: [], output: "ReimbursementClaim", side_effects: ["status DRAFT -> SUBMITTED, sets submitted_by_user_id", "runs calculations.reimbursement_allocation writing eligible_amount_cents, insurance_paid_cents, fsa_paid_cents, patient_responsibility_cents"] }
  - { method: POST, path: "/reimbursement-claims/{id}/start-review", description: "Move the claim into review", roles: [ReimbursementSpecialist], code: 200, input: [], output: "ReimbursementClaim", side_effects: ["status SUBMITTED -> UNDER_REVIEW"] }
  - { method: POST, path: "/reimbursement-claims/{id}/request-info", description: "Request additional documentation", roles: [ReimbursementSpecialist], code: 200, input: ["requested_document_codes"], output: "ReimbursementClaim", side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED, increments info_request_count"] }
  - { method: POST, path: "/reimbursement-claims/{id}/supply-info", description: "Patient supplies the requested documentation", roles: [Patient], code: 200, input: ["document_codes", "insurance_benefit_used_cents?", "fsa_balance_cents?"], output: "ReimbursementClaim", side_effects: ["status INFO_REQUESTED -> SUBMITTED, merges document_codes", "re-runs calculations.reimbursement_allocation"] }
  - { method: POST, path: "/reimbursement-claims/{id}/decide", description: "Approve or deny under segregation of duties", roles: [ReimbursementSpecialist], code: 200, input: ["decision", "denial_reason?"], output: "ReimbursementClaim", side_effects: ["APPROVE: status -> APPROVED, sets approved_by_user_id", "DENY: status -> DENIED, zeroes the insurance/FSA buckets and moves the whole eligible amount to patient_responsibility_cents"] }
  - { method: POST, path: "/reimbursement-claims/{id}/pay", description: "Record payment on an approved claim", roles: [ReimbursementSpecialist], code: 200, input: [], output: "ReimbursementClaim", side_effects: ["status APPROVED -> PAID; the claim becomes immutable"] }
  - { method: POST, path: "/reimbursement-claims/{id}/void", description: "Compensating action: void a submitted or approved claim", roles: [ComplianceOfficer], code: 200, input: ["reason_note?"], output: "ReimbursementClaim", side_effects: ["status -> VOIDED, zeroes insurance_paid_cents and fsa_paid_cents and sets patient_responsibility_cents = eligible_amount_cents (benefit conservation preserved)"] }

  # ---------- CarePlanSubscription ----------
  - { method: POST, path: "/care-plan-subscriptions", description: "Enroll an order in a subscription care plan", roles: [Patient, CareOpsAgent], code: 201, input: ["patient_id", "device_order_id", "plan_tier", "base_fee_cents", "firmware_auto_update_enabled?"], output: "CarePlanSubscription", side_effects: ["status = TRIALING, cycle_ordinal = 0"] }
  - { method: GET, path: "/care-plan-subscriptions", description: "List plans; filters give reverse reachability for patient_id and device_order_id", roles: [Patient, CareOpsAgent, ReimbursementSpecialist, FirmwareEngineer, PlatformAdmin], code: 200, input: ["patient_id?", "device_order_id?", "status?", "plan_tier?", "limit?", "offset?"], output: "CarePlanSubscription[]", side_effects: [] }
  - { method: GET, path: "/care-plan-subscriptions/{id}", description: "Read a plan with charge breakdown, credit balance and version", roles: [Patient, CareOpsAgent, ReimbursementSpecialist, FirmwareEngineer, PlatformAdmin], code: 200, input: [], output: "CarePlanSubscription", side_effects: [] }
  - { method: POST, path: "/care-plan-subscriptions/{subscription_id}/change-tier", description: "Change plan tier mid-cycle (OCC guarded on the plan's version)", roles: [Patient], code: 200, input: ["plan_tier", "expected_subscription_version"], output: "CarePlanSubscription", side_effects: ["runs calculations.care_plan_cycle_charge for the prorated remainder", "increments version"] }
  - { method: POST, path: "/care-plan-subscriptions/{id}/run-billing-cycle", description: "Advance one billing cycle", roles: [PlatformAdmin], code: 200, input: ["charge_outcome", "pay_from_credit?"], output: "CarePlanSubscription", side_effects: ["runs calculations.care_plan_cycle_charge writing service_fee_cents, loyalty_discount_cents, last_charge_cents", "SUCCEEDED: consumes credit, increments cycle_ordinal, advances the cycle window", "DECLINED: status ACTIVE -> PAST_DUE with dunning_attempts = 1 and no cycle_ordinal advance"] }
  - { method: POST, path: "/care-plan-subscriptions/{id}/retry-payment", description: "Retry a past-due charge", roles: [Patient], code: 200, input: ["charge_outcome"], output: "CarePlanSubscription", side_effects: ["SUCCEEDED: PAST_DUE -> ACTIVE, cycle advances, dunning_attempts = 0", "DECLINED: increments dunning_attempts; the third failure forces SUSPENDED and cancels pending non-safety rollouts"] }
  - { method: POST, path: "/care-plan-subscriptions/{id}/reinstate", description: "Reinstate a suspended plan", roles: [CareOpsAgent], code: 200, input: [], output: "CarePlanSubscription", side_effects: ["status SUSPENDED -> ACTIVE, dunning_attempts = 0, cycle window re-based on the current logical clock"] }
  - { method: POST, path: "/care-plan-subscriptions/{id}/cancel", description: "Cancel the plan", roles: [Patient, CareOpsAgent], code: 200, input: ["reason_note?"], output: "CarePlanSubscription", side_effects: ["status -> CANCELLED, credit_balance_cents -> 0", "pending/offered FirmwareRollout rows on the plan's device -> CANCELLED_INELIGIBLE and campaign counters recomputed"] }

  # ---------- Firmware ----------
  - { method: POST, path: "/firmware-campaigns", description: "Draft a firmware update campaign", roles: [FirmwareEngineer], code: 201, input: ["campaign_code", "model", "from_version", "to_version", "window_start_utc", "window_end_utc", "batch_size?", "max_concurrent_installs?", "is_mandatory_safety?"], output: "FirmwareCampaign", side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/firmware-campaigns", description: "List campaigns with rollout counters", roles: [FirmwareEngineer, PlatformAdmin, CareOpsAgent], code: 200, input: ["model?", "status?", "limit?", "offset?"], output: "FirmwareCampaign[]", side_effects: [] }
  - { method: GET, path: "/firmware-campaigns/{id}", description: "Read a campaign with installed_count and failure_rate_pct", roles: [FirmwareEngineer, PlatformAdmin, CareOpsAgent], code: 200, input: [], output: "FirmwareCampaign", side_effects: [] }
  - { method: POST, path: "/firmware-campaigns/{id}/schedule", description: "Schedule the campaign window (closed-interval collision check)", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status DRAFT -> SCHEDULED after calculations.campaign_window_overlap passes"] }
  - { method: POST, path: "/firmware-campaigns/{id}/advance", description: "Select the next device batch", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status -> ROLLING", "runs calculations.firmware_cohort_selection creating up to batch_size FirmwareRollout rows in PENDING with selection_rank 1..N", "recomputes rollout_count"] }
  - { method: POST, path: "/firmware-campaigns/{id}/pause", description: "Pause the rollout", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status ROLLING -> PAUSED"] }
  - { method: POST, path: "/firmware-campaigns/{id}/resume", description: "Resume a paused rollout", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status PAUSED -> ROLLING when failure_rate_pct <= 25.0"] }
  - { method: POST, path: "/firmware-campaigns/{id}/complete", description: "Close a finished campaign", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status ROLLING -> COMPLETED, freezes counters"] }
  - { method: POST, path: "/firmware-campaigns/{id}/abort", description: "Abort a campaign and cancel unstarted rollouts", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareCampaign", side_effects: ["status -> ABORTED, PENDING/OFFERED rollouts -> CANCELLED_INELIGIBLE"] }
  - method: POST
    path: "/firmware-campaigns/{campaign_id}/manual-enrollments"
    description: "Manually enroll one device into a campaign (OCC guarded on the device's version)"
    roles: [FirmwareEngineer]
    code: 201
    input: ["device_id", "expected_device_version"]
    output: "FirmwareRollout"
    side_effects:
      - "creates a FirmwareRollout in PENDING with selection_rank = campaign.rollout_count + 1 and from_version_observed = device.firmware_version"
      - "increments Device.version by 1 and recomputes campaign.rollout_count"
  - { method: GET, path: "/firmware-campaigns/{id}/rollouts", description: "List a campaign's rollouts (reverse reachability for FirmwareRollout.firmware_campaign_id)", roles: [FirmwareEngineer, PlatformAdmin, CareOpsAgent], code: 200, input: ["status?", "limit?", "offset?"], output: "FirmwareRollout[]", side_effects: [] }
  - { method: GET, path: "/firmware-rollouts", description: "List rollouts; device_id filter gives reverse reachability for FirmwareRollout.device_id", roles: [Patient, FirmwareEngineer, PlatformAdmin, CareOpsAgent], code: 200, input: ["firmware_campaign_id?", "device_id?", "status?", "limit?", "offset?"], output: "FirmwareRollout[]", side_effects: [] }
  - { method: POST, path: "/firmware-rollouts/{id}/offer", description: "Offer the update to the subscriber", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareRollout", side_effects: ["status PENDING -> OFFERED"] }
  - { method: POST, path: "/firmware-rollouts/{id}/install", description: "Patient starts (or retries) the install", roles: [Patient], code: 200, input: [], output: "FirmwareRollout", side_effects: ["status OFFERED|FAILED -> INSTALLING, increments attempt_count"] }
  - { method: POST, path: "/firmware-rollouts/{id}/rollback", description: "Roll a failed install back to the observed version", roles: [FirmwareEngineer], code: 200, input: [], output: "FirmwareRollout", side_effects: ["status FAILED -> ROLLED_BACK, restores Device.firmware_version = from_version_observed", "creates a RepairOrder with fault_code = FIRMWARE_BRICK when the unit is unusable"] }

  # ---------- Test-driving endpoints (outside the public business surface) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "lazily expires ProviderReferral rows past expires_at, ReturnAuthorization rows past return_deadline_utc, and TrialPeriod rows past effective_end_utc on the next read or write touching them"
  - { method: POST, path: "/_payments/simulate", description: "Simulate the payment processor's response for an order authorization", roles: [PlatformAdmin], code: 200, input: ["device_order_id", "outcome"], output: "DeviceOrder", side_effects: ["payment_status PENDING_AUTH -> AUTHORIZED or -> AUTH_FAILED (which cancels fulfillment)"] }
  - { method: POST, path: "/_shipments/scan", description: "Inject a carrier scan event", roles: [PlatformAdmin], code: 200, input: ["device_order_id", "event"], output: "DeviceOrder", side_effects: ["DELIVERED: fulfillment_status SHIPPED -> DELIVERED, Device.status -> WITH_PATIENT, creates the TrialPeriod, activates a TRIALING care plan", "RETURN_PICKED_UP: fulfillment_status DELIVERED -> RETURN_IN_TRANSIT and ReturnAuthorization ISSUED -> IN_TRANSIT"] }
  - { method: POST, path: "/_firmware/report", description: "Inject the device's install telemetry", roles: [PlatformAdmin], code: 200, input: ["firmware_rollout_id", "outcome", "failure_code?"], output: "FirmwareRollout", side_effects: ["SUCCESS: status -> INSTALLED, Device.firmware_version = campaign.to_version, recomputes campaign counters", "FAILURE: status -> FAILED with failure_code; failure_rate_pct > 25.0 drives the campaign ROLLING -> PAUSED"] }

# =========================================================================
# 1.6 Error Catalog
# Every error_id referenced by §1.2.1 concurrency_rules, §1.3 calculations
# and §1.4 validations appears exactly once below.
# =========================================================================
errors:

  # ---- auth / identity (401, 403) ----
  - { error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401, message: "Both X-Role and X-User-ID headers are required", trigger: "either auth header absent or blank" }
  - { error_id: ERR_UNKNOWN_ROLE, http_status: 401, message: "X-Role is not a recognized role", trigger: "X-Role is outside the §1.7 role list" }
  - { error_id: ERR_IDENTITY_NOT_FOUND, http_status: 401, message: "X-User-ID does not resolve to an active identity for this role", trigger: "entity_backed role whose X-User-ID matches no Patient/Provider row, or the row is DEACTIVATED/INACTIVE" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, message: "Role is not permitted to perform this operation", trigger: "X-Role absent from the endpoint's roles list" }
  - { error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, message: "Caller does not own the target resource", trigger: "Patient acting on a resource whose patient_id differs from the caller's Patient id" }
  - { error_id: ERR_NOT_ASSIGNED_PROVIDER, http_status: 403, message: "Caller is not the provider assigned to this session or referral", trigger: "HearingProfessional or LicensedAudiologist acting on a session/referral whose provider_id differs from the caller" }
  - { error_id: ERR_PROVIDER_TYPE_NOT_PERMITTED, http_status: 403, message: "Provider type may not perform this clinical operation", trigger: "TELECARE_FITTER attempting a referral determination or a screening invalidation reserved for LICENSED_AUDIOLOGIST" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "The approving user may not be the submitting user", trigger: "reimbursement decide where approved_by_user_id would equal submitted_by_user_id, or compliance-override approve by the filing officer" }
  - { error_id: ERR_PROVIDER_CONFLICT_OF_INTEREST, http_status: 403, message: "Provider is excluded from this patient's referral by conflict of interest", trigger: "referral determination or referral-evaluation booking with the provider who invalidated the triggering screening" }

  # ---- existence (404) ----
  - { error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, message: "Target resource does not exist", trigger: "path id matches no row" }
  - { error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, message: "Referenced entity does not exist", trigger: "any body FK (state_policy_id, provider_id, device_id, device_order_id, subject FKs, appeal_of_claim_id, firmware_rollout_id, ...) matches no row" }
  - { error_id: ERR_INVENTORY_POOL_NOT_FOUND, http_status: 404, message: "No inventory pool exists for the requested model, dome size and tip type", trigger: "order fit confirmation or fit exchange whose (model, dome_size, tip_type) triple has no InventoryPool row" }

  # ---- request shape (400, 422, 409) ----
  - { error_id: ERR_INVALID_PAGINATION, http_status: 400, message: "limit must be between 1 and 100 and offset must be at least 0", trigger: "limit < 1, limit > 100 or offset < 0 on any list endpoint" }
  - { error_id: ERR_VALIDATION, http_status: 422, message: "Request body failed field validation", trigger: "missing required field, wrong type, negative money or day count, or scheduled_end_utc not after scheduled_start_utc" }
  - { error_id: ERR_INVALID_ENUM_VALUE, http_status: 422, message: "Field value is outside the allowed enumeration", trigger: "any enum-typed input (restocking_fee_mode, provider_type, session_type, claim_kind, subject_kind, inspection_grade, plan_tier, fault_code, decision, outcome, event) outside its declared value set" }
  - { error_id: ERR_DUPLICATE_KEY, http_status: 409, message: "A record with this natural key already exists", trigger: "duplicate StatePolicy.state_code, Provider.npi, Device.serial_number, InventoryPool.sku, ReturnAuthorization.rma_code or FirmwareCampaign.campaign_code" }
  - { error_id: ERR_STATE_POLICY_RETIRED, http_status: 409, message: "The referenced state policy is retired", trigger: "patient registration or order placement against a StatePolicy with is_retired = true" }

  # ---- optimistic concurrency (412) ----
  - { error_id: ERR_STALE_TRIAL_VERSION, http_status: 412, message: "expected_trial_period_version does not match the trial period's current version", trigger: "return-authorization creation carrying a version older than TrialPeriod.version" }
  - { error_id: ERR_STALE_ORDER_VERSION, http_status: 412, message: "expected_device_order_version does not match the order's current version", trigger: "fit-exchange creation carrying a version older than DeviceOrder.version" }
  - { error_id: ERR_STALE_SUBSCRIPTION_VERSION, http_status: 412, message: "expected_subscription_version does not match the subscription's current version", trigger: "tier change carrying a version older than CarePlanSubscription.version" }
  - { error_id: ERR_STALE_DEVICE_VERSION, http_status: 412, message: "expected_device_version does not match the device's current version", trigger: "manual firmware enrollment carrying a version older than Device.version" }

  # ---- state (409) ----
  - { error_id: ERR_INVALID_STATE, http_status: 409, message: "The resource's current state does not allow this transition", trigger: "any transition attempted from a state absent from the §1.2 from list" }
  - { error_id: ERR_ALREADY_TERMINAL, http_status: 409, message: "The resource has reached a terminal state and can no longer be modified", trigger: "mutation of a PAID/VOIDED reimbursement claim, RETURN_SETTLED trial, FULFILLED warranty claim, COMPLETED/ABORTED campaign or INSTALLED/ROLLED_BACK rollout" }
  - { error_id: ERR_DEPENDENT_STATE_NOT_READY, http_status: 409, message: "A dependent record is not in a state that permits this operation", trigger: "cross-entity gate unmet: shipping before payment AUTHORIZED, fulfilling a warranty claim before its decision, settling a return before inspection, installing firmware while the campaign is not ROLLING, or a fitting session whose device order is not DELIVERED" }

  # ---- business_safety / regulatory (409, 422) ----
  - { error_id: ERR_OTC_SALES_PROHIBITED_IN_STATE, http_status: 422, message: "Over-the-counter device sales are not permitted in the patient's state", trigger: "order placement where the pinned StatePolicy.otc_sales_permitted is false" }
  - { error_id: ERR_AGE_BELOW_STATE_MINIMUM, http_status: 422, message: "Patient age is below the state minimum for over-the-counter devices", trigger: "order placement where Patient.age_years < StatePolicy.min_age_years" }
  - { error_id: ERR_PATIENT_MEDICALLY_DISQUALIFIED, http_status: 409, message: "Patient is medically disqualified from over-the-counter devices", trigger: "any order, fitting-session or care-plan action while Patient.status = MEDICALLY_DISQUALIFIED and no APPROVED ComplianceOverride exists" }
  - { error_id: ERR_MANDATORY_REFERRAL_OPEN, http_status: 409, message: "An unresolved mandatory referral blocks this action", trigger: "order placement, shipment or INITIAL_FIT booking while Patient.open_mandatory_flag_count > 0" }
  - { error_id: ERR_WAIVER_NOT_ACKNOWLEDGED, http_status: 422, message: "The state requires an acknowledged medical-evaluation waiver", trigger: "order placement where StatePolicy.waiver_required is true and Patient.waiver_acknowledged_at is null" }
  - { error_id: ERR_TELEHEALTH_NOT_PERMITTED_IN_STATE, http_status: 422, message: "Remote fitting is not permitted in the patient's state", trigger: "fitting-session booking where StatePolicy.telehealth_fitting_permitted is false" }
  - { error_id: ERR_PROVIDER_NOT_LICENSED_IN_STATE, http_status: 422, message: "Provider is not licensed in the patient's state", trigger: "booking or referral assignment where Patient.state_code is absent from Provider.licensed_state_codes" }
  - { error_id: ERR_REFERRAL_EXPIRED, http_status: 409, message: "The referral has expired and must be reissued", trigger: "determination or booking on a referral whose expires_at is at or before the logical clock" }
  - { error_id: ERR_AUTO_UPDATE_NOT_CONSENTED, http_status: 422, message: "The subscriber has not consented to firmware auto-updates", trigger: "non-safety firmware offer or install where CarePlanSubscription.firmware_auto_update_enabled is false" }

  # ---- business_temporal (409) ----
  - { error_id: ERR_TRIAL_WINDOW_CLOSED, http_status: 409, message: "The trial window has closed", trigger: "return-authorization creation or trial extension where the logical clock is after TrialPeriod.effective_end_utc" }
  - { error_id: ERR_RETURN_DEADLINE_PASSED, http_status: 409, message: "The return shipment deadline has passed", trigger: "receiving or settling an authorization whose return_deadline_utc is before the logical clock" }
  - { error_id: ERR_SESSION_WINDOW_NOT_OPEN, http_status: 409, message: "The session window is not currently open", trigger: "start before scheduled_start_utc or at/after scheduled_end_utc, no-show before scheduled_end_utc, or cancel at/after scheduled_start_utc" }
  - { error_id: ERR_PROVIDER_SLOT_CONFLICT, http_status: 409, message: "The requested slot conflicts with the provider's existing booking including buffer", trigger: "calculations.fitting_slot_overlap returns a conflict under half-open, symmetric-buffer semantics" }
  - { error_id: ERR_CAMPAIGN_WINDOW_CONFLICT, http_status: 409, message: "Another campaign for this model already occupies the requested window", trigger: "calculations.campaign_window_overlap returns a conflict under closed-interval semantics, including touching endpoints" }
  - { error_id: ERR_PAUSE_INTERVAL_OVERLAP, http_status: 409, message: "The new pause interval overlaps an existing trial pause", trigger: "calculations.trial_pause_interval_overlap returns a conflict; touching endpoints are accepted" }

  # ---- business_constraint (409, 422) ----
  - { error_id: ERR_REPAIR_IN_PROGRESS_BLOCKS_RETURN, http_status: 409, message: "An open repair order must be closed before a return can be authorized", trigger: "return-authorization creation while a RepairOrder for the device is in KIT_SENT, RECEIVED, IN_REPAIR or REPAIRED" }
  - { error_id: ERR_EXCHANGE_IN_PROGRESS_BLOCKS_RETURN, http_status: 409, message: "An open fit exchange must be completed or cancelled before a return can be authorized", trigger: "return-authorization creation while a FitExchange on the order is RESERVED or SHIPPED" }
  - { error_id: ERR_SAME_FIT_CONFIGURATION, http_status: 422, message: "The requested dome size and tip type match the current configuration", trigger: "fit-exchange creation where to_dome_size and to_tip_type equal the order's current pair" }
  - { error_id: ERR_SUBJECT_KIND_MISMATCH, http_status: 422, message: "subject_kind does not agree with the supplied subject reference", trigger: "reimbursement claim where the FK matching subject_kind is null, or another subject FK is populated" }
  - { error_id: ERR_DUPLICATE_REIMBURSEMENT_SUBJECT, http_status: 409, message: "A non-terminal reimbursement claim already exists for this subject", trigger: "second claim on the same (subject_kind, subject id) while the first is not DENIED or VOIDED" }
  - { error_id: ERR_DOCUMENTATION_INCOMPLETE, http_status: 422, message: "Required reimbursement documents are missing for this subject kind", trigger: "submit where document_codes lacks a code required for the subject kind" }
  - { error_id: ERR_APPEAL_ALREADY_EXISTS, http_status: 409, message: "The claim already has an appeal", trigger: "second claim carrying the same appeal_of_claim_id" }
  - { error_id: ERR_INFO_REQUEST_LIMIT_REACHED, http_status: 409, message: "The information-request limit for this claim has been reached", trigger: "request-info where info_request_count is already 3" }
  - { error_id: ERR_MAX_RESCHEDULES_EXCEEDED, http_status: 409, message: "The referral has reached its reschedule limit", trigger: "referral-evaluation booking where ProviderReferral.reschedule_count is already 3" }
  - { error_id: ERR_FIRMWARE_VERSION_DRIFT, http_status: 409, message: "The device firmware no longer matches the campaign's from_version", trigger: "offer or install where Device.firmware_version differs from FirmwareRollout.from_version_observed or the campaign's from_version" }
  - { error_id: ERR_CLAIM_CAP_REACHED, http_status: 409, message: "The state's loss-and-damage claim cap has been reached for this device", trigger: "LOSS or DAMAGE claim where Device.loss_damage_claims_approved is already StatePolicy.max_loss_damage_claims" }
  - { error_id: ERR_WARRANTY_EXPIRED, http_status: 409, message: "The device warranty has expired", trigger: "warranty claim filing where Device.warranty_expires_at is at or before the logical clock" }
  - { error_id: ERR_CLAIM_AMOUNT_EXCEEDS_ELIGIBLE, http_status: 422, message: "Claimed amount exceeds the eligible amount for this subject kind", trigger: "claimed_amount_cents above the subject's eligible ceiling (repair cap 50000, 12 care-plan cycles, or the order's non-refunded captured amount)" }

  # ---- capacity (409) ----
  - { error_id: ERR_PROVIDER_CAPACITY_EXCEEDED, http_status: 409, message: "Booking would exceed the provider's daily capacity", trigger: "calculations.provider_daily_capacity shows booked plus requested minutes above daily_capacity_minutes; exact equality is accepted" }
  - { error_id: ERR_POOL_DISCONTINUED, http_status: 409, message: "The target inventory pool is discontinued", trigger: "fit confirmation or fit exchange against a pool with is_discontinued = true" }
  - { error_id: ERR_INVENTORY_POOL_DEPLETED, http_status: 409, message: "The target inventory pool has no available units", trigger: "reservation where on_hand_units is 0 and allow_backorder is not true" }
  - { error_id: ERR_PAUSE_BUDGET_EXHAUSTED, http_status: 409, message: "The trial's aggregate pause budget is exhausted", trigger: "new pause where paused_days is already at the 60-day budget" }
  - { error_id: ERR_MAX_CONCURRENT_INSTALLS_REACHED, http_status: 409, message: "The campaign's concurrent-install ceiling has been reached", trigger: "install where the campaign's INSTALLING rollout count equals max_concurrent_installs" }
  - { error_id: ERR_INSTALL_ATTEMPTS_EXHAUSTED, http_status: 409, message: "The rollout has exhausted its install attempts", trigger: "install retry where attempt_count is already 3" }
  - { error_id: ERR_NO_ELIGIBLE_DEVICES, http_status: 409, message: "No eligible device remains for this campaign batch", trigger: "calculations.firmware_cohort_selection yields an empty eligible pool" }
  - { error_id: ERR_NO_ELIGIBLE_PROVIDER, http_status: 409, message: "No eligible provider is available for this referral", trigger: "calculations.referral_provider_selection yields an empty eligible pool" }

  # ---- business_fiscal (402, 409) ----
  - { error_id: ERR_DEDUCTIBLE_UNPAID, http_status: 402, message: "The claim deductible has not been paid in full", trigger: "warranty fulfillment where deductible_paid_cents is below deductible_cents" }
  - { error_id: ERR_PAYMENT_DECLINED, http_status: 402, message: "The payment attempt was declined", trigger: "order authorization, billing cycle or retry whose charge_outcome is DECLINED" }
  - { error_id: ERR_DUNNING_LIMIT_REACHED, http_status: 409, message: "The subscription has exhausted its dunning attempts", trigger: "retry-payment where dunning_attempts is already 3" }
  - { error_id: ERR_CREDIT_BALANCE_INSUFFICIENT, http_status: 402, message: "Plan credit balance is insufficient to cover the requested charge", trigger: "pay_from_credit is true and credit_balance_cents is below the computed charge" }
  - { error_id: ERR_RESTOCKING_WAIVE_WINDOW_CLOSED, http_status: 409, message: "The restocking waiver window has closed", trigger: "waive-restocking more than 30 days after the authorization was settled" }

# =========================================================================
# 1.7 RBAC Matrix
# Two entity-backed roles are resolved from X-User-ID; the rest are opaque
# operator identities. Segregation of duties is enforced between the
# submitting and approving user of the same opaque role.
# =========================================================================
roles:

  - role: Patient
    identity: "entity_backed:Patient"
    description: "The consumer. Resolved from X-User-ID to a Patient row; may only touch resources whose patient_id equals that row."
    exclusive_operations:
      - "POST /patients/{id}/acknowledge-waiver"
      - "POST /patients/{patient_id}/screening-sessions"
      - "PATCH /screening-sessions/{id}"
      - "POST /screening-sessions/{id}/submit"
      - "POST /remote-fitting-sessions"
      - "POST /remote-fitting-sessions/{id}/rebook"
      - "POST /trial-periods/{trial_period_id}/return-authorizations"
      - "POST /device-orders/{device_order_id}/fit-exchanges"
      - "POST /fit-exchanges/{id}/confirm"
      - "POST /warranty-claims/{id}/pay-deductible"
      - "POST /warranty-claims/{id}/withdraw"
      - "POST /reimbursement-claims/{id}/supply-info"
      - "POST /care-plan-subscriptions/{subscription_id}/change-tier"
      - "POST /care-plan-subscriptions/{id}/retry-payment"
      - "POST /firmware-rollouts/{id}/install"
    shared_operations:
      - "POST /patients/{patient_id}/device-orders (with CareOpsAgent)"
      - "POST /repair-orders, POST /repair-orders/{id}/cancel (with CareOpsAgent)"
      - "POST /warranty-claims (with CareOpsAgent)"
      - "POST /reimbursement-claims (with ReimbursementSpecialist)"
      - "POST /care-plan-subscriptions, POST /care-plan-subscriptions/{id}/cancel (with CareOpsAgent)"
      - "POST /remote-fitting-sessions/{id}/cancel, POST /fit-exchanges/{id}/cancel (with CareOpsAgent)"
      - "PATCH /patients/{id} (with CareOpsAgent)"
      - "own-scope reads of patients, screenings, findings, referrals, sessions, orders, devices, trials, authorizations, exchanges, repairs, claims, plans, rollouts, providers, inventory pools"

  - role: HearingProfessional
    identity: "entity_backed:Provider"
    description: "TELECARE_FITTER provider. Runs remote programming sessions only; may not clear red flags or invalidate screenings."
    exclusive_operations: []
    shared_operations:
      - "POST /remote-fitting-sessions/{id}/start|complete|no-show (with LicensedAudiologist, restricted to sessions whose provider_id is the caller)"
      - "reads of assigned sessions, their patients, and provider records"

  - role: LicensedAudiologist
    identity: "entity_backed:Provider"
    description: "LICENSED_AUDIOLOGIST provider. The only role that may clinically clear a red-flag referral or invalidate a screening."
    exclusive_operations:
      - "POST /screening-sessions/{id}/invalidate"
      - "POST /provider-referrals/{id}/determination"
    shared_operations:
      - "POST /remote-fitting-sessions/{id}/start|complete|no-show (with HearingProfessional, restricted to assigned sessions)"
      - "reads of assigned sessions and referrals, their patients' screenings and findings"

  - role: CareOpsAgent
    identity: opaque
    description: "Fulfillment and customer-care operator. Drives orders, shipments, returns, exchanges and trial goodwill; may not clear referrals, decide warranty claims or waive restocking."
    exclusive_operations:
      - "POST /patients"
      - "POST /device-orders/{id}/confirm-fit|ship|cancel"
      - "POST /trial-periods/{id}/extend"
      - "POST /return-authorizations/{id}/receive|inspect|settle|void"
      - "POST /fit-exchanges/{id}/ship"
      - "POST /repair-orders/{id}/send-kit"
      - "POST /warranty-claims/{id}/fulfill"
      - "POST /care-plan-subscriptions/{id}/reinstate"
    shared_operations:
      - "POST /patients/{patient_id}/device-orders, PATCH /patients/{id} (with Patient)"
      - "POST /repair-orders, POST /repair-orders/{id}/cancel, POST /warranty-claims (with Patient)"
      - "POST /remote-fitting-sessions/{id}/cancel, POST /fit-exchanges/{id}/cancel (with Patient)"
      - "POST /care-plan-subscriptions, POST /care-plan-subscriptions/{id}/cancel (with Patient)"
      - "cross-patient reads of patients, orders, devices, trials, authorizations, exchanges, repairs, warranty claims, plans, campaigns, rollouts, inventory pools, policies"

  - role: ReimbursementSpecialist
    identity: opaque
    description: "Insurance and FSA back office. Runs the claim lifecycle; the approving user must differ from the submitting user."
    exclusive_operations:
      - "POST /reimbursement-claims/{id}/submit"
      - "POST /reimbursement-claims/{id}/start-review"
      - "POST /reimbursement-claims/{id}/request-info"
      - "POST /reimbursement-claims/{id}/decide"
      - "POST /reimbursement-claims/{id}/pay"
    shared_operations:
      - "POST /reimbursement-claims (with Patient)"
      - "reads of reimbursement claims, patients, orders, repairs, plans, return authorizations"

  - role: RepairTechnician
    identity: opaque
    description: "Depot technician. Owns the repair bench workflow and warranty triage; may not decide claims."
    exclusive_operations:
      - "POST /repair-orders/{id}/receive|start|resolve|return-to-patient|escalate"
      - "POST /warranty-claims/{id}/triage"
    shared_operations:
      - "reads of repair orders, warranty claims, devices"

  - role: FirmwareEngineer
    identity: opaque
    description: "Owns firmware campaigns and rollout mechanics."
    exclusive_operations:
      - "POST /firmware-campaigns"
      - "POST /firmware-campaigns/{id}/schedule|advance|pause|resume|complete|abort"
      - "POST /firmware-campaigns/{campaign_id}/manual-enrollments"
      - "POST /firmware-rollouts/{id}/offer"
      - "POST /firmware-rollouts/{id}/rollback"
    shared_operations:
      - "reads of campaigns, rollouts, devices, care plans"

  - role: ComplianceOfficer
    identity: opaque
    description: "Regulatory oversight. Files and approves medical-disqualification overrides (two distinct officers required), decides warranty claims, waives restocking and voids reimbursement claims."
    exclusive_operations:
      - "POST /patients/{patient_id}/compliance-overrides"
      - "POST /patients/{patient_id}/compliance-overrides/{override_id}/approve"
      - "POST /patients/{patient_id}/compliance-overrides/{override_id}/reject"
      - "POST /provider-referrals/{id}/withdraw"
      - "POST /return-authorizations/{id}/waive-restocking"
      - "POST /warranty-claims/{id}/decide"
      - "POST /reimbursement-claims/{id}/void"
    shared_operations:
      - "cross-patient reads of patients, screenings, findings, referrals, orders, trials, authorizations, warranty claims, reimbursement claims, policies, overrides"

  - role: PlatformAdmin
    identity: opaque
    description: "Platform operator. Owns reference data, deactivation, billing cycle execution and the test-driving endpoints."
    exclusive_operations:
      - "POST /state-policies, PATCH /state-policies/{id}, DELETE /state-policies/{id}"
      - "POST /providers, PATCH /providers/{id}"
      - "POST /devices"
      - "POST /inventory-pools, POST /inventory-pools/{id}/restock, DELETE /inventory-pools/{id}"
      - "DELETE /patients/{id}"
      - "POST /care-plan-subscriptions/{id}/run-billing-cycle"
      - "POST /_clock/set_current_utc"
      - "POST /_payments/simulate"
      - "POST /_shipments/scan"
      - "POST /_firmware/report"
    shared_operations:
      - "read access to every list and detail endpoint in §1.5"




