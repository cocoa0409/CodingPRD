  # ==========================================================================
  # Section: excluded stubs — covered by §1.8 difficulty instances
  # ==========================================================================
  - section: state_machines
    instances:
      - name: error_order_cancel_from_confirmed_releases_resources
        claim_type: side_effect_execution
        grounds:
          - state_machines.CharterOrder.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_refund_conserves_deposit_total
          rationale: "The cancel-from-CONFIRMED path including fee computation and refund is asserted in the difficulty instance."

      - name: error_hos_violation_on_assign
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HOS_VIOLATION]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / driver_hos_accumulation_overlap
          rationale: "HOS feasibility as a gating constraint on assignment is covered by the difficulty instance."

      - name: error_breakdown_compensation_capped_at_deposit
        claim_type: correct_result
        grounds:
          - calculations.calc_breakdown_compensation
        excluded_because:
          difficulty_instance: compensating_invariant / breakdown_compensation_conserves_invoice_integrity
          rationale: "The compensation cap and its effect on order financials is asserted in the difficulty instance."
