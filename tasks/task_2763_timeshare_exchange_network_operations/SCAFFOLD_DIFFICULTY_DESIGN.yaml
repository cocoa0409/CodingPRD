      - name: dispute_info_request_review_cycle_round_cap
        entity: Dispute
        cycle: "UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, capped at MAX_DISPUTE_ROUNDS = 2"
        why_hard: >-
          The cycle is legal twice and illegal the third time, and the state after the second
          traversal (UNDER_REVIEW with round_count 2) looks identical to the state after the first
          except for one counter. An implementation that stores only the status, or that increments
          round_count on the member's response rather than on the analyst's request, will either
          allow a third round or block the second.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with a GOLD band, affiliated at the default clock. Member M1 on PLUS,
            dues-paid, banks a ONE_BR week for 2027-06-15 worth 82 and files a TRADING_POWER dispute
            about it. The analyst opens review, then runs the information-request cycle to its cap of
            two rounds, leaving the dispute UNDER_REVIEW with round_count 2.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
