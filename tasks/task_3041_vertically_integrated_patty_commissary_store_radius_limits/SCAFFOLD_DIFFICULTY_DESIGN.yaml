# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3041_vertically_integrated_patty_commissary_store_radius_limits
#
# Depth probe: 9 Difficulty Rules × 2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB state via §1.5 endpoints only.
# Shared setup anchor facts (all chains construct these from empty DB):
#   - Clock starts at the server default 2026-09-01T00:00:00Z (a Tuesday) unless
#     a chain sets it explicitly.
#   - 2026-09-01 is a Tuesday; 2026-09-04 is a Friday; 2026-09-07 is a Monday.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_modifier_charge_provisional_equals_final
        grounds:
          - calculations.modifier_proration
          - entities.Order.fields.modifier_charge_cents
        distinguishing_aspect: "Two valid algorithms on the ORDER domain (provisional quote at request time vs final charged at commit) that must agree exactly for the same payload; the sibling instance operates on the SUPPLIER domain, not on orders."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "OPEN store S with on-hand inventory covering 4 patties / 2 buns / 4 produce units."
            - "MenuItem DBL-DBL (base 495 cents, 2 patties, 2 produce units)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-DV1", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "Baldwin Park", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id, com_v: $.data.version }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { com_v2: $.data.version }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Store DV1", lat: 34.01, lng: -118.01, expected_commissary_version: "${com_v2}" }
              as: RealEstatePlanner
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /v1/associates"
              payload: { full_name: "Mgr One", hired_date: "2024-01-01T00:00:00Z", home_store_id: "${store_id}" }
              as: HRDirector
              captures: { mgr_id: $.data.id }
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/stores/${store_id}/shifts"
              payload: { associate_id: "${mgr_id}", shift_start: "2026-09-01T16:00:00Z", shift_end: "2026-09-02T00:00:00Z" }
              as: HRDirector
            - call: "POST /v1/stores/${store_id}/shifts"
              payload: { associate_id: "${mgr_id}", shift_start: "2026-09-02T16:00:00Z", shift_end: "2026-09-03T00:00:00Z" }
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/manager-postings"
              payload: { store_id: "${store_id}" }
              as: HRDirector
              as_user_id: "hr-poster-1"
              captures: { posting_id: $.data.id }
            - call: "POST /v1/manager-postings/${posting_id}/applications"
              payload: { candidate_associate_id: "${mgr_id}" }
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/manager-postings/${posting_id}/close"
              payload: { candidate_application_id: "${app_id}" }
              as: HRDirector
              as_user_id: "hr-closer-1"
            - call: "POST /v1/stores/${store_id}/approve"
              payload: {}
              as: RealEstatePlanner
            - call: "POST /v1/stores/${store_id}/open"
              payload: {}
              as: RealEstatePlanner
              captures: { store_v_open: $.data.version }
            - call: "POST /v1/menu-items"
              payload: { sku: "DBL-DBL", name: "Double-Double", base_price_cents: 495, patty_count: 2, produce_units: 2 }
              as: SupplyChainDirector
              captures: { item_id: $.data.id }
            - call: "POST /v1/batches"
              payload: { store_id: "${store_id}", delivery_date: "2026-09-02T00:00:00Z", patty_count: 100, bun_count: 60, produce_units: 60, expected_store_version: "${store_v_open}" }
              as: CommissaryPlanner
              captures: { batch_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/production-runs"
              payload: { run_date: "2026-09-01T00:00:00Z", patties_planned: 100, buns_planned: 60, produce_units_planned: 60 }
              as: CommissaryPlanner
              captures: { run_id: $.data.id }
            - call: "POST /v1/production-runs/${run_id}/complete"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/commissaries/${com_id}/trucks"
              payload: { plate: "TRK-DV1", route_type: "PRIMARY", cooler_capacity_cases: 30 }
              as: CommissaryPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { commissary_id: "${com_id}", truck_id: "${truck_id}", service_date: "2026-09-02T00:00:00Z", store_ids: ["${store_id}"] }
              as: CommissaryPlanner
              captures: { route_id: $.data.id }
            - call: "POST /v1/batches/${batch_id}/load"
              payload: { production_run_id: "${run_id}", route_id: "${route_id}" }
              as: CommissaryPlanner
            - call: "POST /v1/routes/${route_id}/finalize"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/batches/${batch_id}/deliver"
              payload: {}
              as: CommissaryPlanner
          trigger:
            - call: "POST /v1/stores/${store_id}/orders"
              payload: { placed_by_associate_id: "${mgr_id}", lines: [{ menu_item_id: "${item_id}", qty: 2, modifier_codes: ["EXTRA_PATTY", "ANIMAL_STYLE", "WELL_DONE"] }] }
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.base_total_cents == 990"
            - "Order.${order_id}.modifier_charge_cents == 599 (provisional quote equals final charged: units = 2*(1+1) = 4; pre-discount = 4*150 + 65 = 665; WELL_DONE applies: round_half_up(665*0.90) = round_half_up(598.5) = 599)"
            - "Order.${order_id}.total_price_cents == 1589"
            - "Order.${order_id}.patties_reserved == 8"
      - name: supplier_eligibility_audit_freshness_dual_variant
        grounds:
          - calculations.stale_audit_suspension_check
          - entities.BeefSupplier.fields.days_since_last_passed_audit
        distinguishing_aspect: "Two valid readings of supplier freshness on the SUPPLIER domain (status-flag APPROVED vs stale-audit day count) that diverge for the same supplier; the sibling instance operates on the ORDER domain, not on suppliers."
        test_recipe:
          setup:
            - "Supplier SUP is APPROVED (status variant says eligible) with audit_frequency_days 30."
            - "The logical clock is advanced 45 days past the last PASS audit (stale variant says ineligible)."
            - "A beef delivery for the commissary that SUP serves is IN_TRANSIT."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-DV2", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup2_id: $.data.id }
            - call: "POST /v1/suppliers/${sup2_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud2_id: $.data.id }
            - call: "POST /v1/suppliers/${sup2_id}/audits/${aud2_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "DV2 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 50000, daily_bun_capacity: 30000, daily_produce_capacity: 20000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup2_id}" }
              as: SupplyChainDirector
              captures: { com2_id: $.data.id }
            - call: "POST /v1/beef-deliveries"
              payload: { commissary_id: "${com2_id}", supplier_id: "${sup2_id}", shipped_at: "2026-09-01T06:00:00Z", raw_beef_lbs: 1000, transit_temp_celsius: 2.0 }
              as: CommissaryPlanner
              captures: { bd2_id: $.data.id }
            - call: "POST /v1/beef-deliveries/${bd2_id}/ship"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: SupplyChainDirector
          trigger:
            - call: "POST /v1/beef-deliveries/${bd2_id}/confirm-receiving"
              payload: {}
              as: CommissaryPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_id} == ERR_SUPPLIER_AUDIT_STALE"
            - "BeefSupplier.${sup2_id}.status == APPROVED (status variant) yet days_since_last_passed_audit == 45 > 30 (stale variant) — the variants disagree and the stale variant wins"
            - "BeefDelivery.${bd2_id}.status == IN_TRANSIT (no inventory credited)"

