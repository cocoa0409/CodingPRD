              captures: { c_id: $.data.id }
            - call: "POST /policy-layers"
              payload: { program_year: 2026, layer_index: 1, layer_type: "SIR", attachment_point_cents: 0, limit_cents: 10000000, insurer_name: "Self-Insured Retention" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { pl_sir_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-31", adjuster_note: "property damage only" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
