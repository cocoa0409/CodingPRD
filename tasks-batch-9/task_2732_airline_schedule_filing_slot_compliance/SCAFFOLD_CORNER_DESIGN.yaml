            - call: "GET /slot-holdings/${sh_id}"
              payload: {}
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "GET /slot-holdings"
              payload: { season_id: "${season_id}", at_risk_of_loss: true, limit: 10, offset: 0 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "GET /schedule-versions/${sv_id}"
              payload: {}
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "GET /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", limit: 10, offset: 0 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "the attach response itself (HTTP 200) already reports the post-write holding state: attached_operations == 1 and utilization_pct_as_filed == 20.00"
            - "the detail read of the holding returns exactly the same numbers, with credited_operations == 0, utilization_pct == 0.00 and at_risk_of_loss == true"
            - "the filtered list (at_risk_of_loss true) has total_count == 1 and its data[0] is field-for-field equal to the detail read — no counter differs between the two projections"
            - "the version detail read shows leg_count == 1, unslotted_leg_count == 0, at_risk_slot_count == 1, schedule_compliance_score == 85.00, compliance_state == \"BLOCKED\", and the list projection reports the identical five values"
            - "no read had to be repeated to see the write: the first read after the write is already correct"

      - name: no_read_anywhere_in_the_subtree_is_stale_after_a_cascade
        claim_type: no_stale_reads
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / retiming_a_filed_leg_cascades_five_levels_to_filing_submission_rejection
          rationale: "That instance asserts the post-cascade value of every touched row — leg, holding, version counters, compliance state and submission — from reads taken straight after the single PATCH, which is exactly the no-stale-reads guarantee."
