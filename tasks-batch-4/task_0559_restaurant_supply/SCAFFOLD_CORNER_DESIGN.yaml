        claim_type: ownership
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_ACCOUNT_OWNER]
        distinguishing_aspect: "A Buyer whose X-User-ID is account2 confirming an order owned by account1 is denied with ERR_NOT_ACCOUNT_OWNER."
        test_recipe:
          setup: ["Two accounts; a DRAFT order with a line under account1."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Owner1", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct1_id: $.data.id }
            - call: "POST /accounts"
