  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: wave_same_carrier_buffer_gap
        grounds:
          - validations[priority=6]
          - entities.ShippingWave.fields.pickup_start
          - entities.ShippingWave.fields.pickup_end
          - errors[ERR_WAVE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics plus a 30-minute buffer on the carrier
          resource: touching windows (gap 0) and a 15-minute gap are rejected,
          a gap of exactly 30 minutes passes, and full overlap is allowed for a
          DIFFERENT carrier. Resource entity ShippingWave, endpoint POST
          /shipping-waves.
        test_recipe:
          setup:
            - "wave WV-TO1 exists: USPS GROUND 2026-05-10T10:00:00Z to 2026-05-10T12:00:00Z SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T12:00:00Z" }
              as: WarehouseOps
              captures: { to1_wv: $.data.id }
          trigger:
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T12:15:00Z", pickup_end: "2026-05-10T13:00:00Z" }
              as: WarehouseOps
              captures: { to1_err: $.data.error_id }
            - call: "POST /shipping-waves"
              payload: { carrier: "FEDEX", service_level: "GROUND", pickup_start: "2026-05-10T11:00:00Z", pickup_end: "2026-05-10T11:30:00Z" }
              as: WarehouseOps
              captures: { to1_wv_fedex: $.data.id, to1_fedex_status: $.data.status }
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "EXPRESS", pickup_start: "2026-05-10T12:30:00Z", pickup_end: "2026-05-10T13:30:00Z" }
              as: WarehouseOps
              captures: { to1_wv_ok: $.data.id, to1_ok_status: $.data.status }
          assert:
            - "USPS wave starting 12:15 (gap 15 min < 30) rejected with ERR_WAVE_WINDOW_CONFLICT (${to1_err})"
            - "FEDEX wave 11:00-11:30 fully inside the USPS window is accepted (${to1_fedex_status} == SCHEDULED) — the resource is the carrier"
            - "USPS wave starting 12:30 (gap exactly 30 min) is accepted (${to1_ok_status} == SCHEDULED) — buffer boundary is inclusive-pass"

      - name: run_period_slot_uniqueness
        grounds:
          - errors[ERR_RUN_PERIOD_CONFLICT]
          - entities.AssemblyRun.fields.period
          - validations[priority=5]
        distinguishing_aspect: |
          Discrete monthly-slot semantics on the BoxPlan resource (no interval
          geometry, no buffer, no adjacency): the same (plan, period) pair
          collides while a different month or a different plan does not.
          Different interval semantics and different resource/endpoint than the
          wave-window instance.
        test_recipe:
          setup:
            - "client TO2 wallet 100000; component CMP-TO2 stocked 500; plans PL-TO2-A and PL-TO2-B both ACTIVE (BOM qty 1)"
            - "run R1 exists for (PL-TO2-A, 2026-05), still DRAFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "TO2 Client", billing_email: "to2@acme.test" }
              as: PlatformAdmin
              captures: { to2_cl: $.data.id }
            - { call: "POST /clients/${to2_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-TO2", name: "TO2 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { to2_cp: $.data.id, to2_cp_v: $.data.version }
            - { call: "POST /components/${to2_cp}/receipts", payload: { quantity: 500, expected_component_version: "${to2_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${to2_cl}", name: "TO2 Box A", sku: "PL-TO2-A", price_per_box_cents: 1000, shipping_weight_grams: 800 }
              as: ClientOps
              as_user_id: "${to2_cl}"
              captures: { to2_pla: $.data.id, to2_pla_v: $.data.version }
            - call: "POST /box-plans/${to2_pla}/kit-revisions"
              payload: { expected_box_plan_version: "${to2_pla_v}" }
              as: ClientOps
              as_user_id: "${to2_cl}"
              captures: { to2_rva: $.data.id }
            - call: "PUT /kit-revisions/${to2_rva}/bom-lines"
              payload: { lines: [{ component_id: "${to2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${to2_cl}"
            - { call: "POST /kit-revisions/${to2_rva}/approve", as: ClientOps, as_user_id: "${to2_cl}" }
            - { call: "POST /box-plans/${to2_pla}/activate", as: ClientOps, as_user_id: "${to2_cl}" }
            - call: "POST /box-plans"
              payload: { client_id: "${to2_cl}", name: "TO2 Box B", sku: "PL-TO2-B", price_per_box_cents: 1000, shipping_weight_grams: 800 }
              as: ClientOps
              as_user_id: "${to2_cl}"
              captures: { to2_plb: $.data.id, to2_plb_v: $.data.version }
            - call: "POST /box-plans/${to2_plb}/kit-revisions"
              payload: { expected_box_plan_version: "${to2_plb_v}" }
              as: ClientOps
              as_user_id: "${to2_cl}"
              captures: { to2_rvb: $.data.id }
            - call: "PUT /kit-revisions/${to2_rvb}/bom-lines"
              payload: { lines: [{ component_id: "${to2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${to2_cl}"
            - { call: "POST /kit-revisions/${to2_rvb}/approve", as: ClientOps, as_user_id: "${to2_cl}" }
            - { call: "POST /box-plans/${to2_plb}/activate", as: ClientOps, as_user_id: "${to2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${to2_pla}", period: "2026-05" }
              as: WarehouseOps
              captures: { to2_rn1: $.data.id }
          trigger:
            - call: "POST /assembly-runs"
              payload: { plan_id: "${to2_pla}", period: "2026-05" }
              as: WarehouseOps
              captures: { to2_err: $.data.error_id }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${to2_pla}", period: "2026-06" }
              as: WarehouseOps
              captures: { to2_rn_jun: $.data.id, to2_rn_jun_status: $.data.status }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${to2_plb}", period: "2026-05" }
              as: WarehouseOps
              captures: { to2_rn_b: $.data.id, to2_rn_b_status: $.data.status }
          assert:
            - "duplicate (PL-TO2-A, 2026-05) rejected with ERR_RUN_PERIOD_CONFLICT (${to2_err}) even though R1 is only DRAFT"
            - "same plan, next month (${to2_rn_jun_status}) == DRAFT — discrete slot, no adjacency notion"
            - "same period, other plan (${to2_rn_b_status}) == DRAFT — the slot is per BoxPlan, not global"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_cancel_conserves_available_units
        grounds:
          - state_machines.AssemblyRun.LOCKED_to_CANCELLED
          - entities.InventoryEvent.fields.quantity_delta
          - entities.Component.fields.available_units
        distinguishing_aspect: |
          Conserved quantity is inventory units: lock reserves 4 (RESERVE +4)
          and cancel releases exactly the same 4 (RELEASE -4), so
          available_units == on_hand - reserved returns to its pre-lock value
          100 with zero drift; the run's event ledger nets to zero.
        test_recipe:
          setup:
            - "client CI1 wallet 50000; component CMP-CI1 receipt 100, reorder 0, BOM qty_per_box 2; plan PL-CI1 ACTIVE price 1000"
            - "2 ACTIVE subscribers; run 2026-05 LOCKED (reserved 4, available 96)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "CI1 Client", billing_email: "ci1@acme.test" }
              as: PlatformAdmin
              captures: { ci1_cl: $.data.id }
            - { call: "POST /clients/${ci1_cl}/credit-adjustments", payload: { amount_cents: 50000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-CI1", name: "CI1 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { ci1_cp: $.data.id, ci1_cp_v: $.data.version }
            - { call: "POST /components/${ci1_cp}/receipts", payload: { quantity: 100, expected_component_version: "${ci1_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${ci1_cl}", name: "CI1 Box", sku: "PL-CI1", price_per_box_cents: 1000, shipping_weight_grams: 800 }
              as: ClientOps
              as_user_id: "${ci1_cl}"
              captures: { ci1_pl: $.data.id, ci1_pl_v: $.data.version }
            - call: "POST /box-plans/${ci1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${ci1_pl_v}" }
              as: ClientOps
              as_user_id: "${ci1_cl}"
              captures: { ci1_rv: $.data.id }
            - call: "PUT /kit-revisions/${ci1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${ci1_cp}", qty_per_box: 2 }] }
              as: ClientOps
              as_user_id: "${ci1_cl}"
            - { call: "POST /kit-revisions/${ci1_rv}/approve", as: ClientOps, as_user_id: "${ci1_cl}" }
            - { call: "POST /box-plans/${ci1_pl}/activate", as: ClientOps, as_user_id: "${ci1_cl}" }
            - call: "POST /box-plans/${ci1_pl}/import-batches"
              payload: { rows: [{ email: "ci1a@x.test", zone: 2 }, { email: "ci1b@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${ci1_cl}"
              captures: { ci1_ib: $.data.id }
            - { call: "POST /import-batches/${ci1_ib}/commit", as: ClientOps, as_user_id: "${ci1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${ci1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { ci1_rn: $.data.id }
            - { call: "POST /assembly-runs/${ci1_rn}/lock", as: WarehouseOps }
            - call: "GET /components/${ci1_cp}"
              as: WarehouseOps
              captures: { ci1_avail_mid: $.data.available_units, ci1_resv_mid: $.data.reserved_units }
          trigger:
            - { call: "POST /assembly-runs/${ci1_rn}/cancel", as: WarehouseOps }
            - call: "GET /components/${ci1_cp}"
              as: WarehouseOps
              captures: { ci1_avail_end: $.data.available_units, ci1_resv_end: $.data.reserved_units, ci1_onhand_end: $.data.on_hand_units }
            - call: "GET /assembly-runs/${ci1_rn}/inventory-events"
              as: WarehouseOps
          assert:
            - "mid-state: available_units == 96 and reserved_units == 4 (${ci1_avail_mid} / ${ci1_resv_mid})"
            - "after cancel: available_units == 100, reserved_units == 0, on_hand_units == 100 — exactly the pre-lock values"
            - "the run's InventoryEvent ledger nets to zero: RESERVE +4 then RELEASE -4 for CMP-CI1"
            - "both QUEUED shipments of the run are CANCELLED"

      - name: dispute_resolve_zero_adjustment_conserves_wallet
        grounds:
          - state_machines.BillingStatement.FINALIZED_to_DISPUTED
          - state_machines.BillingStatement.DISPUTED_to_FINALIZED
          - entities.Client.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity is money cents (different quantity type than
          inventory units): dispute credits the full net (98000 -> 100000) and
