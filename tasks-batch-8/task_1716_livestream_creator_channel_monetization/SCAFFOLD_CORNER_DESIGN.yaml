            - "Payout.${p_id}.payout_status remains FAILED; retry_count remains 3"

      - name: payout_open_no_eligible_revenue
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_ELIGIBLE_REVENUE]"
          - "validations[priority=25]"
        distinguishing_aspect: "Empty-set boundary: a verified channel with zero CLEARED events gets ERR_NO_ELIGIBLE_REVENUE (priority 25), not the threshold error — proving the empty-sweep check precedes the threshold check."
        test_recipe:
          setup: ["Channel with VERIFIED W9; no revenue events at all (payable 0)"]
          setup_api_calls:
