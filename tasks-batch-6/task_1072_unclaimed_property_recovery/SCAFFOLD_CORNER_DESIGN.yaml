              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
