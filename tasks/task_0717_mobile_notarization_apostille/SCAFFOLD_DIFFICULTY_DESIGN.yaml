  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_assign
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: "On assign, a DRAFT (not QUOTED) request to a non-ron_authorized notary for a RON request violates both state (priority 6, ERR_INVALID_STATE) and business_safety (priority 7, ERR_RON_NOT_AUTHORIZED); the lower-priority state error wins -> ERR_INVALID_STATE. Pair: state vs business_safety."
        test_recipe:
          setup:
            - "RON request still in DRAFT (never quoted). Notary ACTIVE but ron_authorized=false."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: false, nsa_certified: false }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: existence_beats_state_on_start_session
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: "start-session on a non-existent request id violates both existence (priority 3, ERR_NOT_FOUND) and (vacuously) state (priority 6); existence wins -> ERR_NOT_FOUND/404. Pair: existence vs state, a different category pair than instance 1."
        test_recipe:
          setup:
            - "Empty DB except a notary so the role header resolves; no request with the probed id exists."
          setup_api_calls:
            - call: "POST /notary/accounts"
