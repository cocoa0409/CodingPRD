      - name: review_window_on_a_tuesday_rejected_as_not_week_start
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_NOT_WEEK_START]
          - entities.ReviewCapacityWindow.fields.week_start_date
        distinguishing_aspect: |
          Every weekly key in the domain is the Monday of an ISO week; 2026-08-04 is a
          Tuesday and is rejected outright instead of being snapped back to 2026-08-03.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; DOMESTIC manager M1 exists and is review_capable."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
