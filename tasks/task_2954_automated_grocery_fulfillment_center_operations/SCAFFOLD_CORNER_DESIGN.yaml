            - "GridZone.${zone_amb}.accuracy_score_sku_weighted == 0.4500"
            - "GridZone.${zone_amb}.status == AUDIT_HOLD"
            - "GridZone.${zone_amb}.last_audited_at == 2026-08-01T00:00:00.000Z"
