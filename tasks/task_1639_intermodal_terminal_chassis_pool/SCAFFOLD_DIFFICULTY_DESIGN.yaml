          - errors[ERR_RAIL_CUTOFF_MISSED]
          - endpoints[POST /terminals/{tid}/transactions/{txid}/complete]
        distinguishing_aspect: |
          Metric = timestamp comparison on Train.rail_cutoff_at. The formula is
          STRICT less-than: processed_at < rail_cutoff_at passes, processed_at
