          A DIFFERENT entity pair — Award -> Protest instead of Bid -> Vendor — and the
          polarity is inverted: the cross-entity gate starts CLOSED (an ACTIVE automatic
          stay on a sibling Protest would return ERR_AWARD_STAYED) and the test proves
