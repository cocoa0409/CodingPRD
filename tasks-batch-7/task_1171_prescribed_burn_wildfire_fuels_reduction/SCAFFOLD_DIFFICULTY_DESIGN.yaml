# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1171
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_provisional_vs_final_reimbursement
        grounds:
          - calculations.provisional_cost_share_estimate
          - calculations.final_cost_share_reimbursement
          - entities.CostShareAgreement.fields.provisional_estimate_cents
          - entities.CostShareAgreement.fields.final_reimbursement_cents
        distinguishing_aspect: |
          Two valid algorithms over the SAME CostShareAgreement produce different totals:
          provisional uses planned acres with factor 1.0 (175614), final uses actual acres
          from the ACCEPTED THIRTY_DAY report (165651). Entity domain: cost-share fiscal.
        test_recipe:
          setup:
            - "Association (fund 10000000), landowner LO, bosses A (author) and R (reviewer)"
            - "Parcel P1 120ac BRUSH/MODERATE/non-WUI ASH-1 drought 10; plan 100ac window 2026-05-10..2026-05-20 APPROVED"
            - "Ignition ACCEPTED, contingency ACCEPTED, permit ISSUED with 2/2 notifications confirmed at 2026-05-01T00:00:00Z, smoke APPROVED for 2026-05-12 (100ac)"
            - "Resource order FILLED (4 engines, 2 hand crews, 1 tender); execution scheduled 2026-05-12 and driven to CLOSED with actuals BROADCAST 11 / UNDERSTORY 3"
            - "Agreement LEGACY lines {BROADCAST/GRASS/12, UNDERSTORY/BRUSH/3}: provisional_estimate_cents 175614, disbursed 87807, THIRTY_DAY report ACCEPTED with score 93"
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin, captures: {assoc: $.data.id} }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss R", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossR: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcel}", expected_parcel_version: "${parcel_v}", planned_acres: 100, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 100}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {plan: $.data.id} }
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${plan}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {plan_v: $.data.version} }
            - { call: "POST /burn-plans/${plan}/ignition-plans", payload: {expected_burn_plan_version: "${plan_v}", ignition_method: "DRIP_TORCH", test_fire_required: true, steps: [{step_index: 1, zone_label: "north", technique: "strip"}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {ign: $.data.id} }
            - { call: "POST /ignition-plans/${ign}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/contingency-plans", payload: {escape_trigger_points: "flame>4ft", min_holding_personnel: 10, water_supply_description: "tender onsite", evacuation_route_description: "Hwy 9"}, as: BurnBoss, as_user_id: "${bossA}", captures: {cont: $.data.id} }
            - { call: "POST /contingency-plans/${cont}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/permits", payload: {notifications_required: 2}, as: BurnBoss, as_user_id: "${bossA}", captures: {perm: $.data.id} }
            - { call: "POST /permits/${perm}/notifications", payload: {recipient_name: "N1", channel: "MAIL"}, as: BurnBoss, as_user_id: "${bossA}", captures: {n1: $.data.id} }
            - { call: "POST /permits/${perm}/notifications", payload: {recipient_name: "N2", channel: "PHONE"}, as: BurnBoss, as_user_id: "${bossA}", captures: {n2: $.data.id} }
            - { call: "POST /notifications/${n1}/confirm", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /notifications/${n2}/confirm", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /permits/${perm}/issue", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${plan}/smoke-approvals", payload: {requested_burn_date: "2026-05-12", requested_acres: 100}, as: BurnBoss, as_user_id: "${bossA}", captures: {smoke: $.data.id} }
            - { call: "POST /smoke-approvals/${smoke}/decide", payload: {decision: "APPROVED"}, as: AirQualityOfficer }
            - { call: "POST /contractors", payload: {name: "EngCo", resource_type: "ENGINE", capacity_units: 4, personnel_per_unit: 5, day_rate_cents_per_unit: 100000}, as: AssociationAdmin, captures: {cEng: $.data.id} }
            - { call: "POST /contractors", payload: {name: "CrewCo", resource_type: "HAND_CREW", capacity_units: 2, personnel_per_unit: 10, day_rate_cents_per_unit: 80000}, as: AssociationAdmin, captures: {cCrew: $.data.id} }
            - { call: "POST /contractors", payload: {name: "TendCo", resource_type: "WATER_TENDER", capacity_units: 1, personnel_per_unit: 2, day_rate_cents_per_unit: 60000}, as: AssociationAdmin, captures: {cTend: $.data.id} }
            - { call: "POST /burn-plans/${plan}/resource-orders", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {order: $.data.id} }
            - { call: "POST /resource-orders/${order}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /resource-orders/${order}/assignments", payload: {contractor_id: "${cEng}", units: 4, window_start: "2026-05-12", window_end: "2026-05-13"}, as: BurnBoss, as_user_id: "${bossA}", captures: {a1: $.data.id} }
            - { call: "POST /assignments/${a1}/confirm", payload: {}, as: Contractor, as_user_id: "${cEng}" }
            - { call: "POST /resource-orders/${order}/assignments", payload: {contractor_id: "${cCrew}", units: 2, window_start: "2026-05-12", window_end: "2026-05-13"}, as: BurnBoss, as_user_id: "${bossA}", captures: {a2: $.data.id} }
            - { call: "POST /assignments/${a2}/confirm", payload: {}, as: Contractor, as_user_id: "${cCrew}" }
            - { call: "POST /resource-orders/${order}/assignments", payload: {contractor_id: "${cTend}", units: 1, window_start: "2026-05-12", window_end: "2026-05-13"}, as: BurnBoss, as_user_id: "${bossA}", captures: {a3: $.data.id} }
            - { call: "POST /assignments/${a3}/confirm", payload: {}, as: Contractor, as_user_id: "${cTend}" }
            - { call: "POST /burn-plans/${plan}/executions", payload: {scheduled_date: "2026-05-12"}, as: BurnBoss, as_user_id: "${bossA}", captures: {ex: $.data.id} }
            - { call: "POST /cost-share-agreements", payload: {landowner_id: "${lo}", burn_plan_id: "${plan}", funding_tier: "LEGACY", treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 12}, {category: "UNDERSTORY", rate_class: "BRUSH", acres: 3}]}, as: Landowner, as_user_id: "${lo}", captures: {agr: $.data.id, prov: $.data.provisional_estimate_cents} }
            - { call: "POST /cost-share-agreements/${agr}/begin-review", payload: {}, as: AssociationAdmin }
            - { call: "POST /cost-share-agreements/${agr}/approve", payload: {}, as: AssociationAdmin }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-05-12T07:30:00Z"}, as: AssociationAdmin }
            - { call: "POST /executions/${ex}/weather-observations", payload: {observed_at: "2026-05-12T07:30:00Z", wind_mph: 10, fuel_moisture_pct: 12, rh_pct: 40, temp_f: 60, mixing_height_ft: 2000}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/brief", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/go-no-go", payload: {checklist_answers: [{item: "permit_verified", result: "PASS"}, {item: "crew_briefed", result: "PASS"}, {item: "communications_check", result: "PASS"}, {item: "escape_routes_reviewed", result: "PASS"}, {item: "weather_within_prescription", result: "PASS"}, {item: "holding_resources_ready", result: "PASS"}]}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/start-ignition", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/complete-ignition", payload: {acres_blackened: 14}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/begin-patrol", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/begin-mop-up", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /executions/${ex}/close", payload: {actual_treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 11}, {category: "UNDERSTORY", rate_class: "BRUSH", acres: 3}]}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /cost-share-agreements/${agr}/disburse", payload: {}, as: AssociationAdmin, captures: {disb1: $.data.disbursed_cents} }
            - { call: "GET /executions/${ex}/monitoring-reports", payload: {}, as: Any, captures: {r3: "$.data[2].id"} }
            - { call: "POST /monitoring-reports/${r3}/submit", payload: {actual_treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 11}, {category: "UNDERSTORY", rate_class: "BRUSH", acres: 3}]}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /monitoring-reports/${r3}/accept", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
          trigger:
            - { call: "POST /cost-share-agreements/${agr}/disburse", payload: {}, as: AssociationAdmin, captures: {disb2: $.data.disbursed_cents, fin: $.data.final_reimbursement_cents} }
          assert:
            - "captured prov == 175614 (per-line round_half_up then sum; sum-then-round would give 175613)"
            - "captured disb1 == 87807 (round_half_up(175614 * 0.5)); agreement reached PARTIALLY_DISBURSED"
            - "captured fin == 165651 (round(11*15327*0.65)=109588 + round(3*28750*0.65)=56063)"
            - "captured disb2 == 165651 and agreement.status == FULLY_DISBURSED (final installment 77844)"
            - "prov != fin (175614 != 165651): same agreement, two variants, different results"

      - name: suppression_allocation_standard_vs_negligence
        grounds:
          - calculations.suppression_cost_allocation
          - entities.LiabilityClaim.fields.landowner_share_cents
          - entities.LiabilityClaim.fields.association_share_cents
        distinguishing_aspect: |
          Same incident inputs (total 3000000, escaped 60, cap 1000000): standard allocation
          caps the landowner at 1000000; negligence allocation applies 1.5x uncapped -> 2250000.
          Entity domain: incident liability (distinct from cost-share fiscal).
        test_recipe:
          setup:
            - "Execution driven to IGNITION then ESCAPED; incident I1 confirmed-contained-closed and ASSESSED (3000000, 60); claim C1 UNDER_INVESTIGATION"
            - "Second incident I2 (SPOT) on the ESCAPED execution, also ASSESSED (3000000, 60); claim C2 UNDER_INVESTIGATION"
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin, captures: {assoc: $.data.id} }
            - { call: "POST /landowners", payload: {name: "Lo", contact_email: "lo@x.com", liability_waiver_signed: true}, as: AssociationAdmin, captures: {lo: $.data.id} }
            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
