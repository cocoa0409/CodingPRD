  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_create_state_beats_referential_item_not_completed_vs_coverage_mismatch
        grounds:
          - validations[priority=10]
          - validations[priority=7]
          - errors[ERR_ITEM_NOT_COMPLETED]
          - errors[ERR_PROVIDER_TYPE_MISMATCH]
        distinguishing_aspect: |
          Error-category pair {state (p10 ERR_ITEM_NOT_COMPLETED) vs
          business_referential (p7 ERR_PROVIDER_TYPE_MISMATCH, coverage-patient
          mismatch)}. With BOTH violated on POST /claims, p7 referential is checked
          before p10 state, so ERR_PROVIDER_TYPE_MISMATCH wins.
        test_recipe:
          setup:
            - "An item still PLANNED (not COMPLETED) AND a coverage belonging to a DIFFERENT patient."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Owner", date_of_birth: "1980-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Other", date_of_birth: "1981-01-01" }
              as: FrontDesk
              captures: { other_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr V", provider_type: "DENTIST", npi: "1000000009" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${other_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { other_cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 120000, phase_number: 1, tooth_number: 8 }
              as: Clinician
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${other_cov_id}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PROVIDER_TYPE_MISMATCH (p7 referential beats p10 state)"

      - name: appointment_temporal_beats_fiscal_overlap_vs_double_book
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OPERATORY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different error-category pair {state (p6 ERR_INVALID_STATE — item not in
          a schedulable plan) vs business_temporal (p8 ERR_OPERATORY_DOUBLE_BOOKED)}.
          Scheduling onto an item whose plan is DRAFT AND into an already-occupied
          operatory slot: p6 state precedes p8 temporal, so ERR_PLAN_NOT_ACCEPTED
          (state) wins over the overlap error.
        test_recipe:
          setup:
            - "Operatory occupied 09:00-10:00 by an existing appointment."
            - "A second item whose plan is still DRAFT (not ACCEPTED), targeted at an overlapping 09:30 slot in the same room."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Pri", date_of_birth: "1984-02-02" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Pri", provider_type: "DENTIST", npi: "1000000010" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-8", turnover_buffer_minutes: 0 }
              as: FrontDesk
              captures: { op_id: $.data.id }
            # existing occupying appointment (no item link, free-standing)
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:00:00Z" }
              as: FrontDesk
              captures: { occ_appt_id: $.data.id }
            # DRAFT plan item (never accepted)
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2150", category: "BASIC", fee_cents: 40000, phase_number: 1, tooth_number: 5 }
              as: Clinician
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-09-01T09:30:00Z", end_at: "2026-09-01T10:15:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PLAN_NOT_ACCEPTED (p6 state beats p8 temporal overlap)"

