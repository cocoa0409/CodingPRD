        excluded_because:
          difficulty_instance: install_exception_cascades_four_hops_from_opening_to_designer_suspension
          rationale: "The deepest cascade in the domain - opening to vendor order to designer score to the cancellation of that designer's other future bookings, with two ledger rows on the way - is built there hop by hop, and this file re-enters it from the liability side in the_liability_matrix_reads_reason_mount_and_geometry_in_that_order."

