scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: vector_index_provisional_vs_confirmed_diverge_on_in_testing_pools
        grounds:
          - calculations.minimum_infection_rate
          - calculations.vector_index
          - entities.RiskAssessment.fields.vector_index_provisional
          - entities.RiskAssessment.fields.vector_index_confirmed
          - state_machines.RiskAssessment.OPEN_to_CONFIRMED
        distinguishing_aspect: |
          This dual variant lives in the SURVEILLANCE domain (RiskAssessment of a
          ServiceArea): the PROVISIONAL variant counts an IN_TESTING pool's 50
          mosquitoes in the MIR denominator as presumed negative while the
          CONFIRMED variant drops that pool from both numerator and denominator,
          so identical untouched surveillance data yields mir 6.67 / index 64.31
          at creation and mir 10.00 / index 78.88 at confirmation.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with season_start_date 2026-05-01."
            - "One active CDC_LIGHT trap site with two SUBMITTED collections inside the 14-day window ending 2026-06-01: 60 females / 2 trap-nights and 40 females / 2 trap-nights (abundance_index 25.00)."
            - "Three lab pools of 50 mosquitoes each on the first collection: one RESULT_POSITIVE, one RESULT_NEGATIVE, one left IN_TESTING."
            - "One larval inspection with 20 dips and 40 larvae (larval_index 2.00)."
            - "Two weather observations whose raw daily degree-days are 12.55 and 11.55, giving degree_days 24.2 under per-day rounding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "CDC_LIGHT", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 2, female_count: 60, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll1_id: $.data.id }
            - call: "POST /trap-collections/${coll1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-29", trap_nights: 2, female_count: 40, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll2_id: $.data.id }
            - call: "POST /trap-collections/${coll2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-collections/${coll1_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_pos_id: $.data.id }
            - call: "POST /lab-pools/${pool_pos_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_pos_id}/transitions"
              payload: { action: "RESULT", result: "POSITIVE", ct_value: 28.4 }
              as: LabAnalyst
            - call: "POST /trap-collections/${coll1_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_neg_id: $.data.id }
            - call: "POST /lab-pools/${pool_neg_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_neg_id}/transitions"
              payload: { action: "RESULT", result: "NEGATIVE" }
              as: LabAnalyst
            - call: "POST /trap-collections/${coll1_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_open_id: $.data.id }
            - call: "POST /lab-pools/${pool_open_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /service-areas/${area_id}/larval-inspections"
              payload: { inspection_date: "2026-05-26", dips: 20, larvae_count: 40, habitat: "CATCH_BASIN" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-areas/${area_id}/weather-observations"
              payload: { obs_date: "2026-05-30", tmax_c: 25.1, tmin_c: 20.0, rainfall_mm: 0.0 }
              as: DistrictAdmin
            - call: "POST /service-areas/${area_id}/weather-observations"
              payload: { obs_date: "2026-05-31", tmax_c: 24.1, tmin_c: 19.0, rainfall_mm: 0.0 }
              as: DistrictAdmin
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
          trigger:
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
          assert:
            - "RiskAssessment.${ra_id}.abundance_index == 25.00"
            - "RiskAssessment.${ra_id}.larval_index == 2.00"
            - "RiskAssessment.${ra_id}.degree_days == 24.2"
            - "RiskAssessment.${ra_id}.mir_provisional == 6.67"
            - "RiskAssessment.${ra_id}.vector_index_provisional == 64.31"
            - "RiskAssessment.${ra_id}.mir_confirmed == 10.00"
            - "RiskAssessment.${ra_id}.vector_index_confirmed == 78.88"
            - "RiskAssessment.${ra_id}.status == CONFIRMED"
            - "RiskAssessment.${ra_id}.posture_at_confirm == EMERGENCY"
            - "ServiceArea.${area_id}.latest_confirmed_vector_index == 78.88"
            - "ServiceArea.${area_id}.risk_posture == EMERGENCY"
            - "ServiceArea.${area_id}.posture_source == INDEX"

      - name: route_volume_estimated_vs_actual_diverge_on_wind_drift
        grounds:
          - calculations.route_pesticide_volume
          - entities.TreatmentRoute.fields.estimated_volume_ml
          - entities.TreatmentRoute.fields.actual_volume_ml
          - state_machines.TreatmentRoute.PLANNED_to_COMMITTED
          - state_machines.TreatmentRoute.COMMITTED_to_EXECUTED
        distinguishing_aspect: |
          This dual variant lives in the MATERIAL-LOGISTICS domain (TreatmentRoute
          against PesticideProduct stock), not the surveillance domain: 10.00 acres
          at 100.0 ml/acre reserves ESTIMATED 1000.00 ml at COMMIT, while the same
          10.00 acres applied at exactly 8.0 mph consumes ACTUAL 1100.00 ml at
          EXECUTE because the 1.10 drift factor applies only to the ACTUAL variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 whose posture is EMERGENCY from a confirmed assessment of index 73.75."
            - "PesticideProduct PERMETHRIN / ADULTICIDE at 100.0 ml per acre with received_total_ml 100000.00."
            - "An APPROVED ADULTICIDE TreatmentPlan whose single PLANNED route covers 10.00 acres in the window 2026-06-05T09:00Z..12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "CDC_LIGHT", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 2, female_count: 60, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll_id: $.data.id }
            - call: "POST /trap-collections/${coll_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-collections/${coll_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "POSITIVE", ct_value: 28.4 }
              as: LabAnalyst
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /pesticide-products"
              payload: { name: "Permanone 30-30", epa_reg_no: "EPA-101", active_ingredient: "PERMETHRIN", application_method: "ADULTICIDE", label_rate_ml_per_acre: 100.0, reentry_interval_hours: 12, cost_cents_per_liter: 4000, received_total_ml: 100000.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { service_area_id: "${area_id}", trigger_assessment_id: "${ra_id}", treatment_type: "ADULTICIDE" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/routes"
              payload: { applicator_id: "${tech_id}", pesticide_product_id: "${prod_id}", route_code: "R-1", window_start: "2026-06-05T09:00:00.000Z", window_end: "2026-06-05T12:00:00.000Z", planned_acres: 10.0, center_x_m: 0, center_y_m: 0, swath_radius_m: 0 }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { route_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /treatment-routes/${route_id}/transitions"
              payload: { action: "COMMIT" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SCHEDULE", scheduled_start_at: "2026-06-05T09:00:00.000Z" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "START" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /treatment-routes/${route_id}/transitions"
              payload: { action: "EXECUTE", actual_acres: 10.0, wind_speed_mph: 8.0 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "TreatmentRoute.${route_id}.estimated_volume_ml == 1000.00"
            - "TreatmentRoute.${route_id}.actual_volume_ml == 1100.00"
            - "TreatmentRoute.${route_id}.status == EXECUTED"
            - "TreatmentRoute.${route_id}.executed_at == 2026-06-05T09:00:00.000Z"
            - "PesticideProduct.${prod_id}.on_hand_ml == 98900.00"
            - "PesticideProduct.${prod_id}.committed_ml == 0.00"
            - "PesticideProduct.${prod_id}.applied_ml == 1100.00"
            - "PesticideProduct.${prod_id}.received_total_ml == 100000.00"
            - "ServiceArea.${area_id}.seasonal_application_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: vector_index_four_input_nonlinear_min_capped_with_conditional_branch
        grounds:
          - calculations.vector_index
          - calculations.trap_abundance_index
          - calculations.minimum_infection_rate
          - entities.RiskAssessment.fields.vector_index_provisional
        distinguishing_aspect: |
          Mode (a): four independent inputs, each individually capped by min(100.00, ...),
          combined by four weights AND gated by a conditional branch on entity data —
          with abundance_index 24.00 the abundance_component is 48.00, which is below
          the 50.00 outbreak trigger, so the 1.25 multiplier does NOT fire even though
          the infection component is capped at 100.00, and the index is exactly 54.20.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with season_start_date 2026-05-01."
            - "One SUBMITTED collection of 96 females over 4 trap-nights (abundance_index 24.00, abundance_component 48.00)."
            - "One RESULT_POSITIVE pool of 50 mosquitoes (mir_provisional 20.00, infection_component capped at 100.00)."
            - "No larval inspections and no weather observations, so larval_component and weather_component are both 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "GRAVID", habitat: "STORMWATER", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 4, female_count: 96, species: "CULEX_TARSALIS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll_id: $.data.id }
            - call: "POST /trap-collections/${coll_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-collections/${coll_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "POSITIVE", ct_value: 30.0 }
              as: LabAnalyst
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
          trigger:
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
          assert:
            - "RiskAssessment.${ra_id}.abundance_index == 24.00"
            - "RiskAssessment.${ra_id}.mir_provisional == 20.00"
            - "RiskAssessment.${ra_id}.larval_index == 0.00"
            - "RiskAssessment.${ra_id}.degree_days == 0.0"
            - "RiskAssessment.${ra_id}.vector_index_provisional == 54.20"
            - "RiskAssessment.${ra_id}.status == OPEN"

      - name: degree_day_rounded_per_day_before_summation
        grounds:
          - calculations.degree_day_accumulation
          - entities.WeatherObservation.fields.degree_day
          - endpoints[GET /service-areas/{id}/surveillance-report]
        distinguishing_aspect: |
          Mode (b): nested rounding where order changes the answer — two days whose raw
          degree-day values are 12.55 and 11.55 accumulate to 24.2 when each day is
          rounded to 1 decimal first (12.6 + 11.6), but to 24.1 if the raw values are
          summed and rounded once at the end; the scaffold pins round-per-day-then-sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with season_start_date 2026-05-01."
            - "Exactly two weather observations: 2026-05-30 with tmax 25.1 / tmin 20.0 (raw 12.55) and 2026-05-31 with tmax 24.1 / tmin 19.0 (raw 11.55)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /service-areas/${area_id}/weather-observations"
              payload: { obs_date: "2026-05-30", tmax_c: 25.1, tmin_c: 20.0, rainfall_mm: 0.0 }
              as: DistrictAdmin
              captures: { dd1: $.data.degree_day }
            - call: "POST /service-areas/${area_id}/weather-observations"
              payload: { obs_date: "2026-05-31", tmax_c: 24.1, tmin_c: 19.0, rainfall_mm: 2.5 }
              as: DistrictAdmin
              captures: { dd2: $.data.degree_day }
          trigger:
            - call: "GET /service-areas/${area_id}/surveillance-report"
              payload: { as_of_date: "2026-06-01" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
          assert:
            - "${dd1} == 12.6"
            - "${dd2} == 11.6"
            - "surveillance-report.degree_days == 24.2"
            - "surveillance-report.degree_days != 24.1"
            - "surveillance-report.abundance_index == 0.00"

      - name: admin_fee_tier_selected_from_subtotal_not_from_total
        grounds:
          - calculations.treatment_cost_allocation
          - entities.TreatmentPlan.fields.admin_fee_rate
          - entities.TreatmentPlan.fields.total_cost_cents
          - state_machines.TreatmentPlan.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned to one evaluation order —
          subtotal 99900 cents sits just under the 100000 tier boundary, so the rate is
          0.08 and the fee 7992 for a total of 107892; keying the tier on the TOTAL
          (107892, which is over the boundary) would give rate 0.06, fee 5994 and total
          105894, so the pinned subtotal-first order is directly observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with risk_posture NORMAL from a CONFIRMED assessment of index 0.00 (no surveillance data)."
            - "PesticideProduct BTI / LARVICIDE at 100.0 ml per acre costing 4000 cents per litre, received_total_ml 100000.00."
            - "A LARVICIDE plan with one route of 0.15 acres over a 832-minute window 2026-06-05T09:00Z..22:52Z, executed at 5.0 mph (actual_volume 15.00 ml, material 60 cents, labour 99840 cents)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /pesticide-products"
              payload: { name: "VectoBac 12AS", epa_reg_no: "EPA-202", active_ingredient: "BTI", application_method: "LARVICIDE", label_rate_ml_per_acre: 100.0, reentry_interval_hours: 4, cost_cents_per_liter: 4000, received_total_ml: 100000.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { service_area_id: "${area_id}", trigger_assessment_id: "${ra_id}", treatment_type: "LARVICIDE" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/routes"
              payload: { applicator_id: "${tech_id}", pesticide_product_id: "${prod_id}", route_code: "R-1", window_start: "2026-06-05T09:00:00.000Z", window_end: "2026-06-05T22:52:00.000Z", planned_acres: 0.15, center_x_m: 20000, center_y_m: 20000, swath_radius_m: 0 }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { route_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /treatment-routes/${route_id}/transitions"
              payload: { action: "COMMIT" }
