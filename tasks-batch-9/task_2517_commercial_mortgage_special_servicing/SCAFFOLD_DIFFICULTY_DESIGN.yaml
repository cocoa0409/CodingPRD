  - rule_id: transitive_cascade
    instances:
      - name: appraisal_reduction_effective_four_link_control_termination_cascade
        grounds:
          - state_machines.AppraisalReduction.PROVISIONAL_to_EFFECTIVE
          - state_machines.Trust.CONTROLLING_to_CONSULTING_ONLY
          - state_machines.ConsultationRequest.PENDING_to_WAIVED
          - state_machines.WorkoutPlan.CONSULTATION_to_CONSENT_SATISFIED
          - calculations.ara_adjusted_advance_obligation
          - calculations.controlling_class_control_test
        distinguishing_aspect: |
          One committee click on POST /appraisal-reductions/{id}/status propagates four causal links
          deep across four different entities: (1) Loan.ara_amount_usd 0.00 -> 6,000,000.90 and
          required_monthly_pi_advance_usd 118,000.00 -> 81,692.30, (2) Trust.total_ara_usd -> 6,000,000.90
          and controlling_class_notional_usd -> 1,999,999.10, (3) Trust.control_status
          CONTROLLING -> CONSULTING_ONLY because 1,999,999.10 < 2,000,000.00, (4) the PENDING
          CONSENT_RIGHT consultation is downgraded to CONSULTATION_ONLY / WAIVED and its subject
          workout plan jumps CONSULTATION -> CONSENT_SATISFIED without the controlling class ever
          answering. Truncating the chain at link 3 leaves the plan permanently stuck in CONSULTATION.
        test_recipe:
          setup:
            - "One trust with an 8,000,000.00 original controlling class balance, so the control threshold is exactly 2,000,000.00."
            - "One loan with current_principal_balance_usd 19,500,000.00, accrued_unpaid_interest_usd 0.00, monthly_debt_service_usd 118,000.00 and no advances."
            - "An ACCEPTED UPDATE appraisal at 14,999,999, whose auto-created PROVISIONAL reduction is 6,000,000.90 — one cent past the point that terminates control."
