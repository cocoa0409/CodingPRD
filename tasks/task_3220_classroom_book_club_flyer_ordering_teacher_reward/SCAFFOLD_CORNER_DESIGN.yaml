# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# Section/claim_type vocabulary per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_school_minimal_defaults_low_income_false
        claim_type: creation_defaults
        grounds: ["entities.School.fields.low_income_program"]
        distinguishing_aspect: "Omitting low_income_program defaults it to false; system stamps id/created_at/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "Def School", address: "100 Default Rd" }
              as: ClubAdmin
              captures: { ds: $.data.id }
          trigger:
            - call: "GET /club/schools/${ds}"
              payload: {}
              as: ClubAdmin
          assert:
            - "School.${ds}.low_income_program == false"
            - "School.${ds}.posture == NORMAL (no enrollment yet => NORMAL default)"
            - "School.${ds}.version == 1"
      - name: create_teacher_duplicate_email_rejected
        claim_type: type_constraints
        grounds: ["entities.Teacher.fields.email", "validations[priority=23]"]
        distinguishing_aspect: "Teacher.email is globally unique; second registration with the same email fails ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["School SQ1 exists"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "SQ1", address: "1 Q St" }
              as: ClubAdmin
              captures: { sq1: $.data.id }
            - call: "POST /club/teachers"
              payload: { school_id: "${sq1}", full_name: "First", email: "dup@x.com", grade_band: "K_2" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/teachers"
              payload: { school_id: "${sq1}", full_name: "Second", email: "dup@x.com", grade_band: "G6_8" }
              as: ClubAdmin
              captures: { dup_err: $.data.error_id }
          assert:
            - "second create rejected with error_id == ERR_INVALID_REQUEST"
      - name: create_title_duplicate_isbn_rejected
        claim_type: type_constraints
        grounds: ["entities.Title.fields.isbn", "validations[priority=23]"]
        distinguishing_aspect: "Title.isbn is globally unique across catalog."
        test_recipe:
          setup: ["one title with isbn 9780000000200 exists"]
          setup_api_calls:
            - call: "POST /club/titles"
              payload: { isbn: "9780000000200", name: "First ISBN", format: "PAPERBACK", grade_band: "K_2", base_price_cents: 500, points_cost: 5, rights_holder: "Pub X", royalty_cap_cents: 10000 }
              as: ClubAdmin
          trigger:
            - call: "POST /club/titles"
              payload: { isbn: "9780000000200", name: "Second ISBN", format: "CLUB_PAPERBACK", grade_band: "G3_5", base_price_cents: 900, points_cost: 9, rights_holder: "Pub Y", royalty_cap_cents: 10000 }
              as: ClubAdmin
              captures: { isbn_err: $.data.error_id }
          assert:
            - "rejected with error_id == ERR_INVALID_REQUEST"
      - name: get_missing_entity_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID path id -> 404 ERR_NOT_FOUND on any collection."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /club/titles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ClubAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"
      - name: list_schools_paginates_with_envelope
        claim_type: listing_pagination
        grounds: ["response_envelope"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["3 schools created"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PgA", address: "A" }
              as: ClubAdmin
            - call: "POST /club/schools"
              payload: { name: "PgB", address: "B" }
              as: ClubAdmin
            - call: "POST /club/schools"
              payload: { name: "PgC", address: "C" }
              as: ClubAdmin
          trigger:
            - call: "GET /club/schools?limit=2&offset=0"
              payload: {}
              as: ClubAdmin
          assert:
            - "response data is an array of length 2"
            - "total_count == 3 and has_more == true"
      - name: computed_flyer_price_ignores_input_and_floor_rounds
        claim_type: computed_fields
        grounds: ["entities.FlyerOffering.fields.flyer_price_cents", "calculations.club_price_derive"]
        distinguishing_aspect: "CLUB_PAPERBACK flyer price is floor(base*70/100): base 999 -> floor(699.3) = 699; PAPERBACK pins base unchanged."
        test_recipe:
          setup: ["School CP1 NORMAL w/ enrollment, titles CP_CLUB (CLUB_PAPERBACK base 999) and CP_PB (PAPERBACK base 999), DRAFT cycle"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "CP1", address: "7 CP Ave" }
              as: ClubAdmin
              captures: { cp1: $.data.id }
            - call: "POST /club/schools/${cp1}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/titles"
              payload: { isbn: "9780000000201", name: "CP_CLUB", format: "CLUB_PAPERBACK", grade_band: "G3_5", base_price_cents: 999, points_cost: 7, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { cp_club: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000202", name: "CP_PB", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 999, points_cost: 7, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { cp_pb: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${cp1}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { cpc: $.data.id }
            - call: "POST /club/flyer-cycles/${cpc}/offerings"
              payload: { title_id: "${cp_club}" }
              as: ClubAdmin
              captures: { cpo1: $.data.id }
            - call: "POST /club/flyer-cycles/${cpc}/offerings"
              payload: { title_id: "${cp_pb}" }
              as: ClubAdmin
              captures: { cpo2: $.data.id }
          trigger:
            - call: "GET /club/offerings/${cpo1}"
              payload: {}
              as: ClubAdmin
            - call: "GET /club/offerings/${cpo2}"
              payload: {}
              as: ClubAdmin
          assert:
            - "FlyerOffering.${cpo1}.flyer_price_cents == 699 (floor(999*0.7))"
            - "FlyerOffering.${cpo2}.flyer_price_cents == 999 (PAPERBACK passes through)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_empty_cycle_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=13]", "errors[ERR_EMPTY_CYCLE]"]
        distinguishing_aspect: "DRAFT cycle with zero offerings cannot publish."
        test_recipe:
          setup: ["School PC1 NORMAL w/ enrollment; DRAFT cycle no offerings"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC1", address: "8 PC Rd" }
              as: ClubAdmin
              captures: { pc1: $.data.id }
            - call: "POST /club/schools/${pc1}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${pc1}", month: "2026-10", grade_band: "K_2" }
              as: ClubAdmin
              captures: { pcc: $.data.id }
          trigger:
            - call: "POST /club/flyer-cycles/${pcc}/publish"
              payload: {}
              as: ClubAdmin
              captures: { pub_empty_err: $.data.error_id }
          assert:
            - "rejected with error_id == ERR_EMPTY_CYCLE and cycle stays DRAFT"
      - name: invalid_transition_close_with_open_orders_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FlyerCycle.transitions.PUBLISHED_to_CLOSED"]
        distinguishing_aspect: "PUBLISHED->CLOSED requires no OPEN class orders; one OPEN order blocks with ERR_INVALID_STATE."
        test_recipe:
          setup: ["School PC2 NORMAL, teacher, title, PUBLISHED cycle PC2C with offering, one OPEN order"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC2", address: "9 PC Rd" }
              as: ClubAdmin
              captures: { pc2: $.data.id }
            - call: "POST /club/schools/${pc2}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${pc2}", full_name: "PC2 T", email: "pc2t@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc2t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000210", name: "PC2 Book", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pc2b: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${pc2}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc2c: $.data.id }
            - call: "POST /club/flyer-cycles/${pc2c}/offerings"
              payload: { title_id: "${pc2b}" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles/${pc2c}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${pc2c}", teacher_id: "${pc2t}" }
              as: Teacher
              as_user_id: "${pc2t}"
          trigger:
            - call: "POST /club/flyer-cycles/${pc2c}/close"
              payload: {}
              as: ClubAdmin
              captures: { close_err: $.data.error_id }
          assert:
            - "rejected with error_id == ERR_INVALID_STATE (OPEN order exists) and cycle stays PUBLISHED"
      - name: terminal_cancelled_order_rejects_second_cancel
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ClassOrder.status", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel attempt returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["School PC3 NORMAL, teacher, PUBLISHED cycle with offering, OPEN order PCO3 with 1 line, then cancelled once"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC3", address: "10 PC Rd" }
              as: ClubAdmin
              captures: { pc3: $.data.id }
            - call: "POST /club/schools/${pc3}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${pc3}", full_name: "PC3 T", email: "pc3t@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc3t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000211", name: "PC3 Book", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pc3b: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${pc3}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc3c: $.data.id }
            - call: "POST /club/flyer-cycles/${pc3c}/offerings"
              payload: { title_id: "${pc3b}" }
              as: ClubAdmin
              captures: { pc3o: $.data.id }
            - call: "POST /club/flyer-cycles/${pc3c}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${pc3c}", teacher_id: "${pc3t}" }
              as: Teacher
              as_user_id: "${pc3t}"
              captures: { pco3: $.data.id }
            - call: "POST /club/class-orders/${pco3}/lines"
              payload: { offering_id: "${pc3o}", student_name: "S", submitted_by: "TEACHER", qty: 1 }
              as: Teacher
              as_user_id: "${pc3t}"
            - call: "POST /club/class-orders/${pco3}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${pc3t}"
          trigger:
            - call: "POST /club/class-orders/${pco3}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${pc3t}"
              captures: { term_err: $.data.error_id }
          assert:
            - "second cancel rejected with error_id == ERR_ALREADY_TERMINAL"
      - name: cancel_submitted_after_partial_ship_blocked
        claim_type: precondition_enforcement
        grounds: ["state_machines.ClassOrder.status.SUBMITTED_to_CANCELLED", "errors[ERR_ORDER_HAS_SHIPPED]"]
        distinguishing_aspect: "Cancel-from-SUBMITTED requires ship_status == PENDING; once a shipping run moves ship_status to SHIPPED, cancel is rejected."
        test_recipe:
          setup: ["School PC4 NORMAL, teacher, title (cap generous so nothing backorders), PUBLISHED cycle, order submitted with 1 line"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC4", address: "11 PC Rd" }
              as: ClubAdmin
              captures: { pc4: $.data.id }
            - call: "POST /club/schools/${pc4}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${pc4}", full_name: "PC4 T", email: "pc4t@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc4t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000212", name: "PC4 Book", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pc4b: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${pc4}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { pc4c: $.data.id }
            - call: "POST /club/flyer-cycles/${pc4c}/offerings"
              payload: { title_id: "${pc4b}" }
              as: ClubAdmin
              captures: { pc4o: $.data.id }
            - call: "POST /club/flyer-cycles/${pc4c}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${pc4c}", teacher_id: "${pc4t}" }
              as: Teacher
              as_user_id: "${pc4t}"
              captures: { pco4: $.data.id }
            - call: "POST /club/class-orders/${pco4}/lines"
              payload: { offering_id: "${pc4o}", student_name: "S", submitted_by: "TEACHER", qty: 1 }
              as: Teacher
              as_user_id: "${pc4t}"
            - call: "GET /club/class-orders/${pco4}"
              payload: {}
              as: Teacher
              as_user_id: "${pc4t}"
              captures: { pco4_v: $.data.version }
            - call: "POST /club/class-orders/${pco4}/submit"
              payload: { expected_class_order_version: "${pco4_v}" }
              as: Teacher
              as_user_id: "${pc4t}"
            - call: "POST /club/_ops/run-shipping"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /club/class-orders/${pco4}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${pc4t}"
              captures: { ship_err: $.data.error_id }
          assert:
            - "ClassOrder.${pco4}.ship_status == SHIPPED after the run"
            - "cancel rejected with error_id == ERR_ORDER_HAS_SHIPPED"
      - name: donation_fulfill_requires_matched
        claim_type: invalid_transition
        grounds: ["state_machines.DonationRequest.status", "errors[ERR_DONATION_NOT_MATCHED]"]
        distinguishing_aspect: "OPEN -> FULFILLED is not a transition; fulfilling an OPEN request returns ERR_DONATION_NOT_MATCHED."
        test_recipe:
          setup: ["School PC5 NORMAL low-income, teacher, title ACTIVE, donation request OPEN"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC5", address: "12 PC Rd", low_income_program: true }
              as: ClubAdmin
              captures: { pc5: $.data.id }
            - call: "POST /club/schools/${pc5}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${pc5}", full_name: "PC5 T", email: "pc5t@x.com", grade_band: "K_2" }
              as: ClubAdmin
              captures: { pc5t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000213", name: "PC5 Book", format: "PAPERBACK", grade_band: "K_2", base_price_cents: 800, points_cost: 8, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pc5b: $.data.id }
            - call: "POST /club/donation-requests"
              payload: { school_id: "${pc5}", teacher_id: "${pc5t}", title_id: "${pc5b}", qty_requested: 2 }
              as: Teacher
              as_user_id: "${pc5t}"
              captures: { pdr5: $.data.id }
          trigger:
            - call: "POST /club/donation-requests/${pdr5}/fulfill"
              payload: {}
              as: ClubAdmin
              captures: { ful_err: $.data.error_id }
          assert:
            - "rejected with error_id == ERR_DONATION_NOT_MATCHED"
      - name: donation_fulfill_creates_donation_funded_order
        claim_type: side_effect_execution
        grounds: ["state_machines.DonationRequest.status.MATCHED_to_FULFILLED", "entities.OrderLine.fields.donation_funded"]
        distinguishing_aspect: "Fulfill synthesizes a SUBMITTED class order whose lines are donation_funded=true with unit_price 0 and earn no points."
        test_recipe:
          setup: ["School PC6 NORMAL low-income, teacher PC6T K_2, title PC6B, PUBLISHED K_2 October cycle at PC6, donation request matched for qty 4"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "PC6", address: "13 PC Rd", low_income_program: true }
              as: ClubAdmin
              captures: { pc6: $.data.id }
            - call: "POST /club/schools/${pc6}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${pc6}", full_name: "PC6 T", email: "pc6t@x.com", grade_band: "K_2" }
              as: ClubAdmin
              captures: { pc6t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000214", name: "PC6 Book", format: "PAPERBACK", grade_band: "K_2", base_price_cents: 800, points_cost: 8, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pc6b: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${pc6}", month: "2026-10", grade_band: "K_2" }
              as: ClubAdmin
              captures: { pc6c: $.data.id }
            - call: "POST /club/flyer-cycles/${pc6c}/offerings"
              payload: { title_id: "${pc6b}" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles/${pc6c}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/donation-requests"
              payload: { school_id: "${pc6}", teacher_id: "${pc6t}", title_id: "${pc6b}", qty_requested: 4 }
              as: Teacher
              as_user_id: "${pc6t}"
              captures: { pdr6: $.data.id }
            - call: "POST /club/donation-requests/${pdr6}/match"
              payload: {}
              as: Donor
          trigger:
            - call: "POST /club/donation-requests/${pdr6}/fulfill"
              payload: {}
              as: ClubAdmin
            - call: "GET /club/teachers/${pc6t}/class-orders"
              payload: {}
              as: Teacher
              as_user_id: "${pc6t}"
          assert:
            - "DonationRequest.${pdr6}.status == FULFILLED and qty_matched == 4"
            - "A new ClassOrder exists for teacher ${pc6t} with status SUBMITTED, points_status UNAWARDED, subtotal_cents == 0"
            - "Its lines have donation_funded == true and unit_price_cents == 0"
            - "Teacher.${pc6t}.donated_books_received == 4 and points_balance unchanged (0)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: tier_boundary_at_15000_applies_1000bp
        claim_type: boundary_edge
        grounds: ["calculations.tier_discount_band"]
        distinguishing_aspect: "Inclusive lower tier bound: subtotal exactly 15000 takes tier 2 (1000bp -> 1500 discount); 14999 stays tier 1."
        test_recipe:
          setup: ["School CB1 NORMAL w/ enrollment, teacher, title TCB PAPERBACK base 4999; PUBLISHED cycle; order A 3x (14997) and order B 3x + patch qty... simpler: title at 5000: A 3x5000=15000 exactly"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "CB1", address: "20 CB Rd" }
              as: ClubAdmin
              captures: { cb1: $.data.id }
            - call: "POST /club/schools/${cb1}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${cb1}", full_name: "CB1 T", email: "cb1t@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { cb1t: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000220", name: "TCB", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 5000, points_cost: 50, rights_holder: "Pub X", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { tcb: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${cb1}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { cbc: $.data.id }
            - call: "POST /club/flyer-cycles/${cbc}/offerings"
              payload: { title_id: "${tcb}" }
              as: ClubAdmin
              captures: { cbo: $.data.id }
            - call: "POST /club/flyer-cycles/${cbc}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${cbc}", teacher_id: "${cb1t}" }
              as: Teacher
              as_user_id: "${cb1t}"
              captures: { cbo_a: $.data.id }
            - call: "POST /club/class-orders/${cbo_a}/lines"
              payload: { offering_id: "${cbo}", student_name: "S", submitted_by: "TEACHER", qty: 3 }
              as: Teacher
              as_user_id: "${cb1t}"
          trigger:
            - call: "GET /club/class-orders/${cbo_a}"
              payload: {}
              as: Teacher
              as_user_id: "${cb1t}"
          assert:
            - "subtotal_cents == 15000 and discount_cents == 1500 (tier 2 at exactly 15000, inclusive)"
            - "net_total_cents == 13500"
      - name: promotion_expiry_excludes_from_award
        claim_type: input_set_filtering
        grounds: ["calculations.reward_points_base", "entities.Promotion.fields.status"]
        distinguishing_aspect: "A BONUS_POINTS promo whose window ended before the submit date contributes zero bonus — input set filters EXPIRED promos."
        test_recipe:
          setup: ["School CB2 NORMAL, teacher, title 1500, September promo 2x (ended 2026-10-01), PUBLISHED October cycle, order 2x line, clock at 2026-10-15"]
