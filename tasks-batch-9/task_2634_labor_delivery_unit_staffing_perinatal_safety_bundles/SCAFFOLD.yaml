  - method: POST
    path: "/obstetric-units/{unitId}/capacity-sweep"
    description: "Operator/driver action that realises every clock-driven consequence for one unit, in the pinned order of calc induction_capacity_projection: (1) freeze posture_at_sweep, (2) clear TURNOVER beds whose turnover_clear_at <= clock_now, (3) expire CAPACITY_HELD bookings whose hold_expires_at <= clock_now, (4) requeue BUMPED bookings with requested_start_utc > clock_now to REQUESTED and EXPIRE the rest, (5) promote REQUESTED bookings one at a time re-testing capacity and bed availability after each, (6) recompute posture ONCE at the end. It also misses overdue checklist items, breaches/re-arms overdue fetal escalation chains and expires overdue support passes. Idempotent when nothing is due: every counter is 0 and no error is raised."
    roles: [ChargeNurse, PatientAccessCoordinator, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: SweepResult
    output_fields: { unit_id: "string", swept_at: "datetime — clock_now, also written to unit.last_capacity_sweep_at", posture_at_sweep: "enum — the posture read at sweep start and used for the whole sweep", beds_cleared_count: "integer", holds_expired_booking_ids: "array of InductionBooking.id", bookings_requeued_booking_ids: "array of InductionBooking.id", bookings_expired_booking_ids: "array of InductionBooking.id", promoted_booking_ids: "array of InductionBooking.id in promotion order (PRIORITY_RANK ASC, requested_start_utc ASC, created_at ASC)", promoted_count: "integer, 0 when the candidate set is empty", missed_checklist_item_ids: "array of BundleChecklistItem.id", breached_assessment_ids: "array of FetalMonitoringAssessment.id moved to TIMED_OUT_BREACH", rearmed_assessment_ids: "array of FetalMonitoringAssessment.id moved REASSESSMENT_PENDING -> ESCALATION_DUE", expired_pass_ids: "array of SupportPersonPass.id", breached_encounter_ids: "array of LaborEncounter.id moved to COVERAGE_BREACH", staffing_posture: "enum — recomputed once at the end", coverage_deficit_units: "number 1dp" }
    validation_priorities: [1, 2, 3]
    transitions:
      - "Bed.status TURNOVER -> AVAILABLE (step 2)"
      - "InductionBooking.status CAPACITY_HELD -> EXPIRED with Bed HELD -> AVAILABLE (step 3)"
      - "InductionBooking.status BUMPED -> REQUESTED or BUMPED -> EXPIRED (step 4)"
      - "InductionBooking.status REQUESTED -> CAPACITY_HELD with Bed AVAILABLE -> HELD (step 5 promotion)"
      - "BundleChecklistItem.status PENDING -> MISSED"
      - "FetalMonitoringAssessment.escalation_status {ESCALATION_DUE|TIER_1_NOTIFIED|TIER_2_NOTIFIED} -> TIMED_OUT_BREACH"
      - "FetalMonitoringAssessment.escalation_status REASSESSMENT_PENDING -> ESCALATION_DUE (re-arm, high_water preserved)"
      - "SupportPersonPass.status {ISSUED|CHECKED_OUT} -> EXPIRED"
      - "LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH"
    side_effects:
      - "calc induction_capacity_projection (whole sweep), calc induction_priority_class (requeued bookings), calc escalation_deadline_derivation (re-armed chains), calc cesarean_readiness_derivation, calc unit_posture_derivation ONCE at the end"
      - "unit.escalation_breach_count += 1 per breached assessment; unit.held_bed_minutes_by_day mutated by exactly projected_occupancy_minutes per expiry/promotion (invariant induction_bed_minute_conservation)"
      - "increments unit.version plus the version of every touched bed, booking, item, assessment, pass and encounter"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND]

