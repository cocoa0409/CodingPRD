  # ===========================================================================
  # SECTION: errors
  # ===========================================================================
  - section: errors
    instances:

      - name: cycle_advance_and_close_out_each_guard_their_open_children
        claim_type: triggerable
        grounds:
          - errors[ERR_SLOTS_PENDING_BOARD_ACTION]
          - errors[ERR_CYCLE_HAS_OPEN_AWARDS]
          - calculations.cycle_budget_posture
        distinguishing_aspect: |
          Two different close guards fire on the same cycle at two different
          moments: a still-PROPOSED slot blocks BOARD_REVIEW -> AWARDED, and an
          OFFERED award blocks AWARDED -> CLOSED_OUT. Crossing into AWARDED also
          releases the 300_000 reserve, so available_cents jumps from 4_072_500 to
          4_372_500 on the same committed total — an implementation that keeps
          withholding the reserve reports the smaller figure.
        test_recipe:
          setup:
            - "CornerMain slate submitted, cycle in BOARD_REVIEW, one PROPOSED slot"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: AWARDED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - *n_approve
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: AWARDED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CLOSED_OUT }, as: ProgramOfficer, as_user_id: "officer-1" }
            - *n_getaw
            - { call: "POST /grants/awards/${aw}/decline", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CLOSED_OUT }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The first AWARDED attempt returns 409 ERR_SLOTS_PENDING_BOARD_ACTION and the cycle stays \"BOARD_REVIEW\""
            - "The approval returns 200 with awarded_amount_cents == 1500000"
            - "The second AWARDED attempt returns 200 with reserve_cents == 0, committed_cents == 1627500 and available_cents == 4372500"
            - "The first CLOSED_OUT attempt returns 409 ERR_CYCLE_HAS_OPEN_AWARDS while the award is \"OFFERED\""
            - "The decline returns 200 with status \"DECLINED\"; the cycle then reads funded_total_cents 0, admin_assessment_cents 0, committed_cents 0, available_cents 6000000 and posture \"OPEN\""
            - "The second CLOSED_OUT attempt returns 200 with status \"CLOSED_OUT\""

      - name: board_actions_respect_rank_order_then_exhaust_the_allocation
        claim_type: triggerable
        grounds:
          - errors[ERR_SLOT_RANK_ORDER_VIOLATION]
