          assert:
            - "${bal_b} == 1000.00"
            - "the first call is HTTP 422 with ${err} == ERR_NO_PERFORMANCE_EVIDENCE"
            - "Deduction.${ded_a_id}.status == MATCHED and .validated_amount == null — nothing was written"
            - "the second call is HTTP 200 with ${validated_b} == 800.00 and ${variance_b} == 0.00"
            - "Deduction.${ded_b_id}.status == VALIDATED — priority 86 never runs under AGREEMENT_CAP"
            - "Promotion.${promo_b_id}.accrued_balance == 200.00 and Promotion.${promo_a_id}.consumed_deduction_amount == 0.00"

      - name: tpr_concurrency_cap_counts_lines_across_sibling_promotions
