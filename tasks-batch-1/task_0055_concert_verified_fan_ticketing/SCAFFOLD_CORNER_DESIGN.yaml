              payload: { order_id: "${onm}" }
              as: Fan
              as_user_id: "${fnm}"
              captures: { tk: "$.data[0].id" }
          trigger:
            - call: "POST /tickets/${tk}/scan"
              payload: { device_channel: "WEB" }
              as: GateScanner
          assert:
            - "response.data.error_id == ERR_NON_MOBILE_ENTRY"
            - "Ticket.${tk}.entry_status == VALID"

      - name: list_tickets_by_holder_fk_reverse
        claim_type: Computed read
        grounds:
          - endpoints./tickets
          - entities.Ticket.fields.holder_fan_id
        distinguishing_aspect: "GET /tickets?holder_fan_id=<fan> returns the fan's tickets (FK reverse-reachability) as an array."
        test_recipe:
          setup: ["Fan holds one ticket from a PAID order."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "lh@x.com", full_name: "LH", device_fingerprint: "dev-lh" }
              as: Anonymous
              captures: { flh: $.data.id }
            - call: "POST /fans/${flh}/verify"
              payload: {}
              as: Fan
              as_user_id: "${flh}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${flh}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${flh}"
              captures: { qlh: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qlh}", fan_id: "${flh}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${flh}"
              captures: { olh: $.data.id, olh_v: $.data.version }
            - call: "POST /orders/${olh}/pay"
              payload: { expected_order_version: "${olh_v}" }
              as: Fan
              as_user_id: "${flh}"
          trigger:
            - call: "GET /tickets"
              payload: { holder_fan_id: "${flh}" }
              as: Fan
              as_user_id: "${flh}"
          assert:
            - "response.response_type == array"
            - "len(response.data) == 1"

  # ─────────────────────────────────────────────────────────────────────────
  - section: errors
    instances:
      - name: allocation_exceeded_on_order_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ALLOCATION_EXCEEDED]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tier_allocation_capacity_overlap
          rationale: "Allocation-cap rejection is exercised as the WAITING-not-offered outcome of the named §1.8 instance."

      - name: offer_expired_on_pay_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_EXPIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_pay_requires_queue_entry_offered
          rationale: "ERR_OFFER_EXPIRED is the asserted failure path of the named §1.8 instance."

      - name: stale_version_on_pay
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[order-pay-stale-order]
        distinguishing_aspect: "Paying with expected_order_version one behind current returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Fan has a PENDING Order; the client holds a stale version (one less than current) after a prior cancel-attempt that bumped it — modeled here by paying with version-1."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "sv@x.com", full_name: "SV", device_fingerprint: "dev-sv" }
              as: Anonymous
              captures: { fsv: $.data.id }
            - call: "POST /fans/${fsv}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fsv}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fsv}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fsv}"
              captures: { qsv: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qsv}", fan_id: "${fsv}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fsv}"
              captures: { osv: $.data.id, osv_v: $.data.version }
          trigger:
            - call: "POST /orders/${osv}/pay"
              payload: { expected_order_version: "${osv_v} - 1" }
              as: Fan
              as_user_id: "${fsv}"
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

  # ─────────────────────────────────────────────────────────────────────────
  - section: rbac
    instances:
      - name: fan_cannot_create_event
        claim_type: unauthorized_role
        grounds:
          - roles.PromoterAdmin
          - roles.Fan
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Fan calling POST /events (PromoterAdmin-exclusive) returns ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup: ["A registered Fan."]
          setup_api_calls:
            - call: "POST /fans"
              payload: { email: "fr@x.com", full_name: "FR", device_fingerprint: "dev-fr" }
              as: Anonymous
              captures: { ffr: $.data.id }
            - call: "POST /fans/${ffr}/verify"
              payload: {}
              as: Fan
              as_user_id: "${ffr}"
          trigger:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: Fan
              as_user_id: "${ffr}"
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "response.status == 403"

      - name: non_owner_fan_cannot_refund_others_order
        claim_type: peer_isolation
        grounds:
          - roles.Fan
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Fan B refunding Fan A's PAID order returns ERR_NOT_RESOURCE_OWNER 403; order stays PAID."
        test_recipe:
          setup: ["Fan A holds a PAID Order; Fan B is a different registered fan."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "oa@x.com", full_name: "OA", device_fingerprint: "dev-oa" }
              as: Anonymous
              captures: { foa: $.data.id }
            - call: "POST /fans/${foa}/verify"
              payload: {}
              as: Fan
              as_user_id: "${foa}"
            - call: "POST /fans"
              payload: { email: "ob@x.com", full_name: "OB", device_fingerprint: "dev-ob" }
              as: Anonymous
              captures: { fob: $.data.id }
            - call: "POST /fans/${fob}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fob}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${foa}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${foa}"
              captures: { qoa: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qoa}", fan_id: "${foa}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${foa}"
              captures: { ooa: $.data.id, ooa_v: $.data.version }
            - call: "POST /orders/${ooa}/pay"
              payload: { expected_order_version: "${ooa_v}" }
              as: Fan
              as_user_id: "${foa}"
              captures: { ooa_v2: $.data.version }
          trigger:
            - call: "POST /orders/${ooa}/refund"
              payload: { expected_order_version: "${ooa_v2}" }
              as: Fan
              as_user_id: "${fob}"
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Order.${ooa}.status == PAID"

      - name: missing_auth_headers_rejected
        claim_type: unauthorized_role
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A Fan-only write with no X-User-Role header returns ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /queue-entries"
              payload: { event_id: "00000000-0000-4000-8000-000000000000", fan_id: "00000000-0000-4000-8000-000000000001", tier_id: "00000000-0000-4000-8000-000000000002", presale_code_used: "S", requested_qty: 1 }
              as: NONE
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status == 401"

  # ─────────────────────────────────────────────────────────────────────────
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_version_on_resale_buy_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[resale-buy-stale-listing]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / refund_conserves_tier_seat_occupancy
          rationale: "OCC version-increment behavior on guarded writes is exercised by the pay/refund version chain; the resale-buy stale path mirrors order-pay stale (section errors / stale_version_on_pay)."

      - name: version_increments_on_event_transition
        claim_type: optimistic_concurrency
        grounds:
          - entities.Event.fields.version
          - state_machines.Event.DRAFT_to_PRESALE
        distinguishing_aspect: "Event.version increments from 1 to 2 after open-presale; a second open-presale with the now-stale expected_event_version 1 returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Event in DRAFT with a tier; presale opened once (version now 2)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
          trigger:
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

  # ─────────────────────────────────────────────────────────────────────────
  - section: consistency_model
    instances:
      - name: pay_side_effects_visible_immediately
        claim_type: immediate
        grounds:
