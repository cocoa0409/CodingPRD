      - name: daily_minute_cap_accepts_exactly_two_hundred_forty_and_rejects_the_next_thirty_minutes
        grounds:
          - validations.priority_14.ERR_STUDENT_DAILY_LIMIT
          - validations.priority_13.ERR_SESSION_GAP_TOO_SHORT
          - entities.EntitlementRule.fields.max_daily_minutes
          - entities.EntitlementRule.fields.min_gap_minutes
        distinguishing_aspect: |
          Two boundaries are exercised in the same day: the inter-session gap of exactly
          min_gap_minutes (15) is accepted, and the running daily total of exactly max_daily_minutes
          (240) is accepted, but the very next session - the smallest schedulable 30 minutes - pushes the
          day to 270 and is rejected. The aggregate spans two different teachers on the same case, so an
          implementation that sums per-assignment instead of per-case-per-day will wrongly accept it.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME rule PUBLISHED (min_session 30, max_session 120, max_daily 240, min_gap 15, travel_buffer 30)."
            - "HomeboundCase ACTIVE, weekly_entitled_minutes 390, escort_required false, with an ACTIVE PRIMARY assignment on teacher E-1001 and an ACTIVE SUPPORT assignment on teacher E-1002 (max caseload 600, allocation 115)."
