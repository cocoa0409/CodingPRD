  - section: validations
    instances:
      - name: a_sale_one_cent_under_the_register_floor_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority 36]
          - errors[ERR_SALE_BELOW_FLOOR]
        distinguishing_aspect: "The floor is round_half_up(current_price_cents * 0.80) == round_half_up(126317*0.80) == 101054, so 101053 is refused with ERR_SALE_BELOW_FLOOR at HTTP 422 and no Sale row, no ledger entry and no lifecycle change is produced. Truncating the floor to 101053 would let this call through."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator on an ACTIVE STD-2026 agreement"
            - "one SOFA declared 189950 at 65 cuft and 30 sqft, screened and received at 7.0 / 6.5 / 6.0 -> photo_score 6.60 -> grade B -> round_half_up(round_half_up(189950*0.70) * 0.95) == 126317"
            - "collected on a completed 2-mover job: 12000 + ceil(65/10)*2500 + 5500 bulky == 35000, cap round_half_up(0.35*189950) == 66483 not binding, so the ledger opens at -35000"
            - "placed in Front A (capacity 200) at day 0 with markdown step 1 at 0.00, so current_price_cents is 126317"
            - "buyer Nora at floor 2 without an elevator"
