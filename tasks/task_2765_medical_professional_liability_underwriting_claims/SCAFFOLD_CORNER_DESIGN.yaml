          - entities.RiskProgramEnrollment.fields.program_code
        distinguishing_aspect: "One ENROLLED row per program_code is the uniqueness unit, so a second CME_RISK_101 enrollment on the same insured returns ERR_DUPLICATE_PROGRAM_ENROLLMENT (409) with a current insured version supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class and one COOK_IL insured."
            - "That insured already holds an ENROLLED CME_RISK_101 enrollment dated 2026-08-01."
