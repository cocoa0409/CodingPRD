          trigger:
            - { call: "POST /transparency/publication-cycles/00000000-0000-0000-0000-000000000000/freeze", as: Consumer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: rbac_platform_admin_cannot_validate_record
        claim_type: exclusive_operation_denied
