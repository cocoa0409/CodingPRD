            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/reinstate", payload: {reinstatement_note: "violation cured; right returned to service"}, as: WaterRightsAnalyst}
          assert:
            - "The violation left the condition VIOLATED, the right SUSPENDED, and forfeiture_risk_score 72.50 with band HIGH (60.50 + the 12-point SUSPENDED penalty)."
            - "Call 1: 409 ERR_VIOLATION_UNRESOLVED (priority 31) — the right stays SUSPENDED and its version is unchanged."
            - "Call 2: 200 with status SATISFIED — the VIOLATED -> SATISFIED cure leg is declared, and payment_status stays NOT_APPLICABLE so the priority-21 fee gate does not apply."
            - "Call 3: the right is STILL SUSPENDED — curing does not itself lift the suspension; only /reinstate does."
            - "Call 4: 200 with status PARTIALLY_TRANSFERRED, not ACTIVE — calculations.right_status_derivation sees transferred_away_af 100.00 > 0.00; forfeiture_risk_score is back to 60.50 (ELEVATED) with the penalty removed."
            - "Ledger after reinstatement: 195.00 == 95.00 + 0.00 + 100.00."

      - name: sm_pod_change_approval_authorizes_proposed_and_retires_superseded_headgate
        claim_type: side_effect_execution
        grounds:
          - state_machines.PointOfDiversion.PROPOSED_to_AUTHORIZED
          - state_machines.PointOfDiversion.AUTHORIZED_to_RETIRED
