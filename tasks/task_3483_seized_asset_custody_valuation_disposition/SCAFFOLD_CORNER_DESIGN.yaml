            - "GET /custody/assets/${ra21}/valuations returns 0 rows"
            - "Asset.${ra21}.legal_state remains SEIZED"

      - name: role_and_shape_checks_beat_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "Two dual-failure probes pin the ordering: a Claimant posting a valuation against a NON-EXISTENT asset gets 403 ERR_FORBIDDEN (p2 role before p4 existence), and an AssetCustodian posting a shape-invalid asset body (missing description) against a non-existent case gets 400 ERR_INVALID_REQUEST (p3 shape before p4 existence)."
        test_recipe:
          setup:
            - "One case; one asset (its version is captured only to satisfy the OCC field form — the referenced asset_id in the trigger is unknown)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1022", judicial_district: "E.D.N.Y.", forfeiture_type: "CIVIL", lead_agency_code: "HSI" }
