# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2487 — Wildfire Mitigation & Public Safety Power Shutoff
# 9 rule_ids, 25 instances. Every numeric assert literal was computed by running
# the §1.3 formulas with Decimal/ROUND_HALF_UP.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fpi_forecast_envelope_vs_validated_latest_divergence
        grounds:
          - calculations.fire_potential_index
          - entities.FirePotentialIndex.fields.computation_variant
          - entities.FirePotentialIndex.fields.effective_wind_gust_mph
          - entities.FirePotentialIndex.fields.fpi_score
        distinguishing_aspect: |
          Over one identical set of four observations on two stations, the FORECAST variant reduces each
          station to its worst-case envelope (max gust 62.0/48.0, min humidity 22.0/26.0, min fuel moisture
          8.0/9.0) and rounds the blended inputs to 1 dp before scoring, while the VALIDATED variant takes
          only each station's latest observation (57.0/44.0, 28.0/31.0, 9.5/10.0) at full precision — so the
          two rows must read fpi_score 85.93 and 78.69 respectively, a 7.24-point divergence.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default; circuit ALPHA is TIER_3 with equipment_condition_index 55, inspected 2026-05-01 on a 36-month cycle (so not overdue) and hardened_fraction 0.0000."
            - "Two ONLINE stations feed ALPHA with representativeness_weight 0.70 and 0.45 (denominator 1.15, so the blend is non-terminating)."
            - "Each station carries two observations inside the half-open window [2026-08-14T00:00:00Z, 2026-08-16T00:00:00Z) for forecast_date 2026-08-15, with the later observation milder than the earlier one."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A2", circuit_id: "${alpha_id}", elevation_ft: 2600, representativeness_weight: 0.45, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a2_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-14T18:00:00Z", wind_gust_mph: 62.0, relative_humidity_pct: 22.0, temperature_f: 104.0, dead_fuel_moisture_pct: 8.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-15T15:00:00Z", wind_gust_mph: 57.0, relative_humidity_pct: 28.0, temperature_f: 99.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-14T17:00:00Z", wind_gust_mph: 48.0, relative_humidity_pct: 26.0, temperature_f: 101.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-15T16:00:00Z", wind_gust_mph: 44.0, relative_humidity_pct: 31.0, temperature_f: 96.0, dead_fuel_moisture_pct: 10.0 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_fc_id: $.data.id }
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "VALIDATED" }
              as: MeteorologyAnalyst
              captures: { fpi_val_id: $.data.id }
          assert:
            - "FirePotentialIndex.${fpi_fc_id}.contributing_station_count == 2"
            - "FirePotentialIndex.${fpi_fc_id}.effective_wind_gust_mph == 56.5"
            - "FirePotentialIndex.${fpi_fc_id}.effective_relative_humidity_pct == 23.6"
            - "FirePotentialIndex.${fpi_fc_id}.effective_dead_fuel_moisture_pct == 8.4"
            - "FirePotentialIndex.${fpi_fc_id}.fpi_score == 85.93"
            - "FirePotentialIndex.${fpi_fc_id}.fpi_tier == R5"
            - "FirePotentialIndex.${fpi_val_id}.fpi_score == 78.69"
            - "FirePotentialIndex.${fpi_val_id}.fpi_tier == R5"
            - "FirePotentialIndex.${fpi_fc_id}.fpi_score - FirePotentialIndex.${fpi_val_id}.fpi_score == 7.24"
            - "Circuit.${alpha_id}.latest_forecast_fpi_score == 85.93 (the VALIDATED row must NOT overwrite it)"
            - "Circuit.${alpha_id}.risk_posture == EXTREME"

      - name: fpi_variant_intermediate_rounding_isolated
        grounds:
          - calculations.fire_potential_index
          - calculations.fire_potential_index.variants.FORECAST
          - calculations.fire_potential_index.variants.VALIDATED
        distinguishing_aspect: |
          Each station carries exactly ONE in-window observation, so the envelope reduction and the latest
          reduction select identical values and the ONLY remaining difference between the variants is
          FORECAST's 1-dp rounding of the blended inputs before scoring — which alone moves fpi_score from
          85.97 (VALIDATED, unrounded) to 85.93 (FORECAST, rounded), a 0.04 gap the previous instance's
          reduction-rule divergence would mask.
        test_recipe:
          setup:
            - "Circuit JULIET is TIER_3 with equipment_condition_index 55, inspected 2026-05-01 on a 36-month cycle, hardened_fraction 0.0000."
            - "Two ONLINE stations with representativeness_weight 0.70 and 0.45 each hold exactly one observation inside the window for forecast_date 2026-08-15."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "JULIET", district_code: "D-EAST", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { juliet_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-J1", circuit_id: "${juliet_id}", elevation_ft: 3100, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_j1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-J2", circuit_id: "${juliet_id}", elevation_ft: 2500, representativeness_weight: 0.45, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_j2_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_j1_id}", observed_at: "2026-08-14T18:00:00Z", wind_gust_mph: 62.0, relative_humidity_pct: 22.0, temperature_f: 104.0, dead_fuel_moisture_pct: 8.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_j2_id}", observed_at: "2026-08-14T17:00:00Z", wind_gust_mph: 48.0, relative_humidity_pct: 26.0, temperature_f: 101.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${juliet_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { j_fc_id: $.data.id }
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${juliet_id}", forecast_date: "2026-08-15", computation_variant: "VALIDATED" }
              as: MeteorologyAnalyst
              captures: { j_val_id: $.data.id }
          assert:
            - "FirePotentialIndex.${j_fc_id}.effective_wind_gust_mph == 56.5"
            - "FirePotentialIndex.${j_fc_id}.wind_component == 91.25"
            - "FirePotentialIndex.${j_fc_id}.dryness_component == 90.8"
            - "FirePotentialIndex.${j_fc_id}.fpi_score == 85.93"
            - "FirePotentialIndex.${j_val_id}.fpi_score == 85.97"
            - "FirePotentialIndex.${j_fc_id}.fpi_score != FirePotentialIndex.${j_val_id}.fpi_score"
            - "FirePotentialIndex.${j_fc_id}.contributing_station_count == 2 and FirePotentialIndex.${j_val_id}.contributing_station_count == 2"

      - name: net_benefit_pre_event_vs_post_event_window
        grounds:
          - calculations.psps_net_benefit_ratio
          - calculations.psps_net_benefit_ratio.variants.PRE_EVENT
          - calculations.psps_net_benefit_ratio.variants.POST_EVENT
          - entities.PSPSEvent.fields.benefit_variant
          - entities.PSPSEvent.fields.duration_hours
        distinguishing_aspect: |
          The PRE_EVENT variant measures the FORECAST window (2026-08-15T18:00:00Z to 2026-08-16T18:00:00Z,
          24 h) giving customer_impact_score 45.60 and net_benefit_ratio 0.3395, while the POST_EVENT variant
          measures the REALISED window (2026-08-15T19:00:00Z to 2026-08-17T04:30:00Z, 33.5 h ceilinged to 34)
          giving 64.60 and 0.2396 — and the longer window also crosses the credit-rate band from 0.05 to 0.12
          on identical scope rows.
          Note that this is a different calculation from the fire-potential-index variants: here the variant
          switches the TIME WINDOW, not the input-reduction rule.
          "Two independent state dimensions" is not involved; the switch is triggered by actual_restored_at.
        test_recipe:
          setup:
            - "Circuits ALPHA -> BRAVO -> CHARLIE form a feeder chain; ALPHA carries an R5 FORECAST index for 2026-08-15 (fpi_score 85.93)."
            - "Five customers sit on the chain: three on ALPHA (one medical baseline, one critical facility), one on BRAVO, one on CHARLIE."
            - "Event EV-1 is scoped, notified, armed, de-energized at 2026-08-15T19:00:00Z, all-cleared, and every circuit is patrolled and re-energized, the last at 2026-08-17T04:30:00Z."
            - "No community resource center is activated, so crc_mitigation_credit stays 0.00 in both variants."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "BRAVO", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 70, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${alpha_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { bravo_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "CHARLIE", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${bravo_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { charlie_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A2", circuit_id: "${alpha_id}", elevation_ft: 2600, representativeness_weight: 0.45, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a2_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-14T18:00:00Z", wind_gust_mph: 62.0, relative_humidity_pct: 22.0, temperature_f: 104.0, dead_fuel_moisture_pct: 8.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-15T15:00:00Z", wind_gust_mph: 57.0, relative_humidity_pct: 28.0, temperature_f: 99.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-14T17:00:00Z", wind_gust_mph: 48.0, relative_humidity_pct: 26.0, temperature_f: 101.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-15T16:00:00Z", wind_gust_mph: 44.0, relative_humidity_pct: 31.0, temperature_f: 96.0, dead_fuel_moisture_pct: 10.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_fc_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-A1", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "ES", notification_channels: ["SMS", "VOICE"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
              captures: { cust_a1_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-A2", circuit_id: "${alpha_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE", "EMAIL"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
              captures: { cust_a2_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-A3", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "ZH", notification_channels: ["SMS"], accessibility_needs: ["AUDIO", "TTY"], address_zone_code: "Z2" }
              as: GridPlanner
              captures: { cust_a3_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-B1", circuit_id: "${bravo_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "Z3" }
              as: GridPlanner
              captures: { cust_b1_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-C1", circuit_id: "${charlie_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], accessibility_needs: [], address_zone_code: "Z4" }
              as: GridPlanner
              captures: { cust_c1_id: $.data.id }
            - call: "POST /psps-events"
              payload: { event_code: "EV-1", trigger_fire_potential_index_id: "${fpi_fc_id}", forecast_onset_at: "2026-08-15T18:00:00Z", forecast_all_clear_at: "2026-08-16T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev1_id: $.data.id, ev1_v0: $.data.version }
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-08-13T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_adv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T18:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches/${batch_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
            - call: "POST /psps-events/${ev1_id}/arm"
              payload: {}
              as: PSPSDutyOfficer
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "IMMINENT_1H", scheduled_send_at: "2026-08-15T17:00:00Z" }
              as: CommunityLiaison
              captures: { batch_imm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T17:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches/${batch_imm_id}/dispatch"
              payload: {}
              as: CommunityLiaison
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T19:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /psps-events/${ev1_id}/de-energize"
              payload: {}
              as: PSPSDutyOfficer
            - call: "POST /psps-events/${ev1_id}/all-clear"
              payload: {}
              as: MeteorologyAnalyst
            - call: "POST /patrol-assignments"
              payload: { psps_event_id: "${ev1_id}", circuit_id: "${alpha_id}", patrol_mode: "GROUND", window_start_at: "2026-08-16T20:00:00Z", window_end_at: "2026-08-17T01:00:00Z", patrol_lead_user_id: "crew_lead_1" }
              as: FieldPatrolSupervisor
              captures: { pa_alpha_id: $.data.id }
            - call: "POST /patrol-assignments"
              payload: { psps_event_id: "${ev1_id}", circuit_id: "${bravo_id}", patrol_mode: "GROUND", window_start_at: "2026-08-16T20:00:00Z", window_end_at: "2026-08-17T02:00:00Z", patrol_lead_user_id: "crew_lead_2" }
              as: FieldPatrolSupervisor
              captures: { pa_bravo_id: $.data.id }
            - call: "POST /patrol-assignments"
