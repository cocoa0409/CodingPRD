              payload: { batch_kind: "REFUND", quantity: 501, channel: "ONLINE" }
              as: BoxOfficeManager
              captures: { err_k1: "$.data.error_id" }
            - call: "POST /grandstand/ticket-scales/${ts_ab}/sales-batches"
              payload: { batch_kind: "REFUND", quantity: 500, channel: "ONLINE" }
              as: BoxOfficeManager
            - call: "POST /grandstand/ticket-scales/${ts_ab}/sales-batches"
              payload: { batch_kind: "REFUND", quantity: 1, channel: "ONLINE" }
              as: BoxOfficeManager
              captures: { err_k2: "$.data.error_id" }
            - call: "POST /grandstand/ticket-scales/${ts_ab}/sales-batches"
              payload: { batch_kind: "SALE", quantity: 300, channel: "BOX_OFFICE" }
              as: BoxOfficeManager
            - call: "POST /grandstand/ticket-scales/${ts_ab}/sales-batches"
              payload: { batch_kind: "REFUND", quantity: 301, channel: "BOX_OFFICE" }
              as: BoxOfficeManager
              captures: { err_k3: "$.data.error_id" }
            - call: "GET /grandstand/ticket-scales/${ts_ab}"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /grandstand/ticket-scales/${ts_ab}/sales-batches"
              payload: { batch_kind: "REFUND" }
              as: BoxOfficeManager
          assert:
            - "The refund of 501 against 500 net units returns HTTP 422 with ${err_k1} == ERR_REFUND_EXCEEDS_SOLD_UNITS: one unit over is over."
            - "The refund of exactly 500 returns HTTP 201 and drives net units to 0: equality is admitted."
            - "The subsequent refund of 1 against 0 net units returns HTTP 422 with ${err_k2} == ERR_REFUND_EXCEEDS_SOLD_UNITS -- the guard reads the running net, not the 500 gross units ever sold."
            - "After a fresh SALE of 300, the refund of 301 returns HTTP 422 with ${err_k3} == ERR_REFUND_EXCEEDS_SOLD_UNITS: the ceiling moved with the new baseline."
