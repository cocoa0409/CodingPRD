# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Union Dues & Membership Administration
# Nine Difficulty Rules x 2 instances each = 18 instances.
# All chains replay from empty DB; the logical clock defaults to
# 2026-08-01T00:00:00Z and is set explicitly wherever a different time is needed.
# Canonical fixture locals:
#   PCT  = PERCENTAGE_OF_GROSS, bp 200, flat 5000, percap 1500, threshold 10000,
#          grace 2, cure 30, fee 2500, max_susp 3, expel 12
#   FLAT = FLAT_RATE variant; per-instance defaults overridden in payloads
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessed_dues_provisional_vs_final_diverge
        grounds: [calculations.assessed_dues, entities.DuesAssessment.fields.assessed_cents, state_machines.DuesAssessment.PROVISIONAL_to_FINAL]
        distinguishing_aspect: |
          Same member-period, two valid algorithms: the provisional variant (prior-FINAL
          wage base, none -> 0 -> floor 3000) and the final variant (reported gross
          900000 -> 2% -> 18000) disagree by exactly 15000 for identical configuration.
          Entity domain: DuesAssessment.
        test_recipe:
          setup:
            - "PCT local; JOURNEYMAN class (min 3000, max 20000); employer E; member M on E's roster"
            - "2026-08 assessment run created M's PROVISIONAL assessment (no prior FINAL -> floor)"
            - "Remittance for 2026-08 with one line (M, deducted 18000, gross 900000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Pat Journeyman", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "GET /api/members/${mem}/assessments"
              as: SecretaryTreasurer
              captures: { prov_amt: "$.data[0].assessed_cents", prov_status: "$.data[0].status" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 18000 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 18000, gross_wages_cents: 900000 }
              as: OfficeClerk
          trigger:
            - { call: "POST /api/remittances/${rem}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - call: "GET /api/members/${mem}/assessments"
              as: SecretaryTreasurer
              captures: { final_amt: "$.data[0].assessed_cents", final_status: "$.data[0].status", final_gross: "$.data[0].gross_wages_cents" }
          assert:
            - "provisional variant: ${prov_amt} == 3000 and ${prov_status} == PROVISIONAL (gross 0 -> floor min 3000)"
            - "final variant: ${final_amt} == 18000, ${final_status} == FINAL, ${final_gross} == 900000"
            - "${final_amt} != ${prov_amt} (18000 != 3000): two valid interpretations of the same member-period diverge"

      - name: objector_rebate_projected_vs_actual_diverge
        grounds: [calculations.objector_rebate, entities.ObjectorCase.fields.cumulative_rebate_cents]
        distinguishing_aspect: |
          Same objector case at the same instant: the actual variant (chronological, only
          FINAL paid periods 2026-08/2026-09 -> 1342) and the projected variant (forward-
          looking, adds 2026-10..12 at floor dues -> 3355) disagree. Entity domain:
          ObjectorCase — different from the DuesAssessment domain of the sibling instance.
        test_recipe:
          setup:
            - "FLAT local with flat dues 1001, threshold 10000; member M self-pay"
            - "FINAL paid assessments for 2026-08 and 2026-09 (1001 each); PROVISIONAL 2026-10 unpaid"
            - "Objector case RATE_SET with chargeable_share_pct 33"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 300", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1001, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Obie Objector", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-09" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-10" }, as: SecretaryTreasurer }
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 2002 }, as: Member, as_user_id: "${mem}" }
            - call: "POST /api/members/${mem}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { case: "$.data.id" }
            - { call: "POST /api/objector-cases/${case}/set-rate", payload: { chargeable_share_pct: 33 }, as: LocalAdmin }
          trigger:
            - call: "GET /api/objector-cases/${case}/rebate-projection"
              as: SecretaryTreasurer
              captures: { actual: "$.data.actual_rebate_to_date_cents", projected: "$.data.projected_year_rebate_cents" }
          assert:
            - "actual variant: ${actual} == 1342 (per line: 1001 - round_half_up(1001*33/100)=330 -> 671; two lines)"
            - "projected variant: ${projected} == 3355 (1342 + 3 remaining periods 2026-10..12 x 671)"
            - "${actual} != ${projected} (1342 != 3355): the two variants answer differently for identical case data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessed_dues_clamp_branches
        grounds: [calculations.assessed_dues, entities.MemberClassification.fields.max_monthly_dues_cents, entities.MemberClassification.fields.dues_percent_bp]
        distinguishing_aspect: |
          Mode (a): >=3 inputs (gross, bp, min, max, override chain) with non-linear
          nested min/max and a classification-override branch: identical local config
          yields cap-clamped 20000, unclamped 18000, floor-clamped 3000, and
          override-rate 7500 from one reconcile.
        test_recipe:
          setup:
            - "PCT local; JOURNEYMAN (min 3000, max 20000) and APPRENTICE (override 150bp, min 2000, uncapped) classes"
            - "Four members on employer E's roster; 2026-08 run created PROVISIONALs"
            - "Remittance 2026-08 with four lines: M1 (20000, gross 1500000), M2 (18000, gross 900000), M3 (3000, gross 100000), M4 apprentice (7500, gross 500000); header 48500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { clsj: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "APPRENTICE", dues_percent_bp: 150, min_monthly_dues_cents: 2000 }
              as: LocalAdmin
              captures: { clsa: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${clsj}", employer_id: "${emp}", full_name: "Cap Casey", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m1: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${clsj}", employer_id: "${emp}", full_name: "Mid Mike", member_number: "M-002", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m2: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${clsj}", employer_id: "${emp}", full_name: "Floor Flo", member_number: "M-003", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m3: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${clsa}", employer_id: "${emp}", full_name: "App Andy", member_number: "M-004", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m4: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 48500 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${m1}", deducted_cents: 20000, gross_wages_cents: 1500000 }
              as: OfficeClerk
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${m2}", deducted_cents: 18000, gross_wages_cents: 900000 }
              as: OfficeClerk
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${m3}", deducted_cents: 3000, gross_wages_cents: 100000 }
              as: OfficeClerk
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${m4}", deducted_cents: 7500, gross_wages_cents: 500000 }
              as: OfficeClerk
          trigger:
            - call: "POST /api/remittances/${rem}/reconcile"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { rem_status: "$.data.status" }
            - call: "GET /api/members/${m1}/assessments"
              as: SecretaryTreasurer
              captures: { a1: "$.data[0].assessed_cents" }
            - call: "GET /api/members/${m2}/assessments"
              as: SecretaryTreasurer
              captures: { a2: "$.data[0].assessed_cents" }
            - call: "GET /api/members/${m3}/assessments"
              as: SecretaryTreasurer
              captures: { a3: "$.data[0].assessed_cents" }
            - call: "GET /api/members/${m4}/assessments"
              as: SecretaryTreasurer
              captures: { a4: "$.data[0].assessed_cents" }
          assert:
            - "${a1} == 20000 (raw 30000 clamped by max 20000)"
            - "${a2} == 18000 (raw 18000 unclamped)"
            - "${a3} == 3000 (raw 2000 raised to floor min 3000)"
            - "${a4} == 7500 (classification override 150bp: 500000*150/10000, min 2000, no cap)"
            - "${rem_status} == RECONCILED (every line matched its FINAL assessment)"

      - name: objector_rebate_round_per_line_then_sum
        grounds: [calculations.objector_rebate, entities.LedgerEntry.fields.entry_type]
        distinguishing_aspect: |
          Mode (b) nested rounding order: the scaffold pins round-per-assessment-line
          then sum. Two lines of 1001 at 33% yield 671+671 = 1342; the forbidden
          sum-then-round order yields 1341 — the one-cent delta proves the pinned order.
          Different mode from the sibling instance's nested min/max (mode a).
        test_recipe:
          setup:
            - "FLAT local with flat dues 1001, threshold 10000; member M self-pay"
            - "FINAL paid assessments 2026-08 and 2026-09 (1001 each; single payment 2002 covers both)"
            - "Objector case RATE_SET with chargeable_share_pct 33"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 300", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1001, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Obie Objector", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-09" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-10" }, as: SecretaryTreasurer }
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 2002 }, as: Member, as_user_id: "${mem}" }
            - call: "POST /api/members/${mem}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { case: "$.data.id" }
            - { call: "POST /api/objector-cases/${case}/set-rate", payload: { chargeable_share_pct: 33 }, as: LocalAdmin }
          trigger:
            - call: "POST /api/objector-cases/${case}/issue-rebate"
              payload: {}
              as: SecretaryTreasurer
              captures: { cum: "$.data.cumulative_rebate_cents", lastp: "$.data.last_rebated_period", case_status: "$.data.status" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { m_arrears: "$.data.arrears_cents", m_credit: "$.data.credit_balance_cents" }
          assert:
            - "${case_status} == REBATE_ISSUED"
            - "${cum} == 1342 (per-line: 671 + 671); the sum-then-round alternative 1341 MUST NOT be produced"
            - "${lastp} == 2026-09"
            - "${m_arrears} == 0 and ${m_credit} == 341 (charges 3003 - payments 2002 - rebate 1342 = -341 credit)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_delinquency_cycle_loop
        grounds: [state_machines.Member.ACTIVE_to_DELINQUENT, state_machines.Member.DELINQUENT_to_ACTIVE, calculations.delinquency_evaluation]
        distinguishing_aspect: |
          Member's machine is cyclic: ACTIVE -> DELINQUENT -> ACTIVE (auto-cure) ->
          DELINQUENT again on a later sweep — the loop re-enters a prior state, unlike
          any linear pipeline. Sibling instance exercises a different entity
          (CheckoffRemittance parallel dimensions).
        test_recipe:
          setup:
            - "FLAT local (flat 5000, threshold 10000, grace 2, cure 10); self-pay member M"
            - "Runs for 2026-05 and 2026-06 -> arrears 10000 with 2026-05 FINAL (aged)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Cy Clark", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { st1: "$.data.status", ar1: "$.data.arrears_cents" }
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 10000 }, as: Member, as_user_id: "${mem}" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { st2: "$.data.status", ar2: "$.data.arrears_cents" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-09" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-10" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { st3: "$.data.status", ar3: "$.data.arrears_cents" }
          assert:
            - "first loop leg: ${st1} == DELINQUENT at ${ar1} == 10000 (oldest unpaid FINAL 2026-05 <= 2026-08 - 2)"
            - "cure leg: ${st2} == ACTIVE at ${ar2} == 0 after paying 10000 (DRAFT notice deleted by the cure cascade)"
            - "cycle re-entry: ${st3} == DELINQUENT again at ${ar3} == 15000 (2026-08..10 charges; oldest FINAL 2026-08 <= 2026-12 - 2)"

      - name: remittance_parallel_dims_dispute
        grounds: [state_machines.CheckoffRemittance.RECEIVED_to_RECONCILED, state_machines.CheckoffRemittance.RECEIVED_to_RECEIVED, entities.CheckoffRemittance.fields.dispute_status]
        distinguishing_aspect: |
          CheckoffRemittance carries two independent state dimensions on one row:
          reconcile moves ONLY dispute_status (NONE -> DISPUTED) while status stays
          RECEIVED; resolve-dispute then moves BOTH (status -> RECONCILED, dispute ->
          RESOLVED). Different entity and different non-linear shape (parallel dims)
          from the Member cycle.
        test_recipe:
          setup:
            - "PCT local; JOURNEYMAN (min 3000, max 20000); member M on employer E; 2026-08 run (PROVISIONAL 3000)"
            - "Remittance 2026-08 remitted 17500 with line (M, deducted 17500, gross 900000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Para Pam", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 17500 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 17500, gross_wages_cents: 900000 }
              as: OfficeClerk
          trigger:
            - call: "POST /api/remittances/${rem}/reconcile"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { s_after_recon: "$.data.status", d_after_recon: "$.data.dispute_status", expected_total: "$.data.expected_total_cents" }
            - call: "GET /api/remittances/${rem}/lines"
              as: SecretaryTreasurer
              captures: { line_var: "$.data[0].variance_cents", line_st: "$.data[0].line_status" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { mem_arrears: "$.data.arrears_cents" }
            - call: "POST /api/remittances/${rem}/resolve-dispute"
              payload: { resolution_note: "accept union FINAL amounts; member self-pays remainder" }
              as: SecretaryTreasurer
              captures: { s_after_res: "$.data.status", d_after_res: "$.data.dispute_status" }
          assert:
            - "after reconcile only dim 2 moved: ${s_after_recon} == RECEIVED and ${d_after_recon} == DISPUTED"
            - "${line_var} == -500 and ${line_st} == UNDER_DEDUCTED; ${expected_total} == 18000"
            - "finalization side effect landed despite dispute: ${mem_arrears} == 18000 (3000 provisional charge + 15000 supplemental)"
            - "after resolve both dims terminal for forward flow: ${s_after_res} == RECONCILED and ${d_after_res} == RESOLVED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: remittance_post_cure_cascade
        grounds: [state_machines.CheckoffRemittance.RECONCILED_to_POSTED, state_machines.Member.DELINQUENT_to_ACTIVE, state_machines.DelinquencyNotice.SENT_to_CURED, calculations.payment_waterfall]
        distinguishing_aspect: |
          Trigger = remittance post. Causal chain of depth 4: post -> CHECKOFF_CREDIT
          ledger entry -> payment_waterfall recomputes arrears 15000 -> 5000 -> member
          DELINQUENT -> ACTIVE -> SENT notice -> CURED. Each link is caused by the
          previous one, not by the original trigger (not a fan-out).
        test_recipe:
          setup:
            - "FLAT local (flat 5000, threshold 10000, grace 2, cure 10); member M on employer E"
            - "Runs 2026-05..07 -> arrears 15000 (2026-05/06 FINAL, 2026-07 PROVISIONAL); sweep at 2026-08-01 -> DELINQUENT; notice N sent (window [08-01, 08-11))"
            - "Remittance 2026-08 remitted 15000, line (M, deducted 15000, gross 0); reconcile synthesizes M's 2026-08 FINAL 5000 (variance +10000 -> DISPUTED); resolve -> RECONCILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Casc Ada", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-07" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { nid: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${nid}/send", payload: {}, as: OfficeClerk }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 15000 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 15000, gross_wages_cents: 0 }
              as: OfficeClerk
            - { call: "POST /api/remittances/${rem}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - { call: "POST /api/remittances/${rem}/resolve-dispute", payload: { resolution_note: "accept over-deduction as member credit" }, as: SecretaryTreasurer }
          trigger:
            - call: "POST /api/remittances/${rem}/post"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { post_status: "$.data.status", cured_ids: "$.data.auto_cured_member_ids" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { m_status: "$.data.status", m_arrears: "$.data.arrears_cents" }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { n_status: "$.data[0].status" }
          assert:
            - "hop 1 (post): ${post_status} == POSTED"
            - "hop 2 (ledger): arrears recomputed by waterfall — ${m_arrears} == 5000 (charges 20000 - credit 15000; 2026-08 bucket left unpaid)"
            - "hop 3 (member): ${m_status} == ACTIVE and ${cured_ids} contains ${mem}"
            - "hop 4 (notice): ${n_status} == CURED — the notice moved only because the member cured, not because post touched it directly"

      - name: suspension_cancels_pending_transfer
        grounds: [state_machines.Member.DELINQUENT_to_SUSPENDED, state_machines.DelinquencyNotice.SENT_to_EXPIRED, state_machines.MemberTransfer.PENDING_TARGET_to_CANCELLED]
        distinguishing_aspect: |
          Trigger = delinquency sweep (different trigger from the sibling's remittance
          post). Chain of depth 3: sweep -> notice SENT -> EXPIRED -> member DELINQUENT
          -> SUSPENDED -> the member's PENDING_TARGET transfer -> CANCELLED (good-standing
          precondition broke mid-flight).
        test_recipe:
          setup:
            - "FLAT local L1 (flat 5000, threshold 10000, grace 2, cure 10); second local L2 as transfer target; self-pay member M"
            - "Transfer for M to L2 effective 2026-09, certified to PENDING_TARGET while M is in good standing"
            - "Runs 2026-05..07 -> arrears 15000; sweep at 2026-08-01 -> DELINQUENT + DRAFT notice; notice sent (deadline 2026-08-11)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc2: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Trina Transfer", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", mem_v: "$.data.version" }
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${loc2}", effective_period: "2026-09", expected_member_version: "${mem_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { tr: "$.data.id" }
            - { call: "POST /api/transfers/${tr}/certify", payload: {}, as: OfficeClerk }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-07" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/transfers/${tr}"
              as: OfficeClerk
              captures: { tr_mid: "$.data.status" }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { nid: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${nid}/send", payload: {}, as: OfficeClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { m_status: "$.data.status", m_susp: "$.data.suspension_count" }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { n_status: "$.data[0].status" }
            - call: "GET /api/transfers/${tr}"
              as: OfficeClerk
              captures: { tr_end: "$.data.status" }
          assert:
            - "mid-chain: delinquency alone does NOT cancel the transfer — ${tr_mid} == PENDING_TARGET after the first sweep"
            - "hop 1-2: ${n_status} == EXPIRED and ${m_status} == SUSPENDED with ${m_susp} == 1"
            - "hop 3 (cascade): ${tr_end} == CANCELLED — caused by the suspension, not by the sweep directly"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: post_state_vs_temporal_priority
        grounds: ["validations[priority=6]", "validations[priority=8]", "errors[ERR_REMITTANCE_NOT_RECONCILED]", "errors[ERR_PRIOR_PERIOD_UNPOSTED]"]
        distinguishing_aspect: |
          Pair = state vs business_temporal. Posting remittance R2 (period 2026-09)
          while R2 is still RECEIVED (state violation) AND the same employer's 2026-08
          remittance is unposted (temporal violation) MUST surface the state error
          ERR_REMITTANCE_NOT_RECONCILED because priority 6 precedes priority 8.
        test_recipe:
          setup:
            - "PCT local; employer E; two remittances: R1 (2026-08) and R2 (2026-09), both RECEIVED with zero lines (header 0 balanced)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 0 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { r1: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-09", remitted_cents: 0 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /api/remittances/${r2}/post"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_REMITTANCE_NOT_RECONCILED (state, priority 6) — NOT ERR_PRIOR_PERIOD_UNPOSTED (temporal, priority 8), although both conditions hold"

      - name: reconcile_referential_vs_fiscal_priority
        grounds: ["validations[priority=7]", "validations[priority=10]", "errors[ERR_MEMBER_NOT_ON_ROSTER]", "errors[ERR_REMITTANCE_UNBALANCED]"]
        distinguishing_aspect: |
          Pair = business_referential vs business_fiscal (different pair from the
          sibling's state/temporal). Reconciling a remittance whose line member turned
          WITHDRAWN after line creation (referential violation) AND whose header does
          not match its lines (fiscal violation) MUST surface ERR_MEMBER_NOT_ON_ROSTER
          because priority 7 precedes priority 10.
        test_recipe:
          setup:
            - "PCT local; employer E; member M on E's roster (no assessments; arrears 0)"
            - "Remittance 2026-08 remitted 999999 with line (M, deducted 1000, gross 1000) added while M was active; M then withdrew (arrears 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Walt Withdraw", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 999999 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 1000, gross_wages_cents: 1000 }
              as: OfficeClerk
            - { call: "POST /api/members/${mem}/withdraw", payload: {}, as: Member, as_user_id: "${mem}" }
          trigger:
            - call: "POST /api/remittances/${rem}/reconcile"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_MEMBER_NOT_ON_ROSTER (referential, priority 7) — NOT ERR_REMITTANCE_UNBALANCED (fiscal, priority 10), although 999999 != 1000 also holds"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_threshold_inclusive_boundary
        grounds: [calculations.delinquency_evaluation, entities.Local.fields.delinquency_threshold_cents, state_machines.Member.ACTIVE_to_DELINQUENT]
        distinguishing_aspect: |
          Metric = arrears_cents vs threshold (inclusive >=), reached via the sweep
          endpoint. Local A at exactly 10000 (== threshold) flips DELINQUENT; Local B
          at 9999 (threshold - 1) stays ACTIVE. Sibling instance exercises a different
          metric (exact payment amount) through a different endpoint (reinstate).
        test_recipe:
          setup:
            - "Local A: FLAT 5000, threshold 10000, grace 2; member MA. Runs 2026-05 + 2026-06 -> arrears exactly 10000 (oldest FINAL 2026-05)"
            - "Local B: FLAT 3333, threshold 10000, grace 2; member MB. Runs 2026-05 + 2026-06 + 2026-07 -> arrears 9999 (oldest FINAL 2026-05)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local A", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { la: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local B", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 3333, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { lb: "$.data.id" }
            - call: "POST /api/locals/${la}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cla: "$.data.id" }
            - call: "POST /api/locals/${lb}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { clb: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${la}", classification_id: "${cla}", full_name: "Edge Ed", member_number: "A-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { ma: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${lb}", classification_id: "${clb}", full_name: "Below Beth", member_number: "B-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mb: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${la}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${lb}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${la}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${lb}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${lb}", period: "2026-07" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${la}" }, as: LocalAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${lb}" }, as: LocalAdmin }
            - call: "GET /api/members/${ma}"
              as: SecretaryTreasurer
              captures: { sta: "$.data.status", ara: "$.data.arrears_cents" }
            - call: "GET /api/members/${mb}"
              as: SecretaryTreasurer
              captures: { stb: "$.data.status", arb: "$.data.arrears_cents" }
          assert:
            - "${ara} == 10000 == threshold and ${sta} == DELINQUENT (boundary is inclusive: >=)"
            - "${arb} == 9999 == threshold - 1 and ${stb} == ACTIVE (no flip below threshold)"

      - name: reinstatement_exact_amount_boundary
        grounds: [calculations.reinstatement_due, state_machines.Member.SUSPENDED_to_ACTIVE, "errors[ERR_REINSTATEMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: |
          Metric = payment amount exactness (must equal arrears + fee to the cent),
          reached via POST /members/{id}/reinstate. 17499 (total - 1) is rejected;
          exactly 17500 reinstates. Different metric and endpoint from the sibling's
          arrears-threshold sweep test.
        test_recipe:
          setup:
            - "FLAT local (flat 5000, threshold 10000, grace 2, cure 10, base fee 2500); self-pay member M"
            - "Runs 2026-05..07 -> arrears 15000; sweep 2026-08-01 -> DELINQUENT + DRAFT; notice sent; clock 2026-08-12; sweep -> SUSPENDED (count 1)"
            - "Quote: arrears 15000 + fee 2500*1 -> total_due 17500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
