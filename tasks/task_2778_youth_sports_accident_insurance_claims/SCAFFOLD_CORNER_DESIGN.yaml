          difficulty_instance: transitive_cascade / cascade_b_catastrophic_payment_exhausts_lifetime_and_rejects_pending_report
          rationale: "That instance asserts the lifetime catastrophic total after an ISSUED payment and the ceiling being honored at exactly cat_lifetime_max_cents."

