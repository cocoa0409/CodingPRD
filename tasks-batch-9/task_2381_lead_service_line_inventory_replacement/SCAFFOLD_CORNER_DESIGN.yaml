              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /lsl/verification-appointments/${a1}/complete"
              payload: { observed_side: "UTILITY", observed_material: "LEAD" }
              as: FieldTechnician
              as_user_id: "${crew}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_APPOINTMENT_STATE_INVALID"
            - "VerificationAppointment.${a1}.state == SCHEDULED and VerificationAppointment.${a1}.emitted_evidence_item_id == null"
            - "ServiceLine.${l1}.inventory_state == UNCLASSIFIED (no cascade fired)"

      - name: no_access_then_reschedule_cycles_the_appointment_and_increments_attempt_count
        claim_type: cyclic
        grounds:
          - state_machines.VerificationAppointment.ON_SITE_to_NO_ACCESS
          - state_machines.VerificationAppointment.NO_ACCESS_to_SCHEDULED
          - entities.VerificationAppointment.fields.attempt_count
        distinguishing_aspect: "SCHEDULED -> ON_SITE -> NO_ACCESS -> SCHEDULED returns the row to SCHEDULED with attempt_count 2, barrier_reason LOCKED_PREMISE retained from the parked attempt, and the new window persisted."
        test_recipe:
          setup:
            - "One appointment moved to ON_SITE then parked at NO_ACCESS with barrier_reason LOCKED_PREMISE (attempt_count is still 1, which is < 3)."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2101004", system_name: "Cycle Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew A", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 1, certified_methods: ["VISUAL_INSPECTION", "POTHOLE"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { a1: $.data.id }
            - call: "POST /lsl/verification-appointments/${a1}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${crew}"
            - call: "POST /lsl/verification-appointments/${a1}/no-access"
              payload: { barrier_reason: "LOCKED_PREMISE" }
              as: FieldTechnician
              as_user_id: "${crew}"
          trigger:
            - call: "POST /lsl/verification-appointments/${a1}/reschedule"
              payload: { window_start_utc: "2026-08-06T09:00:00Z", window_end_utc: "2026-08-06T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP status is 200"
            - "VerificationAppointment.${a1}.state == SCHEDULED"
            - "VerificationAppointment.${a1}.attempt_count == 2"
            - "VerificationAppointment.${a1}.window_start_utc == 2026-08-06T09:00:00Z and VerificationAppointment.${a1}.window_end_utc == 2026-08-06T10:00:00Z"
            - "VerificationAppointment.${a1}.barrier_reason == LOCKED_PREMISE"
            - "VerificationCrew.${crew}.scheduled_appointment_count == 1"

      - name: third_exhausted_attempt_abandons_the_appointment_and_locks_it_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.VerificationAppointment.ON_SITE_to_ABANDONED
          - state_machines.VerificationAppointment.terminal_states
          - validations.priority_55_ERR_APPOINTMENT_STATE_INVALID
        distinguishing_aspect: "The no-access branch taken at attempt_count == 3 lands ABANDONED (not NO_ACCESS), scheduled_appointment_count drops to 0, and a subsequent arrive on the terminal row returns ERR_APPOINTMENT_STATE_INVALID 409."
        test_recipe:
          setup:
