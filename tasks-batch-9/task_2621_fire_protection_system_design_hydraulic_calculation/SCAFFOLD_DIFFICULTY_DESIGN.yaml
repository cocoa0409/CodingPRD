scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 - dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: hazard_demand_area_density_versus_room_design_divergence
        grounds:
          - calculations.hazard_design_demand
          - calculations.hazard_classification
          - entities.HydraulicCalculation.fields.method
          - entities.HydraulicCalculation.fields.room_design_penalty_gpm
          - validations[priority=32]
        distinguishing_aspect: |
          Two calculations over the SAME hazard area diverge only by method: AREA_DENSITY multiplies
          the 1500 sqft design area, ROOM_DESIGN multiplies the 1200 sqft room area, and a room with
          an unprotected opening adds a third result via the 0.25 penalty term - 247.5 vs 198.0 vs
          243.0 gpm of sprinkler flow off one identical density of 0.150.
        test_recipe:
          setup:
            - "Project FP-2602 in TX-AUS, lead engineer Dana Ruiz, reviewer Marisol Vega, no lead-in loss"
            - "Hazard area HA-2 ORDINARY_1 / CLASS_III, storage 8.0 ft, ceiling 12.0 ft, gross 1800 sqft, WET, room 1200 sqft, 2.0 h enclosure, NO unprotected opening -> density 0.150, design area 1500 sqft, hose 250.0 gpm"
            - "Hazard area HA-3 identical to HA-2 but WITH an unprotected room opening"
            - "No calculations exist yet"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2602", building_name: "Balcones Light Industrial", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "INDUSTRIAL", building_height_ft: 24.0, underground_lead_in_loss_psi: 0.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p2: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p2}", label: "Assembly Room 140", hazard_class: "ORDINARY_1", commodity_class: "CLASS_III", storage_height_ft: 8.0, ceiling_height_ft: 12.0, area_sqft: 1800.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 1200.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha2: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p2}", label: "Assembly Room 142", hazard_class: "ORDINARY_1", commodity_class: "CLASS_III", storage_height_ft: 8.0, ceiling_height_ft: 12.0, area_sqft: 1800.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 1200.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: true }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha3: $.data.id }
          trigger:
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p2}", hazard_area_id: "${ha2}", method: "AREA_DENSITY", k_factor: 5.6 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc_area: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p2}", hazard_area_id: "${ha2}", method: "ROOM_DESIGN", k_factor: 5.6 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc_room: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p2}", hazard_area_id: "${ha3}", method: "ROOM_DESIGN", k_factor: 5.6 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc_room_open: $.data.id }
          assert:
            - "HazardArea.${ha2}.effective_hazard_class == ORDINARY_1"
            - "HazardArea.${ha2}.design_density == 0.150"
            - "HazardArea.${ha2}.design_area_sqft == 1500"
            - "HazardArea.${ha2}.hose_allowance_gpm == 250.0"
            - "HydraulicCalculation.${hc_area}.design_flow_gpm == 247.5"
            - "HydraulicCalculation.${hc_area}.room_design_penalty_gpm == 0.0"
            - "HydraulicCalculation.${hc_area}.hazard_total_demand_gpm == 497.5"
            - "HydraulicCalculation.${hc_room}.design_flow_gpm == 198.0"
            - "HydraulicCalculation.${hc_room}.room_design_penalty_gpm == 0.0"
            - "HydraulicCalculation.${hc_room}.hazard_total_demand_gpm == 448.0"
            - "HydraulicCalculation.${hc_area}.hazard_total_demand_gpm - HydraulicCalculation.${hc_room}.hazard_total_demand_gpm == 49.5"
            - "HydraulicCalculation.${hc_room_open}.room_design_penalty_gpm == 45.0"
            - "HydraulicCalculation.${hc_room_open}.design_flow_gpm == 243.0"
            - "HydraulicCalculation.${hc_room_open}.hazard_total_demand_gpm == 493.0"
            - "all three calculations reference hazard areas whose design_density is 0.150, so the divergence comes only from method and room_has_unprotected_opening"

      - name: supply_basis_raw_versus_seasonal_flips_margin_verdict
        grounds:
          - calculations.water_supply_availability
          - entities.WaterSupplyEvaluation.fields.evaluation_basis
          - entities.WaterSupplyEvaluation.fields.margin_verdict
          - state_machines.WaterSupplyEvaluation.EVALUATED_to_SUPERSEDED
          - entities.Project.fields.pump_required_flag
        distinguishing_aspect: |
          One identical FlowTest (80.0 / 64.0 / 2250.0) evaluated twice: RAW_TEST yields
          available_psi_at_demand 65.54 and safety_margin_psi 10.00 -> ADEQUATE, while
          SEASONAL_ADJUSTED derates the basis to 70.0 / 54.0 / 2025.0, yields 52.43 and
          -3.11 -> INADEQUATE_PUMP_REQUIRED. The variant switch alone flips the verdict and
          Project.pump_required_flag.
        test_recipe:
          setup:
            - "Project FP-2601 in TX-AUS with underground_lead_in_loss_psi 5.0, lead engineer Dana Ruiz"
            - "Hazard area HA-1 escalated to EXTRA_1 (density 0.320, design area 2500 sqft, hose 500.0 gpm); calculation HC-1 AREA_DENSITY with design_flow 880.0 and hazard_total_demand 1380.0"
            - "One STANDPIPE_CLASS_I auxiliary system with 2 risers -> 750.0 gpm, so Project.auxiliary_demand_gpm == 750.0"
            - "HC-1 chain closed at iteration 3 against the preliminary RAW_TEST evaluation -> state CONVERGED, required_psi_at_base_of_riser 50.54"
            - "A final RAW_TEST evaluation exists with available 65.54, required 55.54, margin exactly 10.00, verdict ADEQUATE"
            - "Logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 3000.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_prelim: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_raw: $.data.id }
          trigger:
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "SEASONAL_ADJUSTED" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_seasonal: $.data.id }
          assert:
            - "WaterSupplyEvaluation.${wse_raw}.basis_static_psi == 80.0"
            - "WaterSupplyEvaluation.${wse_raw}.basis_residual_psi == 64.0"
            - "WaterSupplyEvaluation.${wse_raw}.basis_test_flow_gpm == 2250.0"
            - "WaterSupplyEvaluation.${wse_raw}.available_psi_at_demand == 65.54"
            - "WaterSupplyEvaluation.${wse_raw}.safety_margin_psi == 10.00"
            - "WaterSupplyEvaluation.${wse_raw}.safety_margin_pct == 15.3"
            - "WaterSupplyEvaluation.${wse_raw}.margin_verdict == ADEQUATE"
            - "WaterSupplyEvaluation.${wse_raw}.state == SUPERSEDED"
            - "WaterSupplyEvaluation.${wse_seasonal}.basis_static_psi == 70.0"
            - "WaterSupplyEvaluation.${wse_seasonal}.basis_residual_psi == 54.0"
            - "WaterSupplyEvaluation.${wse_seasonal}.basis_test_flow_gpm == 2025.0"
            - "WaterSupplyEvaluation.${wse_seasonal}.design_demand_gpm == 2130.0"
            - "WaterSupplyEvaluation.${wse_seasonal}.required_psi_at_demand == 55.54"
            - "WaterSupplyEvaluation.${wse_seasonal}.available_psi_at_demand == 52.43"
            - "WaterSupplyEvaluation.${wse_seasonal}.safety_margin_psi == -3.11"
            - "WaterSupplyEvaluation.${wse_seasonal}.safety_margin_pct == -5.9"
            - "WaterSupplyEvaluation.${wse_seasonal}.margin_verdict == INADEQUATE_PUMP_REQUIRED"
            - "WaterSupplyEvaluation.${wse_seasonal}.pinned_calculation_iteration_count == 3"
            - "WaterSupplyEvaluation.${wse_seasonal}.state == EVALUATED"
            - "Project.${p1}.pump_required_flag == true"
            - "HydraulicCalculation.${hc1}.state == CONVERGED"

  # =====================================================================
  # RULE 2 - combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hazard_classification_plastic_dry_slope_ceiling_four_factor_combination
        grounds:
          - calculations.hazard_classification
          - calculations.hazard_design_demand
          - entities.HazardArea.fields.effective_hazard_class
          - entities.HazardArea.fields.design_area_sqft
          - entities.HazardArea.fields.design_density
        distinguishing_aspect: |
          One classification combines four independent factors in a pinned order - GROUP_A_PLASTIC
          escalation above 12.0 ft storage, the 1.30 DRY multiplier, the 1.30 slope multiplier above
          16.7 pct and the stepwise high-ceiling density bump - and the two areas differ ONLY in
          storage_height_ft (12.5 vs 12.0), which changes the escalation and therefore the base
          density, the base area and the hose allowance at once: 0.300 / 4225 / 500.0 against
          0.200 / 2535 / 250.0.
        test_recipe:
          setup:
            - "Project FP-2603 in TX-AUS, lead engineer Dana Ruiz, reviewer Marisol Vega"
            - "No hazard areas exist yet"
            - "Both hazard areas will be DRY systems with ceiling_slope_pct 20.0 (> 16.7) and ceiling_height_ft 32.0 (> 30.0 but under the first 5 ft step)"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2603", building_name: "Pecan Creek Cold Storage", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "INDUSTRIAL", building_height_ft: 30.0, underground_lead_in_loss_psi: 0.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /hazard-areas"
              payload: { project_id: "${p3}", label: "Plastic Pallet Store 12.5 ft", hazard_class: "ORDINARY_2", commodity_class: "GROUP_A_PLASTIC", storage_height_ft: 12.5, ceiling_height_ft: 32.0, area_sqft: 40000.0, sprinkler_system_type: "DRY", ceiling_slope_pct: 20.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha_hi: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p3}", label: "Plastic Pallet Store 12.0 ft", hazard_class: "ORDINARY_2", commodity_class: "GROUP_A_PLASTIC", storage_height_ft: 12.0, ceiling_height_ft: 32.0, area_sqft: 40000.0, sprinkler_system_type: "DRY", ceiling_slope_pct: 20.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha_lo: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p3}", hazard_area_id: "${ha_hi}", method: "AREA_DENSITY", k_factor: 11.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc_hi: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p3}", hazard_area_id: "${ha_lo}", method: "AREA_DENSITY", k_factor: 11.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc_lo: $.data.id }
          assert:
            - "HazardArea.${ha_hi}.effective_hazard_class == EXTRA_1"
            - "HazardArea.${ha_hi}.design_density == 0.300"
            - "HazardArea.${ha_hi}.design_area_sqft == 4225"
            - "HazardArea.${ha_hi}.hose_allowance_gpm == 500.0"
            - "HazardArea.${ha_lo}.effective_hazard_class == ORDINARY_2"
            - "HazardArea.${ha_lo}.design_density == 0.200"
            - "HazardArea.${ha_lo}.design_area_sqft == 2535"
            - "HazardArea.${ha_lo}.hose_allowance_gpm == 250.0"
            - "HydraulicCalculation.${hc_hi}.design_flow_gpm == 1394.3"
            - "HydraulicCalculation.${hc_hi}.hazard_total_demand_gpm == 1894.3"
            - "HydraulicCalculation.${hc_lo}.design_flow_gpm == 557.7"
            - "HydraulicCalculation.${hc_lo}.hazard_total_demand_gpm == 807.7"
            - "neither design_area_sqft is capped by area_sqft 40000.0, so both multipliers are visible in the stored value"

      - name: fire_pump_sizing_catalogue_step_churn_and_150_pct_combination
        grounds:
          - calculations.fire_pump_sizing
          - calculations.auxiliary_system_demand
          - calculations.water_supply_availability
          - entities.FirePump.fields.sizing_verdict
          - concurrency_rules[pump-size-stale-evaluation]
        distinguishing_aspect: |
          The pump verdict combines five factors whose interaction cannot be shortcut: the catalogue
          rating 1000 selected as min{r >= design_demand 897.5}, the suction taken AT THAT RATED FLOW
          (73.07 psi) and not at the 897.5 gpm demand (79.77 psi), the ceil-to-5 rated pressure 50,
          the churn point 180.0 psi and the 150 pct point. Taking suction at the demand instead would
          yield rated_pressure_psi 40, churn 166.0 and the verdict INSUFFICIENT_AT_150_PCT rather than
          the correct REQUIRES_PRESSURE_RELIEF_VALVE.
        test_recipe:
          setup:
            - "Project FP-2602 in TX-AUS with underground_lead_in_loss_psi 0.0, lead engineer Dana Ruiz"
            - "Hazard area HA-2 ORDINARY_1 / CLASS_III -> density 0.150, design area 1500 sqft, hose 250.0 gpm"
            - "One STANDPIPE_CLASS_II auxiliary system with 5 risers -> capped at 400.0 gpm, so Project.auxiliary_demand_gpm == 400.0"
            - "Calculation HC-2 AREA_DENSITY k 5.6 -> design_flow 247.5, hazard_total_demand 497.5; chain closed at iteration 3 with required_psi_at_base_of_riser 109.20"
            - "Flow test H-31 110.0 / 50.0 / 1300.0 witnessed 2026-06-02T16:00:00Z"
            - "The newest EVALUATED supply evaluation is INADEQUATE_PUMP_REQUIRED with design_demand_gpm 897.5, required_psi_at_demand 109.20, available 79.77 and pump_sized false"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2602", building_name: "Balcones Light Industrial", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "INDUSTRIAL", building_height_ft: 24.0, underground_lead_in_loss_psi: 0.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p2: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p2}", label: "Assembly Room 140", hazard_class: "ORDINARY_1", commodity_class: "CLASS_III", storage_height_ft: 8.0, ceiling_height_ft: 12.0, area_sqft: 1800.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 1200.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha2: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p2}", system_type: "STANDPIPE_CLASS_II", label: "Hose station risers", riser_count: 5 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux2: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p2}", hazard_area_id: "${ha2}", method: "AREA_DENSITY", k_factor: 5.6 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc2: $.data.id }
            - call: "POST /hydraulic-calculations/${hc2}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "1.25", length_ft: 100.0, fitting_equivalent_ft: 30.0, flow_gpm: 30.0, elevation_change_ft: 20.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc2}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "2", length_ft: 120.0, fitting_equivalent_ft: 25.0, flow_gpm: 160.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p2}", hydrant_tag: "H-31", static_psi: 110.0, residual_psi: 50.0, flow_gpm: 1300.0, tested_at: "2026-06-02T16:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft2: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p2}", flow_test_id: "${ft2}", governing_hydraulic_calculation_id: "${hc2}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_pre: $.data.id }
            - call: "POST /hydraulic-calculations/${hc2}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "3", length_ft: 220.0, fitting_equivalent_ft: 40.0, flow_gpm: 247.5, elevation_change_ft: 25.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p2}", flow_test_id: "${ft2}", governing_hydraulic_calculation_id: "${hc2}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_final: $.data.id, wse_final_v: $.data.version }
          trigger:
            - call: "POST /fire-pumps"
              payload: { project_id: "${p2}", water_supply_evaluation_id: "${wse_final}", model_tag: "VT-1000-50", expected_water_supply_evaluation_version: "${wse_final_v}" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { fp1: $.data.id }
          assert:
            - "AuxiliarySystem.${aux2}.demand_gpm == 400.0"
            - "HydraulicCalculation.${hc2}.required_psi_at_base_of_riser == 109.20"
            - "HydraulicCalculation.${hc2}.state == PRESSURE_DEFICIENT"
            - "HydraulicCalculation.${hc2}.deficiency_psi == 29.43"
            - "WaterSupplyEvaluation.${wse_final}.design_demand_gpm == 897.5"
            - "WaterSupplyEvaluation.${wse_final}.available_psi_at_demand == 79.77"
            - "WaterSupplyEvaluation.${wse_final}.margin_verdict == INADEQUATE_PUMP_REQUIRED"
            - "FirePump.${fp1}.rated_flow_gpm == 1000.0"
            - "FirePump.${fp1}.suction_psi_at_rated == 73.07"
            - "FirePump.${fp1}.required_discharge_psi == 119.20"
