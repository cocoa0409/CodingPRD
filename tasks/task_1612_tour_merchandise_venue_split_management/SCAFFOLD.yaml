# =============================================================================
# PRD Benchmark Seed Tables — Tour Merchandise & Venue Split Management
# =============================================================================

scenario: |
  Tour Merchandise & Venue Split Management (tour merchandise company): merch
  inventory allocation by city & size curve, price setting & venue commission
  rates, seller staffing & counting in/out per show, sales reconciliation & cash
  handling, restock shipments & tour routing, online store & bundle integration,
  unsold inventory return & liquidation, artist royalty & licensing splits

domain_name: tour-merch-venue-splits
api_prefix: /merch

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tour name" }
      - { name: artist_name, type: string, source: input, description: "Headlining artist" }
      - { name: default_size_curve, type: object, source: input, default: "{\"S\":1,\"M\":2,\"L\":2,\"XL\":1}", description: "Default size weights for allocation splits; keys subset of {S,M,L,XL}; non-negative integers; at least one positive", constraints: "integer weights >= 0; at least one weight > 0" }
      - { name: cash_variance_tolerance_cents, type: integer, source: input, default: 1000, description: "Per-session |cash variance| at or below this verifies without override", constraints: ">= 0" }
      - { name: standard_rate_bps, type: integer, source: input, description: "Artist royalty rate on royalty base, basis points", constraints: "0..10000" }
      - { name: tier_threshold_cents, type: integer, source: input, description: "Show net_to_tour threshold above which tier_bonus_bps applies marginally", constraints: ">= 0" }
      - { name: tier_bonus_bps, type: integer, source: input, description: "Additional bps applied to the portion of net_to_tour strictly above tier_threshold_cents", constraints: "0..10000" }
      - { name: licensed_flat_per_unit_cents, type: integer, source: input, description: "Licensing minimum per unit sold of a LICENSED product", constraints: ">= 0" }
      - { name: licensed_rate_bps, type: integer, source: input, description: "Licensing percentage alternative for LICENSED products, basis points", constraints: "0..10000" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | CLOSED; initial PLANNING", constraints: "PLANNING|ACTIVE|CLOSED" }
      - { name: royalty_payable_cents, type: integer, source: computed, description: "Sum over FINALIZED Settlements of (artist_royalty_cents + licensing_cents) plus sum over FULFILLED OnlineOrders of (artist_royalty_final_cents + licensing_final_cents)" }

  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> Tour.id; owning tour" }
      - { name: city, type: string, source: input, description: "Show city" }
      - { name: venue_name, type: string, source: input, description: "Venue name; one non-CANCELLED show per venue per calendar date" }
      - { name: show_date, type: datetime, source: input, description: "Show date/time ISO8601 UTC; venue conflict and seller double-booking compare the calendar-date portion" }
      - { name: commission_mode, type: enum, source: input, description: "FLAT | TIERED venue commission mode", constraints: "FLAT|TIERED" }
      - { name: flat_commission_bps, type: integer, source: input, description: "Required iff commission_mode=FLAT; single rate on gross", constraints: "0..10000; null when TIERED" }
      - { name: commission_tiers, type: array, source: input, description: "Required iff commission_mode=TIERED: [{up_to_cents: integer|null, rate_bps: integer}] ascending by up_to_cents, exactly one trailing null up_to_cents tier", constraints: "null when FLAT" }
      - { name: size_curve, type: object, source: input, default: null, description: "Optional per-show size weights overriding tour default at allocation generation; same key rules as Tour.default_size_curve" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | RECONCILING | SETTLED | CLOSED | CANCELLED; initial SCHEDULED", constraints: "SCHEDULED|OPEN|RECONCILING|SETTLED|CLOSED|CANCELLED" }
      - { name: settlement_id, type: string, source: system, default: null, description: "FK -> Settlement.id; set when begin-reconciliation auto-creates the Settlement (1:1)" }
      - { name: closeout_credit_cents, type: integer, source: system, default: null, description: "actual_proceeds_cents - handling_fee_cents, recorded at close-out" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> Tour.id; owning tour" }
      - { name: sku, type: string, source: input, description: "Merchant SKU label" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: product_type, type: enum, source: input, description: "REGULAR | BUNDLE; immutable after creation", constraints: "REGULAR|BUNDLE" }
      - { name: royalty_treatment, type: enum, source: input, description: "STANDARD | LICENSED; LICENSED adds a per-unit-vs-percentage licensing split", constraints: "STANDARD|LICENSED" }
      - { name: sized, type: boolean, source: input, default: true, description: "true => allocations/orders use sizes S|M|L|XL; false => single OS size" }
      - { name: base_price_cents, type: integer, source: input, description: "Online list price; also the reference price for show price sanity", constraints: "> 0" }
      - { name: bundle_components, type: array, source: input, default: null, description: "Required iff product_type=BUNDLE: [{component_product_id, qty_per_bundle}]; components must be REGULAR, sized=false, same tour, no self-reference, no nested bundles", constraints: "null for REGULAR" }
      - { name: initial_stock_by_size, type: object, source: input, default: "{}", description: "Warehouse starting stock map size->units; sized product keys subset of {S,M,L,XL}, non-sized product key OS only; values >= 0" }
      - { name: warehouse_stock_by_size, type: object, source: computed, description: "initial_stock_by_size - dispatched WAREHOUSE-origin shipment lines (net of cancel restores) - FULFILLED online order units (bundle: component units) + RETURN units credited at close-out" }

  - name: ShowProduct
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be REGULAR and in the show's tour" }
      - { name: price_cents, type: integer, source: input, description: "At-show unit price; pinned onto SaleRecords at sale time", constraints: "> 0" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: size, type: enum, source: system, description: "S | M | L | XL | OS", constraints: "S|M|L|XL|OS" }
      - { name: quantity_allocated, type: integer, source: system, description: "Units allocated to this show+product+size (set by generate, incremented by shipment receipt)", constraints: ">= 0" }
      - { name: quantity_sold, type: integer, source: computed, description: "Sum of quantity over ACTIVE SaleRecords with this allocation_id" }
      - { name: quantity_returned, type: integer, source: system, default: 0, description: "Units returned to warehouse at close-out" }
      - { name: quantity_liquidated, type: integer, source: system, default: 0, description: "Units liquidated at close-out" }
      - { name: quantity_shrunk, type: integer, source: system, default: 0, description: "Residual write-off at close-out: quantity_allocated - quantity_sold - quantity_returned - quantity_liquidated at credit time" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "quantity_allocated - quantity_sold - quantity_returned - quantity_liquidated - quantity_shrunk" }

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> Tour.id; sellers are rostered per tour" }
      - { name: display_name, type: string, source: input, description: "Seller display name" }
      - { name: seller_code, type: string, source: input, description: "Human seller code (badge number)" }

  - name: SellerSession
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show must be OPEN" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; seller must belong to the show's tour and have no other non-CANCELLED session on the same calendar date" }
      - { name: cash_float_cents, type: integer, source: input, description: "Count-in cash drawer float", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTED_OUT | VERIFIED | LOCKED; initial OPEN", constraints: "OPEN|COUNTED_OUT|VERIFIED|LOCKED" }
      - { name: counted_cash_cents, type: integer, source: system, default: null, description: "Count-out drawer total recorded at count-out; cleared to null on verify REJECT" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "cash_float_cents + sum of gross_cents over ACTIVE SaleRecords of this session with tender=CASH" }
      - { name: cash_variance_cents, type: integer, source: computed, default: null, description: "counted_cash_cents - expected_cash_cents, computed at count-out and recomputed on any void while counted out; null until first count-out and after verify REJECT" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the verifier; must differ from seller_id (segregation of duties)" }
      - { name: recount_count, type: integer, source: system, default: 0, description: "Number of verify-REJECT recount loops" }

  - name: SaleRecord
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> SellerSession.id; session must be OPEN" }
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; must belong to the session's show" }
      - { name: show_id, type: string, source: system, description: "FK -> Show.id; denormalized from session" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; denormalized from allocation" }
      - { name: quantity, type: integer, source: input, description: "Units sold", constraints: "> 0" }
      - { name: tender, type: enum, source: input, description: "CASH | CARD; only CASH enters the drawer", constraints: "CASH|CARD" }
      - { name: unit_price_cents, type: integer, source: system, description: "Pinned from ShowProduct.price_cents at sale time; later price changes never rewrite it" }
      - { name: gross_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED; initial ACTIVE", constraints: "ACTIVE|VOIDED" }
      - { name: void_reason, type: string, source: system, default: null, description: "Reason recorded at void" }
      - { name: voided_by_user_id, type: string, source: system, default: null, description: "X-User-ID that voided the record" }

  - name: OnlineOrder
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> Tour.id; tour must be ACTIVE" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; REGULAR or BUNDLE" }
      - { name: size, type: enum, source: input, default: null, description: "Required iff product.sized=true (then S|M|L|XL); must be null for non-sized and BUNDLE products", constraints: "S|M|L|XL|null" }
      - { name: quantity, type: integer, source: input, constraints: "> 0", description: "Units ordered" }
      - { name: unit_price_cents, type: integer, source: system, description: "Pinned from Product.base_price_cents at creation" }
      - { name: gross_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: artist_royalty_provisional_cents, type: integer, source: computed, description: "At creation: round_half_up(gross_cents * tour.standard_rate_bps / 10000) using the tour config in effect at creation" }
      - { name: licensing_provisional_cents, type: integer, source: computed, description: "At creation: 0 for STANDARD; for LICENSED max(licensed_flat_per_unit_cents * quantity, round_half_up(licensed_rate_bps * gross_cents / 10000))" }
      - { name: artist_royalty_final_cents, type: integer, source: computed, default: null, description: "Recomputed at fulfill with the tour config in effect at fulfillment time" }
      - { name: licensing_final_cents, type: integer, source: computed, default: null, description: "Recomputed at fulfill with the tour config in effect at fulfillment time" }
      - { name: status, type: enum, source: system, description: "PLACED | FULFILLED | CANCELLED; initial PLACED", constraints: "PLACED|FULFILLED|CANCELLED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id; unique — exactly one Settlement per show, auto-created at begin-reconciliation" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | RECONCILED | DISPUTED | FINALIZED; initial PROVISIONAL", constraints: "PROVISIONAL|RECONCILED|DISPUTED|FINALIZED" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "At creation: sum over the show's sessions of (counted_cash_cents - cash_float_cents) plus CARD gross of ACTIVE SaleRecords of the show" }
      - { name: venue_commission_provisional_cents, type: integer, source: computed, description: "Commission formula applied to provisional_gross_cents at creation" }
      - { name: final_gross_cents, type: integer, source: computed, default: null, description: "At reconcile/resolve: sum of gross_cents over ACTIVE SaleRecords of the show (both tenders)" }
      - { name: venue_commission_final_cents, type: integer, source: computed, default: null, description: "Commission formula applied to final_gross_cents" }
      - { name: net_to_tour_cents, type: integer, source: computed, default: null, description: "final_gross_cents - venue_commission_final_cents (exact subtraction, no rounding)" }
      - { name: artist_royalty_cents, type: integer, source: computed, default: null, description: "Tiered marginal royalty on net_to_tour_cents using the pinned royalty snapshot" }
      - { name: licensing_cents, type: integer, source: computed, default: null, description: "Sum per LICENSED product sold at the show of max(pinned flat per unit * units, round_half_up(pinned licensed bps * product show gross / 10000))" }
      - { name: company_share_cents, type: integer, source: computed, default: null, description: "net_to_tour_cents - artist_royalty_cents - licensing_cents (exact)" }
      - { name: pinned_standard_rate_bps, type: integer, source: system, description: "Royalty snapshot pinned from the Tour at Settlement creation; refreshed by rebase-royalty" }
      - { name: pinned_tier_threshold_cents, type: integer, source: system, description: "Pinned snapshot field" }
      - { name: pinned_tier_bonus_bps, type: integer, source: system, description: "Pinned snapshot field" }
      - { name: pinned_licensed_flat_per_unit_cents, type: integer, source: system, description: "Pinned snapshot field" }
      - { name: pinned_licensed_rate_bps, type: integer, source: system, description: "Pinned snapshot field" }
      - { name: reconciled_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Accountant who last reconciled/resolved; finalize requires a different Accountant (segregation of duties)" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason recorded on the latest dispute" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> Tour.id" }
      - { name: origin_type, type: enum, source: input, description: "WAREHOUSE | SHOW", constraints: "WAREHOUSE|SHOW" }
      - { name: origin_show_id, type: string, source: input, default: null, description: "FK -> Show.id; required iff origin_type=SHOW, must be null otherwise; must differ from destination_show_id" }
      - { name: destination_show_id, type: string, source: input, description: "FK -> Show.id; show receiving the restock" }
      - { name: lines, type: array, source: input, description: "[{product_id, size, quantity}]; quantity > 0; size must be a valid size for the product (S|M|L|XL when sized, OS when not); BUNDLE products are not shippable" }
      - { name: status, type: enum, source: system, description: "DRAFT | DISPATCHED | RECEIVED | CANCELLED; initial DRAFT", constraints: "DRAFT|DISPATCHED|RECEIVED|CANCELLED" }
      - { name: dispatched_by_user_id, type: string, source: system, default: null, description: "X-User-ID that dispatched; receive must use a different X-User-ID (segregation of duties)" }
      - { name: dispatched_at, type: datetime, source: system, default: null, description: "Logical clock timestamp at dispatch" }
      - { name: received_by_user_id, type: string, source: system, default: null, description: "X-User-ID that received the shipment" }
# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /merch/tours/{id}/activate"
        actor: TourManager
        preconditions:
          - "Tour must be PLANNING (ERR_INVALID_TOUR_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /merch/tours/{id}/close"
        actor: TourManager
        preconditions:
          - "Every Show of the tour must be in a terminal state (CLOSED or CANCELLED) (ERR_SHOWS_NOT_TERMINAL)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (automatic when a Show close-out leaves no non-terminal Shows in the tour)"
        actor: system
        preconditions:
          - "The closing Show was the last Show with status not in {CLOSED, CANCELLED}"
        side_effects: []

  - entity: Show
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /merch/shows/{id}/open"
        actor: TourManager
        preconditions:
          - "Show must be SCHEDULED (ERR_INVALID_SHOW_STATE)"
          - "Parent Tour must be ACTIVE (ERR_TOUR_NOT_ACTIVE)"
        side_effects: []
      - from: OPEN
        to: RECONCILING
        trigger: "POST /merch/shows/{id}/begin-reconciliation"
        actor: TourManager
        preconditions:
          - "Show must be OPEN (ERR_INVALID_SHOW_STATE)"
          - "Every SellerSession of the show must be COUNTED_OUT or VERIFIED (ERR_UNRESOLVED_SESSIONS)"
        side_effects:
          - "Auto-create the show's Settlement in PROVISIONAL: compute provisional_gross_cents and venue_commission_provisional_cents, and pin the tour's current royalty config into pinned_* fields"
          - "Set Show.settlement_id to the new Settlement id"
      - from: RECONCILING
        to: SETTLED
        trigger: "system (automatic when the show's Settlement transitions RECONCILED -> FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every VERIFIED SellerSession of the show transitions to LOCKED (cascade down from the Show transition)"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /merch/shows/{id}/close-out"
        actor: TourManager
        preconditions:
          - "Show must be SETTLED (ERR_INVALID_SHOW_STATE)"
          - "Every Allocation of the show with quantity_on_hand > 0 must appear exactly once in close-out lines (ERR_CLOSEOUT_INCOMPLETE)"
          - "Per line: RETURN + LIQUIDATE quantity for that allocation must be <= quantity_on_hand (ERR_INSUFFICIENT_ALLOCATION)"
          - "handling_fee_cents <= actual_proceeds_cents (ERR_VALIDATION)"
        side_effects:
          - "Each lined Allocation: quantity_returned/quantity_liquidated set from lines; quantity_shrunk = quantity_on_hand - returned - liquidated"
          - "Product.warehouse_stock_by_size increased by RETURN line units (per size)"
          - "Show.closeout_credit_cents = actual_proceeds_cents - handling_fee_cents"
          - "Show -> CLOSED; if it was the tour's last non-terminal Show, Tour auto-transitions ACTIVE -> CLOSED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /merch/shows/{id}/cancel"
        actor: TourManager
        preconditions:
          - "Show must be SCHEDULED (ERR_INVALID_SHOW_STATE; shows that have opened cannot be cancelled)"
        side_effects: []

  - entity: SellerSession
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: COUNTED_OUT
        trigger: "POST /merch/seller-sessions/{id}/count-out"
        actor: Seller
        preconditions:
          - "Session must be OPEN (ERR_SESSION_NOT_OPEN)"
          - "Caller must own the session: X-User-ID == session.seller_id (ERR_NOT_RESOURCE_OWNER)"
          - "Parent Show must be OPEN (ERR_INVALID_SHOW_STATE)"
        side_effects:
          - "counted_cash_cents set from input; cash_variance_cents = counted_cash_cents - expected_cash_cents"
      - from: COUNTED_OUT
        to: VERIFIED
        trigger: "POST /merch/seller-sessions/{id}/verify with decision=APPROVE"
        actor: "Seller | TourManager"
        preconditions:
          - "Session must be COUNTED_OUT (ERR_SESSION_NOT_COUNTED_OUT)"
          - "Segregation of duties: X-User-ID != session.seller_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Parent Show must be OPEN or RECONCILING (ERR_INVALID_SHOW_STATE)"
          - "If |cash_variance_cents| > tour.cash_variance_tolerance_cents: input variance_override must be true AND caller role must be TourManager (ERR_VARIANCE_OVERRIDE_REQUIRED)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
      - from: COUNTED_OUT
        to: OPEN
        trigger: "POST /merch/seller-sessions/{id}/verify with decision=REJECT"
        actor: "Seller | TourManager"
        preconditions:
          - "Session must be COUNTED_OUT (ERR_SESSION_NOT_COUNTED_OUT)"
          - "Segregation of duties: X-User-ID != session.seller_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Parent Show must be OPEN or RECONCILING (ERR_INVALID_SHOW_STATE)"
        side_effects:
          - "recount_count += 1; counted_cash_cents := null; cash_variance_cents := null"
      - from: VERIFIED
        to: LOCKED
        trigger: "system (cascade when the parent Show enters SETTLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: RECONCILED
        trigger: "POST /merch/settlements/{id}/reconcile"
        actor: Accountant
        preconditions:
          - "Settlement must be PROVISIONAL (ERR_INVALID_SETTLEMENT_STATE)"
          - "Every SellerSession of the show must be VERIFIED (ERR_UNRESOLVED_SESSIONS)"
        side_effects:
          - "Compute final_gross_cents, venue_commission_final_cents, net_to_tour_cents, artist_royalty_cents, licensing_cents, company_share_cents from the register (ACTIVE SaleRecords) using the pinned_* royalty snapshot"
          - "reconciled_by_user_id := X-User-ID"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /merch/settlements/{id}/dispute"
        actor: "VenueRep | TourManager"
        preconditions:
          - "Settlement must be RECONCILED (ERR_SETTLEMENT_NOT_RECONCILED)"
        side_effects:
          - "dispute_reason := input reason"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /merch/settlements/{id}/resolve"
        actor: Accountant
        preconditions:
          - "Settlement must be DISPUTED (ERR_INVALID_SETTLEMENT_STATE)"
        side_effects:
          - "Recompute all final_* / royalty / licensing / company_share figures from current register state (picks up audit voids recorded during the dispute)"
          - "reconciled_by_user_id := X-User-ID (the resolver)"
      - from: RECONCILED
        to: FINALIZED
        trigger: "POST /merch/settlements/{id}/finalize"
        actor: Accountant
        preconditions:
          - "Settlement must be RECONCILED (ERR_SETTLEMENT_NOT_RECONCILED)"
          - "Segregation of duties: X-User-ID != reconciled_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Pinned royalty snapshot must equal the tour's current royalty config (ERR_STALE_ROYALTY_CONFIG); remedy is POST /merch/settlements/{id}/rebase-royalty"
        side_effects:
          - "Parent Show auto-transitions RECONCILING -> SETTLED, which cascades every VERIFIED SellerSession to LOCKED"
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "POST /merch/settlements/{id}/rebase-royalty"
        actor: Accountant
        preconditions:
          - "Settlement must be PROVISIONAL, DISPUTED, or RECONCILED (ERR_INVALID_SETTLEMENT_STATE when FINALIZED)"
        side_effects:
          - "pinned_* royalty snapshot := tour's current royalty config (state unchanged)"
      - from: DISPUTED
        to: DISPUTED
        trigger: "POST /merch/settlements/{id}/rebase-royalty"
        actor: Accountant
        preconditions:
          - "Settlement must be PROVISIONAL, DISPUTED, or RECONCILED (ERR_INVALID_SETTLEMENT_STATE when FINALIZED)"
        side_effects:
          - "pinned_* royalty snapshot := tour's current royalty config (state unchanged)"
      - from: RECONCILED
        to: RECONCILED
        trigger: "POST /merch/settlements/{id}/rebase-royalty"
        actor: Accountant
        preconditions:
          - "Settlement must be PROVISIONAL, DISPUTED, or RECONCILED (ERR_INVALID_SETTLEMENT_STATE when FINALIZED)"
        side_effects:
          - "pinned_* royalty snapshot := tour's current royalty config (state unchanged)"
          - "Recompute artist_royalty_cents, licensing_cents, company_share_cents from the unchanged final_gross_cents / venue_commission_final_cents using the new snapshot"

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /merch/shipments/{id}/dispatch"
        actor: TourManager
        preconditions:
          - "Shipment must be DRAFT (ERR_SHIPMENT_NOT_DRAFT)"
          - "Lead time: destination_show.show_date >= dispatched_at + 48 hours (ERR_LEAD_TIME_VIOLATION)"
          - "origin_type=WAREHOUSE: each line <= Product.warehouse_stock_by_size[size] (ERR_INSUFFICIENT_STOCK)"
          - "origin_type=SHOW: each line <= origin Allocation.quantity_on_hand for that product+size (ERR_INSUFFICIENT_ALLOCATION)"
        side_effects:
          - "Decrement the source: warehouse_stock_by_size (WAREHOUSE) or origin-show Allocations' quantity_allocated (SHOW)"
          - "dispatched_by_user_id := X-User-ID; dispatched_at := current logical clock"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /merch/shipments/{id}/receive"
        actor: TourManager
        preconditions:
          - "Shipment must be DISPATCHED (ERR_SHIPMENT_NOT_DISPATCHED)"
          - "Segregation of duties: X-User-ID != dispatched_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Destination Show must be SCHEDULED or OPEN (ERR_INVALID_SHOW_STATE)"
        side_effects:
          - "For each line: upsert the destination-show Allocation for (product, size) — create the row when absent — and increment quantity_allocated by the line quantity"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /merch/shipments/{id}/cancel"
        actor: TourManager
        preconditions:
          - "Shipment must be DRAFT or DISPATCHED (ERR_ALREADY_TERMINAL covers RECEIVED/CANCELLED)"
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /merch/shipments/{id}/cancel"
        actor: TourManager
        preconditions:
          - "Shipment must be DRAFT or DISPATCHED (ERR_ALREADY_TERMINAL covers RECEIVED/CANCELLED)"
        side_effects:
          - "Compensation: restore the source — warehouse_stock_by_size += lines (WAREHOUSE origin) or origin-show Allocations' quantity_allocated += lines (SHOW origin)"

  - entity: OnlineOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: FULFILLED
        trigger: "POST /merch/online-orders/{id}/fulfill"
        actor: TourManager
        preconditions:
          - "Order must be PLACED (ERR_ORDER_NOT_PLACED)"
          - "Stock: REGULAR sized — warehouse_stock_by_size[size] >= quantity; non-sized — [OS] >= quantity; BUNDLE — each component warehouse_stock_by_size[OS] >= qty_per_bundle * quantity (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Decrement warehouse_stock_by_size (BUNDLE: decrement each component's OS stock by qty_per_bundle * quantity)"
          - "Recompute artist_royalty_final_cents / licensing_final_cents using the tour royalty config in effect NOW (may differ from the provisional snapshot)"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /merch/online-orders/{id}/cancel"
        actor: TourManager
        preconditions:
          - "Order must be PLACED (ERR_ORDER_NOT_PLACED)"
        side_effects: []

  - entity: SaleRecord
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /merch/sale-records/{id}/void"
        actor: "Seller | Accountant"
        preconditions:
          - "SaleRecord must be ACTIVE (ERR_ALREADY_TERMINAL)"
          - "Seller path: caller X-User-ID == session.seller_id (ERR_NOT_RESOURCE_OWNER) and session must be OPEN (ERR_SESSION_NOT_OPEN)"
          - "Accountant path (audit void): parent Show must be RECONCILING and the Settlement must be PROVISIONAL or DISPUTED (ERR_INVALID_SETTLEMENT_STATE)"
        side_effects:
          - "void_reason / voided_by_user_id recorded"
          - "Allocation.quantity_sold recomputed (ACTIVE records only)"
          - "SellerSession.expected_cash_cents recomputed; if the session is COUNTED_OUT, cash_variance_cents is recomputed against the recorded counted_cash_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: royalty-config-stale-tour
    parent_entity: Tour
    write_endpoint: "PATCH /merch/tours/{id}/royalty-config"
    occ_field: expected_tour_version
    description: |
      Updating a tour's royalty config with an expected_tour_version that no
      longer matches the tour's current version is rejected: another accepted
      write (config patch, activate, close) has advanced the version since the
      caller last observed it, so the caller's view of the royalty terms is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: show-price-stale-version
    parent_entity: ShowProduct
    write_endpoint: "PATCH /merch/show-products/{id}"
    occ_field: expected_show_product_version
    description: |
      Repricing a show product with an expected_show_product_version that no
      longer matches the ShowProduct's current version is rejected: a prior
      accepted reprice advanced the version, so the caller would be editing a
      price row they have not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: size_curve_split
    trigger: "POST /merch/shows/{id}/allocations/generate"
    algorithm: rounding_allocation
    formula: |
      effective_curve = show.size_curve if not null else tour.default_size_curve
      Non-sized product (sized=false): create exactly one Allocation row with
        size=OS and quantity_allocated = total_units; the curve is not consulted.
      Sized product:
        W = sum of weights over the curve's keys
        for each size s with weight w_s > 0: raw_s = total_units * w_s / W (exact rational)
        floor_s = floor(raw_s)
        remainder = total_units - sum(floor_s)
        Distribute remainder one unit at a time, ordered by fractional part
        (raw_s - floor_s) DESCENDING; ties broken by ascending size order
        S < M < L < XL < OS.
        Create one Allocation row per size with weight > 0, quantity_allocated = floor_s (+1 if awarded a remainder unit). Sizes with weight 0 get no row.
    input_set: "Effective size curve for the show; total_units from the request"
    constants: {}
    precision: "integer units; exact rational comparison for fractional parts"
    note: "Rounding order is pinned: floor first, then largest-remainder distribution with the fixed tie order. Rounding each raw_s independently (round-half-up per size) is a different valid reading that can leave the total off by one — the pinned algorithm always sums exactly to total_units."

  - name: venue_commission
    trigger: "Settlement creation (provisional variant) and reconcile/resolve (final variant)"
    algorithm: tiered_pricing
    formula: |
      rate_fn(base):
        FLAT mode: commission = round_half_up(base * flat_commission_bps / 10000)
        TIERED mode: marginal application over commission_tiers, in ascending
        up_to_cents order: portion_i = max(0, min(base, up_to_i) - floor_{i-1});
        commission_i = round_half_up(portion_i * rate_bps_i / 10000);
        commission = sum(commission_i). Rounding is pinned: round each tier
        portion to cents FIRST, then sum (not sum-then-round).
      provisional variant (at Settlement creation):
        provisional_gross_cents = sum over the show's sessions of
          (counted_cash_cents - cash_float_cents)   # what is in the drawers
          + sum of gross_cents over ACTIVE SaleRecords of the show with tender=CARD
        venue_commission_provisional_cents = rate_fn(provisional_gross_cents)
      final variant (at reconcile and re-computed at resolve):
        final_gross_cents = sum of gross_cents over ACTIVE SaleRecords of the show (both tenders)   # what the register says
        venue_commission_final_cents = rate_fn(final_gross_cents)
    input_set: "Provisional: sessions in COUNTED_OUT/VERIFIED and ACTIVE CARD SaleRecords. Final: ACTIVE SaleRecords of the show only (VOIDED excluded, both tenders)."
    constants: {}
    precision: "integer cents, round_half_up per application"
    variants:
      - name: provisional
        when: "Settlement auto-creation at begin-reconciliation"
        difference: "Base is drawer cash (counted minus float) plus card sales; diverges from final whenever a session's counted cash differs from its recorded cash sales"
      - name: final
        when: "reconcile / resolve"
        difference: "Base is register sales only (ACTIVE SaleRecords); drawer over/under-counts and audit voids recorded after creation move final away from provisional"

  - name: artist_royalty_tiered
    trigger: "Settlement reconcile / resolve"
    algorithm: tiered_pricing
    formula: |
      base = net_to_tour_cents
      T = pinned_tier_threshold_cents; std = pinned_standard_rate_bps; bonus = pinned_tier_bonus_bps
      if base <= T:  artist_royalty_cents = round_half_up(base * std / 10000)
      else:          artist_royalty_cents = round_half_up(T * std / 10000) + round_half_up((base - T) * (std + bonus) / 10000)
      Boundary is exact: at base == T the bonus portion is 0 (bonus applies only to the amount strictly above T). Segment-first rounding is pinned: round each segment, then sum.
    input_set: "Settlement net_to_tour_cents (final variant) and the pinned royalty snapshot"
    constants: {}
    precision: "integer cents, round_half_up per segment"

  - name: licensing_split
    trigger: "Settlement reconcile / resolve"
    algorithm: constraint_propagation
    formula: |
      for each LICENSED product p with ACTIVE SaleRecords at this show:
        qty_p = sum of quantity over p's ACTIVE SaleRecords at the show
        gross_p = sum of gross_cents over p's ACTIVE SaleRecords at the show
        licensing_p = max(pinned_licensed_flat_per_unit_cents * qty_p,
                          round_half_up(pinned_licensed_rate_bps * gross_p / 10000))
      licensing_cents = sum(licensing_p)   # per-product max FIRST, then sum
      company_share_cents = net_to_tour_cents - artist_royalty_cents - licensing_cents
    input_set: "ACTIVE SaleRecords of the show grouped by product; only products with royalty_treatment=LICENSED contribute"
    constants: {}
    precision: "integer cents, round_half_up on the percentage arm only"

  - name: session_cash_reconciliation
    trigger: "SaleRecord create/void; SellerSession count-out"
    algorithm: aggregation
    formula: |
      expected_cash_cents = cash_float_cents + sum of gross_cents over the session's ACTIVE SaleRecords with tender=CASH
      cash_variance_cents = counted_cash_cents - expected_cash_cents   (set at count-out; recomputed if an audit void lands while COUNTED_OUT)
      Verify gate: |cash_variance_cents| <= tour.cash_variance_tolerance_cents verifies freely;
      exactly == tolerance passes; tolerance + 1 requires variance_override by a TourManager.
    input_set: "ACTIVE SaleRecords of the session with tender=CASH only (VOIDED and CARD excluded)"
    constants: {}
    precision: "integer cents (exact)"

  - name: online_royalty
    trigger: "OnlineOrder creation (provisional) and fulfill (final)"
    algorithm: threshold
    formula: |
      artist arm (all treatments): round_half_up(gross_cents * tour.standard_rate_bps / 10000)
      licensing arm (LICENSED products only): max(tour.licensed_flat_per_unit_cents * quantity,
        round_half_up(tour.licensed_rate_bps * gross_cents / 10000)); STANDARD products: 0
      provisional_* fields use the tour config in effect at creation;
      final_* fields are recomputed at fulfill with the tour config in effect at that moment.
    input_set: "The order itself; tour royalty config snapshot at creation vs at fulfill"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "order creation"
        difference: "Uses tour config at creation time; stored on artist_royalty_provisional_cents / licensing_provisional_cents"
      - name: final
        when: "fulfill"
        difference: "Recomputed with the config current at fulfillment; an intervening royalty-config PATCH makes final diverge from provisional"

  - name: warehouse_stock_reconciliation
    trigger: "Shipment dispatch / cancel-of-dispatched / OnlineOrder fulfill / Show close-out"
    algorithm: aggregation
    formula: |
      warehouse_stock_by_size[product][s] =
          initial_stock_by_size[s]
        - sum of lines[s] over DISPATCHED or RECEIVED WAREHOUSE-origin shipments (CANCELLED-from-DRAFT never decremented; DISPATCHED-then-CANCELLED decremented then restored)
        - sum over FULFILLED OnlineOrders: quantity (REGULAR, size s) or qty_per_bundle * quantity (BUNDLE components, OS)
        + sum of RETURN line units credited at show close-out
    input_set: "Shipments by status, FULFILLED OnlineOrders (PLACED/CANCELLED excluded), close-out RETURN lines"
    constants: {}
    precision: "integer units (exact)"

  - name: closeout_credit
    trigger: "POST /merch/shows/{id}/close-out"
    algorithm: waterfall_allocation
    formula: |
      For each Allocation row of the show with quantity_on_hand > 0 (must each appear once in lines):
        returned   = line quantity where action=RETURN
        liquidated = line quantity where action=LIQUIDATE
        shrunk     = quantity_on_hand - returned - liquidated   (>= 0 enforced by ERR_INSUFFICIENT_ALLOCATION)
      Conservation invariant (units): quantity_allocated == quantity_sold + quantity_returned + quantity_liquidated + quantity_shrunk for every allocation of the show after close-out.
      closeout_credit_cents = actual_proceeds_cents - handling_fee_cents
    input_set: "Allocations of the show with quantity_on_hand > 0; request lines and money inputs"
    constants: {}
    precision: "integer cents and units (exact)"

  - name: tour_royalty_rollup
    trigger: "GET /merch/tours/{id} (computed on read)"
    algorithm: aggregation
    formula: |
      royalty_payable_cents =
          sum over the tour's Settlements with status=FINALIZED of (artist_royalty_cents + licensing_cents)
        + sum over the tour's OnlineOrders with status=FULFILLED of (artist_royalty_final_cents + licensing_final_cents)
    input_set: "FINALIZED Settlements and FULFILLED OnlineOrders only (PROVISIONAL/RECONCILED/DISPUTED settlements and PLACED/CANCELLED orders excluded)"
    constants: {}
    precision: "integer cents (exact)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be one of TourManager, Seller, Accountant, VenueRep; for role=Seller the X-User-ID must be the id of an existing Seller"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint per §1.5 roles; ownership rules (Seller acting on own session/records) are enforced here"
    error_id: "ERR_FORBIDDEN_ROLE | ERR_NOT_RESOURCE_OWNER"
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids (and body-supplied FK ids) must exist; validated left-to-right"
    error_id: "ERR_TOUR_NOT_FOUND | ERR_SHOW_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_SHOW_PRODUCT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SELLER_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_ONLINE_ORDER_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 4
    category: state
    check: "Target entity must be in the required state for the operation (per §1.2 preconditions), including cross-entity state gates (e.g., tour ACTIVE to open a show, sessions VERIFIED to reconcile)"
    error_id: "ERR_INVALID_TOUR_STATE | ERR_TOUR_NOT_ACTIVE | ERR_INVALID_SHOW_STATE | ERR_SESSION_NOT_OPEN | ERR_SESSION_NOT_COUNTED_OUT | ERR_UNRESOLVED_SESSIONS | ERR_SETTLEMENT_NOT_RECONCILED | ERR_INVALID_SETTLEMENT_STATE | ERR_SHIPMENT_NOT_DRAFT | ERR_SHIPMENT_NOT_DISPATCHED | ERR_ORDER_NOT_PLACED | ERR_ALREADY_TERMINAL | ERR_SHOWS_NOT_TERMINAL"
    http_status: 409
    applies_to: state-transition and state-gated endpoints
  - priority: 4.5
    category: state
    check: "OCC: expected_<parent>_version must equal the entity's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /merch/tours/{id}/royalty-config, PATCH /merch/show-products/{id}"
  - priority: 5
    category: business_referential
    check: "Cross-references must be coherent: seller.tour_id == show.tour_id (session create); product.tour_id == show.tour_id (show-product create); allocation.show_id == session.show_id (sale create); shipment origin/destination shows belong to shipment.tour_id; bundle components belong to the bundle's tour"
    error_id: ERR_CROSS_TOUR_REFERENCE
    http_status: 422
    applies_to: "POST /merch/seller-sessions, POST /merch/show-products, POST /merch/sale-records, POST /merch/shipments, POST /merch/products"
  - priority: 5.5
    category: business_referential
    check: "Required related configuration must exist: recording a sale requires a ShowProduct price row for (allocation.show_id, allocation.product_id)"
    error_id: ERR_PRICE_NOT_SET
    http_status: 422
    applies_to: "POST /merch/sale-records"
  - priority: 6
    category: business_temporal
    check: "Venue capacity: no two non-CANCELLED shows may share venue_name and the calendar date of show_date (capacity one show per venue per day; adjacent dates are allowed)"
    error_id: ERR_VENUE_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /merch/shows"
  - priority: 6.5
    category: business_temporal
    check: "Seller double-booking: seller must not hold another SellerSession on a show whose show_date calendar date equals this show's date"
    error_id: ERR_SELLER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /merch/seller-sessions"
  - priority: 6.7
    category: business_temporal
    check: "Restock lead time: destination show_date must be >= dispatched_at (current logical clock) + 48 hours; exactly 48h is allowed"
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /merch/shipments/{id}/dispatch"
  - priority: 7
    category: business_constraint
    check: "Uniqueness: one SellerSession per (show_id, seller_id); one ShowProduct per (show_id, product_id); allocation generation allowed only once per (show, product)"
    error_id: "ERR_SESSION_EXISTS | ERR_SHOW_PRODUCT_EXISTS | ERR_ALLOCATIONS_EXIST"
    http_status: 409
    applies_to: "POST /merch/seller-sessions, POST /merch/show-products, POST /merch/shows/{id}/allocations/generate"
  - priority: 7.5
    category: business_constraint
    check: "Config shape: size curves need >= 1 positive integer weight over keys subset {S,M,L,XL}; FLAT shows need flat_commission_bps and null tiers; TIERED shows need an ascending tier list with exactly one trailing null up_to_cents; BUNDLE products need valid components (REGULAR, non-sized, same tour, no self/nested); bundles are not sellable at shows and not shippable"
    error_id: "ERR_INVALID_SIZE_CURVE | ERR_INVALID_COMMISSION_CONFIG | ERR_BUNDLE_COMPONENT_INVALID | ERR_PRODUCT_NOT_SELLABLE_AT_SHOW | ERR_VALIDATION"
    http_status: 400
    applies_to: "POST /merch/tours, POST /merch/shows, POST /merch/products, POST /merch/show-products, POST /merch/shipments, PATCH endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: session verifier X-User-ID != session.seller_id; settlement finalizer X-User-ID != reconciled_by_user_id; shipment receiver X-User-ID != dispatched_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /merch/seller-sessions/{id}/verify, POST /merch/settlements/{id}/finalize, POST /merch/shipments/{id}/receive"
  - priority: 8.5
    category: business_safety
    check: "Cash variance gate: |cash_variance_cents| > tour.cash_variance_tolerance_cents requires variance_override=true AND caller role TourManager at verify"
    error_id: ERR_VARIANCE_OVERRIDE_REQUIRED
    http_status: 409
    applies_to: "POST /merch/seller-sessions/{id}/verify"
  - priority: 9
    category: business_fiscal
    check: "Quantity/stock sufficiency: sale quantity <= allocation.quantity_on_hand; shipment dispatch <= source stock or origin on_hand; close-out lines <= on_hand"
    error_id: "ERR_INSUFFICIENT_ALLOCATION | ERR_INSUFFICIENT_STOCK"
    http_status: 409
    applies_to: "POST /merch/sale-records, POST /merch/shipments/{id}/dispatch, POST /merch/online-orders/{id}/fulfill, POST /merch/shows/{id}/close-out"
  - priority: 9.5
    category: business_fiscal
    check: "Royalty snapshot currency: finalize requires pinned_* == the tour's current royalty config"
    error_id: ERR_STALE_ROYALTY_CONFIG
    http_status: 409
    applies_to: "POST /merch/settlements/{id}/finalize"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Tour ---
  - { method: POST, path: "/merch/tours", description: "Create a tour (royalty config fields are required and become the pinnable snapshot source)", roles: [TourManager], code: 201, input: [name, artist_name, "default_size_curve?", "cash_variance_tolerance_cents?", standard_rate_bps, tier_threshold_cents, tier_bonus_bps, licensed_flat_per_unit_cents, licensed_rate_bps], output: Tour, side_effects: ["status := PLANNING"] }
  - { method: GET, path: "/merch/tours", description: "List tours (paginated)", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["limit?", "offset?"], output: "Tour[]", side_effects: [] }
  - { method: GET, path: "/merch/tours/{id}", description: "Get one tour including computed royalty_payable_cents rollup", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Tour, side_effects: ["tour_royalty_rollup computed on read"] }
  - { method: POST, path: "/merch/tours/{id}/activate", description: "PLANNING -> ACTIVE", roles: [TourManager], code: 200, input: [], output: Tour, side_effects: ["increments Tour.version by 1"] }
  - { method: POST, path: "/merch/tours/{id}/close", description: "ACTIVE -> CLOSED when every show is terminal (CLOSED or CANCELLED)", roles: [TourManager], code: 200, input: [], output: Tour, side_effects: ["increments Tour.version by 1"] }
  - { method: PATCH, path: "/merch/tours/{id}/royalty-config", description: "Update royalty config (OCC-guarded); does not rewrite existing Settlement snapshots — they go stale until rebased", roles: [TourManager], code: 200, input: [standard_rate_bps, tier_threshold_cents, tier_bonus_bps, licensed_flat_per_unit_cents, licensed_rate_bps, expected_tour_version], output: Tour, side_effects: ["increments Tour.version by 1"] }

  # --- Show ---
  - { method: POST, path: "/merch/shows", description: "Create a show; venue+date uniqueness and commission config validated", roles: [TourManager], code: 201, input: [tour_id, city, venue_name, show_date, commission_mode, "flat_commission_bps?", "commission_tiers?", "size_curve?"], output: Show, side_effects: ["status := SCHEDULED"] }
  - { method: GET, path: "/merch/shows", description: "List shows, optionally by tour or by settlement back-link", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["tour_id?", "settlement_id?", "limit?", "offset?"], output: "Show[]", side_effects: [] }
  - { method: GET, path: "/merch/shows/{id}", description: "Get one show", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Show, side_effects: [] }
  - { method: POST, path: "/merch/shows/{id}/open", description: "SCHEDULED -> OPEN; requires tour ACTIVE", roles: [TourManager], code: 200, input: [], output: Show, side_effects: [] }
  - { method: POST, path: "/merch/shows/{id}/begin-reconciliation", description: "OPEN -> RECONCILING; requires all sessions COUNTED_OUT or VERIFIED; auto-creates the PROVISIONAL Settlement with pinned royalty snapshot", roles: [TourManager], code: 200, input: [], output: Show, side_effects: ["create Settlement (PROVISIONAL) with provisional gross/commission and pinned_* snapshot", "set Show.settlement_id"] }
  - { method: POST, path: "/merch/shows/{id}/cancel", description: "SCHEDULED -> CANCELLED (pre-doors cancellation only)", roles: [TourManager], code: 200, input: [], output: Show, side_effects: [] }
  - { method: POST, path: "/merch/shows/{id}/close-out", description: "SETTLED -> CLOSED; records RETURN/LIQUIDATE per allocation, computes shrinkage residual, credits proceeds minus fee, restocks warehouse, auto-closes the tour when this was the last open show", roles: [TourManager], code: 200, input: [lines, actual_proceeds_cents, handling_fee_cents], output: Show, side_effects: ["Allocation quantity_returned/quantity_liquidated/quantity_shrunk set", "warehouse_stock_by_size += RETURN units", "Show.closeout_credit_cents computed", "Tour auto-close check"] }

  # --- Product ---
  - { method: POST, path: "/merch/products", description: "Create a product (REGULAR or BUNDLE; bundle components validated)", roles: [TourManager], code: 201, input: [tour_id, sku, name, product_type, royalty_treatment, base_price_cents, "sized?", "bundle_components?", "initial_stock_by_size?"], output: Product, side_effects: ["warehouse_stock_by_size initialized from initial_stock_by_size"] }
  - { method: GET, path: "/merch/products", description: "List products, optionally by tour", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["tour_id?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/merch/products/{id}", description: "Get one product including computed warehouse_stock_by_size", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Product, side_effects: ["warehouse_stock_reconciliation computed on read"] }

  # --- ShowProduct (price setting) ---
  - { method: POST, path: "/merch/show-products", description: "Set the at-show price for a REGULAR product; one row per (show, product); show must be SCHEDULED", roles: [TourManager], code: 201, input: [show_id, product_id, price_cents], output: ShowProduct, side_effects: [] }
  - { method: GET, path: "/merch/show-products", description: "List price rows, filterable by show and/or product", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["show_id?", "product_id?", "limit?", "offset?"], output: "ShowProduct[]", side_effects: [] }
  - { method: GET, path: "/merch/show-products/{id}", description: "Get one price row", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: ShowProduct, side_effects: [] }
  - { method: PATCH, path: "/merch/show-products/{id}", description: "Reprice (OCC-guarded); allowed while the show is SCHEDULED or OPEN; already-recorded SaleRecords keep their pinned unit_price_cents", roles: [TourManager], code: 200, input: [price_cents, expected_show_product_version], output: ShowProduct, side_effects: ["increments ShowProduct.version by 1"] }

  # --- Allocation ---
  - { method: POST, path: "/merch/shows/{id}/allocations/generate", description: "Split total_units across sizes by the effective size curve (largest-remainder); once per (show, product); show must be SCHEDULED", roles: [TourManager], code: 201, input: [product_id, total_units], output: "Allocation[]", side_effects: ["size_curve_split", "Allocation rows created"] }
  - { method: GET, path: "/merch/allocations", description: "List allocations, filterable by show and/or product", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["show_id?", "product_id?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: GET, path: "/merch/allocations/{id}", description: "Get one allocation with computed quantity_sold and quantity_on_hand", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Allocation, side_effects: [] }

  # --- Seller ---
  - { method: POST, path: "/merch/sellers", description: "Roster a seller on a tour", roles: [TourManager], code: 201, input: [tour_id, display_name, seller_code], output: Seller, side_effects: [] }
  - { method: GET, path: "/merch/sellers", description: "List sellers, optionally by tour", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["tour_id?", "limit?", "offset?"], output: "Seller[]", side_effects: [] }
  - { method: GET, path: "/merch/sellers/{id}", description: "Get one seller", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Seller, side_effects: [] }

  # --- SellerSession ---
  - { method: POST, path: "/merch/seller-sessions", description: "Staff a seller onto an OPEN show with a count-in cash float; one session per (show, seller); cross-tour sellers and same-date double-booking rejected", roles: [TourManager], code: 201, input: [show_id, seller_id, cash_float_cents], output: SellerSession, side_effects: ["status := OPEN"] }
  - { method: GET, path: "/merch/seller-sessions", description: "List sessions, filterable by show and/or seller", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["show_id?", "seller_id?", "limit?", "offset?"], output: "SellerSession[]", side_effects: [] }
  - { method: GET, path: "/merch/seller-sessions/{id}", description: "Get one session with computed expected_cash_cents and cash_variance_cents", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: SellerSession, side_effects: [] }
  - { method: POST, path: "/merch/seller-sessions/{id}/count-out", description: "OPEN -> COUNTED_OUT by the owning seller; records counted drawer cash and computes variance", roles: [Seller], code: 200, input: [counted_cash_cents], output: SellerSession, side_effects: ["session_cash_reconciliation (variance computed)"] }
  - { method: POST, path: "/merch/seller-sessions/{id}/verify", description: "COUNTED_OUT -> VERIFIED (decision=APPROVE) or back to OPEN (decision=REJECT, recount_count++); verifier must differ from the seller (SoD); over-tolerance variance needs TourManager variance_override", roles: [Seller, TourManager], code: 200, input: [decision, "variance_override?"], output: SellerSession, side_effects: ["verified_by_user_id set on APPROVE", "recount fields cleared/incremented on REJECT"] }

  # --- SaleRecord ---
  - { method: POST, path: "/merch/sale-records", description: "Record an at-show sale line against an OPEN session; unit price pinned from the ShowProduct row; overselling the allocation rejected", roles: [Seller], code: 201, input: [session_id, allocation_id, quantity, tender], output: SaleRecord, side_effects: ["Allocation.quantity_sold recomputed", "session_cash_reconciliation (expected_cash)", "unit_price_cents pinned", "gross_cents computed"] }
  - { method: GET, path: "/merch/sale-records", description: "List sale records, filterable by session, show, allocation, or product", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["session_id?", "show_id?", "allocation_id?", "product_id?", "limit?", "offset?"], output: "SaleRecord[]", side_effects: [] }
  - { method: GET, path: "/merch/sale-records/{id}", description: "Get one sale record", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: SaleRecord, side_effects: [] }
  - { method: POST, path: "/merch/sale-records/{id}/void", description: "ACTIVE -> VOIDED; Seller only own session while OPEN; Accountant audit-void only while show RECONCILING and settlement PROVISIONAL or DISPUTED", roles: [Seller, Accountant], code: 200, input: ["void_reason?"], output: SaleRecord, side_effects: ["Allocation.quantity_sold recomputed", "session expected_cash_cents recomputed; variance recomputed when session is COUNTED_OUT"] }

  # --- OnlineOrder ---
  - { method: POST, path: "/merch/online-orders", description: "Place an online order (REGULAR or BUNDLE); unit price pinned from Product.base_price_cents; provisional royalty snapshotted from current tour config; tour must be ACTIVE", roles: [TourManager], code: 201, input: [tour_id, product_id, "size?", quantity], output: OnlineOrder, side_effects: ["online_royalty provisional variant computed"] }
  - { method: GET, path: "/merch/online-orders", description: "List online orders, filterable by tour and/or product", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["tour_id?", "product_id?", "limit?", "offset?"], output: "OnlineOrder[]", side_effects: [] }
  - { method: GET, path: "/merch/online-orders/{id}", description: "Get one online order", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: OnlineOrder, side_effects: [] }
  - { method: POST, path: "/merch/online-orders/{id}/fulfill", description: "PLACED -> FULFILLED; decrements warehouse stock (bundle: component OS stock); recomputes final royalty with current tour config", roles: [TourManager], code: 200, input: [], output: OnlineOrder, side_effects: ["warehouse_stock_reconciliation", "online_royalty final variant computed"] }
  - { method: POST, path: "/merch/online-orders/{id}/cancel", description: "PLACED -> CANCELLED; no stock or royalty effects", roles: [TourManager], code: 200, input: [], output: OnlineOrder, side_effects: [] }

  # --- Settlement ---
  - { method: GET, path: "/merch/settlements", description: "List settlements, optionally by show (1:1, so a show filter returns an array of length 0 or 1)", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["show_id?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/merch/settlements/{id}", description: "Get one settlement", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/merch/settlements/{id}/reconcile", description: "PROVISIONAL -> RECONCILED; requires all sessions VERIFIED; computes final register-based figures with the pinned royalty snapshot", roles: [Accountant], code: 200, input: [], output: Settlement, side_effects: ["venue_commission final variant", "artist_royalty_tiered", "licensing_split", "reconciled_by_user_id set"] }
  - { method: POST, path: "/merch/settlements/{id}/dispute", description: "RECONCILED -> DISPUTED", roles: [VenueRep, TourManager], code: 200, input: [reason], output: Settlement, side_effects: ["dispute_reason recorded"] }
  - { method: POST, path: "/merch/settlements/{id}/resolve", description: "DISPUTED -> RECONCILED; recomputes final figures from the current register (picks up audit voids)", roles: [Accountant], code: 200, input: [], output: Settlement, side_effects: ["final figures recomputed", "reconciled_by_user_id set to resolver"] }
  - { method: POST, path: "/merch/settlements/{id}/finalize", description: "RECONCILED -> FINALIZED; finalizer must differ from reconciled_by (SoD); pinned royalty snapshot must match current tour config; cascades Show -> SETTLED -> sessions LOCKED", roles: [Accountant], code: 200, input: [], output: Settlement, side_effects: ["Show RECONCILING -> SETTLED", "SellerSessions VERIFIED -> LOCKED"] }
  - { method: POST, path: "/merch/settlements/{id}/rebase-royalty", description: "Re-pin the royalty snapshot to the tour's current config; allowed in PROVISIONAL, DISPUTED, or RECONCILED (never FINALIZED); when RECONCILED, royalty/licensing/company figures are recomputed with the new snapshot", roles: [Accountant], code: 200, input: [], output: Settlement, side_effects: ["pinned_* := current tour royalty config", "royalty/licensing/company recomputed when RECONCILED"] }

  # --- Shipment (restock & routing) ---
  - { method: POST, path: "/merch/shipments", description: "Create a restock shipment (WAREHOUSE or SHOW origin) to a destination show", roles: [TourManager], code: 201, input: [tour_id, origin_type, "origin_show_id?", destination_show_id, lines], output: Shipment, side_effects: ["status := DRAFT"] }
  - { method: GET, path: "/merch/shipments", description: "List shipments, filterable by tour, destination, or origin show", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: ["tour_id?", "destination_show_id?", "origin_show_id?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/merch/shipments/{id}", description: "Get one shipment", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/merch/shipments/{id}/dispatch", description: "DRAFT -> DISPATCHED; enforces 48h lead time and source stock; decrements source", roles: [TourManager], code: 200, input: [], output: Shipment, side_effects: ["warehouse_stock_reconciliation or origin Allocation decrement", "dispatched_by_user_id/dispatched_at set"] }
  - { method: POST, path: "/merch/shipments/{id}/receive", description: "DISPATCHED -> RECEIVED by a different user than the dispatcher (SoD); upserts/increments destination allocations", roles: [TourManager], code: 200, input: [], output: Shipment, side_effects: ["destination Allocation rows created when absent; quantity_allocated incremented"] }
  - { method: POST, path: "/merch/shipments/{id}/cancel", description: "DRAFT or DISPATCHED -> CANCELLED; DISPATCHED cancellation restores the source quantities (compensation)", roles: [TourManager], code: 200, input: [], output: Shipment, side_effects: ["compensating restore of source stock/allocations when cancelling from DISPATCHED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/merch/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [TourManager, Seller, Accountant, VenueRep], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing or role not recognized; or role=Seller with an X-User-ID that is not an existing Seller id" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Seller acting on a SellerSession or SaleRecord whose seller_id differs from X-User-ID" }
  # --- Request shape ---
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, non-positive quantity/price, invalid enum value, malformed size map, or other shape violation not covered by a more specific error" }
  - { id: ERR_INVALID_SIZE_CURVE, http: 400, condition: "Size curve has no positive weight, negative/non-integer weights, or keys outside {S,M,L,XL}" }
  - { id: ERR_INVALID_COMMISSION_CONFIG, http: 400, condition: "FLAT show without flat_commission_bps, or TIERED show with missing/unsorted tiers or no trailing null up_to_cents tier" }
  - { id: ERR_BUNDLE_COMPONENT_INVALID, http: 400, condition: "Bundle component missing, sized, a BUNDLE itself, self-referential, or belongs to another tour" }
  - { id: ERR_PRODUCT_NOT_SELLABLE_AT_SHOW, http: 422, condition: "Attempt to price a BUNDLE product for at-show sale (bundles are online-only)" }
  # --- Not found ---
  - { id: ERR_TOUR_NOT_FOUND, http: 404, condition: "No Tour with the given id" }
  - { id: ERR_SHOW_NOT_FOUND, http: 404, condition: "No Show with the given id" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "No Product with the given id" }
  - { id: ERR_SHOW_PRODUCT_NOT_FOUND, http: 404, condition: "No ShowProduct with the given id" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "No Allocation with the given id" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "No Seller with the given id" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "No SellerSession with the given id" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "No SaleRecord with the given id" }
  - { id: ERR_ONLINE_ORDER_NOT_FOUND, http: 404, condition: "No OnlineOrder with the given id" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "No Settlement with the given id" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "No Shipment with the given id" }
  # --- State ---
  - { id: ERR_INVALID_TOUR_STATE, http: 409, condition: "Operation requires the tour to be in a different state (e.g., activate a non-PLANNING tour)" }
  - { id: ERR_TOUR_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE tour (open a show, place an online order)" }
  - { id: ERR_INVALID_SHOW_STATE, http: 409, condition: "Operation requires the show to be in a different state (open/begin-reconciliation/cancel/close-out/session-verify/show-product-write/receive gates)" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Sale, seller-void, or count-out requires the session to be OPEN" }
  - { id: ERR_SESSION_NOT_COUNTED_OUT, http: 409, condition: "Verify requires the session to be COUNTED_OUT" }
  - { id: ERR_UNRESOLVED_SESSIONS, http: 409, condition: "begin-reconciliation requires every session COUNTED_OUT or VERIFIED; reconcile requires every session VERIFIED" }
  - { id: ERR_SETTLEMENT_NOT_RECONCILED, http: 409, condition: "dispute/finalize requires the settlement to be RECONCILED" }
  - { id: ERR_INVALID_SETTLEMENT_STATE, http: 409, condition: "reconcile requires PROVISIONAL; resolve requires DISPUTED; rebase-royalty requires PROVISIONAL, DISPUTED, or RECONCILED (never FINALIZED); audit void requires PROVISIONAL or DISPUTED" }
  - { id: ERR_SHIPMENT_NOT_DRAFT, http: 409, condition: "Dispatch requires the shipment to be DRAFT" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHED, http: 409, condition: "Receive requires the shipment to be DISPATCHED" }
  - { id: ERR_ORDER_NOT_PLACED, http: 409, condition: "fulfill/cancel requires the online order to be PLACED" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Operation targets an entity in a terminal state (void a VOIDED record, receive/cancel a RECEIVED or CANCELLED shipment, write to a CLOSED tour, fulfill a FULFILLED order)" }
  - { id: ERR_SHOWS_NOT_TERMINAL, http: 409, condition: "Manual tour close requires every show CLOSED or CANCELLED" }
  - { id: ERR_CLOSEOUT_INCOMPLETE, http: 409, condition: "Close-out lines omit an allocation row that still has quantity_on_hand > 0 (every on-hand row must appear exactly once)" }
  # --- Business: referential ---
  - { id: ERR_CROSS_TOUR_REFERENCE, http: 422, condition: "Referenced entities belong to different tours (seller vs show, product vs show, allocation vs session, shipment shows vs shipment tour)" }
  - { id: ERR_PRICE_NOT_SET, http: 422, condition: "No ShowProduct price row exists for the sale's (show, product)" }
  # --- Business: temporal ---
  - { id: ERR_VENUE_DATE_CONFLICT, http: 409, condition: "Another non-CANCELLED show already occupies this venue_name on the same calendar date" }
  - { id: ERR_SELLER_DOUBLE_BOOKED, http: 409, condition: "Seller already holds a session on another show with the same calendar date" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 409, condition: "Dispatch time is less than 48 hours before the destination show_date" }
  # --- Business: uniqueness ---
  - { id: ERR_SESSION_EXISTS, http: 409, condition: "A SellerSession already exists for this (show_id, seller_id)" }
  - { id: ERR_SHOW_PRODUCT_EXISTS, http: 409, condition: "A ShowProduct already exists for this (show_id, product_id)" }
  - { id: ERR_ALLOCATIONS_EXIST, http: 409, condition: "Allocations already generated for this (show, product)" }
  # --- Business: safety / fiscal ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user may not perform both sides of a control pair: verify own session, finalize own reconciliation, receive own dispatch" }
  - { id: ERR_VARIANCE_OVERRIDE_REQUIRED, http: 409, condition: "|cash_variance_cents| exceeds the tour tolerance and the verify call lacks variance_override=true from a TourManager" }
  - { id: ERR_INSUFFICIENT_ALLOCATION, http: 409, condition: "Requested quantity exceeds Allocation.quantity_on_hand (sale, SHOW-origin dispatch, or close-out line)" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Requested quantity exceeds warehouse_stock_by_size for a line (WAREHOUSE-origin dispatch or online fulfill, bundle: per component)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the entity's current version (OCC)" }
  - { id: ERR_STALE_ROYALTY_CONFIG, http: 409, condition: "Finalize blocked: the settlement's pinned royalty snapshot differs from the tour's current config; call rebase-royalty first" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: TourManager
    description: "Runs the tour's merch operation: catalog, pricing, allocations, staffing sessions, shipments, close-out, online order management, and over-tolerance variance override"
    identity: opaque
    exclusive_operations:
      - "POST /merch/tours, POST /merch/tours/{id}/activate, POST /merch/tours/{id}/close, PATCH /merch/tours/{id}/royalty-config"
      - "POST /merch/shows, open / begin-reconciliation / cancel / close-out on shows"
      - "POST /merch/products, POST /merch/show-products, PATCH /merch/show-products/{id}"
      - "POST /merch/shows/{id}/allocations/generate"
      - "POST /merch/sellers, POST /merch/seller-sessions"
      - "POST /merch/online-orders, fulfill / cancel on online orders"
      - "POST /merch/shipments plus dispatch / receive / cancel"
    shared_operations:
      - "POST /merch/seller-sessions/{id}/verify (shared with Seller; only TourManager may pass variance_override=true)"
      - "POST /merch/settlements/{id}/dispute (shared with VenueRep)"
      - "All GET endpoints"
      - "POST /merch/_clock/set_current_utc"
  - name: Seller
    description: "Show-floor seller: counts out own drawer, records sales into own session, voids own misrecorded sales while the session is OPEN, and verifies OTHER sellers' sessions"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /merch/seller-sessions/{id}/count-out (own session only)"
      - "POST /merch/sale-records (own session only)"
      - "POST /merch/sale-records/{id}/void (Seller path: own session while OPEN; shared with Accountant's audit-void path)"
    shared_operations:
      - "POST /merch/seller-sessions/{id}/verify (shared with TourManager; must not be the session's seller; no override power)"
      - "All GET endpoints"
      - "POST /merch/_clock/set_current_utc"
  - name: Accountant
    description: "Reconciliation and money finalization; segregated from reconciliation authorship at finalize time"
    identity: opaque
    exclusive_operations:
      - "POST /merch/settlements/{id}/reconcile, /resolve, /finalize, /rebase-royalty"
      - "POST /merch/sale-records/{id}/void (Accountant path: audit void while the show is RECONCILING and the settlement is PROVISIONAL or DISPUTED; shared endpoint with the Seller path)"
    shared_operations:
      - "All GET endpoints"
      - "POST /merch/_clock/set_current_utc"
  - name: VenueRep
    description: "Venue representative who reviews the reconciled settlement and can dispute it"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /merch/settlements/{id}/dispute (shared with TourManager)"
      - "All GET endpoints"
      - "POST /merch/_clock/set_current_utc"
