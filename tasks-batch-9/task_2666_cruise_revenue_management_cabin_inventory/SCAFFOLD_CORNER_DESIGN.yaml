              as: ReservationAgent
              captures: { e2: $.data.error_id }
            - call: "POST /bookings/${bk_ada}/assign-guarantee"
              payload: { assigned_cabin_category_id: "${cat_ov}" }
              as: ReservationAgent
              captures: { av2: $.data.version }
            - call: "POST /promotions/${promo_f}/activate"
              payload: {}
              as: RevenueManager
              captures: { e3: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /promotions/${promo_f}/activate"
              payload: {}
              as: RevenueManager
              captures: { pfv2: $.data.version }
          assert:
            - "assigning a named category to Nell's OV booking returns HTTP 422 with data.error_id == ERR_NOT_GUARANTEE_BOOKING - she was never sold a guarantee"
            - "assigning the guarantee category IB to Ada's IA booking returns the same HTTP 422 ERR_NOT_GUARANTEE_BOOKING - a guarantee cannot be assigned to another guarantee"
            - "assigning OV to Ada returns HTTP 200: assigned_cabin_category_id == ${cat_ov} while cabin_category_id is still ${cat_ia} and net_ticket_cents is still 379990 - the guarantee fare is honoured"
            - "Booking.${bk_ada}.projected_onboard_gross_cents == 154000 and projected_onboard_net_cents == 154000, repriced from 126000 against OV's spend index"
            - "SailingInventory.${inv_ia}.booked_cabins == 0 with available_cabins == 64, and SailingInventory.${inv_ov}.booked_cabins == 2 with available_cabins == 28 - one cabin moved between allotments"
            - "Sailing.${sail_gt}.projected_onboard_revenue_cents == 308000, gross_ticket_revenue_cents == 959980, ralbd_gross_cents == 906 and ralbd_net_cents == 906 (1267980 / 1400)"
            - "Sailing.${sail_gt}.occupancy_pct == 2.00 and inventory_posture == OPEN, so no posture gate interferes with the activation"
            - "activating FALLSALE at 2026-08-01T00:00:00Z returns HTTP 422 with data.error_id == ERR_PROMO_WINDOW_NOT_CURRENT, leaving status SCHEDULED and version ${pfv1}"
            - "the identical activate at exactly 2026-09-01T00:00:00Z returns HTTP 200 with status ACTIVE and ${pfv2} == ${pfv1} + 1 - starts_on is inclusive"

  # ===========================================================================
  - section: rbac
    instances:

      - name: other_roles_cannot_call_a_roles_exclusive_operations
        claim_type: unauthorized_denial
        grounds:
          - roles.RevenueManager.exclusive_operations
          - roles.ReservationAgent.exclusive_operations
          - roles.GroupSalesAgent.exclusive_operations
          - roles.PortOpsCoordinator.exclusive_operations
          - validations[priority=3].ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The role model is segregation of duties, so no role is a superset of another: the revenue
          manager cannot sell a booking, the reservation agent cannot open a group hold or a sailing,
          the port ops coordinator cannot sweep a sailing, and a guest may read one sailing but not
          the sailing list. Every denial is a 403 at priority 3 - before any body parsing - and the
          matching positive control on a shared read proves the denial is about the endpoint, not the
          caller's credentials.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; category IA and sailing RBC-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) exist with an IA allotment 60/4 and a 730..0 fare window; the sailing is OPEN_FOR_SALE."
            - "Guest Ada exists, so a Guest-role caller has a real X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "RBC-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_rb: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_rb}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_rb}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_rb}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
          trigger:
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "RBC-2799", embark_date: "2027-04-01T17:00:00Z", nights: 5, total_lower_berths: 100 }
              as: ReservationAgent
              captures: { e1: $.data.error_id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_rb}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: GroupSalesAgent
              captures: { e2: $.data.error_id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_rb}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: ReservationAgent
              captures: { e3: $.data.error_id }
            - call: "POST /sailings/${sail_rb}/ops-run"
              payload: {}
              as: PortOpsCoordinator
              captures: { e4: $.data.error_id }
            - call: "POST /itinerary-changes"
              payload: { sailing_id: "${sail_rb}", kind: "PORT_CANCELLED", affected_port_code: "GRD", compensation_policy: "OBC_ONLY" }
              as: ReservationAgent
              captures: { e5: $.data.error_id }
            - call: "GET /sailings"
              payload: { ship_code: "AURORA" }
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e6: $.data.error_id }
            - call: "GET /guests"
              payload: { email: "ada@example.com" }
              as: GroupSalesAgent
              captures: { e7: $.data.error_id }
            - call: "GET /sailings/${sail_rb}"
              payload: {}
              as: Guest
              as_user_id: "${g_ada}"
            - call: "GET /guests/${g_ada}"
              payload: {}
              as: GroupSalesAgent
          assert:
            - "each of the seven denials returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "the reservation agent's POST /sailings is refused even though its body is valid, and no Sailing with voyage_code RBC-2799 exists afterwards"
            - "the group sales agent's POST /bookings is refused although the same body would succeed for a ReservationAgent - Guest.${g_ada}.bookings_count stays 0"
            - "the reservation agent's POST /group-blocks is refused and GET /group-blocks?sailing_id=${sail_rb} returns total_count == 0"
            - "the port ops coordinator's ops-run is refused and Sailing.${sail_rb}.version is unchanged - a 403 performs no write"
            - "the reservation agent's POST /itinerary-changes is refused and GET /itinerary-changes?sailing_id=${sail_rb} returns total_count == 0"
            - "the guest's GET /sailings list is refused with 403 while the guest's GET /sailings/${sail_rb} returns HTTP 200 - the single-sailing read is a shared operation, the list is not"
            - "the group sales agent's GET /guests list is refused with 403 while GET /guests/${g_ada} returns HTTP 200 - the same asymmetry on the guest resource"
            - "no denial returns 401 or 404: the credentials are well-formed and the sailing exists"

      - name: a_guest_cannot_touch_another_guests_booking
        claim_type: peer_roles
        grounds:
          - validations[priority=7].ERR_NOT_BOOKING_OWNER
          - validations[priority=3].ERR_ROLE_NOT_PERMITTED
          - roles.Guest
        distinguishing_aspect: |
          Guests are peers under the same role, so the role check cannot separate them - only the
          X-User-ID to Booking.guest_id comparison at priority 7 can. Every booking-scoped verb a
          guest may call must apply it: read, cancel, the payment ledger and bid submission. The
          layering is what makes it sharp: on an endpoint a Guest may not call at all the answer is
          the 403 role error at priority 3, never the ownership error, so the two 403s are told apart
          by which check ran.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing OWN-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 10/0 (IA is a guarantee category that upgrades to OV) and 730..0 fare windows on IA (base 50000) and OV (base 90000), OV having its own allotment."
            - "Ada and Bo are two guests with one two-adult booking each; Ada has paid her 50000 deposit so her ledger is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${cat_ov}" }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "OWN-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_ow: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ov}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 90000, third_berth_fare_cents: 30000, fourth_berth_fare_cents: 25000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_ow}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_bo: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_ada: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_ow}", cabin_category_id: "${cat_ia}", guest_id: "${g_bo}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_bo: $.data.id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 50000 }
              as: ReservationAgent
          trigger:
            - call: "GET /bookings/${bk_bo}"
              payload: {}
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e1: $.data.error_id }
            - call: "GET /bookings/${bk_bo}/payment-events"
              payload: {}
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e2: $.data.error_id }
            - call: "POST /bookings/${bk_bo}/cancel"
              payload: { reason: "NOT_MY_BOOKING" }
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e3: $.data.error_id }
            - call: "POST /bookings/${bk_bo}/upgrade-bids"
              payload: { target_cabin_category_id: "${cat_ov}", bid_amount_per_guest_cents: 40000 }
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e4: $.data.error_id }
            - call: "GET /bookings"
              payload: { sailing_id: "${sail_ow}" }
              as: Guest
              as_user_id: "${g_ada}"
              captures: { e5: $.data.error_id }
            - call: "GET /bookings/${bk_ada}"
              payload: {}
              as: Guest
              as_user_id: "${g_ada}"
            - call: "GET /bookings/${bk_ada}/payment-events"
              payload: {}
              as: Guest
              as_user_id: "${g_ada}"
          assert:
            - "Ada reading, cancelling, bidding on or listing the ledger of Bo's booking each return HTTP 403 with data.error_id == ERR_NOT_BOOKING_OWNER"
            - "Booking.${bk_bo}.booking_status is still OPTION with cancelled_at null and cancel_reason null - the refused cancel wrote nothing"
            - "GET /upgrade-bids?booking_id=${bk_bo} returns total_count == 0 - the refused bid was never stored"
            - "Ada's GET /bookings list attempt returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED, not ERR_NOT_BOOKING_OWNER: the list endpoint excludes the Guest role, so priority 3 answers before priority 7 can look at ownership"
            - "Ada reading her own booking returns HTTP 200 with guest_id == ${g_ada}, net_ticket_cents == 100000 and amount_paid_cents == 50000"
            - "Ada reading her own payment-events returns HTTP 200 with total_count == 1 and the single DEPOSIT of 50000"
            - "SailingInventory of ${cat_ia} on ${sail_ow} still reports booked_cabins == 2 and available_cabins == 8 - no peer-crossing attempt moved inventory"

      - name: missing_or_unknown_auth_headers_are_rejected_before_anything_else
        claim_type: role_operations
        grounds:
          - validations[priority=1].ERR_MISSING_AUTH_HEADERS
          - validations[priority=2].ERR_UNKNOWN_ROLE
          - validations[priority=3].ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The three authentication layers must fire in their declared order and each must beat the
          checks below it: an absent header set is a 401 even when the path id does not exist (so it
          outranks the 404 at priority 5) and even when the body is empty (so it outranks the 400 at
          priority 4), and a syntactically fine but unrecognised role is a 401 ERR_UNKNOWN_ROLE
          rather than the 403 reserved for a real role calling the wrong endpoint.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUT-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) exists and is PLANNED, and category IA exists."
            - "The calls written as `as: NONE` are sent with BOTH the X-User-Role and X-User-ID headers omitted; the call written as `as: FleetAdmiral` is sent with X-User-Role: FleetAdmiral and a non-empty X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUT-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_au: $.data.id }
          trigger:
            - call: "GET /sailings/${sail_au}"
              payload: {}
              as: NONE
              captures: { e1: $.data.error_id }
            - call: "GET /sailings/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: NONE
              captures: { e2: $.data.error_id }
            - call: "POST /sailings"
              payload: {}
              as: NONE
              captures: { e3: $.data.error_id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUT-2799", embark_date: "2027-05-01T17:00:00Z", nights: 5, total_lower_berths: 100 }
              as: FleetAdmiral
              captures: { e4: $.data.error_id }
            - call: "POST /sailings/${sail_au}/open-for-sale"
              payload: {}
              as: FleetAdmiral
              captures: { e5: $.data.error_id }
            - call: "GET /sailings/${sail_au}"
              payload: {}
              as: PortOpsCoordinator
          assert:
            - "the header-less read of a real sailing returns HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADERS"
            - "the header-less read of an unknown sailing id also returns HTTP 401 ERR_MISSING_AUTH_HEADERS, not HTTP 404 - priority 1 precedes priority 5"
            - "the header-less POST /sailings with an empty body returns HTTP 401 ERR_MISSING_AUTH_HEADERS, not HTTP 400 - priority 1 precedes priority 4"
            - "the FleetAdmiral POST /sailings returns HTTP 401 with data.error_id == ERR_UNKNOWN_ROLE, not HTTP 403 ERR_ROLE_NOT_PERMITTED - an unrecognised role never reaches the endpoint's role list"
            - "the FleetAdmiral action call on a real sailing also returns HTTP 401 ERR_UNKNOWN_ROLE and Sailing.${sail_au}.status is still PLANNED"
            - "no Sailing with voyage_code AUT-2799 exists and GET /sailings returns total_count == 1 - none of the five refusals wrote anything"
            - "the well-formed PortOpsCoordinator read of the same sailing returns HTTP 200, proving the endpoint itself was reachable all along"

      - name: four_eyes_signature_on_a_group_block_is_enforced_by_user_id
        claim_type: segregation_of_duties
        grounds:
          - roles.GroupSalesAgent.note
          - validations[priority=8].ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: sod_auth_beats_group_block_state_precondition
          rationale: |
            That §1.8 instance already covers the four-eyes rule end to end: the creating agent's
            own confirm-definite is refused with ERR_SEGREGATION_OF_DUTIES, a second agent's
            signature succeeds, and the creator's repeat attempt on the now DEFINITE block still
            answers with the 403 rather than the 409. A separate rbac row would duplicate it.

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: oversell_patch_with_the_current_version_succeeds_and_bumps_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[oversell-adjust-stale-inventory]
          - endpoints[PATCH /sailing-inventories/{id}]
          - calculations.oversell_availability
        distinguishing_aspect: |
          The full optimistic-concurrency contract for the allotment rule, in one sequence: the
          version returned by the create is accepted once, is refused the second time it is offered
          with ERR_STALE_INVENTORY_VERSION at 412, and the value the refusal reports back is the
          only one that then works. Each accepted write bumps version by exactly one and re-derives
          effective_oversell_cabins, so the reader can see that the refusal protected a decision
          taken against a snapshot that had already moved.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing OCC-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is PLANNED."
            - "IA is a guarantee category with a 60-cabin allotment created at oversell_allowance 4, whose version is captured as ${iv0}. Nothing else writes to the allotment during the test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "OCC-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_oc: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_oc}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_oc: $.data.id, iv0: $.data.version }
          trigger:
            - call: "PATCH /sailing-inventories/${inv_oc}"
              payload: { oversell_allowance: 6, expected_inventory_version: "${iv0}" }
              as: RevenueManager
              captures: { iv1: $.data.version }
            - call: "PATCH /sailing-inventories/${inv_oc}"
              payload: { oversell_allowance: 3, expected_inventory_version: "${iv0}" }
              as: RevenueManager
              captures: { e1: $.data.error_id }
            - call: "PATCH /sailing-inventories/${inv_oc}"
              payload: { oversell_allowance: 3, expected_inventory_version: "${iv1}" }
              as: RevenueManager
              captures: { iv2: $.data.version }
          assert:
            - "the first PATCH returns HTTP 200 with oversell_allowance == 6, effective_oversell_cabins == 6 (min(6, ceil(60 * 0.10)) == 6), available_cabins == 66 and ${iv1} == ${iv0} + 1"
            - "the second PATCH replays ${iv0} and returns HTTP 412 with data.error_id == ERR_STALE_INVENTORY_VERSION"
            - "after the refusal SailingInventory.${inv_oc}.oversell_allowance is still 6, effective_oversell_cabins still 6 and version still ${iv1} - a 412 writes nothing at all, not even the version"
            - "the third PATCH offers ${iv1} and returns HTTP 200 with oversell_allowance == 3, effective_oversell_cabins == 3, available_cabins == 63 and ${iv2} == ${iv1} + 1"
            - "the identity physical_cabins + effective_oversell_cabins == available_cabins + booked_cabins + group_held_cabins holds after every accepted write (60 + 6 == 66 + 0 + 0, then 60 + 3 == 63 + 0 + 0)"
            - "the version advanced by exactly two across three PATCH attempts - one per accepted write"

      - name: promotion_creation_with_a_superseded_sailing_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[promotion-create-stale-sailing]
          - endpoints[POST /promotions]
          - validations[priority=9]
        distinguishing_aspect: |
          The second concurrency rule guards a CHILD create against the parent's version, and the
          parent bumps itself as a side effect of that very create - so the version that admitted
          the first promotion is already dead when the second one is drafted. The refusal is a 412
          even though the second promotion's calendar slot is perfectly legal, which is exactly the
          point: the writer never saw the campaign the first call added.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PRM-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 and the 365..120 fare window, and its version after opening is captured as ${sv1}."
            - "No booking exists, so nothing else moves the sailing version during the test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "PRM-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_pr: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_pr}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_pr}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_pr}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_pr}", code: "EARLYBIRD", audience: "GENERAL", discount_pct: 0.15, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-05T00:00:00Z", max_redemptions: 10, expected_sailing_version: "${sv1}" }
              as: RevenueManager
              captures: { promo_1: $.data.id }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_pr}", code: "LATEAUGUST", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-13T00:00:00Z", ends_on: "2026-08-20T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${sv1}" }
              as: RevenueManager
              captures: { e1: $.data.error_id }
            - call: "GET /sailings/${sail_pr}"
              payload: {}
              as: RevenueManager
              captures: { sv2: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_pr}", code: "LATEAUGUST", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-13T00:00:00Z", ends_on: "2026-08-20T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${sv2}" }
              as: RevenueManager
              captures: { promo_2: $.data.id }
          assert:
            - "the first promotion returns HTTP 201 with status SCHEDULED, redemption_count == 0, and it bumps the parent so ${sv2} == ${sv1} + 1"
            - "the second promotion offering the now superseded ${sv1} returns HTTP 412 with data.error_id == ERR_STALE_SAILING_VERSION"
            - "the refusal is NOT ERR_PROMO_CADENCE_CONFLICT: the intervals 2026-08-01..2026-08-05 and 2026-08-13..2026-08-20 are 8 whole days apart, so the calendar rule at priority 16 would have passed - priority 9 answered first"
            - "after the refusal GET /promotions?sailing_id=${sail_pr} returns total_count == 1 and Sailing.${sail_pr}.version is still ${sv2}, so the rejected create bumped nothing"
            - "the retry with the re-read ${sv2} returns HTTP 201 for the identical body, and the sailing version becomes ${sv2} + 1"
            - "GET /promotions?sailing_id=${sail_pr} then returns total_count == 2 with codes EARLYBIRD and LATEAUGUST"

      - name: posture_flips_at_ninety_and_one_hundred_percent_occupancy
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.sailing_occupancy_posture
          - validations[priority=18].ERR_POSTURE_RESTRICTED
          - errors[ERR_POSTURE_RESTRICTED]
        distinguishing_aspect: |
          Both posture floors are crossed on a deliberately tiny ship where one berth is ten
          percentage points, so the bands are hit exactly rather than approached: 80.00 is OPEN,
          90.00 is RESTRICTED on the inclusive floor and 100.00 is FROZEN. The gate is asymmetric -
          RESTRICTED stops group holds and promotion activations but still lets bookings through,
          which is what lets the same sailing walk from 90.00 to 100.00 - and both restricted bands
          report the same ERR_POSTURE_RESTRICTED for a group hold.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PST-2701 has nights 4, total_lower_berths 10 and embark 2027-01-10T17:00:00Z, so each lower berth sold is exactly 10.00 percentage points."
            - "The IA allotment holds 10 physical cabins with oversell_allowance 0 and a 730..0 fare window at base 50000, so cabins never run out during the test."
            - "Promotion SUMMERGA (2026-08-01..2026-08-10, GENERAL, 0.10) is SCHEDULED and not yet activated."
            - "Four two-adult bookings are created, taking lower_berths_sold to 8 and occupancy_pct to 80.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "PST-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 10, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
