# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index (breadth probe)
# Commissary & Shared Production Kitchen (Expert)
# Walks references/claim-extraction-guide.md against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: member_register_returns_201_active_zero_wallet
        claim_type: Creation
        grounds: [entities.Member.fields.status, entities.Member.fields.wallet_balance_cents]
        distinguishing_aspect: "POST /members/register with required fields → 201; status ACTIVE; wallet_balance_cents 0; lifetime_loaded_cents 0; version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { business_name: "Acme Foods", email: "acme@x.com" }
              as: Anonymous
              captures: { mid: $.data.id }
          assert:
            - "response.status == 201"
            - "Member.${mid}.status == ACTIVE"
            - "Member.${mid}.wallet_balance_cents == 0"
            - "Member.${mid}.plan_tier == STANDARD"
            - "Member.${mid}.version == 1"

      - name: member_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a random non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: station_create_missing_station_class_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Station.fields.station_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /stations omitting required station_class → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "NoClass" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: member_register_default_plan_tier_standard
        claim_type: Defaults
        grounds: [entities.Member.fields.plan_tier]
        distinguishing_aspect: "Omitting plan_tier on register → default STANDARD applied."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { business_name: "DefaultCo", email: "def@x.com" }
              as: Anonymous
              captures: { mid: $.data.id }
          assert:
            - "Member.${mid}.plan_tier == STANDARD"

      - name: recipe_components_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RecipeComponent]
        distinguishing_aspect: "RecipeComponent has common_fields:false — no update endpoint and no version field; only id and created_at are server-stamped."
        test_recipe:
          setup: ["Member m_im ACTIVE; recipe DRAFT with one component"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Im", email: "im@x.com" }
              as: Anonymous
              captures: { mim: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "ImIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { iim: $.data.id }
            - call: "POST /members/${mim}/recipes"
              payload: { name: "ImR", batch_yield_units: 5 }
              as: MemberOperator
              as_user_id: "${mim}"
              captures: { rim: $.data.id }
          trigger:
            - call: "POST /members/${mim}/recipes/${rim}/components"
              payload: { ingredient_id: "${iim}", planned_qty: 2.0 }
              as: MemberOperator
              as_user_id: "${mim}"
              captures: { cid: $.data.id }
          assert:
            - "response.status == 201"
            - "RecipeComponent.${cid}.planned_qty == 2.0"

      - name: booking_computed_fee_ignores_client_supplied_fee
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.fee_cents]
        distinguishing_aspect: "fee_cents is source:computed; even though clients cannot send it (not in input), the server computes 2400 for an offpeak prep 120-min booking regardless of any wishful client value."
        test_recipe:
          setup: ["Member m_cf ACTIVE wallet 100000; OPEN PREP_TABLE station"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Cf", email: "cf@x.com" }
              as: Anonymous
              captures: { mcf: $.data.id }
            - call: "POST /members/${mcf}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${mcf}"
              captures: { mcfv: $.data.version }
            - call: "POST /stations"
              payload: { name: "PrepCf", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { stcf: $.data.id }
          trigger:
            - call: "POST /members/${mcf}/bookings"
              payload: { station_id: "${stcf}", start_utc: "2026-07-10T12:00:00.000Z", end_utc: "2026-07-10T14:00:00.000Z", expected_member_version: "${mcfv}" }
              as: MemberOperator
              as_user_id: "${mcf}"
              captures: { bk: $.data.id }
          assert:
            - "Booking.${bk}.fee_cents == 2400"

      - name: station_create_invalid_enum_class_rejected
        claim_type: Type Constraints
        grounds: [entities.Station.fields.station_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /stations with station_class not in {PREP_TABLE, CONVECTION_OVEN, BLAST_CHILLER} → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "Bad", station_class: "MICROWAVE" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: booking_fk_station_nonexistent_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Booking.fields.station_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "FK reference: booking create with a station_id that does not exist → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Member m_fk ACTIVE wallet 100000; no stations created"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Fk", email: "fk@x.com" }
              as: Anonymous
              captures: { mfk: $.data.id }
            - call: "POST /members/${mfk}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${mfk}"
              captures: { mfkv: $.data.version }
          trigger:
            - call: "POST /members/${mfk}/bookings"
              payload: { station_id: "00000000-0000-0000-0000-000000000000", start_utc: "2026-07-11T12:00:00.000Z", end_utc: "2026-07-11T13:00:00.000Z", expected_member_version: "${mfkv}" }
              as: MemberOperator
              as_user_id: "${mfk}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: members_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member]
        distinguishing_aspect: "GET /members returns paginated array with meta + total_count + has_more; limit honored."
        test_recipe:
          setup: ["Two members registered"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "L1", email: "l1@x.com" }
              as: Anonymous
            - call: "POST /members/register"
              payload: { business_name: "L2", email: "l2@x.com" }
              as: Anonymous
          trigger:
            - call: "GET /members"
              payload: {}
              as: FacilityManager
          assert:
            - "response.response_type == array"
            - "response.data length == 2"
            - "response.has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: booking_cancel_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Booking already CANCELLED; second cancel → ERR_INVALID_STATE (409); no second refund applied."
        test_recipe:
          setup: ["Member m_c ACTIVE wallet 100000; CONFIRMED booking already cancelled once"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { mc: $.data.id }
            - call: "POST /members/${mc}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${mc}"
              captures: { mcv: $.data.version }
            - call: "POST /stations"
              payload: { name: "PrepC", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { stc: $.data.id }
            - call: "POST /members/${mc}/bookings"
              payload: { station_id: "${stc}", start_utc: "2026-07-12T12:00:00.000Z", end_utc: "2026-07-12T13:00:00.000Z", expected_member_version: "${mcv}" }
              as: MemberOperator
              as_user_id: "${mc}"
              captures: { bc: $.data.id }
            - call: "POST /members/${mc}/bookings/${bc}/cancel"
              payload: {}
              as: MemberOperator
              as_user_id: "${mc}"
          trigger:
            - call: "POST /members/${mc}/bookings/${bc}/cancel"
              payload: {}
              as: MemberOperator
              as_user_id: "${mc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: recipe_publish_empty_returns_recipe_empty
        claim_type: Precondition Enforcement
        grounds: [state_machines.Recipe.DRAFT_to_PUBLISHED, "errors[ERR_RECIPE_EMPTY]"]
        distinguishing_aspect: "Publishing a DRAFT recipe with zero components → ERR_RECIPE_EMPTY (409)."
        test_recipe:
          setup: ["Member m_re ACTIVE; recipe DRAFT with no components"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Re", email: "re@x.com" }
              as: Anonymous
              captures: { mre: $.data.id }
            - call: "POST /members/${mre}/recipes"
              payload: { name: "Empty", batch_yield_units: 5 }
              as: MemberOperator
              as_user_id: "${mre}"
              captures: { rre: $.data.id }
          trigger:
            - call: "POST /members/${mre}/recipes/${rre}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${mre}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECIPE_EMPTY"

      - name: batch_start_below_stock_returns_insufficient_stock
        claim_type: guarded transitions
        grounds: [state_machines.ProductionBatch.PLANNED_to_IN_PRODUCTION, "validations[priority=17]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Batch start when Ingredient.on_hand_qty < scaled BOM demand → ERR_INSUFFICIENT_STOCK (409); batch stays PLANNED."
        test_recipe:
          setup: ["Member m_st ACTIVE; recipe PUBLISHED needs qty 5; ingredient on_hand 0; batch PLANNED"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "St", email: "st@x.com" }
              as: Anonymous
              captures: { mst: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "StIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { ist: $.data.id }
            - call: "POST /members/${mst}/recipes"
              payload: { name: "StR", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${mst}"
              captures: { rst: $.data.id }
            - call: "POST /members/${mst}/recipes/${rst}/components"
              payload: { ingredient_id: "${ist}", planned_qty: 5.0 }
              as: MemberOperator
              as_user_id: "${mst}"
            - call: "POST /members/${mst}/recipes/${rst}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${mst}"
            - call: "POST /members/${mst}/batches"
              payload: { recipe_id: "${rst}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${mst}"
              captures: { bst: $.data.id }
          trigger:
            - call: "POST /members/${mst}/batches/${bst}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${mst}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"
            - "ProductionBatch.${bst}.status == PLANNED"

      - name: recipe_retired_is_terminal_no_publish
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Recipe.PUBLISHED_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From RETIRED (terminal) any further transition (publish/revise) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member m_rt ACTIVE; recipe PUBLISHED then RETIRED"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Rt", email: "rt@x.com" }
              as: Anonymous
              captures: { mrt: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "RtIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { irt: $.data.id }
            - call: "POST /members/${mrt}/recipes"
              payload: { name: "RtR", batch_yield_units: 5 }
              as: MemberOperator
              as_user_id: "${mrt}"
              captures: { rrt: $.data.id }
            - call: "POST /members/${mrt}/recipes/${rrt}/components"
              payload: { ingredient_id: "${irt}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${mrt}"
            - call: "POST /members/${mrt}/recipes/${rrt}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${mrt}"
            - call: "POST /members/${mrt}/recipes/${rrt}/retire"
              payload: {}
              as: MemberOperator
              as_user_id: "${mrt}"
          trigger:
            - call: "POST /members/${mrt}/recipes/${rrt}/revise"
              payload: {}
              as: MemberOperator
              as_user_id: "${mrt}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: batch_created_starts_in_planned
        claim_type: Initial State
        grounds: [state_machines.ProductionBatch.none_to_PLANNED]
        distinguishing_aspect: "A newly created ProductionBatch starts in initial_state PLANNED."
        test_recipe:
          setup: ["Member m_in ACTIVE; recipe PUBLISHED"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "In", email: "in@x.com" }
              as: Anonymous
              captures: { min2: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "InIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { iin: $.data.id }
            - call: "POST /members/${min2}/recipes"
              payload: { name: "InR", batch_yield_units: 5 }
              as: MemberOperator
              as_user_id: "${min2}"
              captures: { rin: $.data.id }
            - call: "POST /members/${min2}/recipes/${rin}/components"
              payload: { ingredient_id: "${iin}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${min2}"
            - call: "POST /members/${min2}/recipes/${rin}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${min2}"
          trigger:
            - call: "POST /members/${min2}/batches"
              payload: { recipe_id: "${rin}", planned_yield_units: 5 }
              as: MemberOperator
              as_user_id: "${min2}"
              captures: { bin: $.data.id }
          assert:
            - "ProductionBatch.${bin}.status == PLANNED"

      - name: recipe_revise_in_use_returns_recipe_in_use
        claim_type: guarded transitions
        grounds: [state_machines.Recipe.PUBLISHED_to_DRAFT, "validations[priority=19]", "errors[ERR_RECIPE_IN_USE]"]
        distinguishing_aspect: "Revise blocked when an IN_PRODUCTION batch pins the recipe version → ERR_RECIPE_IN_USE (409); recipe stays PUBLISHED."
        test_recipe:
          setup: ["Member m_iu ACTIVE; recipe PUBLISHED; stocked; batch IN_PRODUCTION pinning the version"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Iu", email: "iu@x.com" }
              as: Anonymous
              captures: { miu: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "IuIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { iiu: $.data.id }
            - call: "POST /members/${miu}/ingredient-orders"
              payload: { ingredient_id: "${iiu}", order_qty: 100, unit_cost_cents: 100 }
              as: MemberOperator
              as_user_id: "${miu}"
              captures: { oiu: $.data.id }
            - call: "POST /members/${miu}/ingredient-orders/${oiu}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${miu}"
            - call: "POST /members/${miu}/recipes"
              payload: { name: "IuR", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${miu}"
              captures: { riu: $.data.id }
            - call: "POST /members/${miu}/recipes/${riu}/components"
              payload: { ingredient_id: "${iiu}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${miu}"
            - call: "POST /members/${miu}/recipes/${riu}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${miu}"
            - call: "POST /members/${miu}/batches"
              payload: { recipe_id: "${riu}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${miu}"
              captures: { biu: $.data.id }
            - call: "POST /members/${miu}/batches/${biu}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${miu}"
          trigger:
            - call: "POST /members/${miu}/recipes/${riu}/revise"
              payload: {}
              as: MemberOperator
              as_user_id: "${miu}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECIPE_IN_USE"
            - "Recipe.${riu}.status == PUBLISHED"

      - name: member_close_with_open_obligations_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.ACTIVE_to_CLOSED, "validations[priority=20]", "errors[ERR_MEMBER_HAS_OPEN_OBLIGATIONS]"]
        distinguishing_aspect: "Closing a member who holds an ACTIVE storage assignment → ERR_MEMBER_HAS_OPEN_OBLIGATIONS (409)."
        test_recipe:
          setup: ["Member m_ob ACTIVE with one ACTIVE DRY storage assignment"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Ob", email: "ob@x.com" }
              as: Anonymous
              captures: { mob: $.data.id, mobv: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "DryOb", temp_class: "DRY", total_slots: 10, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { dob: $.data.id }
            - call: "POST /members/${mob}/storage-assignments"
              payload: { temp_class: "DRY", requested_slots: 2, expected_member_version: "${mobv}" }
              as: MemberOperator
              as_user_id: "${mob}"
              captures: { saob: $.data.id }
            - call: "GET /members/${mob}"
              payload: {}
              as: FacilityManager
              captures: { mobv2: $.data.version }
          trigger:
            - call: "POST /members/${mob}/close"
              payload: { expected_member_version: "${mobv2}" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MEMBER_HAS_OPEN_OBLIGATIONS"

      - name: order_receive_bubbles_stock_and_cost
        claim_type: Cross-entity
        grounds: [state_machines.IngredientOrder.PLACED_to_RECEIVED, entities.Ingredient.fields.on_hand_qty, entities.Ingredient.fields.unit_cost_cents]
        distinguishing_aspect: "Receiving an order increments Ingredient.on_hand_qty by order_qty and overwrites unit_cost_cents to the order's quote; verify both fields change."
        test_recipe:
          setup: ["Member m_rc ACTIVE; ingredient cost 100 on_hand 0; order placed qty 40 at cost 150"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Rc", email: "rc@x.com" }
              as: Anonymous
              captures: { mrc: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "RcIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { irc: $.data.id }
            - call: "POST /members/${mrc}/ingredient-orders"
              payload: { ingredient_id: "${irc}", order_qty: 40, unit_cost_cents: 150 }
              as: MemberOperator
              as_user_id: "${mrc}"
              captures: { orc: $.data.id }
          trigger:
            - call: "POST /members/${mrc}/ingredient-orders/${orc}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${mrc}"
          assert:
            - "Ingredient.${irc}.on_hand_qty == 40"
            - "Ingredient.${irc}.unit_cost_cents == 150"

      - name: temp_excursion_recovery_resets_minutes
        claim_type: compound
        grounds: [state_machines.StorageUnit.EXCURSION_to_COMPLIANT, calculations.temp_excursion_accumulation, entities.StorageUnit.fields.excursion_minutes]
        distinguishing_aspect: "Unit in EXCURSION receives an in-range reading before the 120-min limit → compliance_status returns to COMPLIANT and excursion_minutes resets to 0."
        test_recipe:
          setup: ["COLD unit range [0,4]; one out-of-range reading at 10:00 (EXCURSION)"]
          setup_api_calls:
            - call: "POST /storage-units"
              payload: { name: "ColdRec", temp_class: "COLD", total_slots: 5, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
              captures: { cur: $.data.id }
            - call: "POST /storage-units/${cur}/temp-logs"
              payload: { reading_c: 9.0, reading_utc: "2026-07-13T10:00:00.000Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /storage-units/${cur}/temp-logs"
              payload: { reading_c: 3.0, reading_utc: "2026-07-13T10:30:00.000Z" }
              as: ComplianceOfficer
          assert:
            - "StorageUnit.${cur}.compliance_status == COMPLIANT"
            - "StorageUnit.${cur}.excursion_minutes == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: storage_fee_premium_discount_applied
        claim_type: Constants Applied
        grounds: [calculations.storage_fee, entities.StorageAssignment.fields.monthly_fee_cents]
        distinguishing_aspect: "PREMIUM member COLD 10-slot assignment: gross 7000, 5% discount 350 → monthly_fee_cents 6650."
        test_recipe:
          setup: ["PREMIUM member m_sf ACTIVE; COLD unit 20 slots"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Sf", email: "sf@x.com", plan_tier: "PREMIUM" }
              as: Anonymous
              captures: { msf: $.data.id, msfv: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "ColdSf", temp_class: "COLD", total_slots: 20, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
