# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, out-of-enum value, or out-of-range number (e.g., moisture_pct > 0.30, tons <= 0, end <= start)" }
  - { id: ERR_MILL_NOT_FOUND, http: 404, condition: "millId does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contractId does not exist within the mill" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "scrap_lot_id / lotId does not exist" }
  - { id: ERR_HEAT_NOT_FOUND, http: 404, condition: "heatId / heat_id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaignId does not exist within the mill" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "accountId does not exist within the mill" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId / order_id does not exist" }
  - { id: ERR_GRADE_NOT_FOUND, http: 404, condition: "grade_id does not exist within the mill" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "windowId does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not exist" }
  - { id: ERR_SCORECARD_NOT_FOUND, http: 404, condition: "scorecardId does not exist" }
  - { id: ERR_SHEET_NOT_FOUND, http: 404, condition: "sheetId does not exist for the heat" }
  - { id: ERR_INDEX_NOT_FOUND, http: 404, condition: "SurchargeIndex row does not exist (path reads)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a valid source state for the requested transition (includes terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_MILL_INTERRUPTED, http: 409, condition: "Mill posture is INTERRUPTED and the operation has no covering waiver" }
  - { id: ERR_BLEND_INFEASIBLE, http: 422, condition: "Candidate charge line breaks cu_blend ceiling or mn_blend floor for the target grade" }
  - { id: ERR_CHEMISTRY_OUT_OF_SPEC, http: 422, condition: "MeltdownSheet confirm attempted with chem_ok == false" }
  - { id: ERR_MTR_NOT_ISSUABLE, http: 409, condition: "MTR issue prerequisites unmet (heat not CAST, sheet not CONFIRMED, or CERTIFIED grade lacks a clean energy-interval record)" }
  - { id: ERR_CONTRACT_PRICE_FORBIDDEN, http: 422, condition: "INDEXED contract carries contract_price_cents, or FIXED contract omits it" }
  - { id: ERR_CONTRACT_NOT_OPEN, http: 409, condition: "Charge line references a lot whose contract is CLOSED or DEFAULTED" }
  - { id: ERR_LOT_DEPLETED, http: 409, condition: "Requested tons exceed the lot's remaining_tons" }
  - { id: ERR_HEAT_SEQUENCE_CONFLICT, http: 409, condition: "Another non-terminal heat of the mill is scheduled within +/- 45 minutes planned_tap_at" }
  - { id: ERR_CAMPAIGN_OVERLAP, http: 409, condition: "Campaign window overlaps a COMMITTED same-family campaign (half-open semantics; touching endpoints allowed)" }
  - { id: ERR_CAMPAIGN_WINDOW_VIOLATION, http: 409, condition: "A committed line's heat planned_tap_at falls outside [planned_start, planned_end]" }
  - { id: ERR_CAMPAIGN_EMPTY, http: 409, condition: "Commit attempted with zero CampaignLines" }
  - { id: ERR_HEAT_NOT_CAST, http: 409, condition: "Campaign line add or commit references a heat not yet CAST" }
  - { id: ERR_ROLL_CHANGE_BUDGET_EXCEEDED, http: 422, condition: "Recomputed roll_changes_used exceeds roll_change_budget at commit" }
  - { id: ERR_EVENT_OVERLAP, http: 409, condition: "Another EnergyEvent is ACTIVE, or the gap to the previous event's released_at is under 15 minutes (adjacency forbidden)" }
  - { id: ERR_UNRESOLVED_ORDERS, http: 409, condition: "Campaign close attempted while served orders are still CONFIRMED or ALLOCATED" }
  - { id: ERR_ACCOUNT_BLOCKED, http: 402, condition: "Order confirm/invoice attempted on an account with credit_status BLOCKED" }
  - { id: ERR_INDEX_MISSING, http: 422, condition: "No PUBLISHED SurchargeIndex for the resolved (grade_category, month)" }
  - { id: ERR_UNDER_DELIVERED, http: 422, condition: "Contract close attempted with received_tons below 80% of committed_tons" }
  - { id: ERR_WAIVER_DUPLICATE, http: 409, condition: "A waiver already exists for this (scope, scope_id)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Division general manager; superset override over mill operations, owns mills, indices, and scorecards"
    identity: opaque
    exclusive_operations:
      - "POST /mills"
      - "POST /mills/{millId}/surcharge-indices"
      - "POST /mills/{millId}/division-scorecards and their close/distribute"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /mills/{millId}/grades (shared with Metallurgist)"

  - name: MillOperator
    description: "Melt shop operator; owns heats, charges, tap/cast/abort"
    identity: opaque
    exclusive_operations:
      - "POST /mills/{millId}/heats"
      - "POST .../heats/{heatId}/tap, /cast, /abort"
    shared_operations:
      - "All GET endpoints"
      - "POST .../heats/{heatId}/energy-intervals (shared with EnergyDispatcher)"

  - name: Scheduler
    description: "Rolling mill scheduler; owns campaigns, lines, allocation runs"
    identity: opaque
    exclusive_operations:
      - "POST /mills/{millId}/campaigns and their lines/commit/close/cancel"
      - "POST /mills/{millId}/allocation-runs"
    shared_operations:
      - "All GET endpoints"

  - name: Metallurgist
    description: "Ladle metallurgy and chemistry; owns grades and meltdown sheets"
    identity: opaque
    exclusive_operations:
      - "POST .../heats/{heatId}/meltdown-sheets and revise/confirm/reject"
    shared_operations:
      - "All GET endpoints"
      - "POST /mills/{millId}/grades (shared with PlantManager)"

  - name: ProcurementOfficer
    description: "Scrap and DRI buyer; owns contracts, lots, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /mills/{millId}/procurement-contracts and close/default"
      - "POST .../procurement-contracts/{contractId}/scrap-lots"
    shared_operations:
      - "All GET endpoints"

  - name: AccountManager
    description: "Commercial account owner; manages accounts and the order book"
    identity: opaque
    exclusive_operations:
      - "POST /mills/{millId}/customer-accounts and PATCH"
      - "POST .../orders and confirm/invoice/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: QualityEngineer
    description: "Certification authority; issues mill test reports"
    identity: opaque
    exclusive_operations:
      - "POST .../heats/{heatId}/mill-test-reports"
    shared_operations:
      - "All GET endpoints"

  - name: EnergyDispatcher
    description: "Energy manager; owns interruptible windows, grid events, waivers"
    identity: opaque
    exclusive_operations:
      - "POST /mills/{millId}/interruptible-windows and honor"
      - "POST /mills/{millId}/energy-events and activate/release"
      - "POST /mills/{millId}/power-waivers"
    shared_operations:
      - "All GET endpoints"
      - "POST .../heats/{heatId}/energy-intervals (shared with MillOperator)"
