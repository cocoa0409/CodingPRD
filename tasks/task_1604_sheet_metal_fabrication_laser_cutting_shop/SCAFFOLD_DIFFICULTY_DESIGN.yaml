              payload: {}
              as: ProductionPlanner
              captures: { status_after: $.data.status }
          assert:
            - "first receive (day 4 of 7) rejected ERR_VENDOR_LEAD_TIME_NOT_ELAPSED (409)"
            - "after clock reaches due_date, receive succeeds; RoutingStep.${outside_step}.status == COMPLETED"
            - "FabricationOrder.${order_id}.status == INSPECTION (no further in-house steps)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_capacity_utilization_cap_window
        grounds:
          - calculations.capacity_booking
          - calculations.routing_generation
        distinguishing_aspect: |
          Interval semantics = aggregate-capacity window: Machine LASER with
          480 min/day has a 12-day horizon capacity of 5760 and cap 0.90 ->
          5184 bookable minutes. An order whose LASER step would push booked
          load from <= 5184 to 5185+ is rejected ERR_NO_MACHINE_CAPACITY; a
          load landing exactly at 5184 is accepted (inclusive <=).
          Resource: Machine. Semantics: rolling-horizon aggregate, not pairwise
          interval intersection.
        test_recipe:
          setup:
            - "Machine Tiny-Laser shift_minutes_per_day = 1 -> 12-day horizon capacity = 12 minutes; utilization cap 0.90 -> feasibility cutoff 10.8 (booked + planned must be <= 10.8, inclusive)"
            - "Part 100x100 no holes/fillets: cut = 8 + 0.045*400 + 1.2*1 = 27.2s -> billed 28s; qty 2 -> 56s -> ceil(56/60) = 1 min; 1 sheet used -> +5 load = planned_minutes 6"
            - "First order books 6 (6 <= 10.8 OK); second identical order would take booked load to 12 (> 10.8) and must be rejected"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-TG", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Pi", email: "p@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/machines"
              payload: { name: "Tiny-Laser", station: "LASER", shift_minutes_per_day: 1 }
              as: ShopManager
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 2 }] }
              as: Estimator
              captures: { q1: $.data.id, q1_v: $.data.version }
            - call: "POST /fab/quotes/${q1}/price"
              payload: { expected_quote_version: "${q1_v}" }
              as: Estimator
            - call: "POST /fab/quotes/${q1}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${q1}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order1: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 2 }] }
              as: Estimator
              captures: { q2: $.data.id, q2_v: $.data.version }
            - call: "POST /fab/quotes/${q2}/price"
              payload: { expected_quote_version: "${q2_v}" }
              as: Estimator
            - call: "POST /fab/quotes/${q2}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /fab/quotes/${q2}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first accept succeeds: LASER planned_minutes == 6 (ceil(2*28/60) + 1 sheet * 5) and 6 <= 12 * 0.90 == 10.8 (inclusive)"
            - "second accept rejected ERR_NO_MACHINE_CAPACITY (6 + 6 == 12 > 10.8)"
            - "Quote.${q2}.status remains SUBMITTED (accept is atomic; no NestSheet rows persist)"

      - name: vendor_lead_time_window_exclusive_vs_inclusive
        grounds:
          - state_machines.FabricationOrder.AWAITING_OUTSIDE_to_FINISHING
          - calculations.routing_generation
        distinguishing_aspect: |
          Interval semantics = half-open lead-time window on the OutsideVendor
          resource: receive is valid only at t >= due_date (due = send +
          lead_time_days); one second before is rejected. Distinct resource
          (vendor, not machine) and distinct semantics (single half-open
