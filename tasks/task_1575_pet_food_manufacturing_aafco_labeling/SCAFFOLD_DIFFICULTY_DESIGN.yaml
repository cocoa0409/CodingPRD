              as: FormulationScientist
              captures: { f1_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "LM-002", product_name: "Lima Dog Trial 2", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FEEDING_TRIAL" }
              as: FormulationScientist
              captures: { f2_id: $.data.id }
            - call: "POST /petfood/formulas/${f1_id}/feeding-trial-protocols"
              payload: { protocol_code: "AAFCO-AM-001", animal_count: 8, duration_days: 26 }
              as: TrialCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /petfood/formulas/${f2_id}/feeding-trial-protocols"
              payload: { protocol_code: "AAFCO-AM-002", animal_count: 8, duration_days: 26 }
              as: TrialCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /petfood/feeding-trial-protocols/${p1_id}/open-enrollment"
              payload: {}
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p1_id}/enroll"
              payload: { enrolled_delta: 8 }
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p1_id}/start-trial"
              payload: {}
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p1_id}/complete-observation"
              payload: { completed_count: 6 }
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p2_id}/open-enrollment"
              payload: {}
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p2_id}/enroll"
              payload: { enrolled_delta: 8 }
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p2_id}/start-trial"
              payload: {}
              as: TrialCoordinator
            - call: "POST /petfood/feeding-trial-protocols/${p2_id}/complete-observation"
              payload: { completed_count: 5 }
              as: TrialCoordinator
          trigger:
            - call: "POST /petfood/feeding-trial-protocols/${p1_id}/record-verdict"
              payload: {}
              as: QAApprover
              captures: { p1_status: $.data.status, p1_ratio: $.data.completion_ratio }
            - call: "POST /petfood/feeding-trial-protocols/${p2_id}/record-verdict"
              payload: {}
              as: QAApprover
              captures: { p2_status: $.data.status, p2_ratio: $.data.completion_ratio }
          assert:
            - "Protocol p1 completion_ratio == 0.75 and status == PASSED (>= boundary inclusive)"
            - "Protocol p2 completion_ratio == 0.625 and status == FAILED"

