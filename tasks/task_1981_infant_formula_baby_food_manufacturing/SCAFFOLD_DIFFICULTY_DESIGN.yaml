            - call: "POST /api/v1/nutrient-profiles/${npexp_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${npexp_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "LACTOSE-EXP"
                ingredient_name: "Lactose Expiry Test"
                category: "CARBOHYDRATE"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { ingexp_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-EXP-1"
                product_name: "Expiry Test Formula"
                nutrient_profile_id: "${npexp_id}"
                ingredients:
                  - ingredient_id: "${ingexp_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { fexp_id: $.data.id }
            - call: "POST /api/v1/formulas/${fexp_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${fexp_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-011"
                validation_validity_days: 30
              as: QA_MANAGER
              captures: { pvexp_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pvexp_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pvexp_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 4.0
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${fexp_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${fexp_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "Expiry Test Formula"
              as: REGULATORY_AFFAIRS
              captures: { lsexp_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${lsexp_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${lsexp_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${lsexp_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${fexp_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-EXP"
                legal_name: "Expiry Supplier"
                ingredient_categories: ["CARBOHYDRATE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { supexp_id: $.data.id }
