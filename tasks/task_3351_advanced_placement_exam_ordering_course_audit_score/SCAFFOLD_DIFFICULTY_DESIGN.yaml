  - rule_id: cross_entity_state_dependency
    instances:
      - name: exam_order_open_depends_on_audit_approved_and_label
        grounds:
          - validations[priority=10]
          - state_machines.ExamOrder.DRAFT_to_OPEN
          - state_machines.CourseAudit.IN_REVIEW_to_APPROVED
          - entities.School.fields.program_label_authorized
        distinguishing_aspect: "The ExamOrder -> CourseAudit/School pair: a DRAFT order may only open when its own CourseAudit is APPROVED and the owning School carries program_label_authorized true, so the order's valid transitions depend on two other entities' states rather than its own."
        test_recipe:
          setup:
            - "A school that is NOT yet label-authorized, its course audit left in SUBMITTED, and a DRAFT exam order pinned to that audit; clock in REGULAR"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Westbrook High", school_code: "WB0001", country_code: "US", center_code: "5501", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Environmental Science", syllabus_hash: "h-wb-1", submitted_by_user_id: "u-coord-13" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_id_v1: "$.data.version" }
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_id_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "GET /ap-program/schools/${school_id}"
              as: PlatformAdmin
          assert:
            - "error_id == ERR_COURSE_AUDIT_NOT_APPROVED because the CourseAudit is still SUBMITTED"
            - "School.program_label_authorized == false and ExamOrder.status == DRAFT after the refusal"
      - name: score_release_depends_on_irregularity_case_cleared
