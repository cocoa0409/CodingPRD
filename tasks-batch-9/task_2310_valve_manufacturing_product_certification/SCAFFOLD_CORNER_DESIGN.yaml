        distinguishing_aspect: "With only the material test report and the dimensional report attached, documentation_completeness_pct is 50.00, so ISSUE_DOC_PACKAGE returns ERR_DOC_PACKAGE_INCOMPLETE (409) and doc_package_status stays ASSEMBLING."
        test_recipe:
          setup:
