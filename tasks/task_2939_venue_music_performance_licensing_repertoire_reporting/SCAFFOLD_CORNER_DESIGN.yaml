  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_layer_occ_stale_venue_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.application-create-stale-venue
          - endpoints.POST_licensing_license_applications
          - errors[ERR_STALE_VENUE_VERSION]
        distinguishing_aspect: "The OCC guard is on the parent Venue, not on the application: a PATCH by someone else between the client's read and its create invalidates the create with a 412, and the same payload succeeds once the fresh version is supplied."
        test_recipe:
          setup:
            - "Society BMI has an EFFECTIVE BAR_GRILL schedule and Venue V1 is registered at version 1"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "PATCH /licensing/venues/${v1_id}"
              payload: { weekly_live_performance_nights: 5 }
              as: LicensingAdmin
              captures: { v1_v1: "$.data.version" }
          trigger:
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v1}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app_id: "$.data.id", app_status: "$.data.status" }
          assert:
            - "${v1_v0} was 1 and ${v1_v1} is 2, because the PATCH bumped the venue"
            - "The create carrying the stale ${v1_v0} returned HTTP 412 with data.error_id == ERR_STALE_VENUE_VERSION"
            - "No application row was written by the refused call: the retry produced the first and only one, ${app_id}, in status DRAFT"
            - "The two payloads are byte-identical apart from expected_venue_version, so nothing but the guard decided the outcome"
            - "The application's declared_live_nights stays 4 even though the venue now says 5: the declared variant is the operator's claim, not a copy of the venue"
            - "A create omitting expected_venue_version entirely is refused with ERR_INVALID_REQUEST, not silently accepted"

      - name: corner_layer_occ_stale_license_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.renewal-create-stale-license
          - endpoints.POST_licensing_licenses_id_renew
          - errors[ERR_STALE_LICENSE_VERSION]
        distinguishing_aspect: "A renewal quotes a rate, so its guard is the predecessor License's version: any intervening write to that row, even a suspend and reinstate pair that leaves the licence exactly where it started, forces a re-read."
        test_recipe:
          setup:
            - "Venue V1's licence L1 is ACTIVE and its version was captured at activation"
            - "L1 is then suspended and reinstated, which bumps its version twice"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_ver: "$.data.version", lic1_fee: "$.data.annual_fee_cents" }
            - call: "POST /licensing/licenses/${lic1_id}/suspend"
              payload: { suspension_reason: "OPERATOR_REQUEST" }
              as: LicensingAdmin
            - call: "POST /licensing/licenses/${lic1_id}/reinstate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_ver2: "$.data.version", lic1_status2: "$.data.coverage_status" }
          trigger:
            - call: "POST /licensing/licenses/${lic1_id}/renew"
              payload: { requested_term_start: "2027-08-01T00:00:00Z", expected_license_version: "${lic1_ver}" }
              as: LicensingAdmin
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/licenses/${lic1_id}/renew"
              payload: { requested_term_start: "2027-08-01T00:00:00Z", expected_license_version: "${lic1_ver2}" }
              as: LicensingAdmin
              captures: { lic2_id: "$.data.id", lic2_pred: "$.data.renewal_of_license_id" }
          assert:
            - "${lic1_status2} is ACTIVE again, so the round trip left the coverage dimension unchanged while ${lic1_ver2} is two greater than ${lic1_ver}"
            - "The renewal carrying the stale ${lic1_ver} returned HTTP 412 with data.error_id == ERR_STALE_LICENSE_VERSION, not ERR_LICENSE_STATE_INVALID"
            - "The refused call created no successor and did not set renewal_issued_at on ${lic1_id}"
            - "The retry with ${lic1_ver2} returned HTTP 201: ${lic2_id} is PENDING_ACTIVATION and ${lic2_pred} is ${lic1_id}"
            - "After the successful renewal License.${lic1_id}.version is ${lic1_ver2} plus 1, so the guard value is consumed exactly once"

      - name: corner_layer_delinquency_threshold_is_inclusive_on_the_way_back
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.venue_ledger_balances.constants.DELINQUENCY_TOLERANCE_CENTS
          - state_machines.License.INVOICED_to_DELINQUENT
          - state_machines.License.DELINQUENT_to_INVOICED
        distinguishing_aspect: "The delinquency threshold is strictly greater-than on the way up and at-most on the way back: 250001 outstanding is still DELINQUENT and the single cent that reaches exactly 250000 restores INVOICED, with no assessment status change at all."
        test_recipe:
          setup:
            - "Venue P1's licence LP1 was activated with annual_fee_cents 463761, which is above DELINQUENCY_TOLERANCE_CENTS, so it is already DELINQUENT"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
