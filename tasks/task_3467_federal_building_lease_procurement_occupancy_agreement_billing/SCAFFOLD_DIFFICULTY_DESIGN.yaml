# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x >=2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is executable from empty-DB via its
# setup_api_calls chain. All money in integer cents.
# Canonical leased fixture (chains below): leased_sf 68,300; shell 3000 c/sf/yr;
# operating 900; base tax 400; TI allowance 5000 c/sf -> 341,500,000 total;
# TI cost 400,000,000 -> principal 58,500,000; ANNUITY 120 months @0.5% ->
# 649,470/month; free rent months 0..3 (month_index <= 3 abated);
# lease 2027-01-01 .. 2036-12-31.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tax_escalation_base_year_stop_vs_cpi_indexed
        grounds:
          - calculations.tax_escalation
          - entities.Lease.fields.escalation_method
          - entities.Lease.fields.tax_statements
          - entities.RentBill.fields.tax_escalation_cents
        distinguishing_aspect: |
          Dual variant in the LEASE COST domain: two leases with identical
          rates, identical square footage, and an identical 2027 tax statement
          (actual 460 c/sf, cpi_index 315.0 vs cpi_base_index 300.0) produce
          different monthly tax escalations — BASE_YEAR_STOP yields 341,500
          cents, CPI_INDEXED yields 113,833 cents — purely because of the
          escalation_method variant. Distinct entity domain from the
          utilization_rate instance (measurement on UtilizationSurvey).
        test_recipe:
          setup:
            - "Lease A awarded from a BASE_YEAR_STOP offer and commenced 2027-01-01; lease B awarded from a CPI_INDEXED offer (cpi_base_index 300.0) and commenced 2027-01-01; both leased_sf 68,300, base tax 400 c/sf/yr"
            - "Both leases carry an identical 2027 tax statement { actual_tax_per_sf_yr_cents: 460, cpi_index: 315.0 }"
            - "Both OAs ACTIVE, assigned_sf 68,300, term 2027-01-01..2036-12-31"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-100", name: "Forest Service" }, as: GSAAdmin, captures: { ag_a: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld_a: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Riverside Annex", address: "200 River Rd", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag_a}", title: "HQ Consolidation A", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag_a}", captures: { req_a: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req_a}/submit", as: AgencyManager, as_user_id: "${ag_a}" }
            - { call: "POST /leasing/space-requirements/${req_a}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req_a}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req_a}/offers", payload: { building_id: "${bld_a}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off_a: $.data.id } }
            - { call: "POST /leasing/offers/${off_a}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off_a}/select", as: GSALeasingOfficer, captures: { lease_a: $.data.id } }
            - { call: "POST /leasing/leases/${lease_a}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease_a}", agency_id: "${ag_a}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa_a: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa_a}/activate", as: AgencyManager, as_user_id: "${ag_a}" }
            - { call: "POST /leasing/leases/${lease_a}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 460, cpi_index: 315.0 }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag_a}", title: "HQ Consolidation B", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag_a}", captures: { req_b: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req_b}/submit", as: AgencyManager, as_user_id: "${ag_a}" }
            - { call: "POST /leasing/space-requirements/${req_b}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req_b}/complete-market-survey", payload: { survey_summary: "Six buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req_b}/offers", payload: { building_id: "${bld_b}", lessor_name: "River Properties Inc", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "CPI_INDEXED", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off_b: $.data.id } }
            - { call: "POST /leasing/offers/${off_b}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off_b}/select", as: GSALeasingOfficer, captures: { lease_b: $.data.id } }
            - { call: "POST /leasing/leases/${lease_b}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY", cpi_base_index: 300.0 }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease_b}", agency_id: "${ag_a}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa_b: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa_b}/activate", as: AgencyManager, as_user_id: "${ag_a}" }
            - { call: "POST /leasing/leases/${lease_b}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 460, cpi_index: 315.0 }, as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa_a}/bills", payload: { billing_month: "2027-04" }, as: GSAPropertyManager, captures: { tax_a: $.data.tax_escalation_cents } }
            - { call: "POST /leasing/occupancy-agreements/${oa_b}/bills", payload: { billing_month: "2027-04" }, as: GSAPropertyManager, captures: { tax_b: $.data.tax_escalation_cents } }
          assert:
            - "Bill on ${oa_a}: tax_escalation_cents == 341500"
            - "Bill on ${oa_b}: tax_escalation_cents == 113833"
            - "${tax_a} != ${tax_b} (identical statement data, different variant)"

      - name: utilization_space_based_vs_headcount_based_diverge
        grounds:
          - calculations.utilization_rate
          - entities.UtilizationSurvey.fields.method
          - entities.UtilizationSurvey.fields.utilization_rate
        distinguishing_aspect: |
          Dual variant in the MEASUREMENT domain: identical survey payloads
          (measured_headcount 100, utilized_sf 12,000 on a 20,000 sf OA) yield
          utilization_rate 0.6000 under SPACE_BASED but 0.7500 under
          HEADCOUNT_BASED. Distinct entity domain from the tax_escalation
          instance (lease cost accounting).
        test_recipe:
          setup:
            - "Owned building (50,000 sf) with one ACTIVE OA of 20,000 sf"
            - "Logical clock at 2027-03-20 so measured_at 2027-03-15 is in the past"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-200", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-20T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 20000, start_date: "2026-11-01", end_date: "2036-10-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/occupancy-agreements/${oa}/utilization-surveys", payload: { method: "SPACE_BASED", measured_headcount: 100, utilized_sf: 12000, measured_at: "2027-03-15T00:00:00Z" }, as: GSAPropertyManager, captures: { s1: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/utilization-surveys", payload: { method: "HEADCOUNT_BASED", measured_headcount: 100, utilized_sf: 12000, measured_at: "2027-03-15T00:00:00Z" }, as: GSAPropertyManager, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /leasing/utilization-surveys/${s1}/finalize", as: GSAPropertyManager, captures: { r1: $.data.utilization_rate } }
            - { call: "POST /leasing/utilization-surveys/${s2}/finalize", as: GSAPropertyManager, captures: { r2: $.data.utilization_rate } }
          assert:
            - "Survey ${s1}: utilization_rate == 0.6000 (12000 / 20000)"
            - "Survey ${s2}: utilization_rate == 0.7500 (100 * 150 / 20000)"
            - "${r1} != ${r2} (identical payloads, different variant)"
            - "Both surveys: reduction_action_id is null (0.6000 and 0.7500 are not < 0.60)"

  - rule_id: combinatorial_formula
    instances:
      - name: monthly_bill_pinned_ordering_fee_abatement_credit
        grounds:
          - calculations.monthly_rent_bill
          - calculations.sla_service_credit
          - entities.RentBill.fields.fee_cents
          - entities.RentBill.fields.abatement_credit_cents
          - entities.RentBill.fields.service_credit_applied_cents
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the fee is 5% of the
          POST-abatement subtotal (abatement removes the shell before the fee
          is computed), and the pending service credit is consumed LAST, after
          the fee. Any other order (fee on gross, credit before fee) produces
          different cents: here fee == 305,674 on subtotal 6,113,470 and
          total == 6,399,144 after a 20,000 credit.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf; lease commenced 2027-01-01 with 3 free-rent months; ANNUITY TI schedule (649,470/month); 2027 tax statement actual 460 recorded"
            - "A CRITICAL service ticket on the lease's building, reported against this OA, opened 2027-01-20T00:00 and resolved 2027-01-22T01:00 (49h open, 25h over the 24h SLA -> ceil(25/24)=2 daily blocks -> 20,000 credit), verified so the OA holds pending_service_credit_cents == 20000"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-110", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/leases/${lease}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 460 }, as: GSALeasingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-20T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/buildings/${bld}/service-tickets", payload: { reported_oa_id: "${oa}", category: "MAINTENANCE", severity: "CRITICAL", description: "Elevator bank outage" }, as: AgencyManager, as_user_id: "${ag}", captures: { tick: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-22T01:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/service-tickets/${tick}/resolve", as: GSAPropertyManager }
            - { call: "POST /leasing/service-tickets/${tick}/verify", as: AgencyManager, as_user_id: "${ag}" }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/bills", payload: { billing_month: "2027-02" }, as: GSAPropertyManager }
          assert:
            - "Bill.shell_cents == 17075000 and Bill.abatement_credit_cents == 17075000 (month_index 2 <= free_rent_months 3: shell fully abated)"
            - "Bill.operating_cents == 5122500 and Bill.tax_escalation_cents == 341500 and Bill.ti_amortization_cents == 649470"
            - "Bill.fee_cents == 305674 (5% of the POST-abatement subtotal 6,113,470, NOT of the gross 23,188,470)"
            - "Bill.service_credit_applied_cents == 20000 and Bill.total_cents == 6399144"
            - "OA ${oa}.pending_service_credit_cents == 0 after generation (credit consumed last)"

      - name: alteration_amortization_monthly_first_rounding_residual_final
        grounds:
          - calculations.alteration_amortization
          - entities.AlterationRequest.fields.monthly_amort_cents
          - entities.AlterationRequest.fields.amortization_months
          - entities.RentBill.fields.alteration_amortization_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the level monthly payment is rounded
          half-up to cents FIRST (10,000,000 over 102 months @ 7%/12 ->
          130,359), and the residual is absorbed by the FINAL month
          (130,322), so month N and month 102 differ by exactly the rounding
          drift. 'Round the total then divide' would give different cents and
          is forbidden. Different mode from the bill-ordering instance.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf, term 2027-01-01..2036-12-31; 2027 tax statement actual 460 recorded"
            - "Alteration estimated at 10,000,000 cents with work window 2028-03-01..2028-06-10, approved AMORTIZED (window after work_end: 2028-07..2036-12 = 102 months >= 12), completed 2028-06-15"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-120", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/leases/${lease}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 460 }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "SCIF build-out", description: "Secure suite on floor 4", scope_sf: 2000 }, as: AgencyManager, as_user_id: "${ag}", captures: { alt: $.data.id } }
            - { call: "POST /leasing/alteration-requests/${alt}/estimate", payload: { estimated_cost_cents: 10000000, work_start_date: "2028-03-01", work_end_date: "2028-06-10" }, as: GSAPropertyManager }
            - { call: "POST /leasing/alteration-requests/${alt}/approve", payload: { funding_method: "AMORTIZED" }, as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/alteration-requests/${alt}/complete", payload: { completion_date: "2028-06-15" }, as: GSAPropertyManager }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/bills", payload: { billing_month: "2028-08" }, as: GSAPropertyManager }
            - { call: "POST /leasing/occupancy-agreements/${oa}/bills", payload: { billing_month: "2036-12" }, as: GSAPropertyManager }
          assert:
            - "Alteration ${alt}: amortization_months == 102, amortization_start_month == '2028-07', monthly_amort_cents == 130359"
            - "Bill 2028-08: alteration_amortization_cents == 130359 (level month)"
            - "Bill 2036-12: alteration_amortization_cents == 130322 (final month absorbs the rounding residual)"
            - "Bill 2028-08: total_cents == 24484770; Bill 2036-12: total_cents == 24484732"

  - rule_id: non_linear_state_machine
    instances:
      - name: alteration_revision_cycle_with_occ_version_progression
        grounds:
          - state_machines.AlterationRequest.ESTIMATED_to_REQUESTED
          - concurrency_rules[alteration-revise-stale-version]
          - entities.AlterationRequest
        distinguishing_aspect: |
          Cycle on AlterationRequest: ESTIMATED -> REQUESTED -> ESTIMATED ->
          APPROVED. Each revision clears the pending estimate and advances
          entity version, so the OCC token captured after the first estimate
          is exactly what authorizes the revise. Distinct entity from the
          LeaseOffer branching instance.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf, term 2027-01-01..2036-12-31"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-130", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
