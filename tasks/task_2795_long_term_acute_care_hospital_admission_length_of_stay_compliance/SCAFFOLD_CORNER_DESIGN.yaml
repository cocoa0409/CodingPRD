      - name: vent_hours_total_accumulates_the_seed_and_every_outcome
        claim_type: aggregation
        grounds:
          - calculations.weaning_vent_hours_total
          - endpoints.POST_ltch_stays_id_weaning_plans
          - endpoints.POST_ltch_weaning_plans_id_record_sbt
        distinguishing_aspect: "The running total is seeded by the create-time vent_hours_total 40.5 and then advanced by every record-sbt call regardless of outcome (40.5 -> 64.5 -> 85.0 -> 85.5), so an implementation that ignores the seed lands on 45.0 and one that counts only TOLERATED trials lands on 61.0; sbt_attempt_count advances on all three while current_step advances only on the TOLERATED one."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207, an ACTIVE PULMONOLOGY physician."
            - "Patient Abe Hours is admitted at the default clock 2026-08-01T00:00:00Z; RESPIRATORY_THERAPY and PHYSICIAN IdtNotes are filed at that instant so a TOLERATED trial is not blocked by the freshness rule."
            - "A weaning plan is created with vent_hours_total 40.5 carried over from the referring ICU."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/physicians"
              payload: { npi: "2000000001", full_name: "Dr. Pat Pulmo", specialty: "PULMONOLOGY" }
              as: ComplianceOfficer
              captures: { phys_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-450", full_name: "Abe Hours", birth_date: "1953-10-13", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat450_id: $.data.id, pat450_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat450_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat450_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref450_id: $.data.id }
            - call: "POST /ltch/referrals/${ref450_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref450_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay450_id: $.data.id }
            - call: "POST /ltch/stays/${stay450_id}/idt-notes"
              payload: { discipline: "RESPIRATORY_THERAPY", note_text: "Vent settings and trial plan documented.", goals_documented: true }
              as: UtilizationReviewNurse
            - call: "POST /ltch/stays/${stay450_id}/idt-notes"
              payload: { discipline: "PHYSICIAN", note_text: "Weaning protocol authorised.", goals_documented: true }
              as: AttendingPhysician
              as_user_id: "${phys_id}"
            - call: "POST /ltch/stays/${stay450_id}/weaning-plans"
              payload: { protocol_label: "STANDARD_SBT", vent_hours_total: 40.5 }
              as: UtilizationReviewNurse
              captures: { plan450_id: $.data.id, plan450_seed: $.data.vent_hours_total, plan450_attempts0: $.data.sbt_attempt_count }
          trigger:
            - call: "POST /ltch/weaning-plans/${plan450_id}/record-sbt"
              payload: { outcome: "FAILED", sbt_hours: 0, vent_hours_since_last: 24 }
              as: UtilizationReviewNurse
              captures: { plan450_v1: $.data.vent_hours_total, plan450_step1: $.data.current_step, plan450_status1: $.data.status }
            - call: "POST /ltch/weaning-plans/${plan450_id}/record-sbt"
              payload: { outcome: "TOLERATED", sbt_hours: 6, vent_hours_since_last: 20.5 }
              as: UtilizationReviewNurse
              captures: { plan450_v2: $.data.vent_hours_total, plan450_step2: $.data.current_step, plan450_max2: $.data.max_tolerated_sbt_hours, plan450_cf2: $.data.consecutive_failed_sbt }
            - call: "POST /ltch/weaning-plans/${plan450_id}/record-sbt"
              payload: { outcome: "FAILED", sbt_hours: 0, vent_hours_since_last: 0.5 }
              as: UtilizationReviewNurse
              captures: { plan450_v3: $.data.vent_hours_total, plan450_step3: $.data.current_step, plan450_status3: $.data.status, plan450_attempts3: $.data.sbt_attempt_count }
          assert:
            - "plan450_seed == 40.5 and plan450_attempts0 == 0 - the create-time input seeds the aggregate"
            - "plan450_v1 == 64.5 with plan450_step1 == 0 and plan450_status1 == SBT_TRIAL - a FAILED trial adds hours without advancing the step"
            - "plan450_v2 == 85.0, plan450_step2 == 1, plan450_max2 == 6.0 and plan450_cf2 == 0"
            - "plan450_v3 == 85.5, plan450_step3 == 1, plan450_status3 == PROGRESSING (consecutive_failed_sbt back to 1, below 2) and plan450_attempts3 == 3"
            - "plan450_v3 != 45.0 (seed ignored) and plan450_v3 != 61.0 (only TOLERATED counted)"
            - "vent_hours_total 85.5 is below VENT_HOURS_SITE_NEUTRAL_MIN 96, so this plan would not make a stay vent-qualifying"

      - name: no_weaning_plan_and_low_icu_days_select_the_site_neutral_variant
        claim_type: variant_selection
        grounds:
          - calculations.stay_payment_determination
          - entities.PaymentDetermination.fields.payment_variant
        distinguishing_aspect: "A COMPLEX_WOUND admission with icu_days_at_referral 1 and no WeaningPlan at all must select SITE_NEUTRAL: a null plan counts as not vent-qualifying rather than raising or defaulting to the standard system, so base_payment_cents is the site-neutral 3,400,000 even though the standard variant 3,600,000 is stored alongside it."
