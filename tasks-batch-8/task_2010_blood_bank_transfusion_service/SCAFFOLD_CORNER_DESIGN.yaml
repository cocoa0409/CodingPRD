        claim_type: rbac_denial
        grounds:
          - "roles[BloodBankSupervisor]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "T&S bench work is Technologist-exclusive; the supervisor override role does NOT extend to it."
