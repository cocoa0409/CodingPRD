  # ===========================================================================
  - section: state_machines
    instances:

      - name: specimen_second_accession_from_accessioned_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Specimen.R_RECEIVED_to_R_ACCESSIONED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Specimen accessioning is not idempotent: the second call on an already ACCESSIONED specimen finds no R_RECEIVED_to_R_ACCESSIONED row for its current state and fails with ERR_INVALID_STATE, leaving the bubble-up order untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with an accessioned specimen whose order is ACCESSIONED."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - *k_ord
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${kt1_id}", instrument_code: "IMM-12", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T00:00:00Z", reserved_end_at: "2026-09-01T04:00:00Z" }
              as: MedicalTechnologist
            - call: "POST /reference-lab/specimens/${ksp_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { ksp_acc: $.data.status }
            - call: "POST /reference-lab/send-out-orders/${kord_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { kord_acc: $.data.order_status }
          trigger:
            - call: "POST /reference-lab/specimens/${ksp_id}/accession"
              payload: {}
              as: AccessioningTechnologist
              captures: { k_err4: $.data.error_id }
          assert:
            - "the first accession returned Specimen.${ksp_id}.status == ACCESSIONED and the order OrderStatus ACCESSIONED"
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Specimen.${ksp_id}.status is still ACCESSIONED and version advanced by exactly 1 across the whole recipe, not 2"
            - "SendOutOrder.${kord_id}.billing_status == PROVISIONAL and provisional_charge_cents is unchanged by the failed second accession"

      - name: cleared_client_cannot_be_deactivated_and_inactive_client_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ClientLaboratory.SUSPENDED_to_INACTIVE
          - state_machines.ClientLaboratory
          - errors.ERR_ALREADY_TERMINAL
        distinguishing_aspect: "INACTIVE is a terminal client posture: deactivating a client that still holds a live order fails at the precondition, and once deactivation does succeed every later posture action returns ERR_ALREADY_TERMINAL instead of moving the client."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a SUSPENDED posture and one live order."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - *k_ord
          trigger:
            - call: "POST /reference-lab/client-laboratories/${kc2_id}/suspend"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_posture_susp: $.data.status }
            - call: "POST /reference-lab/client-laboratories/${kc2_id}/deactivate"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_err5: $.data.error_id }
            - call: "POST /reference-lab/send-out-orders/${kord_id}/cancel"
              payload: {}
              as: ReferenceLabOperations
              captures: { kord_cancel: $.data.order_status }
            - call: "POST /reference-lab/client-laboratories/${kc2_id}/deactivate"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_posture_inactive: $.data.status }
            - call: "POST /reference-lab/client-laboratories/${kc2_id}/activate"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_err6: $.data.error_id }
          assert:
            - "ClientLaboratory.${kc2_id}.status == SUSPENDED after the suspension"
            - "the first deactivation returns 409 with error_id == ERR_INVALID_STATE because the client still holds SendOutOrder.${kord_id} in SUBMITTED"
            - "after the order is cancelled, the deactivation succeeds and ClientLaboratory.${kc2_id}.status == INACTIVE"
            - "the activation attempt on the INACTIVE client returns 409 and error_id == ERR_ALREADY_TERMINAL"
            - "ClientLaboratory.${kc2_id}.status is still INACTIVE, so no action moved it out of the terminal state"

      - name: specimen_second_rejection_from_rejected_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Specimen.R_ACCESSIONED_to_R_REJECTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REJECTED is a specimen terminal state with no outgoing transition except the narrow TEST_WITHDRAWN re-accession, so rejecting an already rejected specimen returns ERR_INVALID_STATE rather than re-cascading the order cancellation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with an accessioned specimen whose order was cancelled by a first rejection."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - *k_ord
            - call: "POST /reference-lab/specimens/${ksp_id}/accession"
              payload: {}
              as: AccessioningTechnologist
          trigger:
            - call: "POST /reference-lab/specimens/${ksp_id}/reject"
              payload: { rejection_reason_code: "HEMOLYSIS" }
              as: AccessioningTechnologist
              captures: { ksp_rej: $.data.status }
            - call: "POST /reference-lab/specimens/${ksp_id}/reject"
              payload: { rejection_reason_code: "HEMOLYSIS" }
              as: AccessioningTechnologist
              captures: { k_err7: $.data.error_id }
          assert:
            - "the first rejection returns Specimen.${ksp_id}.status == REJECTED and SendOutOrder.${kord_id}.order_status == CANCELLED"
            - "the second rejection returns 409 and error_id == ERR_INVALID_STATE"
            - "Specimen.${ksp_id}.rejection_reason_code == \"HEMOLYSIS\" and is unchanged by the failed second attempt"
            - "GET /reference-lab/send-out-orders?client_laboratory_id=${kc2_id} still returns exactly 1 row, so no second cascade created an order"

      - name: courier_run_recall_reverts_a_dispatched_leg_to_planned
        claim_type: Valid Transition
        grounds:
          - state_machines.CourierRun.DISPATCHED_to_PLANNED
          - state_machines.CourierRun.PLANNED_to_DISPATCHED
          - endpoints.POST_/reference-lab/courier-runs/{id}/recall
        distinguishing_aspect: "The recall leg is the revert of dispatch: a leg dispatched with its departure instant at or before the clock moves DISPATCHED and then returns to PLANNED when recalled before the pickup instant, so the state visited is PLANNED, DISPATCHED, PLANNED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z; one ACTIVE client and a planned leg departing at 05:00 with a pickup at 07:00."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - &k_run2
              call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${kc2_id}", route_code: "VER-PM", origin_city: "Vernal", destination_city: "Salt Lake City", vehicle_id: "SUV-5", scheduled_departure_at: "2026-09-01T05:00:00Z", scheduled_arrival_at: "2026-09-01T10:00:00Z", scheduled_pickup_at: "2026-09-01T07:00:00Z", scheduled_delivery_at: "2026-09-01T10:00:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${kc2_v}" }
              as: CourierCoordinator
              captures: { krun2_id: $.data.id }
            - *k_pr
            - *k_act
          trigger:
            - call: "POST /reference-lab/courier-runs/${krun2_id}/dispatch"
              payload: {}
              as: CourierCoordinator
              captures: { k_cr_disp: $.data.status }
            - call: "POST /reference-lab/courier-runs/${krun2_id}/recall"
              payload: {}
              as: CourierCoordinator
              captures: { k_cr_back: $.data.status }
          assert:
            - "the dispatch returns CourierRun.${krun2_id}.status == DISPATCHED because the departure instant is at or before the clock"
            - "the recall returns CourierRun.${krun2_id}.status == PLANNED, the same state the leg already occupied"
            - "CourierRun.${krun2_id}.version == 3, one for the create and one per transition"
            - "CourierRun.${krun2_id}.specimen_count == 0 throughout"

      - name: aborted_run_cannot_be_started_by_the_clock_and_can_be_rebooked
        claim_type: Invalid Transitions
        grounds:
          - state_machines.InstrumentRun.RESERVED_to_RUNNING
          - state_machines.InstrumentRun.ABORTED_to_RESERVED
          - endpoints.PATCH_/reference-lab/instrument-runs/{id}
        distinguishing_aspect: "An aborted run never reaches RUNNING when the clock passes its original start, because the RESERVED_to_RUNNING transition requires RESERVED; the same row must be rebooked through PATCH to become bookable again."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one published ferritin entry and a run booked from 01:00 to 05:00 that is aborted before the clock advances."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - &k_runb
              call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${kt1_id}", instrument_code: "IMM-13", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T01:00:00Z", reserved_end_at: "2026-09-01T05:00:00Z" }
              as: MedicalTechnologist
              captures: { kirb_id: $.data.id }
            - call: "POST /reference-lab/instrument-runs/${kirb_id}/abort"
              payload: {}
              as: MedicalTechnologist
              captures: { kirb_abort: $.data.run_status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T02:00:00Z" }
              as: ReferenceLabOperations
            - call: "GET /reference-lab/instrument-runs/${kirb_id}"
              payload: {}
              as: MedicalTechnologist
              captures: { kirb_after_clock: $.data.run_status }
            - call: "PATCH /reference-lab/instrument-runs/${kirb_id}"
              payload: { reserved_start_at: "2026-09-01T06:00:00Z", reserved_end_at: "2026-09-01T10:00:00Z" }
              as: MedicalTechnologist
              captures: { kirb_rebook: $.data.run_status, kirb_occ: $.data.occupied_until_at }
          assert:
            - "the abort returns InstrumentRun.${kirb_id}.run_status == ABORTED before any clock movement"
            - "after the clock reaches 02:00 the run is still ABORTED, so the aborted booking never became RUNNING"
            - "the PATCH rebooks it and InstrumentRun.${kirb_id}.run_status == RESERVED"
            - "InstrumentRun.${kirb_id}.occupied_until_at == 2026-09-01T10:30:00Z, being the new end plus the 30-minute buffer"
            - "GET /reference-lab/instrument-runs?test_catalog_entry_id=${kt1_id} returns exactly 1 row, so the rebook reused the row instead of duplicating it"

  # ===========================================================================
  - section: calculations
    instances:

      - name: remaining_stability_is_derived_from_the_binding_minimum_across_ordered_tests
