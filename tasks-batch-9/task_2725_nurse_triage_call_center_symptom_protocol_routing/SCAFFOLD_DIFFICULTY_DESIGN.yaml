        distinguishing_aspect: "assign-nurse and abandon are exact inverses on the conserved counter: after abandoning, the nurse whose max_concurrent_calls is 1 must be assignable again, which only holds if the decrement was exactly one and did not overshoot to -1 or stall at 1."
