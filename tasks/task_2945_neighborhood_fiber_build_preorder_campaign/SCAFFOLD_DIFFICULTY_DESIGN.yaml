      - name: mdu_agreement_counter_offer_cycle_returns_to_sent
        grounds:
          - state_machines.MduOwnerAgreement.status
          - entities.MduOwnerAgreement.fields.offer_round
          - entities.MduOwnerAgreement.fields.counter_round
          - endpoints["POST /mdu-agreements/{id}/offers"]
          - endpoints["POST /mdu-agreements/{id}/owner-response"]
        distinguishing_aspect: |
          MduOwnerAgreement re-enters SENT from COUNTERED, so the same state is visited twice with
          a different offer_round; with max_counter_rounds 1 the second COUNTER from that revisited
          SENT state is rejected with ERR_COUNTER_LIMIT_REACHED while SIGN from the very same state
          succeeds, which no linear machine can express.
        test_recipe:
          setup:
            - "Campaign and one zone; one MDU address with unit_count 24."
            - "One PROPERTY_OWNER account acting as the building owner."
            - "One DRAFT agreement with access_fee_cents 250000, max_counter_rounds 1 and expires_at 2026-09-15T00:00:00Z."
            - "One offer sent (SENT, offer_round 1), one COUNTER at 200000 (COUNTERED, counter_round 1), one revised offer sent (SENT, offer_round 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 2, extension_grant_days: 30, claim_filing_window_days: 45, restoration_sla_days: 7, late_filing_factor: 0.60 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, threshold_pct: 10.00, required_permit_types: ["ROW"], max_concurrent_bury_ops: 2 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "500 Birch Tower", dwelling_type: "MDU", unit_count: 24, distance_to_node_m: 80 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Birch Tower LLC", email: "owner@birch.example.com", phone: "+13035550199", account_type: "PROPERTY_OWNER" }
              as: ProgramManager
              captures: { owner1: $.data.id }
            - call: "POST /mdu-agreements"
              payload: { service_address_id: "${a1}", owner_account_id: "${owner1}", access_fee_cents: 250000, expires_at: "2026-09-15T00:00:00Z", max_counter_rounds: 1 }
              as: ProgramManager
              captures: { ag1: $.data.id }
            - call: "POST /mdu-agreements/${ag1}/offers"
              payload: { access_fee_cents: 250000 }
              as: ProgramManager
              captures: { status_after_offer_1: $.data.status, offer_round_1: $.data.offer_round }
            - call: "POST /mdu-agreements/${ag1}/owner-response"
              payload: { response: "COUNTER", countered_fee_cents: 200000 }
              as: MduOwner
              as_user_id: "${owner1}"
              captures: { status_after_counter_1: $.data.status, counter_round_1: $.data.counter_round }
            - call: "POST /mdu-agreements/${ag1}/offers"
              payload: { access_fee_cents: 220000 }
              as: ProgramManager
              captures: { status_after_offer_2: $.data.status, offer_round_2: $.data.offer_round }
          trigger:
            - call: "POST /mdu-agreements/${ag1}/owner-response"
