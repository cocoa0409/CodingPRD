          - errors[ERR_TRUCK_UNAVAILABLE]
          - entities.Job.fields.truck_id
        distinguishing_aspect: "Truck TK is assigned to a 09:00-11:00 job; assigning it to an 11:00-13:00 job (touching endpoints, gap 0) is rejected because truck overlap uses CLOSED intervals with NO buffer, so shared endpoints collide. Resource = Truck, different interval semantics than the helper buffer."
        test_recipe:
          setup:
            - "Truck TK; Job JT1 (truck_required, window 2026-03-12T09:00-11:00) BOOKED with TK assigned. Job JT2 (truck_required, window 2026-03-12T11:00-13:00) BOOKED."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /trucks", payload: { name: "TK", capacity_cuft: 800, daily_rate_cents: 20000 }, as: Admin, captures: { tk: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-12T09:00:00Z", window_end: "2026-03-12T11:00:00Z", truck_required: true }, as: Customer, as_user_id: "${cust}", captures: { jt1: "$.data.id" } }
            - { call: "POST /jobs/${jt1}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { qt1: "$.data.id" } }
            - { call: "GET /jobs/${jt1}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { vt1: "$.data.version" } }
            - { call: "POST /jobs/${jt1}/book", payload: { quote_id: "${qt1}", expected_job_version: "${vt1}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /jobs/${jt1}/assign-truck", payload: { truck_id: "${tk}" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-12T11:00:00Z", window_end: "2026-03-12T13:00:00Z", truck_required: true }, as: Customer, as_user_id: "${cust}", captures: { jt2: "$.data.id" } }
            - { call: "POST /jobs/${jt2}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { qt2: "$.data.id" } }
            - { call: "GET /jobs/${jt2}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { vt2: "$.data.version" } }
            - { call: "POST /jobs/${jt2}/book", payload: { quote_id: "${qt2}", expected_job_version: "${vt2}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${jt2}/assign-truck", payload: { truck_id: "${tk}" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_TRUCK_UNAVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_ledger_conserved_on_reversal
        grounds:
          - state_machines.Payout.RELEASED_to_REVERSED
          - calculations.helper_lifetime_payout
          - calculations.payout_amount
          - entities.Helper.fields.lifetime_payout_cents
        distinguishing_aspect: "Settlement releases a Payout of 14100 (lifetime becomes 14100); reversing it drops lifetime back to 0, keeping the money invariant Helper.lifetime_payout_cents == SUM(total_payout_cents WHERE status=RELEASED) exact (no drift). Conserved quantity = money."
        test_recipe:
          setup:
            - "Job JS SETTLED with helper HS as checked-out crew; one RELEASED Payout of 14100 (base 12000 + tip 1500 + on-time bonus 600). HS.lifetime_payout_cents == 14100 == SUM of RELEASED payouts."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HS", email: "hs@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hs: "$.data.id" } }
            - { call: "POST /helpers/${hs}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { js: "$.data.id" } }
            - { call: "POST /jobs/${js}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${js}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${js}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${js}", helper_id: "${hs}", role: "LEAD" }, as: Dispatcher, captures: { asg: "$.data.id" } }
            - { call: "POST /assignments/${asg}/check-in", payload: {}, as: Helper, as_user_id: "${hs}" }
            - { call: "POST /jobs/${js}/start", payload: {}, as: Dispatcher }
            - { call: "POST /assignments/${asg}/check-out", payload: {}, as: Helper, as_user_id: "${hs}" }
            - { call: "POST /jobs/${js}/complete", payload: { actual_hours: 3.0 }, as: Dispatcher }
            - { call: "POST /ratings", payload: { job_id: "${js}", helper_id: "${hs}", stars: 5, tip_cents: 1500 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /jobs/${js}/settle", payload: {}, as: Admin }
            - { call: "GET /payouts", payload: { job_id: "${js}" }, as: Admin, captures: { pay: "$.data[0].id" } }
          trigger:
            - { call: "POST /payouts/${pay}/reverse", payload: {}, as: Admin }
          assert:
            - "Payout.${pay}.status == REVERSED"
            - "Helper.${hs}.lifetime_payout_cents == 0"

      - name: assignment_slots_conserved_on_cancel
        grounds:
          - state_machines.Assignment.ASSIGNED_to_RELEASED
          - state_machines.Job.BOOKED_to_CANCELLED
          - calculations.helper_active_assignment_count
          - entities.Helper.fields.active_assignment_count
        distinguishing_aspect: "Assigning HB increments active_assignment_count to 1; cancelling the BOOKED job releases the assignment and returns the count to 0, keeping the count invariant Helper.active_assignment_count == COUNT(assignments in {ASSIGNED,CHECKED_IN,CHECKED_OUT}) exact. Conserved quantity = integer slot count (not money)."
        test_recipe:
          setup:
            - "Helper HB APPROVED (active_assignment_count 0). Job JB BOOKED. HB assigned to JB (active_assignment_count becomes 1)."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HB", email: "hb@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hb: "$.data.id" } }
            - { call: "POST /helpers/${hb}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jb: "$.data.id" } }
            - { call: "POST /jobs/${jb}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${jb}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${jb}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${jb}", helper_id: "${hb}" }, as: Dispatcher, captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /jobs/${jb}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
          assert:
            - "Assignment.${asg}.status == RELEASED"
            - "Helper.${hb}.active_assignment_count == 0"
