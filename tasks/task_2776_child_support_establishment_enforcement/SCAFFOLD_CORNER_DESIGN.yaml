          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z, then advances to 2026-09-20T00:00:00Z."
            - "Both cases: CP 200000 and NCP 113200 VERIFIED_WAGE_RECORD, so the self-support reserve floors monthly_obligation_cents at MINIMUM_ORDER_CENTS 5000 and the second gate is only 10000."
            - "Case P is PA_REFERRAL with tanf_assistance true; case D is DIRECT_APPLICATION with tanf_assistance false (validation priority 15 ties the flag to the type)."
            - "Each case gets one ARREARS_JUDGMENT charge of 30000 due 2026-08-15, so statutory interest at 2026-09-20 is round_half_up(30000 * 0.005 * 1) == 150."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
