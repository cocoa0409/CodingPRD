            - { call: "POST /batch-work-items", payload: { batch_id: "${batchC}", notice_id: "${n3}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batchC}/seal", as: ProgramCoordinator, captures: { vC: "$.data.version" } }
            - { call: "POST /bids", payload: { batch_id: "${batchC}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${vC}" }, as: Contractor, as_user_id: "${c1}", captures: { bidC1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-26T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bid-batches/${batchB}/award", as: ProgramCoordinator, captures: { b_winner: "$.data.awarded_bid_id", b_total: "$.data.awarded_total_cents" } }
            - { call: "GET /bids/${bidB1}", as: ProgramCoordinator, captures: { b1_status: "$.data.status" } }
            - { call: "POST /bid-batches/${batchC}/award", as: ProgramCoordinator, captures: { c_winner: "$.data.awarded_bid_id", c_total: "$.data.awarded_total_cents" } }
          assert:
            - "a_winner == bidA (C1 holds batch A [2026-10-01, 2026-11-01))"
            - "b_winner == bidB2 and b_total == 50000 — C1's lower bid (45000) is excluded by the half-open window conflict with batch A"
            - "b1_status == NOT_AWARDED"
            - "c_winner == bidC1 and c_total == 45000 — adjacency (C starts exactly at A's end) is not a conflict, so C1 is eligible again"

      - name: cycle_window_closed_interval_overlap
        grounds:
          - entities.ProgramCycle.fields.window_start_date
          - entities.ProgramCycle.fields.window_end_date
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: ProgramCycle; interval semantics: CLOSED intervals where inclusive adjacency
          counts as overlap (end == other's start IS a conflict) — the opposite edge treatment
          from the contractor half-open rule. [2026-12-31, ...] collides with [..., 2026-12-31];
          [2027-01-01, ...] does not.
        test_recipe:
          setup:
            - "cycle 1 with window [2026-01-01, 2026-12-31] exists"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { cycle1: "$.data.id" } }
          trigger:
            - { call: "POST /program-cycles", payload: { cycle_year: 2027, window_start_date: "2026-12-31", window_end_date: "2027-06-30", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "POST /program-cycles", payload: { cycle_year: 2027, window_start_date: "2027-01-01", window_end_date: "2027-12-31", appropriation_cents: 1000000 }, as: ProgramCoordinator, captures: { cycle2: "$.data.id", c2_status: "$.data.status" } }
          assert:
            - "err == ERR_CYCLE_WINDOW_OVERLAP for the window sharing the 2026-12-31 endpoint (closed semantics)"
            - "cycle2 created with c2_status == OPEN for the disjoint window starting 2027-01-01"

      - name: forestry_cure_buffer_boundary
        grounds:
          - state_machines.BidBatch.OPEN_FOR_ITEMS_to_SEALED_FOR_BIDDING
          - entities.ForestryReview.fields.work_completed_at
          - errors[ERR_CURE_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Resource: the notice's repair window vs forestry root-work completion; semantics:
          a fixed 7-day buffer (work_window_start must be >= work_completed_at + 7 days) —
          neither pure overlap nor adjacency. 2026-09-26 fails against a 2026-09-20 clearing;
          exactly 2026-09-27 (D+7) passes.
        test_recipe:
          setup:
            - "parcel with city-tree TREE_ROOT_UPHEAVAL defect; notice issued while the defect was AWAITING_FORESTRY; notice swept DELINQUENT; review PRUNE_APPROVED then CLEARED at clock 2026-09-20 (work_completed_at 2026-09-20)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Will Wren", mailing_address: "34 Wren St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
