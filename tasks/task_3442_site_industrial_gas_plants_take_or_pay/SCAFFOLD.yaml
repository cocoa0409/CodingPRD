# =============================================================================
# PRD Benchmark Seed Tables — On-Site Industrial Gas Plants & Take-or-Pay
# Supply Contracts (Air Products-style)
# =============================================================================

scenario: |
  On-Site Industrial Gas Plants & Take-or-Pay Supply Contracts (Air Products): customer supply mode selection across on-site plants, pipeline, bulk liquid delivery and cylinders based on volume and purity needs, on-site plant construction on customer property with long-term take-or-pay contracts covering fixed capital recovery, contract terms including minimum volumes, power cost pass-through and facility fee escalation, pipeline network operations serving multiple customers with supply reliability and backup arrangements, bulk delivery route optimization with telemetry-based tank level monitoring and delivery triggering, product purity specifications and analytical verification for electronics and medical applications, plant maintenance turnarounds coordinated with customer production schedules, contract renewal negotiations where the asset is dedicated to one customer

domain_name: onsite-gas-take-or-pay
api_prefix: /gas-supply

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: segment, type: enum, source: input, description: "ELECTRONICS | MEDICAL | METALS | CHEMICAL" }
      - { name: credit_standing, type: enum, source: input, default: "STANDARD", description: "PRIME | STANDARD | WATCH. WATCH blocks contract activation." }
      - { name: blackout_windows, type: array, source: input, default: [], description: "Customer production blackout windows [{start_iso, end_iso}], CLOSED intervals [start, end]; turnaround windows that share any instant with a blackout window conflict." }

  - name: SupplyModeEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; evaluated customer" }
      - { name: site_label, type: string, source: input, description: "Free-form customer site identifier; one active evaluation per (customer_id, site_label)" }
      - { name: demand_avg_nm3h, type: number, source: input, description: "Average hourly gas demand in Nm3/h" }
      - { name: demand_peak_nm3h, type: number, source: input, description: "Peak hourly demand; must be >= demand_avg_nm3h" }
      - { name: required_purity_percent, type: number, source: input, description: "Required product purity, e.g. 99.999" }
      - { name: required_product, type: enum, source: input, description: "N2 | O2 | H2 | AR | HE" }
      - { name: pipeline_available, type: boolean, source: input, description: "Whether a pipeline network frontage exists at the site" }
      - { name: recommended_mode, type: enum, source: computed, description: "ONSITE_PLANT | PIPELINE | BULK_LIQUID | CYLINDER — per calculations.mode_recommendation" }
      - { name: status, type: enum, source: system, description: "EVALUATED | ACCEPTED | SUPERSEDED" }

  - name: SupplyContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must equal the evaluation's customer_id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> SupplyModeEvaluation.id; must be ACCEPTED at creation" }
      - { name: mode, type: enum, source: system, description: "Copied from evaluation.recommended_mode: ONSITE_PLANT | PIPELINE | BULK_LIQUID | CYLINDER" }
      - { name: product, type: enum, source: system, description: "Copied from evaluation.required_product" }
      - { name: site_label, type: string, source: system, description: "Copied from evaluation.site_label" }
      - { name: term_months, type: integer, source: input, description: "Contract term in months (e.g. 120)" }
      - { name: start_date, type: string, source: input, description: "ISO date YYYY-MM-DD of supply start" }
      - { name: end_date, type: string, source: computed, description: "= start_date + term_months months" }
      - { name: min_monthly_volume_nm3, type: integer, source: input, description: "Take-or-pay minimum monthly volume in Nm3" }
      - { name: unit_price_cents_per_nm3, type: integer, source: input, description: "Commodity price per Nm3 in cents" }
      - { name: monthly_facility_fee_cents, type: integer, source: input, description: "Base monthly facility fee in cents before escalation" }
      - { name: facility_fee_escalation_pct_annual, type: number, source: input, description: "Annual facility-fee escalation rate, e.g. 0.03" }
      - { name: base_power_index, type: number, source: input, description: "Contracted baseline power price in currency per kWh, e.g. 0.08" }
      - { name: power_kwh_per_nm3, type: number, source: input, description: "Specific power consumption used for pass-through, e.g. 0.42" }
      - { name: makeup_credit_cap_pct, type: number, source: input, default: 0.10, description: "Makeup credit bank cap as fraction of annual minimum value" }
      - { name: makeup_credit_balance_cents, type: integer, source: system, default: 0, description: "Current makeup credit bank balance; mutated only by FINAL settlements" }
      - { name: failover_active, type: boolean, source: system, default: false, description: "True while a turnaround has taken the dedicated plant down" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RENEWAL_OPEN | EXPIRED | TERMINATED" }

  - name: OnsitePlant
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SupplyContract.id; contract must be ACTIVE with mode ONSITE_PLANT" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from contract" }
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: nameplate_capacity_nm3h, type: integer, source: input, description: "Nameplate production capacity Nm3/h" }
      - { name: capital_cost_cents, type: integer, source: input, description: "Total dedicated capital cost in cents; basis of capital recovery" }
      - { name: power_kwh_per_nm3, type: number, source: input, description: "Measured specific power consumption" }
      - { name: status, type: enum, source: system, description: "PROPOSED | UNDER_CONSTRUCTION | COMMISSIONING | OPERATING | TURNAROUND | DECOMMISSIONED" }
      - { name: effective_capacity_nm3h, type: integer, source: computed, description: "= nameplate_capacity_nm3h when OPERATING, else 0" }

  - name: PipelineNetwork
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network name" }
      - { name: nameplate_capacity_nm3h, type: integer, source: input, description: "Total firm capacity Nm3/h" }
      - { name: reserved_capacity_nm3h, type: integer, source: computed, default: 0, description: "Sum of reserved_flow_nm3h over ACTIVE PipelineConnections" }
      - { name: available_capacity_nm3h, type: integer, source: computed, description: "= nameplate_capacity_nm3h - reserved_capacity_nm3h" }

  - name: PipelineConnection
    parent: null
    common_fields: true
    fields:
      - { name: network_id, type: string, source: input, description: "FK -> PipelineNetwork.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> SupplyContract.id; contract status must be DRAFT or ACTIVE" }
      - { name: reserved_flow_nm3h, type: integer, source: input, description: "Firm reserved flow Nm3/h; must be >= 1" }
      - { name: purpose, type: enum, source: input, description: "PRIMARY (contract mode PIPELINE) | BACKUP (contract mode ONSITE_PLANT)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: StorageTank
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: site_label, type: string, source: input, description: "Site identifier matching the customer's site" }
      - { name: product, type: enum, source: input, description: "N2 | O2 | H2 | AR | HE" }
      - { name: capacity_liters, type: integer, source: input, description: "Tank capacity in liters" }
      - { name: reorder_point_liters, type: integer, source: input, description: "Reorder threshold; status REORDER_DUE when current_level_liters <= this" }
      - { name: safety_stock_liters, type: integer, source: input, description: "Critical floor; status CRITICAL when current_level_liters <= this. Must be < reorder_point_liters" }
      - { name: required_purity_percent, type: number, source: input, description: "Purity floor for certified deliveries into this tank" }
      - { name: max_impurity_ppm, type: integer, source: input, description: "Maximum total impurities in ppm for certified deliveries" }
      - { name: current_level_liters, type: integer, source: computed, description: "Level from the latest TelemetryReading; null until first reading" }
      - { name: last_reading_at, type: datetime, source: computed, description: "measured_at of the latest reading" }
      - { name: burn_rate_instant_lph, type: number, source: computed, description: "Latest-interval consumption rate L/h (INSTANTANEOUS variant)" }
      - { name: burn_rate_wma_lph, type: number, source: computed, description: "Weighted-moving-average consumption L/h (WMA variant)" }
      - { name: projected_runout_instant_at, type: datetime, source: computed, description: "Projected safety-stock runout under INSTANTANEOUS burn; null when < 2 readings" }
      - { name: projected_runout_wma_at, type: datetime, source: computed, description: "Projected safety-stock runout under WMA burn; null when < 2 readings" }
      - { name: status, type: enum, source: computed, description: "NORMAL | REORDER_DUE | CRITICAL — posture recomputed on every telemetry reading" }

  - name: TelemetryReading
    parent: null
    common_fields: false
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> StorageTank.id; from path" }
      - { name: measured_at, type: datetime, source: input, description: "Timestamp of the measurement; must be strictly later than the tank's previous reading" }
      - { name: level_liters, type: integer, source: input, description: "Measured tank level in liters; 0 <= level <= capacity" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> StorageTank.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from tank" }
      - { name: product, type: enum, source: system, description: "Copied from tank.product" }
      - { name: quantity_liters, type: integer, source: system, description: "= tank.capacity_liters - tank.current_level_liters at trigger time" }
      - { name: triggered_by, type: enum, source: system, description: "TELEMETRY | BACKUP (turnaround failover) | REDELIVERY (quality rejection replacement)" }
      - { name: route_date, type: string, source: system, description: "Logical-clock date (YYYY-MM-DD) of creation; batching key" }
      - { name: route_code, type: string, source: system, description: "\"RT-\" + route_date; deliveries sharing a route_date form one route" }
      - { name: stop_sequence, type: integer, source: computed, description: "Rank within route_date per calculations.stop_sequence_ranking; recomputed on every delivery creation for that route_date" }
      - { name: required_purity_percent, type: number, source: system, description: "Snapshot of tank.required_purity_percent at creation" }
      - { name: max_impurity_ppm, type: integer, source: system, description: "Snapshot of tank.max_impurity_ppm at creation" }
      - { name: transport_status, type: enum, source: system, description: "SCHEDULED | DELIVERED | COMPLETED | REJECTED | CANCELLED" }
      - { name: quality_status, type: enum, source: system, description: "QC_PENDING | CERTIFIED | FAILED — parallel dimension to transport_status" }
      - { name: delivered_quantity_liters, type: integer, source: system, description: "Quantity confirmed at confirm-delivery; null before" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical time of confirm-delivery; null before" }

  - name: QualityCertificate
    parent: null
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id; at most one certificate per delivery" }
      - { name: sampled_at, type: datetime, source: input, description: "Sample timestamp" }
      - { name: measured_purity_percent, type: number, source: input, description: "Analyzed purity percent" }
      - { name: measured_impurity_ppm, type: integer, source: input, description: "Analyzed total impurities ppm" }
      - { name: analyst_user_id, type: string, source: system, description: "X-User-ID of the recording QualityAnalyst" }
      - { name: certifier_user_id, type: string, source: system, description: "X-User-ID of the certifying QualityCertifier; must differ from analyst_user_id" }
      - { name: result, type: enum, source: system, description: "RECORDED | CERTIFIED | FAILED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical time of certify decision; null before" }

  - name: Turnaround
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> OnsitePlant.id; from path" }
      - { name: window_start, type: datetime, source: input, description: "Window start; HALF-OPEN interval [window_start, window_end) for plant-overlap checks" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive); duration must be >= 24h and <= 720h" }
      - { name: scope, type: string, source: input, description: "Maintenance scope description" }
      - { name: proposal_round, type: integer, source: system, default: 1, description: "Increments by 1 on every COUNTER response" }
      - { name: status, type: enum, source: system, description: "PROPOSED | AGREED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> SupplyContract.id; from path" }
      - { name: period_month, type: string, source: input, description: "Billing period YYYY-MM; must lie within [start month, end month]" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: metered_volume_nm3, type: integer, source: input, description: "Actual metered offtake; required for FINAL, forbidden for PROVISIONAL" }
      - { name: projected_volume_nm3, type: integer, source: input, description: "Projected offtake; required for PROVISIONAL, forbidden for FINAL" }
      - { name: power_index_actual, type: number, source: input, description: "Actual power index for the period; required for FINAL, forbidden for PROVISIONAL" }
      - { name: apply_makeup_cents, type: integer, source: input, description: "Makeup credit to apply; FINAL only, optional" }
      - { name: months_elapsed, type: integer, source: computed, description: "Whole months from contract start month to period_month" }
      - { name: escalation_multiplier, type: number, source: computed, description: "Per-year rounded compound multiplier (4 dp) — calculations.facility_fee_escalation" }
      - { name: billable_volume_nm3, type: integer, source: computed, description: "= max(effective_volume, min_monthly_volume_nm3)" }
      - { name: volume_charge_cents, type: integer, source: computed, description: "= billable_volume_nm3 * unit_price_cents_per_nm3" }
      - { name: power_passthrough_cents, type: integer, source: computed, description: "FINAL: round(effective_volume * power_kwh_per_nm3 * (power_index_actual - base_power_index)); PROVISIONAL: 0. May be negative." }
      - { name: facility_fee_cents, type: integer, source: computed, description: "= round_half_up(monthly_facility_fee_cents * escalation_multiplier)" }
      - { name: capital_recovery_cents, type: integer, source: computed, description: "= floor(plant.capital_cost_cents / term_months) when mode ONSITE_PLANT and a non-DECOMMISSIONED plant exists, else 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= volume_charge + power_passthrough + facility_fee + capital_recovery" }
      - { name: shortfall_volume_nm3, type: integer, source: computed, description: "= max(0, min_monthly_volume_nm3 - effective_volume)" }
      - { name: makeup_credit_granted_cents, type: integer, source: computed, description: "Credit granted this period (FINAL mutates the bank; PROVISIONAL is an estimate only)" }
      - { name: makeup_credit_applied_cents, type: integer, source: computed, description: "Credit applied to this bill from the pre-grant bank balance" }
      - { name: total_due_cents, type: integer, source: computed, description: "= subtotal_cents - makeup_credit_applied_cents" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | SUPERSEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SupplyModeEvaluation
    initial_state: EVALUATED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: EVALUATED
        to: ACCEPTED
        trigger: "POST /gas-supply/supply-mode-evaluations/{evaluationId}/accept"
        actor: CustomerOps
        preconditions:
          - "status == EVALUATED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == evaluation.customer_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "Every other evaluation with the same (customer_id, site_label) in status EVALUATED or ACCEPTED transitions to SUPERSEDED"
      - from: EVALUATED
        to: SUPERSEDED
        trigger: "system (a newer evaluation for the same (customer_id, site_label) is created, or a sibling is accepted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a sibling evaluation for the same (customer_id, site_label) is accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "Contracts created from this evaluation keep evaluation_id but fail activation while it is not ACCEPTED (ERR_EVALUATION_NOT_ACCEPTED)"

  - entity: SupplyContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /gas-supply/supply-contracts/{contractId}/activate"
        actor: SupplyPlanner
        preconditions:
          - "evaluation.status == ACCEPTED (ERR_EVALUATION_NOT_ACCEPTED)"
          - "mode == PIPELINE implies an ACTIVE PipelineConnection with purpose PRIMARY exists for this contract (ERR_PIPELINE_CONNECTION_REQUIRED)"
          - "min_monthly_volume_nm3 >= MODE_MIN_MONTHLY_VOLUME_NM3[mode] (ERR_MIN_VOLUME_BELOW_FLOOR)"
          - "customer.credit_standing != WATCH (ERR_CUSTOMER_CREDIT_WATCH)"
        side_effects:
          - "increments SupplyContract.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /gas-supply/supply-contracts/{contractId}/amendments (kind=AMENDMENT)"
        actor: SupplyPlanner
        preconditions:
          - "expected_contract_version == contract.version (ERR_STALE_VERSION)"
        side_effects:
          - "Applies new_monthly_facility_fee_cents / new_min_monthly_volume_nm3 / new_unit_price_cents_per_nm3 going forward"
          - "increments SupplyContract.version by 1"
      - from: ACTIVE
        to: RENEWAL_OPEN
        trigger: "system (on clock set: current_utc >= end_date - 90 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_OPEN
        to: ACTIVE
        trigger: "POST /gas-supply/supply-contracts/{contractId}/amendments (kind=RENEWAL)"
        actor: SupplyPlanner
        preconditions:
          - "expected_contract_version == contract.version (ERR_STALE_VERSION)"
          - "new_end_date is present and > current end_date (ERR_VALIDATION)"
        side_effects:
          - "end_date := new_end_date; applies any new fee/min/price terms"
          - "increments SupplyContract.version by 1"
      - from: RENEWAL_OPEN
        to: EXPIRED
        trigger: "system (on clock set: current_utc > end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /gas-supply/supply-contracts/{contractId}/terminate"
        actor: SupplyPlanner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /gas-supply/supply-contracts/{contractId}/terminate"
        actor: SupplyPlanner
        preconditions: []
        side_effects:
          - "Any non-DECOMMISSIONED OnsitePlant for this contract -> DECOMMISSIONED"
          - "Any Turnaround of that plant in PROPOSED | AGREED | SCHEDULED -> CANCELLED (IN_PROGRESS is NOT cancelled)"
          - "Any ACTIVE PipelineConnection for this contract -> RELEASED (which itself recomputes PipelineNetwork.reserved_capacity_nm3h / available_capacity_nm3h)"
          - "Any Delivery for tanks of this customer with product == contract.product in transport_status SCHEDULED -> CANCELLED"
          - "increments SupplyContract.version by 1"
      - from: RENEWAL_OPEN
        to: TERMINATED
        trigger: "POST /gas-supply/supply-contracts/{contractId}/terminate"
        actor: SupplyPlanner
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> TERMINATED"
          - "increments SupplyContract.version by 1"
    note: "The ACTIVE -> RENEWAL_OPEN -> ACTIVE loop is the cyclic renewal negotiation for a dedicated single-customer asset."

  - entity: OnsitePlant
    initial_state: PROPOSED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROPOSED
        to: UNDER_CONSTRUCTION
        trigger: "POST /gas-supply/onsite-plants/{plantId}/advance"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: UNDER_CONSTRUCTION
        to: COMMISSIONING
        trigger: "POST /gas-supply/onsite-plants/{plantId}/advance"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: COMMISSIONING
        to: OPERATING
        trigger: "POST /gas-supply/onsite-plants/{plantId}/advance"
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "effective_capacity_nm3h := nameplate_capacity_nm3h"
      - from: OPERATING
        to: TURNAROUND
        trigger: "system (a Turnaround of this plant transitions SCHEDULED -> IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_capacity_nm3h := 0"
          - "SupplyContract.failover_active := true for the plant's contract"
      - from: TURNAROUND
        to: OPERATING
        trigger: "system (the IN_PROGRESS Turnaround completes at window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_capacity_nm3h := nameplate_capacity_nm3h"
          - "SupplyContract.failover_active := false"
      - from: ANY
        to: DECOMMISSIONED
        trigger: "system (SupplyContract termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_capacity_nm3h := 0"

  - entity: PipelineConnection
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /gas-supply/pipeline-connections/{connectionId}/release OR system (contract termination cascade)"
        actor: PipelineDispatcher | system
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "PipelineNetwork.reserved_capacity_nm3h -= reserved_flow_nm3h; available_capacity_nm3h recomputed (compensating invariant)"

  - entity: StorageTank
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: REORDER_DUE
        trigger: "system (telemetry reading: safety_stock_liters < current_level_liters <= reorder_point_liters)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create Delivery(triggered_by=TELEMETRY) unless an open Delivery (SCHEDULED, or DELIVERED with QC_PENDING) already exists for this tank"
      - from: NORMAL
        to: CRITICAL
        trigger: "system (telemetry reading: current_level_liters <= safety_stock_liters)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create Delivery(triggered_by=TELEMETRY) unless an open Delivery already exists for this tank"
      - from: REORDER_DUE
        to: CRITICAL
        trigger: "system (telemetry reading: current_level_liters <= safety_stock_liters)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create Delivery(triggered_by=TELEMETRY) unless an open Delivery already exists for this tank"
      - from: REORDER_DUE
        to: NORMAL
        trigger: "system (telemetry reading: current_level_liters > reorder_point_liters)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CRITICAL
        to: NORMAL
        trigger: "system (telemetry reading: current_level_liters > reorder_point_liters)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CRITICAL
        to: REORDER_DUE
        trigger: "system (telemetry reading: safety_stock_liters < current_level_liters <= reorder_point_liters)"
        actor: system
        preconditions: []
        side_effects: []
    note: "status is a computed posture over the latest telemetry; the delivery auto-trigger is edge-triggered (fires on entry into REORDER_DUE or CRITICAL), never level-triggered."

  - entity: Delivery
    initial_state: "SCHEDULED / QC_PENDING"
    terminal_states: ["COMPLETED / CERTIFIED", "REJECTED / FAILED", "CANCELLED / QC_PENDING"]
    transitions:
      - from: "SCHEDULED (any quality_status)"
        to: DELIVERED
        trigger: "POST /gas-supply/deliveries/{deliveryId}/confirm-delivery"
        actor: PipelineDispatcher
        preconditions:
          - "transport_status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
          - "delivered_quantity_liters >= 1 and <= tank.capacity_liters - tank.current_level_liters (ERR_DELIVERY_OVERFILL)"
        side_effects:
          - "delivered_quantity_liters and confirmed_at recorded"
      - from: "DELIVERED / QC_PENDING"
        to: "COMPLETED / CERTIFIED"
        trigger: "system (QualityCertificate for this delivery is certified CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "DELIVERED / QC_PENDING"
        to: "REJECTED / FAILED"
        trigger: "system (QualityCertificate for this delivery is certified FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create a replacement Delivery for the same tank with triggered_by=REDELIVERY, quantity = tank.capacity_liters - tank.current_level_liters"
          - "stop_sequence recomputed for the affected route_date"
      - from: "SCHEDULED (any quality_status)"
        to: CANCELLED
        trigger: "system (SupplyContract termination cascade for matching customer+product)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QualityCertificate
    initial_state: RECORDED
    terminal_states: [CERTIFIED, FAILED]
    transitions:
      - from: RECORDED
        to: CERTIFIED
        trigger: "POST /gas-supply/quality-certificates/{certificateId}/certify (decision=CERTIFIED)"
        actor: QualityCertifier
        preconditions:
          - "certifier X-User-ID != analyst_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "measured_purity_percent >= delivery.required_purity_percent AND measured_impurity_ppm <= delivery.max_impurity_ppm (ERR_RESULT_INCONSISTENT)"
        side_effects:
          - "Delivery -> COMPLETED / CERTIFIED"
      - from: RECORDED
        to: FAILED
        trigger: "POST /gas-supply/quality-certificates/{certificateId}/certify (decision=FAILED)"
        actor: QualityCertifier
        preconditions:
          - "certifier X-User-ID != analyst_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Delivery -> REJECTED / FAILED"
          - "Replacement REDELIVERY Delivery auto-created for the tank; route stop_sequence recomputed"

  - entity: Turnaround
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: AGREED
        trigger: "POST /gas-supply/turnarounds/{turnaroundId}/respond (decision=AGREE)"
        actor: CustomerOps
        preconditions:
          - "X-User-ID == customer owning the plant's contract (else ERR_UNAUTHORIZED_ROLE)"
          - "expected_turnaround_version == turnaround.version (ERR_STALE_VERSION)"
        side_effects:
          - "increments Turnaround.version by 1"
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /gas-supply/turnarounds/{turnaroundId}/respond (decision=COUNTER)"
        actor: CustomerOps
        preconditions:
          - "X-User-ID == customer owning the plant's contract (else ERR_UNAUTHORIZED_ROLE)"
          - "expected_turnaround_version == turnaround.version (ERR_STALE_VERSION)"
          - "counter_window_start / counter_window_end present, counter_window_end > counter_window_start, duration within [24h, 720h] (ERR_WINDOW_DURATION_INVALID)"
        side_effects:
          - "window_start/window_end replaced by the counter window"
          - "proposal_round += 1; increments Turnaround.version by 1"
      - from: AGREED
        to: SCHEDULED
        trigger: "POST /gas-supply/turnarounds/{turnaroundId}/schedule"
        actor: PlantOperator
        preconditions:
          - "contract of the plant is ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "No other Turnaround of the same plant in SCHEDULED or IN_PROGRESS with half-open overlap: existing.window_start < new.window_end AND new.window_start < existing.window_end (ERR_TURNAROUND_OVERLAP); adjacency (end == start) is allowed"
          - "Window must not share any instant with any of the customer's blackout_windows (closed intervals): NOT (window_start <= blackout.end AND window_end > blackout.start) (ERR_TURNAROUND_IN_BLACKOUT)"
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /gas-supply/turnarounds/{turnaroundId}/start"
        actor: PlantOperator
        preconditions:
          - "current_utc >= window_start (ERR_TURNAROUND_NOT_DUE)"
        side_effects:
          - "OnsitePlant -> TURNAROUND, effective_capacity_nm3h := 0"
          - "SupplyContract.failover_active := true"
          - "For every StorageTank of the customer whose product == contract.product: auto-create Delivery(triggered_by=BACKUP, quantity = capacity - current_level) unless an open Delivery exists for that tank"
          - "stop_sequence recomputed for the affected route_date"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (on clock set: current_utc >= window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "OnsitePlant TURNAROUND -> OPERATING"
          - "SupplyContract.failover_active := false"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system (SupplyContract termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AGREED
        to: CANCELLED
        trigger: "system (SupplyContract termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (SupplyContract termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SettlementStatement
    initial_state: PROVISIONAL_or_FINAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (a FINAL SettlementStatement is created for the same (contract_id, period_month))"
        actor: system
        preconditions: []
        side_effects: []
    note: "Creation rules: PROVISIONAL create fails with ERR_DUPLICATE_SETTLEMENT when any non-SUPERSEDED statement exists for (contract_id, period_month). FINAL create fails with ERR_DUPLICATE_SETTLEMENT when a FINAL exists; otherwise it supersedes the PROVISIONAL."

concurrency_rules:
  - rule_id: contract-amendment-stale-version
    parent_entity: SupplyContract
    write_endpoint: "POST /gas-supply/supply-contracts/{contractId}/amendments"
    occ_field: "expected_contract_version"
    description: |
      Creating an amendment or renewal against a SupplyContract whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just amended or renewed the contract
      and the current writer's view of its commercial terms is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: turnaround-respond-stale-version
    parent_entity: Turnaround
    write_endpoint: "POST /gas-supply/turnarounds/{turnaroundId}/respond"
    occ_field: "expected_turnaround_version"
    description: |
      Responding to a Turnaround proposal whose version has advanced since the
      customer last observed it is rejected, because the window the customer
      is agreeing to (or countering) may no longer be the window on the table.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mode_recommendation
    trigger: "on POST /gas-supply/supply-mode-evaluations (computed at creation, immutable thereafter)"
    algorithm: threshold
    formula: |
      if demand_avg_nm3h >= ONSITE_MIN_AVG_NM3H: recommended_mode = ONSITE_PLANT
      elif pipeline_available AND demand_avg_nm3h >= PIPELINE_MIN_AVG_NM3H: recommended_mode = PIPELINE
      elif demand_avg_nm3h >= BULK_MIN_AVG_NM3H: recommended_mode = BULK_LIQUID
      else: recommended_mode = CYLINDER
    input_set: "the evaluation's own demand_avg_nm3h and pipeline_available inputs"
    constants:
      ONSITE_MIN_AVG_NM3H: 4000
      PIPELINE_MIN_AVG_NM3H: 1500
      BULK_MIN_AVG_NM3H: 200
    precision: "thresholds use >= (a demand exactly equal to a threshold takes the higher mode)"

  - name: tank_burn_rate_and_runout
    trigger: "on every accepted POST /gas-supply/storage-tanks/{id}/telemetry"
    algorithm: chronological
    formula: |
      Let readings R1..Rn be the tank's TelemetryReadings ordered by measured_at ASC.
      Interval burn for (R[i-1], R[i]) = (level[i-1] - level[i]) / hours_between(measured_at[i-1], measured_at[i]).
      INSTANTANEOUS variant: burn_instant = interval burn of the latest interval (Rn-1 -> Rn).
      WMA variant: burn_wma = 0.5 * b_n + 0.25 * b_n-1 + 0.125 * b_n-2 + 0.125 * b_n-3
                   over up to the 4 most recent intervals (latest-first);
                   with only k < 4 intervals available, use the first k weights (0.5, 0.25, 0.125).
      A non-positive interval burn (level rose or held) contributes 0 for that interval.
      runout_at = last_reading_at + (current_level_liters - safety_stock_liters) / burn hours,
                  rounded to whole seconds round_half_up; null when fewer than 2 readings
                  exist or burn <= 0.
    input_set: "all TelemetryReadings of the tank, chronological; out-of-order submissions are rejected before this runs"
    constants:
      WMA_WEIGHTS: [0.5, 0.25, 0.125, 0.125]
    precision: "rates in L/h as exact rationals; runout timestamps to whole seconds, round_half_up"
    variants:
      - name: INSTANTANEOUS
        when: "burn_rate_instant_lph / projected_runout_instant_at fields"
        difference: "uses only the latest interval; reacts immediately to a consumption change"
      - name: WEIGHTED_MOVING_AVERAGE
        when: "burn_rate_wma_lph / projected_runout_wma_at fields; this variant also drives stop_sequence_ranking urgency"
        difference: "smooths over up to 4 intervals; same readings yield a different (later or earlier) runout than INSTANTANEOUS"

  - name: delivery_auto_trigger
    trigger: "edge-triggered when a telemetry reading moves StorageTank.status into REORDER_DUE or CRITICAL"
    algorithm: threshold
    formula: |
      On tank posture entering REORDER_DUE or CRITICAL:
        if no Delivery exists for this tank with transport_status == SCHEDULED
           or (transport_status == DELIVERED and quality_status == QC_PENDING):
             create Delivery(triggered_by=TELEMETRY,
                             quantity_liters = capacity_liters - current_level_liters,
                             route_date = current logical date,
                             required_purity_percent / max_impurity_ppm snapshotted from tank)
        else: skip (no duplicate open delivery)
    input_set: "the tank whose posture changed plus its open deliveries"
    constants: {}
    precision: "quantity is an integer number of liters"

  - name: stop_sequence_ranking
    trigger: "whenever a Delivery is created for a route_date (recomputed over all SCHEDULED deliveries of that route_date)"
    algorithm: weighted_scoring
    formula: |
      Candidate set: all Deliveries with route_date == D and transport_status == SCHEDULED.
      Rank key: tank.projected_runout_wma_at ASC (earliest runout first);
                deliveries whose tank has null runout sort after all non-null;
      tie-break 1: tank.created_at ASC; tie-break 2: delivery.created_at ASC.
      Assign stop_sequence 1..N in that order.
    input_set: "SCHEDULED deliveries sharing route_date D"
    constants: {}
    precision: "stop_sequence is a dense 1-based integer ranking"

  - name: settlement_invoice
    trigger: "on POST /gas-supply/supply-contracts/{id}/settlements"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned; each step uses only results of earlier steps.
      (1) months_elapsed = (period_year - start_year) * 12 + (period_month - start_month).
      (2) escalation_multiplier = facility_fee_escalation(months_elapsed).
      (3) effective_volume = metered_volume_nm3 (FINAL) | projected_volume_nm3 (PROVISIONAL).
      (4) billable_volume_nm3 = max(effective_volume, min_monthly_volume_nm3).
      (5) volume_charge_cents = billable_volume_nm3 * unit_price_cents_per_nm3.
      (6) power_passthrough_cents = FINAL ? round_half_up(effective_volume * power_kwh_per_nm3
              * (power_index_actual - base_power_index)) : 0.  May be negative.
      (7) facility_fee_cents = round_half_up(monthly_facility_fee_cents * escalation_multiplier).
      (8) capital_recovery_cents = (mode == ONSITE_PLANT and exists non-DECOMMISSIONED OnsitePlant
              for contract) ? floor(plant.capital_cost_cents / term_months) : 0.
      (9) subtotal_cents = volume_charge + power_passthrough + facility_fee + capital_recovery.
      (10) shortfall_volume_nm3 = max(0, min_monthly_volume_nm3 - effective_volume).
      (11) makeup_credit_applied_cents: FINAL ? min(apply_makeup_cents | 0,
              makeup_credit_balance_cents /* pre-grant balance, see (12) */, subtotal_cents) : 0.
           Requesting apply_makeup_cents greater than min(balance, subtotal) fails
           ERR_MAKEUP_CREDIT_EXCEEDED instead of clamping.
      (12) makeup_credit_granted_cents (FINAL) = min(round_half_up(shortfall_volume_nm3
              * unit_price_cents_per_nm3 * MAKEUP_CREDIT_RATE),
              max(0, credit_cap_cents - makeup_credit_balance_cents /* pre-grant */));
           PROVISIONAL reports the same formula as an estimate and mutates nothing.
      (13) total_due_cents = subtotal_cents - makeup_credit_applied_cents.
      (14) FINAL only: makeup_credit_balance_cents := balance_pre_grant + granted - applied.
      The bank balance used for application in (11) is deliberately the PRE-grant
      balance: a period's own shortfall grant can never pay its own bill.
    input_set: "the contract, its non-DECOMMISSIONED OnsitePlant (if any), and the settlement inputs"
    constants:
      MAKEUP_CREDIT_RATE: 0.6
    precision: "all money integer cents; round_half_up where noted; floor for capital recovery"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL; mid-period estimate for customer accruals"
        difference: "uses projected_volume_nm3, power passthrough is 0, and performs no ledger mutation"
      - name: FINAL
        when: "variant=FINAL; period close"
        difference: "uses metered_volume_nm3 and power_index_actual, grants/applies makeup credit, and supersedes the PROVISIONAL"

  - name: facility_fee_escalation
    trigger: "inside settlement_invoice step (2)"
    algorithm: constraint_propagation
    formula: |
      years_elapsed = floor(months_elapsed / 12).
      multiplier = 1.0000
      repeat years_elapsed times:
          multiplier = round_half_up(multiplier * (1 + facility_fee_escalation_pct_annual), 4)
      return multiplier
      (Per-year rounding of the multiplier is pinned: rounding once at the end,
       i.e. (1+pct)^years_elapsed, yields a different fee and is NON-conformant.)
    input_set: "contract.facility_fee_escalation_pct_annual and months_elapsed"
    constants: {}
    precision: "multiplier to 4 decimal places, round_half_up per year"

  - name: makeup_credit_ledger
    trigger: "inside settlement_invoice steps (11)-(14) for FINAL statements"
    algorithm: waterfall_allocation
    formula: |
      credit_cap_cents = round_half_up(makeup_credit_cap_pct * 12 * min_monthly_volume_nm3
                                       * unit_price_cents_per_nm3)
      grant_room = max(0, credit_cap_cents - balance_pre_grant)
      granted = min(raw_grant, grant_room)   # overflow above the cap is discarded, never banked
      Invariant: sum(granted over all FINAL) == sum(applied over all FINAL)
                 + contract.makeup_credit_balance_cents
    input_set: "contract credit fields and the FINAL settlement"
    constants: {}
    precision: "integer cents"

  - name: pipeline_capacity_aggregation
    trigger: "on PipelineConnection create, release, and on contract termination cascade"
    algorithm: aggregation
    formula: |
      network.reserved_capacity_nm3h = sum(reserved_flow_nm3h) over connections
                                       with network_id == network.id AND status == ACTIVE
      network.available_capacity_nm3h = nameplate_capacity_nm3h - reserved_capacity_nm3h
      Invariant: reserved_capacity_nm3h + available_capacity_nm3h == nameplate_capacity_nm3h
      Admission check at create: reserved_flow_nm3h <= available_capacity_nm3h
      (exact fit, reserved == nameplate, is allowed; +1 Nm3/h over is rejected).
    input_set: "ACTIVE PipelineConnections of the network"
    constants: {}
    precision: "integer Nm3/h"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint; for CustomerOps, X-User-ID must equal the acting Customer's id (ownership)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (customer/evaluation/contract/plant/network/connection/tank/delivery/certificate/turnaround)", error_id: ERR_CUSTOMER_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids (per-resource NOT_FOUND ids in 1.6)" }
  - { priority: 4, category: state, check: "OCC: expected_contract_version == SupplyContract.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /gas-supply/supply-contracts/{contractId}/amendments"] }
  - { priority: 4, category: state, check: "OCC: expected_turnaround_version == Turnaround.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /gas-supply/turnarounds/{turnaroundId}/respond"] }
  - { priority: 4, category: state, check: "Evaluation referenced by a contract is ACCEPTED (at contract create and at activate)", error_id: ERR_EVALUATION_NOT_ACCEPTED, http_status: 409, applies_to: ["POST /gas-supply/supply-contracts", "POST /gas-supply/supply-contracts/{contractId}/activate"] }
  - { priority: 4, category: state, check: "Target resource in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "Contract ACTIVE where required (plant create, turnaround schedule; settlements also allow RENEWAL_OPEN)", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /gas-supply/onsite-plants", "POST /gas-supply/turnarounds/{turnaroundId}/schedule", "POST /gas-supply/supply-contracts/{id}/settlements"] }
  - { priority: 4, category: state, check: "Plant OPERATING where required (turnaround create)", error_id: ERR_PLANT_NOT_OPERATING, http_status: 409, applies_to: ["POST /gas-supply/onsite-plants/{id}/turnarounds"] }
  - { priority: 4, category: state, check: "Delivery DELIVERED where required (certificate create)", error_id: ERR_DELIVERY_NOT_DELIVERED, http_status: 409, applies_to: ["POST /gas-supply/deliveries/{id}/quality-certificates"] }
  - { priority: 5, category: business_safety, check: "Certifier identity differs from recording analyst identity on the same certificate", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: ["POST /gas-supply/quality-certificates/{certificateId}/certify"] }
  - { priority: 5, category: business_safety, check: "decision=CERTIFIED requires measured values to satisfy the delivery's purity snapshot", error_id: ERR_RESULT_INCONSISTENT, http_status: 422, applies_to: ["POST /gas-supply/quality-certificates/{certificateId}/certify"] }
  - { priority: 5, category: business_safety, check: "delivered_quantity_liters in [1, tank.capacity_liters - tank.current_level_liters]", error_id: ERR_DELIVERY_OVERFILL, http_status: 422, applies_to: ["POST /gas-supply/deliveries/{deliveryId}/confirm-delivery"] }
  - { priority: 6, category: business_temporal, check: "Turnaround/counter window: end > start and duration in [24h, 720h]", error_id: ERR_WINDOW_DURATION_INVALID, http_status: 422, applies_to: ["POST /gas-supply/onsite-plants/{id}/turnarounds", "POST /gas-supply/turnarounds/{turnaroundId}/respond"] }
  - { priority: 6, category: business_temporal, check: "Half-open overlap with existing SCHEDULED/IN_PROGRESS turnaround on same plant", error_id: ERR_TURNAROUND_OVERLAP, http_status: 409, applies_to: ["POST /gas-supply/turnarounds/{turnaroundId}/schedule"] }
  - { priority: 6, category: business_temporal, check: "Turnaround window shares an instant with a customer blackout window (closed-interval semantics)", error_id: ERR_TURNAROUND_IN_BLACKOUT, http_status: 422, applies_to: ["POST /gas-supply/turnarounds/{turnaroundId}/schedule"] }
  - { priority: 6, category: business_temporal, check: "Turnaround start not before window_start", error_id: ERR_TURNAROUND_NOT_DUE, http_status: 422, applies_to: ["POST /gas-supply/turnarounds/{turnaroundId}/start"] }
  - { priority: 6, category: business_temporal, check: "Telemetry measured_at strictly after tank's latest reading; level within [0, capacity]", error_id: ERR_READING_OUT_OF_ORDER, http_status: 422, applies_to: ["POST /gas-supply/storage-tanks/{id}/telemetry"] }
  - { priority: 6, category: business_temporal, check: "period_month within [contract start month, contract end month]", error_id: ERR_PERIOD_OUT_OF_TERM, http_status: 422, applies_to: ["POST /gas-supply/supply-contracts/{id}/settlements"] }
  - { priority: 7, category: business_constraint, check: "Pipeline admission: reserved_flow_nm3h <= network.available_capacity_nm3h", error_id: ERR_PIPELINE_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /gas-supply/pipeline-connections"] }
  - { priority: 7, category: business_constraint, check: "PIPELINE-mode contract activation requires an ACTIVE PRIMARY connection", error_id: ERR_PIPELINE_CONNECTION_REQUIRED, http_status: 409, applies_to: ["POST /gas-supply/supply-contracts/{contractId}/activate"] }
  - { priority: 7, category: business_constraint, check: "purpose PRIMARY requires contract.mode == PIPELINE; purpose BACKUP requires contract.mode == ONSITE_PLANT; plant create requires mode ONSITE_PLANT", error_id: ERR_MODE_MISMATCH, http_status: 422, applies_to: ["POST /gas-supply/pipeline-connections", "POST /gas-supply/onsite-plants"] }
  - { priority: 7, category: business_constraint, check: "min_monthly_volume_nm3 >= MODE_MIN_MONTHLY_VOLUME_NM3[mode] (ONSITE 2000000, PIPELINE 800000, BULK 150000, CYLINDER 0)", error_id: ERR_MIN_VOLUME_BELOW_FLOOR, http_status: 422, applies_to: ["POST /gas-supply/supply-contracts/{contractId}/activate"] }
  - { priority: 7, category: business_constraint, check: "At most one non-DECOMMISSIONED OnsitePlant per contract", error_id: ERR_PLANT_ALREADY_EXISTS, http_status: 409, applies_to: ["POST /gas-supply/onsite-plants"] }
  - { priority: 7, category: business_constraint, check: "At most one QualityCertificate per delivery", error_id: ERR_CERTIFICATE_EXISTS, http_status: 409, applies_to: ["POST /gas-supply/deliveries/{id}/quality-certificates"] }
  - { priority: 7, category: business_constraint, check: "Settlement uniqueness per (contract, period_month) per creation rules", error_id: ERR_DUPLICATE_SETTLEMENT, http_status: 409, applies_to: ["POST /gas-supply/supply-contracts/{id}/settlements"] }
  - { priority: 8, category: business_fiscal, check: "customer.credit_standing != WATCH at contract activation", error_id: ERR_CUSTOMER_CREDIT_WATCH, http_status: 422, applies_to: ["POST /gas-supply/supply-contracts/{contractId}/activate"] }
  - { priority: 8, category: business_fiscal, check: "apply_makeup_cents <= min(pre-grant makeup_credit_balance_cents, subtotal_cents)", error_id: ERR_MAKEUP_CREDIT_EXCEEDED, http_status: 422, applies_to: ["POST /gas-supply/supply-contracts/{id}/settlements"] }
  - { priority: 9, category: business_constraint, check: "Malformed bodies, missing required fields, invalid enums, demand_peak < demand_avg, tank reorder_point <= safety_stock, level out of range, apply_makeup_cents on PROVISIONAL", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform / logical clock (unprefixed, outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601). Server startup default is exactly 2026-09-01T00:00:00Z before any call; never falls back to wall-clock. On each set, the system sweep opens renewal windows (current_utc >= end_date - 90d), expires contracts (current_utc > end_date), and completes IN_PROGRESS turnarounds whose window_end <= current_utc."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["contract renewal-open / expiry sweep", "turnaround auto-completion sweep"]

  # --- Customer ---
  - method: POST
    path: "/gas-supply/customers"
    description: "Create a Customer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, segment, "credit_standing?", "blackout_windows?"]
    output: Customer
    side_effects: ["credit_standing defaults STANDARD", "blackout_windows defaults []"]
  - method: GET
    path: "/gas-supply/customers/{customerId}"
    description: "Get a Customer"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- SupplyModeEvaluation ---
  - method: POST
    path: "/gas-supply/supply-mode-evaluations"
    description: "Create and immediately evaluate a supply-mode study; supersedes EVALUATED siblings for the same (customer_id, site_label)"
    roles: [SupplyPlanner]
    code: 201
    input: [customer_id, site_label, demand_avg_nm3h, demand_peak_nm3h, required_purity_percent, required_product, pipeline_available]
    output: SupplyModeEvaluation
    side_effects: ["recommended_mode computed per mode_recommendation", "siblings EVALUATED -> SUPERSEDED"]
  - method: GET
    path: "/gas-supply/customers/{id}/supply-mode-evaluations"
    description: "List a customer's evaluations"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: SupplyModeEvaluation[]
    side_effects: []
  - method: POST
    path: "/gas-supply/supply-mode-evaluations/{evaluationId}/accept"
    description: "Customer accepts the recommendation; supersedes all sibling EVALUATED/ACCEPTED evaluations"
    roles: [CustomerOps]
    code: 200
    input: []
    output: SupplyModeEvaluation
    side_effects: ["status -> ACCEPTED", "siblings EVALUATED|ACCEPTED -> SUPERSEDED"]

  # --- SupplyContract ---
  - method: POST
    path: "/gas-supply/supply-contracts"
    description: "Create a take-or-pay SupplyContract from an ACCEPTED evaluation"
    roles: [SupplyPlanner]
    code: 201
    input: [customer_id, evaluation_id, term_months, start_date, min_monthly_volume_nm3, unit_price_cents_per_nm3, monthly_facility_fee_cents, facility_fee_escalation_pct_annual, base_power_index, power_kwh_per_nm3, "makeup_credit_cap_pct?"]
    output: SupplyContract
    side_effects: ["mode/product/site_label copied from evaluation", "status DRAFT", "end_date computed", "makeup_credit_balance_cents = 0"]
  - method: GET
    path: "/gas-supply/supply-contracts/{contractId}"
    description: "Get a SupplyContract"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/gas-supply/supply-contracts"
    description: "List contracts with optional filters and pagination"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: ["customer_id?", "evaluation_id?", "status?", "limit?", "offset?"]
    output: SupplyContract[]
    side_effects: []
  - method: POST
    path: "/gas-supply/supply-contracts/{contractId}/activate"
    description: "Activate a DRAFT contract (credit, evaluation, mode-floor and pipeline-connection gates)"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status -> ACTIVE", "increments SupplyContract.version by 1"]
  - method: POST
    path: "/gas-supply/supply-contracts/{contractId}/amendments"
    description: "Amend commercial terms (kind=AMENDMENT, requires ACTIVE) or renew (kind=RENEWAL, requires RENEWAL_OPEN, new_end_date > end_date). OCC-guarded."
    roles: [SupplyPlanner]
    code: 200
    input: [kind, expected_contract_version, "new_end_date?", "new_monthly_facility_fee_cents?", "new_min_monthly_volume_nm3?", "new_unit_price_cents_per_nm3?"]
    output: SupplyContract
    side_effects: ["applies term changes", "RENEWAL sets end_date and status ACTIVE", "increments SupplyContract.version by 1"]
  - method: POST
    path: "/gas-supply/supply-contracts/{contractId}/terminate"
    description: "Terminate a contract; cascades to plant, turnarounds, connections, scheduled deliveries"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status -> TERMINATED", "plant -> DECOMMISSIONED", "turnarounds PROPOSED/AGREED/SCHEDULED -> CANCELLED", "connections ACTIVE -> RELEASED", "scheduled deliveries -> CANCELLED", "increments SupplyContract.version by 1"]

  # --- OnsitePlant ---
  - method: POST
    path: "/gas-supply/onsite-plants"
    description: "Create a dedicated on-site plant on customer property for an ACTIVE ONSITE_PLANT contract"
    roles: [PlantOperator]
    code: 201
    input: [contract_id, name, nameplate_capacity_nm3h, capital_cost_cents, power_kwh_per_nm3]
    output: OnsitePlant
    side_effects: ["customer_id denormalized from contract", "status PROPOSED"]
  - method: GET
    path: "/gas-supply/onsite-plants/{plantId}"
    description: "Get an OnsitePlant"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: OnsitePlant
    side_effects: []
  - method: GET
    path: "/gas-supply/onsite-plants"
    description: "List plants with optional filters"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: ["customer_id?", "contract_id?"]
    output: OnsitePlant[]
    side_effects: []
  - method: POST
    path: "/gas-supply/onsite-plants/{plantId}/advance"
    description: "Advance construction: PROPOSED -> UNDER_CONSTRUCTION -> COMMISSIONING -> OPERATING"
    roles: [PlantOperator]
    code: 200
    input: []
    output: OnsitePlant
    side_effects: ["on reaching OPERATING: effective_capacity_nm3h := nameplate_capacity_nm3h"]

  # --- PipelineNetwork ---
  - method: POST
    path: "/gas-supply/pipeline-networks"
    description: "Create a pipeline network"
    roles: [PlatformAdmin]
    code: 201
    input: [name, nameplate_capacity_nm3h]
    output: PipelineNetwork
    side_effects: ["reserved_capacity_nm3h = 0", "available_capacity_nm3h = nameplate"]
  - method: GET
    path: "/gas-supply/pipeline-networks/{networkId}"
    description: "Get a PipelineNetwork with computed reservation fields"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: PipelineNetwork
    side_effects: []

  # --- PipelineConnection ---
  - method: POST
    path: "/gas-supply/pipeline-connections"
    description: "Reserve firm pipeline capacity for a contract (created directly ACTIVE after capacity admission)"
    roles: [PipelineDispatcher]
    code: 201
    input: [network_id, contract_id, reserved_flow_nm3h, purpose]
    output: PipelineConnection
    side_effects: ["network.reserved_capacity_nm3h += reserved_flow_nm3h", "available recomputed"]
  - method: GET
    path: "/gas-supply/pipeline-connections/{connectionId}"
    description: "Get a PipelineConnection"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: PipelineConnection
    side_effects: []
  - method: GET
    path: "/gas-supply/pipeline-connections"
    description: "List connections with optional filters"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: ["network_id?", "contract_id?", "status?"]
    output: PipelineConnection[]
    side_effects: []
  - method: POST
    path: "/gas-supply/pipeline-connections/{connectionId}/release"
    description: "Release a connection; compensates the network capacity reservation"
    roles: [PipelineDispatcher]
    code: 200
    input: []
    output: PipelineConnection
    side_effects: ["status -> RELEASED", "network reserved/available recomputed"]

  # --- StorageTank + Telemetry ---
  - method: POST
    path: "/gas-supply/storage-tanks"
    description: "Create a bulk liquid storage tank at a customer site"
    roles: [PlantOperator]
    code: 201
    input: [customer_id, site_label, product, capacity_liters, reorder_point_liters, safety_stock_liters, required_purity_percent, max_impurity_ppm]
    output: StorageTank
    side_effects: ["status NORMAL", "current_level_liters null"]
  - method: GET
    path: "/gas-supply/storage-tanks/{tankId}"
    description: "Get a StorageTank with computed burn/runout/posture fields"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: StorageTank
    side_effects: []
  - method: GET
    path: "/gas-supply/storage-tanks"
    description: "List tanks with optional filters"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: ["customer_id?", "status?"]
    output: StorageTank[]
    side_effects: []
  - method: POST
    path: "/gas-supply/storage-tanks/{id}/telemetry"
    description: "Append a telemetry reading; recomputes level, burn variants, runouts, posture; may auto-create a TELEMETRY delivery"
    roles: [TelemetryGateway]
    code: 201
    input: [measured_at, level_liters]
    output: StorageTank
    side_effects: ["TelemetryReading appended", "tank computed fields refreshed", "delivery_auto_trigger on posture edge", "stop_sequence recompute for route_date"]
  - method: GET
    path: "/gas-supply/storage-tanks/{id}/telemetry"
    description: "List a tank's telemetry readings (chronological)"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: TelemetryReading[]
    side_effects: []

  # --- Delivery ---
  - method: GET
    path: "/gas-supply/deliveries/{deliveryId}"
    description: "Get a Delivery"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: Delivery
    side_effects: []
  - method: GET
    path: "/gas-supply/deliveries"
    description: "List deliveries with optional filters and pagination"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: ["tank_id?", "customer_id?", "transport_status?", "quality_status?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []
  - method: POST
    path: "/gas-supply/deliveries/{deliveryId}/confirm-delivery"
    description: "Confirm physical delivery with the delivered quantity"
    roles: [PipelineDispatcher]
    code: 200
    input: [delivered_quantity_liters]
    output: Delivery
    side_effects: ["transport_status -> DELIVERED", "delivered_quantity_liters / confirmed_at recorded"]

  # --- QualityCertificate ---
  - method: POST
    path: "/gas-supply/deliveries/{id}/quality-certificates"
    description: "Record an analytical result for a DELIVERED delivery (one per delivery)"
    roles: [QualityAnalyst]
    code: 201
    input: [sampled_at, measured_purity_percent, measured_impurity_ppm]
    output: QualityCertificate
    side_effects: ["analyst_user_id := X-User-ID", "result RECORDED"]
  - method: GET
    path: "/gas-supply/deliveries/{id}/quality-certificates"
    description: "List certificates for a delivery (0 or 1)"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: QualityCertificate[]
    side_effects: []
  - method: POST
    path: "/gas-supply/quality-certificates/{certificateId}/certify"
    description: "Certify or fail a recorded analysis; segregation of duties enforced; cascades to delivery"
    roles: [QualityCertifier]
    code: 200
    input: [decision]
    output: QualityCertificate
    side_effects: ["result -> CERTIFIED|FAILED", "delivery -> COMPLETED|REJECTED", "FAILED also auto-creates REDELIVERY delivery"]

  # --- Turnaround ---
  - method: POST
    path: "/gas-supply/onsite-plants/{id}/turnarounds"
    description: "Propose a maintenance turnaround window for an OPERATING plant"
    roles: [PlantOperator]
    code: 201
    input: [window_start, window_end, scope]
    output: Turnaround
    side_effects: ["status PROPOSED", "proposal_round = 1"]
  - method: GET
    path: "/gas-supply/onsite-plants/{id}/turnarounds"
    description: "List a plant's turnarounds"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: Turnaround[]
    side_effects: []
  - method: POST
    path: "/gas-supply/turnarounds/{turnaroundId}/respond"
    description: "Customer AGREEs or COUNTERs the proposed window; OCC-guarded; COUNTER replaces the window and increments proposal_round"
    roles: [CustomerOps]
    code: 200
    input: [decision, expected_turnaround_version, "counter_window_start?", "counter_window_end?"]
    output: Turnaround
    side_effects: ["AGREE -> AGREED", "COUNTER -> PROPOSED with new window and proposal_round+1", "increments Turnaround.version by 1"]
  - method: POST
    path: "/gas-supply/turnarounds/{turnaroundId}/schedule"
    description: "Schedule an AGREED turnaround after overlap, blackout and contract-state gates"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/gas-supply/turnarounds/{turnaroundId}/start"
    description: "Start a SCHEDULED turnaround at or after window_start; triggers the failover cascade"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Turnaround
    side_effects: ["status -> IN_PROGRESS", "plant -> TURNAROUND", "contract failover_active := true", "BACKUP deliveries auto-created", "stop_sequence recompute"]

  # --- SettlementStatement ---
  - method: POST
    path: "/gas-supply/supply-contracts/{id}/settlements"
    description: "Run a PROVISIONAL or FINAL take-or-pay settlement for a period; FINAL supersedes PROVISIONAL and mutates the makeup-credit bank"
    roles: [BillingSpecialist]
    code: 201
    input: [period_month, variant, "metered_volume_nm3?", "projected_volume_nm3?", "power_index_actual?", "apply_makeup_cents?"]
    output: SettlementStatement
    side_effects: ["all computed money fields per settlement_invoice", "FINAL updates contract makeup_credit_balance_cents and increments SupplyContract.version by 1", "FINAL supersedes prior PROVISIONAL for the period"]
  - method: GET
    path: "/gas-supply/supply-contracts/{id}/settlements"
    description: "List a contract's settlement statements"
    roles: [PlatformAdmin, SupplyPlanner, CustomerOps, PlantOperator, PipelineDispatcher, TelemetryGateway, QualityAnalyst, QualityCertifier, BillingSpecialist]
    code: 200
    input: []
    output: SettlementStatement[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or CustomerOps ownership check failed" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum/value, demand_peak < demand_avg, tank reorder_point <= safety_stock, apply_makeup_cents on PROVISIONAL" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "SupplyModeEvaluation id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "SupplyContract id does not exist" }
  - { id: ERR_PLANT_NOT_FOUND, http: 404, condition: "OnsitePlant id does not exist" }
  - { id: ERR_NETWORK_NOT_FOUND, http: 404, condition: "PipelineNetwork id does not exist" }
  - { id: ERR_CONNECTION_NOT_FOUND, http: 404, condition: "PipelineConnection id does not exist" }
  - { id: ERR_TANK_NOT_FOUND, http: 404, condition: "StorageTank id does not exist" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "Delivery id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "QualityCertificate id does not exist" }
  - { id: ERR_TURNAROUND_NOT_FOUND, http: 404, condition: "Turnaround id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_EVALUATION_NOT_ACCEPTED, http: 409, condition: "Contract create/activate while its evaluation is not ACCEPTED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE (or, for settlements, ACTIVE|RENEWAL_OPEN) contract" }
  - { id: ERR_PLANT_NOT_OPERATING, http: 409, condition: "Turnaround proposed for a plant not in OPERATING" }
  - { id: ERR_DELIVERY_NOT_DELIVERED, http: 409, condition: "Certificate recorded for a delivery not yet DELIVERED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Certifier X-User-ID equals the recording analyst_user_id" }
  - { id: ERR_RESULT_INCONSISTENT, http: 422, condition: "decision=CERTIFIED but measured purity/impurity violates the delivery's specification snapshot" }
  - { id: ERR_DELIVERY_OVERFILL, http: 422, condition: "delivered_quantity_liters outside [1, tank headroom]" }
  - { id: ERR_WINDOW_DURATION_INVALID, http: 422, condition: "Window end <= start or duration outside [24h, 720h]" }
  - { id: ERR_TURNAROUND_OVERLAP, http: 409, condition: "Half-open overlap with an existing SCHEDULED/IN_PROGRESS turnaround on the same plant" }
  - { id: ERR_TURNAROUND_IN_BLACKOUT, http: 422, condition: "Window shares an instant with a customer blackout window" }
  - { id: ERR_TURNAROUND_NOT_DUE, http: 422, condition: "start attempted before window_start" }
  - { id: ERR_READING_OUT_OF_ORDER, http: 422, condition: "Telemetry measured_at not strictly after the latest reading, or level outside [0, capacity]" }
  - { id: ERR_PERIOD_OUT_OF_TERM, http: 422, condition: "Settlement period outside the contract term" }
  - { id: ERR_PIPELINE_CAPACITY_EXCEEDED, http: 409, condition: "reserved_flow_nm3h exceeds network available capacity" }
  - { id: ERR_PIPELINE_CONNECTION_REQUIRED, http: 409, condition: "PIPELINE-mode activation without an ACTIVE PRIMARY connection" }
  - { id: ERR_MODE_MISMATCH, http: 422, condition: "Purpose/mode mismatch: PRIMARY needs PIPELINE contract, BACKUP needs ONSITE_PLANT contract, plant needs ONSITE_PLANT contract" }
  - { id: ERR_MIN_VOLUME_BELOW_FLOOR, http: 422, condition: "min_monthly_volume_nm3 below the mode's activation floor" }
  - { id: ERR_DUPLICATE_SETTLEMENT, http: 409, condition: "Settlement creation rules for (contract, period) violated" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "A certificate already exists for the delivery" }
  - { id: ERR_PLANT_ALREADY_EXISTS, http: 409, condition: "A non-DECOMMISSIONED plant already exists for the contract" }
  - { id: ERR_CUSTOMER_CREDIT_WATCH, http: 422, condition: "Activation blocked by customer credit_standing == WATCH" }
  - { id: ERR_MAKEUP_CREDIT_EXCEEDED, http: 422, condition: "apply_makeup_cents exceeds min(pre-grant bank balance, subtotal)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Gas supplier platform administrator; owns customers, networks, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /gas-supply/customers", "POST /gas-supply/pipeline-networks"]
    shared_operations: ["all GET endpoints"]
  - name: SupplyPlanner
    description: "Supplier commercial planner; owns mode evaluations and the contract lifecycle"
    identity: opaque
    exclusive_operations: ["POST /gas-supply/supply-mode-evaluations", "POST /gas-supply/supply-contracts", "POST /gas-supply/supply-contracts/{id}/activate", "POST /gas-supply/supply-contracts/{id}/amendments", "POST /gas-supply/supply-contracts/{id}/terminate"]
    shared_operations: ["all GET endpoints"]
  - name: CustomerOps
    description: "Customer-side operations user; accepts evaluations and negotiates turnaround windows for their own sites"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /gas-supply/supply-mode-evaluations/{id}/accept", "POST /gas-supply/turnarounds/{id}/respond"]
    shared_operations: ["all GET endpoints"]
  - name: PlantOperator
    description: "Supplier plant operations; builds plants, manages tanks and turnarounds"
    identity: opaque
    exclusive_operations: ["POST /gas-supply/onsite-plants", "POST /gas-supply/onsite-plants/{id}/advance", "POST /gas-supply/storage-tanks", "POST /gas-supply/onsite-plants/{id}/turnarounds", "POST /gas-supply/turnarounds/{id}/schedule", "POST /gas-supply/turnarounds/{id}/start"]
    shared_operations: ["all GET endpoints"]
  - name: PipelineDispatcher
    description: "Pipeline and logistics dispatcher; reserves capacity and confirms deliveries"
    identity: opaque
    exclusive_operations: ["POST /gas-supply/pipeline-connections", "POST /gas-supply/pipeline-connections/{id}/release", "POST /gas-supply/deliveries/{id}/confirm-delivery"]
    shared_operations: ["all GET endpoints"]
  - name: TelemetryGateway
    description: "Automated tank telemetry ingestion gateway"
    identity: opaque
    exclusive_operations: ["POST /gas-supply/storage-tanks/{id}/telemetry"]
    shared_operations: ["all GET endpoints"]
  - name: QualityAnalyst
    description: "Lab analyst; records analytical results. Segregated from certification."
    identity: opaque
    exclusive_operations: ["POST /gas-supply/deliveries/{id}/quality-certificates"]
    shared_operations: ["all GET endpoints"]
  - name: QualityCertifier
    description: "Lab certifier; certifies or fails recorded results. Must never certify own recordings."
    identity: opaque
    exclusive_operations: ["POST /gas-supply/quality-certificates/{id}/certify"]
    shared_operations: ["all GET endpoints"]
  - name: BillingSpecialist
    description: "Settlement accountant; runs provisional and final take-or-pay settlements"
    identity: opaque
    exclusive_operations: ["POST /gas-supply/supply-contracts/{id}/settlements"]
    shared_operations: ["all GET endpoints"]
