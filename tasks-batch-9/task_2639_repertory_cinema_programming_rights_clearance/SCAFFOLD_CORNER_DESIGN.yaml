  # ==========================================================================
  - section: endpoints
    instances:

      - name: distributor_create_then_read_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /distributors]
          - endpoints[GET /distributors/{id}]
          - entities.Distributor
        distinguishing_aspect: |
          Distributor is the plainest write-then-read pair in the surface and the one every booking depends
          on, so the round trip has to preserve the negotiating defaults byte for byte - including the boolean
          false and the fractional share. It fails if requires_advance_guarantee is coerced or if
          default_distributor_share_pct is stored as an integer.
        test_recipe:
          setup:
            - "No prior state is required; the distributor is a root entity with no parent."
            - "The create is issued by Programmer and the read-back by a different role, ExecutiveDirector, both of which §1.5 permits."
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: ExecutiveDirector
          assert:
            - "The create returns 201 and the read returns 200 with the same id."
            - "Distributor.${d_id}.name == 'Coyote Films' and contact_email == 'book@coyote.example'."
            - "Distributor.${d_id}.default_terms_variant == SLIDING_SCALE_90_10 and default_min_run_days == 4."
            - "Distributor.${d_id}.default_distributor_share_pct == 0.35, not 0 and not 35."
            - "Distributor.${d_id}.requires_advance_guarantee == false, preserved rather than defaulted to true."
            - "Distributor.${d_id}.version == 1 and created_at == updated_at."
            - "The read response carries the full envelope with data holding the object, not a bare object."

      - name: request_changes_action_moves_the_clearance_and_records_the_note
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /clearances/{id}/request-changes]
          - state_machines.RightsClearance[SUBMITTED -> CHANGES_REQUESTED]
          - entities.RightsClearance.change_request_note
        distinguishing_aspect: |
          A pure action endpoint: the only legal source state is SUBMITTED, the posted note is the one field
          it writes, and the licence must NOT become usable as a side effect. It fails if the note is dropped, or
          if the row is left in a state that lets a showtime be scheduled against it.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking."
            - "A clearance was lodged by RightsManager u-rm-1, so it sits at SUBMITTED with change_request_note null."
            - "The clearance has never been cleared, so screenings_used is 0."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clearances/${c_id}/request-changes"
              payload: { change_request_note: "Territory must exclude US-NY-BROOKLYN" }
              as: ExecutiveDirector
          assert:
            - "The response status is 200 and RightsClearance.${c_id}.status == CHANGES_REQUESTED."
            - "RightsClearance.${c_id}.change_request_note == 'Territory must exclude US-NY-BROOKLYN'."
            - "RightsClearance.${c_id}.cleared_by_user_id is null and cleared_at is null - requesting changes is not a clearance."
            - "RightsClearance.${c_id}.submitted_by_user_id is still u-rm-1."
            - "RightsClearance.${c_id}.screenings_used == 0 and screenings_remaining == 6."
            - "RightsClearance.${c_id}.version == 2 - exactly one write occurred."

      - name: membership_sweep_lapses_only_the_expired_member
        claim_type: bulk_action
        grounds:
          - endpoints[POST /membership-sweeps]
          - state_machines.Member[ACTIVE -> LAPSED]
          - constants.MEMBERSHIP_TERM_DAYS
          - constants.ROLLING_WINDOW_DAYS
        distinguishing_aspect: |
          The sweep is a skip-not-fail bulk action: it must walk every ACTIVE member, lapse exactly those
          whose expires_at is strictly before the clock, and leave the rest untouched rather than aborting or
          lapsing the cohort. The two members straddle the sweep instant by construction, so a sweep that
          lapses both - or neither - is wrong.
        test_recipe:
          setup:
            - "Member Ada Wells donated 20000 cents on 2026-03-01T10:00:00Z, so she is ACTIVE with expires_at 2027-03-01T10:00:00.000Z."
            - "Member Bo Lin donated 8000 cents on 2026-07-15T10:00:00Z, so he is ACTIVE with expires_at 2027-07-15T10:00:00.000Z."
            - "The logical clock is then moved to 2027-04-01T00:00:00Z, which is after Ada's expiry and before Bo's."
            - "At that instant Ada's donation is outside the 365-day rolling window (2026-04-01 onward) while Bo's is inside it."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/donations"
              payload: { amount_cents: 20000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /members"
              payload: { full_name: "Bo Lin", email: "bo@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m2_id}/donations"
              payload: { amount_cents: 8000, received_at: "2026-07-15T10:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: ExecutiveDirector
          trigger:
            - call: "POST /membership-sweeps"
              payload: {}
              as: ExecutiveDirector
          assert:
            - "The response status is 200 with swept_count == 1, lapsed_member_ids == ['${m1_id}'] and evaluated_at == 2027-04-01T00:00:00.000Z."
            - "Member.${m1_id}.status == LAPSED and Member.${m2_id}.status == ACTIVE - the sweep skipped rather than failed on the non-qualifying row."
            - "Member.${m1_id}.rolling_donation_cents == 0 after the sweep recomputation, because the 2026-03-01 donation fell out of the rolling window."
            - "Member.${m1_id}.expires_at is still 2027-03-01T10:00:00.000Z - lapsing records the fact, it does not rewrite history."
            - "Member.${m1_id}.credit_balance_cents == 0 is retained and not zeroed; discount_pct == 0.00 and advance_access_hours == 0."
            - "Member.${m2_id}.rolling_donation_cents == 8000 and version is unchanged, proving the untouched row was not rewritten."
            - "A second identical sweep returns swept_count == 0 and lapsed_member_ids == []."

      - name: special_event_links_to_its_showtime_without_extending_the_block
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /special-events]
          - state_machines.SpecialEvent[(none) -> PLANNED]
          - entities.SpecialEvent.showtime_id
          - entities.Showtime.extra_minutes
        distinguishing_aspect: |
          Creating the link and applying its consequence are deliberately separate: the event must attach to
          a SCHEDULED showtime and store its own extra_minutes and surcharge_cents while the showtime's own
          extra_minutes stays 0 until confirmation. It fails if creation eagerly extends the block, which would
          displace neighbours before anyone approved the event.
