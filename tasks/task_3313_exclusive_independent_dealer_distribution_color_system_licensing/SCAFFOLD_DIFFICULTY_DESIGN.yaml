  - rule_id: resource_temporal_overlap
    instances:

      - name: channel_event_overlap_supersede_semantics
        grounds:
          - state_machines.DealerChannelEvent.CONFIRMED_to_SUPERSEDED
          - calculations.bigbox_share_pct
        distinguishing_aspect: |
          Interval semantics A (supersede-on-overlap): posting a new
          INDEPENDENT event whose period overlaps an existing CONFIRMED event
          for the same dealer+channel SUPERSEDES the old one — the old 10000
          cents leaves the denominator and the recomputed share jumps.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. ACTIVE dealer (fully onboarded) with one CONFIRMED INDEPENDENT event covering [2026-01-01, 2026-02-01) of 10000 cents and one CONFIRMED BIGBOX event covering [2026-01-01, 2026-02-01) of 1000 cents (posted while posture was INDEPENDENT_ONLY; share 9.09 < threshold 15/2 is false... share 9.09 > 7.5 -> OVERRIDE_REQUIRED, still postable)."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
